# Policy: quotas - usage-limit authorization data (ADR-0511, roadmap WP-54).
#
# This file is the authoritative, GitOps-managed declaration of HOW MUCH the
# platform lets an identity consume - the third policy file beside
# policies/tools/tool-policy.yaml (ADR-0011) and
# policies/knowledge/knowledge-policy.yaml (ADR-0203). Quota is availability
# protection layered ON TOP of the five-factor authorization intersection:
# exceeding a limit produces an explicit, audited quota error and NEVER
# bypasses or relaxes that intersection (ADR-0511 Security considerations).
#
# Enforcement is GENERATED from this file, never hand-authored per agent
# (ADR-0511 clause 3):
#   - request-per-window limits -> Kuadrant resources (Limitador counters,
#     Authorino-extracted identity context) via
#     platform/okf/generate_quota_enforcement.py;
#   - token budgets -> AI Gateway configuration (only the inference layer
#     can meter tokens - ADR-0029 already tracks per-request usage there).
# Identity dimensions come only from validated tokens (ADR-0033) - user =
# JWT `sub`, group = business-role `groups` claim (ADR-0040) - or, for the
# project dimension, from the conversation's own ADR-0527 project row after
# agent-runtime has verified the caller holds a grant on it; never from
# client-supplied headers.
#
# ADR-0528 re-keyed that project dimension. It used to be the
# Salesforce-verified binding of ADR-0512, which meant only Salesforce-backed
# work could carry a project at all, and the X-Zuno-Project-Id header had to
# be gated on the task's own `project_required` mark because the id was
# otherwise a client assertion. It is now the ZUNO project id - a
# server-minted UUID - and every project draws project quota, customer
# (Salesforce-linked) or free. The guarantee is stronger, not weaker: the id
# is resolved from the database against the caller's grants rather than
# vouched for by a frontmatter mark. The Salesforce opportunity id is never
# emitted in a header or a span.
#
# Precedence (ADR-0511 clause 2): when a conversation belongs to a project,
# usage draws down the PROJECT's quota first; the USER's personal quota
# applies once the project's is exhausted (or absent); the GROUP quota is the
# outermost ceiling. Outside project context: user, then group. Exhaustion at
# every applicable level fails the request with an explicit quota error -
# never silent degradation.
#
# Schema:
#   classes.<name>:            a named quota class bundling limits. Tasks opt
#                              in via frontmatter `zuno.quota_class` (absent =
#                              `standard`).
#     fail_mode:               open | closed - behavior when the enforcement
#                              backend (Limitador / budget store) is
#                              unreachable. ADR-0511 default is CLOSED;
#                              `open` must be an explicit, per-class,
#                              reviewed choice.
#     requests.<dimension>:    {limit: <int>, window: <Nunit>} - request
#                              count per rolling window. Dimensions: user,
#                              group, project.
#     tokens.<dimension>:      {budget: <int>, window: <Nunit>} - total
#                              LLM tokens (prompt+completion, as metered by
#                              AI Gateway per ADR-0029) per rolling window.
#   precedence:                the draw-down orders stated above, encoded so
#                              consumers never hardcode them.
#   project_binding.validity_window: how long a PROJECT's Salesforce link
#                              stays trusted before re-verification
#                              (ADR-0528, re-keying ADR-0512 clause 3 off
#                              the conversation and onto the project - see
#                              the block's own comment below).
#   Windows parse as ^[0-9]+(s|m|h|d)$ (validated by
#   platform/okf/validate_quota_policy.py, a blocking lint step).

classes:
  standard:
    description: >-
      Default interactive chat usage. Every task without an explicit
      zuno.quota_class runs here. fail_mode open is a deliberate, reviewed
      exception to the ADR-0511 fail-closed default: a Limitador outage
      must not take interactive chat down with it - the trade is recorded
      in ADR-0511's Security considerations and revisited if abuse is ever
      observed.
    fail_mode: open
    requests:
      user:    { limit: 60,   window: 5m }
      group:   { limit: 600,  window: 5m }
      project: { limit: 300,  window: 5m }
    tokens:
      # Raised 2026-09-02: a live day2-stresstest run against Tekos (the one
      # fully live agent) was measured via Prometheus
      # (sum by (outcome) (increase(zuno_model_tokens_total{agent="tekos"}[3h])))
      # to consume ~1,218,231 tokens for ONE test persona in under 2h - 6x
      # the prior 200000 ceiling, and well above `intensive`'s 500000 too.
      # These personas are the SAME accounts used for live human demos
      # (evaluations/tekos/run_scenarios.py's own comment on
      # cleanup_created_runs), not dedicated test-only identities, so this
      # is a genuine per-user daily ceiling, not just a stresstest knob.
      # New values keep the prior 1 : 10 : 5 (user : group : project) ratio,
      # sized with ~2.5x headroom over the observed run.
      user:    { budget: 3000000,   window: 24h }
      group:   { budget: 30000000,  window: 24h }
      project: { budget: 15000000,  window: 24h }

  intensive:
    description: >-
      Long-running / batch-shaped tasks (report generation, multi-document
      drafting). Higher token ceilings, lower request rates, and strictly
      fail-closed: if enforcement cannot be consulted, an intensive task
      does not run.
    fail_mode: closed
    requests:
      user:    { limit: 10,  window: 5m }
      group:   { limit: 60,  window: 5m }
      project: { limit: 30,  window: 5m }
    tokens:
      user:    { budget: 500000,   window: 24h }
      group:   { budget: 5000000,  window: 24h }
      project: { budget: 2500000,  window: 24h }

precedence:
  in_project_context: [project, user, group]
  default: [user, group]

project_binding:
  # ADR-0528 (re-keying ADR-0512 clause 3): how long a project's Salesforce
  # link stays trusted before re-verification. Now scoped per PROJECT rather
  # than per conversation - verification happens when an admin sets the link,
  # and again on the project once the stamp ages out, so an ordinary chat
  # turn inside a fresh customer project makes no Salesforce call at all.
  # Only `project_required` tasks are gated on it; a free project has no
  # link and no window to age.
  validity_window: 24h
