# ADR-0303 (WP-39): per-agent/task adapter declarations for the AI
# Gateway's per-request dynamic adapter selection
# (components/ai-gateway/app/model_routing_policy.py). Mechanism only -
# WHICH requests get an approved adapter, never WHICH adapter is best
# (ADR-0304/WP-40's job, which extends this same file with objectives
# blocks rather than a second file - see that WP's own brief).
#
# An `adapter:` name here must already be a real
# gitops/charts/models/values.yaml `loraAdapters[].name` entry (WP-34B) -
# this file references, never invents, adapter names. Empty by default,
# same as `loraAdapters: []` itself: WP-34's GPU training run hasn't
# produced a real registered adapter yet (cluster GPU capacity is fully
# committed - see MEMORY.md), so activating an entry here before one
# exists would route real requests to a model vLLM doesn't actually serve.
# Uncomment/adapt the example below once a real adapter is registered.
#
# classification is documentation/review metadata, not an enforcement
# input: the AI Gateway's actual security guard (a C2/C3 adapter must
# never reach an externally-eligible serving path) is structural -
# app/providers.py only ever applies an adapter to a `candidate.kind ==
# "local"` candidate, regardless of what this field says, since vLLM
# multi-LoRA request-level selection is a local-runtime-only mechanism to
# begin with (no SaaS provider has any concept of "our" adapter module).
adapters: []
# - agent: comage
#   task: check-deal-status
#   adapter: comage-lora
#   classification: C2

# ADR-0412: per-(agent,task) PROVIDER PREFERENCE - an ordered list of
# provider-routing.yaml provider names moved to the FRONT of the
# candidate chain for that agent/task pair. Semantics (enforced by
# components/ai-gateway/app/routing.py's _apply_preference):
#   - applied AFTER classification eligibility + local-only filtering
#     (ADR-0021/0035): a pure reorder of the surviving candidates, it can
#     never resurrect a provider those hard constraints removed;
#   - unlisted survivors follow in provider-routing.yaml order;
#   - unknown provider names are warned about and ignored (the two files
#     have independent lifecycles - this one is baked into the gateway
#     image, provider-routing.yaml is a ConfigMap);
#   - no entry for an (agent, task) = today's order, unchanged;
#   - never auto-tunable (ADR-0309: `prefer` is on the optimizer's
#     code-level denylist).
#
# The entries below implement the 2026-08-18 decision: reasoning-heavy
# ("reflexional") tasks prefer the local gpt-oss-20b over qwen - it leads
# the WHOLE chain (also ahead of SaaS on C1/C2 turns, consistent with the
# platform's local-first doctrine), and on C3/local-only turns it makes
# gpt-oss the primary with qwen as fallback. Task-content rationale lives
# in the per-row comments; simple lookup/listing/transactional tasks are
# deliberately absent (qwen stays their first candidate).
preferences:
  # Multi-doc synthesis with citations (tekos's primary task).
  # ADR-0419: local models still lead (unchanged doctrine - reasoning-heavy
  # answer-technical-question keeps gpt-oss first per this file's own
  # header comment, the two simple lookup tasks below keep qwen first,
  # same as their pre-existing implicit default), then OVHcloud ahead of
  # openai/gemini/anthropic (their own relative order unchanged), then
  # mistral. mistral-codestral is deliberately left unlisted - a
  # code-specialized model has no place being preferred for general Q&A/
  # lookup, but stays reachable at the very end rather than excluded.
  - agent: tekos
    task: answer-technical-question
    preferred: [local-gpt-oss, local, ovhcloud-gpt-oss-120b]
    fallback: [openai, gemini, anthropic, mistral]
  - agent: tekos
    task: find-relevant-docs
    preferred: [local, local-gpt-oss, ovhcloud-gpt-oss-120b]
    fallback: [openai, gemini, anthropic, mistral]
  - agent: tekos
    task: check-my-drive-docs
    preferred: [local, local-gpt-oss, ovhcloud-gpt-oss-120b]
    fallback: [openai, gemini, anthropic, mistral]
  # Plan->draft->reflect->write document workflow; C3 by agent seed - the
  # flagship local-only reflexional case. draft_node's own call is always
  # C3 (effective_classification starts from the agent's C3 seed and only
  # ever escalates, ADR-0034) so ovhcloud-gpt-oss-120b never applies
  # there; this entry's practical effect (ADR-0416) is scoped to
  # reflect_node's explicit fixed-C2-ceiling call, which shares this same
  # (agent, task) preference key.
  - agent: arkos
    task: draft-architecture-testimonial
    prefer: [ovhcloud-gpt-oss-120b, local-gpt-oss, local]
  # ADR-0514: workshop-presentation shares draft-architecture-
  # testimonial's exact reasoning - same plan/retrieve/draft/reflect/write
  # shape, same C3 agent seed, same reflect-slot C2 ceiling that's what
  # actually makes ovhcloud-gpt-oss-120b reachable at this preference.
  - agent: arkos
    task: workshop-presentation
    prefer: [ovhcloud-gpt-oss-120b, local-gpt-oss, local]
  # Multi-year comparison/analysis over C3 sxa-legacy data.
  - agent: comage
    task: compare-historical-deals
    prefer: [local-gpt-oss, local]
  # Project/bid synthesis.
  - agent: advantage
    task: answer-project-question
    prefer: [local-gpt-oss, local]
  # Detection + judgment over adv knowledge (PO within 3 rolling days).
  - agent: advantage
    task: identify-new-business-with-po
    prefer: [local-gpt-oss, local]
  # Margin analysis by state/customer/technology.
  - agent: advantage
    task: monthly-sales-report
    prefer: [local-gpt-oss, local]
  # Invoice-readiness evaluation over sxa financial data (C3-intended).
  - agent: finage
    task: identify-business-ready-to-invoice
    prefer: [local-gpt-oss, local]
  # Aggregation report over sxa financial data (C3-intended).
  - agent: finage
    task: monthly-invoice-report
    prefer: [local-gpt-oss, local]
  # Board-level strategic/financial work, C3 agent seed - forward-declared
  # (cognos is a placeholder with no runtime route yet; inert until then).
  # ADR-0416: ovhcloud-gpt-oss-120b leads the chain for turns that compute
  # at C1/C2 (reflection-heavy board Q&A that doesn't touch C3 material) -
  # eligible_for: [C1, C2] on that provider means a turn that escalates to
  # C3 excludes it automatically (ADR-0021/0035, no extra logic needed
  # here) and falls through to local-gpt-oss/local exactly as before.
  - agent: cognos
    task: coming-soon
    prefer: [ovhcloud-gpt-oss-120b, local-gpt-oss, local]

  # ADR-0417: coding requests. Arkos's write-code call is a scoped,
  # early-exit branch of an otherwise C3-seeded agent (evaluated at a
  # fixed C2 ceiling in code, mirroring reflect_node's ADR-0416 override).
  # strict: true means mistral-codestral is the ONLY candidate; if it
  # fails for any reason (including running out of credits), the turn
  # fails explicitly (RoutingError/502) rather than silently falling back
  # to a different model the user didn't ask for.
  - agent: arkos
    task: write-code
    prefer: [mistral-codestral]
    strict: true
  # Tekos is C1-seeded, so mistral-codestral (eligible_for: [C1, C2]) is
  # already reachable at its natural classification with no override - no
  # strict flag: the existing generic fallback-on-any-exception in
  # app/main.py's _invoke_with_fallback (unchanged) naturally drops to
  # local if Codestral errors, giving "use local also for coding" for
  # free from already-live machinery.
  - agent: tekos
    task: write-code
    prefer: [mistral-codestral, local-gpt-oss, local]

# ADR-0304 (WP-40 Part B): per (agent, task) "task class" quality/cost/
# latency objectives, consumed by evaluations/routing_report.py alongside
# live ai-gateway metrics (ADR-0029) and evaluations/benchmarks/*.json
# artifacts (ADR-0305) to emit a RECOMMENDED policy diff - a report file,
# never a write to this policy. Applying a recommendation is a normal
# reviewed GitOps change to the `adapters:` list above; nothing in this
# repo writes here automatically (that is ADR-0309/WP-42's separately
# governed, explicitly-enabled scope, not this WP's).
#
# quality_floor: minimum acceptable quality signal in [0, 1] - the same
#   scale evaluations/quality_gate.py's own scenario_rate already uses,
#   so a benchmark artifact's agent_gates[task].scenario_rate is directly
#   comparable without a unit conversion.
# cost_ceiling_usd_per_1k: maximum acceptable USD per 1,000 total tokens
#   (matches components/ai-gateway/app/telemetry.py's own
#   zuno.model_cost_usd metric convention).
# latency_target_ms_p95: maximum acceptable P95 latency in milliseconds
#   (matches components/ai-gateway/app/telemetry.py's own zuno.latency_ms
#   span attribute).
objectives: []
# - agent: comage
#   task: check-deal-status
#   quality_floor: 0.75
#   cost_ceiling_usd_per_1k: 0.01
#   latency_target_ms_p95: 2000
