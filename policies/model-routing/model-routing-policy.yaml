# ADR-0303 (WP-39): per-agent/task adapter declarations for the AI
# Gateway's per-request dynamic adapter selection
# (components/ai-gateway/app/model_routing_policy.py). Mechanism only -
# WHICH requests get an approved adapter, never WHICH adapter is best
# (ADR-0304/WP-40's job, which extends this same file with objectives
# blocks rather than a second file - see that WP's own brief).
#
# An `adapter:` name here must already be a real
# gitops/charts/models/values.yaml `loraAdapters[].name` entry (WP-34B) -
# this file references, never invents, adapter names. Empty by default,
# same as `loraAdapters: []` itself: WP-34's GPU training run hasn't
# produced a real registered adapter yet (cluster GPU capacity is fully
# committed - see MEMORY.md), so activating an entry here before one
# exists would route real requests to a model vLLM doesn't actually serve.
# Uncomment/adapt the example below once a real adapter is registered.
#
# classification is documentation/review metadata, not an enforcement
# input: the AI Gateway's actual security guard (a C2/C3 adapter must
# never reach an externally-eligible serving path) is structural -
# app/providers.py only ever applies an adapter to a `candidate.kind ==
# "local"` candidate, regardless of what this field says, since vLLM
# multi-LoRA request-level selection is a local-runtime-only mechanism to
# begin with (no SaaS provider has any concept of "our" adapter module).
adapters: []
# - agent: comage
#   task: check-deal-status
#   adapter: comage-lora
#   classification: C2

# ADR-0412: per-(agent,task) PROVIDER PREFERENCE - an ordered list of
# provider-routing.yaml provider names moved to the FRONT of the
# candidate chain for that agent/task pair. Semantics (enforced by
# components/ai-gateway/app/routing.py's _apply_preference):
#   - applied AFTER classification eligibility + local-only filtering
#     (ADR-0021/0035): a pure reorder of the surviving candidates, it can
#     never resurrect a provider those hard constraints removed;
#   - unlisted survivors follow in provider-routing.yaml order;
#   - unknown provider names are warned about and ignored (the two files
#     have independent lifecycles - this one is baked into the gateway
#     image, provider-routing.yaml is a ConfigMap);
#   - no entry for an (agent, task) = today's order, unchanged;
#   - never auto-tunable (ADR-0309: `prefer` is on the optimizer's
#     code-level denylist).
#
# The entries below implement the decision that reasoning-heavy
# ("reflexional") tasks prefer the local gpt-oss-20b over qwen - it leads
# the WHOLE chain (also ahead of SaaS on C1/C2 turns, consistent with the
# platform's local-first doctrine), and on C3/local-only turns it makes
# gpt-oss the primary with qwen as fallback. Task-content rationale lives
# in the per-row comments; simple lookup/listing/transactional tasks are
# deliberately absent (qwen stays their first candidate).
#
# ADR-0531: qwen3.5-9b(-maas) (ADR-0526/WP-087's training base, live per
# WP-092) is now the fleet-wide default candidate - every (agent, task)
# below is explicit, no more implicit provider-routing.yaml file-order
# default. Reasoning-heavy/reflexional entries (Tekos's
# answer-technical-question, Comage's compare-historical-deals, both of
# Arkos's document-workflow tasks) keep gpt-oss-20b's existing rank ahead
# of qwen3.5-9b - this decision does not touch that doctrine, only extends
# who gets ovhcloud-gpt-oss-120b ahead of it (see those entries' own
# comments). Tekos/Comage additionally pair qwen3.5-9b with its own
# fine-tune (Tekos: qwen3.5-9b primary / qwen3.5-9b-wesh fallback; Comage:
# the reverse) since Comage is the fine-tune's own target agent (ADR-0526
# decision 1).
#
# ADR-0521 (WP-076): every entry naming `local-gpt-oss` lists
# `local-gpt-oss-maas` immediately before it, and every entry naming
# `local` lists `local-maas` immediately before it - NOT optional styling.
# _apply_preference's "unlisted survivors follow in provider-routing.yaml
# order" rule means an unlisted -maas sibling would land wherever the
# reordered tail happens to fall, not necessarily right after its direct
# peer - breaking "MaaS-preferred, same-model-direct-fallback" for
# exactly the tasks this file exists to reorder. (qwen's `local-maas` was
# held back a day by the MaaS empty-body bug, root-caused and fixed
# 2026-08-26 - see docs/roadmap/evidence/adr-0521-maas-local-traffic.md.)
# Note adapter-declared (agent, task) pairs never reach a -maas candidate
# regardless of this ordering: app/main.py skips via_maas candidates when
# an adapter declaration resolved (adapter ids can't traverse MaaS auth).
preferences:
  # Multi-doc synthesis with citations (tekos's primary task, reflexional).
  # ADR-0419: reasoning-heavy answer-technical-question keeps gpt-oss first
  # per this file's own header comment, then OVHcloud ahead of
  # openai/gemini/anthropic (their own relative order unchanged), then
  # mistral. mistral-codestral is deliberately left unlisted - a
  # code-specialized model has no place being preferred for general Q&A/
  # lookup, but stays reachable at the very end rather than excluded.
  #
  # ADR-0531: qwen3.5-9b(-maas) is inserted right after gpt-oss (the
  # reasoning doctrine's own leader is unchanged), ahead of the
  # qwen3.5-9b-wesh pair Tekos already carried second (ADR-0526/WP-087
  # decision 7) - Tekos's own default is the base model, wesh is its
  # fallback, both still trailing OVH/gpt-oss on this specific reflexional
  # task.
  - agent: tekos
    task: answer-technical-question
    preferred: [ovhcloud-gpt-oss-120b, local-gpt-oss-maas, local-gpt-oss, local-qwen35-maas, local-qwen35, local-wesh-maas, local-wesh, local-maas, local]
    fallback: [openai, gemini, anthropic, mistral]
  # Simple lookup/listing tasks - no reflexional override, so ADR-0531's
  # fleet default applies directly: qwen3.5-9b primary, qwen3.5-9b-wesh
  # fallback (Tekos's own pairing, ADR-0526 decision 7's insertion kept
  # right behind it), everything else unchanged further down the chain.
  - agent: tekos
    task: find-relevant-docs
    preferred: [local-qwen35-maas, local-qwen35, local-wesh-maas, local-wesh, local-maas, local, local-gpt-oss-maas, local-gpt-oss, ovhcloud-gpt-oss-120b]
    fallback: [openai, gemini, anthropic, mistral]
  - agent: tekos
    task: check-my-drive-docs
    preferred: [local-qwen35-maas, local-qwen35, local-wesh-maas, local-wesh, local-maas, local, local-gpt-oss-maas, local-gpt-oss, ovhcloud-gpt-oss-120b]
    fallback: [openai, gemini, anthropic, mistral]
  # ADR-0550 decisions 2-4: plan->draft->reflect->write document workflow,
  # classification now derived from the selected project (C1 with no
  # project) rather than a fixed agent seed - draft_node's and
  # reflect_node's calls both follow that same effective_classification
  # (app/graph/arkos_nodes.py). ovhcloud-gpt-oss-120b is globally eligible
  # for C1 AND C2 (provider-routing.yaml), which would otherwise let a
  # C2/C3 DAT turn still reach it here - `local_only_for` closes that gap
  # for this task specifically (ADR-0550 decision 3: C2/C3 DAT must never
  # externalize, even though other agents/tasks legitimately reach
  # ovhcloud-gpt-oss-120b at C2). See model_routing_policy.py's
  # local_only_for_classification docstring for the mechanism.
  - agent: arkos
    task: draft-architecture-testimonial
    prefer: [ovhcloud-gpt-oss-120b, local-gpt-oss-maas, local-gpt-oss, local-maas, local]
    local_only_for: [C2, C3]
  # ADR-0514: workshop-presentation is NOT in ADR-0550's scope and keeps
  # its original C3 agent seed and fixed reflect-slot C2 ceiling unchanged
  # (app/graph/arkos_nodes.py) - that's what actually makes
  # ovhcloud-gpt-oss-120b reachable at this preference for THIS task; no
  # `local_only_for` here.
  - agent: arkos
    task: workshop-presentation
    prefer: [ovhcloud-gpt-oss-120b, local-gpt-oss-maas, local-gpt-oss, local-maas, local]
  # 2026-09-03 correction to ADR-0531. Decision 1 states that every
  # declared (agent, task) pair carries an explicit entry - "no more
  # implicit provider-routing.yaml file-order default for any task" - but
  # decision 7 counted "all three of Arkos's declared tasks" where
  # agents/arkos/agent.okf.md declares FOUR. structure-demo was neither in
  # the ADR-0417 write-code carve-out nor the ADR-0416 reflexional one, so
  # it was the single task still falling through to file order, and two
  # other documents (agents/arkos/README.md, wp-31-arkos-slice.md) claimed
  # it rode the qwen3.5-9b fleet default instead. Only the generated
  # authorization matrix was right: it resolved to local-maas/local.
  #
  # This entry pins that resolved order EXACTLY as file order already
  # produces it, so live behaviour does not change - structure-demo keeps
  # answering on qwen3.6-27b-instruct. It is written rather than left
  # implicit for two reasons: it makes decision 1's invariant true (and
  # check_docs.py's model_roles check now enforces it), and it gives the
  # `quality` role its first explicit reference in this file, so "higher-
  # quality local model" names a routing fact rather than a label.
  #
  # Arkos is C3-seeded and ADR-0034's effective classification only ever
  # escalates, so this chain is always evaluated local-only; the SaaS
  # entries provider-routing.yaml declares after these are filtered out by
  # ADR-0021 before any preference is applied. Deliberately NOT migrated
  # to the qwen3.5-9b fleet default: that would be a behaviour change on a
  # task carrying a known unresolved 30s streaming timeout (WP-31), which
  # is its own investigation, not a side effect of a documentation fix.
  - agent: arkos
    task: structure-demo
    preferred: [local-maas, local]
    fallback: [local-gpt-oss-maas, local-gpt-oss, local-wesh-maas, local-wesh, local-qwen35-maas, local-qwen35]
  # ADR-0526 (WP-087) decision 7: Comage is the candidate agent, so the
  # qwen3.5-9b-wesh pair leads the chain on ALL FOUR of its declared
  # tasks. A preference is keyed by the (agent, task) tuple and an entry
  # without `task` is rejected outright (app/model_routing_policy.py's
  # own validation), so "the default for Comage" is expressible only as
  # one entry per task - there is no agent-level default to write.
  #
  # Multi-year comparison/analysis over C2 sxa-legacy data (reclassified
  # C3 -> C2 by ADR-0206's 2026-08-30 Status update) - reflexional, same
  # doctrine as Tekos's answer-technical-question. This is the task
  # ADR-0526's Security considerations single out: it escalates to C2
  # whenever knowledge.sxa-legacy contributes (ADR-0034), so the variant
  # answers C2 turns by default. That is legitimate for a local provider,
  # and it is exactly why the substance half of the promotion gate stays
  # mandatory (decision 8) - a style model that degrades reasoning on
  # financial and legacy data is a security-relevant regression, not a
  # cosmetic one. This preference list deliberately stays local/OVH-only -
  # C2 makes restricted SaaS technically eligible but no SaaS entry is
  # added here. ADR-0531: ovhcloud-gpt-oss-120b now leads here too (same
  # eligibility-filtering mechanism as Arkos's reflect_node - survives at
  # C1/C2, excluded at C3, where wesh/qwen3.5-9b naturally take over),
  # gpt-oss-20b keeps its existing rank right behind it; qwen3.5-9b is
  # inserted after wesh (Comage's own fine-tune stays this task's local
  # default, unchanged from ADR-0526).
  - agent: comage
    task: compare-historical-deals
    preferred: [ovhcloud-gpt-oss-120b, local-gpt-oss-maas, local-gpt-oss, local-wesh-maas, local-wesh, local-qwen35-maas, local-qwen35, local-maas, local]
  # Opportunity lookup by name/stage - a simple transactional read, and a
  # tool-calling turn: the variant's serving runtime must therefore keep
  # a tool-call parser configured (gitops/charts/models), or tool use
  # breaks silently for this task. ADR-0531: qwen3.5-9b inserted right
  # after the wesh pair (Comage's declared default: wesh primary,
  # qwen3.5-9b fallback), no reflexional override on this task.
  - agent: comage
    task: check-deal-status
    preferred: [local-wesh-maas, local-wesh, local-qwen35-maas, local-qwen35, local-maas, local, local-gpt-oss-maas, local-gpt-oss]
  # Opportunity stage write-back.
  - agent: comage
    task: update-opportunity-status
    preferred: [local-wesh-maas, local-wesh, local-qwen35-maas, local-qwen35, local-maas, local, local-gpt-oss-maas, local-gpt-oss]
  # Drive/mail lookup over the user's own material - also tool-calling.
  - agent: comage
    task: check-my-drive-and-mail
    preferred: [local-wesh-maas, local-wesh, local-qwen35-maas, local-qwen35, local-maas, local, local-gpt-oss-maas, local-gpt-oss]
  # ADR-0531: Advantage/Finage's tasks are analysis/judgment work, but the
  # user confirmed these are NOT protected reflexional overrides the way
  # Arkos/Tekos/Comage's reflect-slot tasks are - qwen3.5-9b becomes the
  # new lead, gpt-oss-20b is demoted to a fallback rather than removed.
  # Project/bid synthesis.
  - agent: advantage
    task: answer-project-question
    preferred: [local-qwen35-maas, local-qwen35, local-gpt-oss-maas, local-gpt-oss, local-maas, local]
  # Detection + judgment over adv knowledge (PO within 3 rolling days).
  - agent: advantage
    task: identify-new-business-with-po
    preferred: [local-qwen35-maas, local-qwen35, local-gpt-oss-maas, local-gpt-oss, local-maas, local]
  # Margin analysis by state/customer/technology.
  - agent: advantage
    task: monthly-sales-report
    preferred: [local-qwen35-maas, local-qwen35, local-gpt-oss-maas, local-gpt-oss, local-maas, local]
  # ADR-0531: no prior entry (rode provider-routing.yaml's implicit file
  # order) - now explicit, same fleet default as this agent's other tasks.
  - agent: advantage
    task: check-my-drive-and-mail
    preferred: [local-qwen35-maas, local-qwen35, local-gpt-oss-maas, local-gpt-oss, local-maas, local]
  # Invoice-readiness evaluation over sxa financial data (C2-intended -
  # reclassified C3 -> C2 by ADR-0206's 2026-08-30 Status update; this
  # preference list deliberately stays local/OVH-only, no SaaS entry added).
  - agent: finage
    task: identify-business-ready-to-invoice
    preferred: [local-qwen35-maas, local-qwen35, local-gpt-oss-maas, local-gpt-oss, local-maas, local]
  # Aggregation report over sxa financial data (C2-intended, same
  # reclassification as above).
  - agent: finage
    task: monthly-invoice-report
    preferred: [local-qwen35-maas, local-qwen35, local-gpt-oss-maas, local-gpt-oss, local-maas, local]
  # ADR-0531: no prior entry - now explicit, same fleet default.
  - agent: finage
    task: answer-finance-question
    preferred: [local-qwen35-maas, local-qwen35, local-gpt-oss-maas, local-gpt-oss, local-maas, local]
  - agent: finage
    task: check-my-drive-and-mail
    preferred: [local-qwen35-maas, local-qwen35, local-gpt-oss-maas, local-gpt-oss, local-maas, local]
  # Board-level strategic/financial work, C3 agent seed - forward-declared
  # (cognos is a placeholder with no runtime route yet; inert until then).
  # ADR-0416: ovhcloud-gpt-oss-120b leads the chain for turns that compute
  # at C1/C2 (reflection-heavy board Q&A that doesn't touch C3 material) -
  # eligible_for: [C1, C2] on that provider means a turn that escalates to
  # C3 excludes it automatically (ADR-0021/0035, no extra logic needed
  # here) and falls through to local-gpt-oss (via MaaS, then direct) then
  # local exactly as before. Pre-dates and is unrelated to ADR-0531's
  # Arkos/Tekos/Comage-scoped OVH extension (this is Cognos's own,
  # earlier, board-level-reasoning grant). ADR-0531 inserts qwen3.5-9b
  # right behind it, same fleet default as every other agent.
  - agent: cognos
    task: coming-soon
    preferred: [ovhcloud-gpt-oss-120b, local-qwen35-maas, local-qwen35, local-gpt-oss-maas, local-gpt-oss, local-maas, local]
  # ADR-0531: no prior entry - now explicit. Still inert (no runtime
  # route), forward-declared like coming-soon above.
  - agent: cognos
    task: review-historical-commercial-data
    preferred: [local-qwen35-maas, local-qwen35, local-gpt-oss-maas, local-gpt-oss, local-maas, local]
  # ADR-0531: Naveo/Soursage are pre-live agents (see their own
  # NEXT_STEPS.md) - these entries are pure forward-declaration, identical
  # in spirit to cognos/coming-soon above, zero live-routing effect until
  # either agent is actually deployed.
  - agent: naveo
    task: answer-onboarding-question
    preferred: [local-qwen35-maas, local-qwen35, local-gpt-oss-maas, local-gpt-oss, local-maas, local]
  - agent: soursage
    task: coming-soon
    preferred: [local-qwen35-maas, local-qwen35, local-gpt-oss-maas, local-gpt-oss, local-maas, local]

  # ADR-0417: coding requests. Arkos's write-code call is a scoped,
  # early-exit branch of an otherwise C3-seeded agent (evaluated at a
  # fixed C2 ceiling in code, mirroring reflect_node's ADR-0416 override).
  # strict: true means mistral-codestral is the ONLY candidate; if it
  # fails for any reason (including running out of credits), the turn
  # fails explicitly (RoutingError/502) rather than silently falling back
  # to a different model the user didn't ask for.
  - agent: arkos
    task: write-code
    prefer: [mistral-codestral]
    strict: true
  # Tekos is C1-seeded, so mistral-codestral (eligible_for: [C1, C2]) is
  # already reachable at its natural classification with no override - no
  # strict flag: the existing generic fallback-on-any-exception in
  # app/main.py's _invoke_with_fallback (unchanged) naturally drops to
  # local if Codestral errors, giving "use local also for coding" for
  # free from already-live machinery.
  # ADR-0526 (WP-087): the variant goes SECOND here too - mistral-codestral
  # stays at index 0 and this entry stays non-strict. Both are enforced in
  # CI by evaluations/tekos/gate_checks.py's
  # tekos_write_code_prefers_mistral_codestral check, which fails the gate
  # outright if either changes.
  - agent: tekos
    task: write-code
    prefer: [mistral-codestral, local-wesh-maas, local-wesh, local-gpt-oss-maas, local-gpt-oss, local-maas, local]

# ADR-0304 (WP-40 Part B): per (agent, task) "task class" quality/cost/
# latency objectives, consumed by evaluations/routing_report.py alongside
# live ai-gateway metrics (ADR-0029) and evaluations/benchmarks/*.json
# artifacts (ADR-0305) to emit a RECOMMENDED policy diff - a report file,
# never a write to this policy. Applying a recommendation is a normal
# reviewed GitOps change to the `adapters:` list above; nothing in this
# repo writes here automatically (that is ADR-0309/WP-42's separately
# governed, explicitly-enabled scope, not this WP's).
#
# quality_floor: minimum acceptable quality signal in [0, 1] - the same
#   scale evaluations/quality_gate.py's own scenario_rate already uses,
#   so a benchmark artifact's agent_gates[task].scenario_rate is directly
#   comparable without a unit conversion.
# cost_ceiling_usd_per_1k: maximum acceptable USD per 1,000 total tokens
#   (matches components/ai-gateway/app/telemetry.py's own
#   zuno.model_cost_usd metric convention).
# latency_target_ms_p95: maximum acceptable P95 latency in milliseconds
#   (matches components/ai-gateway/app/telemetry.py's own zuno.latency_ms
#   span attribute).
#
# cost_ceiling_usd_per_1k/latency_target_ms_p95 are deliberately omitted
# below: this repo's OTel Collector has no queryable long-term metrics
# store wired in (evaluations/routing_report.py's own D13 note), so there
# is no live PromQL result to source a real ceiling/target from - setting
# one anyway would be an invented number, not an objective. quality_floor
# alone is sourced from evaluations/comage/gate_config.yaml's own
# scenario_threshold, so it is comparable rather than arbitrary.
objectives:
  - agent: comage
    task: compare-historical-deals
    quality_floor: 0.75
  - agent: comage
    task: check-deal-status
    quality_floor: 0.75
  - agent: comage
    task: update-opportunity-status
    quality_floor: 0.75
  - agent: comage
    task: check-my-drive-and-mail
    quality_floor: 0.75
