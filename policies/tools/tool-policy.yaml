# Policy: tools - MCP tool authorization data (ADR-0011, ADR-0010).
#
# This file is the authoritative, GitOps-managed platform-policy layer that
# the central MCP Gateway loads at startup and re-reads on change (see
# ADR-0010, ADR-0022). It is ONE of five factors ADR-0011 requires to all
# agree before a tool call is allowed - the MCP Gateway must compute the
# intersection of all five before invoking any MCP tool:
#
#   allowed = agent_declaration ∩ task_rights ∩ user_group_rights ∩ classification ∩ platform_policy
#
# Where each factor comes from:
#   1. agent_declaration  - the union of `allowed_tools` across every one of the
#                            calling agent's own OKF tasks (agents/<agent>/tasks/*.md),
#                            computed by AgentDefinition.declared_tools() in
#                            components/agent-runtime/app/registry.py. An agent can
#                            only ever reach tools some task of its declares,
#                            regardless of what its caller is otherwise allowed.
#   2. task_rights         - the specific OKF task being executed may further
#                            restrict which of the agent's declared tools apply
#                            (agents/<agent>/tasks/). A task can narrow, never widen,
#                            the agent's declaration.
#   3. user_group_rights   - the calling user's Keycloak `groups` claim (JWT
#                            issued by the `zuno` realm, ADR-0012/ADR-0013; see
#                            platform/identity/README.md for the exact claim shape).
#                            Must intersect this entry's `allowed_groups`.
#   4. classification      - the data classification of what the tool touches
#                            (policies/data-classification/classification.yaml) must
#                            be routable per ADR-0021 for the model/context in play,
#                            and must be >= this entry's `min_classification` in
#                            sensitivity (i.e. the tool cannot be invoked in a context
#                            cleared for a lower classification than it requires).
#   5. platform_policy     - THIS FILE: the tool must be listed below, bound to the
#                            correct `mcp_server`, and the caller's groups must appear
#                            in `allowed_groups`.
#
# All five must independently permit the call. Any single "no" is a "no" -
# there is no override. The MCP Gateway must fail closed (deny) if this file
# fails to load, if a requested tool is absent from it, or if the caller's
# `groups` claim cannot be validated against the realm's JWKS
# (see platform/identity/README.md).
#
# Schema per entry:
#   tool:              MCP tool name, unique key (legacy pre-ADR-0116 name,
#                       kept as an explicit migration alias).
#   capability:        ADR-0116 canonical `<domain>.<resource>.<verb>` logical
#                       capability ID. The entry answers to BOTH names during
#                       migration; new agent contracts use the capability ID.
#                       Physical routing is NOT derived from either name - the
#                       MCP Gateway resolves the capability through the
#                       platform binding registry
#                       (platform/bindings/tools/tool-bindings.yaml) after
#                       this policy allows the call.
#   mcp_server:        the downstream MCP server (components/mcp-servers/<name>,
#                       or the smtp-technical reporting integration) that owns this tool.
#   min_classification: C1 | C2 | C3 - see policies/data-classification/classification.yaml.
#                       This is the classification the tool's *data* carries, not a
#                       user clearance level; it gates which model/inference route
#                       (ADR-0021) may be used for any content flowing through the tool.
#   allowed_groups:    list of Keycloak `zuno` realm group names (see
#                       platform/identity/README.md) permitted to invoke this tool,
#                       subject to the other four factors above still applying.
#   external_model_policy.allow_context (optional, default true): ADR-0035 -
#                       a source-level restriction independent of
#                       min_classification. When false, this tool's result
#                       content must only ever be processed by local
#                       inference, regardless of the broader
#                       min_classification's own SaaS-eligibility (e.g. C2
#                       otherwise permits an approved-SaaS allow-list) - the
#                       MCP Gateway reports this flag back to the caller in
#                       its invoke response so the Agent Runtime's model
#                       routing can enforce it (X-Zuno-Local-Only header to
#                       components/ai-gateway).

tools:
  - tool: search_confluence
    capability: confluence.page.search
    mcp_server: confluence
    # C2 per ADR-0035 (was incorrectly C1) - internal Confluence content is
    # business-sensitive, matching the `confluence` domain in
    # policies/data-classification/classification.yaml.
    min_classification: C2
    allowed_groups:
      - consultant
      - board
      - cdp
      # ADR-0524 clause 4 (WP-085 step 5): OpenShift Lightspeed's read-only
      # identity. It appears HERE and on confluence.page.read, and on nothing
      # else in this file - that omission IS the write prohibition, per
      # ADR-0011's intersection and ADR-0117's "read never implies write".
      # Before adding this group to any further capability, re-read ADR-0524
      # clause 4: two of its three enforcement layers are this list and the
      # /mcp front-door's tools/list, which derives from this list.
      - lightspeed_readonly
    external_model_policy:
      allow_context: false

  # ADR-0117: real Confluence Cloud access (components/mcp-servers/confluence),
  # replacing the search_confluence demo handler above's mapping. read/create/
  # update never had a pre-ADR-0116 legacy name, so `tool` equals `capability`
  # for these three - each is its own policy-intersection entry (ADR-0011),
  # so a task declaring only confluence.page.search/read can never reach
  # confluence.page.create/update, satisfying ADR-0117's "read access never
  # implies write access".
  - tool: confluence.page.read
    capability: confluence.page.read
    mcp_server: confluence
    min_classification: C2
    allowed_groups:
      - consultant
      - board
      - cdp
      # ADR-0524 clause 4 - see the search_confluence entry above. Deliberately
      # NOT present on confluence.page.create / confluence.page.update below.
      - lightspeed_readonly
    external_model_policy:
      allow_context: false

  - tool: confluence.page.create
    capability: confluence.page.create
    mcp_server: confluence
    min_classification: C2
    allowed_groups:
      - consultant
      - board
      - cdp
    external_model_policy:
      allow_context: false

  - tool: confluence.page.update
    capability: confluence.page.update
    mcp_server: confluence
    min_classification: C2
    allowed_groups:
      - consultant
      - board
      - cdp
    external_model_policy:
      allow_context: false

  # ADR-0326 (WP-33/WP-35/WP-36): `sales`/`adv`/`finance` added alongside
  # the existing groups - Comage, Advantage and Finage each prove the
  # same delegated Google Workspace pattern Arkos proved for Drive
  # writes, exercised here for reads under their own business role.
  - tool: list_drive_files
    capability: drive.document.search
    mcp_server: google-workspace
    min_classification: C1
    allowed_groups:
      - consultant
      - board
      - cdp
      - sales
      - adv
      - finance

  # ADR-0326 (WP-31): Arkos's delegated Drive/Docs write - same
  # allowed_groups as the existing read capability above (no narrower
  # write-specific role exists yet in this demo's threat model; WP-32's
  # self/any-scoped capability pattern is introduced for a different
  # domain, Workday, not retrofitted here).
  - tool: drive.document.create
    capability: drive.document.create
    mcp_server: google-workspace
    min_classification: C1
    allowed_groups:
      - consultant
      - board
      - cdp

  - tool: drive.document.update
    capability: drive.document.update
    mcp_server: google-workspace
    min_classification: C1
    allowed_groups:
      - consultant
      - board
      - cdp

  - tool: read_gmail
    capability: gmail.message.read
    mcp_server: google-workspace
    min_classification: C1
    allowed_groups:
      - consultant
      - board
      - cdp
      - sales
      - adv
      - finance

  # ADR-0326/ADR-0206 (WP-33): live Salesforce (components/mcp-servers/
  # salesforce). ADR-0219 retired the deterministic sxa.* capabilities this
  # row was once contrasted against, so this is now the only structured
  # commercial-data path; legacy SXA is reachable through
  # `knowledge.sxa-legacy` retrieval only. `sales`/`board` only, no `adv`:
  # ADR-0326's Advantage bullet requires any cross-domain commercial access
  # to be "explicitly declared... rather than inherited from Comage", and
  # Advantage's legacy access is granted on the knowledge domain, never
  # implicitly on current Salesforce through this entry. C2 matches `sales-data` in
  # policies/data-classification/classification.yaml (knowledge.sales's
  # own default_by_source_type). No `external_model_policy.allow_context:
  # false` here (unlike Confluence's ADR-0035 entry): that restriction is
  # Confluence's own contractual/source-level constraint, not a general
  # C2 rule - Salesforce content stays governed by C2's ordinary
  # restricted-SaaS routing.
  - tool: salesforce.opportunity.read
    capability: salesforce.opportunity.read
    mcp_server: salesforce
    min_classification: C2
    allowed_groups:
      - sales
      - board

  - tool: salesforce.opportunity.create
    capability: salesforce.opportunity.create
    mcp_server: salesforce
    min_classification: C2
    allowed_groups:
      - sales
      - board

  - tool: salesforce.opportunity.update
    capability: salesforce.opportunity.update
    mcp_server: salesforce
    min_classification: C2
    allowed_groups:
      - sales
      - board

  - tool: web_search
    capability: web.page.search
    mcp_server: web-search
    min_classification: C1
    allowed_groups:
      - sales
      - consultant
      - adv
      - finance
      - board

  - tool: send_technical_report_email
    capability: email.report.send
    mcp_server: smtp-technical
    min_classification: C2
    allowed_groups:
      - sales
      - board

  # ADR-0340 (WP-32): Workday - resource scope lives in the capability
  # itself (self vs. any), never in a broad role name. Technical users get
  # read AND write on their OWN profile (self.read + self.update); cdp
  # gets read-only, but on BOTH their own profile and any authorized
  # staff's (self.read + any.read) - cdp is deliberately absent from
  # self.update and there is no any.update capability at all (the ADR's
  # own "not implied, must be a separately approved capability if ever
  # introduced"). C3, matching this repo's own pre-existing `hr-data: C3`
  # domain (policies/data-classification/classification.yaml already names
  # "financial, HR, sovereign/nominative data" at that tier) - a Workday
  # employee profile is squarely HR data. No Workday backend exists yet -
  # every entry's binding (platform/bindings/tools/tool-bindings.yaml) is
  # auth_mode: provider-delegated, so every call fails closed with 501
  # regardless of this policy passing; these entries still matter today
  # because policy-evaluation tests must prove the intersection is
  # correctly *shaped*, independent of whether a backend exists.
  - tool: workday.profile.self.read
    capability: workday.profile.self.read
    mcp_server: workday
    min_classification: C3
    allowed_groups:
      - consultant
      - cdp
    # ADR-0340 Security considerations: "resource ownership ... checks for
    # *.self.* ... are enforced server-side from validated identity claims
    # ... not prompt text." components/mcp-gateway/app/main.py's
    # invoke_tool compares this argument key against the caller's own
    # validated JWT `sub` after the group-level decision above already
    # allowed the call - a mismatch is 403, regardless of what the
    # request body claims. No Workday employee-ID<->Keycloak-sub mapping
    # exists in this demo (no real backend), so `employee_id` is expected
    # to equal the caller's own sub directly, the same simplification
    # every other mock backend in this repo makes.
    subject_field: employee_id

  - tool: workday.profile.self.update
    capability: workday.profile.self.update
    mcp_server: workday
    min_classification: C3
    allowed_groups:
      - consultant
    subject_field: employee_id

  - tool: workday.profile.any.read
    capability: workday.profile.any.read
    mcp_server: workday
    min_classification: C3
    allowed_groups:
      - cdp

  # ADR-0120 (WP-058): git-forge - the same three groups as Confluence's
  # own entries (technical/knowledge access, not a sales/finance persona).
  # C2, matching Confluence's "internal, business-sensitive content" tier -
  # repository content ranges from public OSS to private business logic,
  # and C2 is the right default until per-repo classification exists. No
  # `external_model_policy.allow_context: false` here (unlike Confluence's
  # ADR-0035 entry): that restriction is Confluence's own contractual/
  # source-level constraint, not a general C2 rule - same reasoning
  # Salesforce's own entries already document. No agent declares any of
  # these six capabilities yet (agents/*/tasks/*.md) - every call denies
  # on the ADR-0011 agent_declaration factor until one does, same initial
  # state Confluence's write capabilities had at WP-02.
  - tool: git.repository.read
    capability: git.repository.read
    mcp_server: git-forge
    min_classification: C2
    allowed_groups:
      - consultant
      - board
      - cdp

  - tool: git.repository.list
    capability: git.repository.list
    mcp_server: git-forge
    min_classification: C2
    allowed_groups:
      - consultant
      - board
      - cdp

  # ADR-0121: GitLab-only, any visibility - same allowed_groups as the
  # public-only entries above (platform_policy doesn't need to be
  # narrower; the actual GitHub-refusal and agent-declaration gating
  # already do the real work - see git-forge/server.py and each agent's
  # own agents/<name>/tasks/*.md `allowed_tools`).
  - tool: git.repository.private.read
    capability: git.repository.private.read
    mcp_server: git-forge
    min_classification: C2
    allowed_groups:
      - consultant
      - board
      - cdp

  - tool: git.repository.private.list
    capability: git.repository.private.list
    mcp_server: git-forge
    min_classification: C2
    allowed_groups:
      - consultant
      - board
      - cdp

  - tool: git.file.write
    capability: git.file.write
    mcp_server: git-forge
    min_classification: C2
    allowed_groups:
      - consultant
      - board
      - cdp

  - tool: git.repository.create
    capability: git.repository.create
    mcp_server: git-forge
    min_classification: C2
    allowed_groups:
      - consultant
      - board
      - cdp

  - tool: git.repository.fork
    capability: git.repository.fork
    mcp_server: git-forge
    min_classification: C2
    allowed_groups:
      - consultant
      - board
      - cdp

  # Always refused by the server itself (git-forge/server.py's
  # delete_repository never deletes anything) - kept as a normal,
  # policy-gated capability so an unauthorized caller still gets denied
  # by the ordinary intersection, and an authorized one gets the
  # server's explanatory refusal rather than "unknown tool".
  - tool: git.repository.delete
    capability: git.repository.delete
    mcp_server: git-forge
    min_classification: C2
    allowed_groups:
      - consultant
      - board
      - cdp

  # ADR-0415: stable-diffusion-xl image generation via OVHcloud AI
  # Endpoints, for advantage/cognos/comage's preferred image model. Policy
  # update: photorealistic generation is now Comage-exclusive among the
  # live agents, scoped to genuine marketing-visual requests only (see
  # agents/comage/prompts/check-deal-status.md) - Arkos's own former grant
  # was removed, since its actual use cases are all diagram-shaped and
  # covered by generate_diagram below. min_classification C2, not each
  # agent's own ambient ceiling - cognos is C3 for everything else; this
  # tool is the one deliberate, narrow exception (see the ADR's Accepted
  # risks), enforced at the call site (components/mcp-gateway/app/
  # handlers/image_gen.py always declares C2 to ai-gateway, never the
  # caller's real classification).
  - tool: generate_image
    capability: image.generation.create
    mcp_server: image-gen
    min_classification: C2
    allowed_groups:
      - consultant
      - adv
      - sales
      - board
      - cdp

  # ADR-0516: Mermaid-to-SVG rendering via the in-cluster diagram-render
  # service, for structured/technical asks generate_image's diffusion
  # model can't do well (precise boxes/arrows/legible text - see the
  # ADR's own comparison). Policy update: unlike generate_image (now
  # Comage-exclusive), this is the platform's default baseline visual
  # capability - every current agent (arkos/comage/tekos) has it, and
  # platform/templates/agent/scaffold_agent.py grants it to every future
  # scaffolded agent automatically, no `--tool` flag needed.
  # min_classification C1, not C2 like
  # generate_image above - unlike that tool, this one never leaves the
  # cluster (components/mcp-gateway/app/handlers/diagram_gen.py's own
  # docstring explains why C2's SaaS-boundary exception doesn't apply
  # here), so the least-restrictive classification is the correct
  # default, not a copy-pasted ceiling. Same allowed_groups as
  # generate_image - Tekos's own consultant-01 persona is already in
  # the `consultant` group below, so no group addition was needed for
  # ADR-0516's Tekos carve-out; the OKF task declaration (agents/tekos/
  # tasks/answer-technical-question.md) is what actually grants Tekos
  # this tool - it still never declares generate_image/
  # image.generation.create.
  - tool: generate_diagram
    capability: diagram.generation.create
    mcp_server: diagram-gen
    min_classification: C1
    allowed_groups:
      - consultant
      - adv
      - sales
      - board
      - cdp
