# Policy: tools - MCP tool authorization data (ADR-0011, ADR-0010).
#
# This file is the authoritative, GitOps-managed platform-policy layer that
# the central MCP Gateway loads at startup and re-reads on change (see
# ADR-0010, ADR-0022). It is ONE of five factors ADR-0011 requires to all
# agree before a tool call is allowed - the MCP Gateway must compute the
# intersection of all five before invoking any MCP tool:
#
#   allowed = agent_declaration ∩ task_rights ∩ user_group_rights ∩ classification ∩ platform_policy
#
# Where each factor comes from:
#   1. agent_declaration  - the calling agent's OKF bundle explicitly lists
#                            this tool under its declared MCP tools (agents/<agent>/tools/).
#                            An agent can only ever reach tools it declares,
#                            regardless of what its caller is otherwise allowed.
#   2. task_rights         - the specific OKF task being executed may further
#                            restrict which of the agent's declared tools apply
#                            (agents/<agent>/tasks/). A task can narrow, never widen,
#                            the agent's declaration.
#   3. user_group_rights   - the calling user's Keycloak `groups` claim (JWT
#                            issued by the `zuno` realm, ADR-0012/ADR-0013; see
#                            platform/identity/README.md for the exact claim shape).
#                            Must intersect this entry's `allowed_groups`.
#   4. classification      - the data classification of what the tool touches
#                            (policies/data-classification/classification.yaml) must
#                            be routable per ADR-0021 for the model/context in play,
#                            and must be >= this entry's `min_classification` in
#                            sensitivity (i.e. the tool cannot be invoked in a context
#                            cleared for a lower classification than it requires).
#   5. platform_policy     - THIS FILE: the tool must be listed below, bound to the
#                            correct `mcp_server`, and the caller's groups must appear
#                            in `allowed_groups`.
#
# All five must independently permit the call. Any single "no" is a "no" -
# there is no override. The MCP Gateway must fail closed (deny) if this file
# fails to load, if a requested tool is absent from it, or if the caller's
# `groups` claim cannot be validated against the realm's JWKS
# (see platform/identity/README.md).
#
# Schema per entry:
#   tool:              MCP tool name, unique key (legacy pre-ADR-0116 name,
#                       kept as an explicit migration alias).
#   capability:        ADR-0116 canonical `<domain>.<resource>.<verb>` logical
#                       capability ID. The entry answers to BOTH names during
#                       migration; new agent contracts use the capability ID.
#                       Physical routing is NOT derived from either name - the
#                       MCP Gateway resolves the capability through the
#                       platform binding registry
#                       (platform/bindings/tools/tool-bindings.yaml) after
#                       this policy allows the call.
#   mcp_server:        the downstream MCP server (components/mcp-servers/<name>,
#                       or the smtp-technical reporting integration) that owns this tool.
#   min_classification: C1 | C2 | C3 - see policies/data-classification/classification.yaml.
#                       This is the classification the tool's *data* carries, not a
#                       user clearance level; it gates which model/inference route
#                       (ADR-0021) may be used for any content flowing through the tool.
#   allowed_groups:    list of Keycloak `zuno` realm group names (see
#                       platform/identity/README.md) permitted to invoke this tool,
#                       subject to the other four factors above still applying.
#   external_model_policy.allow_context (optional, default true): ADR-0035 -
#                       a source-level restriction independent of
#                       min_classification. When false, this tool's result
#                       content must only ever be processed by local
#                       inference, regardless of the broader
#                       min_classification's own SaaS-eligibility (e.g. C2
#                       otherwise permits an approved-SaaS allow-list) - the
#                       MCP Gateway reports this flag back to the caller in
#                       its invoke response so the Agent Runtime's model
#                       routing can enforce it (X-Zuno-Local-Only header to
#                       components/ai-gateway).

tools:
  - tool: search_confluence
    capability: confluence.page.search
    mcp_server: confluence
    # C2 per ADR-0035 (was incorrectly C1) - internal Confluence content is
    # business-sensitive, matching the `confluence` domain in
    # policies/data-classification/classification.yaml.
    min_classification: C2
    allowed_groups:
      - consultant
      - board
    external_model_policy:
      allow_context: false

  - tool: list_drive_files
    capability: drive.document.search
    mcp_server: google-workspace
    min_classification: C1
    allowed_groups:
      - consultant
      - board

  - tool: read_gmail
    capability: gmail.message.read
    mcp_server: google-workspace
    min_classification: C1
    allowed_groups:
      - consultant
      - board

  - tool: get_customer
    capability: sales.customer.read
    mcp_server: sales-db
    min_classification: C2
    allowed_groups:
      - sales
      - adv
      - board

  - tool: list_open_opportunities
    capability: sales.opportunity.search
    mcp_server: sales-db
    min_classification: C2
    allowed_groups:
      - sales
      - adv
      - board

  - tool: get_quote
    capability: sales.quote.read
    mcp_server: sales-db
    min_classification: C2
    allowed_groups:
      - sales
      - adv
      - board

  - tool: web_search
    capability: web.page.search
    mcp_server: web-search
    min_classification: C1
    allowed_groups:
      - sales
      - consultant
      - adv
      - finance
      - board

  - tool: send_technical_report_email
    capability: email.report.send
    mcp_server: smtp-technical
    min_classification: C2
    allowed_groups:
      - sales
      - board
