# ADR-0603 / WP-222, WP-223: gitleaks configuration (read by .github/workflows/secret-scan.yml
# and the pre-commit hook). The default rules apply; only documented false positives are listed.
[extend]
useDefault = true

[allowlist]
description = "documented false positives"
regexTarget = "match"
regexes = [
  # The default rule kubernetes-secret-yaml also matches `kind: SecretStore`, the External
  # Secrets store every ExternalSecret references since WP-223: the match then runs from that
  # line to the ExternalSecret's remoteRef key, a Vault path, never a secret value.
  '''^kind:\s*SecretStore\b''',
  # evaluations/golden_path_probe.py calls OpenClaw's gateway with the literal word
  # `placeholder` as bearer: OpenClaw does not validate it, the ai-gateway sees the
  # token its own client config injects. Not a credential (the curl-auth-header rule
  # fires on the shape `Authorization: Bearer <word>`).
  '''Authorization: Bearer placeholder\b''',
]
# A literal placeholder, not a credential: commit 224615ab (WP-238) sent `Bearer placeholder` through OpenClaw's
# egress proxy, which replaces it. The header is gone since; this keeps a full-history scan green.
commits = ["224615ab387771fda0dd9788036ec5348704fa50"]
