---
# State detection (never fails).
- name: "perses | check the perses Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-perses-d1"

- name: "perses | look up the Perses instance"
  kubernetes.core.k8s_info:
    api_version: perses.dev/v1alpha2
    kind: Perses
    namespace: zuno-monitoring
    name: perses
  register: _perses_lookup

- name: "perses | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        _state_check_result
        and (_perses_lookup.resources | default([]) | length) > 0
      }}

- name: "perses | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
