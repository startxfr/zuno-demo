---
# No OLM operator of its own - the DataSciencePipelinesApplication/Pipeline
# CRDs this chart uses come from openshift_ai's aipipelines component
# (day0), so -d0 is a documented no-op, same pattern as
# ansible/roles/rag_ingestion/tasks/install.yml (ADR-0302 point 1 reuses
# that exact mechanism).
- name: "mlops | apply the mlops GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "mlops"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-mlops-d0"

# ADR-0545/WP-126. dsp-mlops-dspa's OWN trust bundle
# (dsp-trusted-ca-mlops-dspa/dsp-ca.crt) only ever carries the cluster-wide
# Vault root (CN zuno-demo.internal, via odh-trusted-ca-bundle's
# CNO-injected ca-bundle.crt) - never the openshift-service-serving-signer
# CA that signs in-cluster Service certs like mlflow.redhat-ods-applications.svc.
# WP-116's MLflow integration calls that endpoint from CreateRun, and with
# only the Vault root trusted the DSP api-server rejected its certificate
# (x509: certificate signed by unknown authority) and failed EVERY run
# creation server-side, not just training's - live-caught 2026-09-03
# triggering the first real TrainJob run. Same split as
# ansible/roles/openshift_oauth/tasks/install.yml's keycloak-serving-ca: the
# ConfigMap *name* is Helm-templated (dspa.yaml's spec.apiServer.cABundle),
# only this data-write belongs in Ansible, since it concatenates two live
# cluster sources Helm cannot see at chart-render time. The DSP operator
# merges this into its own dsp-ca.crt file (not a Route swap), so a plain
# `oc rollout restart deployment/ds-pipeline-mlops-dspa -n zuno-mlops` is
# still needed after a first-time change - the pod does not reload its
# trust store from a changed mounted file on its own. Idempotent: re-running
# with unchanged source CAs produces byte-identical data, no restart forced.
- name: "mlops | read the cluster-wide Vault CA (user-ca-bundle)"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: openshift-config
    name: user-ca-bundle
  register: _mlops_vault_ca

- name: "mlops | read this namespace's OpenShift service-ca bundle"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: zuno-mlops
    name: openshift-service-ca.crt
  register: _mlops_service_ca

- name: "mlops | merge both CAs into the DSP api-server's trust ConfigMap"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: dsp-mlflow-trust-mlops-dspa
        namespace: zuno-mlops
      data:
        ca-bundle.crt: >-
          {{ (_mlops_vault_ca.resources[0].data['ca-bundle.crt'] | default('')) + "\n"
             + (_mlops_service_ca.resources[0].data['service-ca.crt'] | default('')) }}
  register: _mlops_ca_bundle_apply
  when: >-
    (_mlops_vault_ca.resources | default([]) | length) > 0 and
    (_mlops_service_ca.resources | default([]) | length) > 0

- name: "mlops | fail loudly if either source CA ConfigMap is missing"
  ansible.builtin.fail:
    msg: >-
      user-ca-bundle (openshift-config) or openshift-service-ca.crt
      (zuno-mlops) not found - the DSP api-server's MLflow-trust ConfigMap
      cannot be built. Both are cluster-standard ConfigMaps that should
      always exist; investigate before re-running.
  when: >-
    (_mlops_vault_ca.resources | default([]) | length) == 0 or
    (_mlops_service_ca.resources | default([]) | length) == 0

# ADR-0546/WP-131: the pipeline-artifact bucket and the style-corpus URI are
# cluster-scoped, so they stop being chart literals. Soft-read - omitting the
# variables leaves the chart defaults. ADR-0517 B13: a role that reads a
# confidential.yml variable without loading the file gets an undefined variable
# and its `| default(chart)` fallback wins in silence, which is why this pair is
# not optional. check_confidential_var_loaders() enforces it.
- name: "mlops | check for ansible/confidential.yml"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/confidential.yml"
  register: _mlops_confidential_file

- name: "mlops | load ansible/confidential.yml if present"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/confidential.yml"
  when: _mlops_confidential_file.stat.exists

- name: "mlops | apply the mlops GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "mlops"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-mlops-d1"
    # Start from the manifest's OWN values and merge in only what is discovered
    # at run time, the same idiom cert_manager uses. A plain literal dict here
    # would silently drop acceptanceGate.keycloakUrl/.frontendUrl, because
    # apply_gitops_app.yml REPLACES spec.source.helm.values rather than merging
    # - which is exactly ADR-0517 B3 coming back. The replace() mirrors that
    # file's token substitution, which acts on the file it reads and cannot
    # reach this dict; it is evaluated lazily inside the include, so
    # cluster_base_domain is already resolved.
    #
    # Subscript ['values'], never .values - dot notation resolves to the dict
    # method and combine() then fails with "expected dicts but got a 'method'".
    #
    # styleCorpusS3Uri is a SEPARATE variable from s3.bucket on purpose: the
    # training corpus is a cross-cluster INPUT (zuno-demo-sources) while the
    # pipeline artifacts are this cluster's OUTPUT (zuno-<cluster>-mlops).
    # Deriving one from the other would re-merge the two natures ADR-0546
    # exists to separate.
    gitops_app_extra_helm_values: >-
      {{
        ((lookup('ansible.builtin.file', zuno_repo_root + '/gitops/apps/mlops/application-d1.yaml')
          | replace('apps.mycluster.example.com', cluster_base_domain)
          | from_yaml)['spec']['source']['helm']['values'] | from_yaml)
        | combine({'s3': {'bucket': zuno_mlops_s3_bucket | default('zuno-corpus'),
                          'region': zuno_mlops_s3_region | default('us-east-1')}}, recursive=True)
        | combine({'agents': {'comage': {'styleCorpusS3Uri':
                     zuno_mlops_style_corpus_s3_uri
                     | default('s3://zuno-corpus/qwen-wesh-training-corpus.tgz')}}}, recursive=True)
      }}
    # Values-changing apply - see ansible/roles/mlflow/tasks/install.yml.
    gitops_app_refresh: true
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 15

# Only needed the very first time this ConfigMap gains data the DSP
# operator merges into dsp-trusted-ca-mlops-dspa/dsp-ca.crt (see the task
# above) - restarting on every idempotent no-op re-run would be needless
# churn, so this is gated on the merge task actually reporting `changed`.
- name: "mlops | restart the DSP api-server so it reloads its merged trust bundle"
  kubernetes.core.k8s:
    state: patched
    api_version: apps/v1
    kind: Deployment
    namespace: zuno-mlops
    name: ds-pipeline-mlops-dspa
    definition:
      spec:
        template:
          metadata:
            annotations:
              # WP-133 (live, 2026-09-04): ansible_date_time is unset here
              # (day2_install.yml runs with gather_facts: false and nothing
              # gathers it) - exactly the same latent bug WP-129 fixed in
              # rag_ingestion's own copy of this task and predicted would
              # also hit this one. now() is Ansible's fact-free equivalent.
              zuno.io/ca-bundle-restarted-at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
  when: _mlops_ca_bundle_apply is defined and _mlops_ca_bundle_apply.changed | default(false)

# UNVERIFIED against a live cluster - same caveat
# ansible/roles/rag_ingestion/tasks/install.yml documents for its own
# rag-dspa wait: assumes a standard status.conditions entry of type
# "Ready". Re-check with `oc get dspa mlops-dspa -n zuno-mlops -o yaml`
# against the target cluster and adjust if the operator uses a different
# field.
- name: "mlops | wait for the mlops-dspa DataSciencePipelinesApplication to report Ready"
  kubernetes.core.k8s_info:
    api_version: datasciencepipelinesapplications.opendatahub.io/v1
    kind: DataSciencePipelinesApplication
    namespace: zuno-mlops
    name: mlops-dspa
  register: _mlops_dspa
  until: >-
    (_mlops_dspa.resources | default([]) | length) > 0 and
    (_mlops_dspa.resources[0].status.conditions | default([])
     | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | list
     | first | default('False')) == 'True'
  retries: 60
  delay: 15

# ADR-0526 (WP-087): compile and upload the PipelineVersion. Placed right
# after the DSPA reports Ready, mirroring
# ansible/roles/rag_ingestion/tasks/install.yml - KFP must be up before a
# PipelineVersion can be applied against it.
- name: "mlops | compile and apply the KFP PipelineVersion(s)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/roles/mlops/tasks/compile_pipeline_version.yml"

# WP-087: the `evaluate` stage runs the candidate agent's REAL acceptance
# suite (ADR-0302 point 5), which authenticates a demo persona against
# Keycloak - evaluations/tekos/run_scenarios.py raises outright without
# DEMO_PERSONA_PASSWORD. The password is Keycloak-generated and lives in
# zuno-auth, so it is copied into zuno-mlops here rather than invented as
# a Vault path that does not exist. Exactly the mechanism
# ansible/roles/agents/tasks/run_acceptance_gate.yml already uses to put
# the same credential into zuno-ai-run.
- name: "mlops | read the Keycloak-generated demo persona password"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: zuno-auth
    name: demo-personas-password
  register: _mlops_demo_password_secret
  no_log: true

# EVERY agent's frontend client secret, not tekos's. The evaluate stage
# authenticates as the TARGET agent's persona and
# evaluations/tekos/run_scenarios.py reads
# f"{AGENT.upper()}_FRONTEND_CLIENT_SECRET", so mirroring only tekos's
# left a comage pipeline run raising "COMAGE_FRONTEND_CLIENT_SECRET is
# required to obtain persona tokens" on half its scenarios and on all its
# security checks. Listing the namespace instead of naming one agent
# keeps this correct when another agent is enabled in values.yaml.
- name: "mlops | read every agent's frontend client secret from zuno-auth"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: zuno-auth
  register: _mlops_all_auth_secrets
  no_log: true

- name: "mlops | keep only the <agent>-frontend-client-secret entries"
  ansible.builtin.set_fact:
    _mlops_client_secrets: >-
      {{ _mlops_all_auth_secrets.resources | default([])
         | selectattr('metadata.name', 'search', '-frontend-client-secret$')
         | list }}
  no_log: true

# Scenario 19 of the acceptance gate lists pods in zuno-ai-run through
# the in-cluster API to assert that ADR-0329's placeholder agents run no
# workloads. Run from the pipeline it failed with a bare 403: the KFP
# pipeline pod authenticates as pipeline-runner-mlops-dspa, not as the
# standalone gate Job's acceptance-gate ServiceAccount.
#
# A separate Role rather than an extra subject on the agents role's
# acceptance-gate Role: that one is created by run_acceptance_gate.yml,
# which is a Day 3 verb an operator may never have run, so binding to it
# would make this silently order-dependent. The rules are identical and
# read-only.
- name: "mlops | grant the pipeline ServiceAccount read-only pod access in zuno-ai-run (acceptance gate scenario 19)"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: mlops-acceptance-gate
        namespace: zuno-ai-run
        labels:
          zuno.io/managed-by: zuno-ansible
      rules:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch"]

- name: "mlops | bind that Role to the mlops-dspa pipeline runner"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: mlops-acceptance-gate
        namespace: zuno-ai-run
        labels:
          zuno.io/managed-by: zuno-ansible
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: mlops-acceptance-gate
      subjects:
        # KFP names the runner after the DataSciencePipelinesApplication
        # this role waits on above (mlops-dspa), so this tracks that name.
        - kind: ServiceAccount
          name: pipeline-runner-mlops-dspa
          namespace: zuno-mlops

- name: "mlops | read the platform internal root CA the agent Routes chain to"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: openshift-config
    name: keycloak-serving-ca
  register: _mlops_gate_ca_cm

- name: "mlops | mirror the internal root CA into zuno-mlops for the evaluate stage"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: acceptance-gate-ca
        namespace: zuno-mlops
        labels:
          zuno.io/managed-by: zuno-ansible
      data:
        ca.crt: "{{ _mlops_gate_ca_cm.resources[0].data['ca.crt'] }}"
  when: (_mlops_gate_ca_cm.resources | default([]) | length) > 0

- name: "mlops | warn if the internal root CA is missing"
  ansible.builtin.debug:
    msg: >-
      openshift-config/keycloak-serving-ca not found, so zuno-mlops has no
      acceptance-gate-ca ConfigMap. The evaluate stage will reach Keycloak
      and the agent frontends but fail every HTTPS call with
      CERTIFICATE_VERIFY_FAILED, which scores as an agent failure rather
      than as the trust gap it is. Run `make d1 install openshift-oauth`
      first, then re-run.
  when: (_mlops_gate_ca_cm.resources | default([]) | length) == 0

- name: "mlops | copy the acceptance-gate credentials into zuno-mlops so the evaluate stage can authenticate"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: acceptance-gate-credentials
        namespace: zuno-mlops
        labels:
          zuno.io/managed-by: zuno-ansible
      type: Opaque
      data: >-
        {{ {'demo-persona-password': _mlops_demo_password_secret.resources[0].data.password}
           | combine(dict(_mlops_client_secrets
                          | map(attribute='metadata.name')
                          | zip(_mlops_client_secrets
                                | map(attribute='data.client_secret')))) }}
  no_log: true
  when: >-
    (_mlops_demo_password_secret.resources | default([]) | length) > 0 and
    (_mlops_client_secrets | default([]) | length) > 0

- name: "mlops | warn if the acceptance-gate credentials could not be copied"
  ansible.builtin.debug:
    msg: >-
      demo-personas-password / <agent>-frontend-client-secret not found in
      zuno-auth, so zuno-mlops has no acceptance-gate-credentials Secret.
      Every pipeline stage will fail to start (the KFP task references that
      Secret by name). Re-run `make d0 install keycloak` first, then re-run this.
  when: >-
    (_mlops_demo_password_secret.resources | default([]) | length) == 0 or
    (_mlops_client_secrets | default([]) | length) == 0

- name: "mlops | configure summary (DSPA)"
  ansible.builtin.debug:
    msg: >-
      mlops-dspa DataSciencePipelinesApplication has reported Ready in
      zuno-mlops. The pipeline itself is triggered manually by the
      operator (`oc create -f <run-spec>` against the DSPA's KFP API, or
      the OpenShift AI dashboard) once per candidate agent/base-model
      combination - unlike rag-ingestion, MLOps training runs are not
      continuously recurring (ADR-0302's own scope: one pipeline run
      produces one candidate adapter for human-reviewed promotion), so
      this role does not attempt recurring-run activation the way
      ansible/roles/rag_ingestion does.

# --- KFP pipeline-upload confirmation (best-effort, UNVERIFIED against a
# live cluster) -------------------------------------------------------
# Confirms the Pipeline CR's identity is actually queryable through the
# DSPA's own v2beta1 HTTP API - the "KFP pipeline upload" half of this
# WP's own Goal statement - without creating a recurring run (see the
# debug message above for why). A failure here only skips this
# confirmation step, never fails the rest of `make d2 install mlops`.
- name: "mlops | resolve the caller's OpenShift bearer token for the DSPA API"
  ansible.builtin.command: oc whoami -t
  environment: "{{ k8s_auth_environment | default({}) }}"
  register: _mlops_oc_token
  changed_when: false
  ignore_errors: true

- name: "mlops | look up the mlops-dspa API server Route"
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    namespace: zuno-mlops
    # ds-pipeline-<dspa-name> is the DSPA operator's own Route-naming
    # convention (unverified against a live cluster - confirm with `oc
    # get route -n zuno-mlops`, same assumption
    # ansible/roles/rag_ingestion/tasks/install.yml documents).
    name: "ds-pipeline-mlops-dspa"
  register: _mlops_dspa_route
  ignore_errors: true

- name: "mlops | confirm the mlops pipeline is registered on the DSPA API"
  when: >-
    (_mlops_dspa_route.resources | default([]) | length) > 0 and
    (_mlops_oc_token.stdout | default('') | trim) != ''
  block:
    - name: "mlops | list pipelines on the DSPA API server"
      ansible.builtin.uri:
        url: "https://{{ _mlops_dspa_route.resources[0].spec.host }}/apis/v2beta1/pipelines"
        headers:
          Authorization: "Bearer {{ _mlops_oc_token.stdout | trim }}"
        validate_certs: false
        status_code: [200]
        return_content: true
      register: _mlops_pipelines_list

    # WP-087: this used to compare display_name against 'mlops'. The CR's
    # displayName is "MLOps: dataset-to-model LoRA/PEFT pipeline", so the
    # check could NEVER pass - and its own rescue swallowed the failure, so
    # it reported nothing wrong for as long as it existed. Match on the
    # object NAME, which is what the chart actually sets to
    # .Values.pipeline.name, and accept either the base CR or a per-agent
    # one (ADR-0526 added the latter so compiled versions have a Pipeline
    # to attach to).
    - name: "mlops | fail loudly if no mlops pipeline is registered"
      ansible.builtin.fail:
        msg: >-
          No pipeline named "mlops" or "mlops-<agent>" found via the DSPA
          API - the Pipeline CRs
          (gitops/charts/mlops/templates/pipeline.yaml) may not have synced
          yet, or KFP has not finished indexing them. Re-run `make d2
          install mlops` once ArgoCD reports the Application Healthy.
      when: >-
        not ((_mlops_pipelines_list.json.pipelines | default([]))
             | selectattr('name', 'defined')
             | selectattr('name', 'match', '^mlops(-.+)?$')
             | list | length > 0)

    - name: "mlops | configure summary (pipeline registered)"
      ansible.builtin.debug:
        msg: "mlops pipeline confirmed registered on the mlops-dspa KFP API."
  rescue:
    - name: "mlops | pipeline-registration confirmation failed - not fatal"
      ansible.builtin.debug:
        msg: >-
          Could not confirm pipeline registration via the DSPA API (see
          the task output above for the actual HTTP error). This does
          not block the rest of the install - confirm manually via the
          OpenShift AI dashboard instead.
          WP-07-UNVERIFIED-ASSUMPTION(1/1) Route naming: assumed the DSPA
          API server Route is named "ds-pipeline-mlops-dspa". Confirm
          with `oc get route -n zuno-mlops | grep ds-pipeline` and
          correct the "look up the mlops-dspa API server Route" task
          above if it differs.

- name: "mlops | skip pipeline-registration confirmation if the Route or token could not be resolved"
  ansible.builtin.debug:
    msg: >-
      Skipping pipeline-registration confirmation: could not resolve
      {{ 'the DSPA Route' if (_mlops_dspa_route.resources | default([]) | length) == 0 else 'an OpenShift bearer token (oc whoami -t)' }}.
      Confirm manually via the OpenShift AI dashboard, or re-run
      `make d2 install mlops` once `oc login` is active and the Route exists.
  when: >-
    (_mlops_dspa_route.resources | default([]) | length) == 0 or
    (_mlops_oc_token.stdout | default('') | trim) == ''
