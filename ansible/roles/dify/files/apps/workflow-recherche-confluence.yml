# Confluence search Workflow (zuno-demo ADR-0599, WP-208): a topic goes in, the MCP tool confluence.page.search runs
# through the token proxy, an LLM summarises the hits. configure.py replaces zuno-mcp-gateway.
app:
  description: Searches Confluence for a topic through the Zuno MCP gateway and summarises the pages found.
  icon: "\U0001F50E"
  icon_background: '#D1E9FF'
  icon_type: emoji
  mode: workflow
  name: Zuno Confluence Search
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload: {enabled: false}
    opening_statement: ''
    retriever_resource: {enabled: false}
    sensitive_word_avoidance: {enabled: false}
    speech_to_text: {enabled: false}
    suggested_questions: []
    suggested_questions_after_answer: {enabled: false}
    text_to_speech: {enabled: false, language: '', voice: ''}
  graph:
    edges:
      - {id: start-search, source: start, sourceHandle: source, target: search, targetHandle: target, type: custom, data: {sourceType: start, targetType: tool, isInIteration: false}}
      - {id: search-llm, source: search, sourceHandle: source, target: llm, targetHandle: target, type: custom, data: {sourceType: tool, targetType: llm, isInIteration: false}}
      - {id: llm-end, source: llm, sourceHandle: source, target: end, targetHandle: target, type: custom, data: {sourceType: llm, targetType: end, isInIteration: false}}
    nodes:
      - id: start
        type: custom
        position: {x: 80, y: 282}
        positionAbsolute: {x: 80, y: 282}
        width: 244
        height: 90
        sourcePosition: right
        targetPosition: left
        data:
          type: start
          title: Start
          desc: ''
          selected: false
          variables:
            - {variable: topic, label: Topic, type: text-input, required: true, max_length: 200, options: []}
      - id: search
        type: custom
        position: {x: 380, y: 282}
        positionAbsolute: {x: 380, y: 282}
        width: 244
        height: 54
        sourcePosition: right
        targetPosition: left
        data:
          type: tool
          title: confluence.page.search
          desc: ''
          selected: false
          provider_id: zuno-mcp-gateway
          provider_name: zuno-mcp-gateway
          provider_type: mcp
          tool_name: confluence.page.search
          tool_label: confluence.page.search
          tool_configurations: {}
          tool_parameters:
            query: {type: variable, value: [start, topic]}
      - id: llm
        type: custom
        position: {x: 680, y: 282}
        positionAbsolute: {x: 680, y: 282}
        width: 244
        height: 98
        sourcePosition: right
        targetPosition: left
        data:
          type: llm
          title: Summarise
          desc: ''
          selected: false
          model:
            provider: langgenius/openai_api_compatible/openai_api_compatible
            name: auto
            mode: chat
            completion_params: {temperature: 0.2, max_tokens: 3072}
          prompt_template:
            - id: 00000000-0000-4000-8000-000000000002
              role: system
              text: |-
                List the Confluence pages found for the topic "{{#start.topic#}}": one line per page with its title
                and its space, exactly as they appear in the search result. Add nothing that is not in the result:
                no description of the content, no guess from a title. If nothing was found, say so. Search result:
                {{#search.text#}}
          context: {enabled: false, variable_selector: []}
          vision: {enabled: false}
          memory: null
      - id: end
        type: custom
        position: {x: 980, y: 282}
        positionAbsolute: {x: 980, y: 282}
        width: 244
        height: 54
        sourcePosition: right
        targetPosition: left
        data:
          type: end
          title: End
          desc: ''
          selected: false
          outputs:
            - {variable: summary, value_selector: [llm, text]}
    viewport: {x: 0, y: 0, zoom: 1}
