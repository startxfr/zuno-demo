---
# Realm users are create-only (see roles/openclaw/tasks/keycloak_sa_groups.yml): the service
# account of the dify client is given the persona's groups live and idempotently, so the
# mcp-gateway entitlement (ADR-0040) and the quotas see them.
- name: "dify | read the Keycloak automation credentials (ADR-0595)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/read_keycloak_automation_credentials.yml"

- name: "dify | get a Keycloak admin token"
  ansible.builtin.uri:
    url: "https://keycloak.{{ cluster_base_domain }}/realms/master/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: admin-cli
      username: "{{ _kc_automation_user }}"
      password: "{{ _kc_automation_password }}"
    validate_certs: false
  register: _dify_kc_token
  no_log: true

- name: "dify | set the admin API facts"
  ansible.builtin.set_fact:
    _kc_api: "https://keycloak.{{ cluster_base_domain }}/admin/realms/{{ dify_keycloak_realm }}"
    _kc_headers:
      Authorization: "Bearer {{ _dify_kc_token.json.access_token }}"
  no_log: true

- name: "dify | find the client dify"
  ansible.builtin.uri:
    url: "{{ _kc_api }}/clients?clientId=dify"
    headers: "{{ _kc_headers }}"
    validate_certs: false
  register: _kc_client
  no_log: true

- name: "dify | fail when the client is not in the live realm yet"
  ansible.builtin.fail:
    msg: "Keycloak client dify does not exist in realm {{ dify_keycloak_realm }}: sync zuno-keycloak-d1 or run `make d0 install keycloak`."
  when: _kc_client.json | length == 0

- name: "dify | read the service-account user and the persona"
  ansible.builtin.uri:
    url: "{{ item }}"
    headers: "{{ _kc_headers }}"
    validate_certs: false
  loop:
    - "{{ _kc_api }}/clients/{{ _kc_client.json[0].id }}/service-account-user"
    - "{{ _kc_api }}/users?username={{ dify_persona }}&exact=true"
  register: _kc_users
  no_log: true

- name: "dify | read both group memberships"
  ansible.builtin.uri:
    url: "{{ _kc_api }}/users/{{ item }}/groups?max=500"
    headers: "{{ _kc_headers }}"
    validate_certs: false
  loop:
    - "{{ _kc_users.results[0].json.id }}"
    - "{{ _kc_users.results[1].json[0].id }}"
  register: _kc_groups
  no_log: true

- name: "dify | add the missing groups to service-account-dify"
  ansible.builtin.uri:
    url: "{{ _kc_api }}/users/{{ _kc_users.results[0].json.id }}/groups/{{ item.id }}"
    method: PUT
    headers: "{{ _kc_headers }}"
    status_code: [204]
    validate_certs: false
  loop: "{{ _kc_groups.results[1].json | rejectattr('id', 'in', _kc_groups.results[0].json | map(attribute='id') | list) | list }}"
  loop_control:
    label: "{{ item.path }}"
  changed_when: true
