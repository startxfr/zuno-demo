---
# ADR-0599 (WP-204): Dify's Vault paths, seeded only when missing (vault_seed_if_missing.yml
# never overwrites a value a consumer may cache). keycloak/dify and dify/postgresql-app are also
# seeded by the vault role (Day 0); whichever runs first wins. dify/s3 is seeded by the vault role
# from confidential.yml and only read here.
- name: "dify | locate the Vault server pod"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: zuno-vault
    label_selectors:
      - "app.kubernetes.io/name=vault"
      - "component=server"
  register: _vault_pod

# ADR-0602 clause 1 / WP-223: a short-lived ansible-seeder token
# (zuno_vault_token, read by vault_seed_if_missing.yml), not the root token
# from vault-bootstrap-credentials; the helper fails if Vault is not running.
- name: "dify | log in to Vault as ansible-seeder"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_login.yml"

- name: "dify | seed the Keycloak client secret (idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  vars:
    vault_seed_path: keycloak/dify
    vault_seed_fields:
      client_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"

# secret_key signs sessions and encrypts what Dify stores (provider credentials): losing it makes
# the stored credentials unreadable, hence create-if-missing only. plugin_daemon_key and
# inner_api_key authenticate api <-> plugin-daemon in both directions. front_door_cookie_secret
# is oauth2-proxy's (exactly 32 bytes).
- name: "dify | seed the application secrets (idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  vars:
    vault_seed_path: dify/app
    vault_seed_fields:
      secret_key: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}"
      plugin_daemon_key: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}"
      inner_api_key: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}"
      front_door_cookie_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"

# Letters and digits only: interpolated un-encoded into the Celery broker URL.
- name: "dify | seed the Redis password (idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  vars:
    vault_seed_path: dify/redis
    vault_seed_fields:
      password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"

# The static bearer Dify presents to the External Knowledge adapter (WP-205). Create-if-missing:
# the Dify registration stores a copy, so a rotation is a deliberate act (re-register the API).
- name: "dify | seed the External Knowledge adapter key (idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  vars:
    vault_seed_path: dify/knowledge-api
    vault_seed_fields:
      api_key: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}"

# WP-225 lot C: the key Dify's providers and the knowledge adapter present to the token proxy
# (one key per line, so a rotation can list the new key next to the old one). Create-if-missing:
# Dify stores a copy in its provider credentials.
- name: "dify | seed the token proxy inbound key (idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  when: dify_token_proxy_inbound_auth | bool
  vars:
    vault_seed_path: dify/token-proxy
    vault_seed_fields:
      inbound_keys: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}"

# Dify's single local administrator (ADR-0599, decision 2026-11-05): the shared demo password of
# ADR-0595 (zuno_admin_dify_admin_password), email fixed. Seed-only-missing, like every path here:
# a changed password reaches Dify through the configuration step, not through this seed.
# ADR-0602 / WP-223: in the hardened profile zuno_admin_dify_admin_password is undefined
# on purpose, so the random default below applies (read it back from Vault zuno/dify/admin).
# The trailing 1 is not decoration: Dify refuses a password without a digit, and 23
# random letters/digits can come out digit-free.
- name: "dify | seed the local administrator account (idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  vars:
    vault_seed_path: dify/admin
    vault_seed_fields:
      email: "dify-admin@zuno.local"
      password: "{{ zuno_admin_dify_admin_password |
        default(lookup('ansible.builtin.password', '/dev/null', length=23, chars=['ascii_letters', 'digits']) ~ '1') }}"
