---
# ADR-0599 (WP-204): Dify's Vault paths, seeded only when missing (vault_seed_if_missing.yml
# never overwrites a value a consumer may cache). keycloak/dify and dify/postgresql-app are also
# seeded by the vault role (Day 0); whichever runs first wins. dify/s3 is seeded by the vault role
# from confidential.yml and only read here.
- name: "dify | locate the Vault server pod"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: zuno-vault
    label_selectors:
      - "app.kubernetes.io/name=vault"
      - "component=server"
  register: _vault_pod

- name: "dify | read the Vault bootstrap credentials"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: zuno-vault
    name: vault-bootstrap-credentials
  register: _dify_vault_creds
  no_log: true

- name: "dify | fail if Vault isn't bootstrapped"
  ansible.builtin.fail:
    msg: >-
      vault-bootstrap-credentials not found in zuno-vault - run
      `make d0 install vault` first.
  when: >-
    (_vault_pod.resources | default([]) | length) == 0 or
    (_dify_vault_creds.resources | default([]) | length) == 0

- name: "dify | set the Vault connection fact"
  ansible.builtin.set_fact:
    _vault_root_token: "{{ _dify_vault_creds.resources[0].data.root_token | b64decode }}"
  no_log: true

- name: "dify | seed the Keycloak client secret (idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  vars:
    vault_seed_path: keycloak/dify
    vault_seed_fields:
      client_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"

# secret_key signs sessions and encrypts what Dify stores (provider credentials): losing it makes
# the stored credentials unreadable, hence create-if-missing only. plugin_daemon_key and
# inner_api_key authenticate api <-> plugin-daemon in both directions. front_door_cookie_secret
# is oauth2-proxy's (exactly 32 bytes).
- name: "dify | seed the application secrets (idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  vars:
    vault_seed_path: dify/app
    vault_seed_fields:
      secret_key: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}"
      plugin_daemon_key: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}"
      inner_api_key: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}"
      front_door_cookie_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"

# Letters and digits only: interpolated un-encoded into the Celery broker URL.
- name: "dify | seed the Redis password (idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  vars:
    vault_seed_path: dify/redis
    vault_seed_fields:
      password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
