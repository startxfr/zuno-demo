---
dify_namespace: zuno-dify
# ADR-0599 / user decision 2026-11-04: the dedicated S3 bucket comes from confidential.yml
# (zuno_dify_s3_*, placeholders "xxxxxx" in confidential.example.yml); install fails clearly
# while they are unset, because the chart has no other storage (the api PVC is ignored with S3).
dify_s3_vars_required:
  - zuno_dify_s3_bucket_name
  - zuno_dify_s3_region
  - zuno_dify_s3_access_key_id
  - zuno_dify_s3_secret_access_key
# Open PyPI in the EgressFirewall for the plugin install window (WP-203 section 3), then close
# it again. `make d2 install dify` sets it on the first install and for a plugin upgrade; the
# steady state is false.
dify_plugin_install_window: false
# The headers the token proxy sets (ADR-0601 decision 3): the experience name, the task, and the
# data classification of each upstream (ADR-0594; same split as Open WebUI).
dify_ai_headers:
  X-Zuno-Agent: dify
  X-Zuno-Task: chat
  X-Zuno-Data-Classification: C1
dify_mcp_headers:
  X-Zuno-Agent: dify
  X-Zuno-Task: chat
  X-Zuno-Data-Classification: C2
# ADR-0601 decision 5: the dify Keycloak client is the persona consultant-02. Realm users are
# create-only, so the service account gets the persona's groups live (keycloak_sa_groups.yml).
dify_persona: consultant-02
dify_keycloak_realm: zuno
dify_admin_email: dify-admin@zuno.local
dify_plugin_version: "0.0.73"
dify_plugin_sha256: a3c6524f183083e0f6f57ac50f201700fd019e786bd1971249ef086adcb70008
dify_models:
  - { name: auto, mode: chat, context: 128000 }
  - { name: zuno-code, mode: chat, context: 32000 }
# WP-205: the External Knowledge API and the one knowledge base registered in Dify. kb_id is the
# knowledge_id Dify sends to the adapter (KNOWLEDGE_BASES of gitops/charts/zuno-dify-knowledge).
dify_knowledge:
  api_name: Zuno knowledge adapter
  endpoint: http://zuno-dify-knowledge:8080
  kb_name: Zuno technical documentation
  kb_id: tech
  top_k: 5
  score_threshold: 0.0

# Names of example applications to delete and import again from files/apps/ (use after editing a DSL):
#   make d2 install dify -e '{"dify_reimport_apps": ["Zuno Confluence Search"]}'
dify_reimport_apps: []
