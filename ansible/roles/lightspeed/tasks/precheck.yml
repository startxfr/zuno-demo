---
# State detection (never fails). Only the operator half is checked here -
# OLSConfig belongs to the lightspeed_config role's own precheck.
- name: "lightspeed | check the lightspeed Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-lightspeed-d0"

- name: "lightspeed | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: "{{ _state_check_result }}"

- name: "lightspeed | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
