---
# ADR-0524 clause 7 (WP-085 step 1): installs the OpenShift Lightspeed
# operator ONLY - namespace, OperatorGroup, Subscription. It has no
# dependency beyond OLM, which is why it can sit in Day 1 at all.
#
# This role deliberately does NOT create OLSConfig. That operand is the Day 2
# "lightspeed_config" role's job: an OLSConfig created here would reference a
# model provider (MaaS entitlement, Day 2 `models`) and an MCP endpoint (the
# /mcp front-door, Day 2 `mcp`) that do not exist yet, and would sit Degraded
# for the entire Day 2 window while ArgoCD self-heals it back.
#
# Package name/default channel confirmed live against this cluster's
# redhat-operators catalog on 2026-08-26: "lightspeed-operator",
# defaultChannel "stable", currentCSV "lightspeed-operator.v1.1.2",
# InstallModes OwnNamespace only. Still discovered from the PackageManifest
# rather than hardcoded (ADR-0048), same pattern as every other
# operator-backed role in this repo.
- name: "lightspeed | look up the {{ lightspeed_package_name | default('lightspeed-operator') }} PackageManifest"
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    namespace: openshift-marketplace
    name: "{{ lightspeed_package_name | default('lightspeed-operator') }}"
  register: _lightspeed_pkg_info

- name: "lightspeed | fail if the package isn't published anywhere on this cluster"
  ansible.builtin.fail:
    msg: >-
      No PackageManifest named
      '{{ lightspeed_package_name | default('lightspeed-operator') }}' was found
      in openshift-marketplace. Check `oc get packagemanifest -n
      openshift-marketplace | grep -i lightspeed` for the correct package name
      on this cluster (note: "ansible-lightspeed" is a DIFFERENT product, the
      AAP one from ADR-0354 - do not subscribe to it here); re-run with `-e
      lightspeed_package_name=<name>` or update this role's default.
  when: (_lightspeed_pkg_info.resources | default([]) | length) == 0

- name: "lightspeed | select the catalog/channel to subscribe from"
  ansible.builtin.set_fact:
    _lightspeed_catalog_source: "{{ _lightspeed_pkg_info.resources[0].status.catalogSource }}"
    _lightspeed_channel: >-
      {{
        'stable'
        if (_lightspeed_pkg_info.resources[0].status.channels | selectattr('name', 'equalto', 'stable') | list | length) > 0
        else (_lightspeed_pkg_info.resources[0].status.defaultChannel | default(''))
      }}

- name: "lightspeed | fail if no usable channel was found"
  ansible.builtin.fail:
    msg: >-
      Package '{{ lightspeed_package_name | default('lightspeed-operator') }}'
      (catalog '{{ _lightspeed_catalog_source }}') has no "stable" channel and
      no defaultChannel to fall back to. Published channels:
      {{ _lightspeed_pkg_info.resources[0].status.channels | map(attribute='name') | list }}.
  when: _lightspeed_channel | length == 0

- name: "lightspeed | discovery summary"
  ansible.builtin.debug:
    msg: >-
      Subscribing to package
      '{{ lightspeed_package_name | default('lightspeed-operator') }}',
      catalog '{{ _lightspeed_catalog_source }}',
      channel '{{ _lightspeed_channel }}'.

- name: "lightspeed | apply the lightspeed GitOps Application (d0: namespace + operator)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "lightspeed"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-lightspeed-d0"
    gitops_app_extra_helm_values:
      # project.enabled: true must be repeated here even though
      # application-d0.yaml already sets it - gitops_app_extra_helm_values
      # REPLACES spec.source.helm.values wholesale rather than merging (same
      # gotcha ansible/roles/lws and ansible/roles/keycloak both document).
      project:
        enabled: true
      operator:
        enabled: true
        subscription:
          operator:
            channel: "{{ _lightspeed_channel }}"
            source:
              name: "{{ _lightspeed_catalog_source }}"
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 15

- name: "lightspeed | apply the lightspeed GitOps Application (d1, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "lightspeed"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-lightspeed-d1"
