---
# Reverse of install.yml: delete d1 (operand CR + queue resources) first, then
# remove_operator.yml (needs the Subscription to still exist) before d0's delete.
#
# Queue resources (ClusterQueue/LocalQueue/ResourceFlavor) are deleted directly
# here, before the d1 Application, while the Kueue operand is still alive. This
# avoids a deadlock: ArgoCD's cascade delete doesn't reliably honor sync-wave
# order, so deleting the whole Application in one shot can tear down the operand
# (and its webhook Service) before the queue resources finish deleting - and
# their `resource-in-use` finalizer can then only be cleared by the now-dead
# controller. Deleting in dependency order here (LocalQueue before ClusterQueue
# before ResourceFlavor) lets the still-running operand clear that finalizer
# normally, so the d1 delete below only has to prune the operand CR itself.
#
# api_version v1beta2 is the CRDs' storage version (avoids a conversion-webhook
# round-trip, same reasoning as precheck.yml). Names/namespaces are hardcoded to
# match gitops/charts/kueue/values.yaml's queueResources defaults (this role has
# no defaults/main.yml); `state: absent` is a safe no-op if never enabled.
# ADR-0538/WP-117 widened that list: two LocalQueue namespaces, and a second
# ResourceFlavor for the GPU/MIG quota. Both are listed here rather than looped
# over a variable for the same reason the names are hardcoded - keeping the
# teardown readable and independent of the chart's values at uninstall time.
- name: "kueue | delete the default LocalQueues (queue resources, before the operand)"
  kubernetes.core.k8s:
    state: absent
    api_version: kueue.x-k8s.io/v1beta2
    kind: LocalQueue
    name: default
    namespace: "{{ item }}"
    wait: true
  loop:
    - zuno-ai-build
    - zuno-ai-run

- name: "kueue | delete the default ClusterQueue (queue resources, before the operand)"
  kubernetes.core.k8s:
    state: absent
    api_version: kueue.x-k8s.io/v1beta2
    kind: ClusterQueue
    name: default
    wait: true

# ResourceFlavors last of the three: a flavor referenced by a live ClusterQueue
# carries the same `resource-in-use` finalizer the header describes, so the
# queue above must go first.
- name: "kueue | delete the ResourceFlavors (queue resources, before the operand)"
  kubernetes.core.k8s:
    state: absent
    api_version: kueue.x-k8s.io/v1beta2
    kind: ResourceFlavor
    name: "{{ item }}"
    wait: true
  loop:
    - default
    - gpu-mig

- name: "kueue | delete the kueue GitOps Application (d1: operand CR + queue resources)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-kueue-d1"

- name: "kueue | remove the operator (its owned CRDs then the CSV then the Subscription)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/remove_operator.yml"
  vars:
    operator_subscription_name: "{{ kueue_package_name | default('kueue-operator') }}"
    operator_namespace: openshift-operators

- name: "kueue | delete the kueue GitOps Application (d0: the Subscription itself)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-kueue-d0"
