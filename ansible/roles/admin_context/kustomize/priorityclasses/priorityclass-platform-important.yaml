apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: zuno-platform-important
  labels:
    zuno.io/managed-by: zuno-ansible
value: 10000
globalDefault: false
description: >-
  For platform infrastructure the platform depends on but that isn't in the
  critical failure path of auth/secrets/data/GitOps (observability/tracing
  pipeline today; node feature discovery, the GPU operator, OpenShift AI,
  ArgoCD, cert-manager and External Secrets are candidates once their
  operator-managed pod specs are confirmed) - above zuno-workload-default,
  preemptable ahead of zuno-platform-critical.
