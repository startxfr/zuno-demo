---
# The StorageClass check has nothing to undo; the zuno AppProject is
# deleted by argocd's own uninstall.yml since it's applied there too.
- name: "admin_context | delete the PriorityClasses"
  kubernetes.core.k8s:
    state: absent
    api_version: scheduling.k8s.io/v1
    kind: PriorityClass
    name: "{{ pc_name }}"
  loop_control:
    loop_var: pc_name
  loop:
    - zuno-platform-critical
    - zuno-platform-important
    - zuno-platform-weak
    - zuno-workload-default
