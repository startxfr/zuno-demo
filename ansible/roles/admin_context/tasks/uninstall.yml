---
# Reverse of install.yml. The StorageClass check has nothing to undo. The
# zuno AppProject is deleted by the argocd role's own uninstall.yml now
# (it applies it, in argocd's install.yml) - see that file's comment.
- name: "admin_context | delete the PriorityClasses"
  kubernetes.core.k8s:
    state: absent
    api_version: scheduling.k8s.io/v1
    kind: PriorityClass
    name: "{{ pc_name }}"
  loop_control:
    loop_var: pc_name
  loop:
    - zuno-platform-critical
    - zuno-workload-default
