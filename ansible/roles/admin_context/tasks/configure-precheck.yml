---
# State detection (never fails). admin_context's configure.yml re-applies
# the same PriorityClasses/AppProject install.yml does (idempotent
# re-sync, not a distinct second object) - "configured" mirrors
# "installed" here: the zuno AppProject present and Established.
- name: "admin_context | look up the zuno AppProject"
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: AppProject
    namespace: openshift-gitops
    name: zuno
  register: _admin_context_appproject_lookup

- name: "admin_context | compute configure state"
  ansible.builtin.set_fact:
    _state_is_configured: "{{ (_admin_context_appproject_lookup.resources | default([]) | length) > 0 }}"

- name: "admin_context | record configure state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_configure_state.yml"
