---
# State detection (never fails). admin_context's configure.yml re-applies
# the same PriorityClasses install.yml does (idempotent re-sync, not a
# distinct second object) and has nothing else of its own to configure
# (the zuno AppProject moved to the argocd role - see that role's
# install.yml) - "configured" mirrors "installed" here.
- name: "admin_context | look up the PriorityClasses"
  kubernetes.core.k8s_info:
    api_version: scheduling.k8s.io/v1
    kind: PriorityClass
    name: "{{ pc_name }}"
  register: _admin_context_pc_lookup
  loop:
    - zuno-platform-critical
    - zuno-workload-default
  loop_control:
    loop_var: pc_name
    label: "{{ pc_name }}"

- name: "admin_context | compute configure state"
  ansible.builtin.set_fact:
    _state_is_configured: >-
      {{
        (_admin_context_pc_lookup.results | selectattr('resources', 'defined') | selectattr('resources', 'equalto', []) | list | length) == 0
      }}

- name: "admin_context | record configure state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_configure_state.yml"
