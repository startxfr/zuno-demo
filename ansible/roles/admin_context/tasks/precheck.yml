---
# admin_context is a bootstrap role with no ArgoCD Application; installed
# state is detected from the four PriorityClasses it applies directly.
- name: "admin_context | look up the PriorityClasses"
  kubernetes.core.k8s_info:
    api_version: scheduling.k8s.io/v1
    kind: PriorityClass
    name: "{{ pc_name }}"
  register: _admin_context_pc_lookup
  loop:
    - zuno-platform-critical
    - zuno-platform-important
    - zuno-platform-weak
    - zuno-workload-default
  loop_control:
    loop_var: pc_name
    label: "{{ pc_name }}"

- name: "admin_context | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        (_admin_context_pc_lookup.results | selectattr('resources', 'defined') | selectattr('resources', 'equalto', []) | list | length) == 0
      }}

- name: "admin_context | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
