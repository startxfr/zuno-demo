---
# State detection (never fails).
- name: "admin_context | check the admin-context Application (d0: PriorityClasses)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-admin-context-d0"

- name: "admin_context | save the d0 check result"
  ansible.builtin.set_fact:
    _admin_context_d0_installed: "{{ _state_check_result }}"

- name: "admin_context | check the admin-context Application (d1: startx HelmChartRepository)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-admin-context-d1"

- name: "admin_context | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: "{{ _admin_context_d0_installed and _state_check_result }}"

- name: "admin_context | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
