---
# AdminContext (ADR-0056): cluster-admin-level objects every other Day 0
# component implicitly depends on (a default StorageClass for PVC-backed
# workloads like Vault/PostgreSQL, PriorityClasses so platform/operator
# pods aren't preempted under node pressure) - positioned first in the
# Day 0 sequence, before argocd.
#
# StorageClass is discover-only, never invented: this repository has no
# way to know a given cluster's actual storage provisioner (AWS EBS/gp3,
# ODF, etc.), so rather than guess parameters that would be wrong on most
# clusters, this only verifies at least one exists and fails with a clear
# diagnostic naming what to do next if none does.
- name: "admin_context | discover existing StorageClasses"
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
  register: _admin_context_storageclasses

- name: "admin_context | fail if no StorageClass exists on this cluster"
  ansible.builtin.fail:
    msg: >-
      No StorageClass found on this cluster. Every PVC-backed Day 0
      component (Vault, PostgreSQL) needs at least a default
      StorageClass - provision one for your cloud/storage backend before
      continuing (this repository deliberately does not invent
      provisioner-specific parameters here, since they vary per cluster).
  when: (_admin_context_storageclasses.resources | default([]) | length) == 0

# ADR-0310: PriorityClass definitions live in
# ansible/roles/admin_context/kustomize/priorityclasses/ rather than being
# hand-inlined here.
- name: "admin_context | apply the PriorityClasses"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/admin_context/kustomize/priorityclasses"

# The zuno AppProject is applied by the argocd role's own install.yml, not
# here: its CRD (appprojects.argoproj.io) doesn't exist until that role's
# install.yml has subscribed the GitOps operator and it has reconciled,
# and admin_context runs before argocd in the Day 0 sequence.
#
# The zuno-argocd-application-controller-admin ClusterRoleBinding lookup
# below is a consolidation/visibility point, not a new grant - admin_context
# runs first in the Day 0 sequence (before argocd even installs the
# operator), so on a fresh cluster this binding legitimately does not
# exist yet the first time this role runs; that is expected, not an error.
- name: "admin_context | look up the ArgoCD application-controller ClusterRoleBinding"
  kubernetes.core.k8s_info:
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    name: zuno-argocd-application-controller-admin
  register: _admin_context_argocd_crb

- name: "admin_context | prepare summary"
  ansible.builtin.debug:
    msg: >-
      {{ _admin_context_storageclasses.resources | length }} StorageClass(es)
      found; zuno-platform-critical/zuno-workload-default PriorityClasses
      applied. zuno-argocd-application-controller-admin ClusterRoleBinding:
      {{ 'present (created by the argocd role)' if (_admin_context_argocd_crb.resources | default([]) | length) > 0
         else 'not present yet - expected before `make d0 install argocd` has run once' }}.
