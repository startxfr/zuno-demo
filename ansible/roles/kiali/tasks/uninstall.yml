---
# Reverse of install.yml: delete -d1 first (avoids ArgoCD fighting a CR
# deletion - this also cascades the Kiali operator's auto-created Route),
# then remove_operator.yml (needs the Subscription to still exist) before
# -d0's own delete.
- name: "kiali | delete the kiali GitOps Application (d1: Kiali CR instance)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-kiali-d1"

- name: "kiali | remove the operator (its owned CRDs - cascading the Kiali instance and its Route - then the CSV, then the Subscription)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/remove_operator.yml"
  vars:
    operator_subscription_name: kiali-ossm
    operator_namespace: openshift-kiali-operator

- name: "kiali | delete the kiali GitOps Application (d0: cascades the remaining OperatorGroup/Namespace)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-kiali-d0"
