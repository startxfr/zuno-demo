---
# State detection (never fails).
- name: "kiali | check the kiali Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-kiali-d0"

- name: "kiali | save the d0 check result"
  ansible.builtin.set_fact:
    _kiali_d0_installed: "{{ _state_check_result }}"

- name: "kiali | check the kiali Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-kiali-d1"

- name: "kiali | look up the Kiali Deployment"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: zuno-mesh
    name: kiali
  register: _kiali_deploy_lookup

- name: "kiali | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        _kiali_d0_installed and _state_check_result
        and (_kiali_deploy_lookup.resources | default([]) | length) > 0
        and (_kiali_deploy_lookup.resources[0].status.readyReplicas | default(0)) > 0
      }}

- name: "kiali | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
