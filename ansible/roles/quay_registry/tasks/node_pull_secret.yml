---
# ADR-0612 addendum 2026-11-14 / WP-261 family (e). The Red Hat product images sit in PRIVATE repositories (the route is
# reachable from the Internet and Red Hat content is not redistributed), so the nodes need the pull robot for the registry
# host in the global pull secret before the zuno-redhat-via-registry ImageDigestMirrorSet sends them there. The MCO applies
# a pull secret change with no drain and no reboot (MachineConfiguration/cluster nodeDisruptionPolicyStatus:
# /var/lib/kubelet/config.json -> None). Only the registry host's entry is added or replaced; every other entry is kept.
# Runs after bootstrap.yml, which sets _quay_registry_host and reads the robot tokens into _quay_registry_robots.
- name: "quay_registry | node pull secret | read openshift-config/pull-secret"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: openshift-config
    name: pull-secret
  register: _quay_global_pull_secret
  failed_when: _quay_global_pull_secret.resources | length != 1
  no_log: true

- name: "quay_registry | node pull secret | build the pull robot entry"
  ansible.builtin.set_fact:
    _quay_global_auths: "{{ _quay_global_pull_secret.resources[0].data['.dockerconfigjson'] | b64decode | from_json }}"
    _quay_node_auth: "{{ (zuno_quay_organization ~ '+pull:' ~ _quay_registry_robots.results[0].json.token) | b64encode }}"
  no_log: true

- name: "quay_registry | node pull secret | add the pull robot for the registry host"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: pull-secret
        namespace: openshift-config
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {{ _quay_global_auths | combine({'auths': {_quay_registry_host: {'auth': _quay_node_auth}}}, recursive=True)
             | to_json | b64encode }}
  when: ((_quay_global_auths.auths | default({}))[_quay_registry_host] | default({})).auth | default('') != _quay_node_auth
  no_log: true

- name: "quay_registry | node pull secret | entry present for the registry host"
  ansible.builtin.debug:
    msg: "openshift-config/pull-secret holds {{ zuno_quay_organization }}+pull for {{ _quay_registry_host }} (no drain: MCO action None)"
