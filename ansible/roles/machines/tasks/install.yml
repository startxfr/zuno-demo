---
# GPU capacity (ADR-0351): MachineSets + MachineAutoscaler + ClusterAutoscaler
# via gitops/charts/machines. Ordered before nfd/nvidia_gpu in
# day0_install.yml so the permanent GPU node exists (or is provisioning) by
# the time nvidia_gpu waits for its ClusterPolicy to go ready.
- name: "machines | apply the machines GitOps Application (d0: MachineSets/autoscalers)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "machines"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-machines-d0"
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 15

- name: "machines | apply the machines GitOps Application (d1: noop placeholder)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "machines"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-machines-d1"
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 15

# First boot of a g7e node is ~8 min (EC2 boot + RHCOS ignition) and the
# node only becomes schedulable for GPU work after the NVIDIA driver build,
# but that later part is nvidia_gpu's wait, not this one's - here we only
# wait for the Machine to be Running and the Node Ready.
# WP-083: waits on every permanent inference MachineSet, not just
# zuno-gpu-a - same reason as precheck.yml's lookup. Waiting on one name
# would let this task report success with the second GPU node missing
# entirely. The label excludes zuno-gpu-burst-a (group gpu-burst), which
# is legitimately at 0 and would never satisfy a >0 wait. Both nodes boot
# concurrently, so the 40x20s budget still covers a two-node fleet.
- name: "machines | wait for the permanent GPU MachineSets to have their nodes available"
  kubernetes.core.k8s_info:
    api_version: machine.openshift.io/v1beta1
    kind: MachineSet
    namespace: openshift-machine-api
    label_selectors:
      - "machine.startx.io/group=gpu"
  register: _machines_gpu
  until: >-
    (_machines_gpu.resources | default([]) | length) > 0 and
    (_machines_gpu.resources | map(attribute='spec.replicas') | map('int') | sum) > 0 and
    (_machines_gpu.resources | map(attribute='status.availableReplicas', default=0)
       | map('int') | sum) ==
    (_machines_gpu.resources | map(attribute='spec.replicas') | map('int') | sum)
  retries: 40
  delay: 20
