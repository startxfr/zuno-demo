---
# ADR-0320. Depends on keycloak (the console-favorites-provisioner
# service-account client and its Vault-seeded secret) and openshift_oauth
# (mappingMethod: add, so a real login attaches to the User this CronJob
# pre-creates instead of duplicating it) - ordered after both in
# ansible/playbooks/day0_install.yml.
- name: "console_favorites_provisioning | apply the console-favorites-provisioning GitOps Application (d0: RBAC/Secret/ConfigMaps)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "console-favorites-provisioning"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-console-favorites-provisioning-d0"

- name: "console_favorites_provisioning | apply the console-favorites-provisioning GitOps Application (d1: CronJob)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "console-favorites-provisioning"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-console-favorites-provisioning-d1"
    # A CronJob's own Application never itself becomes "Healthy" from a
    # single completed run the way a Deployment does - ArgoCD reports
    # health from the CronJob object's existence, not job outcomes - so
    # this wait is short; per-run success/failure is a `make d0 check`/
    # `oc get jobs -n zuno-ai-run` concern, not a gitops-apply concern.
    gitops_app_wait_retries: 30
    gitops_app_wait_delay: 10
