---
# State detection (never fails).
- name: "console_favorites_provisioning | check the console-favorites-provisioning Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-console-favorites-provisioning-d0"

- name: "console_favorites_provisioning | save the d0 check result"
  ansible.builtin.set_fact:
    _cfp_d0_installed: "{{ _state_check_result }}"

- name: "console_favorites_provisioning | check the console-favorites-provisioning Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-console-favorites-provisioning-d1"

- name: "console_favorites_provisioning | look up the CronJob"
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: CronJob
    name: console-favorites-provisioning
    namespace: zuno-ai-run
  register: _cfp_cronjob_lookup

- name: "console_favorites_provisioning | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        _cfp_d0_installed
        and _state_check_result
        and (_cfp_cronjob_lookup.resources | default([]) | length) > 0
      }}

# Diagnostic only, not gating _state_is_installed above: whether the
# CronJob has ever actually run/succeeded is operational health, not
# install-state (same reasoning as install.yml's gitops_app_wait comment).
- name: "console_favorites_provisioning | report most recent run outcome (diagnostic only)"
  ansible.builtin.debug:
    msg: >-
      {{
        'CronJob not found yet.'
        if (_cfp_cronjob_lookup.resources | default([]) | length) == 0
        else 'Last schedule time: ' ~
          (_cfp_cronjob_lookup.resources[0].status.lastScheduleTime | default('never')) ~
          ', last successful time: ' ~
          (_cfp_cronjob_lookup.resources[0].status.lastSuccessfulTime | default('never')) ~
          '. Check `oc get jobs -n zuno-ai-run -l app.kubernetes.io/name=console-favorites-provisioning` for per-run detail.'
      }}

- name: "console_favorites_provisioning | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
