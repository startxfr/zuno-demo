apiVersion: datasciencecluster.opendatahub.io/v1
kind: DataScienceCluster
metadata:
  name: zuno-dsc
  labels:
    zuno.io/managed-by: zuno-ansible
spec:
  components:
    kserve:
      managementState: Managed
      # ADR-0047/ADR-0048 fix: RawDeployment, not Serverless.
      # serving.managementState: Removed disables KServe's Knative
      # integration entirely, so InferenceServices default to a
      # plain Kubernetes Deployment+Service instead of a Knative
      # Service. The previous value here (Managed +
      # name: knative-serving) implicitly required the Red Hat
      # OpenShift Service Mesh Operator, the Red Hat OpenShift
      # Serverless Operator (which owns the KNativeServing CR that
      # `name` referenced) and cert-manager - none of which this
      # repository ever installed, so this DataScienceCluster would
      # never actually have reached Ready on a real cluster (exactly
      # the failure mode ADR-0047 calls out: "failures identify the
      # missing dependency rather than surfacing later during
      # model/RAG deployment" - found by reading, not by hitting it
      # live). This demo's one model (gitops/charts/models) runs
      # minReplicas == maxReplicas == 1, always on - it has no use
      # for Serverless's scale-to-zero, so RawDeployment isn't a
      # compromise here, it's the correct mode for this workload.
      # gitops/charts/models/templates/inferenceservice.yaml now also
      # sets the serving.kserve.io/deploymentMode: RawDeployment
      # annotation explicitly (belt and suspenders with this
      # cluster-wide default). Connectivity Link, LeaderWorkerSet and
      # MaaS-related dependencies (also named in ADR-0047's
      # Operational considerations) are likewise deliberately not
      # installed - nothing in this repository's actual v0 feature
      # set uses multi-node/multi-GPU serving (LeaderWorkerSet), an
      # API policy gateway (Connectivity Link) or a Models-as-a-
      # Service routing layer (MaaS, explicitly deferred to v1 as
      # ADR-0049) - see platform/openshift-ai/README.md.
      serving:
        managementState: Removed
    workbenches:
      managementState: Removed
    dashboard:
      managementState: Managed
    modelmeshserving:
      managementState: Removed
