---
# ADR-0048 runtime channel discovery, shared by install.yml and reconcile.yml.
# Sets _openshift_ai_channel; fails loudly when no usable channel exists.
- name: "openshift_ai | discover the operator's published channels (ADR-0048)"
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    namespace: openshift-marketplace
    name: rhods-operator
  register: _openshift_ai_pkg

- name: "openshift_ai | fail if the package manifest is unavailable"
  ansible.builtin.fail:
    msg: "rhods-operator PackageManifest not found in openshift-marketplace - run 'make d1 check openshift-ai' first."
  when: (_openshift_ai_pkg.resources | default([]) | length) == 0

# The channel follows the version pin (2026-11-04, operator update audit; it
# used to hardcode the 3.5 family):
#   - zuno_openshift_ai_channel, when set, wins and must be published;
#   - a pre-release pin (`3.6.0-ea.2`) selects `beta`, the only channel that
#     serves EA builds;
#   - a release pin `X.Y.z` prefers `stable-X.Y`, then any X.Y-family channel,
#     then the defaultChannel.
# With the chart's default pin (3.5.0) this selects `stable-3.5` exactly as
# before. reconcile.yml includes this file without resolving the pin first, so
# the pin is resolved here when it is missing.
#
# Why `beta` is only chosen for a pre-release pin: `beta` used to be preferred
# unconditionally (ADR-0002 targeted 3.5 EA2), and once the GA shipped that
# drove a DOWNGRADE attempt - install.yml injects the discovered channel into
# the Application's helm values, so every `make d1 install openshift-ai` pushed
# the Subscription back to the EA channel. Tying `beta` to an explicit EA pin
# keeps that from coming back.
#
# The family fallback returns the first X.Y-family channel in catalog order
# ('eus-3.5' and 'support-required-upgrade-3.5' both match); it exists only so
# a catalog that names the z-stream differently still installs. precheck.yml's
# WP-118 B9 check reports a channel/pin mismatch.
- name: "openshift_ai | resolve the version pin when the caller has not (reconcile path)"
  ansible.builtin.include_tasks: resolve_version_pin.yml
  when: _openshift_ai_version is not defined

- name: "openshift_ai | select the channel for the pinned version"
  ansible.builtin.set_fact:
    _openshift_ai_channel: >-
      {{
        _oai_forced
        if (_oai_forced | length) > 0
        else (
          ('beta' if 'beta' in _oai_names else '')
          if _oai_prerelease
          else (
            ('stable-' ~ _oai_family)
            if ('stable-' ~ _oai_family) in _oai_names
            else (
              (_oai_names | select('search', '(^|-)' ~ (_oai_family | regex_escape) ~ '$') | first)
              if (_oai_names | select('search', '(^|-)' ~ (_oai_family | regex_escape) ~ '$') | list | length) > 0
              else (_openshift_ai_pkg.resources[0].status.defaultChannel | default(''))
            )
          )
        )
      }}
  vars:
    _oai_names: "{{ _openshift_ai_pkg.resources[0].status.channels | map(attribute='name') | list }}"
    _oai_pin: "{{ _openshift_ai_version | regex_replace('^v', '') }}"
    _oai_family: "{{ (_oai_pin.split('-')[0].split('.'))[:2] | join('.') }}"
    _oai_prerelease: "{{ '-' in _oai_pin }}"
    _oai_forced: "{{ zuno_openshift_ai_channel | default('', true) }}"

- name: "openshift_ai | fail if the forced channel is not published"
  ansible.builtin.fail:
    msg: >-
      zuno_openshift_ai_channel={{ zuno_openshift_ai_channel }} is not published
      by rhods-operator in this cluster's catalog. Published channels:
      {{ _openshift_ai_pkg.resources[0].status.channels | map(attribute='name') | list }}.
  when:
    - (zuno_openshift_ai_channel | default('', true)) | length > 0
    - zuno_openshift_ai_channel not in (_openshift_ai_pkg.resources[0].status.channels | map(attribute='name') | list)

- name: "openshift_ai | fail with a clear diagnostic if no usable channel was found"
  ansible.builtin.fail:
    msg: >-
      No rhods-operator channel serves the pin {{ _openshift_ai_version }}
      (a pre-release pin needs `beta`), and no defaultChannel to fall back
      to. Published channels:
      {{ _openshift_ai_pkg.resources[0].status.channels | map(attribute='name') | list }}.
      Update ansible/roles/openshift_ai/tasks/discover_channel.yml's channel
      selection if this catalog uses a different naming convention.
  when: _openshift_ai_channel | length == 0

- name: "openshift_ai | discovered channel summary (ADR-0048)"
  ansible.builtin.debug:
    msg: >-
      Selected rhods-operator channel: {{ _openshift_ai_channel }}
      (all published channels: {{ _openshift_ai_pkg.resources[0].status.channels | map(attribute='name') | list }})
