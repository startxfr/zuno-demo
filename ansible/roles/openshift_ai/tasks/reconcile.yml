---
# Auto-remediation for blocked openshift-ai resources (`make d1 reconcile
# openshift-ai` - openshift-ai is a DAY1_RUN component; the d0 form this
# header used to claim doesn't exist and fails, verified live 2026-08-26).
# Only idempotent, ADR-documented, state-restoring actions:
#   - approve the pending InstallPlan, but ONLY when it targets the pinned
#     startingCSV (preserves the Manual-approval pin - never approves drift)
#   - re-copy istio-ca-root-cert into openshift-ingress
#   - re-apply both Applications with an ArgoCD hard refresh (re-applying is
#     the baseline remediation - Applications are Ansible-applied, not
#     git-synced, ADR-0311/0343 - and the refresh forces ArgoCD to
#     re-evaluate a stuck app; this also restores the ArgoCD-owned UWM
#     cluster-monitoring-config)
#   - verify the maas-db-config Secret and re-wait for the
#     DataScienceCluster, recording findings instead of raw errors
#   - right-size the RHOAI-generated TempoStack (ADR-0522/ADR-0523), via
#     right_size_monitoring_stack.yml - shared with install.yml
#   - re-apply the RHOAI dashboard feature flags (ADR-0538 decision 5 as
#     amended, WP-123), via dashboard_feature_flags.yml - also shared with
#     install.yml
# Optional, default OFF (side-effect safety): delete CrashLoopBackOff pods
# in redhat-ods-applications with -e openshift_ai_reconcile_restart_pods=true.
- name: "openshift_ai | reconcile: discover the operator channel (ADR-0048)"
  ansible.builtin.include_tasks: discover_channel.yml

# --- InstallPlan approval ---------------------------------------------------
- name: "openshift_ai | reconcile: look up the Subscription"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    name: rhods-operator
    namespace: redhat-ods-operator
  register: _openshift_ai_subscription

- name: "openshift_ai | reconcile: look up the referenced InstallPlan"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: InstallPlan
    name: "{{ _openshift_ai_subscription.resources[0].status.installPlanRef.name }}"
    namespace: redhat-ods-operator
  register: _openshift_ai_installplan
  when:
    - (_openshift_ai_subscription.resources | default([]) | length) > 0
    - (_openshift_ai_subscription.resources[0].status.installPlanRef.name | default('')) | length > 0

- name: "openshift_ai | reconcile: record CSV drift instead of approving it"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_blocked_finding.yml"
  vars:
    blocked_finding:
      component: openshift-ai
      resource: "InstallPlan/{{ _openshift_ai_installplan.resources[0].metadata.name }} (redhat-ods-operator)"
      state: "CSV drift: targets {{ _openshift_ai_installplan.resources[0].spec.clusterServiceVersionNames }}"
      cause: "The InstallPlan targets a different CSV than the pinned startingCSV {{ _openshift_ai_subscription.resources[0].spec.startingCSV }}"
      solution: "Investigate and approve manually, or update gitops/charts/openshift-ai/values.yaml's subscription.version/operator.csv"
      auto_fix: "manual only - reconcile refuses to approve drifted InstallPlans"
  when:
    - (_openshift_ai_installplan.resources | default([]) | length) > 0
    - _openshift_ai_installplan.resources[0].spec.clusterServiceVersionNames != [_openshift_ai_subscription.resources[0].spec.startingCSV]

- name: "openshift_ai | reconcile: approve the pending pinned InstallPlan"
  kubernetes.core.k8s:
    state: patched
    api_version: operators.coreos.com/v1alpha1
    kind: InstallPlan
    name: "{{ _openshift_ai_installplan.resources[0].metadata.name }}"
    namespace: redhat-ods-operator
    definition:
      spec:
        approved: true
  when:
    - (_openshift_ai_installplan.resources | default([]) | length) > 0
    - _openshift_ai_installplan.resources[0].spec.clusterServiceVersionNames == [_openshift_ai_subscription.resources[0].spec.startingCSV]
    - not (_openshift_ai_installplan.resources[0].spec.approved | default(false))

# --- istio-ca-root-cert re-copy (ADR-0343 / install.yml rationale) ----------
- name: "openshift_ai | reconcile: look up istio-ca-root-cert from an already-meshed namespace"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: istio-ca-root-cert
    namespace: "{{ openshift_ai_maas_gateway_ca_source_namespace | default('zuno-ai-run') }}"
  register: _openshift_ai_istio_ca_root_cert

- name: "openshift_ai | reconcile: record the missing istio-ca-root-cert source instead of failing"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_blocked_finding.yml"
  vars:
    blocked_finding:
      component: openshift-ai
      resource: "ConfigMap/istio-ca-root-cert ({{ openshift_ai_maas_gateway_ca_source_namespace | default('zuno-ai-run') }})"
      state: "NotFound"
      cause: "cert-manager-istio-csr has not distributed the CA root ConfigMap into the source namespace - service_mesh is not installed or not reconciled"
      solution: "Reconcile the service-mesh component first, then re-run this reconcile"
      auto_fix: "make d1 reconcile service-mesh"
  when: (_openshift_ai_istio_ca_root_cert.resources | default([]) | length) == 0

- name: "openshift_ai | reconcile: re-copy istio-ca-root-cert into openshift-ingress"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: istio-ca-root-cert
        namespace: openshift-ingress
      data: "{{ _openshift_ai_istio_ca_root_cert.resources[0].data }}"
  when: (_openshift_ai_istio_ca_root_cert.resources | default([]) | length) > 0

# --- Re-apply both Applications with a hard refresh -------------------------
- name: "openshift_ai | reconcile: re-apply the openshift-ai GitOps Application (d0: operator) and wait for Synced/Healthy"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "openshift-ai"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"
    gitops_app_extra_helm_values:
      cluster-ods:
        # Deliberately disabled: zuno-namespaces-d0 already owns/manages
        # Namespace/redhat-ods-operator (ADR-0331) - see install.yml's
        # matching comment. Must stay in sync with install.yml and
        # application-d0.yaml's own value.
        project:
          enabled: false
        operator:
          enabled: true
          subscription:
            operator:
              channel: "{{ _openshift_ai_channel }}"
      userWorkloadMonitoring:
        enabled: true
    gitops_app_refresh: true
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 20

- name: "openshift_ai | reconcile: re-apply the openshift-ai GitOps Application (d1: DataScienceCluster) and wait for Synced/Healthy"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "openshift-ai"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
    gitops_app_refresh: true
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 20

# --- maas-db-config verification (fix lives in Vault/postgresql) ------------
- name: "openshift_ai | reconcile: verify the maas-db-config Secret"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: maas-db-config
    namespace: redhat-ods-applications
  register: _openshift_ai_maas_db_secret

- name: "openshift_ai | reconcile: fetch the maas-db ExternalSecret conditions for the cause"
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1
    kind: ExternalSecret
    name: maas-db-config
    namespace: redhat-ods-applications
  register: _openshift_ai_maas_db_es
  when: (_openshift_ai_maas_db_secret.resources | default([]) | length) == 0

- name: "openshift_ai | reconcile: record the missing maas-db-config Secret"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_blocked_finding.yml"
  vars:
    blocked_finding:
      component: openshift-ai
      resource: "Secret/maas-db-config (redhat-ods-applications)"
      state: "NotFound"
      cause: >-
        {{ ((_openshift_ai_maas_db_es.resources | default([], true) | first | default({}))
            .get('status', {}).get('conditions', [{}]) | last | default({})).get('message',
           'ExternalSecret not found either - the d1 Application has not created it') }}
      solution: "Check Vault path zuno/maas/postgresql-app and `make d0 check postgresql`/`external-secrets` (ADR-0343)"
      auto_fix: "manual only - the fix lives in Vault/postgresql, not in this role"
  when: (_openshift_ai_maas_db_secret.resources | default([]) | length) == 0

# --- payload-processing / payload-pre-processing sidecar injection (ADR-0201
# MaaS mTLS defect): RHOAI's ModelsAsService controller deploys these two
# Deployments into openshift-ingress without opting them into the mesh, so
# traffic to the AuthPolicy fails mTLS before authentication runs (500s on
# the MaaS gateway). Targeted per-Deployment opt-in, NOT a namespace-wide
# istio-injection label - that would also inject the default HAProxy router
# pods (see install.yml's istio-ca-root-cert comment for why
# openshift-ingress is deliberately unlabeled).
#
# Needs BOTH the annotation and a matching LABEL: the istio-sidecar-injector-
# zuno-mesh webhook's per-object opt-in rule (object.sidecar-injector.istio.io)
# filters via objectSelector, and the Kubernetes API only ever evaluates
# objectSelector against .metadata.labels, never .metadata.annotations - an
# annotation-only patch never gets the webhook invoked at all (the pod
# comes back 1/1 with no istio-proxy despite the annotation landing). Both
# Deployments are owned by the MaaS Config controller (Config/default), so
# this only patches the one annotation+label pair it doesn't manage - safe
# to re-apply if a future
# reconcile of theirs drops it.
- name: "openshift_ai | reconcile: look up payload-processing/payload-pre-processing Deployments"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ item }}"
    namespace: openshift-ingress
  register: _openshift_ai_ipp_deployments
  loop:
    - payload-processing
    - payload-pre-processing
  loop_control:
    label: "{{ item }}"

- name: "openshift_ai | reconcile: opt payload-processing/payload-pre-processing into the mesh (targeted sidecar inject)"
  kubernetes.core.k8s:
    state: patched
    api_version: apps/v1
    kind: Deployment
    name: "{{ item.item }}"
    namespace: openshift-ingress
    definition:
      spec:
        template:
          metadata:
            annotations:
              sidecar.istio.io/inject: "true"
              # Port 9004 is the ext_proc gRPC port the MaaS gateway dials
              # for inference payload processing, and it MUST stay out of
              # inbound interception. The gateway proxy belongs to the
              # `openshift-gateway` revision (istiod-openshift-gateway, in
              # openshift-ingress) while these pods get injected by the
              # `default` revision (istiod in zuno-mesh) - two separate
              # control planes with no shared identity, so the gateway
              # speaks plaintext and an intercepting sidecar resets it.
              #
              # Confirmed live 2026-08-25, immediately after this task
              # first injected the sidecars and ADR-0201's re-anchored ipp
              # filter started actually dialling 9004: cx_connect_fail
              # climbing 1:1 with requests on the
              # outbound|9004||payload-processing cluster, gateway log
              # "Received gRPC error on stream: 14 ... TLS_error:
              # Connection_reset_by_peer", and - because the ipp filter
              # runs failure_mode_allow: false by RHOAI's design - a hard
              # 500 on every MaaS request including /maas-api/health.
              #
              # Same exclusion, same reason, as the 9002 EPP port already
              # carried in gitops/charts/models/values.yaml's
              # schedulerAnnotations. NOTE the trap that pairs with it:
              # excluded traffic arrives directly rather than tunnelled,
              # so it is matched by L4 NetworkPolicy - the 9004 ingress
              # allows in gitops/charts/openshift-ai/templates/
              # maas-gateway.yaml are what keep it reachable, and removing
              # them would break this path in a different way.
              traffic.sidecar.istio.io/excludeInboundPorts: "9004"
            labels:
              sidecar.istio.io/inject: "true"
  loop: "{{ _openshift_ai_ipp_deployments.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - (item.resources | default([]) | length) > 0
    - >-
      ((item.resources[0].spec.template.metadata.annotations | default({}))["sidecar.istio.io/inject"] | default('') != "true") or
      ((item.resources[0].spec.template.metadata.labels | default({}))["sidecar.istio.io/inject"] | default('') != "true") or
      ((item.resources[0].spec.template.metadata.annotations | default({}))["traffic.sidecar.istio.io/excludeInboundPorts"] | default('') != "9004")

- name: "openshift_ai | reconcile: wait for the payload-processing/payload-pre-processing rollout to pick up the sidecar"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ item }}"
    namespace: openshift-ingress
  register: _openshift_ai_ipp_rollout
  until: >-
    (_openshift_ai_ipp_rollout.resources | default([]) | length) > 0 and
    (_openshift_ai_ipp_rollout.resources[0].status.observedGeneration | default(-1)) == (_openshift_ai_ipp_rollout.resources[0].metadata.generation | default(-2)) and
    (_openshift_ai_ipp_rollout.resources[0].status.readyReplicas | default(0)) == (_openshift_ai_ipp_rollout.resources[0].status.replicas | default(-1))
  retries: 30
  delay: 10
  loop:
    - payload-processing
    - payload-pre-processing
  loop_control:
    label: "{{ item }}"

# --- TempoStack right-sizing: shared with install.yml so a FRESH install
# gets it too (it lived only here until 2026-08-26, so a new cluster came up
# with RHOAI's starving defaults and a silently dead trace pipeline). All the
# rationale lives in the shared file.
- name: "openshift_ai | reconcile: right-size the RHOAI-generated TempoStack"
  ansible.builtin.include_tasks: right_size_monitoring_stack.yml

# --- Dashboard feature flags: shared with install.yml for the same reason as
# the TempoStack above. These four flags had no applier at all until
# 2026-09-03 - they were posted by hand with `oc patch` and recorded only in
# prose, so any cluster that had not been hand-patched was missing the
# Evaluations, guardrails, training-jobs and Kueue surfaces. All the rationale,
# including why this cannot be GitOps-managed, lives in the shared file.
- name: "openshift_ai | reconcile: re-apply the RHOAI dashboard feature flags"
  ansible.builtin.include_tasks: dashboard_feature_flags.yml

# --- core-bff ServiceAccount token: shared with install.yml, same reason as
# the flags above. RHOAI 3.5.0 GA mounts no token into the dashboard's new
# core-bff container, so it CrashLoopBackOffs and the GA rollout stalls behind
# the previous ReplicaSet - available, therefore silent. The patch is additive
# and measured to survive the operator's own Server-Side Apply; all the
# rationale, and the exit condition when a 3.5.z fixes it, live in the shared
# file.
- name: "openshift_ai | reconcile: re-mount the dashboard SA token into core-bff"
  ansible.builtin.include_tasks: dashboard_core_bff_token.yml

# --- NO remediation for RHOAI's broken collector->Tempo hop (ADR-0523/
# WP-081 live incident, 2026-08-26; deliberate non-action, recorded so
# nobody re-attempts it): RHOAI's data-science-collector exports to
# tempo-data-science-tempostack-gateway:4317, but the Tempo Operator only
# exposes grpc-public=8090/8081/8080 on that Service (4317 lives solely on
# the distributor, whose NetworkPolicy admits only gateway pods) - every
# trace batch dies in retry_sender with "dial tcp <gateway-ip>:4317: i/o
# timeout"; RHOAI 3.5.0-ea.2's trace pipeline can never have worked
# end-to-end. BOTH obvious in-place fixes are operator-fought and revert
# within seconds, verified live: patching the OpenTelemetryCollector's
# exporter endpoint to :8090 (the Monitoring controller re-renders
# spec.config - unlike the TempoStack resources.total above, which it
# never revisits), and appending a 4317->grpc-public port to the gateway
# Service (the Tempo Operator strips it). The platform therefore exports
# traces to RHOAI's Tempo directly through the gateway with proper
# bearer/tenant auth from zuno-otel-collector instead - see
# gitops/charts/observability/templates/opentelemetrycollector.yaml
# (otlp/rhoai) and rbac-rhoai-traces.yaml, and ADR-0523.

# --- Optional pod restart (default OFF: side-effect safety - Deployments
# recreate deleted pods, but reconcile stays state-restoring-only unless the
# operator explicitly opts in) ------------------------------------------------
- name: "openshift_ai | reconcile: list pods in redhat-ods-applications (opt-in restart)"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: redhat-ods-applications
  register: _openshift_ai_pods
  when: openshift_ai_reconcile_restart_pods | default(false) | bool

- name: "openshift_ai | reconcile: delete CrashLoopBackOff pods in redhat-ods-applications (opt-in)"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Pod
    name: "{{ item.metadata.name }}"
    namespace: redhat-ods-applications
  loop: "{{ _openshift_ai_pods.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name | default('?') }}"
  when:
    - openshift_ai_reconcile_restart_pods | default(false) | bool
    - >-
      (item.status.containerStatuses | default([])
       | map(attribute='state.waiting.reason', default='')
       | select('equalto', 'CrashLoopBackOff') | list | length) > 0

# --- Final readiness ---------------------------------------------------------
- name: "openshift_ai | reconcile: wait for the DataScienceCluster to report Ready, diagnosing on timeout"
  block:
    - name: "openshift_ai | reconcile: wait for the DataScienceCluster to report Ready"
      kubernetes.core.k8s_info:
        api_version: datasciencecluster.opendatahub.io/v2
        kind: DataScienceCluster
        name: zuno-dsc
      register: _openshift_ai_dsc
      until: >-
        (_openshift_ai_dsc.resources | default([]) | length) > 0 and
        (_openshift_ai_dsc.resources[0].status.phase | default('')) == 'Ready'
      retries: 60
      delay: 20
  rescue:
    - name: "openshift_ai | reconcile: diagnose the still-blocked DataScienceCluster"
      ansible.builtin.include_tasks: diagnose.yml

    - name: "openshift_ai | reconcile: fail - the DataScienceCluster is still blocked after remediation"
      ansible.builtin.fail:
        msg: >-
          DataScienceCluster zuno-dsc is still not Ready after the automatic
          remediations. The remaining blocked resources were recorded and are
          summarized at the end of the run - they need one of the manual
          solutions listed there.
