---
# Deep openshift-ai diagnosis: explains WHY the install chain is blocked by
# recording blocked_findings entries (see ansible/tasks/record_blocked_finding.yml)
# for the Subscription -> InstallPlan -> CSV chain, every False
# DataScienceCluster condition, and the ADR-0343 known prerequisites.
# Strictly read-only, never fails - included from install.yml/reconcile.yml
# wait rescues, where the wait's own fail carries the abort.

# --- Subscription -> InstallPlan -> CSV chain ------------------------------
- name: "openshift_ai | diagnose: look up the Subscription"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    name: rhods-operator
    namespace: redhat-ods-operator
  register: _oai_diag_sub

- name: "openshift_ai | diagnose: record missing Subscription"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_blocked_finding.yml"
  vars:
    blocked_finding:
      component: openshift-ai
      resource: "Subscription/rhods-operator (redhat-ods-operator)"
      state: "NotFound"
      cause: "The zuno-openshift-ai-d0 Application never created the Subscription"
      solution: "Re-apply the d0 Application"
      auto_fix: "make d1 reconcile openshift-ai"
  when: (_oai_diag_sub.resources | default([]) | length) == 0

- name: "openshift_ai | diagnose: record unhealthy catalog sources"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_blocked_finding.yml"
  vars:
    blocked_finding:
      component: openshift-ai
      resource: "Subscription/rhods-operator (redhat-ods-operator)"
      state: "CatalogSourcesUnhealthy=True"
      cause: "{{ item.message | default('catalog source unhealthy - no message') }}"
      solution: "Check `oc get pods -n openshift-marketplace` and the CatalogSource this Subscription points at"
      auto_fix: "manual only - cluster catalog issue, reconcile cannot fix it"
  loop: >-
    {{ (_oai_diag_sub.resources | default([], true) | first | default({})).get('status', {}).get('conditions', [])
       | selectattr('type', 'equalto', 'CatalogSourcesUnhealthy')
       | selectattr('status', 'equalto', 'True') | list }}
  loop_control:
    label: "{{ item.type | default('CatalogSourcesUnhealthy') }}"
  when: (_oai_diag_sub.resources | default([]) | length) > 0

- name: "openshift_ai | diagnose: record pending InstallPlan approval"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_blocked_finding.yml"
  vars:
    blocked_finding:
      component: openshift-ai
      resource: "Subscription/rhods-operator (redhat-ods-operator)"
      state: "{{ _oai_diag_sub.resources[0].status.state | default('InstallPlanPending') }}"
      cause: "installPlanApproval is Manual (deliberate - pins the EA2 build) and no InstallPlan has been approved"
      solution: "Approve the InstallPlan whose CSV matches the pinned startingCSV {{ _oai_diag_sub.resources[0].spec.startingCSV | default('(unset)') }}"
      auto_fix: "make d1 reconcile openshift-ai"
  when:
    - (_oai_diag_sub.resources | default([]) | length) > 0
    - >-
      (_oai_diag_sub.resources[0].status.state | default('') == 'UpgradePending') or
      (_oai_diag_sub.resources[0].status.conditions | default([])
       | selectattr('type', 'equalto', 'InstallPlanPending')
       | selectattr('status', 'equalto', 'True') | list | length) > 0

- name: "openshift_ai | diagnose: look up the referenced InstallPlan"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: InstallPlan
    name: "{{ _oai_diag_sub.resources[0].status.installPlanRef.name }}"
    namespace: redhat-ods-operator
  register: _oai_diag_ip
  when:
    - (_oai_diag_sub.resources | default([]) | length) > 0
    - (_oai_diag_sub.resources[0].status.installPlanRef.name | default('')) | length > 0

- name: "openshift_ai | diagnose: record CSV drift on the InstallPlan"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_blocked_finding.yml"
  vars:
    blocked_finding:
      component: openshift-ai
      resource: "InstallPlan/{{ _oai_diag_ip.resources[0].metadata.name }} (redhat-ods-operator)"
      state: "CSV drift: targets {{ _oai_diag_ip.resources[0].spec.clusterServiceVersionNames }}"
      cause: "The InstallPlan targets a different CSV than the pinned startingCSV {{ _oai_diag_sub.resources[0].spec.startingCSV | default('(unset)') }}"
      solution: "Investigate and approve manually, or update gitops/charts/openshift-ai/values.yaml's subscription.version/operator.csv"
      auto_fix: "manual only - reconcile refuses to approve drifted InstallPlans"
  when:
    - (_oai_diag_ip.resources | default([]) | length) > 0
    - _oai_diag_ip.resources[0].spec.clusterServiceVersionNames != [_oai_diag_sub.resources[0].spec.startingCSV]

- name: "openshift_ai | diagnose: record unapproved or failed InstallPlan"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_blocked_finding.yml"
  vars:
    blocked_finding:
      component: openshift-ai
      resource: "InstallPlan/{{ _oai_diag_ip.resources[0].metadata.name }} (redhat-ods-operator)"
      state: "phase={{ _oai_diag_ip.resources[0].status.phase | default('unknown') }}, approved={{ _oai_diag_ip.resources[0].spec.approved | default(false) }}"
      cause: >-
        {{ (_oai_diag_ip.resources[0].status.conditions | default([{}]))[0].message
           | default('Manual installPlanApproval; nothing approved the plan yet') }}
      solution: "Approve the InstallPlan pinned to {{ _oai_diag_sub.resources[0].spec.startingCSV | default('(unset)') }}"
      auto_fix: "make d1 reconcile openshift-ai"
  when:
    - (_oai_diag_ip.resources | default([]) | length) > 0
    - _oai_diag_ip.resources[0].spec.clusterServiceVersionNames == [_oai_diag_sub.resources[0].spec.startingCSV]
    - >-
      (not (_oai_diag_ip.resources[0].spec.approved | default(false))) or
      (_oai_diag_ip.resources[0].status.phase | default('') in ['Failed', 'RequiresApproval'])

- name: "openshift_ai | diagnose: look up the CSV"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    name: "{{ _oai_diag_sub.resources[0].status.currentCSV | default(_oai_diag_sub.resources[0].spec.startingCSV) }}"
    namespace: redhat-ods-operator
  register: _oai_diag_csv
  when:
    - (_oai_diag_sub.resources | default([]) | length) > 0
    - (_oai_diag_sub.resources[0].status.currentCSV | default(_oai_diag_sub.resources[0].spec.startingCSV | default(''))) | length > 0

- name: "openshift_ai | diagnose: record CSV not Succeeded"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_blocked_finding.yml"
  vars:
    blocked_finding:
      component: openshift-ai
      resource: "ClusterServiceVersion/{{ _oai_diag_csv.resources[0].metadata.name }} (redhat-ods-operator)"
      state: "phase={{ _oai_diag_csv.resources[0].status.phase | default('unknown') }} ({{ _oai_diag_csv.resources[0].status.reason | default('no reason') }})"
      cause: "{{ _oai_diag_csv.resources[0].status.message | default('operator CSV has not reached Succeeded') }}"
      solution: "Inspect `oc describe csv {{ _oai_diag_csv.resources[0].metadata.name }} -n redhat-ods-operator` and the operator pod logs"
      auto_fix: "make d1 reconcile openshift-ai"
  when:
    - (_oai_diag_csv.resources | default([]) | length) > 0
    - (_oai_diag_csv.resources[0].status.phase | default('')) != 'Succeeded'

# --- DataScienceCluster conditions (ADR-0343 solution map) ------------------
- name: "openshift_ai | diagnose: look up the DataScienceCluster"
  kubernetes.core.k8s_info:
    # v2 = the CRD's storage version, same reasoning as precheck.yml/install.yml.
    api_version: datasciencecluster.opendatahub.io/v2
    kind: DataScienceCluster
    name: zuno-dsc
  register: _oai_diag_dsc

- name: "openshift_ai | diagnose: record every False DataScienceCluster condition"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_blocked_finding.yml"
  vars:
    # ADR-0343: the 4 root causes that kept zuno-dsc at Ready=False, mapped
    # to their condition types so the summary names the known fix directly.
    _oai_dsc_solutions:
      MaaSPrerequisitesAvailable: "Authorino TLS and/or user-workload-monitoring prerequisite (ADR-0343); UWM is restored by `make d1 reconcile openshift-ai`, the Authorino TLS values live on the connectivity-link Application - `make d1 reconcile connectivity-link`"
      ModelsAsServiceReady: "maas-db-config Secret / MaaS DB connectivity (ADR-0343); check the ExternalSecret and Vault path zuno/maas/postgresql-app"
      RayReady: "Istio sidecar vs SCC conflict (ADR-0343); verify service-mesh's neverInjectSelector is live - `make d1 reconcile service-mesh`"
    blocked_finding:
      component: openshift-ai
      resource: "DataScienceCluster/zuno-dsc condition {{ item.type | default('?') }}"
      state: "{{ item.type | default('?') }}=False (phase={{ _oai_diag_dsc.resources[0].status.phase | default('unknown') }})"
      cause: "{{ item.message | default('no condition message') }}"
      solution: "{{ _oai_dsc_solutions[item.type | default('')] | default('See the condition message; usually fixed by a reconcile re-sync') }}"
      auto_fix: "make d1 reconcile openshift-ai"
  loop: >-
    {{ (_oai_diag_dsc.resources | default([], true) | first | default({})).get('status', {}).get('conditions', [])
       | selectattr('status', 'equalto', 'False') | list }}
  loop_control:
    label: "{{ item.type | default('?') }}"
  when: (_oai_diag_dsc.resources | default([]) | length) > 0

# --- ADR-0343 direct prerequisite checks -----------------------------------
- name: "openshift_ai | diagnose: look up the ADR-0343 prerequisite objects"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ item.namespace }}"
  register: _oai_diag_prereqs
  loop:
    - { kind: Secret, name: maas-db-config, namespace: redhat-ods-applications }
    - { kind: ConfigMap, name: cluster-monitoring-config, namespace: openshift-monitoring }
    - { kind: ConfigMap, name: istio-ca-root-cert, namespace: openshift-ingress }
  loop_control:
    label: "{{ item.kind }}/{{ item.name }}"

- name: "openshift_ai | diagnose: record missing ADR-0343 prerequisites"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_blocked_finding.yml"
  vars:
    _oai_prereq_solutions:
      maas-db-config: "Check the ExternalSecret in redhat-ods-applications and Vault path zuno/maas/postgresql-app; ensure `make d0 install postgresql` ran (ADR-0343)"
      cluster-monitoring-config: "Re-apply the zuno-openshift-ai-d0 Application (the ConfigMap is ArgoCD-owned since ADR-0343)"
      istio-ca-root-cert: "Reconcile re-copies it from zuno-ai-run; if it is absent there too, run `make d1 reconcile service-mesh` first"
    blocked_finding:
      component: openshift-ai
      resource: "{{ item.item.kind }}/{{ item.item.name }} ({{ item.item.namespace }})"
      state: "NotFound"
      cause: "ADR-0343 prerequisite for the DataScienceCluster is missing"
      solution: "{{ _oai_prereq_solutions[item.item.name] }}"
      auto_fix: "make d1 reconcile openshift-ai"
  loop: "{{ _oai_diag_prereqs.results | default([]) }}"
  loop_control:
    label: "{{ item.item.kind }}/{{ item.item.name }}"
  when: (item.resources | default([]) | length) == 0

# --- MaaS payload-processing mTLS sidecar (ADR-0201) ------------------------
- name: "openshift_ai | diagnose: look up payload-processing/payload-pre-processing Deployments"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ item }}"
    namespace: openshift-ingress
  register: _oai_diag_ipp
  loop:
    - payload-processing
    - payload-pre-processing
  loop_control:
    label: "{{ item }}"

- name: "openshift_ai | diagnose: record missing Istio sidecar injection on payload-processing/payload-pre-processing"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_blocked_finding.yml"
  vars:
    blocked_finding:
      component: openshift-ai
      resource: "Deployment/{{ item.item }} (openshift-ingress)"
      state: "sidecar.istio.io/inject label missing"
      cause: "ADR-0201 - RHOAI's ModelsAsService controller deploys this Deployment without opting it into the mesh; mTLS to the MaaS AuthPolicy fails before authentication runs (500s on the MaaS gateway). The LABEL specifically (not just the annotation) is required - the zuno-mesh sidecar injector's per-object opt-in rule filters via objectSelector, which Kubernetes only ever evaluates against labels (VERIFIED live, 2026-08-20: annotation-only was not enough, istiod never got called)"
      solution: "Patch the Deployment's pod template with sidecar.istio.io/inject: \"true\" as both a label and an annotation (targeted, not a namespace-wide istio-injection label - that would also inject the default HAProxy router pods)"
      auto_fix: "make d1 reconcile openshift-ai"
  loop: "{{ _oai_diag_ipp.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - (item.resources | default([]) | length) > 0
    - >-
      ((item.resources[0].spec.template.metadata.annotations | default({}))["sidecar.istio.io/inject"] | default('') != "true") or
      ((item.resources[0].spec.template.metadata.labels | default({}))["sidecar.istio.io/inject"] | default('') != "true")

# --- MaaS IPP filter-anchor workaround retirement watch (ADR-0201) ----------
# The inverse of a normal check: this one fires when the UPSTREAM defect is
# FIXED, not when it is present. gitops/charts/openshift-ai/templates/
# maas-gateway-ipp-anchor.yaml re-inserts RHOAI's ipp-pre/ipp ext_proc
# filters at the anchor they actually need (envoy.filters.http.wasm),
# because RHOAI anchors them on a WasmPlugin-style subfilter name Kuadrant
# never emits. The day RHOAI corrects that anchor, both EnvoyFilters would
# insert and the chain would carry each filter twice - so the workaround
# has to be retired at that moment, and nothing else would notice.
- name: "openshift_ai | diagnose: look up RHOAI's payload-processing EnvoyFilter"
  kubernetes.core.k8s_info:
    api_version: networking.istio.io/v1alpha3
    kind: EnvoyFilter
    name: payload-processing
    namespace: openshift-ingress
  register: _oai_diag_ipp_anchor

- name: "openshift_ai | diagnose: collect the subfilter anchors RHOAI's payload-processing targets"
  ansible.builtin.set_fact:
    _oai_ipp_anchors: >-
      {{
        (_oai_diag_ipp_anchor.resources | default([]) | first | default({}))
        .get('spec', {}).get('configPatches', [])
        | selectattr('applyTo', 'defined')
        | selectattr('applyTo', 'equalto', 'HTTP_FILTER')
        | map(attribute='match.listener.filterChain.filter.subFilter.name')
        | unique | list
      }}
  when: (_oai_diag_ipp_anchor.resources | default([]) | length) > 0

- name: "openshift_ai | diagnose: record that the IPP anchor workaround can now be retired"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_blocked_finding.yml"
  vars:
    blocked_finding:
      component: openshift-ai
      resource: "EnvoyFilter/payload-processing (openshift-ingress)"
      state: "RHOAI now anchors its ext_proc filters on envoy.filters.http.wasm"
      cause: "ADR-0201 - our maas-gateway-ipp-anchor EnvoyFilter exists only because RHOAI anchored ipp-pre/ipp on a subfilter named extensions.istio.io/wasmplugin/... that Kuadrant never emits (it authors raw EnvoyFilters, naming the filter plainly envoy.filters.http.wasm), so both insertions silently no-op'd. That anchor now matches, which means RHOAI's own insertions apply AND ours do - the gateway filter chain will carry ipp-pre and ipp twice"
      solution: "Set maasGateway.ippAnchorWorkaround.enabled: false in gitops/charts/openshift-ai/values.yaml, sync, then delete templates/maas-gateway-ipp-anchor.yaml and this diagnose block"
      auto_fix: ""
  when:
    - (_oai_ipp_anchors | default([]) | length) > 0
    - "'envoy.filters.http.wasm' in (_oai_ipp_anchors | default([]))"
