---
# State detection (never fails). openshift_ai applies its whole chart
# (operator + DataScienceCluster) in a single install.yml call (ADR-0312).
- name: "openshift_ai | check the openshift-ai Application"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-openshift-ai"

- name: "openshift_ai | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_install_state.yml"
  vars:
    _state_is_installed: "{{ _state_check_result }}"
