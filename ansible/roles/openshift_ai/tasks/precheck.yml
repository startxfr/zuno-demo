---
# State detection (never fails).
- name: "openshift_ai | check the openshift-ai Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-openshift-ai-d0"

- name: "openshift_ai | save the d0 check result"
  ansible.builtin.set_fact:
    _openshift_ai_d0_installed: "{{ _state_check_result }}"

- name: "openshift_ai | check the openshift-ai Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-openshift-ai-d1"

- name: "openshift_ai | look up the DataScienceCluster"
  kubernetes.core.k8s_info:
    # v2, not v1: v2 is the CRD's storage version (v1 is served but not
    # storage) - same reasoning as ansible/roles/kueue/tasks/uninstall.yml's
    # ClusterQueue lookup and gitops/charts/openshift-ai/templates/
    # datasciencecluster.yaml, which already renders the CR at v2: reading
    # at the storage version avoids an unnecessary conversion-webhook
    # round-trip.
    api_version: datasciencecluster.opendatahub.io/v2
    kind: DataScienceCluster
    name: zuno-dsc
  register: _openshift_ai_dsc_lookup

# ADR-0322 v0 Day 1 health check: prove the OGX component is reconciled,
# not just declared. The installed v2 CRD reports a dedicated `OGXReady`
# condition; gate on the condition (the reconciliation-outcome signal)
# rather than status.components.ogx's managementState (which only echoes
# the spec) - same reasoning as using status.phase for the overall DSC
# gate below. A False OGXReady condition is also picked up generically by
# diagnose.yml's "record every False DataScienceCluster condition" loop,
# so no diagnose.yml change is needed.
- name: "openshift_ai | check OGX component readiness (ADR-0322)"
  ansible.builtin.set_fact:
    _openshift_ai_ogx_ready: >-
      {{
        ((_openshift_ai_dsc_lookup.resources | default([], true) | first | default({})).get('status', {}).get('conditions', [])
         | selectattr('type', 'equalto', 'OGXReady')
         | selectattr('status', 'equalto', 'True') | list | length) > 0
      }}

- name: "openshift_ai | report OGX component status"
  ansible.builtin.debug:
    msg: >-
      OGX component status:
      {{ (_openshift_ai_dsc_lookup.resources[0].status.components.ogx | default('no status.components.ogx yet'))
         if (_openshift_ai_dsc_lookup.resources | default([]) | length) > 0
         else 'DataScienceCluster does not exist yet' }},
      OGXReady={{ _openshift_ai_ogx_ready }}

# --- maas-api Postgres reachability (ADR-0201) -----------------------------
# maas-api CrashLoopBackOffs at startup when it cannot reach its own database,
# and the failure is silent afterwards: the pod eventually starts, so a later
# `oc get pods` shows it Running with only a restart count as evidence.
# Observed 2026-08-25 - 10 restarts, each dying on:
#   failed to initialize token store: failed to connect to PostgreSQL:
#   ... tls error: read tcp ...: read: connection reset by peer
#   ... FATAL: no pg_hba.conf entry for host "10.128.0.x", user "maas",
#       database "maas", no encryption (SQLSTATE 28000)
# It attempts TLS, the mesh resets the connection, it retries in plaintext,
# and pg_hba rejects that - the same mesh-vs-Postgres-TLS shape already
# documented for ports 5432/8432 elsewhere in this repo. Read-only and
# never-failing, per precheck's reporting contract: this records a finding,
# it does not gate _state_is_installed.
- name: "openshift_ai | precheck: look up the maas-api Deployment for its restart evidence"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: redhat-ods-applications
    label_selectors:
      - app.kubernetes.io/name=maas-api
  register: _openshift_ai_maas_api_pods

- name: "openshift_ai | precheck: count maas-api container restarts"
  ansible.builtin.set_fact:
    _openshift_ai_maas_api_restarts: >-
      {{ (_openshift_ai_maas_api_pods.resources | default([]))
         | map(attribute='status.containerStatuses', default=[])
         | flatten
         | selectattr('name', 'equalto', 'maas-api')
         | map(attribute='restartCount') | sum }}

- name: "openshift_ai | precheck: record the maas-api database startup race"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_blocked_finding.yml"
  vars:
    blocked_finding:
      component: openshift-ai
      resource: "Deployment/maas-api (redhat-ods-applications)"
      state: "{{ _openshift_ai_maas_api_restarts }} container restart(s)"
      cause: "ADR-0201 - maas-api races its own PostgreSQL at startup: it dials with TLS, the mesh resets the connection, it falls back to plaintext and pg_hba rejects that (SQLSTATE 28000, 'no pg_hba.conf entry ... user maas, database maas, no encryption'). It recovers on a later retry, so the only lasting evidence is the restart count"
      solution: "Confirm the maas role and maas database exist on zuno-postgresql and that the mesh is not intercepting the connection before maas-api starts; check `oc logs deploy/maas-api -n redhat-ods-applications --previous` for the pg_hba line"
      auto_fix: "make d1 reconcile openshift-ai"
  when:
    - (_openshift_ai_maas_api_pods.resources | default([]) | length) > 0
    - (_openshift_ai_maas_api_restarts | int) > 0
    - blocked_findings is defined

# --- MaaS /llm/ path-identity off-by-one tripwire (ADR-0201) ----------------
# Latent upstream defect, verified live 2026-08-25: every model-identity
# extraction in the generated AuthPolicy/maas-gateway-auth that fires on
# /llm/-prefixed paths indexes the path segments without accounting for the
# "llm" prefix segment itself - five CEL expressions plus the OPA rego, all
# computing filtered[0] + "/" + filtered[1], i.e. "llm/<ns>" where maas-api
# needs "<ns>/<model>". maas-api returns not_found for the computed form and
# a real subscription for the shifted one, so every request on an /llm/
# route would 403 "no matching subscription found for user" regardless of
# entitlement - indistinguishable, caller-side, from a genuine denial.
#
# Harmless today: no HTTPRoute matches /llm/, the branch is dead code. This
# watch exists so that the day RHOAI (or anyone) starts routing /llm/ on
# maas-default-gateway, the breakage is named before a demo rediscovers it
# the hard way. Not fixable here: the policy is controller-generated and
# reconciled. Lives in precheck (not diagnose.yml) deliberately: diagnose
# only runs when the component is NOT installed, and an /llm/ route
# appearing would leave everything Ready while silently 403ing - this
# must run on every `make d1 check`. Full reproduction for the upstream
# report:
# docs/roadmap/evidence/maas-llm-path-identity-off-by-one.md
- name: "openshift_ai | precheck: look up HTTPRoutes for the /llm/ tripwire"
  kubernetes.core.k8s_info:
    api_version: gateway.networking.k8s.io/v1
    kind: HTTPRoute
  register: _oai_diag_httproutes

- name: "openshift_ai | precheck: look up the generated maas-gateway-auth AuthPolicy"
  kubernetes.core.k8s_info:
    api_version: kuadrant.io/v1
    kind: AuthPolicy
    name: maas-gateway-auth
    namespace: openshift-ingress
  register: _oai_diag_maas_authpolicy

- name: "openshift_ai | precheck: collect /llm/-prefixed route matches on maas-default-gateway"
  ansible.builtin.set_fact:
    _oai_llm_route_hits: >-
      {%- set hits = [] -%}
      {%- for r in (_oai_diag_httproutes.resources | default([])) -%}
        {%- set parents = (r.spec.parentRefs | default([])) | map(attribute='name') | list -%}
        {%- if 'maas-default-gateway' in parents -%}
          {%- for rule in (r.spec.rules | default([])) -%}
            {%- for m in (rule.matches | default([])) -%}
              {%- set pv = (m.path | default({})).get('value', '') -%}
              {%- if pv.startswith('/llm') -%}
                {%- set _ = hits.append(r.metadata.namespace ~ '/' ~ r.metadata.name ~ ':' ~ pv) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
        {%- endif -%}
      {%- endfor -%}
      {{ hits | unique | list }}

- name: "openshift_ai | precheck: record that a live /llm/ route has hit the identity off-by-one"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_blocked_finding.yml"
  vars:
    blocked_finding:
      component: openshift-ai
      resource: "AuthPolicy/maas-gateway-auth (openshift-ingress) + {{ _oai_llm_route_hits | join(', ') }}"
      state: "an /llm/-prefixed route is live while the AuthPolicy still extracts path identities [0]-indexed"
      cause: "ADR-0201 - the generated policy computes the model identity for /llm/<ns>/<model>/... as 'llm/<ns>' (off by one; five CEL expressions plus the OPA rego), which maas-api rejects with not_found, so EVERY request through this route 403s 'no matching subscription found for user' regardless of the caller's real entitlement"
      solution: "Upstream RHOAI fix required (shift the extraction to filtered[1]/filtered[2], or drop the /llm/ prefix from the guard); until then do not route /llm/ - the entry point cannot authorize anyone"
      auto_fix: "manual only - upstream RHOAI defect, see docs/roadmap/evidence/maas-llm-path-identity-off-by-one.md"
  when:
    - (_oai_llm_route_hits | default([]) | length) > 0
    - "'path_parts[0]' in (_oai_diag_maas_authpolicy.resources | default([]) | to_json)"
    - blocked_findings is defined

# --- Tempo gateway authz-sidecar starvation tripwire (ADR-0523/WP-081) -----
# The trace pipeline's single most deceptive failure mode. RHOAI's TempoStack
# proportional split sizes the gateway's opa-openshift sidecar off
# spec.resources.total; at RHOAI's own defaults that is ~40m/41Mi, which
# survives idle but gets liveness-killed in a loop under real trace-write
# load. When it dies the gateway goes unready, its EndpointSlice flips
# ready=false, and every client loses the Service VIP path - trace writes then
# fail as TLS resets (meshed callers) or gRPC deadlines (plain ones) while a
# casual `oc get pods` can still show 2/2 Running. Nothing else in this repo
# would notice: the collector keeps accepting spans and drops them on export.
# Sized by right_size_monitoring_stack.yml, so this is the tripwire that says
# the remediation was reverted, never applied (a cluster installed before it
# was shared with install.yml), or is no longer enough.
- name: "openshift_ai | precheck: look up the Tempo gateway pods"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: redhat-ods-monitoring
    label_selectors:
      - app.kubernetes.io/component=gateway
      - app.kubernetes.io/instance=data-science-tempostack
  register: _oai_tempo_gateway_pods

- name: "openshift_ai | precheck: measure gateway readiness and the opa sidecar's memory limit"
  ansible.builtin.set_fact:
    # Ready only when EVERY container is ready: the pod sits at 1/2 for the
    # whole outage, which a coarse phase==Running check misses entirely.
    # Terminating pods are skipped so a routine rollout never trips this.
    _oai_tempo_gateway_unready: >-
      {%- set unready = [] -%}
      {%- for p in (_oai_tempo_gateway_pods.resources | default([])) -%}
        {%- if p.metadata.deletionTimestamp is not defined -%}
          {%- if ((p.status.containerStatuses | default([])) | rejectattr('ready') | list | length) > 0 -%}
            {%- set _ = unready.append(p.metadata.name) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ unready }}
    # Kubernetes hands this back in whatever form the operator wrote it, and
    # the Tempo Operator's proportional split emits raw bytes ("85899344"),
    # not "82Mi" - parsing only the Mi suffix would read that as 85 million
    # MiB and pass a starved sidecar.
    _oai_tempo_opa_limit_mb: >-
      {%- set limits = [] -%}
      {%- for p in (_oai_tempo_gateway_pods.resources | default([])) -%}
        {%- if p.metadata.deletionTimestamp is not defined -%}
          {%- for c in (p.spec.containers | default([])) -%}
            {%- if 'opa' in c.name -%}
              {%- set raw = ((c.resources | default({})).get('limits', {})).get('memory', '0') | string -%}
              {%- if raw.endswith('Gi') -%}
                {%- set _ = limits.append((raw[:-2] | int) * 1024) -%}
              {%- elif raw.endswith('Mi') -%}
                {%- set _ = limits.append(raw[:-2] | int) -%}
              {%- elif raw.endswith('G') -%}
                {%- set _ = limits.append(((raw[:-1] | int) * 1000000000 // 1048576)) -%}
              {%- elif raw.endswith('M') -%}
                {%- set _ = limits.append(((raw[:-1] | int) * 1000000 // 1048576)) -%}
              {%- else -%}
                {%- set _ = limits.append((raw | int) // 1048576) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
      {%- endfor -%}
      {{ limits | max | default(0, true) }}

- name: "openshift_ai | precheck: record the starved/unready Tempo gateway"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_blocked_finding.yml"
  vars:
    blocked_finding:
      component: openshift-ai
      resource: "Deployment/tempo-data-science-tempostack-gateway (redhat-ods-monitoring)"
      state: >-
        {{ 'opa sidecar memory limit ' ~ (_oai_tempo_opa_limit_mb | int) ~ 'Mi (below the '
           ~ (openshift_ai_tempo_opa_min_memory_mb | default(64) | int) ~ 'Mi floor)'
           if (_oai_tempo_opa_limit_mb | int) < (openshift_ai_tempo_opa_min_memory_mb | default(64) | int)
           else 'gateway pod has a container that is not ready' }}
      cause: "ADR-0523/WP-081 - RHOAI's TempoStack splits spec.resources.total across all 7 containers, starving the opa-openshift authz sidecar until it is liveness-killed under trace-write load; the gateway then goes unready, its EndpointSlice drops, and EVERY trace write to RHOAI's Tempo fails (TLS resets from meshed callers, gRPC deadlines from plain ones) while the pod can still look Running"
      solution: "Re-apply the sizing (spec.resources.total plus the gateway component override) with the auto-fix below; if it is already applied and the sidecar is still starved, raise openshift_ai_tempostack_memory_limit - note the namespace's zuno-platform-quota limits.cpu ceiling"
      auto_fix: "make d1 reconcile openshift-ai"
  when:
    - (_oai_tempo_gateway_pods.resources | default([]) | length) > 0
    - (_oai_tempo_opa_limit_mb | int) < (openshift_ai_tempo_opa_min_memory_mb | default(64) | int)
      or (_oai_tempo_gateway_unready | default([]) | length) > 0
    - blocked_findings is defined

# --- WP-118 B9: catalog CSV drift, detected BEFORE the install ------------
# install.yml refuses to auto-approve an InstallPlan whose CSV differs from
# the pinned startingCSV, and that gate is correct - auto-approving whatever
# the catalog happens to publish is how a platform stops being
# reproducible. But it fires LATE: mid-install, after the Subscription has
# landed, on a cluster the operator has already spent an hour building.
# ADR-0517's from-scratch demo333 run will hit it, because `beta` is a
# moving channel (it published 3.5.0-ea.2 when ADR-0002 pinned it; eus-3.5
# already carries the 3.5.0 GA).
#
# So detect it here instead, from the PackageManifest, which needs no
# Subscription and is readable the moment the CatalogSource is ready. The
# pin is read from the chart rather than the live Subscription for the same
# reason - on a fresh cluster there is no Subscription yet. Read-only and
# never-failing, per precheck's reporting contract: this records a finding
# so `make d0 check` prints the exact value to paste, it does not gate
# _state_is_installed.
- name: "openshift_ai | precheck: read the pinned startingCSV from the chart values"
  ansible.builtin.set_fact:
    _oai_pinned_csv: >-
      {{ (_oai_chart_sub['operator']['csv']) ~ '.' ~ (_oai_chart_sub['version']) }}
    _oai_pinned_channel: "{{ _oai_chart_sub['operator']['channel'] }}"
  vars:
    _oai_chart_sub: >-
      {{ (lookup('ansible.builtin.file',
                 zuno_repo_root + '/gitops/charts/openshift-ai/values.yaml')
          | from_yaml)['cluster-ods']['operator']['subscription'] }}

- name: "openshift_ai | precheck: look up the rhods-operator PackageManifest"
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    namespace: openshift-marketplace
    name: rhods-operator
  register: _oai_packagemanifest
  failed_when: false

- name: "openshift_ai | precheck: read what the pinned channel currently publishes"
  ansible.builtin.set_fact:
    _oai_catalog_csv: >-
      {{ ((_oai_packagemanifest.resources | default([]) | first | default({}))
           .get('status', {}).get('channels', [])
          | selectattr('name', 'equalto', _oai_pinned_channel)
          | map(attribute='currentCSV') | first | default('')) }}

- name: "openshift_ai | precheck: report the pin against the catalog"
  ansible.builtin.debug:
    msg: >-
      RHOAI pin {{ _oai_pinned_csv }} (channel {{ _oai_pinned_channel }});
      catalog currently publishes
      {{ _oai_catalog_csv if _oai_catalog_csv | length > 0
         else 'nothing readable (no PackageManifest yet)' }} -
      {{ 'ALIGNED' if _oai_catalog_csv == _oai_pinned_csv else 'DRIFTED' }}

- name: "openshift_ai | precheck: record the catalog CSV drift"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_blocked_finding.yml"
  vars:
    blocked_finding:
      component: openshift-ai
      resource: "PackageManifest/rhods-operator channel {{ _oai_pinned_channel }} (openshift-marketplace)"
      state: "catalog publishes {{ _oai_catalog_csv }}, chart pins {{ _oai_pinned_csv }}"
      cause: "WP-118 B9 - the pinned startingCSV is not what this cluster's catalog serves on that channel. install.yml will refuse to approve the resulting InstallPlan rather than silently install a different build. Expected on a cluster provisioned later than the pin (ADR-0517's demo333 case), and NOT a defect: the refusal is what keeps the platform reproducible."
      solution: "Decide the version deliberately, then set gitops/charts/openshift-ai/values.yaml cluster-ods.operator.subscription.version to '{{ _oai_catalog_csv | regex_replace('^rhods-operator\\.', '') }}' (and re-check operator.channel) before running the install. Pinning to an older CSV than the channel head is also valid - point subscription.operator.channel at a pinned channel such as eus-3.5 instead."
      auto_fix: "manual only - choosing a platform version is a decision, not a reconcile"
  when:
    - _oai_catalog_csv | length > 0
    - _oai_catalog_csv != _oai_pinned_csv
    - blocked_findings is defined

- name: "openshift_ai | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        _openshift_ai_d0_installed
        and _state_check_result
        and (_openshift_ai_dsc_lookup.resources | default([]) | length) > 0
        and (_openshift_ai_dsc_lookup.resources[0].status.phase | default('')) == 'Ready'
        and (_openshift_ai_ogx_ready | bool)
      }}

# Deep diagnosis so `make d0 check` explains WHY openshift-ai is not
# installed (DSC conditions, InstallPlan approval, ADR-0343 prereqs) - the
# generic per-Application diagnosis can't see a not-Ready DataScienceCluster
# behind two Synced/Healthy apps. Read-only, never fails; skipped outside
# the day0 playbooks (blocked_findings only initialized there).
- name: "openshift_ai | diagnose why the component is not installed"
  ansible.builtin.include_tasks: diagnose.yml
  when:
    - not (_state_is_installed | bool)
    - blocked_findings is defined

- name: "openshift_ai | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
