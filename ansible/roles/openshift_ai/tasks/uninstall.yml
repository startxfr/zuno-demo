---
# Reverse of install.yml (zuno-ai-run, owned by gitops/charts/namespaces, is left
# in place). Delete -d1 first (avoids ArgoCD fighting a CR deletion), then
# remove_operator.yml (needs the Subscription) before -d0's own delete.
- name: "openshift_ai | delete the openshift-ai GitOps Application (d1: DataScienceCluster)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-openshift-ai-d1"

- name: "openshift_ai | remove the operator (its owned CRDs - cascading the DataScienceCluster - then the CSV, then the Subscription)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/remove_operator.yml"
  vars:
    operator_subscription_name: rhods-operator
    operator_namespace: redhat-ods-operator

- name: "openshift_ai | delete the openshift-ai GitOps Application (d0: cascades the remaining OperatorGroup/Namespace)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-openshift-ai-d0"
