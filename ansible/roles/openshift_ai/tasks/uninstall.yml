---
# Reverse of install.yml. zuno-ai-run (owned by gitops/charts/namespaces,
# ADR-0312) is left in place.
#
# Delete -d1 (the DataScienceCluster operand) first, via ArgoCD prune,
# before remove_operator.yml deletes the CRD it's an instance of - avoids
# ArgoCD fighting a CR deletion its own Application still desires.
# remove_operator.yml then runs *before* deleting -d0: it discovers the
# installed CSV via the Subscription's own status.installedCSV field,
# which only exists while the Subscription (a -d0-managed resource) still
# exists. Running it before -d0's own delete also means its CRD delete
# and CSV/Subscription delete happen before ArgoCD's own cascade prune
# would otherwise race to remove the same Subscription object.
- name: "openshift_ai | delete the openshift-ai GitOps Application (d1: DataScienceCluster)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-openshift-ai-d1"

- name: "openshift_ai | remove the operator (its owned CRDs - cascading the DataScienceCluster - then the CSV, then the Subscription)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/remove_operator.yml"
  vars:
    operator_subscription_name: rhods-operator
    operator_namespace: redhat-ods-operator

- name: "openshift_ai | delete the openshift-ai GitOps Application (d0: cascades the remaining OperatorGroup/Namespace)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-openshift-ai-d0"
