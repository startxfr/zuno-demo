---
- name: "openshift_ai | discover the operator's published channels (ADR-0048)"
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    namespace: openshift-marketplace
    name: rhods-operator
  register: _openshift_ai_pkg

- name: "openshift_ai | fail if the package manifest is unavailable"
  ansible.builtin.fail:
    msg: "rhods-operator PackageManifest not found in openshift-marketplace - run 'make d0 check openshift-ai' first."
  when: (_openshift_ai_pkg.resources | default([]) | length) == 0

# ADR-0048: select the 3.5-family channel this cluster's catalog actually
# publishes, instead of embedding a hardcoded, previously-unverified
# "eus-3.5" guess (the exact EA2/GA channel name is not standardized
# across catalog snapshots). Falls back to the manifest's own
# defaultChannel only if no 3.5-family channel name is found - fails with
# a clear diagnostic rather than silently subscribing to an arbitrary
# channel if even that isn't available.
- name: "openshift_ai | select the 3.5-family channel actually published by this cluster's catalog"
  ansible.builtin.set_fact:
    _openshift_ai_channel: >-
      {{
        ((_openshift_ai_pkg.resources[0].status.channels | selectattr('name', 'search', '3\.5') | map(attribute='name') | list)[0])
        if (_openshift_ai_pkg.resources[0].status.channels | selectattr('name', 'search', '3\.5') | list | length) > 0
        else (_openshift_ai_pkg.resources[0].status.defaultChannel | default(''))
      }}

- name: "openshift_ai | fail with a clear diagnostic if no usable channel was found"
  ansible.builtin.fail:
    msg: >-
      No OpenShift AI 3.5-family channel published in this cluster's
      catalog, and no defaultChannel to fall back to. Published channels:
      {{ _openshift_ai_pkg.resources[0].status.channels | map(attribute='name') | list }}.
      Update ansible/roles/openshift_ai/tasks/install.yml's channel
      selection if this catalog uses a different naming convention.
  when: _openshift_ai_channel | length == 0

- name: "openshift_ai | discovered channel summary (ADR-0048)"
  ansible.builtin.debug:
    msg: >-
      Selected rhods-operator channel: {{ _openshift_ai_channel }}
      (all published channels: {{ _openshift_ai_pkg.resources[0].status.channels | map(attribute='name') | list }})

# ADR-0312: the operator Namespace/OperatorGroup/Subscription and the
# DataScienceCluster now both live in gitops/charts/openshift-ai, applied
# as a single ArgoCD Application - see
# gitops/apps/openshift-ai/application.yaml. The chart's sync-wave 10
# (Namespace/OperatorGroup/Subscription) is gated ahead of wave 20
# (DataScienceCluster) by the custom Subscription health check
# ansible/roles/argocd/tasks/apply_resource_health_checks.yml registers,
# so this single apply_gitops_app.yml call covers both the operator
# install and the operand CR - no separate CRD-established wait needed
# here any more, ArgoCD's own sync-wave retry handles it.
- name: "openshift_ai | apply the openshift-ai GitOps Application"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "openshift-ai"
    gitops_app_name: "zuno-{{ gitops_component_name }}"
    gitops_app_extra_helm_values:
      subscriptionChannel: "{{ _openshift_ai_channel }}"
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 20

# ArgoCD's default health evaluation has no logic for
# datasciencecluster.opendatahub.io - it reports the CR Healthy as soon as
# synced, not once status.phase is actually Ready. Kept as a supplementary
# explicit wait, same convention ansible/roles/{postgresql,keycloak} use
# for their own CR-specific readiness beyond the generic Application wait.
- name: "openshift_ai | wait for the DataScienceCluster to report Ready"
  kubernetes.core.k8s_info:
    api_version: datasciencecluster.opendatahub.io/v1
    kind: DataScienceCluster
    name: zuno-dsc
  register: _openshift_ai_dsc
  until: >-
    (_openshift_ai_dsc.resources | default([]) | length) > 0 and
    (_openshift_ai_dsc.resources[0].status.phase | default('')) == 'Ready'
  retries: 60
  delay: 20
