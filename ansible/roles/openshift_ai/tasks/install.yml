---
- name: "openshift_ai | discover the operator channel (ADR-0048)"
  ansible.builtin.include_tasks: discover_channel.yml

- name: "openshift_ai | resolve the effective version pin (WP-132)"
  ansible.builtin.include_tasks: resolve_version_pin.yml

- name: "openshift_ai | apply the openshift-ai GitOps Application (d0: operator)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "openshift-ai"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"
    gitops_app_extra_helm_values:
      cluster-ods:
        # Deliberately disabled: zuno-namespaces-d0 already owns/manages
        # Namespace/redhat-ods-operator (ADR-0331) - see
        # gitops/apps/openshift-ai/application-d0.yaml's matching comment.
        # apply_gitops_app.yml REPLACES spec.source.helm.values wholesale
        # with this block, so that file's own value alone has no effect here
        # - both must stay in sync.
        project:
          enabled: false
        operator:
          enabled: true
          subscription:
            # WP-132: the pin comes from resolve_version_pin.yml, so a cluster
            # whose catalog cannot serve the chart's version is recorded in
            # ansible/confidential.yml instead of by editing the chart - which
            # renders from git main with selfHeal, i.e. a live change everywhere.
            version: "{{ _openshift_ai_version }}"
            operator:
              channel: "{{ _openshift_ai_channel }}"
        # DSCInitialization is NOT enabled here (or in the re-apply below) -
        # it needs the Subscription actually approved/reconciled first (the
        # InstallPlan-approval steps below), which application-d0.yaml's own
        # DSCInitialization: enabled: false already reflects. It's enabled
        # in application-d1.yaml instead, applied further down.
      userWorkloadMonitoring:
        enabled: true
    # Don't wait here: the Subscription below is installPlanApproval:
    # Manual (gitops/charts/openshift-ai/values.yaml - deliberate, so
    # Automatic can't silently advance past the pinned EA2 build), and
    # nothing approves its InstallPlan until the tasks below run - Argo
    # would report this Application Progressing forever otherwise.
    gitops_app_wait: false

# rhods-operator's Subscription is deliberately installPlanApproval: Manual.
# Without an explicit approval step the Subscription (and therefore
# zuno-openshift-ai-d0's health) sits at InstallPlanPending/RequiresApproval
# forever - no other task in this repo ever flips it. Approve only the
# InstallPlan that targets the exact CSV the Subscription itself was
# configured to pin to (checked below), never anything else - that
# preserves the "don't drift past the pinned build" property Manual
# exists for.
- name: "openshift_ai | wait for the Subscription to reference a pending InstallPlan, diagnosing blocked resources on timeout"
  block:
    - name: "openshift_ai | wait for the Subscription to reference a pending InstallPlan"
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: Subscription
        name: rhods-operator
        namespace: redhat-ods-operator
      register: _openshift_ai_subscription
      until: >-
        (_openshift_ai_subscription.resources | default([]) | length) > 0 and
        (_openshift_ai_subscription.resources[0].status.installPlanRef.name | default('')) | length > 0
      retries: 30
      delay: 10
  rescue:
    - name: "openshift_ai | diagnose the blocked Subscription/InstallPlan stage"
      ansible.builtin.include_tasks: diagnose.yml

    - name: "openshift_ai | fail: blocked at the Subscription/InstallPlan stage"
      ansible.builtin.fail:
        msg: >-
          The rhods-operator Subscription never referenced a pending
          InstallPlan. The blocked resources were recorded and are summarized
          at the end of the run. Auto-fix: `make d1 reconcile openshift-ai`.

- name: "openshift_ai | look up the pending InstallPlan"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: InstallPlan
    name: "{{ _openshift_ai_subscription.resources[0].status.installPlanRef.name }}"
    namespace: redhat-ods-operator
  register: _openshift_ai_installplan

- name: "openshift_ai | record the CSV-drift finding before failing"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_blocked_finding.yml"
  vars:
    blocked_finding:
      component: openshift-ai
      resource: "InstallPlan/{{ _openshift_ai_installplan.resources[0].metadata.name }} (redhat-ods-operator)"
      state: "CSV drift: targets {{ _openshift_ai_installplan.resources[0].spec.clusterServiceVersionNames }}"
      cause: "The InstallPlan targets a different CSV than the pinned startingCSV {{ _openshift_ai_subscription.resources[0].spec.startingCSV }}"
      solution: "Investigate and approve manually, then set zuno_openshift_ai_version in ansible/confidential.yml (or update gitops/charts/openshift-ai/values.yaml's subscription.version/operator.csv to change it for every cluster)"
      auto_fix: "manual only - reconcile refuses to approve drifted InstallPlans"
  when: _openshift_ai_installplan.resources[0].spec.clusterServiceVersionNames != [_openshift_ai_subscription.resources[0].spec.startingCSV]

- name: "openshift_ai | fail loudly if the pending InstallPlan targets a different CSV than the pinned startingCSV"
  ansible.builtin.fail:
    msg: >-
      InstallPlan {{ _openshift_ai_installplan.resources[0].metadata.name }}
      targets {{ _openshift_ai_installplan.resources[0].spec.clusterServiceVersionNames }},
      not the pinned [{{ _openshift_ai_subscription.resources[0].spec.startingCSV }}]
      this Subscription was configured to install - refusing to
      auto-approve an unexpected upgrade. Investigate and approve
      manually (or update gitops/charts/openshift-ai/values.yaml's
      subscription.version/operator.csv) before re-running.
  when: _openshift_ai_installplan.resources[0].spec.clusterServiceVersionNames != [_openshift_ai_subscription.resources[0].spec.startingCSV]

- name: "openshift_ai | approve the pinned InstallPlan"
  kubernetes.core.k8s:
    state: patched
    api_version: operators.coreos.com/v1alpha1
    kind: InstallPlan
    name: "{{ _openshift_ai_installplan.resources[0].metadata.name }}"
    namespace: redhat-ods-operator
    definition:
      spec:
        approved: true
  when: not (_openshift_ai_installplan.resources[0].spec.approved | default(false))

- name: "openshift_ai | re-apply the openshift-ai GitOps Application (d0: operator) and wait for Synced/Healthy now the InstallPlan is approved"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "openshift-ai"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"
    gitops_app_extra_helm_values:
      cluster-ods:
        # Same reasoning as the initial apply above - keep in sync.
        project:
          enabled: false
        operator:
          enabled: true
          subscription:
            # WP-132: the pin comes from resolve_version_pin.yml, so a cluster
            # whose catalog cannot serve the chart's version is recorded in
            # ansible/confidential.yml instead of by editing the chart - which
            # renders from git main with selfHeal, i.e. a live change everywhere.
            version: "{{ _openshift_ai_version }}"
            operator:
              channel: "{{ _openshift_ai_channel }}"
      userWorkloadMonitoring:
        enabled: true
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 20

# Istio's gateway-controller auto-deploys a proxy pod for maas-default-gateway
# into openshift-ingress; that pod needs the istio-ca-root-cert ConfigMap for
# its CA trust bundle. cert-manager-istio-csr only distributes that ConfigMap
# into namespaces labeled istio-injection=enabled, and openshift-ingress is
# deliberately NOT labeled that way: that same label is what the
# sidecar-injection webhook selects on, so labeling it would start
# auto-injecting Istio sidecars into every pod there, including the default
# HAProxy router pods. Copying the ConfigMap in directly is safe to do
# unconditionally on every run: the CA root (Vault-generated, idempotent) is
# valid 10 years with no automated rotation anywhere in this repo, so the copy
# can't go stale.
# Factored into the shared ensure_istio_ca_in_openshift_ingress.yml
# (ADR-0517, demo333 2026-09-07): connectivity_link's zuno-agent-gateway
# (Day 1) needs the identical copy, and on a fresh cluster it needs it
# BEFORE this Day 2 role ever runs. The full why-a-copy-not-a-label
# analysis (2026-08-13) lives in the shared task's header.
- name: "openshift_ai | ensure istio-ca-root-cert exists in openshift-ingress (maas-default-gateway proxy)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/ensure_istio_ca_in_openshift_ingress.yml"
  vars:
    istio_ca_caller_component: "openshift-ai"
    istio_ca_source_namespace: "{{ openshift_ai_maas_gateway_ca_source_namespace | default('zuno-ai-run') }}"


- name: "openshift_ai | apply the openshift-ai GitOps Application (d1: DataScienceCluster)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "openshift-ai"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
    # No gitops_app_extra_helm_values: DSCInitialization, dataScienceCluster
    # and maasGateway are all already enabled in application-d1.yaml's own
    # static values - single source of truth, nothing to override here.
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 20

# ArgoCD has no health logic for DataScienceCluster - it reports Healthy
# as soon as synced, not once status.phase is actually Ready.
- name: "openshift_ai | wait for the DataScienceCluster to report Ready, diagnosing blocked resources on timeout"
  block:
    - name: "openshift_ai | wait for the DataScienceCluster to report Ready"
      kubernetes.core.k8s_info:
        # v2, not v1: v2 is the CRD's storage version - same reasoning as
        # precheck.yml's DataScienceCluster lookup and this chart's own
        # templates/datasciencecluster.yaml, which already renders the CR
        # at v2.
        api_version: datasciencecluster.opendatahub.io/v2
        kind: DataScienceCluster
        name: zuno-dsc
      register: _openshift_ai_dsc
      until: >-
        (_openshift_ai_dsc.resources | default([]) | length) > 0 and
        (_openshift_ai_dsc.resources[0].status.phase | default('')) == 'Ready'
      retries: 60
      delay: 20
  rescue:
    - name: "openshift_ai | diagnose the blocked DataScienceCluster"
      ansible.builtin.include_tasks: diagnose.yml

    - name: "openshift_ai | fail: DataScienceCluster is blocked"
      ansible.builtin.fail:
        msg: >-
          DataScienceCluster zuno-dsc did not report phase Ready within
          60x20s. Its False conditions and missing ADR-0343 prerequisites
          were recorded and are summarized at the end of the run. Auto-fix:
          `make d1 reconcile openshift-ai`.

# Last, because RHOAI's monitoring service only generates the TempoStack once
# the DSCI/DSC above are accepted. Shared with reconcile.yml: until 2026-08-26
# this remediation existed ONLY on the reconcile path, so a fresh install came
# up with RHOAI's starving defaults and a trace pipeline that looked healthy
# (`oc get pods` 2/2) while dropping every span - see the shared file for the
# full incident.
- name: "openshift_ai | right-size the RHOAI-generated TempoStack"
  ansible.builtin.include_tasks: right_size_monitoring_stack.yml

# After the TempoStack, and last overall, because the dashboard component only
# creates its OdhDashboardConfig once the DSC above is accepted. Shared with
# reconcile.yml for the same reason the TempoStack remediation is: until
# 2026-09-03 these flags were applied by hand and never by any automation, so a
# fresh cluster came up with four dashboard surfaces silently missing (ADR-0538
# decision 5 as amended, WP-123). All the rationale lives in the shared file.
- name: "openshift_ai | apply the RHOAI dashboard feature flags"
  ansible.builtin.include_tasks: dashboard_feature_flags.yml

# Alongside the flags, and for the same "no applier at all" reason: RHOAI
# 3.5.0's dashboard Deployment ships its new core-bff container with no
# ServiceAccount token mounted, so that container CrashLoopBackOffs and the
# rollout to the GA's three-container pod never completes. Shared with
# reconcile.yml. All the rationale, including the measured proof that the
# patch survives the operator's Server-Side Apply, lives in the shared file.
- name: "openshift_ai | mount the dashboard SA token into core-bff (RHOAI 3.5.0 defect)"
  ansible.builtin.include_tasks: dashboard_core_bff_token.yml
