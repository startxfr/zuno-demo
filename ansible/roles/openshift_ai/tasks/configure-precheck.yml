---
# State detection (never fails). openshift_ai's configure.yml is a no-op
# (GPU quota moved to gitops/charts/namespaces, ADR-0312) - "configured"
# checks the DataScienceCluster's own Ready signal install.yml already
# waits on, complementing install-precheck.yml's Application-level check.
- name: "openshift_ai | look up the DataScienceCluster"
  kubernetes.core.k8s_info:
    api_version: datasciencecluster.opendatahub.io/v1
    kind: DataScienceCluster
    name: zuno-dsc
  register: _openshift_ai_dsc_lookup

- name: "openshift_ai | compute configure state"
  ansible.builtin.set_fact:
    _state_is_configured: >-
      {{
        (_openshift_ai_dsc_lookup.resources | default([]) | length) > 0
        and (_openshift_ai_dsc_lookup.resources[0].status.phase | default('')) == 'Ready'
      }}

- name: "openshift_ai | record configure state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_configure_state.yml"
