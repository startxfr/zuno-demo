---
# Reverse of install.yml. No CR to wait on yet (WP-107 scaffold renders
# nothing) - unlike lightspeed-config's uninstall.yml, which must wait for
# OLSConfig to disappear before the Day 1 operator can be removed, there
# is no equivalent Day 1 operator here to protect. Update this once
# WP-108/WP-109 add real cluster resources (RAGAS/Garak Jobs, guardrail
# wiring) that need a teardown wait.
- name: "trustyai-config | delete the trustyai-config GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-trustyai-config-d1"

- name: "trustyai-config | delete the trustyai-config GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-trustyai-config-d0"
