---
# ADR-0538/WP-116. Applies the -d0/-d1 Application pair, then waits for the
# operator to actually bring the tracking server up: the CR alone proves
# nothing (the operator starts an Alembic migration Job against the PGO
# database, and that is the step that fails if the backend-store credential
# or the public-schema grant is missing). There is no Day 1 operator to
# install here - `mlflowoperator` is already Managed by the Day 1
# `openshift-ai` component via the DataScienceCluster.
- name: "mlflow | apply the mlflow GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "mlflow"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-mlflow-d0"

# ADR-0546/WP-131: the artifact bucket is a cluster-scoped output, so it
# stops being a chart literal. Soft-read (not a hard fail like vault's) -
# omitting the four keys leaves the chart defaults in place. ADR-0517 B13:
# a role that reads a confidential.yml variable without loading the file
# gets an undefined variable and its `| default(chart)` fallback wins in
# silence, which is why this stat/include_vars pair is not optional.
# check_confidential_var_loaders() enforces it.
- name: "mlflow | check for ansible/confidential.yml"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/confidential.yml"
  register: _mlflow_confidential_file

- name: "mlflow | load ansible/confidential.yml if present"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/confidential.yml"
  when: _mlflow_confidential_file.stat.exists

- name: "mlflow | apply the mlflow GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "mlflow"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-mlflow-d1"
    # This apply CHANGES values, so it needs the explicit sync operation.
    # Without it the wait races ArgoCD's own diff detection: the poll reads
    # status.sync.status while it is still the stale Synced from before the
    # apply, so the play reports Synced+Healthy and exits with the live objects
    # untouched. Measured 2026-09-04 on the WP-131 mlflow cutover - the command
    # said Synced/Healthy while both workspace Secrets and the MLflow CR still
    # named the old bucket, and ArgoCD only converged ~30s later. Same race the
    # long comment in apply_gitops_app.yml records for the refresh path; the
    # default path has it too, just against diff latency instead of a cache.
    # gitops_app_refresh patches spec.operation.sync and waits on
    # operationState.phase == Succeeded, which is tied to THIS operation.
    gitops_app_refresh: true
    # apply_gitops_app.yml REPLACES spec.source.helm.values wholesale, so
    # mlflowConfig.enabled has to be restated here even though it is already
    # in gitops/apps/mlflow/application-d1.yaml - dropping it would render
    # the whole component away. check_gitops_values_clobber() enforces that.
    #
    # server.artifactsDestination and artifact.* are two independent
    # descriptions of the same bucket; they are derived from one pair of
    # variables here so they cannot drift apart.
    gitops_app_extra_helm_values:
      mlflowConfig:
        enabled: true
      server:
        # ADR-0547 clause 3: an invalid placeholder, not zuno-corpus (deleted
        # WP-131 2026-09-05) - a plausible-looking default risks silently
        # resolving to whatever AWS account next registers that bucket name.
        artifactsDestination: "s3://{{ zuno_mlflow_artifacts_s3_bucket | default('ZUNO_S3_BUCKET_NOT_SET') }}/{{ zuno_mlflow_artifacts_s3_prefix | default('mlflow-artifacts') }}"
      artifact:
        bucket: "{{ zuno_mlflow_artifacts_s3_bucket | default('ZUNO_S3_BUCKET_NOT_SET') }}"
        endpoint: "{{ zuno_mlflow_artifacts_s3_endpoint | default('https://s3.us-east-1.amazonaws.com') }}"
        region: "{{ zuno_mlflow_artifacts_s3_region | default('us-east-1') }}"
        rootPath: "{{ zuno_mlflow_artifacts_s3_prefix | default('mlflow-artifacts') }}"

- name: "mlflow | wait for the MLflow server Deployment to become available"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ mlflow_namespace | default('redhat-ods-applications') }}"
    label_selectors:
      - "app.kubernetes.io/name=mlflow"
  register: _mlflow_deploy
  until: >-
    (_mlflow_deploy.resources | default([]) | length) > 0 and
    (_mlflow_deploy.resources | map(attribute='status.availableReplicas', default=0) | sum) > 0
  retries: 40
  delay: 15
  failed_when: false

# The comparison MUST stay parenthesised. Jinja binds `|` tighter than `>`,
# so `x | length > 0 | ternary(a, b)` parses as `x|length > (0 | ternary(a, b))`
# - an int compared to a string, which raises "'>' not supported between
# instances of 'int' and 'str'" and fails the play on its very last task,
# after the Application is already applied, Synced and Healthy. Hit live
# 2026-09-04 on `make d2 install mlflow`: every real step had succeeded and
# the command still exited non-zero, blaming a template.
- name: "mlflow | install summary"
  ansible.builtin.debug:
    msg: >-
      MLflow tracking server:
      {{ ((_mlflow_deploy.resources | default([]) | length) > 0)
         | ternary('deployment present, available replicas=' ~
                   (_mlflow_deploy.resources | map(attribute='status.availableReplicas', default=0) | sum),
                   'NO deployment found - check the MLflow CR status and the operator log') }}
