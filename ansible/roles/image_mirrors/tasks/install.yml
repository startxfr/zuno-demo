---
# Mirrors every public-registry base/runtime image this platform depends on
# into zuno-ai-build ImageStreams (referencePolicy: Local makes the internal
# registry cache/pull-through each image), so BuildConfigs and Deployments in
# other namespaces pull the local copy instead of hitting docker.io/quay.io/
# gcr.io/registry.redhat.io directly. Runs right after "namespaces" in Day 0
# (which already creates zuno-ai-build - see gitops/charts/namespaces/
# values.yaml) because vault/redis need their mirrored images before Day 1
# build ever runs apply_openshift_build.yml.
#
# The digest-pinned images use importPolicy.scheduled: false so the mirror
# never silently drifts from the pinned digest - ADR-0051's intent, extended
# to the mirror itself. ADR-0603 M16 (WP-226) added the base images every
# first-party Dockerfile builds FROM (python 3.11/3.12-slim, node 20-alpine,
# ubi9 python-311): a build is reproducible only if its base is. Refresh
# routine (the security fixes of a base image now arrive only through it):
#   skopeo inspect --raw docker://docker.io/library/python:3.11-slim | sha256sum
# then write the new digest here AND in .github/workflows/build-publish.yml's
# BASE_IMAGE build_args, in one commit. The other mirrors (golang, vault,
# kubectl, redis, postgres, distroless) feed no first-party build and stay on
# their scheduled tag import. quay.io/modh/vllm is intentionally not mirrored here:
# ADR-0048 has Ansible discover and override the real serving image from the
# live OpenShift AI catalog at apply time, so the static values.yaml
# fallback is never what's actually deployed.
- name: "image_mirrors | apply the base/runtime image mirrors"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_image_mirror.yml"
  vars:
    mirror_name: "{{ mirror_stream.name }}"
    mirror_tags: "{{ mirror_stream.tags }}"
  loop:
    - name: golang
      tags:
        - name: "1.22"
          from: {kind: DockerImage, name: "docker.io/library/golang:1.22"}
          importPolicy: {scheduled: true}
          referencePolicy: {type: Local}
        - name: "1.24"
          from: {kind: DockerImage, name: "docker.io/library/golang:1.24"}
          importPolicy: {scheduled: true}
          referencePolicy: {type: Local}
        - name: "1.26"
          from: {kind: DockerImage, name: "docker.io/library/golang:1.26"}
          importPolicy: {scheduled: true}
          referencePolicy: {type: Local}
    - name: node
      tags:
        - name: "20-alpine"
          # ADR-0603 M16: docker.io/library/node:20-alpine, digest resolved 2026-11-07.
          from: {kind: DockerImage, name: "docker.io/library/node@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293"}
          importPolicy: {scheduled: false}
          referencePolicy: {type: Local}
    - name: python
      tags:
        - name: "3.11-slim"
          # ADR-0603 M16: docker.io/library/python:3.11-slim, digest resolved 2026-11-07.
          from: {kind: DockerImage, name: "docker.io/library/python@sha256:65bd3d9f1d7fa268dd1909973ba7eb4bdf41f6dcf2cfbe76ba9528b170f3fd79"}
          importPolicy: {scheduled: false}
          referencePolicy: {type: Local}
        - name: "3.12-slim"
          # ADR-0603 M16: docker.io/library/python:3.12-slim, digest resolved 2026-11-07.
          from: {kind: DockerImage, name: "docker.io/library/python@sha256:4840d514c583a4d3d8cad3940e68dee6f0f6f3635c12fcd0a3d74c21a5b93a54"}
          importPolicy: {scheduled: false}
          referencePolicy: {type: Local}
    - name: ubi9-ubi-minimal
      tags:
        - name: "9"
          from:
            kind: DockerImage
            name: "registry.access.redhat.com/ubi9/ubi-minimal@sha256:7c372902c8d211db2d25c8277ba534a73b92742a334874dced829a63b0f21221"
          importPolicy: {scheduled: false}
          referencePolicy: {type: Local}
    - name: ubi9-python-311
      tags:
        - name: latest
          # ADR-0603 M16: registry.access.redhat.com/ubi9/python-311:latest, digest resolved 2026-11-07.
          from: {kind: DockerImage, name: "registry.access.redhat.com/ubi9/python-311@sha256:a0bdb55576fc5b8d6704279307817828ef027e1065533ceba133fe9516003a6c"}
          importPolicy: {scheduled: false}
          referencePolicy: {type: Local}
    - name: distroless-static
      tags:
        - name: nonroot
          from: {kind: DockerImage, name: "gcr.io/distroless/static:nonroot"}
          importPolicy: {scheduled: true}
          referencePolicy: {type: Local}
    - name: vault
      tags:
        - name: "1.17.2"
          from: {kind: DockerImage, name: "docker.io/hashicorp/vault:1.17.2"}
          importPolicy: {scheduled: true}
          referencePolicy: {type: Local}
    - name: bitnami-kubectl
      tags:
        # Bitnami stopped publishing pinned version tags under bitnami/* on
        # Docker Hub (free tier now only carries a rolling "latest"); pinned
        # historical tags live on in the frozen bitnamilegacy/* org instead.
        - name: "1.31"
          from: {kind: DockerImage, name: "docker.io/bitnamilegacy/kubectl:1.31"}
          importPolicy: {scheduled: true}
          referencePolicy: {type: Local}
    - name: bitnami-redis
      tags:
        # Same bitnamilegacy/* rationale as bitnami-kubectl above. 8.2.1 is
        # the newest Redis version Bitnami ever published as a pinned tag
        # (the legacy org is now frozen); the chart's own appVersion
        # (8.10.0) is aspirational metadata, not a tag Bitnami ever shipped.
        - name: "8.2.1"
          from: {kind: DockerImage, name: "registry-1.docker.io/bitnamilegacy/redis:8.2.1"}
          importPolicy: {scheduled: true}
          referencePolicy: {type: Local}
    - name: postgres
      tags:
        - name: "16-bookworm"
          from: {kind: DockerImage, name: "docker.io/library/postgres:16-bookworm"}
          importPolicy: {scheduled: true}
          referencePolicy: {type: Local}
    - name: odh-kserve-storage-initializer-rhel9
      tags:
        - name: rhel9
          from:
            kind: DockerImage
            name: "registry.redhat.io/rhoai/odh-kserve-storage-initializer-rhel9@sha256:166184c520c7821bacbedd05736938b58edc9cc2edc6071bfbc1105a4316aef5"
          importPolicy: {scheduled: false}
          referencePolicy: {type: Local}
    # WP-06/ADR-0322: the OGX operator's own in-process OCI-manifest-fetch
    # client 401s against registry.redhat.io directly even with a valid
    # cluster pull secret - imagePullSecrets on the operator's own
    # ServiceAccount has no effect, since that governs kubelet pulls, not
    # the operator's own registry HTTP client. Mirroring
    # here and pointing OGXServer.spec.distribution.image at the internal
    # copy instead (gitops/charts/openshift-ai) works around it if the
    # operator's client honors ambient in-cluster ServiceAccount-token
    # registry auth against the internal registry - see the RoleBinding
    # grant below (redhat-ods-applications added for this).
    - name: odh-ogx-core-rhel9
      tags:
        - name: rhel9
          from:
            kind: DockerImage
            name: "registry.redhat.io/rhoai/odh-ogx-core-rhel9@sha256:fd71c3ed486398002dac8aa09e1e4162e2bf740d33e192e1bbc2f3233d4f766a"
          importPolicy: {scheduled: false}
          referencePolicy: {type: Local}
  loop_control:
    loop_var: "mirror_stream"
    label: "{{ mirror_stream.name }}"

# Grants cross-namespace image-pull access to every namespace that runs a
# mirrored image. This mirrors apply_openshift_build.yml's identical grant
# for zuno-ai-build's build-output images (both idempotently apply the same
# RoleBinding shape from two call sites, matching this repo's existing
# tolerance for that - see the zuno-ai-build Namespace itself, applied by
# both the "namespaces" role and apply_openshift_build.yml). Needed here
# specifically because vault/redis (Day 0) need pull access before Day 1
# build ever runs apply_openshift_build.yml.
- name: "image_mirrors | grant image-pull access to the namespaces that run mirrored images"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: "zuno-ai-build-image-puller-{{ rbname }}"
        namespace: zuno-ai-build
        labels:
          zuno.io/managed-by: zuno-ansible
      subjects:
        - kind: Group
          apiGroup: rbac.authorization.k8s.io
          name: "system:serviceaccounts:{{ rbname }}"
      roleRef:
        kind: ClusterRole
        name: system:image-puller
        apiGroup: rbac.authorization.k8s.io
  loop:
    - zuno-ai-run
    - zuno-data
    - zuno-vault
    - zuno-auth
    # WP-06/ADR-0322: the OGX operator's controller pod and OGXServer's own
    # data-plane pods both run here - needed to pull odh-ogx-core-rhel9
    # above from the internal mirror.
    - redhat-ods-applications
    # WP-102/ADR-0418 clause 6: kept symmetric with the identical grant in
    # ansible/tasks/apply_openshift_build.yml (this repo's own documented
    # convention for these two lists) - not strictly needed for a mirrored
    # base image today, but avoids the two lists silently drifting.
    - zuno-aap
  loop_control:
    loop_var: "rbname"
