---
# Reverse of install.yml. The image-puller RoleBindings are intentionally
# left in place: apply_openshift_build.yml (Day 1 build) grants the same
# RoleBindings for the images it builds, so deleting them here could strand
# pull access for zuno-ai-run/zuno-data/zuno-vault/zuno-auth workloads that
# don't depend on the mirrors at all.
- name: "image_mirrors | delete the mirrored ImageStreams"
  kubernetes.core.k8s:
    state: absent
    api_version: image.openshift.io/v1
    kind: ImageStream
    namespace: zuno-ai-build
    name: "{{ mirror_stream_name }}"
  loop:
    - golang
    - node
    - python
    - ubi9-ubi-minimal
    - ubi9-python-311
    - distroless-static
    - vault
    - bitnami-kubectl
    - bitnami-redis
    - postgres
    - odh-kserve-storage-initializer-rhel9
  loop_control:
    loop_var: "mirror_stream_name"
