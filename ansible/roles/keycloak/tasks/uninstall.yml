---
# Reverse of install.yml. zuno-auth (shared namespace) is left in place.
#
# Delete -d1 (the Keycloak CR/RealmImport/ExternalSecrets operand) first,
# via ArgoCD prune, before remove_operator.yml deletes the CRDs those
# objects are instances of - avoids ArgoCD fighting a CR deletion its own
# Application still desires. remove_operator.yml then runs *before*
# deleting -d0: it discovers the installed CSV via the Subscription's own
# status.installedCSV field, which only exists while the Subscription (a
# -d0-managed resource) still exists. Running it before -d0's own delete
# also means its CRD delete (cascading any remaining Keycloak/
# KeycloakRealmImport CRs) and CSV/Subscription delete happen before
# ArgoCD's own cascade prune would otherwise race to remove the same
# Subscription object - same ordering ADR-0312 established for the other
# converted roles.
- name: "keycloak | delete the keycloak GitOps Application (d1: Keycloak CR/RealmImport/ExternalSecrets)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-keycloak-d1"

- name: "keycloak | remove the operator (its owned CRDs - cascading the Keycloak/KeycloakRealmImport CRs - then the CSV, then the Subscription)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/remove_operator.yml"
  vars:
    operator_subscription_name: rhbk-operator
    operator_namespace: zuno-auth

- name: "keycloak | delete the keycloak GitOps Application (d0: cascades the remaining OperatorGroup)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-keycloak-d0"
