---
# Reverse of install.yml + configure.yml. zuno-auth (shared namespace) is
# left in place.
- name: "keycloak | delete the keycloak ArgoCD Application"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-keycloak"

- name: "keycloak | remove the operator (its owned CRDs, then the CSV, then the Subscription)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/remove_operator.yml"
  vars:
    operator_subscription_name: rhbk-operator
    operator_namespace: zuno-auth

- name: "keycloak | delete the operator OperatorGroup"
  kubernetes.core.k8s:
    state: absent
    api_version: operators.coreos.com/v1
    kind: OperatorGroup
    name: rhbk-operator-group
    namespace: zuno-auth
