---
# zuno-auth (shared namespace) is left in place. Order matters: delete d1
# (Keycloak CR/RealmImport) first to avoid ArgoCD fighting the CRD
# deletion, then remove the operator while the Subscription (a d0-managed
# resource) still exists to read its installedCSV, then delete d0.
- name: "keycloak | delete the keycloak GitOps Application (d1: Keycloak CR/RealmImport/ExternalSecrets)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-keycloak-d1"

- name: "keycloak | remove the operator (its owned CRDs - cascading the Keycloak/KeycloakRealmImport CRs - then the CSV, then the Subscription)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/remove_operator.yml"
  vars:
    operator_subscription_name: rhbk-operator
    operator_namespace: zuno-auth

- name: "keycloak | delete the keycloak GitOps Application (d0: cascades the remaining OperatorGroup)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-keycloak-d0"
