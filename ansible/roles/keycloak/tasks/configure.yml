---
# Re-discovers the channel/catalog selection tasks/install.yml already
# validated is possible: apply_gitops_app.yml's gitops_app_extra_helm_values
# *replaces* spec.source.helm.values wholesale (ADR-0048), and a fact set
# in install.yml does not survive into this separate day0_configure.yml
# playbook run - same reasoning as
# ansible/roles/external_secrets/tasks/configure.yml's own re-discovery.
- name: "keycloak | look up the rhbk-operator PackageManifest"
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    namespace: openshift-marketplace
    name: rhbk-operator
  register: _keycloak_pkg_info

- name: "keycloak | fail if the rhbk-operator package isn't published anywhere on this cluster"
  ansible.builtin.fail:
    msg: "rhbk-operator PackageManifest not found - run 'make d0 install keycloak' first."
  when: (_keycloak_pkg_info.resources | default([]) | length) == 0

- name: "keycloak | select the channel/catalog to subscribe from"
  ansible.builtin.set_fact:
    _keycloak_catalog_source: "{{ _keycloak_pkg_info.resources[0].status.catalogSource }}"
    _keycloak_channel: >-
      {{
        'stable'
        if (_keycloak_pkg_info.resources[0].status.channels | selectattr('name', 'equalto', 'stable') | list | length) > 0
        else (_keycloak_pkg_info.resources[0].status.defaultChannel | default(''))
      }}

- name: "keycloak | fail if no usable channel was found"
  ansible.builtin.fail:
    msg: >-
      Package 'rhbk-operator' (catalog '{{ _keycloak_catalog_source }}')
      has no "stable" channel and no defaultChannel to fall back to.
      Published channels:
      {{ _keycloak_pkg_info.resources[0].status.channels | map(attribute='name') | list }}.
  when: _keycloak_channel | length == 0

- name: "keycloak | discovery summary"
  ansible.builtin.debug:
    msg: >-
      Subscribing to package 'rhbk-operator', catalog
      '{{ _keycloak_catalog_source }}', channel '{{ _keycloak_channel }}'.

# ADR-0312: templates/{operatorgroup,subscription}.yaml (sync-wave "-25")
# and the Keycloak CR/ExternalSecrets/RealmImport (sync-waves "-20"
# through "-10") all live in gitops/charts/keycloak, applied as a single
# ArgoCD Application here - the later waves are gated on the Subscription
# reporting Healthy via the custom health check
# ansible/roles/argocd/tasks/apply_resource_health_checks.yml registers.
# Applied here (configure.yml), not install.yml: the ExternalSecrets this
# same Application renders resolve against the vault-backend
# ClusterSecretStore, which only becomes Ready once
# ansible/roles/external_secrets/tasks/configure.yml has run - and
# `make day0|d0 all` runs every component's install.yml before any
# component's configure.yml, so applying here (after external_secrets,
# per day0_components ordering) matches that dependency; applying in
# install.yml would risk a first sync racing ahead of it.
- name: "keycloak | apply the keycloak GitOps Application"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "keycloak"
    gitops_app_name: "zuno-{{ gitops_component_name }}"
    gitops_app_extra_helm_values:
      subscriptionChannel: "{{ _keycloak_channel }}"
      subscriptionCatalogSource: "{{ _keycloak_catalog_source }}"
    gitops_app_wait_retries: 60

- name: "keycloak | wait for the Keycloak CR to report Ready"
  kubernetes.core.k8s_info:
    api_version: k8s.keycloak.org/v2alpha1
    kind: Keycloak
    namespace: zuno-auth
    name: zuno
  register: _keycloak_cr_status
  until: >-
    (_keycloak_cr_status.resources | default([]) | length) > 0 and
    (_keycloak_cr_status.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | list | first | default('False')) == 'True'
  retries: 60
  delay: 10

- name: "keycloak | wait for the zuno realm import to report Done"
  kubernetes.core.k8s_info:
    api_version: k8s.keycloak.org/v2alpha1
    kind: KeycloakRealmImport
    namespace: zuno-auth
    name: zuno-realm
  register: _keycloak_realmimport_status
  until: >-
    (_keycloak_realmimport_status.resources | default([]) | length) > 0 and
    (_keycloak_realmimport_status.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Done') | map(attribute='status') | list | first | default('False')) == 'True'
  retries: 60
  delay: 10

- name: "keycloak | operator action required if Google federation is still pending"
  ansible.builtin.debug:
    msg: >-
      The realm's "google" identity provider will only complete login flows
      once secret/zuno/google-oauth/client has real values (see
      ansible/roles/vault/tasks/configure.yml's placeholder-seeding step).
      Populate it with
      `vault kv put secret/zuno/google-oauth/client client_id=... client_secret=...`
      then let the google-oauth-client ExternalSecret resync (or delete the
      Keycloak pod to pick up the refreshed KC_VAULT_GOOGLE_CLIENT_* env
      vars) - no keycloak role step depends on this to complete.
