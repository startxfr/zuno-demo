---
# ADR-0352 / WP-211: `zuno_keycloak_mode: external` (ansible/confidential.yml) means the Keycloak is not ours: the
# RHBK operator (-d0) and the built-in instance are not deployed, install_external.yml asserts the endpoint instead,
# and the -d1 Application only carries the consumer side (client-secret ExternalSecrets, the client ConfigMap and the
# reconcile Job that creates the realm content in the external Keycloak). Absent means internal, exactly as before.
- name: "keycloak | resolve the cluster base domain"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_base_domain.yml"

- name: "keycloak | resolve the Keycloak endpoint and mode (ADR-0352, WP-211)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_keycloak_endpoint.yml"

# RHBK's CSV only supports OwnNamespace/SingleNamespace install modes, not
# AllNamespaces, so it's subscribed directly into zuno-auth rather than the
# shared openshift-operators namespace other operators use.
    # No bare "stable" channel exists for this operator (channels are
    # version-qualified, e.g. stable-v22/v24/v26); prefer an exact "stable"
    # match if one ever exists, else fall back to defaultChannel.
- name: "keycloak | resolve the operator package"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_operator_package.yml"
  when: not (zuno_keycloak_external_mode | bool)
  vars:
    operator_package_name: "rhbk-operator"
    operator_subscription_namespace: "zuno-auth"
    operator_package_catalog_hint: "rhbk"

- name: "keycloak | apply the keycloak GitOps Application (d0: operator)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  when:
    - not (zuno_keycloak_external_mode | bool)
    - not (operator_package_skip_d0 | bool)
  vars:
    gitops_component_name: "keycloak"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"
    gitops_app_extra_helm_values:
      namespace: zuno-auth
      operator:
        enabled: true
        subscription:
          operator:
            channel: "{{ operator_package_channel }}"
            source:
              name: "{{ operator_package_catalog }}"
    gitops_app_wait_retries: 60

# Optional read (unlike vault's hard fail on a missing confidential.yml):
# this role stays runnable without it - a missing file just leaves
# zuno_keycloak_google_oauth_enabled undefined, defaulting to true below.
- name: "keycloak | check for ansible/confidential.yml (optional, only for the googleOAuth.enabled flag)"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/confidential.yml"
  register: _keycloak_confidential_file

# ADR-0602 / WP-223: zuno_security_profile may be set per cluster; load that
# file BEFORE confidential.yml so a local confidential.yml still wins (same
# contract as every other load_cluster_vars.yml caller).
- name: "keycloak | load the committed per-cluster variables"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_cluster_vars.yml"

- name: "keycloak | load ansible/confidential.yml if present"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/confidential.yml"
  when: _keycloak_confidential_file.stat.exists

# ADR-0602 / WP-223: profile value, and in hardened the shared persona password
# against the realm's hardened passwordPolicy (the eval-personas Job sets it in
# the zuno realm with kcadm set-password, which enforces the policy).
- name: "keycloak | validate the security profile and the persona password"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/assert_security_profile.yml"
  vars:
    assert_security_profile_check_personas: true

# ADR-0352 / WP-211, external mode: assert the endpoint and the credential, seed Vault, publish the CA.
- name: "keycloak | install against the external Keycloak (ADR-0352 clause 4)"
  ansible.builtin.include_tasks: install_external.yml
  when: zuno_keycloak_external_mode | bool

# The chart values that switch the d1 Application to external mode ({} in internal mode, so its
# rendering is untouched). keycloak.enabled stays true (it gates the consumer-side objects).
- name: "keycloak | compute the mode-specific chart values"
  ansible.builtin.set_fact:
    _keycloak_mode_values: >-
      {{
        {
          'keycloak': {'builtIn': false},
          'keycloakExternal': {
            'url': zuno_keycloak_url,
            'realm': zuno_keycloak_realm,
            'adminRealm': zuno_keycloak_admin_realm,
            'caConfigMap': ('keycloak-external-ca' if (zuno_keycloak_ca_pem | length > 0) else ''),
            'seedPersonas': (zuno_keycloak_external_seed_personas | default(false) | bool)
          }
        } if (zuno_keycloak_external_mode | bool) else {}
      }}

# gitops_app_extra_helm_values REPLACES spec.source.helm.values wholesale
# rather than merging: values is a YAML *string* key, so combine(recursive=True)
# cannot descend into it. Re-supplying only the keys this role knew about
# silently dropped ingress.acmeWildcardTLS, which application-d1.yaml sets to
# true - the chart default is false, so the Keycloak Ingress stayed on the
# Vault-issued keycloak-tls and ADR-0211's consumer flip never took effect on
# demo222. Same defect as cert_manager's (fixed 2026-09-02, 17e4117c); the
# other dropped keys - namespace, keycloakCRName, adminSecretName,
# googleOAuthSecretName - happened to match the chart defaults exactly, which
# is why only this one was load-bearing.
#
# So start from the manifest's own values and merge in only what is discovered
# at run time. ADR-0581/WP-164: agentGroups comes from the admitted agents
# release (platform/okf/stack-config.generated.yaml); the client-reconcile Job
# creates the missing ones, never deletes, never touches membership.
# ADR-0602/WP-223: securityProfile (zuno_security_profile) picks the realm
# settings the same Job applies (brute-force protection always; password
# policy, short idle session and console TOTP in hardened). clusterBaseDomain needs no merge: it rides the
# apps.mycluster.example.com token that apply_gitops_app.yml substitutes into
# the file text, mirrored by the replace() below. Subscript ['values'], never
# .values - dot notation resolves to the Python dict method of that name and
# combine() then fails with "expected dicts but got a 'method'".
- name: "keycloak | apply the keycloak GitOps Application (d1: Keycloak CR/RealmImport/ExternalSecrets)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "keycloak"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
    gitops_app_extra_helm_values: >-
      {{
        ((lookup('ansible.builtin.file', zuno_repo_root + '/gitops/apps/keycloak/application-d1.yaml')
          | replace('apps.mycluster.example.com', cluster_base_domain)
          | from_yaml)['spec']['source']['helm']['values'] | from_yaml)
        | combine({'googleOAuth': {'enabled': (zuno_keycloak_google_oauth_enabled | default(true) | bool)}}, recursive=True)
        | combine({'securityProfile': (zuno_security_profile | default('demo'))})
        | combine(_keycloak_mode_values, recursive=True)
        | combine({'agentGroups': ((lookup('ansible.builtin.file', zuno_repo_root + '/platform/okf/stack-config.generated.yaml')
                                    | from_yaml)['keycloak']['groups'] | default([], true))})
      }}
    gitops_app_wait_retries: 60

- name: "keycloak | wait for the Keycloak CR to report Ready"
  when: not (zuno_keycloak_external_mode | bool)
  kubernetes.core.k8s_info:
    api_version: k8s.keycloak.org/v2alpha1
    kind: Keycloak
    namespace: zuno-auth
    name: zuno
  register: _keycloak_cr_status
  until: >-
    (_keycloak_cr_status.resources | default([]) | length) > 0 and
    (_keycloak_cr_status.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | list | first | default('False')) == 'True'
  retries: 60
  delay: 10

- name: "keycloak | wait for the zuno realm import to report Done"
  when: not (zuno_keycloak_external_mode | bool)
  kubernetes.core.k8s_info:
    api_version: k8s.keycloak.org/v2alpha1
    kind: KeycloakRealmImport
    namespace: zuno-auth
    name: zuno-realm
  register: _keycloak_realmimport_status
  until: >-
    (_keycloak_realmimport_status.resources | default([]) | length) > 0 and
    (_keycloak_realmimport_status.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Done') | map(attribute='status') | list | first | default('False')) == 'True'
  retries: 60
  delay: 10

- name: "keycloak | operator action required if Google federation is still pending"
  ansible.builtin.debug:
    msg: >-
      The realm's "google" identity provider will only complete login flows
      once zuno/google-oauth/client has real values - normally seeded from
      ansible/confidential.yml (zuno_google_oauth_client_id/_secret) by
      ansible/roles/vault/tasks/install.yml. If confidential.yml still has
      the "xxxxxx" placeholder for those fields, fill it in and re-run
      `make d0 install vault`, or populate it directly with
      `vault kv put zuno/google-oauth/client client_id=... client_secret=...`,
      then let the google-oauth-client ExternalSecret resync (or delete the
      Keycloak pod to pick up the refreshed KC_VAULT_GOOGLE_CLIENT_* env
      vars) - no keycloak role step depends on this to complete.
  when:
    - not (zuno_keycloak_external_mode | bool)
    - zuno_keycloak_google_oauth_enabled | default(true) | bool
