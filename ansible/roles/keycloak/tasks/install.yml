---
# Installs the Keycloak Operator (Red Hat build of Keycloak) via OLM,
# following the same operator-then-instance split used by
# ansible/roles/argocd and ansible/roles/external_secrets: the operator is
# subscribed imperatively here; the actual Keycloak CR + KeycloakRealmImport
# instance is applied declaratively by configure.yml via the
# gitops/apps/keycloak GitOps Application (gitops/charts/keycloak).
    # RHBK's CSV only supports OwnNamespace/SingleNamespace install modes
    # (AllNamespaces is explicitly unsupported) - found via live-cluster
    # testing on api.demo222.startx.fr: subscribing it into the shared
    # `openshift-operators` namespace (whose OperatorGroup targets every
    # namespace, the AllNamespaces pattern every other Day 0 operator in
    # this repo uses) failed the CSV with "AllNamespaces InstallModeType
    # not supported". Installed directly into zuno-auth instead (OwnNamespace
    # mode: the operator pod and the Keycloak CR it reconciles - applied by
    # this role's own configure.yml via gitops/apps/keycloak - both live in
    # the same namespace, so no separate operator-only namespace is needed).
    # zuno-auth is guaranteed to already exist here: the namespaces role
    # (Day 0, runs before keycloak) creates it.
    # Package name "rhbk-operator" in the redhat-operators catalog is
    # confirmed real (unlike CNPG/PGO's package-name assumptions - see
    # ansible/roles/postgresql/README.md for that history), but the
    # channel is not: RHBK's channels are version-qualified
    # (stable-v22/v24/v26...) with no bare "stable" alias, so a hardcoded
    # `channel: stable` hits OLM's ResolutionFailed/ConstraintsNotSatisfiable
    # - found via live-cluster testing on api.demo222.startx.fr, same
    # lesson as ADR-0048's CNPG channel discovery. Prefer an exact
    # "stable" match if one ever exists, else fall back to the package's
    # own defaultChannel rather than guessing a version.
- name: "keycloak | look up the rhbk-operator PackageManifest"
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    namespace: openshift-marketplace
    name: rhbk-operator
  register: _keycloak_pkg_info

- name: "keycloak | fail if the rhbk-operator package isn't published anywhere on this cluster"
  ansible.builtin.fail:
    msg: >-
      No PackageManifest named 'rhbk-operator' was found in
      openshift-marketplace. Check `oc get packagemanifest -n
      openshift-marketplace | grep -i keycloak` for the correct package
      name on this cluster and update this role's selection.
  when: (_keycloak_pkg_info.resources | default([]) | length) == 0

- name: "keycloak | select the channel to subscribe from"
  ansible.builtin.set_fact:
    _keycloak_pkg: "{{ _keycloak_pkg_info.resources[0] }}"
    _keycloak_catalog_source: "{{ _keycloak_pkg_info.resources[0].status.catalogSource }}"
    _keycloak_channel: >-
      {{
        'stable'
        if (_keycloak_pkg_info.resources[0].status.channels | selectattr('name', 'equalto', 'stable') | list | length) > 0
        else (_keycloak_pkg_info.resources[0].status.defaultChannel | default(''))
      }}

- name: "keycloak | fail if no usable channel was found"
  ansible.builtin.fail:
    msg: >-
      Package 'rhbk-operator' (catalog '{{ _keycloak_catalog_source }}')
      has no "stable" channel and no defaultChannel to fall back to.
      Published channels:
      {{ _keycloak_pkg.status.channels | map(attribute='name') | list }}.
  when: _keycloak_channel | length == 0

- name: "keycloak | discovery summary"
  ansible.builtin.debug:
    msg: >-
      Subscribing to package 'rhbk-operator', catalog
      '{{ _keycloak_catalog_source }}', channel '{{ _keycloak_channel }}'.

# ADR-0310: ansible/roles/keycloak/kustomize/operator/ - the OperatorGroup
# lives in the same group as the Subscription (order relative to the
# PackageManifest lookup above doesn't matter, since it isn't read by that
# lookup).
- name: "keycloak | apply the operator group and subscribe to the Red Hat build of Keycloak operator"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/keycloak/kustomize/operator"
    kustomize_replacements:
      __KEYCLOAK_CHANNEL__: "{{ _keycloak_channel }}"
      __KEYCLOAK_CATALOG_SOURCE__: "{{ _keycloak_catalog_source }}"

- name: "keycloak | wait for the Keycloak CRD to be established"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: keycloaks.k8s.keycloak.org
  register: _keycloak_crd
  until: (_keycloak_crd.resources | default([]) | length) > 0
  retries: 30
  delay: 10

- name: "keycloak | wait for the KeycloakRealmImport CRD to be established"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: keycloakrealmimports.k8s.keycloak.org
  register: _keycloak_realmimport_crd
  until: (_keycloak_realmimport_crd.resources | default([]) | length) > 0
  retries: 30
  delay: 10

    # UNVERIFIED against a real cluster until this role's own live test
    # ran far enough to reach it (channel discovery above was the
    # blocker first): discover the controller Deployment name rather
    # than hardcode "rhbk-operator-controller-manager", same reasoning
    # as ansible/roles/postgresql/tasks/prepare.yml's PGO controller
    # discovery.
- name: "keycloak | discover the operator controller Deployment name once OLM creates it"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: zuno-auth
  register: _keycloak_operator_deploys
  until: >-
    (_keycloak_operator_deploys.resources | default([])
     | selectattr('metadata.name', 'search', 'rhbk|keycloak')
     | list | length) > 0
  retries: 30
  delay: 10

- name: "keycloak | select the discovered operator controller Deployment name"
  ansible.builtin.set_fact:
    _keycloak_operator_deploy_name: >-
      {{
        (_keycloak_operator_deploys.resources
         | selectattr('metadata.name', 'search', 'rhbk|keycloak')
         | map(attribute='metadata.name') | list)[0]
      }}

- name: "keycloak | wait for the operator deployment to be ready"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: zuno-auth
    name: "{{ _keycloak_operator_deploy_name }}"
  register: _keycloak_operator_deploy
  until: (_keycloak_operator_deploy.resources[0].status.readyReplicas | default(0)) > 0
  retries: 60
  delay: 10
