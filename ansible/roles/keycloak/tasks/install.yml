---
# Discovers the Red Hat build of Keycloak operator's package/channel in
# this cluster's catalog, then applies the keycloak GitOps Application
# (ADR-0312: the Subscription lives in gitops/charts/keycloak, not applied
# directly here).
    # RHBK's CSV only supports OwnNamespace/SingleNamespace install modes
    # (AllNamespaces is explicitly unsupported) - found via live-cluster
    # testing on api.demo222.startx.fr: subscribing it into the shared
    # `openshift-operators` namespace (whose OperatorGroup targets every
    # namespace, the AllNamespaces pattern every other Day 0 operator in
    # this repo uses) failed the CSV with "AllNamespaces InstallModeType
    # not supported". Installed directly into zuno-auth instead (OwnNamespace
    # mode: the operator pod and the Keycloak CR it reconciles - both
    # rendered by gitops/charts/keycloak - both live in the same
    # namespace, so no separate operator-only namespace is needed).
    # zuno-auth is guaranteed to already exist here: the namespaces role
    # (Day 0, runs before keycloak) creates it.
    # Package name "rhbk-operator" in the redhat-operators catalog is
    # confirmed real (unlike CNPG/PGO's package-name assumptions - see
    # ansible/roles/postgresql/README.md for that history), but the
    # channel is not: RHBK's channels are version-qualified
    # (stable-v22/v24/v26...) with no bare "stable" alias, so a hardcoded
    # `channel: stable` hits OLM's ResolutionFailed/ConstraintsNotSatisfiable
    # - found via live-cluster testing on api.demo222.startx.fr, same
    # lesson as ADR-0048's CNPG channel discovery. Prefer an exact
    # "stable" match if one ever exists, else fall back to the package's
    # own defaultChannel rather than guessing a version.
- name: "keycloak | look up the rhbk-operator PackageManifest"
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    namespace: openshift-marketplace
    name: rhbk-operator
  register: _keycloak_pkg_info

- name: "keycloak | fail if the rhbk-operator package isn't published anywhere on this cluster"
  ansible.builtin.fail:
    msg: >-
      No PackageManifest named 'rhbk-operator' was found in
      openshift-marketplace. Check `oc get packagemanifest -n
      openshift-marketplace | grep -i keycloak` for the correct package
      name on this cluster and update this role's selection.
  when: (_keycloak_pkg_info.resources | default([]) | length) == 0

- name: "keycloak | select the channel/catalog to subscribe from"
  ansible.builtin.set_fact:
    _keycloak_catalog_source: "{{ _keycloak_pkg_info.resources[0].status.catalogSource }}"
    _keycloak_channel: >-
      {{
        'stable'
        if (_keycloak_pkg_info.resources[0].status.channels | selectattr('name', 'equalto', 'stable') | list | length) > 0
        else (_keycloak_pkg_info.resources[0].status.defaultChannel | default(''))
      }}

- name: "keycloak | fail if no usable channel was found"
  ansible.builtin.fail:
    msg: >-
      Package 'rhbk-operator' (catalog '{{ _keycloak_catalog_source }}')
      has no "stable" channel and no defaultChannel to fall back to.
      Published channels:
      {{ _keycloak_pkg_info.resources[0].status.channels | map(attribute='name') | list }}.
  when: _keycloak_channel | length == 0

- name: "keycloak | discovery summary"
  ansible.builtin.debug:
    msg: >-
      Subscribing to package 'rhbk-operator', catalog
      '{{ _keycloak_catalog_source }}', channel '{{ _keycloak_channel }}'.

# ADR-0312: the Subscription/OperatorGroup (operator.enabled, rendered by
# the vendored startx `operator` chart) live in gitops/charts/keycloak,
# applied via the separate zuno-keycloak-d0 Application.
- name: "keycloak | apply the keycloak GitOps Application (d0: operator)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "keycloak"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"
    gitops_app_extra_helm_values:
      namespace: zuno-auth
      operator:
        enabled: true
        subscription:
          operator:
            channel: "{{ _keycloak_channel }}"
            source:
              name: "{{ _keycloak_catalog_source }}"
    gitops_app_wait_retries: 60

# The Keycloak CR/ExternalSecrets/RealmImport (keycloak.enabled) live in
# the same chart, applied via the separate zuno-keycloak-d1 Application,
# after -d0 (above) is Synced+Healthy. The ExternalSecrets this
# Application renders resolve against the vault-backend ClusterSecretStore,
# which `external_secrets` (earlier in day0_components) has already made
# Ready by this point.
#
# Optional read, unlike ansible/roles/vault/tasks/install.yml's hard
# `fail` on a missing confidential.yml: this role stays independently
# runnable without it (ansible/README.md's "single component remains
# independently runnable" convention) - a missing file just means
# zuno_keycloak_google_oauth_enabled stays undefined, defaulting to true
# (today's existing behavior) below.
- name: "keycloak | check for ansible/confidential.yml (optional, only for the googleOAuth.enabled flag)"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/confidential.yml"
  register: _keycloak_confidential_file

- name: "keycloak | load ansible/confidential.yml if present"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/confidential.yml"
  when: _keycloak_confidential_file.stat.exists

# apply_gitops_app.yml's gitops_app_extra_helm_values *replaces*
# spec.source.helm.values wholesale (ADR-0048) rather than merging with
# gitops/apps/keycloak/application-d1.yaml's own checked-in values - so
# clusterBaseDomain must be re-supplied here too (already resolved as a
# fact by the -d0 call above, via apply_gitops_app.yml's own
# resolve_cluster_base_domain.yml include), or the chart would fall back
# to its values.yaml default (the literal, unsubstituted
# "apps.mycluster.example.com" placeholder) instead of this cluster's real
# apps domain.
- name: "keycloak | apply the keycloak GitOps Application (d1: Keycloak CR/RealmImport/ExternalSecrets)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "keycloak"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
    gitops_app_extra_helm_values:
      keycloak:
        enabled: true
      clusterBaseDomain: "{{ cluster_base_domain }}"
      googleOAuth:
        enabled: "{{ zuno_keycloak_google_oauth_enabled | default(true) | bool }}"
    gitops_app_wait_retries: 60

- name: "keycloak | wait for the Keycloak CR to report Ready"
  kubernetes.core.k8s_info:
    api_version: k8s.keycloak.org/v2alpha1
    kind: Keycloak
    namespace: zuno-auth
    name: zuno
  register: _keycloak_cr_status
  until: >-
    (_keycloak_cr_status.resources | default([]) | length) > 0 and
    (_keycloak_cr_status.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | list | first | default('False')) == 'True'
  retries: 60
  delay: 10

- name: "keycloak | wait for the zuno realm import to report Done"
  kubernetes.core.k8s_info:
    api_version: k8s.keycloak.org/v2alpha1
    kind: KeycloakRealmImport
    namespace: zuno-auth
    name: zuno-realm
  register: _keycloak_realmimport_status
  until: >-
    (_keycloak_realmimport_status.resources | default([]) | length) > 0 and
    (_keycloak_realmimport_status.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Done') | map(attribute='status') | list | first | default('False')) == 'True'
  retries: 60
  delay: 10

- name: "keycloak | operator action required if Google federation is still pending"
  ansible.builtin.debug:
    msg: >-
      The realm's "google" identity provider will only complete login flows
      once zuno/google-oauth/client has real values - normally seeded from
      ansible/confidential.yml (zuno_google_oauth_client_id/_secret) by
      ansible/roles/vault/tasks/install.yml. If confidential.yml still has
      the "xxxxxx" placeholder for those fields, fill it in and re-run
      `make d0 install vault`, or populate it directly with
      `vault kv put zuno/google-oauth/client client_id=... client_secret=...`,
      then let the google-oauth-client ExternalSecret resync (or delete the
      Keycloak pod to pick up the refreshed KC_VAULT_GOOGLE_CLIENT_* env
      vars) - no keycloak role step depends on this to complete.
  when: zuno_keycloak_google_oauth_enabled | default(true) | bool
