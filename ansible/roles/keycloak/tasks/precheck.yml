---
# Checks the d0/d1 Applications plus the CR-level readiness signals
# install.yml already waits on.
#
# ADR-0352 / WP-211: in external mode there is no d0 Application, no Keycloak CR and no realm import: the
# state is "the d1 consumer side is Synced/Healthy AND the external endpoint and credential are good"
# (assert_external.yml, recorded, never failing: the record-state contract of a precheck).
- name: "keycloak | resolve the cluster base domain"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_base_domain.yml"

- name: "keycloak | resolve the Keycloak endpoint and mode (ADR-0352, WP-211)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_keycloak_endpoint.yml"

- name: "keycloak | check the keycloak Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  when: not (zuno_keycloak_external_mode | bool)
  vars:
    gitops_app_name: "zuno-keycloak-d0"

- name: "keycloak | save the d0 check result"
  ansible.builtin.set_fact:
    _keycloak_d0_installed: "{{ _state_check_result | default(false) }}"
  when: not (zuno_keycloak_external_mode | bool)

- name: "keycloak | assert the external endpoint and the admin credential (record only)"
  ansible.builtin.include_tasks: assert_external.yml
  when: zuno_keycloak_external_mode | bool
  vars:
    keycloak_assert_hard_fail: false

- name: "keycloak | check the keycloak Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-keycloak-d1"

- name: "keycloak | save the d1 check result"
  ansible.builtin.set_fact:
    _keycloak_d1_installed: "{{ _state_check_result }}"

- name: "keycloak | look up the Keycloak CR"
  kubernetes.core.k8s_info:
    api_version: k8s.keycloak.org/v2alpha1
    kind: Keycloak
    namespace: zuno-auth
    name: zuno
  register: _keycloak_cr_lookup
  when: not (zuno_keycloak_external_mode | bool)

- name: "keycloak | look up the zuno realm import"
  kubernetes.core.k8s_info:
    api_version: k8s.keycloak.org/v2alpha1
    kind: KeycloakRealmImport
    namespace: zuno-auth
    name: zuno-realm
  register: _keycloak_realmimport_lookup
  when: not (zuno_keycloak_external_mode | bool)

- name: "keycloak | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        (
          _keycloak_d0_installed
          and _keycloak_d1_installed
          and (_keycloak_cr_lookup.resources | default([]) | length) > 0
          and (_keycloak_cr_lookup.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | list | first | default('False')) == 'True'
          and (_keycloak_realmimport_lookup.resources | default([]) | length) > 0
          and (_keycloak_realmimport_lookup.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Done') | map(attribute='status') | list | first | default('False')) == 'True'
        ) if not (zuno_keycloak_external_mode | bool)
        else (
          _keycloak_d1_installed
          and (keycloak_external_ok | default(false) | bool)
          and (keycloak_external_realm_exists | default(false) | bool)
        )
      }}

- name: "keycloak | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
