---
# Members of the Keycloak group openwebui_admin (Open WebUI admin role), kept in
# step with realm-zuno.json: the role adds them live (create-only, never removes).
open_webui_admin_users:
  - ai-ops-01
  - paas-ops-01
# The Keycloak pod the kcadm calls run in (keycloakCRName zuno, one instance).
open_webui_keycloak_pod: zuno-0
open_webui_namespace: zuno-openwebui
# WP-296 (ADR-0619 clause 5): the alternative AI gateways Open WebUI also lists, in the `altGateways` contract:
# {name, label, url, models}. Empty: the Application's values are the ones of before. The role writes the list
# to the three chart values that need it (gitops/charts/open-webui/values.yaml explains why there are three).
open_webui_alt_gateways: []
# Models that get a per-model entry without the Zuno tools (files/model_overrides.py), full Open WebUI ids
# (<prefix>.<model>). The SaaS models of Praxis are added by the role when zuno_praxis_saas_enabled is true.
open_webui_no_tools_models: []
