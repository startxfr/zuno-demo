---
# ADR-0588 (WP-181): Open WebUI, the general-purpose chat experience.
# Order: secrets in Vault, the admin group in Keycloak, then the Application.
- name: "open-webui | resolve the cluster base domain"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_base_domain.yml"

- name: "open-webui | seed the Vault paths"
  ansible.builtin.include_tasks: seed_vault.yml

- name: "open-webui | create the Keycloak admin group"
  ansible.builtin.include_tasks: keycloak_admin_group.yml

# The egress NetworkPolicy lets HTTPS out of the cluster but not into the pod
# and Service networks (the EgressFirewall then narrows "out" to Keycloak).
- name: "open-webui | read the cluster networks"
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Network
    name: cluster
  register: _open_webui_network

- name: "open-webui | fail if the cluster networks are unknown"
  ansible.builtin.fail:
    msg: "Network.config.openshift.io/cluster has no clusterNetwork/serviceNetwork: the egress policy cannot exclude them."
  when: >-
    (_open_webui_network.resources | default([]) | length) == 0 or
    (_open_webui_network.resources[0].spec.clusterNetwork | default([]) | length) == 0 or
    (_open_webui_network.resources[0].spec.serviceNetwork | default([]) | length) == 0

- name: "open-webui | apply the Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "open-webui"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-open-webui-d1"
    gitops_app_extra_helm_values:
      global:
        zuno:
          clusterBaseDomain: "{{ cluster_base_domain }}"
          routeHost: "open-webui.{{ cluster_base_domain }}"
      egress:
        clusterCIDRs: >-
          {{ (_open_webui_network.resources[0].spec.clusterNetwork | map(attribute='cidr') | list)
             + _open_webui_network.resources[0].spec.serviceNetwork }}

- name: "open-webui | wait for the Deployment to be available"
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ open_webui_namespace }}"
    name: open-webui
  register: _open_webui_deploy
  until: >-
    (_open_webui_deploy.resources | default([]) | length > 0) and
    ((_open_webui_deploy.resources[0].status.availableReplicas | default(0)) >= 1)
  retries: 60
  delay: 15

- name: "open-webui | installed"
  ansible.builtin.debug:
    msg: >-
      Open WebUI is at https://open-webui.{{ cluster_base_domain }} - sign in with
      a realm zuno user; `make d2 check open-webui` verifies the chain.
