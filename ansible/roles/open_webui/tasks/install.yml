---
# ADR-0588 (WP-181): Open WebUI, the general-purpose chat experience.
# Order: secrets in Vault, the admin group in Keycloak, then the Application.
# WP-296: open_webui_alt_gateways lives in ansible/clusters/<cluster>.yml (committed, so AAP reads it too). Without
# this include the role kept its empty default and the Application was applied unchanged (live, 2026-11-17).
- name: "open-webui | load the committed per-cluster variables"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_cluster_vars.yml"

- name: "open-webui | resolve the cluster base domain"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_base_domain.yml"

- name: "open-webui | seed the Vault paths"
  ansible.builtin.include_tasks: seed_vault.yml

- name: "open-webui | create the Keycloak admin group"
  ansible.builtin.include_tasks: keycloak_admin_group.yml

# The egress NetworkPolicy lets HTTPS out of the cluster but not into the pod
# and Service networks (the EgressFirewall then narrows "out" to Keycloak).
- name: "open-webui | read the cluster networks"
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Network
    name: cluster
  register: _open_webui_network

- name: "open-webui | fail if the cluster networks are unknown"
  ansible.builtin.fail:
    msg: "Network.config.openshift.io/cluster has no clusterNetwork/serviceNetwork: the egress policy cannot exclude them."
  when: >-
    (_open_webui_network.resources | default([]) | length) == 0 or
    (_open_webui_network.resources[0].spec.clusterNetwork | default([]) | length) == 0 or
    (_open_webui_network.resources[0].spec.serviceNetwork | default([]) | length) == 0

# WP-296: a chart cannot write its subchart's values, so the one list open_webui_alt_gateways goes to the three
# values that need it; openaiBaseApiUrls keeps the chart's own first URL (the ai-gateway). Empty list: no key added.
- name: "open-webui | the values of the alternative gateways (WP-296)"
  ansible.builtin.set_fact:
    _open_webui_alt_values: >-
      {{ {} if (open_webui_alt_gateways | length) == 0 else {
           'altGateways': open_webui_alt_gateways,
           'global': {'zuno': {'altGateways': open_webui_alt_gateways}},
           'open-webui': {'openaiBaseApiUrls':
             ((lookup('ansible.builtin.file', zuno_repo_root ~ '/gitops/charts/open-webui/values.yaml') | from_yaml)['open-webui'].openaiBaseApiUrls[:1])
             + (open_webui_alt_gateways | map(attribute='url') | list)}
         } }}

- name: "open-webui | apply the Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "open-webui"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-open-webui-d1"
    gitops_app_extra_helm_values: >-
      {{ {
           'global': {'zuno': {'clusterBaseDomain': cluster_base_domain, 'routeHost': 'open-webui.' ~ cluster_base_domain}},
           'egress': {'clusterCIDRs': (_open_webui_network.resources[0].spec.clusterNetwork | map(attribute='cidr') | list)
                                      + _open_webui_network.resources[0].spec.serviceNetwork}
         } | combine(_open_webui_alt_values, recursive=True) }}

- name: "open-webui | wait for the Deployment to be available"
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ open_webui_namespace }}"
    name: open-webui
  register: _open_webui_deploy
  until: >-
    (_open_webui_deploy.resources | default([]) | length > 0) and
    ((_open_webui_deploy.resources[0].status.availableReplicas | default(0)) >= 1)
  retries: 60
  delay: 15

# ADR-0619 (update of 2026-11-19): the global defaults attach the Zuno tools to every model, and Praxis refuses a
# SaaS call that carries tools (403 saas_tools_not_allowed, the owner's decision of 2026-11-18). The SaaS models of
# Praxis therefore get a per-model entry without tools (files/model_overrides.py). Their ids are the prefix of the
# connection plus the SaaS names of the Praxis chart, read here, never written twice.
- name: "open-webui | the models that run without the Zuno tools"
  ansible.builtin.set_fact:
    _open_webui_no_tools: >-
      {{ open_webui_no_tools_models + ((
           ['claude', 'codestral'] | map('extract',
             (lookup('ansible.builtin.file', zuno_repo_root ~ '/gitops/charts/praxis/values.yaml') | from_yaml).saas)
           | map(attribute='name') | map('regex_replace', '^', 'praxis.') | list)
         if (zuno_praxis_saas_enabled | default(false) | bool)
            and ('praxis' in (open_webui_alt_gateways | map(attribute='name') | list)) else []) }}

- name: "open-webui | find the Open WebUI pod"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ open_webui_namespace }}"
    label_selectors: ["app.kubernetes.io/component=open-webui"]
    field_selectors: ["status.phase=Running"]
  register: _open_webui_pods
  when: _open_webui_no_tools | length > 0

- name: "open-webui | turn the Zuno tools off for those models"
  ansible.builtin.shell: |
    set -o pipefail
    oc -n {{ open_webui_namespace }} exec -i -c open-webui {{ _open_webui_pods.resources[0].metadata.name }} -- \
      sh -c 'cd /app/backend && python3 - "$1"' _ {{ {'no_tools': _open_webui_no_tools} | to_json | quote }} \
      < {{ (role_path ~ '/files/model_overrides.py') | quote }}
  args:
    executable: /bin/bash
  register: _open_webui_overrides
  changed_when: "'created' in _open_webui_overrides.stdout or 'updated' in _open_webui_overrides.stdout"
  when:
    - _open_webui_no_tools | length > 0
    - not ansible_check_mode

- name: "open-webui | report the models without tools"
  ansible.builtin.debug:
    msg: "models without the Zuno tools: {{ (_open_webui_overrides.stdout | default('{}')) if _open_webui_no_tools else 'none' }}"

- name: "open-webui | installed"
  ansible.builtin.debug:
    msg: >-
      Open WebUI is at https://open-webui.{{ cluster_base_domain }} - sign in with
      a realm zuno user; `make d2 check open-webui` verifies the chain.
