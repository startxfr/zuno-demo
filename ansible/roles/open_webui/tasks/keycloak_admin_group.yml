---
# ADR-0588 decision 2: Open WebUI's admin role comes from the Keycloak group
# openwebui_admin (OAUTH_ADMIN_ROLES=/openwebui_admin). realm-zuno.json declares
# the group and its members, but groups and users are create-only on a live realm
# (the client-reconcile Job only creates agent_* groups), so they are created here:
# the group when missing, and each member added when missing. Nothing is removed.
#
# ADR-0352 / WP-211: over the Admin REST API (the pattern of dify's keycloak_sa_groups.yml), in both
# modes. It used to kubectl-exec `kcadm.sh` inside the built-in pod zuno-0, which an external
# Keycloak does not have.
- name: "open-webui | read the Keycloak automation credentials (ADR-0595)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/read_keycloak_automation_credentials.yml"

- name: "open-webui | get a Keycloak admin token"
  ansible.builtin.uri:
    url: "{{ zuno_keycloak_admin_token_url }}"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: admin-cli
      username: "{{ _kc_automation_user }}"
      password: "{{ _kc_automation_password }}"
    validate_certs: "{{ zuno_validate_route_certs | default(false) | bool }}"
  register: _open_webui_kc_token
  no_log: true

- name: "open-webui | set the admin API facts"
  ansible.builtin.set_fact:
    _kc_api: "{{ zuno_keycloak_url }}/admin/realms/{{ zuno_keycloak_realm }}"
    _kc_headers:
      Authorization: "Bearer {{ _open_webui_kc_token.json.access_token }}"
  no_log: true

- name: "open-webui | look up the openwebui_admin group"
  ansible.builtin.uri:
    url: "{{ _kc_api }}/groups?search=openwebui_admin&exact=true"
    headers: "{{ _kc_headers }}"
    validate_certs: "{{ zuno_validate_route_certs | default(false) | bool }}"
  register: _open_webui_kc_groups
  no_log: true

- name: "open-webui | create the openwebui_admin group when missing"
  ansible.builtin.uri:
    url: "{{ _kc_api }}/groups"
    method: POST
    headers: "{{ _kc_headers }}"
    body_format: json
    body: {name: openwebui_admin}
    status_code: [201]
    validate_certs: "{{ zuno_validate_route_certs | default(false) | bool }}"
  when: (_open_webui_kc_groups.json | selectattr('name', 'equalto', 'openwebui_admin') | list | length) == 0
  register: _open_webui_kc_group_created
  changed_when: true
  no_log: true

- name: "open-webui | read the group id"
  ansible.builtin.uri:
    url: "{{ _kc_api }}/groups?search=openwebui_admin&exact=true"
    headers: "{{ _kc_headers }}"
    validate_certs: "{{ zuno_validate_route_certs | default(false) | bool }}"
  register: _open_webui_kc_groups_after
  no_log: true

- name: "open-webui | keep the group id"
  ansible.builtin.set_fact:
    _open_webui_group_id: "{{ (_open_webui_kc_groups_after.json | selectattr('name', 'equalto', 'openwebui_admin') | list | first).id }}"

- name: "open-webui | look up each admin user"
  ansible.builtin.uri:
    url: "{{ _kc_api }}/users?username={{ item }}&exact=true"
    headers: "{{ _kc_headers }}"
    validate_certs: "{{ zuno_validate_route_certs | default(false) | bool }}"
  loop: "{{ open_webui_admin_users }}"
  register: _open_webui_kc_users
  no_log: true

- name: "open-webui | read the groups of each existing admin user"
  ansible.builtin.uri:
    url: "{{ _kc_api }}/users/{{ item.json[0].id }}/groups"
    headers: "{{ _kc_headers }}"
    validate_certs: "{{ zuno_validate_route_certs | default(false) | bool }}"
  loop: "{{ _open_webui_kc_users.results | selectattr('json', 'truthy') | list }}"
  loop_control:
    label: "{{ item.item }}"
  register: _open_webui_kc_memberships
  no_log: true

- name: "open-webui | add the missing members to openwebui_admin"
  ansible.builtin.uri:
    url: "{{ _kc_api }}/users/{{ item.item.json[0].id }}/groups/{{ _open_webui_group_id }}"
    method: PUT
    headers: "{{ _kc_headers }}"
    status_code: [204]
    validate_certs: "{{ zuno_validate_route_certs | default(false) | bool }}"
  loop: "{{ _open_webui_kc_memberships.results }}"
  loop_control:
    label: "{{ item.item.item }}"
  when: (item.json | selectattr('name', 'equalto', 'openwebui_admin') | list | length) == 0
  register: _open_webui_kc_added
  changed_when: true
  no_log: true

- name: "open-webui | report the openwebui_admin group"
  ansible.builtin.debug:
    msg:
      - "group openwebui_admin: {{ 'created' if (_open_webui_kc_group_created is changed) else 'already present' }}"
      - "users absent from the realm, skipped: {{ _open_webui_kc_users.results | rejectattr('json', 'truthy') | map(attribute='item') | list }}"
      - "members added: {{ _open_webui_kc_added.results | default([]) | rejectattr('skipped', 'defined') | map(attribute='item') | map(attribute='item') | map(attribute='item') | list }}"
