---
# Removes the Application (and with it the Deployment, Route, PVC and Secrets).
# The Keycloak client and group, and the Vault paths, are kept: they are shared
# declarations (realm-zuno.json, vault role) and a reinstall reuses them.
- name: "open-webui | delete the Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-open-webui-d1"
