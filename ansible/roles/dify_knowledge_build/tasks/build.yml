---
# ADR-0599/WP-205 "dify-knowledge" build component: builds components/zuno-dify-knowledge, the
# Dify External Knowledge adapter over the mcp-gateway. Consumed by gitops/charts/zuno-dify-knowledge
# as zuno-ai-build/zuno-dify-knowledge:latest.
- name: "dify_knowledge_build | build zuno-dify-knowledge"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_openshift_build.yml"
  vars:
    build_image_name: zuno-dify-knowledge
    build_dockerfile_path: components/zuno-dify-knowledge/Dockerfile
    build_context_dir: "."

# Pull access for the adapter's own ServiceAccount only (the namespace also runs third-party pods).
- name: "dify_knowledge_build | grant the zuno-dify-knowledge ServiceAccount image-pull access"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: "zuno-dify-knowledge-image-puller-{{ zuno_dify_knowledge_namespace }}"
        namespace: zuno-ai-build
        labels:
          zuno.io/managed-by: zuno-ansible
      subjects:
        - kind: ServiceAccount
          name: zuno-dify-knowledge
          namespace: "{{ zuno_dify_knowledge_namespace }}"
      roleRef:
        kind: ClusterRole
        name: system:image-puller
        apiGroup: rbac.authorization.k8s.io
