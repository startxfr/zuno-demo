# Day 1 "rag" build component: builds the RAG service image.
- name: "rag_build | build rag-service"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_openshift_build.yml"
  vars:
    build_image_name: rag-service
    build_dockerfile_path: Dockerfile
    build_context_dir: components/rag-service
