---
# Provider API key placeholders are seeded by the vault role, not this one;
# this role only registers the GitOps Applications below.
#
# No OLM operator involved in any of these three - all content is -d1
# (the -d0 Applications are no-ops).
- name: "llm | apply the provider-routing/AI Inference Gateway/Agent Runtime GitOps Applications (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "{{ _llm_component }}"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ _llm_component }}-d0"
  loop:
    - llm
    - ai-gateway
    - agent-runtime
  loop_control:
    loop_var: _llm_component

- name: "llm | apply the provider-routing/AI Inference Gateway/Agent Runtime GitOps Applications (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "{{ _llm_component }}"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ _llm_component }}-d1"
  loop:
    - llm
    - ai-gateway
    - agent-runtime
  loop_control:
    loop_var: _llm_component
