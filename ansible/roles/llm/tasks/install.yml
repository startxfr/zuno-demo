---
# Provider API key placeholders (zuno/providers/{openai,gemini,anthropic,
# mistral}) are seeded by ansible/roles/vault/tasks/install.yml, alongside
# every other platform secret - this role never talks to Vault directly,
# it only registers the GitOps Applications below. See
# platform/ai-gateway/externalsecret-*.yaml for how those placeholders
# reach the cluster (vault-backend ClusterSecretStore).

# No OLM operator involved in any of these three - all of their content is
# -d1 (see each gitops/apps/<component>/application-d0.yaml, a no-op).
- name: "llm | apply the provider-routing/AI Inference Gateway/Agent Runtime GitOps Applications (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "{{ _llm_component }}"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ _llm_component }}-d0"
  loop:
    - llm
    - ai-gateway
    - agent-runtime
  loop_control:
    loop_var: _llm_component

- name: "llm | apply the provider-routing/AI Inference Gateway/Agent Runtime GitOps Applications (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "{{ _llm_component }}"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ _llm_component }}-d1"
  loop:
    - llm
    - ai-gateway
    - agent-runtime
  loop_control:
    loop_var: _llm_component
