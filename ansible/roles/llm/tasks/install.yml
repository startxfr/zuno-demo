---
# Provider API key placeholders are seeded by vault, not here; this role only
# builds the image its Applications need (ai-gateway), then registers those
# Applications below - the build component's name does not match this run
# component's, so without it `make d2 install llm` would leave ai-gateway in
# ImagePullBackOff on a fresh cluster (apply_openshift_build.yml documents
# the idempotency guarantee: a status check, not a rebuild, once the image
# exists). WP-156 removed agent-runtime from this role's loops (and its
# first-run OKF signing); ai-gateway stays.
# The WP-157 ai-gateway switches are per-cluster knobs
# (ansible/clusters/<cluster>.yml), so the cluster file is loaded first.
- name: "llm | load this cluster's non-secret variables"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_cluster_vars.yml"

- name: "llm | ensure the ai-gateway image is built"
  ansible.builtin.include_role:
    name: ai_gateway_build
    tasks_from: build

# No OLM operator involved in either - all content is -d1
# (the -d0 Applications are no-ops).
- name: "llm | apply the provider-routing/AI Inference Gateway GitOps Applications (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "{{ _llm_component }}"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ _llm_component }}-d0"
  loop:
    - llm
    - ai-gateway
  loop_control:
    loop_var: _llm_component

- name: "llm | apply the provider-routing GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "llm"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-llm-d1"

# Inline values REPLACE the manifest's own (apply_gitops_app.yml), hence
# clusterBaseDomain restated. The WP-157 switches default to the
# chart's own false; a cluster turns one on in ansible/clusters/<cluster>.yml
# only after its live verification (WP-157 brief, enable sequence).
- name: "llm | apply the AI Inference Gateway GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "ai-gateway"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-ai-gateway-d1"
    gitops_app_extra_helm_values:
      clusterBaseDomain: "{{ cluster_base_domain }}"
      trustedPlatformClients: "{{ zuno_ai_gateway_trusted_platform_clients | default([]) }}"
      quotaLedger:
        store: "{{ zuno_ai_gateway_quota_ledger_store | default('memory') }}"
      # ADR-0581 (WP-164 lot 2): mount the generated model-routing policy.
      modelRouting:
        generated: "{{ zuno_ai_gateway_model_routing_generated | default(false) | bool }}"
      # ADR-0579 (WP-164 lot 3): mount the generated per-agent guardrail modes.
      guardrails:
        modesGenerated: "{{ zuno_ai_gateway_guardrails_modes_generated | default(false) | bool }}"
      maasAdapter:
        gatewayIdentity:
          enabled: "{{ zuno_ai_gateway_maas_gateway_identity | default(false) | bool }}"
        quota429Passthrough:
          enabled: "{{ zuno_ai_gateway_maas_quota_429_passthrough | default(false) | bool }}"
        failModes:
          enabled: "{{ zuno_ai_gateway_quota_fail_modes | default(false) | bool }}"
        closedClassMaasOnly:
          enabled: "{{ zuno_ai_gateway_closed_class_maas_only | default(false) | bool }}"
        # WP-157 SaaS-through-MaaS pilot: lets a SaaS provider marked
        # via_maas (the `mistral` pilot) reach MaaS. Off by default; turning
        # it on is an egress decision of its own (chart values comment).
        externalEgressEnabled: "{{ zuno_ai_gateway_maas_external_egress | default(false) | bool }}"
