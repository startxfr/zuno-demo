---
# State detection (never fails). llm applies six separate Applications in
# install.yml (provider routing, ai-gateway, agent-runtime - each as a
# -d0/-d1 pair) - "installed" requires all six Synced+Healthy.
- name: "llm | check the llm Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-llm-d0"
- name: "llm | remember the llm Application (d0) state"
  ansible.builtin.set_fact:
    _llm_state_llm_d0: "{{ _state_check_result }}"

- name: "llm | check the llm Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-llm-d1"
- name: "llm | remember the llm Application (d1) state"
  ansible.builtin.set_fact:
    _llm_state_llm_d1: "{{ _state_check_result }}"

- name: "llm | check the ai-gateway Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-ai-gateway-d0"
- name: "llm | remember the ai-gateway Application (d0) state"
  ansible.builtin.set_fact:
    _llm_state_ai_gateway_d0: "{{ _state_check_result }}"

- name: "llm | check the ai-gateway Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-ai-gateway-d1"
- name: "llm | remember the ai-gateway Application (d1) state"
  ansible.builtin.set_fact:
    _llm_state_ai_gateway_d1: "{{ _state_check_result }}"

- name: "llm | check the agent-runtime Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-agent-runtime-d0"
- name: "llm | remember the agent-runtime Application (d0) state"
  ansible.builtin.set_fact:
    _llm_state_agent_runtime_d0: "{{ _state_check_result }}"

- name: "llm | check the agent-runtime Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-agent-runtime-d1"
- name: "llm | remember the agent-runtime Application (d1) state"
  ansible.builtin.set_fact:
    _llm_state_agent_runtime_d1: "{{ _state_check_result }}"

- name: "llm | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        _llm_state_llm_d0 and _llm_state_llm_d1
        and _llm_state_ai_gateway_d0 and _llm_state_ai_gateway_d1
        and _llm_state_agent_runtime_d0 and _llm_state_agent_runtime_d1
      }}

- name: "llm | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
