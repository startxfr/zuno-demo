---
- name: "llm | verify ArgoCD is installed"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: applications.argoproj.io
  register: _llm_precheck_argocd_crd

- name: "llm | fail if ArgoCD is not yet installed"
  ansible.builtin.fail:
    msg: "applications.argoproj.io CRD not found. Run `make d0 install argocd` first."
  when: (_llm_precheck_argocd_crd.resources | default([]) | length) == 0

- name: "llm | precheck summary"
  ansible.builtin.debug:
    msg: "ArgoCD is installed; provider routing and the Agent Runtime can be applied."
