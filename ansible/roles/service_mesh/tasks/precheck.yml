---
# "Installed" checks both Applications plus the ClusterIssuer's and Istio
# control plane's own Ready signals.
- name: "service_mesh | check the service-mesh Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-service-mesh-d0"

- name: "service_mesh | save the d0 check result"
  ansible.builtin.set_fact:
    _service_mesh_d0_installed: "{{ _state_check_result }}"

- name: "service_mesh | check the service-mesh Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-service-mesh-d1"

- name: "service_mesh | look up the vault-issuer-istio ClusterIssuer"
  kubernetes.core.k8s_info:
    api_version: cert-manager.io/v1
    kind: ClusterIssuer
    name: vault-issuer-istio
  register: _service_mesh_issuer_lookup

- name: "service_mesh | look up the ServiceMeshControlPlane (zuno-mesh)"
  kubernetes.core.k8s_info:
    api_version: maistra.io/v2
    kind: ServiceMeshControlPlane
    name: zuno-mesh
    namespace: zuno-mesh
  register: _service_mesh_istio_lookup

- name: "service_mesh | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        _service_mesh_d0_installed
        and _state_check_result
        and (_service_mesh_issuer_lookup.resources | default([]) | length) > 0
        and (_service_mesh_issuer_lookup.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | list | first | default('False')) == 'True'
        and (_service_mesh_istio_lookup.resources | default([]) | length) > 0
        and (_service_mesh_istio_lookup.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | list | first | default('False')) == 'True'
      }}

- name: "service_mesh | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
