---
# State detection (never fails). argocd has no configure phase (ADR-0311)
# - "configured" mirrors "installed" (the server Deployment being ready).
- name: "argocd | look up the default ArgoCD server Deployment"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: openshift-gitops
    name: openshift-gitops-server
  register: _argocd_server_lookup

- name: "argocd | compute configure state"
  ansible.builtin.set_fact:
    _state_is_configured: >-
      {{
        (_argocd_server_lookup.resources | default([]) | length) > 0
        and (_argocd_server_lookup.resources[0].status.readyReplicas | default(0)) > 0
      }}

- name: "argocd | record configure state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_configure_state.yml"
