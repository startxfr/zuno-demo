---
- name: "argocd | apply the root App-of-Apps"
  kubernetes.core.k8s:
    state: present
    src: "{{ zuno_repo_root }}/gitops/root-app-of-apps.yaml"

- name: "argocd | wait for the App-of-Apps to become Synced and Healthy"
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: openshift-gitops
    name: zuno-app-of-apps
  register: _argocd_root_app
  until: >-
    (_argocd_root_app.resources | default([]) | length) > 0 and
    (_argocd_root_app.resources[0].status.sync.status | default('') == 'Synced')
  retries: 30
  delay: 10
