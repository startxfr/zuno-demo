---
# Reverse of install.yml (configure.yml has nothing to reverse - ADR-0311).
# There is no root App-of-Apps to delete here: since ADR-0311, nothing
# under ansible/ ever applies gitops/root-app-of-apps.yaml, so uninstall
# only has to remove the operator's own resources. An operator who applied
# the App-of-Apps by hand, following its documented example in
# docs/platform/installation.md, is responsible for removing it the same
# way (`oc -n openshift-gitops delete application zuno-app-of-apps`).
- name: "argocd | delete the application-controller ClusterRoleBinding"
  kubernetes.core.k8s:
    state: absent
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    name: zuno-argocd-application-controller-admin

- name: "argocd | delete the operator Subscription"
  kubernetes.core.k8s:
    state: absent
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    name: openshift-gitops-operator
    namespace: openshift-operators

# openshift-gitops-operator (the Namespace) and openshift-operators (shared
# with other Day 0 operators) are left in place - see
# ansible/roles/namespaces for the platform's namespace lifecycle.
