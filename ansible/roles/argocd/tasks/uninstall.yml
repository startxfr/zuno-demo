---
# No root App-of-Apps to delete: ansible never applies gitops/root-app-of-apps.yaml,
# so uninstall only removes the operator's own resources.
- name: "argocd | delete the application-controller ClusterRoleBinding"
  kubernetes.core.k8s:
    state: absent
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    name: zuno-argocd-application-controller-admin

- name: "argocd | delete the zuno AppProject"
  kubernetes.core.k8s:
    state: absent
    api_version: argoproj.io/v1alpha1
    kind: AppProject
    name: zuno
    namespace: openshift-gitops

# Operator removal is intentionally skipped here.
