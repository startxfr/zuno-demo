---
# No root App-of-Apps to delete: ansible never applies
# gitops/root-app-of-apps.yaml, so uninstall only removes the operator's own
# resources.
- name: "argocd | delete the application-controller ClusterRoleBinding"
  kubernetes.core.k8s:
    state: absent
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    name: zuno-argocd-application-controller-admin

# ADR-0602 clause 5 / WP-224: the three projects, plus the legacy `zuno`
# one a cluster may still carry from before the split.
- name: "argocd | delete the zuno AppProjects"
  kubernetes.core.k8s:
    state: absent
    api_version: argoproj.io/v1alpha1
    kind: AppProject
    name: "{{ _argocd_appproject }}"
    namespace: openshift-gitops
  loop:
    - zuno-platform
    - zuno-apps
    - zuno-bootstrap
    - zuno
  loop_control:
    loop_var: _argocd_appproject

# Operator removal is intentionally skipped here.
