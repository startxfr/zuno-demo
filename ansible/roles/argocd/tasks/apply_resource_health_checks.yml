---
# ArgoCD has no built-in health logic for Subscription, so without this it
# reports Healthy immediately on apply, before OLM installs the CSV -
# breaking sync-wave gating for charts that apply an operand CR in a later wave.
#
# Patches the operator-managed ArgoCD CR rather than argocd-cm directly:
# the operator reconciles argocd-cm from this CR's spec, so a raw ConfigMap
# edit would be reverted on the next reconcile.
- name: "argocd | register the Subscription resource health check (ADR-0312)"
  kubernetes.core.k8s:
    state: patched
    api_version: argoproj.io/v1beta1
    kind: ArgoCD
    name: openshift-gitops
    namespace: openshift-gitops
    definition:
      spec:
        resourceHealthChecks:
          - group: operators.coreos.com
            kind: Subscription
            check: |
              hs = {}
              if obj.status ~= nil and obj.status.installedCSV ~= nil and obj.status.installedCSV ~= "" then
                hs.status = "Healthy"
                hs.message = "Installed " .. obj.status.installedCSV
                return hs
              end
              if obj.status ~= nil and obj.status.conditions ~= nil then
                for i, condition in ipairs(obj.status.conditions) do
                  if condition.type == "CatalogSourcesUnhealthy" and condition.status == "True" then
                    hs.status = "Degraded"
                    hs.message = condition.message
                    return hs
                  end
                end
              end
              hs.status = "Progressing"
              hs.message = "Waiting for OLM to install the Subscription's CSV"
              return hs
          # ADR-0535/WP-111, user-approved live finding (2026-09-02): none
          # of policy-controller-operator.v1.0.2's three CRDs (TrustRoot,
          # ClusterImagePolicy, PolicyController) ever populate a
          # status.conditions[type=Ready] ArgoCD's generic health check
          # recognizes - every sync hangs forever on "waiting for healthy
          # state of ...", and since ArgoCD applies same-wave resources in
          # order and waits per-resource, later resources (PolicyController)
          # never even get applied. All three are simple declarative
          # records with no real "unhealthy" state to detect (existence IS
          # correctness here) - always Healthy once they exist, same
          # reasoning as this repo's other CRD-without-status entries.
          - group: policy.sigstore.dev
            kind: TrustRoot
            check: |
              hs = {}
              hs.status = "Healthy"
              return hs
          - group: policy.sigstore.dev
            kind: ClusterImagePolicy
            check: |
              hs = {}
              hs.status = "Healthy"
              return hs
          - group: rhtas.charts.redhat.com
            kind: PolicyController
            check: |
              hs = {}
              hs.status = "Healthy"
              return hs
          # WP-133, user-approved live finding (2026-09-05): ArgoCD's generic
          # health check flags a resource Progressing on ANY False condition
          # in status.conditions[], not just the authoritative "Ready" one.
          # KServe's InferenceService intentionally carries multiple granular,
          # informational conditions alongside Ready - e.g. LatestDeploymentReady
          # can sit False forever (reason AuthProxyPreserved, a deliberate
          # optimization to skip restarting the auth-proxy sidecar) while the
          # resource is genuinely Ready=True. Without this override, ArgoCD
          # never considers such an InferenceService Healthy, so self-heal
          # refuses to advance to a newer git revision while it's the current
          # sync target - a wedge that survives app-controller/repo-server/
          # redis restarts and even a full cluster restart, because nothing
          # about the underlying condition ever changes.
          - group: serving.kserve.io
            kind: InferenceService
            check: |
              hs = {}
              if obj.status ~= nil and obj.status.conditions ~= nil then
                for i, condition in ipairs(obj.status.conditions) do
                  if condition.type == "Ready" then
                    if condition.status == "True" then
                      hs.status = "Healthy"
                      hs.message = condition.message or "Ready"
                      return hs
                    end
                    if condition.status == "False" then
                      hs.status = "Progressing"
                      hs.message = condition.message or "Not ready"
                      return hs
                    end
                  end
                end
              end
              hs.status = "Progressing"
              hs.message = "Waiting for InferenceService to report a Ready condition"
              return hs
