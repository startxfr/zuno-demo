---
# ADR-0310: Namespace + Subscription live in
# ansible/roles/argocd/kustomize/operator/ as plain manifests (the
# ClusterRoleBinding below is a separate group, applied only after the
# CRD/deployment waits confirm the operator installed successfully).
- name: "argocd | apply the operator Namespace and Subscription"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/argocd/kustomize/operator"

- name: "argocd | wait for the Application CRD to be established"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: applications.argoproj.io
  register: _argocd_crd
  until: (_argocd_crd.resources | default([]) | length) > 0
  retries: 30
  delay: 10

- name: "argocd | wait for the default ArgoCD server deployment to be ready"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: openshift-gitops
    name: openshift-gitops-server
  register: _argocd_server
  until: >-
    (_argocd_server.resources | default([]) | length) > 0 and
    (_argocd_server.resources[0].status.readyReplicas | default(0)) > 0
  retries: 60
  delay: 10

- name: "argocd | grant the ArgoCD application controller cluster-admin (demo scope)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/argocd/kustomize/rbac"

# The zuno AppProject every gitops/apps/*/application.yaml targets instead
# of ArgoCD's built-in "default" AppProject. Lives in this role (not
# admin_context, which runs before argocd in day0_components) because its
# CRD only exists once the Subscription above has reconciled - waited on
# explicitly since appprojects.argoproj.io and applications.argoproj.io,
# while installed by the same operator bundle, aren't guaranteed
# Established at the exact same instant.
- name: "argocd | wait for the AppProject CRD to be established"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: appprojects.argoproj.io
  register: _argocd_appproject_crd
  until: (_argocd_appproject_crd.resources | default([]) | length) > 0
  retries: 30
  delay: 10

- name: "argocd | apply the zuno AppProject"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/argocd/kustomize/appproject"

# ADR-0312: nfd/nvidia_gpu/openshift_ai/external_secrets's own install.yml
# already depends on this health check existing (their first
# apply_gitops_app.yml call waits on a Subscription reporting Healthy),
# and all four sort after `argocd` in day0_components - registering it
# here, before any of them run, is required.
- name: "argocd | register the custom resource health checks this repository's charts rely on (ADR-0312)"
  ansible.builtin.include_tasks: apply_resource_health_checks.yml
