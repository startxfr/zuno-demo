---
- name: "argocd | apply the operator Namespace and Subscription"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/argocd/kustomize/operator"

- name: "argocd | wait for the Application CRD to be established"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: applications.argoproj.io
  register: _argocd_crd
  until: (_argocd_crd.resources | default([]) | length) > 0
  retries: 30
  delay: 10

# The AppProject CRD isn't guaranteed Established at the same instant as
# applications.argoproj.io even though both come from the same operator bundle.
- name: "argocd | wait for the ArgoCD CRD to be established"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: argocds.argoproj.io
  register: _argocd_argocd_crd
  until: (_argocd_argocd_crd.resources | default([]) | length) > 0
  retries: 30
  delay: 10

# ADR-0517 live finding (demo333, 2026-09-06): sxcm's cluster provisioning
# drops a LimitRange `openshift-gitops-limits` (generated-by: sxcm, NOT
# tracked by this repo nor reconciled by the startx-cluster-* Applications -
# they have no selfHeal and don't list it) that caps Pod/Container memory at
# 5Gi. The application-controller below is sized at 9Gi (its anti-OOM bump),
# so on a fresh cluster the StatefulSet pod is FORBIDDEN at creation and no
# Application ever syncs - worse than the OOM crashloop this bump fixed. On
# demo222 the LimitRange had been raised by a manual live patch that a
# reprovision silently resets - exactly the class of undocumented step this
# role must own. Raise only max.memory (both entries), preserve everything
# else sxcm set; idempotent no-op once raised.
- name: "argocd | look up the sxcm LimitRange that caps openshift-gitops pod memory"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: LimitRange
    name: openshift-gitops-limits
    namespace: openshift-gitops
  register: _argocd_limitrange

- name: "argocd | raise the LimitRange memory ceiling above the application-controller's 9Gi limit"
  kubernetes.core.k8s:
    state: patched
    api_version: v1
    kind: LimitRange
    name: openshift-gitops-limits
    namespace: openshift-gitops
    definition:
      spec:
        limits: >-
          {{ _argocd_limitrange.resources[0].spec.limits
             | map('combine', {'max': {'memory': '12Gi'}}, recursive=True)
             | list }}
  when: _argocd_limitrange.resources | default([]) | length > 0

- name: "argocd | apply the zuno ArgoCD"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/argocd/kustomize/argocd"


- name: "argocd | wait for the default ArgoCD server deployment to be ready"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: openshift-gitops
    name: openshift-gitops-server
  register: _argocd_server
  until: >-
    (_argocd_server.resources | default([]) | length) > 0 and
    (_argocd_server.resources[0].status.readyReplicas | default(0)) > 0
  retries: 60
  delay: 10

- name: "argocd | grant the ArgoCD application controller cluster-admin (demo scope)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/argocd/kustomize/rbac"

# The AppProject CRD isn't guaranteed Established at the same instant as
# applications.argoproj.io even though both come from the same operator bundle.
- name: "argocd | wait for the AppProject CRD to be established"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: appprojects.argoproj.io
  register: _argocd_appproject_crd
  until: (_argocd_appproject_crd.resources | default([]) | length) > 0
  retries: 30
  delay: 10

- name: "argocd | apply the zuno AppProject"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/argocd/kustomize/appproject"

# Must run before nfd/nvidia_gpu/openshift_ai/external_secrets, whose
# install.yml waits on this Subscription health check existing.
- name: "argocd | register the custom resource health checks this repository's charts rely on (ADR-0312)"
  ansible.builtin.include_tasks: apply_resource_health_checks.yml
