---
- name: "argocd | ensure the openshift-gitops-operator namespace exists"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: openshift-operators
        labels:
          zuno.io/managed-by: ansible

- name: "argocd | subscribe to the OpenShift GitOps operator"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: openshift-gitops-operator
        namespace: openshift-operators
        labels:
          zuno.io/managed-by: ansible
      spec:
        channel: latest
        name: openshift-gitops-operator
        source: redhat-operators
        sourceNamespace: openshift-marketplace
        installPlanApproval: Automatic

- name: "argocd | wait for the Application CRD to be established"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: applications.argoproj.io
  register: _argocd_crd
  until: (_argocd_crd.resources | default([]) | length) > 0
  retries: 30
  delay: 10

- name: "argocd | wait for the default ArgoCD server deployment to be ready"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: openshift-gitops
    name: openshift-gitops-server
  register: _argocd_server
  until: >-
    (_argocd_server.resources | default([]) | length) > 0 and
    (_argocd_server.resources[0].status.readyReplicas | default(0)) > 0
  retries: 60
  delay: 10

- name: "argocd | grant the ArgoCD application controller cluster-admin (demo scope)"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: zuno-argocd-application-controller-admin
      subjects:
        - kind: ServiceAccount
          name: openshift-gitops-argocd-application-controller
          namespace: openshift-gitops
      roleRef:
        kind: ClusterRole
        name: cluster-admin
        apiGroup: rbac.authorization.k8s.io
