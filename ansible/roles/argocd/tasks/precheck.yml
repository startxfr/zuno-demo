---
- name: "argocd | verify cluster API is reachable"
  kubernetes.core.k8s_info:
    kind: Namespace
    name: default
  register: _argocd_precheck_api

- name: "argocd | fail if the cluster API is unreachable"
  ansible.builtin.fail:
    msg: >-
      Unable to reach the OpenShift API. Verify the endpoint and token passed
      to `make precheck` (KUBECONFIG or K8S_AUTH_HOST/K8S_AUTH_API_KEY).
  when: _argocd_precheck_api.resources is not defined

- name: "argocd | verify the OpenShift GitOps operator is available in the catalog"
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    namespace: openshift-marketplace
    name: openshift-gitops-operator
  register: _argocd_precheck_pkg

- name: "argocd | fail if the OpenShift GitOps operator is not published in this cluster's catalog"
  ansible.builtin.fail:
    msg: >-
      openshift-gitops-operator was not found in openshift-marketplace.
      Confirm the redhat-operators CatalogSource is enabled.
  when: (_argocd_precheck_pkg.resources | default([]) | length) == 0

- name: "argocd | precheck summary"
  ansible.builtin.debug:
    msg: "OpenShift GitOps operator is available; cluster API reachable."
