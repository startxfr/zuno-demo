---
# ADR-0602 clause 5 / WP-224 (finding C4): operators and cluster
# configuration. An Application lands here only when it renders a
# cluster-scoped kind or an OLM object (Subscription, OperatorGroup,
# CatalogSource), or when it is the no-op/namespaced sibling of such a
# component in a non-zuno namespace (openshift-*, redhat-ods-*, ...).
#
# The kind list is exact, never `*`: it is the union of what
# `helm template` renders for these Applications (with the values Ansible
# injects) and what ArgoCD tracks live (status.resources, 2026-11-06).
# platform/gitops/check_app_projects.py fails when a chart starts to
# render a cluster-scoped kind missing here, or when an entry here is
# rendered by nothing - so widening this list is a reviewed diff, not a
# side effect of a chart change.
#
# openshift-gitops is NOT a destination: an Application or AppProject
# written there would be reconciled by the cluster-admin controller under
# whatever project it names. Only zuno-bootstrap may write there.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: zuno-platform
  namespace: openshift-gitops
  labels:
    zuno.io/managed-by: zuno-ansible
spec:
  description: >-
    Zuno operators and cluster configuration (ADR-0602 clause 5): the
    gitops/apps Applications that render cluster-scoped kinds or OLM objects
  # The http S3 chart repository is a known risk (ADR-0602 C4: a tampered
  # chart in transit); moving it to HTTPS or digests is a later WP-224 step.
  sourceRepos:
    - https://github.com/startxfr/zuno-demo.git
    - http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
  destinations:
    - {server: https://kubernetes.default.svc, namespace: "zuno-*"}
    - {server: https://kubernetes.default.svc, namespace: ai-tenants}
    - {server: https://kubernetes.default.svc, namespace: cert-manager}
    - {server: https://kubernetes.default.svc, namespace: cert-manager-operator}
    - {server: https://kubernetes.default.svc, namespace: kuadrant-system}
    - {server: https://kubernetes.default.svc, namespace: models-as-a-service}
    # ADR-0608/WP-241: the nfs-provisioner operator and NFS server, a namespace
    # created by hand on demo333 before the component existed (not renamed).
    - {server: https://kubernetes.default.svc, namespace: nfs-provisioner}
    - {server: https://kubernetes.default.svc, namespace: nvidia-gpu-operator}
    - {server: https://kubernetes.default.svc, namespace: openshift-authentication}
    - {server: https://kubernetes.default.svc, namespace: openshift-cluster-observability-operator}
    - {server: https://kubernetes.default.svc, namespace: openshift-config}
    - {server: https://kubernetes.default.svc, namespace: openshift-grafana-operator}
    - {server: https://kubernetes.default.svc, namespace: openshift-ingress}
    - {server: https://kubernetes.default.svc, namespace: openshift-ingress-operator}
    - {server: https://kubernetes.default.svc, namespace: openshift-jobset-operator}
    - {server: https://kubernetes.default.svc, namespace: openshift-keda}
    - {server: https://kubernetes.default.svc, namespace: openshift-kiali-operator}
    - {server: https://kubernetes.default.svc, namespace: openshift-kueue-operator}
    - {server: https://kubernetes.default.svc, namespace: openshift-lightspeed}
    - {server: https://kubernetes.default.svc, namespace: openshift-lws-operator}
    - {server: https://kubernetes.default.svc, namespace: openshift-machine-api}
    - {server: https://kubernetes.default.svc, namespace: openshift-marketplace}
    - {server: https://kubernetes.default.svc, namespace: openshift-monitoring}
    - {server: https://kubernetes.default.svc, namespace: openshift-nfd}
    - {server: https://kubernetes.default.svc, namespace: openshift-opentelemetry-operator}
    - {server: https://kubernetes.default.svc, namespace: openshift-operators}
    - {server: https://kubernetes.default.svc, namespace: openshift-tempo-operator}
    - {server: https://kubernetes.default.svc, namespace: policy-controller-operator}
    - {server: https://kubernetes.default.svc, namespace: redhat-ods-applications}
    - {server: https://kubernetes.default.svc, namespace: redhat-ods-monitoring}
    - {server: https://kubernetes.default.svc, namespace: redhat-ods-operator}
    - {server: https://kubernetes.default.svc, namespace: rhoai-model-registries}
    - {server: https://kubernetes.default.svc, namespace: unifai-operator}
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: autoscaling.openshift.io, kind: ClusterAutoscaler}
    - {group: cert-manager.io, kind: ClusterIssuer}
    - {group: config.openshift.io, kind: APIServer}
    - {group: config.openshift.io, kind: OAuth}
    - {group: config.openshift.io, kind: Proxy}
    - {group: console.openshift.io, kind: ConsolePlugin}
    - {group: datasciencecluster.opendatahub.io, kind: DataScienceCluster}
    - {group: dscinitialization.opendatahub.io, kind: DSCInitialization}
    - {group: helm.openshift.io, kind: HelmChartRepository}
    - {group: keda.sh, kind: ClusterTriggerAuthentication}
    - {group: kueue.openshift.io, kind: Kueue}
    - {group: kueue.x-k8s.io, kind: ClusterQueue}
    - {group: kueue.x-k8s.io, kind: ResourceFlavor}
    - {group: mlflow.opendatahub.io, kind: MLflow}
    - {group: nvidia.com, kind: ClusterPolicy}
    - {group: observability.openshift.io, kind: UIPlugin}
    - {group: ols.openshift.io, kind: OLSConfig}
    - {group: operator.openshift.io, kind: CertManager}
    - {group: operator.openshift.io, kind: JobSetOperator}
    - {group: perses.dev, kind: PersesGlobalDatasource}
    - {group: policy.sigstore.dev, kind: ClusterImagePolicy}
    - {group: policy.sigstore.dev, kind: TrustRoot}
    # The startx `project` subchart's PreSync hook creates a Namespace, which
    # ArgoCD tracks as project.openshift.io/Project on OpenShift (seen live on
    # six *-d0 Applications). Without it the hook would be refused.
    - {group: project.openshift.io, kind: Project}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
    - {group: sailoperator.io, kind: Istio}
    - {group: sailoperator.io, kind: IstioCNI}
    - {group: scheduling.k8s.io, kind: PriorityClass}
  namespaceResourceWhitelist:
    - {group: "*", kind: "*"}
