apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: zuno
  namespace: openshift-gitops
  labels:
    zuno.io/managed-by: zuno-ansible
spec:
  description: >-
    Every zuno-* platform Application (gitops/apps/) lives in this project
  sourceRepos:
    - https://github.com/startxfr/zuno-demo.git
    - http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
