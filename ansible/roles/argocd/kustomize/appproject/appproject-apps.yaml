---
# ADR-0602 clause 5 / WP-224 (finding C4): workloads. No cluster-scoped kind
# at all (an empty clusterResourceWhitelist allows none), no OLM object and
# no ArgoCD object, and only the namespaces these Applications write. A
# workload chart change - the most frequent kind of change - can therefore
# no longer create a ClusterRoleBinding, install an operator or rewrite an
# Application through the cluster-admin controller.
#
# Destinations come from the live status.resources namespaces (2026-11-06)
# and `helm template` of every zuno-apps Application;
# platform/gitops/check_app_projects.py keeps them in step. The namespaces
# themselves are created by zuno-namespaces-d0 (zuno-platform), never by
# CreateNamespace=true here (Namespace is cluster-scoped).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: zuno-apps
  namespace: openshift-gitops
  labels:
    zuno.io/managed-by: zuno-ansible
spec:
  description: >-
    Zuno workloads (ADR-0602 clause 5): gitops/apps Applications that render
    namespaced kinds only, in zuno namespaces and the two RHOAI namespaces
    the model catalogue writes
  # The startx chart repository is read over TLS (S3 REST endpoint) since 2026-11-11 (ADR-0602 amendment,
  # C4); the plain-http S3 website endpoint is no longer admitted.
  sourceRepos:
    - https://github.com/startxfr/zuno-demo.git
    - https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable
  destinations:
    - {server: https://kubernetes.default.svc, namespace: "zuno-*"}
    # zuno-models-d1: MaaS model registrations and RHOAI serving runtimes.
    - {server: https://kubernetes.default.svc, namespace: models-as-a-service}
    - {server: https://kubernetes.default.svc, namespace: redhat-ods-applications}
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
    - {group: operators.coreos.com, kind: "*"}
    - {group: argoproj.io, kind: "*"}
