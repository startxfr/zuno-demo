---
# Registers the startx Helm repo with the repo-server so `helm dependency
# build` can resolve vendored subchart deps; being in AppProject sourceRepos
# is not enough for that.
#
# `name: startx` is load-bearing: Chart.yaml files must reference this repo
# as `repository: "alias:startx"`, not the literal http:// URL - ArgoCD only
# auto-registers https:// or oci:// or alias: references, and this repo (S3
# static hosting) has no TLS.
apiVersion: v1
kind: Secret
metadata:
  name: startx-helm-repo
  namespace: openshift-gitops
  labels:
    argocd.argoproj.io/secret-type: repository
    zuno.io/managed-by: zuno-ansible
stringData:
  type: helm
  name: startx
  project: zuno
  enableOCI: "false"
  url: http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
