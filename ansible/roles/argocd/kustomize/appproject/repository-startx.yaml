---
# Registers the startx Helm repo with the repo-server.
#
# Since 2026-11-11 (ADR-0602 amendment, C4) the charts name the repository by
# its HTTPS URL (the S3 REST endpoint) in Chart.yaml, which ArgoCD registers
# on its own; they no longer use `alias:startx` and the plain-http S3 website
# endpoint. Each Chart.lock digest encodes the URL an alias resolves to, so an
# alias would tie every lock to this Secret's URL. This Secret stays as the
# named, global entry for that URL.
apiVersion: v1
kind: Secret
metadata:
  name: startx-helm-repo
  namespace: openshift-gitops
  labels:
    argocd.argoproj.io/secret-type: repository
    zuno.io/managed-by: zuno-ansible
stringData:
  type: helm
  name: startx
  # Global, not project-scoped (ADR-0602 clause 5 / WP-224): charts in both
  # zuno-platform and zuno-apps depend on this repository, and a repository
  # secret carries a single project. It holds no credential, so scoping it
  # protected nothing. Empty rather than absent: the role applies with a
  # merge patch, which would keep the old `zuno` value of a removed key.
  project: ""
  enableOCI: "false"
  url: https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable
