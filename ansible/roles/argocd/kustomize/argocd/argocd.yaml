apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  resourceHealthChecks:
    - group: operators.coreos.com
      kind: Subscription
      check: |
        hs = {}
        if obj.status ~= nil and obj.status.installedCSV ~= nil and obj.status.installedCSV ~= "" then
          hs.status = "Healthy"
          hs.message = "Installed " .. obj.status.installedCSV
          return hs
        end
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for i, condition in ipairs(obj.status.conditions) do
            if condition.type == "CatalogSourcesUnhealthy" and condition.status == "True" then
              hs.status = "Degraded"
              hs.message = condition.message
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for OLM to install the Subscription's CSV"
        return hs
  networkPolicy: {}
  server:
    autoscale:
      enabled: false
    grpc:
      ingress:
        enabled: false
    ingress:
      enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 125m
        memory: 128Mi
    route:
      enabled: true
    service:
      type: ''
  grafana:
    enabled: true
    ingress:
      enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
    route:
      enabled: true
  monitoring:
    enabled: true
  notifications:
    enabled: false
  prometheus:
    enabled: true
    ingress:
      enabled: false
    route:
      enabled: true
  initialSSHKnownHosts: {}
  imageUpdater:
    enabled: false
  sso:
    dex:
      openShiftOAuth: true
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
    provider: dex
  applicationSet:
    resources:
      limits:
        cpu: '2'
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
    webhookServer:
      ingress:
        enabled: false
      route:
        enabled: false
  rbac:
    defaultPolicy: ''
    # ADR-0349 §5: Keycloak-derived groups reach ArgoCD through the
    # existing Dex openShiftOAuth delegation (scopes: '[groups]' below) -
    # no ArgoCD OIDC client exists in the realm. The ocp-paas-ops ->
    # role:admin line is required, not redundant: only
    # system:cluster-admins/cluster-admins mapped to role:admin before,
    # and Keycloak-derived groups never matched either name. zuno-paas-dev
    # is a custom read+sync role for the PaaS-developer profile.
    policy: |
      g, system:cluster-admins, role:admin
      g, cluster-admins, role:admin
      p, role:zuno-paas-dev, applications, get, zuno/*, allow
      p, role:zuno-paas-dev, applications, sync, zuno/*, allow
      g, ocp-paas-dev, role:zuno-paas-dev
      g, ocp-paas-ops, role:admin
    scopes: '[groups]'
  repo:
    resources:
      limits:
        cpu: '2'
        memory: 1Gi
      requests:
        cpu: 300m
        memory: 256Mi
  resourceExclusions: |
    - apiGroups:
      - ""
      - discovery.k8s.io
      clusters:
      - '*'
      kinds:
      - Endpoints
      - EndpointSlice
    - apiGroups:
      - apiregistration.k8s.io
      clusters:
      - '*'
      kinds:
      - APIService
    - apiGroups:
      - coordination.k8s.io
      clusters:
      - '*'
      kinds:
      - Lease
    - apiGroups:
      - authentication.k8s.io
      - authorization.k8s.io
      clusters:
      - '*'
      kinds:
      - SelfSubjectReview
      - TokenReview
      - LocalSubjectAccessReview
      - SelfSubjectAccessReview
      - SelfSubjectRulesReview
      - SubjectAccessReview
    - apiGroups:
      - certificates.k8s.io
      clusters:
      - '*'
      kinds:
      - CertificateSigningRequest
    - apiGroups:
      - cert-manager.io
      clusters:
      - '*'
      kinds:
      - CertificateRequest
    - apiGroups:
      - cilium.io
      clusters:
      - '*'
      kinds:
      - CiliumIdentity
      - CiliumEndpoint
      - CiliumEndpointSlice
    - apiGroups:
      - kyverno.io
      - reports.kyverno.io
      - wgpolicyk8s.io
      clusters:
      - '*'
      kinds:
      - PolicyReport
      - ClusterPolicyReport
      - EphemeralReport
      - ClusterEphemeralReport
      - AdmissionReport
      - ClusterAdmissionReport
      - BackgroundScanReport
      - ClusterBackgroundScanReport
      - UpdateRequest
    - apiGroups:
      - tekton.dev
      clusters:
      - '*'
      kinds:
      - TaskRun
      - PipelineRun
  ha:
    enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
  tls:
    ca: {}
  redis:
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi
  controller:
    processors: {}
    # 2026-08-16: VERIFIED live - application-controller was OOMKilled
    # (exitCode 137) repeatedly at the old 5Gi limit, crashlooping for
    # 46+ minutes with zero Applications reconciling in the meantime.
    # This is the likely root cause of this session's recurring "sync
    # stuck / health-gating stalled" symptoms worked around by manual
    # operation-termination + hard refresh. Host node has ~28Gi free
    # allocatable headroom (72% requested/56.8Gi allocatable), so this
    # is a safe bump, not a resize.
    resources:
      limits:
        cpu: '1'
        memory: 8Gi
      requests:
        cpu: 500m
        memory: 4Gi
    sharding: {}