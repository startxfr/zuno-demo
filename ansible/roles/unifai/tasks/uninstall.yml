---
# The UnifaiStack has deletionPolicy Retain: its PVCs and generated secret
# survive; delete the namespace's PVCs by hand for a full wipe.
- name: "unifai | delete the stack Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-unifai-d1"

- name: "unifai | delete the operator Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-unifai-d0"
