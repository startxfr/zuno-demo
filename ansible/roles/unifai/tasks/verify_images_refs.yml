---
# ADR-0586: derive the image references to verify into `_unifai_image_refs`, for
# the scope in `_unifai_verify_scope` (catalog | stack). Shared by verify_images.yml
# (before applying) and verify_running_compare.yml (what runs).
- name: "unifai | image refs | derive the references, scope {{ _unifai_verify_scope }}"
  ansible.builtin.set_fact:
    _unifai_image_refs: >-
      {%- if _unifai_verify_scope == 'catalog' -%}
      {%- set chart = lookup('ansible.builtin.file', zuno_repo_root + '/gitops/charts/unifai/values.yaml') | from_yaml -%}
      {{ [chart.operator.catalogImage] }}
      {%- else -%}
      {%- set stack = (zuno_unifai_values | default({})).stack | default({}) -%}
      {%- set pinned = stack.images | default({}) -%}
      {%- set out = [] -%}
      {%- for c in ['backend', 'identity', 'multiagent', 'rag', 'ui'] -%}
      {%- set _ = out.append(pinned.get(c) or ('quay.io/zuno/unifai-' ~ c ~ ':' ~ (stack.version | default('unset')))) -%}
      {%- endfor -%}
      {{ out }}
      {%- endif -%}

# The third-party services are pinned, never signature-checked (ADR-0586 clause 7);
# the drift check still compares what runs to these pins.
- name: "unifai | image refs | derive the third-party pins"
  ansible.builtin.set_fact:
    _unifai_third_party_refs: >-
      {%- set stack = (zuno_unifai_values | default({})).stack | default({}) -%}
      {%- set app = ['backend', 'identity', 'multiagent', 'rag', 'ui'] -%}
      {%- set out = [] -%}
      {%- for k, ref in (stack.images | default({})).items() if k not in app and ref -%}
      {%- set _ = out.append(ref) -%}
      {%- endfor -%}
      {%- for k, ref in ((stack.backup | default({})).images | default({})).items() if ref -%}
      {%- set _ = out.append(ref) -%}
      {%- endfor -%}
      {{ out }}
  when: _unifai_verify_scope == 'stack'
