---
# The committed per-cluster file (ansible/clusters/<cluster>.yml) carries the
# non-secret stack overrides (pinned images, RAG sources, retrievers, bundle
# settings). It is loaded first so that confidential.yml and extra-vars still
# override it, like in the other roles.
- name: "unifai | load the committed per-cluster variables"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_cluster_vars.yml"

- name: "unifai | load ansible/confidential.yml (zuno_unifai_values) if present"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/confidential.yml"
  when: (zuno_repo_root + '/ansible/confidential.yml') is file

- name: "unifai | resolve the cluster base domain"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_base_domain.yml"

- name: "unifai | look for an existing unifai-operator Subscription"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
  register: _unifai_subscriptions

- name: "unifai | keep the unifai-operator Subscriptions"
  ansible.builtin.set_fact:
    _unifai_package_subs: >-
      {{ _unifai_subscriptions.resources | default([])
         | selectattr('spec.name', 'defined')
         | selectattr('spec.name', 'equalto', 'unifai-operator') | list }}

# Install unless a Subscription for the package exists that this component does
# not own (ArgoCD's tracking label app.kubernetes.io/instance names the owner).
# A loop, not selectattr: selectattr cannot address a dotted label key.
- name: "unifai | install the operator only when no foreign Subscription exists"
  ansible.builtin.set_fact:
    _unifai_install_operator: >-
      {% set ns = namespace(foreign=0) %}{% for s in _unifai_package_subs %}{% if (s.metadata.labels | default({})).get('app.kubernetes.io/instance', '') != 'zuno-unifai-d0' %}{% set ns.foreign = ns.foreign + 1 %}{% endif %}{% endfor %}{{ ns.foreign == 0 }}

- name: "unifai | report the operator decision"
  ansible.builtin.debug:
    msg: >-
      {{ 'Installing unifai-operator from the pinned catalog (zuno-unifai-d0).'
         if _unifai_install_operator | bool else
         'A unifai-operator Subscription already exists and is not ours: zuno-unifai-d0 renders nothing.' }}

# ADR-0586 / WP-176: the catalog image is verified (digest, signature, provenance, SBOM)
# before the operator is installed from it. Off until the operator release workflow
# signs its images (zuno_unifai_verify_catalog, default false).
- name: "unifai | verify the operator catalog image"
  ansible.builtin.include_tasks: verify_images.yml
  vars:
    _unifai_verify_scope: catalog
  when: zuno_unifai_verify_catalog | default(false) | bool

- name: "unifai | apply the operator Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "unifai"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-unifai-d0"
    gitops_app_extra_helm_values:
      clusterBaseDomain: "{{ cluster_base_domain }}"
      operator:
        install: "{{ _unifai_install_operator | bool }}"

# Backups to the cluster's backups bucket (ADR-0112, ADR-0546) reuse the S3
# settings PostgreSQL already has in ansible/confidential.yml: same bucket and
# identity, under the unifai/<namespace> prefix. Off when they are not set.
- name: "unifai | derive the backup settings from the PostgreSQL S3 settings"
  ansible.builtin.set_fact:
    _unifai_backup_values: >-
      {{ {'stack': {'backup': {'enabled': true,
                               'bucket': zuno_postgresql_backup_s3_bucket,
                               'endpoint': 'https://' ~ zuno_postgresql_backup_s3_endpoint,
                               'region': zuno_postgresql_backup_s3_region}}}
         if ((zuno_postgresql_backup_s3_bucket | default('xxxxxx')) != 'xxxxxx'
             and (zuno_postgresql_backup_s3_endpoint | default('xxxxxx')) != 'xxxxxx'
             and (zuno_postgresql_backup_s3_region | default('xxxxxx')) != 'xxxxxx')
         else {} }}

# ADR-0578/ADR-0581: once platform/okf/agents.lock pins a zuno-demo-agents
# release, the bundles to deploy come from the file generated from it
# (platform/okf/stack-config.generated.yaml), verified keyless against the
# committed Sigstore trusted root. The platform-owned settings of each agent
# (teamId/groupTeam, entitlement, classificationOverrides, retriever) stay in the
# deployment: zuno_unifai_bundle_settings.<agent>. While the generated list is
# empty nothing is added and zuno_unifai_values.okf stays the only source;
# the two lists are never merged. The switch is explicit
# (zuno_unifai_released_bundles, default false): released artifacts are v2 and
# keyless, which unifai-operator reads from 0.1.25 on; an older operator leaves
# every bundle Pending. Set it to true once the operator in the cluster is
# >= 0.1.25. zuno_unifai_released_bundles_exclude lists agents to leave out
# (graph shapes the operator has no template for yet: arkos, cognos, soursage).
- name: "unifai | read the bundles of the pinned agents release"
  ansible.builtin.set_fact:
    _unifai_stack_config: "{{ lookup('ansible.builtin.file', zuno_repo_root + '/platform/okf/stack-config.generated.yaml') | from_yaml }}"

- name: "unifai | derive the okf values from the generated stack config"
  ansible.builtin.set_fact:
    _unifai_okf_values: >-
      {%- set released = (_unifai_stack_config.unifai | default({})).bundles | default([]) -%}
      {%- if (zuno_unifai_released_bundles | default(false) | bool) and released | length > 0 -%}
      {%- set merged = [] -%}
      {%- for b in released if b.name not in (zuno_unifai_released_bundles_exclude | default([])) -%}
      {%- set _ = merged.append(b | combine((zuno_unifai_bundle_settings | default({}))[b.name] | default({}))) -%}
      {%- endfor -%}
      {{ {'okf': {'verify': _unifai_stack_config.unifai.verify,
                  'trustedRoot': lookup('ansible.builtin.file', zuno_repo_root + '/platform/okf/sigstore/trusted_root.json'),
                  'bundles': merged}} }}
      {%- else -%}
      {{ {} }}
      {%- endif -%}

# ADR-0586 / WP-176: the five application images are verified before the stack is
# applied; a failure stops the run with nothing applied (zuno_unifai_verify_images,
# default true; a cluster that must switch it off says so, with its reason, in its
# ansible/clusters/<cluster>.yml, where check_unifai_pins.py reports it).
- name: "unifai | verify the stack images"
  ansible.builtin.include_tasks: verify_images.yml
  vars:
    _unifai_verify_scope: stack
  when: zuno_unifai_verify_images | default(true) | bool

- name: "unifai | apply the stack Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "unifai"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-unifai-d1"
    gitops_app_extra_helm_values: >-
      {{ {'clusterBaseDomain': cluster_base_domain,
          'stack': {'enabled': true},
          'okf': {'publicKey': lookup('ansible.builtin.file', zuno_repo_root + '/ansible/roles/unifai/files/zuno-platform-signer.pub')}}
         | combine(_unifai_backup_values, recursive=True)
         | combine(zuno_unifai_values | default({}), recursive=True)
         | combine(_unifai_okf_values, recursive=True) }}

# ArgoCD has no health check for UnifaiStack: zuno-unifai-d1 reports Healthy
# while the stack is in Error (demo333, WP-151). Wait on the operator's phase.
- name: "unifai | wait for the UnifaiStack to be Ready"
  kubernetes.core.k8s_info:
    api_version: unifai.startx.fr/v1alpha1
    kind: UnifaiStack
    namespace: zuno-unifai
    name: unifai
  register: _unifai_stack
  until: >-
    (_unifai_stack.resources | default([]) | length > 0) and
    (_unifai_stack.resources[0].status.phase | default('') == 'Ready')
  retries: 60
  delay: 20
