---
# The switch and any per-cluster override: the committed cluster file first, then the cluster's confidential.yml when
# present (a workstation), which wins.
- name: "chaos | load the committed per-cluster variables"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_cluster_vars.yml"

- name: "chaos | load the cluster's confidential.yml if present"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_confidential_vars.yml"
  vars:
    load_confidential_caller: chaos
