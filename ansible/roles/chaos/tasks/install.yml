---
# `make d2 install chaos`. Follows ONE switch, zuno_chaos_enabled (defaults/main.yml). On: the namespace and OpenShift
# Pipelines must exist, then the Application, then cerberus up. Off: removes what is left, so `make d2 install all` (and
# the AAP install workflow) costs nothing on a cluster that did not ask for chaos. Nothing runs at install: a run is
# `make d3 chaos ...` (tasks/run.yml).
- name: "chaos | load the switch"
  ansible.builtin.include_tasks: load_vars.yml

# ---------------------------------------------------------------- switch off
- name: "chaos | switch off: converge to no application"
  when: not (zuno_chaos_enabled | bool)
  block:
    - name: "chaos | look up the Application"
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: openshift-gitops
        name: "{{ chaos_app_name }}"
      register: _chaos_app

    - name: "chaos | remove what is left"
      ansible.builtin.include_tasks: uninstall.yml
      when: (_chaos_app.resources | default([])) | length > 0

    - name: "chaos | say what the switch means"
      ansible.builtin.debug:
        msg: >-
          zuno_chaos_enabled is false: the chaos component is not installed. Set it to true in
          ansible/inventories/<cluster>/cluster.yml, then `make d2 install chaos`.

# ----------------------------------------------------------------- switch on
- name: "chaos | switch on: install the component"
  when: zuno_chaos_enabled | bool
  block:
    - name: "chaos | the namespace exists (gitops/charts/namespaces)"
      kubernetes.core.k8s_info:
        kind: Namespace
        name: "{{ chaos_namespace }}"
      register: _chaos_ns
      failed_when: (_chaos_ns.resources | default([]) | length) == 0

    - name: "chaos | OpenShift Pipelines serves the Tekton v1 API"
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: pipelineruns.tekton.dev
      register: _chaos_tekton
      failed_when: (_chaos_tekton.resources | default([]) | length) == 0

    - name: "chaos | resolve the cluster base domain"
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_base_domain.yml"

    # The dict REPLACES the Application's values (check_gitops_values_clobber): every key of
    # gitops/apps/chaos/application-d1.yaml is written here.
    - name: "chaos | apply the Application (d1)"
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
      vars:
        gitops_component_name: "chaos"
        gitops_app_phase: "d1"
        gitops_app_name: "{{ chaos_app_name }}"
        gitops_app_wait_retries: "{{ chaos_wait_retries }}"
        gitops_app_wait_delay: "{{ chaos_wait_delay }}"
        gitops_app_extra_helm_values:
          zuno:
            enabled: true
          cerberus:
            cerberus:
              enabled: true
              # cerberus wants one list per URL ([["https://..."]]); a URL has no space, so split wraps it in a list.
              watch_url_routes: "{{ chaos_watch_urls | map('ansible.builtin.split', ' ') | list }}"
          pipeline:
            pipeline:
              enabled: true

    - name: "chaos | wait for cerberus to be available"
      kubernetes.core.k8s_info:
        kind: Deployment
        namespace: "{{ chaos_namespace }}"
        name: cerberus
      register: _chaos_cerberus
      until: >-
        (_chaos_cerberus.resources | default([]) | length > 0) and
        ((_chaos_cerberus.resources[0].status.availableReplicas | default(0)) >= 1)
      retries: "{{ chaos_wait_retries }}"
      delay: "{{ chaos_wait_delay }}"

    - name: "chaos | installed"
      ansible.builtin.debug:
        msg: >-
          cerberus, the pipelines chaos-infra, chaos-application and zuno-chaos-provider-cut are in {{ chaos_namespace }}.
          Nothing runs until `make d3 chaos infra|platform ...`; `make d2 check chaos` reads the cerberus signal.
