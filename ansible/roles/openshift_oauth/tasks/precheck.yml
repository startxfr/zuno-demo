---
# State detection (never fails).
- name: "openshift_oauth | check the openshift-oauth Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-openshift-oauth-d0"

- name: "openshift_oauth | save the d0 check result"
  ansible.builtin.set_fact:
    _openshift_oauth_d0_installed: "{{ _state_check_result }}"

- name: "openshift_oauth | check the openshift-oauth Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-openshift-oauth-d1"

- name: "openshift_oauth | look up the cluster OAuth singleton"
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: OAuth
    name: cluster
  register: _openshift_oauth_lookup

# ADR-0347: without these copies the OpenID IDP's openID.ca reference (and
# the cluster-wide proxy trust that complements it) are not honored and
# the authentication operator degrades, so both count toward "installed".
# The htpasswd IDP and template Secrets are deliberately NOT checked: they
# are optional gated features referencing startx-managed resources this
# repo does not own.
- name: "openshift_oauth | look up the copied Keycloak/router CA ConfigMap"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: keycloak-serving-ca
    namespace: openshift-config
  register: _openshift_oauth_ca_lookup

- name: "openshift_oauth | look up the copied cluster-wide trust ConfigMap"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: user-ca-bundle
    namespace: openshift-config
  register: _openshift_oauth_trust_bundle_lookup

- name: "openshift_oauth | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        _openshift_oauth_d0_installed
        and _state_check_result
        and (_openshift_oauth_lookup.resources | default([]) | length) > 0
        and (_openshift_oauth_lookup.resources[0].spec.identityProviders
             | default([]) | selectattr('name', 'equalto', 'openshift') | list | length) > 0
        and (_openshift_oauth_ca_lookup.resources | default([]) | length) > 0
        and (_openshift_oauth_trust_bundle_lookup.resources | default([]) | length) > 0
      }}

- name: "openshift_oauth | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
