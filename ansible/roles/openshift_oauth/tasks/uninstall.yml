---
# Reverse of install.yml.
- name: "openshift_oauth | delete the openshift-oauth GitOps Application (d1: cluster OAuth singleton)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-openshift-oauth-d1"

# ADR-0347: the two CA ConfigMaps install.yml creates in openshift-config.
# Deleting user-ca-bundle un-claims proxy/cluster.spec.trustedCA's target,
# but doesn't unset the field itself - low risk either way, since an empty
# Proxy spec is the operator's own normal default state (unlike OAuth/
# cluster, whose empty-spec default breaks all non-kubeadmin login).
- name: "openshift_oauth | delete the copied Keycloak/router CA ConfigMap from openshift-config"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ConfigMap
    name: keycloak-serving-ca
    namespace: openshift-config

- name: "openshift_oauth | delete the copied cluster-wide trust ConfigMap from openshift-config"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ConfigMap
    name: user-ca-bundle
    namespace: openshift-config

- name: "openshift_oauth | delete the openshift-oauth GitOps Application (d0: ExternalSecret)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-openshift-oauth-d0"
