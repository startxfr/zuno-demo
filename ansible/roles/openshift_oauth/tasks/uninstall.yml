---
# Reverse of install.yml.
- name: "openshift_oauth | delete the openshift-oauth GitOps Application (d1: cluster OAuth singleton)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-openshift-oauth-d1"

- name: "openshift_oauth | delete the openshift-oauth GitOps Application (d0: ExternalSecret)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-openshift-oauth-d0"
