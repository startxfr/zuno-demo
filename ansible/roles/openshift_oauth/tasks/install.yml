---
# ADR-0320. Depends on keycloak (the "openshift" client and its Vault-
# seeded secret must exist first) - keycloak now runs in Day 0
# (ansible/playbooks/day0_install.yml, ADR-0421), fully ahead of this Day 1
# role. No operator/PackageManifest discovery needed - OAuth is a
# built-in cluster API, not OLM-installed.
- name: "openshift_oauth | apply the openshift-oauth GitOps Application (d0: ExternalSecret into openshift-config)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "openshift-oauth"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-openshift-oauth-d0"

# ADR-0347 (corrects ADR-0346): the oauth-server pod must trust the CA of
# the cert actually serving https://keycloak.<domain>. ADR-0346 assumed
# that was the default ingress router cert; it isn't - since ADR-0316 the
# keycloak chart's Ingress carries cert-manager.io/cluster-issuer:
# vault-issuer, so the live cert is issued by Vault's `pki/` mount, root
# CN=zuno-demo.internal (verified live with openssl s_client: the router
# CA fails to verify the chain, keycloak-tls's ca.crt succeeds). This
# block now looks up BOTH candidate CAs and bundles them into
# keycloak-serving-ca so openID.ca stays correct whichever ingress path
# is active (the router CA also covers the ingress.operatorManaged
# fallback in gitops/charts/keycloak). Cluster-specific data - can't be
# rendered by Helm. Safe to copy unconditionally on every run: re-running
# install/reconcile refreshes it if either cert is ever rotated. Ordered
# before the d1 Application so the ConfigMap exists when the OAuth CR
# starts referencing it.
- name: "openshift_oauth | look up the ingress router CA (default-ingress-cert in openshift-config-managed)"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: default-ingress-cert
    namespace: openshift-config-managed
  register: _openshift_oauth_router_ca

- name: "openshift_oauth | record the missing router-CA finding before failing"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_blocked_finding.yml"
  vars:
    blocked_finding:
      component: openshift-oauth
      resource: "ConfigMap/default-ingress-cert (openshift-config-managed)"
      state: "NotFound"
      cause: "the ingress operator has not published the default router CA - not a healthy OpenShift cluster"
      solution: "Verify the ingress clusteroperator is Available (`oc get co ingress`), then re-run"
      auto_fix: "make d1 reconcile openshift-oauth"
  when: (_openshift_oauth_router_ca.resources | default([]) | length) == 0

- name: "openshift_oauth | fail loudly if the router CA isn't available to copy"
  ansible.builtin.fail:
    msg: >-
      ConfigMap default-ingress-cert not found in openshift-config-managed -
      every healthy OpenShift cluster's ingress operator publishes it;
      check `oc get co ingress` before re-running.
  when: (_openshift_oauth_router_ca.resources | default([]) | length) == 0

# ADR-0347/ADR-0211: the actual trust anchor for the live Keycloak route -
# whichever Secret the keycloak chart's own Ingress currently references
# (zuno-auth), not a hardcoded name. Flipping ingress.acmeWildcardTLS
# switches the Ingress's tls[].secretName from keycloak-tls (Vault pki/
# mount, root CN=zuno-demo.internal) to keycloak-wildcard-tls
# (cert-manager ACME, Let's Encrypt) without this role knowing - a
# hardcoded name would leave keycloak-serving-ca bundling a stale CA and
# the authentication clusteroperator Degraded
# (OAuthServerConfigObservationDegraded, "certificate signed by unknown
# authority"). Reading the Ingress's own secretName keeps this
# self-correcting across either mode.
- name: "openshift_oauth | look up the Keycloak Ingress to find its live TLS secret name"
  kubernetes.core.k8s_info:
    api_version: networking.k8s.io/v1
    kind: Ingress
    name: "{{ zuno_keycloak_cr_name | default('zuno') }}"
    namespace: zuno-auth
  register: _openshift_oauth_keycloak_ingress

- name: "openshift_oauth | fail loudly if the Keycloak Ingress isn't available"
  ansible.builtin.fail:
    msg: >-
      Ingress {{ zuno_keycloak_cr_name | default('zuno') }} (zuno-auth) not
      found - keycloak is not installed or not reconciled; check
      `make day0 check keycloak` before re-running.
  when: (_openshift_oauth_keycloak_ingress.resources | default([]) | length) == 0

- name: "openshift_oauth | look up the Secret the Keycloak Ingress actually references"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ _openshift_oauth_keycloak_ingress.resources[0].spec.tls[0].secretName }}"
    namespace: zuno-auth
  register: _openshift_oauth_keycloak_ca

- name: "openshift_oauth | record the missing/not-ready TLS secret finding before failing"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_blocked_finding.yml"
  vars:
    blocked_finding:
      component: openshift-oauth
      resource: "Secret/{{ _openshift_oauth_keycloak_ingress.resources[0].spec.tls[0].secretName }} (zuno-auth)"
      state: "NotFound"
      cause: "cert-manager has not yet issued the certificate the keycloak Ingress currently references"
      solution: "Verify the relevant ClusterIssuer is Ready and the Certificate is Ready, then re-run"
      auto_fix: "make d0 reconcile keycloak"
  when: (_openshift_oauth_keycloak_ca.resources | default([]) | length) == 0

- name: "openshift_oauth | fail loudly if the Keycloak serving TLS secret isn't available to copy"
  ansible.builtin.fail:
    msg: >-
      Secret {{ _openshift_oauth_keycloak_ingress.resources[0].spec.tls[0].secretName }}
      (zuno-auth) not found - cert-manager must have issued it first;
      check `make day0 check keycloak` before re-running.
  when: (_openshift_oauth_keycloak_ca.resources | default([]) | length) == 0

# ACME-issued Secrets (Let's Encrypt via cert-manager) carry only
# tls.crt/tls.key, no separate ca.crt - the chain is already in every
# standard system trust store, so no custom entry is needed for that leg.
# Vault-issued Secrets (vault-issuer) do carry ca.crt (a private root no
# system store knows), which must be bundled explicitly.
- name: "openshift_oauth | copy the Keycloak (if privately-issued) + router CAs into openshift-config as keycloak-serving-ca (key ca.crt) for openID.ca"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: keycloak-serving-ca
        namespace: openshift-config
      data:
        ca.crt: >-
          {{ (
               (_openshift_oauth_keycloak_ca.resources[0].data['ca.crt'] | b64decode) + "\n"
               if 'ca.crt' in (_openshift_oauth_keycloak_ca.resources[0].data | default({}))
               else ''
             )
             + (_openshift_oauth_router_ca.resources[0].data['ca-bundle.crt']) }}

# ADR-0347: cluster-wide complement to openID.ca above (defense in depth) -
# proxy/cluster.spec.trustedCA is consumed by every operator whose
# trusted-ca-bundle ConfigMap carries the CNO injection label
# config.openshift.io/inject-trusted-cabundle: "true" (including
# openshift-authentication-operator's), so this makes the Vault PKI root
# trusted cluster-wide, not just by this one IDP. Only the Vault root is
# needed here (system trust already covers everything else); key MUST be
# ca-bundle.crt - the key OpenShift's proxy/trustedCA convention requires,
# different from openID.ca's ca.crt above. The Proxy/cluster PATCH itself
# (spec.trustedCA.name) is Helm-templated and GitOps-applied
# (gitops/charts/openshift-oauth/templates/cluster-trusted-ca.yaml) since
# the ConfigMap *name* isn't cluster-specific - only this ConfigMap's
# data-write belongs in Ansible. Skipped entirely when Keycloak's live
# cert has no ca.crt (ACME/Let's Encrypt - already in every system trust
# store, nothing private to distribute cluster-wide), same as openID.ca
# above.
# ADR-0347/ADR-0211, 2026-09-03. The cluster-wide anchor is sourced from
# the Vault-issued Certificate BY NAME, deliberately NOT from
# _openshift_oauth_keycloak_ca (the Secret the Ingress currently serves).
# Those answer two different questions, and conflating them caused a
# cluster-wide outage:
#
#   "what CA signs the cert Keycloak serves?"  -> keycloak-serving-ca /
#      openID.ca. The Ingress lookup above is the RIGHT source for that.
#   "does this cluster have a private PKI root worth trusting
#      cluster-wide?" -> user-ca-bundle / Proxy.spec.trustedCA. ADR-0211's
#      ACME cutover changes the first answer and NOTHING about the second:
#      the Vault root CN=zuno-demo.internal still signs mariadb-server-cert
#      and istiod, and was still present in all 41 CNO-injected bundles
#      while this reference dangled.
#
# Using the Ingress secret for both is why the 2026-09-02 ACME re-issue
# deleted this ConfigMap and left Proxy/cluster referencing it -
# `oc get co network` Degraded=True from 2026-09-03T08:31:26Z.
- name: "openshift_oauth | look up the Vault-issued Keycloak Secret that carries the private PKI root"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ zuno_vault_root_secret_name | default('keycloak-tls') }}"
    namespace: zuno-auth
  register: _openshift_oauth_vault_root

# ONE fact, three consumers (create, delete, and the Proxy reference passed
# to Helm below). Until now the first two were computed live while the third
# was hardcoded in gitops/apps/openshift-oauth/application-d1.yaml, and they
# drifted apart. Absence is a steady state, not a failure: a cluster with no
# private root simply gets spec.trustedCA.name: "".
- name: "openshift_oauth | decide whether this cluster has a private PKI root to trust cluster-wide"
  ansible.builtin.set_fact:
    _openshift_oauth_private_ca: >-
      {{ 'ca.crt' in ((_openshift_oauth_vault_root.resources | default([{}]))[0].data | default({})) }}

- name: "openshift_oauth | copy the Vault PKI root into openshift-config as user-ca-bundle (key ca-bundle.crt) for cluster-wide trust"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: user-ca-bundle
        namespace: openshift-config
        # openshift-config/user-ca-bundle is OpenShift's OWN reserved name for
        # the installer's additionalTrustBundle. Label what we create so the
        # removal task below can refuse to delete a ConfigMap this role did
        # not write - on a cluster installed behind an egress proxy, deleting
        # it would take out cluster-wide egress trust.
        labels:
          zuno.io/managed-by: zuno-ansible
      data:
        ca-bundle.crt: "{{ _openshift_oauth_vault_root.resources[0].data['ca.crt'] | b64decode }}"
  when: _openshift_oauth_private_ca | bool

- name: "openshift_oauth | look up user-ca-bundle before considering removing it"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: user-ca-bundle
    namespace: openshift-config
  register: _openshift_oauth_trust_bundle_existing
  when: not (_openshift_oauth_private_ca | bool)

# Only ever delete what this role created. user-ca-bundle is OpenShift's
# reserved additionalTrustBundle name: on a proxy-installed cluster an
# unconditional `state: absent` here is a cluster-wide egress outage caused
# by this role. demo222 is unaffected (httpProxy/httpsProxy/noProxy all
# empty), which is exactly why this stayed invisible.
- name: "openshift_oauth | remove the stale user-ca-bundle when this cluster has no private PKI root left to distribute"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ConfigMap
    name: user-ca-bundle
    namespace: openshift-config
  when:
    - not (_openshift_oauth_private_ca | bool)
    - (_openshift_oauth_trust_bundle_existing.resources | default([]) | length) > 0
    - >-
      ((_openshift_oauth_trust_bundle_existing.resources[0].metadata.labels | default({}))
       ['zuno.io/managed-by'] | default('')) == 'zuno-ansible'

# ADR-0347: removes the ADR-0346 artifact this superseded - nothing else
# references the old name, and keeping it around would be misleading
# (it holds the router CA under a name that now sounds authoritative).
- name: "openshift_oauth | remove the legacy default-ingress-cert ConfigMap superseded by ADR-0347"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ConfigMap
    name: default-ingress-cert
    namespace: openshift-config

- name: "openshift_oauth | apply the openshift-oauth GitOps Application (d1: cluster OAuth singleton)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "openshift-oauth"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-openshift-oauth-d1"
    # The Proxy reference is decided HERE, from the same fact that decided
    # whether the ConfigMap exists - that is the whole point of the fix.
    # Leaving it hardcoded in application-d1.yaml is what let the two drift.
    #
    # gitops_app_extra_helm_values REPLACES spec.source.helm.values wholesale
    # (values is a YAML *string*, which combine(recursive=True) cannot descend
    # into), so this starts from the manifest's own values and merges in only
    # the runtime-decided key - same idiom as
    # ansible/roles/{grafana,keycloak}/tasks/install.yml, and the form
    # check_docs.py's gitops_values_clobber check exempts. A bare dict here
    # would silently drop oauth.*, htpasswd, templates and tokenConfig and
    # take the cluster's IDP down. Subscript ['values'], never .values - dot
    # notation resolves to the Python dict method of that name.
    #
    # `| bool` is load-bearing: set_fact stores the fact as the STRING
    # "True"/"False" and every non-empty string is truthy in Jinja, so an
    # unfiltered test would always pick user-ca-bundle.
    #
    # clusterBaseDomain needs no merge - it rides the apps.mycluster.example.com
    # token apply_gitops_app.yml substitutes into the file text, mirrored by
    # the replace() below.
    gitops_app_extra_helm_values: >-
      {{
        ((lookup('ansible.builtin.file', zuno_repo_root + '/gitops/apps/openshift-oauth/application-d1.yaml')
          | replace('apps.mycluster.example.com', cluster_base_domain)
          | from_yaml)['spec']['source']['helm']['values'] | from_yaml)
        | combine({'clusterTrustedCA':
                     {'configMapName': (_openshift_oauth_private_ca | bool)
                                       | ternary('user-ca-bundle', '')}},
                  recursive=True)
      }}
