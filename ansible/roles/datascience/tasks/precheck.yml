---
- name: "datascience | verify OpenShift AI's DataScienceCluster is ready"
  kubernetes.core.k8s_info:
    api_version: datasciencecluster.opendatahub.io/v1
    kind: DataScienceCluster
    name: zuno-dsc
  register: _datascience_precheck_dsc

- name: "datascience | fail if the DataScienceCluster is not ready"
  ansible.builtin.fail:
    msg: "DataScienceCluster zuno-dsc not Ready. Run `make prepare openshift-ai` first."
  when: >-
    (_datascience_precheck_dsc.resources | default([]) | length) == 0 or
    (_datascience_precheck_dsc.resources[0].status.phase | default('')) != 'Ready'

- name: "datascience | precheck summary"
  ansible.builtin.debug:
    msg: "DataScienceCluster is Ready; the datascience project namespace can be prepared."
