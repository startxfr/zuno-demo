---
# No OLM operator of its own - the DataSciencePipelinesApplication/Pipeline
# CRDs this chart uses come from openshift_ai's aipipelines component
# (day0), so -d0 is a documented no-op, same pattern as
# ansible/roles/rag/tasks/install.yml.
- name: "rag_ingestion | apply the rag-ingestion GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "rag-ingestion"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-rag-ingestion-d0"

# ADR-0545/WP-129: same trap mlops hit in WP-126
# (ansible/roles/mlops/tasks/install.yml) - rag-dspa's own trust bundle
# only ever carried the cluster-wide Vault root (CN zuno-demo.internal, via
# odh-trusted-ca-bundle's CNO-injected ca-bundle.crt), never the
# openshift-service-serving-signer CA that signs in-cluster Service certs
# like mlflow.redhat-ods-applications.svc. WP-116's MLflow integration
# calls that endpoint from CreateRun, and with only the Vault root trusted
# the DSP api-server rejected its certificate (x509: certificate signed by
# unknown authority) and failed EVERY run creation server-side - live-caught
# 2026-09-04 triggering WP-129's remaining per-family first runs. Same
# split as ansible/roles/openshift_oauth/tasks/install.yml's
# keycloak-serving-ca: the ConfigMap *name* is Helm-templated
# (dspa.yaml's spec.apiServer.cABundle), only this data-write belongs in
# Ansible, since it concatenates two live cluster sources Helm cannot see
# at chart-render time. The DSP operator merges this into its own
# dsp-ca.crt file (not a Route swap), so a plain `oc rollout restart
# deployment/ds-pipeline-rag-dspa -n zuno-ai-build` is still needed after a
# first-time change - the pod does not reload its trust store from a
# changed mounted file on its own. Idempotent: re-running with unchanged
# source CAs produces byte-identical data, no restart forced.
- name: "rag_ingestion | read the cluster-wide Vault CA (user-ca-bundle)"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: openshift-config
    name: user-ca-bundle
  register: _rag_ingestion_vault_ca

- name: "rag_ingestion | read this namespace's OpenShift service-ca bundle"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: zuno-ai-build
    name: openshift-service-ca.crt
  register: _rag_ingestion_service_ca

- name: "rag_ingestion | merge both CAs into the DSP api-server's trust ConfigMap"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: dsp-mlflow-trust-rag-dspa
        namespace: zuno-ai-build
      data:
        ca-bundle.crt: >-
          {{ (_rag_ingestion_vault_ca.resources[0].data['ca-bundle.crt'] | default('')) + "\n"
             + (_rag_ingestion_service_ca.resources[0].data['service-ca.crt'] | default('')) }}
  register: _rag_ingestion_ca_bundle_apply
  when: >-
    (_rag_ingestion_vault_ca.resources | default([]) | length) > 0 and
    (_rag_ingestion_service_ca.resources | default([]) | length) > 0

- name: "rag_ingestion | fail loudly if either source CA ConfigMap is missing"
  ansible.builtin.fail:
    msg: >-
      user-ca-bundle (openshift-config) or openshift-service-ca.crt
      (zuno-ai-build) not found - the DSP api-server's MLflow-trust
      ConfigMap cannot be built. Both are cluster-standard ConfigMaps that
      should always exist; investigate before re-running.
  when: >-
    (_rag_ingestion_vault_ca.resources | default([]) | length) == 0 or
    (_rag_ingestion_service_ca.resources | default([]) | length) == 0

- name: "rag_ingestion | apply the rag-ingestion GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "rag-ingestion"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-rag-ingestion-d1"
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 15

# Only needed the very first time this ConfigMap gains data the DSP
# operator merges into dsp-trusted-ca-rag-dspa/dsp-ca.crt (see the task
# above) - restarting on every idempotent no-op re-run would be needless
# churn, so this is gated on the merge task actually reporting `changed`.
- name: "rag_ingestion | restart the DSP api-server so it reloads its merged trust bundle"
  kubernetes.core.k8s:
    state: patched
    api_version: apps/v1
    kind: Deployment
    namespace: zuno-ai-build
    name: ds-pipeline-rag-dspa
    definition:
      spec:
        template:
          metadata:
            annotations:
              # ansible_date_time is unset here (day2_install.yml runs
              # with gather_facts: false and nothing gathers it) - unlike
              # the mlops role's own copy of this same restart task, use
              # the fact-free now() global instead of silently rendering
              # an empty/undefined timestamp into the annotation.
              zuno.io/ca-bundle-restarted-at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
  when: _rag_ingestion_ca_bundle_apply is defined and _rag_ingestion_ca_bundle_apply.changed | default(false)

# UNVERIFIED against a live cluster - the DataSciencePipelinesApplication
# CR's exact status shape wasn't confirmed from this environment. Assumes
# a standard status.conditions entry of type "Ready" (the common
# kubebuilder convention, same assumption ansible/roles/mariadb/tasks/
# install.yml documents for its own CR). Re-check with `oc get dspa
# rag-dspa -n zuno-ai-build -o yaml` against the target cluster and
# adjust if the operator uses a different field.
- name: "rag_ingestion | wait for the rag-dspa DataSciencePipelinesApplication to report Ready"
  kubernetes.core.k8s_info:
    api_version: datasciencepipelinesapplications.opendatahub.io/v1
    kind: DataSciencePipelinesApplication
    namespace: zuno-ai-build
    name: rag-dspa
  register: _rag_ingestion_dspa
  until: >-
    (_rag_ingestion_dspa.resources | default([]) | length) > 0 and
    (_rag_ingestion_dspa.resources[0].status.conditions | default([])
     | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | list
     | first | default('False')) == 'True'
  retries: 60
  delay: 15

- name: "rag_ingestion | configure summary (DSPA)"
  ansible.builtin.debug:
    msg: >-
      rag-dspa DataSciencePipelinesApplication has reported Ready in
      zuno-ai-build.

# Compile+apply the tech PipelineVersion (see
# compile_pipeline_version.yml's header comment for why this step exists)
# before the recurring-run block below tries to discover one - otherwise
# a Pipeline CR with zero versions (e.g. right after a `make d1
# reinstall`) leaves nothing for the recurring run to reference.
- name: "rag_ingestion | compile and apply the tech pipeline version"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/roles/rag_ingestion/tasks/compile_pipeline_version.yml"

# --- KFP recurring-run activation (best-effort, UNVERIFIED against a live
# cluster) -----------------------------------------------------------------
# RHOAI's DSPA doesn't expose a Kubernetes-native scheduling CRD, only the
# KFP v2beta1 HTTP API behind the DSPA's own OAuth-proxied Route - the same
# path the OpenShift AI dashboard itself uses to create a schedule. Every
# step below is wrapped so a failure here only skips scheduling, never
# fails the rest of `make d2 install rag-ingestion`: the pipeline itself is
# already usable via manual/dashboard-triggered runs regardless of whether
# this succeeds. Re-verify each assumption below against a real cluster
# (`oc get route -n zuno-ai-build | grep ds-pipeline`, a real `curl` against
# the v2beta1 API) and correct this task file once confirmed.
- name: "rag_ingestion | resolve the caller's OpenShift bearer token for the DSPA API"
  ansible.builtin.command: oc whoami -t
  environment: "{{ k8s_auth_environment | default({}) }}"
  register: _rag_ingestion_oc_token
  changed_when: false
  ignore_errors: true

- name: "rag_ingestion | look up the rag-dspa API server Route"
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    namespace: zuno-ai-build
    # ds-pipeline-<dspa-name> is the DSPA operator's own Route-naming
    # convention (unverified against a live cluster - confirm with `oc get
    # route -n zuno-ai-build`).
    name: "ds-pipeline-{{ rag_ingestion_dspa_name | default('rag-dspa') }}"
  register: _rag_ingestion_dspa_route
  ignore_errors: true

- name: "rag_ingestion | resolve the KFP API base URL and schedule availability"
  ansible.builtin.set_fact:
    _rag_ingestion_kfp_api_base: >-
      {{ 'https://' + _rag_ingestion_dspa_route.resources[0].spec.host
         if (_rag_ingestion_dspa_route.resources | default([]) | length) > 0 else '' }}
    _rag_ingestion_kfp_token: "{{ _rag_ingestion_oc_token.stdout | default('') | trim }}"

- name: "rag_ingestion | skip recurring-run activation if the Route or token could not be resolved"
  ansible.builtin.debug:
    msg: >-
      Skipping KFP recurring-run activation: could not resolve
      {{ 'the DSPA Route' if _rag_ingestion_kfp_api_base == '' else 'an OpenShift bearer token (oc whoami -t)' }}.
      Create the schedule manually via the OpenShift AI dashboard, or
      re-run `make d2 install rag-ingestion` once `oc login` is active
      and the Route exists.
  when: _rag_ingestion_kfp_api_base == '' or _rag_ingestion_kfp_token == ''

- name: "rag_ingestion | KFP recurring-run activation"
  when: _rag_ingestion_kfp_api_base != '' and _rag_ingestion_kfp_token != ''
  block:
    # ADR-0105 (WP-22): the chart renders one schedule ConfigMap per
    # scheduled domain (templates/schedule-configmaps.yaml) - tech weekly,
    # sales hours-scale, adv daily, sxa-legacy none (on-demand only). This
    # discovery loop makes those values the single source of scheduling
    # truth (the previous version ignored values.yaml's cron entirely and
    # hardcoded one weekly schedule here).
    - name: "rag_ingestion | discover the chart's schedule ConfigMaps"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        namespace: zuno-ai-build
        label_selectors:
          - zuno.io/rag-ingestion-schedule=true
      register: _rag_ingestion_schedule_cms

    - name: "rag_ingestion | note when no schedule ConfigMap exists"
      ansible.builtin.debug:
        msg: >-
          No zuno.io/rag-ingestion-schedule ConfigMaps found in
          zuno-ai-build - every domain is unscheduled (on-demand only), so
          no recurring run is created.
      when: (_rag_ingestion_schedule_cms.resources | default([]) | length) == 0

    - name: "rag_ingestion | list pipelines on the DSPA API server"
      ansible.builtin.uri:
        url: "{{ _rag_ingestion_kfp_api_base }}/apis/v2beta1/pipelines"
        headers:
          Authorization: "Bearer {{ _rag_ingestion_kfp_token }}"
        validate_certs: false
        status_code: [200]
        return_content: true
      register: _rag_ingestion_pipelines_list
      when: (_rag_ingestion_schedule_cms.resources | default([]) | length) > 0

    - name: "rag_ingestion | create one recurring run per schedule ConfigMap"
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/roles/rag_ingestion/tasks/recurring_run.yml"
      loop: "{{ _rag_ingestion_schedule_cms.resources | default([]) }}"
      loop_control:
        loop_var: _rag_schedule_cm
        label: "{{ _rag_schedule_cm.metadata.name }}"

    # WP-100 (ADR-0105 amendment): sweep any chart-managed recurring run
    # left over from a schedule ConfigMap that no longer renders (e.g.
    # knowledge.tech's old shared "tech" schedule, replaced by
    # "tech-redhat"/"tech-confluence") - see that task file's header for
    # the exact naming-convention scoping this relies on.
    - name: "rag_ingestion | clean up recurring runs orphaned by a removed schedule ConfigMap"
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/roles/rag_ingestion/tasks/cleanup_orphaned_recurring_runs.yml"
  rescue:
    # ADR-0330/roadmap WP-07: enumerate the three concrete UNVERIFIED
    # assumptions this block depends on (not just "see the task output
    # above") so a real cluster run produces actionable evidence - each
    # line below is independently greppable
    # (`grep "WP-07-UNVERIFIED-ASSUMPTION" <log>`) and names exactly what
    # to check on the target cluster.
    - name: "rag_ingestion | recurring-run activation failed - not fatal"
      ansible.builtin.debug:
        msg: >-
          KFP recurring-run activation failed (see the task output above
          for the actual HTTP error). This does not block the rest of the
          install - create the schedule manually via the OpenShift AI
          dashboard instead, or correct the issue below and re-run
          `make d2 install rag-ingestion`.

          Possible causes (unverified assumptions this block depends on -
          check each against the target cluster):
          WP-07-UNVERIFIED-ASSUMPTION(1/3) Route naming: assumed the DSPA
          API server Route is named "ds-pipeline-{{ rag_ingestion_dspa_name | default('rag-dspa') }}".
          Confirm with `oc get route -n zuno-ai-build | grep ds-pipeline`
          and correct the `name:` field in the "look up the rag-dspa API
          server Route" task above if it differs.
          WP-07-UNVERIFIED-ASSUMPTION(2/3) Version ordering: assumed
          `/apis/v2beta1/pipelines/<id>/versions` returns the newest
          version first (index 0). Confirm by inspecting the JSON body in
          the "list versions for the resolved pipeline" task's output
          above (each entry's `created_at`) and, if index 0 is not
          newest, sort explicitly by `created_at` in the "resolve the
          latest pipeline_version_id" task instead of taking `| first`.
          WP-07-UNVERIFIED-ASSUMPTION(3/3) Recurring-run payload shape:
          assumed the v2beta1 `/apis/v2beta1/recurringruns` POST body
          field names (`pipeline_version_reference`, `trigger.
          cron_schedule.cron`, `mode: ENABLE`, `no_catchup`) match this
          DSPA's exact KFP API version. Confirm from the HTTP error body
          in the task output above (a 400 naming the invalid/missing
          field is the strongest signal) and correct the `body:` block in
          the "create or update the recurring run" task above.
