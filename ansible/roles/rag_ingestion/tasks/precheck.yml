---
# State detection (never fails). "Installed" requires both Applications
# Synced+Healthy and the rag-dspa DataSciencePipelinesApplication CR Ready
# - same shape as ansible/roles/rag/tasks/precheck.yml.
- name: "rag_ingestion | check the rag-ingestion Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-rag-ingestion-d0"

- name: "rag_ingestion | save the d0 check result"
  ansible.builtin.set_fact:
    _rag_ingestion_d0_installed: "{{ _state_check_result }}"

- name: "rag_ingestion | check the rag-ingestion Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-rag-ingestion-d1"

- name: "rag_ingestion | look up the rag-dspa DataSciencePipelinesApplication"
  kubernetes.core.k8s_info:
    api_version: datasciencepipelinesapplications.opendatahub.io/v1
    kind: DataSciencePipelinesApplication
    namespace: zuno-ai-build
    name: rag-dspa
  register: _rag_ingestion_dspa_lookup

- name: "rag_ingestion | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        _rag_ingestion_d0_installed
        and _state_check_result
        and (_rag_ingestion_dspa_lookup.resources | default([]) | length) > 0
        and (_rag_ingestion_dspa_lookup.resources[0].status.conditions | default([])
             | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | list
             | first | default('False')) == 'True'
      }}

- name: "rag_ingestion | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
