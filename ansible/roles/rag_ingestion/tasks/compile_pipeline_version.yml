---
# The chart's Pipeline CR (templates/pipeline.yaml) carries only
# displayName/description - nothing ever uploads an actual KFP pipeline
# VERSION into it. A `make d1 reinstall rag-ingestion` deletes+recreates
# the Application (and therefore the Pipeline CR, and therefore its
# underlying KFP pipeline object), leaving zero pipeline versions and no
# schedulable run at all unless this task re-runs. The compiled pipeline
# source (files/pipeline.py.tpl) already targets
# `kubernetes_manifest_format=True` (its __main__ block), which emits a
# real `PipelineVersion` CR (pipelines.kubeflow.org/v2beta1, CRD
# `pipelineversions.pipelines.kubeflow.org`) rather than a raw KFP-server
# REST upload - `oc apply`-ing that manifest is the actual missing step,
# not a kfp.Client() call. compile_one_pipeline_version.yml does this per
# domain (operator-machine imperative op, same pattern as the KFP
# recurring-run activation below and the day1-build BuildConfig trigger),
# so a future reinstall regenerates every enabled domain's version instead
# of leaving any of them permanently empty.
#
# COMPILE_TARGETS below is "tech" plus every WP-22/ADR-0217 domain that is
# actually `enabled: true` today (sales/adv remain `enabled: false` -
# nothing to compile for them yet) - extend this list as more domains
# flip on. Confirmed live 2026-08-21: compiling a second domain (sxa)
# exposed a real PipelineVersion-naming collision with tech's ("Pipeline
# spec is immutable" - two domains' compiles both produced an object
# literally named the chart's single pipeline.version value, and
# PipelineVersion names are unique per-namespace, not per-pipeline) -
# fixed in files/pipeline.py.tpl by suffixing every non-tech domain's
# compiled version name with its own domain name. sxa-legacy added
# 2026-08-23 once WP-065's amended Part B flipped it to enabled: true.
- name: "rag_ingestion | set the list of pipeline compile targets"
  ansible.builtin.set_fact:
    _rag_ingestion_compile_targets: ["tech", "sxa", "sxa-legacy"]

- name: "rag_ingestion | ensure the compiler venv (kfp SDK) exists"
  ansible.builtin.pip:
    requirements: "{{ zuno_repo_root }}/components/rag-ingestion/tooling/requirements.txt"
    virtualenv: "{{ zuno_repo_root }}/components/rag-ingestion/tooling/.venv"
    virtualenv_command: "python3 -m venv"

- name: "rag_ingestion | read the rendered pipeline source ConfigMap"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: zuno-ai-build
    name: "zuno-rag-ingestion-d1-rag-ingestion-pipeline-source"
  register: _rag_ingestion_pipeline_source_cm

- name: "rag_ingestion | skip pipeline-version compile if the pipeline-source ConfigMap isn't rendered yet"
  ansible.builtin.debug:
    msg: >-
      Skipping pipeline-version compile: ConfigMap
      zuno-rag-ingestion-d1-rag-ingestion-pipeline-source not found in
      zuno-ai-build (the d1 Application may not have synced yet).
  when: (_rag_ingestion_pipeline_source_cm.resources | default([]) | length) == 0

- name: "rag_ingestion | compile and apply each enabled domain's pipeline version"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/roles/rag_ingestion/tasks/compile_one_pipeline_version.yml"
  loop: "{{ _rag_ingestion_compile_targets }}"
  loop_control:
    loop_var: compile_pipeline_target
  when: (_rag_ingestion_pipeline_source_cm.resources | default([]) | length) > 0
