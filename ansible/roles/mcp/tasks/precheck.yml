---
# State detection (never fails).
- name: "mcp | check the mcp Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-mcp-d0"

- name: "mcp | save the d0 check result"
  ansible.builtin.set_fact:
    _mcp_d0_installed: "{{ _state_check_result }}"

- name: "mcp | check the mcp Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-mcp-d1"

- name: "mcp | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
  vars:
    _state_is_installed: "{{ _mcp_d0_installed and _state_check_result }}"
