---
# No OLM operator involved - all of this component's content is -d1 (see
# gitops/apps/mcp/application-d0.yaml, a no-op).
- name: "mcp | apply the MCP Gateway GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "mcp"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

- name: "mcp | apply the MCP Gateway GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "mcp"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"

# ADR-0117: the confluence MCP server - also no Day0 prerequisite (no
# schema/operator), same shape as the gateway itself above. Deployed under
# this same "mcp" Day1 run component since gitops/apps/mcp-confluence's
# name doesn't match this role's own name - the same name-mismatch
# self-sufficiency pattern every other server here uses.
- name: "mcp | apply the confluence MCP server GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "mcp-confluence"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

- name: "mcp | apply the confluence MCP server GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "mcp-confluence"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"

# ADR-0326/WP-33: the salesforce MCP server install is deferred (2026-08-23)
# - its ExternalSecret can't resolve the "url" key at Vault path
# salesforce/technical, so the Application never reaches Synced/Healthy. See
# the "Out of scope / deferred" note in wp-33-comage-slice.md. Removed from
# this GitOps Application to avoid re-installing a component that can't come
# up; re-add the two apply_gitops_app.yml tasks (see git history) once the
# Vault secret is fixed.

# ADR-0120/WP-058: the git-forge MCP server - same "deployed under this
# same Day1 run component" reasoning as confluence/salesforce above.
- name: "mcp | apply the git-forge MCP server GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "mcp-git-forge"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

- name: "mcp | apply the git-forge MCP server GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "mcp-git-forge"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"

# ADR-0355/WP-074: the aap MCP server - same "deployed under this same
# Day1 run component" reasoning as confluence/git-forge above. Its
# credential (zuno/aap/mcp-token) is minted by the Day 1 aap-config role,
# not the vault role, so this server cannot become Ready before
# `make d1 install aap-config` has run - its ExternalSecret stays
# unresolved until then.
- name: "mcp | apply the aap MCP server GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "mcp-aap"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

- name: "mcp | apply the aap MCP server GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "mcp-aap"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"

# ADR-0516: diagram-render, the Mermaid-to-SVG service backing
# mcp-gateway's generate_diagram handler - not a real MCP server
# (components/mcp-servers/*), but deployed under this same "mcp" Day1 run
# component for the same reason confluence/git-forge are: it exists
# solely to serve one mcp-gateway tool, same name-mismatch
# self-sufficiency pattern as those two.
- name: "mcp | apply the diagram-render GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "diagram-render"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

- name: "mcp | apply the diagram-render GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "diagram-render"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
