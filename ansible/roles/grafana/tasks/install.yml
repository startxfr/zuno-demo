---
# Visualization layer for ADR-0029's model-usage metrics/traces (Prometheus +
# Tempo datasources, "Model consumption" dashboard), behind an oauth-proxy
# sidecar authenticating against OpenShift's own (Keycloak-federated,
# ADR-0320) OAuth server.
- name: "grafana | apply the grafana GitOps Application (d0: operator)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "grafana"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-grafana-d0"
    gitops_app_wait_retries: 30
    gitops_app_wait_delay: 15

- name: "grafana | apply the grafana GitOps Application (d1: Grafana instance, datasources, dashboard)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "grafana"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-grafana-d1"
    gitops_app_wait_retries: 30
    gitops_app_wait_delay: 10

- name: "grafana | wait for the Prometheus-reader ServiceAccount token to be minted"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: zuno-monitoring
    name: grafana-prometheus-reader-token
  register: _grafana_prom_token_secret
  until: >-
    (_grafana_prom_token_secret.resources | default([]) | length) > 0 and
    ((_grafana_prom_token_secret.resources[0].data.token | default('')) | length > 0)
  retries: 30
  delay: 5

# The Authorization header value ("Bearer <token>") is passed straight
# through to a second d1 apply (ADR-0048's gitops_app_extra_helm_values,
# already used by models/nvidia_gpu for other runtime-discovered values)
# rather than via GrafanaDatasource spec.valuesFrom/secretKeyRef - that
# path's resolved value never reaches Grafana for this nested
# secureJsonData field on grafana-operator v5.24.0, while an inline value
# in the same spot works immediately - see
# gitops/charts/grafana/values.yaml's prometheusReaderBearer comment. This
# is a platform-issued ServiceAccount session token (minted by the cluster
# itself once serviceaccount-prometheus-reader.yaml lands), the same class
# of live OpenShift bearer credential ansible/roles/{mlops,rag_ingestion}
# already read directly - not an application-generated secret subject to
# ADR-0024's Vault-only rule, and never written to git (gitops_app_extra_helm_values
# patches the live Application object only).
- name: "grafana | re-apply the grafana GitOps Application (d1) with the Prometheus datasource's Authorization value"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  no_log: true
  vars:
    gitops_component_name: "grafana"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-grafana-d1"
    gitops_app_wait_retries: 30
    gitops_app_wait_delay: 10
    gitops_app_extra_helm_values:
      grafana:
        enabled: true
      prometheusReaderBearer: "Bearer {{ _grafana_prom_token_secret.resources[0].data.token | b64decode }}"

- name: "grafana | wait for the Grafana Deployment to be ready"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: zuno-monitoring
    name: grafana-deployment
  register: _grafana_deploy
  until: >-
    (_grafana_deploy.resources | default([]) | length) > 0 and
    (_grafana_deploy.resources[0].status.readyReplicas | default(0)) > 0
  retries: 30
  delay: 10
