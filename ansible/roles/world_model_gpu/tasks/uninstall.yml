---
# ADR-0604 D5 (WP-229): remove the world-model GPU node whatever the switch
# says. Deleting the Application cascades to the MachineSet, its Machine and
# the EC2 instance (the Machine API finalizer drains the node first).
- name: "world-model-gpu | look up the world-model application"
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: openshift-gitops
    name: "{{ world_model_gpu_dependent_app }}"
  register: _world_model_gpu_dependent

- name: "world-model-gpu | refuse to remove the node under the running demo"
  ansible.builtin.fail:
    msg: >-
      {{ world_model_gpu_dependent_app }} is still installed. Uninstall the
      world-model application (the Day-2 component, WP-235) first: removing the
      node under the runtime would leave it Pending.
  when: (_world_model_gpu_dependent.resources | default([])) | length > 0

- name: "world-model-gpu | look up the node's Application"
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: openshift-gitops
    name: "{{ world_model_gpu_app_name }}"
  register: _world_model_gpu_app

- name: "world-model-gpu | delete the node's Application (terminates the GPU instance)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "{{ world_model_gpu_app_name }}"
    gitops_app_delete_wait_timeout: 600
  when: (_world_model_gpu_app.resources | default([])) | length > 0

- name: "world-model-gpu | wait until no Machine of the set remains"
  kubernetes.core.k8s_info:
    api_version: machine.openshift.io/v1beta1
    kind: Machine
    namespace: openshift-machine-api
    label_selectors:
      - "machine.openshift.io/cluster-api-machineset in ({{ world_model_gpu_machinesets | join(',') }})"
  register: _world_model_gpu_machines
  until: (_world_model_gpu_machines.resources | default([])) | length == 0
  retries: 40
  delay: 15

- name: "world-model-gpu | report"
  ansible.builtin.debug:
    msg: >-
      No world-model GPU node remains. Set zuno_world_model_enabled to false in
      ansible/clusters/<cluster>.yml, or the next `make d0 install world-model-gpu`
      creates it again.
