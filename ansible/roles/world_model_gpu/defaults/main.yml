---
# ADR-0604 D5 (WP-229). The switch lives in ansible/clusters/<cluster>.yml
# (committed, read by every checkout) and may be overridden locally from
# ansible/confidential.yml. Off unless a cluster says otherwise.
zuno_world_model_enabled: false

# The availability-zone letter of the node ("" = the one the Application declares). A cluster file sets it because
# zuno_machines_az_override is one map that a workstation's ansible/confidential.yml replaces whole (it already holds
# the GPU pool's entry there), so an entry added to the cluster file would silently not apply on that workstation.
zuno_world_model_gpu_az: ""

world_model_gpu_app_name: zuno-machines-world-model-d0
# One MachineSet per zone; the zones scaled to 1 are zuno_world_model_gpu_azs (["a","b"] searches both zones; c has no g7e.4xlarge).
zuno_world_model_gpu_azs: []
# Same GPU (RTX PRO 6000, 96 GB) on a smaller or a bigger host: another capacity pool, same models. -2xl-* = g7e.2xlarge
# (8 vCPU, 64 GiB: the runtime asks 6 CPU / 48 Gi), -8xl-* = g7e.8xlarge. zuno_world_model_gpu_sets, when not empty, names
# the MachineSets scaled to 1 instead of the zones above.
zuno_world_model_gpu_sets: []
world_model_gpu_machinesets: [zuno-gpu-world-model-a, zuno-gpu-world-model-b, zuno-gpu-world-model-2xl-a, zuno-gpu-world-model-2xl-b, zuno-gpu-world-model-8xl-a, zuno-gpu-world-model-8xl-b]
world_model_gpu_node_label: "zuno.io/gpu-workload=world-model"
# The Day-2 application whose presence blocks removing the node.
world_model_gpu_dependent_app: zuno-world-model-d1
# First boot of a g7e node (~8-10 min) plus the GPU Operator driver build and
# device-plugin advertisement: 25 minutes in all.
world_model_gpu_wait_retries: 50
world_model_gpu_wait_delay: 30
