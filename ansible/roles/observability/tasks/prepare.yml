---
# ADR-0029: instrument model usage, cost and distributed traces. This role
# installs the collection path only - a Collector every service in
# components/ can send OTLP traces/metrics to. It does not install a
# long-term backend (Tempo/Prometheus storage): the Collector's debug/log
# exporter is enough to prove the pipeline for a demo; wiring a real backend
# is future work (ADR-0029 doesn't mandate one for v0, only instrumentation).
- name: "observability | ensure the openshift-opentelemetry-operator namespace exists"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: openshift-opentelemetry-operator
        labels:
          zuno.io/managed-by: ansible

- name: "observability | ensure the operator group exists"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: opentelemetry-operator-group
        namespace: openshift-opentelemetry-operator
      spec: {}

- name: "observability | subscribe to the OpenTelemetry operator"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: opentelemetry-product
        namespace: openshift-opentelemetry-operator
        labels:
          zuno.io/managed-by: ansible
      spec:
        channel: stable
        name: opentelemetry-product
        source: redhat-operators
        sourceNamespace: openshift-marketplace
        installPlanApproval: Automatic

- name: "observability | wait for the OpenTelemetryCollector CRD to be established"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: opentelemetrycollectors.opentelemetry.io
  register: _observability_crd
  until: (_observability_crd.resources | default([]) | length) > 0
  retries: 30
  delay: 15

- name: "observability | ensure the zuno-telemetry namespace exists"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: zuno-telemetry
        labels:
          zuno.io/managed-by: ansible

- name: "observability | apply the shared OTLP collector"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: opentelemetry.io/v1beta1
      kind: OpenTelemetryCollector
      metadata:
        name: zuno-otel-collector
        namespace: zuno-telemetry
        labels:
          zuno.io/managed-by: ansible
      spec:
        mode: deployment
        config:
          receivers:
            otlp:
              protocols:
                grpc: {}
                http: {}
          processors:
            batch: {}
          exporters:
            # Demo scope: logs the pipeline out so it's provably wired end
            # to end (`oc logs deploy/zuno-otel-collector-collector`).
            # Swap/add a real backend exporter (Tempo, an APM vendor) here
            # once one is provisioned - nothing else in this repo needs to
            # change, every service already points at this Collector by
            # its stable in-cluster name.
            debug:
              verbosity: normal
          service:
            pipelines:
              traces:
                receivers: [otlp]
                processors: [batch]
                exporters: [debug]
              metrics:
                receivers: [otlp]
                processors: [batch]
                exporters: [debug]

- name: "observability | wait for the collector Deployment to be ready"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: zuno-telemetry
    name: zuno-otel-collector-collector
  register: _observability_collector
  until: >-
    (_observability_collector.resources | default([]) | length) > 0 and
    (_observability_collector.resources[0].status.readyReplicas | default(0)) > 0
  retries: 30
  delay: 10
