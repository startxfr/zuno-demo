---
- name: "observability | verify the Red Hat build of OpenTelemetry operator is available"
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    namespace: openshift-marketplace
    name: opentelemetry-product
  register: _observability_precheck_pkg

- name: "observability | fail if the operator is not published in this cluster's catalog"
  ansible.builtin.fail:
    msg: >-
      opentelemetry-product was not found in openshift-marketplace. Confirm
      the redhat-operators CatalogSource is enabled.
  when: (_observability_precheck_pkg.resources | default([]) | length) == 0

- name: "observability | precheck summary"
  ansible.builtin.debug:
    msg: "OpenTelemetry operator is available in the catalog."
