---
# State detection (never fails). observability has no configure phase -
# "configured" mirrors "installed".
- name: "observability | look up the collector Deployment"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: zuno-telemetry
    name: zuno-otel-collector-collector
  register: _observability_collector_deploy_lookup

- name: "observability | compute configure state"
  ansible.builtin.set_fact:
    _state_is_configured: >-
      {{
        (_observability_collector_deploy_lookup.resources | default([]) | length) > 0
        and (_observability_collector_deploy_lookup.resources[0].status.readyReplicas | default(0)) > 0
      }}

- name: "observability | record configure state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_configure_state.yml"
