---
# ADR-0352/WP-143 pilot: mariadb is the first component with an
# internal/external mode. The per-cluster/confidential load runs FIRST
# (it used to sit after the -d0 apply, which would have applied the
# built-in operator before the mode was even known), then dispatches:
# internal = today's behavior bit-for-bit (install_internal.yml),
# external = validate + seed Vault + assert the endpoint, deploy nothing
# (install_external.yml).
#
# ADR-0517 (demo333, 2026-09-07): committed per-cluster non-secret values
# first - AAP checkouts have no confidential.yml, and without this the
# Helm values fell back to their placeholders there (see
# ansible/clusters/demo333.yml). confidential.yml, loaded after, still
# overrides locally.
- name: "mariadb | load the committed per-cluster variables"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_cluster_vars.yml"

- name: "mariadb | check for ansible/confidential.yml"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/confidential.yml"
  register: _mariadb_confidential_file

- name: "mariadb | load ansible/confidential.yml if present"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/confidential.yml"
  when: _mariadb_confidential_file.stat.exists

- name: "mariadb | resolve the component mode (ADR-0352)"
  ansible.builtin.set_fact:
    _mariadb_mode: "{{ zuno_mariadb_mode | default('internal') }}"

- name: "mariadb | fail on an unknown mode value"
  ansible.builtin.fail:
    msg: >-
      zuno_mariadb_mode is '{{ _mariadb_mode }}' - expected 'internal' or
      'external' (ADR-0352 clause 1; absent means internal).
  when: _mariadb_mode not in ['internal', 'external']

- name: "mariadb | install the built-in MariaDB (internal mode)"
  ansible.builtin.include_tasks: install_internal.yml
  when: _mariadb_mode == 'internal'

- name: "mariadb | verify and seed the external MariaDB (external mode)"
  ansible.builtin.include_tasks: install_external.yml
  when: _mariadb_mode == 'external'
