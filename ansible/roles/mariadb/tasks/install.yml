---
# Ordered right after postgresql - the other data-tier operator sharing
# the zuno-data namespace. Package name given as "mariadb-operator" - the
# open-source (Apache-2.0) community-operators listing, not the paid
# "mariadb-enterprise-operator" certified listing (which needs MariaDB
# Enterprise registry credentials this cluster doesn't have); still
# discover catalog/channel from the PackageManifest rather than
# hardcoding them (ADR-0048), same pattern as
# ansible/roles/jobset/tasks/install.yml.
- name: "mariadb | look up the {{ mariadb_package_name | default('mariadb-operator') }} PackageManifest"
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    namespace: openshift-marketplace
    name: "{{ mariadb_package_name | default('mariadb-operator') }}"
  register: _mariadb_pkg_info

- name: "mariadb | fail if the package isn't published anywhere on this cluster"
  ansible.builtin.fail:
    msg: >-
      No PackageManifest named '{{ mariadb_package_name | default('mariadb-operator') }}'
      was found in openshift-marketplace. Check `oc get packagemanifest -n
      openshift-marketplace | grep -i mariadb` for the correct package name
      on this cluster (it must be published by the community-operators
      catalog). Re-run with `-e mariadb_package_name=<name>` or update this
      role's default if the catalog on this cluster differs.
  when: (_mariadb_pkg_info.resources | default([]) | length) == 0

# mariadb-operator only publishes a single "alpha" channel (also its
# defaultChannel) - no code change needed here, the "stable else
# defaultChannel" fallback below already resolves to it since no "stable"
# channel exists. "alpha" reflects this project's date-based versioning
# convention, not alpha-quality software.
- name: "mariadb | select the catalog/channel to subscribe from"
  ansible.builtin.set_fact:
    _mariadb_catalog_source: "{{ _mariadb_pkg_info.resources[0].status.catalogSource }}"
    _mariadb_channel: >-
      {{
        'stable'
        if (_mariadb_pkg_info.resources[0].status.channels | selectattr('name', 'equalto', 'stable') | list | length) > 0
        else (_mariadb_pkg_info.resources[0].status.defaultChannel | default(''))
      }}

- name: "mariadb | fail if no usable channel was found"
  ansible.builtin.fail:
    msg: >-
      Package '{{ mariadb_package_name | default('mariadb-operator') }}'
      (catalog '{{ _mariadb_catalog_source }}') has no "stable" channel and
      no defaultChannel to fall back to. Published channels:
      {{ _mariadb_pkg_info.resources[0].status.channels | map(attribute='name') | list }}.
  when: _mariadb_channel | length == 0

- name: "mariadb | discovery summary"
  ansible.builtin.debug:
    msg: >-
      Subscribing to package '{{ mariadb_package_name | default('mariadb-operator') }}',
      catalog '{{ _mariadb_catalog_source }}', channel '{{ _mariadb_channel }}'.

# The Subscription/OperatorGroup (operator.enabled) live in
# gitops/charts/mariadb, applied via the separate zuno-mariadb-d0
# Application.
- name: "mariadb | apply the MariaDB GitOps Application (d0: operator)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "mariadb"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-mariadb-d0"
    gitops_app_extra_helm_values:
      operator:
        enabled: true
        subscription:
          name: "{{ mariadb_package_name | default('mariadb-operator') }}"
          operator:
            name: "{{ mariadb_package_name | default('mariadb-operator') }}"
            channel: "{{ _mariadb_channel }}"
            source:
              name: "{{ _mariadb_catalog_source }}"
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 15

# Soft-read of ansible/confidential.yml (not a hard fail like vault's) for
# optional S3 backup creds - same shape as
# ansible/roles/postgresql/tasks/install.yml.
- name: "mariadb | check for ansible/confidential.yml"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/confidential.yml"
  register: _mariadb_confidential_file

- name: "mariadb | load ansible/confidential.yml if present"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/confidential.yml"
  when: _mariadb_confidential_file.stat.exists

# Only add the PhysicalBackup S3 schedule when real credentials exist -
# never rendered half-configured (same rule postgresql's repo2 follows).
- name: "mariadb | determine whether S3 backup credentials are configured"
  ansible.builtin.set_fact:
    _mariadb_backup_s3_enabled: >-
      {{
        (zuno_mariadb_backup_s3_bucket | default('xxxxxx') != 'xxxxxx')
        and (zuno_mariadb_backup_s3_endpoint | default('xxxxxx') != 'xxxxxx')
        and (zuno_mariadb_backup_s3_region | default('xxxxxx') != 'xxxxxx')
        and (zuno_mariadb_backup_s3_access_key_id | default('xxxxxx') != 'xxxxxx')
        and (zuno_mariadb_backup_s3_secret_access_key | default('xxxxxx') != 'xxxxxx')
      }}

- name: "mariadb | note that the S3 backup schedule is not configured"
  ansible.builtin.debug:
    msg: >-
      zuno_mariadb_backup_s3_* fields are not all set in
      ansible/confidential.yml - the mariadb MariaDB will not get a
      PhysicalBackup schedule. Fill in all five of the bucket/endpoint/
      region/access_key_id/secret_access_key fields (all five are required
      together), then run `make d0 install vault` to seed zuno/mariadb/s3
      followed by `make d1 install mariadb` to render the schedule.
  when: not (_mariadb_backup_s3_enabled | bool)

# mariadbOperand.enabled/backups.s3.* live in the same chart, applied via
# the separate zuno-mariadb-d1 Application after -d0 is Synced+Healthy.
- name: "mariadb | resolve the cluster's default StorageClass (WP-118 B5)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_default_storage_class.yml"

- name: "mariadb | apply the MariaDB GitOps Application (d1: MariaDB/PhysicalBackup)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "mariadb"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-mariadb-d1"
    gitops_app_extra_helm_values:
      mariadbOperand:
        enabled: true
      # WP-118 B5.
      cluster:
        storageClassName: "{{ cluster_default_storage_class }}"
      backups:
        s3:
          enabled: "{{ _mariadb_backup_s3_enabled | bool }}"
          bucket: "{{ zuno_mariadb_backup_s3_bucket | default('') }}"
          endpoint: "{{ zuno_mariadb_backup_s3_endpoint | default('') }}"
          region: "{{ zuno_mariadb_backup_s3_region | default('') }}"
          # ADR-0546/WP-131. The prefix was the last field of this component
          # naming a cluster-specific location as a chart literal: bucket,
          # endpoint and region were already variables, so a second cluster
          # installed from this repo would have kept its backups apart by
          # bucket but written them under the same zuno-mariadb/ key prefix -
          # harmless while the buckets differ, wrong the moment they do not.
          # The default is the pre-ADR-0546 value, so declaring it changes
          # nothing until the variable moves.
          prefix: "{{ zuno_mariadb_backup_s3_prefix | default('zuno-mariadb') }}"
    # Values-changing apply: without this the Synced+Healthy wait can pass on
    # the sync state from BEFORE the apply. See the same flag and reasoning in
    # ansible/roles/mlflow/tasks/install.yml.
    gitops_app_refresh: true
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 15

# mariadb-operator ships as an operator-sdk Helm-operator: the CSV's own
# Deployment (installed by -d0) only runs its embedded Helm chart - and so
# only starts the real mariadb-operator controller-manager that reconciles
# MariaDB CRs - once the MariadbOperator activation CR (applied as part of
# -d1 above) has been reconciled. Wait for that controller-manager
# Deployment before waiting on the MariaDB CR below, otherwise that wait
# would spin for its full retry budget before any controller exists to
# reconcile it. UNVERIFIED against a live cluster: the exact Deployment
# name the embedded Helm chart derives wasn't confirmed from this
# environment - re-check with `oc get deployment -n zuno-data -l
# app.kubernetes.io/name=mariadb-operator` against the target cluster and
# adjust if it differs.
- name: "mariadb | wait for the mariadb-operator controller-manager to become Available"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: zuno-data
    name: mariadb-operator
  register: _mariadb_operator_deployment
  until: >-
    (_mariadb_operator_deployment.resources | default([]) | length) > 0 and
    (_mariadb_operator_deployment.resources[0].status.conditions | default([])
     | selectattr('type', 'equalto', 'Available') | map(attribute='status') | list
     | first | default('False')) == 'True'
  retries: 60
  delay: 10

# UNVERIFIED against a live cluster - the MariaDB CR's exact status shape
# wasn't confirmed from this environment (no network path to a real
# OpenShift cluster). Assumes a standard status.conditions entry of type
# "Ready", the common kubebuilder convention (same assumption
# gitops/charts/kueue's operand documents for its own CR). Re-check with
# `oc get mariadb mariadb -n zuno-data -o yaml` against the target cluster
# and adjust if the operator uses a different field.
- name: "mariadb | wait for the mariadb MariaDB CR to report Ready"
  kubernetes.core.k8s_info:
    api_version: k8s.mariadb.com/v1alpha1
    kind: MariaDB
    namespace: zuno-data
    name: mariadb
  register: _mariadb_cluster
  until: >-
    (_mariadb_cluster.resources | default([]) | length) > 0 and
    (_mariadb_cluster.resources[0].status.conditions | default([])
     | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | list
     | first | default('False')) == 'True'
  retries: 60
  delay: 10

# MySQL is a server-first protocol, and istio protocol-sniffs any Service
# port with no declared protocol on BOTH the inbound and the OUTBOUND
# (client-sidecar) side - in-mesh clients (mariadb-operator itself,
# rag-ingestion) deadlock waiting for a greeting their own sidecar is
# withholding until appProtocol is set. The chart-side halves of this fix
# (gitops/charts/mariadb: podMetadata excludeInboundPorts + the
# DestinationRule) cover the inbound/istio-TLS sides, but the Service
# object is OWNED BY the mariadb-operator, whose CR has no port template
# (oc explain mariadb.spec.service: type/LB/metadata only) - so the
# appProtocol declaration has to be patched on after the operator creates
# it. Idempotent; re-run after any operator upgrade that recreates the
# Service.
- name: "mariadb | declare port 3306 as opaque TCP for istio (server-first MySQL)"
  kubernetes.core.k8s_json_patch:
    api_version: v1
    kind: Service
    namespace: zuno-data
    name: mariadb
    patch:
      - op: add
        path: /spec/ports/0/appProtocol
        value: tcp

- name: "mariadb | configure summary"
  ansible.builtin.debug:
    msg: >-
      mariadb MariaDB has reported Ready in the zuno-data namespace
      ({{ 'with' if (_mariadb_backup_s3_enabled | bool) else 'without' }}
      a PhysicalBackup schedule).
