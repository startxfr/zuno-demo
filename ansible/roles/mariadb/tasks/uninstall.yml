---
# Reverse of install.yml. Subscription name is runtime-discovered (listed below),
# not a fixed constant. Order: delete -d1 (MariaDB/PhysicalBackup operand) first
# so ArgoCD isn't fighting a CR deletion, then remove_operator.yml (needs the
# Subscription to still exist) before -d0's own delete.
- name: "mariadb | delete the mariadb ArgoCD Application (d1: MariaDB/PhysicalBackup)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-mariadb-d1"

- name: "mariadb | find the mariadb-operator Subscription"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    namespace: openshift-operators
  register: _mariadb_subscriptions

- name: "mariadb | remove the discovered operator(s) (owned CRDs - cascading the MariadbOperator/MariaDB CRs - then CSV, then Subscription)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/remove_operator.yml"
  vars:
    operator_subscription_name: "{{ _mariadb_subscription.metadata.name }}"
    operator_namespace: openshift-operators
  loop: >-
    {{ _mariadb_subscriptions.resources | default([])
       | selectattr('metadata.name', 'search', 'mariadb') | list }}
  loop_control:
    loop_var: _mariadb_subscription
    label: "{{ _mariadb_subscription.metadata.name }}"

- name: "mariadb | delete the mariadb ArgoCD Application (d0: cascades the remaining operator install)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-mariadb-d0"
