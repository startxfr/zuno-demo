---
# State detection (never fails). Installed = the Application is Synced and Healthy and the nginx Deployment has a
# ready replica.
- name: "demo_guide | check the demo-guide Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "{{ demo_guide_app_name }}"

- name: "demo_guide | look up the nginx Deployment"
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ demo_guide_namespace }}"
    name: "{{ demo_guide_deployment }}"
  register: _demo_guide_lookup

- name: "demo_guide | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        _state_check_result
        and (_demo_guide_lookup.resources | default([]) | length) > 0
        and (_demo_guide_lookup.resources[0].status.readyReplicas | default(0)) >= 1
      }}

- name: "demo_guide | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
