---
# One Application to delete: no operator, no -d0. The namespace stays (gitops/charts/namespaces).
- name: "demo_guide | delete the demo-guide Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "{{ demo_guide_app_name }}"
