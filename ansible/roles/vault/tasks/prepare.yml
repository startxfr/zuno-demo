---
# Installs Vault via its GitOps Application (gitops/apps/vault), then
# imperatively initializes it. This is the one component that cannot
# depend on Vault for its own bootstrap secret: the unseal key and root
# token are captured here and stored in a Kubernetes Secret in a
# locked-down, admin-only namespace. See ADR-0024's "Hardened requirement".
# Unsealing itself happens in configure.yml's vault-unseal-configure Job,
# not here - that Job re-runs (and re-unseals) every time `configure` is
# invoked, independent of whether `prepare` ran in the same pass.
- name: "vault | apply the Vault GitOps Application"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "vault"
    # NOT "{{ zuno_id }}-{{ gitops_component_name }}" (this role's usual
    # convention, e.g. every other role in this file): gitops/apps/vault/
    # application.yaml is also auto-synced by the root App-of-Apps
    # (gitops/root-app-of-apps.yaml), under its own checked-in, static
    # name "zuno-vault" - not zuno_id-derived. Naming this Application
    # "{{ zuno_id }}-vault" instead, as every other role here does, was
    # found live on api.demo222.startx.fr to create a *second*,
    # independent Vault release/StatefulSet alongside the root App-of-
    # Apps' own "zuno-vault" one - the exact opposite of
    # apply_gitops_app.yml's documented "both paths converge on the same
    # desired state" assumption. Matching the static file's own name here
    # makes that assumption actually true for this component.
    gitops_app_name: "zuno-{{ gitops_component_name }}"
    # The chart's readinessProbe runs `vault status`, which exits non-zero
    # while sealed - so the StatefulSet (and therefore the Application)
    # can never report Healthy until Vault is unsealed, which only
    # happens via this same role's own imperative steps below. Waiting
    # here for Synced+Healthy would deadlock forever on a fresh install.
    # The StatefulSet-exists/Pod-Running waits immediately below are this
    # role's own equivalent, sufficient wait.
    gitops_app_wait: false

# Label-based, not a hardcoded name: the Helm release name (and therefore
# every resource's name) isn't a repository-wide constant - see the
# gitops_app_name comment above. app.kubernetes.io/name=vault is the
# official HashiCorp chart's own stable label, present regardless of
# release name.
- name: "vault | wait for the Vault StatefulSet to exist"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    namespace: zuno-data
    label_selectors:
      - "app.kubernetes.io/name=vault"
  register: _vault_sts
  until: (_vault_sts.resources | default([]) | length) > 0
  retries: 30
  delay: 10

- name: "vault | wait for the Vault server pod to be Running (sealed is expected at this point)"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: zuno-data
    label_selectors:
      - "app.kubernetes.io/name=vault"
      - "component=server"
  register: _vault_pod
  until: >-
    (_vault_pod.resources | default([]) | length) > 0 and
    (_vault_pod.resources[0].status.phase | default('')) == 'Running'
  retries: 60
  delay: 10

- name: "vault | read current seal/init status"
  kubernetes.core.k8s_exec:
    namespace: zuno-data
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: vault status -format=json
  register: _vault_status_raw
  failed_when: false
  changed_when: false

- name: "vault | parse status (the CLI exits non-zero while sealed; stdout is still valid JSON)"
  ansible.builtin.set_fact:
    _vault_status: "{{ _vault_status_raw.stdout | default('{}') | from_json }}"

# ADR-0310: ansible/roles/vault/kustomize/bootstrap-namespace/. The
# bootstrap credentials Secret below stays inline - its value only exists
# during this Ansible run (captured from `vault operator init`), so it has
# no static desired-state manifest to check in.
- name: "vault | apply the locked-down bootstrap namespace and its admin-only RoleBinding"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/vault/kustomize/bootstrap-namespace"

- name: "vault | check for an existing bootstrap credentials secret"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: zuno-data
    name: vault-bootstrap-credentials
  register: _vault_bootstrap_secret

- name: "vault | initialize Vault with a single key share (demo scope; ADR-0112 tracks HA/production hardening for v1)"
  kubernetes.core.k8s_exec:
    namespace: zuno-data
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: vault operator init -key-shares=1 -key-threshold=1 -format=json
  register: _vault_init_raw
  when:
    - not (_vault_status.initialized | default(false))
    - (_vault_bootstrap_secret.resources | default([]) | length) == 0

- name: "vault | persist the unseal key and root token to the locked-down bootstrap secret"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: vault-bootstrap-credentials
        namespace: zuno-data
      type: Opaque
      stringData:
        unseal_key: "{{ (_vault_init_raw.stdout | from_json).unseal_keys_b64[0] }}"
        root_token: "{{ (_vault_init_raw.stdout | from_json).root_token }}"
  when: _vault_init_raw is defined and _vault_init_raw.stdout is defined
  no_log: true
