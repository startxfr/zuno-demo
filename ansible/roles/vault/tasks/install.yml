      api_key={{ zuno_maas_gateway_api_key | quote }}"
  when: >-
    zuno_maas_gateway_api_key | default('xxxxxx') != 'xxxxxx'
  no_log: true

# Only seeded when all five fields are real - no placeholder fallback,
