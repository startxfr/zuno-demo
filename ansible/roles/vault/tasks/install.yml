---
# Installs Vault via its GitOps Application (gitops/apps/vault), then
# imperatively initializes it. This is the one component that cannot
# depend on Vault for its own bootstrap secret: the unseal key and root
# token are captured here and stored in vault-bootstrap-credentials, a
# Kubernetes Secret in zuno-vault. See ADR-0024's "Hardened requirement".
# Unsealing itself happens further down, via the vault-unseal-configure
# Job - that Job re-runs (and re-unseals) every time this file is
# invoked, e.g. after a Vault pod restart reseals it.
#
# Operator-supplied secrets (Google OAuth, SMTP technical credentials,
# Confluence token) come from ansible/confidential.yml, gitignored and
# never written to a Git-tracked file (see ansible/README.md). Checked for
# up front so a missing file fails fast, before spending time applying the
# Application below, instead of surfacing later as silent empty
# placeholders.
- name: "vault | verify ansible/confidential.yml is present"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/confidential.yml"
  register: _vault_confidential_file

- name: "vault | fail if ansible/confidential.yml is missing"
  ansible.builtin.fail:
    msg: >-
      ansible/confidential.yml is missing. Copy
      ansible/confidential.example.yml to ansible/confidential.yml and fill
      in the values (Google OAuth client, SMTP technical credentials,
      Atlassian Confluence token) before running `make d0 install vault`.
      This role reads it on every run, so the file can be deleted again
      afterwards - unless Vault needs to be reinstalled later.
  when: not _vault_confidential_file.stat.exists

- name: "vault | load ansible/confidential.yml"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/confidential.yml"

- name: "vault | apply the Vault GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "vault"
    gitops_app_phase: "d0"
    # NOT "{{ zuno_id }}-{{ gitops_component_name }}-d0" (this role's
    # usual convention, e.g. every other role in this file): gitops/apps/
    # vault/application-d0.yaml/application-d1.yaml's own checked-in names
    # are the static "zuno-vault-d0"/"zuno-vault-d1" - not zuno_id-derived.
    # See the application-d1.yaml call below for why.
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

# Vault has no OLM operator at all (a plain Helm deployment) - all of its
# content is -d1, see gitops/apps/vault/application-d1.yaml.
- name: "vault | apply the Vault GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "vault"
    gitops_app_phase: "d1"
    # NOT "{{ zuno_id }}-{{ gitops_component_name }}-d1" (this role's
    # usual convention): gitops/apps/vault/application-d1.yaml's own
    # checked-in name is the static "zuno-vault-d1" - not zuno_id-derived.
    # Naming this Application "{{ zuno_id }}-vault-d1" instead, as every
    # other role here does, was found live on api.demo222.startx.fr
    # (before the -d0/-d1 split, on the single former "zuno-vault") to
    # create a *second*, independent Vault release/StatefulSet alongside
    # the one an operator-applied root App-of-Apps
    # (gitops/root-app-of-apps.yaml, kept only as a documented bootstrap
    # example since ADR-0311, no longer applied by Ansible) would create
    # under its own static name. Matching the static file's own name here
    # keeps this role's Applications and that documented example
    # converging on the same desired state, for anyone who follows both
    # paths on the same cluster.
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
    # The chart's readinessProbe runs `vault status`, which exits non-zero
    # while sealed - so the StatefulSet (and therefore the Application)
    # can never report Healthy until Vault is unsealed, which only
    # happens via this same role's own imperative steps below. Waiting
    # here for Synced+Healthy would deadlock forever on a fresh install.
    # The StatefulSet-exists/Pod-Running waits immediately below are this
    # role's own equivalent, sufficient wait.
    gitops_app_wait: false

# Label-based, not a hardcoded name: the Helm release name (and therefore
# every resource's name) isn't a repository-wide constant - see the
# gitops_app_name comment above. app.kubernetes.io/name=vault is the
# official HashiCorp chart's own stable label, present regardless of
# release name.
- name: "vault | wait for the Vault StatefulSet to exist"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    namespace: zuno-vault
    label_selectors:
      - "app.kubernetes.io/name=vault"
  register: _vault_sts
  until: (_vault_sts.resources | default([]) | length) > 0
  retries: 30
  delay: 10

- name: "vault | wait for the Vault server pod to be Running (sealed is expected at this point)"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: zuno-vault
    label_selectors:
      - "app.kubernetes.io/name=vault"
      - "component=server"
  register: _vault_pod
  until: >-
    (_vault_pod.resources | default([]) | length) > 0 and
    (_vault_pod.resources[0].status.phase | default('')) == 'Running'
  retries: 60
  delay: 10

- name: "vault | read current seal/init status"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: vault status -format=json
  register: _vault_status_raw
  failed_when: false
  changed_when: false

- name: "vault | parse status (the CLI exits non-zero while sealed; stdout is still valid JSON)"
  ansible.builtin.set_fact:
    _vault_status: "{{ _vault_status_raw.stdout | default('{}') | from_json }}"

- name: "vault | check for an existing bootstrap credentials secret"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: zuno-vault
    name: vault-bootstrap-credentials
  register: _vault_bootstrap_secret

- name: "vault | initialize Vault with a single key share (demo scope; ADR-0112 tracks HA/production hardening for v1)"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: vault operator init -key-shares=1 -key-threshold=1 -format=json
  register: _vault_init_raw
  when:
    - not (_vault_status.initialized | default(false))
    - (_vault_bootstrap_secret.resources | default([]) | length) == 0

- name: "vault | persist the unseal key and root token to the bootstrap secret"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: vault-bootstrap-credentials
        namespace: zuno-vault
      type: Opaque
      stringData:
        unseal_key: "{{ (_vault_init_raw.stdout | from_json).unseal_keys_b64[0] }}"
        root_token: "{{ (_vault_init_raw.stdout | from_json).root_token }}"
  when: _vault_init_raw is defined and _vault_init_raw.stdout is defined
  no_log: true

# Runs the vault-unseal-configure Job (unseals Vault, then enables the KV
# v2 secrets engine, the Kubernetes auth method, and the eso-reader
# role/policy every ExternalSecret in the platform resolves through - see
# ansible/roles/vault/kustomize/unseal-configure/configmap.yaml for the
# actual script). A Job, not ansible k8s_exec, so it can be re-run inside
# the cluster at any time - e.g. after a Vault pod restart reseals it -
# without needing a full ansible run; same "Job, not exec" reasoning as
# ansible/roles/sql_schema and ansible/roles/rag's schema-apply Jobs.
# Also seeds self-generatable application secrets and reserves empty
# placeholders for the handful that require an operator to supply real
# input (the Google OAuth client secret, SMTP credentials) - see ADR-0014
# and ADR-0024.
- name: "vault | read bootstrap credentials"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: zuno-vault
    name: vault-bootstrap-credentials
  register: _vault_creds
  no_log: true

- name: "vault | fail if the bootstrap credentials are missing"
  ansible.builtin.fail:
    msg: "vault-bootstrap-credentials not found - the init step above should have created it."
  when: (_vault_creds.resources | default([]) | length) == 0

- name: "vault | set connection facts"
  ansible.builtin.set_fact:
    _vault_root_token: "{{ _vault_creds.resources[0].data.root_token | b64decode }}"
  no_log: true

# Discovered, not hardcoded "vault.zuno-data.svc" or "{{ zuno_id }}-vault":
# the Helm release name isn't a repository-wide constant (see the
# gitops_app_name comment above) and the chart creates three Services
# sharing app.kubernetes.io/name=vault (client, -internal headless, -ui) -
# only the plain client one (no vault-internal label) is what VAULT_ADDR
# needs. _vault_pod is already available from the wait above (same pod,
# already confirmed Running) - no need to re-look it up.
- name: "vault | discover the Vault client Service"
  kubernetes.core.k8s_info:
    kind: Service
    namespace: zuno-vault
    label_selectors:
      - "app.kubernetes.io/name=vault"
  register: _vault_services

- name: "vault | select the client Service (excludes the -internal headless and -ui variants)"
  ansible.builtin.set_fact:
    _vault_service_name: >-
      {{
        (_vault_services.resources
         | rejectattr('metadata.labels.vault-internal', 'defined')
         | map(attribute='metadata.name') | list)[0]
      }}

# A dedicated copy, not a direct reference to vault-bootstrap-credentials:
# keeps the Job's own dependency self-contained and separately named, same
# spirit as ansible/roles/agents/tasks/run_acceptance_gate.yml's
# acceptance-gate-credentials Secret (there, the copy is also cross-
# namespace; here both Secrets happen to live in zuno-vault already).
- name: "vault | copy the unseal key/root token into a Secret the Job can mount"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: vault-unseal-configure-credentials
        namespace: zuno-vault
        labels:
          zuno.io/managed-by: zuno-ansible
      type: Opaque
      data:
        unseal_key: "{{ _vault_creds.resources[0].data.unseal_key }}"
        root_token: "{{ _vault_creds.resources[0].data.root_token }}"
  no_log: true

# ADR-0310: the script itself is static (ansible/roles/vault/kustomize/
# unseal-configure/) - only the Job that runs it stays inline, below,
# since (like ansible/roles/sql_schema and ansible/roles/rag's schema-
# apply Jobs) it's deleted and recreated every run.
- name: "vault | apply the unseal/configure script ConfigMap"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/vault/kustomize/unseal-configure"

- name: "vault | delete any previous unseal/configure Job (Jobs are immutable, this task is idempotent-by-recreation)"
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: vault-unseal-configure
    namespace: zuno-vault
    wait: true

- name: "vault | run the unseal/configure Job"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: vault-unseal-configure
        namespace: zuno-vault
        labels:
          zuno.io/managed-by: zuno-ansible
      spec:
        backoffLimit: 2
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: vault-unseal-configure
                image: docker.io/hashicorp/vault:1.17.2
                command:
                  - /bin/sh
                  - /scripts/unseal-and-configure.sh
                env:
                  - name: VAULT_ADDR
                    value: "http://{{ _vault_service_name }}.zuno-vault.svc:8200"
                  - name: VAULT_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: vault-unseal-configure-credentials
                        key: root_token
                  - name: VAULT_UNSEAL_KEY
                    valueFrom:
                      secretKeyRef:
                        name: vault-unseal-configure-credentials
                        key: unseal_key
                volumeMounts:
                  - name: script
                    mountPath: /scripts
            volumes:
              - name: script
                configMap:
                  name: vault-unseal-configure-script
                  defaultMode: 0755

- name: "vault | wait for the unseal/configure Job to complete"
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    namespace: zuno-vault
    name: vault-unseal-configure
  register: _vault_unseal_configure_job
  until: >-
    (_vault_unseal_configure_job.resources[0].status.succeeded | default(0)) > 0 or
    (_vault_unseal_configure_job.resources[0].status.failed | default(0)) > 0
  retries: 30
  delay: 10

- name: "vault | fetch the unseal/configure Job's pod"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: zuno-vault
    label_selectors:
      - "job-name=vault-unseal-configure"
  register: _vault_unseal_configure_pod

- name: "vault | print the unseal/configure Job's output"
  kubernetes.core.k8s_log:
    namespace: zuno-vault
    name: "{{ _vault_unseal_configure_pod.resources[0].metadata.name }}"
  register: _vault_unseal_configure_log
  when: (_vault_unseal_configure_pod.resources | default([]) | length) > 0

- name: "vault | show the unseal/configure Job's output"
  ansible.builtin.debug:
    msg: "{{ _vault_unseal_configure_log.log_lines | default(['no pod/log found']) }}"

- name: "vault | fail if the unseal/configure Job did not succeed"
  ansible.builtin.fail:
    msg: >-
      vault-unseal-configure Job did not succeed (succeeded=
      {{ _vault_unseal_configure_job.resources[0].status.succeeded | default(0) }}
      failed={{ _vault_unseal_configure_job.resources[0].status.failed | default(0) }}) -
      see the output above.
  when: (_vault_unseal_configure_job.resources[0].status.succeeded | default(0)) == 0

- name: "vault | generate and seed self-generatable application secrets"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    # `environment:` is the generic Ansible task keyword - it sets env vars
    # for the *ansible controller's own* module invocation, not the remote
    # exec session kubernetes.core.k8s_exec opens (that module has no
    # env-passing parameter of its own). VAULT_TOKEN has to be set inside
    # the shell command that actually runs in the container instead.
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/{{ generated_secret.key }}
      username={{ generated_secret.value.username }} password={{ generated_secret.value.password }}"
  loop: "{{ _vault_generated_secrets | dict2items }}"
  loop_control:
    loop_var: generated_secret
    label: "{{ generated_secret.key }}"
  no_log: true
  vars:
    _vault_generated_secrets:
      keycloak/admin:
        username: admin
        password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"
      postgresql/app:
        # No underscore/hyphen (zunoapp, not zuno_app/zuno-app): PGO's
        # PostgresCluster derives a Kubernetes Secret name directly from
        # spec.users[].name ("<cluster>-pguser-<user>", RFC 1123 label
        # rules - no underscores), and unquoted PostgreSQL identifiers
        # can't contain hyphens either - lowercase-letters-and-digits-only
        # is the one charset valid in both. Discovered via `helm lint`
        # while migrating this role from CloudNativePG (which had no such
        # constraint) to PGO - see ansible/roles/postgresql/README.md.
        username: zunoapp
        password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"

- name: "vault | generate and seed the tekos-frontend confidential OIDC client secret"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/keycloak/tekos-frontend
      client_secret={{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
  no_log: true

- name: "vault | generate and seed the shared demo-persona password (ADR-0041)"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/keycloak/demo-personas
      password={{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"
  no_log: true

- name: "vault | generate and seed the MCP Gateway workload identity token (ADR-0037)"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/mcp/gateway-workload-token
      token={{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
  no_log: true

- name: "vault | generate and seed the Tekos frontend session HMAC secret"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/tekos/frontend-session
      hmac_secret={{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
  no_log: true

# The three secrets below can't be self-generated - they're credentials for
# real external services, supplied via ansible/confidential.yml (loaded
# above). Each is (re-)written from confidential.yml on every run once
# filled in (idempotent, confidential.yml is the source of truth - safe to
# re-apply); until then it falls through to the check-then-placeholder
# idiom below, same as always.
- name: "vault | seed the Google OAuth client from ansible/confidential.yml"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/google-oauth/client
      client_id={{ zuno_google_oauth_client_id | quote }} client_secret={{ zuno_google_oauth_client_secret | quote }}"
  when: >-
    zuno_google_oauth_client_id | default('xxxxxx') != 'xxxxxx'
    and zuno_google_oauth_client_secret | default('xxxxxx') != 'xxxxxx'
  no_log: true

- name: "vault | seed the SMTP technical credentials from ansible/confidential.yml"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/smtp/technical
      host={{ zuno_smtp_host | quote }} port={{ (zuno_smtp_port | default('587')) | quote }}
      username={{ zuno_smtp_username | quote }} password={{ zuno_smtp_password | quote }}"
  when: >-
    zuno_smtp_host | default('xxxxxx') != 'xxxxxx'
    and zuno_smtp_username | default('xxxxxx') != 'xxxxxx'
    and zuno_smtp_password | default('xxxxxx') != 'xxxxxx'
  no_log: true

# url/email are required alongside token: Atlassian Cloud's REST API
# authenticates with email+API-token Basic Auth, not a bearer token
# alone, and the base site URL is needed to know which Confluence
# instance to call - a token by itself was never enough to actually use
# this credential. enabled is written as plain metadata, not part of the
# when: gate below (redundant with checking real values are present) -
# for the future MCP confluence server to read once it exists.
- name: "vault | seed the Confluence technical credentials from ansible/confidential.yml"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/confluence/technical
      url={{ zuno_atlassian_confluence_url | quote }} email={{ zuno_atlassian_confluence_email | quote }}
      token={{ zuno_atlassian_confluence_token | quote }}
      enabled={{ (zuno_atlassian_confluence_enabled | default(false)) | quote }}"
  when: >-
    zuno_atlassian_confluence_url | default('xxxxxx') != 'xxxxxx'
    and zuno_atlassian_confluence_email | default('xxxxxx') != 'xxxxxx'
    and zuno_atlassian_confluence_token | default('xxxxxx') != 'xxxxxx'
  no_log: true

# Only seeded when all five fields are real - unlike google-oauth/smtp/
# confluence above, this one has no placeholder fallback: the ExternalSecret
# that reads it (gitops/charts/postgresql/templates/externalsecret-backup-s3.yaml)
# is itself only rendered when ansible/roles/postgresql/tasks/install.yml
# detects the same five real values and sets backups.s3.enabled - so there's
# never a case where that ExternalSecret exists but this Vault path doesn't.
- name: "vault | seed the PostgreSQL backup S3 credentials from ansible/confidential.yml"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/postgresql/backup-s3
      bucket={{ zuno_postgresql_backup_s3_bucket | quote }} endpoint={{ zuno_postgresql_backup_s3_endpoint | quote }}
      region={{ zuno_postgresql_backup_s3_region | quote }} access_key={{ zuno_postgresql_backup_s3_access_key | quote }}
      secret_key={{ zuno_postgresql_backup_s3_secret_key | quote }}"
  when: >-
    zuno_postgresql_backup_s3_bucket | default('xxxxxx') != 'xxxxxx'
    and zuno_postgresql_backup_s3_endpoint | default('xxxxxx') != 'xxxxxx'
    and zuno_postgresql_backup_s3_region | default('xxxxxx') != 'xxxxxx'
    and zuno_postgresql_backup_s3_access_key | default('xxxxxx') != 'xxxxxx'
    and zuno_postgresql_backup_s3_secret_key | default('xxxxxx') != 'xxxxxx'
  no_log: true

- name: "vault | check whether operator-supplied secrets already exist"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv get -format=json zuno/{{ secret_path }}"
  loop:
    - google-oauth/client
    - smtp/technical
    - confluence/technical
  loop_control:
    loop_var: secret_path
    label: "{{ secret_path }}"
  register: _vault_existing_secrets
  changed_when: false
  failed_when: false
  no_log: true

- name: "vault | seed an empty placeholder only where no secret exists yet (never overwrite operator-supplied values)"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/{{ secret_result.secret_path }} _placeholder=true"
  loop: "{{ _vault_existing_secrets.results }}"
  loop_control:
    loop_var: secret_result
    label: "{{ secret_result.secret_path }}"
  when: secret_result.rc != 0
  no_log: true

- name: "vault | operator action required"
  ansible.builtin.debug:
    msg: >-
      zuno/google-oauth/client, zuno/smtp/technical and/or
      zuno/confluence/technical are still placeholders - the corresponding
      value(s) in ansible/confidential.yml are still the "xxxxxx" sentinel
      from confidential.example.yml. Fill them in and re-run
      `make d0 install vault` (this role re-seeds from confidential.yml on
      every run, without overwriting anything already populated another
      way). ADR-0014's real Google OAuth delegation depends on the first
      one - everything else in this file is unattended.

# LLM provider API keys (ADR-0020's ModelRouter fail-over). Same
# check-then-placeholder idiom as the google-oauth/smtp/confluence block
# above, kept separate because the field name differs: those seed an opaque
# `_placeholder=true` marker, while platform/ai-gateway/externalsecret-
# {openai,gemini,anthropic,mistral}.yaml each resolve a specific `api_key`
# property, so the placeholder has to carry that same key. Formerly seeded
# by ansible/roles/llm/tasks/install.yml itself via a direct
# vault-bootstrap-credentials read + k8s_exec - moved here so llm's own
# install.yml only ever registers GitOps Applications, consistent with
# every other day1 role (ADR-0024: this role is the platform's one
# legitimate direct Vault writer).
- name: "vault | check whether LLM provider API keys already exist"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv get -format=json zuno/providers/{{ provider }}"
  loop:
    - openai
    - gemini
    - anthropic
    - mistral
  loop_control:
    loop_var: provider
    label: "{{ provider }}"
  register: _vault_existing_provider_secrets
  changed_when: false
  failed_when: false
  no_log: true

- name: "vault | seed an empty LLM provider placeholder only where no key exists yet"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/providers/{{ provider_result.provider }} api_key=__placeholder__"
  loop: "{{ _vault_existing_provider_secrets.results }}"
  loop_control:
    loop_var: provider_result
    label: "{{ provider_result.provider }}"
  when: provider_result.rc != 0
  no_log: true

- name: "vault | LLM provider operator action required"
  ansible.builtin.debug:
    msg: >-
      zuno/providers/{openai,gemini,anthropic,mistral} are placeholders
      until an operator populates them, e.g.
      `vault kv put zuno/providers/openai api_key=...`. Until then
      components/agent-runtime's ModelRouter simply fails over past that
      provider (ADR-0020) - the local model always stays eligible.

# Not a secret, but Vault is this platform's single source of truth for
# runtime configuration too (ADR-0024) - storing it here means any
# consumer without direct cluster API access (a pod via ExternalSecret,
# ansible/tasks/apply_gitops_app.yml on a run where this task hasn't fired
# yet) has exactly one place to read it from instead of a second,
# potentially stale, hand-maintained copy. See
# ansible/tasks/resolve_cluster_base_domain.yml for how it's discovered.
- name: "vault | resolve the cluster's real apps domain"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_base_domain.yml"

- name: "vault | store the cluster's apps domain"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/platform/cluster-domain domain={{ cluster_base_domain }}"
