---
# Installs Vault via GitOps, initializes it on first run, and configures it.
# Operator-supplied secrets come from ansible/confidential.yml (gitignored).
#
# ADR-0602 clause 1 / WP-223: Vault auto-unseals with AWS KMS, stores on
# raft and serves TLS (gitops/charts/vault). Initialization produces
# recovery keys (3 shares, threshold 2) and a root token, written ONCE to a
# 0600 file on the Ansible controller - never to a cluster Secret. The root
# token is used for exactly one thing, bootstrapping the vault-configurator
# Kubernetes auth role (tasks/bootstrap_auth.yml), and is revoked as soon as
# the configure Job has run. Every later Vault call in ansible/ logs in as a
# ServiceAccount (configure Job: vault-configure; seed tasks:
# ansible-seeder through ansible/tasks/vault_login.yml).
- name: "vault | verify ansible/confidential.yml is present"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/confidential.yml"
  register: _vault_confidential_file

- name: "vault | fail if ansible/confidential.yml is missing"
  ansible.builtin.fail:
    msg: >-
      ansible/confidential.yml is missing. Copy
      ansible/confidential.example.yml to ansible/confidential.yml and fill
      in what this cluster needs - that file is the authority, 20 blocks with
      per-variable prose, most of them optional, and fields left as xxxxxx
      treated as not configured - before running `make d0 install vault`.
      docs/platform/prerequisites.md lists what else must be true or decided
      first.
      This role reads it on every run, so the file can be deleted again
      afterwards - unless Vault needs to be reinstalled later.
  when: not _vault_confidential_file.stat.exists

# ADR-0602 / WP-223: zuno_security_profile may be set per cluster; load that
# file BEFORE confidential.yml so a local confidential.yml still wins.
- name: "vault | load the committed per-cluster variables"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_cluster_vars.yml"

- name: "vault | load ansible/confidential.yml"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/confidential.yml"

# vault seeds keycloak/demo-personas before the keycloak role runs, so the
# hardened persona-password policy is asserted here too.
- name: "vault | assert the security profile"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/assert_security_profile.yml"
  vars:
    assert_security_profile_check_personas: true

# A Vault initialized before WP-223 (file storage, Shamir seal, root token in
# this Secret) must go through the migration playbook: applying the new
# chart over it would start an EMPTY raft Vault next to the old file data.
# The playbook sets vault_migration_in_progress itself.
- name: "vault | look for the pre-WP-223 bootstrap credentials Secret"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: zuno-vault
    name: vault-bootstrap-credentials
  register: _vault_legacy_bootstrap_secret

- name: "vault | refuse to install over a Vault that still needs the KMS/raft migration"
  ansible.builtin.fail:
    msg: >-
      zuno-vault/vault-bootstrap-credentials exists: this Vault was initialized
      before ADR-0602/WP-223 (file storage, Shamir seal, stored root token).
      Migrate it first - docs/platform/vault-kms-raft-migration.md, i.e.
      `ansible-playbook -i ansible/inventories/demo/hosts.yml
      ansible/playbooks/vault_migrate_kms_raft.yml` - then re-run
      `make d0 install vault`.
  when:
    - (_vault_legacy_bootstrap_secret.resources | default([]) | length) > 0
    - not (vault_migration_in_progress | default(false) | bool)

- name: "vault | apply the Vault GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "vault"
    gitops_app_phase: "d0"
    # Static name, not zuno_id-derived: matches application-d0.yaml.
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

# Resolved before the d1 Application (cluster_base_domain substitution) and
# the configure Job (pki/roles/cert-manager allow-lists keycloak.<domain>).
# Idempotent, `is not defined` guarded - see resolve_cluster_base_domain.yml.
- name: "vault | resolve the cluster's real apps domain"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_base_domain.yml"

# Vault has no OLM operator (plain Helm deployment) - all content is -d1.
- name: "vault | create the KMS credentials Secret and apply the Vault GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/roles/vault/tasks/apply_vault_app.yml"

# Label-based, not a hardcoded release name: app.kubernetes.io/name=vault
# is the chart's stable label regardless of release name.
- name: "vault | wait for the Vault StatefulSet to exist"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    namespace: zuno-vault
    label_selectors:
      - "app.kubernetes.io/name=vault"
  register: _vault_sts
  until: (_vault_sts.resources | default([]) | length) > 0
  retries: 30
  delay: 10

- name: "vault | wait for the Vault server pod to be Running (uninitialized is expected on a fresh install)"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: zuno-vault
    label_selectors:
      - "app.kubernetes.io/name=vault"
      - "component=server"
  register: _vault_pod
  until: >-
    (_vault_pod.resources | default([]) | length) > 0 and
    (_vault_pod.resources[0].status.phase | default('')) == 'Running'
  retries: 60
  delay: 10

- name: "vault | read current seal/init status"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: vault status -format=json
  register: _vault_status_raw
  failed_when: false
  changed_when: false

- name: "vault | parse status (the CLI exits non-zero while sealed; stdout is still valid JSON)"
  ansible.builtin.set_fact:
    _vault_status: "{{ _vault_status_raw.stdout | default('{}') | from_json }}"

- name: "vault | resolve the cluster name (names the recovery file)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_name.yml"

- name: "vault | first initialization (recovery keys + one-time root token)"
  when: not (_vault_status.initialized | default(false))
  block:
    # Recovery keys, not unseal keys: with the awskms seal, KMS unseals and
    # these only authorize sensitive operations (generate-root, rekey,
    # seal migration back). 3 shares / threshold 2, so one lost share is
    # not a lockout and one leaked share is not a root token.
    - name: "vault | initialize Vault (awskms seal: 3 recovery shares, threshold 2)"
      kubernetes.core.k8s_exec:
        namespace: zuno-vault
        pod: "{{ _vault_pod.resources[0].metadata.name }}"
        container: vault
        command: vault operator init -recovery-shares=3 -recovery-threshold=2 -format=json
      register: _vault_init_raw
      no_log: true

    # Written ONCE, to the controller only: the cluster never holds a copy
    # of the recovery keys or the root token. .gitignore covers
    # ansible/vault-recovery*. backup: true keeps any earlier file (a
    # reinstalled cluster) instead of overwriting it. Move it to the
    # operators' password manager and delete it from the controller.
    - name: "vault | write the recovery keys and root token to the Ansible controller (0600, once)"
      ansible.builtin.copy:
        content: "{{ _vault_init_raw.stdout | from_json | to_nice_json }}"
        dest: "{{ zuno_repo_root }}/ansible/vault-recovery-{{ cluster_name }}.json"
        mode: "0600"
        backup: true
      delegate_to: localhost
      no_log: true

    - name: "vault | set the one-time root token fact"
      ansible.builtin.set_fact:
        _vault_init_root_token: "{{ (_vault_init_raw.stdout | from_json).root_token }}"
      no_log: true

    - name: "vault | recovery file written"
      ansible.builtin.debug:
        msg: >-
          Vault initialized. Recovery keys (3 shares, threshold 2) and the
          root token are in {{ zuno_repo_root }}/ansible/vault-recovery-{{ cluster_name }}.json
          (mode 0600, this controller only). The root token is revoked at the
          end of this role; the recovery keys are the only way to generate a
          new one - store them in the operators' password manager, split
          across people, then delete the file.

# AWS KMS unseals on its own - right after init, and after every restart.
- name: "vault | wait for Vault to be initialized and unsealed (AWS KMS auto-unseal)"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: vault status -format=json
  register: _vault_unsealed_raw
  failed_when: false
  changed_when: false
  until: >-
    (_vault_unsealed_raw.stdout | default('{}') | from_json).initialized | default(false)
    and not ((_vault_unsealed_raw.stdout | default('{}') | from_json).sealed | default(true))
  retries: 30
  delay: 10

- name: "vault | fail if Vault did not unseal by itself"
  ansible.builtin.fail:
    msg: >-
      Vault is still sealed (status: {{ _vault_unsealed_raw.stdout | default('n/a') }}).
      With the awskms seal that means Vault cannot use the KMS key: check
      `oc logs zuno-vault-0 -n zuno-vault` for the AWS error, the
      vault-aws-kms Secret (zuno_vault_kms_access_key_id/_secret_access_key)
      and the IAM policy in docs/platform/vault-kms-raft-migration.md.
  when: >-
    (_vault_unsealed_raw.stdout | default('{}') | from_json).sealed | default(true)

- name: "vault | bootstrap the configurator identity with the one-time root token"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/roles/vault/tasks/bootstrap_auth.yml"
  vars:
    vault_bootstrap_pod: "{{ _vault_pod.resources[0].metadata.name }}"
    vault_bootstrap_token: "{{ _vault_init_root_token }}"
  when: (_vault_init_root_token | default('')) | length > 0

- name: "vault | run the configure Job (logs in as vault-configure)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/roles/vault/tasks/run_configure_job.yml"

# Only after the configure Job succeeded: until then the root token (also in
# the recovery file) is the way back if the bootstrap needs a second try.
- name: "vault | revoke the one-time root token"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: "sh -c {{ ('VAULT_TOKEN=' ~ (_vault_init_root_token | quote) ~ ' vault token revoke -self') | quote }}"
  when: (_vault_init_root_token | default('')) | length > 0
  no_log: true

- name: "vault | forget the root token"
  ansible.builtin.set_fact:
    _vault_init_root_token: ""
  when: (_vault_init_root_token | default('')) | length > 0
  no_log: true

- name: "vault | log in as ansible-seeder for the seed tasks below"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_login.yml"

# ADR-0578/WP-165: the Transit public key is no longer exported into the
# repository. It was the OKF trust anchor (agents/zuno-platform-signer.pub);
# OKF releases are now signed keyless by zuno-demo-agents and verified by
# identity. The Transit key itself stays for sign-blob/verify-blob
# (ADR-0535's rollback path), whose verifiers read the key from Vault.

# ADR-0517 live finding (demo333, 2026-09-07): publish the Vault PKI ROOT
# certificate to a well-known in-cluster ConfigMap. The root
# (CN=zuno-demo.internal, created by the configure Job's
# pki/root/generate/internal) signs live server certs (mariadb-server-cert,
# istiod) on EVERY cluster - but the only path that distributed it
# cluster-wide (openshift_oauth -> openshift-config/user-ca-bundle) sourced
# it from the KEYCLOAK TLS Secret's ca.crt, which only exists while
# Keycloak itself serves a Vault-issued cert. On an ACME/public-Keycloak
# cluster that source is empty, the root never reached
# Proxy.spec.trustedCA, and the DSP api-server hung unable to verify
# MariaDB's chain (rag-dspa CrashLoop, Day 2 blocked). "What signs
# Keycloak's cert" and "does this cluster have a private PKI root" are
# different questions - this ConfigMap answers the second one directly
# from the PKI engine, and openshift_oauth now prefers it (its keycloak
# fallback kept for compatibility). A root certificate is public material:
# a ConfigMap, not a Secret, is the right home.
- name: "vault | read the PKI root certificate from the pki engine"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ zuno_vault_token }} vault read -field=certificate pki/cert/ca"
  register: _vault_pki_root_raw
  changed_when: false
  # Same rule as every VAULT_TOKEN task in this role: the exec command line
  # (token included) lands in the result on failure.
  no_log: true

- name: "vault | publish the PKI root to the well-known vault-pki-root-ca ConfigMap"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: vault-pki-root-ca
        namespace: zuno-vault
        labels:
          zuno.io/managed-by: zuno-ansible
      data:
        ca.crt: "{{ _vault_pki_root_raw.stdout }}"
  when: (_vault_pki_root_raw.stdout | default('')) is search('BEGIN CERTIFICATE')

- name: "vault | generate and seed self-generatable application secrets (idempotent - first run only, see vault_seed_if_missing.yml)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  loop: "{{ _vault_generated_secrets | dict2items }}"
  loop_control:
    loop_var: generated_secret
    label: "{{ generated_secret.key }}"
  no_log: true
  vars:
    vault_seed_path: "{{ generated_secret.key }}"
    vault_seed_fields:
      username: "{{ generated_secret.value.username }}"
      password: "{{ generated_secret.value.password }}"
    _vault_generated_secrets:
      keycloak/admin:
        username: admin
        password: "{{ zuno_admin_keycloak_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      # ADR-0595: the permanent master-realm accounts. keycloak/admin above is
      # the bootstrap account only.
      keycloak/console:
        username: zuno-admin
        password: "{{ zuno_admin_keycloak_console_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      keycloak/automation:
        username: zuno-automation
        password: "{{ zuno_admin_keycloak_automation_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      postgresql/app:
        # Lowercase letters/digits only: PGO derives an RFC 1123 Secret name
        # from this, and unquoted PostgreSQL identifiers reject hyphens.
        username: zunoapp
        password: "{{ zuno_admin_postgresql_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      keycloak/postgresql-app:
        # Dedicated database/role, not zunoapp/zuno - keeps Keycloak's own
        # schema/lifecycle isolated from the unrelated app-data database
        # (ADR-0315). Same naming constraint as postgresql/app above.
        username: keycloak
        password: "{{ zuno_admin_keycloak_postgresql_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      maas/postgresql-app:
        # Dedicated database/role for RHOAI's Models-as-a-Service API
        # (maas-api API-key/subscription store - the DataScienceCluster's
        # ModelsAsServiceReady condition requires a maas-db-config Secret in
        # redhat-ods-applications). Letters/digits-only password matters
        # doubly here: it is interpolated un-encoded into the
        # DB_CONNECTION_URL postgresql:// URI by
        # gitops/charts/openshift-ai/templates/externalsecret-maas-db.yaml.
        # Same naming constraint as postgresql/app above.
        username: maas
        password: "{{ zuno_admin_maas_postgresql_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      mlflow/postgresql-app:
        # Dedicated database/role for the MLflow tracking server
        # (ADR-0538/WP-116 - experiment tracking for the MLOps LoRA
        # pipeline). Letters/digits-only password matters for the same
        # reason as maas above: it is interpolated un-encoded into a
        # postgresql:// URI by
        # gitops/charts/mlflow/templates/externalsecret-backend-store.yaml.
        username: mlflow
        password: "{{ zuno_admin_mlflow_postgresql_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      dify/postgresql-app:
        # One role owning Dify's two databases, dify and dify_plugin
        # (ADR-0599/WP-204; WP-203 section 2). Letters/digits-only password:
        # it is interpolated un-encoded into the database URI by the Dify chart's
        # externalsecret. Same naming constraint as postgresql/app above.
        username: dify
        password: "{{ zuno_admin_dify_postgresql_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      kagent/postgresql-app:
        # One role owning kagent's database (ADR-0600/WP-207). Letters/digits-only
        # password: it is interpolated un-encoded into the database URL.
        username: kagent
        password: "{{ zuno_admin_kagent_postgresql_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      ogx/postgresql-app:
        # Dedicated database/role for the OGX-backed RAG provider
        # prototype's remote::pgvector vector I/O provider (ADR-0322 v0.1
        # integration scope) - keeps its schema/lifecycle isolated from
        # every other database on this cluster, same rationale as
        # keycloak/postgresql-app above. Same naming constraint as
        # postgresql/app above.
        username: ogxserver
        password: "{{ zuno_admin_ogx_postgresql_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      aap/admin:
        # AAP's own bootstrap admin password (ADR-0354/WP-072), consumed by
        # the AnsibleAutomationPlatform CR's spec.admin_password_secret.
        username: admin
        password: "{{ zuno_admin_aap_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      aap/postgresql-app:
        # Dedicated database/role for AAP Gateway's own database
        # (ADR-0354/WP-072, ADR-0315 pattern) - see aap-controller/
        # aap-hub/aap-eda below for the other three sub-components. Same
        # naming constraint as postgresql/app above.
        username: aapgateway
        password: "{{ zuno_admin_aap_postgresql_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      aap-controller/postgresql-app:
        # Dedicated database/role for AAP Controller's own database - the
        # unified AnsibleAutomationPlatform CR does NOT take one shared
        # external-database secret for the whole platform (confirmed live,
        # see ansible/roles/aap/README.md). Same naming constraint as
        # postgresql/app above.
        username: aapcontroller
        password: "{{ zuno_admin_aap_controller_postgresql_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      aap-hub/postgresql-app:
        # Dedicated database/role for AAP Hub's own database - see
        # aap-controller/postgresql-app above. Same naming constraint as
        # postgresql/app above.
        username: aaphub
        password: "{{ zuno_admin_aap_hub_postgresql_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      aap-eda/postgresql-app:
        # Dedicated database/role for AAP EDA's own database - see
        # aap-controller/postgresql-app above. Same naming constraint as
        # postgresql/app above.
        username: aapeda
        password: "{{ zuno_admin_aap_eda_postgresql_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      aap-metrics/postgresql-app:
        # Dedicated database/role for AAP 2.7's Automation Metrics service
        # (auto-deployed by the AAP operator; with our unmanaged/external
        # postgres the operator cannot create the database itself) - see
        # aap-controller/postgresql-app above. Same naming constraint as
        # postgresql/app above.
        username: metricsservice
        password: "{{ zuno_admin_aap_metrics_postgresql_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      aap-metrics/postgresql-awx-readonly:
        # Read-only role the Metrics service uses to read the Controller
        # (awx) database directly. The AAP operator's generated default
        # targets a database literally named "automationcontroller"; ours
        # is aap-controller, so gitops/charts/aap overrides the whole
        # connection secret from this path (the SELECT grants themselves
        # are applied by ansible/roles/postgresql's post-rollout SQL).
        # No underscores in the username: it doubles as the PGO
        # spec.users[] name, which becomes part of a Secret name.
        username: msawxreadonly
        password: "{{ zuno_admin_aap_metrics_readonly_postgresql_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"

# WP-190 phase 4: the confidential client of every user experience (UnifAI ADR-0562, Open WebUI ADR-0588, the OpenClaw
# assistants ADR-0589/0590), declared once in gitops/charts/keycloak/values.yaml `experienceClients`. One generated
# client_secret each, read by Keycloak (KC_VAULT) and by the experience (its own ExternalSecret); create-if-missing.
- name: "vault | generate and seed the experience clients' confidential OIDC client secrets (idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  loop: "{{ (lookup('ansible.builtin.file', zuno_repo_root ~ '/gitops/charts/keycloak/values.yaml') | from_yaml).experienceClients | map(attribute='name') | list }}"
  vars:
    vault_seed_path: "keycloak/{{ item }}"
    vault_seed_fields:
      client_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"

# ADR-0320: the "openshift" client backing the cluster OAuth identity
# provider - a single generated client_secret, same shape as unifai above.
- name: "vault | generate and seed the openshift OIDC client secret (idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  vars:
    vault_seed_path: keycloak/openshift-client
    vault_seed_fields:
      client_secret: "{{ zuno_admin_openshift_client_token |
        default(lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits'])) }}"

# ADR-0354/WP-072: the "aap" client backing AAP Gateway's OIDC
# authentication - same single-secret shape as openshift
# above. The AAP-side authenticator wiring itself is deferred to WP-073;
# this seed only makes the Keycloak-side client secret resolvable.
- name: "vault | generate and seed the aap OIDC client secret (idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  vars:
    vault_seed_path: keycloak/aap-client
    vault_seed_fields:
      client_secret: "{{ zuno_admin_aap_client_token |
        default(lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits'])) }}"

# ADR-0530/WP-091: the "zuno-admin-api" client-credentials client. It backed
# agent-bff's GET /api/colleagues and GET /api/groups until WP-156 retired
# the BFF; the client stays (MaaS externalOIDC.clientId and the audience
# mapper of every realm client), so Keycloak still resolves this secret
# through KC_VAULT. Seeded once here: seeding it twice, or letting a consumer
# generate its own, produces a 401 that looks like a permissions problem.
- name: "vault | generate and seed the zuno-admin-api client-credentials secret (idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
