      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/salesforce/technical
      url={{ zuno_salesforce_url | quote }} access_token={{ zuno_salesforce_access_token | quote }}
      enabled={{ (zuno_salesforce_enabled | default(false)) | quote }}"
  when: >-
    zuno_salesforce_url | default('xxxxxx') != 'xxxxxx'
    and zuno_salesforce_access_token | default('xxxxxx') != 'xxxxxx'
  no_log: true

# ADR-0120/WP-058: the git-forge MCP server (components/mcp-servers/
# git-forge) - a real consumer, same as Salesforce above. Fine-grained PAT
# only, no url (github.com only, no self-hosted GitHub Enterprise case in
# this demo). Security considerations (ADR-0120): this token must NOT
# carry the delete_repo scope - delete_repository refuses regardless, but
# the credential itself should never be able to either.
- name: "vault | seed the GitHub technical credentials from ansible/confidential.yml"
  kubernetes.core.k8s_exec:
