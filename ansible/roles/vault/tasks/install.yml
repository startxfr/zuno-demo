---
# Installs Vault via GitOps, then imperatively initializes and unseals it -
# the one component that can't depend on Vault for its own bootstrap secret.
# Operator-supplied secrets come from ansible/confidential.yml (gitignored).
- name: "vault | verify ansible/confidential.yml is present"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/confidential.yml"
  register: _vault_confidential_file

- name: "vault | fail if ansible/confidential.yml is missing"
  ansible.builtin.fail:
    msg: >-
      ansible/confidential.yml is missing. Copy
      ansible/confidential.example.yml to ansible/confidential.yml and fill
      in the values (Google OAuth client, SMTP technical credentials,
      Atlassian Confluence token) before running `make d0 install vault`.
      This role reads it on every run, so the file can be deleted again
      afterwards - unless Vault needs to be reinstalled later.
  when: not _vault_confidential_file.stat.exists

- name: "vault | load ansible/confidential.yml"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/confidential.yml"

- name: "vault | apply the Vault GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "vault"
    gitops_app_phase: "d0"
    # Static name, not zuno_id-derived: matches application-d0.yaml.
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

# Vault has no OLM operator (plain Helm deployment) - all content is -d1.
- name: "vault | apply the Vault GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "vault"
    gitops_app_phase: "d1"
    # Static name matching application-d1.yaml - a zuno_id-derived name
    # would create a second, independent Vault release.
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
    # readinessProbe runs `vault status`, which fails while sealed, so
    # waiting for Healthy here would deadlock a fresh install.
    gitops_app_wait: false

# Label-based, not a hardcoded release name: app.kubernetes.io/name=vault
# is the chart's stable label regardless of release name.
- name: "vault | wait for the Vault StatefulSet to exist"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    namespace: zuno-vault
    label_selectors:
      - "app.kubernetes.io/name=vault"
  register: _vault_sts
  until: (_vault_sts.resources | default([]) | length) > 0
  retries: 30
  delay: 10

- name: "vault | wait for the Vault server pod to be Running (sealed is expected at this point)"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: zuno-vault
    label_selectors:
      - "app.kubernetes.io/name=vault"
      - "component=server"
  register: _vault_pod
  until: >-
    (_vault_pod.resources | default([]) | length) > 0 and
    (_vault_pod.resources[0].status.phase | default('')) == 'Running'
  retries: 60
  delay: 10

- name: "vault | read current seal/init status"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: vault status -format=json
  register: _vault_status_raw
  failed_when: false
  changed_when: false

- name: "vault | parse status (the CLI exits non-zero while sealed; stdout is still valid JSON)"
  ansible.builtin.set_fact:
    _vault_status: "{{ _vault_status_raw.stdout | default('{}') | from_json }}"

- name: "vault | check for an existing bootstrap credentials secret"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: zuno-vault
    name: vault-bootstrap-credentials
  register: _vault_bootstrap_secret

- name: "vault | initialize Vault with a single key share (demo scope; ADR-0112 tracks HA/production hardening for v1)"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: vault operator init -key-shares=1 -key-threshold=1 -format=json
  register: _vault_init_raw
  when:
    - not (_vault_status.initialized | default(false))
    - (_vault_bootstrap_secret.resources | default([]) | length) == 0

- name: "vault | persist the unseal key and root token to the bootstrap secret"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: vault-bootstrap-credentials
        namespace: zuno-vault
      type: Opaque
      stringData:
        unseal_key: "{{ (_vault_init_raw.stdout | from_json).unseal_keys_b64[0] }}"
        root_token: "{{ (_vault_init_raw.stdout | from_json).root_token }}"
  when: _vault_init_raw is defined and _vault_init_raw.stdout is defined
  no_log: true

# Runs the vault-unseal-configure Job (unseal + KV/auth/policy setup) as a Job,
# not k8s_exec, so it can be re-run in-cluster after a pod restart reseals it.
- name: "vault | read bootstrap credentials"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: zuno-vault
    name: vault-bootstrap-credentials
  register: _vault_creds
  no_log: true

- name: "vault | fail if the bootstrap credentials are missing"
  ansible.builtin.fail:
    msg: "vault-bootstrap-credentials not found - the init step above should have created it."
  when: (_vault_creds.resources | default([]) | length) == 0

- name: "vault | set connection facts"
  ansible.builtin.set_fact:
    _vault_root_token: "{{ _vault_creds.resources[0].data.root_token | b64decode }}"
  no_log: true

# Discovered by label, not hardcoded: the chart creates 3 Services sharing
# app.kubernetes.io/name=vault (client, -internal, -ui) - only the plain
# client one is the right VAULT_ADDR target.
- name: "vault | discover the Vault client Service"
  kubernetes.core.k8s_info:
    kind: Service
    namespace: zuno-vault
    label_selectors:
      - "app.kubernetes.io/name=vault"
  register: _vault_services

- name: "vault | select the client Service (excludes the -internal headless and -ui variants)"
  ansible.builtin.set_fact:
    _vault_service_name: >-
      {{
        (_vault_services.resources
         | rejectattr('metadata.labels.vault-internal', 'defined')
         | map(attribute='metadata.name') | list)[0]
      }}

# A dedicated copy, not a direct reference to vault-bootstrap-credentials:
# keeps the Job's dependency self-contained and separately named.
- name: "vault | copy the unseal key/root token into a Secret the Job can mount"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: vault-unseal-configure-credentials
        namespace: zuno-vault
        labels:
          zuno.io/managed-by: zuno-ansible
      type: Opaque
      data:
        unseal_key: "{{ _vault_creds.resources[0].data.unseal_key }}"
        root_token: "{{ _vault_creds.resources[0].data.root_token }}"
  no_log: true

# Resolved early (idempotent, `is not defined` guarded - see
# resolve_cluster_base_domain.yml) so it's available to inject into the
# unseal-configure Job below, which needs it to allow-list
# pki/roles/cert-manager for externally-facing hostnames like
# keycloak.<domain>. Re-resolved/reused again later in this file for the
# zuno/platform/cluster-domain KV write; the guard makes calling it twice
# a no-op the second time.
- name: "vault | resolve the cluster's real apps domain (early, for the unseal-configure Job)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_base_domain.yml"

# The script is static (kustomize/unseal-configure/); only the Job that
# runs it stays inline, since it's deleted and recreated every run.
- name: "vault | apply the unseal/configure script ConfigMap"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/vault/kustomize/unseal-configure"

- name: "vault | delete any previous unseal/configure Job (Jobs are immutable, this task is idempotent-by-recreation)"
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: vault-unseal-configure
    namespace: zuno-vault
    wait: true

- name: "vault | run the unseal/configure Job"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: vault-unseal-configure
        namespace: zuno-vault
        labels:
          zuno.io/managed-by: zuno-ansible
      spec:
        backoffLimit: 2
        template:
          spec:
            restartPolicy: Never
            priorityClassName: zuno-platform-weak
            containers:
              - name: vault-unseal-configure
                image: docker.io/hashicorp/vault:1.17.2
                command:
                  - /bin/sh
                  - /scripts/unseal-and-configure.sh
                env:
                  - name: VAULT_ADDR
                    value: "http://{{ _vault_service_name }}.zuno-vault.svc:8200"
                  - name: CLUSTER_BASE_DOMAIN
                    value: "{{ cluster_base_domain }}"
                  - name: VAULT_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: vault-unseal-configure-credentials
                        key: root_token
                  - name: VAULT_UNSEAL_KEY
                    valueFrom:
                      secretKeyRef:
                        name: vault-unseal-configure-credentials
                        key: unseal_key
                volumeMounts:
                  - name: script
                    mountPath: /scripts
            volumes:
              - name: script
                configMap:
                  name: vault-unseal-configure-script
                  defaultMode: 0755

- name: "vault | wait for the unseal/configure Job to complete"
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    namespace: zuno-vault
    name: vault-unseal-configure
  register: _vault_unseal_configure_job
  until: >-
    (_vault_unseal_configure_job.resources[0].status.succeeded | default(0)) > 0 or
    (_vault_unseal_configure_job.resources[0].status.failed | default(0)) > 0
  retries: 30
  delay: 10

- name: "vault | fetch the unseal/configure Job's pod"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: zuno-vault
    label_selectors:
      - "job-name=vault-unseal-configure"
  register: _vault_unseal_configure_pod

- name: "vault | print the unseal/configure Job's output"
  kubernetes.core.k8s_log:
    namespace: zuno-vault
    name: "{{ _vault_unseal_configure_pod.resources[0].metadata.name }}"
  register: _vault_unseal_configure_log
  when: (_vault_unseal_configure_pod.resources | default([]) | length) > 0

- name: "vault | show the unseal/configure Job's output"
  ansible.builtin.debug:
    msg: "{{ _vault_unseal_configure_log.log_lines | default(['no pod/log found']) }}"

- name: "vault | fail if the unseal/configure Job did not succeed"
  ansible.builtin.fail:
    msg: >-
      vault-unseal-configure Job did not succeed (succeeded=
      {{ _vault_unseal_configure_job.resources[0].status.succeeded | default(0) }}
      failed={{ _vault_unseal_configure_job.resources[0].status.failed | default(0) }}) -
      see the output above.
  when: (_vault_unseal_configure_job.resources[0].status.succeeded | default(0)) == 0

- name: "vault | generate and seed self-generatable application secrets (idempotent - first run only, see vault_seed_if_missing.yml)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  loop: "{{ _vault_generated_secrets | dict2items }}"
  loop_control:
    loop_var: generated_secret
    label: "{{ generated_secret.key }}"
  no_log: true
  vars:
    vault_seed_path: "{{ generated_secret.key }}"
    vault_seed_fields:
      username: "{{ generated_secret.value.username }}"
      password: "{{ generated_secret.value.password }}"
    _vault_generated_secrets:
      keycloak/admin:
        username: admin
        password: "{{ zuno_admin_keycloak_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      postgresql/app:
        # Lowercase letters/digits only: PGO derives an RFC 1123 Secret name
        # from this, and unquoted PostgreSQL identifiers reject hyphens.
        username: zunoapp
        password: "{{ zuno_admin_postgresql_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      keycloak/postgresql-app:
        # Dedicated database/role, not zunoapp/zuno - keeps Keycloak's own
        # schema/lifecycle isolated from the unrelated app-data database
        # (ADR-0315). Same naming constraint as postgresql/app above.
        username: keycloak
        password: "{{ zuno_admin_keycloak_postgresql_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      rag/postgresql-app:
        # Dedicated database/role for the rag-ingestion pipeline's rag-tech
        # corpus/index database - keeps its schema/lifecycle isolated from
        # the unrelated app-data database, same rationale as
        # keycloak/postgresql-app above. Same naming constraint as
        # postgresql/app above.
        username: ragtech
        password: "{{ zuno_admin_rag_postgresql_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      maas/postgresql-app:
        # Dedicated database/role for RHOAI's Models-as-a-Service API
        # (maas-api API-key/subscription store - the DataScienceCluster's
        # ModelsAsServiceReady condition requires a maas-db-config Secret in
        # redhat-ods-applications). Letters/digits-only password matters
        # doubly here: it is interpolated un-encoded into the
        # DB_CONNECTION_URL postgresql:// URI by
        # gitops/charts/openshift-ai/templates/externalsecret-maas-db.yaml.
        # Same naming constraint as postgresql/app above.
        username: maas
        password: "{{ zuno_admin_maas_postgresql_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      agent-runtime/postgresql-app:
        # Dedicated database/role for the Agent Runtime's LangGraph
        # checkpointer (ADR-0103) - resumable workflow state, keeps its
        # schema/lifecycle isolated from every other database on this
        # cluster, same rationale as keycloak/postgresql-app above. Same
        # naming constraint as postgresql/app above.
        username: agentcheckpoints
        password: "{{ zuno_admin_agent_runtime_postgresql_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      ogx/postgresql-app:
        # Dedicated database/role for the OGX-backed RAG provider
        # prototype's remote::pgvector vector I/O provider (ADR-0322 v0.1
        # integration scope) - keeps its schema/lifecycle isolated from
        # every other database on this cluster, same rationale as
        # keycloak/postgresql-app above. Same naming constraint as
        # postgresql/app above.
        username: ogxserver
        password: "{{ zuno_admin_ogx_postgresql_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      rag-sales/postgresql-app:
        # Dedicated database/role per additional logical knowledge domain
        # (ADR-0204, WP-21) - cross-domain isolation is credential-enforced,
        # so each domain gets its own role owning only its own database,
        # never a shared credential. Same rationale and naming constraint
        # as rag/postgresql-app (knowledge.tech's rag-tech) above.
        username: ragsales
        password: "{{ zuno_admin_rag_sales_postgresql_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      rag-sxa-legacy/postgresql-app:
        # knowledge.sxa-legacy's rag-sxa-legacy database - see
        # rag-sales/postgresql-app above.
        username: ragsxalegacy
        password: "{{ zuno_admin_rag_sxa_legacy_postgresql_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      rag-adv/postgresql-app:
        # knowledge.adv's rag-adv database - see rag-sales/postgresql-app
        # above.
        username: ragadv
        password: "{{ zuno_admin_rag_adv_postgresql_root_password |
          default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"

- name: "vault | generate and seed the tekos-frontend confidential OIDC client secret (idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  vars:
    vault_seed_path: keycloak/tekos-frontend
    vault_seed_fields:
      client_secret: "{{ zuno_admin_tekos_frontend_token |
        default(lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits'])) }}"

# ADR-0320: the "openshift" client backing the cluster OAuth identity
# provider - same single-secret shape as tekos-frontend above.
- name: "vault | generate and seed the openshift OIDC client secret (idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  vars:
    vault_seed_path: keycloak/openshift-client
    vault_seed_fields:
      client_secret: "{{ zuno_admin_openshift_client_token |
        default(lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits'])) }}"

- name: "vault | generate and seed the shared demo-persona password (ADR-0041, idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  vars:
    vault_seed_path: keycloak/demo-personas
    vault_seed_fields:
      password: "{{ zuno_admin_demo_personas_root_password |
        default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"

- name: "vault | generate and seed the MCP Gateway workload identity token (ADR-0037, idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  vars:
    vault_seed_path: mcp/gateway-workload-token
    vault_seed_fields:
      token: "{{ zuno_admin_mcp_gateway_token | default(lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits'])) }}"

- name: "vault | generate and seed the Tekos frontend session HMAC secret and encryption key (idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  vars:
    vault_seed_path: tekos/frontend-session
    # ADR-0042: encryption_key is distinct from hmac_secret (signing vs.
    # encryption keys stay separate) - must be 32 raw bytes, base64-encoded,
    # not the printable-ASCII-chars generator every other secret here uses,
    # since components/agent-frontend/internal/session/store.go base64-decodes
    # it directly into an AES-256 key. Both keys must be written in the same
    # `vault kv put` - KV v2 put replaces the whole secret version, so a
    # second put to this path would silently wipe out hmac_secret; the
    # check-first guard in vault_seed_if_missing.yml keeps that a one-shot.
    vault_seed_fields:
      hmac_secret: "{{ zuno_admin_tekos_session_token | default(lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits'])) }}"
      encryption_key: "{{ zuno_admin_tekos_session_encryption_key | default(lookup('ansible.builtin.pipe', 'openssl rand -base64 32')) }}"

- name: "vault | generate and seed the Redis session-store password (idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  vars:
    vault_seed_path: redis/session-store
    vault_seed_fields:
      password: "{{ zuno_admin_redis_session_store_password | default(lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits'])) }}"

- name: "vault | generate and seed the MariaDB root password (idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  vars:
    vault_seed_path: mariadb/root
    vault_seed_fields:
      password: "{{ zuno_admin_mariadb_root_password |
        default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"

# Internal service credential (the rag-ingestion KFP pipeline's "mlpipeline"
# MariaDB user, gitops/charts/rag-ingestion's
# pipelineServer.metadataDatabase.externalMySQL), not a third-party one -
# self-generated same as mariadb/root above, not sourced from
# ansible/confidential.yml. username is static ("mlpipeline") in that
# chart's own values.yaml, so only password needs to live here.
- name: "vault | generate and seed the rag-ingestion pipeline metadata DB password (idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  vars:
    vault_seed_path: rag/pipeline-db
    vault_seed_fields:
      password: "{{ zuno_admin_rag_pipeline_db_password |
        default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"

# These can't be self-generated - real external service credentials,
# supplied via ansible/confidential.yml and re-applied idempotently.
- name: "vault | seed the Google OAuth client from ansible/confidential.yml"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/google-oauth/client
      client_id={{ zuno_google_oauth_client_id | quote }} client_secret={{ zuno_google_oauth_client_secret | quote }}"
  when: >-
    zuno_google_oauth_client_id | default('xxxxxx') != 'xxxxxx'
    and zuno_google_oauth_client_secret | default('xxxxxx') != 'xxxxxx'
  no_log: true

- name: "vault | seed the SMTP technical credentials from ansible/confidential.yml"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/smtp/technical
      host={{ zuno_smtp_host | quote }} port={{ (zuno_smtp_port | default('587')) | quote }}
      username={{ zuno_smtp_username | quote }} password={{ zuno_smtp_password | quote }}"
  when: >-
    zuno_smtp_host | default('xxxxxx') != 'xxxxxx'
    and zuno_smtp_username | default('xxxxxx') != 'xxxxxx'
    and zuno_smtp_password | default('xxxxxx') != 'xxxxxx'
  no_log: true

# url/email are required alongside token: Atlassian Cloud's REST API uses
# email+API-token Basic Auth, not a bearer token alone.
- name: "vault | seed the Confluence technical credentials from ansible/confidential.yml"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/confluence/technical
      url={{ zuno_atlassian_confluence_url | quote }} email={{ zuno_atlassian_confluence_email | quote }}
      token={{ zuno_atlassian_confluence_token | quote }}
      enabled={{ (zuno_atlassian_confluence_enabled | default(false)) | quote }}"
  when: >-
    zuno_atlassian_confluence_url | default('xxxxxx') != 'xxxxxx'
    and zuno_atlassian_confluence_email | default('xxxxxx') != 'xxxxxx'
    and zuno_atlassian_confluence_token | default('xxxxxx') != 'xxxxxx'
  no_log: true

# Stored for future cluster-side use (e.g. an image pull secret) - distinct
# from ADR-0115's build-publish.yml CI consumer, which reads
# QUAY_USERNAME/QUAY_PASSWORD as GitHub Actions repo secrets set directly in
# GitHub, not from Vault/confidential.yml.
- name: "vault | seed the Quay registry credentials from ansible/confidential.yml"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/quay/registry
      username={{ zuno_quay_username | quote }} password={{ zuno_quay_password | quote }}"
  when: >-
    zuno_quay_username | default('xxxxxx') != 'xxxxxx'
    and zuno_quay_password | default('xxxxxx') != 'xxxxxx'
  no_log: true

# No consumer in this repo yet - same "stored ahead of time" status
# Confluence originally had. Same url/email/token/enabled shape as
# confluence/technical above (Jira Cloud uses the same Atlassian
# email+API-token Basic Auth scheme).
- name: "vault | seed the Jira technical credentials from ansible/confidential.yml"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/jira/technical
      url={{ zuno_jira_url | quote }} email={{ zuno_jira_email | quote }}
      token={{ zuno_jira_token | quote }}
      enabled={{ (zuno_jira_enabled | default(false)) | quote }}"
  when: >-
    zuno_jira_url | default('xxxxxx') != 'xxxxxx'
    and zuno_jira_email | default('xxxxxx') != 'xxxxxx'
    and zuno_jira_token | default('xxxxxx') != 'xxxxxx'
  no_log: true

# Only seeded when all five fields are real - no placeholder fallback,
# since the ExternalSecret that reads it only renders under the same
# condition (postgresql role's backups.s3.enabled).
- name: "vault | seed the PostgreSQL backup S3 credentials from ansible/confidential.yml"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/postgresql/backup-s3
      bucket={{ zuno_postgresql_backup_s3_bucket | quote }} endpoint={{ zuno_postgresql_backup_s3_endpoint | quote }}
      region={{ zuno_postgresql_backup_s3_region | quote }} access_key={{ zuno_postgresql_backup_s3_access_key | quote }}
      secret_key={{ zuno_postgresql_backup_s3_secret_key | quote }}"
  when: >-
    zuno_postgresql_backup_s3_bucket | default('xxxxxx') != 'xxxxxx'
    and zuno_postgresql_backup_s3_endpoint | default('xxxxxx') != 'xxxxxx'
    and zuno_postgresql_backup_s3_region | default('xxxxxx') != 'xxxxxx'
    and zuno_postgresql_backup_s3_access_key | default('xxxxxx') != 'xxxxxx'
    and zuno_postgresql_backup_s3_secret_key | default('xxxxxx') != 'xxxxxx'
  no_log: true

# Same "seeded only when real" rule as postgresql/backup-s3 above (mariadb
# role's backups.s3.enabled). Property names are camelCase here
# (accessKeyId/secretAccessKey), matching
# gitops/charts/mariadb/templates/externalsecret-backup-s3.yaml's
# remoteRef.property - unlike postgresql/backup-s3's snake_case above.
- name: "vault | seed the MariaDB backup S3 credentials from ansible/confidential.yml"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/mariadb/s3
      accessKeyId={{ zuno_mariadb_backup_s3_access_key_id | quote }}
      secretAccessKey={{ zuno_mariadb_backup_s3_secret_access_key | quote }}"
  when: >-
    zuno_mariadb_backup_s3_access_key_id | default('xxxxxx') != 'xxxxxx'
    and zuno_mariadb_backup_s3_secret_access_key | default('xxxxxx') != 'xxxxxx'
  no_log: true

# rag-ingestion's corpus S3 bucket (gitops/charts/rag-ingestion's s3: block -
# bucket/region/endpoint are chart config there, not secret). Property names
# (accessKeyId/secretAccessKey) match that chart's
# s3.externalSecret.accessKeyProperty/secretKeyProperty defaults, same
# camelCase convention as mariadb/s3 above.
- name: "vault | seed the RAG corpus S3 credentials from ansible/confidential.yml"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/rag/s3
      accessKeyId={{ zuno_rag_s3_access_key_id | quote }}
      secretAccessKey={{ zuno_rag_s3_secret_access_key | quote }}"
  when: >-
    zuno_rag_s3_access_key_id | default('xxxxxx') != 'xxxxxx'
    and zuno_rag_s3_secret_access_key | default('xxxxxx') != 'xxxxxx'
  no_log: true

- name: "vault | check whether operator-supplied secrets already exist"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv get -format=json zuno/{{ secret_path }}"
  loop:
    - google-oauth/client
    - smtp/technical
    - confluence/technical
    - quay/registry
    - jira/technical
  loop_control:
    loop_var: secret_path
    label: "{{ secret_path }}"
  register: _vault_existing_secrets
  changed_when: false
  failed_when: false
  no_log: true

- name: "vault | seed an empty placeholder only where no secret exists yet (never overwrite operator-supplied values)"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/{{ secret_result.secret_path }} _placeholder=true"
  loop: "{{ _vault_existing_secrets.results }}"
  loop_control:
    loop_var: secret_result
    label: "{{ secret_result.secret_path }}"
  when: secret_result.rc != 0
  no_log: true

- name: "vault | operator action required"
  ansible.builtin.debug:
    msg: >-
      zuno/google-oauth/client, zuno/smtp/technical, zuno/confluence/technical,
      zuno/quay/registry and/or zuno/jira/technical are still placeholders -
      the corresponding value(s) in ansible/confidential.yml are still the
      "xxxxxx" sentinel from confidential.example.yml. Fill them in and
      re-run `make d0 install vault` (this role re-seeds from
      confidential.yml on every run, without overwriting anything already
      populated another way). ADR-0014's real Google OAuth delegation
      depends on the first one - everything else in this file is unattended.

# LLM provider API keys, supplied via ansible/confidential.yml. Kept
# separate from the block above because the placeholder key name differs:
# externalsecret-{openai,gemini,anthropic,mistral}.yaml each resolve
# `api_key`, so both real seed and placeholder must use that same key.
- name: "vault | seed real LLM provider API keys from ansible/confidential.yml"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/providers/{{ provider_key.key }}
      api_key={{ provider_key.value | quote }}"
  loop: "{{ _llm_provider_real_keys | dict2items }}"
  loop_control:
    loop_var: provider_key
    label: "{{ provider_key.key }}"
  when: provider_key.value | default('xxxxxx') != 'xxxxxx'
  no_log: true
  vars:
    _llm_provider_real_keys:
      openai: "{{ zuno_llm_provider_openai_api_key | default('xxxxxx') }}"
      gemini: "{{ zuno_llm_provider_gemini_api_key | default('xxxxxx') }}"
      anthropic: "{{ zuno_llm_provider_anthropic_api_key | default('xxxxxx') }}"
      mistral: "{{ zuno_llm_provider_mistral_api_key | default('xxxxxx') }}"

- name: "vault | check whether LLM provider API keys already exist"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv get -format=json zuno/providers/{{ provider }}"
  loop:
    - openai
    - gemini
    - anthropic
    - mistral
  loop_control:
    loop_var: provider
    label: "{{ provider }}"
  register: _vault_existing_provider_secrets
  changed_when: false
  failed_when: false
  no_log: true

- name: "vault | seed an empty LLM provider placeholder only where no key exists yet"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/providers/{{ provider_result.provider }} api_key=__placeholder__"
  loop: "{{ _vault_existing_provider_secrets.results }}"
  loop_control:
    loop_var: provider_result
    label: "{{ provider_result.provider }}"
  when: provider_result.rc != 0
  no_log: true

- name: "vault | LLM provider operator action required"
  ansible.builtin.debug:
    msg: >-
      zuno/providers/{openai,gemini,anthropic,mistral} are still
      placeholders - the corresponding zuno_llm_provider_<name>_api_key
      value(s) in ansible/confidential.yml are still the "xxxxxx" sentinel
      from confidential.example.yml. Fill them in and re-run
      `make d0 install vault` (this role re-seeds from confidential.yml on
      every run, without overwriting anything already populated another
      way). Until filled in, components/agent-runtime's ModelRouter simply
      fails over past that provider (ADR-0020) - the local model always
      stays eligible.

# Not a secret, but Vault is the single source of truth for runtime config
# too, so consumers without cluster API access can read it via ExternalSecret.
- name: "vault | resolve the cluster's real apps domain"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_base_domain.yml"

- name: "vault | store the cluster's apps domain"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/platform/cluster-domain domain={{ cluster_base_domain }}"
