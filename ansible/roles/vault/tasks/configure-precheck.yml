---
# State detection (never fails). Reuses the same status-parsing approach
# tasks/install.yml already uses (`vault status` exits non-zero while
# sealed, but stdout is still valid JSON) to determine "configured" =
# "unsealed" - the actual signal tasks/configure.yml's unseal/configure
# Job produces. Guarded so a missing pod (not installed yet) is reported
# as NOT configured instead of erroring.
- name: "vault | look up the Vault server Pod"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: zuno-data
    label_selectors:
      - "app.kubernetes.io/name=vault"
      - "component=server"
  register: _vault_pod_lookup

- name: "vault | read current seal status"
  kubernetes.core.k8s_exec:
    namespace: zuno-data
    pod: "{{ _vault_pod_lookup.resources[0].metadata.name }}"
    container: vault
    command: vault status -format=json
  register: _vault_status_raw
  failed_when: false
  changed_when: false
  when: >-
    (_vault_pod_lookup.resources | default([]) | length) > 0
    and (_vault_pod_lookup.resources[0].status.phase | default('')) == 'Running'

- name: "vault | parse status (the CLI exits non-zero while sealed; stdout is still valid JSON)"
  ansible.builtin.set_fact:
    _vault_status: "{{ _vault_status_raw.stdout | default('{}') | from_json }}"
  when: _vault_status_raw is defined and _vault_status_raw.stdout is defined

- name: "vault | compute configure state"
  ansible.builtin.set_fact:
    _state_is_configured: "{{ (_vault_status | default({})).sealed is defined and not (_vault_status | default({})).sealed }}"

- name: "vault | record configure state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_configure_state.yml"
