---
# ADR-0602 clause 1 / WP-223: runs the vault-configure Job
# (kustomize/configure/configure.sh), which logs in as the vault-configure
# ServiceAccount through the vault-configurator Kubernetes auth role - no
# root token, no credentials Secret. Shared by tasks/install.yml and
# ansible/playbooks/vault_migrate_kms_raft.yml.
#
# Inputs: cluster_base_domain (resolved by the caller).

# The two identities Vault's Kubernetes auth roles are bound to. Their
# tokens are the credential: vault-configure is mounted by the Job below,
# ansible-seeder is used by ansible/tasks/vault_login.yml. Neither gets any
# Kubernetes RBAC.
- name: "vault | ensure the vault-configure and ansible-seeder ServiceAccounts exist"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: "{{ _vault_identity_sa }}"
        namespace: zuno-vault
        labels:
          zuno.io/managed-by: zuno-ansible
  loop:
    - vault-configure
    - ansible-seeder
  loop_control:
    loop_var: _vault_identity_sa

- name: "vault | apply the configure script and policy ConfigMap"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/vault/kustomize/configure"

# ADR-0602 clause 2 / WP-223: platform/vault/secret-access.yaml (format and
# rationale in that file) becomes one ns-<namespace>.hcl policy per
# namespace. Absent file = no per-namespace roles and eso-reader kept, so
# this role still works on a branch where the External Secrets side has not
# landed.
- name: "vault | look for platform/vault/secret-access.yaml"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/platform/vault/secret-access.yaml"
  register: _vault_secret_access_file

- name: "vault | load the per-namespace secret access map"
  ansible.builtin.set_fact:
    _vault_secret_access: >-
      {{ ((lookup('ansible.builtin.file', zuno_repo_root ~ '/platform/vault/secret-access.yaml') | from_yaml).namespaces
          | default({}, true))
         if _vault_secret_access_file.stat.exists else {} }}

# A key lands verbatim inside a quoted HCL path; anything outside this
# character set (a quote, a brace, "..") would change the policy's meaning.
- name: "vault | validate every secret-access key before it becomes a policy path"
  ansible.builtin.assert:
    that:
      - _vault_sa_entry.1 is match('^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*(/\*)?$')
      - "'..' not in _vault_sa_entry.1"
      - _vault_sa_entry.0.key is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    fail_msg: >-
      platform/vault/secret-access.yaml: namespace {{ _vault_sa_entry.0.key }} key
      {{ _vault_sa_entry.1 }} is not a plain KV path (letters, digits, . _ - and /,
      optionally ending in /*).
    quiet: true
  loop: "{{ _vault_secret_access | dict2items | subelements('value.keys', skip_missing=True) }}"
  loop_control:
    loop_var: _vault_sa_entry
    label: "{{ _vault_sa_entry.0.key }}: {{ _vault_sa_entry.1 }}"

- name: "vault | render the per-namespace policies ConfigMap"
  kubernetes.core.k8s:
    state: present
    apply: false
    force: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: vault-configure-secret-access
        namespace: zuno-vault
        labels:
          zuno.io/managed-by: zuno-ansible
        annotations:
          zuno.io/source: platform/vault/secret-access.yaml
      data: "{{ _vault_secret_access_policies }}"
  vars:
    _vault_secret_access_policies: >-
      {%- set out = {} -%}
      {%- for ns, spec in _vault_secret_access.items() if (spec['keys'] | default([])) | length > 0 -%}
      {%- set lines = [] -%}
      {%- for key in spec['keys'] -%}
      {%- set _ = lines.append('path "zuno/data/' ~ key ~ '" {\n  capabilities = ["read"]\n}') -%}
      {%- if key.endswith('/*') -%}
      {%- set _ = lines.append('path "zuno/metadata/' ~ key ~ '" {\n  capabilities = ["list", "read"]\n}') -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set _ = out.update({'ns-' ~ ns ~ '.hcl': '# Rendered from platform/vault/secret-access.yaml (ADR-0602 clause 2).\n' ~ (lines | join('\n')) ~ '\n'}) -%}
      {%- endfor -%}
      {{ out }}

# Leftovers of the pre-WP-223 unseal Job: its Secret held a copy of the root
# token and unseal key.
- name: "vault | remove the legacy unseal/configure Job, script and credentials copy"
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ _vault_legacy.api_version }}"
    kind: "{{ _vault_legacy.kind }}"
    name: "{{ _vault_legacy.name }}"
    namespace: zuno-vault
    wait: true
  loop:
    - {api_version: batch/v1, kind: Job, name: vault-unseal-configure}
    - {api_version: v1, kind: ConfigMap, name: vault-unseal-configure-script}
    - {api_version: v1, kind: Secret, name: vault-unseal-configure-credentials}
  loop_control:
    loop_var: _vault_legacy
    label: "{{ _vault_legacy.kind }}/{{ _vault_legacy.name }}"

- name: "vault | delete any previous configure Job (Jobs are immutable, this task is idempotent-by-recreation)"
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: vault-configure
    namespace: zuno-vault
    wait: true

# Review finding (WP-223): the single eso-reader role must outlive the move of
# every ExternalSecret to its per-namespace SecretStore, or each refresh fails
# with "permission denied" in between. Retire it only when no ExternalSecret
# still points at the old ClusterSecretStore; the run that follows the
# external-secrets and application syncs does it.
- name: "vault | list the ExternalSecrets still on the legacy vault-backend store"
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1beta1
    kind: ExternalSecret
  register: _vault_all_external_secrets
  failed_when: false

- name: "vault | decide whether eso-reader can be retired"
  ansible.builtin.set_fact:
    _vault_retire_eso_reader: >-
      {{ ((_vault_secret_access | length) > 0) and (_vault_all_external_secrets is not failed)
         and ((_vault_all_external_secrets.resources | default([])
               | selectattr('spec.secretStoreRef.name', 'equalto', 'vault-backend')
               | list | length) == 0) }}

- name: "vault | say why eso-reader is kept"
  ansible.builtin.debug:
    msg: >-
      eso-reader is kept: {{ _vault_all_external_secrets.resources | default([])
      | selectattr('spec.secretStoreRef.name', 'equalto', 'vault-backend') | list | length }}
      ExternalSecret(s) still use the legacy vault-backend store. Run
      `make d0 install vault` again once external-secrets and the applications have synced.
  when: (_vault_secret_access | length) > 0 and not (_vault_retire_eso_reader | bool)

- name: "vault | run the configure Job"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: vault-configure
        namespace: zuno-vault
        labels:
          zuno.io/managed-by: zuno-ansible
      spec:
        backoffLimit: 2
        template:
          spec:
            restartPolicy: Never
            priorityClassName: zuno-platform-weak
            serviceAccountName: vault-configure
            automountServiceAccountToken: true
            containers:
              - name: vault-configure
                image: docker.io/hashicorp/vault:1.17.2
                command:
                  - /bin/sh
                  - /scripts/configure.sh
                env:
                  # The Service name the service-ca serving cert carries
                  # (gitops/charts/vault values.yaml), verified against the
                  # service CA OpenShift mounts into every pod.
                  - name: VAULT_ADDR
                    value: "https://zuno-vault.zuno-vault.svc:8200"
                  - name: VAULT_CACERT
                    value: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
                  - name: CLUSTER_BASE_DOMAIN
                    value: "{{ cluster_base_domain }}"
                  - name: RETIRE_ESO_READER
                    value: "{{ _vault_retire_eso_reader | bool | string | lower }}"
                  - name: HOME
                    value: /tmp
                volumeMounts:
                  - name: script
                    mountPath: /scripts
                  - name: script
                    mountPath: /policies
                  - name: secret-access
                    mountPath: /secret-access
            volumes:
              - name: script
                configMap:
                  name: vault-configure-script
                  defaultMode: 0755
              - name: secret-access
                configMap:
                  name: vault-configure-secret-access

- name: "vault | wait for the configure Job to complete"
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    namespace: zuno-vault
    name: vault-configure
  register: _vault_configure_job
  until: >-
    (_vault_configure_job.resources[0].status.succeeded | default(0)) > 0 or
    (_vault_configure_job.resources[0].status.failed | default(0)) > 0
  retries: 30
  delay: 10

- name: "vault | fetch the configure Job's pod"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: zuno-vault
    label_selectors:
      - "job-name=vault-configure"
  register: _vault_configure_pod

- name: "vault | print the configure Job's output"
  kubernetes.core.k8s_log:
    namespace: zuno-vault
    name: "{{ _vault_configure_pod.resources[0].metadata.name }}"
  register: _vault_configure_log
  when: (_vault_configure_pod.resources | default([]) | length) > 0

- name: "vault | show the configure Job's output"
  ansible.builtin.debug:
    msg: "{{ _vault_configure_log.log_lines | default(['no pod/log found']) }}"

- name: "vault | fail if the configure Job did not succeed"
  ansible.builtin.fail:
    msg: >-
      vault-configure Job did not succeed (succeeded=
      {{ _vault_configure_job.resources[0].status.succeeded | default(0) }}
      failed={{ _vault_configure_job.resources[0].status.failed | default(0) }}) -
      see the output above. "permission denied" on the login means the
      vault-configurator role does not exist yet: on a Vault initialized
      before WP-223, run ansible/playbooks/vault_migrate_kms_raft.yml.
  when: (_vault_configure_job.resources[0].status.succeeded | default(0)) == 0
