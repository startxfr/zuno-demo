---
# Reverse of install.yml: removes -d1 (real content) then -d0 (no-op), then
# destroys the PVC-backed Vault data and vault-bootstrap-credentials -
# unlike every other role's uninstall in this repo, this one is a genuine,
# irreversible wipe (2026-08-26 decision, reversing this role's prior
# "never clean up data" stance). Vault's storage backend is `file`
# (gitops/charts/vault/values.yaml's standalone.config), so deleting this
# one PVC destroys every secret the whole platform seeds via `vault kv
# put` - not just the Transit signing key - with no undo short of
# reinstalling every component that seeds Vault. Deleting the PVC is also
# what makes "the Transit key is removed from vault" a real event (no
# separate `vault delete transit/keys/...` call needed - the whole
# file-backed store is gone).
- name: "vault | delete the vault ArgoCD Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-vault-d1"

- name: "vault | delete the vault ArgoCD Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-vault-d0"

- name: "vault | delete the PVC-backed Vault data (destroys every secret the platform seeded, not just the Transit key)"
  kubernetes.core.k8s:
    state: absent
    kind: PersistentVolumeClaim
    namespace: zuno-vault
    name: data-zuno-vault-0

- name: "vault | delete the bootstrap credentials Secret (root token + unseal key)"
  kubernetes.core.k8s:
    state: absent
    kind: Secret
    namespace: zuno-vault
    name: vault-bootstrap-credentials

- name: "vault | check whether the committed trust anchor exists"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/agents/zuno-platform-signer.pub"
  register: _vault_pubkey_file_stat

- name: "vault | remove the trust anchor and commit the deletion (pathspec-limited - never touches any other pending change in the working tree, local commit only, no push)"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      git rm -f -- agents/zuno-platform-signer.pub &&
      git commit -m "vault: remove zuno-platform-signer.pub (vault uninstalled)" -- agents/zuno-platform-signer.pub
    chdir: "{{ zuno_repo_root }}"
  when: _vault_pubkey_file_stat.stat.exists
