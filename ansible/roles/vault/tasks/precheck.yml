---
# State detection (never fails). Does NOT use the zuno-vault Application's
# own Synced/Healthy status: the chart's readinessProbe runs `vault
# status`, which is non-zero while sealed, so the Application is
# structurally never Healthy (see tasks/install.yml's gitops_app_wait:
# false). "Installed" instead means the bootstrap credentials exist, the
# server pod is Running, AND Vault is unsealed - reusing the same
# status-parsing approach tasks/install.yml itself uses (`vault status`
# exits non-zero while sealed, but stdout is still valid JSON). Guarded so
# a missing pod (not installed yet) is reported as NOT installed instead
# of erroring.
- name: "vault | look up the bootstrap credentials Secret"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: zuno-vault
    name: vault-bootstrap-credentials
  register: _vault_bootstrap_secret_lookup

- name: "vault | look up the Vault server StatefulSet"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    namespace: zuno-vault
    label_selectors:
      - "app.kubernetes.io/name=vault"
  register: _vault_sts_lookup

- name: "vault | look up the Vault server Pod"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: zuno-vault
    label_selectors:
      - "app.kubernetes.io/name=vault"
      - "component=server"
  register: _vault_pod_lookup

- name: "vault | read current seal status"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod_lookup.resources[0].metadata.name }}"
    container: vault
    command: vault status -format=json
  register: _vault_status_raw
  failed_when: false
  changed_when: false
  when: >-
    (_vault_pod_lookup.resources | default([]) | length) > 0
    and (_vault_pod_lookup.resources[0].status.phase | default('')) == 'Running'

- name: "vault | parse status (the CLI exits non-zero while sealed; stdout is still valid JSON)"
  ansible.builtin.set_fact:
    _vault_status: "{{ _vault_status_raw.stdout | default('{}') | from_json }}"
  when: _vault_status_raw is defined and _vault_status_raw.stdout is defined

- name: "vault | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        (_vault_bootstrap_secret_lookup.resources | default([]) | length) > 0
        and (_vault_sts_lookup.resources | default([]) | length) > 0
        and (_vault_pod_lookup.resources | default([]) | length) > 0
        and (_vault_pod_lookup.resources[0].status.phase | default('')) == 'Running'
        and (_vault_status | default({})).sealed is defined
        and not (_vault_status | default({})).sealed
      }}

- name: "vault | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
