apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-unseal-configure-script
  namespace: zuno-data
  labels:
    zuno.io/managed-by: zuno-ansible
data:
  unseal-and-configure.sh: |
    #!/bin/sh
    # Unseals Vault (safe to call even if already unsealed - the endpoint
    # just reports the current state back), then enables the KV v2 engine
    # and the eso-reader policy/role every ExternalSecret in the platform
    # resolves through. Idempotent and safe to re-run any time (e.g. after
    # a Vault pod restart reseals it), independent of ansible.
    set -eu

    echo "Unsealing Vault..."
    vault operator unseal "$VAULT_UNSEAL_KEY" >/dev/null
    echo "Vault is unsealed."

    enable_if_new() {
      label="$1"; shift
      if err="$("$@" 2>&1 >/dev/null)"; then
        echo "$label: enabled"
      else
        case "$err" in
          *"path is already in use"*) echo "$label: already enabled" ;;
          *) echo "$err" >&2; exit 1 ;;
        esac
      fi
    }

    enable_if_new "KV v2 secrets engine at secret/" vault secrets enable -path=secret -version=2 kv
    enable_if_new "Kubernetes auth method" vault auth enable kubernetes

    vault write auth/kubernetes/config kubernetes_host=https://kubernetes.default.svc:443

    printf 'path "secret/data/zuno/*" {\n  capabilities = ["read"]\n}\n' | vault policy write eso-reader -

    vault write auth/kubernetes/role/eso-reader \
      bound_service_account_names=external-secrets \
      bound_service_account_namespaces=external-secrets \
      policies=eso-reader \
      ttl=1h

    echo "KV store and default policies configured."
