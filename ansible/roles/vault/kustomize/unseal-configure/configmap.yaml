apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-unseal-configure-script
  namespace: zuno-vault
  labels:
    zuno.io/managed-by: zuno-ansible
data:
  unseal-and-configure.sh: |
    #!/bin/sh
    # Unseals Vault (safe to call even if already unsealed - the endpoint
    # just reports the current state back), then enables the KV v2 engine
    # and the eso-reader policy/role every ExternalSecret in the platform
    # resolves through. Idempotent and safe to re-run any time (e.g. after
    # a Vault pod restart reseals it), independent of ansible.
    set -eu

    echo "Unsealing Vault..."
    vault operator unseal "$VAULT_UNSEAL_KEY" >/dev/null
    echo "Vault is unsealed."

    enable_if_new() {
      label="$1"; shift
      if err="$("$@" 2>&1 >/dev/null)"; then
        echo "$label: enabled"
      else
        case "$err" in
          *"path is already in use"*) echo "$label: already enabled" ;;
          *) echo "$err" >&2; exit 1 ;;
        esac
      fi
    }

    enable_if_new "KV v2 secrets engine at secret/" vault secrets enable -path=secret -version=2 kv
    enable_if_new "Kubernetes auth method" vault auth enable kubernetes

    vault write auth/kubernetes/config kubernetes_host=https://kubernetes.default.svc:443

    printf 'path "secret/data/zuno/*" {\n  capabilities = ["read"]\n}\n' | vault policy write eso-reader -

    vault write auth/kubernetes/role/eso-reader \
      bound_service_account_names=external-secrets \
      bound_service_account_namespaces=zuno-vault \
      policies=eso-reader \
      ttl=1h

    echo "KV store and default policies configured."

    # ansible/roles/cert_manager: the pki/ engine + cert-manager-issuer
    # role/policy this prepares are consumed by that role's ClusterIssuer
    # (gitops/charts/cert-manager/templates/clusterissuer.yaml) - cert_manager
    # itself never writes to Vault, it only points a declarative
    # ClusterIssuer at this already-configured backend, same as
    # external-secrets' ClusterSecretStore above.
    enable_if_new "PKI secrets engine at pki/" vault secrets enable -path=pki pki
    vault secrets tune -max-lease-ttl=87600h pki

    if ! vault read pki/cert/ca >/dev/null 2>&1; then
      vault write -field=certificate pki/root/generate/internal \
        common_name="zuno-demo.internal" ttl=87600h >/dev/null
      echo "PKI root CA: generated"
    else
      echo "PKI root CA: already generated"
    fi

    vault write pki/config/urls \
      issuing_certificates="$VAULT_ADDR/v1/pki/ca" \
      crl_distribution_points="$VAULT_ADDR/v1/pki/crl"

    vault write pki/roles/cert-manager \
      allowed_domains="zuno-demo.internal,svc.cluster.local" \
      allow_subdomains=true \
      allow_bare_domains=true \
      max_ttl=720h

    printf 'path "pki/sign/cert-manager" {\n  capabilities = ["create","update"]\n}\n' | vault policy write cert-manager-issuer -

    vault write auth/kubernetes/role/cert-manager-issuer \
      bound_service_account_names=cert-manager \
      bound_service_account_namespaces=cert-manager \
      policies=cert-manager-issuer \
      ttl=1h

    echo "PKI engine and cert-manager-issuer role configured."
