---
# Reuses install.yml's readiness signal: the zuno-ai-run SecretStore `vault`
# Ready implies the operator/operand are installed and Vault accepts the
# per-namespace roles (ADR-0602/WP-223). zuno-ai-run is the one namespace
# every install has a store in.
- name: "external_secrets | look up the zuno-ai-run SecretStore"
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1beta1
    kind: SecretStore
    namespace: zuno-ai-run
    name: vault
  register: _eso_store_lookup

- name: "external_secrets | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        (_eso_store_lookup.resources | default([]) | length) > 0 and
        (_eso_store_lookup.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | list | first | default('False')) == 'True'
      }}

- name: "external_secrets | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
