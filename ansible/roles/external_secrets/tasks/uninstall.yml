---
# Reverse of install.yml + configure.yml. Namespaces (external-secrets,
# the shared openshift-operators and zuno-ai-run) are left in place.
- name: "external_secrets | delete the cluster-domain ExternalSecret"
  kubernetes.core.k8s:
    state: absent
    api_version: external-secrets.io/v1beta1
    kind: ExternalSecret
    name: zuno-cluster-domain
    namespace: zuno-ai-run

- name: "external_secrets | delete the vault-backend ClusterSecretStore"
  kubernetes.core.k8s:
    state: absent
    api_version: external-secrets.io/v1beta1
    kind: ClusterSecretStore
    name: vault-backend

- name: "external_secrets | remove the operator (its owned CRDs, then the CSV, then the Subscription)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/remove_operator.yml"
  vars:
    operator_subscription_name: external-secrets-operator
    operator_namespace: openshift-operators
