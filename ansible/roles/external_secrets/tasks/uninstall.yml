---
# Order matters: delete d1 (SecretStores/ExternalSecret) first to
# avoid ArgoCD fighting the CRD deletion, then remove the operator while
# the Subscription (a d0-managed resource) still exists to read its
# installedCSV, then delete d0.
#
# ADR-0352 clause 4 (WP-216): in external mode the operator is not ours, so
# uninstall removes only what this installer created, the -d1 operand config,
# and never touches the operator, its CSV or its Subscription.
- name: "external_secrets | resolve the component mode (ADR-0352)"
  ansible.builtin.include_tasks: mode.yml

- name: "external_secrets | delete the external-secrets GitOps Application (d1: SecretStores/ExternalSecret)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-external-secrets-d1"

- name: "external_secrets | leave the unmanaged operator in place (external mode)"
  ansible.builtin.debug:
    msg: >-
      zuno_external_secrets_mode is 'external' - the External Secrets Operator is
      installed outside this installer and is left untouched; only the -d1 operand
      config was removed. Flipping back to internal is a migration event (ADR-0352
      clause 4).
  when: _eso_mode == 'external'

- name: "external_secrets | remove the operator (its owned CRDs - cascading the OperatorConfig/SecretStore/ExternalSecret - then the CSV, then the Subscription)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/remove_operator.yml"
  when: _eso_mode == 'internal'
  vars:
    operator_subscription_name: external-secrets-operator
    operator_namespace: openshift-operators

- name: "external_secrets | delete the external-secrets GitOps Application (d0: cascades the remaining Namespaces)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  when: _eso_mode == 'internal'
  vars:
    gitops_app_name: "zuno-external-secrets-d0"
