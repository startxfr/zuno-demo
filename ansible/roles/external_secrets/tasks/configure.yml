---
    # Discovered, not hardcoded "vault.zuno-data.svc" - same reasoning as
    # ansible/roles/vault/tasks/configure.yml's own "discover the Vault
    # client Service" task (the Helm release name isn't a repository-wide
    # constant, and the chart creates three Services sharing
    # app.kubernetes.io/name=vault). Re-discovered here rather than reused
    # from that role's fact because relying on a fact set by a different
    # role's task file surviving across the day0_configure.yml role loop is
    # fragile; found and fixed a real bug via live-cluster testing on
    # api.demo222.startx.fr, where the static "vault.zuno-data.svc" hostname
    # this used to hardcode doesn't exist (the actual Service is
    # "zuno-vault"), so vault-backend's ClusterSecretStore never became
    # Ready ("dial tcp: lookup vault.zuno-data.svc ...: no such host").
- name: "external_secrets | discover the Vault client Service"
  kubernetes.core.k8s_info:
    kind: Service
    namespace: zuno-data
    label_selectors:
      - "app.kubernetes.io/name=vault"
  register: _eso_vault_services

- name: "external_secrets | select the client Service (excludes the -internal headless and -ui variants)"
  ansible.builtin.set_fact:
    _eso_vault_service_name: >-
      {{
        (_eso_vault_services.resources
         | rejectattr('metadata.labels.vault-internal', 'defined')
         | map(attribute='metadata.name') | list)[0]
      }}

# ADR-0310: ansible/roles/external_secrets/kustomize/store/. A separate
# group from runtime/ below - the wait for Valid immediately after this
# must observe the ClusterSecretStore before the Namespace/ExternalSecret
# that reference it are applied.
- name: "external_secrets | register the Vault-backed ClusterSecretStore"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/external_secrets/kustomize/store"
    kustomize_replacements:
      __VAULT_SERVICE_NAME__: "{{ _eso_vault_service_name }}"

- name: "external_secrets | wait for the ClusterSecretStore to report Valid"
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1beta1
    kind: ClusterSecretStore
    name: vault-backend
  register: _eso_store
  until: >-
    (_eso_store.resources | default([]) | length) > 0 and
    (_eso_store.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | list | first | default('False')) == 'True'
  retries: 30
  delay: 10

# ADR-0310: ansible/roles/external_secrets/kustomize/runtime/. The cluster's
# apps domain (secret/zuno/platform/cluster-domain, written by
# ansible/roles/vault/tasks/configure.yml) baked into K8s manifest spec
# fields - a Route's spec.host, the Keycloak CR's spec.hostname.hostname,
# the realm's client redirect URIs - cannot come from a Secret; those are
# resolved at Ansible/Helm-apply time via
# ansible/tasks/apply_gitops_app.yml's apps.mycluster.example.com substitution
# instead, no live sync mechanism supports templating a CR spec field. This
# ExternalSecret is for any current-or-future service that wants the same
# value as a genuine *runtime* env var/file, refreshed on `refreshInterval`
# without a redeploy - not yet consumed by any service in this build.
- name: "external_secrets | apply the zuno-ai-run namespace and the cluster-domain ExternalSecret"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/external_secrets/kustomize/runtime"
