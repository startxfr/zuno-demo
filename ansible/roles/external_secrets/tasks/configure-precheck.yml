---
# State detection (never fails). Reuses tasks/configure.yml's own
# readiness signal: the vault-backend ClusterSecretStore reporting Ready
# - only rendered once configure.yml's second apply_gitops_app.yml call
# has supplied vaultServiceName (see gitops/charts/external-secrets/
# values.yaml), so this also implicitly proves the operator/operand are
# installed too.
- name: "external_secrets | look up the vault-backend ClusterSecretStore"
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1beta1
    kind: ClusterSecretStore
    name: vault-backend
  register: _eso_store_lookup

- name: "external_secrets | compute configure state"
  ansible.builtin.set_fact:
    _state_is_configured: >-
      {{
        (_eso_store_lookup.resources | default([]) | length) > 0 and
        (_eso_store_lookup.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | list | first | default('False')) == 'True'
      }}

- name: "external_secrets | record configure state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_configure_state.yml"
