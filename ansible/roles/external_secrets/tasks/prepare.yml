---
- name: "external_secrets | ensure the external-secrets namespace exists"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: external-secrets
        labels:
          zuno.io/managed-by: ansible

- name: "external_secrets | ensure the openshift-operators namespace exists"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: openshift-operators

- name: "external_secrets | subscribe to the External Secrets Operator"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: external-secrets-operator
        namespace: openshift-operators
        labels:
          zuno.io/managed-by: ansible
      spec:
        channel: stable
        name: external-secrets-operator
        source: redhat-operators
        sourceNamespace: openshift-marketplace
        installPlanApproval: Automatic

- name: "external_secrets | wait for the ExternalSecret CRD to be established"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: externalsecrets.external-secrets.io
  register: _eso_crd
  until: (_eso_crd.resources | default([]) | length) > 0
  retries: 30
  delay: 10

- name: "external_secrets | wait for the operator deployment to be ready"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: external-secrets
    name: external-secrets
  register: _eso_deploy
  until: >-
    (_eso_deploy.resources | default([]) | length) > 0 and
    (_eso_deploy.resources[0].status.readyReplicas | default(0)) > 0
  retries: 60
  delay: 10
