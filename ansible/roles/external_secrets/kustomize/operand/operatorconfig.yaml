apiVersion: operator.external-secrets.io/v1alpha1
kind: OperatorConfig
metadata:
  name: cluster
  namespace: external-secrets
  labels:
    zuno.io/managed-by: zuno-ansible
spec:
  # The external-secrets-operator package installs a helm-operator meta-
  # operator (openshift-operators/external-secrets-operator-controller-
  # manager) that only watches OperatorConfig - it does not deploy the
  # actual ESO controller/webhook/cert-controller (and their ServiceAccounts,
  # including the "external-secrets" one
  # ansible/roles/external_secrets/kustomize/store/clustersecretstore.yaml
  # references) until an OperatorConfig CR exists to reconcile. Found via
  # live-cluster testing on api.demo222.startx.fr: without this CR, the
  # meta-operator's own Deployment reports Ready while the operand never
  # appears, so vault-backend's ClusterSecretStore spins through its full
  # "wait for Valid" retry budget referencing a ServiceAccount that was
  # never created.
  fullnameOverride: external-secrets
  # The operator's own CSV already installs the CRDs (ADR-0056's day0
  # install already waits on them being Established); asking the operand
  # Helm release to install them a second time is redundant at best.
  installCRDs: false
  webhook:
    create: true
  certController:
    create: true
