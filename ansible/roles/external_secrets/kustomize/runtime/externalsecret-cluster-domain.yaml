apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zuno-cluster-domain
  namespace: zuno-ai-run
  labels:
    zuno.io/managed-by: zuno-ansible
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: zuno-cluster-domain
    creationPolicy: Owner
  data:
    - secretKey: domain
      remoteRef:
        key: zuno/platform/cluster-domain
        property: domain
