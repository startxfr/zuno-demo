---
# State detection (never fails).
- name: "openshift_rbac_groups | check the openshift-rbac-groups Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-openshift-rbac-groups-d0"

- name: "openshift_rbac_groups | save the d0 check result"
  ansible.builtin.set_fact:
    _openshift_rbac_groups_d0_installed: "{{ _state_check_result }}"

- name: "openshift_rbac_groups | check the openshift-rbac-groups Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-openshift-rbac-groups-d1"

- name: "openshift_rbac_groups | look up the admin ClusterRoleBinding"
  kubernetes.core.k8s_info:
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    # Stale name, found live 2026-08-25 (first day0_check run through the
    # AAP zuno-day0-check Job Template, WP-073): the chart
    # (gitops/charts/openshift-rbac-groups/templates/clusterrolebinding.yaml)
    # names this "zuno-ocp-paas-ops-cluster-admin", not
    # "zuno-admin-cluster-admin" - the ADR-0349 persona/group restructure
    # renamed the binding without updating this precheck, so `make d0
    # check openshift-rbac-groups` has reported a false "NOT installed"
    # ever since, on every cluster.
    name: zuno-ocp-paas-ops-cluster-admin
  register: _openshift_rbac_groups_crb_lookup

- name: "openshift_rbac_groups | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        _openshift_rbac_groups_d0_installed
        and _state_check_result
        and (_openshift_rbac_groups_crb_lookup.resources | default([]) | length) > 0
      }}

- name: "openshift_rbac_groups | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
