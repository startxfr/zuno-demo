---
# Reverse of install.yml.
- name: "openshift_rbac_groups | delete the openshift-rbac-groups GitOps Application (d1: RoleBindings)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-openshift-rbac-groups-d1"

- name: "openshift_rbac_groups | delete the openshift-rbac-groups GitOps Application (d0: ClusterRoleBinding)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-openshift-rbac-groups-d0"
