---
# Day 1 "mcp" build component (ADR-0056): builds both images the MCP
# surface needs - the gateway itself and the one MCP tool server this
# repo owns end to end (sales-db). Confluence/Drive/Gmail/web-search
# handlers run inside the mcp-gateway image itself (components/mcp-gateway/
# app/handlers/), not as separate images.
- name: "mcp_build | build mcp-gateway"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_openshift_build.yml"
  vars:
    build_image_name: mcp-gateway
    build_dockerfile_path: components/mcp-gateway/Dockerfile
    build_context_dir: "."

- name: "mcp_build | build mcp-sales-db"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_openshift_build.yml"
  vars:
    build_image_name: mcp-sales-db
    build_dockerfile_path: Dockerfile
    build_context_dir: components/mcp-servers/sales-db
