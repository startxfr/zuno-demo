---
# Builds all four MCP images: the gateway, the sales-db tool server, the
# confluence tool server (ADR-0117), and the salesforce tool server
# (ADR-0326/WP-33). Drive/Gmail/web-search handlers still live inside
# mcp-gateway itself, not as separate images.
- name: "mcp_build | build mcp-gateway"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_openshift_build.yml"
  vars:
    build_image_name: mcp-gateway
    build_dockerfile_path: components/mcp-gateway/Dockerfile
    build_context_dir: "."

- name: "mcp_build | build mcp-sales-db"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_openshift_build.yml"
  vars:
    build_image_name: mcp-sales-db
    build_dockerfile_path: Dockerfile
    build_context_dir: components/mcp-servers/sales-db

- name: "mcp_build | build mcp-confluence"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_openshift_build.yml"
  vars:
    build_image_name: mcp-confluence
    build_dockerfile_path: Dockerfile
    build_context_dir: components/mcp-servers/confluence

- name: "mcp_build | build mcp-salesforce"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_openshift_build.yml"
  vars:
    build_image_name: mcp-salesforce
    build_dockerfile_path: Dockerfile
    build_context_dir: components/mcp-servers/salesforce
