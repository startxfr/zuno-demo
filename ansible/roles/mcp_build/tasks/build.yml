---
# Builds mcp-gateway, plus every real MCP server under
# components/mcp-servers/<name>/Dockerfile (sales-db, confluence -
# ADR-0117, salesforce - ADR-0326/WP-33, and any later one - ADR-0119/
# WP-057). Drive/Gmail/web-search handlers still live inside mcp-gateway
# itself, not as separate images.
- name: "mcp_build | build mcp-gateway"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_openshift_build.yml"
  vars:
    build_image_name: mcp-gateway
    build_dockerfile_path: components/mcp-gateway/Dockerfile
    build_context_dir: "."

# ADR-0119 (WP-057): discovered, not hand-listed one block per server -
# same reasoning as .github/workflows/build-publish.yml's
# discover-mcp-servers job (every MCP server shares the same Dockerfile/
# context shape).
- name: "mcp_build | discover components/mcp-servers/*/Dockerfile"
  ansible.builtin.find:
    paths: "{{ zuno_repo_root }}/components/mcp-servers"
    patterns: "Dockerfile"
    recurse: true
    depth: 2
  register: _mcp_server_dockerfiles

- name: "mcp_build | build each discovered MCP server"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_openshift_build.yml"
  vars:
    _mcp_server_name: "{{ item.path | dirname | basename }}"
    build_image_name: "mcp-{{ _mcp_server_name }}"
    build_dockerfile_path: Dockerfile
    build_context_dir: "components/mcp-servers/{{ _mcp_server_name }}"
  loop: "{{ _mcp_server_dockerfiles.files }}"
  loop_control:
    label: "{{ item.path | dirname | basename }}"
