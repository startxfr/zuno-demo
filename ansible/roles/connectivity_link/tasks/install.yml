---
# Must be ready before openshift_ai (or rather, alongside its other
# prerequisites) - ADR-0317 installs this operator ahead of any actual
# Gateway/policy consumer.

# Catalog source/channel naming isn't verified against a live cluster
# (ADR-0317's Operational considerations); discover both from the
# PackageManifest rather than hardcoding, same pattern as
# ansible/roles/external_secrets/tasks/install.yml.
- name: "connectivity_link | look up the {{ connectivity_link_package_name | default('rhcl-operator') }} PackageManifest"
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    namespace: openshift-marketplace
    name: "{{ connectivity_link_package_name | default('rhcl-operator') }}"
  register: _connectivity_link_pkg_info

- name: "connectivity_link | fail if the package isn't published anywhere on this cluster"
  ansible.builtin.fail:
    msg: >-
      No PackageManifest named '{{ connectivity_link_package_name | default('rhcl-operator') }}'
      was found in openshift-marketplace. Check `oc get packagemanifest -n
      openshift-marketplace | grep -i connectivity` (or `-i kuadrant`/`-i
      rhcl`) for the correct package name on this cluster, then re-run with
      `-e connectivity_link_package_name=<name>` or update this role's
      default (ADR-0317 - the name checked in is an unverified placeholder).
  when: (_connectivity_link_pkg_info.resources | default([]) | length) == 0

- name: "connectivity_link | select the catalog/channel to subscribe from"
  ansible.builtin.set_fact:
    _connectivity_link_catalog_source: "{{ _connectivity_link_pkg_info.resources[0].status.catalogSource }}"
    _connectivity_link_channel: >-
      {{
        'stable'
        if (_connectivity_link_pkg_info.resources[0].status.channels | selectattr('name', 'equalto', 'stable') | list | length) > 0
        else (_connectivity_link_pkg_info.resources[0].status.defaultChannel | default(''))
      }}

- name: "connectivity_link | fail if no usable channel was found"
  ansible.builtin.fail:
    msg: >-
      Package '{{ connectivity_link_package_name | default('rhcl-operator') }}'
      (catalog '{{ _connectivity_link_catalog_source }}') has no "stable"
      channel and no defaultChannel to fall back to. Published channels:
      {{ _connectivity_link_pkg_info.resources[0].status.channels | map(attribute='name') | list }}.
  when: _connectivity_link_channel | length == 0

- name: "connectivity_link | discovery summary"
  ansible.builtin.debug:
    msg: >-
      Subscribing to package '{{ connectivity_link_package_name | default('rhcl-operator') }}',
      catalog '{{ _connectivity_link_catalog_source }}', channel
      '{{ _connectivity_link_channel }}'.

- name: "connectivity_link | apply the connectivity-link GitOps Application (d0: operator)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "connectivity-link"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-connectivity-link-d0"
    gitops_app_extra_helm_values:
      operator:
        enabled: true
        subscription:
          operator:
            channel: "{{ _connectivity_link_channel }}"
            source:
              name: "{{ _connectivity_link_catalog_source }}"
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 15

- name: "connectivity_link | apply the connectivity-link GitOps Application (d1: Kuadrant instance)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "connectivity-link"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-connectivity-link-d1"
    gitops_app_extra_helm_values:
      project:
        enabled: true
      kuadrant:
        enabled: true
        authorinoTls:
          enabled: true
    gitops_app_wait_retries: 30
    gitops_app_wait_delay: 15

# WP-071: Authorino's gRPC listener TLS certificate must chain to
# OpenShift's Service CA, not any cert-manager ClusterIssuer - RHCL's
# generated Envoy `kuadrant-auth-service` cluster only trusts
# service-ca.crt (see docs/roadmap/work-packages/
# wp-071-authorino-service-ca-trust-alignment.md for the live diagnostic
# evidence). Neither the Authorino nor Kuadrant CRD exposes a field to
# request this annotation through the operand CR (confirmed: `oc explain
# authorino.spec`/`kuadrant.spec` have no service/serviceTemplate stanza),
# so - same shape as ansible/roles/mariadb/tasks/install.yml's
# appProtocol patch on the operator-owned mariadb Service - this patches
# the annotation on after the authorino-operator creates the Service.
# The secret name here MUST match gitops/charts/connectivity-link/
# values.yaml's kuadrant.authorinoTls.certSecretName (kept in sync
# manually, same convention as that chart's operandNamespace comment).
# Idempotent; re-run after any authorino-operator upgrade that recreates
# the Service.
- name: "connectivity_link | wait for the authorino-authorino-authorization Service (WP-071)"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    namespace: kuadrant-system
    name: authorino-authorino-authorization
  register: _connectivity_link_authorino_svc
  until: (_connectivity_link_authorino_svc.resources | default([]) | length) > 0
  retries: 30
  delay: 10

# Two branches, not one k8s_json_patch call: `op: add` on
# /metadata/annotations/<key> requires the parent annotations map to
# already exist as an object - Kubernetes omits empty maps entirely, so if
# the authorino-operator ever creates this Service with zero annotations,
# a single "add the leaf key" patch fails with a path-not-found error.
# The first branch initializes the whole (single-key) map when absent; the
# second safely adds/overwrites just this one key, preserving any other
# annotations, when the map already exists. (Live-tested 2026-08-24: this
# Service currently has zero annotations, so the first branch is the one
# that actually runs today - both are kept for correctness across
# operator upgrades.)
- name: "connectivity_link | annotate Authorino Service for OpenShift Service CA (create annotations map)"
  kubernetes.core.k8s_json_patch:
    api_version: v1
    kind: Service
    namespace: kuadrant-system
    name: authorino-authorino-authorization
    patch:
      - op: add
        path: /metadata/annotations
        value:
          service.beta.openshift.io/serving-cert-secret-name: authorino-server-cert
  when: (_connectivity_link_authorino_svc.resources[0].metadata.annotations | default({}) | length) == 0

- name: "connectivity_link | annotate Authorino Service for OpenShift Service CA (existing annotations map)"
  kubernetes.core.k8s_json_patch:
    api_version: v1
    kind: Service
    namespace: kuadrant-system
    name: authorino-authorino-authorization
    patch:
      - op: add
        path: /metadata/annotations/service.beta.openshift.io~1serving-cert-secret-name
        value: authorino-server-cert
  when: (_connectivity_link_authorino_svc.resources[0].metadata.annotations | default({}) | length) > 0

# Diagnostic wait, not a hard install gate: if the Service CA Operator is
# slow or the annotation didn't stick, the Day-1 precheck below surfaces
# it as a genuine regression on the next `make day1 check
# connectivity-link` run rather than failing install here.
- name: "connectivity_link | wait for the Service-CA-generated authorino-server-cert Secret (WP-071)"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: kuadrant-system
    name: authorino-server-cert
  register: _connectivity_link_authorino_cert_secret
  until: (_connectivity_link_authorino_cert_secret.resources | default([]) | length) > 0
  retries: 12
  delay: 5
  failed_when: false
