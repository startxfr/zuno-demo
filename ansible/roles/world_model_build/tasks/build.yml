---
# ADR-0604 (WP-231) "world-model" build component: the GPU runtime image
# (components/world-model-runtime: Waypoint-1.5 + FLUX.2 klein + H.264 encoder),
# consumed by gitops/charts/world-model as zuno-ai-build/world-model-runtime:latest.
# A CUDA image of about 10 GB: check the build nodes' ephemeral storage first
# (a heavy build has pushed a master into DiskPressure before). The web image
# (components/world-model-web: the API and the UI, no GPU) is small.
- name: "world_model_build | build world-model-runtime"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_openshift_build.yml"
  vars:
    build_image_name: world-model-runtime
    build_dockerfile_path: components/world-model-runtime/Dockerfile
    build_context_dir: "."

- name: "world_model_build | build world-model-web (the API and the PatternFly UI)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_openshift_build.yml"
  vars:
    build_image_name: world-model-web
    build_dockerfile_path: components/world-model-web/Dockerfile
    build_context_dir: "."

# Pull access for the world-model ServiceAccounts only (not every ServiceAccount
# of the namespace), like token_proxy_build.
- name: "world_model_build | grant the world-model ServiceAccounts image-pull access"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: "{{ sa }}-image-puller"
        namespace: zuno-ai-build
        labels:
          zuno.io/managed-by: zuno-ansible
      subjects:
        - kind: ServiceAccount
          name: "{{ sa }}"
          namespace: "{{ world_model_namespace }}"
      roleRef:
        kind: ClusterRole
        name: system:image-puller
        apiGroup: rbac.authorization.k8s.io
  loop: "{{ world_model_image_pullers }}"
  loop_control:
    loop_var: sa
