---
# ADR-0354: installs Ansible Automation Platform (Gateway, Controller, Hub,
# EDA) as a Day 1 component, immediately after openshift_oauth (keycloak's
# dedicated postgres database, Vault/External Secrets, and Keycloak/
# openshift_oauth itself must all already be Synced+Healthy). zuno-aap is
# a Day 0 namespace (gitops/charts/namespaces), not created by this role.
#
# Package name/default channel confirmed live against this cluster's
# redhat-operators catalog on 2026-08-24: "ansible-automation-platform-
# operator", defaultChannel "stable-2.7", InstallModes OwnNamespace/
# SingleNamespace/MultiNamespace only (no AllNamespaces) - same reasoning
# as keycloak's rhbk-operator, subscribed into its own namespace with its
# own OperatorGroup rather than the shared openshift-operators namespace.
# Still discover catalog/channel from the PackageManifest rather than
# hardcoding them, same pattern as every other operator-backed role.
- name: "aap | look up the {{ aap_package_name | default('ansible-automation-platform-operator') }} PackageManifest"
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    namespace: openshift-marketplace
    name: "{{ aap_package_name | default('ansible-automation-platform-operator') }}"
  register: _aap_pkg_info

- name: "aap | fail if the package isn't published anywhere on this cluster"
  ansible.builtin.fail:
    msg: >-
      No PackageManifest named
      '{{ aap_package_name | default('ansible-automation-platform-operator') }}'
      was found in openshift-marketplace. Check `oc get packagemanifest -n
      openshift-marketplace | grep -i ansible` for the correct package name
      on this cluster; re-run with `-e aap_package_name=<name>` or update
      this role's default - the catalog on this cluster changed from what
      ADR-0354/WP-072 last confirmed.
  when: (_aap_pkg_info.resources | default([]) | length) == 0

- name: "aap | select the catalog/channel to subscribe from"
  ansible.builtin.set_fact:
    _aap_catalog_source: "{{ _aap_pkg_info.resources[0].status.catalogSource }}"
    _aap_channel: >-
      {{
        'stable'
        if (_aap_pkg_info.resources[0].status.channels | selectattr('name', 'equalto', 'stable') | list | length) > 0
        else (_aap_pkg_info.resources[0].status.defaultChannel | default(''))
      }}

- name: "aap | fail if no usable channel was found"
  ansible.builtin.fail:
    msg: >-
      Package '{{ aap_package_name | default('ansible-automation-platform-operator') }}'
      (catalog '{{ _aap_catalog_source }}') has no "stable" channel and no
      defaultChannel to fall back to. Published channels:
      {{ _aap_pkg_info.resources[0].status.channels | map(attribute='name') | list }}.
  when: _aap_channel | length == 0

- name: "aap | discovery summary"
  ansible.builtin.debug:
    msg: >-
      Subscribing to package
      '{{ aap_package_name | default('ansible-automation-platform-operator') }}',
      catalog '{{ _aap_catalog_source }}', channel '{{ _aap_channel }}'.

- name: "aap | apply the aap GitOps Application (d0: operator)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "aap"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-aap-d0"
    # Starts from the manifest's own values and merges in only the
    # runtime-discovered catalog/channel. This dict REPLACES
    # spec.source.helm.values wholesale, so listing keys by hand silently drops
    # whatever application-d0.yaml declares - `namespace` today, anything added
    # later. Harmless so far only because the chart defaults happen to match;
    # the same shape deleted ADR-0211's whole ACME track from cert-manager for
    # nine days (2026-09-02). Subscript ['values'], never .values - dot
    # notation resolves to the Python dict method of that name.
    gitops_app_extra_helm_values: >-
      {{
        ((lookup('ansible.builtin.file', zuno_repo_root + '/gitops/apps/aap/application-d0.yaml')
          | replace('apps.mycluster.example.com', cluster_base_domain)
          | from_yaml)['spec']['source']['helm']['values'] | from_yaml)
        | combine({'operator': {'enabled': true,
                                'subscription': {'operator': {'channel': _aap_channel,
                                                              'source': {'name': _aap_catalog_source}}}}},
                  recursive=True)
      }}
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 15

# ADR-0354 recovery path: `make d1 uninstall aap` DROPs the aap/aap-eda
# databases and roles directly via psql (ansible/roles/aap/tasks/
# uninstall.yml). CORRECTED LIVE 2026-08-25 (WP-077's first live run):
# PGO does NOT recreate a database/role that disappears out from under an
# already-bootstrapped cluster - confirmed via the operator's own logs
# (openshift-operators/pgo), which error-looped every ~2s on
# `reconcilePostgresUsersInPostgreSQL`: `psql:<stdin>:47: ERROR: database
# "aap" does not exist` / `command terminated with exit code 3`, forever,
# never creating it. PGO's ongoing reconcile only manages roles/grants
# *inside* databases it assumes already exist (apparently a different
# codepath than initial cluster bootstrap, which does create them) - the
# original plan's premise that "PGO's continuous reconcile of
# spec.users[] recreates a dropped database" was wrong. This block
# creates both explicitly instead of waiting for PGO to do it.
#
# Both roles use the "bring your own password" SCRAM verifier already
# sitting in the PGO-managed zuno-postgresql-pguser-<role> Secret
# (persists untouched by the drop - it belongs to the postgresql chart,
# never touched by aap uninstall) rather than a fresh random password, so
# every existing consumer of that credential (Vault-sourced
# ExternalSecrets, etc.) keeps working unchanged. Both databases are
# created owned by "postgres" with the owner role granted database-level
# CREATE/TEMPORARY/CONNECT - the chart's own documented/intended model
# (configmap-schema-grants.yaml's comment), matching aap-eda's actual
# live structure rather than perpetuating aap's unexplained
# aapgateway-direct-ownership anomaly from the original WP-072 bootstrap.
# Schema-level CREATE/USAGE on `public` (PG15+ doesn't imply it from the
# database-level grant above) is deliberately NOT applied here - the
# force-sync step below reruns the postgresql chart's schema-grants
# Sync-hook Job for exactly that, keeping this role from duplicating
# logic that already exists and is exercised for every other dedicated
# database in this cluster.
#
# postgresql (Day 1, earlier than aap in day1_install.yml) must already be
# installed by this point for aap to even reach here (Gateway/EDA's own
# external-database config reads Secrets sourced from the same
# aap/postgresql-app, aap-eda/postgresql-app Vault paths postgresql's
# chart renders) - so the one-shot check below always has a primary pod
# to query. On every normal install where both databases are already
# present (the overwhelmingly common case: a fresh environment, or any
# re-run that isn't recovering from a prior uninstall), this whole
# recovery block is skipped after a single fast psql query - no
# meaningful cost added to the normal install path.
- name: "aap | look up the current Postgres primary pod (for the aap/aap-eda database check)"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: zuno-data
    label_selectors:
      - postgres-operator.crunchydata.com/role=master
  register: _aap_pg_primary_pod
  until: (_aap_pg_primary_pod.resources | default([]) | length) > 0
  retries: 30
  delay: 10

- name: "aap | check whether the aap and aap-eda databases already exist"
  kubernetes.core.k8s_exec:
    namespace: zuno-data
    pod: "{{ _aap_pg_primary_pod.resources[0].metadata.name }}"
    container: database
    command: >-
      psql -U postgres -tA -c
      "SELECT count(*) FROM pg_database WHERE datname IN ('aap', 'aap-eda');"
  register: _aap_pg_db_precheck
  changed_when: false

- name: "aap | recover the aap/aap-eda databases and schema grants if either is missing"
  when: (_aap_pg_db_precheck.stdout | default('0') | trim | int) < 2
  block:
    - name: "aap | read the aapgateway/aapeda PGO-managed password verifiers"
      kubernetes.core.k8s_info:
        kind: Secret
        namespace: zuno-data
        name: "{{ item }}"
      loop:
        - zuno-postgresql-pguser-aapgateway
        - zuno-postgresql-pguser-aapeda
      register: _aap_pg_pguser_secrets
      no_log: true

    - name: "aap | recreate the aapgateway/aapeda roles and the aap/aap-eda databases"
      kubernetes.core.k8s_exec:
        namespace: zuno-data
        pod: "{{ _aap_pg_primary_pod.resources[0].metadata.name }}"
        container: database
        command: >-
          psql -U postgres -v ON_ERROR_STOP=1
          -c 'DROP ROLE IF EXISTS aapgateway;'
          -c "CREATE ROLE aapgateway LOGIN PASSWORD '{{ (_aap_pg_pguser_secrets.results[0].resources[0].data.verifier | b64decode) }}';"
          -c 'DROP DATABASE IF EXISTS aap WITH (FORCE);'
          -c 'CREATE DATABASE aap;'
          -c 'GRANT CREATE, TEMPORARY, CONNECT ON DATABASE aap TO aapgateway;'
          -c 'DROP ROLE IF EXISTS aapeda;'
          -c "CREATE ROLE aapeda LOGIN PASSWORD '{{ (_aap_pg_pguser_secrets.results[1].resources[0].data.verifier | b64decode) }}';"
          -c 'DROP DATABASE IF EXISTS "aap-eda" WITH (FORCE);'
          -c 'CREATE DATABASE "aap-eda";'
          -c 'GRANT CREATE, TEMPORARY, CONNECT ON DATABASE "aap-eda" TO aapeda;'
      no_log: true

    - name: "aap | force a sync of zuno-postgresql-d1 so the schema-grants Job reruns"
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/force_argocd_sync.yml"
      vars:
        gitops_app_name: "zuno-postgresql-d1"
        gitops_app_wait_retries: 30
        gitops_app_wait_delay: 10

# Gateway+Controller+Hub+EDA starting together, even non-HA, is comparable
# to openshift_ai's DataScienceCluster - generous retries, longer delay.
- name: "aap | apply the aap GitOps Application (d1: AnsibleAutomationPlatform CR)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "aap"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-aap-d1"
    # Reads application-d1.yaml rather than restating it. The hand-written
    # dict this replaces supplied aap.enabled and clusterBaseDomain but not
    # namespace/crName/adminSecretName, which the manifest also declares -
    # they fell back to chart defaults that happen to be identical, so nothing
    # broke, but the next manifest-only edit would have been silently ignored.
    # Nothing here is runtime-discovered: clusterBaseDomain rides the
    # apps.mycluster.example.com token substituted below, so there is nothing
    # left to merge in.
    gitops_app_extra_helm_values: >-
      {{
        ((lookup('ansible.builtin.file', zuno_repo_root + '/gitops/apps/aap/application-d1.yaml')
          | replace('apps.mycluster.example.com', cluster_base_domain)
          | from_yaml)['spec']['source']['helm']['values'] | from_yaml)
      }}
    gitops_app_wait_retries: 90
    gitops_app_wait_delay: 20

# NOT wired in this WP: the AnsibleAutomationPlatform CR has its own
# top-level `bundle_cacert_secret` field (confirmed live via `oc explain
# ansibleautomationplatform.spec` on 2026-08-24, WP-072's CRD inventory) -
# a Secret naming the CA bundle the Gateway trusts for its own outbound
# HTTPS calls, which is what a Keycloak OIDC authenticator (WP-073) would
# need if the Keycloak Route's certificate is Vault-PKI-signed rather than
# publicly trusted. Unlike `ansible/tasks/sync_keycloak_serving_ca.yml`
# (which produces a ConfigMap, consumed by pods that mount it directly),
# this CR field wants a Secret, and its expected key name is not confirmed
# from the CRD schema alone (no alm-examples were published on this
# channel). Deferred to WP-073 alongside the OIDC authenticator wiring
# itself, since the CR field is only load-bearing once an authenticator
# actually depends on it - reconciling the CR today needs no Keycloak
# trust at all.

# --- Red Hat subscription activation (zuno_aap_enabled) ---------------------
# Attaches the operator's own Red Hat account subscription to the freshly
# started platform, replacing whatever ambient entitlement the cluster
# auto-attached (a fresh install came up with a "Developer Subscription
# for Individuals" already compliant, observed live 2026-08-25 - the
# decision is that the *configured* account must always be the one
# attached, not whichever fallback happened to apply). Endpoint and
# semantics confirmed live against this cluster's Gateway (2026-08-25):
# on AAP 2.7 a single authenticated POST to /api/controller/v2/config/
# with subscriptions_username/subscriptions_password validates the account
# against Red Hat and attaches its matching entitlement in one call
# (HTTP 200, returns the applied license_info) - not the older Tower
# two-step list-pools-then-attach-pool_id flow.
#
# Deliberately hard-fails the whole install when enabled but broken (bad
# credentials, unreachable API): aap precedes connectivity_link/lws/
# jobset/kueue/openshift_ai/aiagent_operator in day1_components, so a
# subscription problem blocks the rest of Day 1 until resolved - the
# user's explicit choice over a warn-and-continue.

# Same optional-read pattern as ansible/roles/keycloak/tasks/install.yml:
# the role stays runnable without confidential.yml - a missing file just
# leaves zuno_aap_enabled undefined, defaulting to false below.
- name: "aap | check for ansible/confidential.yml (optional, only for the Red Hat subscription step)"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/confidential.yml"
  register: _aap_confidential_file

- name: "aap | load ansible/confidential.yml if present"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/confidential.yml"
  when: _aap_confidential_file.stat.exists

- name: "aap | activate the Red Hat subscription"
  when: zuno_aap_enabled | default(false) | bool
  block:
# ADR-0024 chain (WP-073 improvement): the RHN credentials come from the
    # aap-rhn-credentials Secret (ExternalSecret over Vault zuno/aap/rhn,
    # seeded by ansible/roles/vault from confidential.yml) - this role no
    # longer reads confidential.yml's RHN values directly; only the
    # zuno_aap_enabled flag still comes from there.
    - name: "aap | read the RHN credentials from the aap-rhn-credentials Secret"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: zuno-aap
        name: aap-rhn-credentials
      register: _aap_rhn_secret
      no_log: true

    - name: "aap | resolve the RHN credentials"
      ansible.builtin.set_fact:
        _aap_rhn_username: >-
          {{ (_aap_rhn_secret.resources[0].data.username | default('') | b64decode)
             if (_aap_rhn_secret.resources | default([]) | length) > 0 else '' }}
        _aap_rhn_password: >-
          {{ (_aap_rhn_secret.resources[0].data.password | default('') | b64decode)
             if (_aap_rhn_secret.resources | default([]) | length) > 0 else '' }}
      no_log: true

    - name: "aap | fail if the RHN credentials are missing or placeholders"
      ansible.builtin.fail:
        msg: >-
          zuno_aap_enabled is true but the aap-rhn-credentials Secret in
          zuno-aap has no real username/password - Vault zuno/aap/rhn is
          still the operator-supplied placeholder. Fill in
          zuno_aap_rhn_username/zuno_aap_rhn_password in
          ansible/confidential.yml (a real access.redhat.com login, see
          ansible/confidential.example.yml), run `make d0 install vault`
          to seed it, then re-run this install - or set
          zuno_aap_enabled: false.
      when: >-
        _aap_rhn_username in ['', 'xxxxxx'] or
        _aap_rhn_password in ['', 'xxxxxx']

    # ADR-0517 live finding (demo333, 2026-09-06): on a fresh cluster the
    # -d1 apply above returns as soon as ArgoCD reports the
    # AnsibleAutomationPlatform CR Synced/Healthy - which is the moment
    # it is CREATED (no custom health check exists for that kind), while
    # the gateway operator takes 15-20 minutes to actually bring the
    # stack up and create this Route. A retry-less lookup here failed the
    # whole role, which then never reached the subscription attach below
    # - leaving a running AAP with no license, where every Controller
    # host POST later 403s with "License is missing". Invisible on
    # demo222, whose AAP predates every rerun of this role.
    - name: "aap | wait for the Gateway Route (fresh install: the operator takes ~20 min)"
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        namespace: zuno-aap
        name: aap
      register: _aap_route
      until: (_aap_route.resources | default([]) | length) > 0
      retries: 90
      delay: 15

    - name: "aap | fail if the Gateway Route doesn't exist"
      ansible.builtin.fail:
        msg: >-
          Route 'aap' not found in zuno-aap - the
          AnsibleAutomationPlatform CR should have created it during the
          -d1 apply above. Check `oc get route -n zuno-aap` and the
          aap-gateway-operator logs.
      when: (_aap_route.resources | default([]) | length) == 0

    - name: "aap | read the admin password from the aap-admin Secret"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: zuno-aap
        name: aap-admin
      register: _aap_admin_secret
      no_log: true

    - name: "aap | resolve Gateway URL and admin credentials"
      ansible.builtin.set_fact:
        _aap_gateway_url: "https://{{ _aap_route.resources[0].spec.host }}"
        _aap_admin_password: "{{ _aap_admin_secret.resources[0].data.password | b64decode }}"
      no_log: true

    # ArgoCD Synced/Healthy on zuno-aap-d1 does NOT imply the Gateway API
    # answers yet (no custom Lua health check exists for the
    # AnsibleAutomationPlatform CRD - observed live: the Application was
    # Healthy while the gateway pod was still failing its DB migration),
    # so poll the real API before calling it. validate_certs false: the
    # Route's edge certificate may be the router default rather than a
    # publicly-trusted chain, and this is an admin call from the install
    # shell, not a browser flow.
    - name: "aap | wait for the Gateway API to answer"
      ansible.builtin.uri:
        url: "{{ _aap_gateway_url }}/api/"
        method: GET
        validate_certs: false
        status_code: 200
      register: _aap_api_ping
      until: _aap_api_ping.status | default(0) == 200
      retries: 60
      delay: 10

    - name: "aap | read the current subscription state"
      ansible.builtin.uri:
        url: "{{ _aap_gateway_url }}/api/controller/v2/config/"
        method: GET
        url_username: admin
        url_password: "{{ _aap_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: _aap_config_before
      no_log: true

# ADR-0517 live finding (demo333, 2026-09-06): the previous single POST
    # of subscriptions_username/password to /config/ answers 400 "Invalid
    # subscription" on this fresh AAP 2.7 when the account holds SEVERAL
    # subscriptions (this one lists 8) - with more than one candidate the
    # endpoint refuses to pick. It had worked when demo222 was first
    # subscribed, and never ran again there. The flow the UI actually
    # uses, reproduced here: list the account's subscriptions, choose one,
    # save the account credentials in settings (attach validates
    # server-side against them), then attach BY ID - and the attach field
    # is `subscription_id`, NOT the `pool_id` the AWX docs suggest
    # (pool_id answers 400 "No subscription ID provided", live-confirmed).
    # Everything below is skipped when the license is already
    # valid+compliant, so re-runs never re-attach.
    - name: "aap | attach a subscription (only when none is active)"
      when: >-
        not (_aap_config_before.json.license_info.valid_key | default(false) | bool) or
        not (_aap_config_before.json.license_info.compliant | default(false) | bool)
      block:
        - name: "aap | list the Red Hat account's available subscriptions"
          ansible.builtin.uri:
            url: "{{ _aap_gateway_url }}/api/controller/v2/config/subscriptions/"
            method: POST
            url_username: admin
            url_password: "{{ _aap_admin_password }}"
            force_basic_auth: true
            validate_certs: false
            body_format: json
            body:
              subscriptions_username: "{{ _aap_rhn_username }}"
              subscriptions_password: "{{ _aap_rhn_password }}"
            status_code: 200
            timeout: 120
          register: _aap_sub_list
          no_log: true

        - name: "aap | fail if the account has no valid subscription"
          ansible.builtin.fail:
            msg: >-
              The Red Hat account authenticated but returned no valid
              subscription. Check the account's Ansible Automation
              Platform entitlements on access.redhat.com.
          when: >-
            (_aap_sub_list.json | default([]) | selectattr('valid_key') | list | length) == 0

        # Largest instance_count wins: on this operator account that is
        # the partner subscription (effectively unlimited hosts), and on
        # a single-subscription account it is simply the only one.
        - name: "aap | choose the subscription with the largest host count"
          ansible.builtin.set_fact:
            _aap_chosen_sub: >-
              {{ _aap_sub_list.json | selectattr('valid_key')
                 | sort(attribute='instance_count') | last }}
          no_log: true

        - name: "aap | save the account credentials in Controller settings (attach validates against them)"
          ansible.builtin.uri:
            url: "{{ _aap_gateway_url }}/api/controller/v2/settings/system/"
            method: PATCH
            url_username: admin
            url_password: "{{ _aap_admin_password }}"
            force_basic_auth: true
            validate_certs: false
            body_format: json
            body:
              SUBSCRIPTIONS_USERNAME: "{{ _aap_rhn_username }}"
              SUBSCRIPTIONS_PASSWORD: "{{ _aap_rhn_password }}"
            status_code: 200
          no_log: true

        - name: "aap | attach the chosen subscription by id"
          ansible.builtin.uri:
            url: "{{ _aap_gateway_url }}/api/controller/v2/config/attach/"
            method: POST
            url_username: admin
            url_password: "{{ _aap_admin_password }}"
            force_basic_auth: true
            validate_certs: false
            body_format: json
            body:
              subscription_id: "{{ _aap_chosen_sub.subscription_id }}"
            status_code: 200
            timeout: 180
          register: _aap_attach
          no_log: true
          changed_when: true

    - name: "aap | read back the license state"
      ansible.builtin.uri:
        url: "{{ _aap_gateway_url }}/api/controller/v2/config/"
        method: GET
        url_username: admin
        url_password: "{{ _aap_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: _aap_subscribe_verify
      no_log: true

    - name: "aap | fail if the attached subscription is not valid/compliant"
      ansible.builtin.fail:
        msg: >-
          The Red Hat account accepted the credentials but the resulting
          subscription is not valid/compliant (valid_key={{
          _aap_subscribe_verify.json.license_info.valid_key | default('absent') }},
          compliant={{ _aap_subscribe_verify.json.license_info.compliant | default('absent')
          }}). Check the account's Ansible Automation Platform
          entitlements on access.redhat.com.
      when: >-
        not (_aap_subscribe_verify.json.license_info.valid_key | default(false) | bool) or
        not (_aap_subscribe_verify.json.license_info.compliant | default(false) | bool)

    - name: "aap | subscription summary"
      ansible.builtin.debug:
        msg: >-
          Subscription active:
          '{{ _aap_subscribe_verify.json.license_info.subscription_name }}'
          (sku {{ _aap_subscribe_verify.json.license_info.sku | default('n/a') }},
          {{ _aap_subscribe_verify.json.license_info.instance_count }} managed
          hosts, compliant={{ _aap_subscribe_verify.json.license_info.compliant }}).
