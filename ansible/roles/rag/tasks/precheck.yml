---
# State detection (never fails). "Installed" requires every enabled
# domain's one-shot schema-apply Job to have last succeeded and the RAG
# service Application to be Synced+Healthy.
#
# WP-21: the schema-apply Job used to be a single fixed
# `zuno-rag-schema-apply`; the multi-domain core (gitops/charts/rag-service/
# templates/job-schema-apply.yaml) renders one `zuno-rag-schema-apply-
# <domain>` Job per enabled `knowledgeDomains` entry instead (it is the
# only Job template in that chart, always labeled
# app.kubernetes.io/name=rag-service). Match on the label, not a fixed
# name, or a rename here breaks `make d1 check rag` again; require every
# returned Job to have succeeded (not just the first).
- name: "rag | look up the RAG schema-apply Jobs (one per enabled domain)"
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    namespace: zuno-data
    label_selectors:
      - "app.kubernetes.io/name=rag-service"
  register: _rag_job_lookup

- name: "rag | check the rag Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-rag-d0"

- name: "rag | save the d0 check result"
  ansible.builtin.set_fact:
    _rag_d0_installed: "{{ _state_check_result }}"

- name: "rag | check the rag Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-rag-d1"

- name: "rag | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        (_rag_job_lookup.resources | default([]) | length) > 0
        and (_rag_job_lookup.resources
             | rejectattr('status.succeeded', 'defined')
             | list | length) == 0
        and (_rag_job_lookup.resources
             | selectattr('status.succeeded', 'defined')
             | rejectattr('status.succeeded', 'greaterthan', 0)
             | list | length) == 0
        and _rag_d0_installed
        and _state_check_result
      }}

- name: "rag | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
