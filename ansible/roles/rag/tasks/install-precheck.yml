---
# State detection (never fails). Day 1 has no real install phase -
# "installed" reports whether this role's prerequisites are ready (former
# precheck.yml content, now informational rather than fail-fast).
- name: "rag | look up the PostgresCluster"
  kubernetes.core.k8s_info:
    api_version: postgres-operator.crunchydata.com/v1beta1
    kind: PostgresCluster
    namespace: zuno-data
    name: zuno-postgresql
  register: _rag_pg_lookup

- name: "rag | compute install state (prerequisites ready)"
  ansible.builtin.set_fact:
    _state_is_installed: "{{ (_rag_pg_lookup.resources | default([]) | length) > 0 }}"

- name: "rag | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_install_state.yml"
