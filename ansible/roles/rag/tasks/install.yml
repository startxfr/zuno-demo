---
# Generates the SQL/fixtures ConfigMap only; the actual apply is an ArgoCD
# PreSync hook Job owned by gitops/charts/rag-service, not an ansible-managed
# Job. disableNameSuffixHash keeps the ConfigMap name stable so the chart's
# Job can reference it by a fixed name.
- name: "rag | build the RAG metadata schema + fixtures ConfigMap"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/rag/kustomize/schema"

# No OLM operator involved - all content is -d1 (d0 is a no-op).
- name: "rag | apply the RAG service GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "rag"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

- name: "rag | apply the RAG service GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "rag"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
