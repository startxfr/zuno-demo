---
# The SQL/fixtures ConfigMap (zuno-rag-schema) used to be generated here via
# Kustomize and applied out-of-band - moved into
# gitops/charts/rag-service/templates/configmap-schema.yaml so it's part of
# the same ArgoCD-tracked flow as the Sync-hook Job that consumes it (was
# entirely invisible to GitOps before: editing the SQL files had no live
# effect until this task was re-run by hand). See that template's own
# comment for the full rationale.

# No OLM operator involved - all content is -d1 (d0 is a no-op).
- name: "rag | apply the RAG service GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "rag"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

- name: "rag | apply the RAG service GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "rag"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
