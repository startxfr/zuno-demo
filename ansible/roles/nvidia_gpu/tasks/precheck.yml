---
# State detection (never fails). nvidia_gpu's Subscription and
# ClusterPolicy share one Application, applied via two
# apply_gitops_app.yml calls both inside install.yml (ADR-0312 - the
# ClusterPolicy spec is only known once the CSV installs). "Installed"
# checks both phases: the operator (Subscription CSV succeeded) and the
# ClusterPolicy actually reporting ready.
- name: "nvidia_gpu | look up the GPU Operator Subscription"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    namespace: nvidia-gpu-operator
    name: gpu-operator-certified
  register: _nvidia_gpu_subscription_lookup

- name: "nvidia_gpu | look up the ClusterPolicy"
  kubernetes.core.k8s_info:
    api_version: nvidia.com/v1
    kind: ClusterPolicy
    name: gpu-cluster-policy
  register: _nvidia_gpu_policy_lookup

- name: "nvidia_gpu | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        (_nvidia_gpu_subscription_lookup.resources | default([]) | length) > 0
        and (_nvidia_gpu_subscription_lookup.resources[0].status.installedCSV | default('') | length) > 0
        and (_nvidia_gpu_policy_lookup.resources | default([]) | length) > 0
        and (_nvidia_gpu_policy_lookup.resources[0].status.state | default('')) == 'ready'
      }}

- name: "nvidia_gpu | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
