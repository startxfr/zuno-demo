---
# ADR-0312: Namespace/OperatorGroup/Subscription (cluster-gpu.project.
# enabled/cluster-gpu.operator.enabled) and the ClusterPolicy
# (cluster-gpu.gpu.enabled, conditional on cluster-gpu.gpu.spec) both live
# in gitops/charts/nvidia-gpu (wrapping the vendored startx cluster-gpu
# chart), applied via two separate Applications (zuno-nvidia-gpu-d0/-d1) -
# the ClusterPolicy's spec is read from the CSV OLM installs in response
# to -d0's Subscription, so it cannot be known before -d0 is
# Synced+Healthy, and -d1 is only applied once that discovery is done.
- name: "nvidia_gpu | apply the nvidia-gpu GitOps Application (d0: operator)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "nvidia-gpu"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"
    gitops_app_extra_helm_values:
      cluster-gpu:
        project:
          enabled: true
        operator:
          enabled: true
    gitops_app_wait_retries: 30
    gitops_app_wait_delay: 15

    # A hand-maintained minimal spec (operator.defaultRuntime/driver/
    # toolkit/devicePlugin only) rejected outright on a real cluster
    # (api.demo222.startx.fr, GPU Operator v26.3.3): "spec.daemonsets:
    # Required value, spec.dcgm: Required value, spec.dcgmExporter:
    # Required value, spec.gfd: Required value, spec.nodeStatusExporter:
    # Required value" - this CRD version requires several more top-level
    # sections than it used to, and guessing the full shape by hand is
    # exactly the kind of assumption that's already proven wrong multiple
    # times this session (RHBK channel, PGO catalog, ESO catalog). Every
    # OLM-published operator ships its own recommended default CR in its
    # CSV's `alm-examples` annotation - read that instead of maintaining a
    # hand-written spec that can silently drift from what the currently
    # installed operator version actually requires.
- name: "nvidia_gpu | discover the installed GPU Operator CSV"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    namespace: nvidia-gpu-operator
    name: gpu-operator-certified
  register: _nvidia_gpu_subscription
  until: (_nvidia_gpu_subscription.resources[0].status.installedCSV | default('')) | length > 0
  retries: 30
  delay: 10

- name: "nvidia_gpu | read the CSV's own recommended default ClusterPolicy"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: nvidia-gpu-operator
    name: "{{ _nvidia_gpu_subscription.resources[0].status.installedCSV }}"
  register: _nvidia_gpu_csv

- name: "nvidia_gpu | extract the ClusterPolicy example from the CSV's alm-examples"
  ansible.builtin.set_fact:
    # cluster-gpu's own ClusterPolicy.yaml template inserts .Values.gpu.spec
    # as a raw string via `nindent` (unlike this repo's former local
    # template, which used `toYaml` on a native map) - so the extracted
    # spec is serialized to a YAML string here with `to_nice_yaml`, not
    # left as a Jinja dict, otherwise apply_gitops_app.yml's own
    # `gitops_app_extra_helm_values | to_nice_yaml` (ADR-0048) would dump
    # it as a nested mapping and Helm's `nindent` call would fail with a
    # "wrong type for value; expected string" template error.
    _nvidia_gpu_default_policy_spec: >-
      {{
        (
          (_nvidia_gpu_csv.resources[0].metadata.annotations['alm-examples'] | from_json
           | selectattr('kind', 'equalto', 'ClusterPolicy') | list)[0].spec
        ) | to_nice_yaml
      }}

# ADR-0312: applies the separate zuno-nvidia-gpu-d1 Application (the
# ClusterPolicy operand) for the first time, already with the discovered
# spec - the role never applies the ClusterPolicy manifest itself.
- name: "nvidia_gpu | apply the nvidia-gpu GitOps Application (d1: ClusterPolicy, with the discovered spec)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "nvidia-gpu"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
    gitops_app_extra_helm_values:
      cluster-gpu:
        gpu:
          enabled: true
          spec: "{{ _nvidia_gpu_default_policy_spec }}"
    gitops_app_wait_retries: 30
    gitops_app_wait_delay: 15

- name: "nvidia_gpu | wait for the ClusterPolicy to report ready"
  kubernetes.core.k8s_info:
    api_version: nvidia.com/v1
    kind: ClusterPolicy
    name: gpu-cluster-policy
  register: _nvidia_gpu_policy
  until: (_nvidia_gpu_policy.resources[0].status.state | default('')) == 'ready'
  retries: 60
  delay: 20
