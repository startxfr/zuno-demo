---
# ADR-0312: Namespace/OperatorGroup/Subscription (sync-wave 10) and the
# ClusterPolicy (sync-wave 20, conditional on clusterPolicy.spec) both
# live in gitops/charts/nvidia-gpu, applied as a single ArgoCD
# Application - see gitops/charts/nvidia-gpu/README.md for why this
# role's install proceeds in two apply_gitops_app.yml calls instead of
# one: the ClusterPolicy's spec is read from the CSV OLM installs in
# response to the Subscription below, so it cannot be known before this
# first call.
- name: "nvidia_gpu | apply the nvidia-gpu GitOps Application (operator only, first pass)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "nvidia-gpu"
    gitops_app_name: "zuno-{{ gitops_component_name }}"
    gitops_app_wait_retries: 30
    gitops_app_wait_delay: 15

    # A hand-maintained minimal spec (operator.defaultRuntime/driver/
    # toolkit/devicePlugin only) rejected outright on a real cluster
    # (api.demo222.startx.fr, GPU Operator v26.3.3): "spec.daemonsets:
    # Required value, spec.dcgm: Required value, spec.dcgmExporter:
    # Required value, spec.gfd: Required value, spec.nodeStatusExporter:
    # Required value" - this CRD version requires several more top-level
    # sections than it used to, and guessing the full shape by hand is
    # exactly the kind of assumption that's already proven wrong multiple
    # times this session (RHBK channel, PGO catalog, ESO catalog). Every
    # OLM-published operator ships its own recommended default CR in its
    # CSV's `alm-examples` annotation - read that instead of maintaining a
    # hand-written spec that can silently drift from what the currently
    # installed operator version actually requires.
- name: "nvidia_gpu | discover the installed GPU Operator CSV"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    namespace: nvidia-gpu-operator
    name: gpu-operator-certified
  register: _nvidia_gpu_subscription
  until: (_nvidia_gpu_subscription.resources[0].status.installedCSV | default('')) | length > 0
  retries: 30
  delay: 10

- name: "nvidia_gpu | read the CSV's own recommended default ClusterPolicy"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: nvidia-gpu-operator
    name: "{{ _nvidia_gpu_subscription.resources[0].status.installedCSV }}"
  register: _nvidia_gpu_csv

- name: "nvidia_gpu | extract the ClusterPolicy example from the CSV's alm-examples"
  ansible.builtin.set_fact:
    _nvidia_gpu_default_policy_spec: >-
      {{
        (_nvidia_gpu_csv.resources[0].metadata.annotations['alm-examples'] | from_json
         | selectattr('kind', 'equalto', 'ClusterPolicy') | list)[0].spec
      }}

# ADR-0312: second pass - updates the same Application's Helm values so
# ArgoCD renders and syncs the wave-20 ClusterPolicy. The role never
# applies the ClusterPolicy manifest itself.
- name: "nvidia_gpu | apply the nvidia-gpu GitOps Application (with the discovered ClusterPolicy spec)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "nvidia-gpu"
    gitops_app_name: "zuno-{{ gitops_component_name }}"
    gitops_app_extra_helm_values:
      clusterPolicy:
        spec: "{{ _nvidia_gpu_default_policy_spec }}"
    gitops_app_wait_retries: 30
    gitops_app_wait_delay: 15

- name: "nvidia_gpu | wait for the ClusterPolicy to report ready"
  kubernetes.core.k8s_info:
    api_version: nvidia.com/v1
    kind: ClusterPolicy
    name: gpu-cluster-policy
  register: _nvidia_gpu_policy
  until: (_nvidia_gpu_policy.resources[0].status.state | default('')) == 'ready'
  retries: 60
  delay: 20
