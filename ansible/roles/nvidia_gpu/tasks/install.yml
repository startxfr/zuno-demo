---
# The ClusterPolicy's spec is read from the CSV OLM installs in response to
# -d0's Subscription, so it can't be known before -d0 is Synced+Healthy.
- name: "nvidia_gpu | apply the nvidia-gpu GitOps Application (d0: operator)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "nvidia-gpu"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"
    gitops_app_extra_helm_values:
      cluster-gpu:
        project:
          enabled: true
        operator:
          enabled: true
    gitops_app_wait_retries: 30
    gitops_app_wait_delay: 15

    # A hand-maintained ClusterPolicy spec risks missing required top-level
    # sections that vary by operator version - read the CSV's own
    # recommended default from its `alm-examples` annotation instead.
- name: "nvidia_gpu | discover the installed GPU Operator CSV"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    namespace: nvidia-gpu-operator
    name: gpu-operator-certified
  register: _nvidia_gpu_subscription
  until: (_nvidia_gpu_subscription.resources[0].status.installedCSV | default('')) | length > 0
  retries: 30
  delay: 10

- name: "nvidia_gpu | read the CSV's own recommended default ClusterPolicy"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: nvidia-gpu-operator
    name: "{{ _nvidia_gpu_subscription.resources[0].status.installedCSV }}"
  register: _nvidia_gpu_csv

- name: "nvidia_gpu | extract the ClusterPolicy example from the CSV's alm-examples"
  ansible.builtin.set_fact:
    _nvidia_gpu_policy_spec_base: >-
      {{
        (_nvidia_gpu_csv.resources[0].metadata.annotations['alm-examples'] | from_json
         | selectattr('kind', 'equalto', 'ClusterPolicy') | list)[0].spec
      }}

# ADR-0351 overlay on the CSV's default spec:
#  - mig.strategy mixed: the permanent GPU node runs the all-balanced
#    partition (2x 1g.24gb + 1x 2g.48gb, gitops/charts/machines) while the
#    burst node keeps its whole GPU - only the mixed strategy can advertise
#    nvidia.com/mig-* slices and plain nvidia.com/gpu side by side.
#  - daemonsets.tolerations: every GPU-operator operand only tolerates
#    nvidia.com/gpu:NoSchedule by default - without a zuno.io/gpu-burst
#    toleration the driver/device-plugin never start on the tainted burst
#    node, which then never advertises its GPU and can never serve a
#    training pod. nvidia.com/gpu is restated defensively in case the
#    operator replaces rather than appends its implicit default when this
#    list is set.
# A live `oc patch clusterpolicy` is NOT an alternative: zuno-nvidia-gpu-d1
# has selfHeal and owns the spec through its helm values - the day-2 path
# for any strategy change is re-running this role.
- name: "nvidia_gpu | overlay the zuno ClusterPolicy overrides and serialize"
  ansible.builtin.set_fact:
    # Serialized to a YAML string with `to_nice_yaml`, not left as a Jinja
    # dict: the chart's template inserts .Values.gpu.spec as a raw string
    # via `nindent`, which fails on a nested mapping.
    _nvidia_gpu_default_policy_spec: >-
      {{
        _nvidia_gpu_policy_spec_base
        | combine({
            'mig': {'strategy': 'mixed'},
            'daemonsets': {'tolerations': [
              {'key': 'nvidia.com/gpu', 'operator': 'Exists', 'effect': 'NoSchedule'},
              {'key': 'zuno.io/gpu-burst', 'operator': 'Exists', 'effect': 'NoSchedule'}
            ]}
          }, recursive=True)
        | to_nice_yaml
      }}

# Applies the ClusterPolicy operand with the discovered spec - the role
# never applies the ClusterPolicy manifest itself.
- name: "nvidia_gpu | apply the nvidia-gpu GitOps Application (d1: ClusterPolicy, with the discovered spec)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "nvidia-gpu"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
    gitops_app_extra_helm_values:
      cluster-gpu:
        gpu:
          enabled: true
          spec: "{{ _nvidia_gpu_default_policy_spec }}"
    gitops_app_wait_retries: 30
    gitops_app_wait_delay: 15

- name: "nvidia_gpu | wait for the ClusterPolicy to report ready"
  kubernetes.core.k8s_info:
    api_version: nvidia.com/v1
    kind: ClusterPolicy
    name: gpu-cluster-policy
  register: _nvidia_gpu_policy
  until: (_nvidia_gpu_policy.resources[0].status.state | default('')) == 'ready'
  retries: 60
  delay: 20
