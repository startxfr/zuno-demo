---
kagent_namespace: zuno-kagent
# ADR-0600 / ADR-0601: the kagent Keycloak client is the operations persona ai-ops-01 (groups ocp-ai-ops).
# Realm users are create-only, so the service account gets the persona's groups live (keycloak_sa_groups.yml).
kagent_persona: ai-ops-01
# S5 hardening (WP-208 D6): the service account holds ONLY these groups, not a copy of the persona's. A compromised
# kagent (prompt injection through a tool result) then acts as an operator of the cluster and nothing else: no
# Open WebUI admin, no Tekos entitlement. Groups outside this list are removed from the service account.
# Set kagent_groups_follow_persona: true to restore the former behaviour (every group of kagent_persona).
kagent_groups: [ocp-ai-ops]
kagent_groups_follow_persona: false
kagent_keycloak_realm: zuno
# The headers the token proxy sets (ADR-0601 decision 3).
kagent_ai_headers:
  X-Zuno-Agent: kagent
  X-Zuno-Task: diagnose
  X-Zuno-Data-Classification: C1
kagent_mcp_headers:
  X-Zuno-Agent: kagent
  X-Zuno-Task: diagnose
  X-Zuno-Data-Classification: C2
