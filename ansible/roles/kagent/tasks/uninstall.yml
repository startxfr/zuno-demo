---
# Removes the Applications (and with them the Deployments, Route, Secrets and the declarative Agent). The CRDs
# Application goes last. The Keycloak client, the Vault paths and the database are kept: they are shared
# declarations (realm-zuno.json, the vault and postgresql roles) and a reinstall reuses them.
- name: "kagent | delete the kagent Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-kagent-d1"

- name: "kagent | delete the token proxy Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-token-proxy-kagent-d1"

- name: "kagent | delete the CRDs Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-kagent-d0"
