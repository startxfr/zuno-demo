---
# ADR-0600 (WP-207): kagent's Vault paths, seeded only when missing (vault_seed_if_missing.yml).
# kagent/postgresql-app is seeded by the vault role (the postgresql chart reads it too).
- name: "kagent | find the Vault pod"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: zuno-vault
    label_selectors:
      - "app.kubernetes.io/name=vault"
      - "component=server"
  register: _vault_pod

# ADR-0602 clause 1 / WP-223: a short-lived ansible-seeder token
# (zuno_vault_token, read by vault_seed_if_missing.yml), not the root token
# from vault-bootstrap-credentials; the helper fails if Vault is not running.
- name: "kagent | log in to Vault as ansible-seeder"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_login.yml"

- name: "kagent | seed the Keycloak client secret (idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  vars:
    vault_seed_path: keycloak/kagent
    vault_seed_fields:
      client_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"

# oauth2-proxy's cookie secret (exactly 32 bytes).
- name: "kagent | seed the front door cookie secret (idempotent)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  vars:
    vault_seed_path: kagent/app
    vault_seed_fields:
      front_door_cookie_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
