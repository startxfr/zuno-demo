---
# Order matters: delete d1 (ClusterIssuer) first to avoid ArgoCD fighting the
# CRD deletion, then remove the operator while the Subscription (a d0-managed
# resource) still exists to read its installedCSV, then delete d0. Vault's pki/
# engine and issuer role/policy are not cleaned up here (demo scope).
#
# ADR-0352 clause 4 (WP-217): in external mode the operator is not ours, so
# uninstall removes only what this installer created, the -d1 issuers and
# certificates, and never touches the operator, its CSV or its Subscription.
- name: "cert_manager | resolve the component mode (ADR-0352)"
  ansible.builtin.include_tasks: mode.yml

- name: "cert_manager | delete the cert-manager GitOps Application (d1: ClusterIssuer)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-cert-manager-d1"

- name: "cert_manager | leave the unmanaged operator in place (external mode)"
  ansible.builtin.debug:
    msg: >-
      zuno_cert_manager_mode is 'external' - cert-manager is installed outside this
      installer and is left untouched; only the -d1 issuers and certificates were
      removed. Flipping back to internal is a migration event (ADR-0352 clause 4).
  when: _cert_manager_mode == 'external'

- name: "cert_manager | remove the operator (its owned CRDs - cascading any remaining ClusterIssuer/Certificate CRs - then the CSV, then the Subscription)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/remove_operator.yml"
  when: _cert_manager_mode == 'internal'
  vars:
    operator_subscription_name: openshift-cert-manager-operator
    operator_namespace: cert-manager-operator

- name: "cert_manager | delete the cert-manager GitOps Application (d0: cascades the remaining OperatorGroup/Namespaces)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  when: _cert_manager_mode == 'internal'
  vars:
    gitops_app_name: "zuno-cert-manager-d0"
