---
# Operator (d0) and Vault-backed ClusterIssuer (d1) are separate Applications;
# d1 only applies once d0 is Synced+Healthy.
- name: "cert_manager | apply the cert-manager GitOps Application (d0: operator)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "cert-manager"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 15

# ArgoCD reports the CertManager CR Healthy as soon as synced, not once the
# webhook is actually ready - the ClusterIssuer below needs that webhook up
# to pass admission.
- name: "cert_manager | wait for the cert-manager controller Deployment to be ready"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: cert-manager
    name: cert-manager
  register: _cert_manager_controller_deploy
  until: >-
    (_cert_manager_controller_deploy.resources | default([]) | length) > 0 and
    (_cert_manager_controller_deploy.resources[0].status.readyReplicas | default(0)) > 0
  retries: 60
  delay: 15

# Discovered rather than hardcoded: the Helm release name isn't a repo-wide
# constant, and the chart creates three Services sharing this label.
- name: "cert_manager | discover the Vault client Service"
  kubernetes.core.k8s_info:
    kind: Service
    namespace: zuno-vault
    label_selectors:
      - "app.kubernetes.io/name=vault"
  register: _cert_manager_vault_services

- name: "cert_manager | select the client Service (excludes the -internal headless and -ui variants)"
  ansible.builtin.set_fact:
    _cert_manager_vault_service_name: >-
      {{
        (_cert_manager_vault_services.resources
         | rejectattr('metadata.labels.vault-internal', 'defined')
         | map(attribute='metadata.name') | list)[0]
      }}

# The pki/ engine and auth role/policy this ClusterIssuer depends on are
# prepared by the vault role; this role only points at that backend, never
# writes to Vault directly.
# gitops_app_extra_helm_values REPLACES spec.source.helm.values wholesale rather
# than merging: values is a YAML *string* key, so combine(recursive=True) cannot
# descend into it. Passing only the two values this role knows about therefore
# DELETED everything application-d1.yaml declares - certmanager.enabled and the
# whole acme: block - and prune+selfHeal then removed the ADR-0211 ACME track
# from the cluster. That is not hypothetical: the production cutover landed in
# git on 2026-08-16 (bc064f56) and was silently reverted by a later
# `make d1 install cert-manager`, leaving the router and API server on the
# internal Vault PKI cert while git said Let's Encrypt. The Application stayed
# Synced/Healthy throughout, so nothing surfaced it (found 2026-09-02).
#
# So start from the manifest's own values - git stays the source of truth for the
# ADR-0211 staged rollout, which application-d1.yaml documents as an operator git
# flip - and merge in only what must be discovered at run time. The replace()
# mirrors apply_gitops_app.yml's token substitution, which acts on the file it
# reads and cannot reach this dict. Lazily evaluated inside the include, so
# cluster_base_domain is already resolved by the time it renders.
#
# Subscript ['values'], never .values: dot notation resolves to the Python dict
# method of that name, and combine() then fails with "expected dicts but got a
# 'method'" (hit live on the first run of this task, 2026-09-02).
# WP-118 B6: the ACME DNS-01 identity is per-environment, not per-repo - a
# demo333 under a different parent zone needs its own hosted zone, its own
# Route53 region and its own contact mailbox. None of it is secret (a public
# hosted zone and its ID are published DNS facts; only the IAM key, in Vault
# at aws/route53-dns01, is), but all of it is operator configuration, so it
# is declared in ansible/confidential.yml alongside the S3 endpoints.
#
# Defaults come from the chart file itself rather than being restated here:
# one source of truth, and this apply stays byte-identical on demo222 until
# an operator actually sets the variables. Subscript ['acme'], never .acme.
# The role must LOAD confidential.yml before reading those variables. Nothing
# else does it for it: this repo has no vars_files and no global include_vars,
# so each role that reads an operator variable loads the file itself (see
# mariadb, models, smtp, keycloak, postgresql, vault, aap).
#
# Missing until 2026-09-04 (WP-132), and latent rather than harmless: with the
# three variables undefined, the default() chain below silently resolved to the
# chart, which WP-118 had just flipped to placeholders - so the next
# `make d0 install cert-manager` would have written MYCLUSTERHOSTEDZONEID /
# mycluster-route53-region / acme-contact@mycluster.example.com into the live
# zuno-cert-manager-d1 Application and stopped DNS-01 from solving on demo222.
# B6's "changed=0" inertia proof did not catch it because it was measured while
# the chart still carried the real values: the apply was inert for the wrong
# reason. This is ADR-0547 clause 4 read backwards - the values were moved and
# the default flipped, but the parameter surface was never actually wired, so
# step 2 removed the only working source.
- name: "cert_manager | check for ansible/confidential.yml (optional, only for the ACME DNS identity)"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/confidential.yml"
  register: _cert_manager_confidential_file

- name: "cert_manager | load ansible/confidential.yml if present"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/confidential.yml"
  when: _cert_manager_confidential_file.stat.exists

# WP-132 step 3 (ADR-0517 B11) extends this fact from the DNS identity to the
# whole ACME rollout state. gitops/apps/cert-manager/application-d1.yaml used to
# carry `enabled: true`, `certificatesIssuer: letsencrypt-route53` and both
# consumer flips `true` - demo222's END STATE, committed to git and inherited by
# any other cluster on its first sync. Its own comment described the intended
# design ("ships disabled - the operator flips enabled: true here") while the
# code beneath it said otherwise; the per-cluster flip had been committed.
#
# On a fresh cluster that combination is destructive, not merely wrong:
# acme-cluster-patches.yaml points IngressController/default at
# router-wildcard-tls and adds an APIServer named certificate for
# api-server-tls, neither of which can exist before a Certificate has issued -
# so Console and route serving break before ACME could ever succeed. The chart's
# own comment says these flip ONLY after `oc get certificate -A` shows Ready.
#
# The defaults below are the chart's, and the chart already ships exactly the
# state ADR-0211's staged rollout starts from: acme off, staging issuer, both
# consumers off. So a cluster that sets nothing gets the safe beginning of the
# rollout rather than another cluster's end of it, and the progression
# (staging rehearsal -> production issuer -> consumer flips) becomes four
# operator variables instead of four commits to a shared file.
- name: "cert_manager | resolve the ACME identity and rollout state (WP-118 B6, WP-132 B11)"
  ansible.builtin.set_fact:
    _cert_manager_acme_identity:
      enabled: "{{ zuno_certmanager_acme_enabled | default(_cm_chart_acme['enabled']) | bool }}"
      certificatesIssuer: >-
        {{ zuno_certmanager_issuer | default(_cm_chart_acme['certificatesIssuer']) }}
      consumers:
        routerDefaultCert: >-
          {{ zuno_certmanager_router_default_cert
             | default(_cm_chart_acme['consumers']['routerDefaultCert']) | bool }}
        apiServerNamedCert: >-
          {{ zuno_certmanager_api_server_named_cert
             | default(_cm_chart_acme['consumers']['apiServerNamedCert']) | bool }}
      email: "{{ zuno_certmanager_email | default(_cm_chart_acme['email']) }}"
      route53:
        region: "{{ zuno_certmanager_route53_region | default(_cm_chart_acme['route53']['region']) }}"
        hostedZoneID: >-
          {{ zuno_certmanager_route53_hosted_zone_id
             | default(_cm_chart_acme['route53']['hostedZoneID']) }}
  vars:
    _cm_chart_acme: >-
      {{ (lookup('ansible.builtin.file',
                 zuno_repo_root + '/gitops/charts/cert-manager/values.yaml')
          | from_yaml)['acme'] }}

# Refuse the one combination that breaks a cluster: pointing the router or the
# API server at Certificates while ACME itself is off. The chart's templates are
# already `and .Values.acme.enabled .Values.acme.consumers.*`, so this cannot
# render - but it means a typo silently produces a cluster with no consumer
# patches and no explanation, and on a cluster where the patches already exist
# a pruning sync would REMOVE them. Fail here, where the message can name the
# variable.
# The guard that makes step 3 safe to have done at all. Rendering this chart
# with the four values at their chart defaults produces 3 documents instead of
# 11: both ClusterIssuers, all three Certificates, the Route53 ExternalSecret,
# the IngressController patch and the APIServer patch all disappear - and this
# Application syncs with prune: true, so on a cluster where they exist that is
# not a no-op, it is an outage that takes the router's certificate with it.
#
# Which means an operator running this from a machine whose confidential.yml
# lacks the variables would silently tear down a working ACME track. Read what
# the live Application actually carries and refuse to walk anything backwards,
# rather than trusting that every future working copy is configured. Same
# shape as the assert WP-118 step 2 put in front of the machines role, and for
# the same reason: the edit is cheap to get wrong and expensive to get wrong.
#
# Absent Application (a fresh cluster) means nothing to protect - skip.
- name: "cert_manager | read the live Application's current ACME state (WP-132 guard)"
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "zuno-cert-manager-d1"
    namespace: "{{ zuno_argocd_namespace | default('openshift-gitops') }}"
  register: _cert_manager_live_app
  failed_when: false

- name: "cert_manager | extract the live ACME toggles"
  ansible.builtin.set_fact:
    _cert_manager_live_acme: >-
      {{ ((_cert_manager_live_app.resources | default([]) | first | default({}))
          .get('spec', {}).get('source', {}).get('helm', {}).get('values', '')
          | from_yaml | default({}, true)).get('acme', {}) }}

- name: "cert_manager | refuse to disable an ACME track that is live"
  ansible.builtin.fail:
    msg: >-
      zuno-cert-manager-d1 currently has acme.enabled={{ _cert_manager_live_acme['enabled'] | default('unset') }},
      consumers.routerDefaultCert={{ (_cert_manager_live_acme['consumers'] | default({}))['routerDefaultCert'] | default('unset') }},
      consumers.apiServerNamedCert={{ (_cert_manager_live_acme['consumers'] | default({}))['apiServerNamedCert'] | default('unset') }},
      but this run resolved
      enabled={{ _cert_manager_acme_identity['enabled'] }},
      routerDefaultCert={{ _cert_manager_acme_identity['consumers']['routerDefaultCert'] }},
      apiServerNamedCert={{ _cert_manager_acme_identity['consumers']['apiServerNamedCert'] }}.
      Applying that would prune the ClusterIssuers, the Certificates and the
      IngressController/APIServer patches this cluster is serving TLS from.
      Almost certainly ansible/confidential.yml on this machine is missing
      zuno_certmanager_acme_enabled / _issuer / _router_default_cert /
      _api_server_named_cert - set them to the live values above. If you really
      are rolling the ACME track back, set
      zuno_certmanager_allow_acme_downgrade=true to say so deliberately.
  vars:
    _cm_live_consumers: "{{ _cert_manager_live_acme['consumers'] | default({}) }}"
  when:
    - not (zuno_certmanager_allow_acme_downgrade | default(false) | bool)
    - (_cert_manager_live_acme | default({})) | length > 0
    - (_cert_manager_live_acme['enabled'] | default(false) | bool
       and not (_cert_manager_acme_identity['enabled'] | bool))
      or (_cm_live_consumers['routerDefaultCert'] | default(false) | bool
          and not (_cert_manager_acme_identity['consumers']['routerDefaultCert'] | bool))
      or (_cm_live_consumers['apiServerNamedCert'] | default(false) | bool
          and not (_cert_manager_acme_identity['consumers']['apiServerNamedCert'] | bool))

- name: "cert_manager | refuse ACME consumers while ACME itself is disabled"
  ansible.builtin.fail:
    msg: >-
      zuno_certmanager_router_default_cert / _api_server_named_cert is true but
      zuno_certmanager_acme_enabled is false. The consumer patches point
      IngressController/default and the APIServer at Certificates that only the
      ACME track issues, so this combination either renders nothing or, on a
      cluster where the patches already exist, prunes them and drops the router
      back to its self-signed certificate. Enable ACME first, complete
      ADR-0211's staged rollout, then flip the consumers.
  when:
    - not (_cert_manager_acme_identity['enabled'] | bool)
    - (_cert_manager_acme_identity['consumers']['routerDefaultCert'] | bool)
      or (_cert_manager_acme_identity['consumers']['apiServerNamedCert'] | bool)

- name: "cert_manager | apply the cert-manager GitOps Application (d1: Vault-backed ClusterIssuer + ADR-0211 ACME track)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "cert-manager"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
    gitops_app_extra_helm_values: >-
      {{
        ((lookup('ansible.builtin.file', zuno_repo_root + '/gitops/apps/cert-manager/application-d1.yaml')
          | replace('apps.mycluster.example.com', cluster_base_domain)
          | from_yaml)['spec']['source']['helm']['values'] | from_yaml)
        | combine({'vaultServiceName': _cert_manager_vault_service_name}, recursive=True)
        | combine({'acme': _cert_manager_acme_identity}, recursive=True)
      }}
    gitops_app_wait_retries: 30
    gitops_app_wait_delay: 10

- name: "cert_manager | wait for the vault-issuer ClusterIssuer to report Ready"
  kubernetes.core.k8s_info:
    api_version: cert-manager.io/v1
    kind: ClusterIssuer
    name: vault-issuer
  register: _cert_manager_issuer
  until: >-
    (_cert_manager_issuer.resources | default([]) | length) > 0 and
    (_cert_manager_issuer.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | list | first | default('False')) == 'True'
  retries: 30
  delay: 10
