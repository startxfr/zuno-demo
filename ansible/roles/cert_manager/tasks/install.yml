---
# ADR-0312-style split: Namespaces/OperatorGroup/Subscription/CertManager
# CR (operator.enabled) and the Vault-backed ClusterIssuer (issuer.enabled)
# both live in gitops/charts/cert-manager, applied via two separate
# Applications (zuno-cert-manager-d0/-d1) - -d1 is only applied once -d0
# is Synced+Healthy. Infrastructure only for now - see this role's
# README.md.
- name: "cert_manager | apply the cert-manager GitOps Application (d0: operator)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "cert-manager"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 15

# ArgoCD's default health evaluation has no logic for
# operator.openshift.io/CertManager - it reports the CR Healthy as soon as
# synced, not once the operand controller/webhook it triggers is actually
# ready. Kept as a supplementary explicit wait (same convention
# ansible/roles/external_secrets uses for its own OperatorConfig-triggered
# Deployment): the ClusterIssuer applied below needs the webhook pod
# running to pass admission.
- name: "cert_manager | wait for the cert-manager controller Deployment to be ready"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: cert-manager
    name: cert-manager
  register: _cert_manager_controller_deploy
  until: >-
    (_cert_manager_controller_deploy.resources | default([]) | length) > 0 and
    (_cert_manager_controller_deploy.resources[0].status.readyReplicas | default(0)) > 0
  retries: 60
  delay: 15

# Discovered, not hardcoded "vault.zuno-data.svc" - same reasoning as
# ansible/roles/{vault,external_secrets}/tasks/install.yml: the Helm
# release name isn't a repository-wide constant, and the chart creates
# three Services sharing app.kubernetes.io/name=vault (client, -internal
# headless, -ui).
- name: "cert_manager | discover the Vault client Service"
  kubernetes.core.k8s_info:
    kind: Service
    namespace: zuno-vault
    label_selectors:
      - "app.kubernetes.io/name=vault"
  register: _cert_manager_vault_services

- name: "cert_manager | select the client Service (excludes the -internal headless and -ui variants)"
  ansible.builtin.set_fact:
    _cert_manager_vault_service_name: >-
      {{
        (_cert_manager_vault_services.resources
         | rejectattr('metadata.labels.vault-internal', 'defined')
         | map(attribute='metadata.name') | list)[0]
      }}

# The pki/ secrets engine and the cert-manager-issuer Kubernetes-auth
# role/policy this ClusterIssuer depends on are prepared by
# ansible/roles/vault/kustomize/unseal-configure/configmap.yaml (`vault`
# runs before `cert_manager` in day0_components) - this role never writes
# to Vault directly, it only points a declarative ClusterIssuer at an
# already-configured backend, same as external_secrets' ClusterSecretStore.
- name: "cert_manager | apply the cert-manager GitOps Application (d1: Vault-backed ClusterIssuer)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "cert-manager"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
    gitops_app_extra_helm_values:
      issuer:
        enabled: true
      vaultServiceName: "{{ _cert_manager_vault_service_name }}"
    gitops_app_wait_retries: 30
    gitops_app_wait_delay: 10

- name: "cert_manager | wait for the vault-issuer ClusterIssuer to report Ready"
  kubernetes.core.k8s_info:
    api_version: cert-manager.io/v1
    kind: ClusterIssuer
    name: vault-issuer
  register: _cert_manager_issuer
  until: >-
    (_cert_manager_issuer.resources | default([]) | length) > 0 and
    (_cert_manager_issuer.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | list | first | default('False')) == 'True'
  retries: 30
  delay: 10
