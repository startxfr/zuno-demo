---
# Reverse of install.yml: delete the no-op d1 Application, then remove_operator.yml
# (needs the Subscription) before d0's own delete.
- name: "lws | delete the lws GitOps Application (d1, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-lws-d1"

- name: "lws | remove the operator (its owned CRDs then the CSV then the Subscription)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/remove_operator.yml"
  vars:
    operator_subscription_name: "{{ lws_package_name | default('leader-worker-set') }}"
    # openshift-lws-operator, its own dedicated namespace - see
    # gitops/apps/lws/application-d0.yaml.
    operator_namespace: openshift-lws-operator

- name: "lws | delete the lws GitOps Application (d0: the Subscription itself)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-lws-d0"
