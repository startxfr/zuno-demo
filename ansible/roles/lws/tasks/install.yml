---
# Ordered alongside connectivity_link and ahead of openshift_ai -
# ADR-0317 installs this operator ahead of any actual multi-node/
# multi-GPU workload.

# Catalog source/channel naming isn't verified against a live cluster
# (ADR-0317's Operational considerations); discover both from the
# PackageManifest rather than hardcoding, same pattern as
# ansible/roles/external_secrets/tasks/install.yml.
- name: "lws | resolve the operator package"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_operator_package.yml"
  vars:
    operator_package_name: "{{ lws_package_name | default('leader-worker-set') }}"
    operator_subscription_namespace: "openshift-lws-operator"
    operator_package_catalog_hint: "leader-worker-set"

- name: "lws | apply the lws GitOps Application (d0: operator)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  when: not (operator_package_skip_d0 | bool)
  vars:
    gitops_component_name: "lws"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-lws-d0"
    gitops_app_extra_helm_values:
      # project.enabled: true must be repeated here even though application-d0.yaml
      # already sets it - gitops_app_extra_helm_values replaces values wholesale
      # rather than merging (see ansible/roles/kueue/tasks/install.yml for the
      # bug this fixes).
      project:
        enabled: true
      operator:
        enabled: true
        subscription:
          operator:
            channel: "{{ operator_package_channel }}"
            source:
              name: "{{ operator_package_catalog }}"
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 15

# No singleton operand CR exists for LeaderWorkerSet - d1 is a no-op
# (gitops/charts/noop), applied here only to keep the Application object
# itself present/synced, same convention ansible/roles/models uses for its
# own no-op d0.
- name: "lws | apply the lws GitOps Application (d1, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "lws"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-lws-d1"
