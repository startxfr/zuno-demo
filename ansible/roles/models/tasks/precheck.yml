---
- name: "models | verify OpenShift AI's DataScienceCluster is ready"
  kubernetes.core.k8s_info:
    api_version: datasciencecluster.opendatahub.io/v1
    kind: DataScienceCluster
    name: zuno-dsc
  register: _models_precheck_dsc

- name: "models | fail if the DataScienceCluster is not ready"
  ansible.builtin.fail:
    msg: "DataScienceCluster zuno-dsc not Ready. Run `make prepare openshift-ai` first."
  when: >-
    (_models_precheck_dsc.resources | default([]) | length) == 0 or
    (_models_precheck_dsc.resources[0].status.phase | default('')) != 'Ready'

- name: "models | precheck summary"
  ansible.builtin.debug:
    msg: "DataScienceCluster is Ready; the model InferenceService can be applied."
