---
# State detection (never fails).
- name: "models | check the models Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-models-d0"

- name: "models | save the d0 check result"
  ansible.builtin.set_fact:
    _models_d0_installed: "{{ _state_check_result }}"

- name: "models | check the models Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-models-d1"

# ADR-0108/roadmap WP-10: report any LMEvalJob results (candidate
# local-model comparison, gitops/charts/models/templates/lmevaljob.yaml)
# so `make d1 check models` surfaces them without a
# separate command. Diagnostic only, never gates _state_is_installed
# below - LM-Eval jobs are one-shot, per-candidate benchmarking runs
# (ADR-0108: "complements - never replaces - the per-agent ADR-0027
# acceptance suites"), not a component this role installs or owns the
# lifecycle of. CRD may not exist yet if trustyai hasn't reconciled,
# hence ignore_errors rather than failing the whole check.
- name: "models | look up LMEvalJob resources (ADR-0108 candidate model comparison)"
  kubernetes.core.k8s_info:
    api_version: trustyai.opendatahub.io/v1alpha1
    kind: LMEvalJob
    namespace: "{{ models_lmeval_namespace | default('zuno-ai-run') }}"
  register: _models_lmevaljobs
  ignore_errors: true

- name: "models | report LMEvalJob results"
  ansible.builtin.debug:
    msg: >-
      LMEvalJob {{ item.metadata.name }}: state={{ item.status.state | default('unknown') }}
      reason={{ item.status.reason | default('unknown') }}
      {{ ('results=' + (item.status.results | default('(none yet)')))
         if (item.status.state | default('')) == 'Complete'
            and (item.status.reason | default('')) == 'Succeeded'
         else '(no trustworthy results: state must be Complete AND reason '
              + 'Succeeded - Complete alone also covers a lost/failed run, '
              + 'e.g. reason=Failed message=ContainerStatusUnknown after a '
              + 'node disruption - see ADR-0108)' }}
  loop: "{{ _models_lmevaljobs.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name | default('?') }}"
  when: (_models_lmevaljobs.resources | default([]) | length) > 0

- name: "models | note absence of LMEvalJob resources"
  ansible.builtin.debug:
    msg: >-
      No LMEvalJob resources found in
      {{ models_lmeval_namespace | default('zuno-ai-run') }} - no
      candidate model comparison has been run yet (ADR-0108, opt-in via
      gitops/charts/models's lmEval.jobs values).
  when: (_models_lmevaljobs.resources | default([]) | length) == 0

# ADR-0201/roadmap WP-27: reports whether the MaaS governance resources
# (gitops/charts/models/templates/maas.yaml) reconciled, so
# `make d1 check models` surfaces MaaS state without a separate command.
# Same diagnostic-only posture as the LMEvalJob block above: never gates
# _state_is_installed - MaaS is an opt-in governance layer on top of the
# model this role already owns, not something this role installs itself.
# Skips gracefully (a clear "not enabled" message, no error) when
# gitops/charts/models's maas.enabled is false, the chart's own default.
- name: "models | look up MaaSModelRef resources (ADR-0201 MaaS governance)"
  kubernetes.core.k8s_info:
    api_version: maas.opendatahub.io/v1alpha1
    kind: MaaSModelRef
    namespace: "{{ models_lmeval_namespace | default('zuno-ai-run') }}"
  register: _models_maasmodelrefs
  ignore_errors: true

- name: "models | report MaaSModelRef/Subscription/AuthPolicy reconciliation"
  ansible.builtin.debug:
    msg: >-
      MaaSModelRef {{ item.metadata.name }}: found and reconciled by the
      MaaS operator (status={{ item.status | default('(no status reported)') }}).
      See the WP-27 brief's operator follow-up for the full acceptance
      checklist (subscription/AuthPolicy verification, end-to-end request,
      metric/trace correlation) - this check only confirms the resource
      itself synced, not that every governance behavior it declares works.
  loop: "{{ _models_maasmodelrefs.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name | default('?') }}"
  when: (_models_maasmodelrefs.resources | default([]) | length) > 0

- name: "models | note MaaS governance is not enabled"
  ansible.builtin.debug:
    msg: >-
      No MaaSModelRef resources found in
      {{ models_lmeval_namespace | default('zuno-ai-run') }} - MaaS
      governance is not enabled for this deployment (ADR-0201, opt-in via
      gitops/charts/models's maas.enabled value) or has not synced yet.
  when: (_models_maasmodelrefs.resources | default([]) | length) == 0

# ADR-0301 (WP-34 Part B): reports whether every LoRA adapter declared in
# gitops/charts/models's loraAdapters values is actually loaded and
# healthy on the running vLLM workload. Diagnostic only, never gates
# _state_is_installed below - same posture as the LMEvalJob/MaaS blocks
# above: an undeclared or unloaded adapter is a real gap an operator
# needs to see, but it doesn't mean the base model deployment itself is
# unhealthy. Reads the declared set from the LLMInferenceService's own
# zuno.io/lora-adapter-classifications annotation (templates/
# llminferenceservice-qwen.yaml, ADR-0521 - formerly the ServingRuntime's,
# before that was retired) rather than re-parsing values.yaml, so this
# check always agrees with what's actually deployed, not what's merely
# checked in. UNVERIFIED against a live cluster: vLLM's OpenAI-compatible
# /v1/models endpoint is assumed to list loaded LoRA module names
# alongside the base model id (the documented behavior for
# --enable-lora) - confirm against the real workload and correct this
# task if the response shape differs.
- name: "models | look up the LLMInferenceService's declared LoRA adapters"
  kubernetes.core.k8s_info:
    api_version: serving.kserve.io/v1alpha2
    kind: LLMInferenceService
    namespace: "{{ models_lmeval_namespace | default('zuno-ai-run') }}"
    name: "{{ models_inference_service_name | default('qwen36-27b-instruct') }}"
  register: _models_llminferenceservice
  ignore_errors: true

- name: "models | parse the declared adapter set"
  ansible.builtin.set_fact:
    _models_declared_adapters: >-
      {{
        (_models_llminferenceservice.resources | default([{}]) | first
        ).metadata.annotations['zuno.io/lora-adapter-classifications']
        | default('[]') | from_json
      }}
  when: (_models_llminferenceservice.resources | default([]) | length) > 0

- name: "models | note no LoRA adapters are declared"
  ansible.builtin.debug:
    msg: >-
      No zuno.io/lora-adapter-classifications annotation found (or the
      LLMInferenceService itself hasn't synced) - no LoRA adapters are
      declared for this deployment (ADR-0301, opt-in via
      gitops/charts/models's loraAdapters value, default empty).
  when: (_models_declared_adapters | default([]) | length) == 0

# ADR-0521: https on port 8000, not http on 8080 - the LLMInferenceService
# workload pod terminates real TLS with a cert issued by the cluster's own
# openshift-service-serving-signer CA (same as ai-gateway's own
# LOCAL_GPT_OSS_CA_BUNDLE trusts), which this ansible control host has no
# reason to already trust - validate_certs: false since this check is
# diagnostic-only (ignore_errors: true) and never gates install state.
- name: "models | query the workload's loaded models"
  ansible.builtin.uri:
    url: "https://{{ models_workload_service | default('qwen36-27b-instruct-kserve-workload-svc') }}.{{ models_lmeval_namespace | default('zuno-ai-run') }}.svc.cluster.local:8000/v1/models"
    method: GET
    status_code: [200]
    return_content: true
    validate_certs: false
  register: _models_loaded_models
  ignore_errors: true
  when: (_models_declared_adapters | default([]) | length) > 0

- name: "models | report each declared adapter's loaded/healthy state"
  ansible.builtin.debug:
    msg: >-
      LoRA adapter {{ item.name }} (classification={{ item.classification }}):
      {{ 'loaded and healthy' if item.name in
         ((_models_loaded_models.json.data | default([])) | map(attribute='id') | list)
         else 'NOT found in the predictor''s /v1/models response - check the pod logs '
         + '(likely cause: nothing has downloaded this adapter to ' + item.path + ' yet, '
         + 'see values.yaml''s own loraAdapters comment)' }}
  loop: "{{ _models_declared_adapters | default([]) }}"
  loop_control:
    label: "{{ item.name | default('?') }}"
  when: >-
    (_models_declared_adapters | default([]) | length) > 0
    and (_models_loaded_models is defined)
    and (_models_loaded_models.status | default(0)) == 200

- name: "models | note the predictor's /v1/models could not be reached"
  ansible.builtin.debug:
    msg: >-
      Could not confirm declared LoRA adapters are loaded: the predictor's
      /v1/models endpoint did not respond 200
      (got {{ _models_loaded_models.status | default('no response') }}).
      Confirm gitops/apps/models has synced and the predictor pod is Ready.
  when: >-
    (_models_declared_adapters | default([]) | length) > 0
    and (
      (_models_loaded_models is not defined)
      or (_models_loaded_models.status | default(0)) != 200
    )

- name: "models | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
  vars:
    _state_is_installed: "{{ _models_d0_installed and _state_check_result }}"
