---
# Selects the vLLM image OpenShift AI actually publishes (a Template in
# redhat-ods-applications), matched by name since RHOAI's label taxonomy isn't verified.
- name: "models | discover the vLLM serving-runtime Templates OpenShift AI published (ADR-0048)"
  kubernetes.core.k8s_info:
    api_version: template.openshift.io/v1
    kind: Template
    namespace: redhat-ods-applications
  register: _models_ods_templates
  when: models_vllm_image_override is not defined

- name: "models | select vLLM-named templates"
  ansible.builtin.set_fact:
    _models_vllm_templates: >-
      {{
        _models_ods_templates.resources
        | default([])
        | selectattr('metadata.name', 'search', 'vllm', ignorecase=True)
        | list
      }}
  when: models_vllm_image_override is not defined

- name: "models | fail with a clear diagnostic if no vLLM serving-runtime template was published"
  ansible.builtin.fail:
    msg: >-
      No Template with "vllm" in its name was found in
      redhat-ods-applications - this OpenShift AI installation may not
      have the vLLM serving runtime available yet, or publishes it under a
      different naming convention. Templates found in that namespace:
      {{ _models_ods_templates.resources | default([]) | map(attribute='metadata.name') | list }}.
      To bypass discovery and pin an explicitly known-good image, rerun
      with -e models_vllm_image_override=<registry>/<image>:<tag> (ADR-0048
      Security considerations: this is an explicit, conscious override,
      never a silent fallback).
  when:
    - models_vllm_image_override is not defined
    - (_models_vllm_templates | default([]) | length) == 0

# Handles both a literal image and a ${PARAM_NAME} reference resolved
# against the Template's own top-level `parameters` list.
- name: "models | extract the ServingRuntime/ClusterServingRuntime object from the selected template"
  ansible.builtin.set_fact:
    _models_selected_template: "{{ _models_vllm_templates[0] }}"
    _models_runtime_object: >-
      {{
        (_models_vllm_templates[0].objects
          | selectattr('kind', 'in', ['ServingRuntime', 'ClusterServingRuntime'])
          | list
          | first)
        if (_models_vllm_templates[0].objects | selectattr('kind', 'in', ['ServingRuntime', 'ClusterServingRuntime']) | list | length) > 0
        else {}
      }}
  when: models_vllm_image_override is not defined

- name: "models | fail if the template has no ServingRuntime/ClusterServingRuntime object"
  ansible.builtin.fail:
    msg: >-
      Template {{ _models_selected_template.metadata.name }} in
      redhat-ods-applications has no ServingRuntime or
      ClusterServingRuntime object among its objects - cannot discover an
      image from it. Object kinds present:
      {{ _models_selected_template.objects | default([]) | map(attribute='kind') | list }}.
  when:
    - models_vllm_image_override is not defined
    - (_models_runtime_object | default({}) | length) == 0

- name: "models | read the (possibly parameterized) image reference"
  ansible.builtin.set_fact:
    _models_raw_image: "{{ _models_runtime_object.spec.containers[0].image | default('') }}"
  when: models_vllm_image_override is not defined

- name: "models | use the image as-is when it is not a Template parameter reference"
  ansible.builtin.set_fact:
    _models_discovered_vllm_image: "{{ _models_raw_image }}"
  when:
    - models_vllm_image_override is not defined
    - not (_models_raw_image is match('^\$\{[A-Za-z0-9_]+\}$'))

- name: "models | resolve a ${PARAM} placeholder against the template's own parameters"
  vars:
    _models_param_name: "{{ _models_raw_image | regex_replace('^\\$\\{([A-Za-z0-9_]+)\\}$', '\\1') }}"
  ansible.builtin.set_fact:
    _models_discovered_vllm_image: >-
      {{
        (_models_selected_template.parameters
          | default([])
          | selectattr('name', 'equalto', _models_param_name)
          | map(attribute='value')
          | list
          | first) | default('', true)
      }}
  when:
    - models_vllm_image_override is not defined
    - _models_raw_image is match('^\$\{[A-Za-z0-9_]+\}$')

- name: "models | fail if the image could not be resolved to a concrete reference"
  ansible.builtin.fail:
    msg: >-
      Could not resolve a concrete image from template
      {{ _models_selected_template.metadata.name }} (raw value:
      {{ _models_raw_image }}) - either the ServingRuntime's image field
      was empty, or it references a Template parameter with no default
      value (requiring interactive `oc process` input this non-interactive
      pipeline does not collect). Rerun with
      -e models_vllm_image_override=<registry>/<image>:<tag> instead.
  when:
    - models_vllm_image_override is not defined
    - (_models_discovered_vllm_image | default('') | length) == 0

- name: "models | use the explicit override instead of discovery, if given"
  ansible.builtin.set_fact:
    _models_discovered_vllm_image: "{{ models_vllm_image_override }}"
  when: models_vllm_image_override is defined

- name: "models | discovery summary (ADR-0048)"
  ansible.builtin.debug:
    msg: >-
      {{
        'vLLM serving-runtime image: explicit override ' ~ _models_discovered_vllm_image
        if models_vllm_image_override is defined
        else 'vLLM serving-runtime image: ' ~ _models_discovered_vllm_image ~
             ' (discovered from Template ' ~ _models_selected_template.metadata.name ~
             ' in redhat-ods-applications)'
      }}
