---
# State detection (never fails). Day 1 has no real install phase -
# "installed" reports whether this role's prerequisites are ready (former
# precheck.yml content, now informational rather than fail-fast) - not
# "the component is already posed." Does not run the vLLM image
# discovery (discover_vllm_image.yml) - that's an action for
# configure.yml, not a state-detection concern.
- name: "models | look up the DataScienceCluster"
  kubernetes.core.k8s_info:
    api_version: datasciencecluster.opendatahub.io/v1
    kind: DataScienceCluster
    name: zuno-dsc
  register: _models_dsc_lookup

- name: "models | compute install state (prerequisites ready)"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        (_models_dsc_lookup.resources | default([]) | length) > 0
        and (_models_dsc_lookup.resources[0].status.phase | default('')) == 'Ready'
      }}

- name: "models | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_install_state.yml"
