---
- name: "models | discover the vLLM serving-runtime image (ADR-0048)"
  ansible.builtin.include_tasks: discover_vllm_image.yml

# Same optional soft-read as ansible/roles/keycloak: confidential.yml is
# where operator-facing flags/knobs live (zuno_models_s3_bucket/_prefix),
# but every one of them has a default() below, so the file's absence is
# fine.
- name: "models | check for ansible/confidential.yml (optional, only for the zuno_models_* knobs)"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/confidential.yml"
  register: _models_confidential_file

- name: "models | load ansible/confidential.yml if present"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/confidential.yml"
  when: _models_confidential_file.stat.exists

# No OLM operator involved - all content is -d1 (d0 is a no-op).
- name: "models | apply the model serving GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "models"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

- name: "models | resolve the cluster's default StorageClass (WP-118 B5)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_default_storage_class.yml"

- name: "models | apply the model serving GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "models"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 20
    # Overrides the chart's hardcoded values.yaml default with the image
    # discovered above (or an explicit models_vllm_image_override).
    gitops_app_extra_helm_values:
      # WP-118 B5: the chart default is this cluster's name for it;
      # discovered here so a new cluster gets its own.
      modelStorage:
        storageClassName: "{{ cluster_default_storage_class }}"
      image:
        vllm: "{{ _models_discovered_vllm_image }}"
      # Which bucket/directory contain the model weights
      # (s3://<bucket>/<prefix>/<servedModelName>/).
      modelsS3:
        bucket: "{{ zuno_models_s3_bucket | default('zuno-demo-rag-corpus') }}"
        prefix: "{{ zuno_models_s3_prefix | default('models') }}"
      # ADR-0524 (WP-085), TEMPORAIRE : ouvre le predictor qwen a
      # openshift-lightspeed. Doit etre pose ICI et non dans
      # gitops/apps/models/application-d1.yaml : gitops_app_extra_helm_values
      # REMPLACE spec.source.helm.values en bloc, donc une valeur ecrite dans
      # l'Application serait silencieusement perdue - exactement la derive qui a
      # fait echouer le premier install de lightspeed-config le 2026-08-26.
      #
      # A retirer en meme temps que le bloc lightspeed de
      # gitops/charts/models/templates/networkpolicy-qwen.yaml, des que MaaS
      # sait de nouveau resoudre les subscriptions (WP-076).
      lightspeed:
        enabled: "{{ models_lightspeed_direct | default(true) | bool }}"
      # 2026-09-01: same REMPLACE-en-bloc trap as lightspeed above - must
      # be set here, not in gitops/apps/models/application-d1.yaml. Feeds
      # maas.externalOIDC's derived Keycloak issuer
      # (gitops/charts/models/templates/maas.yaml).
      clusterBaseDomain: "{{ cluster_base_domain }}"
