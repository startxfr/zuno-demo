---
- name: "models | discover the vLLM serving-runtime image (ADR-0048)"
  ansible.builtin.include_tasks: discover_vllm_image.yml

# No OLM operator involved - all content is -d1 (d0 is a no-op).
- name: "models | apply the model serving GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "models"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

- name: "models | apply the model serving GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "models"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 20
    # Overrides the chart's hardcoded values.yaml default with the image
    # discovered above (or an explicit models_vllm_image_override).
    gitops_app_extra_helm_values:
      image:
        vllm: "{{ _models_discovered_vllm_image }}"
