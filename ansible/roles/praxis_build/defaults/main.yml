---
# ADR-0620 (WP-291): Praxis AI built from source by the source-image-build Pipeline
# (gitops/charts/openshift-pipelines) and pushed to quay.io/zuno/praxis-ai.
# Switch the source per cluster with zuno_praxis_build_source (fork | upstream) in
# ansible/clusters/<cluster>.yml, or once with -e zuno_praxis_build_source=upstream.
zuno_praxis_build_source: fork
zuno_praxis_build_image_repository: quay.io/zuno/praxis-ai
zuno_praxis_build_namespace: zuno-ai-build
# Only these two repositories may be built (ADR-0620, security considerations). `revision` is a
# branch, a tag or a full SHA; it is resolved to a full SHA before the run, and the image tag
# carries it. Feature names were checked in each server/Cargo.toml on 2026-11-17:
# api-key-auth-filter exists only in the fork.
zuno_praxis_build_sources:
  fork:
    url: https://github.com/redhat-et/praxis-ai
    revision: main
    features: full,api-key-auth-filter,token-rate-limit-filter,opentelemetry
  upstream:
    url: https://github.com/praxis-proxy/ai
    revision: main
    features: full,token-rate-limit-filter,opentelemetry
# A Rust release build: several GiB of memory and tens of minutes. The CPU request stays at 1:
# the general workers of demo333 have under 2.1 CPU unrequested (WP-292 live recon,
# docs/roadmap/evidence/wp-292-live-recon-2026-11-17.md, finding 5), so a 4-CPU request would not
# schedule there. No CPU limit, so the build uses idle CPU; memory is bounded.
zuno_praxis_build_resources:
  requests: {cpu: "1", memory: 6Gi}
  limits: {memory: 16Gi}
zuno_praxis_build_timeout: 2h
zuno_praxis_build_wait_retries: 120
zuno_praxis_build_wait_delay: 30
