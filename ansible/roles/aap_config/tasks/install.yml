---
# ADR-0354 clause 4 (WP-073, Path A): registers this repository in the
# running AAP instance - the zuno organization, a Controller API token,
# then the zuno-demo Project / zuno inventory / zuno-cluster-reader
# credential / zuno-day0-check Job Template as resource-operator CRs
# (tower.ansible.com/v1alpha1, shipped by gitops/charts/aap's own operator
# bundle - no second Subscription), and finally the Keycloak SSO
# authenticator on the Gateway (ADR-0354 clause 6, closed here).
#
# Three things have no CRD and are driven via the Gateway/Controller API
# instead (same ansible.builtin.uri Basic-auth pattern the aap role's
# subscription step already proved live): the organization, the inventory's
# localhost host, and the Job Template's credential attachment (the
# JobTemplate CRD has no credentials field - confirmed live against the
# CRD schema, WP-073). All are idempotent GET-then-POST.

# Needed for zuno_gitops_target_revision below (ADR-0517: a cluster
# tracking a work branch must point the AAP Project at that SAME branch,
# or every AAP-launched day1/2/3 playbook runs main's code without the
# branch's fixes). check_confidential_var_loaders enforces the pair.
- name: "aap-config | check for ansible/confidential.yml"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/confidential.yml"
  register: _aap_config_confidential_file

- name: "aap-config | load ansible/confidential.yml if present"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/confidential.yml"
  when: _aap_config_confidential_file.stat.exists

- name: "aap-config | apply the aap-config GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "aap-config"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-aap-config-d0"

# --- Gateway/Controller API bootstrap (org + token) -------------------------

- name: "aap-config | look up the Gateway Route"
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    namespace: zuno-aap
    name: aap
  register: _aap_config_route

- name: "aap-config | fail if the Gateway Route doesn't exist"
  ansible.builtin.fail:
    msg: >-
      Route 'aap' not found in zuno-aap - run `make d0 install aap` first
      (aap-config configures a running AAP instance, it never installs
      one).
  when: (_aap_config_route.resources | default([]) | length) == 0

- name: "aap-config | read the admin password from the aap-admin Secret"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: zuno-aap
    name: aap-admin
  register: _aap_config_admin_secret
  no_log: true

- name: "aap-config | resolve Gateway URL and admin credentials"
  ansible.builtin.set_fact:
    _aap_config_gateway_url: "https://{{ _aap_config_route.resources[0].spec.host }}"
    _aap_config_admin_password: "{{ _aap_config_admin_secret.resources[0].data.password | b64decode }}"
  no_log: true

# Same reasoning as the aap role's subscription step: ArgoCD health on the
# aap Applications does not imply the Gateway API answers.
- name: "aap-config | wait for the Gateway API to answer"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/"
    method: GET
    validate_certs: false
    status_code: 200
  register: _aap_config_api_ping
  until: _aap_config_api_ping.status | default(0) == 200
  retries: 60
  delay: 10

# --- Remove AAP's shipped default objects (ADR-0354/WP-098) -----------------

- name: "aap-config | remove AAP's shipped default Project/Job Template/Inventory"
  ansible.builtin.include_tasks: remove_aap_defaults.yml

# Organizations are GATEWAY-level resources in AAP 2.5+ (the platform
# resource server owns them and syncs them down into Controller/Hub/EDA) -
# a direct POST on /api/controller/v2/organizations/ is rejected with
# "Failed to sync resource to resource server" (HTTP 400, confirmed live
# 2026-08-25). Create on the gateway API; the sync makes it visible to
# the Controller-side lookups the resource operator does.
- name: "aap-config | check whether the {{ aap_config_organization | default('zuno') }} organization exists"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/gateway/v1/organizations/?name={{ aap_config_organization | default('zuno') }}"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_org_lookup
  no_log: true

- name: "aap-config | create the {{ aap_config_organization | default('zuno') }} organization"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/gateway/v1/organizations/"
    method: POST
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "{{ aap_config_organization | default('zuno') }}"
      description: "Zuno demo platform organization (WP-073)"
    status_code: 201
  when: (_aap_config_org_lookup.json.count | default(0) | int) == 0
  no_log: true

- name: "aap-config | wait for the organization to sync down to Controller"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/organizations/?name={{ aap_config_organization | default('zuno') }}"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_org_synced
  until: (_aap_config_org_synced.json.count | default(0) | int) > 0
  retries: 30
  delay: 5
  no_log: true

# --- Gateway API token, persisted to Vault (shown-once) ---------------------
# The tower.ansible.com CRs authenticate through a connection_secret
# holding an access token. On AAP 2.5+ tokens are GATEWAY resources
# (confirmed live 2026-08-25: /api/controller/v2/tokens/ is 404 both via
# the gateway and against the controller service directly - controller
# token management is gone, centralized in the gateway), and a gateway
# token authenticates fine against the /api/controller/... paths through
# the gateway (ping/projects/organizations all 200 with Bearer, only the
# /me/ endpoint has a lazy-user-sync quirk this flow never touches).
# Tokens are shown once at creation, so Vault (zuno/aap/controller-token)
# is the durable source and the aap-config chart's ExternalSecret
# re-materializes it.
#
# Idempotence is based on the token still WORKING, not merely on the Vault
# path existing. That distinction is the whole point: `make d1 uninstall
# aap` drops the `aap` database (ansible/roles/aap/tasks/uninstall.yml,
# WP-077), which is the Gateway's own DB and therefore holds the OAuth
# token rows. A reinstall leaves Vault holding a string the gateway no
# longer recognizes, and every tower.ansible.com CR then authenticates
# with it and gets 401 - silently, because the resource operator's create
# task is `ignore_errors`, so the CRs report Successful while creating
# nothing. That is exactly how the `zuno` inventory went missing and hung
# this role's own lookup below for 30 retries with no usable error.
#
# So: probe first, re-mint only on a token the gateway actually rejects.
# The original concern behind check-first still holds (a fresh token per
# run would litter the gateway with orphans and desync the Secret) and is
# preserved - a valid token is never replaced.

- name: "aap-config | locate the Vault server pod"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: zuno-vault
    label_selectors:
      - "app.kubernetes.io/name=vault"
      - "component=server"
  register: _vault_pod

- name: "aap-config | read the Vault bootstrap credentials"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: zuno-vault
    name: vault-bootstrap-credentials
  register: _aap_config_vault_creds
  no_log: true

- name: "aap-config | fail if Vault isn't bootstrapped"
  ansible.builtin.fail:
    msg: >-
      vault-bootstrap-credentials not found in zuno-vault - run
      `make d0 install vault` first.
  when: >-
    (_vault_pod.resources | default([]) | length) == 0 or
    (_aap_config_vault_creds.resources | default([]) | length) == 0

- name: "aap-config | set the Vault connection fact"
  ansible.builtin.set_fact:
    _vault_root_token: "{{ _aap_config_vault_creds.resources[0].data.root_token | b64decode }}"
  no_log: true

- name: "aap-config | check whether zuno/aap/controller-token already exists in Vault"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv get -format=json zuno/aap/controller-token"
  register: _aap_config_token_existing
  changed_when: false
  failed_when: false
  no_log: true

# NOT /api/controller/v2/ping/: that endpoint answers 200 even with no
# credentials at all (verified live 2026-08-27), so it can never tell a
# live token from a dead one. /organizations/ is the endpoint the resource
# operator itself fails on, so probing it reproduces the real failure
# rather than approximating it. /me/ is avoided for the lazy-user-sync
# quirk noted at the top of this section.
- name: "aap-config | probe whether the Vault-held Gateway token still authenticates"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/organizations/"
    method: GET
    headers:
      Authorization: "Bearer {{ (_aap_config_token_existing.stdout | from_json).data.data.token }}"
    validate_certs: false
    status_code: [200, 401, 403]
  register: _aap_config_token_probe
  when: _aap_config_token_existing.rc == 0
  changed_when: false
  failed_when: false
  no_log: true

- name: "aap-config | decide whether the Gateway token must be (re-)minted"
  ansible.builtin.set_fact:
    _aap_config_token_needs_mint: >-
      {{ (_aap_config_token_existing.rc != 0)
         or ((_aap_config_token_probe.status | default(401)) != 200) }}

- name: "aap-config | report that a dead Gateway token is being replaced"
  ansible.builtin.debug:
    msg: >-
      The token in Vault zuno/aap/controller-token no longer authenticates
      against AAP (HTTP {{ _aap_config_token_probe.status | default('n/a') }}) - re-minting.
      This is the expected outcome after an `aap` uninstall/reinstall cycle,
      which drops the Gateway database the token lives in.
  when:
    - _aap_config_token_existing.rc == 0
    - _aap_config_token_needs_mint | bool

- name: "aap-config | mint a Gateway API access token (first run only - shown once)"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/gateway/v1/tokens/"
    method: POST
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      description: "zuno-aap-config resource-operator connection (WP-073)"
    status_code: 201
  register: _aap_config_token_minted
  when: _aap_config_token_needs_mint | bool
  no_log: true

- name: "aap-config | persist the Gateway token to Vault (first run only)"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/aap/controller-token
      token={{ _aap_config_token_minted.json.token | quote }}"
  when: _aap_config_token_needs_mint | bool
  no_log: true

# The ExternalSecret refreshes hourly. Without forcing it here, the Secret
# the four tower.ansible.com CRs read would keep serving the dead token for
# up to an hour - long past the inventory wait below, so the role would
# still fail despite having just fixed the credential.
- name: "aap-config | force the aap-controller-token Secret to pick up the new token"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/force_externalsecret_refresh.yml"
  vars:
    es_name: aap-controller-token
    es_namespace: zuno-aap
    es_expect_key: token
    es_expect_value: "{{ _aap_config_token_minted.json.token }}"
  when: _aap_config_token_needs_mint | bool

# --- The CRs themselves -----------------------------------------------------

- name: "aap-config | apply the aap-config GitOps Application (d1: Project/Inventory/Credential/JobTemplate CRs)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "aap-config"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-aap-config-d1"
    # ADR-0517 live finding (demo333, 2026-09-06): the chart's
    # project.branch default is main - correct for every cluster tracking
    # main, silently WRONG for a cluster deploying from a work branch:
    # its AAP-launched workflows then execute main's playbooks without
    # the branch's fixes. Same Application-level injection as
    # apply_gitops_app.yml's targetRevision override, same variable.
    gitops_app_extra_helm_values: >-
      {{ {'aapConfig': {'enabled': true}}
         | combine({'project': {'branch': zuno_gitops_target_revision}}
                   if zuno_gitops_target_revision is defined else {},
                   recursive=True) }}
    gitops_app_wait_retries: 30
    gitops_app_wait_delay: 10

# Census of what the CRs were supposed to produce, BEFORE waiting on it.
# A CR reporting Successful proves nothing (the resource operator's create
# task is ignore_errors, so a 401 leaves the CR green and the object
# absent) - only the Controller API is authoritative. Cheap GETs against
# an API this role already talks to, turning a 5-minute opaque wait into a
# targeted nudge.
# ADR-0418/WP-094/WP-095: census now spans every credential, every Job
# Template and every Workflow Template in aap_config_credentials/
# aap_config_job_templates/aap_config_workflow_templates (defaults/
# main.yml, mirrors gitops/charts/aap-config/values.yaml), not just the
# original zuno-cluster-reader/zuno-day0-check pair.
- name: "aap-config | census the objects the CRs are supposed to have produced"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/{{ item.path }}/?name={{ item.name }}"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 401, 403]
  register: _aap_config_census
  loop: >-
    {{ [{'path': 'projects', 'name': aap_config_project_name},
        {'path': 'inventories', 'name': aap_config_inventory_name}]
       + (aap_config_credentials | map(attribute='name') | map('community.general.dict_kv', 'name') | map('combine', {'path': 'credentials'}) | list)
       + (aap_config_job_templates | map(attribute='name') | map('community.general.dict_kv', 'name') | map('combine', {'path': 'job_templates'}) | list)
       + (aap_config_workflow_templates | map(attribute='name') | map('community.general.dict_kv', 'name') | map('combine', {'path': 'workflow_job_templates'}) | list) }}
  loop_control:
    label: "{{ item.path }}/{{ item.name }}"
  changed_when: false
  failed_when: false
  no_log: true

# Three distinct defects to catch. The second bit on 2026-08-27: an
# object can EXIST and still be unusable. `zuno-day0-check` was present
# with inventory: None while ask_inventory_on_launch is false, i.e. a
# Job Template that cannot be launched at all - which a plain existence
# test would have called healthy. The third bit on demo333's from-scratch
# install (ADR-0517, 2026-09-06): a Workflow Template can exist with ZERO
# nodes - the operator creates the workflow shell, then every node attach
# fails ("Unable to Find unified_job_template", ignore_errors'd) because
# the Job Templates it references don't exist in Controller yet, and the
# CR still reports Successful. Root cause of that third defect: on a
# fresh cluster ALL tower.ansible.com CRs land at once and the operator
# reconciles its queue concurrently (--max-concurrent-reconciles=15) with
# no cross-CR ordering - the chart's sync-waves only order CR *creation* -
# so JobTemplate/WorkflowTemplate CRs reconciled before the Project/
# Inventory reached Controller fail-and-ignore, then sit "Successful"/
# "Awaiting next reconciliation" forever.
- name: "aap-config | census each Workflow Template's node count (a zero-node workflow is unlaunchable)"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/workflow_job_template_nodes/?workflow_job_template__name={{ item }}&page_size=1"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 401, 403]
  register: _aap_config_wf_node_census
  loop: "{{ aap_config_workflow_templates | map(attribute='name') | list }}"
  changed_when: false
  failed_when: false
  no_log: true

# Which CRs to bounce: every census object that is missing (or whose
# lookup failed outright), plus every workflow whose node count is 0,
# plus - when the Gateway token was just re-minted - all of them, since
# a re-minted token only reaches a CR on its next reconcile.
- name: "aap-config | list the tower.ansible.com CRs whose Controller object is missing or unusable"
  ansible.builtin.set_fact:
    _aap_config_crs_to_bounce: >-
      {%- set kind_by_path = {'projects': 'AnsibleProject',
                              'inventories': 'AnsibleInventory',
                              'credentials': 'AnsibleCredential',
                              'job_templates': 'JobTemplate',
                              'workflow_job_templates': 'WorkflowTemplate'} -%}
      {%- set out = [] -%}
      {%- if _aap_config_token_needs_mint | bool -%}
        {%- for r in _aap_config_census.results -%}
          {%- set _ = out.append({'kind': kind_by_path[r.item.path], 'name': r.item.name}) -%}
        {%- endfor -%}
      {%- else -%}
        {%- for r in _aap_config_census.results -%}
          {%- if (r.json.count | default(0) | int) == 0 -%}
            {%- set _ = out.append({'kind': kind_by_path[r.item.path], 'name': r.item.name}) -%}
          {%- endif -%}
        {%- endfor -%}
        {%- for r in _aap_config_wf_node_census.results -%}
          {%- if (r.json.count | default(0) | int) == 0 -%}
            {%- set _ = out.append({'kind': 'WorkflowTemplate', 'name': r.item}) -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}
      {{ out | unique }}

# The previous mechanism here annotated the CRs to "force a reconcile".
# Proven DEAD live on demo333 (ADR-0517, 2026-09-06): all 18 JobTemplate
# CRs were annotated and the operator did nothing for 7+ minutes - the
# ansible-operator's event filter ignores metadata-only changes, and
# ArgoCD re-applying an identical manifest triggers nothing either. What
# does work, proven the same day (16s CR-absent to Controller-object
# present): DELETE the CR and let this Application's selfHeal recreate
# it - a recreated CR always gets a fresh initial reconcile, which now
# succeeds because the Project/Inventory exist. The CRs carry no
# finalizer, so deletion is immediate, and ArgoCD owns them (prune+
# selfHeal), so recreation is guaranteed, not hoped for.
- name: "aap-config | bounce the broken CRs (delete; the Application's selfHeal recreates them)"
  kubernetes.core.k8s:
    state: absent
    api_version: tower.ansible.com/v1alpha1
    kind: "{{ item.kind }}"
    namespace: zuno-aap
    name: "{{ item.name }}"
    wait: true
  loop: "{{ _aap_config_crs_to_bounce }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.name }}"
  when: _aap_config_crs_to_bounce | length > 0

- name: "aap-config | wait for ArgoCD to recreate each bounced CR"
  kubernetes.core.k8s_info:
    api_version: tower.ansible.com/v1alpha1
    kind: "{{ item.kind }}"
    namespace: zuno-aap
    name: "{{ item.name }}"
  register: _aap_config_cr_recreated
  until: (_aap_config_cr_recreated.resources | default([]) | length) > 0
  retries: 30
  delay: 10
  loop: "{{ _aap_config_crs_to_bounce }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.name }}"
  when: _aap_config_crs_to_bounce | length > 0

# ArgoCD reports the CRs Synced/Healthy the moment they're applied (no
# custom health checks exist for tower.ansible.com kinds) - the resource
# operator reconciles them into real Controller objects asynchronously.
# Poll the Controller API for the terminal objects before the follow-up
# steps that need their IDs.
- name: "aap-config | wait for the Project to exist in Controller"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/projects/?name={{ aap_config_project_name | default('zuno-demo') }}"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_project_lookup
  until: (_aap_config_project_lookup.json.count | default(0) | int) > 0
  retries: 30
  delay: 10
  no_log: true

# The Project's own AnsibleProject CR reconciles exactly once, ever: the
# operator's `project` role (confirmed live 2026-08-30, WP-098) unconditionally
# `end_play`s the instant `status.isFinished` is true, regardless of any later
# spec/CR change, and there is no CRD field to force a re-sync - so a Job
# Template referencing a playbook added to this repo AFTER the Project's
# first-ever reconcile fails outright with "Playbook not found for project."
# (hit live: `zuno-day3-sign`, added 2026-08-28, against a Project last synced
# 2026-08-25). Triggered here via the Controller API directly, bypassing the
# stuck CR entirely - idempotent, ~15s, and the only way this checkout ever
# refreshes again.
# ADR-0517 live finding (demo333, 2026-09-06): a pre-existing Controller
# project keeps whatever branch it was created with - the AnsibleProject
# CR reconciles exactly once (see the re-sync comment below), so even the
# corrected CR spec above never reaches the live project. Converge it
# directly via the API; the SCM re-sync right below then checks out the
# right branch. No-op on any cluster already tracking the right branch.
- name: "aap-config | converge the Project's tracked branch to {{ zuno_gitops_target_revision | default('main') }}"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/projects/{{ _aap_config_project_lookup.json.results[0].id }}/"
    method: PATCH
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      scm_branch: "{{ zuno_gitops_target_revision | default('main') }}"
    status_code: 200
  when: >-
    (_aap_config_project_lookup.json.results[0].scm_branch | default(''))
    != (zuno_gitops_target_revision | default('main'))
  no_log: true

- name: "aap-config | trigger a Project SCM re-sync (the Project CR itself never re-syncs)"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/projects/{{ _aap_config_project_lookup.json.results[0].id }}/update/"
    method: POST
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    # The Controller API returns 202 (Accepted, async job queued) here -
    # confirmed live 2026-08-30, contradicting an initial guess of 201
    # made from a manual curl test that never actually checked the HTTP
    # status code, only the JSON body.
    status_code: 202
  register: _aap_config_project_update
  no_log: true

- name: "aap-config | wait for the Project SCM re-sync to finish"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/project_updates/{{ _aap_config_project_update.json.id }}/"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_project_update_status
  until: (_aap_config_project_update_status.json.status | default('')) in ['successful', 'failed', 'error', 'canceled']
  retries: 30
  delay: 5
  no_log: true

- name: "aap-config | fail if the Project SCM re-sync did not succeed"
  ansible.builtin.fail:
    msg: >-
      Project SCM re-sync (project_update
      {{ _aap_config_project_update.json.id }}) ended in status
      '{{ _aap_config_project_update_status.json.status }}', not
      'successful'. Every Job Template lookup below depends on this
      checkout being current - check
      {{ _aap_config_gateway_url }}/#/jobs/project/{{ _aap_config_project_update.json.id }}
      for details.
  when: _aap_config_project_update_status.json.status != 'successful'

- name: "aap-config | wait for the Job Template to exist in Controller"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/job_templates/?name={{ aap_config_job_template_name | default('zuno-day0-check') }}"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_jt_lookup
  until: (_aap_config_jt_lookup.json.count | default(0) | int) > 0
  retries: 30
  delay: 10
  no_log: true

# --- localhost host (no CRD field for inventory hosts) ----------------------

- name: "aap-config | look up the inventory"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/inventories/?name={{ aap_config_inventory_name | default('zuno') }}"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_inventory_lookup
  until: (_aap_config_inventory_lookup.json.count | default(0) | int) > 0
  retries: 30
  delay: 10
  no_log: true

- name: "aap-config | check whether the localhost host exists in the inventory"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/inventories/{{ _aap_config_inventory_lookup.json.results[0].id }}/hosts/?name=localhost"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_host_lookup
  no_log: true

- name: "aap-config | add the localhost host to the inventory"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/inventories/{{ _aap_config_inventory_lookup.json.results[0].id }}/hosts/"
    method: POST
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: localhost
      variables: '{"ansible_connection": "local"}'
    status_code: 201
  when: (_aap_config_host_lookup.json.count | default(0) | int) == 0
  no_log: true

# --- credential attach (no CRD field on JobTemplate) ------------------------

- name: "aap-config | look up the cluster credential"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/credentials/?name={{ aap_config_credential_name | default('zuno-cluster-reader') }}"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_credential_lookup
  until: (_aap_config_credential_lookup.json.count | default(0) | int) > 0
  retries: 30
  delay: 10
  no_log: true

- name: "aap-config | check which credentials the Job Template already has"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/job_templates/{{ _aap_config_jt_lookup.json.results[0].id }}/credentials/"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_jt_credentials
  no_log: true

- name: "aap-config | attach the cluster credential to the Job Template"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/job_templates/{{ _aap_config_jt_lookup.json.results[0].id }}/credentials/"
    method: POST
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      id: "{{ _aap_config_credential_lookup.json.results[0].id }}"
    status_code: 204
  when: >-
    (_aap_config_jt_credentials.json.results | default([])
     | selectattr('id', 'equalto', _aap_config_credential_lookup.json.results[0].id)
     | list | length) == 0
  no_log: true

# --- Job Template rollout for Day 1/Day 2/Day 3 (ADR-0418/WP-094) -----------
# The block above only ever wired zuno-day0-check (kept as-is - the
# mcp-aap section below still depends on its _aap_config_jt_lookup/
# _aap_config_credential_lookup facts). Every other entry in
# aap_config_job_templates (defaults/main.yml) gets the same credential
# attachment plus, where declared, a target_component Survey - via
# tasks/wire_job_template.yml, included once per template rather than
# duplicating the block above 13 more times.
- name: "aap-config | wire every Job Template's credential and Survey"
  ansible.builtin.include_tasks: wire_job_template.yml
  vars:
    _wire_jt: "{{ item }}"
  loop: "{{ aap_config_job_templates }}"
  loop_control:
    label: "{{ item.name }}"

# --- Workflow Template rollout for Day 1/Day 2 (ADR-0418 clause 6/WP-095) ---
# No credential/Survey wiring needed here - every node launches an
# already-wired Job Template above, so a Workflow Template only needs to
# exist. `unified_job_template.name` resolution against a live Job
# Template happens inside the resource operator itself; this wait only
# confirms the WorkflowTemplate CR's own Controller-side object appeared,
# the same "CR Synced/Healthy proves nothing" caution as everywhere else
# in this file.
- name: "aap-config | wait for every Workflow Template to exist in Controller"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/workflow_job_templates/?name={{ item.name }}"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_wft_lookup
  until: (_aap_config_wft_lookup.json.count | default(0) | int) > 0
  retries: 30
  delay: 10
  loop: "{{ aap_config_workflow_templates }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

# --- launch-RBAC for the gated templates (ADR-0418 Security considerations
#     / WP-103) -------------------------------------------------------------
- name: "aap-config | wire launch-RBAC (Teams/role_team_assignments) on the gated templates"
  ansible.builtin.include_tasks: wire_launch_rbac.yml

# --- mcp-aap least-privilege identity (ADR-0355 clause 3, WP-074) -----------
# ADR-0355 requires mcp-aap to authenticate as a least-privilege AAP user
# that can launch zuno-day0-check and read platform status - never as
# admin. Note this explicitly excludes zuno/aap/controller-token minted
# above: /api/gateway/v1/tokens/ mints for the *authenticated* user, and
# that call authenticates as admin, so that token carries full admin
# privilege despite its narrow description.
#
# AAP 2.5+ RBAC shape, confirmed live 2026-08-26 against 2.7:
#   - /api/controller/v2/role_metadata/ lists awx.execute_jobtemplate as an
#     assignable permission on content type `awx.jobtemplate`, so a custom
#     role definition scoped to ONE Job Template object is supported. That
#     object-scoped grant is what stops this token launching anything else.
#   - the read half is the gateway user's own `is_platform_auditor` flag
#     rather than a second role assignment - it is the platform-native
#     spelling of the managed "Platform Auditor" definition (which carries
#     exactly awx.view_jobtemplate/view_project/view_inventory +
#     shared.view_organization) and syncs down with the user.
#   - "Organization Viewer" is NOT a substitute for the read half: it grants
#     only shared.view_organization/view_team, and zuno-day0-check has
#     organization=null anyway, so org-scoped roles never reach it.
#
# Users are GATEWAY resources (same lesson as organizations above) and sync
# down into Controller with a *different* id, so the role assignment below
# resolves the Controller-side id rather than reusing the gateway one.

- name: "aap-config | seed the mcp-aap user's password in Vault (idempotent - first run only)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  vars:
    vault_seed_path: aap/mcp-user
    vault_seed_fields:
      username: "{{ aap_config_mcp_username | default('zuno-mcp') }}"
      password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"

- name: "aap-config | read the mcp-aap user's password back from Vault"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv get -format=json zuno/aap/mcp-user"
  register: _aap_config_mcp_user_vault
  changed_when: false
  no_log: true

- name: "aap-config | set the mcp-aap user facts"
  ansible.builtin.set_fact:
    _aap_config_mcp_username: "{{ aap_config_mcp_username | default('zuno-mcp') }}"
    _aap_config_mcp_password: "{{ (_aap_config_mcp_user_vault.stdout | from_json).data.data.password }}"
  no_log: true

- name: "aap-config | check whether the mcp-aap Gateway user exists"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/gateway/v1/users/?username={{ _aap_config_mcp_username }}"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_mcp_user_lookup
  no_log: true

# is_superuser explicitly false: the gateway's own "superuser-ocp-paas-ops"
# authenticator_map only revokes superuser for authenticator-sourced logins,
# and this is a local user - so the flag has to be right at creation.
- name: "aap-config | create the least-privilege mcp-aap Gateway user"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/gateway/v1/users/"
    method: POST
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      username: "{{ _aap_config_mcp_username }}"
      password: "{{ _aap_config_mcp_password }}"
      first_name: zuno
      last_name: mcp-aap
      is_superuser: false
      is_platform_auditor: true
    status_code: 201
  register: _aap_config_mcp_user_created
  when: (_aap_config_mcp_user_lookup.json.count | default(0) | int) == 0
  no_log: true

# The `is_platform_auditor: true` in the POST above is silently DROPPED by
# the gateway - verified live 2026-08-27: the field is accepted (HTTP 201,
# and a later PATCH returns 200) but reads back False every time. Platform
# Auditor is a ROLE in AAP 2.5, not a user boolean, so it has to be granted
# the same way the executor role below is: through role_user_assignments.
#
# This was not theoretical. zuno-mcp ran live with no read access at all -
# 0 projects, 0 inventories, 0 organizations - so aap.platform.audit failed
# outright ("no project named 'zuno-demo' in AAP") while every acceptance
# gate stayed green, because all three WP-074 checks assert a 403 for an
# UNAUTHORIZED caller and none exercises the authorized path.
#
# Granted unconditionally rather than only at creation: same defect family
# as the token probe earlier in this file - a permission applied once at
# create time and never reconciled afterwards is a permission that silently
# rots. 201 = granted, 400 = already assigned; both are success here.
- name: "aap-config | look up the Platform Auditor role definition"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/gateway/v1/role_definitions/?name=Platform%20Auditor"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_auditor_role
  changed_when: false
  no_log: true

# Re-read rather than reusing the lookup above: on a first install that
# lookup ran BEFORE the user existed, so it carries no id. This assignment
# is a GATEWAY resource and needs the GATEWAY user id - not the Controller
# id resolved further down for the executor role (they differ: 4 vs 73 on
# demo222, so crossing them silently grants the wrong user or nothing).
- name: "aap-config | re-read the mcp-aap Gateway user id"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/gateway/v1/users/?username={{ _aap_config_mcp_username }}"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_mcp_gw_user
  until: (_aap_config_mcp_gw_user.json.count | default(0) | int) > 0
  retries: 12
  delay: 5
  changed_when: false
  no_log: true

- name: "aap-config | grant the mcp-aap user system-wide read via Platform Auditor"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/gateway/v1/role_user_assignments/"
    method: POST
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      user: "{{ _aap_config_mcp_gw_user.json.results[0].id | int }}"
      role_definition: "{{ _aap_config_auditor_role.json.results[0].id | int }}"
    status_code: [201, 400]
  register: _aap_config_auditor_assignment
  when: (_aap_config_auditor_role.json.count | default(0) | int) > 0
  no_log: true

- name: "aap-config | fail if the Platform Auditor grant was rejected for a real reason"
  ansible.builtin.fail:
    msg: >-
      Granting Platform Auditor to {{ _aap_config_mcp_username }} failed with
      HTTP 400 for a reason other than "already assigned". Without it the user
      sees no projects/inventories and aap.platform.audit cannot work.
  when:
    - _aap_config_auditor_assignment.status is defined
    - _aap_config_auditor_assignment.status == 400
    - "'already exists' not in (_aap_config_auditor_assignment.json | default({}) | string)"

- name: "aap-config | wait for the mcp-aap user to sync down into Controller"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/users/?username={{ _aap_config_mcp_username }}"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_mcp_ctrl_user
  until: (_aap_config_mcp_ctrl_user.json.count | default(0) | int) > 0
  retries: 30
  delay: 5
  no_log: true

- name: "aap-config | check whether the zuno-day0-check executor role definition exists"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/role_definitions/?name={{ _aap_config_mcp_role_name | urlencode }}"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_mcp_role_lookup
  vars:
    _aap_config_mcp_role_name: "{{ aap_config_mcp_role_name | default('zuno-day0-check-executor') }}"
  no_log: true

# view + execute only. Deliberately NOT change/delete: this role is what
# bounds mcp-aap's aap.cluster.audit capability, so widening it silently
# widens what a prompt-injected agent could reach (ADR-0355 Security
# considerations).
- name: "aap-config | create the object-scoped executor role definition"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/role_definitions/"
    method: POST
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "{{ aap_config_mcp_role_name | default('zuno-day0-check-executor') }}"
      description: "Launch and read one Job Template - mcp-aap's grant (ADR-0355/WP-074)"
      content_type: awx.jobtemplate
      permissions:
        - awx.view_jobtemplate
        - awx.execute_jobtemplate
    status_code: 201
  register: _aap_config_mcp_role_created
  when: (_aap_config_mcp_role_lookup.json.count | default(0) | int) == 0
  no_log: true

- name: "aap-config | resolve the executor role definition and Controller user ids"
  ansible.builtin.set_fact:
    _aap_config_mcp_role_id: >-
      {{ (_aap_config_mcp_role_created.json.id
          if (_aap_config_mcp_role_lookup.json.count | default(0) | int) == 0
          else _aap_config_mcp_role_lookup.json.results[0].id) }}
    _aap_config_mcp_user_id: "{{ _aap_config_mcp_ctrl_user.json.results[0].id }}"

- name: "aap-config | check whether the executor role is already assigned on the Job Template"
  ansible.builtin.uri:
    url: >-
      {{ _aap_config_gateway_url }}/api/controller/v2/role_user_assignments/?role_definition={{
      _aap_config_mcp_role_id }}&user={{ _aap_config_mcp_user_id }}&object_id={{
      _aap_config_jt_lookup.json.results[0].id }}
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_mcp_assignment_lookup
  no_log: true

# object_id is the zuno-day0-check Job Template resolved by NAME above -
# never a hardcoded id, which differs per cluster and per reinstall.
- name: "aap-config | grant the mcp-aap user execute on the zuno-day0-check Job Template only"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/role_user_assignments/"
    method: POST
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      role_definition: "{{ _aap_config_mcp_role_id | int }}"
      user: "{{ _aap_config_mcp_user_id | int }}"
      object_id: "{{ _aap_config_jt_lookup.json.results[0].id | string }}"
    status_code: [201, 400]
  register: _aap_config_mcp_assignment
  when: (_aap_config_mcp_assignment_lookup.json.count | default(0) | int) == 0
  no_log: true

- name: "aap-config | fail if the executor role assignment was rejected"
  ansible.builtin.fail:
    msg: >-
      AAP rejected the mcp-aap execute grant on zuno-day0-check. mcp-aap
      would fall back to no launch permission at all - fix this before
      deploying it.
  when:
    - _aap_config_mcp_assignment.status is defined
    - _aap_config_mcp_assignment.status == 400
    - "'already exists' not in (_aap_config_mcp_assignment.json | default({}) | string)"

# The token is minted by authenticating AS zuno-mcp, not as admin - that is
# the whole point (see the section header). Shown once, so Vault is the
# durable copy; check-first, same contract as controller-token above.
- name: "aap-config | check whether zuno/aap/mcp-token already exists in Vault"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv get -format=json zuno/aap/mcp-token"
  register: _aap_config_mcp_token_existing
  changed_when: false
  failed_when: false
  no_log: true

# Same trap as the controller token above, and worse here: after an `aap`
# reinstall the zuno-mcp USER is recreated by the tasks above (that half
# self-heals), but its token would not be, so mcp-aap would ship a token
# belonging to a user id that no longer exists and 401 on every tool call.
- name: "aap-config | probe whether the Vault-held mcp-aap token still authenticates"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/organizations/"
    method: GET
    headers:
      Authorization: "Bearer {{ (_aap_config_mcp_token_existing.stdout | from_json).data.data.token }}"
    validate_certs: false
    status_code: [200, 401, 403]
  register: _aap_config_mcp_token_probe
  when: _aap_config_mcp_token_existing.rc == 0
  changed_when: false
  failed_when: false
  no_log: true

- name: "aap-config | decide whether the mcp-aap token must be (re-)minted"
  ansible.builtin.set_fact:
    _aap_config_mcp_token_needs_mint: >-
      {{ (_aap_config_mcp_token_existing.rc != 0)
         or ((_aap_config_mcp_token_probe.status | default(401)) != 200) }}

# Only on the mint path, so this is not a write on every run: realigns the
# AAP-side password with Vault's copy in case the two ever drift (Vault
# restored from backup, user recreated by hand), which would otherwise make
# the mint below fail with an opaque 401.
- name: "aap-config | realign the mcp-aap user's password with Vault before minting"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/gateway/v1/users/{{ _aap_config_mcp_user_lookup.json.results[0].id }}/"
    method: PATCH
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      password: "{{ _aap_config_mcp_password }}"
    status_code: 200
  when:
    - _aap_config_mcp_token_needs_mint | bool
    - (_aap_config_mcp_user_lookup.json.count | default(0) | int) > 0
  no_log: true

- name: "aap-config | mint the mcp-aap API token AS the mcp-aap user (first run only - shown once)"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/gateway/v1/tokens/"
    method: POST
    url_username: "{{ _aap_config_mcp_username }}"
    url_password: "{{ _aap_config_mcp_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      description: "mcp-aap server, least-privilege (ADR-0355/WP-074)"
    status_code: 201
  register: _aap_config_mcp_token_minted
  when: _aap_config_mcp_token_needs_mint | bool
  no_log: true

# `url` travels with the token so mcp-aap never carries the Gateway
# endpoint as a chart-level constant. The in-cluster Gateway Service, NOT
# aap-controller-service - the latter answers 401 to a gateway-minted token
# on 2.5+ (burned once in WP-073).
- name: "aap-config | persist the mcp-aap token and Gateway URL to Vault (first run only)"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _vault_root_token }} vault kv put zuno/aap/mcp-token
      token={{ _aap_config_mcp_token_minted.json.token | quote }}
      url={{ aap_config_mcp_gateway_service_url | default('http://aap.zuno-aap.svc') | quote }}"
  when: _aap_config_mcp_token_needs_mint | bool
  no_log: true

# Tolerant of absence by design: mcp-aap's ExternalSecret is applied by the
# Day 2 `mcp` role, which normally runs long after this one. On that first
# install there is no stale Secret to correct.
- name: "aap-config | force the mcp-aap token Secret to pick up the new token"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/force_externalsecret_refresh.yml"
  vars:
    es_name: aap-mcp-token-credentials
    es_namespace: zuno-ai-run
    es_expect_key: token
    es_expect_value: "{{ _aap_config_mcp_token_minted.json.token }}"
  when: _aap_config_mcp_token_needs_mint | bool

# --- Keycloak SSO on the Gateway (ADR-0354 clause 6, closed here) -----------
# The 2.7 gateway ships a native keycloak authenticator plugin (confirmed
# live via /api/gateway/v1/authenticator_plugins/). Required configuration
# keys per its configuration_schema: KEY (client id), SECRET, PUBLIC_KEY
# (the realm's RSA public key - fetched live from the realm's public
# endpoint so a realm key rotation only needs a re-install, never a code
# change); the URL defaults carry the legacy /auth/ prefix RHBK dropped,
# so both are set explicitly. GROUPS_CLAIM=groups matches every client's
# oidc-group-membership-mapper in realm-zuno.json. Existing authenticator
# = skip entirely (no PATCH churn); the local-database admin login stays
# as fallback.

- name: "aap-config | read the aap Keycloak client secret (zuno-auth)"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: zuno-auth
    name: aap-client-secret
  register: _aap_config_kc_client_secret
  no_log: true

- name: "aap-config | skip SSO wiring if the Keycloak client secret isn't materialized"
  ansible.builtin.debug:
    msg: >-
      Secret aap-client-secret not found in zuno-auth - Keycloak's chart
      hasn't materialized the aap client secret (run `make d0 install
      keycloak`). Skipping the SSO authenticator wiring; admin login
      stays local-only until a re-run.
  when: (_aap_config_kc_client_secret.resources | default([]) | length) == 0

- name: "aap-config | wire the Keycloak SSO authenticator"
  when: (_aap_config_kc_client_secret.resources | default([]) | length) > 0
  block:
    - name: "aap-config | fetch the zuno realm's public key"
      ansible.builtin.uri:
        url: "https://keycloak.{{ cluster_base_domain }}/realms/zuno"
        method: GET
        validate_certs: false
        status_code: 200
      register: _aap_config_realm_info

    - name: "aap-config | check whether the Keycloak authenticator exists"
      ansible.builtin.uri:
        url: "{{ _aap_config_gateway_url }}/api/gateway/v1/authenticators/?name=Keycloak%20zuno"
        method: GET
        url_username: admin
        url_password: "{{ _aap_config_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: _aap_config_authenticator_lookup
      no_log: true

    # ACCESS_TOKEN_URL is fetched server-to-server, by the gateway pod
    # itself, never the user's browser - so it MUST be the in-cluster
    # HTTP listener, never the external Route. Confirmed live 2026-08-30
    # (WP-103's own verification pass, the first real SSO login this repo
    # ever exercised end to end): pointed at the external HTTPS Route,
    # every login failed with CERTIFICATE_VERIFY_FAILED - the gateway pod
    # has no reason to trust the edge Route's cert (issued by this
    # cluster's Vault PKI CA, not a public CA), and there is no
    # REQUESTS_CA_BUNDLE wiring it into that trust store. AUTHORIZATION_URL
    # stays external - the user's own browser is redirected there and has
    # no relationship to the gateway pod's trust store. Same in-cluster
    # listener the keycloak chart's own client-reconcile Job already uses
    # (gitops/charts/keycloak/values.yaml's `clientReconcile.serverUrl`) -
    # no shared var exists between the two Helm charts/Ansible roles, kept
    # in sync by convention like every other cross-chart value in this role.
    - name: "aap-config | create the Keycloak authenticator"
      ansible.builtin.uri:
        url: "{{ _aap_config_gateway_url }}/api/gateway/v1/authenticators/"
        method: POST
        url_username: admin
        url_password: "{{ _aap_config_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          name: "Keycloak zuno"
          type: "ansible_base.authentication.authenticator_plugins.keycloak"
          enabled: true
          create_objects: true
          remove_users: false
          configuration:
            KEY: aap
            SECRET: "{{ _aap_config_kc_client_secret.resources[0].data.client_secret | b64decode }}"
            PUBLIC_KEY: "{{ _aap_config_realm_info.json.public_key }}"
            AUTHORIZATION_URL: "https://keycloak.{{ cluster_base_domain }}/realms/zuno/protocol/openid-connect/auth"
            ACCESS_TOKEN_URL: "http://zuno-service.zuno-auth.svc:8080/realms/zuno/protocol/openid-connect/token"
            GROUPS_CLAIM: groups
        status_code: 201
      register: _aap_config_authenticator_created
      when: (_aap_config_authenticator_lookup.json.count | default(0) | int) == 0
      no_log: true

    - name: "aap-config | resolve the authenticator id"
      ansible.builtin.set_fact:
        _aap_config_authenticator_id: >-
          {{ _aap_config_authenticator_created.json.id
             if (_aap_config_authenticator_created is not skipped)
             else _aap_config_authenticator_lookup.json.results[0].id }}

    - name: "aap-config | list the authenticator's maps"
      ansible.builtin.uri:
        url: "{{ _aap_config_gateway_url }}/api/gateway/v1/authenticators/{{ _aap_config_authenticator_id }}/authenticator_maps/"
        method: GET
        url_username: admin
        url_password: "{{ _aap_config_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: _aap_config_maps
      no_log: true

    # ADR-0418/WP-103: superuser is now driven by the dedicated aap_admin
    # Keycloak group, not ocp-paas-ops (a cluster-access group, orthogonal
    # to AAP RBAC) - a single source of truth for "who administers AAP".
    # The old map is deleted first so the two never coexist evaluating in
    # undefined relative order. paas-ops-01 (the only user who relied on
    # ocp-paas-ops for this) is added to aap_admin in realm-zuno.json/live
    # Keycloak as part of this same WP - see wp-103-aap-launch-rbac.md's
    # "Live group provisioning" section; that group-join MUST be applied
    # before this task runs against a real environment, or paas-ops-01
    # loses superuser for the gap between the two.
    - name: "aap-config | look up the stale superuser-ocp-paas-ops map"
      ansible.builtin.uri:
        url: "{{ _aap_config_gateway_url }}/api/gateway/v1/authenticator_maps/?name=superuser-ocp-paas-ops"
        method: GET
        url_username: admin
        url_password: "{{ _aap_config_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: _aap_config_stale_superuser_map
      no_log: true

    - name: "aap-config | delete the stale superuser-ocp-paas-ops map"
      ansible.builtin.uri:
        url: "{{ _aap_config_gateway_url }}/api/gateway/v1/authenticator_maps/{{ _aap_config_stale_superuser_map.json.results[0].id }}/"
        method: DELETE
        url_username: admin
        url_password: "{{ _aap_config_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [204, 404]
      when: (_aap_config_stale_superuser_map.json.count | default(0) | int) > 0
      no_log: true

    # Order 1, revoke: superuser tracks aap_admin membership both ways
    # (granted on login when present, removed when not).
    - name: "aap-config | map aap_admin to superuser"
      ansible.builtin.uri:
        url: "{{ _aap_config_gateway_url }}/api/gateway/v1/authenticator_maps/"
        method: POST
        url_username: admin
        url_password: "{{ _aap_config_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          name: superuser-aap-admin
          authenticator: "{{ _aap_config_authenticator_id | int }}"
          map_type: is_superuser
          revoke: true
          order: 1
          triggers:
            groups:
              has_or:
                - aap_admin
        status_code: 201
      when: >-
        (_aap_config_maps.json.results | default([])
         | selectattr('name', 'equalto', 'superuser-aap-admin')
         | list | length) == 0
      no_log: true

    # Order 2/3 (ADR-0418/WP-103): aap_ops/aap_reader Keycloak group
    # membership grants Controller Team membership, which is where the
    # actual view/execute/sync permissions live (role_team_assignments,
    # wire_launch_rbac.yml). `team`/`organization` are plain NAME strings
    # here (confirmed live via OPTIONS on this endpoint - not ids), unlike
    # every other id-based field this role uses elsewhere. `role` is
    # REQUIRED for map_type: team - the API rejects it otherwise ("You
    # must specify a role with the selected map type", confirmed live
    # 2026-08-30, not documented in the OPTIONS help_text). "Team Member"
    # is one of two built-in managed role_definitions on `shared.team`
    # (the other, "Team Admin", also grants change/delete on the team
    # itself - not needed here) - it is what makes a Team member inherit
    # every role_team_assignment already granted to that Team.
    - name: "aap-config | map aap_ops to {{ aap_config_ops_team_name | default('aap-ops-team') }}"
      ansible.builtin.uri:
        url: "{{ _aap_config_gateway_url }}/api/gateway/v1/authenticator_maps/"
        method: POST
        url_username: admin
        url_password: "{{ _aap_config_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          name: team-aap-ops
          authenticator: "{{ _aap_config_authenticator_id | int }}"
          map_type: team
          team: "{{ aap_config_ops_team_name | default('aap-ops-team') }}"
          organization: "{{ aap_config_organization | default('zuno') }}"
          role: "Team Member"
          revoke: true
          order: 2
          triggers:
            groups:
              has_or:
                - aap_ops
        status_code: 201
      when: >-
        (_aap_config_maps.json.results | default([])
         | selectattr('name', 'equalto', 'team-aap-ops')
         | list | length) == 0
      no_log: true

    - name: "aap-config | map aap_reader to {{ aap_config_reader_team_name | default('aap-reader-team') }}"
      ansible.builtin.uri:
        url: "{{ _aap_config_gateway_url }}/api/gateway/v1/authenticator_maps/"
        method: POST
        url_username: admin
        url_password: "{{ _aap_config_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          name: team-aap-reader
          authenticator: "{{ _aap_config_authenticator_id | int }}"
          map_type: team
          team: "{{ aap_config_reader_team_name | default('aap-reader-team') }}"
          organization: "{{ aap_config_organization | default('zuno') }}"
          role: "Team Member"
          revoke: true
          order: 3
          triggers:
            groups:
              has_or:
                - aap_reader
        status_code: 201
      when: >-
        (_aap_config_maps.json.results | default([])
         | selectattr('name', 'equalto', 'team-aap-reader')
         | list | length) == 0
      no_log: true

    # Order 10: every authenticated realm user may log in - this map is
    # ONLY a login gate. Discovered live 2026-08-30 (WP-103's own
    # verification pass): `map_type: allow` grants no object-level access
    # by itself, contrary to what this comment used to claim - an
    # authenticated user with no `aap_*` group sees ZERO Job/Workflow
    # Templates, gated or not. That is left as-is deliberately: extending
    # visibility to every Keycloak persona in the realm (sales,
    # consultants, etc.) would be a far wider surface than this WP's own
    # scope (3 tiers for 5 named platform-operator personas). aap_ops/
    # aap_reader are instead granted on BOTH gated and ungated templates
    # (see wire_launch_rbac.yml) - only members of one of those two Teams,
    # or aap_admin, can see anything at all.
    - name: "aap-config | map all authenticated users to allow"
      ansible.builtin.uri:
        url: "{{ _aap_config_gateway_url }}/api/gateway/v1/authenticator_maps/"
        method: POST
        url_username: admin
        url_password: "{{ _aap_config_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          name: allow-authenticated
          authenticator: "{{ _aap_config_authenticator_id | int }}"
          map_type: allow
          revoke: false
          order: 10
          triggers:
            always: {}
        status_code: 201
      when: >-
        (_aap_config_maps.json.results | default([])
         | selectattr('name', 'equalto', 'allow-authenticated')
         | list | length) == 0
      no_log: true

- name: "aap-config | summary"
  ansible.builtin.debug:
    msg: >-
      aap-config complete: organization
      '{{ aap_config_organization | default('zuno') }}', Project
      '{{ aap_config_project_name | default('zuno-demo') }}', Job Template
      '{{ aap_config_job_template_name | default('zuno-day0-check') }}'
      (credential attached), Keycloak SSO
      {{ 'wired' if (_aap_config_kc_client_secret.resources | default([]) | length) > 0 else 'SKIPPED (client secret not materialized)' }}.
