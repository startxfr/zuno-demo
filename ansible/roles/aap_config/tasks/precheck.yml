---
# State detection (never fails). Checks both Applications plus the two
# terminal CRs (Project and JobTemplate) - the API-side objects (org,
# host, credential attach, SSO authenticator) are install.yml's
# responsibility and re-asserted idempotently on every install, so CR
# presence is the right cheap proxy here.
- name: "aap-config | check the aap-config Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-aap-config-d0"

- name: "aap-config | save the d0 check result"
  ansible.builtin.set_fact:
    _aap_config_d0_installed: "{{ _state_check_result }}"

- name: "aap-config | check the aap-config Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-aap-config-d1"

- name: "aap-config | look up the AnsibleProject CR"
  kubernetes.core.k8s_info:
    api_version: tower.ansible.com/v1alpha1
    kind: AnsibleProject
    namespace: zuno-aap
    name: zuno-demo
  register: _aap_config_project_cr
  ignore_errors: true

- name: "aap-config | look up the JobTemplate CR"
  kubernetes.core.k8s_info:
    api_version: tower.ansible.com/v1alpha1
    kind: JobTemplate
    namespace: zuno-aap
    name: zuno-day0-check
  register: _aap_config_jt_cr
  ignore_errors: true

- name: "aap-config | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        _aap_config_d0_installed
        and _state_check_result
        and not (_aap_config_project_cr.failed | default(false))
        and (_aap_config_project_cr.resources | default([]) | length) > 0
        and not (_aap_config_jt_cr.failed | default(false))
        and (_aap_config_jt_cr.resources | default([]) | length) > 0
      }}

- name: "aap-config | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
