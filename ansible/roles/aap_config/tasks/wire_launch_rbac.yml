---
# ADR-0418 Security considerations / WP-103: models *who* may launch each
# gated Job/Workflow Template inside Controller's own RBAC, on top of the
# zuno-cluster-reader/zuno-aap-installer credential tiers WP-094 already
# wired (those govern what a launched job can DO, not who can click
# launch). Included once from install.yml, after every Job/Workflow
# Template and the Project already exist (this file resolves their ids
# by name, never hardcoded).
#
# Live findings, confirmed 2026-08-30 against this cluster's AAP (same
# "verify before trusting" discipline as the mcp-aap RBAC section above -
# install.yml:593-609):
#   - Teams are GATEWAY resources, same lesson as Organizations/Users
#     (install.yml:75-80/637-671): POST only works against
#     /api/gateway/v1/teams/ (confirmed via OPTIONS - `organization` is a
#     required field there), then the object syncs down into
#     /api/controller/v2/teams/ with a DIFFERENT id - confirmed live the
#     zuno organization itself already differs (gateway id 2, controller
#     id 69), so the same cross-id trap applies to Teams and is not
#     assumed away here.
#   - /api/controller/v2/role_team_assignments/ exists (200, mirrors the
#     role_user_assignments/ endpoint install.yml:813-846 already uses).
#   - Exact permission strings, read live from
#     /api/controller/v2/role_metadata/'s `allowed_permissions`:
#     content_type `awx.project` -> [view_project, update_project, ...]
#     ("sync" = update_project, not "sync_project"); content_type
#     `awx.workflowjobtemplate` -> [view_workflowjobtemplate,
#     execute_workflowjobtemplate, ...] (no underscores splitting
#     "workflow"/"job"/"template", unlike the CRD/API path names that do
#     split them - do not guess this one, it does not follow the same
#     convention as awx.jobtemplate's own permissions).
#   - An authenticator_map's `map_type: team`/`organization` fields are
#     both plain strings (team/organization NAME, not id) - confirmed via
#     OPTIONS on /api/gateway/v1/authenticator_maps/.
#
# No Team/role_definition is created for aap_admin: that group grants
# Controller superuser directly via an authenticator map (see the
# Keycloak SSO section below in install.yml), which needs no Team or
# object-scoped role at all.

# --- resolve the zuno organization's GATEWAY-side id -------------------
# Re-read rather than reusing _aap_config_org_lookup: that fact was
# captured by the EXISTENCE check earlier in this file, which on a first
# install ran before the organization was created and carries no id
# (same caution as install.yml:702-706 for the mcp-aap user).

- name: "aap-config | re-read the {{ aap_config_organization | default('zuno') }} organization's Gateway id"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/gateway/v1/organizations/?name={{ aap_config_organization | default('zuno') }}"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_launch_rbac_org_gw
  no_log: true

# --- Teams (aap_admin needs none - superuser via authenticator map) ----

- name: "aap-config | check whether the {{ aap_config_ops_team_name | default('aap-ops-team') }} Team exists"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/gateway/v1/teams/?name={{ aap_config_ops_team_name | default('aap-ops-team') }}"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_ops_team_lookup
  no_log: true

- name: "aap-config | create the {{ aap_config_ops_team_name | default('aap-ops-team') }} Team"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/gateway/v1/teams/"
    method: POST
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "{{ aap_config_ops_team_name | default('aap-ops-team') }}"
      organization: "{{ _aap_config_launch_rbac_org_gw.json.results[0].id | int }}"
      description: "ADR-0418/WP-103 - view+execute on gated Job/Workflow Templates, view+sync on the zuno-demo Project. Membership driven by the aap_ops Keycloak group via a team authenticator map."
    status_code: 201
  when: (_aap_config_ops_team_lookup.json.count | default(0) | int) == 0
  no_log: true

- name: "aap-config | wait for {{ aap_config_ops_team_name | default('aap-ops-team') }} to sync down into Controller"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/teams/?name={{ aap_config_ops_team_name | default('aap-ops-team') }}"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_ops_team_ctrl
  until: (_aap_config_ops_team_ctrl.json.count | default(0) | int) > 0
  retries: 30
  delay: 5
  no_log: true

- name: "aap-config | check whether the {{ aap_config_reader_team_name | default('aap-reader-team') }} Team exists"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/gateway/v1/teams/?name={{ aap_config_reader_team_name | default('aap-reader-team') }}"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_reader_team_lookup
  no_log: true

- name: "aap-config | create the {{ aap_config_reader_team_name | default('aap-reader-team') }} Team"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/gateway/v1/teams/"
    method: POST
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "{{ aap_config_reader_team_name | default('aap-reader-team') }}"
      organization: "{{ _aap_config_launch_rbac_org_gw.json.results[0].id | int }}"
      description: "ADR-0418/WP-103 - view-only on gated Job/Workflow Templates and the zuno-demo Project. Membership driven by the aap_reader Keycloak group via a team authenticator map."
    status_code: 201
  when: (_aap_config_reader_team_lookup.json.count | default(0) | int) == 0
  no_log: true

- name: "aap-config | wait for {{ aap_config_reader_team_name | default('aap-reader-team') }} to sync down into Controller"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/teams/?name={{ aap_config_reader_team_name | default('aap-reader-team') }}"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_reader_team_ctrl
  until: (_aap_config_reader_team_ctrl.json.count | default(0) | int) > 0
  retries: 30
  delay: 5
  no_log: true

- name: "aap-config | resolve the two Teams' Controller-side ids"
  ansible.builtin.set_fact:
    _aap_config_ops_team_id: "{{ _aap_config_ops_team_ctrl.json.results[0].id }}"
    _aap_config_reader_team_id: "{{ _aap_config_reader_team_ctrl.json.results[0].id }}"

