      {{ _aap_config_reader_jt_role_created.json.id
         if (_aap_config_reader_jt_role_lookup.json.count | default(0) | int) == 0
         else _aap_config_reader_jt_role_lookup.json.results[0].id }}
    _aap_config_ops_wjt_role_id: >-
      {{ _aap_config_ops_wjt_role_created.json.id
         if (_aap_config_ops_wjt_role_lookup.json.count | default(0) | int) == 0
         else _aap_config_ops_wjt_role_lookup.json.results[0].id }}
    _aap_config_reader_wjt_role_id: >-
      {{ _aap_config_reader_wjt_role_created.json.id
         if (_aap_config_reader_wjt_role_lookup.json.count | default(0) | int) == 0
         else _aap_config_reader_wjt_role_lookup.json.results[0].id }}
    _aap_config_ops_proj_role_id: >-
      {{ _aap_config_ops_proj_role_created.json.id
