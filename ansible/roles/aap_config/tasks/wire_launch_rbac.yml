    _object_id: "{{ item.id }}"
    _label: "aap-reader-team view on Job Template {{ item.name }}"
  loop: "{{ _aap_config_gated_jt_ids }}"
  loop_control:
    label: "{{ item.name }}"

- name: "aap-config | grant aap-reader-team view on every gated Workflow Template"
  ansible.builtin.include_tasks: assign_team_role.yml
  vars:
    _team_id: "{{ _aap_config_reader_team_id }}"
    _role_definition_id: "{{ _aap_config_reader_wjt_role_id }}"
    _object_id: "{{ item.id }}"
    _label: "aap-reader-team view on Workflow Template {{ item.name }}"
  loop: "{{ _aap_config_gated_wjt_ids }}"
  loop_control:
    label: "{{ item.name }}"

- name: "aap-config | grant aap-reader-team view on the {{ aap_config_project_name | default('zuno-demo') }} Project"
  ansible.builtin.include_tasks: assign_team_role.yml
  vars:
    _team_id: "{{ _aap_config_reader_team_id }}"
    _role_definition_id: "{{ _aap_config_reader_proj_role_id }}"
    _object_id: "{{ _aap_config_project_lookup.json.results[0].id }}"
    _label: "aap-reader-team view on the {{ aap_config_project_name | default('zuno-demo') }} Project"
