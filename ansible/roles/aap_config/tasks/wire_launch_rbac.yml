# WP-105/ADR-0536 Part B: approving a paused workflow_approval node is a
# DISTINCT permission from execute - confirmed live 2026-08-31 against this
# cluster's own /api/controller/v2/role_metadata/ (`awx.workflowjobtemplate`'s
# `allowed_permissions` lists `awx.approve_workflowjobtemplate` separately
# from `awx.execute_workflowjobtemplate`), and independently corroborated by
# the Workflow Template object's own `summary_fields.object_roles` always
# carrying a distinct `approval_role` ("Can approve or deny a workflow
# approval node") alongside `execute_role`. aap_ops only - approving is a
# mutating/gating action, never granted to aap-reader-team (view-only by
# design, see this file's header comment).
- name: "aap-config | check whether the aap-ops-workflowjobtemplate-approver role definition exists"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/role_definitions/?name=aap-ops-workflowjobtemplate-approver"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_ops_wjt_approver_role_lookup
  no_log: true

- name: "aap-config | create the aap-ops-workflowjobtemplate-approver role definition"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/role_definitions/"
    method: POST
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: aap-ops-workflowjobtemplate-approver
      description: "ADR-0536/WP-105 - approve/deny a gated Workflow Template's approval node (aap_ops)"
      content_type: awx.workflowjobtemplate
      # view_workflowjobtemplate is required here, not optional - confirmed
      # live 2026-08-31: POST rejects a custom role_definition missing it
      # with 400 "Permissions for model workflow job template needs to
      # include view, got: approve_workflowjobtemplate" (every other
      # role_definition in this file already includes its content type's
      # view_* permission alongside its other one(s) - this is that same
      # requirement, just not previously hit by a single-permission role).
      permissions: [awx.view_workflowjobtemplate, awx.approve_workflowjobtemplate]
    status_code: 201
  register: _aap_config_ops_wjt_approver_role_created
  when: (_aap_config_ops_wjt_approver_role_lookup.json.count | default(0) | int) == 0
  no_log: true

