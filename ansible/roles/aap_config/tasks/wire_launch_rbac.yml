# --- resolve the gated Job/Workflow Templates' ids ----------------------
# Re-queried by name rather than reusing the earlier wait-loops'
# registered facts (_aap_config_jt_lookup/_aap_config_wft_lookup are
# overwritten on every loop iteration during the earlier "wire every Job
# Template"/"wait for every Workflow Template" blocks, so only the LAST
# item's result would still be in scope here).

- name: "aap-config | resolve each gated Job Template's id"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/job_templates/?name={{ item.name }}"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_gated_jt_lookup
  loop: "{{ aap_config_job_templates | selectattr('gated', 'defined') | selectattr('gated') | list }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: "aap-config | build the gated Job Template name/id list"
  ansible.builtin.set_fact:
    _aap_config_gated_jt_ids: "{{ (_aap_config_gated_jt_ids | default([])) + [{'name': item.item.name, 'id': item.json.results[0].id}] }}"
  loop: "{{ _aap_config_gated_jt_lookup.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  no_log: true

- name: "aap-config | resolve each gated Workflow Template's id"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/workflow_job_templates/?name={{ item.name }}"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_gated_wjt_lookup
  loop: "{{ aap_config_workflow_templates | selectattr('gated', 'defined') | selectattr('gated') | list }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: "aap-config | build the gated Workflow Template name/id list"
  ansible.builtin.set_fact:
    _aap_config_gated_wjt_ids: "{{ (_aap_config_gated_wjt_ids | default([])) + [{'name': item.item.name, 'id': item.json.results[0].id}] }}"
  loop: "{{ _aap_config_gated_wjt_lookup.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  no_log: true

# --- resolve the UNGATED Job/Workflow Templates' ids (aap_ops/aap_reader
#     are granted these too, below - see the header comment for why) -----
# "ungated" = every entry in aap_config_job_templates/
# aap_config_workflow_templates that carries no `gated` key at all - never
# `gated: false` (that value is never set anywhere in defaults/main.yml).

- name: "aap-config | resolve each ungated Job Template's id"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/job_templates/?name={{ item.name }}"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_ungated_jt_lookup
  loop: "{{ aap_config_job_templates | rejectattr('gated', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: "aap-config | build the ungated Job Template name/id list"
  ansible.builtin.set_fact:
    _aap_config_ungated_jt_ids: "{{ (_aap_config_ungated_jt_ids | default([])) + [{'name': item.item.name, 'id': item.json.results[0].id}] }}"
  loop: "{{ _aap_config_ungated_jt_lookup.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  no_log: true

- name: "aap-config | resolve each ungated Workflow Template's id"
  ansible.builtin.uri:
    url: "{{ _aap_config_gateway_url }}/api/controller/v2/workflow_job_templates/?name={{ item.name }}"
    method: GET
    url_username: admin
    url_password: "{{ _aap_config_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _aap_config_ungated_wjt_lookup
  loop: "{{ aap_config_workflow_templates | rejectattr('gated', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: "aap-config | build the ungated Workflow Template name/id list"
  ansible.builtin.set_fact:
    _aap_config_ungated_wjt_ids: "{{ (_aap_config_ungated_wjt_ids | default([])) + [{'name': item.item.name, 'id': item.json.results[0].id}] }}"
  loop: "{{ _aap_config_ungated_wjt_lookup.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  no_log: true

# --- grant the role_team_assignments (assign_team_role.yml, per object) -
# The Project's id is already resolved (_aap_config_project_lookup,
# install.yml:377) and unambiguous - only one Project exists - no re-query
# needed.

- name: "aap-config | grant aap-ops-team execute on every gated Job Template"
  ansible.builtin.include_tasks: assign_team_role.yml
  vars:
    _team_id: "{{ _aap_config_ops_team_id }}"
    _role_definition_id: "{{ _aap_config_ops_jt_role_id }}"
    _object_id: "{{ item.id }}"
    _label: "aap-ops-team execute on Job Template {{ item.name }}"
  loop: "{{ _aap_config_gated_jt_ids }}"
  loop_control:
    label: "{{ item.name }}"

