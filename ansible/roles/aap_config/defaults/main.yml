---
# Mirrors gitops/charts/aap-config/values.yaml's `jobTemplates`/
# `workflowTemplates`/`credentials` lists (ADR-0418/WP-094/WP-095) - this
# role's post-CR API calls (credential attachment, Survey wiring,
# census/nudge/wait) need the same data the chart used to render the CRs,
# and this role has no templating engine to read the chart's values.yaml
# directly, so the two are kept in sync by convention, the same way
# aap_config_project_name/aap_config_inventory_name already mirror the
# chart's project/inventory names elsewhere in this role. Only the names
# are needed here (unlike jobTemplates' full credential/survey data) -
# workflows carry no credential/Survey of their own, they only launch
# already-wired Job Templates per node.
aap_config_organization: zuno
aap_config_project_name: zuno-demo
aap_config_inventory_name: zuno

# ADR-0418/WP-103: Controller Teams driving launch-RBAC. No admin team
# name here - aap_admin grants superuser via a Keycloak authenticator map
# only (no Team object). aap_ops/aap_reader are each granted on BOTH the
# `gated: true` templates/project below AND the ungated ones (WP-103's
# own verification pass found `allow-authenticated` grants login only,
# never object-level view - see ansible/roles/aap_config/tasks/
# wire_launch_rbac.yml) - a user outside these two Teams (or aap_admin)
# sees nothing at all, gated or not; that is deliberate, not a gap - see
# docs/roadmap/work-packages/wp-103-aap-launch-rbac.md.
aap_config_ops_team_name: aap-ops-team
aap_config_reader_team_name: aap-reader-team

aap_config_credentials:
  - name: zuno-cluster-reader
  - name: zuno-aap-installer

# WP-102/ADR-0418 clause 6: Job Templates whose underlying playbook shells
# out to kustomize/oc/cosign directly on localhost - the only ones that
# actually need the custom "aap-execution-environment" EE (least-privilege
# assignment, not every template). See
# wp-102-aap-execution-environment-kustomize.md's Job Template table for
# the binary->template trace this list is derived from.
aap_config_ee_job_templates:
  - zuno-day2-check
  - zuno-day2-install
  - zuno-day1-build
  - zuno-day2-build
  - zuno-day3-sign
  - zuno-day3-stresstest
  # WP-105/ADR-0536 Part B: both playbooks run `ansible.builtin.command: oc
  # adm cordon/uncordon` directly, same "shells out to oc on localhost"
  # criterion as the other entries above.
  - zuno-day3-scenario-failover-node-inject
  - zuno-day3-scenario-failover-node-restore

aap_config_job_templates:
  - name: zuno-day0-check
    credential: zuno-cluster-reader
    survey_components: []
  - name: zuno-day1-check
    credential: zuno-cluster-reader
    survey_components: [smtp, nfd, nvidia-gpu, custom-metrics-autoscaler, redis, observability, service-mesh, mesh-monitoring, kiali, grafana, mariadb, tempo, openshift-oauth, connectivity-link, lws, jobset, kueue, openshift-ai, lightspeed, aiagent-operator]
  - name: zuno-day1-build
    credential: zuno-aap-installer
    survey_components: [ai-gateway, supply-chain-signer, aiagent-operator, aap-execution-environment]
  - name: zuno-day1-install
    credential: zuno-aap-installer
    gated: true
    survey_components: [smtp, nfd, nvidia-gpu, custom-metrics-autoscaler, redis, observability, service-mesh, mesh-monitoring, kiali, grafana, mariadb, tempo, openshift-oauth, connectivity-link, lws, jobset, kueue, openshift-ai, lightspeed, aiagent-operator]
  - name: zuno-day1-reconcile
    credential: zuno-aap-installer
    gated: true
    survey_components: [smtp, nfd, nvidia-gpu, custom-metrics-autoscaler, redis, observability, service-mesh, mesh-monitoring, kiali, grafana, mariadb, tempo, openshift-oauth, connectivity-link, lws, jobset, kueue, openshift-ai, lightspeed, aiagent-operator]
  - name: zuno-day2-check
    credential: zuno-cluster-reader
    survey_components: [namespaces, llm, models, rag, rag-ingestion, mcp, agents, mlops, lightspeed-config, supply-chain]
  - name: zuno-day2-build
    credential: zuno-aap-installer
    survey_components: [mcp, rag, rag-ingestion, agent, mlops]
  - name: zuno-day2-install
    credential: zuno-aap-installer
    gated: true
    survey_components: [namespaces, llm, models, rag, rag-ingestion, mcp, agents, mlops, lightspeed-config]
  - name: zuno-day3-test
    credential: zuno-cluster-reader
    survey_components: [agents, platform]
  - name: zuno-day3-stresstest
    credential: zuno-aap-installer
    gated: true
    survey_components: [agents, platform]
  - name: zuno-day3-backup
    credential: zuno-aap-installer
    gated: true
    survey_components: [postgresql]
  - name: zuno-day3-restore
    credential: zuno-aap-installer
    gated: true
    survey_components: [postgresql]
  - name: zuno-day3-check
    credential: zuno-cluster-reader
    survey_components: [postgresql, lightspeed, lightspeed-config, agents, platform]
  - name: zuno-day3-sign
    credential: zuno-aap-installer
    gated: true
    survey_components: [agents]
  # WP-105/ADR-0536 Part B: no survey_components - both playbooks resolve
  # their target pod/node dynamically and take no per-launch choice.
  - name: zuno-day3-scenario-failover-node-inject
    credential: zuno-aap-installer
    gated: true
    survey_components: []
  - name: zuno-day3-scenario-failover-node-restore
    credential: zuno-aap-installer
    gated: true
    survey_components: []

# "-workflow" suffix (WP-097 fix): a Workflow Template and its underlying
# Job Template would otherwise share the exact same name (e.g.
# zuno-day1-install for both) - functionally harmless (the resource
# operator's workflow-node lookup disambiguates via `type: job_template`),
# but confusing side by side in the Controller UI's Job Templates vs
# Workflow Templates lists.
aap_config_workflow_templates:
  - name: zuno-day1-install-workflow
    gated: true
  - name: zuno-day1-check-workflow
  - name: zuno-day1-reconcile-workflow
    gated: true
  - name: zuno-day1-build-workflow
  - name: zuno-day2-install-workflow
    gated: true
  - name: zuno-day2-check-workflow
  - name: zuno-day2-build-workflow
  - name: zuno-day3-scenario-failover-node-workflow
    gated: true
