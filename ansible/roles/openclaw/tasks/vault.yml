---
# keycloak/openclaw-<persona> (the client secret) is seeded by the vault role with
# the Keycloak client (WP-179's four-place pattern); this role seeds only its own
# openclaw/<persona> path, and only when it is missing.
# ADR-0595: the Control UI password reads zuno_personas_openclaw_ui_password, which
# inherits zuno_personas_mainpwd from ansible/confidential.yml. ADR-0602 / WP-223: in
# the hardened profile that variable is undefined on purpose, so each persona's path
# gets its own random password below (read it back from Vault openclaw/<persona>).
- name: "openclaw | load the committed per-cluster variables"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_cluster_vars.yml"

- name: "openclaw | check for ansible/confidential.yml"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/confidential.yml"
  register: _openclaw_confidential_file

- name: "openclaw | load ansible/confidential.yml if present"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/confidential.yml"
  when: _openclaw_confidential_file.stat.exists

- name: "openclaw | find the Vault pod"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: zuno-vault
    label_selectors:
      - "app.kubernetes.io/name=vault"
      - "component=server"
  register: _vault_pod

# ADR-0602 clause 1 / WP-223: a short-lived ansible-seeder token
# (zuno_vault_token, read by vault_seed_if_missing.yml), not the root token
# from vault-bootstrap-credentials; the helper fails if Vault is not running.
- name: "openclaw | log in to Vault as ansible-seeder"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_login.yml"

- name: "openclaw | check the Keycloak client secrets exist"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ zuno_vault_token }} vault kv get -field=client_secret zuno/keycloak/openclaw-{{ item.name }} >/dev/null"
  loop: "{{ _openclaw.personas }}"
  loop_control:
    label: "keycloak/openclaw-{{ item.name }}"
  register: _openclaw_client_secrets
  changed_when: false
  failed_when: false
  no_log: true

- name: "openclaw | fail when a Keycloak client secret is missing"
  ansible.builtin.fail:
    msg: >-
      Vault keycloak/openclaw-<persona> is missing for
      {{ _openclaw_client_secrets.results | rejectattr('rc', 'equalto', 0) | map(attribute='item.name') | list }}:
      run `make d0 install vault` (it seeds only missing paths), then
      `make d0 install keycloak` so the client reconcile Job creates the clients.
  when: _openclaw_client_secrets.results | rejectattr('rc', 'equalto', 0) | list | length > 0

- name: "openclaw | seed openclaw/<persona> (Control UI password, oauth2-proxy cookie secret)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_seed_if_missing.yml"
  no_log: true
  loop: "{{ _openclaw.personas }}"
  vars:
    vault_seed_path: "openclaw/{{ item.name }}"
    vault_seed_fields:
      ui_password: "{{ zuno_personas_openclaw_ui_password |
        default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])) }}"
      # oauth2-proxy accepts a 16, 24 or 32 byte cookie secret.
      cookie_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
