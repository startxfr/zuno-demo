---
# Realm users are create-only (the realm import never reaches a live realm and the
# client reconcile Job creates clients, not users): the service account of
# openclaw-<persona> is given the persona's groups here, live and idempotently, so
# the mcp-gateway and the ai-gateway quotas see the persona's groups (ADR-0589).
- name: "openclaw | read the Keycloak automation credentials (ADR-0595)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/read_keycloak_automation_credentials.yml"

- name: "openclaw | get a Keycloak admin token"
  ansible.builtin.uri:
    url: "https://keycloak.{{ cluster_base_domain }}/realms/master/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: admin-cli
      username: "{{ _kc_automation_user }}"
      password: "{{ _kc_automation_password }}"
    validate_certs: false
  register: _openclaw_kc_token
  no_log: true

- name: "openclaw | copy the persona's groups to its assistant's service account"
  ansible.builtin.include_tasks: keycloak_sa_groups_persona.yml
  loop: "{{ _openclaw.personas }}"
  loop_control:
    loop_var: _openclaw_persona
