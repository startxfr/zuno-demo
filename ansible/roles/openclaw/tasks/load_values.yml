---
# The chart's values.yaml is the single source of the personas, the pins and the
# names; the role reads it instead of duplicating them.
- name: "openclaw | read the chart values"
  ansible.builtin.set_fact:
    _openclaw: "{{ lookup('ansible.builtin.file', zuno_repo_root + '/gitops/charts/openclaw/values.yaml') | from_yaml }}"

- name: "openclaw | derive the persona namespaces"
  ansible.builtin.set_fact:
    _openclaw_namespaces: "{{ _openclaw.personas | map(attribute='name') | map('regex_replace', '^', _openclaw.namespacePrefix) | list }}"
