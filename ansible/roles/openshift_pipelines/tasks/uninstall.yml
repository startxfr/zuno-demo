---
# Reverse of install.yml: the Pipeline (d1), then the operator (remove_operator.yml needs the
# Subscription), then the d0 Application. PipelineRuns and the images pushed to quay.io are not
# touched.
- name: "openshift_pipelines | delete the GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-openshift-pipelines-d1"

- name: "openshift_pipelines | remove the operator (its owned CRDs then the CSV then the Subscription)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/remove_operator.yml"
  vars:
    operator_subscription_name: "{{ openshift_pipelines_package_name | default('openshift-pipelines-operator-rh') }}"
    operator_namespace: openshift-operators

- name: "openshift_pipelines | delete the GitOps Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-openshift-pipelines-d0"
