---
# State detection (never fails): both Applications Synced/Healthy.
- name: "openshift_pipelines | check the Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-openshift-pipelines-d0"

- name: "openshift_pipelines | keep the d0 state"
  ansible.builtin.set_fact:
    _openshift_pipelines_d0_ok: "{{ _state_check_result }}"

- name: "openshift_pipelines | check the Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-openshift-pipelines-d1"

- name: "openshift_pipelines | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: "{{ (_openshift_pipelines_d0_ok | bool) and (_state_check_result | bool) }}"

- name: "openshift_pipelines | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
