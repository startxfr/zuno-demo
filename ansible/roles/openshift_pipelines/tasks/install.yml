---
# ADR-0620 (WP-291): the OpenShift Pipelines operator (d0), then the source-image-build Pipeline (d1).
- name: "openshift_pipelines | resolve the operator package"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_operator_package.yml"
  vars:
    operator_package_name: "{{ openshift_pipelines_package_name | default('openshift-pipelines-operator-rh') }}"
    operator_subscription_namespace: "openshift-operators"
    operator_package_catalog_hint: "pipelines"

- name: "openshift_pipelines | apply the GitOps Application (d0: the Subscription)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  when: not (operator_package_skip_d0 | bool)
  vars:
    gitops_component_name: "openshift-pipelines"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-openshift-pipelines-d0"
    gitops_app_extra_helm_values:
      operator:
        enabled: true
        subscription:
          operator:
            channel: "{{ operator_package_channel }}"
            source:
              name: "{{ operator_package_catalog }}"
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 15

# The Pipeline kind, the cluster resolver and the catalog tasks exist only once the operator's
# TektonConfig has reconciled; d1 would otherwise sync against a missing CRD.
- name: "openshift_pipelines | wait for TektonConfig/config to be Ready"
  kubernetes.core.k8s_info:
    api_version: operator.tekton.dev/v1alpha1
    kind: TektonConfig
    name: config
  register: _openshift_pipelines_tektonconfig
  until: >-
    (_openshift_pipelines_tektonconfig.resources | default([]) | length) == 1 and
    ((_openshift_pipelines_tektonconfig.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | list) == ['True'])
  retries: 60
  delay: 15

# ADR-0620 clause 4, owner's choice of 2026-11-17: the push credential is the zuno organisation's robot
# (zuno+zuno_demo), kept in ansible/confidential.yml and written to Vault here, so the ExternalSecret of d1 finds it.
- name: "openshift_pipelines | check for ansible/confidential.yml (optional: the quay.io push robot)"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/confidential.yml"
  register: _openshift_pipelines_confidential_file

- name: "openshift_pipelines | load ansible/confidential.yml if present"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/confidential.yml"
  when: _openshift_pipelines_confidential_file.stat.exists

- name: "openshift_pipelines | write the quay.io push robot to Vault zuno/quay-io/zuno-push"
  when: zuno_quay_io_push_token | default('xxxxxx') != 'xxxxxx'
  block:
    - name: "openshift_pipelines | find the Vault pod"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: zuno-vault
        label_selectors:
          - "app.kubernetes.io/name=vault"
          - "component=server"
      register: _vault_pod

    - name: "openshift_pipelines | log in to Vault as ansible-seeder"
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_login.yml"

    # ADR-0603 M9: no secret on a command line; vault_cli.yml copies the token and the payload into the pod as files.
    - name: "openshift_pipelines | kv put zuno/quay-io/zuno-push"
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_cli.yml"
      vars:
        vault_cli_args: "kv put zuno/quay-io/zuno-push @PAYLOAD"
        vault_cli_payload:
          username: "{{ zuno_quay_io_push_username | default('zuno+zuno_demo') }}"
          token: "{{ zuno_quay_io_push_token }}"
      no_log: true

- name: "openshift_pipelines | say when the push robot is not configured"
  ansible.builtin.debug:
    msg: >-
      zuno_quay_io_push_token is not set in ansible/confidential.yml: Vault zuno/quay-io/zuno-push is not written, the
      ExternalSecret quay-io-zuno-push stays in error and the d1 Application Degraded until it is (see
      ansible/confidential.example.yml), and `make d2 build praxis` cannot push.
  when: zuno_quay_io_push_token | default('xxxxxx') == 'xxxxxx'

- name: "openshift_pipelines | apply the GitOps Application (d1: the source-image-build Pipeline)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "openshift-pipelines"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-openshift-pipelines-d1"
    gitops_app_wait_retries: 40
    gitops_app_wait_delay: 15
