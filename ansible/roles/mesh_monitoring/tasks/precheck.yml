---
# State detection (never fails).
- name: "mesh_monitoring | check the mesh-monitoring Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-mesh-monitoring-d0"

- name: "mesh_monitoring | save the d0 check result"
  ansible.builtin.set_fact:
    _mesh_monitoring_d0_installed: "{{ _state_check_result }}"

- name: "mesh_monitoring | check the mesh-monitoring Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-mesh-monitoring-d1"

- name: "mesh_monitoring | look up the Prometheus StatefulSet"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    namespace: zuno-mesh
    name: prometheus-mesh-monitoring
  register: _mesh_monitoring_prometheus_lookup

- name: "mesh_monitoring | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        _mesh_monitoring_d0_installed and _state_check_result
        and (_mesh_monitoring_prometheus_lookup.resources | default([]) | length) > 0
        and (_mesh_monitoring_prometheus_lookup.resources[0].status.readyReplicas | default(0)) > 0
      }}

- name: "mesh_monitoring | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
