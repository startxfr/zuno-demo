---
# Reverse of install.yml: delete -d1 first (avoids ArgoCD fighting a CR
# deletion), then remove_operator.yml (needs the Subscription to still
# exist) before -d0's own delete.
- name: "mesh_monitoring | delete the mesh-monitoring GitOps Application (d1: MonitoringStack + ServiceMonitor/PodMonitor)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-mesh-monitoring-d1"

- name: "mesh_monitoring | remove the operator (its owned CRDs - cascading the MonitoringStack instance - then the CSV, then the Subscription)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/remove_operator.yml"
  vars:
    operator_subscription_name: cluster-observability-operator
    operator_namespace: openshift-cluster-observability-operator

- name: "mesh_monitoring | delete the mesh-monitoring GitOps Application (d0: cascades the remaining OperatorGroup/Namespace)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-mesh-monitoring-d0"
