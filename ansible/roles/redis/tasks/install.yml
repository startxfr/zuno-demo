---
# ADR-0042. No OLM operator (plain Helm deployment, bitnami/redis) - same
# shape as ansible/roles/vault, all real content is -d1.
#
# ADR-0352 / WP-214: the mode dispatch of the WP-143 MariaDB pilot. The
# confidential.yml load runs FIRST, then:
# internal = today's behaviour bit for bit (install_internal.yml),
# external = validate + seed Vault + assert the endpoint, deploy nothing
# (install_external.yml). Absent means internal. Known limit (WP-143 live
# finding c): the mode lives in confidential.yml, which AAP checkouts do not
# carry - an AAP-launched install of an external-mode cluster would treat it
# as internal, so run this role locally while the mode is external.
- name: "redis | check for ansible/confidential.yml"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/confidential.yml"
  register: _redis_confidential_file

- name: "redis | load ansible/confidential.yml if present"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/confidential.yml"
  when: _redis_confidential_file.stat.exists

- name: "redis | resolve the component mode (ADR-0352)"
  ansible.builtin.set_fact:
    _redis_mode: "{{ zuno_redis_mode | default('internal') }}"

- name: "redis | fail on an unknown mode value"
  ansible.builtin.fail:
    msg: >-
      zuno_redis_mode is '{{ _redis_mode }}' - expected 'internal' or
      'external' (ADR-0352 clause 1; absent means internal).
  when: _redis_mode not in ['internal', 'external']

- name: "redis | install the built-in Redis (internal mode)"
  ansible.builtin.include_tasks: install_internal.yml
  when: _redis_mode == 'internal'

- name: "redis | verify and seed the external Redis (external mode)"
  ansible.builtin.include_tasks: install_external.yml
  when: _redis_mode == 'external'
