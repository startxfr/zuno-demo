---
# ADR-0352 / WP-214: internal mode, today's install unchanged (dispatched by
# install.yml). The two applies below are byte-for-byte the pre-WP-214
# install.yml.
- name: "redis | apply the redis GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "redis"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

- name: "redis | apply the redis GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "redis"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 15
    # ADR-0619 clause 2 / WP-292: admit the Praxis pod on 6379 (its token_rate_limit store) while zuno_praxis_enabled;
    # the Application declares no values of its own, so nothing is replaced. Same switch as the models role.
    gitops_app_extra_helm_values:
      altGatewayPeers:
        praxis:
          enabled: "{{ zuno_praxis_enabled | default(false) | bool }}"
