---
# State detection (never fails). ADR-0352 / WP-214: mode-gated like the
# install (clause 4 symmetric gating) - the external personality asserts
# endpoint reachability, AUTH and the connection budget and never inspects the
# zuno-redis Applications (which do not exist in external mode). Known limit
# (as for mariadb): the mode lives in confidential.yml, which AAP checkouts do
# not carry, so an AAP-driven check of an external-mode cluster falls back to
# the internal personality and reports NOT installed.
- name: "redis | check for ansible/confidential.yml"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/confidential.yml"
  register: _redis_confidential_file

- name: "redis | load ansible/confidential.yml if present"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/confidential.yml"
  when: _redis_confidential_file.stat.exists

- name: "redis | resolve the component mode (ADR-0352)"
  ansible.builtin.set_fact:
    _redis_mode: "{{ zuno_redis_mode | default('internal') }}"

- name: "redis | internal-mode state detection"
  when: _redis_mode != 'external'
  block:
    - name: "redis | check the redis Application (d0)"
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
      vars:
        gitops_app_name: "zuno-redis-d0"

    - name: "redis | save the d0 check result"
      ansible.builtin.set_fact:
        _redis_d0_installed: "{{ _state_check_result }}"

    - name: "redis | check the redis Application (d1)"
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
      vars:
        gitops_app_name: "zuno-redis-d1"

    - name: "redis | look up the Redis master StatefulSet"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: StatefulSet
        namespace: zuno-auth
        label_selectors:
          - "app.kubernetes.io/name=redis"
          - "app.kubernetes.io/component=master"
      register: _redis_sts_lookup

    - name: "redis | compute install state"
      ansible.builtin.set_fact:
        _state_is_installed: >-
          {{
            _redis_d0_installed
            and _state_check_result
            and (_redis_sts_lookup.resources | default([]) | length) > 0
            and (_redis_sts_lookup.resources[0].status.readyReplicas | default(0)) > 0
          }}

- name: "redis | external-mode state detection"
  when: _redis_mode == 'external'
  block:
    - name: "redis | assert the external endpoint (record-state, never fail)"
      ansible.builtin.include_tasks: external_assert.yml
      vars:
        redis_assert_hard_fail: false

    - name: "redis | compute install state (external)"
      ansible.builtin.set_fact:
        _state_is_installed: "{{ _redis_external_ok | bool }}"

- name: "redis | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
