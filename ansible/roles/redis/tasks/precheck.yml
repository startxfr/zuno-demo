---
# State detection (never fails).
- name: "redis | check the redis Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-redis-d0"

- name: "redis | save the d0 check result"
  ansible.builtin.set_fact:
    _redis_d0_installed: "{{ _state_check_result }}"

- name: "redis | check the redis Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-redis-d1"

- name: "redis | look up the Redis master StatefulSet"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    namespace: zuno-auth
    label_selectors:
      - "app.kubernetes.io/name=redis"
      - "app.kubernetes.io/component=master"
  register: _redis_sts_lookup

- name: "redis | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        _redis_d0_installed
        and _state_check_result
        and (_redis_sts_lookup.resources | default([]) | length) > 0
        and (_redis_sts_lookup.resources[0].status.readyReplicas | default(0)) > 0
      }}

- name: "redis | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
