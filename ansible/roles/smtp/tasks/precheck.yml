---
# State detection (never fails). smtp has no operator - just the
# zuno-smtp-d0/-d1 Applications (gitops/charts/smtp) plus the
# ExternalSecret's own Ready condition.
- name: "smtp | check the smtp Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-smtp-d0"

- name: "smtp | save the d0 check result"
  ansible.builtin.set_fact:
    _smtp_d0_installed: "{{ _state_check_result }}"

- name: "smtp | check the smtp Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-smtp-d1"

- name: "smtp | look up the technical mail identity ExternalSecret"
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1beta1
    kind: ExternalSecret
    namespace: zuno-ai-run
    name: smtp-technical-credentials
  register: _smtp_secret_lookup

- name: "smtp | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        _smtp_d0_installed and _state_check_result and
        (_smtp_secret_lookup.resources | default([]) | length) > 0 and
        (_smtp_secret_lookup.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | list | first | default('False')) == 'True'
      }}

- name: "smtp | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
