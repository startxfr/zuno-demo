---
- name: "smtp | verify the External Secrets Operator's ClusterSecretStore is ready"
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1beta1
    kind: ClusterSecretStore
    name: vault-backend
  register: _smtp_precheck_store

- name: "smtp | fail if the ClusterSecretStore is not present"
  ansible.builtin.fail:
    msg: "vault-backend ClusterSecretStore not found. Run `make d0 configure external-secrets` first."
  when: (_smtp_precheck_store.resources | default([]) | length) == 0

- name: "smtp | precheck summary"
  ansible.builtin.debug:
    msg: "vault-backend ClusterSecretStore is present; the SMTP ExternalSecret can be registered."
