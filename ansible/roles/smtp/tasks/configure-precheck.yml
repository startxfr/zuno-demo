---
# State detection (never fails). smtp has no configure phase - "configured"
# mirrors "installed".
- name: "smtp | look up the technical mail identity ExternalSecret"
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1beta1
    kind: ExternalSecret
    namespace: zuno-ai-run
    name: smtp-technical-credentials
  register: _smtp_secret_lookup

- name: "smtp | compute configure state"
  ansible.builtin.set_fact:
    _state_is_configured: >-
      {{
        (_smtp_secret_lookup.resources | default([]) | length) > 0 and
        (_smtp_secret_lookup.resources[0].status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | list | first | default('False')) == 'True'
      }}

- name: "smtp | record configure state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_configure_state.yml"
