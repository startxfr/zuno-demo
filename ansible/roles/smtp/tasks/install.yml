---
# smtp is a Day 0 component (ADR-0056, reachable via `make d0 install
# smtp`) - there is no SMTP server to install, only the technical mail
# identity's credential to expose via ExternalSecret, seeded as an empty
# placeholder at secret/zuno/smtp/technical by
# ansible/roles/vault/tasks/install.yml. An operator must populate it
# (`vault kv put secret/zuno/smtp/technical host=... username=... password=...`)
# before whichever service sends the Comage weekly report (out of scope
# here) can actually send mail.
# ADR-0310: ansible/roles/smtp/kustomize/runtime/.
- name: "smtp | apply the zuno-ai-run namespace and the technical mail identity ExternalSecret"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/smtp/kustomize/runtime"
