---
# smtp is a Day 0 component (ADR-0056, reachable via `make d0 install
# smtp`) - there is no SMTP server to install, only the technical mail
# identity's credential to expose via ExternalSecret, seeded as an empty
# placeholder at secret/zuno/smtp/technical by
# ansible/roles/vault/tasks/install.yml. An operator must populate it
# (`vault kv put secret/zuno/smtp/technical host=... username=... password=...`)
# before whichever service sends the Comage weekly report (out of scope
# here) can actually send mail.
#
# No OLM operator involved - gitops/charts/smtp (namespace.enabled/
# credentials.enabled) is applied via two Applications for the same
# uniform -d0/-d1 pattern every Day 0 component here follows.
- name: "smtp | apply the smtp GitOps Application (d0: zuno-ai-run namespace)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "smtp"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

- name: "smtp | apply the smtp GitOps Application (d1: technical mail identity ExternalSecret)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "smtp"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
