---
# There is no SMTP server to install, only the technical mail identity's
# credential to expose via ExternalSecret, seeded at zuno/smtp/technical
# by the vault role from ansible/confidential.yml.
#
# zuno_smtp_enabled (soft-read below, no fail if the file is missing) gates
# both Applications: defaults to true, but confidential.example.yml sets it
# to false as the demo-friendly default.
- name: "smtp | check for ansible/confidential.yml"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/confidential.yml"
  register: _smtp_confidential_file

- name: "smtp | load ansible/confidential.yml if present"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/confidential.yml"
  when: _smtp_confidential_file.stat.exists

- name: "smtp | apply the smtp GitOps Application (d0: zuno-ai-run namespace)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "smtp"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"
  when: zuno_smtp_enabled | default(true) | bool

- name: "smtp | apply the smtp GitOps Application (d1: technical mail identity ExternalSecret)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "smtp"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
  when: zuno_smtp_enabled | default(true) | bool

- name: "smtp | note that smtp is disabled"
  ansible.builtin.debug:
    msg: >-
      zuno_smtp_enabled is false in ansible/confidential.yml - skipping
      both smtp GitOps Applications. Set it to true (or remove it) and
      re-run `make d0 install smtp` to enable the technical mail identity.
  when: not (zuno_smtp_enabled | default(true) | bool)
