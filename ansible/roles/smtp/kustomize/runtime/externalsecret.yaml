apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: smtp-technical-credentials
  namespace: zuno-ai-run
  labels:
    zuno.io/managed-by: zuno-ansible
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: smtp-technical-credentials
    creationPolicy: Owner
  data:
    - secretKey: host
      remoteRef:
        key: zuno/smtp/technical
        property: host
    - secretKey: username
      remoteRef:
        key: zuno/smtp/technical
        property: username
    - secretKey: password
      remoteRef:
        key: zuno/smtp/technical
        property: password
