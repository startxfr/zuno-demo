---
# Package name/default channel confirmed live against this cluster's
# redhat-operators catalog on 2026-09-02: "policy-controller-operator",
# defaultChannel "stable" (also published literally), InstallModes
# OwnNamespace AND AllNamespaces both supported - OwnNamespace chosen,
# co-located in zuno-rhtas (WP-110's namespace). Still discover
# catalog/channel from the PackageManifest rather than hardcoding (ADR-0048).
- name: "rhtas_config | resolve the operator package"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_operator_package.yml"
  vars:
    operator_package_name: "{{ policy_controller_package_name | default('policy-controller-operator') }}"
    operator_subscription_namespace: "policy-controller-operator"
    operator_package_catalog_hint: "policy-controller"

- name: "rhtas_config | apply the rhtas-config GitOps Application (d0: Policy Controller operator)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  when: not (operator_package_skip_d0 | bool)
  vars:
    gitops_component_name: "rhtas-config"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-rhtas-config-d0"
    gitops_app_extra_helm_values:
      operator:
        enabled: true
        subscription:
          name: "{{ policy_controller_package_name | default('policy-controller-operator') }}"
          operator:
            name: "{{ policy_controller_package_name | default('policy-controller-operator') }}"
            channel: "{{ operator_package_channel }}"
            source:
              name: "{{ operator_package_catalog }}"
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 15

- name: "rhtas_config | wait for the policy-controller-manager Deployment to become Available"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    # OLM OwnNamespace install mode: the Subscription/CSV land in their
    # own dedicated namespace (gitops/apps/rhtas-config/application-d0.yaml's
    # destination.namespace), which is policy-controller-operator, not
    # zuno-rhtas - live finding, first real run of this never-before-
    # invoked role (2026-09-08).
    namespace: policy-controller-operator
    name: policy-controller-manager
  register: _rhtas_config_operator_deployment
  until: >-
    (_rhtas_config_operator_deployment.resources | default([]) | length) > 0 and
    (_rhtas_config_operator_deployment.resources[0].status.conditions | default([])
     | selectattr('type', 'equalto', 'Available') | map(attribute='status') | list
     | first | default('False')) == 'True'
  retries: 60
  delay: 10

# Live finding, WP-111 (2026-09-02): policy-controller-operator.v1.0.2's
# ClusterImagePolicy CRD ships a broken conversion webhook - its
# clientConfig points at a Service/namespace ("webhook.policy-controller-
# operator") that never exists, and even patched to the real Service
# (policy-controller-manager-service, same pod as the "-webhook-service"
# Service, same cert) the pod's webhook server doesn't actually implement
# the /convert route (context-deadline-exceeded / "resource not found").
# v1alpha1 (this CRD's storage version) and v1beta1 have IDENTICAL spec
# shapes, so there is nothing to actually convert - switching the
# strategy to None serves both versions as-is with no transformation,
# sidestepping the non-functional webhook entirely. User-approved cluster
# mutation (2026-09-02); not GitOps-managed (a CRD's conversion strategy
# isn't something gitops/charts/rhtas-config can own), so reapplied here
# idempotently on every install - a fresh deploy or an operator
# reconcile that resets the CRD would otherwise silently reintroduce the
# trap.
- name: "rhtas_config | check the ClusterImagePolicy CRD's current conversion strategy"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: clusterimagepolicies.policy.sigstore.dev
  register: _rhtas_config_cip_crd

- name: "rhtas_config | fix the ClusterImagePolicy CRD's broken conversion webhook (strategy: None)"
  kubernetes.core.k8s_json_patch:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: clusterimagepolicies.policy.sigstore.dev
    patch:
      - op: replace
        path: /spec/conversion/strategy
        value: None
      - op: remove
        path: /spec/conversion/webhook
  when: (_rhtas_config_cip_crd.resources[0].spec.conversion.strategy | default('')) != 'None'

# ADR-0535/WP-111: the ansible-managed Keycloak CA ConfigMap - Trust
# already established for zuno-rhtas by WP-110's rhtas role; the signing
# Jobs in zuno-ai-build need their own copy for the same reason
# (secretKeyRef/ConfigMap can't cross namespaces).
- name: "rhtas_config | publish the Keycloak CA ConfigMap in zuno-ai-build"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/publish_keycloak_ca_configmap.yml"
  vars:
    publish_ca_configmap_namespace: zuno-ai-build

- name: "rhtas_config | resolve the cluster base domain (for the Fulcio OIDC issuer)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_base_domain.yml"

# TrustRoot's spec.remote.root is a base64-encoded TUF root.json - cannot
# be committed (cluster-specific keys), resolved live the same way every
# other operator's channel/catalog is (ADR-0048). Fetched from inside the
# cluster (the TUF Service has no Route requirement for this - it also has
# one, but the in-cluster Service is simpler and matches how
# ClusterImagePolicy/PolicyController reach Fulcio/Rekor below).
- name: "rhtas_config | delete any previous TUF-root-fetch pod (idempotent-by-recreation)"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Pod
    name: rhtas-tuf-root-fetch
    namespace: zuno-rhtas
    wait: true

# None of the RHTAS operand images carry wget/curl (RHEL9-UBI minimal, no
# shell tooling beyond the binary itself, live finding 2026-09-02) - a
# throwaway curlimages/curl pod is the reliable way to reach the in-cluster
# TUF Service from inside the ansible controller (no route/network access
# to it otherwise).
- name: "rhtas_config | run a throwaway pod to fetch the TUF root.json"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Pod
      metadata:
        name: rhtas-tuf-root-fetch
        namespace: zuno-rhtas
        labels:
          zuno.io/purpose: wp111-tuf-root-fetch
      spec:
        restartPolicy: Never
        containers:
          - name: fetch
            image: registry.redhat.io/openshift4/ose-tools-rhel9@sha256:a3bdc6574db914ec8c4385b6ff8b2c315930f8de9a27a3a9e0204163c85cd6be
            command: ["sh", "-c", "sleep 300"]

- name: "rhtas_config | wait for the fetch pod to be Running"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: zuno-rhtas
    name: rhtas-tuf-root-fetch
  register: _rhtas_config_fetch_pod
  until: (_rhtas_config_fetch_pod.resources | default([]) | length) > 0 and _rhtas_config_fetch_pod.resources[0].status.phase == 'Running'
  retries: 30
  delay: 5

- name: "rhtas_config | fetch the live TUF root.json"
  kubernetes.core.k8s_exec:
    namespace: zuno-rhtas
    pod: rhtas-tuf-root-fetch
    command: >-
      sh -c "curl -s http://tuf.zuno-rhtas.svc.cluster.local/root.json | base64 -w0"
  register: _rhtas_config_tuf_root
  changed_when: false

- name: "rhtas_config | delete the TUF-root-fetch pod"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Pod
    name: rhtas-tuf-root-fetch
    namespace: zuno-rhtas
    wait: false

# gitops_app_extra_helm_values REPLACES spec.source.helm.values wholesale
# rather than merging (17e4117c's finding for cert-manager - values is a
# YAML *string* key, combine(recursive=True) cannot descend into it).
# This role's own extra_helm_values already re-declares everything
# application-d1.yaml's static block has today (policyOperand.enabled/
# signerClientMirror.enabled), so nothing is currently lost - but that's
# duplication waiting to drift, not a fix. Start from the manifest's own
# values instead, same pattern as ansible/roles/cert_manager and
# ansible/roles/rhtas.
- name: "rhtas_config | apply the rhtas-config GitOps Application (d1: Policy Controller operand)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "rhtas-config"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-rhtas-config-d1"
    gitops_app_extra_helm_values: >-
      {{
        ((lookup('ansible.builtin.file', zuno_repo_root + '/gitops/apps/rhtas-config/application-d1.yaml')
          | replace('apps.mycluster.example.com', cluster_base_domain)
          | from_yaml).spec.source.helm['values'] | from_yaml)
        | combine(
            {
              'policyOperand': {
                'trustRoot': {'rootJsonBase64': _rhtas_config_tuf_root.stdout | trim},
                'clusterImagePolicy': {'certIdentityIssuer': 'https://keycloak.' + cluster_base_domain + '/realms/zuno'}
              }
            },
            recursive=True
          )
      }}
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 15

- name: "rhtas_config | wait for the ClusterImagePolicy to report Ready"
  # v1alpha1, not v1beta1 - see templates/clusterimagepolicy.yaml's header
  # comment (live finding: this CRD's v1beta1 conversion webhook is
  # mispackaged; v1alpha1 is the storage version and needs no conversion).
  kubernetes.core.k8s_info:
    api_version: policy.sigstore.dev/v1alpha1
    kind: ClusterImagePolicy
    name: zuno-first-party-images
  register: _rhtas_config_cip
  until: >-
    (_rhtas_config_cip.resources | default([]) | length) > 0 and
    (_rhtas_config_cip.resources[0].status.conditions | default([])
     | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | list
     | first | default('False')) == 'True'
  retries: 30
  delay: 10

- name: "rhtas_config | install summary"
  ansible.builtin.debug:
    msg: >-
      Policy Controller operator Available, TrustRoot/ClusterImagePolicy
      (audit-only, spec.mode: warn) Ready, zuno-signer-client-secret
      mirrored into zuno-ai-build.
