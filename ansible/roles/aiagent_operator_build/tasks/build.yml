---
# Day 1 "aiagent-operator" build component: builds the AIAgent operator
# manager image via native OpenShift BuildConfig/ImageStream in
# zuno-ai-build - see ansible/tasks/apply_openshift_build.yml for the
# shared mechanism.
- name: "aiagent_operator_build | build aiagent-operator"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_openshift_build.yml"
  vars:
    build_image_name: aiagent-operator
    build_dockerfile_path: Dockerfile
    build_context_dir: operator/aiagent-operator
