---
# State detection (never fails).
- name: "custom_metrics_autoscaler | check the custom-metrics-autoscaler Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-custom-metrics-autoscaler-d0"

- name: "custom_metrics_autoscaler | save the d0 check result"
  ansible.builtin.set_fact:
    _cma_d0_installed: "{{ _state_check_result }}"

- name: "custom_metrics_autoscaler | check the custom-metrics-autoscaler Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-custom-metrics-autoscaler-d1"

- name: "custom_metrics_autoscaler | look up the KedaController instance"
  kubernetes.core.k8s_info:
    api_version: keda.sh/v1alpha1
    kind: KedaController
    name: keda
    namespace: openshift-keda
  register: _cma_kedacontroller_lookup

- name: "custom_metrics_autoscaler | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        _cma_d0_installed
        and _state_check_result
        and (_cma_kedacontroller_lookup.resources | default([]) | length) > 0
      }}

- name: "custom_metrics_autoscaler | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
