---
# Ordered alongside connectivity_link/jobset and ahead of openshift_ai -
# ADR-0318 installs this operator ahead of any actual
# ScaledObject/TriggerAuthentication consumer.

# Catalog source/channel naming isn't verified against a live cluster
# (ADR-0318's Operational considerations); discover both from the
# PackageManifest rather than hardcoding, same pattern as
# ansible/roles/external_secrets/tasks/install.yml.
- name: "custom_metrics_autoscaler | resolve the operator package"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_operator_package.yml"
  vars:
    operator_package_name: "{{ custom_metrics_autoscaler_package_name | default('openshift-custom-metrics-autoscaler-operator') }}"
    operator_subscription_namespace: "openshift-keda"
    operator_package_catalog_hint: "custom-metrics"

- name: "custom_metrics_autoscaler | apply the custom-metrics-autoscaler GitOps Application (d0: operator)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  when: not (operator_package_skip_d0 | bool)
  vars:
    gitops_component_name: "custom-metrics-autoscaler"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-custom-metrics-autoscaler-d0"
    gitops_app_extra_helm_values:
      project:
        enabled: true
      operator:
        enabled: true
        subscription:
          operator:
            channel: "{{ operator_package_channel }}"
            source:
              name: "{{ operator_package_catalog }}"
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 15

- name: "custom_metrics_autoscaler | apply the custom-metrics-autoscaler GitOps Application (d1: KedaController instance)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "custom-metrics-autoscaler"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-custom-metrics-autoscaler-d1"
    # NOTE: gitops_app_extra_helm_values REPLACES the Application
    # manifest's spec.source.helm.values wholesale (see the combine() in
    # ansible/tasks/apply_gitops_app.yml) - it does not merge with it. Any
    # key added to application-d1.yaml MUST be repeated here or every run
    # of this role silently deletes it. ADR-0542/WP-121's
    # ClusterTriggerAuthentication is exactly such a key.
    gitops_app_extra_helm_values:
      kedaController:
        enabled: true
      triggerAuthentication:
        enabled: true
    gitops_app_wait_retries: 30
    gitops_app_wait_delay: 15
