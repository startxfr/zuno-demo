---
# Builds every image the Tekos agent surface needs: shared Agent Runtime
# plus Tekos's own frontend/BFF (only active agent in v0).
- name: "agent_build | build agent-runtime"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_openshift_build.yml"
  vars:
    build_image_name: agent-runtime
    build_dockerfile_path: components/agent-runtime/Dockerfile
    build_context_dir: "."

- name: "agent_build | build agent-bff"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_openshift_build.yml"
  vars:
    build_image_name: agent-bff
    build_dockerfile_path: Dockerfile
    build_context_dir: components/agent-bff

- name: "agent_build | build agent-frontend"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_openshift_build.yml"
  vars:
    build_image_name: agent-frontend
    build_dockerfile_path: components/agent-frontend/Dockerfile
    build_context_dir: "."

# ADR-0420/WP-069: OKF bundle re-signing used to run here, gated on
# `day2_verb == 'build'`. It moved to its own Day 3 verb - `make d3 sign
# agents` - because signing acts on already-installed agent bundles and
# builds nothing, and because burying it here left the step nameless: two
# commits (WP-074, WP-087 Part D) regenerated OKF bundles without
# re-signing, and the omission only surfaced much later as an
# unactionable signature failure inside `make d2 check agents`.
#
# This is a reminder, not a substitute. It fires only on an explicit
# build, where the bundles baked into the image just changed and their
# stored signatures are therefore now stale.
- name: "agent_build | remind that the OKF bundles must be re-signed"
  ansible.builtin.debug:
    msg: >-
      agent-runtime was rebuilt, so the OKF bundle signatures in Vault no
      longer match the bundles this image carries. Re-sign them now:
      make d3 sign agents
  when: (day2_verb | default('install')) == 'build'
