---
# Package name/default channel confirmed live against this cluster's
# redhat-operators catalog on 2026-09-02: "rhtas-operator", defaultChannel
# "stable" (also published literally as its own channel name), InstallModes
# AllNamespaces only (OwnNamespace/SingleNamespace/MultiNamespace all
# unsupported) - so, unlike ansible/roles/lightspeed/tasks/install.yml,
# this role has no dedicated namespace/OperatorGroup step: subscribed into
# the shared openshift-operators namespace, same Pattern B shape as
# ansible/roles/mariadb/tasks/install.yml. Still discover catalog/channel
# from the PackageManifest rather than hardcoding them (ADR-0048).
- name: "rhtas | look up the {{ rhtas_package_name | default('rhtas-operator') }} PackageManifest"
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    namespace: openshift-marketplace
    name: "{{ rhtas_package_name | default('rhtas-operator') }}"
  register: _rhtas_pkg_info

- name: "rhtas | fail if the package isn't published anywhere on this cluster"
  ansible.builtin.fail:
    msg: >-
      No PackageManifest named '{{ rhtas_package_name | default('rhtas-operator') }}'
      was found in openshift-marketplace. Check `oc get packagemanifest -n
      openshift-marketplace | grep -i rhtas` for the correct package name on
      this cluster (it must be published by the Red Hat Operators catalog).
      Re-run with `-e rhtas_package_name=<name>` or update this role's
      default if the catalog on this cluster differs.
  when: (_rhtas_pkg_info.resources | default([]) | length) == 0

- name: "rhtas | select the catalog/channel to subscribe from"
  ansible.builtin.set_fact:
    _rhtas_catalog_source: "{{ _rhtas_pkg_info.resources[0].status.catalogSource }}"
    _rhtas_channel: >-
      {{
        'stable'
        if (_rhtas_pkg_info.resources[0].status.channels | selectattr('name', 'equalto', 'stable') | list | length) > 0
        else (_rhtas_pkg_info.resources[0].status.defaultChannel | default(''))
      }}

- name: "rhtas | fail if no usable channel was found"
  ansible.builtin.fail:
    msg: >-
      Package '{{ rhtas_package_name | default('rhtas-operator') }}'
      (catalog '{{ _rhtas_catalog_source }}') has no "stable" channel and
      no defaultChannel to fall back to. Published channels:
      {{ _rhtas_pkg_info.resources[0].status.channels | map(attribute='name') | list }}.
  when: _rhtas_channel | length == 0

- name: "rhtas | discovery summary"
  ansible.builtin.debug:
    msg: >-
      Subscribing to package '{{ rhtas_package_name | default('rhtas-operator') }}',
      catalog '{{ _rhtas_catalog_source }}', channel '{{ _rhtas_channel }}'.

# The Subscription (operator.enabled) lives in gitops/charts/rhtas, applied
# via the separate zuno-rhtas-d0 Application. No dedicated OperatorGroup:
# same reasoning as mariadb/postgresql (AllNamespaces-only CSV).
- name: "rhtas | apply the RHTAS GitOps Application (d0: operator)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "rhtas"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-rhtas-d0"
    gitops_app_extra_helm_values:
      operator:
        enabled: true
        subscription:
          name: "{{ rhtas_package_name | default('rhtas-operator') }}"
          operator:
            name: "{{ rhtas_package_name | default('rhtas-operator') }}"
            channel: "{{ _rhtas_channel }}"
            source:
              name: "{{ _rhtas_catalog_source }}"
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 15

# rhtas-operator is a native (non-Helm-operator) controller - its CSV
# Deployment IS the real controller-manager, no MariadbOperator-style
# activation CR needed before Securesign CRs can be reconciled. Confirm
# its Deployment name live rather than assuming - the CSV's own strategy
# spec names it; this was confirmed against this cluster as
# "rhtas-operator-controller-manager".
- name: "rhtas | wait for the rhtas-operator controller-manager to become Available"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: openshift-operators
    name: rhtas-operator-controller-manager
  register: _rhtas_operator_deployment
  until: >-
    (_rhtas_operator_deployment.resources | default([]) | length) > 0 and
    (_rhtas_operator_deployment.resources[0].status.conditions | default([])
     | selectattr('type', 'equalto', 'Available') | map(attribute='status') | list
     | first | default('False')) == 'True'
  retries: 60
  delay: 10

# ADR-0347's finding, reapplied: the live Keycloak route is served by a
# Vault-PKI-issued cert, and Fulcio's OIDC issuer discovery would reject
# it without that CA in its trust bundle (Securesign spec.fulcio.trustedCA).
# Shared with WP-111's rhtas_config role (same CA, different namespace).
- name: "rhtas | publish the Keycloak CA ConfigMap for fulcio.trustedCA"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/publish_keycloak_ca_configmap.yml"
  vars:
    publish_ca_configmap_namespace: zuno-rhtas

# WP-110 live finding (2026-09-02): with trillian.database.create=false
# the operator does NOT create Trillian's schema - only its own embedded
# database image does (via /docker-entrypoint-initdb.d/storage.sql), so on
# an external database the createtree jobs die with "Table trillian.Trees
# doesn't exist", and their Rekor/CTlog CRs then sit in a TERMINAL
# "createtree job failed" state the operator never retries (fix: delete
# the child Rekor/CTlog CRs, the Securesign parent recreates them).
# files/trillian-storage.sql is that exact schema, extracted from this
# CSV's own trillian-db relatedImage - re-extract it on operator upgrades.
# Idempotent (CREATE TABLE IF NOT EXISTS throughout), applied as the
# trillian user so no extra grants are involved.
#
# ADR-0352/WP-143: applied by a short-lived CLIENT Job against the
# resolved endpoint, not by exec-ing into the mariadb-0 pod - that pod
# only exists in internal mode, and clause 11 forbids this role from
# branching on mariadb's mode. The password comes from Vault
# (rhtas/trillian-mysql - correct in both modes, external seeding
# included) through a short-lived ExternalSecret, because the chart's own
# rhtas-trillian-db Secret is only rendered by the -d1 apply BELOW this
# point, and the schema must exist before Securesign's createtree jobs
# run (the terminal-state trap above). The earlier k8s_cp+k8s_exec shape
# existed because a 6.5KB schema can't ride a single exec argument - a
# Job mounting the schema as a ConfigMap has no such transport limit.
- name: "rhtas | resolve the MariaDB endpoint (ADR-0352/WP-143)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_mariadb_endpoint.yml"

- name: "rhtas | materialize the Trillian DB password for the schema Job"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: rhtas-trillian-schema-db
        namespace: zuno-rhtas
        labels:
          zuno.io/managed-by: zuno-ansible
      spec:
        refreshInterval: 1h
        secretStoreRef:
          name: vault-backend
          kind: ClusterSecretStore
        target:
          name: rhtas-trillian-schema-db
        data:
          - secretKey: password
            remoteRef:
              key: rhtas/trillian-mysql
              property: password

- name: "rhtas | wait for the schema-Job password Secret to materialize"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: zuno-rhtas
    name: rhtas-trillian-schema-db
  register: _rhtas_schema_db_secret
  until: (_rhtas_schema_db_secret.resources | default([]) | length) > 0
  retries: 30
  delay: 5

- name: "rhtas | publish the Trillian schema as a ConfigMap"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: rhtas-trillian-schema
        namespace: zuno-rhtas
        labels:
          zuno.io/managed-by: zuno-ansible
      data:
        storage.sql: "{{ lookup('ansible.builtin.file', role_path + '/files/trillian-storage.sql') }}"

- name: "rhtas | delete any previous Trillian schema-apply Job"
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    namespace: zuno-rhtas
    name: rhtas-trillian-schema-apply
    wait: true
    wait_timeout: 60

- name: "rhtas | apply the Trillian schema through a client Job (idempotent)"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: rhtas-trillian-schema-apply
        namespace: zuno-rhtas
        labels:
          zuno.io/managed-by: zuno-ansible
      spec:
        backoffLimit: 2
        ttlSecondsAfterFinished: 3600
        template:
          metadata:
            annotations:
              sidecar.istio.io/inject: "false"
          spec:
            restartPolicy: Never
            containers:
              - name: schema-apply
                image: "{{ zuno_mariadb_client_image | default('registry.redhat.io/rhel9/mariadb-1011:latest') }}"
                env:
                  - name: MARIADB_HOST
                    value: "{{ mariadb_endpoint_host }}"
                  - name: MARIADB_PORT
                    value: "{{ mariadb_endpoint_port }}"
                  - name: MARIADB_USER
                    value: "{{ mariadb_db_trillian_username }}"
                  - name: MYSQL_PWD
                    valueFrom:
                      secretKeyRef:
                        name: rhtas-trillian-schema-db
                        key: password
                command:
                  - /bin/sh
                  - -c
                  - >-
                    mysql -h "$MARIADB_HOST" -P "$MARIADB_PORT"
                    -u "$MARIADB_USER" --connect-timeout=10
                    trillian < /schema/storage.sql
                volumeMounts:
                  - name: schema
                    mountPath: /schema
                    readOnly: true
                securityContext:
                  allowPrivilegeEscalation: false
                  runAsNonRoot: true
                  capabilities:
                    drop: ["ALL"]
                  seccompProfile:
                    type: RuntimeDefault
            volumes:
              - name: schema
                configMap:
                  name: rhtas-trillian-schema

- name: "rhtas | wait for the Trillian schema-apply Job to succeed"
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    namespace: zuno-rhtas
    name: rhtas-trillian-schema-apply
  register: _rhtas_schema_job
  until: >-
    (_rhtas_schema_job.resources | default([]) | length) > 0 and
    ((_rhtas_schema_job.resources[0].status.succeeded | default(0) | int) > 0
     or (_rhtas_schema_job.resources[0].status.failed | default(0) | int) > 0)
  retries: 30
  delay: 10

- name: "rhtas | fail if the Trillian schema apply failed"
  ansible.builtin.fail:
    msg: >-
      The rhtas-trillian-schema-apply Job in zuno-rhtas failed - inspect
      its pod log. Without the schema, Securesign's createtree jobs die
      with "Table trillian.Trees doesn't exist" and Rekor/CTlog go
      terminal (WP-110).
  when: (_rhtas_schema_job.resources[0].status.succeeded | default(0) | int) == 0

# The schema-only ExternalSecret and ConfigMap never outlive the apply -
# the chart's own rhtas-trillian-db Secret (rendered by -d1 below) is the
# runtime credential source. Deleting the ExternalSecret cascades its
# owned target Secret.
- name: "rhtas | clean up the schema-apply support objects"
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    namespace: zuno-rhtas
    name: "{{ item.name }}"
  loop:
    - { api_version: batch/v1, kind: Job, name: rhtas-trillian-schema-apply }
    - { api_version: external-secrets.io/v1beta1, kind: ExternalSecret, name: rhtas-trillian-schema-db }
    - { api_version: v1, kind: ConfigMap, name: rhtas-trillian-schema }
  loop_control:
    label: "{{ item.kind }}/{{ item.name }}"

# securesignOperand.enabled lives in the same chart, applied via the
# separate zuno-rhtas-d1 Application after -d0 is Synced+Healthy. The
# fulcio.oidc.issuerUrl placeholder in application-d1.yaml is substituted
# with the real cluster domain by apply_gitops_app.yml itself.
# gitops_app_extra_helm_values REPLACES spec.source.helm.values wholesale
# rather than merging (values is a YAML *string* key, combine(recursive=
# True) cannot descend into it - the exact trap 17e4117c fixed for
# cert-manager and application-d1.yaml here has its own static
# securesignOperand.enabled/fulcio.oidc.issuerUrl block that a naive
# extra_helm_values would silently delete, rendering nothing). Start from
# the manifest's own values, merge in only fulcio.trustedCAConfigMapName -
# empty string when the Keycloak serving cert has no ca.crt (a
# publicly-trusted CA, e.g. Let's Encrypt post-ADR-0211 flip):
# templates/securesign.yaml then omits fulcio.trustedCA entirely, so
# Fulcio falls back to its own default trust store (already trusts ISRG
# Root X1) instead of pointing at a stale or nonexistent ConfigMap.
- name: "rhtas | apply the RHTAS GitOps Application (d1: Securesign operand)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "rhtas"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-rhtas-d1"
    gitops_app_extra_helm_values: >-
      {{
        ((lookup('ansible.builtin.file', zuno_repo_root + '/gitops/apps/rhtas/application-d1.yaml')
          | replace('apps.mycluster.example.com', cluster_base_domain)
          | from_yaml).spec.source.helm['values'] | from_yaml)
        | combine(
            {'fulcio': {'trustedCAConfigMapName': 'rhtas-keycloak-ca' if (keycloak_ca_configmap_published | bool) else ''}},
            recursive=True
          )
        | combine(
            {'trillianDatabase': {'host': mariadb_endpoint_host,
                                  'port': mariadb_endpoint_port,
                                  'user': mariadb_db_trillian_username}},
            recursive=True
          )
      }}
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 15

- name: "rhtas | wait for the Securesign CR to report Ready"
  kubernetes.core.k8s_info:
    api_version: rhtas.redhat.com/v1alpha1
    kind: Securesign
    namespace: zuno-rhtas
    name: zuno-securesign
  register: _rhtas_securesign
  until: >-
    (_rhtas_securesign.resources | default([]) | length) > 0 and
    (_rhtas_securesign.resources[0].status.conditions | default([])
     | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | list
     | first | default('False')) == 'True'
  retries: 60
  delay: 15

- name: "rhtas | install summary"
  ansible.builtin.debug:
    msg: >-
      rhtas-operator is Available and the zuno-securesign Securesign CR
      reports Ready in zuno-rhtas (Fulcio/Rekor/CTLog/Trillian/TUF).
