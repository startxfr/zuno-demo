apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zuno-ai-run
configMapGenerator:
  - name: acceptance-gate-scripts
    files:
      - requirements.txt=../../../../../evaluations/tekos/requirements.txt
      - scenarios.yaml=../../../../../evaluations/tekos/scenarios.yaml
      - run_scenarios.py=../../../../../evaluations/tekos/run_scenarios.py
      - security_checks.py=../../../../../evaluations/tekos/security_checks.py
      - gate_checks.py=../../../../../evaluations/tekos/gate_checks.py
      - run_acceptance_gate.py=../../../../../evaluations/tekos/run_acceptance_gate.py
      # ADR-0526 (WP-087): the register-conformance scorer, imported by
      # run_scenarios.py's chat_register_conformance handler. It lives at
      # evaluations/ root rather than in tekos/ because components/mlops's
      # evaluate stage imports the SAME module - one scorer, one set of
      # thresholds, two callers. This ConfigMap flattens everything into
      # /gate, so the handler adds both its own directory and its parent
      # to sys.path to cover the repo layout and this one.
      - register_conformance.py=../../../../../evaluations/register_conformance.py
      # Repo policy files the checks read relative to their own resolved
      # location (security_checks.py: repo_root=parents[2] -> /gate;
      # gate_checks.py: parents[2] -> /) - must be projected into those
      # exact paths by the Job's volume items, or both scripts raise
      # FileNotFoundError.
      - classification.yaml=../../../../../policies/data-classification/classification.yaml
      - tool-policy.yaml=../../../../../policies/tools/tool-policy.yaml
      - provider-routing.yaml=../../../../../platform/ai-gateway/provider-routing.yaml
      # gate_checks.py's two write-code/DAT-boundary checks (added
      # alongside stress_test.py's gaps) read these at /policies/model-
      # routing/model-routing-policy.yaml and /agents/tekos/(agent.okf.md,
      # tasks/*.md) - same repo_root=/ resolution as provider-routing.yaml
      # above, so they need the same treatment or FileNotFoundError.
      - model-routing-policy.yaml=../../../../../policies/model-routing/model-routing-policy.yaml
      - tekos-agent-okf.md=../../../../../agents/tekos/agent.okf.md
      - tekos-task-answer-technical-question.md=../../../../../agents/tekos/tasks/answer-technical-question.md
      - tekos-task-find-relevant-docs.md=../../../../../agents/tekos/tasks/find-relevant-docs.md
      - tekos-task-check-my-drive-docs.md=../../../../../agents/tekos/tasks/check-my-drive-docs.md
      - tekos-task-write-code.md=../../../../../agents/tekos/tasks/write-code.md
      # gate_checks.py's arkos_declares_no_photorealistic_image_generation_
      # capability reads /agents/arkos/agent.okf.md and every declared
      # task's /agents/arkos/tasks/<task>.md - same / resolution as the
      # tekos-* entries above, same reason they need to be projected here.
      - arkos-agent-okf.md=../../../../../agents/arkos/agent.okf.md
      - arkos-task-draft-architecture-testimonial.md=../../../../../agents/arkos/tasks/draft-architecture-testimonial.md
      - arkos-task-workshop-presentation.md=../../../../../agents/arkos/tasks/workshop-presentation.md
      - arkos-task-structure-demo.md=../../../../../agents/arkos/tasks/structure-demo.md
      - arkos-task-write-code.md=../../../../../agents/arkos/tasks/write-code.md
      # ADR-0326/WP-31/33/35/36: each remaining agent's own scenarios.yaml/
      # security_checks.py, prefixed (ConfigMap keys are flat) so
      # run_acceptance_gate.yml's gate-agent volume can select the right
      # one via items - see that task file's agent_name parameterization.
      - arkos-scenarios.yaml=../../../../../evaluations/arkos/scenarios.yaml
      - arkos-security_checks.py=../../../../../evaluations/arkos/security_checks.py
      - comage-scenarios.yaml=../../../../../evaluations/comage/scenarios.yaml
      - comage-security_checks.py=../../../../../evaluations/comage/security_checks.py
      - advantage-scenarios.yaml=../../../../../evaluations/advantage/scenarios.yaml
      - advantage-security_checks.py=../../../../../evaluations/advantage/security_checks.py
      - finage-scenarios.yaml=../../../../../evaluations/finage/scenarios.yaml
      - finage-security_checks.py=../../../../../evaluations/finage/security_checks.py
generatorOptions:
  disableNameSuffixHash: true
  labels:
    zuno.io/managed-by: zuno-ansible
