---
# ADR-0106/ADR-0420: schema/policy validation (platform/supply-chain/
# validate_okf_bundle.py) for every agents/*/ bundle, run locally against
# the checked-out repo (pure file validation, no cluster access needed -
# unlike the acceptance gate below, which needs in-cluster Service DNS).
# Signature verification (the third ADR-0106 dimension) now runs too -
# ansible/tasks/verify_okf_signatures.yml fetches each agent's current
# signature from Vault KV and checks it against the committed public key
# and the bundle's current content, entirely offline once fetched. A
# missing signature is reported, not failed (ZUNO_REQUIRE_SIGNED_BUNDLES
# stays off until every agent has one - WP-069's operator follow-up); a
# signature that no longer verifies is a real failure regardless.
- name: "agents | validate every OKF bundle's schema and policy references"
  ansible.builtin.command:
    cmd: python3 platform/supply-chain/validate_okf_bundle.py
    chdir: "{{ zuno_repo_root }}"
  register: _agents_okf_validation
  changed_when: false
  failed_when: false

- name: "agents | verify every OKF bundle's current signature"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/verify_okf_signatures.yml"

- name: "agents | fail the check if any OKF bundle failed validation"
  ansible.builtin.fail:
    msg: "{{ _agents_okf_validation.stdout_lines }}"
  when: _agents_okf_validation.rc != 0

# Layered gate for the one functional agent (Tekos): a reachability smoke
# check here (Layer 0), then the full acceptance/security gate
# (run_acceptance_gate.yml, Layers 1-3) as an in-cluster Job.
#
# Catalog-only agents (comage/advantage/finage/arkos) get a structural check
# instead: their agent.okf.md bundle must still parse and declare the
# right zuno.status, so a future status flip isn't starting from a
# silently-rotted definition. Two of the seven have since flipped to
# `active` at the operator's explicit direction - Arkos (ADR-0326/WP-31,
# flipped by WP-11) and Comage (ADR-0326/WP-33, flipped by its own
# follow-up) - while Advantage (ADR-0326/WP-35), Finage (ADR-0326/WP-36),
# Naveo (ADR-0410/ADR-0307/WP-41) and the identity-footprint-only Soursage/
# Cognos (ADR-0349 §6) remain genuinely `placeholder`. This loop now checks
# each agent's declared status against its own expected value
# (_agents_catalog_expected_status below) rather than one shared literal -
# it only checks structural validity + the declared status value, not
# whether real content exists behind it. Every deployed agent's frontend
# gets its OWN reachability smoke test below (ansible/tasks/
# day2_availability_check.yml, unconditional on status) - deliberately NOT
# the evaluations/<agent>/ gates, which require the human scenario review
# each WP's part (c) gates on before any cluster gate run counts (see
# run_acceptance_gate.yml's own docstring for the day this becomes
# automatic once that review is done).
#
# No built-in lookup/filter parses OKF frontmatter, so this splits the raw
# file on "---" and hands the middle part to from_yaml.
- name: "agents | load each catalog-only agent's OKF Markdown bundle frontmatter"
  ansible.builtin.set_fact:
    _agents_catalog_okf: "{{ _agents_catalog_okf | default({}) | combine({catalog_agent: (lookup('ansible.builtin.file', zuno_repo_root + '/agents/' + catalog_agent + '/agent.okf.md').split('---'))[1] | from_yaml}) }}"
  loop:
    - comage
    - advantage
    - finage
    - arkos
    # ADR-0410/ADR-0307 (WP-41): the sixth agent, scaffolded from
    # platform/templates/agent/ - same real-bundle-but-status-placeholder
    # posture as the four above until its own gate passes.
    - naveo
    # ADR-0349 §6: genuinely-placeholder agents (identity footprint +
    # coming-soon bundle only, no runtime/chart at all - the original
    # pattern the four above each started from).
    - soursage
    - cognos
  loop_control:
    loop_var: catalog_agent

- name: "agents | fail if a catalog-only agent's OKF bundle is structurally invalid"
  ansible.builtin.fail:
    msg: >-
      agents/{{ catalog_okf.key }}/agent.okf.md is structurally invalid: expected
      okf_version v0.2, type agent, zuno.status
      {{ _agents_catalog_expected_status[catalog_okf.key] }} -
      got okf_version={{ catalog_okf.value.okf_version | default('missing') }}
      type={{ catalog_okf.value.type | default('missing') }}
      status={{ (catalog_okf.value.zuno | default({})).status | default('missing') }}.
  when: >-
    catalog_okf.value.okf_version | default('') != 'v0.2' or
    catalog_okf.value.type | default('') != 'agent' or
    (catalog_okf.value.zuno | default({})).status | default('') != _agents_catalog_expected_status[catalog_okf.key]
  loop: "{{ _agents_catalog_okf | dict2items }}"
  loop_control:
    loop_var: catalog_okf
    label: "{{ catalog_okf.key }}"
  vars:
    _agents_catalog_expected_status:
      comage: active
      advantage: placeholder
      finage: placeholder
      arkos: active
      naveo: placeholder
      soursage: placeholder
      cognos: placeholder

- name: "agents | catalog-only structural check summary"
  ansible.builtin.debug:
    msg: "All 7 catalog-only agent definitions (comage, advantage, finage, arkos, naveo, soursage, cognos) are structurally valid, each against its own expected status - active for comage/arkos, placeholder for the rest (ADR-0031/ADR-0349)."

- name: "agents | resolve the cluster base domain"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_base_domain.yml"

# ADR-0411: every agent frontend's OIDC client trusts Keycloak's Route CA
# via this one shared ConfigMap - if it's missing, every frontend's
# /login will 502 "identity provider unreachable" even though the
# /healthz probes below still report healthy (that endpoint never dials
# Keycloak), so this deserves its own specific, actionable check rather
# than surfacing only as an indirect login failure downstream.
- name: "agents | check the shared Keycloak CA ConfigMap exists in zuno-ai-run"
  kubernetes.core.k8s_info:
    kind: ConfigMap
    namespace: zuno-ai-run
    name: agent-frontend-keycloak-ca
  register: _agents_keycloak_ca_cm

- name: "agents | fail the check if the shared Keycloak CA ConfigMap is missing"
  ansible.builtin.fail:
    msg: >-
      zuno-ai-run/agent-frontend-keycloak-ca ConfigMap not found - every
      agent frontend's /login will fail with "identity provider
      unreachable" (ADR-0411). Run `make d2 install agents` to resync it
      from openshift-config/keycloak-serving-ca.
  when: (_agents_keycloak_ca_cm.resources | default([]) | length) == 0

- name: "agents | run the Day 2 availability check for every discovered agent (ADR-0057)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/day2_availability_check.yml"

- name: "agents | report and gate on the availability check (ADR-0057)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/day2_render_and_fail.yml"
  vars:
    _day2_render_results: "{{ _day2_availability_results | default([]) }}"
    day2_render_component: agents

# ADR-0327's own acceptance bullet ("status.conditions provides useful
# readiness/error state consumed by `make check`") discharged here, for
# Arkos specifically - this repo's one CR-managed agent (WP-38 migration
# proof; every other agent above stays plain-manifest and has no AIAgent
# CR to read conditions from). Surfaced, not hard-gated: FrontendReady/
# BFFReady/OKFReady/RuntimeBindingReady being transiently False during a
# normal reconcile is expected and must not fail `make check` the way the
# reachability probe above does - only a genuinely invalid spec
# (ConfigValid: False, which the operator only ever sets for a spec
# problem, never a timing one) fails this block.
- name: "agents | fetch the Arkos AIAgent CR status"
  kubernetes.core.k8s_info:
    api_version: zuno.zuno.ai/v1alpha1
    kind: AIAgent
    name: arkos
    namespace: zuno-ai-run
  register: _agents_arkos_cr
  failed_when: false

- name: "agents | report the Arkos AIAgent CR's status.conditions"
  ansible.builtin.debug:
    msg: "{{ item.type }}: {{ item.status }} ({{ item.reason | default('') }})"
  loop: "{{ _agents_arkos_cr.resources[0].status.conditions | default([]) }}"
  loop_control:
    label: "{{ item.type }}"
  when: (_agents_arkos_cr.resources | default([])) | length > 0

- name: "agents | warn if the Arkos AIAgent CR was not found (operator/CR not yet synced)"
  ansible.builtin.debug:
    msg: "No arkos AIAgent CR found in zuno-ai-run yet - confirm gitops/apps/aiagent-operator and gitops/apps/arkos have both synced."
  when: (_agents_arkos_cr.resources | default([])) | length == 0

- name: "agents | fail the check if the Arkos AIAgent CR reports ConfigValid: False"
  ansible.builtin.fail:
    msg: >-
      arkos AIAgent CR's ConfigValid condition is False:
      {{ (_agents_arkos_cr.resources[0].status.conditions | default([]))
         | selectattr('type', 'equalto', 'ConfigValid') | map(attribute='message') | list }}
  when: >-
    (_agents_arkos_cr.resources | default([])) | length > 0 and
    (_agents_arkos_cr.resources[0].status.conditions | default([])
     | selectattr('type', 'equalto', 'ConfigValid') | map(attribute='status') | list | first | default('Unknown')) == 'False'

# Layers 1-3: auth, RAG, MCP allow/deny, routing, the 20 Tekos scenarios
# (75% threshold), and every security-negative check (100% mandatory).
- name: "agents | run the ADR-0053 acceptance gate"
  ansible.builtin.include_tasks: run_acceptance_gate.yml
