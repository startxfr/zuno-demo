---
# `make check`'s full ADR-0053 layered gate for the one functional agent
# (Tekos): a basic reachability smoke check (this file, Layer 0) followed
# by the full acceptance/security gate (run_acceptance_gate.yml, Layers
# 1-3 - the 20-scenario evaluation, ADR-0027/0028, plus every mandatory
# security-negative check, run as an in-cluster Job since it needs to
# reach services with no OpenShift Route).
#
# The catalog-only agents (comage/advantage/finage/arkos) get a structural
# check instead of a health check (ADR-0031): v0 formalizes Tekos as the
# only mandatory end-to-end business path, but "catalog-only" must never
# mean "unchecked" - their agent.okf.md bundle (ADR-0038: OKF v0.2 Markdown
# bundle, YAML frontmatter + Markdown body) must still parse and declare
# zuno.status: placeholder, so a future status: active flip (v1) has a
# known-good starting point rather than a silently-rotted definition.
#
# agent.okf.md has no built-in Ansible lookup/filter for "parse frontmatter",
# so this splits the raw file on the "---" delimiter (Jinja's str.split, the
# same approach components/agent-frontend/internal/okf/okf.go and
# components/agent-runtime/app/registry.py use) and hands the middle part
# (index [1]) to from_yaml.
- name: "agents | load each catalog-only agent's OKF Markdown bundle frontmatter"
  ansible.builtin.set_fact:
    _agents_catalog_okf: "{{ _agents_catalog_okf | default({}) | combine({item: (lookup('ansible.builtin.file', zuno_repo_root + '/agents/' + item + '/agent.okf.md').split('---'))[1] | from_yaml}) }}"
  loop:
    - comage
    - advantage
    - finage
    - arkos

- name: "agents | fail if a catalog-only agent's OKF bundle is structurally invalid"
  ansible.builtin.fail:
    msg: >-
      agents/{{ item.key }}/agent.okf.md is structurally invalid: expected
      okf_version v0.2, type agent, zuno.status placeholder -
      got okf_version={{ item.value.okf_version | default('missing') }}
      type={{ item.value.type | default('missing') }}
      status={{ (item.value.zuno | default({})).status | default('missing') }}.
  when: >-
    item.value.okf_version | default('') != 'v0.2' or
    item.value.type | default('') != 'agent' or
    (item.value.zuno | default({})).status | default('') != 'placeholder'
  loop: "{{ _agents_catalog_okf | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: "agents | catalog-only structural check summary"
  ansible.builtin.debug:
    msg: "All 4 catalog-only agent definitions (comage, advantage, finage, arkos) are structurally valid placeholders (ADR-0031)."

- name: "agents | resolve the cluster base domain"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_base_domain.yml"

- name: "agents | resolve the Tekos frontend route host"
  ansible.builtin.set_fact:
    _agents_tekos_host: "tekos.{{ cluster_base_domain }}"

- name: "agents | GET the Tekos frontend health endpoint"
  ansible.builtin.uri:
    url: "https://{{ _agents_tekos_host }}/healthz"
    method: GET
    status_code: 200
    validate_certs: false
    timeout: 10
  register: _agents_tekos_health
  failed_when: false

- name: "agents | fail the check if the Tekos frontend did not report healthy"
  ansible.builtin.fail:
    msg: >-
      Tekos frontend at https://{{ _agents_tekos_host }}/healthz did not
      respond 200 (got {{ _agents_tekos_health.status | default('no response') }}).
      Confirm gitops/apps/api has synced.
  when: (_agents_tekos_health.status | default(0)) != 200

- name: "agents | check summary"
  ansible.builtin.debug:
    msg: "Tekos frontend healthy at https://{{ _agents_tekos_host }}/healthz."

# ADR-0053: the layered acceptance and security gate. Everything above this
# point is infrastructure readiness (Layer 0 - OKF structural validity,
# frontend reachability); this is Layers 1-3 (Keycloak login/claims, BFF/
# Runtime auth, RAG retrieval, MCP allow/deny, model routing/classification,
# SSE, citations, the 20 Tekos scenarios at a 75% threshold, and every
# security-negative check at 100% mandatory) - see
# evaluations/tekos/run_acceptance_gate.py, which this task runs as an
# in-cluster Job.
- name: "agents | run the ADR-0053 acceptance gate"
  ansible.builtin.include_tasks: run_acceptance_gate.yml
