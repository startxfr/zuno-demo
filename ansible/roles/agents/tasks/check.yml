---
# ADR-0106: schema/policy validation (platform/supply-chain/
# validate_okf_bundle.py) for every agents/*/ bundle, run locally against
# the checked-out repo (pure file validation, no cluster access needed -
# unlike the acceptance gate below, which needs in-cluster Service DNS).
# Signature verification (the third ADR-0106 dimension) is intentionally
# not run here: no bundle has a real cosign signature yet
# (ZUNO_REQUIRE_SIGNED_BUNDLES stays off - see
# components/agent-runtime/app/registry.py - until WP-04 stage 2's
# credentialed CI run produces one); flip that setting once it does.
- name: "agents | validate every OKF bundle's schema and policy references"
  ansible.builtin.command:
    cmd: python3 platform/supply-chain/validate_okf_bundle.py
    chdir: "{{ zuno_repo_root }}"
  register: _agents_okf_validation
  changed_when: false
  failed_when: false

- name: "agents | fail the check if any OKF bundle failed validation"
  ansible.builtin.fail:
    msg: "{{ _agents_okf_validation.stdout_lines }}"
  when: _agents_okf_validation.rc != 0

# Layered gate for the one functional agent (Tekos): a reachability smoke
# check here (Layer 0), then the full acceptance/security gate
# (run_acceptance_gate.yml, Layers 1-3) as an in-cluster Job.
#
# Catalog-only agents (comage/advantage/finage/arkos) get a structural check
# instead: their agent.okf.md bundle must still parse and declare
# zuno.status: placeholder, so a future status: active flip isn't starting
# from a silently-rotted definition. Arkos (ADR-0326/WP-31) is deliberately
# still in this list even though its bundle/graph-shape/chart are now real:
# `status` stays `placeholder` until the operator confirms the live
# acceptance gate passes (this WP's own Status-updates section), so it
# correctly reports `placeholder` here too - this loop only checks
# structural validity + the declared status value, not whether real
# content exists behind it. Arkos's frontend gets its OWN reachability
# smoke test below (deployed, but its BFF calls 404 until Agent Runtime's
# generic dispatch sees `status: active` - see app/main.py's
# _active_agent_or_404) - deliberately NOT its evaluations/arkos/ gate,
# which requires the human scenario review WP-31 part (c) gates on before
# any cluster gate run counts (see run_acceptance_gate.yml's own docstring
# for the day this becomes automatic once that review is done).
#
# No built-in lookup/filter parses OKF frontmatter, so this splits the raw
# file on "---" and hands the middle part to from_yaml.
- name: "agents | load each catalog-only agent's OKF Markdown bundle frontmatter"
  ansible.builtin.set_fact:
    _agents_catalog_okf: "{{ _agents_catalog_okf | default({}) | combine({catalog_agent: (lookup('ansible.builtin.file', zuno_repo_root + '/agents/' + catalog_agent + '/agent.okf.md').split('---'))[1] | from_yaml}) }}"
  loop:
    - comage
    - advantage
    - finage
    - arkos
  loop_control:
    loop_var: catalog_agent

- name: "agents | fail if a catalog-only agent's OKF bundle is structurally invalid"
  ansible.builtin.fail:
    msg: >-
      agents/{{ catalog_okf.key }}/agent.okf.md is structurally invalid: expected
      okf_version v0.2, type agent, zuno.status placeholder -
      got okf_version={{ catalog_okf.value.okf_version | default('missing') }}
      type={{ catalog_okf.value.type | default('missing') }}
      status={{ (catalog_okf.value.zuno | default({})).status | default('missing') }}.
  when: >-
    catalog_okf.value.okf_version | default('') != 'v0.2' or
    catalog_okf.value.type | default('') != 'agent' or
    (catalog_okf.value.zuno | default({})).status | default('') != 'placeholder'
  loop: "{{ _agents_catalog_okf | dict2items }}"
  loop_control:
    loop_var: catalog_okf
    label: "{{ catalog_okf.key }}"

- name: "agents | catalog-only structural check summary"
  ansible.builtin.debug:
    msg: "All 4 catalog-only agent definitions (comage, advantage, finage, arkos) are structurally valid placeholders (ADR-0031)."

- name: "agents | resolve the cluster base domain"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_base_domain.yml"

- name: "agents | resolve the Tekos frontend route host"
  ansible.builtin.set_fact:
    _agents_tekos_host: "tekos.{{ cluster_base_domain }}"

- name: "agents | GET the Tekos frontend health endpoint"
  ansible.builtin.uri:
    url: "https://{{ _agents_tekos_host }}/healthz"
    method: GET
    status_code: 200
    validate_certs: false
    timeout: 10
  register: _agents_tekos_health
  failed_when: false

- name: "agents | fail the check if the Tekos frontend did not report healthy"
  ansible.builtin.fail:
    msg: >-
      Tekos frontend at https://{{ _agents_tekos_host }}/healthz did not
      respond 200 (got {{ _agents_tekos_health.status | default('no response') }}).
      Confirm gitops/apps/api has synced.
  when: (_agents_tekos_health.status | default(0)) != 200

- name: "agents | check summary"
  ansible.builtin.debug:
    msg: "Tekos frontend healthy at https://{{ _agents_tekos_host }}/healthz."

# ADR-0326 (WP-31): Arkos's frontend/BFF are deployed (gitops/apps/arkos)
# once this Application syncs, so it deserves the same reachability proof
# Tekos gets - but never the acceptance gate (Layers 1-3): its scenarios
# require the human review checkpoint WP-31 part (c) documents before any
# cluster gate run counts, and `status: placeholder` means its BFF's own
# calls to Agent Runtime 404 by design regardless (a stronger, orthogonal
# reason not to run a behavioral gate against it yet).
- name: "agents | resolve the Arkos frontend route host"
  ansible.builtin.set_fact:
    _agents_arkos_host: "arkos.{{ cluster_base_domain }}"

- name: "agents | GET the Arkos frontend health endpoint"
  ansible.builtin.uri:
    url: "https://{{ _agents_arkos_host }}/healthz"
    method: GET
    status_code: 200
    validate_certs: false
    timeout: 10
  register: _agents_arkos_health
  failed_when: false

- name: "agents | fail the check if the Arkos frontend did not report healthy"
  ansible.builtin.fail:
    msg: >-
      Arkos frontend at https://{{ _agents_arkos_host }}/healthz did not
      respond 200 (got {{ _agents_arkos_health.status | default('no response') }}).
      Confirm gitops/apps/arkos has synced.
  when: (_agents_arkos_health.status | default(0)) != 200

- name: "agents | check summary (arkos)"
  ansible.builtin.debug:
    msg: "Arkos frontend healthy at https://{{ _agents_arkos_host }}/healthz (evaluations/arkos/ gate not run here - pending human scenario review)."

# Layers 1-3: auth, RAG, MCP allow/deny, routing, the 20 Tekos scenarios
# (75% threshold), and every security-negative check (100% mandatory).
- name: "agents | run the ADR-0053 acceptance gate"
  ansible.builtin.include_tasks: run_acceptance_gate.yml
