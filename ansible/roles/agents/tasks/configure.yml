---
# Applies both agent-surface GitOps Applications: the five namespaces
# (ADR-0023) first, then the Tekos workloads that land in zuno-agent-tekos.
# main.yml (invoked by ansible/playbooks/install.yml, i.e. `make install`)
# includes this same file so one entry point covers `make install`. There is
# no "agents" CONFIG_SCOPE (only "api", for re-applying just the Tekos
# workloads) - see README.md.
- name: "agents | apply the namespaces GitOps Application"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_app_name: agents

- name: "agents | apply the Tekos workloads GitOps Application"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_app_name: api
