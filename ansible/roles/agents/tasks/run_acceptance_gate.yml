---
# Runs evaluations/tekos/run_acceptance_gate.py as a one-shot in-cluster Job
# rather than from the control node: most services it calls (agent-runtime,
# mcp-gateway, ai-gateway, rag-service) have no OpenShift Route and are only
# reachable over in-cluster Service DNS.
#
# The Job runs in zuno-ai-run labeled app.kubernetes.io/name: acceptance-gate,
# explicitly allow-listed in the relevant NetworkPolicies - never a
# namespace-wide baseline. sales-db-mcp is deliberately NOT allow-listed;
# denial of direct calls to it is itself part of what the gate proves.
#
# KEYCLOAK_URL uses the Keycloak CR's actual Route hostname
# ("keycloak.<domain>"), not the "sso.<domain>" convention some other
# charts' defaults assume but no Route here actually creates.

- name: "acceptance-gate | resolve the cluster base domain"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_base_domain.yml"

- name: "acceptance-gate | ensure the zuno-ai-run namespace exists"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/agents/kustomize/namespace"

- name: "acceptance-gate | read the demo-persona password from zuno-auth (ADR-0041)"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: zuno-auth
    name: demo-personas-password
  register: _gate_demo_password_secret
  no_log: true

- name: "acceptance-gate | read the tekos-frontend client secret from zuno-auth"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: zuno-auth
    name: tekos-frontend-client-secret
  register: _gate_client_secret_secret
  no_log: true

- name: "acceptance-gate | fail if either Keycloak secret is missing"
  ansible.builtin.fail:
    msg: >-
      demo-personas-password / tekos-frontend-client-secret not found in
      zuno-auth - run `make d0 configure keycloak` first (see
      ansible/roles/keycloak/README.md).
  when: >-
    (_gate_demo_password_secret.resources | default([]) | length) == 0 or
    (_gate_client_secret_secret.resources | default([]) | length) == 0

- name: "acceptance-gate | copy the two credentials into a zuno-ai-run Secret the Job can mount"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: acceptance-gate-credentials
        namespace: zuno-ai-run
        labels:
          zuno.io/managed-by: zuno-ansible
      type: Opaque
      data:
        demo-persona-password: "{{ _gate_demo_password_secret.resources[0].data.password }}"
        tekos-frontend-client-secret: "{{ _gate_client_secret_secret.resources[0].data.client_secret }}"
  no_log: true

# disableNameSuffixHash keeps the ConfigMap name stable so the inline Job
# below can reference it by a fixed name.
- name: "acceptance-gate | build the evaluations/tekos ConfigMap"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/agents/kustomize/acceptance-gate-scripts"

- name: "acceptance-gate | delete any previous gate Job (Jobs are immutable, this task is idempotent-by-recreation)"
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: zuno-acceptance-gate
    namespace: zuno-ai-run
    wait: true

- name: "acceptance-gate | run the acceptance-gate Job"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: zuno-acceptance-gate
        namespace: zuno-ai-run
        labels:
          zuno.io/managed-by: zuno-ansible
      spec:
        backoffLimit: 0
        template:
          metadata:
            labels:
              app.kubernetes.io/name: acceptance-gate
          spec:
            restartPolicy: Never
            priorityClassName: zuno-platform-weak
            containers:
              - name: acceptance-gate
                image: "docker.io/library/python:3.12-slim"
                command:
                  - sh
                  - -c
                  - "pip install --quiet --no-cache-dir -r /gate/requirements.txt && python3 /gate/run_acceptance_gate.py"
                workingDir: /gate
                env:
                  - name: PYTHONUNBUFFERED
                    value: "1"
                  # VERIFIED live (2026-08-16): under the restricted SCC the
                  # pod runs as a random UID with no HOME, so pip's implicit
                  # --user fallback tries /.local and dies with EACCES -
                  # point both at the pod's writable /tmp instead.
                  - name: HOME
                    value: /tmp
                  - name: PYTHONUSERBASE
                    value: /tmp/.pyuser
                  - name: KEYCLOAK_URL
                    value: "https://keycloak.{{ cluster_base_domain }}"
                  - name: FRONTEND_URL
                    value: "https://tekos.{{ cluster_base_domain }}"
                  - name: DEMO_PERSONA_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: acceptance-gate-credentials
                        key: demo-persona-password
                  - name: TEKOS_FRONTEND_CLIENT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: acceptance-gate-credentials
                        key: tekos-frontend-client-secret
                volumeMounts:
                  - name: gate
                    mountPath: /gate
                  # WP-31 parameterized run_acceptance_gate.py to load
                  # security checks from <script-dir>/<AGENT>/ - ConfigMap
                  # keys can't contain '/', so the same ConfigMap is
                  # mounted a second time, projecting only that one file
                  # into the per-agent subdirectory the script resolves
                  # (VERIFIED live 2026-08-16: FileNotFoundError
                  # /gate/tekos/security_checks.py otherwise).
                  - name: gate-agent
                    mountPath: /gate/tekos
            volumes:
              - name: gate
                configMap:
                  name: acceptance-gate-scripts
              - name: gate-agent
                configMap:
                  name: acceptance-gate-scripts
                  items:
                    - key: security_checks.py
                      path: security_checks.py
                    # The shared runner resolves scenarios.yaml per-agent
                    # too (run_scenarios.py: "its scenarios.yaml lives in
                    # ITS directory").
                    - key: scenarios.yaml
                      path: scenarios.yaml

- name: "acceptance-gate | wait for the Job to reach a terminal state"
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    namespace: zuno-ai-run
    name: zuno-acceptance-gate
  register: _gate_job
  until: >-
    (_gate_job.resources[0].status.succeeded | default(0)) > 0 or
    (_gate_job.resources[0].status.failed | default(0)) > 0
  retries: 60
  delay: 15

- name: "acceptance-gate | find the Job's pod"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: zuno-ai-run
    label_selectors:
      - "job-name=zuno-acceptance-gate"
  register: _gate_pod

- name: "acceptance-gate | fetch the gate's full output (scenario table, security checks, JSON summary)"
  kubernetes.core.k8s_log:
    namespace: zuno-ai-run
    name: "{{ _gate_pod.resources[0].metadata.name }}"
  register: _gate_log
  when: (_gate_pod.resources | default([]) | length) > 0

- name: "acceptance-gate | print the gate's output"
  ansible.builtin.debug:
    msg: "{{ _gate_log.log_lines | default(['no pod/log found']) }}"

- name: "acceptance-gate | fail the check if the mandatory gate did not pass"
  ansible.builtin.fail:
    msg: >-
      The ADR-0053 acceptance gate did not pass (Job
      zuno-acceptance-gate/zuno-ai-run succeeded={{ _gate_job.resources[0].status.succeeded | default(0) }}
      failed={{ _gate_job.resources[0].status.failed | default(0) }}) - see the output above
      for which scenario/security check/gate check failed.
  when: (_gate_job.resources[0].status.succeeded | default(0)) == 0
