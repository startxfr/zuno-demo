---
# Kept for consistency with other roles' file layout, but day1_check.yml
# calls tasks/check.yml for `agents` instead - a full functional/security
# gate is a stronger install signal than Application status alone.
- name: "agents | check the api Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-api-d0"

- name: "agents | save the d0 check result"
  ansible.builtin.set_fact:
    _agents_d0_installed: "{{ _state_check_result }}"

- name: "agents | check the api Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-api-d1"

- name: "agents | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
  vars:
    _state_is_installed: "{{ _agents_d0_installed and _state_check_result }}"
