---
# Kept for consistency with other roles' file layout; day2_check.yml calls
# tasks/check.yml for `agents` instead (the ADR-0053 acceptance gate). Since
# WP-156 this component deploys nothing of its own (the agents are served by
# UnifAI), so its install state is that of the agents' UnifaiAgentBundles:
# installed when at least one exists in zuno-unifai.
- name: "agents | read the UnifaiAgentBundle objects"
  kubernetes.core.k8s_info:
    api_version: unifai.startx.fr/v1alpha1
    kind: UnifaiAgentBundle
    namespace: zuno-unifai
  register: _agents_unifai_bundles
  failed_when: false

- name: "agents | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
  vars:
    _state_is_installed: "{{ (_agents_unifai_bundles.resources | default([]) | length) > 0 }}"
