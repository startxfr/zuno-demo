- name: "agents | save the arkos d0 check result"
  ansible.builtin.set_fact:
    _agents_arkos_d0_installed: "{{ _state_check_result }}"

- name: "agents | check the arkos Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-arkos-d1"

- name: "agents | save the arkos d1 check result"
  ansible.builtin.set_fact:
    _agents_arkos_d1_installed: "{{ _state_check_result }}"

# ADR-0326 (WP-33)
- name: "agents | check the comage Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-comage-d0"

- name: "agents | save the comage d0 check result"
  ansible.builtin.set_fact:
    _agents_comage_d0_installed: "{{ _state_check_result }}"

- name: "agents | check the comage Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-comage-d1"

- name: "agents | save the comage d1 check result"
  ansible.builtin.set_fact:
    _agents_comage_d1_installed: "{{ _state_check_result }}"

# ADR-0326 (WP-35)
- name: "agents | check the advantage Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-advantage-d0"

- name: "agents | save the advantage d0 check result"
  ansible.builtin.set_fact:
    _agents_advantage_d0_installed: "{{ _state_check_result }}"

- name: "agents | check the advantage Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-advantage-d1"

- name: "agents | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
  vars:
    _state_is_installed: >-
      {{ _agents_d0_installed and _agents_api_d1_installed and
         _agents_arkos_d0_installed and _agents_arkos_d1_installed and
         _agents_comage_d0_installed and _agents_comage_d1_installed and
         _agents_advantage_d0_installed and _state_check_result }}
