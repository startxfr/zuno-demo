---
- name: "agents | verify ArgoCD is installed"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: applications.argoproj.io
  register: _agents_precheck_argocd_crd

- name: "agents | fail if ArgoCD is not yet installed"
  ansible.builtin.fail:
    msg: "applications.argoproj.io CRD not found. Run `make prepare argocd` first."
  when: (_agents_precheck_argocd_crd.resources | default([]) | length) == 0

- name: "agents | precheck summary"
  ansible.builtin.debug:
    msg: "ArgoCD is installed; agent namespaces and Tekos workloads can be applied."
