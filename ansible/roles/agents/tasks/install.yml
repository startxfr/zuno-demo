---
# WP-156: the per-agent frontend/BFF Applications (zuno-api, zuno-arkos,
# zuno-comage, zuno-advantage, zuno-finage, zuno-naveo) and the Kuadrant
# quota-demo route Application (zuno-connectivity-link-quota-d1) this role
# used to apply were retired with the zuno agent stack. The agents are now
# served by UnifAI (ADR-0561): their bundles are deployed by the `unifai`
# Day 2 component from the admitted zuno-demo-agents release (ADR-0580).
# This component keeps its `check` (the ADR-0053 acceptance gate, run
# against UnifAI); install has nothing left to apply.
- name: "agents | nothing to install (agents are served by UnifAI, see the unifai component)"
  ansible.builtin.debug:
    msg: >-
      The agents component deploys no workload since WP-156. Install the
      agents with `make d2 install unifai`; check them with
      `make d2 check agents`.
