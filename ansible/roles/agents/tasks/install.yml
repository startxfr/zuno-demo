---
# agent-bff/agent-frontend are images built by the separate "agent" Day 1
# build component (make day1 build agent) - its name doesn't match this
# run-component's own name ("agents"), so `make day1 all agents` (or plain
# `install`) would otherwise never trigger it, leaving these Deployments
# in permanent ImagePullBackOff/"authentication required" on a fresh
# cluster. Ensuring it here keeps `make day1 install agents`
# self-sufficient, same principle as ansible/tasks/apply_gitops_app.yml's
# single-component installs. apply_openshift_build.yml (which this role
# calls) is idempotent - a ConfigChange trigger only rebuilds on a real
# BuildConfig diff, so this costs a status check, not a rebuild, once the
# image already exists.
- name: "agents | ensure the agent-bff/agent-frontend images are built"
  ansible.builtin.include_role:
    name: agent_build
    tasks_from: build

# Applies the Tekos frontend/BFF workloads GitOps Application; namespaces
# are assumed to already exist (see precheck.yml). No OLM operator here -
# all content is -d1; application-d0.yaml is a no-op.
- name: "agents | apply the Tekos workloads GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "api"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

- name: "agents | apply the Tekos workloads GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "api"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
