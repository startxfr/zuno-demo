---
# agent-bff/agent-frontend are images built by the separate "agent" Day 2 build
# component; its name doesn't match this run-component's own name ("agents"),
# so `make day2 install agents` would otherwise never trigger it, leaving these
# Deployments in permanent ImagePullBackOff on a fresh cluster. Ensuring it here
# keeps the install self-sufficient (apply_openshift_build.yml documents the
# idempotency guarantee - it's a status check, not a rebuild, once the image exists).
- name: "agents | ensure the agent-bff/agent-frontend images are built"
  ansible.builtin.include_role:
    name: agent_build
    tasks_from: build

# ADR-0411: every agent frontend (chart-rendered or, for arkos/naveo,
# aiagent-operator-rendered) shares this one codebase and namespace, so
# the CA it needs to trust Keycloak's Route only needs syncing once here
# - before the first Application apply below, so no pod hits a transient
# CreateContainerConfigError waiting on it.
- name: "agents | sync the Keycloak serving CA into zuno-ai-run for every agent frontend's OIDC trust"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/sync_keycloak_serving_ca.yml"
  vars:
    sync_keycloak_ca_dest_namespace: zuno-ai-run
    sync_keycloak_ca_dest_configmap_name: agent-frontend-keycloak-ca

# Applies the Tekos frontend/BFF workloads GitOps Application; namespaces
# are assumed to already exist (see precheck.yml). No OLM operator here -
# all content is -d1; application-d0.yaml is a no-op.
- name: "agents | apply the Tekos workloads GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "api"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

- name: "agents | apply the Tekos workloads GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "api"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"

# ADR-0511/WP-54 (Day1/Day2 split): the tekos-quota-demo HTTPRoute +
# AuthPolicy + RateLimitPolicy target/reference the tekos-frontend backend
# Service just created above by zuno-api-d1 - applying them any earlier
# (they used to render from Day1's zuno-connectivity-link-d1) left the
# HTTPRoute permanently BackendNotFound/Degraded until Day2 ran, which made
# that Application's own Synced+Healthy wait liable to time out and fail
# `make day1 install`. Renders the SAME connectivity-link chart as
# zuno-connectivity-link-d1 with a disjoint values-gate
# (quotaEnforcement.route.enabled, not .gateway.enabled) - see
# gitops/apps/connectivity-link-quota/application-d1.yaml.
- name: "agents | apply the Tekos quota-demo GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "connectivity-link-quota"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-connectivity-link-quota-d1"

# ADR-0326 (WP-31): Arkos's frontend/BFF workloads GitOps Application -
# same pattern as Tekos's above, applied unconditionally like Tekos's own
# (its OKF `status` staying `placeholder` gates the portal tile and Agent
# Runtime's dispatch, not whether these pods exist - see
# agents/arkos/agent.okf.md's own body prose).
- name: "agents | apply the Arkos workloads GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "arkos"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

- name: "agents | apply the Arkos workloads GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "arkos"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"

