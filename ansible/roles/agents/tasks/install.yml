# aiagent-operator reconciles (never raw manifests), so this Application
# additionally depends on the aiagent-operator component having synced
# (its own sync-wave is earlier - see gitops/apps/naveo/application-d1.yaml).
- name: "agents | apply the Naveo workloads GitOps Application (d0, no-op)"
