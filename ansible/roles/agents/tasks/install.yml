---
# agent-bff/agent-frontend are images built by the separate "agent" Day 1 build
# component; its name doesn't match this run-component's own name ("agents"),
# so `make day1 install agents` would otherwise never trigger it, leaving these
# Deployments in permanent ImagePullBackOff on a fresh cluster. Ensuring it here
# keeps the install self-sufficient (apply_openshift_build.yml documents the
# idempotency guarantee - it's a status check, not a rebuild, once the image exists).
- name: "agents | ensure the agent-bff/agent-frontend images are built"
  ansible.builtin.include_role:
    name: agent_build
    tasks_from: build

# Applies the Tekos frontend/BFF workloads GitOps Application; namespaces
# are assumed to already exist (see precheck.yml). No OLM operator here -
# all content is -d1; application-d0.yaml is a no-op.
- name: "agents | apply the Tekos workloads GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "api"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

- name: "agents | apply the Tekos workloads GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "api"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"

# ADR-0326 (WP-31): Arkos's frontend/BFF workloads GitOps Application -
# same pattern as Tekos's above, applied unconditionally like Tekos's own
# (its OKF `status` staying `placeholder` gates the portal tile and Agent
# Runtime's dispatch, not whether these pods exist - see
# agents/arkos/agent.okf.md's own body prose).
- name: "agents | apply the Arkos workloads GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "arkos"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

- name: "agents | apply the Arkos workloads GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "arkos"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"

