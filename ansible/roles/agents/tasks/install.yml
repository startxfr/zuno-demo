---
# Applies the Tekos frontend/BFF workloads GitOps Application. Namespace
# creation used to happen here too, but moved to the new `namespaces` Day 0
# role (ADR-0056) - this role is now Day 1's "agents" run component, and
# assumes namespaces already exist (see precheck.yml). The formerly
# separate "api" role/CONFIG_SCOPE was retired as part of the same change:
# once namespace-apply moved out, it was doing exactly this and nothing
# else - one role for "apply the Tekos workloads Application" is enough.
#
# No OLM operator involved - all of this component's content is -d1 (see
# gitops/apps/api/application-d0.yaml, a no-op).
- name: "agents | apply the Tekos workloads GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "api"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

- name: "agents | apply the Tekos workloads GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "api"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
