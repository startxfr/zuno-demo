---
# No separate prepare phase: unlike Day 0's components (operators/instances
# that must exist before anything can be configured, ADR-0056), the Tekos
# workloads this role applies are a plain GitOps Application with no
# operator dependency of its own - see tasks/configure.yml. `agents` is a
# Day 1 component, not listed in day0_install.yml's component list, so
# this file is not reachable via `make d0 install` today; kept for
# structural consistency with every other role and as a placeholder
# should a future prerequisite appear.
- name: "agents | no prerequisites to prepare"
  ansible.builtin.debug:
    msg: "agents has no separate prepare phase - see tasks/configure.yml."
