---
# Reverse of install.yml. This must run BEFORE `make d1 uninstall lightspeed`:
# deleting the operator while OLSConfig still exists strands the CR with no
# controller to finalize it.
- name: "lightspeed-config | delete the lightspeed-config GitOps Application (d1: OLSConfig)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-lightspeed-config-d1"

- name: "lightspeed-config | delete the lightspeed-config GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-lightspeed-config-d0"

# ArgoCD prune removes the OLSConfig, but the operator's own operands
# (PostgreSQL PVC, the app-server Deployment) are owned by the CR, not by
# ArgoCD. Confirm the CR is actually gone rather than assuming prune finished -
# a stuck finalizer here is what makes a later `make d1 uninstall lightspeed`
# hang on CRD deletion.
- name: "lightspeed-config | wait for the OLSConfig singleton to disappear"
  kubernetes.core.k8s_info:
    api_version: ols.openshift.io/v1alpha1
    kind: OLSConfig
    name: cluster
  register: _ols_cr
  until: (_ols_cr.resources | default([]) | length) == 0
  retries: 30
  delay: 10
  failed_when: false
