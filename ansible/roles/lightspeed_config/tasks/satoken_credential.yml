---
# WP-085 / ADR-0524 clause 1: bridge a ServiceAccount token into the ONE shape
# OLS v1.1.2 can read.
#
# Why this exists at all. Routing Lightspeed's inference through MaaS needs a
# real TokenReview identity, so credential.mode: saTokenSecret mints a
# long-lived ServiceAccount token. But the operator ignores OLSConfig's
# `credentialKey` field and hardcodes the key `apitoken` (live 2026-08-27:
# `FileNotFoundError: /etc/apikeys/lightspeed-maas-credentials/apitoken`,
# app-server CrashLoopBackOff), while a kubernetes.io/service-account-token
# Secret is populated by the controller under `token`.
#
# A template cannot reconcile that: the key of a service-account-token Secret
# is not ours to choose, and a Secret's `type` is immutable, so the chart
# cannot render one object that is both. Hence: the chart renders the
# SA-token Secret as the source (<secretName>-satoken), and this task copies
# its token into an Opaque Secret named <secretName> under `apitoken`.
#
# Idempotent by value: it rewrites only when the copy has drifted from the
# source, so a normal re-run is a no-op rather than a needless Secret write
# that would restart the app-server.
- name: "lightspeed-config | look for the ServiceAccount token Secret (saTokenSecret mode only)"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ lightspeed_config_namespace | default('openshift-lightspeed') }}"
    name: "{{ _ls_cred_secret_name }}-satoken"
  register: _ls_satoken_secret
  # The controller populates .data.token a moment after the Secret appears;
  # an empty token here would write a credential that authenticates as nobody.
  until: >-
    (_ls_satoken_secret.resources | default([]) | length) == 0 or
    ((_ls_satoken_secret.resources[0].data | default({})).token | default('') | length) > 0
  retries: 12
  delay: 5
  no_log: true

- name: "lightspeed-config | skip the credential bridge when not in saTokenSecret mode"
  ansible.builtin.debug:
    msg: >-
      No {{ _ls_cred_secret_name }}-satoken Secret in
      {{ lightspeed_config_namespace | default('openshift-lightspeed') }} - the chart is not in
      credential.mode=saTokenSecret, so OLSConfig reads its credential from the chart directly
      and there is nothing to bridge.
  when: (_ls_satoken_secret.resources | default([]) | length) == 0

- name: "lightspeed-config | read the credential Secret OLSConfig actually reads"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ lightspeed_config_namespace | default('openshift-lightspeed') }}"
    name: "{{ _ls_cred_secret_name }}"
  register: _ls_apitoken_secret
  when: (_ls_satoken_secret.resources | default([]) | length) > 0
  no_log: true

# Type is immutable, so a Secret left over from another credential.mode
# (staticToken renders this same name as Opaque, apiKey as an ExternalSecret
# target) has to go before this one can be written. Deleting only on a real
# type mismatch keeps the common path a no-op.
- name: "lightspeed-config | drop a credential Secret left over from another credential.mode"
  kubernetes.core.k8s:
    state: absent
    kind: Secret
    namespace: "{{ lightspeed_config_namespace | default('openshift-lightspeed') }}"
    name: "{{ _ls_cred_secret_name }}"
  when:
    - (_ls_satoken_secret.resources | default([]) | length) > 0
    - (_ls_apitoken_secret.resources | default([]) | length) > 0
    - _ls_apitoken_secret.resources[0].type != "Opaque"

- name: "lightspeed-config | bridge the ServiceAccount token into `apitoken`"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ _ls_cred_secret_name }}"
        namespace: "{{ lightspeed_config_namespace | default('openshift-lightspeed') }}"
        labels:
          # Deliberately NOT zuno.io/managed-by: argocd - this object is
          # ansible's, and the chart does not render it in this mode.
          zuno.io/managed-by: ansible
        annotations:
          zuno.io/derived-from: "{{ _ls_cred_secret_name }}-satoken"
      type: Opaque
      data:
        apitoken: "{{ _ls_satoken_secret.resources[0].data.token }}"
  when:
    - (_ls_satoken_secret.resources | default([]) | length) > 0
    - >-
      (_ls_apitoken_secret.resources | default([]) | length) == 0 or
      (_ls_apitoken_secret.resources[0].type != "Opaque") or
      ((_ls_apitoken_secret.resources[0].data | default({})).apitoken | default(''))
        != _ls_satoken_secret.resources[0].data.token
  no_log: true
