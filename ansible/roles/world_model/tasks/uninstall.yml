---
# Removes the Application (and with it the Deployments, Route and Secrets). The Keycloak client and group, the Vault paths
# and the model bucket are kept: they are shared declarations and a reinstall reuses them. The GPU node is a separate
# Day-0 component: `make d0 uninstall world-model-gpu` afterwards, which refuses while this Application exists.
- name: "world-model | delete the Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "{{ world_model_app_name }}"

- name: "world-model | next step"
  ansible.builtin.debug:
    msg: >-
      The world-model application is removed. The GPU node still bills: run `make d0 uninstall world-model-gpu`, then set
      zuno_world_model_enabled to false in ansible/clusters/<cluster>.yml.
