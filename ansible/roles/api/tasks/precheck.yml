---
- name: "api | verify ArgoCD is installed"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: applications.argoproj.io
  register: _api_precheck_argocd_crd

- name: "api | fail if ArgoCD is not yet installed"
  ansible.builtin.fail:
    msg: "applications.argoproj.io CRD not found. Run `make prepare argocd` first."
  when: (_api_precheck_argocd_crd.resources | default([]) | length) == 0

- name: "api | precheck summary"
  ansible.builtin.debug:
    msg: "ArgoCD is installed; the Tekos workloads Application can be applied."
