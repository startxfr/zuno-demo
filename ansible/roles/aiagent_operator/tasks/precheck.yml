---
# State detection (never fails) - same shape as ansible/roles/mcp's own
# precheck.yml.
- name: "aiagent_operator | check the AIAgent operator Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-aiagent-operator-d0"

- name: "aiagent_operator | save the d0 check result"
  ansible.builtin.set_fact:
    _aiagent_operator_d0_installed: "{{ _state_check_result }}"

- name: "aiagent_operator | check the AIAgent operator Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-aiagent-operator-d1"

- name: "aiagent_operator | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
  vars:
    _state_is_installed: "{{ _aiagent_operator_d0_installed and _state_check_result }}"
