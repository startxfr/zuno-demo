---
# No OLM operator involved - all of this component's content is -d1 (see
# gitops/apps/aiagent-operator/application-d0.yaml, a no-op), same shape
# as ansible/roles/mcp's own install.yml.
- name: "aiagent_operator | apply the AIAgent operator GitOps Application (d0, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "aiagent-operator"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

- name: "aiagent_operator | apply the AIAgent operator GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "aiagent-operator"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
