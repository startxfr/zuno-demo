---
# ADR-0058: `make d2 stresstest [agents|platform|all]`. Stresstest
# content is inherently agent-scoped (contract/scenario/security/gate/
# stress_test/bulk-interaction content all belong to one agent) - there
# is no separate "platform-only" stresstest content distinct from what
# running every agent's content already exercises: the shared services
# ADR-0057's `platform` component health-checks probe are exactly the
# services every agent's scenario/security/bulk-interaction calls route
# through. So every component value dispatches to the same full
# aggregation; `platform`/`all` are accepted (for consistency with `d2
# test`'s component set) but behave identically to `agents`.
- name: "day2-stresstest | note that stresstest content is agent-scoped regardless of component"
  ansible.builtin.debug:
    msg: >-
      target_component={{ target_component }} - stresstest content is
      agent-scoped and runs the same full per-agent aggregation either
      way (ADR-0058); the shared platform services are exercised
      indirectly through it, not probed separately here.

- name: "day2-stresstest | run the full per-agent stresstest aggregation"
  ansible.builtin.include_tasks: stresstest_job.yml
