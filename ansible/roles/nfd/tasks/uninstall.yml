---
# Reverse of install.yml. remove_operator.yml must run *before*
# delete_gitops_app.yml: it discovers the installed CSV via the
# Subscription's own status.installedCSV field, which only exists while
# the Subscription (an Application-managed resource) still exists -
# running it first also means its CRD delete (cascading the
# NodeFeatureDiscovery CR first) and CSV/Subscription delete happen
# before ArgoCD's own cascade prune would otherwise race to remove the
# same Subscription object.
- name: "nfd | remove the operator (its owned CRDs - cascading the NodeFeatureDiscovery instance - then the CSV, then the Subscription)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/remove_operator.yml"
  vars:
    operator_subscription_name: nfd
    operator_namespace: openshift-nfd

- name: "nfd | delete the nfd GitOps Application (cascades the remaining OperatorGroup/Namespace)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-nfd"
