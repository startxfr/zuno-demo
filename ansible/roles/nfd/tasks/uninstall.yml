---
# Reverse of install.yml. Delete -d1 (the NodeFeatureDiscovery operand)
# first, via ArgoCD prune, before remove_operator.yml deletes the CRD it's
# an instance of - avoids ArgoCD fighting a CR deletion its own
# Application still desires. remove_operator.yml then runs *before*
# deleting -d0: it discovers the installed CSV via the Subscription's own
# status.installedCSV field, which only exists while the Subscription (a
# -d0-managed resource) still exists - running it before -d0's own delete
# also means its CRD delete and CSV/Subscription delete happen before
# ArgoCD's own cascade prune would otherwise race to remove the same
# Subscription object.
- name: "nfd | delete the nfd GitOps Application (d1: NodeFeatureDiscovery instance)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-nfd-d1"

- name: "nfd | remove the operator (its owned CRDs - cascading the NodeFeatureDiscovery instance - then the CSV, then the Subscription)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/remove_operator.yml"
  vars:
    operator_subscription_name: nfd
    operator_namespace: openshift-nfd

- name: "nfd | delete the nfd GitOps Application (d0: cascades the remaining OperatorGroup/Namespace)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-nfd-d0"
