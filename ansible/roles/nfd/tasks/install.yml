---
# ADR-0047: Node Feature Discovery must be ready *before* the nvidia_gpu
# role's GPU Operator ClusterPolicy is applied - see
# ansible/playbooks/{precheck,prepare}.yml's prerequisite_components
# ordering (nfd listed before nvidia_gpu) and that role's own README for
# why this dependency was previously undeclared.
#
# ADR-0312: Namespace/OperatorGroup/Subscription (operator.enabled) and
# the NodeFeatureDiscovery instance (nodeFeatureDiscovery.enabled) both
# live in gitops/charts/nfd, applied via two separate Applications
# (zuno-nfd-d0/-d1) - -d1 is applied only once -d0 is Synced+Healthy.
- name: "nfd | apply the nfd GitOps Application (d0: operator)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "nfd"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 15

- name: "nfd | apply the nfd GitOps Application (d1: NodeFeatureDiscovery instance)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "nfd"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 15

- name: "nfd | wait for NFD worker pods to be labeling nodes"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    namespace: openshift-nfd
    name: nfd-worker
  register: _nfd_worker_ds
  until: >-
    (_nfd_worker_ds.resources | default([]) | length) > 0 and
    (_nfd_worker_ds.resources[0].status.numberReady | default(0)) > 0 and
    (_nfd_worker_ds.resources[0].status.numberReady | default(0)) ==
    (_nfd_worker_ds.resources[0].status.desiredNumberScheduled | default(-1))
  retries: 30
  delay: 15
