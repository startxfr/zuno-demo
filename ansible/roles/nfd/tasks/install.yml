---
# ADR-0047: Node Feature Discovery must be ready *before* the nvidia_gpu
# role's GPU Operator ClusterPolicy is applied - see
# ansible/playbooks/{precheck,prepare}.yml's prerequisite_components
# ordering (nfd listed before nvidia_gpu) and that role's own README for
# why this dependency was previously undeclared.
# ADR-0310: ansible/roles/nfd/kustomize/operator/.
- name: "nfd | apply the operator Namespace, OperatorGroup and Subscription"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/nfd/kustomize/operator"

- name: "nfd | wait for the NodeFeatureDiscovery CRD to be established"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: nodefeaturediscoveries.nfd.openshift.io
  register: _nfd_crd
  until: (_nfd_crd.resources | default([]) | length) > 0
  retries: 30
  delay: 15

# Minimal CR, relying on the operator's own defaults (instance/topology
# updater disabled - this demo has no need for either) - the same
# "don't guess unverified fields beyond a documented minimal shape"
# reasoning as ansible/roles/nvidia_gpu's ClusterPolicy. ADR-0310:
# ansible/roles/nfd/kustomize/cr/.
- name: "nfd | apply the NodeFeatureDiscovery instance"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/nfd/kustomize/cr"

- name: "nfd | wait for NFD worker pods to be labeling nodes"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    namespace: openshift-nfd
    name: nfd-worker
  register: _nfd_worker_ds
  until: >-
    (_nfd_worker_ds.resources | default([]) | length) > 0 and
    (_nfd_worker_ds.resources[0].status.numberReady | default(0)) > 0 and
    (_nfd_worker_ds.resources[0].status.numberReady | default(0)) ==
    (_nfd_worker_ds.resources[0].status.desiredNumberScheduled | default(-1))
  retries: 30
  delay: 15
