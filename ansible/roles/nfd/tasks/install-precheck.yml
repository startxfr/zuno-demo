---
# State detection (never fails). nfd applies its whole chart (operator +
# NodeFeatureDiscovery instance) in a single install.yml call (ADR-0312).
- name: "nfd | check the nfd Application"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-nfd"

- name: "nfd | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_install_state.yml"
  vars:
    _state_is_installed: "{{ _state_check_result }}"
