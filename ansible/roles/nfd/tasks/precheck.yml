---
# State detection (never fails).
- name: "nfd | check the nfd Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-nfd-d0"

- name: "nfd | save the d0 check result"
  ansible.builtin.set_fact:
    _nfd_d0_installed: "{{ _state_check_result }}"

- name: "nfd | check the nfd Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-nfd-d1"

- name: "nfd | look up the NFD worker DaemonSet"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    namespace: openshift-nfd
    name: nfd-worker
  register: _nfd_worker_ds_lookup

- name: "nfd | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        _nfd_d0_installed
        and _state_check_result
        and (_nfd_worker_ds_lookup.resources | default([]) | length) > 0
        and (_nfd_worker_ds_lookup.resources[0].status.numberReady | default(0)) > 0
        and (_nfd_worker_ds_lookup.resources[0].status.numberReady | default(0)) ==
            (_nfd_worker_ds_lookup.resources[0].status.desiredNumberScheduled | default(-1))
      }}

- name: "nfd | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
