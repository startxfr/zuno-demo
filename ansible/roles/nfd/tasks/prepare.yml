---
# ADR-0047: Node Feature Discovery must be ready *before* the nvidia_gpu
# role's GPU Operator ClusterPolicy is applied - see
# ansible/playbooks/{precheck,prepare}.yml's prerequisite_components
# ordering (nfd listed before nvidia_gpu) and that role's own README for
# why this dependency was previously undeclared.
- name: "nfd | ensure the openshift-nfd namespace exists"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: openshift-nfd
        labels:
          zuno.io/managed-by: ansible

- name: "nfd | ensure the operator group exists"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: openshift-nfd-group
        namespace: openshift-nfd
      spec:
        targetNamespaces:
          - openshift-nfd

- name: "nfd | subscribe to the Node Feature Discovery Operator"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: nfd
        namespace: openshift-nfd
        labels:
          zuno.io/managed-by: ansible
      spec:
        channel: stable
        name: nfd
        source: redhat-operators
        sourceNamespace: openshift-marketplace
        installPlanApproval: Automatic

- name: "nfd | wait for the NodeFeatureDiscovery CRD to be established"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: nodefeaturediscoveries.nfd.openshift.io
  register: _nfd_crd
  until: (_nfd_crd.resources | default([]) | length) > 0
  retries: 30
  delay: 15

# Minimal CR, relying on the operator's own defaults (instance/topology
# updater disabled - this demo has no need for either) - the same
# "don't guess unverified fields beyond a documented minimal shape"
# reasoning as ansible/roles/nvidia_gpu's ClusterPolicy.
- name: "nfd | apply the NodeFeatureDiscovery instance"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: nfd.openshift.io/v1
      kind: NodeFeatureDiscovery
      metadata:
        name: nfd-instance
        namespace: openshift-nfd
        labels:
          zuno.io/managed-by: ansible
      spec:
        instance: ""
        topologyupdater: false

- name: "nfd | wait for NFD worker pods to be labeling nodes"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    namespace: openshift-nfd
    name: nfd-worker
  register: _nfd_worker_ds
  until: >-
    (_nfd_worker_ds.resources | default([]) | length) > 0 and
    (_nfd_worker_ds.resources[0].status.numberReady | default(0)) > 0 and
    (_nfd_worker_ds.resources[0].status.numberReady | default(0)) ==
    (_nfd_worker_ds.resources[0].status.desiredNumberScheduled | default(-1))
  retries: 30
  delay: 15
