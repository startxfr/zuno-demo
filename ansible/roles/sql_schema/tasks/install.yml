---
# mcp-sales-db is built by the separate "mcp" Day 1 build component; its name
# doesn't match this run-component's own name ("sql-schema") - same
# name-mismatch self-sufficiency pattern as ansible/roles/agents/tasks/install.yml
# (see there for the full rationale and apply_openshift_build.yml's idempotency
# guarantee).
- name: "sql_schema | ensure the mcp-sales-db image is built"
  ansible.builtin.include_role:
    name: mcp_build
    tasks_from: build

# Generates the SQL/fixtures ConfigMap and Namespace only; the actual apply
# is an ArgoCD PreSync hook Job owned by gitops/charts/sql-schema.
- name: "sql_schema | build the SQL ConfigMap from data/sxa/"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/sql_schema/kustomize/schema"

- name: "sql_schema | ensure the zuno-data namespace exists"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/sql_schema/kustomize/prereqs"

# The schema-apply Job and its ExternalSecret live in this Application's
# chart, so the default gitops_app_wait already blocks until it succeeds.
#
# Only d0 (schemas) here. The d1 server Application moved to
# ansible/roles/mcp/tasks/install.yml: its Deployment reads the
# mcp-gateway-workload-token Secret that only the mcp component's gateway
# Application creates, so applying d1 here health-gated this component on
# a Secret a LATER component provides - a fresh-install deadlock
# (day2 install died on it, live 2026-08-25; previously masked because
# the Retain-policy Secret survived reinstalls).
- name: "sql_schema | apply the sales-db MCP server GitOps Application (d0, schema prerequisites)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "mcp-sales-db"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"
