---
- name: "sql_schema | verify the postgresql role's PostgresCluster is ready"
  kubernetes.core.k8s_info:
    api_version: postgres-operator.crunchydata.com/v1beta1
    kind: PostgresCluster
    namespace: zuno-data
    name: zuno-postgresql
  register: _sql_schema_precheck_pg

- name: "sql_schema | fail if PostgreSQL is not present"
  ansible.builtin.fail:
    msg: "PostgreSQL cluster zuno-postgresql not found. Run `make d0 install postgresql` and `make d0 configure postgresql` first."
  when: (_sql_schema_precheck_pg.resources | default([]) | length) == 0

- name: "sql_schema | precheck summary"
  ansible.builtin.debug:
    msg: "PostgreSQL is present; schema/fixtures and the sales-db MCP server can be applied."
