---
- name: "sql_schema | verify the postgresql role's Cluster is ready"
  kubernetes.core.k8s_info:
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    namespace: zuno-data
    name: zuno-postgresql
  register: _sql_schema_precheck_pg

- name: "sql_schema | fail if PostgreSQL is not present"
  ansible.builtin.fail:
    msg: "PostgreSQL cluster zuno-postgresql not found. Run `make prepare postgresql` and `make configure postgresql` first."
  when: (_sql_schema_precheck_pg.resources | default([]) | length) == 0

- name: "sql_schema | precheck summary"
  ansible.builtin.debug:
    msg: "PostgreSQL is present; schema/fixtures and the sales-db MCP server can be applied."
