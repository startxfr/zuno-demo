---
# State detection (never fails). "Installed" requires both the one-shot
# schema/fixtures Job's last run to have succeeded and the sales-db MCP
# server Application to be Synced+Healthy.
- name: "sql_schema | look up the schema-apply Job"
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    namespace: zuno-data
    name: zuno-sxa-schema-apply
  register: _sql_schema_job_lookup

- name: "sql_schema | check the mcp-sales-db Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-mcp-sales-db-d0"

- name: "sql_schema | save the d0 check result"
  ansible.builtin.set_fact:
    _sql_schema_d0_installed: "{{ _state_check_result }}"

- name: "sql_schema | check the mcp-sales-db Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-mcp-sales-db-d1"

- name: "sql_schema | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        (_sql_schema_job_lookup.resources | default([]) | length) > 0
        and (_sql_schema_job_lookup.resources[0].status.succeeded | default(0)) > 0
        and _sql_schema_d0_installed
        and _state_check_result
      }}

- name: "sql_schema | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
