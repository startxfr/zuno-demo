---
# Applies the SXA-derived schema + synthetic fixtures (ADR-0016, ADR-0025)
# directly via a one-shot Job - not a GitOps Application, since there is
# nothing "declaratively running" about a schema migration once it has run
# (see gitops/apps/README.md). The sales-db MCP server that reads this
# schema *is* a standing workload, so it's applied afterward as a proper
# GitOps Application.
# ADR-0310: ansible/roles/sql_schema/kustomize/schema/ (a configMapGenerator
# reading directly from data/sxa/ - disableNameSuffixHash keeps the name
# "zuno-sxa-schema" stable so the inline Job below, which is outside this
# kustomization, can still reference it by that fixed name) and
# ansible/roles/sql_schema/kustomize/prereqs/ (the static Namespace and
# ExternalSecret).
- name: "sql_schema | build the SQL ConfigMap from data/sxa/"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/sql_schema/kustomize/schema"

- name: "sql_schema | ensure the zuno-data namespace and PostgreSQL credentials ExternalSecret exist"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/sql_schema/kustomize/prereqs"

- name: "sql_schema | delete any previous schema-apply Job (Jobs are immutable, this task is idempotent-by-recreation)"
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: zuno-sxa-schema-apply
    namespace: zuno-data
    wait: true

- name: "sql_schema | run the schema + fixtures apply Job"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: zuno-sxa-schema-apply
        namespace: zuno-data
        labels:
          zuno.io/managed-by: zuno-ansible
      spec:
        backoffLimit: 2
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: psql
                image: postgres:16-bookworm
                command:
                  - psql
                env:
                  - name: PGHOST
                    # zuno-postgresql-primary is PGO's own auto-created
                    # Service for the zuno-postgresql PostgresCluster -
                    # there is no plain "postgresql" Service, and no
                    # "-rw"-suffixed one either (that was CloudNativePG's
                    # convention - see ansible/roles/postgresql/README.md).
                    value: zuno-postgresql-primary.zuno-data.svc.cluster.local
                  - name: PGPORT
                    value: "5432"
                  - name: PGDATABASE
                    value: zuno
                  - name: PGUSER
                    valueFrom:
                      secretKeyRef:
                        name: sql-schema-postgresql-credentials
                        key: username
                  - name: PGPASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: sql-schema-postgresql-credentials
                        key: password
                args:
                  - -v
                  - ON_ERROR_STOP=1
                  - -f
                  - /sql/001_init.sql
                  - -f
                  - /sql/002_pgvector.sql
                  - -f
                  - /sql/seed.sql
                volumeMounts:
                  - name: sql
                    mountPath: /sql
            volumes:
              - name: sql
                configMap:
                  name: zuno-sxa-schema

- name: "sql_schema | wait for the apply Job to complete"
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    namespace: zuno-data
    name: zuno-sxa-schema-apply
  register: _sql_schema_job
  until: (_sql_schema_job.resources[0].status.succeeded | default(0)) > 0
  retries: 30
  delay: 10

- name: "sql_schema | apply the sales-db MCP server GitOps Application"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "mcp-sales-db"
    gitops_app_name: "{{ zuno_id }}-{{ gitops_component_name }}"
