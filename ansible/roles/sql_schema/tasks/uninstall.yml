---
# zuno-data (shared namespace) is left in place.
- name: "sql_schema | delete the mcp-sales-db ArgoCD Application"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-mcp-sales-db"

- name: "sql_schema | delete the postgresql credentials ExternalSecret"
  kubernetes.core.k8s:
    state: absent
    api_version: external-secrets.io/v1beta1
    kind: ExternalSecret
    name: sql-schema-postgresql-credentials
    namespace: zuno-data
