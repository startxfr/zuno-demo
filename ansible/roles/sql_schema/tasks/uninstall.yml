---
# zuno-data (shared namespace) is left in place. The d1 server
# Application is deleted by ansible/roles/mcp/tasks/uninstall.yml (which
# runs earlier in the Day 2 reverse order) - see install.yml's deadlock
# note for why d1 lives with the mcp component now.
- name: "sql_schema | delete the mcp-sales-db ArgoCD Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-mcp-sales-db-d0"

- name: "sql_schema | delete the postgresql credentials ExternalSecret"
  kubernetes.core.k8s:
    state: absent
    api_version: external-secrets.io/v1beta1
    kind: ExternalSecret
    name: sql-schema-postgresql-credentials
    namespace: zuno-data
