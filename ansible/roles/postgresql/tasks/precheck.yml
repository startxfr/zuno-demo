---
- name: "postgresql | verify cluster API is reachable"
  kubernetes.core.k8s_info:
    kind: Namespace
    name: default
  register: _postgresql_precheck_api

- name: "postgresql | fail if the cluster API is unreachable"
  ansible.builtin.fail:
    msg: "Unable to reach the OpenShift API for the postgresql precheck."
  when: _postgresql_precheck_api.resources is not defined

- name: "postgresql | verify the argocd role has already prepared the Application CRD"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: applications.argoproj.io
  register: _postgresql_precheck_argocd_crd

- name: "postgresql | fail if ArgoCD is not yet installed"
  ansible.builtin.fail:
    msg: >-
      applications.argoproj.io CRD not found. Run `make prepare argocd`
      before preparing postgresql - the PostgresCluster CR is applied as a
      GitOps Application (see ansible/roles/postgresql/tasks/configure.yml).
  when: (_postgresql_precheck_argocd_crd.resources | default([]) | length) == 0

# Crunchy's PGO (ADR-0015 doesn't name a specific operator - see
# ansible/roles/postgresql/README.md for why this repo picked PGO over
# CloudNativePG) is published from redhat-operators, one of OpenShift's
# four default CatalogSources - unlike CloudNativePG (which needed a
# manual operatorhubio-catalog fallback on at least one real cluster),
# no fallback-catalog logic is needed here: a simple existence check is
# enough, the same style as ansible/roles/{argocd,external_secrets,keycloak}.
- name: "postgresql | verify the Crunchy Postgres Operator is available in the catalog"
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    namespace: openshift-marketplace
    name: crunchy-postgres-operator
  register: _postgresql_precheck_pkg

- name: "postgresql | fail if the Crunchy Postgres Operator is not published in this cluster's catalog"
  ansible.builtin.fail:
    msg: >-
      crunchy-postgres-operator was not found in openshift-marketplace.
      Confirm the redhat-operators CatalogSource is enabled. See
      ansible/roles/postgresql/README.md.
  when: (_postgresql_precheck_pkg.resources | default([]) | length) == 0

- name: "postgresql | precheck summary"
  ansible.builtin.debug:
    msg: "Crunchy Postgres Operator is available in the catalog; cluster reachable and ArgoCD installed."
