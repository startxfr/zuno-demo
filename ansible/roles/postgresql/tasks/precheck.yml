---
- name: "postgresql | verify cluster API is reachable"
  kubernetes.core.k8s_info:
    kind: Namespace
    name: default
  register: _postgresql_precheck_api

- name: "postgresql | fail if the cluster API is unreachable"
  ansible.builtin.fail:
    msg: "Unable to reach the OpenShift API for the postgresql precheck."
  when: _postgresql_precheck_api.resources is not defined

- name: "postgresql | verify the argocd role has already prepared the Application CRD"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: applications.argoproj.io
  register: _postgresql_precheck_argocd_crd

- name: "postgresql | fail if ArgoCD is not yet installed"
  ansible.builtin.fail:
    msg: >-
      applications.argoproj.io CRD not found. Run `make d0 install argocd`
      before preparing postgresql - the PostgresCluster CR is applied as a
      GitOps Application (see ansible/roles/postgresql/tasks/configure.yml).
  when: (_postgresql_precheck_argocd_crd.resources | default([]) | length) == 0

# Crunchy's PGO (ADR-0015 doesn't name a specific operator - see
# ansible/roles/postgresql/README.md for why this repo picked PGO over
# CloudNativePG) was assumed to be published from redhat-operators as
# package "crunchy-postgres-operator" - proven wrong on a real cluster
# (OLM's ResolutionFailed: no such package in that catalog there). This
# check is deliberately a fuzzy name match, not an exact package name, so
# precheck doesn't falsely block a cluster where PGO exists under a
# different catalog or exact package name - install.yml does the same
# fuzzy discovery (plus an operatorhubio-catalog fallback); the actual
# Subscription (ADR-0312: now part of gitops/charts/postgresql) is applied
# by configure.yml, which re-selects the package/channel/catalog install.yml
# already validated is possible.
- name: "postgresql | verify some Crunchy-named operator package is available in the catalog"
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    namespace: openshift-marketplace
  register: _postgresql_precheck_all_pkgs

- name: "postgresql | fail if nothing crunchy-named is published in this cluster's catalogs"
  ansible.builtin.fail:
    msg: >-
      No PackageManifest matching /crunchy/i was found in
      openshift-marketplace. `make d0 install postgresql` will still attempt
      the operatorhubio-catalog fallback and retry before failing for
      real - precheck itself stays read-only (matching every other role's
      precheck/prepare split in this repo), so it reports this as a hard
      stop here. Every postgres-ish package this cluster's catalogs
      actually publish: {{ _postgresql_precheck_all_pkgs.resources | default([])
        | selectattr('metadata.name', 'search', 'postgres', ignorecase=True)
        | map(attribute='metadata.name') | list }}. See
      ansible/roles/postgresql/README.md.
  when: >-
    (_postgresql_precheck_all_pkgs.resources | default([])
     | selectattr('metadata.name', 'search', 'crunchy', ignorecase=True)
     | list | length) == 0

- name: "postgresql | precheck summary"
  ansible.builtin.debug:
    msg: "Crunchy Postgres Operator is available in the catalog; cluster reachable and ArgoCD installed."
