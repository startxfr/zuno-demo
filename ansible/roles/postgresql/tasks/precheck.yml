---
- name: "postgresql | verify cluster API is reachable"
  kubernetes.core.k8s_info:
    kind: Namespace
    name: default
  register: _postgresql_precheck_api

- name: "postgresql | fail if the cluster API is unreachable"
  ansible.builtin.fail:
    msg: "Unable to reach the OpenShift API for the postgresql precheck."
  when: _postgresql_precheck_api.resources is not defined

- name: "postgresql | verify the argocd role has already prepared the Application CRD"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: applications.argoproj.io
  register: _postgresql_precheck_argocd_crd

- name: "postgresql | fail if ArgoCD is not yet installed"
  ansible.builtin.fail:
    msg: >-
      applications.argoproj.io CRD not found. Run `make prepare argocd`
      before preparing postgresql - the Cluster CR is applied as a GitOps
      Application (see ansible/roles/postgresql/tasks/configure.yml).
  when: (_postgresql_precheck_argocd_crd.resources | default([]) | length) == 0

- name: "postgresql | verify the CloudNativePG operator is available in the catalog"
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    namespace: openshift-marketplace
    name: cloudnative-pg
  register: _postgresql_precheck_pkg

- name: "postgresql | fail if the CloudNativePG operator is not published in this cluster's catalog"
  ansible.builtin.fail:
    msg: >-
      cloudnative-pg was not found in openshift-marketplace. `make prepare
      postgresql` will automatically register the operatorhubio-catalog
      fallback (quay.io/operatorhubio/catalog:latest) and retry discovery
      from there before failing for real - precheck itself stays
      read-only and never registers a CatalogSource (matching every other
      role's precheck/prepare split in this repo), so it still reports
      this as a hard stop here. See ansible/roles/postgresql/README.md.
  when: (_postgresql_precheck_pkg.resources | default([]) | length) == 0

- name: "postgresql | precheck summary"
  ansible.builtin.debug:
    msg: "CloudNativePG operator is available in the catalog; cluster reachable and ArgoCD installed."
