---
# State detection (never fails). The zuno-postgresql Application (only
# ever applied in configure.yml) plus PGO's own rollout-complete signal
# configure.yml already waits on.
- name: "postgresql | check the postgresql Application"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-postgresql"

- name: "postgresql | look up the PostgresCluster"
  kubernetes.core.k8s_info:
    api_version: postgres-operator.crunchydata.com/v1beta1
    kind: PostgresCluster
    namespace: zuno-data
    name: zuno-postgresql
  register: _postgresql_cluster_lookup

- name: "postgresql | compute configure state"
  ansible.builtin.set_fact:
    _state_is_configured: >-
      {{
        _state_check_result
        and (_postgresql_cluster_lookup.resources | default([]) | length) > 0
        and (_postgresql_cluster_lookup.resources[0].status.conditions | default([])
             | selectattr('type', 'equalto', 'Progressing') | map(attribute='status') | list
             | first | default('True')) == 'False'
      }}

- name: "postgresql | record configure state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_configure_state.yml"
