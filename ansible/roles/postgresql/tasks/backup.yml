---
# `make d3 backup postgresql` - triggers an on-demand pgBackRest backup via
# PGO's documented annotation mechanism (PGO runs a fresh backup Job
# whenever postgres-operator.crunchydata.com/pgbackrest-backup's value
# changes; any unique value works, a timestamp doubles as a log trail).
# Unlike precheck.yml's read of the same status shape (diagnostic only,
# never fails), this is an explicit on-demand action and fails loudly if
# it doesn't complete.
- name: "postgresql | look up the PostgresCluster"
  kubernetes.core.k8s_info:
    api_version: postgres-operator.crunchydata.com/v1beta1
    kind: PostgresCluster
    namespace: zuno-data
    name: zuno-postgresql
  register: _postgresql_backup_cluster_lookup

- name: "postgresql | fail if the PostgresCluster doesn't exist"
  ansible.builtin.fail:
    msg: "zuno-postgresql PostgresCluster not found in zuno-data - nothing to back up. Run 'make d0 install postgresql' first."
  when: (_postgresql_backup_cluster_lookup.resources | default([]) | length) == 0

# Baseline: the most recent *successful* scheduled/on-demand backup before
# triggering, so completion below can be detected as "something newer than
# this appeared" rather than mistaking an old backup for the one just
# triggered.
# WP-131 P0-b. This used to watch status.pgbackrest.scheduledBackups and wait
# for a newer completionTime than the one recorded before the patch. Two things
# were wrong with that, and together they meant the command could never do what
# it claimed. The chart declared no spec.backups.pgbackrest.manual block, so
# PGO ignored the annotation entirely and nothing was triggered; and even if
# something had been, an on-demand backup is reported under manualBackup, never
# under scheduledBackups. So the task patched an inert annotation and then
# waited up to ten minutes for the next SCHEDULED backup - succeeding by
# coincidence if a weekly cron happened to land inside the window, and
# otherwise failing while claiming the backup did not complete.
#
# The annotation value is now generated once and kept, because PGO copies it
# verbatim into status.pgbackrest.manualBackup.id. That turns the wait into an
# identity check on the run this task started, rather than a timestamp
# comparison that cannot tell one backup from another.
- name: "postgresql | generate the on-demand backup id"
  ansible.builtin.set_fact:
    _postgresql_backup_id: "{{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')) }}"

- name: "postgresql | trigger an on-demand backup"
  kubernetes.core.k8s:
    state: patched
    api_version: postgres-operator.crunchydata.com/v1beta1
    kind: PostgresCluster
    namespace: zuno-data
    name: zuno-postgresql
    definition:
      metadata:
        annotations:
          postgres-operator.crunchydata.com/pgbackrest-backup: "{{ _postgresql_backup_id }}"

# `finished` alone is not success - oc explain says so explicitly ("does not
# indicate success or failure") - so succeeded must be checked too, and the id
# must match or a previous manual backup still in status would satisfy this
# immediately.
- name: "postgresql | wait for this on-demand backup to finish successfully"
  kubernetes.core.k8s_info:
    api_version: postgres-operator.crunchydata.com/v1beta1
    kind: PostgresCluster
    namespace: zuno-data
    name: zuno-postgresql
  register: _postgresql_backup_poll
  vars:
    _mb: >-
      {{ (_postgresql_backup_poll.resources[0].status.pgbackrest.manualBackup
          | default({}, true)) }}
  until:
    - (_mb['id'] | default('')) == _postgresql_backup_id
    - (_mb['finished'] | default(false)) | bool
    - (_mb['succeeded'] | default(0)) | int > 0
  # 30 minutes, not 10. Measured on this cluster 2026-09-04: a repo2 full of a
  # 7.7 GB database took 755s (12m35s), and the 2026-08-30 scheduled one took
  # 633s - so the previous 60x10s window was already under the observed range,
  # and this task reported FAILURE on a backup that had in fact succeeded and
  # landed 2.9 GB in S3. A backup's duration grows with the database, so the
  # window has to have real headroom rather than track today's number; failing
  # early here is strictly worse than waiting, because the operator then has to
  # work out whether a "failed" backup exists.
  retries: 180
  delay: 10

# A timeout above is not proof the backup failed - it usually means it is still
# running. Say so, and say where to look, rather than leaving a bare
# "Unknown error" and 200 lines of dumped resource.
- name: "postgresql | report backup completion"
  ansible.builtin.debug:
    msg: >-
      On-demand backup {{ _postgresql_backup_id }} completed on repo
      {{ (_postgresql_backup_cluster_lookup.resources[0].spec.backups.pgbackrest.manual.repoName | default('?')) }}:
      {{ (_postgresql_backup_poll.resources[0].status.pgbackrest.manualBackup | default({}, true)) }}
