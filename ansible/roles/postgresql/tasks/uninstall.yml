---
# Reverse of install.yml. The Subscription name is runtime-discovered, not
# a fixed constant, so it's rediscovered here by listing.
#
# Order matters: delete -d1 (the PostgresCluster operand) first so ArgoCD
# isn't fighting a CR deletion its own Application still desires, then run
# remove_operator.yml (needs the Subscription to still exist) before -d0's
# own delete, to avoid racing ArgoCD's cascade prune of the same Subscription.
- name: "postgresql | delete the postgresql ArgoCD Application (d1: PostgresCluster)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-postgresql-d1"

- name: "postgresql | find the Crunchy Postgres Operator Subscription"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    namespace: openshift-operators
  register: _postgresql_subscriptions

- name: "postgresql | remove the discovered operator(s) (owned CRDs - cascading the PostgresCluster - then CSV, then Subscription)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/remove_operator.yml"
  vars:
    operator_subscription_name: "{{ _postgresql_subscription.metadata.name }}"
    operator_namespace: openshift-operators
  loop: >-
    {{ _postgresql_subscriptions.resources | default([])
       | selectattr('metadata.name', 'search', 'postgres-operator|^pgo|crunchy') | list }}
  loop_control:
    loop_var: _postgresql_subscription
    label: "{{ _postgresql_subscription.metadata.name }}"

- name: "postgresql | delete the postgresql ArgoCD Application (d0: cascades the remaining operator install)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-postgresql-d0"

- name: "postgresql | delete the operatorhubio-catalog fallback CatalogSource"
  kubernetes.core.k8s:
    state: absent
    api_version: operators.coreos.com/v1alpha1
    kind: CatalogSource
    name: operatorhubio-catalog
    namespace: openshift-marketplace
