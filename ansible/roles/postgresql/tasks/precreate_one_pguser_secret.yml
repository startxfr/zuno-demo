---
# One entry of postgresql_pguser_bootstrap_secrets. Included, not inlined, so
# the Vault read and the Secret write stay a single no_log unit per user -
# see tasks/precreate_pguser_secrets.yml for why this exists at all.
- name: "postgresql | read {{ pguser.owner }}'s credential from Vault"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _postgresql_pguser_vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ _postgresql_pguser_vault_creds.resources[0].data.root_token | b64decode }}
      vault kv get -format=json zuno/{{ pguser.vault_path }}"
  register: _postgresql_pguser_vault_read
  changed_when: false
  failed_when: false
  no_log: true

- name: "postgresql | create zuno-postgresql-pguser-{{ pguser.owner }} with PGO's adoption labels"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ postgresql_cluster_name | default('zuno-postgresql') }}-pguser-{{ pguser.owner }}"
        namespace: zuno-data
        labels:
          # PGO identifies an externally-managed pguser Secret by these two.
          postgres-operator.crunchydata.com/cluster: "{{ postgresql_cluster_name | default('zuno-postgresql') }}"
          postgres-operator.crunchydata.com/pguser: "{{ pguser.owner }}"
      stringData:
        user: "{{ (_postgresql_pguser_vault_read.stdout | from_json).data.data.username }}"
        password: "{{ (_postgresql_pguser_vault_read.stdout | from_json).data.data.password }}"
  when:
    - _postgresql_pguser_vault_read.rc | default(1) == 0
    - _postgresql_pguser_vault_read.stdout | default('') | length > 0
  no_log: true

- name: "postgresql | report a pguser credential that is missing from Vault"
  ansible.builtin.debug:
    msg: >-
      zuno/{{ pguser.vault_path }} has no credential in Vault yet, so
      {{ postgresql_cluster_name | default('zuno-postgresql') }}-pguser-{{ pguser.owner }}
      was not pre-created. PGO will generate its own password for this role,
      which under creationPolicy Merge will NOT be replaced by a later Vault
      value - re-run `make d0 install vault` to seed it, delete the Secret,
      and re-run this role. See ADR-0526.
  when: _postgresql_pguser_vault_read.rc | default(1) != 0
