---
# Discovers the Crunchy Postgres Operator package/catalog/channel actually
# published (neither is fixed across clusters); falls back to
# operatorhubio-catalog.
- name: "postgresql | list every PackageManifest published in this cluster's catalogs"
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    namespace: openshift-marketplace
  register: _postgresql_all_pkgs

- name: "postgresql | select whichever package looks like the Crunchy Postgres Operator"
  ansible.builtin.set_fact:
    _postgresql_pkg_candidates: >-
      {{
        _postgresql_all_pkgs.resources | default([])
        | selectattr('metadata.name', 'search', 'crunchy', ignorecase=True) | list
      }}

- name: "postgresql | register the operatorhubio-catalog fallback if nothing crunchy-named was found anywhere"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/postgresql/kustomize/catalogsource-fallback"
  when: (_postgresql_pkg_candidates | length) == 0

- name: "postgresql | wait for the operatorhubio-catalog fallback to become ready"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: CatalogSource
    namespace: openshift-marketplace
    name: operatorhubio-catalog
  register: _postgresql_fallback_catalog
  until: >-
    (_postgresql_fallback_catalog.resources | default([]) | length) > 0 and
    (_postgresql_fallback_catalog.resources[0].status.connectionState.lastObservedState | default('')) == 'READY'
  retries: 30
  delay: 10
  when: (_postgresql_pkg_candidates | length) == 0

- name: "postgresql | re-list PackageManifests after registering the fallback catalog"
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    namespace: openshift-marketplace
  register: _postgresql_all_pkgs
  when: (_postgresql_pkg_candidates | length) == 0

- name: "postgresql | re-select after the fallback catalog registration"
  ansible.builtin.set_fact:
    _postgresql_pkg_candidates: >-
      {{
        _postgresql_all_pkgs.resources | default([])
        | selectattr('metadata.name', 'search', 'crunchy', ignorecase=True) | list
      }}
  when: (_postgresql_pkg_candidates | length) == 0

- name: "postgresql | fail with a clear diagnostic if nothing crunchy-named was found anywhere"
  ansible.builtin.fail:
    msg: >-
      No PackageManifest matching /crunchy/i was found in
      openshift-marketplace, even after registering the
      operatorhubio-catalog fallback. Every postgres-ish package this
      cluster's catalogs actually publish:
      {{ _postgresql_all_pkgs.resources | default([])
         | selectattr('metadata.name', 'search', 'postgres', ignorecase=True)
         | map(attribute='metadata.name') | list }}.
      Confirm the correct OLM package name (e.g.
      `oc get packagemanifest -n openshift-marketplace | grep -iE
      "crunchy|postgres"`) and update this task's selection filter if it
      differs from "crunchy".
  when: (_postgresql_pkg_candidates | length) == 0

# Prefer an exact "crunchy-postgres-operator" match if multiple
# crunchy-named packages exist (e.g. published by more than one catalog);
# otherwise take whichever fuzzy match was found.
- name: "postgresql | pick the package name/catalog/channel to subscribe from"
  ansible.builtin.set_fact:
    _postgresql_pkg: >-
      {{
        (_postgresql_pkg_candidates | selectattr('metadata.name', 'equalto', 'crunchy-postgres-operator') | list
         + _postgresql_pkg_candidates)[0]
      }}

- name: "postgresql | select the channel to subscribe from"
  ansible.builtin.set_fact:
    _postgresql_package_name: "{{ _postgresql_pkg.metadata.name }}"
    _postgresql_catalog_source: "{{ _postgresql_pkg.status.catalogSource }}"
    _postgresql_channel: >-
      {{
        'stable'
        if (_postgresql_pkg.status.channels | selectattr('name', 'equalto', 'stable') | list | length) > 0
        else (_postgresql_pkg.status.defaultChannel | default(''))
      }}

- name: "postgresql | fail if no usable channel was found"
  ansible.builtin.fail:
    msg: >-
      Package '{{ _postgresql_package_name }}' (catalog
      '{{ _postgresql_catalog_source }}') has no "stable" channel and no
      defaultChannel to fall back to. Published channels:
      {{ _postgresql_pkg.status.channels | map(attribute='name') | list }}.
  when: _postgresql_channel | length == 0

- name: "postgresql | discovery summary"
  ansible.builtin.debug:
    msg: >-
      Subscribing to package '{{ _postgresql_package_name }}', catalog
      '{{ _postgresql_catalog_source }}', channel '{{ _postgresql_channel }}'.

# The Subscription (operator.enabled) lives in gitops/charts/postgresql,
# applied via the separate zuno-postgresql-d0 Application.
- name: "postgresql | apply the PostgreSQL GitOps Application (d0: operator)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "postgresql"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"
    gitops_app_extra_helm_values:
      operator:
        enabled: true
        subscription:
          name: "{{ _postgresql_package_name }}"
          operator:
            name: "{{ _postgresql_package_name }}"
            channel: "{{ _postgresql_channel }}"
            source:
              name: "{{ _postgresql_catalog_source }}"
    gitops_app_wait_retries: 60

# PGO's own operand image bundles pgvector and TimescaleDB - no custom
# image/build needed (unverified: confirm versions once connected via
# `SELECT extname, extversion FROM pg_extension;`).
#
# Only add the S3 pgBackRest repo when real credentials exist - never
# rendered half-configured. Shared with restore.yml/check_s3_backup.yml.
- name: "postgresql | resolve S3 backup credentials"
  ansible.builtin.include_tasks: resolve_backup_s3_creds.yml

- name: "postgresql | note that the S3 backup repo is not configured"
  ansible.builtin.debug:
    msg: >-
      zuno_postgresql_backup_s3_* fields are not all set in
      ansible/confidential.yml - the zuno-postgresql PostgresCluster will
      only get the local PVC backup repo (repo1). Fill in the bucket/
      endpoint/region/access_key/secret_key fields and re-run
      `make d0 install postgresql` to add the off-cluster S3 repo (repo2).
  when: not (_postgresql_backup_s3_enabled | bool)

# Auto-detect a reinstall over previously-backed-up data: the S3 bucket
# itself is the source of truth (in-cluster pgBackRest info Job, not just
# "the local PVC is missing" - a fresh environment legitimately has no
# repo2 data yet either). Safety gate: only ever considered when the
# PostgresCluster does NOT already exist live - a normal re-run of
# `make d1 install postgresql` against an already-healthy cluster must
# never trigger a restore.
- name: "postgresql | look up whether a PostgresCluster already exists"
  kubernetes.core.k8s_info:
    api_version: postgres-operator.crunchydata.com/v1beta1
    kind: PostgresCluster
    namespace: zuno-data
    name: zuno-postgresql
  register: _postgresql_existing_cluster_lookup

- name: "postgresql | check the S3 backup repo for existing data"
  ansible.builtin.include_tasks: check_s3_backup.yml
  when:
    - _postgresql_backup_s3_enabled | bool
    - (_postgresql_existing_cluster_lookup.resources | default([]) | length) == 0

- name: "postgresql | restore from the existing S3 backup instead of bootstrapping empty"
  ansible.builtin.include_tasks: restore.yml
  when:
    - _postgresql_s3_has_backup | default(false) | bool
    - (_postgresql_existing_cluster_lookup.resources | default([]) | length) == 0

- name: "postgresql | record whether auto-restore just ran"
  ansible.builtin.set_fact:
    _postgresql_auto_restored: >-
      {{
        (_postgresql_s3_has_backup | default(false) | bool)
        and ((_postgresql_existing_cluster_lookup.resources | default([]) | length) == 0)
      }}

# ADR-0526: the pguser Secrets must exist, carrying the Vault credential,
# BEFORE the PostgresCluster does. The chart's ExternalSecrets are
# creationPolicy: Merge (which is what stops the PGO/ESO write loop) and
# Merge does not create a missing Secret - so on a greenfield cluster PGO
# would otherwise win the race with a self-generated password that no later
# Vault sync can dislodge. This is a no-op on a cluster where they exist.
- name: "postgresql | pre-create the pguser Secrets from Vault (before the PostgresCluster)"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/precreate_pguser_secrets.yml"

# postgresCluster.enabled lives in the same chart, applied via the
# separate zuno-postgresql-d1 Application after -d0 is Synced+Healthy.
# Skipped when restore.yml (above) already applied d1 with the restore
# trigger and cleared it again - re-applying here would be redundant, not
# wrong, but there's no reason to.
- name: "postgresql | apply the PostgreSQL GitOps Application (d1: PostgresCluster)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "postgresql"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
    gitops_app_extra_helm_values:
      postgresCluster:
        enabled: true
      backups:
        s3:
          enabled: "{{ _postgresql_backup_s3_enabled | bool }}"
          bucket: "{{ zuno_postgresql_backup_s3_bucket | default('') }}"
          endpoint: "{{ zuno_postgresql_backup_s3_endpoint | default('') }}"
          region: "{{ zuno_postgresql_backup_s3_region | default('') }}"
    gitops_app_wait_retries: 60
  when: not (_postgresql_auto_restored | default(false))

# PGO 5.8.8 never sets a "Progressing" condition, so the documented
# `wait --for=condition=Progressing=False` approach never matches here;
# compare readyReplicas against replicas (summed across instance sets)
# plus ProxyAvailable instead.
- name: "postgresql | wait for the zuno-postgresql PostgresCluster to finish rolling out"
  kubernetes.core.k8s_info:
    api_version: postgres-operator.crunchydata.com/v1beta1
    kind: PostgresCluster
    namespace: zuno-data
    name: zuno-postgresql
  register: _postgresql_cluster
  until: >-
    (_postgresql_cluster.resources | default([]) | length) > 0 and
    (_postgresql_cluster.resources[0].status.instances | default([]) | length) > 0 and
    (_postgresql_cluster.resources[0].status.instances | map(attribute='readyReplicas', default=0) | sum) ==
    (_postgresql_cluster.resources[0].status.instances | map(attribute='replicas', default=0) | sum) and
    (_postgresql_cluster.resources[0].status.conditions | default([])
     | selectattr('type', 'equalto', 'ProxyAvailable') | map(attribute='status') | list
     | first | default('False')) == 'True'
  retries: 60
  delay: 10

# PGO 5.8.8 + postgresVersion 18: the operator's pgMonitor step targets a
# "monitor" schema (and the exporter needs a ccp_monitoring role) it never
# creates for pg18. The missing schema is NOT just log noise - the psql
# failure aborts every PostgresCluster reconcile ("command terminated with
# exit code 3") BEFORE the databaseInitSQL step, so spec.databaseInitSQL
# (every CREATE EXTENSION vector in configmap-init-sql.yaml) silently never
# runs on a fresh cluster - downstream, every schema-apply Job then dies
# with "permission denied to create extension vector" and zuno-ogx
# CrashLoops (live-diagnosed 2026-08-25). The chart's own automation
# (job-monitoring-role.yaml) would fix this, but that ArgoCD Sync-hook Job
# is never created by ArgoCD (unresolved - see the chart comment), so this
# role guarantees the fix directly. All statements are idempotent.
- name: "postgresql | look up the current Postgres primary pod"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: zuno-data
    label_selectors:
      - postgres-operator.crunchydata.com/role=master
  register: _postgresql_primary_pod
  until: (_postgresql_primary_pod.resources | default([]) | length) > 0
  retries: 30
  delay: 10

- name: "postgresql | read the PGO-generated monitoring password"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: zuno-data
    name: zuno-postgresql-monitoring
  register: _postgresql_monitoring_secret
  until: (_postgresql_monitoring_secret.resources | default([]) | length) > 0
  retries: 30
  delay: 10
  no_log: true

- name: "postgresql | ensure the ccp_monitoring role exists (pg18: PGO never creates it)"
  kubernetes.core.k8s_exec:
    namespace: zuno-data
    pod: "{{ _postgresql_primary_pod.resources[0].metadata.name }}"
    container: database
    command: >-
      psql -U postgres -v ON_ERROR_STOP=1 -c
      "DO $zuno$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'ccp_monitoring')
       THEN CREATE ROLE ccp_monitoring LOGIN; END IF; END $zuno$;"
  changed_when: true

- name: "postgresql | sync ccp_monitoring's password with the zuno-postgresql-monitoring Secret"
  kubernetes.core.k8s_exec:
    namespace: zuno-data
    pod: "{{ _postgresql_primary_pod.resources[0].metadata.name }}"
    container: database
    command: >-
      psql -U postgres -v ON_ERROR_STOP=1 -c
      {{ ("ALTER ROLE ccp_monitoring LOGIN PASSWORD '"
          ~ ((_postgresql_monitoring_secret.resources[0].data.password | b64decode) | replace("'", "''"))
          ~ "'") | quote }}
  changed_when: true
  no_log: true

- name: "postgresql | grant monitoring access and create the monitor schema (unwedges the PGO reconcile)"
  kubernetes.core.k8s_exec:
    namespace: zuno-data
    pod: "{{ _postgresql_primary_pod.resources[0].metadata.name }}"
    container: database
    command: >-
      psql -U postgres -v ON_ERROR_STOP=1
      -c "GRANT pg_monitor TO ccp_monitoring;"
      -c "GRANT CONNECT ON DATABASE postgres TO ccp_monitoring;"
      -c "CREATE SCHEMA IF NOT EXISTS monitor AUTHORIZATION ccp_monitoring;"
  changed_when: true

# The real acceptance signal: PGO only stamps status.databaseInitSQL after a
# reconcile got far enough to run spec.databaseInitSQL - i.e. the extensions
# every downstream schema-apply Job depends on now exist.
- name: "postgresql | wait for PGO to record that databaseInitSQL has been applied"
  kubernetes.core.k8s_info:
    api_version: postgres-operator.crunchydata.com/v1beta1
    kind: PostgresCluster
    namespace: zuno-data
    name: zuno-postgresql
  register: _postgresql_cluster_initsql
  until: >-
    (_postgresql_cluster_initsql.resources | default([]) | length) > 0 and
    (_postgresql_cluster_initsql.resources[0].status.databaseInitSQL | default('')) != ''
  retries: 30
  delay: 10

# spec.databaseInitSQL is once-at-bootstrap only: databases/roles added to
# the chart AFTER the cluster first initialized (e.g. metricsservice,
# msawxreadonly) never get their extensions/grants from PGO. The script is
# fully idempotent (CREATE EXTENSION IF NOT EXISTS / GRANT / ALTER DEFAULT
# PRIVILEGES), so replay it as superuser on every install. Retried because
# a `\connect` to a database PGO is still creating fails under
# ON_ERROR_STOP until the reconcile catches up.
- name: "postgresql | read the init.sql ConfigMap"
  kubernetes.core.k8s_info:
    kind: ConfigMap
    namespace: zuno-data
    name: zuno-postgresql-init-sql
  register: _postgresql_init_sql_cm
  until: (_postgresql_init_sql_cm.resources | default([]) | length) > 0
  retries: 30
  delay: 10

# psql -c cannot mix \connect meta-commands with SQL, so ship the script
# into the pod and run it with -f (same reason the schema-apply Jobs
# mount their SQL as files).
- name: "postgresql | copy init.sql into the primary pod"
  kubernetes.core.k8s_cp:
    namespace: zuno-data
    pod: "{{ _postgresql_primary_pod.resources[0].metadata.name }}"
    container: database
    remote_path: /tmp/zuno-init-replay.sql
    content: "{{ _postgresql_init_sql_cm.resources[0].data['init.sql'] }}"

- name: "postgresql | replay init.sql idempotently (covers databases added after bootstrap)"
  kubernetes.core.k8s_exec:
    namespace: zuno-data
    pod: "{{ _postgresql_primary_pod.resources[0].metadata.name }}"
    container: database
    command: psql -U postgres -f /tmp/zuno-init-replay.sql
  register: _postgresql_init_sql_replay
  until: _postgresql_init_sql_replay.rc | default(1) == 0
  retries: 30
  delay: 10
  changed_when: true

- name: "postgresql | configure summary"
  ansible.builtin.debug:
    msg: >-
      zuno-postgresql PostgresCluster has finished rolling out in the
      zuno-data namespace
      ({{ _postgresql_cluster.resources[0].status.instances | map(attribute='replicas', default=0) | sum }}
      instance(s), PgBouncer in front).
