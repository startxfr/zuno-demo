---
# Discovers (and, if needed, registers a fallback catalog for) the Crunchy
# Postgres Operator package/catalog/channel this cluster actually
# publishes it under, then applies the postgresql GitOps Application. This
# discovery stays imperative in Ansible even after ADR-0312 (unlike the
# Subscription itself, now in gitops/charts/postgresql): registering
# operatorhubio-catalog is a cluster-wide OLM catalog concern, not this
# component's own workload, the same reasoning that keeps
# ansible/roles/argocd/tasks/apply_resource_health_checks.yml out of any
# chart.
#
# This role originally hardcoded `source: redhat-operators, channel:
# stable` for PGO (reasoning it'd be safer than CloudNativePG's
# fallback-catalog dance, since redhat-operators is a default catalog) -
# proven wrong on a real cluster: OLM's ResolutionFailed condition showed
# `crunchy-postgres-operator` isn't published in redhat-operators there at
# all. Same lesson as CNPG's catalog/channel mismatches, generalized one
# step further this time: don't even trust the *package name* is exactly
# "crunchy-postgres-operator" on every cluster - discover it by fuzzy name
# match across every enabled catalog (ADR-0048-style), falling back to
# registering the well-known public operatorhubio-catalog (already present
# on at least one real cluster from the earlier CloudNativePG fallback)
# if nothing matches anywhere, and failing loudly - listing every
# postgres-ish package actually found - rather than guessing a fourth time.
- name: "postgresql | list every PackageManifest published in this cluster's catalogs"
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    namespace: openshift-marketplace
  register: _postgresql_all_pkgs

- name: "postgresql | select whichever package looks like the Crunchy Postgres Operator"
  ansible.builtin.set_fact:
    _postgresql_pkg_candidates: >-
      {{
        _postgresql_all_pkgs.resources | default([])
        | selectattr('metadata.name', 'search', 'crunchy', ignorecase=True) | list
      }}

# ADR-0310: ansible/roles/postgresql/kustomize/catalogsource-fallback/.
- name: "postgresql | register the operatorhubio-catalog fallback if nothing crunchy-named was found anywhere"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/postgresql/kustomize/catalogsource-fallback"
  when: (_postgresql_pkg_candidates | length) == 0

- name: "postgresql | wait for the operatorhubio-catalog fallback to become ready"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: CatalogSource
    namespace: openshift-marketplace
    name: operatorhubio-catalog
  register: _postgresql_fallback_catalog
  until: >-
    (_postgresql_fallback_catalog.resources | default([]) | length) > 0 and
    (_postgresql_fallback_catalog.resources[0].status.connectionState.lastObservedState | default('')) == 'READY'
  retries: 30
  delay: 10
  when: (_postgresql_pkg_candidates | length) == 0

- name: "postgresql | re-list PackageManifests after registering the fallback catalog"
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    namespace: openshift-marketplace
  register: _postgresql_all_pkgs
  when: (_postgresql_pkg_candidates | length) == 0

- name: "postgresql | re-select after the fallback catalog registration"
  ansible.builtin.set_fact:
    _postgresql_pkg_candidates: >-
      {{
        _postgresql_all_pkgs.resources | default([])
        | selectattr('metadata.name', 'search', 'crunchy', ignorecase=True) | list
      }}
  when: (_postgresql_pkg_candidates | length) == 0

- name: "postgresql | fail with a clear diagnostic if nothing crunchy-named was found anywhere"
  ansible.builtin.fail:
    msg: >-
      No PackageManifest matching /crunchy/i was found in
      openshift-marketplace, even after registering the
      operatorhubio-catalog fallback. Every postgres-ish package this
      cluster's catalogs actually publish:
      {{ _postgresql_all_pkgs.resources | default([])
         | selectattr('metadata.name', 'search', 'postgres', ignorecase=True)
         | map(attribute='metadata.name') | list }}.
      Confirm the correct OLM package name (e.g.
      `oc get packagemanifest -n openshift-marketplace | grep -iE
      "crunchy|postgres"`) and update this task's selection filter if it
      differs from "crunchy".
  when: (_postgresql_pkg_candidates | length) == 0

# Prefer an exact "crunchy-postgres-operator" match if multiple
# crunchy-named packages exist (e.g. published by more than one catalog);
# otherwise take whichever fuzzy match was found.
- name: "postgresql | pick the package name/catalog/channel to subscribe from"
  ansible.builtin.set_fact:
    _postgresql_pkg: >-
      {{
        (_postgresql_pkg_candidates | selectattr('metadata.name', 'equalto', 'crunchy-postgres-operator') | list
         + _postgresql_pkg_candidates)[0]
      }}

- name: "postgresql | select the channel to subscribe from"
  ansible.builtin.set_fact:
    _postgresql_package_name: "{{ _postgresql_pkg.metadata.name }}"
    _postgresql_catalog_source: "{{ _postgresql_pkg.status.catalogSource }}"
    _postgresql_channel: >-
      {{
        'stable'
        if (_postgresql_pkg.status.channels | selectattr('name', 'equalto', 'stable') | list | length) > 0
        else (_postgresql_pkg.status.defaultChannel | default(''))
      }}

- name: "postgresql | fail if no usable channel was found"
  ansible.builtin.fail:
    msg: >-
      Package '{{ _postgresql_package_name }}' (catalog
      '{{ _postgresql_catalog_source }}') has no "stable" channel and no
      defaultChannel to fall back to. Published channels:
      {{ _postgresql_pkg.status.channels | map(attribute='name') | list }}.
  when: _postgresql_channel | length == 0

- name: "postgresql | discovery summary"
  ansible.builtin.debug:
    msg: >-
      Subscribing to package '{{ _postgresql_package_name }}', catalog
      '{{ _postgresql_catalog_source }}', channel '{{ _postgresql_channel }}'.

# ADR-0312: the Subscription (operator.enabled, rendered by the vendored
# startx `operator` chart) lives in gitops/charts/postgresql, applied via
# the separate zuno-postgresql-d0 Application.
- name: "postgresql | apply the PostgreSQL GitOps Application (d0: operator)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "postgresql"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"
    gitops_app_extra_helm_values:
      operator:
        enabled: true
        subscription:
          name: "{{ _postgresql_package_name }}"
          operator:
            name: "{{ _postgresql_package_name }}"
            channel: "{{ _postgresql_channel }}"
            source:
              name: "{{ _postgresql_catalog_source }}"
    gitops_app_wait_retries: 60

# Crunchy's own operand images don't bundle pgvector (open upstream issue
# CrunchyData/postgres-operator#3706) - gitops/charts/postgresql/image/
# Dockerfile layers it on via RPM. Built on-cluster the same way every
# other component's image is (ansible/tasks/apply_openshift_build.yml,
# ADR-0056), the one difference being the Dockerfile's FROM pulls from
# registry.developers.crunchydata.com (zuno_crunchydata_registry_uri
# below, defaulting to that host), which requires a free Crunchy Data
# developer account even just to pull - so this build additionally needs
# a base-image pull Secret, sourced from ansible/confidential.yml
# (zuno_crunchydata_registry_username/_password) the same way
# google-oauth/smtp/confluence credentials are. Soft-read, keycloak-role
# style (ansible/roles/keycloak/tasks/install.yml) - not vault's hard
# fail: postgresql stays independently runnable per ansible/README.md's
# design principle even without this credential set up yet; the
# PostgresCluster applied below just sits ImagePullBackOff either way
# until an image exists, same as it does today - failing this role
# outright over a missing image credential would only block the
# (unrelated) OLM Subscription work above, for no benefit.
- name: "postgresql | check for ansible/confidential.yml"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/confidential.yml"
  register: _postgresql_confidential_file

- name: "postgresql | load ansible/confidential.yml if present"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/confidential.yml"
  when: _postgresql_confidential_file.stat.exists

- name: "postgresql | build the pgvector-enabled image (skipped if Crunchy Data credentials aren't set)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_openshift_build.yml"
  vars:
    build_image_name: postgresql-pgvector
    build_dockerfile_path: Dockerfile
    build_context_dir: gitops/charts/postgresql/image
    build_pull_secret_registry: "{{ zuno_crunchydata_registry_uri | default('registry.developers.crunchydata.com') }}"
    build_pull_secret_username: "{{ zuno_crunchydata_registry_username | default('') }}"
    build_pull_secret_password: "{{ zuno_crunchydata_registry_password | default('') }}"
  when: >-
    (zuno_crunchydata_registry_username | default('xxxxxx') != 'xxxxxx')
    and (zuno_crunchydata_registry_password | default('xxxxxx') != 'xxxxxx')

- name: "postgresql | warn if Crunchy Data credentials are missing"
  ansible.builtin.debug:
    msg: >-
      zuno_crunchydata_registry_username/zuno_crunchydata_registry_password
      are not set in ansible/confidential.yml - skipping the on-cluster
      build of the pgvector-enabled image. The zuno-postgresql
      PostgresCluster applied below will sit in ImagePullBackOff until
      image-registry.openshift-image-registry.svc:5000/zuno-ai-build/postgresql-pgvector:latest
      exists - register a free account at
      https://www.crunchydata.com/developers/download-postgres/containers,
      add those two fields to ansible/confidential.yml, and re-run
      `make d0 install postgresql`.
  when: >-
    not ((zuno_crunchydata_registry_username | default('xxxxxx') != 'xxxxxx')
         and (zuno_crunchydata_registry_password | default('xxxxxx') != 'xxxxxx'))

# templates/postgrescluster.yaml (postgresCluster.enabled) lives in the
# same chart, applied via the separate zuno-postgresql-d1 Application,
# after -d0 (above) is Synced+Healthy.
- name: "postgresql | apply the PostgreSQL GitOps Application (d1: PostgresCluster)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "postgresql"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
    gitops_app_extra_helm_values:
      postgresCluster:
        enabled: true
    gitops_app_wait_retries: 60

# PGO's documented readiness signal (see
# https://access.crunchydata.com/documentation/postgres-operator/latest/tutorials/cluster-management/administrative-tasks,
# "kubectl wait postgrescluster prod --for=condition=Progressing=False"):
# unlike CNPG's single status.phase string, PGO reports a "Progressing"
# condition that goes False once the rollout is complete. Not verified
# against a live cluster in this environment - if the condition type/
# semantics differ on the installed PGO version, adjust this `until`.
- name: "postgresql | wait for the zuno-postgresql PostgresCluster to finish rolling out"
  kubernetes.core.k8s_info:
    api_version: postgres-operator.crunchydata.com/v1beta1
    kind: PostgresCluster
    namespace: zuno-data
    name: zuno-postgresql
  register: _postgresql_cluster
  until: >-
    (_postgresql_cluster.resources | default([]) | length) > 0 and
    (_postgresql_cluster.resources[0].status.conditions | default([])
     | selectattr('type', 'equalto', 'Progressing') | map(attribute='status') | list
     | first | default('True')) == 'False'
  retries: 60
  delay: 10

- name: "postgresql | configure summary"
  ansible.builtin.debug:
    msg: "zuno-postgresql PostgresCluster has finished rolling out in the zuno-data namespace (1 instance, demo scope - see ADR-0101 for v1 HA)."
