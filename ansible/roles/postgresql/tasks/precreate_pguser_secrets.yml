---
# ADR-0529: pre-create every pguser Secret from Vault BEFORE the
# PostgresCluster exists.
#
# The chart's ExternalSecrets use creationPolicy: Merge, which is what stops
# the PGO/ESO write loop - but Merge does not CREATE a missing Secret. On a
# greenfield cluster (or after `make d1 uninstall postgresql`, which cascades
# the PostgresCluster and garbage-collects all 17 Secrets) PGO would create
# them first with its OWN generated password, ESO would then merge Vault's
# password over the `password` key only, and PGO - seeing a non-empty
# `verifier` - would keep its own forever. The database would authenticate
# with PGO's password while Vault, the Secret and every cross-namespace
# consumer advertised a different one. Silent and permanent.
#
# So this runs first and makes the Secret exist with the Vault credential.
# PGO then finds `password` set and `verifier` empty, derives the SCRAM
# verifier from the Vault password, and "bring your own password" works
# exactly as it did under Orphan.
#
# Strictly create-if-missing: an existing Secret is never touched. Same
# discipline as ansible/tasks/vault_seed_if_missing.yml (ADR-0345) - the
# whole failure mode being avoided is a re-run silently overwriting a
# credential a running consumer has already cached.
- name: "postgresql | find the Vault server pod (pguser bootstrap)"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: zuno-vault
    label_selectors:
      - "app.kubernetes.io/name=vault"
      - "component=server"
  register: _postgresql_pguser_vault_pod

- name: "postgresql | read the Vault root token (pguser bootstrap)"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: zuno-vault
    name: vault-bootstrap-credentials
  register: _postgresql_pguser_vault_creds
  no_log: true

# Vault not up yet means this is a partial install; the ExternalSecrets stay
# unfulfilled and the operator re-runs once Vault is sealed/unsealed. Do not
# fail the whole role for it.
- name: "postgresql | skip the pguser bootstrap when Vault is not reachable"
  ansible.builtin.set_fact:
    _postgresql_pguser_skip: >-
      {{ (_postgresql_pguser_vault_pod.resources | default([]) | length) == 0 or
         (_postgresql_pguser_vault_creds.resources | default([]) | length) == 0 }}

- name: "postgresql | list the pguser Secrets that already exist"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: zuno-data
    label_selectors:
      - "postgres-operator.crunchydata.com/cluster={{ postgresql_cluster_name | default('zuno-postgresql') }}"
  register: _postgresql_pguser_existing
  when: not _postgresql_pguser_skip

- name: "postgresql | list the chart's pguser ExternalSecrets (drift guard input)"
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1beta1
    kind: ExternalSecret
    namespace: zuno-data
    label_selectors:
      - "zuno.io/managed-by=argocd"
  register: _postgresql_pguser_es
  failed_when: false
  when: not _postgresql_pguser_skip

# The label selector above also matches this namespace's non-pguser
# ExternalSecrets (zuno-postgresql-backup-s3, the four rag-service-db-* and
# the three mariadb-* ones), so narrow to the pguser prefix before comparing.
# Without this the drift guard below can never find the two lists equal and
# fires on every single run - a permanent false alarm is worse than no guard,
# because it teaches the operator to skip past the one message that would
# report a genuinely divergent credential.
- name: "postgresql | narrow the ExternalSecret list to actual pguser Secrets"
  ansible.builtin.set_fact:
    _postgresql_pguser_es_owners: >-
      {{ _postgresql_pguser_es.resources | default([])
         | map(attribute='metadata.name')
         | select('match', '^' ~ (postgresql_cluster_name | default('zuno-postgresql')) ~ '-pguser-')
         | map('regex_replace', '^.*-pguser-', '') | sort | list }}
  when: not _postgresql_pguser_skip

# Drift guard. The chart renders one ExternalSecret per entry of this list,
# but they are two separate sources (ArgoCD cannot read Ansible vars), so a
# user added to one and not the other would otherwise surface months later as
# a silently divergent credential. On a greenfield cluster there are no
# ExternalSecrets yet and this simply reports nothing.
- name: "postgresql | warn if the bootstrap list and the chart's pguser ExternalSecrets disagree"
  ansible.builtin.debug:
    msg: >-
      pguser bootstrap list out of sync with the rendered chart. Only in
      defaults/main.yml:
      {{ postgresql_pguser_bootstrap_secrets | map(attribute='owner') | list
         | difference(_postgresql_pguser_es_owners) }}
      -- only as an ExternalSecret:
      {{ _postgresql_pguser_es_owners
         | difference(postgresql_pguser_bootstrap_secrets | map(attribute='owner') | list) }}
      Add the missing entry to ansible/roles/postgresql/defaults/main.yml and
      gitops/charts/postgresql (see ADR-0529).
  when:
    - not _postgresql_pguser_skip
    - (_postgresql_pguser_es_owners | default([]) | length) > 0
    - (postgresql_pguser_bootstrap_secrets | map(attribute='owner') | sort | list)
      != _postgresql_pguser_es_owners

- name: "postgresql | pre-create the missing pguser Secrets from Vault"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/precreate_one_pguser_secret.yml"
  loop: "{{ postgresql_pguser_bootstrap_secrets }}"
  loop_control:
    loop_var: pguser
    label: "{{ pguser.owner }}"
  when:
    - not _postgresql_pguser_skip
    - (postgresql_cluster_name | default('zuno-postgresql')) ~ '-pguser-' ~ pguser.owner
      not in (_postgresql_pguser_existing.resources | default([]) | map(attribute='metadata.name') | list)
