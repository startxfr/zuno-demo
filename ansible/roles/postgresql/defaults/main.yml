---
# The 17 PGO "pguser" roles whose password is pre-seeded from Vault rather
# than generated by PGO ("bring your own password"), and the Vault path each
# one comes from.
#
# This list MUST stay in sync with gitops/charts/postgresql/values.yaml: the
# chart renders one ExternalSecret per entry, and tasks/precreate_pguser_secrets.yml
# pre-creates the same Secrets on a greenfield cluster. They are kept as two
# lists on purpose - the chart runs under ArgoCD with no access to Ansible
# vars, and Ansible must not need to parse the chart's values to bootstrap.
# tasks/precreate_pguser_secrets.yml carries a drift guard that compares this
# list against the pguser ExternalSecrets actually present in zuno-data and
# names the difference, so a forgotten entry surfaces at install time rather
# than as a silently divergent credential months later.
#
# `postgres` (the superuser) is deliberately absent: PGO generates it and no
# ExternalSecret manages it - it is an extra pguser Secret on the cluster.
postgresql_pguser_bootstrap_secrets:
  - {owner: zunoapp, vault_path: postgresql/app}
  - {owner: keycloak, vault_path: keycloak/postgresql-app}
  - {owner: maas, vault_path: maas/postgresql-app}
  - {owner: mlflow, vault_path: mlflow/postgresql-app}
  - {owner: ogxserver, vault_path: ogx/postgresql-app}
  - {owner: aapgateway, vault_path: aap/postgresql-app}
  - {owner: aapcontroller, vault_path: aap-controller/postgresql-app}
  - {owner: aaphub, vault_path: aap-hub/postgresql-app}
  - {owner: aapeda, vault_path: aap-eda/postgresql-app}
  - {owner: metricsservice, vault_path: aap-metrics/postgresql-app}
  - {owner: msawxreadonly, vault_path: aap-metrics/postgresql-awx-readonly}
