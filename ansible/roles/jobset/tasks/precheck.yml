---
# State detection (never fails).
- name: "jobset | check the jobset Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-jobset-d0"

- name: "jobset | save the d0 check result"
  ansible.builtin.set_fact:
    _jobset_d0_installed: "{{ _state_check_result }}"

- name: "jobset | check the jobset Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-jobset-d1"

- name: "jobset | look up the JobSetOperator instance"
  kubernetes.core.k8s_info:
    api_version: operator.openshift.io/v1
    kind: JobSetOperator
    name: cluster
  register: _jobset_jobsetoperator_lookup

- name: "jobset | compute install state"
  ansible.builtin.set_fact:
    _state_is_installed: >-
      {{
        _jobset_d0_installed
        and _state_check_result
        and (_jobset_jobsetoperator_lookup.resources | default([]) | length) > 0
      }}

- name: "jobset | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
