---
# Ordered alongside custom_metrics_autoscaler/connectivity_link/lws and
# ahead of openshift_ai - ADR-0318 installs this operator ahead of any
# actual distributed training run.

# Package name confirmed against a live cluster's redhat-operators catalog
# as "job-set" (ADR-0318 originally guessed "jobset-operator"); still
# discover catalog/channel from the PackageManifest rather than hardcoding
# them, same pattern as ansible/roles/external_secrets/tasks/install.yml.
- name: "jobset | resolve the operator package"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_operator_package.yml"
  vars:
    operator_package_name: "{{ jobset_package_name | default('job-set') }}"
    operator_subscription_namespace: "openshift-jobset-operator"
    operator_package_catalog_hint: "job-set"

- name: "jobset | apply the jobset GitOps Application (d0: operator)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  when: not (operator_package_skip_d0 | bool)
  vars:
    gitops_component_name: "jobset"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-jobset-d0"
    gitops_app_extra_helm_values:
      # project.enabled: true must be repeated here even though application-d0.yaml
      # already sets it - gitops_app_extra_helm_values replaces values wholesale
      # rather than merging (see ansible/roles/kueue/tasks/install.yml for the
      # bug this fixes).
      project:
        enabled: true
      operator:
        enabled: true
        subscription:
          operator:
            channel: "{{ operator_package_channel }}"
            source:
              name: "{{ operator_package_catalog }}"
    gitops_app_wait_retries: 60
    gitops_app_wait_delay: 15

- name: "jobset | apply the jobset GitOps Application (d1: JobSetOperator instance)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "jobset"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-jobset-d1"
    gitops_app_extra_helm_values:
      jobsetOperator:
        enabled: true
    gitops_app_wait_retries: 30
    gitops_app_wait_delay: 15
