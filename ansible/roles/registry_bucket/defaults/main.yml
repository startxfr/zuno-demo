---
# ADR-0612/WP-248 step 3: the S3 bucket that holds the internal Quay's blobs.
# Per-cluster values live in ansible/clusters/<cluster>.yml (ADR-0547).
zuno_quay_s3_bucket: ""            # e.g. zuno-demo333-registry (WP-131 convention)
zuno_quay_s3_region: eu-central-1  # passed explicitly: the AWS profile's declared region is wrong
zuno_quay_s3_iam_user: "{{ zuno_quay_s3_bucket }}"
# AWS profile of the operator; needs s3 bucket and IAM user/policy/key rights.
zuno_registry_aws_profile: default
# Nothing is written to AWS unless this is true (default: print the plan only).
registry_bucket_apply: false
# Where the one-time access key lands (0600, outside the repository). It cannot be read again from AWS.
registry_bucket_key_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/zuno/{{ zuno_quay_s3_bucket }}-key.json"
