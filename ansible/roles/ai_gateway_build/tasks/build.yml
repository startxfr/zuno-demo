---
# Day 1 "ai-gateway" build component (ADR-0056): builds the AI/Inference
# Gateway image. Was not part of the original mcp/rag/agent build trio
# (ADR-0056 explicitly flagged this as a follow-up: "ai-gateway is not
# part of any named Day 1 build component yet"), so its image never
# existed at image-registry.openshift-image-registry.svc:5000/zuno-ai-run/
# ai-gateway (gitops/charts/ai-gateway/values.yaml's image.repository),
# leaving every ai-gateway pod in permanent ImagePullBackOff on a fresh
# cluster - found via live-cluster testing on api.demo222.startx.fr. Same
# shared build mechanism as ansible/roles/{mcp,rag,agent}_build.
- name: "ai_gateway_build | build ai-gateway"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_openshift_build.yml"
  vars:
    build_image_name: ai-gateway
    build_dockerfile_path: Dockerfile
    build_context_dir: components/ai-gateway
