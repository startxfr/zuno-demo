---
# ADR-0611/WP-246: the internal registry holding the admitted OKF release. Plain Helm deployment
# (zot, pinned by digest), all content is -d1. The gateways switch to it with okf.fetch.mirror.prefix.
- name: "okf_mirror | apply the okf-mirror GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "okf-mirror"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-okf-mirror-d1"
    gitops_app_wait_retries: 40
    gitops_app_wait_delay: 10
