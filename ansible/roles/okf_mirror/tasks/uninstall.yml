---
# Reverse of install.yml. The PVC is pruned with the Application: the mirror is refilled by
# `OKF_MIRROR_TO=... make d3 admit agents`, and the gateways fall back to the source registry.
- name: "okf_mirror | delete the okf-mirror GitOps Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-okf-mirror-d1"
