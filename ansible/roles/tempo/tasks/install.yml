---
# Distributed tracing backend for gitops/charts/observability's Collector -
# a demo-scale TempoMonolithic, queried by gitops/charts/kiali's Kiali.
- name: "tempo | apply the tempo GitOps Application (d0: operator)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "tempo"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"
    gitops_app_wait_retries: 30
    gitops_app_wait_delay: 15

- name: "tempo | apply the tempo GitOps Application (d1: TempoMonolithic instance)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "tempo"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"
    gitops_app_wait_retries: 30
    gitops_app_wait_delay: 10

- name: "tempo | wait for the Tempo StatefulSet to be ready"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    namespace: zuno-monitoring
    name: tempo-tempo
  register: _tempo_statefulset
  until: >-
    (_tempo_statefulset.resources | default([]) | length) > 0 and
    (_tempo_statefulset.resources[0].status.readyReplicas | default(0)) > 0
  retries: 30
  delay: 10
