---
# Reverse of install.yml: delete -d1 first (avoids ArgoCD fighting a CR deletion),
# then remove_operator.yml (needs the Subscription) before -d0's own delete.
- name: "tempo | delete the tempo GitOps Application (d1: TempoMonolithic instance)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-tempo-d1"

- name: "tempo | remove the operator (its owned CRDs - cascading the TempoMonolithic instance - then the CSV, then the Subscription)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/remove_operator.yml"
  vars:
    operator_subscription_name: tempo-product
    operator_namespace: openshift-tempo-operator

- name: "tempo | delete the tempo GitOps Application (d0: cascades the remaining OperatorGroup/Namespace)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-tempo-d0"
