---
# Day 1 "mlops" build component: builds the mlops pipeline CLI image via
# native OpenShift BuildConfig/ImageStream in zuno-ai-build - see
# ansible/tasks/apply_openshift_build.yml for the shared mechanism.
- name: "mlops_build | build mlops"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_openshift_build.yml"
  vars:
    build_image_name: mlops
    build_dockerfile_path: components/mlops/Containerfile
    build_context_dir: "."
