---
# Day 1 "mlops" build component: builds the mlops pipeline CLI image via
# native OpenShift BuildConfig/ImageStream in zuno-ai-build - see
# ansible/tasks/apply_openshift_build.yml for the shared mechanism.
- name: "mlops_build | build mlops"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_openshift_build.yml"
  vars:
    build_image_name: mlops
    build_dockerfile_path: components/mlops/Containerfile
    build_context_dir: "."
    # WP-087: the only component here that needs an explicit build-pod
    # sizing - see apply_openshift_build.yml's own comment for why zero is
    # actively harmful rather than merely unset. Sized from the observed
    # failures: the evicted pods reported 4.7GB and 7.6GB of ephemeral use
    # mid-build, against a node threshold of ~16GB. 20Gi requested covers
    # the pip wheel cache, the unpacked CUDA libraries and the committed
    # layers at once, with the limit leaving room for a fatter torch
    # release without needing a second visit.
    # Pinned to the GPU group NOT because the build needs a GPU - it does
    # not - but because those two nodes are the only ones with real disk
    # headroom (155GB and 182GB free against 19-47GB on the other three),
    # and this is the largest image in the repository. A group label rather
    # than a hostname, so it survives a node being replaced. Their
    # nvidia.com/gpu taint is PreferNoSchedule, which deprioritises but
    # never blocks, so no toleration is needed alongside this.
    build_node_selector:
      machine.startx.io/group: gpu
    build_resources:
      requests:
        cpu: "1"
        memory: 2Gi
        ephemeral-storage: 20Gi
      limits:
        cpu: "4"
        memory: 8Gi
        ephemeral-storage: 40Gi
