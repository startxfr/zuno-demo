---
# Re-applies the same namespaces GitOps Application as prepare.yml
# (idempotent Helm/Argo sync) - ArgoCD's own selfHeal: true already keeps
# this continuously reconciled, so this verb exists for an explicit
# on-demand re-sync (e.g. after editing gitops/charts/namespaces/values.yaml
# - quota/NetworkPolicy changes) rather than waiting for the next drift
# detection cycle.
- name: "namespaces | re-apply the namespaces GitOps Application"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "namespaces"
    gitops_app_name: "zuno-{{ gitops_component_name }}"

- name: "namespaces | configure summary"
  ansible.builtin.debug:
    msg: "Namespaces Application re-applied and healthy."
