---
# State detection (never fails). Same Application as install-precheck.yml
# - namespaces re-applies it in configure.yml too (idempotent re-sync).
- name: "namespaces | check the namespaces Application"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-namespaces"

- name: "namespaces | record configure state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_configure_state.yml"
  vars:
    _state_is_configured: "{{ _state_check_result }}"
