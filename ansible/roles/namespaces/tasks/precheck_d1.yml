---
# Day 1 half: state detection for the ResourceQuota/NetworkPolicy overlay
# (never fails). Invoked from day1_check.yml, which special-cases this
# role's tasks_from to "precheck_d1".
- name: "namespaces | check the namespaces Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-namespaces-d1"

- name: "namespaces | record install state (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
  vars:
    _state_is_installed: "{{ _state_check_result }}"
