---
# Creates the platform namespaces, each with a ResourceQuota and a
# default-deny NetworkPolicy baseline.
#
# Namespace objects are cluster-scoped, so all content is -d0; -d1 is a
# no-op applied for the uniform two-call pattern every role follows.
- name: "namespaces | apply the namespaces GitOps Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "namespaces"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

- name: "namespaces | apply the namespaces GitOps Application (d1, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "namespaces"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"

- name: "namespaces | prepare summary"
  ansible.builtin.debug:
    msg: "Namespaces Application applied and healthy."
