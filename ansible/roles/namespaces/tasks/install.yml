---
# Applies the namespaces GitOps Applications (gitops/apps/namespaces ->
# gitops/charts/namespaces): the 5 agent namespaces + zuno-auth/zuno-data/
# zuno-telemetry/zuno-ai-run/zuno-ai-build, each with a ResourceQuota and
# a default-deny NetworkPolicy baseline (ADR-0023/ADR-0052). Moved here
# from ansible/roles/agents/tasks/configure.yml (ADR-0056) so namespace
# creation is its own explicit, checkable Day 0 step instead of only ever
# happening as a side effect of applying the Tekos workloads.
#
# Namespace objects are cluster-scoped, so this component's entire content
# is -d0 (see gitops/apps/README.md's -d0/-d1 convention) - -d1 is a
# no-op, applied anyway for the uniform two-call pattern every role here
# follows.
- name: "namespaces | apply the namespaces GitOps Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "namespaces"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

- name: "namespaces | apply the namespaces GitOps Application (d1, no-op)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "namespaces"
    gitops_app_phase: "d1"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d1"

- name: "namespaces | prepare summary"
  ansible.builtin.debug:
    msg: "Namespaces Application applied and healthy."
