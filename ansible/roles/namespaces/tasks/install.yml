---
# Day 0 half: creates the platform Namespace objects only. The
# ResourceQuota/NetworkPolicy overlay is Day 1 (install_d1.yml, invoked from
# day1_install.yml) - see this role's README for why.
- name: "namespaces | apply the namespaces GitOps Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_gitops_app.yml"
  vars:
    gitops_component_name: "namespaces"
    gitops_app_phase: "d0"
    gitops_app_name: "zuno-{{ gitops_component_name }}-d0"

- name: "namespaces | prepare summary"
  ansible.builtin.debug:
    msg: "Namespace objects applied and healthy."
