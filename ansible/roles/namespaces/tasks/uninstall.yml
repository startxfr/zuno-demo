---
# Day 0 half: deletes the Namespace objects. Callers should run
# `make day1 uninstall namespaces` (uninstall_d1.yml) first so the
# ResourceQuota/NetworkPolicy Application isn't left targeting namespaces
# that no longer exist.
- name: "namespaces | delete the namespaces ArgoCD Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/delete_gitops_app.yml"
  vars:
    gitops_app_name: "zuno-namespaces-d0"
