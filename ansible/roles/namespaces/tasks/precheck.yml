---
# Day 0 half: state detection for the Namespace objects only (never fails).
# The Day 1 ResourceQuota/NetworkPolicy overlay is checked separately by
# precheck_d1.yml, invoked from day1_check.yml.
- name: "namespaces | check the namespaces Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-namespaces-d0"

# ADR-0333 Day 0 topology check (zuno-ai-platform retired by ADR-0548):
# confirm every namespace this ADR's decision algorithm names actually
# exists and is Active - both Zuno-managed (zuno-ai-build/zuno-mlops/
# zuno-ai-run, created by this role's own Application above) and
# product-managed (redhat-ods-*, openshift-ingress*, created by RHOAI/the
# Ingress Operator, not by this role). Existence/Active-phase only, no
# per-component placement/diff checks.
- name: "namespaces | look up required ADR-0333 namespaces"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
  register: _namespace_topology_lookup

- name: "namespaces | compute ADR-0333 namespace topology state"
  ansible.builtin.set_fact:
    _namespace_topology_installed: >-
      {{
        (_namespace_topology_required | difference(
          _namespace_topology_lookup.resources | default([])
          | selectattr('status.phase', 'defined')
          | selectattr('status.phase', 'equalto', 'Active')
          | map(attribute='metadata.name') | list
        ) | length) == 0
      }}
  vars:
    _namespace_topology_required:
      - redhat-ods-operator
      - redhat-ods-applications
      - openshift-ingress-operator
      - openshift-ingress
      - zuno-ai-build
      - zuno-ai-run
      - zuno-mlops

- name: "namespaces | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
  vars:
    _state_is_installed: "{{ _state_check_result and (_namespace_topology_installed | bool) }}"
