---
# State detection (never fails). namespaces applies the zuno-namespaces
# Application in install.yml - Synced+Healthy is a meaningful "installed"
# signal here.
- name: "namespaces | check the namespaces Application"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-namespaces"

- name: "namespaces | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
  vars:
    _state_is_installed: "{{ _state_check_result }}"
