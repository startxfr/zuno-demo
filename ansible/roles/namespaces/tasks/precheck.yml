---
# State detection (never fails).
- name: "namespaces | check the namespaces Application (d0)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-namespaces-d0"

- name: "namespaces | save the d0 check result"
  ansible.builtin.set_fact:
    _namespaces_d0_installed: "{{ _state_check_result }}"

- name: "namespaces | check the namespaces Application (d1)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_gitops_app_state.yml"
  vars:
    gitops_app_name: "zuno-namespaces-d1"

- name: "namespaces | record install state"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_state.yml"
  vars:
    _state_is_installed: "{{ _namespaces_d0_installed and _state_check_result }}"
