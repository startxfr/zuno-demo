apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zuno-ai-run
configMapGenerator:
  # Canonical, shared implementation (ADR-0342/WP-31) - identical every
  # agent iteration. requirements.txt is evaluations/tekos's own (httpx +
  # PyYAML; day2_stresstest.py/day2_bulk.py and the UnifAI transport need
  # nothing beyond that -
  # unlike the ADR-0053 acceptance-gate Job, this one never needs the
  # `kubernetes` client).
  - name: day2-stresstest-scripts
    files:
      - requirements.txt=../../../../../evaluations/tekos/requirements.txt
      - run_scenarios.py=../../../../../evaluations/tekos/run_scenarios.py
      - gate_checks.py=../../../../../evaluations/tekos/gate_checks.py
      - day2_report.py=../../../../../platform/testing/day2_report.py
      - day2_stresstest.py=../../../../../platform/testing/day2_stresstest.py
      - day2_bulk.py=../../../../../platform/testing/day2_bulk.py
      # ADR-0511/WP-54's live request-rate 429 proof, imported by
      # day2_stresstest.py's _quota_results() layer. Shared like the files
      # above rather than per-agent-prefixed: the module gates itself
      # internally (tekos/arkos/comage only, ADR-0555/WP-142 generalized it
      # from Tekos-only) and returns a coverage row for every other agent,
      # so one unprefixed key is correct.
      - quota_429.py=../../../../../platform/testing/quota_429.py
      # ADR-0555/WP-142's live token-BUDGET 429 proof, imported by
      # day2_stresstest.py's _token_quota_results() layer. Same
      # unprefixed/self-gating posture as quota_429.py above.
      - token_quota_429.py=../../../../../platform/testing/token_quota_429.py
      # run_scenarios.py's chat_register_conformance handler (used by
      # Comage's French-register-conformance scenarios) imports this at
      # call time. Previously bundled only for the ADR-0053 acceptance-gate
      # Job (ansible/roles/agents/kustomize/acceptance-gate-scripts) - this
      # ConfigMap never carried it, so every day2-stresstest Comage run hit
      # "No module named 'register_conformance'" instead of actually
      # scoring the reply. Unprefixed like quota_429.py above: the "gate"
      # volume mounts this whole ConfigMap flatly at /gate, matching where
      # run_scenarios.py's own sys.path search (its own directory) expects
      # to find it.
      - register_conformance.py=../../../../../evaluations/register_conformance.py
      # WP-156: the UnifAI transport (run_scenarios.py's `from unifai_target
      # import ...`, day2_bulk.py) and the UnifAI security-check factories
      # every agent's security_checks.py imports (`import unifai_checks`).
      # In the repo they live in evaluations/common/; flat here, next to
      # run_scenarios.py, which is where those imports find them in the
      # Job (day2_stresstest.py puts this directory on sys.path).
      - unifai_target.py=../../../../../evaluations/common/unifai_target.py
      - unifai_checks.py=../../../../../evaluations/common/unifai_checks.py
      # Repo policy/routing files security_checks.py and gate_checks.py
      # each read relative to their own resolved location
      # once mounted (same ConfigMap-symlink-indirection arithmetic
      # ansible/roles/agents/tasks/run_acceptance_gate.yml's own comments
      # already document) - projected into the exact paths
      # stresstest_job.yml's volumeMounts expect.
      - classification.yaml=../../../../../policies/data-classification/classification.yaml
      - tool-policy.yaml=../../../../../policies/tools/tool-policy.yaml
      - provider-routing.yaml=../../../../../platform/ai-gateway/provider-routing.yaml
      - model-routing-policy.yaml=../../../../../policies/model-routing/model-routing-policy.yaml
      # Per-agent content (genuinely per-agent, never shared) - key
      # prefixed by agent name since ConfigMap keys are flat and every
      # agent's file is literally named "scenarios.yaml"/
      # "security_checks.py".
      - tekos-scenarios.yaml=../../../../../evaluations/tekos/scenarios.yaml
      - tekos-security_checks.py=../../../../../evaluations/tekos/security_checks.py
      - arkos-scenarios.yaml=../../../../../evaluations/arkos/scenarios.yaml
      - arkos-security_checks.py=../../../../../evaluations/arkos/security_checks.py
      - comage-scenarios.yaml=../../../../../evaluations/comage/scenarios.yaml
      - comage-security_checks.py=../../../../../evaluations/comage/security_checks.py
      - advantage-scenarios.yaml=../../../../../evaluations/advantage/scenarios.yaml
      - advantage-security_checks.py=../../../../../evaluations/advantage/security_checks.py
      - finage-scenarios.yaml=../../../../../evaluations/finage/scenarios.yaml
      - finage-security_checks.py=../../../../../evaluations/finage/security_checks.py
      - naveo-scenarios.yaml=../../../../../evaluations/naveo/scenarios.yaml
      - naveo-security_checks.py=../../../../../evaluations/naveo/security_checks.py
      # gate_checks.py's own repo_root resolution (parents[2], same
      # arithmetic as its policy-file reads above) puts it at container
      # root - it reads agents/tekos/agent.okf.md and, for every task
      # name that bundle declares, agents/tekos/tasks/<name>.md.
      # gate_checks.py is Tekos-only (day2_stresstest.py only invokes it
      # when AGENT == "tekos"), but these keys are harmless to carry for
      # every agent's Job run. Explicit files, not a glob - kustomize's
      # configMapGenerator needs each one named.
      - tekos-agent.okf.md=../../../../../agents/tekos/agent.okf.md
      - tekos-tasks-answer-technical-question.md=../../../../../agents/tekos/tasks/answer-technical-question.md
      - tekos-tasks-check-my-drive-docs.md=../../../../../agents/tekos/tasks/check-my-drive-docs.md
      - tekos-tasks-find-relevant-docs.md=../../../../../agents/tekos/tasks/find-relevant-docs.md
      - tekos-tasks-write-code.md=../../../../../agents/tekos/tasks/write-code.md
      # gate_checks.py's arkos_declares_no_photorealistic_image_generation_
      # capability check cross-reads Arkos's own bundle the same way -
      # previously absent from this ConfigMap entirely, so that check
      # always errored with FileNotFoundError instead of running. Same
      # four declared tasks as agents/arkos/agent.okf.md's own
      # zuno.tasks list.
      - arkos-agent.okf.md=../../../../../agents/arkos/agent.okf.md
      - arkos-tasks-draft-architecture-testimonial.md=../../../../../agents/arkos/tasks/draft-architecture-testimonial.md
      - arkos-tasks-workshop-presentation.md=../../../../../agents/arkos/tasks/workshop-presentation.md
      - arkos-tasks-structure-demo.md=../../../../../agents/arkos/tasks/structure-demo.md
      - arkos-tasks-write-code.md=../../../../../agents/arkos/tasks/write-code.md
generatorOptions:
  disableNameSuffixHash: true
  labels:
    zuno.io/managed-by: zuno-ansible
