---
# ADR-0058 decisions 1, 2 and 4: for every agent that BOTH is in the
# admitted agents release (platform/okf/stack-config.generated.yaml, WP-156 -
# the agents UnifAI serves come from that release, ADR-0581, not from
# agents/ in this tree) AND has real evaluations/<agent>/ content
# (discovered, never a hand-maintained list - decision 4's binding
# auto-coverage rule), runs platform/testing/day2_stresstest.py (and,
# when bulk_interactions is set, platform/testing/day2_bulk.py) inside a
# generalized per-agent Job - the same ConfigMap-bundling/credential-
# mounting/internal-CA-trust mechanism
# ansible/roles/agents/tasks/run_acceptance_gate.yml already has,
# parameterized by agent name instead of hardcoded "tekos" (decision 2).
# `make day1 check agents`'s own mandatory-gate invocation of that file is
# untouched - this is additive, informational, never wired into it.
#
# WP-156: the Jobs drive the agents on UnifAI (ADR-0561) through the UnifAI
# UI route, signed in as demo personas with the demo-persona password
# (UNIFAI_URL, UNIFAI_TEAM_NAME, DEMO_PERSONA_PASSWORD). A placeholder agent
# (ADR-0007) has no UnifAI workflow by design: it gets no Job, only a
# report row saying so.

- name: "day2-stresstest | resolve the cluster base domain"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_base_domain.yml"

- name: "day2-stresstest | ensure the zuno-ai-run namespace exists"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/agents/kustomize/namespace"

- name: "day2-stresstest | read the admitted agents release"
  ansible.builtin.set_fact:
    _day2_stress_release_agents: >-
      {{ (lookup('ansible.builtin.file', zuno_repo_root + '/platform/okf/stack-config.generated.yaml')
          | from_yaml)['agents'] | default({}, true) }}

- name: "day2-stresstest | discover evaluations/*/run_scenarios.py (agents with real stresstest content)"
  ansible.builtin.find:
    paths: "{{ zuno_repo_root }}/evaluations"
    patterns: "run_scenarios.py"
    recurse: true
    depth: 2
  register: _day2_stress_eval_scripts

- name: "day2-stresstest | resolve the candidate agent list (admitted AND has evaluations content)"
  ansible.builtin.set_fact:
    day2_stresstest_agents: >-
      {{
        (_day2_stress_release_agents.keys() | list)
        | intersect(_day2_stress_eval_scripts.files | map(attribute='path') | map('dirname') | map('basename') | list)
        | sort
      }}

# stresstest_job_create_one.yml/stresstest_job_run_one.yml pass this to
# the Job as ZUNO_AGENT_STATUS.
- name: "day2-stresstest | split the candidates into served and placeholder agents"
  ansible.builtin.set_fact:
    _day2_stress_placeholder_agents: >-
      {{ day2_stresstest_agents
         | select('in', _day2_stress_release_agents | dict2items
                        | selectattr('value.status', 'defined')
                        | selectattr('value.status', 'equalto', 'placeholder')
                        | map(attribute='key') | list)
         | list }}

- name: "day2-stresstest | read the platform's internal root CA from openshift-config"
  kubernetes.core.k8s_info:
    kind: ConfigMap
    namespace: openshift-config
    name: keycloak-serving-ca
  register: _day2_stress_ca_cm

- name: "day2-stresstest | fail if the internal root CA ConfigMap is missing"
  ansible.builtin.fail:
    msg: >-
      openshift-config/keycloak-serving-ca not found - run
      `make d1 install openshift-oauth` first (see
      ansible/roles/agents/tasks/run_acceptance_gate.yml's own identical
      precondition).
  when: (_day2_stress_ca_cm.resources | default([]) | length) == 0

- name: "day2-stresstest | copy the internal root CA into a zuno-ai-run ConfigMap the Job can mount"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: day2-stresstest-ca
        namespace: zuno-ai-run
        labels:
          zuno.io/managed-by: zuno-ansible
      data:
        ca.crt: "{{ _day2_stress_ca_cm.resources[0].data['ca.crt'] }}"

- name: "day2-stresstest | read the demo-persona password from zuno-auth (ADR-0041)"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: zuno-auth
    name: demo-personas-password
  register: _day2_stress_demo_password_secret
  no_log: true

- name: "day2-stresstest | fail if the demo-persona password Secret is missing"
  ansible.builtin.fail:
    msg: >-
      zuno-auth/demo-personas-password not found - run `make d0 install
      keycloak` first.
  when: (_day2_stress_demo_password_secret.resources | default([]) | length) == 0

# WP-156: every served agent is ready - the UnifAI transport needs only the
# demo-persona password, read above. The <agent>-frontend client secrets
# are copied when they still exist, for the layers that still mint a
# persona bearer token with a ROPC grant on that client (run_scenarios.py's
# shared-service scenarios, security_checks.py's direct MCP/ai-gateway
# calls, quota_429.py, token_quota_429.py). They go with agent-frontend:
# once absent those rows fail with the reason, an agent is never skipped
# for it.
- name: "day2-stresstest | resolve the agents to stresstest (served by UnifAI)"
  ansible.builtin.set_fact:
    _day2_stress_ready_agents: "{{ day2_stresstest_agents | difference(_day2_stress_placeholder_agents) | sort }}"

# WP-156: persona tokens come from the dedicated zuno-evaluations client
# (one secret for every agent), which outlives the per-agent <agent>-frontend
# clients retired with agent-frontend.
- name: "day2-stresstest | read the zuno-evaluations client secret from zuno-auth"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: zuno-auth
    name: zuno-evaluations-client-secret
  register: _day2_stress_eval_client_secret
  no_log: true

- name: "day2-stresstest | build the credentials data"
  ansible.builtin.set_fact:
    _day2_stress_secret_data: >-
      {{ {'demo-persona-password': _day2_stress_demo_password_secret.resources[0].data.password}
         | combine({'eval-client-secret': _day2_stress_eval_client_secret.resources[0].data.client_secret}
                   if (_day2_stress_eval_client_secret.resources | default([]) | length) > 0 else {}) }}
  no_log: true

- name: "day2-stresstest | copy the combined credentials into one zuno-ai-run Secret the Job can mount"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: day2-stresstest-credentials
        namespace: zuno-ai-run
        labels:
          zuno.io/managed-by: zuno-ansible
      type: Opaque
      data: "{{ _day2_stress_secret_data | default({}) }}"
  no_log: true
  when: (_day2_stress_ready_agents | default([]) | length) > 0

- name: "day2-stresstest | build the day2-stresstest-scripts ConfigMap"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/apply_kustomize.yml"
  vars:
    kustomize_dir: "{{ zuno_repo_root }}/ansible/roles/day3/kustomize/stresstest-scripts"
  when: (_day2_stress_ready_agents | default([]) | length) > 0

# platform/okf/run_agent_contract_tests.py has no per-agent CLI hook and
# needs no cluster access at all (pure repo-side file/subprocess work) -
# runs once, directly from the control node, not once per agent inside a
# Job (ADR-0058's own Context/decision 1 explains why). Seeds the
# accumulator the per-agent Job loop below appends to.
- name: "day2-stresstest | run the control-node contract-test attribution"
  ansible.builtin.command:
    cmd: "python3 {{ zuno_repo_root }}/platform/testing/day2_contract_attribution.py"
    chdir: "{{ zuno_repo_root }}"
  register: _day2_stress_contract
  changed_when: false
  failed_when: false

- name: "day2-stresstest | seed the accumulator with the contract-test results"
  ansible.builtin.set_fact:
    _day2_stress_results: "{{ (_day2_stress_contract.stdout | from_json) if _day2_stress_contract.stdout else [] }}"

# Same row shape and reason as day2_availability_check.yml's placeholder
# rows: "not served" is a placeholder's expected state, not a failure.
- name: "day2-stresstest | record a skip row for each placeholder agent"
  ansible.builtin.set_fact:
    _day2_stress_results: >-
      {{ _day2_stress_results + [{
           'agent': item, 'layer': 'stresstest', 'id': 'n/a', 'category': 'coverage', 'passed': true,
           'detail': 'skipped - placeholder (ADR-0007): not served by UnifAI by design, no stresstest Job',
           'duration_ms': 0}] }}
  loop: "{{ _day2_stress_placeholder_agents }}"

# ADR-0555/WP-142: parallel by default (day2_stresstest_parallel, set from
# Makefile's SEQUENTIAL=<0|1> via -e day2_stresstest_parallel=...). Sequential
# mode calls the original, combined stresstest_job_run_one.yml unchanged -
# one agent's Job is created, fully waited-on, logged and parsed before the
# next agent's Job is even created, exactly like every run before this ADR.
# Parallel mode splits that same per-agent work into stresstest_job_create_
# one.yml/stresstest_job_wait_one.yml and runs each as its OWN loop over
# every agent: Job creation is near-instant, so by the time the create loop
# finishes, all agents' Jobs are already running concurrently on the
# cluster - the wait loop is still sequential in Ansible's own execution
# order, but each iteration only "catches up" to whichever Job already
# finished while an earlier iteration was waiting, so total wall-clock is
# bounded by the slowest single agent, not the sum of all of them. No
# async/poll or JobSet involved - async cannot wrap a whole include_tasks
# file, and every agent's Job spec was already fully independent (own name,
# env vars, ConfigMap volume items), so nothing about the Jobs themselves
# needed to change, only how this loop sequences create vs wait.
- name: "day2-stresstest | run one Job per ready agent (sequential)"
  when: not (day2_stresstest_parallel | default(true) | bool)
  ansible.builtin.include_tasks: stresstest_job_run_one.yml
  loop: "{{ _day2_stress_ready_agents | default([]) }}"
  loop_control:
    loop_var: day2_stress_agent

- name: "day2-stresstest | create all stresstest Jobs (parallel)"
  when: day2_stresstest_parallel | default(true) | bool
  ansible.builtin.include_tasks: stresstest_job_create_one.yml
  loop: "{{ _day2_stress_ready_agents | default([]) }}"
  loop_control:
    loop_var: day2_stress_agent

- name: "day2-stresstest | wait for all stresstest Jobs (parallel)"
  when: day2_stresstest_parallel | default(true) | bool
  ansible.builtin.include_tasks: stresstest_job_wait_one.yml
  loop: "{{ _day2_stress_ready_agents | default([]) }}"
  loop_control:
    loop_var: day2_stress_agent

# Informational, never mandatory (ADR-0058): this exit code is never read
# by make day1 check agents / the ADR-0053 gate - it's a separate
# playbook nothing else invokes - but `make d2 stresstest` should still
# tell an operator/script whether anything failed, the same way every
# evaluations/*.py script's own main() does. Shared renderer (also used
# by ansible/roles/day3/tasks/test.yml and
# ansible/roles/agents/tasks/check.yml) - report everything first, then
# decide once.
- name: "day2-stresstest | report and decide on the combined stresstest results"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/day2_render_and_fail.yml"
  vars:
    _day2_render_results: "{{ _day2_stress_results | default([]) }}"
    day2_render_component: agents
