---
# One iteration of stresstest_job.yml's per-agent loop
# (loop_var: day2_stress_agent). Delete-then-recreate idempotency, same
# as run_acceptance_gate.yml. Runs day2_stresstest.py, then day2_bulk.py
# in the same container when bulk_interactions > 0 (both need the exact
# same AGENT/credential/mount setup - a second Job would just duplicate
# it for no benefit).

# The canonical evaluations/tekos/run_scenarios.py's TASK_NAME defaults to
# "answer-technical-question" (Tekos's own task) - each agent's own
# evaluations/<agent>/run_scenarios.py wrapper sets the real default via
# os.environ.setdefault() before delegating, but day2_stresstest.py
# imports run_scenarios.py and security_checks.py directly via
# importlib (platform/testing/day2_stresstest.py), bypassing that
# wrapper - same reason AGENT is set explicitly below. Without this,
# every _invoke_tool call in a non-Tekos agent's security_checks.py
# targets the wrong OKF task and gets a 403 "has no task" response
# instead of the policy-layer denial the check actually means to test -
# live-cluster-confirmed 2026-09-02 via arkos's
# git_forge_never_grants_private_github_access check (the one check
# that expects a non-403 status, so it's the only one where the wrong
# task's 403 doesn't coincidentally look like a pass). Same dict as
# ansible/roles/agents/tasks/run_acceptance_gate.yml's
# _gate_task_name, plus naveo (day2-stresstest covers every discovered
# agent, not just the acceptance-gate's current rollout list).
- name: "day2-stresstest | resolve {{ day2_stress_agent }}'s OKF task name"
  ansible.builtin.set_fact:
    _day2_stress_task_name: >-
      {{
        {
          "tekos": "answer-technical-question",
          "arkos": "draft-architecture-testimonial",
          "comage": "check-deal-status",
          "advantage": "answer-project-question",
          "finage": "answer-finance-question",
          "naveo": "answer-onboarding-question",
        }[day2_stress_agent]
      }}

- name: "day2-stresstest | delete any previous stresstest Job for {{ day2_stress_agent }} (Jobs are immutable, this task is idempotent-by-recreation)"
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: "zuno-day2-stresstest-{{ day2_stress_agent }}"
    namespace: zuno-ai-run
    wait: true

# A ConfigMap volume's `items:` entries have no per-key "optional" field in
# the Kubernetes API (KeyToPath only has key/path/mode) - only the whole
# ConfigMap can be marked optional. A previous version of this task listed
# "{{ day2_stress_agent }}-stress_test.py" unconditionally with a bogus
# per-item `optional: true` that the API server silently drops; kubelet
# then hard-fails MountVolume.SetUp for any agent lacking that key (only
# Arkos/Comage/Tekos have a real evaluations/<agent>/stress_test.py) -
# live-cluster-confirmed 2026-08-23 via
# zuno-day2-stresstest-advantage-*'s "configmap references non-existent
# config key: advantage-stress_test.py". Fixed by deciding, from the same
# local checkout stresstest_job.yml's own find-based discovery already
# reads from, whether to include the item at all - same
# discovered-never-hardcoded posture as that file's own header comment.
- name: "day2-stresstest | check whether {{ day2_stress_agent }} has its own stress_test.py"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/evaluations/{{ day2_stress_agent }}/stress_test.py"
  register: _day2_stress_agent_stress_test_file

- name: "day2-stresstest | run the stresstest Job for {{ day2_stress_agent }}"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: "zuno-day2-stresstest-{{ day2_stress_agent }}"
        namespace: zuno-ai-run
        labels:
          zuno.io/managed-by: zuno-ansible
      spec:
        backoffLimit: 0
        template:
          metadata:
            labels:
              app.kubernetes.io/name: acceptance-gate
          spec:
            restartPolicy: Never
            priorityClassName: zuno-platform-weak
            serviceAccountName: acceptance-gate
            containers:
              - name: day2-stresstest
                image: "docker.io/library/python:3.12-slim"
                command:
                  - sh
                  - -c
                  # Same certifi-append trick as run_acceptance_gate.yml's
                  # Job (every Route this dials chains to Vault's internal
                  # root). day2_bulk.py only runs when BULK_INTERACTIONS
                  # is set and > 0; either way the container's own exit
                  # code reflects whichever step actually failed.
                  - >-
                    pip install --quiet --no-cache-dir -r /gate/requirements.txt &&
                    CERTIFI=$(python3 -c 'import certifi; print(certifi.where())') &&
                    cat /gate-ca/ca.crt >> "$CERTIFI" &&
                    export SSL_CERT_FILE="$CERTIFI" &&
                    python3 /gate/day2_stresstest.py; stresstest_rc=$?;
                    if [ "${BULK_INTERACTIONS:-0}" -gt 0 ]; then
                      python3 /gate/day2_bulk.py; bulk_rc=$?;
                    else
                      bulk_rc=0;
                    fi;
                    if [ "$stresstest_rc" -ne 0 ]; then exit "$stresstest_rc"; else exit "$bulk_rc"; fi
                workingDir: /gate
                resources:
                  requests:
                    cpu: 200m
                    memory: 256Mi
                  limits:
                    cpu: "1"
                    memory: 512Mi
                env:
                  - name: PYTHONUNBUFFERED
                    value: "1"
                  # Restricted SCC -> random UID, no HOME - same fix as
                  # run_acceptance_gate.yml's Job.
                  - name: HOME
                    value: /tmp
                  - name: PYTHONUSERBASE
                    value: /tmp/.pyuser
                  - name: AGENT
                    value: "{{ day2_stress_agent }}"
                  - name: TASK_NAME
                    value: "{{ _day2_stress_task_name }}"
                  # Live-cluster-confirmed 2026-08-21: without this,
                  # get_token()/auth_headers() in run_scenarios.py fall
                  # back to that module's placeholder default
                  # (https://keycloak.apps.mycluster.example.com), which
                  # doesn't resolve - "No address associated with
                  # hostname" for every scenario/check needing a token.
                  # run_acceptance_gate.yml's own Job already sets this;
                  # this generalization had dropped it.
                  - name: KEYCLOAK_URL
                    value: "https://keycloak.{{ cluster_base_domain }}"
                  - name: FRONTEND_URL
                    value: "https://{{ day2_stress_agent }}.{{ cluster_base_domain }}"
                  # ADR-0511/WP-54's quota layer builds the quota-demo
                  # Route's hostname from this. quota_429.py can also
                  # recover it by stripping the agent label off
                  # FRONTEND_URL, but passing it outright keeps that
                  # fallback for standalone dev runs rather than making
                  # the Job depend on string surgery.
                  - name: CLUSTER_BASE_DOMAIN
                    value: "{{ cluster_base_domain }}"
                  - name: BULK_INTERACTIONS
                    value: "{{ bulk_interactions | default(0) }}"
                  # Makefile's CLEANUP=<0|1> (default 1) - read by
                  # run_scenarios.py/stress_test.py/day2_bulk.py's own
                  # main()/cleanup_created_runs() call, not branched on
                  # here - unlike BULK_INTERACTIONS, cleanup always runs
                  # as part of the same script, the env var just decides
                  # whether it actually deletes anything.
                  - name: CLEANUP_TEST_DATA
                    value: "{{ cleanup_test_data | default(1) }}"
                  - name: DEMO_PERSONA_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: day2-stresstest-credentials
                        key: demo-persona-password
                  - name: "{{ (day2_stress_agent | upper | replace('-', '_')) }}_FRONTEND_CLIENT_SECRET"
                    valueFrom:
                      secretKeyRef:
                        name: day2-stresstest-credentials
                        key: "{{ day2_stress_agent }}-client-secret"
                  # WP-25/ADR-0110's rag_ingestion layer (day2_stresstest.py):
                  # a fast, bounded, read-only live Confluence connectivity
                  # check, Tekos-only. Same secret the real rag-ingestion
                  # Confluence MCP server already reads, already in this
                  # Job's own namespace (zuno-ai-run) - no cross-namespace
                  # secret copy needed.
                  - name: CONFLUENCE_URL
                    valueFrom:
                      secretKeyRef:
                        name: confluence-technical-credentials
                        key: url
                  - name: CONFLUENCE_USERNAME
                    valueFrom:
                      secretKeyRef:
                        name: confluence-technical-credentials
                        key: email
                  - name: CONFLUENCE_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: confluence-technical-credentials
                        key: token
                volumeMounts:
                  - name: gate
                    mountPath: /gate
                  # WP-31's ConfigMap-key-can't-contain-'/' constraint,
                  # generalized by agent: projects THIS agent's own
                  # scenarios.yaml/security_checks.py into the
                  # per-agent subdirectory run_scenarios.py/
                  # security_checks.py each resolve relative to their own
                  # mounted location (see
                  # ansible/roles/day3/kustomize/stresstest-scripts's own
                  # header comment).
                  - name: gate-agent
                    mountPath: "/gate/{{ day2_stress_agent }}"
                  - name: gate-policies
                    mountPath: /gate/policies
                  - name: gate-platform
                    mountPath: /platform/ai-gateway
                  - name: gate-model-routing-policy
                    mountPath: /policies/model-routing
                  # gate_checks.py's own repo_root resolution puts it at
                  # container root too - see this Job's ConfigMap
                  # (ansible/roles/day3/kustomize/stresstest-scripts)
                  # header comment. Mounted for every agent (harmless;
                  # gate_checks.py only ever runs for AGENT == "tekos").
                  - name: gate-tekos-agent
                    mountPath: /agents/tekos
                  # gate_checks.py's arkos_declares_no_photorealistic_image_
                  # generation_capability check cross-reads Arkos's own
                  # bundle at /agents/arkos - same "mounted for every agent,
                  # harmless" posture as gate-tekos-agent above.
                  - name: gate-arkos-agent
                    mountPath: /agents/arkos
                  - name: gate-ca
                    mountPath: /gate-ca
            volumes:
              - name: gate
                configMap:
                  name: day2-stresstest-scripts
              - name: gate-agent
                configMap:
                  name: day2-stresstest-scripts
                  # stress_test.py's item is only included when this
                  # agent actually has one (see the stat task above) -
                  # ConfigMap volume items have no per-key optional flag,
                  # so an always-listed key that's sometimes absent from
                  # the ConfigMap hard-fails the mount instead of being
                  # skipped.
                  items: >-
                    {{
                      [
                        {'key': day2_stress_agent ~ '-scenarios.yaml', 'path': 'scenarios.yaml'},
                        {'key': day2_stress_agent ~ '-security_checks.py', 'path': 'security_checks.py'},
                      ]
                      + (
                          [{'key': day2_stress_agent ~ '-stress_test.py', 'path': 'stress_test.py'}]
                          if _day2_stress_agent_stress_test_file.stat.exists
                          else []
                        )
                    }}
              - name: gate-policies
                configMap:
                  name: day2-stresstest-scripts
                  items:
                    - key: classification.yaml
                      path: data-classification/classification.yaml
                    - key: tool-policy.yaml
                      path: tools/tool-policy.yaml
              - name: gate-platform
                configMap:
                  name: day2-stresstest-scripts
                  items:
                    - key: provider-routing.yaml
                      path: provider-routing.yaml
              - name: gate-model-routing-policy
                configMap:
                  name: day2-stresstest-scripts
                  items:
                    - key: model-routing-policy.yaml
                      path: model-routing-policy.yaml
              - name: gate-tekos-agent
                configMap:
                  name: day2-stresstest-scripts
                  items:
                    - key: tekos-agent.okf.md
                      path: agent.okf.md
                    - key: tekos-tasks-answer-technical-question.md
                      path: tasks/answer-technical-question.md
                    - key: tekos-tasks-check-my-drive-docs.md
                      path: tasks/check-my-drive-docs.md
                    - key: tekos-tasks-find-relevant-docs.md
                      path: tasks/find-relevant-docs.md
                    - key: tekos-tasks-write-code.md
                      path: tasks/write-code.md
              - name: gate-arkos-agent
                configMap:
                  name: day2-stresstest-scripts
                  items:
                    - key: arkos-agent.okf.md
                      path: agent.okf.md
                    - key: arkos-tasks-draft-architecture-testimonial.md
                      path: tasks/draft-architecture-testimonial.md
                    - key: arkos-tasks-workshop-presentation.md
                      path: tasks/workshop-presentation.md
                    - key: arkos-tasks-structure-demo.md
                      path: tasks/structure-demo.md
                    - key: arkos-tasks-write-code.md
                      path: tasks/write-code.md
              - name: gate-ca
                configMap:
                  name: day2-stresstest-ca

# retries/delay give a 2400s/40min budget, not 900s/15min like
# run_acceptance_gate.yml's identical-looking wait - that Job never runs
# day2_bulk.py, this one does when BULK_INTERACTIONS>0. Arkos's own
# DAT-drafting bulk_load calls legitimately take ~21-22 minutes end to end
# (live-confirmed 2026-09-02, twice: `make d3 stresstest agents` died here
# both times, exit code 2, while the Job itself kept running and completed
# normally minutes later - recovered manually via oc logs/oc apply both
# times since this task gave up too early, not because anything was
# actually stuck).
- name: "day2-stresstest | wait for the {{ day2_stress_agent }} Job to reach a terminal state"
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    namespace: zuno-ai-run
    name: "zuno-day2-stresstest-{{ day2_stress_agent }}"
  register: _day2_stress_job
  until: >-
    (_day2_stress_job.resources[0].status.succeeded | default(0)) > 0 or
    (_day2_stress_job.resources[0].status.failed | default(0)) > 0
  retries: 160
  delay: 15

# Selects on controller-uid (unique per Job instance), not job-name
# (stable across delete-then-recreate) - live-cluster-confirmed
# 2026-08-21: Job deletion does not reliably garbage-collect its pods
# within this task's own runtime, so a previous run's pod can still carry
# the same job-name label when the next run's "find the Job's pod" task
# runs, and label_selectors + resources[0] has no guarantee of picking
# the newest one. controller-uid is set by the Job controller itself and
# is different for every Job object, even ones sharing a name across
# recreations, so this can never match a stale pod.
- name: "day2-stresstest | find the {{ day2_stress_agent }} Job's pod"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: zuno-ai-run
    label_selectors:
      - "controller-uid={{ _day2_stress_job.resources[0].metadata.uid }}"
  register: _day2_stress_pod

- name: "day2-stresstest | fetch the {{ day2_stress_agent }} Job's output"
  kubernetes.core.k8s_log:
    namespace: zuno-ai-run
    name: "{{ _day2_stress_pod.resources[0].metadata.name }}"
  register: _day2_stress_log
  when: (_day2_stress_pod.resources | default([]) | length) > 0

# day2_stresstest.py prints one JSON-array line; day2_bulk.py prints a
# second one when it ran - both matched and flattened into one result
# list, accumulated across every agent in the outer loop.
- name: "day2-stresstest | parse and accumulate {{ day2_stress_agent }}'s results"
  ansible.builtin.set_fact:
    _day2_stress_results: >-
      {{
        (_day2_stress_results | default([])) +
        (
          (_day2_stress_log.log_lines | default([]))
          | select('match', '^\[.*\]$')
          | map('from_json')
          | list
          | flatten
        )
      }}
