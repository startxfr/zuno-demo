---
# This inventory's cluster (per-cluster inventories: one ansible/inventories/<cluster>/ per demo cluster). It must
# equal the directory name (platform/gitops/tests/test_cluster_inventories.py) and the name the live apps domain gives:
# ansible/tasks/resolve_cluster_name.yml refuses to run this inventory against another cluster. It also selects
# ansible/inventories/demo333/cluster.yml and confidential.yml. AAP never reads this file: there the name comes from
# the apps domain.
zuno_cluster_name: demo333

zuno_org: zuno
zuno_orgId: zn

zuno_env: demo
zuno_envId: demo

# zuno_admin_password and every per-component password: passwords.yml (ADR-0595).
#
# ADR-0602 clause 3 / WP-223 (finding C5): which credential scheme this cluster
# runs. One of:
#   demo     - ADR-0595 unchanged: every admin, service and database password
#              inherits the shared zuno_admin_mainpwd (md5 of the seed when it
#              is unset). Convenient for a presenter, and a single leak yields
#              every infra credential at once.
#   hardened - infra credentials (Keycloak master accounts, AAP, every Postgres
#              role, MariaDB, Redis, Dify admin, OpenClaw UI...) are left
#              undefined, so each consumer's own random default applies and
#              the value lives only in Vault; no md5 fallback is ever computed;
#              Keycloak gets a password policy, a shorter idle session and TOTP
#              for the console administrator. Personas keep one shared value.
# Override per cluster in ansible/inventories/<cluster>/cluster.yml or in
# ansible/inventories/<cluster>/confidential.yml. ansible/tasks/assert_security_profile.yml rejects
# any other value. Switching an already-seeded cluster changes no Vault path
# (seed-only-if-missing, ADR-0345): hardened is meant for fresh installs.
zuno_security_profile: demo

# WP-250: the MCP Gateway workload token (Vault mcp/gateway-workload-token) is retired: the gateway's Vault-Transit-signed call
# assertion is the only credential the MCP servers accept. The Vault value is no longer seeded or readable by any namespace store.

# ADR-0057: default report format for `make day2|d2 test|stresstest` -
# text (raw table, always printed regardless) | json | csv. Override
# per-run with EXTRA_VARS="-e report_format=<fmt>" or REPORT_FORMAT=<fmt>.
day2_report_format: text

# ADR-0603 M3 (WP-226): certificate verification of the calls Ansible makes to
# the cluster's own Routes (*.apps.<domain>: Keycloak admin and password
# grants, the AAP gateway, the component prechecks). Every such `uri` task
# reads `validate_certs: "{{ zuno_validate_route_certs | default(false) | bool }}"`.
# Off by default for one lab-only reason: until ADR-0211's ACME wildcard is
# issued (zuno_certmanager_acme_enabled, a per-cluster choice), the Routes
# serve the router's self-signed default certificate, which no control host
# trusts. demo333's Routes do carry the Let's Encrypt wildcard (checked
# 2026-11-07: keycloak, aap, rh-ai, grafana verify with the system trust
# store). Switched on 2026-11-11 (user's go): `make d0 check keycloak`, `make d0 check aap` and
# `make d0 install aap-config` passed with it on, and every Route these tasks call (keycloak, aap, rh-ai,
# ai-gateway, the mlops DSPA, the Tempo gateway, data-science-gateway, maas) verifies with the system trust store.
# A cluster without the ACME wildcard sets it back to false in its own inventory.
# It lives here, not in ansible/inventories/<cluster>/cluster.yml, because most of the
# roles concerned (aap, aap_config, kagent, dify, openclaw) do not load the
# cluster file. Calls to in-cluster Services signed by the service CA keep
# their own reason in place. AAP jobs never read this inventory, so they keep
# the tasks' `default(false)`: certificate verification is a workstation-only
# setting today (moving it to cluster.yml would need every role above to load
# that file first).
zuno_validate_route_certs: true

# Global OLM approval switch (post-demo 2026-11-09, ADR-0607 clause 2 can make Manual the rule): the approval mode of
# every operator Subscription rendered by a gitops chart. `Automatic` lets OLM install new operator versions on its own;
# `Manual` leaves each new InstallPlan waiting for an approval (freeze, pinning). Applied by ansible/tasks/
# install_plan_approval.yml at every Application apply, and mirrored by the chart defaults (Automatic).
zuno_operator_install_plan_approval: Automatic
# Components that ignore the switch: pre-GA operators that stay Manual (rhods 3.6 EA, claw-operator staging,
# nfs-provisioner pre-GA) and unifai-operator, which is pinned by its catalog image (its chart sets the mode itself).
zuno_operator_install_plan_approval_exempt: [openshift-ai, openclaw, nfs-provisioner, unifai]
