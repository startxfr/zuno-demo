---
# Non-secret demo defaults belong here. Secrets must be obtained from Vault or
# injected through an approved runtime mechanism.
zuno_environment: demo

# Repo root, resolved relative to a playbook running from ansible/playbooks/.
# Used by ansible/tasks/apply_gitops_app.yml and the vault role to locate
# gitops/ manifests without hardcoding an absolute path.
zuno_repo_root: "{{ playbook_dir }}/../.."

# cluster_base_domain is intentionally NOT set here: it's auto-discovered
# from Ingress.config.openshift.io/cluster and persisted to Vault (see
# ansible/tasks/resolve_cluster_base_domain.yml). Setting a static value in
# this file would short-circuit that discovery (Ansible facts already
# "defined" from group_vars skip the live lookup) — only set it here if you
# deliberately want to pin/override the discovered value.
