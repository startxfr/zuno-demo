---
# One demo password, one variable per component (ADR-0595).
#
# The shared value is set ONCE in ansible/confidential.yml (never in git: the
# repository is public, ADR-0025/ADR-0041):
#
#   zuno_admin_mainpwd:    the default for every admin, service and database
#   zuno_personas_mainpwd: the default for every demo persona family
#
# Every component then has its OWN variable below that inherits from the shared
# one. To give one component another password, set that variable in
# ansible/confidential.yml (extra variables win over group_vars) - nothing else
# changes. When the shared variable is missing or empty, each variable falls
# back to a value that is generated, not a literal: the first 22 hex characters
# of md5("<seed>:<component>"). It is the same on every run (so a play never
# disagrees with the Vault value it seeded), different per component, and
# guessable by someone who knows the seed - acceptable for a demo, stated in
# ADR-0595. Set zuno_password_seed_extra in confidential.yml to move a cluster
# onto its own series.
#
# Seeding stays seed-only-missing (ADR-0345): changing a value here changes
# nothing on a Vault path that already exists. Delete the path, re-run the
# seed, then follow the component's own rotation runbook (databases: ADR-0529).
#
# Machine secrets (OIDC client secrets, cookie keys) are NOT in this file: they
# stay random on purpose, nobody types them.

zuno_password_seed: "{{ zuno_org }}:{{ zuno_env }}:{{ zuno_password_seed_extra | default('') }}"

# The shared defaults.
zuno_admin_password: "{{ zuno_admin_mainpwd | default(((zuno_password_seed ~ ':admin') | hash('md5'))[:22], true) }}"
zuno_personas_password: "{{ zuno_personas_mainpwd | default(((zuno_password_seed ~ ':personas') | hash('md5'))[:22], true) }}"

# --- Keycloak (master realm) -------------------------------------------------
# bootstrap: the account the Keycloak CR creates once (flagged temporary by
# Keycloak). console: the named administrator humans sign in with.
# automation: the account every Job and role uses (kcadm).
zuno_admin_keycloak_root_password: "{{ zuno_admin_password | default(((zuno_password_seed ~ ':keycloak-bootstrap') | hash('md5'))[:22], true) }}"
zuno_admin_keycloak_console_password: "{{ zuno_admin_password | default(((zuno_password_seed ~ ':keycloak-console') | hash('md5'))[:22], true) }}"
zuno_admin_keycloak_automation_password: "{{ zuno_admin_password | default(((zuno_password_seed ~ ':keycloak-automation') | hash('md5'))[:22], true) }}"

# --- Other admin consoles -----------------------------------------------------
zuno_admin_aap_root_password: "{{ zuno_admin_password | default(((zuno_password_seed ~ ':aap') | hash('md5'))[:22], true) }}"

# --- Databases and caches (fresh installs; live rotation is ADR-0529) --------
zuno_admin_postgresql_root_password: "{{ zuno_admin_password | default(((zuno_password_seed ~ ':postgresql') | hash('md5'))[:22], true) }}"
zuno_admin_keycloak_postgresql_root_password: "{{ zuno_admin_password | default(((zuno_password_seed ~ ':keycloak-postgresql') | hash('md5'))[:22], true) }}"
zuno_admin_maas_postgresql_root_password: "{{ zuno_admin_password | default(((zuno_password_seed ~ ':maas-postgresql') | hash('md5'))[:22], true) }}"
zuno_admin_mlflow_postgresql_root_password: "{{ zuno_admin_password | default(((zuno_password_seed ~ ':mlflow-postgresql') | hash('md5'))[:22], true) }}"
zuno_admin_ogx_postgresql_root_password: "{{ zuno_admin_password | default(((zuno_password_seed ~ ':ogx-postgresql') | hash('md5'))[:22], true) }}"
zuno_admin_aap_postgresql_root_password: "{{ zuno_admin_password | default(((zuno_password_seed ~ ':aap-postgresql') | hash('md5'))[:22], true) }}"
zuno_admin_aap_controller_postgresql_root_password: "{{ zuno_admin_password | default(((zuno_password_seed ~ ':aap-controller-postgresql') | hash('md5'))[:22], true) }}"
zuno_admin_aap_hub_postgresql_root_password: "{{ zuno_admin_password | default(((zuno_password_seed ~ ':aap-hub-postgresql') | hash('md5'))[:22], true) }}"
zuno_admin_aap_eda_postgresql_root_password: "{{ zuno_admin_password | default(((zuno_password_seed ~ ':aap-eda-postgresql') | hash('md5'))[:22], true) }}"
zuno_admin_aap_metrics_postgresql_root_password: "{{ zuno_admin_password | default(((zuno_password_seed ~ ':aap-metrics-postgresql') | hash('md5'))[:22], true) }}"
zuno_admin_aap_metrics_readonly_postgresql_password: "{{ zuno_admin_password | default(((zuno_password_seed ~ ':aap-metrics-readonly-postgresql') | hash('md5'))[:22], true) }}"
zuno_admin_mariadb_root_password: "{{ zuno_admin_password | default(((zuno_password_seed ~ ':mariadb') | hash('md5'))[:22], true) }}"
zuno_admin_mlops_pipeline_db_password: "{{ zuno_admin_password | default(((zuno_password_seed ~ ':mlops-pipeline-db') | hash('md5'))[:22], true) }}"
