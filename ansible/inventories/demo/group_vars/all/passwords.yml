---
# One demo password, one variable per component (ADR-0595).
#
# The shared value is set ONCE in ansible/confidential.yml (never in git: the
# repository is public, ADR-0025/ADR-0041):
#
#   zuno_admin_mainpwd:    the default for every admin, service and database
#   zuno_personas_mainpwd: the default for every demo persona family
#
# Every component then has its OWN variable below that inherits from the shared
# one. To give one component another password, set that variable in
# ansible/confidential.yml (extra variables win over group_vars) - nothing else
# changes. When the shared variable is missing or empty, each variable falls
# back to a value that is generated, not a literal: the first 22 hex characters
# of md5("<seed>:<component>"). It is the same on every run (so a play never
# disagrees with the Vault value it seeded), different per component, and
# guessable by someone who knows the seed - acceptable for a demo, stated in
# ADR-0595. Set zuno_password_seed_extra in confidential.yml to move a cluster
# onto its own series.
#
# Seeding stays seed-only-missing (ADR-0345): changing a value here changes
# nothing on a Vault path that already exists. Delete the path, re-run the
# seed, then follow the component's own rotation runbook (databases: ADR-0529).
#
# Machine secrets (OIDC client secrets, cookie keys) are NOT in this file: they
# stay random on purpose, nobody types them.
#
# ADR-0602 clause 3 / WP-223: two profiles, chosen by zuno_security_profile
# (main.yml, overridable per cluster).
#
#   demo     - everything above, unchanged.
#   hardened - every INFRA variable below (Keycloak master accounts, AAP, every
#              Postgres role, MariaDB, mlops DB, RHTAS Trillian, Redis, Dify
#              admin, OpenClaw UI) evaluates to an Ansible Undefined (undef()).
#              Not an empty string: `x | default(random)` in the consumer then
#              takes its random branch, `x is defined` is false, and a consumer
#              WITHOUT a default fails loudly with the hint below instead of
#              seeding a guessable value. The shared zuno_admin_mainpwd is never
#              read for them and no md5 is computed. A per-component value set
#              explicitly in confidential.yml (include_vars beats group_vars)
#              still wins - a deliberate operator choice, never a derivation.
#              Personas keep ONE shared value (people type it); it must come
#              from zuno_personas_mainpwd, and its md5 fallback fails instead.
#              Read the generated admin passwords from Vault (zuno/keycloak/
#              console, zuno/aap/admin, ...), see docs/platform/operations.md.
#
# Why undef() and not a second, conditionally included file: group_vars are
# templated lazily, so one expression per variable keeps the single list of
# components in one place, works for a profile set later by
# ansible/clusters/<cluster>.yml (loaded with include_vars), and needs no
# change in the dozen consumer roles.

zuno_password_seed: "{{ zuno_org }}:{{ zuno_env }}:{{ zuno_password_seed_extra | default('') }}"

# WP-223: every infra variable below tests zuno_security_profile == 'demo'
# inline (not through a helper variable): a helper rendered by an older
# ansible-core can come back as the STRING "False", which is truthy.
#
# The message a consumer WITHOUT a random default fails with in hardened.
_zuno_passwords_hardened_hint: >-
  ADR-0602 hardened profile: this infra password is deliberately undefined so
  its consumer generates a random value (stored only in Vault). Give the
  consumer a default(lookup('ansible.builtin.password', ...)), or set this
  variable explicitly in ansible/confidential.yml.

# The shared defaults. In hardened the md5 fallback FAILS (undef with a hint)
# instead of computing a value anyone who knows the seed can recompute.
zuno_admin_password: "{{ zuno_admin_mainpwd | default(((zuno_password_seed ~ ':admin') | hash('md5'))[:22] if zuno_security_profile == 'demo' else undef('ADR-0602 hardened profile: zuno_admin_password has no md5 fallback and no infra consumer; read admin passwords from Vault'), true) }}"
zuno_personas_password: "{{ zuno_personas_mainpwd | default(((zuno_password_seed ~ ':personas') | hash('md5'))[:22] if zuno_security_profile == 'demo' else undef('ADR-0602 hardened profile: set zuno_personas_mainpwd in ansible/confidential.yml (at least 12 characters with a digit); the md5 fallback is disabled'), true) }}"

# --- Keycloak (master realm) -------------------------------------------------
# bootstrap: the account the Keycloak CR creates once (flagged temporary by
# Keycloak). console: the named administrator humans sign in with.
# automation: the account every Job and role uses (kcadm).
zuno_admin_keycloak_root_password: "{{ (zuno_admin_password | default(((zuno_password_seed ~ ':keycloak-bootstrap') | hash('md5'))[:22], true)) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"
zuno_admin_keycloak_console_password: "{{ (zuno_admin_password | default(((zuno_password_seed ~ ':keycloak-console') | hash('md5'))[:22], true)) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"
zuno_admin_keycloak_automation_password: "{{ (zuno_admin_password | default(((zuno_password_seed ~ ':keycloak-automation') | hash('md5'))[:22], true)) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"

# --- Other admin consoles -----------------------------------------------------
zuno_admin_aap_root_password: "{{ (zuno_admin_password | default(((zuno_password_seed ~ ':aap') | hash('md5'))[:22], true)) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"

# --- Databases and caches (fresh installs; live rotation is ADR-0529) --------
zuno_admin_postgresql_root_password: "{{ (zuno_admin_password | default(((zuno_password_seed ~ ':postgresql') | hash('md5'))[:22], true)) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"
zuno_admin_keycloak_postgresql_root_password: "{{ (zuno_admin_password | default(((zuno_password_seed ~ ':keycloak-postgresql') | hash('md5'))[:22], true)) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"
zuno_admin_maas_postgresql_root_password: "{{ (zuno_admin_password | default(((zuno_password_seed ~ ':maas-postgresql') | hash('md5'))[:22], true)) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"
zuno_admin_mlflow_postgresql_root_password: "{{ (zuno_admin_password | default(((zuno_password_seed ~ ':mlflow-postgresql') | hash('md5'))[:22], true)) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"
zuno_admin_dify_postgresql_root_password: "{{ (zuno_admin_password | default(((zuno_password_seed ~ ':dify-postgresql') | hash('md5'))[:22], true)) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"
# Dify's single local administrator account (ADR-0599, decision 2026-11-05: no per-person accounts).
# Dify refuses a password without a digit: the shared value gets a trailing 1 (user decision 2026-11-05).
zuno_admin_kagent_postgresql_root_password: "{{ (zuno_admin_password | default(((zuno_password_seed ~ ':kagent-postgresql') | hash('md5'))[:22], true)) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"
zuno_admin_dify_admin_password: "{{ (((zuno_admin_password ~ '1') if zuno_admin_password else ((zuno_password_seed ~ ':dify-admin') | hash('md5'))[:22])) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"
zuno_admin_ogx_postgresql_root_password: "{{ (zuno_admin_password | default(((zuno_password_seed ~ ':ogx-postgresql') | hash('md5'))[:22], true)) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"
zuno_admin_aap_postgresql_root_password: "{{ (zuno_admin_password | default(((zuno_password_seed ~ ':aap-postgresql') | hash('md5'))[:22], true)) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"
zuno_admin_aap_controller_postgresql_root_password: "{{ (zuno_admin_password | default(((zuno_password_seed ~ ':aap-controller-postgresql') | hash('md5'))[:22], true)) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"
zuno_admin_aap_hub_postgresql_root_password: "{{ (zuno_admin_password | default(((zuno_password_seed ~ ':aap-hub-postgresql') | hash('md5'))[:22], true)) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"
zuno_admin_aap_eda_postgresql_root_password: "{{ (zuno_admin_password | default(((zuno_password_seed ~ ':aap-eda-postgresql') | hash('md5'))[:22], true)) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"
zuno_admin_aap_metrics_postgresql_root_password: "{{ (zuno_admin_password | default(((zuno_password_seed ~ ':aap-metrics-postgresql') | hash('md5'))[:22], true)) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"
zuno_admin_aap_metrics_readonly_postgresql_password: "{{ (zuno_admin_password | default(((zuno_password_seed ~ ':aap-metrics-readonly-postgresql') | hash('md5'))[:22], true)) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"
zuno_admin_mariadb_root_password: "{{ (zuno_admin_password | default(((zuno_password_seed ~ ':mariadb') | hash('md5'))[:22], true)) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"
zuno_admin_mlops_pipeline_db_password: "{{ (zuno_admin_password | default(((zuno_password_seed ~ ':mlops-pipeline-db') | hash('md5'))[:22], true)) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"
zuno_admin_rhtas_trillian_db_password: "{{ (zuno_admin_password | default(((zuno_password_seed ~ ':rhtas-trillian-db') | hash('md5'))[:22], true)) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"
zuno_admin_redis_session_store_password: "{{ (zuno_admin_password | default(((zuno_password_seed ~ ':redis-session-store') | hash('md5'))[:22], true)) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"

# --- Demo personas, by family (ADR-0349 section 3, ADR-0595) -----------------
# humans: the 27 people AND the eval-* / stress-* twins, which sign in with the
# same Secret demo-personas-password BY DECISION (ADR-0595): at least eight
# consumers read it (the persona Job, the stresstest Job, the acceptance gate,
# the failover and persona probes, the mlops copy, the RAGAS ExternalSecret) and
# pick the twin family with EVAL_TWIN_PREFIX.
# openclaw_ui: the per-persona OpenClaw Control UI password.
# Shared in BOTH profiles (people type it). In hardened no md5 fallback: an
# unset zuno_personas_mainpwd fails with zuno_personas_password's hint.
zuno_personas_humans_password: "{{ zuno_personas_password | default(((zuno_password_seed ~ ':personas-humans') | hash('md5'))[:22] if zuno_security_profile == 'demo' else zuno_personas_password, true) }}"
# Name read by the vault role for keycloak/demo-personas (kept for existing overrides).
zuno_admin_demo_personas_root_password: "{{ zuno_personas_humans_password }}"
# Infra in hardened (WP-223): the Control UI password is a per-instance gate,
# not a sign-in people share, so it goes random there (openclaw role default).
zuno_personas_openclaw_ui_password: "{{ (zuno_personas_password | default(((zuno_password_seed ~ ':personas-openclaw-ui') | hash('md5'))[:22], true)) if zuno_security_profile == 'demo' else undef(_zuno_passwords_hardened_hint) }}"
