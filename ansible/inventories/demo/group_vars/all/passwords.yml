# --- Demo personas, by family (ADR-0349 section 3, ADR-0595) -----------------
# humans: the 27 people. eval / stress: the eval-* and stress-* twins.
# openclaw_ui: the per-persona OpenClaw web UI password.
zuno_personas_humans_password: "{{ zuno_personas_password | default(((zuno_password_seed ~ ':personas-humans') | hash('md5'))[:22], true) }}"
# Name read by the vault role for keycloak/demo-personas (kept for existing overrides).
zuno_admin_demo_personas_root_password: "{{ zuno_personas_humans_password }}"
zuno_personas_eval_password: "{{ zuno_personas_password | default(((zuno_password_seed ~ ':personas-eval') | hash('md5'))[:22], true) }}"
