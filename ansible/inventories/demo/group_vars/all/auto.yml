---
zuno_orgID: "{{ zuno_orgId | upper  }}"

zuno_env: demo
zuno_environment: "{{ zuno_env | default('dev') }}"
zuno_envID: "{{ zuno_envId | default(zuno_environment) | upper }}"

# Repo root, resolved relative to playbooks in ansible/playbooks/.
zuno_repo_root: "{{ playbook_dir }}/../.."

zuno_name: "{{ zuno_org }}-{{ zuno_env }}"
zuno_id: "{{ zuno_orgId }}{{ zuno_envId }}"
zuno_ID: "{{ zuno_orgID }}{{ zuno_envID }}"

# Tokens derived from the shared admin password. The passwords themselves - one
# variable per component, each inheriting zuno_admin_password or
# zuno_personas_password - live in passwords.yml (ADR-0595).
#
# Sharing one password across components is a deliberate demo trade-off, not an
# oversight: a leak of zuno_admin_password yields all of them at once. To split
# one component off, set its own variable in ansible/confidential.yml. On a
# seeded cluster a new value reaches Vault only after the path is deleted and
# re-seeded (ADR-0345); a database additionally needs the ADR-0529 runbook, and
# the demo personas' live passwords diverge in Keycloak after their first change
# (ADR-0349 section 3; delete zuno/keycloak/demo-personas to re-seed).
zuno_admin_vault_token: "{{ zuno_admin_token }}"
zuno_admin_mcp_gateway_token: "{{ zuno_admin_token }}"
