---
zuno_orgID: "{{ zuno_orgId | upper  }}"

zuno_env: demo
zuno_environment: "{{ zuno_env | default('dev') }}"
zuno_envID: "{{ zuno_envId | default(zuno_environment) | upper }}"

# Repo root, resolved relative to playbooks in ansible/playbooks/.
zuno_repo_root: "{{ playbook_dir }}/../.."

zuno_name: "{{ zuno_org }}-{{ zuno_env }}"
zuno_id: "{{ zuno_orgId }}{{ zuno_envId }}"
zuno_ID: "{{ zuno_orgID }}{{ zuno_envID }}"

# One root token/password per Vault-seeded secret in
# ansible/roles/vault/tasks/install.yml, so an operator can set
# zuno_admin_mainpwd once (ansible/confidential.yml) and get known
# credentials everywhere instead of the role's random fallback.
#
# "everywhere" is narrower than it reads, and deliberately so. Only the four
# overrides below are wired: zunoapp, keycloak (Keycloak's own admin), the
# keycloak PostgreSQL role, and ragtech. The other 14 PostgreSQL roles listed
# in ansible/roles/postgresql/defaults/main.yml (aapgateway, aapcontroller,
# aapeda, aaphub, maas, ogxserver, ragadv, ragproject, ragsales, ragsxalegacy,
# agentcheckpoints, agentconversations, metricsservice, msawxreadonly) have no
# override here and keep the role's per-path
# `lookup('ansible.builtin.password', '/dev/null', ...)`, so each gets its own
# distinct random password.
#
# The accepted consequence: zunoapp, keycloak and ragtech share ONE password on
# the live cluster (verified 2026-08-28 - 16 distinct password digests across 18
# pguser Secrets), so a leak of zuno_admin_password yields all three at once.
# That is a demo-convenience trade, not an oversight, and no ADR forbids it -
# do not "fix" it by rotating one of the three in isolation. Under ADR-0529's
# creationPolicy: Merge a new Vault value no longer reaches the database on its
# own; rotation now requires that ADR's explicit runbook.
zuno_admin_vault_token: "{{ zuno_admin_token }}"
zuno_admin_postgresql_root_password: "{{ zuno_admin_password }}"
zuno_admin_keycloak_root_password: "{{ zuno_admin_password }}"
zuno_admin_keycloak_postgresql_root_password: "{{ zuno_admin_password }}"
zuno_admin_rag_postgresql_root_password: "{{ zuno_admin_password }}"
# ADR-0349 §3: the demo personas' INITIAL password, deliberately decoupled
# from zuno_admin_password - a demo-grade initialization value, treated as
# compromised from day one (each persona's live password diverges in
# Keycloak's own database after first change; Vault only ever holds this
# init default). Seeding is idempotent (ADR-0345): an existing install
# keeps its old seeded value until the operator deletes
# zuno/keycloak/demo-personas and re-runs the seed.
zuno_admin_demo_personas_root_password: "secretdemerde"
zuno_admin_tekos_frontend_token: "{{ zuno_admin_token }}"
zuno_admin_mcp_gateway_token: "{{ zuno_admin_token }}"
zuno_admin_tekos_session_token: "{{ zuno_admin_token }}"
