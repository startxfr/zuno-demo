all:
  hosts:
    localhost:
      ansible_connection: local
      # auto_silent (ansible.cfg) would otherwise probe localhost as a
      # separate "remote" and can land on a system Python (e.g.
      # /usr/bin/python3.12) that lacks the `kubernetes` pip package this
      # repo's kubernetes.core modules need - pin it to the same
      # interpreter already running ansible-playbook, where `pip install
      # kubernetes` (per ansible/requirements.yml's own collection) lives.
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
