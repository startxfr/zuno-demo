---
# Day 1 (ADR-0056): state check for Day 1 components - `make day1 check`/
# `make d1 check`. Mirrors day0_check.yml's structure.
#
# Component list note: your original Day 1 spec named `llm, rag, mcp,
# agents` as the "run" components. `models` and `sql_schema` are included
# here too, deliberately going beyond that exact list - dropping them
# would make them permanently unreachable (nothing else in this
# repository triggers the vLLM InferenceService or the SXA schema/
# sales-db deployment), a real functional regression, not just a naming
# choice. `mlops` is excluded from the state-check loop below (not from
# day1_install.yml/day1_uninstall.yml) - it has no tasks/precheck.yml,
# since tasks/install.yml is still a placeholder scaffold with nothing
# real to detect yet.
#
# `agents` is a deliberate special case: `make check` (ADR-0053) must
# still run ansible/roles/agents/tasks/check.yml - the full 20-scenario
# acceptance/security gate - not just a lightweight state check. So the
# loop below runs `tasks_from: check` for `agents` and
# `tasks_from: precheck` for everyone else.
- name: "Day 1: check install state"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  vars:
    day1_components:
      - llm
      - models
      - sql_schema
      - rag
      - mcp
      - agents
      - mlops
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.import_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: Resolve requested Day 1 component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day1_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    - name: Exclude mlops from state-checking (no precheck.yml yet)
      ansible.builtin.set_fact:
        selected_components: "{{ selected_components | reject('equalto', 'mlops') | list }}"

    - name: Generate the state-report file
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/init_state_report.yml"

    - name: Run Day 1 component state checks
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: "{{ 'check' if item == 'agents' else 'precheck' }}"
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"
      # agents' check.yml (ADR-0053) is a real acceptance/security gate,
      # unlike every other precheck.yml here - it can genuinely fail. Don't
      # let that abort the play before the state report below is displayed.
      ignore_errors: true
      register: _day1_check_results

    - name: Display the state report
      ansible.builtin.debug:
        msg: "{{ lookup('ansible.builtin.file', state_report_file).split('\n') | select() | list }}"

    - name: Fail if any Day 1 state check failed
      ansible.builtin.fail:
        msg: >-
          One or more Day 1 state checks failed - see the task output
          above and the state report for detail: {{
          _day1_check_results.results
          | selectattr('failed', 'defined') | selectattr('failed')
          | map(attribute='item') | list }}
      when: >-
        _day1_check_results.results
        | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0
