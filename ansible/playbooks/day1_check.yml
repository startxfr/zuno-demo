---
# Day 1 state check (`make day1 check`) - the remainder of the
# AI-platform-operator stack, plus aiagent_operator. `namespaces`, `llm`,
# `models`, and content-ingestion (rag/rag_ingestion/mcp/agents/mlops) all
# moved to Day 2 - see day2_check.yml. ADR-0421 moved postgresql/keycloak/
# aap/aap_config out to Day 0 and smtp/nfd/nvidia_gpu/
# custom_metrics_autoscaler in from Day 0 - see day1_install.yml.
- name: "Day 1: check install state"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  vars:
    # Which `make dN` accepts this component - drives the AUTO-FIX hints
    # in the shared blocked-findings tasks (ADR-0201 follow-up).
    zuno_day: d1
    day1_verb: check
    day1_components:
      - smtp
      - nfd
      - nvidia_gpu
      - custom_metrics_autoscaler
      - redis
      - observability
      - service_mesh
      - mesh_monitoring
      - kiali
      - grafana
      - mariadb
      - tempo
      - openshift_oauth
      - connectivity_link
      - lws
      - jobset
      - kueue
      - openshift_ai
      - lightspeed
      - aiagent_operator
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: Resolve requested Day 1 component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day1_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    # Day 1 roles record blocked-resource findings exactly as Day 0 roles do
    # (openshift_ai and openshift_oauth both do), but this playbook never
    # initialized the accumulator, so every one of those findings was
    # silently discarded on `make d1 check` - the guard they carry is
    # `when: blocked_findings is defined`, which was simply false here. That
    # mattered more once ADR-0201's reconcile moved to Day 1: openshift_ai's
    # findings had no Day 0 playbook left to surface them either.
    - name: Initialize blocked-resource tracking
      ansible.builtin.set_fact:
        blocked_findings: []

    - name: Generate the state-report file
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/init_state_report.yml"

    - name: Run Day 1 component state checks
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: precheck
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"
      ignore_errors: true
      register: _day1_check_results

    - name: Display the state report
      ansible.builtin.debug:
        msg: "{{ lookup('ansible.builtin.file', state_report_file).split('\n') | select() | list }}"

    # blocked_report_fail: false - `make d1 check` reports and keeps its
    # never-failing-on-findings contract, same as day0_check.yml. A genuinely
    # failed precheck is still caught by the task below.
    - name: Summarize blocked resources (reports, never fails the check)
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/report_blocked_findings.yml"
      vars:
        blocked_report_fail: false

    - name: Fail if any Day 1 state check failed
      ansible.builtin.fail:
        msg: >-
          One or more Day 1 state checks failed - see the task output
          above and the state report for detail: {{
          _day1_check_results.results
          | selectattr('failed', 'defined') | selectattr('failed')
          | map(attribute='item') | list }}
      when: >-
        _day1_check_results.results
        | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0
