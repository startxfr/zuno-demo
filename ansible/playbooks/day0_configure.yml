---
# Day 0 (ADR-0056): `make day0 configure`/`make d0 configure`. Same
# component list and ordering as day0_check.yml - see that file's header
# comment. Every Day 0 role has a real `configure.yml` (even if some are a
# documented no-op, e.g. nfd/nvidia_gpu/observability/smtp - PREP-only
# components with nothing to configure beyond what install.yml already
# applied), so this can safely loop over the full list unconditionally.
- name: "Day 0: configure prerequisites"
  hosts: localhost
  gather_facts: false
  vars:
    day0_components:
      - admin_context
      - argocd
      - namespaces
      - vault
      - keycloak
      - postgresql
      - smtp
      - external_secrets
      - nfd
      - nvidia_gpu
      - observability
      - openshift_ai
  tasks:
    - name: Resolve requested Day 0 component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day0_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    - name: Configure Day 0 components
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: configure
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"
