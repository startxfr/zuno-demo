---
# Day 1 build (`make day1 build`). Builds component images via OpenShift
# BuildConfig/ImageStream; ai-gateway is included too since a fresh cluster
# has no CI-published image otherwise. supply-chain-signer (ADR-0420/WP-068)
# is the same shape - no run component, image only - and MUST build first:
# apply_openshift_build.yml now signs every image it builds (WP-070), which
# needs supply-chain-signer's own image to already exist.
- name: "Day 1: build component images"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  vars:
    # Which `make dN` accepts this component - drives the AUTO-FIX hints
    # in the shared blocked-findings tasks (ADR-0201 follow-up).
    zuno_day: d1
    # Read by ansible/tasks/apply_openshift_build.yml to force a genuinely
    # fresh Build here - an explicit `make d1 build X` always means
    # "build," unlike the implicit "ensure an image exists" dependency
    # path day1_install.yml's roles fall back to.
    day1_verb: build
    day1_build_components:
      - supply_chain_signer_build
      - ai_gateway_build
      # aiagent-operator is the same "no CI-published image on a fresh
      # cluster" shape as ai-gateway: its Day 1 run component only applies
      # GitOps Applications, so without this entry nothing ever creates the
      # BuildConfig/ImageStream and the operator Deployment sits in
      # ImagePullBackOff on a fresh cluster (hit live 2026-08-25).
      - aiagent_operator_build
      # WP-102/ADR-0418 clause 6: the custom AAP execution environment
      # (kustomize/oc/cosign). Role name must match the target_component
      # resolution below (aap-execution-environment -> aap_execution_
      # environment_build). After supply_chain_signer_build (this image
      # gets signed too, like every other build here) - order relative to
      # ai_gateway_build/aiagent_operator_build doesn't matter.
      - aap_execution_environment_build
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: Resolve requested Day 1 build component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day1_build_components if target_component | default('all') == 'all'
             else [(target_component | replace('-', '_')) + '_build'] }}

    - name: Build Day 1 component images
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: build
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"
