---
# Day 1 (ADR-0056): `make day1 build`/`make d1 build`. Builds the
# platform's own component images via native OpenShift BuildConfig/
# ImageStream in zuno-ai-build - see ansible/tasks/apply_openshift_build.yml.
# `ai-gateway` was originally left out of this list, intended to be built
# by the existing GitHub Actions pipeline instead (ADR-0051) - on a fresh
# cluster with no CI-published image that left every ai-gateway pod in
# permanent ImagePullBackOff (found via live-cluster testing on
# api.demo222.startx.fr), so it's built here too now
# (ansible/roles/ai_gateway_build) via the same in-cluster mechanism.
- name: "Day 1: build component images"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  vars:
    day1_build_components:
      - mcp_build
      - rag_build
      - agent_build
      - ai_gateway_build
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.import_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: Resolve requested Day 1 build component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day1_build_components if target_component | default('all') == 'all'
             else [(target_component | replace('-', '_')) + '_build'] }}

    - name: Build Day 1 component images
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: build
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"
