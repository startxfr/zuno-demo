---
# ADR-0612/WP-248 step 3. Workstation only; writes to AWS only with -e registry_bucket_apply=true.
- name: "Provision the internal registry's S3 bucket"
  hosts: localhost
  connection: local
  gather_facts: false
  # The first file that exists: this cluster's inventory cluster.yml, else the
  # deprecated ansible/clusters/<cluster>.yml. The cluster is -e zuno_cluster,
  # else the inventory's zuno_cluster_name, else demo333. vars_files (not
  # include_vars) as before, so the precedence of these values is unchanged.
  vars_files:
    - - "{{ playbook_dir }}/../inventories/{{ zuno_cluster | default(zuno_cluster_name | default('demo333')) }}/cluster.yml"
      - "{{ playbook_dir }}/../clusters/{{ zuno_cluster | default(zuno_cluster_name | default('demo333')) }}.yml"
  roles:
    - registry_bucket
