---
# Day 2 state check (`make day2 check`) - namespace policy overlay, AI
# infrastructure (llm, models), and content-ingestion. `namespaces` is
# first, checking its Day 2 half (ResourceQuota/NetworkPolicy overlay)
# only - see ansible/roles/namespaces/README.md; internal task naming
# stays `precheck_d1`, an implementation detail. `mlops` has no
# precheck.yml yet, excluded from state-checking. Moved here from Day 1
# (ADR-0060). `supply_chain` (ADR-0420/WP-070) is check-only, no
# install/precheck at all - verifies every first-party image's signature.
- name: "Day 2: check install state"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  vars:
    # Which `make dN` accepts this component - drives the AUTO-FIX hints
    # in the shared blocked-findings tasks (ADR-0201 follow-up).
    zuno_day: d2
    day2_verb: check
    day2_components:
      - namespaces
      - llm
      - models
      - sql_schema
      - rag
      - rag_ingestion
      - mcp
      - agents
      - mlops
      - supply_chain
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: Resolve requested Day 2 component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day2_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    - name: Exclude mlops from state-checking (no precheck.yml yet)
      ansible.builtin.set_fact:
        selected_components: "{{ selected_components | reject('equalto', 'mlops') | list }}"

    - name: Generate the state-report file
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/init_state_report.yml"

    - name: Run Day 2 component state checks
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: "{{ 'check' if item in ['agents', 'supply_chain'] else ('precheck_d1' if item == 'namespaces' else 'precheck') }}"
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"
      ignore_errors: true
      register: _day2_check_results

    - name: Display the state report
      ansible.builtin.debug:
        msg: "{{ lookup('ansible.builtin.file', state_report_file).split('\n') | select() | list }}"

    - name: Fail if any Day 2 state check failed
      ansible.builtin.fail:
        msg: >-
          One or more Day 2 state checks failed - see the task output
          above and the state report for detail: {{
          _day2_check_results.results
          | selectattr('failed', 'defined') | selectattr('failed')
          | map(attribute='item') | list }}
      when: >-
        _day2_check_results.results
        | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0
