---
# Day 1 install (`make day1 install`) - the AI-platform-operator stack
# only (mesh, Keycloak, databases, Kueue, OpenShift AI, etc.) plus
# aiagent_operator. `openshift_ai`/`kueue` back `models`' KServe/RHOAI
# serving path and `keycloak` provides auth broadly across this tier, so
# both precede `aiagent_operator`. `openshift_oauth` runs right after
# `keycloak` (moved here from Day 0 - it needs Keycloak's Ingress/TLS
# Secret to exist first, which Day 0 can never provide). `aap` (ADR-0354/
# WP-072) runs right after `openshift_oauth` - AAP needs its own dedicated
# PostgreSQL database (postgresql, earlier here) and the same Keycloak/
# CA-trust bootstrap openshift_oauth itself needed. `aap_config` (WP-073)
# follows immediately - it registers this repository (Project/Job
# Template/SSO) inside the instance `aap` just installed. `aiagent_operator`
# runs last -
# standard operator-before-CR ordering: it must be running before Day 2's
# `agents` component creates any `AIAgent` CRs. `namespaces`, `llm`,
# `models`, and content-ingestion (rag/rag_ingestion/mcp/
# agents/mlops) all moved to Day 2 - see day2_install.yml.
- name: "Day 1: install components"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  vars:
    # Which `make dN` accepts this component - drives the AUTO-FIX hints
    # in the shared blocked-findings tasks (ADR-0201 follow-up).
    zuno_day: d1
    # Read by ansible/tasks/apply_openshift_build.yml (reached indirectly
    # by a handful of install.yml roles ensuring their own image exists)
    # to keep today's re-verify-only behavior - installs must never
    # silently trigger a rebuild.
    day1_verb: install
    day1_components:
      - redis
      - observability
      - service_mesh
      - mesh_monitoring
      - kiali
      - grafana
      - postgresql
      - mariadb
      - tempo
      - keycloak
      - openshift_oauth
      - aap
      - aap_config
      - connectivity_link
      - lws
      - jobset
      - kueue
      - openshift_ai
      - lightspeed
      - aiagent_operator
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: Resolve requested Day 1 component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day1_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    - name: Install Day 1 components
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: install
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"
