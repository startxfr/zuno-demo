---
# Day 1 install (`make day1 install`) - AI infrastructure (llm, models, the
# AI-platform-operator stack: mesh, Keycloak, databases, Kueue, OpenShift AI,
# etc.) plus API platform components. `namespaces` runs first so the
# ResourceQuota/NetworkPolicy overlay (its Day 1 half - see
# ansible/roles/namespaces/README.md) is in place before any other Day 1
# workload rolls out. The 15 components arriving here from Day 0 run next,
# before `llm`/`models`, since `openshift_ai`/`kueue` back `models`' KServe/
# RHOAI serving path and `keycloak` provides auth broadly across this tier.
# Content-ingestion components (sql_schema/rag/rag_ingestion/mcp/agents/
# mlops) moved to Day 2 - see day2_install.yml.
- name: "Day 1: install components"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  vars:
    # Read by ansible/tasks/apply_openshift_build.yml (reached indirectly
    # by a handful of install.yml roles ensuring their own image exists)
    # to keep today's re-verify-only behavior - installs must never
    # silently trigger a rebuild.
    day1_verb: install
    day1_components:
      - namespaces
      - redis
      - observability
      - service_mesh
      - mesh_monitoring
      - kiali
      - grafana
      - postgresql
      - mariadb
      - tempo
      - keycloak
      - connectivity_link
      - lws
      - jobset
      - kueue
      - openshift_ai
      - llm
      - models
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: Resolve requested Day 1 component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day1_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    - name: Install Day 1 components
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: "{{ 'install_d1' if item == 'namespaces' else 'install' }}"
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"
