---
# Day 1 install (`make day1 install`) - the remainder of the
# AI-platform-operator stack (mesh, databases, Kueue, OpenShift AI, etc.)
# plus aiagent_operator. ADR-0421 moved `smtp`/`nfd`/`nvidia_gpu`/
# `custom_metrics_autoscaler` here from Day 0, at the head of this list -
# none of the three GPU-node components need anything beyond `machines`
# (Day 0, unaffected: nfd before nvidia_gpu), and `smtp` only needs
# `vault`/`external_secrets` (Day 0). `postgresql`/`keycloak`/`aap`/
# `aap_config` moved the other way, into Day 0 right after `machines` (see
# day0_install.yml) - they are this repo's "always-on infra" core.
# `openshift_ai`/`kueue` back `models`' KServe/RHOAI serving path, so both
# precede `aiagent_operator`. `openshift_oauth` runs where `keycloak` used
# to (right before `connectivity_link`) - it needs Keycloak's Ingress/TLS
# Secret, now provided by Day 0's keycloak instead of a Day 1 one.
# `aiagent_operator` runs last - standard operator-before-CR ordering: it
# must be running before Day 2's `agents` component creates any `AIAgent`
# CRs. `namespaces`, `llm`, `models`, and content-ingestion (rag/
# rag_ingestion/mcp/agents/mlops) all moved to Day 2 - see
# day2_install.yml.
- name: "Day 1: install components"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  vars:
    # Which `make dN` accepts this component - drives the AUTO-FIX hints
    # in the shared blocked-findings tasks (ADR-0201 follow-up).
    zuno_day: d1
    # Read by ansible/tasks/apply_openshift_build.yml (reached indirectly
    # by a handful of install.yml roles ensuring their own image exists)
    # to keep today's re-verify-only behavior - installs must never
    # silently trigger a rebuild.
    day1_verb: install
    day1_components:
      - smtp
      - nfd
      - nvidia_gpu
      - custom_metrics_autoscaler
      - redis
      - observability
      - service_mesh
      - mesh_monitoring
      - kiali
      - grafana
      - mariadb
      - tempo
      - openshift_oauth
      - connectivity_link
      - lws
      - jobset
      - kueue
      - openshift_ai
      - lightspeed
      - aiagent_operator
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: Resolve requested Day 1 component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day1_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    - name: Install Day 1 components
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: install
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"
