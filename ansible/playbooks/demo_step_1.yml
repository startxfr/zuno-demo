---
# `make demo-step-1` (WP-136/ADR-0550). Presenter prompter only - prints
# what to say/click/type and what to expect; never submits a chat message
# itself (WP-136: "the audience should see the real UI interaction").
- name: "Demo step 1: Arkos C1 external reasoning (4 min)"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  tasks:
    - name: Resolve the cluster base domain
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_base_domain.yml"

    - name: "demo-step-1 | print the presenter contract"
      ansible.builtin.debug:
        msg:
          - "OBJECTIVE: show a C1 (public) DAT request routes to OVHcloud - sovereign AI does not mean 'always local'."
          - "OPEN: https://arkos.{{ cluster_base_domain }}"
          - "SELECT: no project (or an explicit C1 project) - Draft Architecture Testimonial task."
          - "PROMPT: 'Draft an architecture testimonial about container platform modernization.' - the phrasing matters: it must match one of Arkos's _TOPIC_PATTERN forms (draft/create/write + a/an + dat|architecture testimonial|document + for/about/on + <topic>) in components/agent-runtime/app/graph/arkos_nodes.py, or plan_node falls back to the WHOLE raw sentence as the search topic, which then pollutes the live Confluence search with generic framing words and can escalate the effective classification past C1 regardless of the actual subject (live-caught 2026-09-05 rehearsing this exact step)."
          - "EXPECTED: classification=C1, model=gpt-oss-120b, provider=OVHcloud, execution=external, fallback=no."
          - "POINT AT: the collapsed 'Show routing details' panel under the reply - expand it and read Classification/Model/Provider/Execution location."
          - "TIME BUDGET: 4 minutes."
          - "RECOVERY: if the panel shows classification=C2 or execution=local, first suspect the prompt wording (see above) or a genuine Confluence match on the chosen topic before re-running `make demo-check` - a missing/misconfigured webinar-public project or a stale ai-gateway policy is the next most likely cause, not a code regression (see WP-137's live-verification note)."
