---
# Day 0 install (`make day0 install`). Same component order as day0_check.yml.
# openshift_oauth stays in Day 1 (after Day 0's keycloak) - it needs
# Keycloak's Ingress/TLS Secret, which Day 0's own keycloak component now
# provides. See ansible/playbooks/day1_install.yml. ADR-0421 moved
# postgresql/keycloak/aap/aap_config here from Day 1, right after
# "machines" - their real prerequisites (vault, external_secrets,
# machines) all precede them below - and moved smtp/nfd/nvidia_gpu/
# custom_metrics_autoscaler out to Day 1 in exchange.
- name: "Day 0: install prerequisites"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  vars:
    # Which `make dN` accepts this component - drives the AUTO-FIX hints
    # in the shared blocked-findings tasks (ADR-0201 follow-up).
    zuno_day: d0
    # Mirrors day0_check.yml: normally supplied by the inventory's
    # group_vars, absent under an AAP Job Template's Controller-managed
    # inventory - which would leave WP-130's gate silently un-included.
    zuno_repo_root: "{{ playbook_dir }}/../.."
    day0_components:
      - argocd
      - admin_context
      - namespaces
      - image_mirrors
      - openshift_rbac_groups
      - vault
      - cert_manager
      - external_secrets
      - machines
      # postgresql/keycloak/aap/aap_config (ADR-0421): their only real
      # prerequisites - vault, external_secrets, machines - are all
      # already applied above.
      - postgresql
      - keycloak
      - aap
      - aap_config
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: Resolve requested Day 0 component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day0_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    - name: Initialize blocked-resource tracking
      ansible.builtin.set_fact:
        blocked_findings: []
        _run_component_any_failed: false

    # WP-130: the same probe day0_check.yml runs, disposed of differently. Its
    # findings deliberately do NOT enter blocked_findings here -
    # report_blocked_findings.yml fails the play when blocked_report_fail is
    # true, so an advisory finding (the MariaDB backup keys, which
    # mariadb/tasks/install.yml treats as legitimately optional) would fail a
    # Day 0 install that otherwise succeeded completely. Only the blocking
    # subset gates, and it gates BEFORE anything is applied: today a
    # from-scratch run dies forty minutes in, inside machines or postgresql,
    # and in the S3 case it does not die at all - it quietly writes into
    # another cluster's buckets.
    - name: Probe fresh-cluster readiness before applying anything (WP-130)
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_cluster_readiness.yml"

    - name: Refuse to install when a blocking readiness finding exists
      ansible.builtin.fail:
        msg: |-
          This cluster is not ready for a Day 0 install. Nothing has been applied.

          {% for f in cluster_readiness_findings | selectattr('blocking') %}
          [{{ f.component }}] {{ f.resource }}
            STATE:    {{ f.state }}
            CAUSE:    {{ f.cause }}
            SOLUTION: {{ f.solution }}
          {% endfor %}
          Re-run `make d0 check` after fixing these - it reports the advisory
          findings too, which do not gate but do degrade the platform silently.
      when: (cluster_readiness_findings | default([]) | selectattr('blocking') | list | length) > 0

    # A blocked component records its findings and the loop continues, so one
    # run reports EVERY blocked resource (summary + solution + auto-fix at the
    # end). Accepted trade-off with target_component=all: dependents of a
    # blocked component still burn their own wait retries before being
    # recorded too; shorten with EXTRA_VARS='-e gitops_app_wait_retries=3'.
    - name: Install Day 0 components
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/run_component.yml"
      vars:
        run_component_day: d0
        run_component_role: "{{ item }}"
        run_component_tasks_from: install
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"

    - name: Summarize blocked resources (fails when anything is blocked)
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/report_blocked_findings.yml"

    - name: Fail on component errors that produced no findings
      ansible.builtin.fail:
        msg: >-
          At least one component failed without a recorded blocked-resource
          finding - scroll up to its failed task for the cause.
      when:
        - _run_component_any_failed | bool
        - (blocked_findings | default([])) | length == 0
