---
# Day 0 install (`make day0 install`). Same component order as day0_check.yml.
# openshift_oauth moved to Day 1 (after keycloak) - it depends on Keycloak's
# Ingress/TLS Secret, which don't exist until Day 1's keycloak component
# has run. See ansible/playbooks/day1_install.yml.
- name: "Day 0: install prerequisites"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  vars:
    # Which `make dN` accepts this component - drives the AUTO-FIX hints
    # in the shared blocked-findings tasks (ADR-0201 follow-up).
    zuno_day: d0
    day0_components:
      - argocd
      - admin_context
      - namespaces
      - image_mirrors
      - openshift_rbac_groups
      - vault
      - cert_manager
      - external_secrets
      - smtp
      # machines before nfd/nvidia_gpu: the permanent GPU node should exist
      # (or be provisioning) before nvidia_gpu's ClusterPolicy-ready wait.
      - machines
      - nfd
      - nvidia_gpu
      - custom_metrics_autoscaler
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: Resolve requested Day 0 component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day0_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    - name: Initialize blocked-resource tracking
      ansible.builtin.set_fact:
        blocked_findings: []
        _run_component_any_failed: false

    # A blocked component records its findings and the loop continues, so one
    # run reports EVERY blocked resource (summary + solution + auto-fix at the
    # end). Accepted trade-off with target_component=all: dependents of a
    # blocked component still burn their own wait retries before being
    # recorded too; shorten with EXTRA_VARS='-e gitops_app_wait_retries=3'.
    - name: Install Day 0 components
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/run_component.yml"
      vars:
        run_component_day: d0
        run_component_role: "{{ item }}"
        run_component_tasks_from: install
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"

    - name: Summarize blocked resources (fails when anything is blocked)
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/report_blocked_findings.yml"

    - name: Fail on component errors that produced no findings
      ansible.builtin.fail:
        msg: >-
          At least one component failed without a recorded blocked-resource
          finding - scroll up to its failed task for the cause.
      when:
        - _run_component_any_failed | bool
        - (blocked_findings | default([])) | length == 0
