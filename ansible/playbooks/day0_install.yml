---
# Day 0 (ADR-0056): `make day0 install`/`make d0 install`. Same component
# list and ordering as day0_check.yml - see that file's header comment.
- name: "Day 0: install prerequisites"
  hosts: localhost
  gather_facts: false
  vars:
    day0_components:
      - admin_context
      - argocd
      - namespaces
      - vault
      - keycloak
      - postgresql
      - smtp
      - external_secrets
      - nfd
      - nvidia_gpu
      - observability
      - openshift_ai
  tasks:
    - name: Resolve requested Day 0 component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day0_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    - name: Install Day 0 components
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: prepare
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"
