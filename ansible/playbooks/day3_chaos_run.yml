---
# `make d3 chaos infra|platform` (after the pause) and the node after the approval in the AAP chaos workflows: ONE
# PipelineRun in zuno-chaos (generateName chaos-<kind>-), waited for, its result row printed and handed to the post-check
# (ansible/roles/chaos/tasks/run.yml). Mutates the cluster: one pod deleted per target, one provider cut, or node pressure.
#
# Extra vars: chaos_kind (infra | platform), chaos_tier (infra: pods | hog | latency), chaos_targets (platform: ids of
# platform/chaos/targets.yaml, comma separated).
- name: "Day 3: chaos run - one PipelineRun"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: "chaos | run"
      ansible.builtin.include_role:
        name: chaos
        tasks_from: run
