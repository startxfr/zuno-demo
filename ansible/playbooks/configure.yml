---
- name: Configure Zuno Demo platform scopes
  hosts: localhost
  gather_facts: false
  vars:
    configuration_scopes:
      - argocd
      - vault
      - external_secrets
      - keycloak
      - postgresql
      - sql_schema
      - api
      - datascience
      - models
      - llm
      - mlops
      - rag
      - mcp
  tasks:
    - name: Resolve requested configuration role names
      ansible.builtin.set_fact:
        selected_scopes: >-
          {{ configuration_scopes if target_scope | default('all') == 'all'
             else [target_scope | replace('-', '_')] }}

    - name: Configure platform scopes
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: configure
      loop: "{{ selected_scopes }}"
      loop_control:
        label: "{{ item }}"
