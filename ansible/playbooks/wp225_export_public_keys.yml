---
# WP-225 lot C, rollout step 0b: export the PUBLIC half of the agent-chain signing key, so it can be
# written into the Applications' values (the verifiers hold the public key as a chart value). Reads
# only the `public_key` property, never `private_key`, and writes a YAML file of public keys.
#
#   ansible-playbook -i ansible/inventories/demo/hosts.yml ansible/playbooks/wp225_export_public_keys.yml \
#     -e wp225_public_keys_out=/path/to/wp225-public-keys.yml
- name: "WP-225 lot C: export the public keys"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  vars:
    zuno_repo_root: "{{ playbook_dir }}/../.."
    wp225_public_keys_out: "/tmp/wp225-public-keys.yml"
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: "find the Vault server pod"
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: zuno-vault
        label_selectors:
          - "app.kubernetes.io/name=vault"
          - "component=server"
      register: _wp225_vault_pod

    - name: "log in to Vault as ansible-seeder"
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/vault_login.yml"

    - name: "read the public key of each pair (base64, one line)"
      kubernetes.core.k8s_exec:
        namespace: zuno-vault
        pod: "{{ _wp225_vault_pod.resources[0].metadata.name }}"
        container: vault
        command: >-
          sh -c "VAULT_TOKEN={{ zuno_vault_token }} vault kv get -field=public_key zuno/{{ item }} | base64 -w0"
      register: _wp225_pub
      changed_when: false
      loop:
        - a2a/agent-chain
      loop_control:
        label: "zuno/{{ item }} (public_key only)"

    - name: "write the public keys to {{ wp225_public_keys_out }}"
      ansible.builtin.copy:
        dest: "{{ wp225_public_keys_out }}"
        mode: "0644"
        content: |
          # Public half only (Ed25519, PEM, base64). Safe to commit as chart values.
          agent_chain_public_key_b64: "{{ _wp225_pub.results[0].stdout | trim }}"
