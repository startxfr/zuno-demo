---
# Day 0 (ADR-0056): `make day0 uninstall`/`make d0 uninstall`. Reverses
# `install`, in the opposite order (last-installed, first-removed) so
# e.g. vault is torn down before external_secrets, whose ClusterSecretStore
# depends on the Vault auth role vault's own configure step created.
- name: "Day 0: uninstall prerequisites"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  vars:
    day0_components:
      - openshift_ai
      - observability
      - nvidia_gpu
      - nfd
      - smtp
      - postgresql
      - keycloak
      - external_secrets
      - cert_manager
      - vault
      - namespaces
      - admin_context
      - argocd
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: Resolve requested Day 0 component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day0_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    - name: Uninstall Day 0 components
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: uninstall
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"
