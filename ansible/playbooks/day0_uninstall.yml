---
# Day 0 uninstall (`make day0 uninstall`). Reverses install order so
# dependents are removed before what they depend on.
# openshift_oauth stays in Day 1 (after Day 0's keycloak) - see
# day1_uninstall.yml. ADR-0421 moved postgresql/keycloak/aap/aap_config
# here from Day 1 (removed before machines, reverse of install) and
# smtp/nfd/nvidia_gpu/custom_metrics_autoscaler out to Day 1 - see
# day0_install.yml.
- name: "Day 0: uninstall prerequisites"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  vars:
    # Which `make dN` accepts this component - drives the AUTO-FIX hints
    # in the shared blocked-findings tasks (ADR-0201 follow-up).
    zuno_day: d0
    day0_components:
      - aap_config
      - aap
      - keycloak
      - postgresql
      - machines
      - external_secrets
      - cert_manager
      - vault
      - openshift_rbac_groups
      - image_mirrors
      - namespaces
      - admin_context
      - argocd
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: Resolve requested Day 0 component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day0_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    - name: Uninstall Day 0 components
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: uninstall
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"
