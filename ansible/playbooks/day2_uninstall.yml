---
# Day 2 uninstall (`make day2 uninstall`). Reverses day2_install.yml's
# order. `namespaces` runs last, removing its Day 2 half (ResourceQuota/
# NetworkPolicy overlay - see ansible/roles/namespaces/README.md) only
# after every other Day 2 workload it may constrain is already gone.
- name: "Day 2: uninstall components"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  vars:
    # Which `make dN` accepts this component - drives the AUTO-FIX hints
    # in the shared blocked-findings tasks (ADR-0201 follow-up).
    zuno_day: d2
    day2_components:
      - lightspeed_config
      - mlops
      - agents
      - mcp
      - rag_ingestion
      - rag
      - models
      - llm
      - namespaces
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: Resolve requested Day 2 component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day2_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    - name: Uninstall Day 2 components
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: "{{ 'uninstall_d1' if item == 'namespaces' else 'uninstall' }}"
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"
