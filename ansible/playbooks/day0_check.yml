---
# Day 0 state check (`make day0 check`). Component order matters: e.g.
# vault must precede cert_manager/external_secrets, argocd before namespaces.
# openshift_oauth stays in Day 1 (after Day 0's keycloak) - see
# day1_check.yml. ADR-0421 moved postgresql/keycloak/aap/aap_config here
# from Day 1 (after machines) and smtp/nfd/nvidia_gpu/
# custom_metrics_autoscaler out to Day 1 - see day0_install.yml.
# (This list previously repeated almost every component twice, likely a
# stray copy-paste - deduplicated to a single pass matching
# day0_install.yml's order; no coverage was lost, the first pass already
# checked everything.)
- name: "Day 0: check install state"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  vars:
    # Which `make dN` accepts this component - drives the AUTO-FIX hints
    # in the shared blocked-findings tasks (ADR-0201 follow-up).
    zuno_day: d0
    # ADR-0354/WP-073: zuno_repo_root normally comes from
    # ansible/inventories/demo/group_vars/all/auto.yml, auto-loaded
    # because `make d0/d1 ...` always passes `-i ansible/inventories/
    # demo/hosts.yml`. Launched as an AAP Job Template, the inventory is
    # Controller-managed (zuno-day0-check's own AnsibleInventory CR), with
    # no associated group_vars directory - so this play computes the same
    # playbook-relative value itself (identical formula, higher play-vars
    # precedence just makes this the effective value either way) rather
    # than depending on inventory-source auto-discovery.
    zuno_repo_root: "{{ playbook_dir }}/../.."
    day0_components:
      - argocd
      - admin_context
      - namespaces
      - image_mirrors
      - openshift_rbac_groups
      - vault
      - cert_manager
      - external_secrets
      - machines
      - postgresql
      - keycloak
      - aap
      - aap_config
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: Resolve requested Day 0 component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day0_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    - name: Generate the state-report file
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/init_state_report.yml"

    - name: Initialize blocked-resource tracking
      ansible.builtin.set_fact:
        blocked_findings: []

    # WP-130: cluster-wide, so it runs even for `make d0 check <one-component>`
    # - five read-only API calls and three file reads, and `make d0 check
    # machines` on a fresh cluster is exactly when the AWS probe is wanted.
    # Placed after blocked_findings is initialized: record_blocked_finding.yml's
    # own header warns the accumulator must never be shadowed by an include
    # parameter, and before the component loop so readiness heads the summary.
    - name: Probe fresh-cluster readiness (WP-130, read-only)
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/check_cluster_readiness.yml"

    # The extra `blocking` key rides along harmlessly - report_blocked_findings.yml
    # reads only the six documented keys.
    - name: Record each readiness finding
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/record_blocked_finding.yml"
      loop: "{{ cluster_readiness_findings | default([]) }}"
      loop_control:
        label: "{{ item.resource }}"
      vars:
        blocked_finding: "{{ item }}"

    - name: Run Day 0 component state checks
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: precheck
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"

    - name: Display the state report
      ansible.builtin.debug:
        msg: "{{ lookup('ansible.builtin.file', state_report_file).split('\n') | select() | list }}"

    # Check stays non-failing ("NOT installed" is a reportable outcome, not an
    # error) but now also explains WHY each blocked component is stuck and how
    # to fix it (auto-fix: make d0 reconcile <component>).
    - name: Summarize blocked resources (report only, never fails)
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/report_blocked_findings.yml"
      vars:
        blocked_report_fail: false
