---
# Day 0 (ADR-0056): state check - `make day0 check`/`make d0 check`. Runs
# ansible/tasks/init_state_report.yml once, then every selected
# component's tasks/precheck.yml (state detection, never fails), and
# displays the resulting report at the end.
#
# Order matters (admin_context first: nothing else can be checked until
# the cluster API itself is reachable; namespaces after argocd: namespace
# creation is a GitOps Application, which needs the Application CRD
# argocd installs; external_secrets right after vault: keycloak's and
# postgresql's charts each apply an ExternalSecret CR against the
# vault-backend ClusterSecretStore external_secrets creates, which itself
# needs the eso-reader Vault auth role sets up - found as a real deadlock
# via live-cluster testing on api.demo222.startx.fr, where the original
# ordering left both stuck waiting on a Secret that could never sync).
- name: "Day 0: check install state"
  hosts: localhost
  gather_facts: false
  vars:
    day0_components:
      - argocd
      - admin_context
      - namespaces
      - vault
      - external_secrets
      - keycloak
      - postgresql
      - smtp
      - nfd
      - nvidia_gpu
      - observability
      - openshift_ai
  tasks:
    - name: Resolve requested Day 0 component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day0_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    - name: Generate the state-report file
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/init_state_report.yml"

    - name: Run Day 0 component state checks
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: precheck
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"

    - name: Display the state report
      ansible.builtin.debug:
        msg: "{{ lookup('ansible.builtin.file', state_report_file).split('\n') | select() | list }}"
