---
# Day 0 state check (`make day0 check`). Component order matters: e.g.
# vault must precede cert_manager/external_secrets, argocd before namespaces.
- name: "Day 0: check install state"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  vars:
    day0_components:
      - argocd
      - admin_context
      - namespaces
      - vault
      - cert_manager
      - external_secrets
      - observability
      - keycloak
      - postgresql
      - service_mesh
      - smtp
      - nfd
      - nvidia_gpu
      - connectivity_link
      - lws
      - openshift_ai
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: Resolve requested Day 0 component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day0_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    - name: Generate the state-report file
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/init_state_report.yml"

    - name: Run Day 0 component state checks
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: precheck
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"

    - name: Display the state report
      ansible.builtin.debug:
        msg: "{{ lookup('ansible.builtin.file', state_report_file).split('\n') | select() | list }}"
