---
# `make day3|d3 restore [component]`. Only components with a
# tasks/restore.yml support this - see Makefile's DAY3_BACKUP_COMPONENTS.
- name: "Day 3: restore from the most recent backup"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  vars:
    day3_backup_components:
      - postgresql
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: Resolve requested Day 3 restore component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day3_backup_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    - name: Run Day 3 restore
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: restore
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"
