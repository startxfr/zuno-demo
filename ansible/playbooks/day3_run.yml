---
# `make day3|d3 run [component]`. Only components with a tasks/run.yml
# support this - see Makefile's DAY3_RUN_COMPONENTS. WP-126.
- name: "Day 3: trigger a real pipeline run"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  vars:
    day3_run_components:
      - mlops
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: Resolve requested Day 3 run component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day3_run_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    - name: Run Day 3 pipeline run
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: run
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"
