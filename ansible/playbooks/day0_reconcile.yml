---
# Day 0 reconcile (`make day0 reconcile`): diagnose blocked resources and
# apply known remediations automatically. Same component order as
# day0_install.yml. Roles with a tasks/reconcile.yml (openshift_ai) run their
# targeted remediations; every other role falls back to its idempotent
# install re-run, which re-applies the component's Application manifest - the
# baseline remediation, since Applications are Ansible-applied, not
# git-synced (ADR-0311/ADR-0343) - and re-runs the diagnosing waits.
# openshift_oauth stays in Day 1 (after Day 0's keycloak), and
# openshift_ai - the one role with a tasks/reconcile.yml - is a Day 1
# component too. Both are reconciled by ansible/playbooks/
# day1_reconcile.yml (`make d1 reconcile`), not from here: a Day 0 verb
# cannot take a Day 1 component, which is the whole reason `make d1
# reconcile openshift-ai` was never runnable. ADR-0421 moved
# postgresql/keycloak/aap/aap_config here from Day 1 (after machines) and
# smtp/nfd/nvidia_gpu/custom_metrics_autoscaler out to Day 1 - see
# day0_install.yml. (This list was previously missing "machines" outright
# - a pre-existing bug, since fixed here: it's present in
# day0_install.yml/day0_check.yml but had never been added to reconcile,
# so `make d0 reconcile all`/`make d0 reconcile machines` silently skipped
# it.)
- name: "Day 0: reconcile blocked prerequisites"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  vars:
    # Which `make dN` accepts this component - drives the AUTO-FIX hints
    # in the shared blocked-findings tasks (ADR-0201 follow-up).
    zuno_day: d0
    day0_components:
      - argocd
      - admin_context
      - namespaces
      - image_mirrors
      - openshift_rbac_groups
      - vault
      - external_secrets
      - cert_manager
      - machines
      - postgresql
      - keycloak
      - aap
      - aap_config
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: Resolve requested Day 0 component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day0_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    - name: Initialize blocked-resource tracking
      ansible.builtin.set_fact:
        blocked_findings: []
        _run_component_any_failed: false

    - name: Reconcile Day 0 components
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/run_component.yml"
      vars:
        run_component_day: d0
        run_component_role: "{{ item }}"
        run_component_tasks_from: reconcile
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"

    - name: Summarize blocked resources (fails when anything is still blocked)
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/report_blocked_findings.yml"

    - name: Fail on component errors that produced no findings
      ansible.builtin.fail:
        msg: >-
          At least one component failed without a recorded blocked-resource
          finding - scroll up to its failed task for the cause.
      when:
        - _run_component_any_failed | bool
        - (blocked_findings | default([])) | length == 0
