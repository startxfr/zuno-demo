---
# Day 1 uninstall (`make day1 uninstall`). Reverses day1_install.yml's
# order. `namespaces`, `llm`, `models`, and content-ingestion moved to
# Day 2 - see day2_uninstall.yml. `aiagent_operator` runs first here
# (last in install) - reverse of operator-before-CR: nothing left in
# Day 1 depends on it once uninstall starts. `aap_config` (WP-073) runs
# before `aap` - its CRs need the resource operator (part of aap's
# bundle) still alive to clean up their Controller-side objects. `aap`
# (ADR-0354/WP-072) runs right before `openshift_oauth`, mirroring its
# install position right after it. `openshift_oauth` (moved here from
# Day 0) runs right before `keycloak`, mirroring its install position
# right after it.
- name: "Day 1: uninstall components"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  vars:
    # Which `make dN` accepts this component - drives the AUTO-FIX hints
    # in the shared blocked-findings tasks (ADR-0201 follow-up).
    zuno_day: d1
    day1_components:
      - aiagent_operator
      - lightspeed
      - openshift_ai
      - kueue
      - jobset
      - lws
      - connectivity_link
      - aap_config
      - aap
      - openshift_oauth
      - keycloak
      - tempo
      - mariadb
      - postgresql
      - grafana
      - kiali
      - mesh_monitoring
      - service_mesh
      - observability
      - redis
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: Resolve requested Day 1 component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day1_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    - name: Uninstall Day 1 components
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: uninstall
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"
