---
# Day 1 uninstall (`make day1 uninstall`). Reverses day1_install.yml's
# order. `namespaces`, `llm`, `models`, and content-ingestion moved to
# Day 2 - see day2_uninstall.yml. `aiagent_operator` runs first here
# (last in install) - reverse of operator-before-CR: nothing left in
# Day 1 depends on it once uninstall starts. `openshift_oauth` runs right
# before `connectivity_link`'s reverse position, mirroring its install
# position. ADR-0421 moved postgresql/keycloak/aap/aap_config to Day 0
# (see day0_uninstall.yml, removed there before `aap_config`/`aap`/
# `keycloak`/`postgresql`'s Day-0 uninstall runs first) and moved smtp/
# nfd/nvidia_gpu/custom_metrics_autoscaler here from Day 0, removed last
# (reverse of their install position at the head of this list).
- name: "Day 1: uninstall components"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  vars:
    # Which `make dN` accepts this component - drives the AUTO-FIX hints
    # in the shared blocked-findings tasks (ADR-0201 follow-up).
    zuno_day: d1
    day1_components:
      - aiagent_operator
      - rhtas
      - lightspeed
      - openshift_ai
      - kueue
      - jobset
      - lws
      - connectivity_link
      - openshift_oauth
      - tempo
      - mariadb
      - grafana
      - kiali
      - mesh_monitoring
      - service_mesh
      - observability
      - redis
      - custom_metrics_autoscaler
      - nvidia_gpu
      - nfd
      - smtp
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: Resolve requested Day 1 component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day1_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    - name: Uninstall Day 1 components
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: uninstall
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"
