---
# Day 1 uninstall (`make day1 uninstall`). Reverses day1_install.yml's order.
- name: "Day 1: uninstall components"
  hosts: localhost
  gather_facts: false
  environment: "{{ k8s_auth_environment | default({}) }}"
  vars:
    day1_components:
      - mlops
      - agents
      - mcp
      - rag
      - sql_schema
      - models
      - llm
  tasks:
    - name: Resolve cluster API credentials
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/load_k8s_auth_env.yml"

    - name: Resolve requested Day 1 component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day1_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    - name: Uninstall Day 1 components
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: uninstall
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"
