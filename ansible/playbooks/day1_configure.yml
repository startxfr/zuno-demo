---
# Day 1 (ADR-0056): `make day1 configure`/`make d1 configure` and
# `make day1 run`/`make d1 run` both resolve here - "configure" and "run"
# are the same underlying operation for these components (apply/re-apply
# each one's GitOps Application and any one-shot Jobs it depends on), so
# there's no separate playbook to keep in sync. See day1_check.yml's
# header comment for why `models`/`sql_schema`/`mlops` are included
# alongside the `llm, rag, mcp, agents` your Day 1 spec named.
- name: "Day 1: configure/run components"
  hosts: localhost
  gather_facts: false
  vars:
    day1_components:
      - llm
      - models
      - sql_schema
      - rag
      - mcp
      - agents
      - mlops
  tasks:
    - name: Resolve requested Day 1 component name(s)
      ansible.builtin.set_fact:
        selected_components: >-
          {{ day1_components if target_component | default('all') == 'all'
             else [target_component | replace('-', '_')] }}

    - name: Configure/run Day 1 components
      ansible.builtin.include_role:
        name: "{{ item }}"
        tasks_from: configure
      loop: "{{ selected_components }}"
      loop_control:
        label: "{{ item }}"
