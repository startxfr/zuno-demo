---
# ansible/confidential.yml (gitignored, NEVER commit) - copy this file, fill in
# real values before `make d0 install`. Fields left as "xxxxxx" are treated as
# not configured.

# --- Google OAuth (Keycloak "google" identity provider) ---------------------
# Set false to skip the Google identity provider (no broken login button).
# Defaults to true.
zuno_keycloak_google_oauth_enabled: false

# Create at https://console.cloud.google.com/apis/credentials:   1. OAuth
# consent screen -> User type "Internal".   2. Enable "Gmail API" and "Google
# Drive API" (realm needs gmail.readonly/drive.readonly).   3. Credentials ->
# Create Credentials -> OAuth client ID -> "Web application".   4. Authorized
# redirect URI:
# https://keycloak.<cluster-base-domain>/realms/zuno/broker/google/endpoint   5.
# Copy the Client ID and Client Secret (secret shown once).
zuno_google_oauth_client_id: "xxxxxx"
zuno_google_oauth_client_secret: "xxxxxx"

# --- SMTP technical mail identity ------------------------------------------
# Set false to skip deploying the smtp component. Defaults to true.
zuno_smtp_enabled: false

# Example uses AWS SES; any SMTP provider works the same way.   1. Verify the
# sending domain/address in SES (required before sending;      new accounts
# start sandboxed to verified recipients only).   2. Note the SMTP endpoint for
# your region - this is zuno_smtp_host below.   3. Create SMTP Credentials ->
# copy the generated username/password (shown once).
zuno_smtp_host: "xxxxxx"            # e.g. email-smtp.eu-west-1.amazonaws.com
zuno_smtp_port: "587"               # 587 (STARTTLS), 465 (TLS) or 25
zuno_smtp_username: "xxxxxx"
zuno_smtp_password: "xxxxxx"

# --- Atlassian Confluence Cloud (technical identity for MCP ingestion) -----
# Not consumed yet (confluence MCP server is a stub); stored ahead of time.
zuno_atlassian_confluence_enabled: false

# Create at https://id.atlassian.com/manage-profile/security/api-tokens:
#   1. Create API token, preferring a scoped (Confluence read-only) token.
#   2. Copy it immediately - shown once, cannot be recovered later.
# Auth is email+token (HTTP Basic); email must match the token's account.
zuno_atlassian_confluence_url: "xxxxxx"     # site ROOT incl. scheme, e.g. https://your-company.atlassian.net (no /wiki - the server appends /wiki/rest/api itself)
zuno_atlassian_confluence_email: "xxxxxx"
zuno_atlassian_confluence_token: "xxxxxx"

# --- PostgreSQL pgBackRest backup, second repo (S3-compatible) -------------
# Optional: local PVC repo1 always exists; fill these in for an off-cluster
# repo2 (AWS S3, MinIO, etc.) - enabled automatically once all five are real.
#   1. Create/reuse a bucket on your S3-compatible provider.
#   2. Create an access key/secret key pair scoped to that bucket.
#   3. zuno_postgresql_backup_s3_endpoint is the S3 API endpoint host.
zuno_postgresql_backup_s3_bucket: "xxxxxx"
zuno_postgresql_backup_s3_endpoint: "xxxxxx"
zuno_postgresql_backup_s3_region: "xxxxxx"
zuno_postgresql_backup_s3_access_key: "xxxxxx"
zuno_postgresql_backup_s3_secret_key: "xxxxxx"
#
# OPTIONAL, and not one of the five that enable repo2: the path INSIDE the
# bucket that pgBackRest reads and writes. Leave it unset unless you are moving
# the repo (ADR-0546/WP-131).
#
# The default below is what PGO already writes today, and it is deliberately
# NOT pgBackRest's own default of /var/lib/pgbackrest. Those two disagreeing is
# what made ansible/roles/postgresql/tasks/check_s3_backup.yml report "no
# backup" for as long as it has existed, against a repo holding real backups -
# and because that probe gates the auto-restore in install.yml, a rebuild would
# have bootstrapped an EMPTY database while announcing a fresh environment.
# The probe and the operand now read this one variable so they cannot drift.
#
# Changing it points pgBackRest at a different prefix. On its own that is a
# silent break, not a loud one - an empty prefix looks exactly like a repo with
# no backups - so change it only as part of WP-131's sequenced cutover.
# zuno_postgresql_backup_s3_path: "/pgbackrest/repo2"

# --- MariaDB PhysicalBackup, S3 storage (WP-118 B7/B8) ---------------------
# Optional, same shape as the PostgreSQL repo2 above: MariaDB has no local
# backup repo, so leaving these as placeholders means backups.s3.enabled stays
# false, the ExternalSecret is never rendered, and NO MariaDB backup schedule
# exists at all. Enabled automatically once all five are real.
#   1. Create/reuse a bucket on your S3-compatible provider.
#   2. Create an access key/secret key pair scoped to that bucket - a
#      dedicated, bucket-scoped IAM user, never the account's admin keys.
#   3. zuno_mariadb_backup_s3_endpoint is the S3 API endpoint host.
# Two naming traps this family does NOT share with the PostgreSQL block above:
# the variable suffixes are _access_key_id/_secret_access_key (not
# _access_key/_secret_key), and the Vault properties are camelCase
# accessKeyId/secretAccessKey (not snake_case) - see
# gitops/charts/mariadb/templates/externalsecret-backup-s3.yaml, which is what
# consumes them, and ansible/roles/mariadb/README.md for the full mapping.
# Undocumented here until 2026-09-02, which is why this cluster has been
# running with MariaDB backups silently off.
zuno_mariadb_backup_s3_bucket: "xxxxxx"
zuno_mariadb_backup_s3_endpoint: "xxxxxx"
zuno_mariadb_backup_s3_region: "xxxxxx"
zuno_mariadb_backup_s3_access_key_id: "xxxxxx"
zuno_mariadb_backup_s3_secret_access_key: "xxxxxx"
# ADR-0546/WP-131: the key prefix inside that bucket. Not a secret, and not
# part of the five-field "all real or the schedule is off" gate above - it is
# the last field of this component that named a cluster-specific location as a
# chart literal. Omit it and the chart default (zuno-mariadb) applies. The
# per-cluster convention puts MariaDB backups under mariadb/ inside
# zuno-<cluster>-backups, beside the pgBackRest repo under postgresql/.
zuno_mariadb_backup_s3_prefix: "mariadb"

# --- Quay.io registry (stored in Vault for future cluster-side use, e.g. an
# image pull secret; NOT the same credential ADR-0115's build-publish.yml CI
# workflow uses - that one is QUAY_USERNAME/QUAY_PASSWORD as a GitHub Actions
# repo secret, set directly in GitHub, unaffected by this file) -------------
zuno_quay_username: "xxxxxx"
zuno_quay_password: "xxxxxx"

# --- Jira (no consumer in this repo yet - slot reserved for a future
# integration, same "stored ahead of time" status as Confluence originally
# had) ------------------------------------------------------------------
zuno_jira_enabled: false
zuno_jira_url: "xxxxxx"       # e.g. https://your-company.atlassian.net
zuno_jira_email: "xxxxxx"
zuno_jira_token: "xxxxxx"

# --- Salesforce (technical identity for the salesforce MCP server,
# ADR-0326/WP-33 - Comage's live opportunity read/create/update) ------------
# Create a Connected App in Salesforce Setup, enable OAuth, and mint a
# long-lived access token for a dedicated integration user (or a refresh
# flow of your choosing - this demo only stores the resulting bearer
# token). Auth is a single bearer token (HTTP Authorization header).
zuno_salesforce_enabled: false
zuno_salesforce_url: "xxxxxx"           # e.g. https://your-domain.my.salesforce.com
zuno_salesforce_access_token: "xxxxxx"

# --- git-forge (technical identities for the git-forge MCP server,
# ADR-0120/WP-058 - GitHub + GitLab repository read/write/create/fork) ------
# GitHub: mint a fine-grained Personal Access Token scoped to the repos/
# orgs this server should reach, with Contents (read/write) and
# Administration (write, for create_repository) permissions. Security
# considerations (ADR-0120): do NOT grant the delete_repo scope -
# delete_repository refuses regardless, but the credential itself should
# never be able to either.
zuno_github_enabled: false
zuno_github_token: "xxxxxx"
# GitLab: mint a Personal Access Token with the `api` scope for a
# dedicated account that is a Developer/Maintainer (NOT Owner) on the
# projects/groups this server should reach - same defense-in-depth
# reasoning as GitHub's missing delete_repo scope above. `url` is only
# needed for a self-managed instance; omit/leave "xxxxxx" to use
# https://gitlab.com.
zuno_gitlab_enabled: false
zuno_gitlab_url: "xxxxxx"               # e.g. https://gitlab.your-company.com (optional - defaults to gitlab.com)
zuno_gitlab_token: "xxxxxx"

# --- RAG corpus S3 bucket (rag-ingestion's raw/normalized/manifest storage -
# bucket/region/endpoint are chart config, not secret: see
# gitops/charts/rag-ingestion/values.yaml's s3: block) -----------------------
zuno_rag_s3_access_key_id: "xxxxxx"
zuno_rag_s3_secret_access_key: "xxxxxx"

# --- SXA corpus S3 bucket (ADR-0219: load-sxa-dump's dedicated bucket, holding
# the pre-2021 schema.sql/data.sql export - bucket/region are chart config, not
# secret: see gitops/charts/rag-ingestion/values.yaml's
# domains.sxa-legacy.sxaDump.s3 block. Use a dedicated, bucket-scoped IAM user,
# never the account's admin credentials.) --------------------------------
zuno_sxa_corpus_s3_access_key_id: "xxxxxx"
zuno_sxa_corpus_s3_secret_access_key: "xxxxxx"

# --- AAP Hub S3 bucket (WP-075: Automation Hub's file_storage replacement -
# WP-072's RWO EBS PVC deadlocked api against content/worker across 2 nodes.
# Unlike rag/s3 and sxa-corpus/s3 above, bucket name and region are also
# sourced here and pushed to Vault alongside the credentials, not committed
# as plain chart values - see
# gitops/charts/aap/templates/externalsecret-hub-s3.yaml. Use a dedicated,
# bucket-scoped IAM user, never the account's admin credentials.) ----------
zuno_aap_hub_s3_bucket_name: "xxxxxx"
zuno_aap_hub_s3_region: "xxxxxx"
zuno_aap_hub_s3_access_key_id: "xxxxxx"
zuno_aap_hub_s3_secret_access_key: "xxxxxx"

# --- RHOAI monitoring traces S3 bucket (ADR-0522/WP-079: Tempo's object -----
# storage backend for RHOAI's own side-by-side monitoring stack, distinct
# from zuno-monitoring's TempoMonolithic. Dedicated bucket, same "bucket
# name and region sourced here" pattern as AAP Hub S3 above - see
# gitops/charts/openshift-ai/templates/externalsecret-traces-s3.yaml. Use a
# dedicated, bucket-scoped IAM user, never the account's admin
# credentials.) --------------------------------------------------------------
zuno_rhoai_traces_s3_bucket_name: "xxxxxx"
zuno_rhoai_traces_s3_region: "xxxxxx"
zuno_rhoai_traces_s3_access_key_id: "xxxxxx"
zuno_rhoai_traces_s3_secret_access_key: "xxxxxx"

# --- Model weights storage (gitops/charts/models) ---------------------------
# Not secrets - listed here because this file is where every ansible-driven
# feature flag/S3 knob lives; both have defaults in
# ansible/roles/models/tasks/install.yml, so they may be omitted entirely.
# zuno_models_s3_bucket/_prefix: which bucket and directory contain the
# model weights, layout s3://<bucket>/<prefix>/<servedModelName>/ - every
# local model (both LLMInferenceServices, ADR-0521) reads straight from
# S3 (same rag/s3 Vault credential as the RAG corpus - reuses
# zuno_rag_s3_* above, no extra secret). ADR-0521 removed the legacy Day 1
# HF->PVC predownload Job this bucket/prefix pair used to be an
# alternative to (zuno_models_download_enabled, qwen-only, gone with the
# classic InferenceService it backed).
# ADR-0546/WP-131: the weights live in the cross-cluster source bucket
# (zuno-demo-sources, models/ prefix) - the historical zuno-demo-rag-corpus
# bucket was DELETED 2026-09-05; never point this at a zuno-<cluster>-* output
# bucket, weights are an INPUT shared by every cluster.
zuno_models_s3_bucket: "zuno-demo-sources"
zuno_models_s3_prefix: "models"

# zuno_models_tekos_lora_source_s3_uri: where the tekos-lora adapter artifact
# (registered by the mlops pipeline, WP-126 run wp126-20260904-201830) is
# downloaded from by the qwen LLMInferenceServices' adapter initContainer.
# Cluster-specific ON PURPOSE: the adapter is an mlops-pipeline OUTPUT, so it
# lives in this cluster's own zuno-<cluster>-mlops bucket. Same credential as
# the base model weights (rag/s3 Vault secret, zuno* wildcard). OMIT this on
# a cluster built from scratch: no adapter exists until the cluster's own
# pipeline registers one, and an unset variable makes the models role inject
# loraAdapters: [] (qwen serves without adapters) instead of a download
# initContainer that would crashloop. Set it (then `make d2 install models`)
# once a pipeline run has produced the artifact at that URI. The chart
# default stays an invalid placeholder (ADR-0547 clause 3).
# zuno_models_tekos_lora_source_s3_uri: "s3://zuno-mycluster-mlops/mlops/models/tekos/<run-id>/adapter"

# --- RAG corpus and SXA dump (ADR-0546/WP-131) -----------------------------
# Two buckets with opposite natures. zuno_rag_corpus_s3_* is this cluster's
# ingestion OUTPUT and belongs in zuno-<cluster>-data; the outputs are NOT
# migrated between clusters, each cluster re-ingests through its own pipeline
# (ADR-0546 clause 1), so pointing a new cluster here costs nothing.
# zuno_sxa_dump_* is a cross-cluster INPUT - the authoritative legacy export
# that seeds any cluster - and belongs in zuno-demo-sources under sxa-dump/.
#
# The dump's bucket and its two KEYS move together: the objects moved from the
# bucket root into an sxa-dump/ prefix, so changing only the bucket gives
# ingestion a 404 that reads as a missing dump rather than a misconfiguration.
# Omitting any of these keeps the chart default.
zuno_rag_corpus_s3_bucket: "zuno-mycluster-data"
zuno_rag_corpus_s3_region: "eu-west-2"
zuno_sxa_dump_s3_bucket: "zuno-demo-sources"
zuno_sxa_dump_s3_region: "eu-west-2"
zuno_sxa_dump_schema_s3_key: "sxa-dump/sxa.schema.sql"
zuno_sxa_dump_data_s3_key: "sxa-dump/sxa.data.sql"
# ADR-0546/WP-131: leave unset (chart default true) on a settled cluster. Set
# to false for the FIRST ingestion run after moving the corpus bucket: raw/ is
# empty in the new bucket, and detect-changes treats "in the manifest but not
# under raw/" as deleted - so one unreachable source would drop its documents
# from the pgvector index. Restore to true once a full run has repopulated
# raw/ and its object count matches the old bucket's.
zuno_rag_corpus_delete_orphans: true

# --- MLOps pipeline artifacts and training corpus (ADR-0546/WP-131) ---------
# Two DIFFERENT buckets on purpose, and the split is the whole point of
# ADR-0546: the pipeline artifacts are this cluster's OUTPUT and belong in
# zuno-<cluster>-mlops, while the style corpus is a cross-cluster INPUT that
# seeds any cluster and belongs in zuno-demo-sources. Deriving one from the
# other would re-merge the two natures the ADR separates.
# Omitting these keeps the chart defaults, which are the pre-ADR-0546 values.
zuno_mlops_s3_bucket: "zuno-mycluster-mlops"
zuno_mlops_s3_region: "eu-west-2"
zuno_mlops_style_corpus_s3_uri: "s3://zuno-demo-sources/training-corpus/qwen-wesh-training-corpus.tgz"

# --- MLflow artifact store (ADR-0546/WP-131) --------------------------------
# Where the MLflow tracking server writes run artifacts. Two independent
# literals in gitops/charts/mlflow used to carry this: server.artifactsDestination
# (a full s3:// URI on the cluster-singleton MLflow CR) and artifact.{bucket,
# endpoint,region,rootPath} (the per-workspace MLflowConfig artifact
# connection). They MUST move together - a mismatch makes the server serve
# artifacts from one bucket while the dashboard's workspace connection reads
# another, and nothing in either CR's status reports the divergence.
# Omitting these keeps the chart defaults, which are the pre-ADR-0546 values.
# The credential is still zuno_rag_s3_* (Vault zuno/rag/s3), whose IAM user
# holds a zuno* wildcard - which is why this bucket can move before ADR-0546
# clause 3's per-bucket identities exist.
zuno_mlflow_artifacts_s3_bucket: "zuno-mycluster-mlops"
zuno_mlflow_artifacts_s3_endpoint: "https://s3.eu-west-2.amazonaws.com"
zuno_mlflow_artifacts_s3_region: "eu-west-2"
zuno_mlflow_artifacts_s3_prefix: "mlflow-artifacts"

# --- AWS Route53 DNS-01 (ADR-0211: Let's Encrypt wildcard TLS) --------------
# Optional: leave "xxxxxx" and the aws/route53-dns01 Vault seed is skipped
# (the ACME issuers then can't validate - gitops/charts/cert-manager's
# acme.enabled should stay false until these are filled in).
# Create a DEDICATED least-privilege IAM user (never reuse admin creds):
#   1. IAM -> Users -> Create user (e.g. zuno-cert-manager-dns01),
#      programmatic access only, no console.
#   2. Attach this inline policy (scoped to the startx.fr hosted zone;
#      ListHostedZonesByName requires Resource "*" by API design):
#      {"Version": "2012-10-17", "Statement": [
#        {"Effect": "Allow",
#         "Action": ["route53:ChangeResourceRecordSets", "route53:GetChange"],
#         "Resource": ["arn:aws:route53:::hostedzone/Z3HY376RT1N9S1",
#                       "arn:aws:route53:::change/*"]},
#        {"Effect": "Allow",
#         "Action": ["route53:ListHostedZonesByName"],
#         "Resource": "*"}]}
#   3. Create an access key -> copy both values (secret shown once).
zuno_aws_route53_access_key_id: "xxxxxx"
zuno_aws_route53_secret_access_key: "xxxxxx"
#
# WP-118 B6 - which zone, which region, which mailbox. NOT secret: a public
# hosted zone and its ID are published DNS facts, and the contact address is
# printed in every issued certificate's ACME account. They live here anyway
# because they are per-environment operator configuration, exactly like the
# S3 endpoints above, and ADR-0517's from-scratch cluster needs its own.
#
# All three are OPTIONAL and default to gitops/charts/cert-manager/values.yaml
# (ansible/roles/cert_manager/tasks/install.yml reads the chart rather than
# restating the values, so there is one source of truth). Set them only when
# the target cluster sits under a different parent zone than startx.fr.
#
#   _hosted_zone_id  the Route53 hosted zone that answers for the cluster's
#                    parent domain - must be the SAME zone the IAM policy
#                    above is scoped to, or DNS-01 gets AccessDenied on
#                    ChangeResourceRecordSets while every other check passes.
#   _region          the Route53 API region for the DNS-01 solver. Route53 is
#                    global, but cert-manager still takes a region, and it is
#                    NOT necessarily the cluster's own region (demo222 runs in
#                    eu-west-2 and solves in eu-west-3).
#   zuno_certmanager_email  ACME account contact. Let's Encrypt mails expiry warnings
#                    here if renewal ever stalls; this repo has no
#                    Certificate-readiness alerting yet, so it is the only
#                    passive safety net (ADR-0211 flags that as future work).
#
# zuno_certmanager_route53_hosted_zone_id: "Z00000000000000000000"
# zuno_certmanager_route53_region: "eu-west-3"
# zuno_certmanager_email: "dev+zuno-acme@example.org"

# --- GitOps branch pin (ADR-0517 run / multi-cluster bring-up) --------------
# Which git revision every ArgoCD Application syncs its charts from. The
# committed manifests all say `targetRevision: main`; when this is set,
# ansible/tasks/apply_gitops_app.yml overrides spec.source.targetRevision at
# apply time on EVERY Application it touches. Use case: bootstrapping a new
# cluster from a work branch (e.g. demo333) so chart fixes made during the
# bring-up are live on the new cluster without touching main - the settled
# cluster keeps syncing main untouched. Remove it (and re-apply) once the
# branch is merged; leaving it pointing at a deleted branch turns every sync
# into a hard ComparisonError. Omitting it keeps the manifests' committed
# revision (main).
# zuno_gitops_target_revision: "main"

# --- S3 bucket ownership (ADR-0517 B12 / WP-130 probe P6) -------------------
#
# OPTIONAL and NOT secret. The short name of the cluster that owns the S3
# buckets configured in this file.
#
# ADR-0546 records the problem: seven buckets, none namespaced by cluster. Until
# WP-131 executes that decision, a second cluster installed from this repository
# writes its RAG ingestion outputs, pgBackRest and MariaDB backups, RHOAI traces
# and MLflow artifacts into the FIRST cluster's buckets - which damages the
# existing cluster, not the new one, and violates ADR-0517's own criterion that
# demo222 is left untouched.
#
# The realistic way that happens is the obvious one: copying a working
# confidential.yml onto the new cluster. Declaring the owner here lets
# `make d0 check` refuse the install instead, by comparing this value against the
# cluster name derived from the apps domain. Leave it unset and the probe stays
# silent - it has nothing to compare.
#
# zuno_s3_bucket_owner_cluster: "demo222"

# --- ACME rollout state (ADR-0211 staged rollout / ADR-0517 B11 / WP-132) ---
#
# All four OPTIONAL and NOT secret. They are the position of THIS cluster in
# ADR-0211's staged rollout, which is per-cluster by definition.
#
# They used to live in gitops/apps/cert-manager/application-d1.yaml, which meant
# demo222's finished state was committed to git and inherited by any new cluster
# on its first sync - and that combination is destructive, not merely wrong: the
# consumer patches point IngressController/default and the APIServer at
# Certificates that cannot exist before ACME has issued them, so Console and
# route serving break before the ACME track could ever succeed.
#
# Unset, they default to gitops/charts/cert-manager/values.yaml, which ships the
# safe START of the rollout: ACME off, staging issuer, both consumers off. Walk
# the rollout by setting them in order, verifying at each step - the sequence is
# documented in that chart's own acme comment:
#
#   1. zuno_certmanager_acme_enabled: true      (needs the aws/route53-dns01
#                                                Vault seed to exist first)
#   2. leave the staging issuer until `oc get certificate -A` shows all three
#      Ready - a staging rehearsal costs nothing and Let's Encrypt production
#      has rate limits a broken DNS-01 loop will exhaust
#   3. zuno_certmanager_issuer: "letsencrypt-route53"   (production cutover)
#   4. the two consumer flips, ONLY once the three production Certificates are
#      Ready with real Let's Encrypt chains
#
# The consumers are two variables and not one deliberately: each points a
# different control-plane surface (the default router certificate, the API
# server's named certificates) at a Secret, and that is not a place to be
# ambiguous about which one you just changed. Setting either while
# zuno_certmanager_acme_enabled is false is refused with a diagnostic.
#
# zuno_certmanager_acme_enabled: true
# zuno_certmanager_issuer: "letsencrypt-route53"
# zuno_certmanager_router_default_cert: true
# zuno_certmanager_api_server_named_cert: true

# --- OpenShift AI version pin (ADR-0517 B9 / WP-132) ------------------------
#
# OPTIONAL, and NOT secret - it is here because it is per-cluster operator
# configuration, like the Route53 identity above.
#
# The install refuses to approve an InstallPlan whose CSV differs from the
# pinned startingCSV (ansible/roles/openshift_ai/tasks/install.yml). That
# refusal is deliberate and stays: auto-approving whatever a catalog publishes
# is how a platform stops being reproducible. But a cluster provisioned later
# than the pin is legitimately offered a different build, so the version has to
# be recordable per cluster - and editing the chart is not that, because every
# Application renders from git main with selfHeal, so a chart edit changes every
# cluster at the next sync.
#
# Leave it unset and the pin is gitops/charts/openshift-ai/values.yaml's
# cluster-ods.operator.subscription.version (the platform's chosen build,
# 3.5.0 GA today). Set it only when THIS cluster's catalog cannot serve that
# version. `make d1 check openshift-ai` compares the effective pin against the
# channel head and prints the exact value to paste here.
#
# Version only, without the `rhods-operator.` prefix - startingCSV is built as
# `<subscription.operator.csv>.<version>`.
#
# zuno_openshift_ai_version: "3.5.0"

# --- LLM external provider API keys -----------------------------------------
# Each optional: leave "xxxxxx" and the ModelRouter fails over to the next
# eligible provider (the local model always works with none filled in).
#   OpenAI:    https://platform.openai.com/api-keys
#   Gemini:    https://aistudio.google.com/apikey
#   Anthropic: https://console.anthropic.com/settings/keys
#   Mistral:   https://console.mistral.ai/api-keys
zuno_llm_provider_openai_api_key: "xxxxxx"
zuno_llm_provider_gemini_api_key: "xxxxxx"
zuno_llm_provider_anthropic_api_key: "xxxxxx"
zuno_llm_provider_mistral_api_key: "xxxxxx"

# ADR-0417: Codestral, Mistral's code-specialized model - a DEDICATED
# key/project, separate from zuno_llm_provider_mistral_api_key above, so
# Codestral running low on credits is a distinguishable event from
# mistral-large-latest doing so.
#   Mistral (Codestral): https://console.mistral.ai/api-keys
zuno_llm_provider_mistral_codestral_api_key: "xxxxxx"

# ADR-0415: image-generation provider (stable-diffusion-xl via OVHcloud AI
# Endpoints) - used by arkos/advantage/cognos/comage's generate_image tool.
# Create a Public Cloud project with a payment method attached, then
# AI & Machine Learning -> AI Endpoints -> Generate my first access Key.
#   OVHcloud: https://www.ovhcloud.com/en/public-cloud/ai-endpoints/
zuno_llm_provider_ovhcloud_api_key: "xxxxxx"

zuno_admin_mainpwd: "AbcdeF_Ghi123"

# --- AAP Red Hat subscription activation (ADR-0354/WP-072 follow-up) -------
# Set true to auto-activate AAP's Red Hat subscription at the end of
# `make d0 install aap` (the Gateway/Controller "Subscription" screen
# equivalent) using a Red Hat account (access.redhat.com login, NOT an
# activation key/manifest). On AAP 2.7 a single authenticated POST to
# /api/controller/v2/config/ with these credentials validates the account
# and attaches its matching entitlement directly (confirmed live
# 2026-08-25). Hard-fails `make d0 install aap` if enabled but the
# credentials are wrong/missing or the API is unreachable - aap precedes
# aap-config in Day 0 and everything in Day 1 (ADR-0421), so this
# deliberately blocks the rest of the sequence until the subscription is
# resolved.
# The username/password values are consumed via the standard ADR-0024
# chain (seeded to Vault zuno/aap/rhn by `make d0 install vault`, then
# read from the aap-rhn-credentials Secret by the aap role) - after
# changing them here, re-run `make d0 install vault` before
# `make d0 install aap`. Only the zuno_aap_enabled flag is read directly.
zuno_aap_enabled: false
zuno_aap_rhn_username: "xxxxxx"
zuno_aap_rhn_password: "xxxxxx"

# --- AAP execution routing (ADR-0418 clause 6/WP-097) -----------------------
# Controls whether `make day1|d1`/`make day2|d2 <verb>` launch the matching
# AAP Workflow Template (WP-095) and `make day3|d3 <verb>` launches its Job
# Template (WP-094), instead of running `ansible-playbook` directly from
# this shell:
#   - local  - never routes through AAP (today's behavior, unconditionally).
#     Always safe, works with no AAP instance at all.
#   - remote - always routes through AAP; FAILS the make invocation if the
#     Gateway API is unreachable (no silent fallback - an explicit choice
#     to depend on AAP for that one invocation).
#   - auto   - probes AAP's Gateway API first (ansible/playbooks/
#     aap_probe.yml); routes through AAP if reachable, otherwise falls back
#     to `local` silently (one warning line) - AAP must never become a
#     single point of failure for operators who need to run these verbs
#     (ADR-0418 clause 1's Consequences). Default.
# `day0`'s own verbs and `uninstall`/`reinstall` (any day) are NEVER routed
# through AAP regardless of this setting - Day 0 installs `aap` itself
# (chicken-and-egg, ADR-0421), and destructive verbs stay Phase-4-gated
# (ADR-0418), unimplemented as AAP Job Templates at all.
zuno_make_aap_mode: auto

# --- OpenShift AI MaaS gateway API key (ADR-0201/WP-27) ------------------
# Minted by MaaS itself once a MaaSSubscription/key-request flow runs on
# the live cluster (Vault path maas/gateway-api-key; consumed by
# ai-gateway's ExternalSecret llm-provider-maas, which only renders once
# maasAdapter.enabled is true). Chicken-and-egg by design: enable MaaS,
# mint the key via its API, paste it here, re-run `make d0 install vault`.
zuno_maas_gateway_api_key: "xxxxxx"
