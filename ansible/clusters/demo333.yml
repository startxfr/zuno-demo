    - product:openshift-ai
    git:
      url: https://github.com/opendatahub-io/opendatahub-documentation
      ref: main
      metadata:
        product: Red Hat OpenShift AI Self-Managed (from the Open Data Hub docs)
        version: 3.x (main, March 2026)
