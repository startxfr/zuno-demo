  retrievers:
  - config:
      # WEB too: the sales-demo source (knowledge.sales) is a web source.
      extra_source_types:
      - WEB
      forward_user_token: true
      source_type: CONFLUENCE
      threshold: 0.3
      top_k_results: 5
    name: knowledge-comage
    teamRef: agent-comage
  - config:
      forward_user_token: true
      # GIT too (R-530, 2026-11-08): the OpenShift, RHACM and RHOAI/ODH documentation read from git (tag knowledge.tech).
      extra_source_types:
      - WEB
      - GIT
      source_type: CONFLUENCE
      threshold: 0.3
      # 10, not 5 (2026-10-25): the Red Hat corpus repeats each page across
      # OCP 4.21/4.22 and two URL forms, so 5 slots held 2-3 distinct
      # passages and missed definitional ones (tekos scenario #11).
      top_k_results: 10
    name: knowledge-tekos
    teamRef: agent-tekos
  - config:
      forward_user_token: true
      source_type: CONFLUENCE
      threshold: 0.3
      top_k_results: 5
    name: knowledge-arkos
    teamRef: agent-arkos
  stack:
    identity:
      oidcClaims: true
    images:
      # Third-party images (ADR-0586 clause 7): pinned by digest, NOT signed, their
      # publishers do not sign them. A digest is the manifest list of the tag that
      # ran when it was pinned (2026-10-25), so the running image does not change.
      # rabbitmq is bitnamilegacy, which receives no more updates (replacing it is
      # a separate decision); temporal ran `latest`, now frozen at this digest.
      docling: quay.io/docling-project/docling-serve-cpu@sha256:6eda9c524992147c1b0b06a1a9be4894bd68b1f43c86d92c32f996c4c60d18a3  # v1.37.0
      mongodb: docker.io/library/mongo@sha256:8565ecda5b221016d70f7745ac1ba0b97ccb05836157f8a343e987338fdc8350  # 8.0.3
      qdrant: docker.io/qdrant/qdrant@sha256:1005201498cf927d835383d0f918b17d8c9da7db58550f169f694455e42d78f4  # v1.16.0
      rabbitmq: docker.io/bitnamilegacy/rabbitmq@sha256:f31a9990bba3aec8bf2948a4a237e3656e54d2d53f4ecd4495ce044191cb5beb  # 4.0.5-debian-12-r0
      redis: quay.io/fedora/redis-7@sha256:0217e8a80a03c3e43c716a1c137e5e615c6bc583605a754000f6efa382349a5b  # 20250108
      redisInsight: docker.io/redis/redisinsight@sha256:85562d67a9128ac7f764bb3d1ac909fcf77708c7c8f55bd1605a85b3c4becc83  # 3.4.2
      temporal: docker.io/temporalio/temporal@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e  # was latest
      backend: quay.io/zuno/unifai-backend@sha256:2d628513bbb9321b3db017fbfa8e44af65c94cdd5c865d21e8a1dbf79875890e  # v0.1.68
      identity: quay.io/zuno/unifai-identity@sha256:b77cc554254b71e03b3a2ffe4cfde95038350d83d3c11bfe437c89f2b0c823cd  # v0.1.68
      multiagent: quay.io/zuno/unifai-multiagent@sha256:87657395e7375c0c3aa589aa0e2ca1af6b49fad58abd5cbb8b957e475959039e  # v0.1.68
      rag: quay.io/zuno/unifai-rag@sha256:919982f7816b0b0b44317a0751b844f42b603121d5ca9527dedecd19595b7727  # v0.1.68
      ui: quay.io/zuno/unifai-ui@sha256:f214c180b54e637c68f084f0c2e0389d0a8cec3d4e3809165e04985114d8afee  # v0.1.68
      # Reranker (Hugging Face TEI on CPU, upstream image, unsigned): pinned by digest like the other third-party images (tag cpu-1.9, 2026-10-31).
      reranker: ghcr.io/huggingface/text-embeddings-inference@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d  # cpu-1.9
    backup:
      # The CronJobs and restore Jobs (ADR-0586 clause 7): pinned by digest, unsigned,
      # the manifest list of the tag that ran (aws-cli 2.22.35, mongo 7.0.16).
      images:
        awsCli: public.ecr.aws/aws-cli/aws-cli@sha256:71a65c33c30e36dbfdff15707514f3b7b6fc789f2f134722f959b5cd13b93dd5  # 2.22.35
        mongo: docker.io/library/mongo@sha256:c630c59342c1493d50345136df2af14a76b9e827dd5316bfabee07a0880a5f3a  # 7.0.16
    resources:
      reranker:
        requests: {cpu: '1', memory: 1Gi}
        limits: {cpu: '4', memory: 4Gi}
    rag:
      tokenReview: true
      # Layer 4c reranker OFF (2026-10-31, closed): three CPU rerankers were tried on the French Red Hat set and none matched
      # DBSF alone (0.71/0.86/0.77): bge-reranker-base timed out (~0.9 s per candidate), the English MiniLM got 0.62/0.86/0.70,
      # the multilingual mmarco-mMiniLMv2 got 0.67/0.86/0.75 (2.9 s for 10 candidates, no score threshold separates the
      # unanswerable questions). To retry: reranker: {mode: deploy, model: <model>, candidates: <n>}; the image and
      # resources keys stay, unused while rag.reranker is unset.
    ragClients:
    - namespace: zuno-ai-run
      podLabels:
        zuno.io/rag-client: 'true'
    version: devel-ffb64e335
  redhatDocs:
    enabled: true
    syncInterval: 168h
    classification: C1   # WP-187: public Red Hat documentation
    # Suspended 2026-11-03 (user decision): docs.redhat.com answers 403 Access Denied (Akamai) to the crawler on every page, probably after
    # two full crawls in 75 minutes. No crawl and no resync of any Red Hat source until the user lifts this (remove the line, then make d2 install unifai).
    suspend: true

# WP-157 live enable sequence (user go 2026-10-24, one step at a time, each
# verified before the next; brief "Decisions of 2026-10-24" and Progress).
# Step 1: the ai-gateway presents its ServiceAccount to MaaS with attested
# headers. The token-quota policy, the 429 pass-through and the fail modes
# stay off until their own go.
zuno_ai_gateway_maas_gateway_identity: true
# Step B (user go 2026-10-24, after step A): a MaaS 429 is answered to the
# caller with Retry-After instead of falling back, and the fail modes are
# enforced (fail-open on a Limitador outage, with a warning). Taken with the
# per-user ceiling NOT proven: on 2026-10-24 only the group counter was seen
# counting live (brief Progress); the user ceiling is not to be advertised.
zuno_ai_gateway_maas_quota_429_passthrough: true
zuno_ai_gateway_quota_fail_modes: true
# WP-157 inventory V13 (user go 2026-10-24): a `closed` quota class
# (stresstest, intensive) is served only through MaaS, so it is refused
# rather than answered by a direct SaaS fallback when MaaS fails. Needs the
# image built from 18cc412e or later (ai-gateway-21).
zuno_ai_gateway_closed_class_maas_only: true
# WP-177 (user go 2026-10-25): the ai-gateway's token-budget ledger also keeps
# its counters in the platform Redis, so a restart no longer resets the
# budgets. Needs the image built from c5ca1b40 or later (ai-gateway-25).
zuno_ai_gateway_quota_ledger_store: redis
# WP-164 lots 2 and 3 (user go 2026-10-31): mount the model-routing policy and
# the per-agent guardrail modes generated from the agents release. Needs the
# image built from b1facfc2 or later (ai-gateway-28).
zuno_ai_gateway_model_routing_generated: true
zuno_ai_gateway_guardrails_modes_generated: true
# ADR-0565 clause 5 (WP-209, user go 2026-11-07): mount the per-agent/task
# classification floors generated from the agents release. A header-less call
# stays C1 (zuno_ai_gateway_classification_default_when_absent unset, user
# decision) and the per-client floor stays empty. Needs an image from 4a214782
# or later.
zuno_ai_gateway_classification_floors_generated: true
# ADR-0610 (WP-244, user go 2026-11-07 for the weekend rush): every call of the Blender add-on (Keycloak
# client `blender`, never an agent, so none of its calls names a known agent) is at least C3: only local
# models answer it.
zuno_ai_gateway_classification_client_floors:
  blender: C3
# ADR-0610 (WP-244): admit zuno-agent-gateway in the ai-gateway's NetworkPolicy; pairs with
# zuno_connectivity_link_workstation_entry below.
zuno_ai_gateway_workstation_entry: true
# ADR-0511/ADR-0528 (2f981d17): Keycloak clients whose calls may set a
# non-standard quota class and a project id. Only zuno-stresstest, the
# confidential, password-grant-only client of the day-3 stresstest Jobs,
# whose token-budget proof forces the `stresstest` class. zuno-evaluations
# (RAGAS, probes, the acceptance gate) is not trusted: its personas get the
# `evaluation` class from their group. User-facing clients are never listed.
zuno_ai_gateway_trusted_platform_clients:
  - zuno-stresstest
# ADR-0602 clause 10 (WP-225 lot C, user go 2026-11-11): only the Keycloak clients that carry the zuno-admin-api audience
# (read from the live realm on 2026-11-11: 10 clients) may call the ai-gateway. A forgotten client gets a 401: empty
# this list and re-run `make d2 install llm` to go back to "any client of the realm".
zuno_ai_gateway_jwt_allowed_clients:
  - unifai
  - open-webui
  - dify
  - kagent
  - world-model
  - blender
  - openclaw-*
  - zuno-evaluations
  - zuno-stresstest
  - zuno-admin-api
# ADR-0591 (WP-188, user go 2026-11-02): skip local models whose
# LLMInferenceService is not Ready, and providers that just failed, instead of
# waiting 180 s per *-maas candidate (GPU nodes down that day). Needs
# ai-gateway build 31 (cf774982) or later.
zuno_ai_gateway_model_readiness: true
zuno_ai_gateway_circuit_breaker: true
# Step C (user go 2026-10-24, after step B verified): the SaaS models'
# MaaS subscriptions and auth policies keep only the ai-gateway
# ServiceAccount; the /agent_tekos and /sales persona grants go (inventory
# finding 6). Rendered diff checked against the live values first.
zuno_models_saas_subscriptions_gateway_only: true
# Step A (user go 2026-10-24): the gateway-level token quota policy on the
# MaaS gateway, generated from the release (stacked ceilings standard-user
# 3M/24h, standard-group 30M/24h, counted on the ai-gateway's attested
# headers, only for its ServiceAccount). d1 only. Its Application moves from
# main to devel (zuno_gitops_target_revision, now loaded by the role), whose
# connectivity-link render is otherwise identical (checked 2026-10-24 with
# the live values).
# WP-195 step 6 (2026-11-05): OFF. With RHOAI 3.6 each local model route has 15
# matches, and Kuadrant expands a gateway-level policy into one wasm action
# set per match (68 sets). The EnvoyFilter then exceeds etcd's request limit
# ("request is too large"), the operator stops updating it, and the
# per-route maas-trlp-* subscription limits never reach the shim, so no MaaS
# counter moves. The ai-gateway ledger keeps the user and group ceilings.
# Upstream: Kuadrant/kuadrant-operator #2353, #2051. Turn back on only when
# the EnvoyFilter fits with it.
zuno_connectivity_link_token_rate_limits:
  enabled: false
  targetGateway:
    name: maas-default-gateway
    namespace: openshift-ingress
  attachment: defaults
  gatewayIdentity:
    username: system:serviceaccount:zuno-ai-run:ai-gateway
# WP-195 step 3 (2026-11-04): RHOAI pinned to the head of stable-3.5. From an
# installed 3.5.0, `make d1 install openshift-ai` walks 3.5.1 then 3.5.2
# (upgrade_walk.yml), approving no InstallPlan past this pin.
# WP-195 step 6 (2026-11-05, user decision): forced EA install. The beta
# channel's 3.6.0-ea.2 has no upgrade edge from 3.5.2, so the CSV and
# Subscription are deleted once by hand (see WP-195). No rollback.
zuno_openshift_ai_version: "3.6.0-ea.2"
# WP-195 step 4a (2026-11-04): rhcl 1.4.3 -> 1.4.4 on stable-1.4. Step 4b
# (2026-11-05, user go): 1.4.4 -> 1.5.0 on stable-1.5 (skipRange >=1.4.4).
# 1.5 deploys authorino/limitador/dns itself and removes their OLM
# Subscriptions and CSVs at startup; there is no way back to 1.4.
zuno_connectivity_link_channel: "stable-1.5"
# WP-195 step 5 / K2 (2026-11-05): kueue 1.4.3 -> 1.5.0. stable-v1.5 has no
# edge from 1.4, so the switch is followed by deleting CSV kueue-operator.v1.4.3
# by hand (CRDs, CRs and the operand stay); see the WP-195 K2 plan.
zuno_kueue_channel: "stable-v1.5"

# ADR-0608 clause 6 (WP-241): `make d3 check drift` fails on any finding. Switched on 2026-11-07 after the first
# clean run (nfs-provisioner adopted, ECK listed in platform/drift/external-operators.yaml until its removal).
zuno_drift_strict: true

# WP-225 lot C, rollout step 2 (user's go 2026-11-07): the ai-gateway verifies the a2a-gateway's
# signed agent chain. The public half of Vault a2a/agent-chain; a chain-less call keeps today's behaviour.
zuno_ai_gateway_agent_chain_verify: true
# WP-247 lot 2: the public half of the Vault Transit key agent-chain (the private half never leaves Vault).
zuno_ai_gateway_agent_chain_public_key: |
  -----BEGIN PUBLIC KEY-----
  MCowBQYDK2VwAyEAT/I4wgI087mkIC5Pl4R2a5wOVQN9VlrJQ+E/B6fWYz8=
  -----END PUBLIC KEY-----
# ADR-0611/WP-246: the gateways' okf-fetch reads the admitted OKF release from the in-cluster mirror
# (roles/okf_mirror) first and falls back to the source registry. Plain HTTP inside the mesh (mTLS).
zuno_okf_registry_mirror: "okf-mirror.zuno-ai-run.svc:5000/okf"
