---
# ADR-0517 live finding (demo333, 2026-09-07): committed per-cluster
# NON-SECRET configuration, loaded by ansible/tasks/load_cluster_vars.yml
# from the cluster short name resolve_cluster_name.yml derives.
#
# Why this file exists: since ADR-0354/WP-094 the day1/2/3 make verbs run
# inside AAP from the Project's SCM checkout, where ansible/confidential.yml
# does not exist (gitignored). Every role that injected a confidential
# per-cluster value into an Application's Helm values therefore fell back
# to its ADR-0547 noisy placeholder under AAP (models' modelsS3.bucket
# reached the live Application as ZUNO_S3_BUCKET_NOT_SET) - or, worse,
# silently disabled a feature (mariadb S3 backups). Bucket names, regions
# and prefixes are not secrets: committing them per cluster gives every
# checkout - workstation and AAP - the same truth.
#
# Precedence: this file is loaded BEFORE ansible/confidential.yml, so a
# value set in confidential.yml still overrides it locally. Real secrets
# (access keys, passwords) NEVER belong here - they stay in
# confidential.yml and reach the cluster through Vault seeding + ESO.
zuno_models_s3_bucket: "zuno-demo-sources"
zuno_models_s3_prefix: "models"
# zuno_models_tekos_lora_source_s3_uri deliberately unset: a from-scratch
# cluster has no adapter until its own mlops pipeline produces one
# (ansible/roles/models/tasks/install.yml renders loraAdapters: [] then).
zuno_mlflow_artifacts_s3_bucket: "zuno-demo333-mlops"
zuno_mlflow_artifacts_s3_endpoint: "https://s3.eu-central-1.amazonaws.com"
zuno_mlflow_artifacts_s3_region: "eu-central-1"
zuno_mlflow_artifacts_s3_prefix: "mlflow-artifacts"
zuno_mlops_s3_bucket: "zuno-demo333-mlops"
zuno_mlops_s3_region: "eu-central-1"
zuno_mlops_style_corpus_s3_uri: "s3://zuno-demo-sources/training-corpus/qwen-wesh-training-corpus.tgz"
zuno_mariadb_backup_s3_bucket: "zuno-demo333-backups"
zuno_mariadb_backup_s3_prefix: "mariadb"
zuno_mariadb_backup_s3_endpoint: "s3.eu-central-1.amazonaws.com"
zuno_mariadb_backup_s3_region: "eu-central-1"

# Images on demo333 are built from the devel branch (the single working
# branch since 2026-10-23, when demo222 and demo333 were merged into it), not
# main, which is a release branch fast-forwarded by hand. The first build-role
# run after this change rebuilds each image from devel.
zuno_build_git_ref: "devel"

# UnifAI stack on demo333 (WP-154/WP-168): the non-secret overrides that were
# only kept in a private vars file until now. They are deep-merged over the
# role defaults by ansible/roles/unifai (zuno_unifai_values); bundle settings
# are per agent (zuno_unifai_bundle_settings). The application images are the
# CI-built, signed devel-<sha> images, pinned by digest. No secret belongs here.
# Verification of the UnifAI images (ADR-0586, WP-176): ON. The `unifai` role
# refuses to apply a stack image whose digest is not signed by the fork's publish
# workflow (accept dev signatures true, because demo333 runs the devel branch).
zuno_unifai_verify_images: true
zuno_unifai_accept_dev_signatures: true
# Cluster-side admission of the UnifAI images (WP-178): the Sigstore policy-controller REFUSES a pod of
# quay.io/zuno/unifai-** in zuno-unifai and unifai-operator whose image is not signed by an identity of
# platform/supply-chain/image-identities.yaml (the third-party services stay `warn`). Applied by `make d1 install
# rhtas-config`. Back to warn: set this to `warn` and re-run; at once: `oc label namespace zuno-unifai
# policy.rhtas.com/include-` (docs/platform/operations.md).
zuno_unifai_admission_mode: enforce
# The catalog (d0) is verified like the stack images (WP-176 step 6): since operator
# 0.1.39 the operator, its bundle and its catalog carry the operator release workflow's
# identity. This cluster's CatalogSource was applied by hand with `:latest`, so the role
# also pins its spec.image to the verified catalog digest (pin_catalog.yml) and the
# drift check reads it.
zuno_unifai_verify_catalog: true

zuno_unifai_bundle_settings:
  advantage:
    entitlement: Enforced
    groupTeam: true
    retriever: knowledge-advantage
  arkos:
    entitlement: Enforced
    groupTeam: true
    retrieveFirst: true
    retriever: knowledge-arkos
  comage:
    entitlement: Enforced
    groupTeam: true
    retrieveFirst: true
    retriever: knowledge-comage
  finage:
    entitlement: Enforced
    groupTeam: true
    retriever: knowledge-finage
  naveo:
    entitlement: Enforced
    groupTeam: true
    retriever: knowledge-naveo
  tekos:
    classificationOverrides:
      answer-technical-question: C2
    entitlement: Enforced
    groupTeam: true
    retrieveFirst: true
    retriever: knowledge-tekos
zuno_unifai_released_bundles: true
zuno_unifai_released_bundles_exclude: []
zuno_unifai_values:
  ragSources:
  - aclGroups:
    - consultant/confluence-archi-satellite
    - consultant/confluence-build-satellite
    - consultant/confluence-run-satellite
    confluence:
      baseUrl: https://startxfr.atlassian.net
      excludeLabels:
      - obsolete
      rootTitle: 'Technologie : Satellite'
      spaceKey: SXSI
    name: tekos-satellite
    syncInterval: 6h
    tags:
    - knowledge.tech
    type: confluence
    visibility: shared
  - aclGroups:
    - consultant/confluence-archi-openshift
    - consultant/confluence-build-openshift
    - consultant/confluence-run-openshift
    confluence:
      baseUrl: https://startxfr.atlassian.net
      excludeLabels:
      - obsolete
      rootTitle: 'Technologie : Openshift'
      spaceKey: SXSI
    name: tekos-openshift
    syncInterval: 6h
    tags:
    - knowledge.tech
    type: confluence
    visibility: shared
  - name: sales-demo
    # Synthetic French sales pages ("données de démonstration") for comage's knowledge.sales: the pages live in this
    # repository (gitops/charts/unifai/files/sales-corpus/) and are read from GitHub raw, because the RAG web connector
    # refuses cluster-internal addresses on purpose (SSRF guard), so an in-cluster static server cannot be crawled.
    type: web
    visibility: public
    tags:
    - knowledge.sales
    syncInterval: 168h
    web:
      crawl: none
      maxPages: 12
      metadata:
        family: sales-demo
        language: fr
      urls:
          - https://raw.githubusercontent.com/startxfr/zuno-demo/devel/gitops/charts/unifai/files/sales-corpus/bon-de-commande.html
          - https://raw.githubusercontent.com/startxfr/zuno-demo/devel/gitops/charts/unifai/files/sales-corpus/calendrier-facturation.html
          - https://raw.githubusercontent.com/startxfr/zuno-demo/devel/gitops/charts/unifai/files/sales-corpus/escalade-validation.html
          - https://raw.githubusercontent.com/startxfr/zuno-demo/devel/gitops/charts/unifai/files/sales-corpus/fiche-formation.html
          - https://raw.githubusercontent.com/startxfr/zuno-demo/devel/gitops/charts/unifai/files/sales-corpus/fiche-support-openshift.html
          - https://raw.githubusercontent.com/startxfr/zuno-demo/devel/gitops/charts/unifai/files/sales-corpus/glossaire-ventes.html
          - https://raw.githubusercontent.com/startxfr/zuno-demo/devel/gitops/charts/unifai/files/sales-corpus/index.html
          - https://raw.githubusercontent.com/startxfr/zuno-demo/devel/gitops/charts/unifai/files/sales-corpus/opportunite-acme-renewal.html
          - https://raw.githubusercontent.com/startxfr/zuno-demo/devel/gitops/charts/unifai/files/sales-corpus/politique-remises.html
          - https://raw.githubusercontent.com/startxfr/zuno-demo/devel/gitops/charts/unifai/files/sales-corpus/processus-renouvellement.html
          - https://raw.githubusercontent.com/startxfr/zuno-demo/devel/gitops/charts/unifai/files/sales-corpus/qualification-opportunite.html
          - https://raw.githubusercontent.com/startxfr/zuno-demo/devel/gitops/charts/unifai/files/sales-corpus/reponses-objections.html
  retrievers:
  - config:
      # WEB too: the sales-demo source (knowledge.sales) is a web source.
      extra_source_types:
      - WEB
      forward_user_token: true
      source_type: CONFLUENCE
      threshold: 0.3
      top_k_results: 5
    name: knowledge-comage
    teamRef: agent-comage
  - config:
      forward_user_token: true
      extra_source_types:
      - WEB
      source_type: CONFLUENCE
      threshold: 0.3
      # 10, not 5 (2026-10-25): the Red Hat corpus repeats each page across
      # OCP 4.21/4.22 and two URL forms, so 5 slots held 2-3 distinct
      # passages and missed definitional ones (tekos scenario #11).
      top_k_results: 10
    name: knowledge-tekos
    teamRef: agent-tekos
  - config:
      forward_user_token: true
      source_type: CONFLUENCE
      threshold: 0.3
      top_k_results: 5
    name: knowledge-arkos
    teamRef: agent-arkos
  stack:
    identity:
      oidcClaims: true
    images:
      # Third-party images (ADR-0586 clause 7): pinned by digest, NOT signed, their
      # publishers do not sign them. A digest is the manifest list of the tag that
      # ran when it was pinned (2026-10-25), so the running image does not change.
      # rabbitmq is bitnamilegacy, which receives no more updates (replacing it is
      # a separate decision); temporal ran `latest`, now frozen at this digest.
      docling: quay.io/docling-project/docling-serve-cpu@sha256:6eda9c524992147c1b0b06a1a9be4894bd68b1f43c86d92c32f996c4c60d18a3  # v1.37.0
      mongodb: docker.io/library/mongo@sha256:8565ecda5b221016d70f7745ac1ba0b97ccb05836157f8a343e987338fdc8350  # 8.0.3
      qdrant: docker.io/qdrant/qdrant@sha256:1005201498cf927d835383d0f918b17d8c9da7db58550f169f694455e42d78f4  # v1.16.0
      rabbitmq: docker.io/bitnamilegacy/rabbitmq@sha256:f31a9990bba3aec8bf2948a4a237e3656e54d2d53f4ecd4495ce044191cb5beb  # 4.0.5-debian-12-r0
      redis: quay.io/fedora/redis-7@sha256:0217e8a80a03c3e43c716a1c137e5e615c6bc583605a754000f6efa382349a5b  # 20250108
      redisInsight: docker.io/redis/redisinsight@sha256:85562d67a9128ac7f764bb3d1ac909fcf77708c7c8f55bd1605a85b3c4becc83  # 3.4.2
      temporal: docker.io/temporalio/temporal@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e  # was latest
      backend: quay.io/zuno/unifai-backend@sha256:fa2731d5880cda5ea8440c226006f776f11b4146308871c6ae2a96b42715d8bb  # devel-b48dea199
      identity: quay.io/zuno/unifai-identity@sha256:b25acf2f51a2e34b5de7f8d6e5b3b7a7c7302840a84fc6e6d9ba2f18d59d57d7  # devel-b48dea199
      multiagent: quay.io/zuno/unifai-multiagent@sha256:cd69bff09b151ce5fe62fe88b38f0170cff5a84d12fa42686df201a0bfa59403  # devel-b48dea199
      rag: quay.io/zuno/unifai-rag@sha256:e26f8b54dad132b01a88fd692b3b7fcbcc23183344306c149ea5a77ebf79c15e  # devel-b48dea199
      ui: quay.io/zuno/unifai-ui@sha256:a602d924261a6e1f3ce45ebb3d4decee517038a7f5e92f203c371e966e5bdeee  # devel-b48dea199
    backup:
      # The CronJobs and restore Jobs (ADR-0586 clause 7): pinned by digest, unsigned,
      # the manifest list of the tag that ran (aws-cli 2.22.35, mongo 7.0.16).
      images:
        awsCli: public.ecr.aws/aws-cli/aws-cli@sha256:71a65c33c30e36dbfdff15707514f3b7b6fc789f2f134722f959b5cd13b93dd5  # 2.22.35
        mongo: docker.io/library/mongo@sha256:c630c59342c1493d50345136df2af14a76b9e827dd5316bfabee07a0880a5f3a  # 7.0.16
    rag:
      tokenReview: true
    ragClients:
    - namespace: zuno-ai-run
      podLabels:
        zuno.io/rag-client: 'true'
    version: devel-ffb64e335
  redhatDocs:
    enabled: true
    syncInterval: 168h

# WP-157 live enable sequence (user go 2026-10-24, one step at a time, each
# verified before the next; brief "Decisions of 2026-10-24" and Progress).
# Step 1: the ai-gateway presents its ServiceAccount to MaaS with attested
# headers. The token-quota policy, the 429 pass-through and the fail modes
# stay off until their own go.
zuno_ai_gateway_maas_gateway_identity: true
# Step B (user go 2026-10-24, after step A): a MaaS 429 is answered to the
# caller with Retry-After instead of falling back, and the fail modes are
# enforced (fail-open on a Limitador outage, with a warning). Taken with the
# per-user ceiling NOT proven: on 2026-10-24 only the group counter was seen
# counting live (brief Progress); the user ceiling is not to be advertised.
zuno_ai_gateway_maas_quota_429_passthrough: true
zuno_ai_gateway_quota_fail_modes: true
# WP-157 inventory V13 (user go 2026-10-24): a `closed` quota class
# (stresstest, intensive) is served only through MaaS, so it is refused
# rather than answered by a direct SaaS fallback when MaaS fails. Needs the
# image built from 18cc412e or later (ai-gateway-21).
zuno_ai_gateway_closed_class_maas_only: true
# WP-177 (user go 2026-10-25): the ai-gateway's token-budget ledger also keeps
# its counters in the platform Redis, so a restart no longer resets the
# budgets. Needs the image built from c5ca1b40 or later (ai-gateway-25).
zuno_ai_gateway_quota_ledger_store: redis
# WP-164 lots 2 and 3 (user go 2026-10-31): mount the model-routing policy and
# the per-agent guardrail modes generated from the agents release. Needs the
# image built from b1facfc2 or later (ai-gateway-28).
zuno_ai_gateway_model_routing_generated: true
zuno_ai_gateway_guardrails_modes_generated: true
# ADR-0511/ADR-0528 (2f981d17): Keycloak clients whose calls may set a
# non-standard quota class and a project id. Only zuno-stresstest, the
# confidential, password-grant-only client of the day-3 stresstest Jobs,
# whose token-budget proof forces the `stresstest` class. zuno-evaluations
# (RAGAS, probes, the acceptance gate) is not trusted: its personas get the
# `evaluation` class from their group. User-facing clients are never listed.
zuno_ai_gateway_trusted_platform_clients:
  - zuno-stresstest
# Step C (user go 2026-10-24, after step B verified): the SaaS models'
# MaaS subscriptions and auth policies keep only the ai-gateway
# ServiceAccount; the /agent_tekos and /sales persona grants go (inventory
# finding 6). Rendered diff checked against the live values first.
zuno_models_saas_subscriptions_gateway_only: true
# Step A (user go 2026-10-24): the gateway-level token quota policy on the
# MaaS gateway, generated from the release (stacked ceilings standard-user
# 3M/24h, standard-group 30M/24h, counted on the ai-gateway's attested
# headers, only for its ServiceAccount). d1 only. Its Application moves from
# main to devel (zuno_gitops_target_revision, now loaded by the role), whose
# connectivity-link render is otherwise identical (checked 2026-10-24 with
# the live values).
zuno_connectivity_link_token_rate_limits:
  enabled: true
  targetGateway:
    name: maas-default-gateway
    namespace: openshift-ingress
  attachment: defaults
  gatewayIdentity:
    username: system:serviceaccount:zuno-ai-run:ai-gateway
