---
# Group memberships of existing realm users that realm-zuno.json cannot apply: the realm import is create-only, so a
# user added to a group in the file stays as it was on a live realm (the open_webui role does the same for
# openwebui_admin, keycloak_admin_group.yml). This adds, idempotently and over the Admin REST API, each listed user to
# each listed group, creating the group when missing. Nothing is ever removed.
#
# Input: keycloak_persona_memberships, a list of {username: <user>, groups: [<group name>, ...]} (top-level groups).
# The caller sets it; a user absent from the realm is skipped and reported, not an error.
- name: "keycloak | persona memberships | read the automation credentials (ADR-0595)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/read_keycloak_automation_credentials.yml"

- name: "keycloak | persona memberships | get an admin token"
  ansible.builtin.uri:
    url: "{{ zuno_keycloak_admin_token_url }}"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: admin-cli
      username: "{{ _kc_automation_user }}"
      password: "{{ _kc_automation_password }}"
    validate_certs: "{{ zuno_validate_route_certs | default(false) | bool }}"
  register: _kcpm_token
  no_log: true

- name: "keycloak | persona memberships | set the admin API facts"
  ansible.builtin.set_fact:
    _kcpm_api: "{{ zuno_keycloak_url }}/admin/realms/{{ zuno_keycloak_realm }}"
    _kcpm_headers:
      Authorization: "Bearer {{ _kcpm_token.json.access_token }}"
  no_log: true

- name: "keycloak | persona memberships | the distinct groups to hold"
  ansible.builtin.set_fact:
    _kcpm_group_names: "{{ keycloak_persona_memberships | map(attribute='groups') | flatten | unique | list }}"

- name: "keycloak | persona memberships | look up each group"
  ansible.builtin.uri:
    url: "{{ _kcpm_api }}/groups?search={{ item }}&exact=true"
    headers: "{{ _kcpm_headers }}"
    validate_certs: "{{ zuno_validate_route_certs | default(false) | bool }}"
  loop: "{{ _kcpm_group_names }}"
  register: _kcpm_groups
  no_log: true

- name: "keycloak | persona memberships | create the groups that are missing"
  ansible.builtin.uri:
    url: "{{ _kcpm_api }}/groups"
    method: POST
    headers: "{{ _kcpm_headers }}"
    body_format: json
    body: {name: "{{ item.item }}"}
    status_code: [201]
    validate_certs: "{{ zuno_validate_route_certs | default(false) | bool }}"
  loop: "{{ _kcpm_groups.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: (item.json | selectattr('name', 'equalto', item.item) | list | length) == 0
  changed_when: true
  no_log: true

- name: "keycloak | persona memberships | read every group id"
  ansible.builtin.uri:
    url: "{{ _kcpm_api }}/groups?search={{ item }}&exact=true"
    headers: "{{ _kcpm_headers }}"
    validate_certs: "{{ zuno_validate_route_certs | default(false) | bool }}"
  loop: "{{ _kcpm_group_names }}"
  register: _kcpm_groups_after
  no_log: true

- name: "keycloak | persona memberships | group name to id"
  ansible.builtin.set_fact:
    _kcpm_group_ids: >-
      {{ _kcpm_group_ids | default({}) | combine({item.item: (item.json | selectattr('name', 'equalto', item.item) | list | first).id}) }}
  loop: "{{ _kcpm_groups_after.results }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true

- name: "keycloak | persona memberships | look up each user"
  ansible.builtin.uri:
    url: "{{ _kcpm_api }}/users?username={{ item.username }}&exact=true"
    headers: "{{ _kcpm_headers }}"
    validate_certs: "{{ zuno_validate_route_certs | default(false) | bool }}"
  loop: "{{ keycloak_persona_memberships }}"
  loop_control:
    label: "{{ item.username }}"
  register: _kcpm_users
  no_log: true

- name: "keycloak | persona memberships | read the groups each existing user holds"
  ansible.builtin.uri:
    url: "{{ _kcpm_api }}/users/{{ item.json[0].id }}/groups"
    headers: "{{ _kcpm_headers }}"
    validate_certs: "{{ zuno_validate_route_certs | default(false) | bool }}"
  loop: "{{ _kcpm_users.results | selectattr('json', 'truthy') | list }}"
  loop_control:
    label: "{{ item.item.username }}"
  register: _kcpm_held
  no_log: true

- name: "keycloak | persona memberships | add the missing memberships"
  ansible.builtin.uri:
    url: "{{ _kcpm_api }}/users/{{ item.0.item.json[0].id }}/groups/{{ _kcpm_group_ids[item.1] }}"
    method: PUT
    headers: "{{ _kcpm_headers }}"
    status_code: [204]
    validate_certs: "{{ zuno_validate_route_certs | default(false) | bool }}"
  loop: "{{ _kcpm_held.results | subelements('item.item.groups') }}"
  loop_control:
    label: "{{ item.0.item.item.username }} -> {{ item.1 }}"
  when: (item.0.json | selectattr('name', 'equalto', item.1) | list | length) == 0
  changed_when: true
  no_log: true

- name: "keycloak | persona memberships | report"
  ansible.builtin.debug:
    msg:
      - "users absent from the realm, skipped: {{ _kcpm_users.results | rejectattr('json', 'truthy') | map(attribute='item') | map(attribute='username') | list }}"
