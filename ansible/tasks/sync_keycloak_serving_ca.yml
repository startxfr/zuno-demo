---
# ADR-0411: copies openshift-config/keycloak-serving-ca (the CA bundle
# ADR-0347/ansible/roles/openshift_oauth already maintains idempotently
# for the cluster's own OAuth server) into a persistent ConfigMap a
# workload namespace's pods can mount. Reuses that ConfigMap verbatim as
# the single source of truth for "the CA that signs Keycloak's Route" -
# never re-derives it.
#
# Unlike the one-off acceptance-gate Job copy this generalizes
# (ansible/roles/agents/tasks/run_acceptance_gate.yml), this is meant to
# be included by an install task that runs on every `make d1 install`,
# so the destination ConfigMap self-corrects if the source is ever
# rotated (e.g. ingress.acmeWildcardTLS flips per ADR-0211).
#
# Requires sync_keycloak_ca_dest_namespace and
# sync_keycloak_ca_dest_configmap_name to be set by the including task.

- name: "sync-keycloak-ca | validate required vars are set"
  ansible.builtin.assert:
    that:
      - sync_keycloak_ca_dest_namespace is defined
      - sync_keycloak_ca_dest_namespace | length > 0
      - sync_keycloak_ca_dest_configmap_name is defined
      - sync_keycloak_ca_dest_configmap_name | length > 0
    fail_msg: >-
      sync_keycloak_serving_ca.yml requires both
      'sync_keycloak_ca_dest_namespace' and
      'sync_keycloak_ca_dest_configmap_name' to be set by the including
      task.

- name: "sync-keycloak-ca | read the platform's Keycloak-serving CA from openshift-config"
  kubernetes.core.k8s_info:
    kind: ConfigMap
    namespace: openshift-config
    name: keycloak-serving-ca
  register: _sync_keycloak_ca_source

- name: "sync-keycloak-ca | fail if the source ConfigMap is missing"
  ansible.builtin.fail:
    msg: >-
      openshift-config/keycloak-serving-ca not found - run
      `make d0 install openshift-oauth` first (it publishes the CA
      bundle every Keycloak-dialing workload in this repo trusts).
  when: (_sync_keycloak_ca_source.resources | default([]) | length) == 0

- name: "sync-keycloak-ca | copy it into {{ sync_keycloak_ca_dest_namespace }}/{{ sync_keycloak_ca_dest_configmap_name }}"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ sync_keycloak_ca_dest_configmap_name }}"
        namespace: "{{ sync_keycloak_ca_dest_namespace }}"
        labels:
          zuno.io/managed-by: zuno-ansible
      data:
        ca.crt: "{{ _sync_keycloak_ca_source.resources[0].data['ca.crt'] }}"
