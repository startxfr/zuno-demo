---
# ADR-0564 / WP-150: publish every freshly signed OKF bundle as an OCI
# artifact that unifai-operator's UnifaiAgentBundle pulls by digest.
#
# Runs after verify_okf_signatures.yml, whose `_okf_verify_signatures` fact
# carries each agent's signature as read back from Vault KV. Skipped unless
# `zuno_okf_oci_repository_prefix` is set (e.g. quay.io/zuno): each agent goes
# to <prefix>/okf-<agent>. The controller host must already be logged in to
# that registry (`oras login` or `podman login`, which oras reads).
# publish_okf_bundle.py re-verifies each bundle against
# agents/zuno-platform-signer.pub before pushing, so an edited-but-unsigned
# bundle is refused here rather than by the operator.
#
# The prefix is an operator setting in ansible/confidential.yml, which nothing
# loads globally (see check_docs.py check_confidential_var_loaders): load it
# here before the gate reads it, or the gate is always false.

- name: "okf-publish | check for ansible/confidential.yml"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/confidential.yml"
  register: _okf_publish_confidential_file

- name: "okf-publish | load ansible/confidential.yml if present"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/confidential.yml"
  when: _okf_publish_confidential_file.stat.exists

- name: "okf-publish | say why nothing is published"
  ansible.builtin.debug:
    msg: >-
      zuno_okf_oci_repository_prefix is not set in ansible/confidential.yml:
      the signed bundles are not published as OCI artifacts (ADR-0564).
  when: zuno_okf_oci_repository_prefix | default('') | length == 0

- name: "okf-publish | publish each signed bundle"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      sig=$(mktemp) && trap 'rm -f "$sig"' EXIT &&
      printf '%s\n' {{ sig_entry.stdout | quote }} > "$sig" &&
      python3 platform/supply-chain/publish_okf_bundle.py publish
      {{ sig_entry.agent_dir.path | quote }}
      --signature "$sig"
      --repository {{ (zuno_okf_oci_repository_prefix ~ '/okf-' ~ (sig_entry.agent_dir.path | basename)) | quote }}
      --public-key agents/zuno-platform-signer.pub
    chdir: "{{ zuno_repo_root }}"
    executable: /bin/bash
  loop: "{{ _okf_verify_signatures | default([]) }}"
  loop_control:
    loop_var: sig_entry
    label: "{{ sig_entry.agent_dir.path | basename }}"
  register: _okf_publish_results
  changed_when: true
  when:
    - zuno_okf_oci_repository_prefix | default('') | length > 0
    - sig_entry.rc == 0
    - sig_entry.stdout | default('') | length > 0

- name: "okf-publish | report the published references (pin these in the UnifaiAgentBundle specs)"
  ansible.builtin.debug:
    msg: >-
      {{ _okf_publish_results.results | default([])
         | selectattr('stdout', 'defined')
         | map(attribute='stdout') | map('trim') | list }}
  when: zuno_okf_oci_repository_prefix | default('') | length > 0
