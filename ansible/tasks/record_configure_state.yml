---
# Shared task: configure-phase counterpart of record_install_state.yml -
# see that file's header comment, same reasoning throughout. Called at
# the end of every role's tasks/configure-precheck.yml with
# _state_is_configured (bool).
- name: "state-report | validate required vars are set"
  ansible.builtin.assert:
    that:
      - _state_is_configured is defined
      - state_report_file is defined
    fail_msg: "record_configure_state.yml requires '_state_is_configured' and 'state_report_file' to be set (state_report_file comes from ansible/tasks/init_state_report.yml)"

- name: "state-report | set {{ ansible_role_name }}_state_configured"
  ansible.builtin.set_fact: "{{ {ansible_role_name + '_state_configured': _state_is_configured} }}"

- name: "state-report | record the configure state line"
  ansible.builtin.lineinfile:
    path: "{{ state_report_file }}"
    line: "{{ ansible_role_name | replace('_', '-') }} is {{ '' if _state_is_configured else 'NOT ' }}configured"
    create: true
