---
# Discovers the cluster's real apps wildcard domain directly from the
# OpenShift API (authoritative, and Ansible already has direct API access
# via K8S_AUTH_HOST/K8S_AUTH_API_KEY — no need to round-trip through Vault
# just to read a value this same run can query directly). Idempotent within
# a single playbook run via the `is not defined` guard, so every include
# site (apply_gitops_app.yml, the vault role, the agents role's smoke
# check) can safely call this without worrying about duplicate API calls or
# about which scope happened to run first in a given `make configure`
# invocation.
#
# The discovered value is also persisted to Vault (see
# ansible/roles/vault/tasks/configure.yml) so that anything without direct
# cluster API access — a pod consuming it via an ExternalSecret, a future
# out-of-band script — has one durable place to read it from instead of a
# second, potentially stale, hardcoded copy. This task only ever discovers
# and sets the in-memory fact; it does not itself talk to Vault.
- name: "cluster-domain | discover the real apps domain from Ingress.config.openshift.io/cluster"
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Ingress
    name: cluster
  register: _resolve_cluster_ingress
  when: cluster_base_domain is not defined

- name: "cluster-domain | fail if discovery found nothing"
  ansible.builtin.fail:
    msg: >-
      Could not read status.domain from Ingress.config.openshift.io/cluster
      — is K8S_AUTH_HOST pointed at a real OpenShift cluster (not vanilla
      Kubernetes, which has no Ingress.config.openshift.io resource)?
  when:
    - cluster_base_domain is not defined
    - (_resolve_cluster_ingress.resources | default([]) | length) == 0

- name: "cluster-domain | set the cluster_base_domain fact"
  ansible.builtin.set_fact:
    cluster_base_domain: "{{ _resolve_cluster_ingress.resources[0].spec.domain }}"
  when: cluster_base_domain is not defined
