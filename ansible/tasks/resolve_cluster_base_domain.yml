---
# Discovers the cluster's apps wildcard domain from the OpenShift API
# directly (idempotent via the `is not defined` guard). Also persisted to
# Vault by the vault role for consumers without direct cluster API access.
- name: "cluster-domain | discover the real apps domain from Ingress.config.openshift.io/cluster"
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Ingress
    name: cluster
  register: _resolve_cluster_ingress
  when: cluster_base_domain is not defined

- name: "cluster-domain | fail if discovery found nothing"
  ansible.builtin.fail:
    msg: >-
      Could not read status.domain from Ingress.config.openshift.io/cluster
      - is the current kubeconfig context (`oc login`) pointed at a real
      OpenShift cluster (not vanilla Kubernetes, which has no
      Ingress.config.openshift.io resource)?
  when:
    - cluster_base_domain is not defined
    - (_resolve_cluster_ingress.resources | default([]) | length) == 0

- name: "cluster-domain | set the cluster_base_domain fact"
  ansible.builtin.set_fact:
    cluster_base_domain: "{{ _resolve_cluster_ingress.resources[0].spec.domain }}"
  when: cluster_base_domain is not defined
