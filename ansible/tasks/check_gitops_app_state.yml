---
# Point-in-time Synced+Healthy check for one ArgoCD Application (non-blocking,
# for precheck.yml). Requires gitops_app_name; sets _state_check_result.
- name: "state-check | look up {{ gitops_app_name }}"
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: openshift-gitops
    name: "{{ gitops_app_name }}"
  register: _state_check_app

- name: "state-check | compute Synced+Healthy for {{ gitops_app_name }}"
  ansible.builtin.set_fact:
    _state_check_result: >-
      {{
        (_state_check_app.resources | default([]) | length) > 0 and
        (_state_check_app.resources[0].status.sync.status | default('') == 'Synced') and
        (_state_check_app.resources[0].status.health.status | default('') == 'Healthy')
      }}

# Record WHY the app isn't Synced/Healthy so `make d0 check` can summarize
# blocked resources (with solution + auto-fix) at the end - strictly
# read-only, never fails, and skipped entirely outside the day0 playbooks
# (blocked_findings is only initialized there).
- name: "state-check | diagnose blocked resources of {{ gitops_app_name }}"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/diagnose_gitops_app.yml"
  when:
    - not (_state_check_result | bool)
    - blocked_findings is defined
