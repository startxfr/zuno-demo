---
# Included by wp225_seed_signing_keys.yml for one Vault path (var: wp225_path). Not a playbook.
- name: "{{ wp225_path }} | is the pair already in Vault?"
  kubernetes.core.k8s_exec:
    namespace: zuno-vault
    pod: "{{ _wp225_vault_pod.resources[0].metadata.name }}"
    container: vault
    command: >-
      sh -c "VAULT_TOKEN={{ zuno_vault_token }} vault kv get -field=public_key zuno/{{ wp225_path }} >/dev/null 2>&1 && echo present || echo absent"
  register: _wp225_present
  changed_when: false
  no_log: true

- name: "{{ wp225_path }} | generate and seed the pair"
  when: _wp225_present.stdout | trim == 'absent'
  no_log: true
  block:
    - name: "{{ wp225_path }} | generate an Ed25519 key in a private temporary directory"
      ansible.builtin.tempfile:
        state: directory
        prefix: wp225key
      register: _wp225_tmp

    - name: "{{ wp225_path }} | openssl genpkey / pkey"
      ansible.builtin.shell: |
        set -e
        openssl genpkey -algorithm ed25519 -out "{{ _wp225_tmp.path }}/k.pem"
        openssl pkey -in "{{ _wp225_tmp.path }}/k.pem" -pubout -out "{{ _wp225_tmp.path }}/k.pub"
        chmod 600 "{{ _wp225_tmp.path }}/k.pem"
      changed_when: true

    - name: "{{ wp225_path }} | read the pair"
      ansible.builtin.set_fact:
        _wp225_priv_b64: "{{ lookup('ansible.builtin.file', _wp225_tmp.path ~ '/k.pem') | b64encode }}"
        _wp225_pub_b64: "{{ lookup('ansible.builtin.file', _wp225_tmp.path ~ '/k.pub') | b64encode }}"

    - name: "{{ wp225_path }} | write to Vault (decoded inside the pod, never printed)"
      kubernetes.core.k8s_exec:
        namespace: zuno-vault
        pod: "{{ _wp225_vault_pod.resources[0].metadata.name }}"
        container: vault
        command: >-
          sh -c "VAULT_TOKEN={{ zuno_vault_token }} vault kv put zuno/{{ wp225_path }}
          private_key=\"$(echo {{ _wp225_priv_b64 }} | base64 -d)\"
          public_key=\"$(echo {{ _wp225_pub_b64 }} | base64 -d)\" >/dev/null"
      changed_when: true
  always:
    - name: "{{ wp225_path }} | remove the temporary key files"
      ansible.builtin.file:
        path: "{{ _wp225_tmp.path }}"
        state: absent
      when: _wp225_tmp is defined and _wp225_tmp.path is defined
      no_log: true
