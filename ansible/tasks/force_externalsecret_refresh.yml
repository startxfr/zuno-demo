---
# Forces an ExternalSecret to re-read its backend NOW and waits until the
# managed Secret actually carries the expected value.
#
# Why this exists: the aap-config ExternalSecrets run refreshInterval: 1h.
# When a role rewrites a Vault path mid-run (e.g. re-minting a dead AAP
# API token), the Secret keeps serving the OLD value for up to an hour,
# so every consumer of that Secret keeps failing against a credential the
# role already fixed. `force-sync` is the annotation external-secrets
# honours to reconcile immediately; the value only has to change, hence
# the timestamp.
#
# Deliberately tolerant of a missing ExternalSecret: callers use this for
# secrets whose owning Application may not be deployed yet (mcp-aap is
# applied by the Day 2 `mcp` role, long after aap-config mints its
# token). A missing ES is a no-op, not a failure - there is no stale
# Secret to correct in that case.
#
# Requires: es_name, es_namespace. Optional: es_expect_key +
# es_expect_value to wait for a specific materialized value, OR
# es_wait_for_refresh: true to wait only until the operator has actually
# re-read the backend (status.refreshTime advances). Use the latter when
# the caller cannot know the expected bytes in advance - re-signed OKF
# bundle signatures are produced in-cluster, so day3_sign.yml has nothing
# to compare against, but it still must not race ahead of the refresh.
- name: "externalsecret | validate es_name/es_namespace are set"
  ansible.builtin.assert:
    that:
      - es_name is defined and (es_name | length) > 0
      - es_namespace is defined and (es_namespace | length) > 0
    fail_msg: "force_externalsecret_refresh.yml requires 'es_name' and 'es_namespace'"

- name: "externalsecret | look up {{ es_name }}"
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1beta1
    kind: ExternalSecret
    namespace: "{{ es_namespace }}"
    name: "{{ es_name }}"
  register: _es_lookup

- name: "externalsecret | annotate {{ es_name }} to force an immediate refresh"
  kubernetes.core.k8s:
    state: patched
    api_version: external-secrets.io/v1beta1
    kind: ExternalSecret
    namespace: "{{ es_namespace }}"
    name: "{{ es_name }}"
    definition:
      metadata:
        annotations:
          force-sync: "{{ lookup('pipe', 'date +%s') }}"
  when: (_es_lookup.resources | default([]) | length) > 0

# Without this the caller races the operator: the annotation only asks
# for a refresh, it does not mean the Secret has been rewritten yet.
- name: "externalsecret | wait for {{ es_name }}'s Secret to carry the new value"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ es_namespace }}"
    name: "{{ es_name }}"
  register: _es_secret
  until: >-
    (_es_secret.resources | default([]) | length) > 0 and
    ((_es_secret.resources[0].data[es_expect_key] | b64decode) == es_expect_value)
  retries: "{{ es_wait_retries | default(30) }}"
  delay: "{{ es_wait_delay | default(2) }}"
  when:
    - (_es_lookup.resources | default([]) | length) > 0
    - es_expect_key is defined
    - es_expect_value is defined
  no_log: true

# Same race as the es_expect_key wait above, for callers that cannot
# predict the value: refreshTime is the operator's own record of when it
# last re-read the backend, so waiting for it to move past what it was
# before the annotation proves the refresh happened rather than assuming
# it. Unlike a data-hash comparison this also works when the refreshed
# value is byte-identical to the old one.
- name: "externalsecret | wait for {{ es_name }} to actually re-read its backend"
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1beta1
    kind: ExternalSecret
    namespace: "{{ es_namespace }}"
    name: "{{ es_name }}"
  register: _es_refreshed
  until: >-
    (_es_refreshed.resources | default([]) | length) > 0 and
    (_es_refreshed.resources[0].status.refreshTime | default('')) !=
    (_es_lookup.resources[0].status.refreshTime | default(''))
  retries: "{{ es_wait_retries | default(30) }}"
  delay: "{{ es_wait_delay | default(2) }}"
  when:
    - (_es_lookup.resources | default([]) | length) > 0
    - es_wait_for_refresh | default(false) | bool
