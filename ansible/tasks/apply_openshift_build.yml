---
# Builds one component image via OpenShift BuildConfig/ImageStream in
# zuno-ai-build. Idempotent (ConfigChange trigger only rebuilds on a real
# diff); delete the BuildConfig or run `oc start-build` to force a rebuild.

- name: "openshift-build | validate required vars are set"
  ansible.builtin.assert:
    that:
      - build_image_name is defined
      - build_dockerfile_path is defined
      - build_context_dir is defined
    fail_msg: "apply_openshift_build.yml requires build_image_name, build_dockerfile_path and build_context_dir"

# Build pods only pull source and push images out; nothing needs inbound
# access, so a full default-deny-all-ingress baseline is safe here.
- name: "openshift-build | ensure the zuno-ai-build namespace and its default-deny-ingress NetworkPolicy baseline"
  kubernetes.core.k8s:
    state: present
    definition: "{{ def }}"
  loop:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: zuno-ai-build
        labels:
          zuno.io/managed-by: zuno-ansible
          openshift.io/cluster-monitoring: "true"
        annotations:
          openshift.io/description: "In-cluster OpenShift build pipeline producing this platform's component images."
          openshift.io/display-name: "Zuno AI Build"
          openshift.io/requester: zuno
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: zuno-ai-build-default-deny-ingress
        namespace: zuno-ai-build
        labels:
          zuno.io/managed-by: zuno-ansible
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
  loop_control:
    loop_var: "def"
    label: "{{ def.kind }}/{{ def.metadata.name }}"

# Grants cross-namespace image-pull access to the namespaces that run these
# images. Applied here, not by the Day 0 namespaces role, since zuno-ai-build
# doesn't exist until a build first runs. zuno-vault/zuno-auth are included
# for symmetry with the identical grant ansible/roles/image_mirrors applies
# at Day 0 (both idempotently apply the same RoleBinding shape).
- name: "openshift-build | grant image-pull access to the namespaces that run these images"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: "zuno-ai-build-image-puller-{{ rbname }}"
        namespace: zuno-ai-build
        labels:
          zuno.io/managed-by: zuno-ansible
      subjects:
        - kind: Group
          apiGroup: rbac.authorization.k8s.io
          name: "system:serviceaccounts:{{ rbname }}"
      roleRef:
        kind: ClusterRole
        name: system:image-puller
        apiGroup: rbac.authorization.k8s.io
  loop:
    - zuno-ai-run
    - zuno-data
    - zuno-vault
    - zuno-auth
  loop_control:
    loop_var: "rbname"

- name: "openshift-build | apply the ImageStream: {{ build_image_name }}"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: image.openshift.io/v1
      kind: ImageStream
      metadata:
        name: "{{ build_image_name }}"
        namespace: zuno-ai-build
        labels:
          zuno.io/managed-by: zuno-ansible

- name: "openshift-build | apply the BuildConfig: {{ build_image_name }}"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: build.openshift.io/v1
      kind: BuildConfig
      metadata:
        name: "{{ build_image_name }}"
        namespace: zuno-ai-build
        labels:
          zuno.io/managed-by: zuno-ansible
      spec:
        source:
          type: Git
          git:
            uri: https://github.com/startxfr/zuno-demo.git
            ref: main
          contextDir: "{{ build_context_dir if build_context_dir != '.' else '' }}"
        strategy:
          type: Docker
          dockerStrategy:
            dockerfilePath: "{{ build_dockerfile_path }}"
        output:
          to:
            kind: ImageStreamTag
            name: "{{ build_image_name }}:latest"
        triggers:
          - type: ConfigChange

- name: "openshift-build | re-read the BuildConfig to get its current lastVersion"
  kubernetes.core.k8s_info:
    api_version: build.openshift.io/v1
    kind: BuildConfig
    namespace: zuno-ai-build
    name: "{{ build_image_name }}"
  register: _openshift_build_bc_info

- name: "openshift-build | wait for a Build to exist for the current lastVersion"
  kubernetes.core.k8s_info:
    api_version: build.openshift.io/v1
    kind: Build
    namespace: zuno-ai-build
    name: "{{ build_image_name }}-{{ _openshift_build_bc_info.resources[0].status.lastVersion | default(0) }}"
  register: _openshift_build
  until: (_openshift_build.resources | default([]) | length) > 0
  retries: 12
  delay: 10
  when: (_openshift_build_bc_info.resources[0].status.lastVersion | default(0)) > 0

- name: "openshift-build | wait for the Build to complete"
  kubernetes.core.k8s_info:
    api_version: build.openshift.io/v1
    kind: Build
    namespace: zuno-ai-build
    name: "{{ build_image_name }}-{{ _openshift_build_bc_info.resources[0].status.lastVersion | default(0) }}"
  register: _openshift_build_status
  until: >-
    (_openshift_build_status.resources | default([]) | length) > 0 and
    (_openshift_build_status.resources[0].status.phase | default('')) in ['Complete', 'Failed', 'Error', 'Cancelled']
  retries: 60
  delay: 15
  when: (_openshift_build_bc_info.resources[0].status.lastVersion | default(0)) > 0

- name: "openshift-build | fail loudly if the build did not complete successfully"
  ansible.builtin.fail:
    msg: >-
      Build {{ build_image_name }}-{{ _openshift_build_bc_info.resources[0].status.lastVersion | default(0) }}
      in zuno-ai-build did not complete: phase=
      {{ _openshift_build_status.resources[0].status.phase | default('unknown') }}.
      Check `oc logs -n zuno-ai-build build/{{ build_image_name }}-{{ _openshift_build_bc_info.resources[0].status.lastVersion | default(0) }}`.
  when: >-
    (_openshift_build_bc_info.resources[0].status.lastVersion | default(0)) > 0 and
    (_openshift_build_status.resources[0].status.phase | default('')) != 'Complete'
