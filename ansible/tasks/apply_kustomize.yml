---
# Shared task (ADR-0310): apply every resource in a per-role kustomize/
# directory. Shells out to `kustomize build` and feeds the parsed
# multi-document output through kubernetes.core.k8s per resource.
#
# Required var: kustomize_dir (absolute path to a directory containing a
# kustomization.yaml).
# Optional var: kustomize_replacements (dict of literal-string ->
# replacement-value substitutions applied to the rendered YAML before
# parsing).
- name: "kustomize | validate kustomize_dir is set"
  ansible.builtin.assert:
    that:
      - kustomize_dir is defined
      - kustomize_dir | length > 0
    fail_msg: "apply_kustomize.yml requires 'kustomize_dir' to be set by the including role"

# --load-restrictor LoadRestrictionsNone: some roles' configMapGenerator
# `files:` sources reach outside their own kustomize/ directory (e.g.
# ansible/roles/sql_schema/kustomize/schema/), which kustomize's default
# same-directory-or-below restriction otherwise rejects.
- name: "kustomize | build manifests from {{ kustomize_dir }}"
  ansible.builtin.set_fact:
    _kustomize_raw: >-
      {{
        lookup('ansible.builtin.pipe',
               'kustomize build --load-restrictor LoadRestrictionsNone ' + kustomize_dir)
      }}

- name: "kustomize | substitute runtime replacements, if any"
  ansible.builtin.set_fact:
    _kustomize_raw: "{{ _kustomize_raw | replace(_kustomize_replacement.key, _kustomize_replacement.value) }}"
  loop: "{{ kustomize_replacements | default({}) | dict2items }}"
  loop_control:
    loop_var: _kustomize_replacement
    label: "{{ _kustomize_replacement.key }}"

- name: "kustomize | apply every resource built from {{ kustomize_dir }}"
  kubernetes.core.k8s:
    state: present
    definition: "{{ _kustomize_resource }}"
  loop: "{{ _kustomize_raw | from_yaml_all | select('!=', None) | list }}"
  loop_control:
    loop_var: _kustomize_resource
    label: "{{ _kustomize_resource.kind }}/{{ _kustomize_resource.metadata.name }}"
