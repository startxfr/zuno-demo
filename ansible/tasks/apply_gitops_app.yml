---
# Applies one ArgoCD Application manifest for a component (called once per
# gitops_app_phase: d0 for operator install, d1 for the live service). The
# only path that applies gitops/apps/ Applications during make day0|d0/day1|d1.
- name: "gitops | validate gitops_app_name/gitops_app_phase are set"
  ansible.builtin.assert:
    that:
      - gitops_component_name is defined
      - gitops_component_name | length > 0
      - gitops_app_name is defined
      - gitops_app_name | length > 0
      - gitops_app_phase is defined
      - gitops_app_phase in ['d0', 'd1']
    fail_msg: "apply_gitops_app.yml requires 'gitops_component_name', 'gitops_app_name' AND 'gitops_app_phase' ('d0' or 'd1') to be set by the including role"

- name: "gitops | resolve the cluster base domain (for Applications whose Helm values need it)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_base_domain.yml"

- name: "gitops | render the Application manifest with apps.mycluster.example.com substituted"
  ansible.builtin.set_fact:
    _gitops_app_definition: >-
      {{
        (lookup('ansible.builtin.file', zuno_repo_root + '/gitops/apps/' + gitops_component_name + '/application-' + gitops_app_phase + '.yaml')
          | replace('apps.mycluster.example.com', cluster_base_domain))
        | from_yaml
      }}

# Optional: lets a role inject Helm values known only at run time. Replaces
# (not merges) the manifest's own spec.source.helm.values when set.
- name: "gitops | merge extra Helm values into the Application spec, if provided"
  ansible.builtin.set_fact:
    _gitops_app_definition: >-
      {{
        _gitops_app_definition
        | combine({'spec': {'source': {'helm': {'values': gitops_app_extra_helm_values | to_nice_yaml}}}}, recursive=True)
      }}
  when: gitops_app_extra_helm_values is defined

- name: "gitops | apply ArgoCD Application: zuno-{{ gitops_app_name }}"
  kubernetes.core.k8s:
    state: present
    definition: "{{ _gitops_app_definition }}"

- name: "gitops | wait for {{ gitops_app_name }} to become Synced and Healthy"
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: openshift-gitops
    name: "{{ gitops_app_name }}"
  register: _gitops_app_status
  until: >-
    (_gitops_app_status.resources | length > 0) and
    (_gitops_app_status.resources[0].status.sync.status | default('') == 'Synced') and
    (_gitops_app_status.resources[0].status.health.status | default('') == 'Healthy')
  retries: "{{ gitops_app_wait_retries | default(30) }}"
  delay: "{{ gitops_app_wait_delay | default(10) }}"
  when: gitops_app_wait | default(true) | bool
