---
# Applies one ArgoCD Application manifest for a component (called once per
# gitops_app_phase: d0 for operator install, d1 for the live service). The
# only path that applies gitops/apps/ Applications during make day0|d0/day1|d1.
- name: "gitops | validate gitops_app_name/gitops_app_phase are set"
  ansible.builtin.assert:
    that:
      - gitops_component_name is defined
      - gitops_component_name | length > 0
      - gitops_app_name is defined
      - gitops_app_name | length > 0
      - gitops_app_phase is defined
      - gitops_app_phase in ['d0', 'd1']
    fail_msg: "apply_gitops_app.yml requires 'gitops_component_name', 'gitops_app_name' AND 'gitops_app_phase' ('d0' or 'd1') to be set by the including role"

- name: "gitops | resolve the cluster base domain (for Applications whose Helm values need it)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_base_domain.yml"

# zuno_gitops_target_revision lives in confidential.yml (an operator-supplied,
# cluster-specific, non-secret value - ADR-0547 surface 2). Loaded here rather
# than relying on the calling role's own loader pair: not every caller of this
# task loads confidential.yml (only 13 of the roles do), and an unloaded
# variable would silently fall back to the manifest's committed
# targetRevision - the exact `| default()` silence ADR-0517 B13 documents.
- name: "gitops | check for ansible/confidential.yml"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/confidential.yml"
  register: _gitops_confidential_file

- name: "gitops | load ansible/confidential.yml if present"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/confidential.yml"
  when: _gitops_confidential_file.stat.exists

# ADR-0517 live finding (demo333, 2026-09-07): confidential.yml is
# gitignored, so it does NOT exist in the AAP Project checkout - every
# AAP-launched day1/2 job was silently applying Applications with the
# manifest's committed targetRevision (main) while the cluster deploys
# from a work branch, undoing the override above for exactly the runs
# that matter. ansible/branch-pin.yml is the committed-on-the-branch
# counterpart: present in every checkout of the branch (local AND AAP),
# absent on main. Loaded AFTER confidential.yml so the pin wins where
# both exist (they agree by construction). Removed at the final
# merge-to-main step, together with the confidential.yml variable
# (ADR-0517 Jalon 8).
- name: "gitops | check for ansible/branch-pin.yml (work-branch deployments only)"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/branch-pin.yml"
  register: _gitops_branch_pin_file

- name: "gitops | load ansible/branch-pin.yml if present"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/branch-pin.yml"
  when: _gitops_branch_pin_file.stat.exists

# Optionally injects Helm values known only at run time (replaces, not merges,
# the manifest's own spec.source.helm.values) - combine() with {} is a no-op
# when gitops_app_extra_helm_values isn't set, so this stays a single step.
- name: "gitops | render the Application manifest with apps.mycluster.example.com substituted"
  ansible.builtin.set_fact:
    _gitops_app_definition: >-
      {{
        (
          (lookup('ansible.builtin.file', zuno_repo_root + '/gitops/apps/' + gitops_component_name + '/application-' + gitops_app_phase + '.yaml')
            | replace('apps.mycluster.example.com', cluster_base_domain))
          | from_yaml
        )
        | combine(
            {'spec': {'source': {'helm': {'values': gitops_app_extra_helm_values | to_nice_yaml}}}}
            if gitops_app_extra_helm_values is defined else {},
            recursive=True
          )
        | combine(
            {'spec': {'source': {'targetRevision': zuno_gitops_target_revision}}}
            if zuno_gitops_target_revision is defined else {},
            recursive=True
          )
        | combine(
            {'spec': {'syncPolicy': {'retry': {'limit': 5, 'backoff': {
               'duration': '30s', 'factor': 2, 'maxDuration': '5m'}}}},
            recursive=True
          )
      }}
# The syncPolicy.retry above is an ADR-0517 live finding (demo333,
# 2026-09-07): on a fresh cluster, a chart that installs an operator and
# its operand in consecutive sync-waves (mariadb: MariadbOperator wave
# -32, MariaDB wave -30) races the operator's validating webhook -
# ArgoCD considers the operator CR Synced the moment it is created (no
# health check), applies the operand, and the webhook Service has no
# endpoints yet ("failed calling webhook ... no endpoints available",
# live-hit at 07:54, endpoints up at 07:56). Without retry the sync op
# terminates Failed and automated sync never re-attempts the same
# revision - the app sat Failed for 15 min until a human intervened.
# Five backoff retries (30s..5m) ride through every such
# operator-startup window. Applications are Ansible-applied, never
# git-synced (ADR-0311), so this adds no drift.

- name: "gitops | apply ArgoCD Application: zuno-{{ gitops_app_name }}"
  kubernetes.core.k8s:
    state: present
    definition: "{{ _gitops_app_definition }}"

# Reconcile passes gitops_app_refresh: true to force ArgoCD to re-evaluate a
# stuck app or apply a fresh diff immediately - re-applying an unchanged
# manifest alone doesn't trigger a sync. Previously patched the
# argocd.argoproj.io/refresh: hard annotation, then immediately polled
# status.sync/status.health below - that raced ArgoCD's own diff
# computation: the poll could read a stale cached Synced+Healthy status
# before the refresh finished, reporting success while the app was still
# actually OutOfSync (hit live 2026-08-24, WP-071 deploy - a chart change
# requiring pruning needed a manual `oc patch .../operation` follow-up to
# actually apply). Patching spec.operation.sync directly instead - the
# same mechanism `argocd app sync` uses - gives an unambiguous completion
# signal (status.operationState.phase) to wait on before the Synced/Healthy
# check below, instead of racing a cache refresh. Default false so install
# behavior for non-refresh callers is unchanged.
- name: "gitops | trigger a sync operation for {{ gitops_app_name }}"
  kubernetes.core.k8s:
    state: patched
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: openshift-gitops
    name: "{{ gitops_app_name }}"
    definition:
      operation:
        sync: {}
  when: gitops_app_refresh | default(false) | bool

- name: "gitops | wait for the {{ gitops_app_name }} sync operation to finish"
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: openshift-gitops
    name: "{{ gitops_app_name }}"
  register: _gitops_app_operation
  until: >-
    (_gitops_app_operation.resources | length > 0) and
    (_gitops_app_operation.resources[0].status.operationState.phase | default('') == 'Succeeded')
  retries: "{{ gitops_app_wait_retries | default(30) }}"
  delay: "{{ gitops_app_wait_delay | default(10) }}"
  when: gitops_app_refresh | default(false) | bool

- name: "gitops | wait for {{ gitops_app_name }} to become Synced and Healthy, diagnosing blocked resources on timeout"
  when: gitops_app_wait | default(true) | bool
  block:
    - name: "gitops | wait for {{ gitops_app_name }} to become Synced and Healthy"
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: openshift-gitops
        name: "{{ gitops_app_name }}"
      register: _gitops_app_status
      until: >-
        (_gitops_app_status.resources | length > 0) and
        (_gitops_app_status.resources[0].status.sync.status | default('') == 'Synced') and
        (_gitops_app_status.resources[0].status.health.status | default('') == 'Healthy')
      retries: "{{ gitops_app_wait_retries | default(30) }}"
      delay: "{{ gitops_app_wait_delay | default(10) }}"
  rescue:
    - name: "gitops | {{ gitops_app_name }} wait timed out - diagnosing blocked resources"
      ansible.builtin.debug:
        msg: >-
          Application {{ gitops_app_name }} did not reach Synced/Healthy -
          collecting blocked-resource findings.

    - name: "gitops | diagnose {{ gitops_app_name }}"
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/diagnose_gitops_app.yml"

    - name: "gitops | fail: {{ gitops_app_name }} is blocked"
      ansible.builtin.fail:
        msg: >-
          Application {{ gitops_app_name }} did not reach Synced/Healthy within
          {{ gitops_app_wait_retries | default(30) }}x{{ gitops_app_wait_delay | default(10) }}s.
          The blocked resources were recorded and are summarized at the end of
          the run. Remediation: fix the blocked resources above, then re-run
          the same `make {{ gitops_app_phase }} install <component>` command
          (idempotent). If a sync operation is stuck mid-flight, terminate it
          first: `oc patch application {{ gitops_app_name }} -n openshift-gitops
          --type=json -p '[{"op":"remove","path":"/operation"}]'`.
