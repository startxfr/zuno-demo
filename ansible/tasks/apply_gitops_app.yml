---
# Shared task: apply a single ArgoCD Application manifest for one platform
# component. Every role's `configure.yml` (and, where relevant, `prepare.yml`)
# includes this file with `gitops_app_name` set to its own component directory
# under gitops/apps/. See gitops/apps/README.md for the manifest convention
# and docs/adr/0022-use-gitops-managed-declarative-agent-tasks-and-policies.md
# for the architecture this implements.
#
# This is the *only* path that applies gitops/apps/ Application manifests
# during `make day0|d0`/`day1|d1` - the root App-of-Apps
# (gitops/root-app-of-apps.yaml) that used to also recurse over gitops/apps/
# in parallel is no longer applied by Ansible (ADR-0311); it is kept only as
# a documented example of a pure-GitOps bootstrap (docs/platform/
# installation.md). This keeps `make day0|d0 configure <component>` /
# `make day1|d1 configure|run <component>` self-sufficient for a single
# component without requiring a full sync, and without a second, redundant
# reconciliation path that could disagree with this one.
- name: "gitops | validate gitops_app_name is set"
  ansible.builtin.assert:
    that:
      - gitops_component_name is defined
      - gitops_component_name | length > 0
      - gitops_app_name is defined
      - gitops_app_name | length > 0
    fail_msg: "apply_gitops_app.yml requires 'gitops_component_name' AND 'gitops_app_name' to be set by the including role"

- name: "gitops | resolve the cluster base domain (for Applications whose Helm values need it)"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_base_domain.yml"

- name: "gitops | render the Application manifest with apps.mycluster.example.com substituted"
  ansible.builtin.set_fact:
    _gitops_app_definition: >-
      {{
        (lookup('ansible.builtin.file', zuno_repo_root + '/gitops/apps/' + gitops_component_name + '/application.yaml')
          | replace('apps.mycluster.example.com', cluster_base_domain))
        | from_yaml
      }}

# ADR-0048: lets a role inject values it only knows at run time (e.g. a
# discovered serving-runtime image) without hand-editing the checked-in
# application.yaml, whose spec.source.helm.values is otherwise fixed,
# checked-in configuration (gitops/apps/README.md's convention). Optional -
# most roles never set gitops_app_extra_helm_values, leaving
# application.yaml's own helm.values (if any, e.g. gitops/apps/vault)
# untouched. When set, it *replaces* spec.source.helm.values wholesale
# (rendered to a YAML string) rather than deep-merging with one already
# present in application.yaml - no current caller needs both at once, and
# merging two independently-authored value trees correctly is more
# complexity than this repo's actual usage justifies.
- name: "gitops | merge extra Helm values into the Application spec, if provided (ADR-0048)"
  ansible.builtin.set_fact:
    _gitops_app_definition: >-
      {{
        _gitops_app_definition
        | combine({'spec': {'source': {'helm': {'values': gitops_app_extra_helm_values | to_nice_yaml}}}}, recursive=True)
      }}
  when: gitops_app_extra_helm_values is defined

- name: "gitops | apply ArgoCD Application: zuno-{{ gitops_app_name }}"
  kubernetes.core.k8s:
    state: present
    definition: "{{ _gitops_app_definition }}"

- name: "gitops | wait for {{ gitops_app_name }} to become Synced and Healthy"
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: openshift-gitops
    name: "{{ gitops_app_name }}"
  register: _gitops_app_status
  until: >-
    (_gitops_app_status.resources | length > 0) and
    (_gitops_app_status.resources[0].status.sync.status | default('') == 'Synced') and
    (_gitops_app_status.resources[0].status.health.status | default('') == 'Healthy')
  retries: "{{ gitops_app_wait_retries | default(30) }}"
  delay: "{{ gitops_app_wait_delay | default(10) }}"
  when: gitops_app_wait | default(true) | bool
