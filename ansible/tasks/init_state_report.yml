---
# Generates a unique /tmp state-report file path and creates the empty file.
# Included once per check playbook; `default()` keeps it idempotent per run.
- name: "state-report | generate a unique report file path"
  ansible.builtin.set_fact:
    state_report_file: >-
      {{
        state_report_file
        | default('/tmp/zuno-statereport-' + (lookup('ansible.builtin.password', '/dev/null', length=12, chars=['hexdigits'])))
      }}

- name: "state-report | create the empty report file"
  ansible.builtin.copy:
    dest: "{{ state_report_file }}"
    content: ""
    force: false
    mode: "0644"
