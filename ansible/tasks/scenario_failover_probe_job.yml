---
# WP-105/ADR-0536: runs evaluations/scenario_failover_verify.py (which
# itself shells out to scenario_failover_probe.py once per agent) as a
# one-shot in-cluster Job, then parses its single JSON output line into the
# `scenario_failover_probe_result` fact. Included (not a role) from both
# day3_scenario_failover_node_inject.yml and ..._restore.yml, parameterized
# by `scenario_failover_phase` (baseline|failover|restore - label only, used
# for Job/session naming so consecutive runs don't collide).
#
# WP-156: the chat turns run on UnifAI (ADR-0561) through its UI route,
# signed in as each agent's demo persona with the demo-persona password -
# the comage-frontend/tekos-frontend client secrets are gone with
# agent-frontend. The provider that answered comes from the routing
# decision UnifAI carries on the answer; the Prometheus counter delta stays
# as the fallback, and Thanos Querier has no external Route, so the Job
# still runs in-cluster with the existing grafana-prometheus-reader token
# (ADR-0536 Decision 4). Same Job shape as
# ansible/roles/day3/tasks/stresstest_job_run_one.yml, deliberately smaller
# (inline ConfigMap `data:` instead of the apply_kustomize.yml multi-file
# bundle) since it only ever mounts three flat Python files.
#
# Requires cluster_base_domain (ansible/tasks/resolve_cluster_base_domain.yml)
# and k8s_auth_environment (ansible/tasks/load_k8s_auth_env.yml) already
# resolved by the calling playbook.

- name: "scenario-failover-probe | read the demo-persona password from zuno-auth"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: zuno-auth
    name: demo-personas-password
  register: _sfp_password_secret
  no_log: true

- name: "scenario-failover-probe | read the grafana-prometheus-reader token (existing identity, no new RBAC - ADR-0536 Decision 4)"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: zuno-monitoring
    name: grafana-prometheus-reader-token
  register: _sfp_prom_token_secret
  no_log: true

- name: "scenario-failover-probe | fail if any required credential is missing"
  ansible.builtin.fail:
    msg: >-
      One of demo-personas-password (zuno-auth) or
      grafana-prometheus-reader-token (zuno-monitoring) was not found - each
      is provisioned by an existing component (keycloak, grafana) this drill
      does not itself install.
  when: >-
    (_sfp_password_secret.resources | default([]) | length) == 0 or
    (_sfp_prom_token_secret.resources | default([]) | length) == 0

- name: "scenario-failover-probe | copy the credentials into a zuno-ai-run Secret the Job can mount"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: scenario-failover-node-credentials
        namespace: zuno-ai-run
        labels:
          zuno.io/managed-by: zuno-ansible
      type: Opaque
      data:
        demo-persona-password: "{{ _sfp_password_secret.resources[0].data.password }}"
        prom-bearer-token: "{{ _sfp_prom_token_secret.resources[0].data.token }}"
  no_log: true

- name: "scenario-failover-probe | read the platform's internal root CA from openshift-config"
  kubernetes.core.k8s_info:
    kind: ConfigMap
    namespace: openshift-config
    name: keycloak-serving-ca
  register: _sfp_ca_cm

- name: "scenario-failover-probe | fail if the internal root CA ConfigMap is missing"
  ansible.builtin.fail:
    msg: >-
      openshift-config/keycloak-serving-ca not found - run
      `make d1 install openshift-oauth` first (it publishes the internal
      root CA the platform's Routes chain to). Same requirement
      run_acceptance_gate.yml/stresstest_job_run_one.yml already have -
      every HTTPS call this probe makes (Keycloak, on the UnifAI sign-in
      path) chains to Vault's internal root, absent from any stock
      container trust store.
  when: (_sfp_ca_cm.resources | default([]) | length) == 0

- name: "scenario-failover-probe | copy the internal root CA into a zuno-ai-run ConfigMap the Job can mount"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: scenario-failover-node-ca
        namespace: zuno-ai-run
        labels:
          zuno.io/managed-by: zuno-ansible
      data:
        ca.crt: "{{ _sfp_ca_cm.resources[0].data['ca.crt'] }}"

- name: "scenario-failover-probe | build the probe scripts ConfigMap"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: scenario-failover-node-scripts
        namespace: zuno-ai-run
        labels:
          zuno.io/managed-by: zuno-ansible
      data:
        scenario_failover_probe.py: "{{ lookup('file', zuno_repo_root + '/evaluations/scenario_failover_probe.py') }}"
        scenario_failover_verify.py: "{{ lookup('file', zuno_repo_root + '/evaluations/scenario_failover_verify.py') }}"
        unifai_target.py: "{{ lookup('file', zuno_repo_root + '/evaluations/common/unifai_target.py') }}"

- name: "scenario-failover-probe | delete any previous probe Job (Jobs are immutable, this task is idempotent-by-recreation)"
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: "zuno-scenario-failover-node-probe"
    namespace: zuno-ai-run
    wait: true

- name: "scenario-failover-probe | run the {{ scenario_failover_phase }} probe Job"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: "zuno-scenario-failover-node-probe"
        namespace: zuno-ai-run
        labels:
          zuno.io/managed-by: zuno-ansible
      spec:
        backoffLimit: 0
        # Bounded: two agents, each up to a 150s probe turn (cold-model
        # first-response allowance plus the UnifAI sign-in,
        # evaluations/scenario_failover_verify.py's
        # _PROBE_SUBPROCESS_TIMEOUT_SECONDS) plus, only when the answer
        # carries no routing decision, POLL_TIMEOUT_SECONDS (150s) of
        # counter polling - never left to run unbounded (this repo's own
        # "always bound cluster job runtime" lesson). ~300s/agent worst case
        # x2 agents + pip install overhead, with headroom.
        activeDeadlineSeconds: 900
        template:
          metadata:
            labels:
              app.kubernetes.io/name: acceptance-gate
          spec:
            restartPolicy: Never
            priorityClassName: zuno-platform-weak
            serviceAccountName: acceptance-gate
            containers:
              - name: scenario-failover-probe
                image: "docker.io/library/python:3.12-slim"
                command:
                  - sh
                  - -c
                  - >-
                    pip install --quiet --no-cache-dir httpx &&
                    CERTIFI=$(python3 -c 'import certifi; print(certifi.where())') &&
                    cat /gate-ca/ca.crt >> "$CERTIFI" &&
                    export SSL_CERT_FILE="$CERTIFI" &&
                    python3 /gate/scenario_failover_verify.py --phase {{ scenario_failover_phase }}
                workingDir: /gate
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
                env:
                  - name: PYTHONUNBUFFERED
                    value: "1"
                  - name: HOME
                    value: /tmp
                  - name: PYTHONUSERBASE
                    value: /tmp/.pyuser
                  # Same route platform_health_check.yml probes. TLS is
                  # verified: the internal root CA is appended to certifi
                  # above.
                  - name: UNIFAI_URL
                    value: "https://unifai-ui-zuno-unifai.{{ cluster_base_domain }}"
                  - name: UNIFAI_VERIFY_TLS
                    value: "1"
                  - name: DEMO_PERSONA_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: scenario-failover-node-credentials
                        key: demo-persona-password
                  - name: PROM_BEARER_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: scenario-failover-node-credentials
                        key: prom-bearer-token
                volumeMounts:
                  - name: gate
                    mountPath: /gate
                  - name: gate-ca
                    mountPath: /gate-ca
            volumes:
              # Flat: both scripts look for unifai_target.py next to
              # themselves (the Job layout) or under common/ (the repo
              # layout).
              - name: gate
                configMap:
                  name: scenario-failover-node-scripts
              - name: gate-ca
                configMap:
                  name: scenario-failover-node-ca

- name: "scenario-failover-probe | wait for the {{ scenario_failover_phase }} probe Job to reach a terminal state"
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    namespace: zuno-ai-run
    name: "zuno-scenario-failover-node-probe"
  register: _sfp_job
  until: >-
    (_sfp_job.resources[0].status.succeeded | default(0)) > 0 or
    (_sfp_job.resources[0].status.failed | default(0)) > 0
  retries: 60
  delay: 15

# controller-uid, not job-name - same stale-pod trap documented in
# run_acceptance_gate.yml/stresstest_job_run_one.yml.
- name: "scenario-failover-probe | find the {{ scenario_failover_phase }} probe Job's pod"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: zuno-ai-run
    label_selectors:
      - "controller-uid={{ _sfp_job.resources[0].metadata.uid }}"
  register: _sfp_pod

- name: "scenario-failover-probe | fetch the {{ scenario_failover_phase }} probe Job's output"
  kubernetes.core.k8s_log:
    namespace: zuno-ai-run
    name: "{{ _sfp_pod.resources[0].metadata.name }}"
  register: _sfp_log
  when: (_sfp_pod.resources | default([]) | length) > 0

- name: "scenario-failover-probe | print the raw probe output"
  ansible.builtin.debug:
    msg: "{{ _sfp_log.log_lines | default(['no pod/log found']) }}"

- name: "scenario-failover-probe | parse the {{ scenario_failover_phase }} probe verdict"
  ansible.builtin.set_fact:
    scenario_failover_probe_result: >-
      {{
        (_sfp_log.log_lines | default([]))
        | select('match', '^\{.*\}$')
        | map('from_json')
        | list
        | last
      }}
  when: (_sfp_log.log_lines | default([]) | select('match', '^\{.*\}$') | list | length) > 0

- name: "scenario-failover-probe | fail if the {{ scenario_failover_phase }} probe Job produced no parseable verdict"
  ansible.builtin.fail:
    msg: >-
      zuno-scenario-failover-node-probe (phase={{ scenario_failover_phase }})
      produced no JSON verdict line - see the debug output above for the raw
      log.
  when: scenario_failover_probe_result is not defined
