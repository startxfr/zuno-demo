---
# ADR-0517 live finding (demo333, 2026-09-07): loads the committed
# per-cluster NON-SECRET variable file ansible/clusters/<cluster_name>.yml
# (see demo333.yml's header for the full rationale - AAP SCM checkouts
# have no ansible/confidential.yml, so per-cluster Application values fell
# back to ADR-0547 placeholders there).
#
# Contract for callers (mirrors the confidential.yml soft-read pattern):
# include this BEFORE the role's own confidential.yml load, so that
# confidential.yml - when present, i.e. on a workstation - still overrides
# every value (later include_vars wins). A missing file is fine: an
# unlisted cluster simply keeps the roles' noisy defaults.
- name: "cluster-vars | resolve this cluster's short name"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_name.yml"

- name: "cluster-vars | check for ansible/clusters/{{ cluster_name }}.yml"
  ansible.builtin.stat:
    path: "{{ zuno_repo_root }}/ansible/clusters/{{ cluster_name }}.yml"
  register: _cluster_vars_file

- name: "cluster-vars | load ansible/clusters/{{ cluster_name }}.yml if present"
  ansible.builtin.include_vars:
    file: "{{ zuno_repo_root }}/ansible/clusters/{{ cluster_name }}.yml"
  when: _cluster_vars_file.stat.exists
