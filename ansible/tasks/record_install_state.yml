---
# Shared task: called at the end of every role's tasks/install-precheck.yml
# with a single input var, _state_is_installed (bool). Uses the
# ansible_role_name magic var (the currently-executing role's directory
# name, provided automatically by Ansible) so no role has to spell out
# its own name - and so the fact name/report line can never drift from
# the role's actual directory name.
#
# Never fails - "not installed yet" is a normal, reportable outcome, not
# an error (the fail-fast behavior the old precheck.yml had stays in
# install.yml/configure.yml themselves, which still fail if a component
# they need isn't there when they actually try to act).
- name: "state-report | validate required vars are set"
  ansible.builtin.assert:
    that:
      - _state_is_installed is defined
      - state_report_file is defined
    fail_msg: "record_install_state.yml requires '_state_is_installed' and 'state_report_file' to be set (state_report_file comes from ansible/tasks/init_state_report.yml)"

- name: "state-report | set {{ ansible_role_name }}_state_installed"
  ansible.builtin.set_fact: "{{ {ansible_role_name + '_state_installed': _state_is_installed} }}"

- name: "state-report | record the install state line"
  ansible.builtin.lineinfile:
    path: "{{ state_report_file }}"
    line: "{{ ansible_role_name | replace('_', '-') }} is {{ '' if _state_is_installed else 'NOT ' }}installed"
    create: true
