---
# Resolves the operator's kubeconfig (`oc login` beforehand) and exposes it
# as K8S_AUTH_KUBECONFIG via each playbook's environment:, so no role
# duplicates this logic.

# ADR-0354/WP-073: when a playbook runs as an AAP Job Template instead of
# an operator's shell, there is no kubeconfig - the Job Template's
# "OpenShift or Kubernetes API Bearer Token" credential injects
# K8S_AUTH_HOST/K8S_AUTH_API_KEY (& co) directly into the job's process
# environment, which kubernetes.core modules read natively. Detecting that
# and setting an empty k8s_auth_environment short-circuits the kubeconfig
# resolution below (its guard is `k8s_auth_environment is not defined`),
# so the same playbooks run unmodified from both entry points. Never set
# locally: an operator shell has no K8S_AUTH_HOST.
- name: "k8s-auth | detect an injected K8S_AUTH_* environment (AAP Job Template execution)"
  ansible.builtin.set_fact:
    k8s_auth_environment: {}
  when:
    - k8s_auth_environment is not defined
    - (lookup('env', 'K8S_AUTH_HOST') | default('', true)) | length > 0

- name: "k8s-auth | resolve the operator's kubeconfig path"
  ansible.builtin.set_fact:
    k8s_auth_kubeconfig_path: "{{ lookup('env', 'KUBECONFIG') | default(lookup('env', 'HOME') + '/.kube/config', true) }}"
  when: k8s_auth_environment is not defined

- name: "k8s-auth | verify the kubeconfig exists"
  ansible.builtin.stat:
    path: "{{ k8s_auth_kubeconfig_path }}"
  register: _k8s_auth_kubeconfig_file
  when: k8s_auth_environment is not defined

- name: "k8s-auth | fail if not logged in to a cluster"
  ansible.builtin.fail:
    msg: >-
      No kubeconfig found at {{ k8s_auth_kubeconfig_path }}. Run `oc login
      <cluster-api-url>` (or set KUBECONFIG to point at an existing one)
      before any `make d0/d1 ...` target or playbook.
  when:
    - k8s_auth_environment is not defined
    - not _k8s_auth_kubeconfig_file.stat.exists

- name: "k8s-auth | set the K8S_AUTH_* environment facts"
  ansible.builtin.set_fact:
    k8s_auth_environment:
      K8S_AUTH_KUBECONFIG: "{{ k8s_auth_kubeconfig_path }}"
  when: k8s_auth_environment is not defined

# WP-102: K8S_AUTH_HOST/K8S_AUTH_API_KEY are read natively by the
# kubernetes.core Python modules (the whole point of the block above),
# but the raw `oc` CLI (apply_openshift_build.yml's `oc start-build`,
# mlops/rag_ingestion's `oc whoami -t`) understands neither - it needs an
# actual kubeconfig, which an AAP Job Template's injected environment
# never provides (confirmed live 2026-08-30: `oc start-build` failed
# "Missing or incomplete configuration info" the first time any raw `oc`
# command ever ran under AAP, since no EE shipped `oc` at all before this
# WP). `oc login` writes one under /tmp - never $HOME/.kube/config, since
# an arbitrary-UID EE container's $HOME is not reliably writable (same
# reasoning as run_acceptance_gate.yml's PYTHONUSERBASE: /tmp/.pyuser) -
# then folds KUBECONFIG into k8s_auth_environment so every later task in
# this same play (including plain `command`/`shell` ones, which don't see
# module-only K8S_AUTH_* facts) inherits it via the play-level
# `environment: "{{ k8s_auth_environment | default({}) }}"` block every
# day1/day2/day3 playbook already sets - same propagation mechanism the
# non-AAP branch above already uses for K8S_AUTH_KUBECONFIG. Runs once
# per playbook, only when AAP-injected (an operator shell already has a
# real login).
- name: "k8s-auth | log the oc CLI into the AAP-injected cluster (Job Template execution only)"
  ansible.builtin.command:
    cmd: >-
      oc login --server={{ lookup('env', 'K8S_AUTH_HOST') }}
      --token={{ lookup('env', 'K8S_AUTH_API_KEY') }}
      --kubeconfig=/tmp/oc-kubeconfig
      {{ '--insecure-skip-tls-verify=true'
         if (lookup('env', 'K8S_AUTH_VERIFY_SSL') | default('true', true) | lower) in ['false', 'no', '0']
         else '' }}
  when: (lookup('env', 'K8S_AUTH_HOST') | default('', true)) | length > 0
  changed_when: false
  no_log: true

- name: "k8s-auth | fold the oc CLI's kubeconfig into the shared environment"
  ansible.builtin.set_fact:
    k8s_auth_environment: "{{ k8s_auth_environment | combine({'KUBECONFIG': '/tmp/oc-kubeconfig'}) }}"
  when: (lookup('env', 'K8S_AUTH_HOST') | default('', true)) | length > 0
