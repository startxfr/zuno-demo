---
# ADR-0057 decisions 3 and 5: discovers the admitted release's agents the same way
# ansible/roles/mcp_build/tasks/build.yml discovers
# components/mcp-servers/*/Dockerfile (ADR-0119/WP-057) - one loop, not a
# hand-maintained list, so a new agent bundle is checked automatically
# with no code change. Since WP-156 the agents are served by UnifAI and
# this reads their UnifaiAgentBundle status from the Ansible control node.
#
# Shared by ansible/roles/agents/tasks/check.yml (Day 2's existing
# reachability step, ADR-0053) and ansible/roles/day3/tasks/test.yml (the
# standalone `make d3 test agents` command) - one implementation, two
# callers.
- name: "day2-availability | resolve the cluster base domain"
  ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_base_domain.yml"

# WP-156: agents are served by UnifAI (ADR-0561), one UnifaiAgentBundle per
# agent in zuno-unifai (ADR-0564), so an agent is available when its bundle
# is Ready. The agents are the admitted release's
# (platform/okf/stack-config.generated.yaml), not agents/ in this tree. A
# placeholder agent (ADR-0007) is deliberately not served: its row passes
# with that reason, since "not served" is its expected state.
- name: "day2-availability | read the admitted agents release"
  ansible.builtin.set_fact:
    _day2_release_agents: >-
      {{ (lookup('ansible.builtin.file', zuno_repo_root + '/platform/okf/stack-config.generated.yaml')
          | from_yaml)['agents'] | default({}, true) }}

- name: "day2-availability | read the UnifaiAgentBundle objects"
  kubernetes.core.k8s_info:
    api_version: unifai.startx.fr/v1alpha1
    kind: UnifaiAgentBundle
    namespace: zuno-unifai
  register: _day2_bundles

- name: "day2-availability | build the Day2Result list"
  ansible.builtin.set_fact:
    _day2_availability_results: "{{ _day2_availability_results | default([]) + [_day2_row] }}"
  loop: "{{ _day2_release_agents | dict2items | sort(attribute='key') }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    _day2_bundle: >-
      {{ (_day2_bundles.resources | default([])
          | selectattr('metadata.name', 'equalto', item.key) | list | first) | default({}, true) }}
    _day2_ready: >-
      {{ (_day2_bundle.status.conditions | default([])
          | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | first) | default('missing') }}
    _day2_placeholder: "{{ item.value.status | default('active') == 'placeholder' }}"
    _day2_row:
      agent: "{{ item.key }}"
      layer: availability
      id: unifai-bundle-ready
      category: unifai
      passed: "{{ _day2_placeholder or _day2_ready == 'True' }}"
      detail: >-
        {{ 'placeholder (ADR-0007): not served by design'
           if _day2_placeholder else
           ('no UnifaiAgentBundle ' + item.key if _day2_bundle == {} else
            'Ready=' + _day2_ready + ' phase=' + (_day2_bundle.status.phase | default('?'))) }}
      duration_ms: 0

# Pure fact-producer, deliberately no rendering/failing here: this file
# is reused both by ansible/roles/agents/tasks/check.yml (Day 2's own
# agents-only gate) and ansible/roles/day3/tasks/test.yml (Day 3's
# combined agents+platform report), each of which needs a different
# result set rendered/decided at a different point - see
# ansible/tasks/day2_render_and_fail.yml, which both now call themselves
# once they have the results list they actually want to report on.
