---
# 2026-11-20 (zuno-demo-assist, for zuno-demo): the FALLBACK when neither -e, confidential.yml nor branch-pin.yml set
# it - a worktree run or any AAP job. Job 1482 that day re-applied connectivity-link d0/d1 at targetRevision main, and 6
# more Applications drifted the same way from worktree runs. The branch a cluster deploys from is a property of the
# CLUSTER, so it lives in the committed ansible/inventories/<cluster>/cluster.yml (ansible/clusters/<cluster>.yml
# before the per-cluster inventories, still read as a deprecated fallback), which exists on devel AND main: no merge in
# either direction can drop it (branch-pin.yml was removed at the 2026-09-08 merge to main, and every later
# main-into-devel merge would remove it again). Only this ONE variable is read (a namespaced include_vars), so the
# rest of the cluster file does not leak into roles that do not load it themselves; anything set earlier wins.
- name: "gitops | the cluster's committed target revision (fallback)"
  when: zuno_gitops_target_revision is not defined
  block:
    - name: "gitops | resolve this cluster's short name"
      ansible.builtin.include_tasks: "{{ zuno_repo_root }}/ansible/tasks/resolve_cluster_name.yml"

    - name: "gitops | check for the per-cluster cluster.yml of {{ cluster_name }}"
      ansible.builtin.stat:
        path: "{{ zuno_repo_root }}/ansible/inventories/{{ cluster_name }}/cluster.yml"
      register: _gitops_cluster_file

    - name: "gitops | check for the deprecated ansible/clusters file of {{ cluster_name }}"
      ansible.builtin.stat:
        path: "{{ zuno_repo_root }}/ansible/clusters/{{ cluster_name }}.yml"
      register: _gitops_cluster_legacy_file
      when: not _gitops_cluster_file.stat.exists

    - name: "gitops | read this cluster's cluster.yml into a private namespace"
      ansible.builtin.include_vars:
        file: >-
          {{ _gitops_cluster_file.stat.path if _gitops_cluster_file.stat.exists
             else _gitops_cluster_legacy_file.stat.path }}
        name: _gitops_cluster_file_vars
      when: _gitops_cluster_file.stat.exists or (_gitops_cluster_legacy_file.stat.exists | default(false))

    - name: "gitops | take its zuno_gitops_target_revision"
      ansible.builtin.set_fact:
        zuno_gitops_target_revision: "{{ _gitops_cluster_file_vars.zuno_gitops_target_revision }}"
      when:
        - _gitops_cluster_file.stat.exists or (_gitops_cluster_legacy_file.stat.exists | default(false))
        - _gitops_cluster_file_vars.zuno_gitops_target_revision | default('') | length > 0
