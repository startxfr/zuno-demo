---
# ADR-0595: the credentials every role uses to talk to the Keycloak master realm.
# The permanent `zuno-automation` account (Secret zuno-auth/keycloak-automation)
# when it exists, else the bootstrap admin (zuno-auth/keycloak-admin) - the
# fallback keeps a cluster that is not migrated yet working. Sets the facts
# _kc_automation_user and _kc_automation_password (never logged).
- name: "keycloak | read the automation credentials"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: zuno-auth
    name: keycloak-automation
  register: _kc_automation_secret
  no_log: true

- name: "keycloak | read the bootstrap admin credentials (fallback)"
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: zuno-auth
    name: keycloak-admin
  register: _kc_bootstrap_secret
  when: (_kc_automation_secret.resources | default([]) | length) == 0
  no_log: true

- name: "keycloak | fail if neither credential Secret exists"
  ansible.builtin.fail:
    msg: "Neither zuno-auth/keycloak-automation nor zuno-auth/keycloak-admin found - run `make d0 install keycloak` first."
  when: >-
    (_kc_automation_secret.resources | default([]) | length) == 0
    and (_kc_bootstrap_secret.resources | default([]) | length) == 0

- name: "keycloak | set the credentials facts"
  ansible.builtin.set_fact:
    _kc_automation_user: "{{ ((_kc_automation_secret.resources | default([]) | length > 0) | ternary(_kc_automation_secret, _kc_bootstrap_secret)).resources[0].data.username | b64decode }}"
    _kc_automation_password: "{{ ((_kc_automation_secret.resources | default([]) | length > 0) | ternary(_kc_automation_secret, _kc_bootstrap_secret)).resources[0].data.password | b64decode }}"
  no_log: true
