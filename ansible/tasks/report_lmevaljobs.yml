---
# ADR-0108/roadmap WP-10: report any LMEvalJob results (candidate
# local-model comparison, gitops/charts/models/templates/lmevaljob.yaml).
# Extracted from ansible/roles/models/tasks/precheck.yml (ADR-0534/WP-107)
# so trustyai_config's own precheck can reuse the exact same lookup/report
# logic rather than duplicating it, per ADR-0534's Operational
# considerations. Diagnostic only, never gates the including role's
# _state_is_installed - LM-Eval jobs are one-shot, per-candidate
# benchmarking runs (ADR-0108: "complements - never replaces - the
# per-agent ADR-0027 acceptance suites"), not a component any role installs
# or owns the lifecycle of. CRD may not exist yet if trustyai hasn't
# reconciled, hence ignore_errors rather than failing the whole check.
# Requires lmeval_namespace to be set by the including role.
- name: "lmevaljobs | validate lmeval_namespace is set"
  ansible.builtin.assert:
    that:
      - lmeval_namespace is defined
      - lmeval_namespace | length > 0
    fail_msg: "report_lmevaljobs.yml requires 'lmeval_namespace' to be set by the including role"

- name: "lmevaljobs | look up LMEvalJob resources (ADR-0108 candidate model comparison)"
  kubernetes.core.k8s_info:
    api_version: trustyai.opendatahub.io/v1alpha1
    kind: LMEvalJob
    namespace: "{{ lmeval_namespace }}"
  register: _lmevaljobs
  ignore_errors: true

- name: "lmevaljobs | report LMEvalJob results"
  ansible.builtin.debug:
    msg: >-
      LMEvalJob {{ item.metadata.name }}: state={{ item.status.state | default('unknown') }}
      reason={{ item.status.reason | default('unknown') }}
      {{ ('results=' + (item.status.results | default('(none yet)')))
         if (item.status.state | default('')) == 'Complete'
            and (item.status.reason | default('')) == 'Succeeded'
         else '(no trustworthy results: state must be Complete AND reason '
              + 'Succeeded - Complete alone also covers a lost/failed run, '
              + 'e.g. reason=Failed message=ContainerStatusUnknown after a '
              + 'node disruption - see ADR-0108)' }}
  loop: "{{ _lmevaljobs.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name | default('?') }}"
  when: (_lmevaljobs.resources | default([]) | length) > 0

- name: "lmevaljobs | note absence of LMEvalJob resources"
  ansible.builtin.debug:
    msg: >-
      No LMEvalJob resources found in {{ lmeval_namespace }} - no
      candidate model comparison has been run yet (ADR-0108, opt-in via
      gitops/charts/models's lmEval.jobs values).
  when: (_lmevaljobs.resources | default([]) | length) == 0
