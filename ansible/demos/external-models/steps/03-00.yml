---
# external-models 3:00 (5-minute version, step 4 of the 15-minute sequence). Do: `git show
# HEAD:platform/ai-gateway/provider-routing.yaml | awk '...'`, the three SaaS entries of the routing file and their
# data classes. Read from git, not with `cat`: the engine takes oc, make, curl and git commands (ADR-0616 clause 14).
# Run locally on 2026-11-16: 6 lines (`mistral` [C1], `mistral-codestral` and `ovhcloud-gpt-oss-120b` [C1, C2]).
- name: "external-models 3:00 | run the step's reads"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "git show HEAD:platform/ai-gateway/provider-routing.yaml | awk '/- name: (mistral|mistral-codestral|ovhcloud-gpt-oss-120b)$/{p=1;print} p&&/eligible_for/{print;p=0}'"
