# external-models 7:30 (15-minute version, step 8 of the 15-minute sequence). Do: `curl -s -o /dev/null -w
# '%{http_code}\n' -H "Authorization: Bearer $(oc whoami -t)" $MAAS/gpt-oss-20b/v1/models`, then the same on
# `$MAAS/mistral-large/v1/models` *(untested commands)*
# Generated by platform/demo/scaffold.py (WP-271). Review it and edit freely: the scaffolder never overwrites.
# Honest about the token: the file runs the curls with the token of whoever is logged in. The page's `200` is for a
# member of a group subscribed to gpt-oss-20b (the lead: MaaSSubscription gpt-oss-20b-builders, user paas-ops-01).
# Read on 2026-11-15 from the MaaS objects: MaaSAuthPolicy gpt-oss-20b-entitlement lists the groups sales, ocp-ai-dev,
# ocp-ai-ops, ocp-paas-ops, agent_arkos, agent_comage, agent_tekos, agent_tekos_preview and two ServiceAccounts, so
# `kube:admin` is not entitled and gets `403` on both models. mistral-large-entitlement lists only the ai-gateway
# ServiceAccount: `403` on mistral-large is right for every person.
- name: "external-models 7:30 | run the step's reads"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "curl -s -o /dev/null -w '%{http_code}\\n' -H \"Authorization: Bearer $(oc whoami -t)\" $MAAS/gpt-oss-20b/v1/models"
      - cmd: "curl -s -o /dev/null -w '%{http_code}\\n' -H \"Authorization: Bearer $(oc whoami -t)\" $MAAS/mistral-large/v1/models"
        page_text: "$MAAS/mistral-large/v1/models"
    not_run:
      - page_text: "the `200` on $MAAS/gpt-oss-20b/v1/models"
        reason: "the 200 needs the token of a member of a subscribed group (paas-ops-01, MaaSSubscription gpt-oss-20b-builders); the file runs with the logged-in user's token, so as kube:admin both curls return 403, which is not a failure of the platform"
