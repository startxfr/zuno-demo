---
# external-models: the cut list of its GIF (ADR-0618, WP-289), read by platform/demo/gif.py.
# `make demo record external-models` captures the 5-minute version as a real terminal session and checks it as text;
# `make demo record external-models render` replays it in xterm.js and films it, then cuts it with this list. The GIF
# stays in ~/.cache/zuno/demo/recordings/ until the owner's "go external-models".
# Markers written by the replay: start, then per row <MM-SS>-typed and <MM-SS>-done, then end. Each row is cut from
# the previous row's `done` (or `start`), so its screen clear and its typing are shown; `fit` sets the span's length
# whatever the cluster's answer time, `hold` the reading time of the output. Re-planned on 2026-11-16 when row 3:00
# became a command (the routing file read from git), before its first take: check the total and the longest still.
record_notice: >-
  a real terminal session on the cluster with your oc login: three read-only `oc get` commands, names, owners and
  states only, no Secret value, then a read of provider-routing.yaml from git
target_seconds: [40, 60]
width: 960
fps: 10
moments:
  - {from: start, to: 00-00-done, fit: 6, hold: 5, step: "0:00", caption: "0:00  Two SaaS models, declared like any platform object"}
  - {from: 00-00-done, to: 01-00-done, fit: 6, hold: 4, step: "1:00", caption: "1:00  Published on the same gateway as our own models"}
  - {from: 01-00-done, to: 02-00-done, fit: 9, hold: 4, step: "2:00", caption: "2:00  Who may call them? Only the platform's router"}
  - {from: 02-00-done, to: 03-00-done, fit: 9, hold: 1, step: "3:00", caption: "3:00  The router decides by data class; C3 stays here"}
  - {still: end, hold: 5, step: "4:15", caption: "No data to a SaaS model without the classification check"}
