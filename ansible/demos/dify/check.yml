---
# dify check: the page's `### Check` runs the golden-path probes dify (the model path through the token proxy) and
# tools (the Confluence MCP server answers) and the browser check dify. Neither runs the applications (Start).
# Pre-filled from demo333's live inventory of 2026-11-14: the five ExternalSecrets of zuno-dify are Ready.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-275 from the page.
- name: "dify check | the ExternalSecrets of zuno-dify"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "external-secrets.io/v1beta1", "kind": "ExternalSecret", "name": "dify-app", "namespace": "zuno-dify", "condition": "Ready"}
      - {"api_version": "external-secrets.io/v1beta1", "kind": "ExternalSecret", "name": "dify-front-door", "namespace": "zuno-dify", "condition": "Ready"}
      - {"api_version": "external-secrets.io/v1beta1", "kind": "ExternalSecret", "name": "dify-redis", "namespace": "zuno-dify", "condition": "Ready"}
      - {"api_version": "external-secrets.io/v1beta1", "kind": "ExternalSecret", "name": "zuno-dify-knowledge", "namespace": "zuno-dify", "condition": "Ready"}
      - {"api_version": "external-secrets.io/v1beta1", "kind": "ExternalSecret", "name": "zuno-token-proxy", "namespace": "zuno-dify", "condition": "Ready"}
- name: "dify check | queue the golden-path probes"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_probes.yml"
  vars:
    queue_probes:
      - "dify"
      - "tools"
- name: "dify check | queue the browser checks"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_browser.yml"
  vars:
    queue_browser:
      - "dify"
- name: "dify check | run the probes and browser checks once"
  ansible.builtin.include_tasks: "{{ demo_lib }}/flush_checks.yml"
- name: "dify check | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
