---
# dify status: the page's `### Status` reads: the Applications zuno-dify-d1, zuno-dify-knowledge-d1 and
# zuno-token-proxy-dify-d1, the Deployments of zuno-dify and the route dify.<apps domain>. Fast reads only.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-275 from the page.
- name: "dify status | Argo CD Applications"
  ansible.builtin.include_tasks: "{{ demo_lib }}/argo_apps.yml"
  vars:
    argo_apps:
      - "zuno-dify-d1"
      - "zuno-dify-knowledge-d1"
      - "zuno-token-proxy-dify-d1"
- name: "dify status | the Deployments of zuno-dify"
  ansible.builtin.include_tasks: "{{ demo_lib }}/workloads.yml"
  vars:
    workloads:
      - {"name": "dify-api", "namespace": "zuno-dify"}
      - {"name": "dify-worker", "namespace": "zuno-dify"}
      - {"name": "dify-beat", "namespace": "zuno-dify"}
      - {"name": "dify-web", "namespace": "zuno-dify"}
      - {"name": "dify-plugin-daemon", "namespace": "zuno-dify"}
      - {"name": "dify-nginx", "namespace": "zuno-dify"}
      - {"name": "dify-front-door", "namespace": "zuno-dify"}
      - {"name": "zuno-token-proxy", "namespace": "zuno-dify"}
      - {"name": "zuno-dify-knowledge", "namespace": "zuno-dify"}
      - {"name": "dify-redis-master", "namespace": "zuno-dify", "kind": "StatefulSet"}
- name: "dify status | the route"
  ansible.builtin.include_tasks: "{{ demo_lib }}/routes.yml"
  vars:
    routes:
      - {"namespace": "zuno-dify", "name": "dify", "host": "dify.{{ cluster_base_domain }}"}
- name: "dify status | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
