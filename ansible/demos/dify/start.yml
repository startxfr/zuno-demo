# dify start: the page's `### Start`: the file wakes the model with one answer through Dify's token proxy, the way the probe does; it does not run the applications. The page section `## Presenter lifecycle` > `### Start` lists what only a person does.
# The warm-up goes through the golden-path moment `dify` (a read with respect to the platform, allowed in a freeze:
# ADR-0605); it spends one short answer of the probe persona's budget.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-275 from the page.
- name: "dify start | wake the model: one answer through the golden-path moment dify"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_probes.yml"
  vars:
    queue_probes:
      - "dify"
- name: "dify start | run it"
  ansible.builtin.include_tasks: "{{ demo_lib }}/flush_checks.yml"
- name: "dify start | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
