---
# world-model uninstall: it removes nothing (the owner's decision of 2026-11-15). The GPU node keeps billing until the
# owner removes it by hand; the file shows what is still there and prints the owner's actions. Read-only.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-279 from the page.
- name: "world-model uninstall | what is still there"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get nodes -l zuno.io/gpu-workload=world-model"
      - "oc get pods -n zuno-world-model"
- name: "world-model uninstall | the owner's actions, never run by this file"
  ansible.builtin.set_fact:
    demo_unit_messages: >-
      {{ demo_unit_messages + [
      'Nothing was removed. Owner, by hand, after the session (page, Uninstall): 1. make d2 uninstall world-model;
      2. set zuno_world_model_enabled: false in ansible/clusters/demo333.yml, commit and push; 3. make d0 uninstall
      world-model-gpu, which terminates the world-model GPU node only.'] }}
