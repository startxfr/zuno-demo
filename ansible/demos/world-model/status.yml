---
# world-model status: the page's `### Status` reads, without changing anything: the flag zuno_world_model_enabled in
# ansible/inventories/demo333/cluster.yml (from the checkout, not the cluster), the namespace zuno-world-model, the node labelled
# zuno.io/gpu-workload=world-model, and the world-model Application. Off is the demo's normal state today: no node,
# no Application, and the reads below pass with nothing to show. It reads no MachineSet.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-279 from the page.
- name: "world-model status | the flag, the namespace, the GPU node, the Application and the pods"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "git show HEAD:ansible/inventories/demo333/cluster.yml | grep -E '^zuno_world_model_enabled:'"
      - cmd: "oc get namespaces | grep zuno-world-model"
        may_be_empty: true
      - "oc get nodes -l zuno.io/gpu-workload=world-model"
      - cmd: "oc get applications.argoproj.io -n openshift-gitops | grep world-model"
        may_be_empty: true
      - "oc get pods -n zuno-world-model"
