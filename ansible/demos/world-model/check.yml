---
# world-model check: the page's `### Check` runs the golden-path probe world-model: it creates a world as ai-ops-01
# from inside the web pod. While the application is not installed it reports `roadmap`: use the recording. After an
# Install, `make d2 check world-model` is the deeper preflight (GPU node, the runtime engine and the image model,
# the encoder, Keycloak, the ai-gateway, the Route), run by hand.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-279 from the page.
- name: "world-model check | the Grafana dashboard exists"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "grafana.integreatly.org/v1beta1", "kind": "GrafanaDashboard", "name": "world-model", "namespace": "zuno-monitoring", "exists": true}
- name: "world-model check | queue the golden-path probes"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_probes.yml"
  vars:
    queue_probes:
      - "world-model"
- name: "world-model check | run the probe once"
  ansible.builtin.include_tasks: "{{ demo_lib }}/flush_checks.yml"
- name: "world-model check | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
