---
# world-model install: it never creates the GPU node (the owner's decision of 2026-11-15, asked for ADR-0616 clause 7:
# a GPU node is infrastructure and needs the owner's double approval). The file refuses while
# zuno_world_model_enabled is not true on origin/devel (as this checkout last fetched it). When it is true, it only
# reads what exists (the image tags too) and prints the owner's actions, the image build included, which the owner
# runs by hand. Read-only: no MachineSet is read or
# scaled here.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-279 from the page.
- name: "world-model install | the flag on origin/devel"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "git show origin/devel:ansible/inventories/demo333/cluster.yml | grep -E '^zuno_world_model_enabled:'"
- name: "world-model install | is the demo switched on"
  ansible.builtin.set_fact:
    _world_model_on: "{{ ((demo_unit_commands | last).output | default('')) is search('zuno_world_model_enabled: *true') }}"
- name: "world-model install | refuse while the flag is not true on origin/devel"
  ansible.builtin.fail:
    msg: >-
      REFUSED: zuno_world_model_enabled is not true on origin/devel (ansible/inventories/demo333/cluster.yml, as of the last git
      fetch). Nothing is installed. The demo is off: use the recording (page, Start).
  when: not _world_model_on
- name: "world-model install | what exists now"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get nodes -l zuno.io/gpu-workload=world-model"
      - cmd: "oc get applications.argoproj.io -n openshift-gitops | grep world-model"
        may_be_empty: true
      - "oc get pods -n zuno-world-model"
# The internal registry bucket was emptied in the incident of 2026-11-15 and the world-model images were not rebuilt:
# an ImageStream tag can outlive its image, so the read below shows which tags exist and proves nothing more. No line
# is not a failure here; the owner's build (action 3) is what brings the images back.
- name: "world-model install | the world-model image tags the registry still lists"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - cmd: "oc get imagestreamtags -n zuno-ai-build | grep -E '^world-model-(runtime|web):latest'"
        may_be_empty: true
- name: "world-model install | the owner's actions, never run by this file"
  ansible.builtin.set_fact:
    demo_unit_messages: >-
      {{ demo_unit_messages + [
      'INFRASTRUCTURE: the GPU node needs the double approval of the platform owner, given before anything runs.',
      'Owner, by hand, in this order (page, Install): 1. make d0 install world-model-gpu (local, about 15 minutes);
      2. wait for exactly one node labelled zuno.io/gpu-workload=world-model; 3. make d2 build world-model (the images
      were not rebuilt after the incident of 2026-11-15: a tag listed above does not prove its image is still in the
      registry); 4. make d2 install world-model (about 13 minutes); 5. make d2 check world-model, which must be green.'] }}
