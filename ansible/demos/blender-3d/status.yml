---
# blender-3d status: the page's `### Status` reads, without changing anything: the Route
# zuno-agent-gateway-workstation-ai-gateway (openshift-ingress), the HTTPRoute ai-gateway-workstation, the AuthPolicy
# ai-gateway-workstation-jwt and the RateLimitPolicy ai-gateway-workstation (Accepted and Enforced), the Deployment
# ai-gateway, the models gpt-oss-20b and qwen35-9b (Ready) and the Applications zuno-connectivity-link-d1 and
# zuno-ai-gateway-d1. The demo never installs the entry.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-279 from the page.
- name: "blender-3d status | Argo CD Applications"
  ansible.builtin.include_tasks: "{{ demo_lib }}/argo_apps.yml"
  vars:
    argo_apps:
      - "zuno-connectivity-link-d1"
      - "zuno-ai-gateway-d1"
- name: "blender-3d status | the ai-gateway"
  ansible.builtin.include_tasks: "{{ demo_lib }}/workloads.yml"
  vars:
    workloads:
      - {"name": "ai-gateway", "namespace": "zuno-ai-run"}
- name: "blender-3d status | the workstation entry's Route"
  ansible.builtin.include_tasks: "{{ demo_lib }}/routes.yml"
  vars:
    routes:
      - {"namespace": "openshift-ingress", "name": "zuno-agent-gateway-workstation-ai-gateway"}
- name: "blender-3d status | the entry's HTTPRoute and policies, and the two models"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "gateway.networking.k8s.io/v1", "kind": "HTTPRoute", "name": "ai-gateway-workstation", "namespace": "zuno-ai-run", "parents": "Accepted"}
      - {"api_version": "kuadrant.io/v1", "kind": "AuthPolicy", "name": "ai-gateway-workstation-jwt", "namespace": "zuno-ai-run", "condition": "Accepted"}
      - {"api_version": "kuadrant.io/v1", "kind": "AuthPolicy", "name": "ai-gateway-workstation-jwt", "namespace": "zuno-ai-run", "condition": "Enforced"}
      - {"api_version": "kuadrant.io/v1", "kind": "RateLimitPolicy", "name": "ai-gateway-workstation", "namespace": "zuno-ai-run", "condition": "Accepted"}
      - {"api_version": "kuadrant.io/v1", "kind": "RateLimitPolicy", "name": "ai-gateway-workstation", "namespace": "zuno-ai-run", "condition": "Enforced"}
      - {"api_version": "serving.kserve.io/v1alpha2", "kind": "LLMInferenceService", "name": "gpt-oss-20b", "namespace": "zuno-ai-run", "condition": "Ready"}
      - {"api_version": "serving.kserve.io/v1alpha2", "kind": "LLMInferenceService", "name": "qwen35-9b", "namespace": "zuno-ai-run", "condition": "Ready"}
- name: "blender-3d status | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
