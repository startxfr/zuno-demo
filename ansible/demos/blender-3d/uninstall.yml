---
# blender-3d uninstall: DECLARED CHANGING in demo.yml (`mutations: uninstall`), on the presenter's workstation only
# (the owner's decision of 2026-11-14): evaluations/blender/install_addon.sh --remove deletes the add-on from the
# Blender user add-on folders. The platform entry stays: it is shared. Closing it is an owner action the page
# describes; the lifecycle never runs it.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-279 from the page.
- name: "blender-3d uninstall | remove the add-on from this workstation"
  ansible.builtin.command:
    argv: ["bash", "{{ zuno_repo_root }}/evaluations/blender/install_addon.sh", "--remove"]
    chdir: "{{ zuno_repo_root }}"
  register: _blender_addon
  changed_when: _blender_addon.rc == 0 and 'removed' in _blender_addon.stdout
  failed_when: false
- name: "blender-3d uninstall | record what the script did"
  ansible.builtin.set_fact:
    demo_unit_commands: >-
      {{ demo_unit_commands + [{'cmd': 'bash evaluations/blender/install_addon.sh --remove', 'rc': _blender_addon.rc,
         'output': (_blender_addon.stdout_lines + _blender_addon.stderr_lines) | join(_blender_nl),
         'truncated': false}] }}
    demo_unit_messages: >-
      {{ demo_unit_messages + ['The platform entry stays (shared). Closing it is an owner action, never run here: see
      the page, Uninstall.'] }}
  vars:
    _blender_nl: "\n"
