---
# blender-3d check: the page's `### Check` runs the golden-path probe blender. It signs in as test-eval-ai-dev-01 by the
# device flow with no human, and proves the entry, the token, the C3 floor and a local answer, not the add-on on the
# laptop. Run it within the hour before the session.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-279 from the page.
- name: "blender-3d check | queue the golden-path probes"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_probes.yml"
  vars:
    queue_probes:
      - "blender"
- name: "blender-3d check | run the probe once"
  ansible.builtin.include_tasks: "{{ demo_lib }}/flush_checks.yml"
- name: "blender-3d check | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
