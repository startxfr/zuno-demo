---
# blender-3d install: DECLARED CHANGING in demo.yml (`mutations: install`), on the presenter's workstation only. The
# platform entry is verified, never installed. Then the file installs or updates the add-on with
# evaluations/blender/install_addon.sh: it fetches origin/devel and copies zuno_3d_generator.py into the Blender user
# add-on folder. Nothing is installed on the cluster. The page lists the prerequisites and what to do in Blender.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-279 from the page.
- name: "blender-3d install | the platform entry is there (verified, never installed)"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "gateway.networking.k8s.io/v1", "kind": "HTTPRoute", "name": "ai-gateway-workstation", "namespace": "zuno-ai-run", "parents": "Accepted"}
      - {"api_version": "kuadrant.io/v1", "kind": "AuthPolicy", "name": "ai-gateway-workstation-jwt", "namespace": "zuno-ai-run", "condition": "Enforced"}
      - {"api_version": "kuadrant.io/v1", "kind": "RateLimitPolicy", "name": "ai-gateway-workstation", "namespace": "zuno-ai-run", "condition": "Enforced"}
- name: "blender-3d install | install or update the add-on on this workstation"
  ansible.builtin.command:
    argv: ["bash", "{{ zuno_repo_root }}/evaluations/blender/install_addon.sh"]
    chdir: "{{ zuno_repo_root }}"
  register: _blender_addon
  changed_when: _blender_addon.rc == 0 and 'updated' in _blender_addon.stdout
  failed_when: false
- name: "blender-3d install | record what the script did"
  ansible.builtin.set_fact:
    demo_unit_commands: >-
      {{ demo_unit_commands + [{'cmd': 'bash evaluations/blender/install_addon.sh', 'rc': _blender_addon.rc,
         'output': (_blender_addon.stdout_lines + _blender_addon.stderr_lines) | join(_blender_nl),
         'truncated': false}] }}
  vars:
    _blender_nl: "\n"
- name: "blender-3d install | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
