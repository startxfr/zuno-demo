---
# image-signing-admission check: the demo's own assertions, its golden-path probes and its browser check (ADR-0616
# clause 9). The page section `## Presenter lifecycle` > `### Check` says what the presenter does after it.
# Generated by platform/demo/scaffold.py (WP-271). Review it and edit freely: the scaffolder never overwrites.
# Pre-filled from demo333's live inventory of 2026-11-14 (`oc get` only).
# No golden-path probe covers this demo: rehearse it the same day (status banner).
- name: "image-signing-admission check | resources ready"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "machineconfiguration.openshift.io/v1", "kind": "MachineConfigPool", "name": "master", "condition": "Updated"}
      - {"api_version": "machineconfiguration.openshift.io/v1", "kind": "MachineConfigPool", "name": "worker", "condition": "Updated"}
      - {"api_version": "rhtas.redhat.com/v1", "kind": "Securesign", "name": "zuno-securesign", "namespace": "zuno-rhtas", "condition": "Ready"}
      - {"api_version": "quay.redhat.com/v1", "kind": "QuayRegistry", "name": "quay", "namespace": "zuno-registry", "condition": "Available"}
      - {"api_version": "batch/v1", "kind": "Job", "name": "supply-chain-verify-images", "namespace": "zuno-ai-build", "condition": "Complete"}
      - {"api_version": "config.openshift.io/v1", "kind": "ImageDigestMirrorSet", "name": "zuno-unifai-via-registry", "exists": true}
      - {"api_version": "config.openshift.io/v1", "kind": "ImageDigestMirrorSet", "name": "zuno-public-via-registry", "exists": true}
      - {"api_version": "operators.coreos.com/v1alpha1", "kind": "ClusterServiceVersion", "name_prefix": "rhtas-operator.v", "namespace": "openshift-operators", "phase": "Succeeded"}
- name: "image-signing-admission check | the policy controller Deployment, the ClusterImagePolicies and their modes"
  ansible.builtin.include_tasks: "{{ demo_lib }}/workloads.yml"
  vars:
    workloads:
      - {"name": "zuno-policy-controller-webhook", "namespace": "policy-controller-operator"}
- name: "image-signing-admission check | the two policies shown on stage exist, and every policy lists its mode"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "policy.sigstore.dev/v1beta1", "kind": "ClusterImagePolicy", "name": "zuno-first-party-images", "exists": true}
      - {"api_version": "policy.sigstore.dev/v1beta1", "kind": "ClusterImagePolicy", "name": "zuno-unifai-images-unifai-ui", "exists": true}
- name: "image-signing-admission check | the modes (all `enforce` but `openshift`, OpenShift's own)"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get clusterimagepolicies.policy.sigstore.dev -o custom-columns=NAME:.metadata.name,MODE:.spec.mode"
- name: "image-signing-admission check | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
