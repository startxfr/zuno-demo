---
# image-signing-admission: the cut list of its GIF (ADR-0618, WP-289), read by platform/demo/gif.py.
# `make demo record image-signing-admission` captures the 5-minute version as a real terminal session and checks it
# as text; `make demo record image-signing-admission render` replays it in xterm.js and films it, then cuts it with
# this list. The GIF stays in ~/.cache/zuno/demo/recordings/ until the owner's "go image-signing-admission".
# Markers written by the replay: start, then per row <MM-SS>-typed and <MM-SS>-done, then end. Each row is cut from
# the previous row's `done` (or `start`), so its screen clear and its typing are shown; `fit` sets the span's length
# whatever the cluster's answer time, `hold` the reading time of the output. Planned before the first take from the
# typing pace of the vault-pki take (about 0.05 s a character): check the total and the longest still after it.
record_notice: >-
  a real terminal session on the cluster with your oc login: four read-only `oc get` commands, names, modes and
  URLs only, no Secret value
target_seconds: [40, 60]
width: 960
fps: 10
moments:
  - {from: start, to: 00-00-done, fit: 6, hold: 4, step: "0:00", caption: "0:00  Our own signer in the cluster: Fulcio, Rekor, TUF"}
  - {from: 00-00-done, to: 01-15-done, fit: 8, hold: 4, step: "1:15", caption: "1:15  Every policy in enforce: a bad signature is refused"}
  - {from: 01-15-done, to: 02-30-done, fit: 6, hold: 3, step: "2:30", caption: "2:30  A namespace opts in to the check"}
  - {from: 02-30-done, to: 03-15-done, fit: 9, hold: 1, step: "3:15", caption: "3:15  Same digest, pulled from our own Quay"}
  - {still: end, hold: 4, step: "4:15", caption: "What runs here is signed, and the signer is named"}
