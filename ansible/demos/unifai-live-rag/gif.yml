---
# unifai-live-rag: the first cut list of its GIF (ADR-0618, WP-288), read by platform/demo/gif.py. Written BEFORE the
# first take: tune it with `make demo gif unifai-live-rag` once a take exists.
# `make demo record unifai-live-rag` takes the 5-minute version as consultant-01
# (evaluations/browser/walkthroughs/unifai-live-rag.mjs). It uploads nothing: `make demo start unifai-live-rag` does.
# Markers written by the walkthrough, in order: login, home, documents, chat-new, q1-sent, q1-done, q2-done, end.
# The answers are live model answers: no caption quotes one, and the motion moments use `fit`.
record_notice: >-
  a recorded browser session as consultant-01 on UnifAI: 2 real answers of the workflow consultant-01-my-documents
  on consultant-01's budget; the session it creates is deleted at the end, and the take fails if consultant-01's
  sessions differ before and after; it uploads and deletes no document (`make demo start` and `stop` do); traces and
  metrics of the two answers remain, as for any use
target_seconds: [40, 60]
width: 960
fps: 10
moments:
  - {still: login, hold: 3, caption: "Sign in with the company account"}
  - {still: documents, hold: 6, step: "0:00", caption: "0:00  My own documents, converted and embedded here"}
  - {still: chat-new, hold: 3, step: "2:00", caption: "2:00  A workflow that runs as me"}
  - {from: q1-sent, to: q1-done, fit: 10, hold: 5, caption: "The answer cites my document"}
  - {from: q1-done, to: q2-done, fit: 10, hold: 4, step: "3:15", caption: "3:15  It says so when the documents do not say"}
  - {still: end, hold: 5, step: "4:15", caption: "Answered from my upload, and it stays mine"}
