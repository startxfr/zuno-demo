---
# mcp-tools-by-group status: the page's `### Status` reads: the Applications of the mcp-gateway and of the
# Confluence and k8s MCP servers, the Deployments mcp-gateway and open-webui, the MCP servers confluence-mcp,
# k8s-mcp, git-forge-mcp, aap-mcp and diagram-render, the ExternalSecret zuno-tool-marker-key, the gateway's
# entitlement environment, Grafana and the local models.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-276 from the page.
- name: "mcp-tools-by-group status | Argo CD Applications"
  ansible.builtin.include_tasks: "{{ demo_lib }}/argo_apps.yml"
  vars:
    argo_apps:
      - "zuno-mcp-d0"
      - "zuno-mcp-d1"
      - "zuno-mcp-confluence-d0"
      - "zuno-mcp-confluence-d1"
      - "zuno-mcp-k8s-d0"
      - "zuno-mcp-k8s-d1"
- name: "mcp-tools-by-group status | the gateway, the five MCP servers, Open WebUI and Grafana"
  ansible.builtin.include_tasks: "{{ demo_lib }}/workloads.yml"
  vars:
    workloads:
      - {"name": "mcp-gateway", "namespace": "zuno-ai-run"}
      - {"name": "confluence-mcp", "namespace": "zuno-ai-run"}
      - {"name": "k8s-mcp", "namespace": "zuno-ai-run"}
      - {"name": "git-forge-mcp", "namespace": "zuno-ai-run"}
      - {"name": "aap-mcp", "namespace": "zuno-ai-run"}
      - {"name": "diagram-render", "namespace": "zuno-ai-run"}
      - {"name": "open-webui", "namespace": "zuno-openwebui"}
      - {"name": "grafana-deployment", "namespace": "zuno-monitoring"}
- name: "mcp-tools-by-group status | the tool marker key"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "external-secrets.io/v1beta1", "kind": "ExternalSecret", "name": "zuno-tool-marker-key", "namespace": "zuno-ai-run", "condition": "Ready"}
- name: "mcp-tools-by-group status | the gateway's entitlement environment"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc set env deploy/mcp-gateway -n zuno-ai-run --list | grep -E '^(AGENT_ENTITLEMENT_EVERY_CALL|AGENT_CHAIN_VERIFY|MCP_FRONTDOOR_CAPABILITIES)='"
- name: "mcp-tools-by-group status | the local models, and how many are Ready (the count read fails at zero)"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get llminferenceservice -n zuno-ai-run"
      - "oc get llminferenceservice -n zuno-ai-run --no-headers | grep -c True"
- name: "mcp-tools-by-group status | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
