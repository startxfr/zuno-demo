---
# mcp-tools-by-group check: the page's `### Check` runs the golden-path probes tools (one Confluence search through
# the gateway's REST door, as consultant-01 with a token of the Keycloak client zuno-evaluations) and open-webui
# (the 5-minute version uses it). The 5:00 row runs `ONLY=tools make demo golden-path` again on stage: a read.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-276 from the page.
- name: "mcp-tools-by-group check | queue the golden-path probes"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_probes.yml"
  vars:
    queue_probes:
      - "tools"
      - "open-webui"
- name: "mcp-tools-by-group check | run them once"
  ansible.builtin.include_tasks: "{{ demo_lib }}/flush_checks.yml"
- name: "mcp-tools-by-group check | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
