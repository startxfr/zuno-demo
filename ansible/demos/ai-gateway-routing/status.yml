---
# ai-gateway-routing status: the page's `### Status` reads: the Applications of the ai-gateway, the llm chart and
# Open WebUI, the Deployments ai-gateway and open-webui, the gateway's routing environment, the ConfigMaps
# ai-gateway-model-routing and zuno-provider-routing, the ExternalSecret llm-provider-mistral-codestral (Codestral's
# key itself is not tested), the local models, Grafana and tempo-tempo-0.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-276 from the page.
- name: "ai-gateway-routing status | Argo CD Applications"
  ansible.builtin.include_tasks: "{{ demo_lib }}/argo_apps.yml"
  vars:
    argo_apps:
      - "zuno-ai-gateway-d0"
      - "zuno-ai-gateway-d1"
      - "zuno-llm-d1"
      - "zuno-open-webui-d1"
- name: "ai-gateway-routing status | the gateway, Open WebUI, Grafana and Tempo"
  ansible.builtin.include_tasks: "{{ demo_lib }}/workloads.yml"
  vars:
    workloads:
      - {"name": "ai-gateway", "namespace": "zuno-ai-run"}
      - {"name": "open-webui", "namespace": "zuno-openwebui"}
      - {"name": "grafana-deployment", "namespace": "zuno-monitoring"}
      - {"name": "tempo-tempo-0", "namespace": "zuno-monitoring", "kind": "Pod"}
- name: "ai-gateway-routing status | the gateway's routing environment"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc set env deploy/ai-gateway -n zuno-ai-run --list | grep -E '^(MODEL_TASK_ALIASES|MODEL_READINESS_ENABLED|CIRCUIT_BREAKER_ENABLED|CIRCUIT_OPEN_SECONDS)='"
- name: "ai-gateway-routing status | the routing ConfigMaps and the Codestral ExternalSecret"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "v1", "kind": "ConfigMap", "name": "ai-gateway-model-routing", "namespace": "zuno-ai-run", "exists": true}
      - {"api_version": "v1", "kind": "ConfigMap", "name": "zuno-provider-routing", "namespace": "zuno-ai-run", "exists": true}
      - {"api_version": "external-secrets.io/v1beta1", "kind": "ExternalSecret", "name": "llm-provider-mistral-codestral", "namespace": "zuno-ai-run", "condition": "Ready"}
- name: "ai-gateway-routing status | the local models, and how many are Ready (the count read fails at zero)"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get llminferenceservice -n zuno-ai-run"
      - "oc get llminferenceservice -n zuno-ai-run --no-headers | grep -c True"
- name: "ai-gateway-routing status | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
