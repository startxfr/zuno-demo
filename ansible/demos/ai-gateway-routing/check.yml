---
# ai-gateway-routing check: the page's `### Check` runs the golden-path probe zuno-code: one code question with the
# zuno-code model through Open WebUI, as eval-consultant-01. The block `### The coding pair: C1 and C3` is not a
# step (ADR-0616 clause 2): an owner action.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-276 from the page.
- name: "ai-gateway-routing check | queue the golden-path probes"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_probes.yml"
  vars:
    queue_probes:
      - "zuno-code"
- name: "ai-gateway-routing check | run them once"
  ansible.builtin.include_tasks: "{{ demo_lib }}/flush_checks.yml"
- name: "ai-gateway-routing check | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
