# lora-pipeline-mlflow-kueue check: the demo's own assertions, its golden-path probes and its browser check
# (ADR-0616 clause 9). The page section `## Presenter lifecycle` > `### Check` says what the presenter does after
# it.
# Generated by platform/demo/scaffold.py (WP-271). Review it and edit freely: the scaffolder never overwrites.
# Pre-filled from demo333's live inventory of 2026-11-14 (`oc get` only).
# Skipped: MachineSet zuno-gpu-burst-a: only the world-model directory reads a MachineSet; the page's `oc get
# machinesets` step shows it.
# Not asserted: the DSPA Ready condition. It was False on 2026-11-13 (WorkflowControllerReady=False, the workflow
# controller crash-looping) and the page names it a known failure: the page shows past runs only, so APIServerReady
# is what the run list needs.
# No golden-path probe covers this demo: rehearse it the same day (status banner).
- name: "lora-pipeline-mlflow-kueue check | resources ready"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "datasciencepipelinesapplications.opendatahub.io/v1", "kind": "DataSciencePipelinesApplication", "name": "mlops-dspa", "namespace": "zuno-mlops", "condition": "APIServerReady"}
      - {"api_version": "mlflow.opendatahub.io/v1", "kind": "MLflow", "name": "mlflow", "condition": "Available"}
      - {"api_version": "trainer.kubeflow.org/v1alpha1", "kind": "TrainJob", "name": "lora-comage-4c28m", "namespace": "zuno-mlops", "condition": "Complete"}
      - {"api_version": "kueue.x-k8s.io/v1beta2", "kind": "ClusterQueue", "name": "default", "condition": "Active"}
      - {"api_version": "serving.kserve.io/v1alpha2", "kind": "LLMInferenceService", "name": "qwen35-9b", "namespace": "zuno-ai-run", "condition": "Ready"}
- name: "lora-pipeline-mlflow-kueue check | the TrainJob evidence (lora-comage-4c28m is Complete)"
  ansible.builtin.include_tasks: "{{ demo_lib }}/trainjob_evidence.yml"
- name: "lora-pipeline-mlflow-kueue check | the MLflow address ends in /mlflow"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get mlflow mlflow -o jsonpath='{.status.address.url}' | grep /mlflow$"
- name: "lora-pipeline-mlflow-kueue check | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
