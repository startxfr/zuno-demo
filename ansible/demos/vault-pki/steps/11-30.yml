---
# vault-pki 11:30 (15-minute version): the issuers and istiod. It was row 10:30 before the Vault web UI
# took the 5-minute version (ADR-0628, WP-331, 2026-11-23).
- name: "vault-pki 11:30 | run the step's reads"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get clusterissuers"
      - "oc get certificate istiod -n zuno-mesh -o jsonpath='{.spec.issuerRef.name}{\"  notAfter \"}{.status.notAfter}{\"  renewal \"}{.status.renewalTime}{\"\\n\"}'"
