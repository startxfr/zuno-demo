---
# vault-pki 7:15 (15-minute version): the three design lines, then the chart's Route. It was row 5:00 before the Vault web UI
# took the 5-minute version (ADR-0628, WP-331, 2026-11-23).
# The second read shows the chart's Route zuno-vault (reencrypt, host vault.<apps domain>) since ADR-0628
# (2026-11-23); the passthrough Route `vault` made by hand on 2026-11-17 was deleted then.
- name: "vault-pki 7:15 | run the step's reads"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get cm zuno-vault-config -n zuno-vault -o jsonpath='{.data.extraconfig-from-values\\.hcl}' | grep -E '^(storage|seal|listener)'"
      - "oc get route -n zuno-vault"
