---
# vault-pki 5:00 (15-minute version): unseal: the Vault pod and its labels. It was row 0:00 before the Vault web UI
# took the 5-minute version (ADR-0628, WP-331, 2026-11-23).
- name: "vault-pki 5:00 | run the step's reads"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get pods -n zuno-vault -L vault-sealed,vault-active,vault-version"
