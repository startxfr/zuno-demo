---
# vault-pki 0:00 (5-minute version). Terminal: platform/vault/demo_token.sh mints the read-only demo-reader token (30 minutes) and copies it to the
# clipboard. The script is not an `oc` read: the step runs nothing (the presenter runs it; the GIF shows its output).
# ADR-0628, WP-331 (2026-11-23). Nothing to run.
- name: "vault-pki 0:00 | nothing to run"
  ansible.builtin.include_tasks: "{{ demo_lib }}/nothing_to_run.yml"
