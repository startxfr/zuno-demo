---
# vault-pki 10:30 (15-minute version): the certificates cert-manager issues. It was row 3:15 before the Vault web UI
# took the 5-minute version (ADR-0628, WP-331, 2026-11-23).
- name: "vault-pki 10:30 | run the step's reads"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get certificates -A -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,ISSUER:.spec.issuerRef.name,READY:.status.conditions[?(@.type==\"Ready\")].status,EXPIRES:.status.notAfter' | grep -E 'NAMESPACE|letsencrypt|vault-issuer'"
