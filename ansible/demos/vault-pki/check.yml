---
# vault-pki check: the demo's own assertions, its golden-path probes and its browser check (ADR-0616 clause 9). The
# page section `## Presenter lifecycle` > `### Check` says what the presenter does after it.
# Generated by platform/demo/scaffold.py (WP-271). Review it and edit freely: the scaffolder never overwrites.
# Pre-filled from demo333's live inventory of 2026-11-14 (`oc get` only).
# No golden-path probe covers this demo: rehearse it the same day (status banner).
- name: "vault-pki check | resources ready"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "cert-manager.io/v1", "kind": "ClusterIssuer", "name": "letsencrypt-route53", "condition": "Ready"}
      - {"api_version": "cert-manager.io/v1", "kind": "ClusterIssuer", "name": "letsencrypt-route53-staging", "condition": "Ready"}
      - {"api_version": "cert-manager.io/v1", "kind": "ClusterIssuer", "name": "vault-issuer", "condition": "Ready"}
      - {"api_version": "cert-manager.io/v1", "kind": "ClusterIssuer", "name": "vault-issuer-istio", "condition": "Ready"}
      - {"api_version": "cert-manager.io/v1", "kind": "Certificate", "name": "router-wildcard-tls", "namespace": "openshift-ingress", "condition": "Ready"}
      - {"api_version": "cert-manager.io/v1", "kind": "Certificate", "name": "api-server-tls", "namespace": "openshift-config", "condition": "Ready"}
      - {"api_version": "cert-manager.io/v1", "kind": "Certificate", "name": "keycloak-wildcard-tls", "namespace": "zuno-auth", "condition": "Ready"}
      - {"api_version": "cert-manager.io/v1", "kind": "Certificate", "name": "istiod", "namespace": "zuno-mesh", "condition": "Ready"}
- name: "vault-pki check | the Vault pod labels and the ExternalSecrets (only `SecretSynced`); no Secret is read"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get pods -n zuno-vault -L vault-sealed,vault-active,vault-version"
      - "oc get externalsecrets -A --no-headers | awk '{print $(NF-1)}' | sort | uniq -c"
- name: "vault-pki check | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
