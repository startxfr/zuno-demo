---
# vault-pki: the cut list of its GIF (ADR-0618, ADR-0628, WP-331), read by platform/demo/gif.py with
# `make demo gif vault-pki`. An ASSEMBLED take (owner's decision, 2026-11-23): no recorder run by `make demo record`.
# It is assembled by hand in the cache, never in git, from two real takes of the same day, each listed in
# markers.json `source` with its SHA-256 (gif.py checks them before it cuts):
#   token   a still of a real terminal run of platform/vault/demo_token.sh, captured and rendered with the terminal-take
#           tools (platform/demo/session.py, render.py): the line "Vault token copied to the clipboard: role
#           demo-reader, policies demo-reader, valid 30 min." The token is never printed, so no frame holds it.
#           An altered source (one frame of the rendered video).
#   the rest  the browser take of evaluations/browser/walkthroughs/vault-pki.mjs (record.sh, VAULT_DEMO_TOKEN typed
#           into the masked token field): its marker PNGs and recording.webm.
# Privacy review (ADR-0618 clause 9) before the owner's "go vault-pki": every still, and the frames of every motion
# moment by number. Nothing may show a token, a secret value or a password: the token field shows dots, and the
# token's policy cannot read a value. Timings are first estimates, tuned on the take.
target_seconds: [40, 60]
width: 960
fps: 10
moments:
  - {still: token, hold: 5, step: "0:00", caption: "0:00  A read-only Vault token, 30 min, never on screen"}
  - {still: login, hold: 3, step: "0:45", caption: "0:45  Vault's own web UI, signed in with that token"}
  - {still: secrets, hold: 6, step: "0:45", caption: "0:45  Secret names and versions only, never a value"}
  - {from: secrets, to: access, fit: 6, hold: 3, step: "1:45", caption: "1:45  One Kubernetes role per namespace"}
  - {from: access, to: policy, fit: 6, hold: 4, step: "2:45", caption: "2:45  A namespace's policy: 18 paths, read only"}
  - {from: policy, to: transit, fit: 5, hold: 4, step: "3:30", caption: "3:30  Transit signing keys never leave Vault"}
  - {from: transit, to: pki, fit: 5, hold: 4, step: "3:30", caption: "3:30  Vault's PKI: the mesh's certificate authority"}
  - {still: end, hold: 4, step: "4:15", caption: "Vault holds every credential, each namespace its own"}
