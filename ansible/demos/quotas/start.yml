---
# quotas start: DECLARED CHANGING in demo.yml (`mutations: start`): it spends sale-01's token budget, hours before
# the session, so the Grafana panel and the trace have something to show. The spend is not undone; the 24-hour
# window restarts at 00:00 UTC. The file asks one short question through sale-01's OpenClaw assistant, with the
# golden-path moment openclaw (which also asks consultant-02's assistant one). No golden-path moment signs in to
# Open WebUI as sale-01: that question stays the presenter's, and the file says so.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-276 from the page.
- name: "quotas start | one short question through each OpenClaw assistant (golden-path moment openclaw)"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_probes.yml"
  vars:
    queue_probes:
      - "openclaw"
- name: "quotas start | run it"
  ansible.builtin.include_tasks: "{{ demo_lib }}/flush_checks.yml"
- name: "quotas start | what is left to the presenter"
  ansible.builtin.set_fact:
    demo_unit_messages: >-
      {{ demo_unit_messages + ['By hand, hours before the session: ask one question in Open WebUI as sale-01 (no
      golden-path moment signs in as sale-01), so the budget panel shows two clients for one persona.'] }}
- name: "quotas start | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
