---
# quotas status: the page's `### Status` reads: the Applications of the ai-gateway and of Redis, the Deployment
# ai-gateway and its quota environment (and no QUOTA_STRESSTEST_GROUP), the StatefulSet zuno-redis-master with its
# volume, the MaaS subscription gpt-oss-20b-platform, Grafana, Tempo and the local models.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-276 from the page.
- name: "quotas status | Argo CD Applications"
  ansible.builtin.include_tasks: "{{ demo_lib }}/argo_apps.yml"
  vars:
    argo_apps:
      - "zuno-ai-gateway-d0"
      - "zuno-ai-gateway-d1"
      - "zuno-redis-d0"
      - "zuno-redis-d1"
- name: "quotas status | the gateway, the Redis ledger, Grafana and Tempo"
  ansible.builtin.include_tasks: "{{ demo_lib }}/workloads.yml"
  vars:
    workloads:
      - {"name": "ai-gateway", "namespace": "zuno-ai-run"}
      - {"name": "zuno-redis-master", "namespace": "zuno-auth", "kind": "StatefulSet"}
      - {"name": "grafana-deployment", "namespace": "zuno-monitoring"}
      - {"name": "tempo-tempo-0", "namespace": "zuno-monitoring", "kind": "Pod"}
- name: "quotas status | the ledger's volume and the MaaS subscription"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "v1", "kind": "PersistentVolumeClaim", "name": "redis-data-zuno-redis-master-0", "namespace": "zuno-auth", "phase": "Bound"}
      - {"api_version": "maas.opendatahub.io/v1alpha1", "kind": "MaaSSubscription", "name": "gpt-oss-20b-platform", "namespace": "models-as-a-service", "condition": "Ready"}
- name: "quotas status | the gateway's quota environment"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc set env deploy/ai-gateway -n zuno-ai-run --list | grep -E '^(QUOTA_LEDGER_STORE|QUOTA_FAIL_MODES_ENFORCED|QUOTA_CLOSED_CLASS_MAAS_ONLY|MAAS_QUOTA_429_PASSTHROUGH|PERSONA_CLAIM_CLIENTS)='"
- name: "quotas status | read the ai-gateway Deployment"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: zuno-ai-run
    name: ai-gateway
  register: _quotas_gateway
  failed_when: false
- name: "quotas status | QUOTA_STRESSTEST_GROUP is not set (set: an old replay was not reverted, tell the platform owner)"
  ansible.builtin.set_fact:
    demo_unit_checks: >-
      {{ demo_unit_checks + [{'agent': demo_id, 'layer': demo_unit.name, 'id': 'env/ai-gateway/QUOTA_STRESSTEST_GROUP-absent',
         'category': 'environment', 'passed': (_quotas_found | length > 0) and ('QUOTA_STRESSTEST_GROUP' not in _quotas_names),
         'detail': ('not set' if 'QUOTA_STRESSTEST_GROUP' not in _quotas_names else 'SET: an old replay was not reverted')
                   if _quotas_found | length > 0 else 'Deployment ai-gateway not found', 'duration_ms': 0}] }}
  vars:
    _quotas_found: "{{ _quotas_gateway.resources | default([]) }}"
    _quotas_names: >-
      {{ (_quotas_found | first | default({})).spec.template.spec.containers | default([]) | map(attribute='env')
         | map('default', []) | flatten | map(attribute='name') | list }}
- name: "quotas status | the local models, and how many are Ready (the count read fails at zero)"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get llminferenceservice -n zuno-ai-run"
      - "oc get llminferenceservice -n zuno-ai-run --no-headers | grep -c True"
- name: "quotas status | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
