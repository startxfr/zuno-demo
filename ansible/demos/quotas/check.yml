---
# quotas check: the page's `### Check`: no golden-path probe, rehearse the same day. The file runs reads only, the
# same as the 6:30 row of the 15-minute version.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-276 from the page.
- name: "quotas check | the quota environment, as the 6:30 row reads it"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get deploy ai-gateway -n zuno-ai-run -o jsonpath='{range .spec.template.spec.containers[0].env[*]}{.name}={.value}{\"\\n\"}{end}' | grep -E '^(QUOTA|PERSONA|MAAS_QUOTA)'"
- name: "quotas check | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
