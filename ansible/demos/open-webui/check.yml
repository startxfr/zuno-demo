---
# open-webui check: the page's `### Check` runs the golden-path probes open-webui and zuno-code and the browser check
# open-webui.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-275 from the page.
- name: "open-webui check | queue the golden-path probes"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_probes.yml"
  vars:
    queue_probes:
      - "open-webui"
      - "zuno-code"
- name: "open-webui check | queue the browser checks"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_browser.yml"
  vars:
    queue_browser:
      - "open-webui"
- name: "open-webui check | run the probes and browser checks once"
  ansible.builtin.include_tasks: "{{ demo_lib }}/flush_checks.yml"
- name: "open-webui check | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
