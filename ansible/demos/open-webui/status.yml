---
# open-webui status: the page's `### Status` reads: the Application zuno-open-webui-d1, the Deployment open-webui,
# the route open-webui.<apps domain> and its two ExternalSecrets. Fast reads only.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-275 from the page.
- name: "open-webui status | Argo CD Application"
  ansible.builtin.include_tasks: "{{ demo_lib }}/argo_apps.yml"
  vars:
    argo_apps:
      - "zuno-open-webui-d1"
- name: "open-webui status | the Deployment"
  ansible.builtin.include_tasks: "{{ demo_lib }}/workloads.yml"
  vars:
    workloads:
      - {"name": "open-webui", "namespace": "zuno-openwebui"}
- name: "open-webui status | the route"
  ansible.builtin.include_tasks: "{{ demo_lib }}/routes.yml"
  vars:
    routes:
      - {"namespace": "zuno-openwebui", "name": "open-webui", "host": "open-webui.{{ cluster_base_domain }}"}
- name: "open-webui status | the two ExternalSecrets"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "external-secrets.io/v1beta1", "kind": "ExternalSecret", "name": "open-webui-app", "namespace": "zuno-openwebui", "condition": "Ready"}
      - {"api_version": "external-secrets.io/v1beta1", "kind": "ExternalSecret", "name": "open-webui-oidc", "namespace": "zuno-openwebui", "condition": "Ready"}
- name: "open-webui status | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
