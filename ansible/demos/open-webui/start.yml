---
# open-webui start: the page's `### Start`: the file sends one question to warm the model (Zuno is served by gpt-oss-20b). The page section `## Presenter lifecycle` > `### Start` lists what only a person does.
# The warm-up goes through the golden-path moment `open-webui` (a read with respect to the platform, allowed in a freeze:
# ADR-0605); it spends one short answer of the probe persona's budget.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-275 from the page.
- name: "open-webui start | wake the model: one answer through the golden-path moment open-webui"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_probes.yml"
  vars:
    queue_probes:
      - "open-webui"
- name: "open-webui start | run it"
  ansible.builtin.include_tasks: "{{ demo_lib }}/flush_checks.yml"
- name: "open-webui start | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
