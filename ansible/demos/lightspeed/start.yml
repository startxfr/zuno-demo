# lightspeed start: the page's `### Start`: the file checks that gpt-oss-20b is Ready in zuno-ai-run (Lightspeed has
# no other model). It asks nothing: the console question and its budget stay the presenter's. The page section
# `## Presenter lifecycle` > `### Start` lists what only a person does.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-275 from the page.
- name: "lightspeed start | gpt-oss-20b is Ready"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "serving.kserve.io/v1alpha2", "kind": "LLMInferenceService", "name": "gpt-oss-20b", "namespace": "zuno-ai-run", "condition": "Ready"}
- name: "lightspeed start | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
