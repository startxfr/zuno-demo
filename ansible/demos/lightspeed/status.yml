---
# lightspeed status: the page's `### Status` reads: the Applications zuno-lightspeed-d0/-d1 and
# zuno-lightspeed-config-d0/-d1, and the OLSConfig conditions: ApiReady and ConsolePluginReady must be True;
# AgenticConsolePluginReady and AlertsAdapterReady are False with UnsupportedOCPVersion, expected (shown, not asserted).
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-275 from the page.
- name: "lightspeed status | Argo CD Applications"
  ansible.builtin.include_tasks: "{{ demo_lib }}/argo_apps.yml"
  vars:
    argo_apps:
      - "zuno-lightspeed-d0"
      - "zuno-lightspeed-d1"
      - "zuno-lightspeed-config-d0"
      - "zuno-lightspeed-config-d1"
- name: "lightspeed status | the two OLSConfig conditions that must be True"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "ols.openshift.io/v1alpha1", "kind": "OLSConfig", "name": "cluster", "condition": "ApiReady"}
      - {"api_version": "ols.openshift.io/v1alpha1", "kind": "OLSConfig", "name": "cluster", "condition": "ConsolePluginReady"}
- name: "lightspeed status | every OLSConfig condition, the two expected False ones included"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get olsconfig cluster -o jsonpath='{range .status.conditions[*]}{.type}={.status} {.reason}{\"\\n\"}{end}'"
- name: "lightspeed status | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
