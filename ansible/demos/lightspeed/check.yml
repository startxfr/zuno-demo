---
# lightspeed check: the page's `### Check` runs the golden-path probe lightspeed (it needs an `oc` session with a
# token; with a certificate login it prints MANUAL). The console question stays a manual checklist step.
# Pre-filled from demo333's live inventory of 2026-11-14: the other OLSConfig conditions, the operator, the model
# and its MaaS subscription.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-275 from the page.
- name: "lightspeed check | resources ready"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "ols.openshift.io/v1alpha1", "kind": "OLSConfig", "name": "cluster", "condition": "MCPServerReady"}
      - {"api_version": "ols.openshift.io/v1alpha1", "kind": "OLSConfig", "name": "cluster", "condition": "RHOKPReady"}
      - {"api_version": "operators.coreos.com/v1alpha1", "kind": "ClusterServiceVersion", "name_prefix": "lightspeed-operator.v", "namespace": "openshift-lightspeed", "phase": "Succeeded"}
      - {"api_version": "serving.kserve.io/v1alpha2", "kind": "LLMInferenceService", "name": "gpt-oss-20b", "namespace": "zuno-ai-run", "condition": "Ready"}
      - {"api_version": "maas.opendatahub.io/v1alpha1", "kind": "MaaSSubscription", "name": "gpt-oss-20b-lightspeed", "namespace": "models-as-a-service", "condition": "Ready"}
- name: "lightspeed check | queue the golden-path probes"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_probes.yml"
  vars:
    queue_probes:
      - "lightspeed"
- name: "lightspeed check | run the probes once"
  ansible.builtin.include_tasks: "{{ demo_lib }}/flush_checks.yml"
- name: "lightspeed check | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
