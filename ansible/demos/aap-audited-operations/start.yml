---
# aap-audited-operations start: launches ONE read-only check job, `zuno-day0-check`, through the Controller API
# (ansible/playbooks/aap_launch.yml, the path of `make d0 check` in remote mode) and waits until it ends. It proves the
# execution path (freeze protocol): an `automation-job-*` pod runs in zuno-aap. Declared changing in demo.yml. The page
# section `## Presenter lifecycle` > `### Start` says what the presenter does after it.
- name: "aap-audited-operations start | launch zuno-day0-check and wait for its end"
  ansible.builtin.command:
    argv:
      - ansible-playbook
      - -i
      - "{{ zuno_repo_root }}/ansible/inventories/demo333/hosts.yml"
      - "{{ zuno_repo_root }}/ansible/playbooks/aap_launch.yml"
      - -e
      - '{"aap_launch_type": "job", "aap_launch_template": "zuno-day0-check", "aap_launch_extra_vars": {}}'
    chdir: "{{ zuno_repo_root }}"
  register: _aap_launch
  changed_when: true
  failed_when: false
  timeout: 1800
- name: "aap-audited-operations start | record the launch"
  ansible.builtin.set_fact:
    demo_unit_commands: >-
      {{ demo_unit_commands + [{'cmd': 'ansible-playbook ansible/playbooks/aap_launch.yml -e aap_launch_template=zuno-day0-check',
                                'rc': _aap_launch.rc, 'output': (_aap_launch.stdout_lines | default([]) + _aap_launch.stderr_lines | default([]))[-12:] | join(_aap_nl),
                                'truncated': false}] }}
  vars:
    _aap_nl: "\n"
- name: "aap-audited-operations start | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
