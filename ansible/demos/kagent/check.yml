# kagent check: the demo's own assertions, its golden-path probes and its browser check (ADR-0616 clause 9). The
# page section `## Presenter lifecycle` > `### Check` says what the presenter does after it.
# Generated by platform/demo/scaffold.py (WP-271). Review it and edit freely: the scaffolder never overwrites.
# Pre-filled from demo333's live inventory of 2026-11-14 (`oc get` only).
- name: "kagent check | resources ready"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "kagent.dev/v1alpha2", "kind": "Agent", "name": "zuno-sre", "namespace": "zuno-kagent", "condition": "Accepted"}
      - {"api_version": "kagent.dev/v1alpha2", "kind": "Agent", "name": "zuno-sre", "namespace": "zuno-kagent", "condition": "Ready"}
      - {"api_version": "kagent.dev/v1alpha2", "kind": "RemoteMCPServer", "name": "zuno-mcp-gateway", "namespace": "zuno-kagent", "condition": "Accepted"}
- name: "kagent check | queue the golden-path probes"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_probes.yml"
  vars:
    queue_probes:
      - "kagent"
- name: "kagent check | queue the browser checks"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_browser.yml"
  vars:
    queue_browser:
      - "kagent"
- name: "kagent check | run the probes and browser checks once"
  ansible.builtin.include_tasks: "{{ demo_lib }}/flush_checks.yml"
- name: "kagent check | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
