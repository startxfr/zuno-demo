---
# kagent start: the page's `### Start`: the file asks one question once to wake the model (the probe's short question through kagent's token proxy, not through the agent). The page section `## Presenter lifecycle` > `### Start` lists what only a person does.
# The warm-up goes through the golden-path moment `kagent` (a read with respect to the platform, allowed in a freeze:
# ADR-0605); it spends one short answer of the probe persona's budget.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-275 from the page.
- name: "kagent start | wake the model: one answer through the golden-path moment kagent"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_probes.yml"
  vars:
    queue_probes:
      - "kagent"
- name: "kagent start | run it"
  ansible.builtin.include_tasks: "{{ demo_lib }}/flush_checks.yml"
- name: "kagent start | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
