---
# kagent status: the page's `### Status` reads: the Applications zuno-kagent-d0/-d1, zuno-token-proxy-kagent-d1 and
# zuno-mcp-k8s-d0/-d1, the Deployments of zuno-kagent, the Agent zuno-sre, the RemoteMCPServer zuno-mcp-gateway and
# the route kagent.<apps domain>. Fast reads only.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-275 from the page.
- name: "kagent status | Argo CD Applications"
  ansible.builtin.include_tasks: "{{ demo_lib }}/argo_apps.yml"
  vars:
    argo_apps:
      - "zuno-kagent-d0"
      - "zuno-kagent-d1"
      - "zuno-token-proxy-kagent-d1"
      - "zuno-mcp-k8s-d0"
      - "zuno-mcp-k8s-d1"
- name: "kagent status | the Deployments of zuno-kagent, and the k8s MCP server behind the tools"
  ansible.builtin.include_tasks: "{{ demo_lib }}/workloads.yml"
  vars:
    workloads:
      - {"name": "kagent-controller", "namespace": "zuno-kagent"}
      - {"name": "kagent-ui", "namespace": "zuno-kagent"}
      - {"name": "kagent-front-door", "namespace": "zuno-kagent"}
      - {"name": "zuno-sre", "namespace": "zuno-kagent"}
      - {"name": "zuno-token-proxy", "namespace": "zuno-kagent"}
      - {"name": "k8s-mcp", "namespace": "zuno-ai-run"}
- name: "kagent status | the Agent zuno-sre and the RemoteMCPServer zuno-mcp-gateway"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "kagent.dev/v1alpha2", "kind": "Agent", "name": "zuno-sre", "namespace": "zuno-kagent", "condition": "Accepted"}
      - {"api_version": "kagent.dev/v1alpha2", "kind": "Agent", "name": "zuno-sre", "namespace": "zuno-kagent", "condition": "Ready"}
      - {"api_version": "kagent.dev/v1alpha2", "kind": "RemoteMCPServer", "name": "zuno-mcp-gateway", "namespace": "zuno-kagent", "condition": "Accepted"}
- name: "kagent status | the route"
  ansible.builtin.include_tasks: "{{ demo_lib }}/routes.yml"
  vars:
    routes:
      - {"namespace": "zuno-kagent", "name": "kagent", "host": "kagent.{{ cluster_base_domain }}"}
- name: "kagent status | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
