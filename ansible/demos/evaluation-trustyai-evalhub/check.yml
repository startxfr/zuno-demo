# evaluation-trustyai-evalhub check: the demo's own assertions, its golden-path probes and its browser check
# (ADR-0616 clause 9). The page section `## Presenter lifecycle` > `### Check` says what the presenter does after
# it.
# Generated by platform/demo/scaffold.py (WP-271). Review it and edit freely: the scaffolder never overwrites.
# Pre-filled from demo333's live inventory of 2026-11-14 (`oc get` only).
# Skipped: DataScienceCluster zuno-dsc Ready: never asserted; it is False while the parked GuardrailsOrchestrator
# zuno-guardrails-smoke is in phase Error (owner's choice); the demo checks its own component conditions.
# Skipped: DataScienceCluster zuno-dsc TrustyAIReady: never asserted; it is False while the parked
# GuardrailsOrchestrator zuno-guardrails-smoke is in phase Error (owner's choice); the demo checks its own component
# conditions.
# No golden-path probe covers this demo: rehearse it the same day (status banner).
- name: "evaluation-trustyai-evalhub check | resources ready"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "trustyai.opendatahub.io/v1", "kind": "EvalHub", "name": "zuno-evalhub", "namespace": "zuno-ai-run", "condition": "Ready"}
      - {"api_version": "rbac.authorization.k8s.io/v1", "kind": "RoleBinding", "name": "zuno-evalhub-user", "namespace": "zuno-ai-run", "exists": true}
      - {"api_version": "batch/v1", "kind": "Job", "name": "garak-smoke", "namespace": "zuno-ai-run", "condition": "Complete"}
      - {"api_version": "batch/v1", "kind": "Job", "name": "garak-security", "namespace": "zuno-ai-run", "condition": "Complete"}
      - {"api_version": "batch/v1", "kind": "Job", "name": "ragas-eval", "namespace": "zuno-ai-run", "condition": "Complete"}
      - {"api_version": "batch/v1", "kind": "Job", "name": "zuno-acceptance-gate-tekos", "namespace": "zuno-ai-run", "condition": "Complete"}
- name: "evaluation-trustyai-evalhub check | the EvalHub Route (zuno-evalhub-zuno-ai-run.<cluster domain>) is admitted"
  ansible.builtin.include_tasks: "{{ demo_lib }}/routes.yml"
  vars:
    routes:
      - {"namespace": "zuno-ai-run", "name": "zuno-evalhub"}
- name: "evaluation-trustyai-evalhub check | no LMEvalJob: they are off on RHOAI 3.6 EA (the read fails if the CRD is gone)"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get lmevaljobs -A"
- name: "evaluation-trustyai-evalhub check | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
