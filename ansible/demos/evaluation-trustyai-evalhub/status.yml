# evaluation-trustyai-evalhub status: fast reads only: Applications, workloads, Routes; no model call (ADR-0616
# clause 9). The page section `## Presenter lifecycle` > `### Status` says what the presenter does after it.
# Generated by platform/demo/scaffold.py (WP-271). Review it and edit freely: the scaffolder never overwrites.
# Pre-filled from demo333's live inventory of 2026-11-14 (`oc get` only).
# Not read, on purpose: the DataScienceCluster zuno-dsc (Ready and TrustyAIReady are False while the parked
# GuardrailsOrchestrator zuno-guardrails-smoke is in phase Error: the page says it is not a failure for this demo).
# The Route, the RoleBinding and the LMEvalJobs are read by check.yml.
- name: "evaluation-trustyai-evalhub status | workloads"
  ansible.builtin.include_tasks: "{{ demo_lib }}/workloads.yml"
  vars:
    workloads:
      - {"name": "trustyai-service-operator-controller-manager", "namespace": "redhat-ods-applications"}
- name: "evaluation-trustyai-evalhub status | the EvalHub instance and the dashboard the page names"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "trustyai.opendatahub.io/v1", "kind": "EvalHub", "name": "zuno-evalhub", "namespace": "zuno-ai-run", "condition": "Ready"}
      - {"api_version": "grafana.integreatly.org/v1beta1", "kind": "GrafanaDashboard", "name": "trustyai", "namespace": "zuno-monitoring", "exists": true}
- name: "evaluation-trustyai-evalhub status | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
