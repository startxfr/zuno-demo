---
# chaos-platform status: fast reads only: Applications, workloads, Routes; no model call (ADR-0616 clause 9). The
# page section `## Presenter lifecycle` > `### Status` says what the presenter does after it.
# Written from the design of the chaos component (WP-316) before its first install. The Application name follows the
# repository's pattern (gitops/apps/<component>/application-d1.yaml names zuno-<component>-d1, as praxis does): align
# it with gitops/apps/chaos/ once that is merged.
- name: "chaos-platform status | Argo CD Application of the chaos component"
  ansible.builtin.include_tasks: "{{ demo_lib }}/argo_apps.yml"
  vars:
    argo_apps:
      - "zuno-chaos-d1"
- name: "chaos-platform status | the health signal and the targets of the 5-minute version, all ready before any chaos"
  ansible.builtin.include_tasks: "{{ demo_lib }}/workloads.yml"
  vars:
    workloads:
      - {"name": "cerberus", "namespace": "zuno-chaos"}
      - {"name": "ai-gateway", "namespace": "zuno-ai-run"}
      - {"name": "mcp-gateway", "namespace": "zuno-ai-run"}
      - {"name": "a2a-gateway", "namespace": "zuno-ai-run"}
      - {"name": "open-webui", "namespace": "zuno-openwebui"}
- name: "chaos-platform status | the model of the long target"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "serving.kserve.io/v1alpha2", "kind": "LLMInferenceService", "name": "gpt-oss-20b", "namespace": "zuno-ai-run", "condition": "Ready"}
- name: "chaos-platform status | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
