- name: "service-mesh-kiali 2:15 | run the step's reads"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get certificaterequests -n zuno-mesh -o custom-columns='IDENTITY:.metadata.annotations.istio\\.cert-manager\\.io/identities,ISSUER:.spec.issuerRef.name,DURATION:.spec.duration' | grep spiffe | sort -u -k1,1 | head -5"
