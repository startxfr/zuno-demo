# service-mesh-kiali check: the demo's own assertions, its golden-path probes and its browser check (ADR-0616 clause
# 9). The page section `## Presenter lifecycle` > `### Check` says what the presenter does after it.
# Generated by platform/demo/scaffold.py (WP-271). Review it and edit freely: the scaffolder never overwrites.
# Pre-filled from demo333's live inventory of 2026-11-14 (`oc get` only).
# No golden-path probe covers this demo: rehearse it the same day (status banner).
- name: "service-mesh-kiali check | resources ready"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "sailoperator.io/v1", "kind": "IstioCNI", "name": "default", "state": "Healthy"}
      - {"api_version": "sailoperator.io/v1", "kind": "Istio", "name": "default", "state": "Healthy"}
      - {"api_version": "kiali.io/v1alpha1", "kind": "Kiali", "name": "kiali", "namespace": "zuno-mesh", "condition": "Successful"}
      - {"api_version": "monitoring.rhobs/v1alpha1", "kind": "MonitoringStack", "name": "mesh-monitoring", "namespace": "zuno-mesh", "condition": "Available"}
      - {"api_version": "gateway.networking.k8s.io/v1", "kind": "Gateway", "name": "maas-default-gateway", "namespace": "openshift-ingress", "condition": "Programmed"}
      - {"api_version": "gateway.networking.k8s.io/v1", "kind": "Gateway", "name": "zuno-agent-gateway", "namespace": "openshift-ingress", "condition": "Programmed"}
      - {"api_version": "cert-manager.io/v1", "kind": "Certificate", "name": "istiod", "namespace": "zuno-mesh", "condition": "Ready"}
      - {"api_version": "cert-manager.io/v1", "kind": "ClusterIssuer", "name": "vault-issuer-istio", "condition": "Ready"}
      - {"api_version": "security.istio.io/v1", "kind": "PeerAuthentication", "name": "default", "namespace": "zuno-ai-run", "exists": true}
- name: "service-mesh-kiali check | the Deployments of zuno-mesh, cert-manager-istio-csr and Kiali"
  ansible.builtin.include_tasks: "{{ demo_lib }}/workloads.yml"
  vars:
    workloads:
      - {"name": "istiod", "namespace": "zuno-mesh"}
      - {"name": "cert-manager-istio-csr", "namespace": "zuno-mesh"}
      - {"name": "kiali", "namespace": "zuno-mesh"}
- name: "service-mesh-kiali check | the page's reads: Istio and IstioCNI, the PeerAuthentications, and the RESTARTS of cert-manager-istio-csr (20 and 10 on 2026-11-13: read whether they grow)"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get istio,istiocni,deploy -n zuno-mesh"
      - "oc get peerauthentication -A"
      - "oc get pods -n zuno-mesh"
- name: "service-mesh-kiali check | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
