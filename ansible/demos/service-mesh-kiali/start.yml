---
# service-mesh-kiali start: creates traffic for the Kiali graph and the mesh dashboards by running the golden path
# (`make demo golden-path`: every probe of evaluations/golden_path_probe.py PROBES, each once), which calls the
# gateways and the models. Read-only and allowed during a freeze (ADR-0605), so it is not a changing unit. Run it in
# the hour before the session. The page section `## Presenter lifecycle` > `### Start` says what the presenter does
# after it.
- name: "service-mesh-kiali start | queue every golden-path probe (the probes of `make demo golden-path`)"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_probes.yml"
  vars:
    queue_probes:
      - "unifai-tekos"
      - "sovereignty"
      - "open-webui"
      - "zuno-code"
      - "dify"
      - "kagent"
      - "openclaw"
      - "lightspeed"
      - "tools"
      - "guardrails"
      - "trace"
      - "delegation-approval"
      - "world-model"
      - "blender"
- name: "service-mesh-kiali start | run them once"
  ansible.builtin.include_tasks: "{{ demo_lib }}/flush_checks.yml"
- name: "service-mesh-kiali start | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
