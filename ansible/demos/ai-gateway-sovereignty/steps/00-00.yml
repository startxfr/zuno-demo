---
# ai-gateway-sovereignty 0:00 (5-minute version, step 1 of the 15-minute sequence). Do: the providers of
# provider-routing.yaml, each with the data classes it may serve, read from git (no path printed).
# Run locally on 2026-11-16: 14 lines, the eight local providers [C1, C2, C3] and no SaaS provider with C3.
- name: "ai-gateway-sovereignty 0:00 | run the step's reads"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "git show HEAD:platform/ai-gateway/provider-routing.yaml | awk '/^  - name:/{n=$3} /^    eligible_for:/{print n, $2, $3, $4}'"
