---
# ai-gateway-sovereignty status: the page's `### Status` reads: the Applications zuno-ai-gateway-d0/-d1, the
# Deployment ai-gateway, the ConfigMap ai-gateway-classification-floors, the gateway's classification environment,
# Tempo and the local models (at least one Ready for a C3 answer).
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-276 from the page.
- name: "ai-gateway-sovereignty status | Argo CD Applications"
  ansible.builtin.include_tasks: "{{ demo_lib }}/argo_apps.yml"
  vars:
    argo_apps:
      - "zuno-ai-gateway-d0"
      - "zuno-ai-gateway-d1"
- name: "ai-gateway-sovereignty status | the gateway and Tempo"
  ansible.builtin.include_tasks: "{{ demo_lib }}/workloads.yml"
  vars:
    workloads:
      - {"name": "ai-gateway", "namespace": "zuno-ai-run"}
      - {"name": "tempo-tempo-0", "namespace": "zuno-monitoring", "kind": "Pod"}
- name: "ai-gateway-sovereignty status | the classification floors ConfigMap"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "v1", "kind": "ConfigMap", "name": "ai-gateway-classification-floors", "namespace": "zuno-ai-run", "exists": true}
- name: "ai-gateway-sovereignty status | the gateway's classification environment"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc set env deploy/ai-gateway -n zuno-ai-run --list | grep -E '^(CLASSIFICATION_DEFAULT_WHEN_ABSENT|MODEL_READINESS_ENABLED|CIRCUIT_BREAKER_ENABLED)='"
- name: "ai-gateway-sovereignty status | the local models, and how many are Ready (the count read fails at zero)"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get llminferenceservice -n zuno-ai-run"
      - "oc get llminferenceservice -n zuno-ai-run --no-headers | grep -c True"
- name: "ai-gateway-sovereignty status | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
