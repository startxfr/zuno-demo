---
# ai-gateway-sovereignty check: the page's `### Check` runs the golden-path probes sovereignty and trace. trace
# looks up the run of unifai-tekos, so the three run together; both must print PASS.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-276 from the page.
- name: "ai-gateway-sovereignty check | queue the golden-path probes"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_probes.yml"
  vars:
    queue_probes:
      - "unifai-tekos"
      - "sovereignty"
      - "trace"
- name: "ai-gateway-sovereignty check | run them once"
  ansible.builtin.include_tasks: "{{ demo_lib }}/flush_checks.yml"
- name: "ai-gateway-sovereignty check | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
