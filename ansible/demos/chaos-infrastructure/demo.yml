---
# chaos-infrastructure: the manifest of this demo (ADR-0616 clause 3), for
# docs/demo/scenarios/resilience/chaos-infrastructure.md.
# Generated by platform/demo/scaffold.py (WP-271), then edited by hand (WP-316): start launches the chaos workflow,
# stop waits for it through the AAP API.
kind: scenario
page: docs/demo/scenarios/resilience/chaos-infrastructure.md
probes: []
browser: []
# Units that change the cluster, `<action>: "what it changes"`: the guard prints it and asks for the demo id
# (ADR-0616 clause 7). `infra: true`: the run breaks OpenShift infrastructure pods once a person approves it in AAP.
mutations:
  start:
    infra: true
    summary: >-
      launches the AAP workflow zuno-day3-chaos-infra-workflow with chaos_tier=pods and returns at once; once a person
      approves it in AAP, its PipelineRun deletes one Prometheus pod, one router pod and one openshift-apiserver pod,
      one after the other (kills one pod per target; asks for approval in AAP)
  stop: >-
    changes nothing on the cluster: it calls the AAP API as the local admin to wait for the latest run of
    zuno-day3-chaos-infra-workflow (at most 20 minutes) and prints its result; it never approves, denies or cancels it
# Step metadata, keyed by the quoted time stamp: `optional` rows, `mutating` rows (never run by `step`, SKIPPED by
# `rehearse`), `manual` rows (a command the presenter runs by hand).
steps:
  "5:45": {"mutating": true, "freeze": "forbidden", "optional": true}
  "9:15": {"mutating": true, "freeze": "forbidden", "optional": true}
