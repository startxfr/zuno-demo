---
# Check reads (ADR-0616 clause 9; salvaged from the retired demo_check.yml and extended from demo333's live inventory
# of 2026-11-14): each resource is in the state the demo needs. One mode per entry:
#   condition: <type>  (default Ready) - status.conditions[type] has status `expect` (default "True");
#   phase: <value>     - status.phase equals it (ExternalModel: Migrated, NemoGuardrails: Ready);
#   state: <value>     - status.state equals it (Istio, IstioCNI: Healthy);
#   parents: <type>    - every parent that reports the condition reports it True, and one does (HTTPRoute:
#                        Accepted; the Kuadrant policy controller adds a parent entry without it);
#   exists: true       - the resource exists (GrafanaDashboard, OAuth, HardwareProfile...).
# Vars: cr_ready ([{api_version, kind, name, namespace (omit when cluster-scoped), <mode>}]). `name_prefix` instead
# of `name` matches every object whose name starts with it, and passes when one of them is in the expected state: a
# ClusterServiceVersion is named after its version (rhtas-operator.v1.5.1), and an OLM upgrade renames it, leaving
# the old one Replacing for a while.
# Reads are grouped (2026-11-15: each k8s_info call starts a module, about 2 s): entries that share an API version,
# a kind and a namespace are read with ONE list and selected by name; an entry alone in its group is read by name.
- name: "demo | custom resources: start the list of reads"
  ansible.builtin.set_fact:
    _demo_cr_bases: []
    _demo_cr_reads: []

- name: "demo | custom resources: the group of each entry"
  ansible.builtin.set_fact:
    _demo_cr_bases: "{{ _demo_cr_bases + [item.api_version ~ '|' ~ item.kind ~ '|' ~ (item.namespace | default(''))] }}"
  loop: "{{ cr_ready | default([]) }}"
  loop_control:
    label: "{{ item.kind }} {{ item.namespace | default('-') }}"

- name: "demo | custom resources: one read per group"
  ansible.builtin.set_fact:
    _demo_cr_reads: "{{ (_demo_cr_reads + [_demo_cr_key]) | unique }}"
  loop: "{{ cr_ready | default([]) }}"
  loop_control:
    index_var: _demo_cr_index
    label: "{{ _demo_cr_key }}"
  vars:
    _demo_cr_base: "{{ _demo_cr_bases[_demo_cr_index] }}"
    _demo_cr_alone: "{{ _demo_cr_bases | select('equalto', _demo_cr_base) | list | length == 1 }}"
    _demo_cr_key: "{{ _demo_cr_base }}|{{ item.name if (item.name is defined and _demo_cr_alone | bool) else '' }}"

- name: "demo | read the custom resources"
  kubernetes.core.k8s_info:
    api_version: "{{ item.split('|')[0] }}"
    kind: "{{ item.split('|')[1] }}"
    namespace: "{{ item.split('|')[2] if item.split('|')[2] | length > 0 else omit }}"
    name: "{{ item.split('|')[3] if item.split('|')[3] | length > 0 else omit }}"
  loop: "{{ _demo_cr_reads }}"
  register: _demo_crs
  failed_when: false

- name: "demo | record the custom resources"
  ansible.builtin.set_fact:
    demo_unit_checks: "{{ demo_unit_checks + [_demo_row] }}"
  loop: "{{ cr_ready | default([]) }}"
  loop_control:
    loop_var: _demo_cr
    index_var: _demo_cr_index
    label: "{{ _demo_cr.kind }} {{ _demo_cr.namespace | default('-') }}/{{ _demo_label }}"
  vars:
    _demo_cr_base: "{{ _demo_cr_bases[_demo_cr_index] }}"
    _demo_cr_read: >-
      {{ _demo_crs.results | selectattr('item', 'in', [_demo_cr_base ~ '|', _demo_cr_base ~ '|' ~ (_demo_cr.name
         | default(''))]) | first | default({}, true) }}
    item:
      item: "{{ _demo_cr }}"
      resources: "{{ _demo_cr_read.resources | default([]) }}"
    _demo_label: "{{ item.item.name if item.item.name is defined else (item.item.name_prefix ~ '*') }}"
    _demo_candidates: >-
      {{ (item.resources | selectattr('metadata.name', 'equalto', item.item.name) | list)
         if item.item.name is defined
         else (item.resources | selectattr('metadata.name', 'match', '^' ~ (item.item.name_prefix
               | regex_escape)) | list) }}
    _demo_in_phase: >-
      {{ _demo_candidates | selectattr('status.phase', 'defined') | selectattr('status.phase', 'equalto',
         item.item.phase) | list if item.item.phase is defined else [] }}
    _demo_obj: "{{ (_demo_in_phase + _demo_candidates) | first | default({}, true) }}"
    _demo_condition: "{{ item.item.condition | default('Ready') }}"
    _demo_expect: "{{ item.item.expect | default('True') | string }}"
    _demo_cond_status: >-
      {{ _demo_obj.status.conditions | default([]) | selectattr('type', 'equalto', _demo_condition)
         | map(attribute='status') | first | default('absent') }}
    _demo_parent_status: >-
      {{ _demo_obj.status.parents | default([]) | map(attribute='conditions') | map('default', [])
         | map('selectattr', 'type', 'equalto', item.item.parents | default('Accepted'))
         | map('map', attribute='status') | map('list') | map('first') | map('default', 'absent') | list }}
    _demo_mode: >-
      {{ 'exists' if item.item.exists | default(false) else ('phase' if item.item.phase is defined
         else ('state' if item.item.state is defined else ('parents' if item.item.parents is defined
         else 'condition'))) }}
    _demo_ok: >-
      {{ true if _demo_mode == 'exists'
         else ((_demo_obj.status.phase | default('absent')) == item.item.phase) if _demo_mode == 'phase'
         else ((_demo_obj.status.state | default('absent')) == item.item.state) if _demo_mode == 'state'
         else ((_demo_parent_status | reject('equalto', 'absent') | list | length > 0)
               and (_demo_parent_status | reject('equalto', 'absent') | reject('equalto', 'True') | list
               | length == 0)) if _demo_mode == 'parents'
         else (_demo_cond_status == _demo_expect) }}
    _demo_detail: >-
      {{ 'exists' if _demo_mode == 'exists'
         else ('phase ' ~ (_demo_obj.status.phase | default('absent'))) if _demo_mode == 'phase'
         else ('state ' ~ (_demo_obj.status.state | default('absent'))) if _demo_mode == 'state'
         else ((item.item.parents | default('Accepted')) ~ ' ' ~ (_demo_parent_status | join(','))) if _demo_mode == 'parents'
         else (_demo_condition ~ '=' ~ _demo_cond_status) }}
    _demo_row:
      agent: "{{ demo_id }}"
      layer: "{{ demo_unit.name }}"
      id: "{{ item.item.kind | lower }}/{{ item.item.namespace | default('-') }}/{{ _demo_label }}"
      category: custom-resource
      passed: "{{ (_demo_obj | length > 0) and (_demo_ok | bool) }}"
      detail: >-
        {{ (((_demo_obj.metadata.name ~ ': ') if item.item.name is not defined else '') ~ _demo_detail)
           if _demo_obj else 'not found' }}
      duration_ms: 0
