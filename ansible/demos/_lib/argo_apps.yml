---
# Status reads: each Argo CD Application is in its expected state, Synced and Healthy unless the entry says
# otherwise (`any` accepts every value: the startx-cluster-* Applications share resources with the zuno ones and
# read OutOfSync while healthy).
# Vars: argo_apps (names, or {name, sync, health}), argo_namespace (default openshift-gitops).
# One list of the namespace's Applications, selected by name (each k8s_info call starts a module, about 2 s).
- name: "demo | read the Argo CD Applications"
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: "{{ argo_namespace | default('openshift-gitops') }}"
  register: _demo_argo
  failed_when: false
  when: argo_apps | default([]) | length > 0

- name: "demo | record the Applications"
  ansible.builtin.set_fact:
    demo_unit_checks: "{{ demo_unit_checks + [_demo_row] }}"
  loop: "{{ argo_apps | default([]) }}"
  loop_control:
    loop_var: _demo_wanted
    label: "{{ _demo_name }}"
  vars:
    _demo_name: "{{ _demo_wanted.name if _demo_wanted is mapping else _demo_wanted }}"
    _demo_want_sync: "{{ _demo_wanted.sync | default('Synced') if _demo_wanted is mapping else 'Synced' }}"
    _demo_want_health: "{{ _demo_wanted.health | default('Healthy') if _demo_wanted is mapping else 'Healthy' }}"
    _demo_app: >-
      {{ _demo_argo.resources | default([]) | selectattr('metadata.name', 'equalto', _demo_name) | first
         | default({}, true) }}
    _demo_sync: "{{ _demo_app.status.sync.status | default('absent') }}"
    _demo_health: "{{ _demo_app.status.health.status | default('absent') }}"
    _demo_row:
      agent: "{{ demo_id }}"
      layer: "{{ demo_unit.name }}"
      id: "argo/{{ _demo_name }}"
      category: argo
      passed: >-
        {{ (_demo_app | length > 0)
           and (_demo_want_sync == 'any' or _demo_sync == _demo_want_sync)
           and (_demo_want_health == 'any' or _demo_health == _demo_want_health) }}
      detail: "{{ _demo_sync }}/{{ _demo_health }}"
      duration_ms: 0
