# model-catalog-registry status: fast reads only: Applications, workloads, Routes; no model call (ADR-0616 clause
# 9). The page section `## Presenter lifecycle` > `### Status` says what the presenter does after it.
# Generated by platform/demo/scaffold.py (WP-271). Review it and edit freely: the scaffolder never overwrites.
# Pre-filled from demo333's live inventory of 2026-11-14 (`oc get` only).
# Known absent: ModelRegistry (no instance in any namespace: the page says the demo is not show-ready). The read
# below shows it; it is not asserted, so the status stays usable until an instance exists. The Route, the ConfigMaps
# and the RoleBinding are read by check.yml.
- name: "model-catalog-registry status | Argo CD Applications"
  ansible.builtin.include_tasks: "{{ demo_lib }}/argo_apps.yml"
  vars:
    argo_apps:
      - "zuno-openshift-ai-d0"
      - "zuno-openshift-ai-d1"
      - "zuno-mlops-d0"
      - "zuno-mlops-d1"
      - "zuno-models-d1"
- name: "model-catalog-registry status | workloads"
  ansible.builtin.include_tasks: "{{ demo_lib }}/workloads.yml"
  vars:
    workloads:
      - {"name": "model-catalog", "namespace": "rhoai-model-registries"}
      - {"name": "model-catalog-postgres", "namespace": "rhoai-model-registries"}
      - {"name": "model-registry-ui", "namespace": "redhat-ods-applications"}
- name: "model-catalog-registry status | the registry: no ModelRegistry exists, so the demo is not show-ready (the read fails only if the CRD is gone)"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get modelregistries.modelregistry.opendatahub.io -A"
- name: "model-catalog-registry status | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
