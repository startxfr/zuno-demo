---
# unifai-agents status: the page's `### Status` reads: the Applications zuno-unifai-d0/-d1, the UnifaiStack unifai,
# the UnifaiTeam agent-tekos, the UnifaiAgentBundle tekos, the UnifaiWorkflow tekos and `oc get llminferenceservice
# -n zuno-ai-run` (at least one local model Ready=True: the count read fails when there is none). Pre-filled from the
# live inventory of 2026-11-14: the two gateways Tekos calls through.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-275 from the page.
- name: "unifai-agents status | Argo CD Applications"
  ansible.builtin.include_tasks: "{{ demo_lib }}/argo_apps.yml"
  vars:
    argo_apps:
      - "zuno-unifai-d0"
      - "zuno-unifai-d1"
- name: "unifai-agents status | the UnifAI stack, the team, the agent bundle and the workflow of Tekos"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "unifai.startx.fr/v1alpha1", "kind": "UnifaiStack", "name": "unifai", "namespace": "zuno-unifai", "condition": "Ready"}
      - {"api_version": "unifai.startx.fr/v1alpha1", "kind": "UnifaiTeam", "name": "agent-tekos", "namespace": "zuno-unifai", "condition": "Ready"}
      - {"api_version": "unifai.startx.fr/v1alpha1", "kind": "UnifaiAgentBundle", "name": "tekos", "namespace": "zuno-unifai", "condition": "Ready"}
      - {"api_version": "unifai.startx.fr/v1alpha1", "kind": "UnifaiWorkflow", "name": "tekos", "namespace": "zuno-unifai", "condition": "Ready"}
- name: "unifai-agents status | the local models, and how many are Ready"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get llminferenceservice -n zuno-ai-run"
      - "oc get llminferenceservice -n zuno-ai-run --no-headers | grep -c True"
- name: "unifai-agents status | the gateways"
  ansible.builtin.include_tasks: "{{ demo_lib }}/workloads.yml"
  vars:
    workloads:
      - {"name": "ai-gateway", "namespace": "zuno-ai-run"}
      - {"name": "mcp-gateway", "namespace": "zuno-ai-run"}
- name: "unifai-agents status | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
