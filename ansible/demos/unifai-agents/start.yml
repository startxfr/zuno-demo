---
# unifai-agents start: the page's `### Start`: the file sends the probe prompt once to warm the model. The page section `## Presenter lifecycle` > `### Start` lists what only a person does.
# The warm-up goes through the golden-path moment `unifai-tekos` (a read with respect to the platform, allowed in a freeze:
# ADR-0605); it spends one short answer of the probe persona's budget.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-275 from the page.
- name: "unifai-agents start | wake the model: one answer through the golden-path moment unifai-tekos"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_probes.yml"
  vars:
    queue_probes:
      - "unifai-tekos"
- name: "unifai-agents start | run it"
  ansible.builtin.include_tasks: "{{ demo_lib }}/flush_checks.yml"
- name: "unifai-agents start | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
