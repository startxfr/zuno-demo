---
# unifai-agents check: the page's `### Check` runs the golden-path probe unifai-tekos and the browser check unifai.
# The cluster-tools contrast at 3:00 has no probe: it stays a rehearsal point (ai-ops-01, the same day).
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-275 from the page.
- name: "unifai-agents check | queue the golden-path probes"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_probes.yml"
  vars:
    queue_probes:
      - "unifai-tekos"
- name: "unifai-agents check | queue the browser checks"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_browser.yml"
  vars:
    queue_browser:
      - "unifai"
- name: "unifai-agents check | run the probes and browser checks once"
  ansible.builtin.include_tasks: "{{ demo_lib }}/flush_checks.yml"
- name: "unifai-agents check | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
