---
# okf-signed-agent-release 1:15 (5-minute version, step 2 of the 15-minute sequence). Do: `tail -2
# platform/okf/agents.lock`
# A plain read of a repository file, run by readonly.py (first-segment tail on a repository file).
- name: "okf-signed-agent-release 1:15 | the last two lines of the agents lock"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "tail -2 platform/okf/agents.lock"
