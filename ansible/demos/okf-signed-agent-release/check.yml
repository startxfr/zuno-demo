# okf-signed-agent-release check: the demo's own assertions, its golden-path probes and its browser check (ADR-0616
# clause 9). The page section `## Presenter lifecycle` > `### Check` says what the presenter does after it.
# Generated by platform/demo/scaffold.py (WP-271). Review it and edit freely: the scaffolder never overwrites.
# Pre-filled from demo333's live inventory of 2026-11-14 (`oc get` only).
# No golden-path probe covers this demo: rehearse it the same day (status banner).
- name: "okf-signed-agent-release check | resources ready"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "quay.redhat.com/v1", "kind": "QuayRegistry", "name": "quay", "namespace": "zuno-registry", "condition": "Available"}
- name: "okf-signed-agent-release check | the three served agents are Verified and Ready (the five placeholders stay Pending)"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "unifai.startx.fr/v1alpha1", "kind": "UnifaiAgentBundle", "name": "arkos", "namespace": "zuno-unifai", "condition": "Verified"}
      - {"api_version": "unifai.startx.fr/v1alpha1", "kind": "UnifaiAgentBundle", "name": "arkos", "namespace": "zuno-unifai", "condition": "Ready"}
      - {"api_version": "unifai.startx.fr/v1alpha1", "kind": "UnifaiAgentBundle", "name": "comage", "namespace": "zuno-unifai", "condition": "Ready"}
      - {"api_version": "unifai.startx.fr/v1alpha1", "kind": "UnifaiAgentBundle", "name": "tekos", "namespace": "zuno-unifai", "condition": "Ready"}
- name: "okf-signed-agent-release check | the bundle list and the revocation list"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get unifaiagentbundle -n zuno-unifai"
      - "oc get configmap unifai-agent-revocations -n zuno-unifai -o jsonpath='{.data.revoked}{\"\\n\"}'"
- name: "okf-signed-agent-release check | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
