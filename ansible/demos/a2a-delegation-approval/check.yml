---
# a2a-delegation-approval check: the page's `### Check` runs the golden-path probe delegation-approval, as
# eval-consultant-01: it proves the request and a refusal, nothing runs (25 to 70 s, about 326 s when Arkos asks
# twice). The approval clicked by consultant-02, the AAP job and the trace steps have no probe: rehearse them the
# same day, within the AAP launch limit of 2 per 900 s.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-276 from the page.
- name: "a2a-delegation-approval check | queue the golden-path probes"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_probes.yml"
  vars:
    queue_probes:
      - "delegation-approval"
- name: "a2a-delegation-approval check | run them once"
  ansible.builtin.include_tasks: "{{ demo_lib }}/flush_checks.yml"
- name: "a2a-delegation-approval check | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
