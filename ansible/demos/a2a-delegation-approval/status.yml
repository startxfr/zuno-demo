---
# a2a-delegation-approval status: the page's `### Status` reads: the Applications of the a2a-gateway, UnifAI and the
# AAP MCP server, the Deployments a2a-gateway and aap-mcp, the UnifaiAgentBundles arkos and tekos, the local models
# (at least one Ready: Arkos is floored at C3), the pod tempo-tempo-0 and Grafana.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-276 from the page.
- name: "a2a-delegation-approval status | Argo CD Applications"
  ansible.builtin.include_tasks: "{{ demo_lib }}/argo_apps.yml"
  vars:
    argo_apps:
      - "zuno-a2a-gateway-d0"
      - "zuno-a2a-gateway-d1"
      - "zuno-unifai-d0"
      - "zuno-unifai-d1"
      - "zuno-mcp-aap-d0"
      - "zuno-mcp-aap-d1"
- name: "a2a-delegation-approval status | the gateways, Tempo and Grafana"
  ansible.builtin.include_tasks: "{{ demo_lib }}/workloads.yml"
  vars:
    workloads:
      - {"name": "a2a-gateway", "namespace": "zuno-ai-run"}
      - {"name": "aap-mcp", "namespace": "zuno-ai-run"}
      - {"name": "tempo-tempo-0", "namespace": "zuno-monitoring", "kind": "Pod"}
      - {"name": "grafana-deployment", "namespace": "zuno-monitoring"}
- name: "a2a-delegation-approval status | the agent bundles of Arkos and Tekos"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "unifai.startx.fr/v1alpha1", "kind": "UnifaiAgentBundle", "name": "arkos", "namespace": "zuno-unifai", "condition": "Ready"}
      - {"api_version": "unifai.startx.fr/v1alpha1", "kind": "UnifaiAgentBundle", "name": "tekos", "namespace": "zuno-unifai", "condition": "Ready"}
- name: "a2a-delegation-approval status | the local models, and how many are Ready (the count read fails at zero)"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get llminferenceservice -n zuno-ai-run"
      - "oc get llminferenceservice -n zuno-ai-run --no-headers | grep -c True"
- name: "a2a-delegation-approval status | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
