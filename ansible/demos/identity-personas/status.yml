---
# identity-personas status: the page's `### Status` reads: the Applications of Keycloak, the OpenShift OAuth
# provider, the RBAC groups, Open WebUI and UnifAI, the Keycloak CR zuno and its pod zuno-0, and the Deployments
# zuno-token-proxy (in zuno-dify and zuno-kagent), Open WebUI and UnifAI (its stack).
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-276 from the page.
- name: "identity-personas status | Argo CD Applications"
  ansible.builtin.include_tasks: "{{ demo_lib }}/argo_apps.yml"
  vars:
    argo_apps:
      - "zuno-keycloak-d0"
      - "zuno-keycloak-d1"
      - "zuno-openshift-oauth-d0"
      - "zuno-openshift-oauth-d1"
      - "zuno-openshift-rbac-groups-d0"
      - "zuno-openshift-rbac-groups-d1"
      - "zuno-open-webui-d1"
      - "zuno-unifai-d0"
      - "zuno-unifai-d1"
- name: "identity-personas status | the Keycloak pod, the token proxies, Open WebUI and the UnifAI backend"
  ansible.builtin.include_tasks: "{{ demo_lib }}/workloads.yml"
  vars:
    workloads:
      - {"name": "zuno-0", "namespace": "zuno-auth", "kind": "Pod"}
      - {"name": "zuno-token-proxy", "namespace": "zuno-dify"}
      - {"name": "zuno-token-proxy", "namespace": "zuno-kagent"}
      - {"name": "open-webui", "namespace": "zuno-openwebui"}
      - {"name": "unifai-backend", "namespace": "zuno-unifai"}
- name: "identity-personas status | the Keycloak CR and the UnifAI stack"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "k8s.keycloak.org/v2beta1", "kind": "Keycloak", "name": "zuno", "namespace": "zuno-auth", "condition": "Ready"}
      - {"api_version": "unifai.startx.fr/v1alpha1", "kind": "UnifaiStack", "name": "unifai", "namespace": "zuno-unifai", "condition": "Ready"}
- name: "identity-personas status | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
