---
# identity-personas check: the page's `### Check`: no golden-path probe, rehearse the same day (the sale-01
# workspace step at 1:30 in particular). The file runs the demo's own reads: the Keycloak CR and the realm import
# (Done), the two Keycloak Jobs (Complete), the OAuth provider openshift (issuer, mappingMethod add, claim groups),
# the three persona RoleBindings (read in zuno-ai-run; they exist in every persona namespace) and the
# ClusterRoleBindings of ocp-paas-ops and ocp-paas-dev.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-276 from the page.
- name: "identity-personas check | Keycloak, the realm import, the Jobs, the OAuth resource and the bindings"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "k8s.keycloak.org/v2beta1", "kind": "Keycloak", "name": "zuno", "namespace": "zuno-auth", "condition": "Ready"}
      - {"api_version": "k8s.keycloak.org/v2beta1", "kind": "KeycloakRealmImport", "name": "zuno-realm", "namespace": "zuno-auth", "condition": "Done"}
      - {"api_version": "batch/v1", "kind": "Job", "name": "zuno-keycloak-client-reconcile", "namespace": "zuno-auth", "condition": "Complete"}
      - {"api_version": "batch/v1", "kind": "Job", "name": "zuno-keycloak-eval-personas", "namespace": "zuno-auth", "condition": "Complete"}
      - {"api_version": "config.openshift.io/v1", "kind": "OAuth", "name": "cluster", "exists": true}
      - {"api_version": "rbac.authorization.k8s.io/v1", "kind": "RoleBinding", "name": "zuno-personas-view", "namespace": "zuno-ai-run", "exists": true}
      - {"api_version": "rbac.authorization.k8s.io/v1", "kind": "RoleBinding", "name": "zuno-ocp-ai-dev-edit", "namespace": "zuno-ai-run", "exists": true}
      - {"api_version": "rbac.authorization.k8s.io/v1", "kind": "RoleBinding", "name": "zuno-ocp-ai-ops-admin", "namespace": "zuno-ai-run", "exists": true}
      - {"api_version": "rbac.authorization.k8s.io/v1", "kind": "ClusterRoleBinding", "name": "zuno-ocp-paas-ops-cluster-admin", "exists": true}
      - {"api_version": "rbac.authorization.k8s.io/v1", "kind": "ClusterRoleBinding", "name": "zuno-ocp-paas-dev-cluster-reader", "exists": true}
- name: "identity-personas check | the OAuth provider openshift: mapping method, issuer and groups claim (the grep fails without it)"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get oauth cluster -o jsonpath='{range .spec.identityProviders[*]}{.name} {.mappingMethod} {.openID.issuer} {.openID.claims.groups}{\"\\n\"}{end}' | grep -E '^openshift add https://keycloak[.].*/realms/zuno .*groups'"
- name: "identity-personas check | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
