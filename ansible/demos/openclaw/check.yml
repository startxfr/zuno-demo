---
# openclaw check: the page's `### Check` runs the golden-path probe openclaw (it calls the model from inside each
# assistant's pod: the terminal must be allowed to `oc exec` in the persona namespaces) and the browser check
# openclaw (sale-01's front door and Control UI too). Pre-filled from the live inventory of 2026-11-14: the
# ExternalSecrets of both assistants and the operator.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-275 from the page.
- name: "openclaw check | resources ready"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "external-secrets.io/v1beta1", "kind": "ExternalSecret", "name": "openclaw-client", "namespace": "zuno-claw-consultant-02", "condition": "Ready"}
      - {"api_version": "external-secrets.io/v1beta1", "kind": "ExternalSecret", "name": "openclaw-ui", "namespace": "zuno-claw-consultant-02", "condition": "Ready"}
      - {"api_version": "external-secrets.io/v1beta1", "kind": "ExternalSecret", "name": "openclaw-client", "namespace": "zuno-claw-sale-01", "condition": "Ready"}
      - {"api_version": "external-secrets.io/v1beta1", "kind": "ExternalSecret", "name": "openclaw-ui", "namespace": "zuno-claw-sale-01", "condition": "Ready"}
      - {"api_version": "operators.coreos.com/v1alpha1", "kind": "ClusterServiceVersion", "name_prefix": "claw-operator.v", "namespace": "zuno-claw-consultant-02", "phase": "Succeeded"}
- name: "openclaw check | queue the golden-path probes"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_probes.yml"
  vars:
    queue_probes:
      - "openclaw"
- name: "openclaw check | queue the browser checks"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_browser.yml"
  vars:
    queue_browser:
      - "openclaw"
- name: "openclaw check | run the probes and browser checks once"
  ansible.builtin.include_tasks: "{{ demo_lib }}/flush_checks.yml"
- name: "openclaw check | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
