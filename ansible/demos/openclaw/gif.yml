---
# openclaw: the first cut list of its GIF (ADR-0618, WP-290), read by platform/demo/gif.py. Written BEFORE the first
# take: tune it with `make demo gif openclaw` once a take exists.
# `make demo record openclaw` takes the 5-minute version (evaluations/browser/walkthroughs/openclaw.mjs):
# consultant-02 at the front door, then the Control UI's own password (a second credential, OPENCLAW_UI_PASSWORD,
# read at run time by the caller and typed masked by the recorder).
# Markers, in order: login, ui, session, q-sent, q-done, end. Rows 2:30 to 4:15 are words.
record_notice: >-
  a recorded browser session as consultant-02 on its own OpenClaw assistant (the front door, then the Control UI's
  password, a second credential typed masked by the recorder and never shown): one new session and one Confluence
  question on consultant-02's budget; real Confluence page titles show in the answer, and the sidebar shows the
  titles of the assistant's earlier sessions; the take deletes its session at the end through the Control UI's menu
  (Delete…) and fails if it is still listed; what the assistant may have memorised from that one question stays in
  its own memory (a 10Gi volume): no take can undo that; each take is a new device to the assistant's gateway;
  traces and metrics of the answer remain, as for any use
target_seconds: [40, 60]
width: 960
fps: 10
moments:
  - {still: login, hold: 3, caption: "Sign in with the company account at the door"}
  - {still: ui, hold: 5, step: "0:00", caption: "0:00  My own assistant, with its own sessions"}
  - {from: session, to: q-sent, fit: 5, hold: 2, step: "0:45", caption: "0:45  I ask my assistant for the onboarding pages"}
  - {from: q-sent, to: q-done, fit: 10, hold: 1, step: "0:45", caption: "0:45  It calls the platform's Confluence search tool"}
  - {still: q-done, hold: 9, step: "0:45", caption: "0:45  The pages it found, with their links"}
  - {still: end, hold: 7, step: "4:15", caption: "No key, no internet: the platform decides models and tools"}
