---
# openclaw start: the page's `### Start`: the file makes sure each assistant's Control UI password Secret
# (`openclaw-ui`) is there without printing it (`-o name` only), asks one short question per assistant (the golden-
# path moment openclaw, from inside each assistant's pod) and runs `oc get claw -A`. The page section
# `## Presenter lifecycle` > `### Start` lists what only a person does (typing the password, off screen).
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-275 from the page.
- name: "openclaw start | the Control UI password Secrets exist (never printed)"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get secret openclaw-ui -n zuno-claw-consultant-02 -o name"
      - "oc get secret openclaw-ui -n zuno-claw-sale-01 -o name"
- name: "openclaw start | one short question per assistant (golden-path moment openclaw)"
  ansible.builtin.include_tasks: "{{ demo_lib }}/queue_probes.yml"
  vars:
    queue_probes:
      - "openclaw"
- name: "openclaw start | run it"
  ansible.builtin.include_tasks: "{{ demo_lib }}/flush_checks.yml"
- name: "openclaw start | oc get claw -A"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get claw -A"
- name: "openclaw start | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
