---
# openclaw status: the page's `### Status` reads: the Applications zuno-openclaw-d0/-d1 and `oc get claw -A`: both
# `assistant` Claws must be Ready. Pre-filled from the live inventory of 2026-11-14: each assistant's Deployments and
# front-door route.
# Generated by platform/demo/scaffold.py (WP-271), then completed for WP-275 from the page.
- name: "openclaw status | Argo CD Applications"
  ansible.builtin.include_tasks: "{{ demo_lib }}/argo_apps.yml"
  vars:
    argo_apps:
      - "zuno-openclaw-d0"
      - "zuno-openclaw-d1"
- name: "openclaw status | both assistant Claws are Ready"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "claw.sandbox.redhat.com/v1alpha1", "kind": "Claw", "name": "assistant", "namespace": "zuno-claw-consultant-02", "condition": "Ready"}
      - {"api_version": "claw.sandbox.redhat.com/v1alpha1", "kind": "Claw", "name": "assistant", "namespace": "zuno-claw-sale-01", "condition": "Ready"}
- name: "openclaw status | oc get claw -A"
  ansible.builtin.include_tasks: "{{ demo_lib }}/run_reads.yml"
  vars:
    run_reads:
      - "oc get claw -A"
- name: "openclaw status | workloads"
  ansible.builtin.include_tasks: "{{ demo_lib }}/workloads.yml"
  vars:
    workloads:
      - {"name": "assistant", "namespace": "zuno-claw-consultant-02"}
      - {"name": "assistant-proxy", "namespace": "zuno-claw-consultant-02"}
      - {"name": "front-door", "namespace": "zuno-claw-consultant-02"}
      - {"name": "assistant", "namespace": "zuno-claw-sale-01"}
      - {"name": "assistant-proxy", "namespace": "zuno-claw-sale-01"}
      - {"name": "front-door", "namespace": "zuno-claw-sale-01"}
- name: "openclaw status | the front-door routes"
  ansible.builtin.include_tasks: "{{ demo_lib }}/routes.yml"
  vars:
    routes:
      - {"namespace": "zuno-claw-consultant-02", "name": "front-door", "host": "assistant-zuno-claw-consultant-02.{{ cluster_base_domain }}"}
      - {"namespace": "zuno-claw-sale-01", "name": "front-door", "host": "assistant-zuno-claw-sale-01.{{ cluster_base_domain }}"}
- name: "openclaw status | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
