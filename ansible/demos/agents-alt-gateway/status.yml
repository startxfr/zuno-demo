---
# agents-alt-gateway status: the page's `### Status` reads: the Deployments named there and, where it names them, the Agents. Fast
# reads only; no model call. Praxis runs in zuno-ai-gateways since 2026-11-19; a missing Deployment is reported as missing.
# Written by hand for WP-304 on the model of ansible/demos/kagent/status.yml.
- name: "agents-alt-gateway status | the Deployments"
  ansible.builtin.include_tasks: "{{ demo_lib }}/workloads.yml"
  vars:
    workloads:
      - {"name": "praxis", "namespace": "zuno-ai-gateways"}
      - {"name": "zuno-token-proxy", "namespace": "zuno-kagent"}
- name: "agents-alt-gateway status | the Agents"
  ansible.builtin.include_tasks: "{{ demo_lib }}/cr_ready.yml"
  vars:
    cr_ready:
      - {"api_version": "kagent.dev/v1alpha2", "kind": "Agent", "name": "zuno-sre", "namespace": "zuno-kagent", "condition": "Accepted"}
      - {"api_version": "kagent.dev/v1alpha2", "kind": "Agent", "name": "zuno-sre", "namespace": "zuno-kagent", "condition": "Ready"}
      - {"api_version": "kagent.dev/v1alpha2", "kind": "Agent", "name": "zuno-diagnose-praxis", "namespace": "zuno-kagent", "condition": "Accepted"}
      - {"api_version": "kagent.dev/v1alpha2", "kind": "Agent", "name": "zuno-diagnose-praxis", "namespace": "zuno-kagent", "condition": "Ready"}
- name: "agents-alt-gateway status | report"
  ansible.builtin.include_tasks: "{{ demo_lib }}/render.yml"
