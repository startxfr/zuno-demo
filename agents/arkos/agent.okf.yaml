# Zuno agent definition for Arkos (architecture assistant).
# Conforms to platform/okf/schema/zuno-okf-v0.2.schema.json.
# v0 scope: status is `placeholder` - this file, the reserved `zuno-agent-arkos`
# namespace and this portal tile are the only things that exist for Arkos in
# v0 (ADR-0007). Task/tool content reflects the intended v1 build from
# agents/arkos/README.md and MEMORY.md sections 8-9. Access group is `board`
# per the Track E contract; note this reads unusually for an architects'
# audience - flagged as an open question in the final report.
apiVersion: okf.zuno.io/v0.2
kind: Agent
metadata:
  name: arkos
  displayName: Arkos
  description: >-
    Architecture assistant for architects. Helps produce Design & Architecture
    Testimonials (DAT) and prepare Odyssey architecture workshops, drawing on
    the same technical RAG/Confluence knowledge base as Tekos plus Google
    Drive/Docs and Lucidchart.
  status: placeholder
spec:
  tasks:
    - name: coming-soon
      description: >-
        Arkos is not yet built for this v0 demo. Planned v1 tasks: create a
        DAT (collect -> outline -> explicit user review -> generation ->
        review -> final Google Doc, with resumable intermediate state and
        optional Lucidchart diagrams; sovereign-marked DAT workflows are
        local-model-only); prepare an Odyssey workshop from an existing
        project Drive folder and slide template library.
      allowed_tools: []
  model:
    preferred_classification: C3
    notes: >-
      Placeholder pending v1 build; C3 anticipated because sovereign-marked
      DAT workflows are local-model-only per MEMORY.md section 5.
  access:
    groups:
      - board
  ui:
    displayName: Arkos
    tileDescription: Architecture DAT and workshop assistant - coming soon.
    color: "#8F4700"
    icon: drafting-compass
