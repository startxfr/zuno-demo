[defaults]
# Passphrase of the ansible-vault encrypted ansible/confidential.yml (see ansible/README.md).
# The script never fails when ~/.config/zuno/vault-pass is absent, so unencrypted checkouts (CI, AAP,
# fresh clones) keep working; ANSIBLE_VAULT_PASSWORD_FILE overrides it.
vault_password_file = ansible/vault-pass.sh
inventory = ansible/inventories/demo/hosts.yml
roles_path = ansible/roles
filter_plugins = ansible/filter_plugins
retry_files_enabled = False
host_key_checking = False
interpreter_python = auto_silent
# stdout_callback = community.general.dense  # optional denser output; needs community.general

[privilege_escalation]
become = False
