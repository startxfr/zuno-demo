# Static checks that need no live cluster, registry or credentials - every
# one of these commands was actually run (and currently passes, except
# where documented as a known, honest gap) in this repository's own
# development environment before this workflow was written. See each
# script's own docstring/README for what it checks and why.
name: Lint and policy checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy-as-code:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # platform/demo/tests/test_readonly.py runs `git log -60`: the default depth of 1 returns one line.
          fetch-depth: 100
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # jinja2: the OKF version dispatch test renders the Ansible check's expression (WP-263).
      - run: pip install pyyaml packaging jinja2
      # ADR-0580/WP-165: agents and the corp policies are not in this
      # repository; the steps below read the release pinned in
      # platform/okf/agents.lock, verified offline and extracted once by
      # platform/okf/release_cache.py (needs cosign and oras).
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.2.2
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.4.1
      - name: Extract the locked agents release
        run: python3 platform/okf/release_cache.py
      # ADR-0111/ADR-0549 (2026-09-05): the "immutable image tags" check
      # that used to run here (check_no_latest_tags.py, non-blocking) is
      # removed - zero GitHub Actions dependency for this compliance
      # story now (ADR-0549's explicit decision). Its premise ("a chart's
      # tag must never say latest") permanently contradicts ADR-0059 by
      # design: main's charts keep `tag: latest` forever, since that's
      # what the image.openshift.io/triggers auto-redeploy annotation
      # watches. Enforcement moved in-cluster instead: `make d3 release
      # TAG=<tag>` (ansible/playbooks/day3_release.yml) builds, RHTAS-signs
      # and ledgers a named release on demand, and
      # platform/supply-chain/check_release_ledger.py (wired into `make d2
      # check supply-chain`) validates that ledger's structural integrity.
      # See check_no_latest_tags.py's own dated note for the full detail.
      # ADR-0420/WP-070 (2026-08-22): removed from this CI lint gate -
      # verify_signatures.py now resolves each component's live
      # ImageStreamTag digest via `oc get istag`, which a GitHub-hosted
      # runner has no route to (same reason build-publish.yml's own signing
      # steps were removed). Runs instead as an in-cluster gate
      # (`make d2 check supply-chain`).
      - name: Reconcile CI build inventory (ADR-0324)
        run: python3 platform/supply-chain/check_build_matrix.py
      # ADR-0603 M20 (WP-226): every Python lock is hashed, fresh against its
      # requirements.in, and one version per shared library.
      - name: Hashed Python lockfiles, one version per library (ADR-0603)
        run: |
          python3 platform/python/check_python_locks.py
          python3 platform/python/tests/test_check_python_locks.py
      # ADR-0603 M16 (WP-226): a digest in a chart's values is a signed pin of
      # a ledgered release, never a hand edit.
      - name: Rendered image digests match the release ledger (ADR-0603)
        run: python3 platform/supply-chain/render_release_digests.py --check
      - name: MCP server conformance (ADR-0119)
        run: python3 platform/supply-chain/check_mcp_server_conformance.py
      # ADR-0106/WP-165: OKF schema and policy validation, the quota-policy
      # lint, the authorization matrices and the agent contract suites run
      # in the zuno-demo-agents CI, where the agents live; their result
      # reaches this platform as the signed contract-tests attestation the
      # okf-release job below verifies.
      - name: Validate canonical platform documentation (ADR-0323)
        run: python3 platform/docs/check_docs.py
      # ADR-0606 clause 5 (WP-239): two ADR files under one number.
      - name: ADR number collision tests (ADR-0606)
        run: python3 platform/docs/tests/test_adr_number_collisions.py
      # WP-211: a newline escape inside {{ }} in a YAML block scalar stays backslash + n.
      - name: Jinja newline in YAML block scalars tests (WP-211)
        run: python3 platform/docs/tests/test_jinja_newline_in_block_scalars.py
      # doc_links: relative links and #anchors in every tracked markdown file (2026-11-12 audit).
      - name: Markdown link and anchor tests (doc_links)
        run: python3 platform/docs/tests/test_doc_links.py
      # ADR-0624: the stress table of docs/demo/README.md against the demos and the stress drivers.
      - name: Stress table tests
        run: python3 platform/docs/tests/test_stress_table.py
      # check_docs: the paths a live ADR's Status line cites must exist or be named by an Amended note.
      - name: ADR status path tests
        run: python3 platform/docs/tests/test_adr_status_paths.py
      # Lot 3 of the best-practices audit: a role's defaults file and its inline `| default('...')` must agree.
      - name: role defaults tests
        run: python3 platform/docs/tests/test_role_defaults_match_inline.py
      # check_docs: every copy of the platform map (HLD) equals the reference in docs/architecture/README.md.
      - name: HLD copies tests
        run: python3 platform/docs/tests/test_hld_copies.py
      # check_docs: the non-blocking freshness warnings (Last reviewed: YYYY-MM-DD).
      - name: Freshness tests
        run: python3 platform/docs/tests/test_freshness.py
      # ADR-0616 (WP-270, WP-271): the demo pages parse into steps, the read-only allowlist of the steps, the guards
      # and the session, and the pages agree with ansible/demos/ (every row its step file, every Do command covered,
      # no read-only unit changing anything, no stale `make demo` verb in the docs), and the GIF cut of a recording
      # (ADR-0617, WP-284: no ffmpeg or podman needed), and the page shape and published GIFs (ADR-0617, WP-285).
      # The end-to-end cases on the
      # fixture skip here (no ansible-playbook in this job); they run in the ansible job below. The smoke test lists
      # the catalogue and selects a demo from an empty HOME.
      - name: Demo lifecycle engine tests (ADR-0616)
        run: |
          python3 platform/demo/tests/test_catalogue_parser.py
          python3 platform/demo/tests/test_readonly.py
          python3 platform/demo/tests/test_guard_session.py
          python3 platform/demo/tests/test_demo_catalogue.py
          python3 platform/demo/tests/test_workshop.py
          python3 platform/demo/tests/test_argo_health.py
          python3 platform/demo/tests/test_gif.py
          python3 platform/demo/tests/test_page_shape.py
          python3 platform/demo/tests/test_terminal_take.py
          home="$(mktemp -d)"
          HOME="$home" make demo list
          HOME="$home" make demo use guardrails 15
      # ADR-0508/WP-51: OKF is read only by per-component hooks. The fixture
      # tests skip until the conformance cases ship in the admitted release
      # (zuno-demo-agents/conformance/cases, WP-51 part A).
      - name: OKF read boundary (ADR-0508)
        run: |
          python3 platform/okf/check_okf_read_boundary.py
          python3 platform/okf/tests/test_okf_read_boundary.py
      - name: OKF conformance cases through the admission and mcp-gateway hooks (ADR-0508)
        run: |
          python3 platform/okf/tests/test_okf_conformance.py
          python3 components/mcp-gateway/tests/test_okf_conformance.py
          python3 evaluations/tests/test_okf_hook.py
      # ADR-0615 clause 5 (WP-263): every reader hook's copy of the version dispatch rule gives the
      # same answer, on a fixed table and on every document of the conformance cases.
      - name: OKF version dispatch across the reader hooks (ADR-0615)
        run: |
          python3 platform/okf/tests/test_okf_version_dispatch.py
          python3 platform/docs/tests/test_okf_frontmatter.py
      # ADR-0605 (WP-238): how each demonstration moment's live answer is judged.
      - name: Golden-path probe judgement tests (ADR-0605)
        run: python3 evaluations/tests/test_golden_path_probe.py
      # ADR-0624 (WP-305, WP-307): the stress runner (plan, scheduler, budget guard, summaries, the first drivers against
      # an httpx mock transport), the pure half of the campaign Ansible tasks (skipped here without ansible-playbook)
      # and the dashboard coverage pack's planning and judging. httpx and PyYAML come from the agent Jobs' own pins.
      - name: Stress runner, campaign plan and dashboard coverage tests (ADR-0624)
        run: |
          pip install -r evaluations/tekos/requirements.txt
          python3 evaluations/tests/test_stress_runner.py
          python3 evaluations/tests/test_stress_chaos.py
          python3 evaluations/tests/test_stress_campaign_plan.py
          python3 evaluations/tests/test_stress_drivers.py
          python3 evaluations/tests/test_stress_mutating.py
          python3 evaluations/tests/test_stress_budget.py
          python3 evaluations/tests/test_stress_job_files.py
          python3 evaluations/tests/test_stress_report.py
          python3 evaluations/tests/test_stress_state.py
          python3 evaluations/tests/test_dashboard_coverage.py
      # Day 2 component chaos: the closed target catalogue (platform/chaos/targets.yaml), the plan of a run and the chart
      # values generated from the catalogue. The helm render cases of test_chart.py skip here (no helm in this job).
      - name: Chaos target catalogue and chart values tests
        run: |
          python3 platform/chaos/tests/test_targets.py
          python3 platform/chaos/tests/test_chart.py
      # ADR-0616 (WP-274): how the unifai-live-rag demo's start and stop drive the UnifAI RAG API (fake client, no
      # network, no httpx).
      - name: UnifAI RAG library tests (ADR-0616)
        run: python3 evaluations/tests/test_unifai_rag_library.py
      # ADR-0610 (WP-245): the Blender add-on's static check, SSE parsing and device sign-in helpers, and how the
      # prompt-set measurement judges a run (no Blender, no network).
      - name: Blender add-on and measurement tests (ADR-0610)
        run: |
          python3 evaluations/tests/test_blender_addon.py
          python3 evaluations/tests/test_blender_measure.py
      # ADR-0619 clause 8 (WP-298): Claude Code's apiKeyHelper, its refresh-token cache and device sign-in (no
      # network).
      - name: Claude Code token helper tests (ADR-0619)
        run: python3 evaluations/tests/test_claude_code_token.py
      # ADR-0619 (WP-292): the Praxis chart's rendered gateway configuration and policy (helm template, no cluster).
      - name: Praxis chart tests (ADR-0619)
        run: python3 platform/praxis/tests/test_praxis_chart.py
      # ADR-0619 (update of 2026-11-19): the Open WebUI entries that keep the Zuno tools off Praxis's SaaS models.
      - name: Open WebUI no-tools entries tests (ADR-0619)
        run: python3 platform/praxis/tests/test_open_webui_no_tools.py
      # ADR-0608 (WP-241): how each drift check judges what `oc get` returns.
      - name: Drift check judgement tests (ADR-0608)
        run: python3 platform/drift/tests/test_check_drift.py
      - name: Validate knowledge-domain descriptors and references (ADR-0202/ADR-0203)
        run: python3 platform/docs/check_knowledge_refs.py
      - name: Verify generated quota enforcement matches the released quota-policy.yaml (ADR-0511)
        run: python3 platform/okf/generate_quota_enforcement.py --check
      - name: Permitted SaaS fallback capability check (ADR-0053)
        run: python3 evaluations/tekos/gate_checks.py --config-only
      # The per-agent security_checks.py files run only inside the acceptance gate Job, so no test imports them:
      # a SyntaxError in three of them (a repeated `headers=` keyword) went unnoticed from 2026-11-12 to 2026-11-14.
      - name: Every evaluation script compiles
        run: python3 -m compileall -q evaluations
      # ADR-0307 (WP-41): scaffolds a throwaway agent, runs the composed
      # OKF/knowledge-ref validators (+ helm lint when available) against
      # it, and always discards it - proving the onboarding template stays
      # generatively valid as the validators/platform evolve.
      - name: Agent onboarding scaffold-validate-discard test (ADR-0307)
        run: python3 platform/templates/agent/test_scaffold_validate_discard.py

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - run: pip install pyyaml
      # Renders the keycloak chart (needs helm, installed above): realm
      # column limits, the client reconcile Job and the WP-169 eval
      # personas. Unrun in CI until 2026-10-23, when a 260-character client
      # description it guards against broke the live reconcile Job.
      - name: keycloak realm and reconcile Job tests (ADR-0530, WP-169)
        run: |
          # Chart.yaml names its operator dependency by the alias "startx".
          helm repo add startx https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable
          helm dependency build gitops/charts/keycloak
          pip install pytest
          python3 -m pytest -q platform/keycloak/tests
      # Renders the models chart (no dependency) and passes each model's vLLM
      # args through the same shell eval as KServe's start script: a bare JSON
      # argument crash-looped qwen35-9b on 2026-10-25 (60d6e81e).
      - name: vLLM args survive the KServe start script
        run: python3 -m pytest -q platform/models/tests
      # ADR-0603 M16 (WP-226): rendering a ledgered digest pins the Deployment
      # (repository@digest, IfNotPresent, no :latest trigger); needs helm.
      - name: render_release_digests.py tests (ADR-0603)
        working-directory: platform/supply-chain
        run: python3 tests/test_render_release_digests.py
      # The check renders the keycloak and postgresql charts, which both depend
      # on the startx "operator" chart (HTTPS URL); keycloak's was built
      # above, postgresql's was not and `helm template` refused to render it.
      - name: Workload hardening baseline (ADR-0052)
        run: |
          helm dependency build gitops/charts/postgresql
          python3 platform/security/check_workload_hardening.py
          python3 platform/security/tests/test_secret_env_names.py
      # ADR-0602 clause 2 / WP-223: every ExternalSecret reads Vault through its
      # namespace's own SecretStore and only the keys platform/vault/
      # secret-access.yaml grants that namespace (no ClusterSecretStore). Renders
      # every gitops/apps Application from a dependency-free chart copy, so it
      # needs helm but no chart repository.
      - name: Per-namespace Vault secret access (ADR-0602)
        run: |
          python3 platform/vault/check_secret_access.py
          python3 platform/vault/tests/test_check_secret_access.py
      # ADR-0602 / WP-224: PeerAuthentications only in zuno-data, zuno-auth and
      # zuno-ai-run, every plaintext port exception justified, and a deny-all
      # EgressFirewall ending in Deny 0.0.0.0/0 in zuno-ai-run and zuno-unifai.
      # Same hermetic rendering as the step above (helm, no chart repository).
      - name: Targeted mesh mTLS and egress firewalls (ADR-0602)
        run: |
          python3 platform/security/check_mesh_mtls.py
          python3 platform/security/tests/test_check_mesh_mtls.py
      # ADR-0602 clause 5 / WP-224: every gitops/apps Application sits in
      # zuno-platform or zuno-apps and renders only the cluster-scoped kinds
      # and namespaces its AppProject allows. Renders WITH subcharts (the
      # startx subcharts carry the Namespaces and OLM objects), so every
      # dependency is built first; --strict-dependencies fails on a gap.
      - name: ArgoCD AppProject split (ADR-0602)
        run: |
          helm repo add startx https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable
          for repo in https://borispolonsky.github.io/dify-helm https://charts.bitnami.com/bitnami https://charts.jetstack.io https://helm.openwebui.com https://helm.releases.hashicorp.com; do helm repo add "$(echo "$repo" | tr -c 'a-z0-9\n' '-')" "$repo"; done
          for chart in gitops/charts/*/; do if grep -q '^dependencies:' "$chart/Chart.yaml"; then helm dependency build "$chart"; fi; done
          python3 platform/gitops/check_app_projects.py --strict-dependencies
          python3 platform/gitops/tests/test_check_app_projects.py
      # After the step above, which adds the dependency repositories and builds every chart's dependencies: linted before,
      # the wrapper charts only warned "missing dependencies" and nothing of what they render was checked.
      - name: helm lint every chart (dependencies built)
        run: |
          set -e
          for chart in gitops/charts/*/; do
            helm lint "$chart"
          done
      # The Kuadrant wasm EnvoyFilter of the MaaS gateway grows with matches x limits x listeners; past a size the API server
      # refuses its update and the limits are silently NOT USED. Estimated from the models chart rendered the way demo333 runs it:
      # the d1 Application turns on the second listener, the Praxis and the stress subscriptions (not the chart defaults).
      - name: MaaS wasm EnvoyFilter size estimate (demo333's shape)
        run: |
          helm template m gitops/charts/models -f gitops/charts/models/values.agents.generated.yaml \
            --set altGatewayPeers.praxis.enabled=true --set altGatewayPeers.stress.enabled=true \
            --set maas.saasSubscriptions.gatewayOnly=true \
            | python3 platform/models/maas_wasm_size.py - --listeners 2 --max-bytes 1400000

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install pyyaml jinja2
      # ruff.toml: the blocking rules find real defects only (syntax errors, undefined names, redefinitions); the wider set
      # is informational, its debt is mostly deliberate style (see ruff.toml).
      - name: ruff, defect rules (blocking)
        run: pip install ruff==0.17.6 && ruff check .
      - name: ruff, wider rule set (informational)
        run: ruff check --select E4,E7,E9,F --statistics . || true
      # shellcheck is on the runner image. Informational until the baseline is known: it was never run on these scripts.
      - name: shellcheck (informational)
        run: shellcheck --severity=warning $(git ls-files '*.sh') || true
      # ADR-0580/WP-165: agents and the corp policies are not in this
      # repository; the steps below read the release pinned in
      # platform/okf/agents.lock, verified offline and extracted once by
      # platform/okf/release_cache.py (needs cosign and oras).
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.2.2
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.4.1
      - name: Extract the locked agents release
        run: python3 platform/okf/release_cache.py
      - name: mcp-gateway tests
        working-directory: components/mcp-gateway
        run: |
          pip install -r requirements.txt
          python3 tests/test_auth.py
          python3 tests/test_downstream_streamable_http.py
          python3 tests/test_bindings.py
          python3 tests/test_auth_mode_enforcement.py
          # ADR-0401/0403/0406 (WP-172): the agent delegation chain, on synthetic agents.
          python3 tests/test_agent_chain.py
          # ADR-0592 (WP-189): experience clients loaded next to the agents.
          python3 tests/test_experience_clients.py
          # WP-225 lot B (ADR-0603 M12, M13, M15): the signed caller context, the
          # namespace matcher of metrics.query, the email recipient allowlist and
          # the JSON-RPC batch bound. promql-parser (test-only lock) re-parses every
          # rewritten query.
          pip install --require-hashes -r tests/requirements.txt
          python3 tests/test_wp225_lot_b.py
          # WP-225 lot C (ADR-0602 clause 10, ADR-0603 M14): the per-call assertion
          # instead of the forwarded bearer, one entitlement check for REST and /mcp,
          # the signed agent chain, the azp allowlist.
          python3 tests/test_wp225_lot_c.py
          # WP-250: the caller context inside the call assertion, and generate_diagram's assertion.
          python3 tests/test_wp250_assertion_context.py
          python3 tests/test_wp250_diagram_assertion.py
          # ADR-0624 (WP-306): the stress tag is a span attribute only (SDK on, exporter at a closed port).
          OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:9 python3 tests/test_traffic_tag.py
          # WP-313 step 5: the tool-invocation label sets exist at 0 from startup.
          OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:9 python3 tests/test_zero_init.py
          # pytest-style (monkeypatch fixture): the search_technical_docs
          # handler, UnifAI CONFLUENCE + WEB merge (WP-156, WP-168).
          pip install pytest
          python3 -m pytest -q tests/test_rag_query.py
      # WP-250 lot 2: diagram-render verifies the gateway's call assertion (assertion.js), in the Node 20 image.
      - name: diagram-render call-assertion tests (WP-250)
        run: |
          docker run --rm -v "$PWD/components/diagram-render:/work" -w /work \
            docker.io/library/node:20-alpine@sha256:afdf98210b07b586eb71fa22ba2e432e058e4cd1304d31ed60888755b8c865fb \
            node test/assertion.test.js
      - name: world-model-runtime tests on the CPU mocks (ADR-0604)
        working-directory: components/world-model-runtime
        run: |
          pip install -r requirements.txt
          pip install pytest
          python3 -m pytest -q tests
      - name: world-model chart pulls the pinned weights (ADR-0604)
        run: python3 platform/world-model/tests/check_pins.py
      - name: world-model-web tests (ADR-0604)
        working-directory: components/world-model-web
        run: |
          pip install -r requirements.txt
          pip install pytest
          python3 -m pytest -q tests
      # No setup-node action in this repository: the UI is checked in the same pinned Node 20 image the
      # Dockerfile builds it with (typecheck, unit tests, production build, all from the lockfile).
      - name: world-model-web UI typecheck, unit tests and build (ADR-0604)
        run: |
          docker run --rm -v "$PWD/components/world-model-web/ui:/work" -w /work \
            docker.io/library/node:20-alpine@sha256:afdf98210b07b586eb71fa22ba2e432e058e4cd1304d31ed60888755b8c865fb \
            sh -c 'npm ci --ignore-scripts --no-audit --no-fund && npm run typecheck && npm test && npm run build'
      - name: zuno-token-proxy tests (ADR-0601)
        working-directory: components/zuno-token-proxy
        run: |
          pip install -r requirements.txt
          python3 tests/test_token_proxy.py
          python3 tests/test_tls_verify.py
          # WP-225 lot C: the proxy authenticates its callers (INBOUND_KEYS_FILE).
          python3 tests/test_wp225_inbound_auth.py
          # WP-297 (ADR-0619 clause 5): the alternative gateways (ALT_GATEWAYS, /alt/<name>/v1/...).
          python3 tests/test_wp297_alt_gateways.py
      - name: zuno-dify-knowledge tests (ADR-0599)
        working-directory: components/zuno-dify-knowledge
        run: |
          pip install -r requirements.txt
          python3 tests/test_dify_knowledge.py
      - name: ai-gateway tests
        working-directory: components/ai-gateway
        run: |
          pip install -r requirements.txt
          python3 tests/test_maas_adapter.py
          python3 tests/test_semantic_cache.py
          python3 tests/test_cache_integration.py
          python3 tests/test_model_routing_policy.py
          python3 tests/test_adapter_selection.py
          python3 tests/test_optimizer.py
          python3 tests/test_stream_telemetry.py
          # WP-313 step 5: the model counters' known label sets exist at 0 from startup.
          OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:9 python3 tests/test_telemetry_zero_init.py
          python3 tests/test_local_cost_estimation.py
          # ADR-0544: X-Zuno-Max-Tokens parsing and per-vendor forwarding,
          # including the via_maas branch structure-demo's own preferred
          # candidate actually uses.
          python3 tests/test_max_tokens_passthrough.py
          # WP-226: the CA bundle path reaches httpx 0.28 as an SSLContext.
          python3 tests/test_tls_verify.py
          # WP-157: the default-off MaaS switches (429 pass-through, gateway
          # identity and its attested headers, per-class fail modes).
          python3 tests/test_wp157_maas_switches.py
          # ADR-0624 (WP-306): a dedicated MaaS credential per quota class (no fallback to the shared one), the loadtest
          # group, and the span-only zuno.traffic tag.
