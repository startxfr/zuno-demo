# Static checks that need no live cluster, registry or credentials - every
# one of these commands was actually run (and currently passes, except
# where documented as a known, honest gap) in this repository's own
# development environment before this workflow was written. See each
# script's own docstring/README for what it checks and why.
name: Lint and policy checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  policy-as-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml openapi-spec-validator
      - uses: sigstore/cosign-installer@v3
      # ADR-0115 - known-failing today (6 charts still use tag: latest,
      # pending the build-publish.yml pipeline actually publishing
      # immutable tags for them to reference) - see
      # platform/supply-chain/README.md. Not made a hard CI gate yet for
      # that reason; report only.
      - name: Reject non-immutable image tags (ADR-0115)
        run: python3 platform/supply-chain/check_no_latest_tags.py
        continue-on-error: true
      # ADR-0115 stage 1 (WP-04): passes trivially today (nothing
      # immutable-tagged to verify yet - see the script's own docstring)
      # and needs `cosign` + real registry network access to mean anything
      # once a release exists, so it stays non-blocking alongside the
      # check above until that release lands (RELEASING.md step 5).
      - name: Verify first-party image signatures (ADR-0115)
        run: python3 platform/supply-chain/verify_signatures.py
        continue-on-error: true
      - name: Reconcile CI build inventory (ADR-0324)
        run: python3 platform/supply-chain/check_build_matrix.py
      # ADR-0106: schema/policy validity (dimensions 2-3 of the ADR's three
      # checks) is verifiable on every PR with no signature needed, so this
      # is a hard gate like check_build_matrix.py above - unlike signature
      # verification (dimension 1), which has nothing to check at PR time
      # (bundle signatures are release/CI artifacts, never committed to
      # git) and is instead enforced at deployment time: the Day 1 agents
      # check (ansible/roles/agents) and the Agent Runtime registry
      # startup, gated by ZUNO_REQUIRE_SIGNED_BUNDLES once a real signed
      # bundle exists (see platform/supply-chain/sign_okf_bundle.py).
      - name: Validate OKF bundle schema and policy references (ADR-0106)
        run: python3 platform/supply-chain/validate_okf_bundle.py
      - name: Validate canonical platform documentation (ADR-0323)
        run: python3 platform/docs/check_docs.py
      - name: Lint OpenAPI contracts (ADR-0054)
        run: python3 platform/api/lint_openapi.py
      - name: Permitted SaaS fallback capability check (ADR-0053)
        run: python3 evaluations/tekos/gate_checks.py

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint every chart
        run: |
          set -e
          for chart in gitops/charts/*/; do
            helm lint "$chart"
          done
      - run: pip install pyyaml
      - name: Workload hardening baseline (ADR-0052)
        run: python3 platform/security/check_workload_hardening.py

  go:
    runs-on: ubuntu-latest
    # ADR-0042: internal/session/session_test.go exercises a real
    # redis.Client against a real Redis, not a fake - a service container
    # is the standard GitHub Actions way to give a job that.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # ADR-0043 bumped mcp-gateway/sales-db off the old fastapi/
          # starlette pins; ADR-0042 needs go-redis/v9, which requires Go
          # 1.24 - both components/agent-frontend/go.mod and
          # components/agent-bff/go.mod build under this version.
          go-version: "1.24"
      - name: agent-frontend (build/vet/fmt/test)
        working-directory: components/agent-frontend
        env:
          TEST_REDIS_ADDR: localhost:6379
        run: |
          go build ./...
          go vet ./...
          test -z "$(gofmt -l .)"
          go test ./...
      - name: agent-bff (build/vet/fmt/test)
        working-directory: components/agent-bff
        run: |
          go build ./...
          go vet ./...
          test -z "$(gofmt -l .)"
          go test ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: agent-runtime tests
        working-directory: components/agent-runtime
        run: |
          pip install -r requirements.txt
          python3 tests/test_registry.py
          python3 tests/test_retrieve_metadata.py
          python3 tests/test_auth.py
          python3 tests/test_bundle_signing.py
          python3 tests/test_checkpointing.py
      - name: mcp-gateway tests
        working-directory: components/mcp-gateway
        run: |
          pip install -r requirements.txt
          python3 tests/test_auth.py
          python3 tests/test_downstream_sales_db.py
          python3 tests/test_bindings.py
      - name: ai-gateway tests
        working-directory: components/ai-gateway
        run: |
          pip install -r requirements.txt
          python3 tests/test_maas_adapter.py
      - name: supply-chain pin_release.py tests (ADR-0115)
        working-directory: platform/supply-chain
        run: |
          pip install pyyaml
          python3 tests/test_pin_release.py
      - name: supply-chain sign_okf_bundle.py tests (ADR-0106)
        working-directory: platform/supply-chain
        run: python3 tests/test_sign_okf_bundle.py
      - name: sales-db MCP server tests
        working-directory: components/mcp-servers/sales-db
        run: |
          pip install -r requirements.txt
          python3 tests/test_mcp_protocol.py
      - name: confluence MCP server tests
        working-directory: components/mcp-servers/confluence
        run: |
          pip install -r requirements.txt
          python3 tests/test_mcp_protocol.py
      - name: rag-service tests
        working-directory: components/rag-service
        run: |
          pip install -r requirements.txt
          python3 tests/test_search_filters.py

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ansible && ansible-galaxy collection install kubernetes.core
      - name: Syntax-check every playbook
        run: |
          set -e
          for playbook in ansible/playbooks/*.yml; do
            ansible-playbook -i ansible/inventories/demo/hosts.yml "$playbook" --syntax-check
          done
