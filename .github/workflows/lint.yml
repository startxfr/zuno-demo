# Static checks that need no live cluster, registry or credentials - every
# one of these commands was actually run (and currently passes, except
# where documented as a known, honest gap) in this repository's own
# development environment before this workflow was written. See each
# script's own docstring/README for what it checks and why.
name: Lint and policy checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  policy-as-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # ADR-0580/WP-165: agents and the corp policies are not in this
      # repository; the steps below read the release pinned in
      # platform/okf/agents.lock, verified offline and extracted once by
      # platform/okf/release_cache.py (needs cosign and oras).
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.2.2
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - name: Extract the locked agents release
        run: python3 platform/okf/release_cache.py
      # ADR-0111/ADR-0549 (2026-09-05): the "immutable image tags" check
      # that used to run here (check_no_latest_tags.py, non-blocking) is
      # removed - zero GitHub Actions dependency for this compliance
      # story now (ADR-0549's explicit decision). Its premise ("a chart's
      # tag must never say latest") permanently contradicts ADR-0059 by
      # design: main's charts keep `tag: latest` forever, since that's
      # what the image.openshift.io/triggers auto-redeploy annotation
      # watches. Enforcement moved in-cluster instead: `make d3 release
      # TAG=<tag>` (ansible/playbooks/day3_release.yml) builds, RHTAS-signs
      # and ledgers a named release on demand, and
      # platform/supply-chain/check_release_ledger.py (wired into `make d2
      # check supply-chain`) validates that ledger's structural integrity.
      # See check_no_latest_tags.py's own dated note for the full detail.
      # ADR-0420/WP-070 (2026-08-22): removed from this CI lint gate -
      # verify_signatures.py now resolves each component's live
      # ImageStreamTag digest via `oc get istag`, which a GitHub-hosted
      # runner has no route to (same reason build-publish.yml's own signing
      # steps were removed). Runs instead as an in-cluster gate
      # (`make d2 check supply-chain`).
      - name: Reconcile CI build inventory (ADR-0324)
        run: python3 platform/supply-chain/check_build_matrix.py
      - name: MCP server conformance (ADR-0119)
        run: python3 platform/supply-chain/check_mcp_server_conformance.py
      # ADR-0106/WP-165: OKF schema and policy validation, the quota-policy
      # lint, the authorization matrices and the agent contract suites run
      # in the zuno-demo-agents CI, where the agents live; their result
      # reaches this platform as the signed contract-tests attestation the
      # okf-release job below verifies.
      - name: Validate canonical platform documentation (ADR-0323)
        run: python3 platform/docs/check_docs.py
      # ADR-0508/WP-51: OKF is read only by per-component hooks. The fixture
      # tests skip until the conformance cases ship in the admitted release
      # (zuno-demo-agents/conformance/cases, WP-51 part A).
      - name: OKF read boundary (ADR-0508)
        run: |
          python3 platform/okf/check_okf_read_boundary.py
          python3 platform/okf/tests/test_okf_read_boundary.py
      - name: OKF conformance cases through the admission and mcp-gateway hooks (ADR-0508)
        run: |
          python3 platform/okf/tests/test_okf_conformance.py
          python3 components/mcp-gateway/tests/test_okf_conformance.py
          python3 evaluations/tests/test_okf_hook.py
      - name: Validate knowledge-domain descriptors and references (ADR-0202/ADR-0203)
        run: python3 platform/docs/check_knowledge_refs.py
      - name: Verify generated quota enforcement matches the released quota-policy.yaml (ADR-0511)
        run: python3 platform/okf/generate_quota_enforcement.py --check
      - name: Permitted SaaS fallback capability check (ADR-0053)
        run: python3 evaluations/tekos/gate_checks.py
      # ADR-0307 (WP-41): scaffolds a throwaway agent, runs the composed
      # OKF/knowledge-ref validators (+ helm lint when available) against
      # it, and always discards it - proving the onboarding template stays
      # generatively valid as the validators/platform evolve.
      - name: Agent onboarding scaffold-validate-discard test (ADR-0307)
        run: python3 platform/templates/agent/test_scaffold_validate_discard.py

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint every chart
        run: |
          set -e
          for chart in gitops/charts/*/; do
            helm lint "$chart"
          done
      - run: pip install pyyaml
      # Renders the keycloak chart (needs helm, installed above): realm
      # column limits, the client reconcile Job and the WP-169 eval
      # personas. Unrun in CI until 2026-10-23, when a 260-character client
      # description it guards against broke the live reconcile Job.
      - name: keycloak realm and reconcile Job tests (ADR-0530, WP-169)
        run: |
          # Chart.yaml names its operator dependency by the alias "startx".
          helm repo add startx http://sx-helm-repository-prod.s3-website.eu-west-3.amazonaws.com/stable
          helm dependency build gitops/charts/keycloak
          pip install pytest
          python3 -m pytest -q platform/keycloak/tests
      # The check renders the keycloak and postgresql charts, which both depend
      # on the startx "operator" chart (alias:startx); keycloak's was built
      # above, postgresql's was not and `helm template` refused to render it.
      - name: Workload hardening baseline (ADR-0052)
        run: |
          helm dependency build gitops/charts/postgresql
          python3 platform/security/check_workload_hardening.py
          python3 platform/security/tests/test_secret_env_names.py

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # ADR-0580/WP-165: agents and the corp policies are not in this
      # repository; the steps below read the release pinned in
      # platform/okf/agents.lock, verified offline and extracted once by
      # platform/okf/release_cache.py (needs cosign and oras).
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.2.2
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - name: Extract the locked agents release
        run: python3 platform/okf/release_cache.py
      - name: mcp-gateway tests
        working-directory: components/mcp-gateway
        run: |
          pip install -r requirements.txt
          python3 tests/test_auth.py
          python3 tests/test_downstream_streamable_http.py
          python3 tests/test_bindings.py
          python3 tests/test_auth_mode_enforcement.py
          # ADR-0401/0403/0406 (WP-172): the agent delegation chain, on synthetic agents.
          python3 tests/test_agent_chain.py
          # pytest-style (monkeypatch fixture): the search_technical_docs
          # handler, UnifAI CONFLUENCE + WEB merge (WP-156, WP-168).
          pip install pytest
          python3 -m pytest -q tests/test_rag_query.py
      - name: ai-gateway tests
        working-directory: components/ai-gateway
        run: |
          pip install -r requirements.txt
          python3 tests/test_maas_adapter.py
          python3 tests/test_semantic_cache.py
          python3 tests/test_cache_integration.py
          python3 tests/test_model_routing_policy.py
          python3 tests/test_adapter_selection.py
          python3 tests/test_optimizer.py
          python3 tests/test_stream_telemetry.py
          python3 tests/test_local_cost_estimation.py
          # ADR-0544: X-Zuno-Max-Tokens parsing and per-vendor forwarding,
          # including the via_maas branch structure-demo's own preferred
          # candidate actually uses.
          python3 tests/test_max_tokens_passthrough.py
          # WP-157: the default-off MaaS switches (429 pass-through, gateway
          # identity and its attested headers, per-class fail modes).
          python3 tests/test_wp157_maas_switches.py
      - name: supply-chain pin_release.py tests (ADR-0115)
        working-directory: platform/supply-chain
        run: |
          pip install pyyaml
          python3 tests/test_pin_release.py
      - name: supply-chain admit_okf_bundle.py tests (ADR-0580)
        working-directory: platform/supply-chain
        run: python3 tests/test_admit_okf_bundle.py
      - name: supply-chain UnifAI image verification and pins (ADR-0586)
        working-directory: platform/supply-chain
        run: |
          python3 tests/test_verify_unifai_images.py
          python3 tests/test_check_unifai_pins.py
          python3 tests/test_pin_unifai_images.py
          python3 tests/test_pin_operator_catalog.py
          python3 tests/test_admission_preflight.py
          python3 tests/test_render_policy_trustroot.py
          python3 render_policy_trustroot.py --check
          python3 check_unifai_pins.py
      - name: OpenShift GitOps operator health check (WP-176 follow-up)
        run: python3 platform/gitops/tests/test_check_gitops_operator.py
      - name: confluence MCP server tests
        working-directory: components/mcp-servers/confluence
        run: |
          pip install -r requirements.txt
          python3 tests/test_mcp_protocol.py
      # ADR-0119: was missing (a real gap the new
      # check_mcp_server_conformance.py checker caught) - these tests
      # existed but never ran in CI.
      - name: salesforce MCP server tests
        working-directory: components/mcp-servers/salesforce
        run: |
          pip install -r requirements.txt
          python3 tests/test_mcp_protocol.py
      - name: git-forge MCP server tests (ADR-0120)
        working-directory: components/mcp-servers/git-forge
        run: |
          pip install -r requirements.txt
          python3 tests/test_mcp_protocol.py
      - name: aap MCP server tests (ADR-0355)
        working-directory: components/mcp-servers/aap
        run: |
          pip install -r requirements.txt
          python3 tests/test_mcp_protocol.py
      - name: evaluations quality gate tests (ADR-0107)
        working-directory: evaluations
        run: |
          pip install pyyaml httpx
          python3 tests/test_quality_gate.py
      - name: evaluations benchmark harness tests (ADR-0305)
        working-directory: evaluations
        run: python3 tests/test_benchmark.py
      - name: evaluations routing report tests (ADR-0304)
        working-directory: evaluations
        run: python3 tests/test_routing_report.py
      - name: evaluations PEFT regression gate tests (ADR-0534/WP-109)
        working-directory: evaluations
        run: python3 tests/test_peft_regression.py
      # WP-112: carries test_probe_schemas_have_not_drifted_from_the_runtime,
      # which had been FAILING since ef7b5c43 (2026-09-02) with nobody
      # noticing - the probe fixture still held the pre-ef7b5c43
      # generate_image description, so the narration gate was scoring a
      # schema the runtime no longer sends. Not wired here is why.
      - name: evaluations delegation checks tests (ADR-0401/0403/0406, WP-174)
        working-directory: evaluations
        run: python3 tests/test_delegation_checks.py
      - name: evaluations tool-calling conformance tests (ADR-0526/WP-087)
        working-directory: evaluations
        run: |
          pip install pyyaml
          python3 tests/test_tool_calling_conformance.py

  quality-gate:
    # ADR-0107 (roadmap WP-10): a real PASS/FAIL quality verdict needs a
    # live cluster (evaluations/<agent>/run_scenarios.py and
    # security_checks.py make real HTTP calls this GitHub-hosted runner
    # cannot reach - the whole reason this file's own top comment says
    # "no live cluster, registry or credentials"), so this job does not
    # claim to render one. What IS genuinely repo-executable and worth
    # blocking on: the gate *mechanism* itself is not broken (config
    # missing/malformed, quality_gate.py crashing) for any agent whose
    # evaluations/<agent>/ directory changed in this PR - see
    # quality_gate.py's own module docstring for the full design
    # rationale and the WP-10 brief's "Operator follow-up" for where the
    # real live verdict is exercised instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # ADR-0580/WP-165: agents and the corp policies are not in this
      # repository; the steps below read the release pinned in
      # platform/okf/agents.lock, verified offline and extracted once by
      # platform/okf/release_cache.py (needs cosign and oras).
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.2.2
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - name: Extract the locked agents release
        run: python3 platform/okf/release_cache.py
      - name: Determine which evaluations/<agent>/ directories changed (path filter)
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "no comparable base commit - checking every agent instead of diffing"
            changed_files=$(git ls-files evaluations/)
          else
            changed_files=$(git diff --name-only "$base" HEAD -- evaluations/)
          fi
          agents=$(echo "$changed_files" | grep -oE '^evaluations/[^/]+/' | sed 's#evaluations/##; s#/##' | sort -u | tr '\n' ' ')
          echo "Changed evaluations/ subdirectories: ${agents:-<none>}"
          echo "agents=$agents" >> "$GITHUB_OUTPUT"
      - name: Quality gate wiring smoke check
        if: steps.changed.outputs.agents != ''
        run: |
          pip install pyyaml httpx
          set +e
          exit_status=0
          for agent in ${{ steps.changed.outputs.agents }}; do
            if [ ! -f "evaluations/$agent/gate_config.yaml" ]; then
              echo "skip $agent: no gate_config.yaml yet (not wired to ADR-0107)"
              continue
            fi
            if [ -f "evaluations/$agent/requirements.txt" ]; then
              pip install -r "evaluations/$agent/requirements.txt"
            fi
            python3 evaluations/quality_gate.py --agent "$agent" --candidate ci-smoke-test
            code=$?
            if [ "$code" -eq 2 ]; then
              echo "::error::quality gate wiring broken for agent=$agent (exit 2 = config/wiring defect, not a scenario-rate result)"
              exit_status=1
            else
              echo "quality gate ran to completion for agent=$agent (exit $code) - a real PASS/FAIL verdict needs a live cluster (see the WP-10 roadmap brief's operator follow-up); this job only blocks on a wiring/config defect (exit 2)"
            fi
          done
          exit $exit_status
      # ADR-0305 (WP-40): "a candidate without a benchmark artifact cannot
      # be referenced by a routing-policy change" - fully repo-checkable
      # (reads the admitted release's policies/model-routing/
      # model-routing-policy.yaml and evaluations/benchmarks/*.json, never
      # a live call), unlike the scenario-rate verdict above, so this one
      # IS a real, always-blocking gate rather than a wiring smoke check.
      # Passes trivially today: adapters: [] has nothing to check.
      - name: Enforce no-artifact-no-promotion for declared adapters (ADR-0305)
        run: |
          pip install pyyaml
          python3 evaluations/benchmark.py --check-policy

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ansible && ansible-galaxy collection install kubernetes.core
      - name: Syntax-check every playbook
        run: |
          set -e
          for playbook in ansible/playbooks/*.yml; do
            ansible-playbook -i ansible/inventories/demo/hosts.yml "$playbook" --syntax-check
          done

  # ADR-0580/WP-160: the agents release this platform pins is re-verified on
  # every change, offline against the committed Sigstore trust root, and
  # checked servable against this tree's bindings - so neither a hand-edited
  # lock nor a binding removed from under a released agent can merge.
  okf-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.2.2
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - name: Verify and validate the locked agents release
        run: |
          if ! grep -q '^[^#]' platform/okf/agents.lock; then
            echo "::notice::platform/okf/agents.lock pins no release yet"
            exit 0
          fi
          python3 platform/supply-chain/admit_okf_bundle.py admit
      # ADR-0581/WP-164: the stack configuration derived from that release
      # must be the committed one.
      - name: Generated stack configuration matches the locked release
        run: python3 platform/okf/generate_stack_config.py --check
      - name: generate_stack_config.py tests
        run: python3 platform/okf/tests/test_generate_stack_config.py
