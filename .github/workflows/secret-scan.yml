# ADR-0603 / WP-222: both repositories are public and the only barrier against a committed
# credential was .gitignore. This scans the full history of every push and pull request.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main, devel]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The binary is downloaded and verified against the release checksums, not installed
      # through a third-party action that needs a licence key for organisations.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          V=8.21.2
          T="gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/${T}"
          curl -sSfL -o gl.sum "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep " ${T}\$" gl.sum | sha256sum -c -
          tar -xzf "${T}" gitleaks
      - name: Scan history
        run: ./gitleaks git --redact --exit-code 1 --verbose .
