# ADR-0603 / WP-222: both repositories are public and the only barrier against a committed
# credential was .gitignore. Pull requests and pushes scan only the commits they bring, so an
# old, already-rotated finding never blocks unrelated work; the weekly run scans the whole
# history. .gitleaks.toml (when present at the repository root) lists documented false positives.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main, devel]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in step with .pre-commit-config.yaml (rev: v<same version>).
  GITLEAKS_VERSION: "8.21.2"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The binary is downloaded and verified against the release checksums, not installed
      # through a third-party action that needs a licence key for organisations.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          T="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/${T}"
          curl -sSfL -o gl.sum "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${T}\$" gl.sum | sha256sum -c -
          tar -xzf "${T}" gitleaks
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) range="origin/${BASE_REF}..HEAD" ;;
            push)
              # A new branch has no "before" commit: scan its whole history once.
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then range=""
              else range="${BEFORE}..${SHA}"; fi ;;
            *) range="" ;;
          esac
          if [ -n "$range" ]; then
            echo "scanning ${range}"
            ./gitleaks git --redact --exit-code 1 --verbose --log-opts="${range}" .
          else
            echo "scanning the full history"
            ./gitleaks git --redact --exit-code 1 --verbose .
          fi
