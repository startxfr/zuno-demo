# ADR-0115: build every component in CI, publish to Quay with immutable
# tags, generate an SBOM, and scan for vulnerabilities.
#
# ADR-0420/WP-070 (2026-08-22): the signing steps this workflow used to run
# here (keyless cosign via GitHub's OIDC identity, Sigstore Fulcio/Rekor)
# are removed - a GitHub-hosted runner has no route to the in-cluster Vault
# Transit key that replaces them, so CI can no longer sign anything.
# Signing now runs in-cluster instead: images built via the OpenShift
# BuildConfig/ImageStream path get signed by
# ansible/tasks/run_okf_signing_job.yml's image-signing counterpart
# (WP-070), and OKF bundles by run_okf_signing_job.yml itself (WP-069) -
# see docs/adr/0420-*.md. This workflow still builds/publishes/SBOMs/scans
# for the optional Quay release path (RELEASING.md); it just doesn't sign
# anymore.
#
# DISABLED (2026-08-22, WP-04/ADR-0115 closed - see the ADR's "closed,
# pipeline disabled" note): the automatic push/tag triggers below are
# removed so this never fires on its own. Deployment has never depended on
# it - every chart is built and served from the in-cluster BuildConfig/
# ImageStream path (RELEASING.md). The pipeline itself was proven working
# (2026-08-19, run 32273454405, tag v0.1.0 - real signed/SBOM'd images
# published to quay.io/zuno/*, back when signing still ran here) and is
# left in place, runnable manually via workflow_dispatch, ready to have its
# triggers restored under a future ADR if this supply-chain stream is
# reactivated.
#
# QUAY_USERNAME/QUAY_PASSWORD must be configured as encrypted repository
# secrets in GitHub - never committed here.
#
# NOT executed in this repository's development environment: this sandbox
# has no live Quay credentials or GitHub Actions runner to actually
# exercise this against. Written to be genuinely runnable the moment those
# secrets are provisioned - see docs/adr/0051-*.md's Implementation state
# and .github/README.md for the honest scope of what "implemented" means
# here.
name: Build, publish and scan component images

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  REGISTRY: quay.io
  REGISTRY_NAMESPACE: zuno

jobs:
  # ADR-0119 (WP-057): discovers every components/mcp-servers/<name> with a
  # Dockerfile, feeding the dynamic matrix below - a new MCP server needs
  # no entry here at all (unlike every other component in this workflow),
  # only components/mcp-servers/<name>/Dockerfile + requirements.txt +
  # server.py to exist. platform/supply-chain/check_build_matrix.py
  # verifies this job's discovery command still targets
  # components/mcp-servers, so this can't silently rot into a no-op.
  discover-mcp-servers:
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.discover.outputs.servers }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover components/mcp-servers/*/Dockerfile
        id: discover
        run: |
          servers=$(find components/mcp-servers -mindepth 1 -maxdepth 1 -type d \
            -exec test -e '{}/Dockerfile' \; -print | xargs -n1 basename | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "servers=${servers}" >> "$GITHUB_OUTPUT"

  build-publish-sign:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # context: "." means the Dockerfile bakes in files outside its
          # own component directory (e.g. agents/) and needs the
          # repository root as build context - see each Dockerfile's own
          # header comment for exactly why.
          #
          # build_args: every Dockerfile's FROM defaults to the
          # cluster-internal zuno-ai-build ImageStream mirror
          # (ansible/roles/image_mirrors) for in-cluster BuildConfig builds
          # (ansible/tasks/apply_openshift_build.yml). This workflow's
          # GitHub-hosted runners can't reach that internal registry, so
          # every entry overrides its ARG(s) to the same real public image
          # the mirror itself points at (see
          # ansible/roles/image_mirrors/tasks/install.yml for the mapping).
          - name: agent-bff
            dockerfile: components/agent-bff/Dockerfile
            context: components/agent-bff
            build_args: |
              GOLANG_BASE_IMAGE=docker.io/library/golang:1.26
              RUNTIME_BASE_IMAGE=registry.access.redhat.com/ubi9/ubi-minimal@sha256:7c372902c8d211db2d25c8277ba534a73b92742a334874dced829a63b0f21221
          - name: agent-frontend
            dockerfile: components/agent-frontend/Dockerfile
            context: .
            build_args: |
              NODE_BASE_IMAGE=docker.io/library/node:20-alpine
              GOLANG_BASE_IMAGE=docker.io/library/golang:1.26
              RUNTIME_BASE_IMAGE=registry.access.redhat.com/ubi9/ubi-minimal@sha256:7c372902c8d211db2d25c8277ba534a73b92742a334874dced829a63b0f21221
          - name: agent-runtime
            dockerfile: components/agent-runtime/Dockerfile
            context: .
            build_args: |
              BASE_IMAGE=docker.io/library/python:3.11-slim
          # ADR-0303/WP-39: context changed from "components/ai-gateway" to
          # "." - the image now bakes in policies/model-routing/, outside
          # its own component directory (same reason agent-bff's sibling
          # entries above already use ".").
          - name: ai-gateway
            dockerfile: components/ai-gateway/Dockerfile
            context: .
            build_args: |
              BASE_IMAGE=docker.io/library/python:3.11-slim
          - name: mcp-gateway
            dockerfile: components/mcp-gateway/Dockerfile
            context: .
            build_args: |
              BASE_IMAGE=docker.io/library/python:3.11-slim
          # ADR-0516: backs mcp-gateway's generate_diagram handler, same
          # relationship ai-gateway has to image_gen.py above - a
          # standalone entry (not context: ".") since, unlike every
          # Python entry in this matrix, it bakes in nothing outside its
          # own component directory.
          - name: diagram-render
            dockerfile: components/diagram-render/Dockerfile
            context: components/diagram-render
            build_args: |
              BASE_IMAGE=docker.io/library/node:20-alpine
          - name: rag-service
            dockerfile: components/rag-service/Dockerfile
            context: .
            build_args: |
              BASE_IMAGE=docker.io/library/python:3.11-slim
          # ADR-0119 (WP-057): confluence/salesforce used to be
          # listed here by hand, one entry each. They - and every future
          # components/mcp-servers/<name>/Dockerfile - are now built by
          # the discover-mcp-servers/build-publish-sign-mcp-servers job
          # pair below instead, since every MCP server shares the same
          # context/build_args shape (unlike the heterogeneous entries in
          # this matrix). Do not re-add mcp-* server entries here.
          # ADR-0302/WP-34: unlike rag-ingestion (its own image is built
          # exclusively via the in-cluster OpenShift BuildConfig,
          # ansible/roles/rag_ingestion_build), mlops's own WP explicitly
          # asks for this image to also be published through this
          # workflow's build matrix.
          - name: mlops
            dockerfile: components/mlops/Containerfile
            context: .
            build_args: |
              BASE_IMAGE=registry.access.redhat.com/ubi9/python-311:latest
          # ADR-0327/ADR-0308/WP-38: first-party Go module, own go.mod
          # (not part of the repo-root Python/Node build surface any other
          # entry here belongs to) - context is its own directory since
          # the Dockerfile only ever needs operator/aiagent-operator/'s
          # own go.mod/go.sum/source, unlike the "context: ." entries
          # above that bake in files outside their component directory.
          - name: aiagent-operator
            dockerfile: operator/aiagent-operator/Dockerfile
            context: operator/aiagent-operator
            build_args: |
              GOLANG_BASE_IMAGE=docker.io/library/golang:1.26
              RUNTIME_BASE_IMAGE=gcr.io/distroless/static:nonroot
          # ADR-0420/WP-068: the in-cluster signing identity's own image -
          # published here too so it has real SBOM/scan coverage like every
          # other first-party component, even though its actual deployment
          # only ever happens via the in-cluster BuildConfig path
          # (ansible/roles/supply_chain_signer_build), same as every image
          # in this matrix.
          - name: supply-chain-signer
            dockerfile: components/supply-chain-signer/Dockerfile
            context: .
            build_args: |
              BASE_IMAGE=docker.io/library/python:3.11-slim
    steps:
      - uses: actions/checkout@v4

      - name: Compute immutable tags (ADR-0115 - never :latest)
        id: tags
        run: |
          echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.name }}:${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.release_tag != '' && format('{0}/{1}/{2}:{3}', env.REGISTRY, env.REGISTRY_NAMESPACE, matrix.name, steps.tags.outputs.release_tag) || '' }}

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json

      # Reports HIGH/CRITICAL findings but does not block publish
      # (continue-on-error) - real upstream base-image/dependency CVEs exist
      # across most components today (tracked in ADR-0115's Implementation
      # state) and gating the first real release on clearing all of them
      # was judged out of scope for this pass; see ADR-0115 for the accepted
      # findings and the follow-up remediation this defers to.
      - name: Scan for vulnerabilities (Trivy) - reports HIGH/CRITICAL, non-blocking
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ADR-0119 (WP-057): builds every MCP server discover-mcp-servers found,
  # mirroring build-publish-sign's own build/SBOM/scan steps - kept as a
  # separate job (not folded into build-publish-sign's own matrix) because
  # its entries are homogeneous (all under components/mcp-servers/<name>,
  # all BASE_IMAGE=python:3.12-slim) and computed, not hand-listed, unlike
  # every entry above.
  build-publish-sign-mcp-servers:
    needs: discover-mcp-servers
    if: needs.discover-mcp-servers.outputs.servers != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJson(needs.discover-mcp-servers.outputs.servers) }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute immutable tags (ADR-0115 - never :latest)
        id: tags
        run: |
          echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: components/mcp-servers/${{ matrix.name }}
          file: components/mcp-servers/${{ matrix.name }}/Dockerfile
          build-args: |
            BASE_IMAGE=docker.io/library/python:3.12-slim
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/mcp-${{ matrix.name }}:${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.release_tag != '' && format('{0}/{1}/mcp-{2}:{3}', env.REGISTRY, env.REGISTRY_NAMESPACE, matrix.name, steps.tags.outputs.release_tag) || '' }}

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/mcp-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-mcp-${{ matrix.name }}.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-mcp-${{ matrix.name }}
          path: sbom-mcp-${{ matrix.name }}.spdx.json

      - name: Scan for vulnerabilities (Trivy) - reports HIGH/CRITICAL, non-blocking
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/mcp-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
