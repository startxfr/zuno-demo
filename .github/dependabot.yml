# ADR-0603 M19/M20 (WP-226): the refresh routine for the SHA-pinned actions
# and the hashed Python lockfiles. Dependabot covers GitHub Actions and pip
# only (ADR-0603 "Alternatives considered"): the base images are digest-pinned
# in ansible/roles/image_mirrors and build-publish.yml, the Galaxy collections
# in ansible/requirements.yml, each with its own refresh note.
#
# pip: Dependabot reads each requirements.in and regenerates the hashed
# requirements.txt with pip-compile. It does not read
# platform/python/constraints.txt, so the pip updates are one grouped pull
# request across every directory: lint.yml's check_python_locks.py fails the
# PR if a shared library ends up at two versions, and the fix is to bump
# constraints.txt and run platform/python/compile_locks.py on the branch.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directories:
      - "/components/a2a-gateway"
      - "/components/ai-gateway"
      - "/components/mcp-gateway"
      - "/components/mcp-servers/*"
      - "/components/mlops"
      # Not here on purpose (2026-11-18): components/mlops/tooling is locked with Python 3.9, the kfp venv of the
      # RHEL 9 control host (compile_locks.py PYTHON_FOR). Dependabot refuses a 3.9 requirement ("detected-version
      # 3.9.*", job error) and one failing directory failed the whole pip group. Refresh that lock by hand with the
      # pip-tools of Python 3.9, as compile_locks.py documents.
      - "/components/trustyai-eval"
      - "/components/zuno-dify-knowledge"
      - "/components/zuno-token-proxy"
      - "/evaluations/*"
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    # Held on purpose, each with its reason (2026-11-17, PR 49): ragas 0.4 needs datasets>=4 while
    # platform/python/constraints.txt keeps datasets 2.21 / fsspec 2024.6.1 for the mlops training stack, and
    # components/trustyai-eval/ragas_eval.py uses the ragas 0.2 API. Lift these three together, in one change.
    ignore:
      - dependency-name: "ragas"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "datasets"
      - dependency-name: "fsspec"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
