# Retriever ranking evaluation set (WP-168 follow-up, UnifAI operator 0.1.44 ranking work).
#
# Natural questions as Tekos users ask them, over the live demo333 corpus (21 Red Hat web sources of
# gitops/charts/unifai/files/redhat-docs.yaml, tag knowledge.tech, plus the SXSI Confluence sources).
# Finer than questions.yaml (product level, rag-service comparison): each entry names the BOOK, or
# the Confluence page, that answers it.
#
# Fields:
#   query        the question, as typed
#   sourceType   WEB or CONFLUENCE (query.bearer `sourceType`)
#   tags         query.bearer `tags`
#   expect       URL fragments; a hit is a result whose source URL contains one of them. Match on
#                the path, not the whole URL: the index holds both /documentation/ and
#                /en/documentation/ forms, with or without a trailing slash or `index`.
#   granularity  book (one html-single book), product (a product crawled from its root, where the
#                answering page is not pinned) or page (one Confluence page)
#   expect_git   path fragments of the pages of the git sources (OpenShift 4.22, blob URLs of openshift/openshift-docs)
#                that answer it, matched against results of type GIT when the retriever also searches GIT
#                (fork/ci/rag_eval.py --merge-types WEB,GIT). Taken from the enterprise-4.22 tree, not from a live
#                result; left out where the git sources hold nothing (OpenShift AI, Argo CD, Satellite, Confluence).
#   expect_none  true: nothing in the corpus answers it; a good retriever returns no result above
#                the relevance threshold (used to calibrate it)
#
# The expected URLs come from the source definitions and earlier query.bearer probes, not from a
# full listing of the index: an `expect` that never appears in any top-k, before or after, is a
# corpus gap to report, not a ranking miss.
#
# Persona: a member of agent_tekos with knowledge.tech (consultant-01 or its eval/stress twin).
#
# Entries 25 to 34 (WP-186, `lang: fr`) are French reformulations of entries that rank 1 on the English set, with the same
# `expect`; `pair` names the English entry. They measure French-language queries, which the first 24 never did. The
# Red Hat books are English content (a French query is cross-lingual: the dense side carries it); the Confluence pages
# are French content (a French query also exercises the sparse side). Read the French subset on its own: the baseline
# of the first 24 (hit@1 0.71, hit@5 0.86, MRR 0.77) is not a figure for the whole file.

