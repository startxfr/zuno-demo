# ADR-0107 promotion quality gate configuration for the comage agent
# (roadmap WP-10, extended here per ADR-0326/WP-33). Consumed by
# evaluations/quality_gate.py, not by run_acceptance_gate.py (which keeps
# its own SCENARIO_THRESHOLD default for `make check`'s unrelated
# ADR-0053 acceptance gate - see quality_gate.py's module docstring for
# why the two are separate).
#
# scenario_threshold: the ADR-0028 pass-rate a candidate must meet or
# exceed on the ADR-0027 20-scenario suite to be promotable. Data, not
# code (ADR-0107 Decision) - change this file, not quality_gate.py, to
# adjust comage's own threshold. Same 75% default as every other agent
# until evidence suggests otherwise.
scenario_threshold: 0.75

# ADR-0526 (WP-087) decision 8: the register half of the gate. Read by
# evaluations/register_conformance.py via quality_gate.load_gate_config's
# returned dict - which already returns the WHOLE file, so adding these
# needs no change to quality_gate.py and leaves scenario_threshold above
# (the substance half) completely untouched.
#
# Both halves are mandatory. The acceptance suite is tone-blind by
# construction, so it is a clean control for "did the register shift break
# the reasoning"; these knobs only ever judge HOW an answer is written.
#
# Calibrated against the reference corpus itself (2026-08-27), not chosen
# by intuition - measured over its 908 assistant turns:
#   marker rate      86.1% test / 85.0% validation / 89.4% train
#   distinct markers 21 in the 79-response test split alone
#   response length  min 43 chars
#   opening 'wesh'   3.8% - 10.6% depending on split
#   mean density     0.071 - 0.091 markers per word
# The floor sits ~15 points under the reference (loose enough to survive a
# slightly weaker fine-tune, tight enough that a no-op merge scoring ~0%
# can never be mistaken for a good one); the ceilings sit far above normal
# usage while still catching the degenerate cases the corpus explicitly
# forbids.
register_marker_rate_threshold: 0.70
register_min_distinct_markers: 5
register_min_response_chars: 20
# Corpus rule 3: "Do not start every answer with wesh."
register_max_opening_marker_rate: 0.30
# Corpus rule 17: "Do not saturate every sentence with slang." Without a
# CEILING a naive more-markers-is-better scorer would reward exactly the
# degenerate model rules 3 and 17 forbid.
register_max_mean_density: 0.30

# WP-087 third gate half: tool-calling conformance, read by
# evaluations/tool_calling_conformance.py through the same
# load_gate_config dict the two knob sets above come from.
#
# WHY IT EXISTS. The two halves above both passed on four consecutive runs
# while the `-wesh` variant stopped calling tools entirely - it narrated
# them instead ("generate_image c'est le bail."). Neither half looks at
# tool calls, so neither could see it. The capability was never lost:
# forced with tool_choice="required" the variant still emits a correct
# call with correct arguments, so what regressed is the DECISION to call.
#
# TWO-SIDED ON PURPOSE. A retrain aimed at this defect can overshoot into
# calling a tool on every turn, which is just as broken. The base model
# already shows that failure mode: on a probe where neither offered tool
# applied it invented "salesforce.opportunity.read", a tool it was never
# given. Scoring recall alone would have called that perfect.
#
# Not calibrated against a reference corpus the way the register knobs
# were - there is no such corpus for tool use. These are engineering
# floors, set where a working model is comfortably clear and the observed
# failure is unambiguously caught (variant: 0.0 call rate, 1.0 narration).
# Revisit them once Phase 3 produces a second data point.
tool_min_call_rate: 0.90
tool_max_false_fire_rate: 0.10
# The specific pathology, kept as its own ceiling rather than folded into
# the call rate: "named the tool and then wrote a sentence" is a different
# failure from "declined", and only one of them is this regression.
tool_max_narration_rate: 0.10

# Calling a tool that was never offered. Kept separate from
# tool_max_false_fire_rate because it is a different defect with a
# different fix: a false fire is a misjudged situation, a hallucinated
# tool is an invented interface the runtime cannot dispatch at all.
# Measured 2026-08-29 on the same 27 probes:
#
#   qwen3.5-9b (base)        false-fire 8.3%  hallucination 11.1%
#   qwen3.5-9b-wesh (after)  false-fire 0.0%  hallucination 18.5%
#
# Neither meets 0.10, the base model included - this ceiling states what
# is wanted, not what the family currently delivers, and the gap is the
# finding rather than a reason to relax it.
tool_max_hallucination_rate: 0.10
# A one-sided probe set makes both rates meaningless and is the easiest
# way to end up with a scorer that always passes.
tool_min_probes_per_side: 5

# WP-114 (ADR-0534 Phase 3 / ADR-0107 fourth input): base-vs-candidate
# capability-regression check, read by quality_gate.run_peft_regression
# through the same load_gate_config dict as everything above. Comage
# carries this block because it is wesh's primary consumer (ADR-0526
# decision 7); tekos has none - its primary model IS the base. The jobs
# are the standing LMEvalJob pair gitops/charts/models/values.yaml
# maintains for exactly this comparison. Read failures fail the gate
# closed (exit 2) - a configured check that cannot run never passes.
#
# Waivers are the ONLY sanctioned way to accept a known regression:
# per-task/metric, with a mandatory reason, reported as WAIVED in every
# gate run - never by raising max_regression itself.
peft_regression:
  candidate_label: qwen35-9b-wesh
  base_job: qwen35-9b-mmlu
  candidate_job: qwen35-9b-wesh-mmlu
  namespace: zuno-ai-run
  max_regression: 0.05
  # Operator decision 2026-09-02 (WP-114): wesh's real -0.12 mmlu
  # regression is ACCEPTED as the cost of its register specialization
  # (ADR-0526 adopted the model knowing quality trade-offs existed; the
  # first live gate run quantified this one). The waiver keeps the gate
  # PASS for the adopted model while every report still shows the metric
  # as WAIVED, and any FURTHER decay (below 0.67-0.15=0.52) or any other
  # task/metric regression still fails the gate at the normal 0.05.
  waivers:
    - task: mmlu_abstract_algebra
      metric: acc,none
      max_regression: 0.15
      reason: >-
        ADR-0526 register-specialization trade-off, accepted by operator
        decision 2026-09-02 (WP-114) - wesh 0.55 vs base 0.67 on the
        standing LMEvalJob pair; revisit at the next wesh retrain
