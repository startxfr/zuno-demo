# Comage acceptance scenarios (ADR-0027: 20 scenarios per agent; ADR-0028:
# 75% pass threshold). Run with `python3 run_scenarios.py` (a thin
# AGENT=comage wrapper around evaluations/tekos/run_scenarios.py - see
# README.md for required environment variables and personas).
#
# `persona` values are anonymized synthetic usernames from
# gitops/charts/keycloak/files/realm-zuno.json (ADR-0041). `sales-user-01`/
# `-02` hold both the `sales` business role (governs tool/data permissions
# inside Comage, per agent.okf.md's own body prose) and the `agent_comage`
# entitlement group (ADR-0040) - see security_checks.py for the negative
# tests covering entitlement without business role and vice versa
# (`comage-entitlement-only-user-01`/`sales-role-only-user-01`, mirroring
# Tekos/Arkos's own ADR-0040 negative-test pattern). `type` selects which
# handler in evaluations/tekos/run_scenarios.py executes the scenario -
# each type's exact behavior is documented there, not duplicated here.

scenarios:
  - id: 1
    title: Portal loads all five agent tiles
    type: portal_lists_all_agents
    persona: sales-user-01

  - id: 2
    title: Unauthenticated request to the portal redirects to login
    type: portal_requires_login

  - id: 3
    title: Sales persona can authenticate and the token carries the expected group claims
    type: keycloak_login
    persona: sales-user-01
    expect_groups: [sales, agent_comage]

  - id: 4
    title: Comage tile is enabled for a sales-group, agent_comage-entitled user
    type: portal_tile_state
    persona: sales-user-01
    agent: comage
    expect_enabled: true

  - id: 5
    title: Comage tile is disabled for a non-entitled user (board persona)
    type: portal_tile_state
    persona: board-user-01
    agent: comage
    expect_enabled: false

  - id: 6
    title: Placeholder agent tile (Advantage) shows "coming soon" for any user
    type: portal_tile_state
    persona: sales-user-01
    agent: advantage
    expect_enabled: false
    expect_placeholder: true

  - id: 7
    title: An ordinary deal-status question returns a reply with citations
    type: chat_basic_qa
    persona: sales-user-01
    message: "What's the status of the Acme Renewal deal and does it have a client PO yet?"

  - id: 8
    title: First-token latency is under the 6-second interactive objective
    type: chat_first_token_latency
    persona: sales-user-02
    message: "Summarize the Acme Renewal opportunity."
    max_seconds: 6

  - id: 9
    title: Streaming chat emits token events followed by a done event
    type: chat_streaming_sse
    persona: sales-user-01
    message: "Summarize the Acme Renewal deal in one sentence."

  - id: 10
    title: A current-value question triggers a live Salesforce read, visible in citations
    type: chat_triggers_tool
    persona: sales-user-01
    message: "What is the CURRENT stage of the Acme Renewal opportunity right now?"
    expect_tool: salesforce.opportunity.read
    # ADR-0326/WP-33: Comage's live_read_tool is Salesforce, not
    # Confluence - see evaluations/tekos/run_scenarios.py's
    # chat_triggers_tool handler for why this field exists.
    expect_source_contains: salesforce

  - id: 11
    title: RAG retrieval contributes at least one citation for a sales topic
    type: rag_retrieval_has_citation
    query: "Acme Renewal opportunity purchase order status"

  - id: 12
    title: MCP Gateway denies a Salesforce tool call outside the caller's allowed groups
    type: mcp_gateway_denied
    persona: board-user-01
    tool: salesforce.opportunity.read
    arguments: { query: "Acme Renewal" }
    expect_status: 403

  - id: 13
    title: MCP Gateway returns 404 for an unknown tool name
    type: mcp_gateway_unknown_tool
    persona: sales-user-01
    tool: does_not_exist
    expect_status: 404

  - id: 14
    title: C3-classified requests fail closed when no SaaS provider is eligible
    type: model_router_fails_closed
    classification: C3

  - id: 15
    title: C1-classified requests try the local model first
    type: model_router_prefers_local
    classification: C1

  - id: 16
    title: BFF rejects a chat request with no bearer token
    type: bff_rejects_missing_jwt

  - id: 17
    title: BFF rejects a JWT with the wrong audience
    type: bff_rejects_wrong_audience
    persona: sales-user-01

  - id: 18
    title: MCP Gateway denies sxa.opportunity.search for check-deal-status, which doesn't declare it even though compare-historical-deals does (ADR-0036 task_rights factor narrows the agent's own declaration)
    type: mcp_gateway_denied
    persona: sales-user-01
    tool: sxa.opportunity.search
    arguments: { }
    expect_status: 403

  - id: 19
    title: Remaining placeholder agents have no live workloads in the shared zuno-ai-run namespace
    type: agent_isolation_placeholder_empty
    namespace: zuno-ai-run
    agents: [advantage, finage]

  - id: 20
    title: Every service's health endpoint returns 200
    type: health_endpoints_all_ok
    services: [frontend, bff, agent-runtime, mcp-gateway, rag-service, sales-db-mcp, salesforce-mcp]
