# Comage acceptance scenarios (ADR-0027: 20 scenarios per agent; ADR-0028:
# 75% pass threshold). Run with `python3 run_scenarios.py` (a thin
# AGENT=comage wrapper around evaluations/tekos/run_scenarios.py - see
# README.md for required environment variables and personas).
#
# `persona` values are anonymized synthetic usernames from
# gitops/charts/keycloak/files/realm-zuno.json (ADR-0041). `sale-01`/
# `-02` hold both the `sales` business role (governs tool/data permissions
# inside Comage, per agent.okf.md's own body prose) and the `agent_comage`
# entitlement group (ADR-0040) - see security_checks.py for the negative
# tests covering entitlement without business role and vice versa
# (`comage-entitlement-only-user-01`/`sales-role-only-user-01`, mirroring
# Tekos/Arkos's own ADR-0040 negative-test pattern). `type` selects which
# handler in evaluations/tekos/run_scenarios.py executes the scenario -
# each type's exact behavior is documented there, not duplicated here.

scenarios:
  - id: 1
    title: Portal loads all agent tiles
    type: portal_lists_all_agents
    persona: sale-01

  - id: 2
    title: Unauthenticated request to the portal redirects to login
    type: portal_requires_login

  - id: 3
    title: Sales persona can authenticate and the token carries the expected group claims
    type: keycloak_login
    persona: sale-01
    expect_groups: [sales, agent_comage]

  - id: 4
    title: Comage tile is enabled for a sales-group, agent_comage-entitled user
    type: portal_tile_state
    persona: sale-01
    agent: comage
    expect_enabled: true

  - id: 5
    title: Comage tile is disabled for a non-entitled user (board persona)
    type: portal_tile_state
    persona: board-01
    agent: comage
    expect_enabled: false

  - id: 6
    title: Placeholder agent tile (Advantage) shows "coming soon" for any user
    type: portal_tile_state
    persona: sale-01
    agent: advantage
    expect_enabled: false
    expect_placeholder: true

  - id: 7
    title: An ordinary deal-status question via the BFF gets a real reply with citations
    type: chat_basic_qa
    persona: sale-01
    message: "What's the status of the Acme Renewal deal and does it have a client PO yet?"

  - id: 8
    title: First-token latency is under the 6-second interactive objective
    type: chat_first_token_latency
    persona: sale-02
    message: "Summarize the Acme Renewal opportunity."
    max_seconds: 6

  - id: 9
    title: Streaming chat direct to agent-runtime delivers token and done events
    type: chat_streaming_sse
    persona: sale-01
    message: "Summarize the Acme Renewal deal in one sentence."

  - id: 10
    # Expected to fail today: check-deal-status's live_read_tool is
    # salesforce.opportunity.read, but salesforce-mcp has no deployment
    # in-cluster and its Vault-sourced credentials (salesforce/technical)
    # are still unresolved (standing operator gap, tracked separately -
    # see agents/comage/README.md's "Known live-read gap"). agent-runtime's
    # tool_call_node (components/agent-runtime/app/graph/nodes.py)
    # catches the McpClientError and degrades gracefully to indexed-only
    # context, so chat still returns 200 - it just never reaches
    # source_mode: live/both, so this assertion fails until salesforce-mcp
    # is deployed and the Vault secret is fixed. Left failing on purpose
    # rather than weakened, so the gate keeps surfacing the real gap.
    title: A current-value question direct to agent-runtime triggers the live Salesforce read
    type: chat_triggers_tool
    persona: sale-01
    message: "What is the CURRENT stage of the Acme Renewal opportunity right now?"

  - id: 11
    title: RAG retrieval contributes at least one citation for a sales topic
    type: rag_retrieval_has_citation
    query: "Acme Renewal opportunity purchase order status"

  - id: 12
    title: MCP Gateway denies a Salesforce tool call outside the caller's allowed groups
    type: mcp_gateway_denied
    persona: board-01
    tool: salesforce.opportunity.read
    arguments: { query: "Acme Renewal" }
    expect_status: 403

  - id: 13
    title: MCP Gateway returns 404 for an unknown tool name
    type: mcp_gateway_unknown_tool
    persona: sale-01
    tool: does_not_exist
    expect_status: 404

  - id: 14
    title: C3-classified requests fail closed when no SaaS provider is eligible
    type: model_router_fails_closed
    classification: C3

  - id: 15
    title: C1-classified requests try the local model first
    type: model_router_prefers_local
    classification: C1

  - id: 16
    title: BFF rejects a chat request with no bearer token
    type: bff_rejects_missing_jwt

  - id: 17
    title: BFF rejects a JWT with the wrong audience
    type: bff_rejects_wrong_audience
    persona: sale-01

  - id: 18
    title: MCP Gateway denies salesforce.opportunity.update for check-deal-status, which doesn't declare it even though update-opportunity-status does (ADR-0036 task_rights factor narrows the agent's own declaration)
    type: mcp_gateway_denied
    persona: sale-01
    tool: salesforce.opportunity.update
    arguments: { }
    expect_status: 403

  - id: 19
    title: Remaining placeholder agents have no live workloads in the shared zuno-ai-run namespace
    type: agent_isolation_placeholder_empty
    namespace: zuno-ai-run
    # ADR-0326/WP-35: advantage dropped - its frontend/BFF are now
    # genuinely deployed (gitops/apps/advantage), same reasoning as
    # comage's own removal from evaluations/arkos/scenarios.yaml's
    # scenario 19. ADR-0326/WP-36: finage now dropped too, closing the
    # four-agent generalization - no agent remains with zero live
    # workloads.
    # ADR-0349 (soursage/cognos): the vacuously-true empty list this
    # check briefly held once every prior agent shipped its own chart is
    # real again - these two placeholder agents have identity footprints
    # and portal tiles but no chart/workloads at all, exactly what this
    # isolation check was built to prove.
    agents: [soursage, cognos]

  - id: 20
    title: Every service's health endpoint returns 200
    type: health_endpoints_all_ok
    # confluence-mcp/salesforce-mcp are deliberately excluded: their
    # NetworkPolicies (ADR-0037) allow ingress only from mcp-gateway, so a
    # direct probe from this gate always times out by design, not by
    # fault - mcp-gateway's own health, still checked below, is the honest
    # proxy for "can this agent's traffic reach it".
    services: [frontend, bff, agent-runtime, mcp-gateway, rag-service]

  # ADR-0526 (WP-087) decision 8, POST-PROMOTION live half.
  #
  # These two do NOT gate the pipeline, and that distinction matters. The
  # pipeline's register check runs offline in components/mlops's evaluate
  # stage, against train-lora's held-out completions, because the merged
  # model is deployed nowhere at gate time (evaluate runs before
  # push-registry, and promotion is a later human PR). These are the live
  # confirmation once the variant is actually serving - WP-087's operator
  # follow-up step 4.
  #
  # They also deliberately do NOT carry the register half of the gate. Any
  # scenario added here lands in the ADR-0028 denominator: with 20 existing
  # scenarios, 2 added and both failing still scores 20/22 = 91% >= 75% and
  # reports PASS. That is exactly why the pipeline computes the register
  # score independently and AND-s it, rather than trusting the pass rate.
  - id: 21
    title: A register turn is answered in contemporary French urban register
    type: chat_register_conformance
    persona: sale-01
    message: "Explique-moi vite fait comment se passe le suivi d'une opportunité chez nous."
    # Rules 11-13 are asserted on every register scenario regardless of
    # this flag - slangified syntax fails whatever the question was.
    expect_register: true
    min_markers: 1
    # A live chat turn here is a full agent round-trip; the platform's own
    # BFF ceiling for it is 110s, so the handler's 30s default timed this
    # scenario out on the first run that reached it. Sits just above that
    # ceiling for the same reason as the image check in security_checks.py.
    timeout_seconds: 120

  - id: 22
    title: A technical turn keeps its terminology exact, register or not
    type: chat_register_conformance
    persona: sale-01
    message: "Donne-moi la commande kubectl pour lister les pods et le champ YAML qui fixe les replicas."
    # Inverted: asserts a CEILING, never zero. Corpus rule 18 says
    # professional and technical topics use MEDIUM familiarity - so
    # demanding a tone-free answer would contradict the trained objective.
    # What must hold is rules 11-13: the command and the YAML key stay
    # exact. The handler enforces those as a hard failure on top of this.
    expect_register: false
    max_density: 0.25
