# Tekos acceptance scenarios (ADR-0027: 20 scenarios per agent;
# ADR-0028: 75% pass threshold). Run with `python3 run_scenarios.py`
# (see README.md for required environment variables and personas).
#
# `persona` values are anonymized synthetic usernames from
# gitops/charts/keycloak/files/realm-zuno.json (ADR-0041) - all in the
# `consultant` group except where a scenario deliberately tests a
# non-consultant user. Each persona also holds the `agent_tekos` entitlement
# group (ADR-0040), a dimension orthogonal to the `consultant` business
# role; see security_checks.py for the negative tests covering entitlement
# without business role and vice versa. `type` selects which handler in
# run_scenarios.py executes the scenario - each type's exact behavior is
# documented there, not duplicated here.

scenarios:
  - id: 1
    title: Portal loads all agent tiles
    type: portal_lists_all_agents
    persona: consultant-01

  - id: 2
    title: Unauthenticated request to the portal redirects to login
    type: portal_requires_login

  - id: 3
    title: Consultant persona can authenticate and the token carries the expected group claims
    type: keycloak_login
    persona: consultant-01
    expect_groups: [consultant, agent_tekos]

  - id: 4
    title: Tekos tile is enabled for a consultant-group user
    type: portal_tile_state
    persona: consultant-01
    agent: tekos
    expect_enabled: true

  - id: 5
    title: Tekos tile is disabled for a non-consultant user (sales persona)
    type: portal_tile_state
    persona: sale-01
    agent: tekos
    expect_enabled: false

  - id: 6
    title: Placeholder agent tiles (Comage) show "coming soon" for any user
    type: portal_tile_state
    persona: sale-01
    agent: comage
    expect_enabled: false
    expect_placeholder: true

  - id: 7
    title: Basic technical Q&A returns a reply with citations, and a same-run_id follow-up turn still succeeds
    type: chat_basic_qa
    persona: consultant-01
    message: "How do I size a KServe InferenceService for a single NVIDIA L4 GPU?"
    # ADR-0215: extends this existing scenario with a second turn on the
    # same run_id rather than adding a 21st scenario - ADR-0027 fixes the
    # suite at exactly twenty scenarios per agent, so a genuinely new
    # scenario id is not available; this deterministically proves resume
    # +history-carrying succeeds live, complementing the exhaustive prompt-
    # content assertions in components/agent-runtime/tests/test_history.py
    # (which a live E2E smoke check, with no LLM judge, cannot itself make).
    follow_up: "Can you repeat that guidance in one short sentence?"

  - id: 8
    title: First-token latency is under the 6-second interactive objective
    type: chat_first_token_latency
    persona: consultant-02
    message: "What GPU does the local model run on?"
    max_seconds: 6

  - id: 9
    title: Streaming chat emits token events followed by a done event
    type: chat_streaming_sse
    persona: consultant-03
    message: "Summarize the OpenShift AI model serving approach in one sentence."

  - id: 10
    title: A question needing live data triggers the Confluence tool call
    type: chat_triggers_tool
    persona: consultant-01
    # ADR-0330's live space enumeration (2026-08-18) found startxfr.atlassian.net's
    # real content tree (space SXSI) covers Openshift/Terraform/Vault/
    # AnsibleAutomationPlatform/Gitlab/Satellite procedures only - no RHOAI,
    # no "EA2" anything, so the original message's search_confluence call
    # always came back empty (source_mode=none, not a bug - see WP-063's
    # 2026-08-21 note). Live-verified replacement: search_confluence's
    # CQL text~ query is built from the message's "significant words"
    # (mcp-servers/confluence/server.py's _cql_query_text stopword
    # stripping), so "version 4.14" matches real pages like "Procedure
    # UPGRADE 4.13 vers 4.14 cluster data-preprod" - confirmed live,
    # source_mode="both".
    message: "What does the latest internal Confluence doc say about the OpenShift upgrade procedure to version 4.14?"
    expect_tool: search_confluence

  - id: 11
    title: RAG retrieval contributes at least one citation for a technical question
    type: rag_retrieval_has_citation
    query: "OpenShift AI model serving NVIDIA L4"

  - id: 12
    title: MCP Gateway denies a tool call outside the caller's allowed groups
    type: mcp_gateway_denied
    persona: consultant-01
    tool: get_customer
    arguments: { customer_id: 1 }
    expect_status: 403

  - id: 13
    title: MCP Gateway returns 404 for an unknown tool name
    type: mcp_gateway_unknown_tool
    persona: consultant-01
    tool: does_not_exist
    expect_status: 404

  - id: 14
    title: C3-classified requests fail closed when no SaaS provider is eligible
    type: model_router_fails_closed
    classification: C3

  - id: 15
    title: C1-classified requests try the local model first
    type: model_router_prefers_local
    classification: C1

  - id: 16
    title: BFF rejects a chat request with no bearer token
    type: bff_rejects_missing_jwt

  - id: 17
    title: BFF rejects a JWT with the wrong audience
    type: bff_rejects_wrong_audience
    persona: consultant-01

  - id: 18
    title: MCP Gateway denies a tool no v0 agent declares (ADR-0036 agent_declaration factor)
    type: mcp_gateway_denied
    persona: board-01
    tool: get_customer
    arguments: { customer_id: 1 }
    expect_status: 403

  - id: 19
    title: Placeholder agents have no live workloads in the shared zuno-ai-run namespace
    type: agent_isolation_placeholder_empty
    namespace: zuno-ai-run
    # ADR-0326/WP-31/WP-33/WP-35: arkos, comage and advantage dropped from
    # this list - their frontend/BFF are now genuinely deployed
    # (gitops/apps/{arkos,comage,advantage}), so none is a zero-pod
    # placeholder any more even though each OKF `status` stays
    # `placeholder` until its own operator gate confirms it. See
    # evaluations/{arkos,comage,advantage}/scenarios.yaml's own scenario
    # 19 for the isolation check scoped to the agent that remained
    # genuinely placeholder at that point. ADR-0326/WP-36: finage now
    # dropped too, closing the four-agent generalization - no agent
    # remains with zero live workloads, so this list is empty (a
    # vacuously-true pass, not a removed check).
    # ADR-0349 (soursage/cognos): the vacuously-true empty list this
    # check briefly held once every prior agent shipped its own chart is
    # real again - these two placeholder agents have identity footprints
    # and portal tiles but no chart/workloads at all, exactly what this
    # isolation check was built to prove.
    agents: [soursage, cognos]

  - id: 20
    title: Every service's health endpoint returns 200
    type: health_endpoints_all_ok
    # sales-db-mcp is deliberately excluded: its NetworkPolicy (ADR-0037)
    # allows ingress only from mcp-gateway, so a direct probe from this
    # gate always times out by design, not by fault - mcp-gateway's own
    # health, still checked below, is the honest proxy for "can this
    # agent's traffic reach it".
    services: [frontend, bff, agent-runtime, mcp-gateway, rag-service]
