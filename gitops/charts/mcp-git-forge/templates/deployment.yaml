apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-forge-mcp
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: git-forge-mcp
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
    {{- if not .Values.image.digest }}
    {{- /* A digest-pinned image must not be rewritten by the :latest trigger. */}}
    image.openshift.io/triggers: |-
      {{ include "mcp-git-forge.imageTrigger" (dict "repository" .Values.image.repository "tag" .Values.image.tag "container" "git-forge-mcp") }}
    {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: git-forge-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git-forge-mcp
      {{- with include "mcp-git-forge.digestAnnotations" .Values }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: git-forge-mcp
      priorityClassName: zuno-workload-default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: git-forge-mcp
          image: {{ include "mcp-git-forge.imageRef" .Values.image | quote }}
          imagePullPolicy: {{ include "mcp-git-forge.imagePullPolicy" .Values.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.github.secretName }}
                  key: token
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.gitlab.secretName }}
                  key: token
            - name: GITLAB_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.gitlab.secretName }}
                  key: url
            - name: MCP_GATEWAY_WORKLOAD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-gateway-workload-token
                  key: token
            {{- /* WP-225 lot C: rendered only when set, so the defaults roll no pod. */}}
            {{- if .Values.callAssertion.publicKey }}
            - name: MCP_CALL_ASSERTION_PUBLIC_KEY
              value: {{ .Values.callAssertion.publicKey | quote }}
            - name: MCP_CALL_ASSERTION_MAX_BODY_BYTES
              value: {{ .Values.callAssertion.maxBodyBytes | int64 | quote }}
            {{- end }}
            {{- if .Values.callAssertion.required }}
            {{- if not .Values.callAssertion.publicKey }}
            {{- fail "callAssertion.required needs callAssertion.publicKey" }}
            {{- end }}
            - name: MCP_CALL_ASSERTION_REQUIRED
              value: "true"
            {{- end }}
            # ADR-0603 M12 (WP-225 lot B): the repositories each Keycloak group may
            # reach, checked against the signed caller context. "{}" = no allowlist.
            - name: GIT_FORGE_REPOSITORY_ALLOWLIST
              value: {{ .Values.repositoryAllowlist.groups | default dict | toJson | quote }}
            - name: GIT_FORGE_REPOSITORY_ALLOWLIST_SCOPE
              value: {{ .Values.repositoryAllowlist.scope | quote }}
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
