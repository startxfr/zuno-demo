# ADR-0024/ADR-0208: two independent technical identities, one per
# provider - GitHub's at zuno/github/technical, GitLab's at
# zuno/gitlab/technical (both seeded by ansible/roles/vault/tasks/
# install.yml). Never hardcoded here. Two separate ExternalSecrets, not
# one, because the two credentials come from independent Vault paths and
# rotate independently (same reasoning as having two Vault paths at all).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.credentials.github.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  refreshInterval: {{ .Values.credentials.github.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.github.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.credentials.github.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.credentials.github.vaultPath }}
        property: token
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.credentials.gitlab.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  refreshInterval: {{ .Values.credentials.gitlab.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.gitlab.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.credentials.gitlab.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.credentials.gitlab.vaultPath }}
        property: token
    - secretKey: url
      remoteRef:
        key: {{ .Values.credentials.gitlab.vaultPath }}
        property: url
