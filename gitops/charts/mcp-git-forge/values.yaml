# Must match mcp-gateway's binding registry entry (endpoint.default:
# http://git-forge-mcp.zuno-ai-run.svc:8000) in
# platform/bindings/tools/tool-bindings.yaml.
namespace: zuno-ai-run

# Built by the "mcp" build component into zuno-ai-build's ImageStream, pulled
# cross-namespace into zuno-ai-run via the system:image-puller RoleBinding.
image:
  repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/mcp-git-forge
  # image.tag must stay "latest" until a release is cut - see RELEASING.md (two parallel image paths).
  tag: latest
  # ADR-0603 M16: written by platform/supply-chain/render_release_digests.py from the release
  # ledger, never by hand. Set, it wins over tag (repository@digest, IfNotPresent, no :latest trigger).
  digest: "sha256:2e1c8634975ad4379421663baff3302343fa363c4641a0e5e1800795fe5c1add"
  # Always, not IfNotPresent - the mutable :latest tag needs it to avoid serving a stale cached image; see RELEASING.md.
  # Used only on the :latest path: a rendered digest pulls IfNotPresent (ADR-0603 M16).
  pullPolicy: Always

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# ADR-0208 service-identity: one shared technical identity per provider
# (the gateway's own ADR-0011 intersection authorizes the actual caller
# before either credential is ever used). Two ExternalSecrets - not one -
# because GitHub and GitLab credentials come from independent Vault paths
# and rotate independently. GitLab's secret also carries `url` (defaults
# to https://gitlab.com at Vault-seeding time, ansible/roles/vault/tasks/
# install.yml - overridable for a self-managed instance); GitHub has none
# (github.com only, no self-hosted GitHub Enterprise case in this demo).
credentials:
  github:
    vaultPath: github/technical
    secretName: git-forge-github-technical-credentials
    # ADR-0602/WP-223: the namespace's own SecretStore (was the cluster-wide vault-backend).
    secretStoreName: vault
    refreshInterval: 1h
  gitlab:
    vaultPath: gitlab/technical
    secretName: git-forge-gitlab-technical-credentials
    # ADR-0602/WP-223: the namespace's own SecretStore (was the cluster-wide vault-backend).
    secretStoreName: vault
    refreshInterval: 1h

# ADR-0603 M12 (WP-225 lot B): the repositories each Keycloak group may reach through
# the shared technical tokens, checked in the server against the caller context the
# mcp-gateway signs. {group: [pattern]} over "<provider>:<owner>/<repo>", fnmatch,
# case-insensitive; "*" is every repository. `*` matches across "/" (fnmatch), so
# "gitlab:team/*" also admits the subgroups of team; list repositories to be exact.
# A repository created or forked without an owner is "<provider>:@self/<name>".
# Empty: no allowlist, today's behaviour.
#   groups:
#     consultant: ["github:startxfr/zuno-*", "gitlab:zuno-team/*"]
#     ocp-paas-ops: ["*"]
# scope: "all" checks reads, listings (filtered) and writes; "write" only write_file,
# create_repository and fork_repository.
repositoryAllowlist:
  groups: {}
  scope: all

# ADR-0602 clause 10 / ADR-0603 M14 (WP-225 lot C): verify the mcp-gateway's
# per-call assertion (Authorization: Bearer <EdDSA JWT, typ zuno-call+jwt>: aud this
# server, sub the caller, act the gateway, the tool, exp <= 60 s, jti consumed once).
# publicKey: the PEM of Vault mcp/gateway-call-assertion public_key. Set, an
# assertion is verified when one is sent (a forged, expired, misaddressed,
# other-tool or replayed one is refused) and a request without one is still
# served. required: true refuses every request without a valid assertion; set it
# only after the mcp-gateway runs with outboundIdentity.mode assertion. Both off by
# default (today's behaviour).
# maxBodyBytes: the largest request body read to check a tools/call (a larger one
# is refused with 413); 16 MiB leaves room for a git.file.write of a large file.
callAssertion:
  publicKey: ""
  required: false
  maxBodyBytes: 16777216
