apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-guide
  labels:
    app.kubernetes.io/name: demo-guide
    zuno.io/managed-by: argocd
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-guide
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-guide
      annotations:
        # A new nginx.conf is a subPath mount: it does not reach a running pod, so its checksum rolls the pod.
        # The page itself is a directory mount and needs no restart.
        checksum/nginx-conf: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
    spec:
      serviceAccountName: demo-guide
      automountServiceAccountToken: false
      priorityClassName: zuno-workload-default
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          {{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.image.digest) }}
          {{- fail (printf "image.digest %q is not sha256:<64 hex>" .Values.image.digest) }}
          {{- end }}
          image: {{ printf "%s:%s@%s" .Values.image.repository .Values.image.tag .Values.image.digest | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: site
              mountPath: /usr/share/nginx/guide
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: nginx-conf
          configMap:
            name: demo-guide-nginx
        - name: site
          configMap:
            name: demo-guide-site
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
