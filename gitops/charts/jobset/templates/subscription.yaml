{{- if .Values.operator.enabled }}
# openshift-operators (AllNamespaces), not a dedicated namespace + own
# OperatorGroup - gitops/charts/connectivity-link's original shape failed
# with "OwnNamespace InstallModeType is not supported" on a real cluster
# (ADR-0317); this repeats the now-confirmed-safe
# gitops/charts/external-secrets pattern instead, not the risky one.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .Values.subscriptionName }}
  namespace: openshift-operators
  labels:
    zuno.io/managed-by: argocd
    operators.coreos.com/{{ .Values.subscriptionName }}.openshift-operators: ""
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  channel: {{ required "subscriptionChannel must be set via gitops_app_extra_helm_values (ADR-0048)" .Values.subscriptionChannel | quote }}
  name: {{ .Values.subscriptionName }}
  source: {{ required "subscriptionCatalogSource must be set via gitops_app_extra_helm_values (ADR-0048)" .Values.subscriptionCatalogSource | quote }}
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
{{- end }}
