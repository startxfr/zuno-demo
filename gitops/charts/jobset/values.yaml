# project.enabled renders the dedicated Namespace, via the vendored startx
# `project` chart; operator.enabled renders the OperatorGroup/Subscription,
# via the vendored startx `operator` chart. Both default false so templates
# render nothing. There is no singleton operand CR for JobSet (individual
# distributed training runs - e.g. Kubeflow Trainer's TrainJob - create
# their own JobSet objects later, out of scope here) - same shape as
# gitops/charts/external-secrets; zuno-jobset-d1
# (gitops/apps/jobset/application-d1.yaml) points at gitops/charts/noop
# instead.
#
# Confirmed against a live cluster (redhat-operators catalog): the
# package is named "job-set" (not "jobset-operator" as originally
# guessed in ADR-0318), channel "stable-v1.0".
#
# Dedicated namespace (openshift-jobset-operator) with its own
# OwnNamespace-scoped OperatorGroup. CONFIRMED against a live cluster's
# PackageManifest (`oc get packagemanifest job-set -n
# openshift-marketplace -o jsonpath='{.status.channels[?(@.name=="stable-v1.0")].currentCSVDesc.installModes}'`):
# job-set's CSV only supports OwnNamespace/SingleNamespace, NOT
# AllNamespaces. Subscribing it via the shared openshift-operators
# namespace's implicit AllNamespaces global-operators OperatorGroup put
# its CSV into Failed phase with reason UnsupportedOperatorGroup, message
# "AllNamespaces InstallModeType not supported, cannot configure to watch
# all namespaces" - this is what showed as "Job Set Operator" Failed in
# Installed Operators. Moving to a dedicated namespace with an
# OwnNamespace OperatorGroup (operator.operatorGroup.target set to the
# namespace itself, not "all-ns") fixes that - same shape
# gitops/charts/custom-metrics-autoscaler already uses for KEDA. (A prior
# version of this fix moved JobSet to a dedicated namespace but kept
# AllNamespaces mode, assuming the failure was gitops/charts/kueue's
# separately-documented webhook Service selector collision; that
# assumption was wrong - the CSV's own install-mode message above is the
# actual, confirmed cause.)
#
# subscription.operator.channel/source.name are left empty by default,
# discovered by ansible and set via gitops_app_extra_helm_values on the -d0
# apply (ADR-0048). templates/checks.yaml fails the render if either is
# still empty once operator.enabled is true.
project:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: jobset
    app: jobset
  project:
    enabled: true
    hooked: true  # PreSync ArgoCD hook
    type: namespace
    name: openshift-jobset-operator
    display_name: Zuno Infra JobSet
    description: "JobSet operator, configured by Zuno."
    requester: zuno

operator:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: jobset
    app: jobset
  subscription:
    enabled: true
    name: job-set
    namespace: openshift-jobset-operator
    operator:
      # Must be set explicitly, same name as subscription.name: the
      # vendored `operator` chart's own values.yaml gives this a
      # non-empty default ("codeready-workspaces") that wins the merge
      # and silently suppresses the fallback to subscription.name.
      name: job-set
      channel: ""
      installPlanApproval: Automatic  # startx chart defaults to Manual
      source:
        name: ""
        namespace: openshift-marketplace
  operatorGroup:
    enabled: true
    name: jobset-operator-group
    namespace: openshift-jobset-operator
    # OwnNamespace-scoped (targetNamespaces: [openshift-jobset-operator]),
    # confirmed against a live cluster's PackageManifest - job-set's CSV
    # doesn't support AllNamespaces (see comment above). NOT "all-ns"
    # (that's gitops/charts/kueue's shape - a different operator whose CSV
    # requires the opposite: AllNamespaces only).
    target: openshift-jobset-operator
