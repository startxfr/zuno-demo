# project.enabled renders the dedicated Namespace, via the vendored startx
# `project` chart; operator.enabled renders the OperatorGroup/Subscription,
# via the vendored startx `operator` chart. Both default false so templates
# render nothing. There is no singleton operand CR for JobSet (individual
# distributed training runs - e.g. Kubeflow Trainer's TrainJob - create
# their own JobSet objects later, out of scope here) - same shape as
# gitops/charts/external-secrets; zuno-jobset-d1
# (gitops/apps/jobset/application-d1.yaml) points at gitops/charts/noop
# instead.
#
# Confirmed against a live cluster (redhat-operators catalog): the
# package is named "job-set" (not "jobset-operator" as originally
# guessed in ADR-0318), channel "stable-v1.0".
#
# Dedicated namespace (openshift-jobset-operator) with its own
# AllNamespaces-mode OperatorGroup, not the original shared
# openshift-operators shape: sharing that namespace with kuadrant/
# external-secrets/limitador/lws is exactly what caused
# gitops/charts/kueue's webhook Service selector
# (`control-plane: controller-manager`, the generic kubebuilder
# convention label) to collide with those other operators' pods there,
# so its Endpoints round-robinned admission calls across unrelated pods
# and intermittently returned "connection refused" - see
# gitops/charts/kueue/values.yaml's history. JobSet's own webhook/
# resource naming was never checked against that same collision risk
# before this fix landed; isolating it removes the risk structurally
# instead of relying on it not mattering in practice.
#
# subscription.operator.channel/source.name are left empty by default,
# discovered by ansible and set via gitops_app_extra_helm_values on the -d0
# apply (ADR-0048). templates/checks.yaml fails the render if either is
# still empty once operator.enabled is true.
project:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: jobset
    app: jobset
  project:
    enabled: true
    hooked: true  # PreSync ArgoCD hook
    type: namespace
    name: openshift-jobset-operator
    display_name: Zuno Infra JobSet
    description: "JobSet operator, configured by Zuno."
    requester: zuno

operator:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: jobset
    app: jobset
  subscription:
    enabled: true
    name: job-set
    namespace: openshift-jobset-operator
    operator:
      # Must be set explicitly, same name as subscription.name: the
      # vendored `operator` chart's own values.yaml gives this a
      # non-empty default ("codeready-workspaces") that wins the merge
      # and silently suppresses the fallback to subscription.name.
      name: job-set
      channel: ""
      installPlanApproval: Automatic  # startx chart defaults to Manual
      source:
        name: ""
        namespace: openshift-marketplace
  operatorGroup:
    enabled: true
    name: jobset-operator-group
    namespace: openshift-jobset-operator
    # "all-ns" (-> spec: {}, empty targetNamespaces = AllNamespaces mode):
    # job-set was previously subscribed via OLM's own pre-existing
    # global-operators OperatorGroup in openshift-operators (also
    # AllNamespaces), so this preserves the same install mode while
    # moving out of the shared namespace - see gitops/charts/kueue/
    # values.yaml's operatorGroup.target for the identical shape.
    target: "all-ns"
