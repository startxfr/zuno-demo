apiVersion: v2
name: jobset
description: >-
  JobSet operator (OLM Subscription, channel/catalog discovered at
  Ansible run time - ADR-0048) and a minimal JobSetOperator operand CR
  (the operator's own management-state singleton, not a JobSet
  workload - see values.yaml). ADR-0318 prerequisite for OpenShift AI's
  Kubeflow Trainer v2 (trainer/trainingoperator DataScienceCluster
  components), which schedules distributed training runs on the JobSet
  API; no JobSet workload is created here. Dedicated namespace
  (openshift-jobset-operator) with its own OwnNamespace-scoped
  OperatorGroup - see values.yaml for why (the CSV doesn't support
  AllNamespaces, confirmed against a live cluster).
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: operator
    version: "21.3.277"
    repository: "alias:startx"
  - name: project
    version: "21.3.277"
    repository: "alias:startx"
