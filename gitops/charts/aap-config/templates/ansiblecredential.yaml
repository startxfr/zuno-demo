{{- if .Values.aapConfig.enabled }}
# Least-privilege machine credential (ADR-0354 Security considerations):
# the aap-day0-check ServiceAccount's bearer token, consumed through
# AnsibleCredential's native kubernetes_api/kubernetes_bearer_token_secret
# fields (confirmed live via `oc explain ansiblecredential.spec`, WP-073).
# The referenced Secret is the kubernetes.io/service-account-token Secret
# templates/serviceaccount.yaml creates - its `token` key is what the
# resource operator reads.
apiVersion: tower.ansible.com/v1alpha1
kind: AnsibleCredential
metadata:
  name: {{ .Values.credential.name }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  connection_secret: {{ .Values.connectionSecret.name }}
  name: {{ .Values.credential.name }}
  organization: {{ .Values.organization }}
  type: {{ .Values.credential.type }}
  kubernetes_api: {{ .Values.credential.kubernetesApi }}
  kubernetes_bearer_token_secret: {{ .Values.serviceAccount.name }}-token
  description: >-
    cluster-reader ServiceAccount token for read-mostly cluster checks
    (WP-073) - never an admin kubeconfig.
{{- end }}
