{{- if .Values.aapConfig.enabled }}
# One least-privilege ServiceAccount + ClusterRoleBinding + token Secret
# per credential tier in .Values.credentials (ADR-0418/WP-094) -
# deliberately NOT the bootstrap cluster-admin kubeconfig. `clusterRole`
# names either a built-in ClusterRole (cluster-reader) or the
# repo-defined zuno-aap-installer (templates/clusterrole-installer.yaml).
{{- range .Values.credentials }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .serviceAccount }}
  namespace: {{ $.Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zuno-{{ .serviceAccount }}-{{ .clusterRole }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .clusterRole }}
subjects:
  - kind: ServiceAccount
    name: {{ .serviceAccount }}
    namespace: {{ $.Values.namespace }}
---
# Long-lived token Secret for the ServiceAccount (the auto-token era is
# gone - a kubernetes.io/service-account-token Secret is the supported way
# to get a durable bearer token). AnsibleCredential's
# kubernetes_bearer_token_secret consumes the `token` key this type
# populates.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .serviceAccount }}-token
  namespace: {{ $.Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    kubernetes.io/service-account.name: {{ .serviceAccount }}
    argocd.argoproj.io/sync-wave: "-20"
type: kubernetes.io/service-account-token
{{- end }}
{{- end }}
