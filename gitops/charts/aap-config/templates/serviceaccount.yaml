{{- if .Values.aapConfig.enabled }}
# Least-privilege identity the zuno-day0-check Job Template authenticates
# to the cluster with (via AnsibleCredential's kubernetes_bearer_token_secret,
# see templates/ansiblecredential.yaml). Deliberately NOT the bootstrap
# cluster-admin kubeconfig - day0_check is read-mostly by construction
# (ADR-0354 Security considerations, narrowed per WP-073).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
---
# cluster-reader covers the k8s_info lookups day0_check's prechecks do
# (Applications, operator CRs, Deployments, ...). If a future precheck
# needs more (e.g. reading a Secret), add a targeted extra Role here -
# never a broader built-in.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zuno-aap-day0-check-cluster-reader
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Values.namespace }}
---
# Long-lived token Secret for the ServiceAccount (the auto-token era is
# gone - a kubernetes.io/service-account-token Secret is the supported way
# to get a durable bearer token). AnsibleCredential's
# kubernetes_bearer_token_secret consumes the `token` key this type
# populates.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.serviceAccount.name }}-token
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    kubernetes.io/service-account.name: {{ .Values.serviceAccount.name }}
    argocd.argoproj.io/sync-wave: "-20"
type: kubernetes.io/service-account-token
{{- end }}
