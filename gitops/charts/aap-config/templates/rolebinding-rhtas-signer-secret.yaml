{{- if .Values.aapConfig.enabled }}
# Targeted widening beyond cluster-reader (ADR-0354 Security
# considerations, "widen with a targeted extra Role, never a broader
# built-in" - same rationale and shape as rolebinding-openshift-ai-secrets.yaml
# and rolebinding-vault-secrets.yaml next door). ADR-0517 live finding
# (demo333, 2026-09-08): cluster-reader excludes Secrets, so
# rhtas_config's new precheck.yml (existence only - never .data) 403'd
# under aap-day0-check the first time `make d1 check rhtas-config` ran
# for real. Scoped identically to the openshift-ai Role: `get` on that
# one named Secret in zuno-ai-build, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zuno-aap-day0-check-rhtas-signer-secret-reader
  namespace: zuno-ai-build
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zuno-signer-client-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zuno-aap-day0-check-rhtas-signer-secret-reader
  namespace: zuno-ai-build
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zuno-aap-day0-check-rhtas-signer-secret-reader
subjects:
  # The cluster-reader tier's ServiceAccount specifically (ADR-0418/WP-094
  # split .Values.serviceAccount into a list, .Values.credentials - this
  # Role stays scoped to the read-only tier alone, never extended to
  # zuno-aap-installer).
  {{- range .Values.credentials }}
  {{- if eq .name "zuno-cluster-reader" }}
  - kind: ServiceAccount
    name: {{ .serviceAccount }}
    namespace: {{ $.Values.namespace }}
  {{- end }}
  {{- end }}
{{- end }}
