{{- if .Values.aapConfig.enabled }}
# Targeted widening beyond cluster-reader (ADR-0354 Security
# considerations, "widen with a targeted extra Role, never a broader
# built-in" - ansible/roles/aap_config/README.md), same pattern as
# rolebinding-vault-secrets.yaml. Confirmed live 2026-08-30 (WP-099,
# `zuno-day1-check-workflow` job id 151): cluster-reader excludes
# Secrets entirely (a deliberate OpenShift built-in boundary), and
# connectivity_link's precheck.yml is the only Day 1 component whose
# precheck reads a Secret (authorino-server-cert in kuadrant-system, to
# confirm the tls.crt/tls.key keys exist - WP-071's regression check).
# Scoped to kuadrant-system alone, not a cluster-wide Secret grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zuno-aap-day0-check-connectivity-link-secrets-reader
  namespace: kuadrant-system
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zuno-aap-day0-check-connectivity-link-secrets-reader
  namespace: kuadrant-system
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zuno-aap-day0-check-connectivity-link-secrets-reader
subjects:
  # The cluster-reader tier's ServiceAccount specifically (ADR-0418/WP-094
  # split .Values.serviceAccount into a list, .Values.credentials - this
  # Role stays scoped to the read-only tier alone, never extended to
  # zuno-aap-installer).
  {{- range .Values.credentials }}
  {{- if eq .name "zuno-cluster-reader" }}
  - kind: ServiceAccount
    name: {{ .serviceAccount }}
    namespace: {{ $.Values.namespace }}
  {{- end }}
  {{- end }}
{{- end }}
