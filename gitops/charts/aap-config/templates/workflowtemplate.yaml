{{- if .Values.aapConfig.enabled }}
# One WorkflowTemplate per entry in .Values.workflowTemplates
# (ADR-0418 clause 6/WP-095). Every node launches the same underlying
# Job Template (`.jobTemplate`, already registered by templates/
# jobtemplate.yaml) with a per-node `target_component` - confirmed live
# 2026-08-30 that `tower.ansible.com/v1alpha1` ships a WorkflowTemplate
# CRD (Path A, same as JobTemplate/AnsibleProject/AnsibleCredential), but
# its `workflow_nodes` field carries NO CRD-documented schema
# (`x-kubernetes-preserve-unknown-fields: true` - `oc explain
# workflowtemplates.tower.ansible.com.spec` lists no suboptions for it).
# The shape rendered below is the underlying resource operator's own
# `awx.awx.workflow_job_template` Ansible module's documented
# `workflow_nodes` argument spec (identifier/unified_job_template/
# extra_data/related.{success_nodes,failure_nodes,always_nodes}/
# all_parents_must_converge) - confirmed live 2026-08-30 (WP-098) to
# reconcile successfully against this cluster's resource-operator version
# once the `organization` omission below was fixed.
# Sync-wave 0: after every JobTemplate (-5) - a workflow's nodes resolve
# `unified_job_template.name` against an already-existing Controller
# Job Template.
#
# `unified_job_template.organization` deliberately omitted - confirmed
# live 2026-08-30 (WP-098's own investigation) that `job_template.
# organization` is null for EVERY Job Template on this Controller
# (JobTemplate has no organization field of its own - CRD or API - it is
# only ever a read-through of its Project's organization, and the
# `zuno-demo` Project's own organization landed null on its first-ever
# reconcile and can never be changed afterward once Job Templates
# reference it: `PATCH .../projects/7/ {"organization": ...}` is
# rejected outright with "Organization cannot be changed when in use by
# job templates."). The underlying `ansible.controller.workflow_job_template`
# module only adds an `organization` filter to its `unified_job_templates`
# lookup when the node explicitly supplies one (module source,
# `/opt/ansible/roles/workflowtemplate/tasks/main.yml` ->
# `ansible.controller.workflow_job_template`'s `_disambiguate` step) - so
# every node in every one of the 7 Workflow Templates failed identically
# with `Unable to Find unified_job_template: {'type': 'job_template',
# 'organization': 69}` (0 results, since no job_template ever matches a
# non-null organization). Matching purely on name+type is exactly as
# unambiguous here: every Job Template name in this repo is already
# globally unique.
{{- range .Values.workflowTemplates }}
---
apiVersion: tower.ansible.com/v1alpha1
kind: WorkflowTemplate
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  connection_secret: {{ $.Values.connectionSecret.name }}
  name: {{ .name }}
  organization: {{ $.Values.organization }}
  inventory: {{ $.Values.inventory.name }}
  ask_variables_on_launch: false
  workflow_nodes:
    {{- $jobTemplate := .jobTemplate }}
    {{- range .nodes }}
    - identifier: {{ .id }}
      unified_job_template:
        name: {{ $jobTemplate }}
        type: job_template
      extra_data:
        target_component: {{ .id }}
      {{- if .allParentsMustConverge }}
      all_parents_must_converge: true
      {{- end }}
      {{- if .successNodes }}
      related:
        success_nodes:
          {{- range .successNodes }}
          - identifier: {{ . }}
          {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
