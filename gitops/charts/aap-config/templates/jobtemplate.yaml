{{- if .Values.aapConfig.enabled }}
# The single Job Template ADR-0354 clause 4 scopes this component to:
# zuno-day0-check, running ansible/playbooks/day0_check.yml (read-mostly
# by construction - the same property ADR-0418 uses to phase its rollout).
# Field names confirmed live via the CRD's openAPIV3Schema (WP-073): the
# JobTemplate CRD has NO credentials or extra_vars field - the
# zuno-cluster-reader credential is attached via the Controller API by
# ansible/roles/aap_config/tasks/install.yml after this CR reconciles.
# Sync-wave -5: after project/inventory/credential (-10) - the resource
# operator retries anyway, this just avoids a first-pass failure loop.
apiVersion: tower.ansible.com/v1alpha1
kind: JobTemplate
metadata:
  name: {{ .Values.jobTemplate.name }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  connection_secret: {{ .Values.connectionSecret.name }}
  name: {{ .Values.jobTemplate.name }}
  project: {{ .Values.project.name }}
  playbook: {{ .Values.jobTemplate.playbook }}
  inventory: {{ .Values.inventory.name }}
  ask_inventory_on_launch: false
  ask_variables_on_launch: false
{{- end }}
