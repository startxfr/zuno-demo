{{- if .Values.aapConfig.enabled }}
# The Controller API access token every tower.ansible.com CR's
# connection_secret references. Minted once (shown-once) by
# ansible/roles/aap_config/tasks/install.yml and persisted to Vault
# zuno/aap/controller-token BEFORE this Application is applied - if this
# ExternalSecret sits in SecretSyncedError, that role step didn't run.
# The template adds the in-cluster Controller root URL as `host` (the
# resource operator's expected key pair is token+host).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.connectionSecret.name }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.connectionSecret.name }}
    creationPolicy: Owner
    template:
      data:
        host: {{ .Values.connectionSecret.host | quote }}
        token: "{{ `{{ .token }}` }}"
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.connectionSecret.vaultPath }}
        property: token
{{- end }}
