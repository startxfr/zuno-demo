{{- if .Values.aapConfig.enabled }}
# Targeted widening beyond cluster-reader (ADR-0354 Security
# considerations, "widen with a targeted extra Role, never a broader
# built-in" - same rationale and shape as rolebinding-vault-secrets.yaml
# next door). ADR-0517 live finding (demo333, 2026-09-07): cluster-reader
# excludes Secrets, so the openshift_ai diagnose path's ADR-0343
# prerequisite lookup (Secret/maas-db-config, existence only - never
# .data) 403'd under aap-day0-check and aborted the whole read-only
# diagnosis. Scoped tighter than the vault Role: `get` on that one named
# Secret in redhat-ods-applications, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zuno-aap-day0-check-openshift-ai-secrets-reader
  namespace: redhat-ods-applications
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["maas-db-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zuno-aap-day0-check-openshift-ai-secrets-reader
  namespace: redhat-ods-applications
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zuno-aap-day0-check-openshift-ai-secrets-reader
subjects:
  # The cluster-reader tier's ServiceAccount specifically (ADR-0418/WP-094
  # split .Values.serviceAccount into a list, .Values.credentials - this
  # Role stays scoped to the read-only tier alone, never extended to
  # zuno-aap-installer).
  {{- range .Values.credentials }}
  {{- if eq .name "zuno-cluster-reader" }}
  - kind: ServiceAccount
    name: {{ .serviceAccount }}
    namespace: {{ $.Values.namespace }}
  {{- end }}
  {{- end }}
{{- end }}
