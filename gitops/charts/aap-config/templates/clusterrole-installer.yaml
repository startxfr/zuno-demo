{{- if .Values.aapConfig.enabled }}
# zuno-aap-installer (ADR-0418/WP-094): the machine credential for
# install/build/reconcile Job Templates (Day 1/Day 2) and backup/restore/
# sign (Day 3) - genuinely mutating verbs, unlike zuno-cluster-reader's
# check-only scope. Resource-type-scoped to exactly what this repo's own
# roles apply (ArgoCD Applications, OLM Subscriptions/OperatorGroups, the
# CRDs each Day 1/Day 2 operator owns, and the core/apps/batch/networking
# objects ExternalSecrets/charts create), confirmed against this cluster's
# live `oc api-resources` output (2026-08-30) rather than assumed.
# Deliberately excluded, matching ADR-0418's Security considerations
# ("no comparable launch-gate exists... must be modeled... never a new,
# separately-privileged identity" read narrowly - this is still far below
# the bootstrap kubeconfig's cluster-admin):
#   - cluster-scoped RBAC objects (ClusterRole/ClusterRoleBinding) - no
#     privilege-escalation path from this credential to a broader one.
#   - Node/MachineSet/Machine and other Day 0 `machines`-role territory.
#   - aap.ansible.com/tower.ansible.com/automation{controller,hub}.ansible.com/
#     eda.ansible.com themselves - aap/aap-config are Day 0 bootstrap
#     components with their own kubeconfig-based install path (ADR-0421),
#     not something a Day 1/2 Job Template should ever reconfigure.
# This is a coarse, resource-type-level least-privilege boundary, not a
# per-namespace one (a ClusterRole/ClusterRoleBinding pair is inherently
# cluster-wide) - tightening to per-namespace Roles is a possible future
# refinement once live testing (WP-094 acceptance) shows it is worth the
# added maintenance, not assumed necessary here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zuno-aap-installer
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-26"
rules:
  # GitOps Applications - every component's install/check/reconcile goes
  # through ansible/tasks/apply_gitops_app.yml.
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "appprojects"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # OLM discovery/subscription (ADR-0048 PackageManifest-driven channel
  # discovery, then apply the Subscription/OperatorGroup).
  - apiGroups: ["packages.operators.coreos.com"]
    resources: ["packagemanifests"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["operators.coreos.com"]
    resources: ["subscriptions", "operatorgroups", "installplans", "clusterserviceversions", "operatorconditions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Vault-backed secret delivery every component's install.yml relies on.
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "clustersecretstores", "secretstores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Core/workload objects components' charts and install.yml roles create
  # or wait on directly (StatefulSet rollout-restarts, Job-based schema
  # steps, precheck k8s_info lookups, etc.).
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "serviceaccounts", "pods", "pods/log", "services", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # WP-102: namespaces, needed by ansible/tasks/apply_openshift_build.yml's
  # "ensure the zuno-ai-build namespace" task (shared by every Day 1/Day 2
  # build role) - a genuine gap, not a deliberate exclusion (this ClusterRole
  # documents its deliberate exclusions above and namespaces isn't one of
  # them). Confirmed live 2026-08-30: zuno-day1-build (aap-execution-
  # environment) is the first component build ever launched via AAP with
  # this credential, and kubernetes.core.k8s always GETs an object first
  # for its own idempotency check regardless of whether it already exists,
  # so every other build role would fail identically once launched through
  # AAP instead of the bootstrap kubeconfig. No delete: a build credential
  # deleting a namespace is a blast radius this role's own least-privilege
  # posture (see the file header) has no reason to grant.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # WP-102: imagestreams/layers get, in BOTH the core and image.openshift.io
  # apiGroups. apply_openshift_build.yml's image-pull RoleBinding grants
  # system:image-puller (which itself carries this exact permission) to
  # each consuming namespace - Kubernetes' privilege-escalation check
  # refuses to let this credential CREATE a RoleBinding granting a
  # permission it doesn't already hold, confirmed live 2026-08-30 the
  # first time this credential ever had to create a NEW instance of that
  # RoleBinding (zuno-ai-build-image-puller-zuno-aap) rather than re-verify
  # one that already existed from an earlier bootstrap-kubeconfig run. Read
  # only (get, not list/watch/write) - this credential only needs to BIND
  # the permission onward via RoleBinding, never to read image layers
  # itself.
  - apiGroups: ["", "image.openshift.io"]
    resources: ["imagestreams/layers"]
    verbs: ["get"]
  # WP-102: the ImageStream/BuildConfig/Build objects apply_openshift_build.yml
  # itself creates/waits on, plus imagestreamtags (read, resolved by
  # run_image_signing_job.yml to get the just-built image's digest before
  # signing it). Confirmed live 2026-08-30: this ClusterRole had NO
  # image.openshift.io/build.openshift.io rule at all before this - every
  # component build to date had only ever run through the bootstrap
  # kubeconfig (cluster-admin), never through AAP with this credential,
  # so this whole apiGroup pair was simply never exercised until WP-102's
  # aap-execution-environment build. buildconfigs/instantiate (create) is
  # the subresource `oc start-build` needs - kubernetes.core.k8s has no
  # support for it (see apply_openshift_build.yml's own comment on why
  # that step is a command exception), so it isn't covered by the
  # buildconfigs rule's own verbs. No delete anywhere here, same least-
  # privilege posture as the rest of this file - builds/log omitted too:
  # nothing in this repo's Ansible reads it, only a human-facing `oc logs`
  # hint in a failure message.
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreamtags"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["build.openshift.io"]
    resources: ["buildconfigs"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["build.openshift.io"]
    resources: ["buildconfigs/instantiate"]
    verbs: ["create"]
  - apiGroups: ["build.openshift.io"]
    resources: ["builds"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Day 1: service-mesh (Istio), mesh-monitoring/kiali/grafana, postgresql/
  # mariadb/tempo (Day 0 now for postgresql, but the same credential
  # backs day3 backup/restore against it), connectivity-link (Kuadrant/
  # Authorino/Limitador), lws, jobset, kueue, openshift-ai (RHOAI/KServe/
  # Kubeflow), custom-metrics-autoscaler (KEDA), lightspeed, nvidia-gpu.
  - apiGroups:
      - sailoperator.io
      - networking.istio.io
      - security.istio.io
      - telemetry.istio.io
      - extensions.istio.io
      - monitoring.coreos.com
      - k8s.mariadb.com
      - kuadrant.io
      - extensions.kuadrant.io
      - limitador.kuadrant.io
      - authorino.kuadrant.io
      - operator.authorino.kuadrant.io
      - operator.openshift.io
      - jobset.x-k8s.io
      - kueue.x-k8s.io
      - kueue.openshift.io
      - keda.sh
      - eventing.keda.sh
      - http.keda.sh
      - nvidia.com
      - resource.nvidia.com
      - lightspeed.ansible.com
      - datasciencecluster.opendatahub.io
      - dscinitialization.opendatahub.io
      - components.platform.opendatahub.io
      - services.platform.opendatahub.io
      - infrastructure.opendatahub.io
      - maas.opendatahub.io
      - serving.kserve.io
      - trainer.kubeflow.org
      - modelregistry.opendatahub.io
      - dashboard.opendatahub.io
      - opendatahub.io
      - datasciencepipelinesapplications.opendatahub.io
      - trustyai.opendatahub.io
      - mlflow.opendatahub.io
      - config.opendatahub.io
      - nim.opendatahub.io
      - features.opendatahub.io
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Day 2: content-ingestion agent CRDs.
  - apiGroups: ["zuno.zuno.ai"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # ansible/tasks/resolve_cluster_base_domain.yml reads the cluster-scoped
  # Ingress.config.openshift.io/cluster singleton to discover the apps
  # wildcard domain - every zuno-aap-installer-credentialed template that
  # reaches apply_gitops_app.yml hits this. Previously deferred as an
  # "unrelated RBAC gap" in WP-100 for zuno-day2-install; also breaks
  # zuno-day3-stresstest (job 559/563) the same way. Read-only.
  - apiGroups: ["config.openshift.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
{{- end }}
