{{- if .Values.aapConfig.enabled }}
# Targeted widening beyond cluster-reader (ADR-0354 Security
# considerations, "widen with a targeted extra Role, never a broader
# built-in" - ansible/roles/aap_config/README.md). Confirmed live
# 2026-08-25: cluster-reader excludes Secrets entirely (a deliberate
# OpenShift built-in boundary), and vault's precheck.yml is the ONLY
# day0_check.yml component whose precheck looks up a Secret
# (vault-bootstrap-credentials, existence/metadata only - never .data,
# confirmed by reading that file). Scoped to zuno-vault alone, not a
# cluster-wide Secret grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zuno-aap-day0-check-vault-secrets-reader
  namespace: zuno-vault
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zuno-aap-day0-check-vault-secrets-reader
  namespace: zuno-vault
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zuno-aap-day0-check-vault-secrets-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Values.namespace }}
{{- end }}
