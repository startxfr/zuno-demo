{{- if .Values.aapConfig.enabled }}
# `make d2 check kagent` reads the RemoteMCPServer and Agent custom resources in zuno-kagent
# (ansible/roles/kagent/tasks/precheck.yml). cluster-reader does not cover them: the kagent CRDs carry no
# aggregate-to-cluster-reader label, so the read-only tier got a 403 (checked on demo333, 2026-11-14,
# job 1423). Same targeted widening as the other rolebinding-*.yaml files: get/list/watch on exactly these
# kinds, in the one namespace, for the read-only tier only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zuno-aap-day0-check-kagent-crs-reader
  namespace: zuno-kagent
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
rules:
  - apiGroups: ["kagent.dev"]
    resources: ["agents", "remotemcpservers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zuno-aap-day0-check-kagent-crs-reader
  namespace: zuno-kagent
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zuno-aap-day0-check-kagent-crs-reader
subjects:
  {{- range .Values.credentials }}
  {{- if eq .name "zuno-cluster-reader" }}
  - kind: ServiceAccount
    name: {{ .serviceAccount }}
    namespace: {{ $.Values.namespace }}
  {{- end }}
  {{- end }}
{{- end }}
