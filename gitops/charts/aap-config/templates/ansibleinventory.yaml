{{- if .Values.aapConfig.enabled }}
# Inventory the zuno-day0-check Job Template runs against. The CRD has no
# host-management field (confirmed live, WP-073) - the localhost host
# (ansible_connection=local, so the playbook's kubernetes.core modules
# talk straight to the API server with the injected credential) is added
# by ansible/roles/aap_config/tasks/install.yml via the Controller API.
apiVersion: tower.ansible.com/v1alpha1
kind: AnsibleInventory
metadata:
  name: {{ .Values.inventory.name }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  connection_secret: {{ .Values.connectionSecret.name }}
  name: {{ .Values.inventory.name }}
  organization: {{ .Values.organization }}
  description: >-
    localhost-only inventory for cluster-facing playbooks (WP-073).
  # zuno_repo_root normally comes from ansible/inventories/demo/
  # group_vars/all/auto.yml, loaded automatically for LOCAL execution
  # (`ansible-playbook -i ansible/inventories/demo/hosts.yml ...`) because
  # that's the inventory file's own directory. A Job Template running
  # INSIDE AAP uses this Controller-side inventory instead - a completely
  # separate object with no group_vars directory of its own - so every
  # playbook's zuno_repo_root-relative task include failed
  # with "'zuno_repo_root' is undefined" (confirmed live 2026-08-30,
  # WP-099, `zuno-day1-check` job id 116). Set here once instead of
  # touching the 176 references across 21 playbooks.
  #
  # A first attempt tried mirroring the local group_vars' own Jinja
  # expression (playbook_dir-relative) as the variable's value, but
  # the resource-operator's own `inventory` role templates `spec.
  # variables` THROUGH Ansible at CR-reconcile time (using the
  # operator's OWN internal playbook_dir), storing an already-resolved,
  # wrong path (`/tmp/ansible-operator/runner/.../AnsibleInventory/
  # zuno-aap/zuno/project/../..`) rather than the literal Jinja string
  # for each Job Template run to evaluate later - confirmed live via
  # `GET .../inventories/?name=zuno`. Fixed instead with a plain,
  # non-templated absolute path: every AAP Job Template execution
  # environment checks out its Project at the same fixed `/runner/
  # project` (confirmed live via `GET .../jobs/116/`'s own `job_cwd`),
  # so no Jinja is needed at all here.
  variables:
    zuno_repo_root: /runner/project
{{- end }}
