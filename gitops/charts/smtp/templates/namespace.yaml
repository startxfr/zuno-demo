{{- if .Values.namespace.enabled }}
# Disabled by default: zuno-ai-run is owned by gitops/charts/namespaces.
# Kept as an opt-in template in case this chart is ever run standalone.
apiVersion: v1
kind: Namespace
metadata:
  name: zuno-ai-run
  labels:
    zuno.io/managed-by: argocd
    openshift.io/cluster-monitoring: "true"
  annotations:
    argocd.argoproj.io/hook: PreSync
    openshift.io/description: "Agent Runtime, AI Gateway and MCP Gateway - shared runtime hosting every active agent."
    openshift.io/display-name: "Zuno AI Runtime"
    openshift.io/requester: zuno
{{- end }}
