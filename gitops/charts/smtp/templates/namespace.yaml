{{- if .Values.namespace.enabled }}
# Not enabled by gitops/apps/smtp/application-d0.yaml (namespace.enabled:
# false there) - zuno-ai-run is owned solely by gitops/charts/namespaces
# (the platform scaffolding chart, applied earlier in day0_components),
# not duplicated here anymore, so a resource has exactly one owning
# Application. Kept as an opt-in template (not deleted) in case a future
# caller ever needs this chart runnable standalone, without depending on
# that role having run first - if enabled, this renders as an ArgoCD
# PreSync hook, same as every other chart-declared Namespace in this repo.
apiVersion: v1
kind: Namespace
metadata:
  name: zuno-ai-run
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/hook: PreSync
    openshift.io/description: "Agent Runtime, AI Gateway and MCP Gateway - shared runtime hosting every active agent."
    openshift.io/display-name: "Zuno AI Runtime"
    openshift.io/requester: zuno
{{- end }}
