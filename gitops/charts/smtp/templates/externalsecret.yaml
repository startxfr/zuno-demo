{{- if .Values.credentials.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: smtp-technical-credentials
  namespace: zuno-ai-run
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  refreshInterval: 1h
  # ADR-0602/WP-223: this namespace's own SecretStore, which reads only the keys platform/vault/secret-access.yaml grants it.
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: smtp-technical-credentials
    creationPolicy: Owner
  data:
    - secretKey: host
      remoteRef:
        key: smtp/technical
        property: host
    - secretKey: port
      remoteRef:
        key: smtp/technical
        property: port
    - secretKey: username
      remoteRef:
        key: smtp/technical
        property: username
    - secretKey: password
      remoteRef:
        key: smtp/technical
        property: password
{{- end }}
