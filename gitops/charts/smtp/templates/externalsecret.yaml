{{- if .Values.credentials.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: smtp-technical-credentials
  namespace: zuno-ai-run
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: smtp-technical-credentials
    creationPolicy: Owner
  data:
    - secretKey: host
      remoteRef:
        key: smtp/technical
        property: host
    - secretKey: username
      remoteRef:
        key: smtp/technical
        property: username
    - secretKey: password
      remoteRef:
        key: smtp/technical
        property: password
{{- end }}
