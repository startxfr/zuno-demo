{{- /*
zuno-stresstest: the confidential client of the day-3 stresstest Jobs, the
only client the ai-gateway trusts to select a quota class. Its secret is
generated into Vault by the vault role (keycloak/zuno-stresstest) and set on
the client by job-eval-personas.yaml (no Keycloak vault SPI file, so adding
it never restarts Keycloak); ansible/roles/day3 copies it to the Jobs.
*/ -}}
{{- if .Values.keycloak.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zuno-stresstest-client-secret
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: zuno-stresstest-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: keycloak/zuno-stresstest
        property: client_secret
{{- end }}
