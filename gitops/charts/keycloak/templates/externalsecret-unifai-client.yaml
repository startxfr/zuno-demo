{{- if .Values.keycloak.enabled }}
# ADR-0562 (WP-151): the UnifAI identity service is a confidential OIDC
# client of realm zuno. Same shape as openshift: Vault-generated secret,
# read by Keycloak through KC_VAULT (keycloak.yaml), and by the UnifaiStack
# through its own ExternalSecret in the UnifAI namespace (gitops/charts/unifai).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: unifai-client-secret
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: unifai-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: keycloak/unifai
        property: client_secret
{{- end }}
