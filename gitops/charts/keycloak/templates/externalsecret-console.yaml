{{- if .Values.keycloak.enabled }}
# ADR-0595: the named master-realm administrator humans sign in to the console with.
# Seeded by the vault role (zuno/keycloak/console); the client-reconcile Job
# creates the master-realm user from it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.consoleSecretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.consoleSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: keycloak/console
        property: username
    - secretKey: password
      remoteRef:
        key: keycloak/console
        property: password
{{- end }}
