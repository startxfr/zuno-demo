{{- if .Values.keycloak.enabled }}
# Resolves the Keycloak bootstrap admin credentials auto-generated by the
# vault role; consumed by the Keycloak CR's spec.bootstrapAdmin.user.secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.adminSecretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.adminSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: keycloak/admin
        property: username
    - secretKey: password
      remoteRef:
        key: keycloak/admin
        property: password
{{- end }}
