{{- if .Values.keycloak.enabled }}
# ExternalSecret resolving the Keycloak bootstrap admin credentials that the
# vault role auto-generates at zuno/keycloak/admin (see
# ansible/roles/vault/tasks/install.yml). Consumed by the Keycloak CR's
# spec.bootstrapAdmin.user.secret (templates/keycloak.yaml). ADR-0024: no
# secret is ever hardcoded here.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.adminSecretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.adminSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: keycloak/admin
        property: username
    - secretKey: password
      remoteRef:
        key: keycloak/admin
        property: password
{{- end }}
