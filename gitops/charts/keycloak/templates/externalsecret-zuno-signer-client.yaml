{{- if .Values.keycloak.enabled }}
# ADR-0535/WP-110: zuno-signer is RHTAS Fulcio's OIDC signing identity - a
# client-credentials client whose service-account token WP-110's smoke test
# and WP-111's supply-chain-signer exchange for short-lived Fulcio signing
# certificates. Same single-secret shape as zuno-admin-api above; the value
# is vault-generated by ansible/roles/vault and reaches Keycloak through
# the KC_VAULT projected volume in templates/keycloak.yaml.
#
# The signing Job reads the SAME Vault path through its own ExternalSecret
# in zuno-ai-build (WP-111). Both sides must resolve to one value, so
# neither may regenerate it independently.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zuno-signer-client-secret
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: zuno-signer-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: keycloak/zuno-signer-client
        property: client_secret
{{- end }}
