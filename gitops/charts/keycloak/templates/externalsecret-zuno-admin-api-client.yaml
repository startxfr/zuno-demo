{{- if .Values.keycloak.enabled }}
# ADR-0530/WP-091: zuno-admin-api is the realm's first client-credentials
# client - agent-bff's Keycloak Admin API trust boundary, backing
# GET /api/colleagues and GET /api/groups (ADR-0213, extended by ADR-0527).
# Same single-secret shape as the aap/openshift clients above; the value is
# vault-generated by ansible/roles/vault and reaches Keycloak through the
# KC_VAULT projected volume in templates/keycloak.yaml.
#
# agent-bff reads the SAME Vault path through its own ExternalSecret, as
# KEYCLOAK_ADMIN_CLIENT_SECRET. Both sides must resolve to one value, so
# neither may regenerate it independently.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zuno-admin-api-client-secret
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: zuno-admin-api-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: keycloak/zuno-admin-api-client
        property: client_secret
{{- end }}
