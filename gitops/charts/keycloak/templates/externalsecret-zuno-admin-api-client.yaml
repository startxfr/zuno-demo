{{- if .Values.keycloak.enabled }}
# ADR-0530/WP-091: zuno-admin-api is the realm's first client-credentials
# client. It was the BFF's Keycloak Admin API trust boundary (ADR-0213,
# ADR-0527) until WP-156 retired the BFF; it stays as MaaS's
# externalOIDC.clientId and the audience of every realm client's
# maas-gateway-audience mapper. Same single-secret shape as the
# aap/openshift clients above; the value is vault-generated by
# ansible/roles/vault and reaches Keycloak through the KC_VAULT projected
# volume in templates/keycloak.yaml - never regenerate it independently.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zuno-admin-api-client-secret
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: zuno-admin-api-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: keycloak/zuno-admin-api-client
        property: client_secret
{{- end }}
