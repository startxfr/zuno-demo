{{- if .Values.operator.enabled }}
# ADR-0312: RHBK's Subscription lives in this chart, alongside the
# Keycloak CR it makes available - same operator-in-chart pattern as
# gitops/charts/{openshift-ai,nfd,nvidia-gpu,external-secrets,postgresql}.
# Rendered by the zuno-keycloak-d0 Application (operator.enabled); the
# Keycloak CR/RealmImport/ExternalSecrets render on the separate
# zuno-keycloak-d1 Application (keycloak.enabled), applied afterwards by
# ansible/roles/keycloak/tasks/install.yml. No dedicated operator
# Namespace here: RHBK only supports OwnNamespace/SingleNamespace install
# modes, so it installs directly into {{ .Values.namespace }} (zuno-auth -
# already owned by gitops/charts/namespaces), alongside the Keycloak CR
# itself - see this chart's templates/operatorgroup.yaml and README.md.
#
# subscriptionChannel/subscriptionCatalogSource are runtime-discovered by
# ansible/roles/keycloak/tasks/install.yml (RHBK's channels are
# version-qualified, no bare "stable" alias - see that role's README.md)
# and injected via gitops_app_extra_helm_values (ADR-0048). The package
# name itself is fixed ("rhbk-operator", confirmed real on a live
# cluster), unlike gitops/charts/postgresql's dynamic package name.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhbk-operator
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
spec:
  channel: {{ required "subscriptionChannel must be set via gitops_app_extra_helm_values (ADR-0048)" .Values.subscriptionChannel | quote }}
  name: rhbk-operator
  source: {{ required "subscriptionCatalogSource must be set via gitops_app_extra_helm_values (ADR-0048)" .Values.subscriptionCatalogSource | quote }}
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
{{- end }}
