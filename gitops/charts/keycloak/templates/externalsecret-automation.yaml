{{- if .Values.keycloak.enabled }}
# ADR-0595: the master-realm account every Job and role signs in with (replaces the bootstrap admin).
# Seeded by the vault role (zuno/keycloak/automation); the client-reconcile Job
# creates the master-realm user from it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.automationSecretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  # ADR-0602/WP-223: this namespace's own SecretStore, which reads only the keys platform/vault/secret-access.yaml grants it.
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: {{ .Values.automationSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: keycloak/automation
        property: username
    - secretKey: password
      remoteRef:
        key: keycloak/automation
        property: password
{{- end }}
