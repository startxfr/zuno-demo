{{- if .Values.keycloak.enabled }}
# ADR-0410/ADR-0307 (WP-41): naveo-frontend is a confidential OIDC client
# (server-side auth-code exchange), same shape as every other agent's own
# frontend - see that client's realm-zuno.json entry and
# externalsecret-tekos-frontend.yaml for why. The client secret is
# vault-generated and injected via KC_VAULT (templates/keycloak.yaml).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: naveo-frontend-client-secret
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: naveo-frontend-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: keycloak/naveo-frontend
        property: client_secret
{{- end }}
