{{- if .Values.keycloak.enabled }}
# ADR-0530/WP-091: the client definitions job-client-reconcile.yaml applies.
#
# Rendered from the SAME files/realm-zuno.json the realm import uses, so there
# is one source of truth and no second list to keep in step. Helm does the
# splitting here - one file per client, one role list per service account - so
# the Job needs no JSON tooling at all. That matters: the Keycloak image has
# neither jq nor python (verified 2026-08-28), and it is the only image with
# kcadm.sh in it.
#
# The `replace` below is NOT optional. realmimport.yaml performs the same
# substitution before parsing, and skipping it here would have the reconcile
# Job write the literal string "apps.mycluster.example.com" into the redirect
# URIs of every live client - silently breaking every agent login on the first
# run.
{{- $realmRaw := .Files.Get "files/realm-zuno.json" | replace "apps.mycluster.example.com" .Values.clusterBaseDomain }}
{{- $realm := $realmRaw | fromJson }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: zuno-keycloak-clients
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-16"
data:
  # ADR-0602 clause 3 / ADR-0603 M5, M6 / WP-223: the realm settings the Job
  # merges into the live realm (`kcadm update realms/zuno -f ... -m`). The
  # brute-force keys are picked from files/realm-zuno.json itself, so a fresh
  # import and a reconciled realm can never disagree; the hardened-only keys
  # come from values (hardenedRealmSettings) and never enter the import file,
  # which keeps a demo realm's first import demo-shaped.
{{- $settings := pick $realm "bruteForceProtected" "permanentLockout" "failureFactor" "waitIncrementSeconds" "maxFailureWaitSeconds" "quickLoginCheckMilliSeconds" "minimumQuickLoginWaitSeconds" "maxDeltaTimeSeconds" }}
{{- if ne (len $settings) 8 }}
{{- fail "files/realm-zuno.json lost one of the eight brute-force keys realm-settings.json needs (ADR-0603 M5)" }}
{{- end }}
{{- if eq .Values.securityProfile "hardened" }}
{{- $settings = merge (deepCopy .Values.hardenedRealmSettings) $settings }}
{{- end }}
  realm-settings.json: |
{{ $settings | toPrettyJson | indent 4 }}
{{- range $c := $realm.clients }}
  client-{{ $c.clientId }}.json: |
{{ $c | toPrettyJson | indent 4 }}
{{- end }}
{{- with .Values.agentGroups }}
  # ADR-0581/WP-164: one group name per line, consumed by the Job's read loop
  # (flat text for the same no-jq reason).
  agent-groups.txt: |
{{- range $g := . }}
    {{ $g }}
{{- end }}
{{- end }}
{{- range $u := $realm.users }}
{{- if $u.serviceAccountClientId }}
  # One "<role-container-client> <role-name>" per line, consumed by the Job's
  # read loop. Flat text rather than JSON for exactly the no-jq reason above.
  svcroles-{{ $u.serviceAccountClientId }}.txt: |
{{- range $container, $roles := $u.clientRoles }}
{{- range $r := $roles }}
    {{ $container }} {{ $r }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
