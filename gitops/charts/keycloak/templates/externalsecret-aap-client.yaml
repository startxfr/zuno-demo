{{- if .Values.keycloak.enabled }}
# ADR-0354/WP-072: aap is a confidential OIDC client (server-side, not a
# browser SPA) backing AAP Gateway's OIDC authenticator - same single-secret
# shape as openshift above. The client secret is
# vault-generated and injected via KC_VAULT.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aap-client-secret
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  # ADR-0602/WP-223: this namespace's own SecretStore, which reads only the keys platform/vault/secret-access.yaml grants it.
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: aap-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: keycloak/aap-client
        property: client_secret
{{- end }}
