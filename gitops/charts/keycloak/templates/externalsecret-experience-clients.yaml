{{- if .Values.keycloak.enabled }}
{{- range .Values.experienceClients }}
---
# ADR-0562 (UnifAI), ADR-0588 (Open WebUI), ADR-0589/0590 (OpenClaw assistants), declared once in
# .Values.experienceClients (WP-190 phase 4): the confidential client {{ .name }} of realm zuno. Vault-generated secret,
# read by Keycloak through KC_VAULT (keycloak.yaml) and by the experience through its own ExternalSecret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .name }}-client-secret
  namespace: {{ $.Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .name }}-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: keycloak/{{ .name }}
        property: client_secret
{{- end }}
{{- end }}
