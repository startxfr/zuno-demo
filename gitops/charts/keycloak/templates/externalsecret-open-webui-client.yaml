{{- if .Values.keycloak.enabled }}
# ADR-0588 (WP-181): Open WebUI is a confidential OIDC
# client of realm zuno. Same shape as unifai: Vault-generated secret,
# read by Keycloak through KC_VAULT (keycloak.yaml), and by Open WebUI
# through its own ExternalSecret in zuno-openwebui (gitops/charts/open-webui).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: open-webui-client-secret
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: open-webui-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: keycloak/open-webui
        property: client_secret
{{- end }}
