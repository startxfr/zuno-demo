{{- if .Values.keycloak.enabled }}
# ADR-0326 (WP-35): advantage-frontend is now a confidential OIDC client
# (server-side auth-code exchange), same shape as tekos/arkos/
# comage-frontend - see those clients' own realm-zuno.json entries and
# externalsecret-tekos-frontend.yaml for why. The client secret is
# vault-generated and injected via KC_VAULT (templates/keycloak.yaml).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: advantage-frontend-client-secret
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: advantage-frontend-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: keycloak/advantage-frontend
        property: client_secret
{{- end }}
