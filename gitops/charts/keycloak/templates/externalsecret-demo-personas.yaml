{{- if .Values.keycloak.enabled }}
# ADR-0041: no demo-persona password is ever hardcoded in Git. All 13
# fixture users in files/realm-zuno.json share one password templated as
# `${vault.demo_personas_password}`, self-generated by the vault role
# (ansible/roles/vault/tasks/install.yml, zuno/keycloak/demo-personas)
# the same way keycloak/admin and the tekos-frontend client secret are, and
# injected into the realm via the same KC_VAULT env-SPI mechanism (see
# templates/keycloak.yaml and templates/externalsecret-tekos-frontend.yaml).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: demo-personas-password
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: demo-personas-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: keycloak/demo-personas
        property: password
{{- end }}
