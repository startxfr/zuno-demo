{{- if .Values.keycloak.enabled }}
# All 27 fixture users in files/realm-zuno.json share one vault-seeded
# INITIAL password (ADR-0349 §3: live per-user passwords diverge in
# Keycloak's own database after any change; Vault only holds the init
# default), injected into the realm via the KC_VAULT env-SPI mechanism.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: demo-personas-password
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: demo-personas-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: keycloak/demo-personas
        property: password
{{- end }}
