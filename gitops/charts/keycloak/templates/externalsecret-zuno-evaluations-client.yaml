{{- if .Values.keycloak.enabled }}
# WP-156: zuno-evaluations is the confidential client the evaluation harness,
# the stresstest and the Day 3 probes use to obtain demo-persona tokens with
# the password grant, replacing the per-agent <agent>-frontend clients
# retired with the agent frontends. The value is vault-generated by
# ansible/roles/vault and reaches Keycloak through the KC_VAULT projected
# volume in templates/keycloak.yaml; the Jobs read this Secret's copy.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zuno-evaluations-client-secret
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: zuno-evaluations-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: keycloak/zuno-evaluations
        property: client_secret
{{- end }}
