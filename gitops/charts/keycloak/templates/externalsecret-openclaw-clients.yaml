{{- if .Values.keycloak.enabled }}
{{- range list "consultant-02" "sale-01" }}
---
# ADR-0589/0590 (WP-183): the confidential client openclaw-<persona> of realm
# zuno, one per OpenClaw assistant. Same shape as unifai: Vault-generated
# secret, read by Keycloak through KC_VAULT (keycloak.yaml), and by the
# assistant through its own ExternalSecret (gitops/charts/openclaw).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openclaw-{{ . }}-client-secret
  namespace: {{ $.Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openclaw-{{ . }}-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: keycloak/openclaw-{{ . }}
        property: client_secret
{{- end }}
{{- end }}
