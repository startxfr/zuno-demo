{{- if and .Values.keycloak.enabled .Values.googleOAuth.enabled }}
# Resolves Google OAuth client credentials for the realm's "google" IdP.
# The vault role only seeds an empty placeholder; an operator must populate
# the real client_id/client_secret before Google federation works.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.googleOAuthSecretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.googleOAuthSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: google-oauth/client
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: google-oauth/client
        property: client_secret
{{- end }}
