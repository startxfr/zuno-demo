{{- if .Values.keycloak.enabled }}
# ExternalSecret resolving the Google OAuth client credentials for the
# realm's "google" IdP broker (ADR-0014). The vault role only seeds an empty
# placeholder at zuno/google-oauth/client - an operator must run
# `vault kv put zuno/google-oauth/client client_id=... client_secret=...`
# before Google federation actually works (see
# ansible/roles/vault/tasks/install.yml's "operator action required" note
# and ansible/roles/keycloak/README.md). Until then this ExternalSecret has
# nothing to sync for these two keys; the Keycloak CR references them with
# `optional: true` (templates/keycloak.yaml) so the Keycloak instance still
# comes up - only Google login stays disabled/broken until populated.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.googleOAuthSecretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.googleOAuthSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: google-oauth/client
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: google-oauth/client
        property: client_secret
{{- end }}
