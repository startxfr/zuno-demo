{{- if .Values.keycloak.enabled }}
# Demo-grade: single instance, HTTP behind an edge-terminated Route rather
# than a dedicated serving certificate. spec.db is intentionally omitted -
# Keycloak falls back to its bundled dev database (not durable across pod
# loss); wiring the shared PostgreSQL instance is a follow-up.
# Google OAuth / demo-persona secrets are injected via Keycloak's "vault" SPI:
# `${vault.<key>}` placeholders in the realm JSON resolve at runtime from files
# under KC_VAULT_DIR. Must be KC_VAULT=file, not env - the env provider doesn't
# exist on the installed RHBK version and crash-loops the server.
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: {{ .Values.keycloakCRName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  instances: 1
  hostname:
    hostname: "keycloak.{{ .Values.clusterBaseDomain }}"
  http:
    httpEnabled: true
  ingress:
    enabled: true
  bootstrapAdmin:
    user:
      secret: {{ .Values.adminSecretName }}
  unsupported:
    podTemplate:
      spec:
        # No readOnlyRootFilesystem: Keycloak/the JVM write caches and logs
        # under its own filesystem at runtime, and the exact writable paths
        # aren't verified.
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumes:
          - name: vault-secrets
            projected:
              sources:
                - secret:
                    name: {{ .Values.googleOAuthSecretName }}
                    optional: true
                    items:
                      - key: client_id
                        path: zuno_google_client_id
                      - key: client_secret
                        path: zuno_google_client_secret
                - secret:
                    name: tekos-frontend-client-secret
                    optional: true
                    items:
                      - key: client_secret
                        path: zuno_tekos_frontend_client_secret
                - secret:
                    name: demo-personas-password
                    optional: true
                    items:
                      - key: password
                        path: zuno_demo_personas_password
        containers:
          - name: keycloak
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            env:
              - name: KC_VAULT
                value: file
              - name: KC_VAULT_DIR
                value: /opt/keycloak/vault
            volumeMounts:
              - name: vault-secrets
                mountPath: /opt/keycloak/vault
                readOnly: true
{{- end }}
