{{- if .Values.keycloak.enabled }}
# Demo-grade: single instance, HTTP behind an edge-terminated Route. The
# Route/Ingress is no longer operator-managed (ingress.enabled here tracks
# .Values.ingress.operatorManaged, default false) - it's hand-authored in
# templates/ingress.yaml so it can carry the cert-manager.io/cluster-issuer
# annotation and get a vault-issuer-signed serving certificate instead of
# OpenShift's default wildcard cert (ADR-0316). spec.db points at a
# dedicated database/role on the shared PostgreSQL cluster (ADR-0315) - see
# README.md's "Database" section.
# Google OAuth / demo-persona secrets are injected via Keycloak's "vault" SPI:
# `${vault.<key>}` placeholders in the realm JSON resolve at runtime from files
# under KC_VAULT_DIR. Must be KC_VAULT=file, not env - the env provider doesn't
# exist on the installed RHBK version and crash-loops the server.
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: {{ .Values.keycloakCRName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  instances: 1
  {{- if .Values.topologySpreadConstraints.enabled }}
  # ADR-0101 (roadmap WP-12): real field, confirmed via
  # `oc explain keycloak.spec.scheduling.topologySpreadConstraints`
  # against the live test cluster. Soft constraint (ScheduleAnyway) - a
  # no-op at instances: 1, takes effect once instances is raised.
  scheduling:
    topologySpreadConstraints:
      - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
        topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
        whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
        labelSelector:
          matchLabels:
            app.kubernetes.io/managed-by: keycloak-operator
            app.kubernetes.io/instance: {{ .Values.keycloakCRName }}
  {{- end }}
  hostname:
    hostname: "keycloak.{{ .Values.clusterBaseDomain }}"
    # Pins hostname validation to this one Route rather than relying on the
    # operator's (unstated) default - see README.md's "What's unverified"
    # section for the KC_PROXY_HEADERS caveat this pairs with.
    strict: true
  http:
    httpEnabled: true
  ingress:
    enabled: {{ .Values.ingress.operatorManaged }}
  bootstrapAdmin:
    user:
      secret: {{ .Values.adminSecretName }}
  # Dedicated keycloak/keycloak database (ADR-0315), not the shared
  # zunoapp/zuno app-data database - keeps Keycloak's own schema/lifecycle
  # isolated. Credential resolved into postgresqlSecretName by
  # templates/externalsecret-postgresql.yaml (not verified against a real
  # cluster - see README.md's "What's unverified" section, including
  # whether transaction-mode PgBouncer pooling is safe for Keycloak's
  # prepared-statement-heavy JDBC traffic).
  db:
    vendor: postgres
    host: {{ .Values.postgresqlHost }}
    port: {{ .Values.postgresqlPort }}
    database: {{ .Values.postgresqlDatabase }}
    usernameSecret:
      name: {{ .Values.postgresqlSecretName }}
      key: username
    passwordSecret:
      name: {{ .Values.postgresqlSecretName }}
      key: password
  unsupported:
    podTemplate:
      spec:
        priorityClassName: zuno-platform-critical
        # No readOnlyRootFilesystem: Keycloak/the JVM write caches and logs
        # under its own filesystem at runtime, and the exact writable paths
        # aren't verified.
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumes:
          # File names follow Keycloak's file vault provider convention
          # <realm>_<key> with underscores INSIDE the realm/key escaped as
          # "__": resolving ${vault.openshift_client_secret} in realm zuno,
          # Keycloak looks for zuno_openshift__client__secret
          # (FilesPlainTextVaultProvider warning in the server log
          # otherwise). Single-underscore names silently fail every
          # runtime lookup.
          - name: vault-secrets
            projected:
              sources:
                - secret:
                    name: {{ .Values.googleOAuthSecretName }}
                    optional: true
                    items:
                      - key: client_id
                        path: zuno_google__client__id
                      - key: client_secret
                        path: zuno_google__client__secret
                - secret:
                    name: tekos-frontend-client-secret
                    optional: true
                    items:
                      - key: client_secret
                        path: zuno_tekos__frontend__client__secret
                - secret:
                    # ADR-0326 (WP-31): arkos-frontend flipped to a
                    # confidential client, same shape as tekos-frontend
                    # above.
                    name: arkos-frontend-client-secret
                    optional: true
                    items:
                      - key: client_secret
                        path: zuno_arkos__frontend__client__secret
                - secret:
                    # ADR-0326 (WP-33): comage-frontend flipped to a
                    # confidential client, same shape as tekos/arkos-frontend
                    # above.
                    name: comage-frontend-client-secret
                    optional: true
                    items:
                      - key: client_secret
                        path: zuno_comage__frontend__client__secret
                - secret:
                    # ADR-0326 (WP-35): advantage-frontend flipped to a
                    # confidential client, same shape as tekos/arkos/
                    # comage-frontend above.
                    name: advantage-frontend-client-secret
                    optional: true
                    items:
                      - key: client_secret
                        path: zuno_advantage__frontend__client__secret
                - secret:
                    # ADR-0326 (WP-36): finage-frontend flipped to a
                    # confidential client, same shape as every other
                    # agent's own frontend above.
                    name: finage-frontend-client-secret
                    optional: true
                    items:
                      - key: client_secret
                        path: zuno_finage__frontend__client__secret
                - secret:
                    # ADR-0410/ADR-0307 (WP-41): naveo-frontend, the sixth
                    # demo agent (scaffolded from platform/templates/agent/)
                    # - same confidential-client shape as every other
                    # agent's own frontend above.
                    name: naveo-frontend-client-secret
                    optional: true
                    items:
                      - key: client_secret
                        path: zuno_naveo__frontend__client__secret
                - secret:
                    name: demo-personas-password
                    optional: true
                    items:
                      - key: password
                        path: zuno_demo__personas__password
                - secret:
                    # ADR-0320
                    name: openshift-client-secret
                    optional: true
                    items:
                      - key: client_secret
                        path: zuno_openshift__client__secret
                - secret:
                    # ADR-0354/WP-072: AAP Gateway's OIDC client, same
                    # confidential-client shape as openshift/tekos-frontend
                    # above.
                    name: aap-client-secret
                    optional: true
                    items:
                      - key: client_secret
                        path: zuno_aap__client__secret
        containers:
          - name: keycloak
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            env:
              - name: KC_VAULT
                value: file
              - name: KC_VAULT_DIR
                value: /opt/keycloak/vault
              # TLS terminates at the edge Route; the pod itself only ever
              # sees plain HTTP. Without this, Keycloak computes its own
              # origin as http://, while the browser's real origin is
              # https:// - a scheme mismatch that breaks the admin
              # console's 3rd-party-cookie-check iframe postMessage
              # handshake ("Timeout when waiting for 3rd party check
              # iframe message"). KC_PROXY_HEADERS is the Keycloak >=24
              # option name; see README.md's "What's unverified" section
              # for the KC_PROXY=edge fallback on older channels.
              - name: KC_PROXY_HEADERS
                value: xforwarded
            volumeMounts:
              - name: vault-secrets
                mountPath: /opt/keycloak/vault
                readOnly: true
{{- end }}
