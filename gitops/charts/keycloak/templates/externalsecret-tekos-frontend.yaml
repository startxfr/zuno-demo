{{- if .Values.keycloak.enabled }}
# tekos-frontend is a confidential OIDC client (server-side auth-code
# exchange, not a browser SPA), unlike the other four agent clients which
# stay public. The client secret is vault-generated and injected via KC_VAULT.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tekos-frontend-client-secret
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: tekos-frontend-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: keycloak/tekos-frontend
        property: client_secret
{{- end }}
