{{- if .Values.keycloak.enabled }}
# tekos-frontend is a confidential OIDC client (components/agent-frontend
# does a server-side authorization-code exchange, not a browser SPA with
# PKCE - see components/agent-frontend/internal/oidc/oidc.go), unlike the
# other four agent clients which stay public since nothing logs in through
# them in v0. The client secret is self-generated by the vault role
# (ansible/roles/vault/tasks/install.yml, zuno/keycloak/tekos-frontend)
# the same way keycloak/admin and postgresql/app are, and injected into the
# realm via the same KC_VAULT env-SPI mechanism as the Google IdP secret
# (see templates/keycloak.yaml).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tekos-frontend-client-secret
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: tekos-frontend-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: keycloak/tekos-frontend
        property: client_secret
{{- end }}
