{{- if .Values.keycloak.enabled }}
# ADR-0320: the "openshift" confidential OIDC client backing the cluster
# OAuth identity provider. Same shape as externalsecret-tekos-frontend.yaml.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openshift-client-secret
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openshift-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: keycloak/openshift-client
        property: client_secret
{{- end }}
