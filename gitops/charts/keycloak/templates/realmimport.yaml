{{- if .Values.keycloak.enabled }}
# Imports the `zuno` realm from files/realm-zuno.json, embedded inline since
# the CRD's spec.realm field has no ConfigMap/file reference option.
#
# apps.mycluster.example.com is a plain string placeholder substituted with
# .Values.clusterBaseDomain before parsing.
{{- $realmRaw := .Files.Get "files/realm-zuno.json" | replace "apps.mycluster.example.com" .Values.clusterBaseDomain }}
{{- $realm := $realmRaw | fromJson }}
{{- /* Disables the "google" IdP instead of removing it, so re-enabling is a one-value change. */}}
{{- if not .Values.googleOAuth.enabled }}
{{- range $idp := $realm.identityProviders }}
{{- if eq $idp.alias "google" }}
{{- $_ := set $idp "enabled" false }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: zuno-realm
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    # Must sync after the Keycloak CR (templates/keycloak.yaml).
    argocd.argoproj.io/sync-wave: "-10"
spec:
  keycloakCRName: {{ .Values.keycloakCRName }}
  # user credentials[].value is hashed at import time and never consults the
  # runtime vault SPI - a ${vault.*} credential value imports as the
  # LITERAL password string. spec.placeholders is the operator's own
  # mechanism for import-time values: it injects the Secret as an env var
  # into the import job, and Keycloak's import substitutes ${<NAME>} from
  # the environment while parsing the JSON. The ${vault.*} references
  # elsewhere in the realm (client secrets, Google IdP) are correct as-is:
  # those fields resolve through the vault SPI at runtime, on use.
  placeholders:
    DEMO_PERSONAS_PASSWORD:
      secret:
        name: {{ .Values.demoPersonasSecretName | default "demo-personas-password" }}
        key: password
  realm:
{{ $realm | toYaml | indent 4 }}
{{- end }}
