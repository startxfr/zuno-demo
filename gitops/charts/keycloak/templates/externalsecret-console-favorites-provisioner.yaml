{{- if .Values.keycloak.enabled }}
# ADR-0320: the "console-favorites-provisioner" service-account client the
# console_favorites_provisioning CronJob authenticates as against the
# Keycloak Admin REST API. Same shape as externalsecret-tekos-frontend.yaml.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: console-favorites-provisioner-client-secret
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: console-favorites-provisioner-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: keycloak/console-favorites-provisioner
        property: client_secret
{{- end }}
