{{- if .Values.keycloak.enabled }}
# Resolves the same zuno/keycloak/postgresql-app Vault credential
# gitops/charts/postgresql/templates/externalsecret-keycloak.yaml also
# resolves (into the PGO-managed pguser Secret in zuno-data) - a second,
# independent ExternalSecret is needed here because secretKeyRef can't
# cross namespaces (that Secret is in zuno-data, Keycloak's pod is in
# zuno-auth), same "own ExternalSecret + secretKeyRef" pattern as
# mcp-confluence. Consumed by the Keycloak CR's spec.db.usernameSecret/
# passwordSecret (ADR-0315).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgresqlSecretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.postgresqlSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: keycloak/postgresql-app
        property: username
    - secretKey: password
      remoteRef:
        key: keycloak/postgresql-app
        property: password
{{- end }}
