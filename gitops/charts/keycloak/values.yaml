# operator.enabled renders the RHBK Subscription/OperatorGroup;
# keycloak.enabled renders the Keycloak CR/RealmImport/ExternalSecrets.
# Both default false so templates render nothing by default.
keycloak:
  enabled: false

# Namespace for the Keycloak CR, KeycloakRealmImport and ExternalSecrets.
# No Namespace template here - zuno-auth is created by gitops/charts/namespaces.
namespace: zuno-auth

# Name of the Keycloak CR; spec.keycloakCRName on the KeycloakRealmImport must
# match.
keycloakCRName: zuno

# ADR-0101 (roadmap WP-12): the HA-capable shape. The Keycloak Operator
# does not auto-create a PodDisruptionBudget (unlike PGO/Bitnami's redis
# chart, confirmed by its CRD - `oc explain keycloak.spec` has no pdb
# field), so templates/poddisruptionbudget.yaml hand-authors one. `spec.
# scheduling.topologySpreadConstraints` IS a real Keycloak CR field
# (`oc explain keycloak.spec.scheduling.topologySpreadConstraints`,
# confirmed against the live test cluster) and is set directly on the CR
# in templates/keycloak.yaml. `spec.instances` above stays at its current
# demo-grade 1 deliberately - see the poddisruptionbudget/deployment
# values comment precedent in the other in-scope charts for why (safe at
# any instance count; raising it is an environment override paired with
# the operator's failover drill).
podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway

# OpenShift apps wildcard domain. Every per-agent client redirect URI in
# files/realm-zuno.json is templated against this - override for the real
# cluster before go-live; the checked-in default only works for the example
# domain.
clusterBaseDomain: apps.mycluster.example.com

# Kubernetes Secret names populated by ExternalSecrets resolving against the
# vault-backend ClusterSecretStore. Never hardcode values here.
adminSecretName: keycloak-admin
googleOAuthSecretName: google-oauth-client
postgresqlSecretName: keycloak-postgresql-app

# Dedicated Postgres database (ADR-0315) on the shared zuno-postgresql
# cluster (gitops/charts/postgresql). See templates/externalsecret-postgresql.yaml
# for how the credential crosses from zuno-data into this namespace.
#
# Deliberate exception to "every consumer goes through PgBouncer": PgBouncer
# runs in poolMode: transaction (gitops/charts/postgresql/values.yaml), but
# Keycloak's JDBC layer relies on server-side prepared statements, which
# transaction-mode pooling doesn't reliably support under sustained load.
# Connects directly to the primary instead.
postgresqlHost: zuno-postgresql-primary.zuno-data.svc.cluster.local
postgresqlPort: 5432
postgresqlDatabase: keycloak

# Disables the realm's "google" identity provider and skips the
# google-oauth-client ExternalSecret when false.
googleOAuth:
  enabled: true

# External TLS via cert-manager (ADR-0316). operatorManaged: false means the
# RHBK operator does NOT create the Route/Ingress itself (spec.ingress.enabled
# on the Keycloak CR tracks this) - templates/ingress.yaml hand-authors it
# instead, annotated for cert-manager's vault-issuer ClusterIssuer. See
# README.md's "External TLS via cert-manager" section.
ingress:
  operatorManaged: false
  # Empty by default: templates/ingress.yaml falls back to
  # "<keycloakCRName>-service" when unset. ASSUMPTION, unverified against a
  # live cluster - see README.md. Confirm via `oc get svc -n zuno-auth` once
  # the RHBK operator has reconciled with operatorManaged: false, and
  # override here if the actual Service name differs.
  backendServiceName: ""
  backendServicePort: 8080
  tlsSecretName: keycloak-tls
  # ADR-0211: when true, the Ingress consumes the already-issued
  # Let's Encrypt wildcard Secret (keycloak-wildcard-tls, created in
  # zuno-auth by gitops/charts/cert-manager's acme.enabled Certificate)
  # instead of requesting its own per-route certificate from the
  # vault-issuer annotation. Flip ONLY after that Certificate reports
  # Ready: True - same sequencing rule as the cert-manager chart's own
  # acme.consumers flags.
  acmeWildcardTLS: false

# zuno-auth needs its own OperatorGroup - RHBK only supports
# OwnNamespace/SingleNamespace install modes.
#
# subscription.operator.channel/source.name are left empty by default,
# discovered by ansible and set via gitops_app_extra_helm_values on the -d0
# apply. templates/checks.yaml fails the render if either is still empty.
operator:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: keycloak
    app: keycloak
  subscription:
    enabled: true
    name: rhbk-operator
    namespace: zuno-auth
    operator:
      channel: ""
      name: rhbk-operator
      installPlanApproval: Automatic
      source:
        name: ""
        namespace: openshift-marketplace
  operatorGroup:
    enabled: true
    name: rhbk-operator-group
    namespace: zuno-auth
