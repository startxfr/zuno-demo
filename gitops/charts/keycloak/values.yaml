# operator.enabled renders the RHBK Subscription/OperatorGroup;
# keycloak.enabled renders the Keycloak CR/RealmImport/ExternalSecrets.
# Both default false so templates render nothing by default.
keycloak:
  enabled: false
  # ADR-0352/WP-211: true = this chart deploys the Keycloak (CR, Ingress, realm import, database
  # secret). false = EXTERNAL mode: a Keycloak this platform does not own is used instead; only the
  # consumer-side objects stay (client-secret ExternalSecrets, the client ConfigMap) and the
  # reconcile Job targets keycloakExternal.url (templates/job-client-reconcile-external.yaml).
  builtIn: true

# ADR-0352/WP-211: used only when keycloak.builtIn is false (the role sets them from confidential.yml).
keycloakExternal:
  url: ""              # https://sso.corp.example.com, no realm path
  realm: zuno          # the realm must be called zuno (the consumers' URLs write it)
  adminRealm: zuno     # realm the admin credential signs in to; `master` for a master-realm admin
  caConfigMap: ""      # ConfigMap (key ca-bundle.crt) in this namespace holding the external CA; "" = system trust
  seedPersonas: false  # create the demo personas (and, with them, nothing else) when missing

# Namespace for the Keycloak CR, KeycloakRealmImport and ExternalSecrets.
# No Namespace template here - zuno-auth is created by gitops/charts/namespaces.
namespace: zuno-auth

# Name of the Keycloak CR; spec.keycloakCRName on the KeycloakRealmImport must
# match.
keycloakCRName: zuno

# ADR-0101 (roadmap WP-12): the HA-capable shape. The Keycloak Operator
# does not auto-create a PodDisruptionBudget (unlike PGO/Bitnami's redis
# chart, confirmed by its CRD - `oc explain keycloak.spec` has no pdb
# field), so templates/poddisruptionbudget.yaml hand-authors one. `spec.
# scheduling.topologySpreadConstraints` IS a real Keycloak CR field
# (`oc explain keycloak.spec.scheduling.topologySpreadConstraints`,
# confirmed against the live test cluster) and is set directly on the CR
# in templates/keycloak.yaml. `spec.instances` above stays at its current
# demo-grade 1 deliberately - see the poddisruptionbudget/deployment
# values comment precedent in the other in-scope charts for why (safe at
# any instance count; raising it is an environment override paired with
# the operator's failover drill).
podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway

# OpenShift apps wildcard domain. Every per-agent client redirect URI in
# files/realm-zuno.json is templated against this - override for the real
# cluster before go-live; the checked-in default only works for the example
# domain.
clusterBaseDomain: apps.mycluster.example.com

# Kubernetes Secret names populated by ExternalSecrets resolving against the
# namespace's own SecretStore `vault` (ADR-0602 / WP-223). Never hardcode values here.
adminSecretName: keycloak-admin
# ADR-0595: the two permanent master-realm accounts that replace the temporary
# bootstrap admin. automation: every Job and role (kcadm). console: the named
# administrator humans sign in with. Both are Vault-seeded by the vault role.
automationSecretName: keycloak-automation
consoleSecretName: keycloak-console

# ADR-0602 clause 3 / ADR-0603 M5, M6 / WP-223: demo | hardened. Set by
# ansible/roles/keycloak from zuno_security_profile. The realm import is
# create-only, so templates/configmap-clients.yaml renders realm-settings.json
# and job-client-reconcile.yaml merges it into the LIVE realm on every sync:
#   both profiles: the brute-force detection keys of files/realm-zuno.json
#                  (lockout after 30 failures, 60 s steps, 15 min ceiling,
#                  never permanent - a demo must not lock a presenter out for good);
#   hardened:      hardenedRealmSettings below, plus a CONFIGURE_TOTP required
#                  action on the master-realm console administrator.
# Merge semantics: only listed keys change. Going back from hardened to demo
# therefore does NOT remove the password policy or restore the idle timeout -
# clear them in the admin console (Realm settings) if that is ever wanted.
securityProfile: demo
hardenedRealmSettings:
  # Applies to every zuno-realm password set from now on (existing ones are
  # checked at their next change). The shared persona password must comply:
  # the eval-personas Job sets it with kcadm set-password, which enforces the
  # policy - ansible/tasks/assert_security_profile.yml checks it up front.
  passwordPolicy: "length(12) and digits(1) and notUsername"
  # One idle hour (ADR-0603 M6). ssoSessionMaxLifespan deliberately stays at
  # the realm file's 36000 s (10 h): it already bounds a session to a working
  # day, and shortening it would only add mid-demo re-logins - the idle
  # timeout is what closes an abandoned session.
  ssoSessionIdleTimeout: 3600

# ADR-0530/WP-091: templates/job-client-reconcile.yaml. The image is the same
# RHBK server image the operator runs (kcadm.sh ships in it; nothing else in
# this cluster has that CLI, and the image has no curl or jq to script around
# its absence). Keep the tag in step with the rhbk-operator CSV - 26.6.6-opr.1
# as of 2026-08-28. serverUrl is the in-cluster HTTP listener: the Keycloak CR
# sets httpEnabled, and the operator's own NetworkPolicy allows 8080 from any
# source, so no truststore or Route round-trip is involved.
clientReconcile:
  image: registry.redhat.io/rhbk/keycloak-rhel9:26.6
  serverUrl: http://zuno-service.zuno-auth.svc:8080
googleOAuthSecretName: google-oauth-client
postgresqlSecretName: keycloak-postgresql-app

# Dedicated Postgres database (ADR-0315) on the shared zuno-postgresql
# cluster (gitops/charts/postgresql). See templates/externalsecret-postgresql.yaml
# for how the credential crosses from zuno-data into this namespace.
#
# Deliberate exception to "every consumer goes through PgBouncer": PgBouncer
# runs in poolMode: transaction (gitops/charts/postgresql/values.yaml), but
# Keycloak's JDBC layer relies on server-side prepared statements, which
# transaction-mode pooling doesn't reliably support under sustained load.
# Connects directly to the primary instead.
postgresqlHost: zuno-postgresql-primary.zuno-data.svc.cluster.local
postgresqlPort: 5432
postgresqlDatabase: keycloak

# Disables the realm's "google" identity provider and skips the
# google-oauth-client ExternalSecret when false.
googleOAuth:
  enabled: true

# External TLS via cert-manager (ADR-0316). operatorManaged: false means the
# RHBK operator does NOT create the Route/Ingress itself (spec.ingress.enabled
# on the Keycloak CR tracks this) - templates/ingress.yaml hand-authors it
# instead, annotated for cert-manager's vault-issuer ClusterIssuer. See
# README.md's "External TLS via cert-manager" section.
ingress:
  operatorManaged: false
  # Empty by default: templates/ingress.yaml falls back to
  # "<keycloakCRName>-service" when unset. ASSUMPTION, unverified against a
  # live cluster - see README.md. Confirm via `oc get svc -n zuno-auth` once
  # the RHBK operator has reconciled with operatorManaged: false, and
  # override here if the actual Service name differs.
  backendServiceName: ""
  backendServicePort: 8080
  tlsSecretName: keycloak-tls
  # ADR-0211: when true, the Ingress consumes the already-issued
  # Let's Encrypt wildcard Secret (keycloak-wildcard-tls, created in
  # zuno-auth by gitops/charts/cert-manager's acme.enabled Certificate)
  # instead of requesting its own per-route certificate from the
  # vault-issuer annotation. Flip ONLY after that Certificate reports
  # Ready: True - same sequencing rule as the cert-manager chart's own
  # acme.consumers flags.
  acmeWildcardTLS: false

# zuno-auth needs its own OperatorGroup - RHBK only supports
# OwnNamespace/SingleNamespace install modes.
#
# subscription.operator.channel/source.name are left empty by default,
# discovered by ansible and set via gitops_app_extra_helm_values on the -d0
# apply. templates/checks.yaml fails the render if either is still empty.
operator:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: keycloak
    app: keycloak
  subscription:
    enabled: true
    name: rhbk-operator
    namespace: zuno-auth
    operator:
      channel: ""
      name: rhbk-operator
      installPlanApproval: Automatic
      source:
        name: ""
        namespace: openshift-marketplace
  operatorGroup:
    enabled: true
    name: rhbk-operator-group
    namespace: zuno-auth

# ADR-0581/WP-164: the entitlement groups the admitted zuno-demo-agents
# release declares (zuno.access.groups), from
# platform/okf/stack-config.generated.yaml via ansible/roles/keycloak. The
# client-reconcile Job creates any that are missing - never deletes one,
# never touches membership. Empty: the Job reconciles clients only, as
# before.
agentGroups: []

# WP-169: dedicated evaluation personas. The evaluation harnesses, probes and
# eval Jobs sign in as these instead of the demo personas, so their token
# spend lands on its own per-user ai-gateway budget and never exhausts the
# budget of a persona a presenter uses live. Each copies the groups of the
# realm-zuno.json user named in copyOf (resolved at render time, so the two
# never drift) and shares the demo personas' password (Secret
# demo-personas-password). Created by templates/job-eval-personas.yaml:
# create-only users, missing memberships added, nothing ever removed.
# Every evaluation persona also joins this group, which the Job creates when
# missing. The ai-gateway runs a member of it under the `evaluation` quota
# class (its own budget) on any path, UnifAI chats included; no user can add
# themselves to a group. Empty = no extra group.
evalPersonasGroup: /zuno-evaluation
evalPersonas:
  - username: eval-consultant-01
    copyOf: consultant-01
  - username: eval-sale-01
    copyOf: sale-01
  - username: eval-adv-01
    copyOf: adv-01
  - username: eval-finance-01
    copyOf: finance-01
  - username: eval-board-01
    copyOf: board-01
  # Stresstest twins: the day-3 stresstest Jobs sign in as these
  # (EVAL_TWIN_PREFIX=stress-), so one stresstest run - about 160 model
  # calls, close to a whole 3M-token daily user budget since the Red Hat
  # documentation joined the Tekos retriever - never exhausts the budget the
  # RAGAS CronJob and manual probes use on the eval-* twins.
  - username: stress-consultant-01
    copyOf: consultant-01
  - username: stress-sale-01
    copyOf: sale-01
  - username: stress-adv-01
    copyOf: adv-01
  - username: stress-finance-01
    copyOf: finance-01
  - username: stress-board-01
    copyOf: board-01

# WP-190 phase 4: the confidential clients of the user experiences, declared once. Each entry renders its Vault-backed
# ExternalSecret `<name>-client-secret` (key keycloak/<name>, templates/externalsecret-experience-clients.yaml) and its
# KC_VAULT file in templates/keycloak.yaml, and the vault role seeds keycloak/<name> from the same list. The client
# definition itself (redirects, mappers, `${vault.<name with - as _>_client_secret}`) stays in files/realm-zuno.json.
experienceClients:
  - name: unifai
  - name: open-webui
  - name: openclaw-consultant-02
  - name: openclaw-sale-01
  - name: dify
  - name: kagent
  # ADR-0604 (WP-233): the world-model experience, user token passed through, no service account.
  - name: world-model
