# ADR-0327/ADR-0308 (WP-38): Arkos is this repo's migration proof - this
# chart no longer renders a raw Deployment/Service/Route/NetworkPolicy/
# ServiceAccount/ExternalSecret set directly (compare gitops/charts/tekos,
# which still does, deliberately, to prove plain-manifest and CR-managed
# agents coexist with no flag day). It renders exactly one AIAgent CR
# (templates/aiagent.yaml); the aiagent-operator (gitops/charts/
# aiagent-operator, must be synced first - see gitops/apps/arkos/
# application-d1.yaml's own comment) reconciles that CR into the
# equivalent resources at runtime. Platform-wide constants every agent
# shares (clusterBaseDomain, Keycloak issuer, Redis address, Agent
# Runtime base URL, Vault path conventions) are no longer declared here
# at all - they live once, in the operator's own
# gitops/charts/aiagent-operator/values.yaml /
# internal/controller/config.go, not per agent.

namespace: zuno-ai-run

agentName: arkos

okfBundleRef: agents/arkos

image:
  # Built by the "agent" build component into zuno-ai-build's ImageStream,
  # pulled cross-namespace into zuno-ai-run via the system:image-puller
  # RoleBinding - the operator's generated Deployments depend on the same
  # RoleBinding Tekos's own plain-manifest Deployment already uses.
  registry: image-registry.openshift-image-registry.svc:5000
  frontendRepository: zuno-ai-build/agent-frontend
  bffRepository: zuno-ai-build/agent-bff
  # image.tag must stay "latest" until a release is cut - see RELEASING.md (two parallel image paths).
  tag: latest

frontend:
  replicas: 1
  # Empty means "arkos.<the operator's own clusterBaseDomain>" (see
  # internal/controller/resources.go's routeHost()). Must stay
  # predictable: the OIDC redirect URI and Keycloak client's registered
  # redirect URI both depend on it.
  routeHost: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  oidcClientId: arkos-frontend

bff:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  oidcAudience: arkos-frontend

# ADR-0040: agent entitlement group, orthogonal to the `consultant`
# business role that governs tool/data permissions inside Arkos
# (ADR-0349 moved Arkos's audience from board to the consultant
# architect tier) - matches agents/arkos/agent.okf.md's own
# zuno.access.groups.
groups:
  entitlementGroup: agent_arkos
  businessRoles:
    - consultant

# Union of every agents/arkos/tasks/*.md file's own allowed_knowledge -
# the deployment-time binding requirement, not the per-task grant (that
# stays in policies/knowledge/knowledge-policy.yaml and each task's own
# frontmatter, per ADR-0203).
knowledgeDomains:
  - knowledge.tech
  - knowledge.project

# Union of every agents/arkos/tasks/*.md file's own allowed_tools.
# drive.document.create/.update deliberately absent - no google-workspace
# MCP server is deployed in this cluster, see agents/arkos/tasks/
# draft-architecture-testimonial.md's own note.
toolCapabilities:
  - confluence.page.read
  - confluence.page.search
  - git.repository.read
  - git.repository.list
  - git.repository.private.read
  - git.repository.private.list
  - git.file.write
  - git.repository.create
