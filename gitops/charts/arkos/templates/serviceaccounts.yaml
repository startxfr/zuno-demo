# Dedicated, least-privilege service accounts per workload. No RBAC
# binding: neither talks to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arkos-frontend
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/agent: arkos
    app.kubernetes.io/component: frontend
  annotations:
    argocd.argoproj.io/sync-wave: "80"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arkos-bff
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/agent: arkos
    app.kubernetes.io/component: bff
  annotations:
    argocd.argoproj.io/sync-wave: "80"
