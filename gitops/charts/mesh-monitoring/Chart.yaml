apiVersion: v2
name: mesh-monitoring
description: >-
  Dedicated Prometheus for the service mesh: the Red Hat Cluster
  Observability operator, a MonitoringStack in zuno-mesh, and the
  ServiceMonitor/PodMonitor scraping istiod and the mesh's Envoy sidecars -
  the metrics source gitops/charts/kiali's Kiali instance uses for its
  traffic graph and health views.
type: application
version: 0.1.0
dependencies:
  - name: operator
    version: "21.3.397"
    repository: "https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable"
  - name: project
    version: "21.3.397"
    repository: "https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable"
  # helm-repository migration, lot 1: the MonitoringStack, the ServiceMonitor and the PodMonitor come from the helm-repository chart instead of
  # templates of this chart. Only rendered with the d1 Application (monitoring.enabled), like the templates it replaces.
  - name: cluster-prometheus
    version: "21.3.397"
    repository: "https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable"
    condition: monitoring.enabled
