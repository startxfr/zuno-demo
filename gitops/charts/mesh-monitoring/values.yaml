# project.enabled renders the dedicated Namespace, via the vendored startx
# `project` chart; operator.enabled renders the OperatorGroup/Subscription,
# via the vendored startx `operator` chart; monitoring.enabled renders the
# MonitoringStack/ServiceMonitor/PodMonitor instances. Shared by two ArgoCD
# Applications: operator (zuno-mesh-monitoring-d0, project+operator) and
# instance (zuno-mesh-monitoring-d1, monitoring). All default false so
# `helm template`/`helm lint` render nothing.
#
# Package/channel confirmed against a live cluster's PackageManifest
# (redhat-operators catalog) before this chart was written - see
# `oc get packagemanifest cluster-observability-operator -n openshift-marketplace`.
# Chosen over the Community "prometheus" package (upstream prometheus-operator)
# to stay consistent with this repo's preference for Red Hat/certified
# operators (kiali-ossm, tempo-product, servicemeshoperator3,
# opentelemetry-product are all redhat-operators, not community-operators).
project:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: mesh-monitoring
    app: mesh-monitoring
  project:
    enabled: true
    hooked: true  # PreSync ArgoCD hook
    type: namespace
    name: openshift-cluster-observability-operator
    display_name: Zuno Infra Cluster Observability Operator
    description: "Red Hat Cluster Observability operator subscription, installed by Zuno."
    requester: zuno

operator:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: mesh-monitoring
    app: mesh-monitoring
  subscription:
    enabled: true
    name: cluster-observability-operator
    namespace: openshift-cluster-observability-operator
    operator:
      # Must be set explicitly, same name as subscription.name: the vendored
      # `operator` chart defaults this to "codeready-workspaces", silently
      # suppressing the fallback to subscription.name.
      name: cluster-observability-operator
      channel: stable
      installPlanApproval: Automatic  # global switch: zuno_operator_install_plan_approval (ansible group_vars)
      source:
        name: redhat-operators
        namespace: openshift-marketplace
  operatorGroup:
    enabled: true
    name: cluster-observability-operator-group
    namespace: openshift-cluster-observability-operator
    target: "all-ns"  # matches the original hand-authored spec: {}

monitoring:
  enabled: false
  # 2026-11-19: the mesh Prometheus had 24h retention on an emptyDir, so every
  # restart wiped the Kiali/mesh history. storage.size empty = emptyDir as before.
  retention: 7d
  storage:
    size: 10Gi
    storageClassName: ""   # empty = the cluster default class

meshNamespace: zuno-mesh

# The chart cluster-prometheus (helm-repository 21.3.372) renders what templates/ used to: one MonitoringStack, one ServiceMonitor
# (istiod) and one PodMonitor (Envoy sidecars). A subchart's values cannot be templated from this chart, so the namespace
# (= meshNamespace) and the retention / storage (= monitoring.retention / monitoring.storage above, now documentation of
# the values below) are written here; change both places together.
cluster-prometheus:
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: mesh-monitoring
    app: mesh-monitoring
  project:
    project:
      name: zuno-mesh
  monitoringStacks:
    enabled: true
    list:
      - name: mesh-monitoring
        namespace: zuno-mesh
        labels:
          zuno.io/managed-by: argocd
        annotations:
          argocd.argoproj.io/sync-wave: "20"
        spec:
          logLevel: info
          retention: 7d
          prometheusConfig:
            persistentVolumeClaim:
              resources:
                requests:
                  storage: 10Gi
          resourceSelector:
            matchLabels:
              zuno.io/mesh-monitoring: "true"
          namespaceSelector: {}
  serviceMonitors:
    enabled: true
    list:
      - name: istiod-monitor
        namespace: zuno-mesh
        labels:
          zuno.io/managed-by: argocd
          zuno.io/mesh-monitoring: "true"
        annotations:
          argocd.argoproj.io/sync-wave: "20"
        spec:
          selector:
            matchLabels:
              istio: pilot
          namespaceSelector:
            matchNames:
              - zuno-mesh
          endpoints:
            - port: http-monitoring
              path: /metrics
              interval: 15s
  podMonitors:
    enabled: true
    list:
      # Envoy sidecars are not a Service (one per meshed workload pod in every injected namespace), so a PodMonitor with
      # namespaceSelector.any; pods without the named "http-envoy-prom" port are skipped by Prometheus, not an error.
      - name: istio-proxy-monitor
        namespace: zuno-mesh
        labels:
          zuno.io/managed-by: argocd
          zuno.io/mesh-monitoring: "true"
        annotations:
          argocd.argoproj.io/sync-wave: "20"
        spec:
          selector: {}
          namespaceSelector:
            any: true
          podMetricsEndpoints:
            - path: /stats/prometheus
              port: http-envoy-prom
              interval: 15s
