{{- if .Values.securesignOperand.enabled }}
# Renders the connection Secret the Securesign CR's
# trillian.database.databaseSecretRef expects (documented keys: mysql-host/
# mysql-port/mysql-user/mysql-password/mysql-database - `oc explain
# securesign.spec.trillian.database`, confirmed live 2026-09-02 on
# rhtas-operator.v1.4.3). Only the password is secret (Vault
# zuno/rhtas/trillian-mysql, self-generated by ansible/roles/vault - the
# same path gitops/charts/mariadb's externalsecret-rhtas-trillian-db.yaml
# resolves into zuno-data for the User CR; secretKeyRef can't cross
# namespaces, hence two ExternalSecrets on one Vault path). The
# host/port/user/database values are static and rendered via the target
# template.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rhtas-trillian-db
  namespace: {{ .Values.securesignOperand.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: rhtas-trillian-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        mysql-host: {{ .Values.trillianDatabase.host | quote }}
        mysql-port: {{ .Values.trillianDatabase.port | quote }}
        mysql-user: {{ .Values.trillianDatabase.user | quote }}
        mysql-database: {{ .Values.trillianDatabase.database | quote }}
        mysql-password: "{{ printf "{{ .password }}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.trillianDatabase.vaultPath }}
        property: password
{{- end }}
