# Thin wrapper around the startx `cluster-gpu` chart (vendored as a Helm
# dependency). Shared by two ArgoCD Applications: project + operator
# (zuno-nvidia-gpu-d0) render the Namespace/OperatorGroup/Subscription,
# gpu.enabled (zuno-nvidia-gpu-d1) gates the ClusterPolicy CR.
cluster-gpu:
  context: &context
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: nvidia-gpu
    app: nvidia-gpu

  project:
    enabled: false
    context:
      <<: *context
    project:
      enabled: true
      hooked: true  # PreSync ArgoCD hook
      type: namespace
      name: nvidia-gpu-operator
      display_name: Zuno Infra NVIDIA GPU
      description: NVIDIA GPU Operator, configured by Zuno
      requester: zuno

  operator:
    enabled: false
    context:
      <<: *context
    subscription:
      enabled: true
      name: gpu-operator-certified
      namespace: nvidia-gpu-operator
      operator:
        channel: stable
        name: gpu-operator-certified
        installPlanApproval: Automatic  # startx chart defaults to Manual
        source:
          name: certified-operators
          namespace: openshift-marketplace
    operatorGroup:
      enabled: true
      name: nvidia-gpu-operator-group
      namespace: nvidia-gpu-operator
      target: nvidia-gpu-operator
      # Scoped to this single namespace, not all-ns (startx's own default).

  # Must stay false until a real ClusterPolicy spec is discovered from the
  # installed operator's CSV — an empty spec is rejected by the CRD.
  # gpu.spec must be pre-serialized YAML text (a string), not a native map.
  gpu:
    enabled: false
    name: gpu-cluster-policy
    spec: "{}"
