# This chart is shared by two ArgoCD Applications (see
# gitops/apps/README.md): operator.enabled (zuno-nvidia-gpu-d0) renders
# the Namespace/OperatorGroup/Subscription, clusterPolicy.enabled
# (zuno-nvidia-gpu-d1) gates the ClusterPolicy CR.
operator:
  enabled: false

# ADR-0312: clusterPolicy.spec is deliberately unset by default, even once
# clusterPolicy.enabled is true on the -d1 Application. The ClusterPolicy
# CRD version installed by a given GPU Operator release requires a spec
# shape this repository does not hand-maintain (see this chart's
# README.md) - ansible/roles/nvidia_gpu/tasks/install.yml reads the
# installed CSV's own recommended default spec from its alm-examples
# annotation and injects it via gitops_app_extra_helm_values (ADR-0048)
# in a *second* apply against the zuno-nvidia-gpu-d1 Application, once the
# operator (the separate zuno-nvidia-gpu-d0 Application) has actually
# installed a CSV to read. Until then, templates/clusterpolicy.yaml
# renders nothing even with clusterPolicy.enabled: true.
clusterPolicy:
  enabled: false
  spec: {}
