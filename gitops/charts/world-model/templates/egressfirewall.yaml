# ADR-0604 §8.4: outside the cluster, only Keycloak (the front door's login and the JWKS) and the model bucket in S3
# (virtual-hosted and path style). Everything else is denied: nothing here can reach an external model provider.
#
# S3 is allowed twice: by name and by the region's published address ranges (egress.s3CidrsByRegion). The name rules alone
# are not enough: S3 answers every lookup with other addresses out of a pool of hundreds, the rule only holds the few it
# resolved, and a 20 GB model copy stalled on blocked connections (measured 2026-11-08: 3 of 90 addresses reachable, one
# 22 MB file in 7 minutes). Nothing but S3 lives in those ranges, and the pod holds no credential for another bucket.
apiVersion: k8s.ovn.org/v1
kind: EgressFirewall
metadata:
  name: default
  labels:
    zuno.io/managed-by: argocd
spec:
  egress:
    - type: Allow
      to:
        dnsName: {{ include "world-model.keycloakHost" . }}
      ports:
        - protocol: TCP
          port: 443
    - type: Allow
      to:
        dnsName: s3.{{ .Values.modelStorage.region }}.amazonaws.com
      ports:
        - protocol: TCP
          port: 443
    - type: Allow
      to:
        dnsName: {{ .Values.modelStorage.bucket }}.s3.{{ .Values.modelStorage.region }}.amazonaws.com
      ports:
        - protocol: TCP
          port: 443
    {{- range (get .Values.egress.s3CidrsByRegion .Values.modelStorage.region | default list) }}
    - type: Allow
      to:
        cidrSelector: {{ . }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    - type: Deny
      to:
        cidrSelector: 0.0.0.0/0
