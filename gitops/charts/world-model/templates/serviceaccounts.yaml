# One ServiceAccount per workload, none with an API token (nothing here calls the Kubernetes API). The two
# image-pulling ones are granted pull access to zuno-ai-build by ansible/roles/world_model_build.
{{- range list "world-model-runtime" "world-model-web" "world-model-front-door" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ . }}
  labels:
    zuno.io/managed-by: argocd
automountServiceAccountToken: false
{{- end }}
