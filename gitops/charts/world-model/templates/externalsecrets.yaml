# ADR-0604 (WP-235): every secret comes from Vault through this namespace's own SecretStore
# (platform/vault/secret-access.yaml lists the keys: keycloak/world-model, world-model/app, rag/s3).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: world-model-front-door
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: SecretStore
  target:
    name: world-model-front-door
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef: {key: keycloak/{{ .Values.frontDoor.clientId }}, property: client_secret}
    - secretKey: cookie-secret
      remoteRef: {key: world-model/app, property: front_door_cookie_secret}
---
# The shared secret between world-model-web and the runtime (X-World-Runtime-Token): defence in depth on top of the
# namespace's NetworkPolicies.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: world-model-internal
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: SecretStore
  target:
    name: world-model-internal
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: {key: world-model/app, property: internal_token}
---
# Read access to the model bucket, for the runtime's init container.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: world-model-s3
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: SecretStore
  target:
    name: world-model-s3
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: {key: {{ .Values.externalSecrets.s3Key }}, property: accessKeyId}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: {key: {{ .Values.externalSecrets.s3Key }}, property: secretAccessKey}
