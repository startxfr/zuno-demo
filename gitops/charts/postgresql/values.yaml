# Default values for the postgresql chart. See gitops/apps/postgresql/
# application-d0.yaml/application-d1.yaml for how this is deployed
# (namespace: zuno-data) and gitops/charts/postgresql/image/README.md for
# the pgvector image build step.

# This chart is shared by two ArgoCD Applications (see
# gitops/apps/README.md): operator.enabled (zuno-postgresql-d0) renders
# the PGO Subscription via the vendored startx `operator` chart (see
# Chart.yaml for why not `cluster-crunchy`), postgresCluster.enabled
# (zuno-postgresql-d1) renders the PostgresCluster/ConfigMap/ExternalSecret
# (local templates, no startx equivalent covers this chart's pgvector
# image/backups/Vault-credentials wiring). Both default to false so `helm
# template`/`helm lint` render nothing by default.
postgresCluster:
  enabled: false

# ADR-0312/ADR-0048: subscription.name (the package name itself, unlike
# every other converted chart) / subscription.operator.channel /
# subscription.operator.source.name are all discovered by
# ansible/roles/postgresql/tasks/install.yml (fuzzy /crunchy/i match
# across every catalog, operatorhubio-catalog fallback if nothing is
# found anywhere - see that role's README.md) and always set via
# gitops_app_extra_helm_values on the -d0 apply. templates/checks.yaml
# fails the render if any is still empty once operator.enabled is true -
# same fail-fast guard this chart's previous local Subscription template
# enforced with Helm's `required` function (the vendored `operator`
# chart's own Subscription template has no such guard). No OperatorGroup
# here: openshift-operators ships with OpenShift's own default global
# OperatorGroup (AllNamespaces), unlike gitops/charts/{nfd,nvidia-gpu,
# openshift-ai,cert-manager}'s dedicated per-operator namespaces - so
# operatorGroup.enabled is left at the `operator` chart's own default
# (false).
operator:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: postgresql
    app: postgresql
  subscription:
    enabled: true
    namespace: openshift-operators
    name: ""
    operator:
      # Must be set to the same discovered package name as subscription.name
      # above (both metadata.name and spec.name need it) - NOT left unset to
      # fall back to subscription.name via the vendored `operator` chart's
      # own `.name | default $name` logic, because that chart's own
      # values.yaml already gives operator.name a non-empty base default
      # ("codeready-workspaces", its own CRW example) which wins the merge
      # and suppresses that fallback entirely.
      name: ""
      channel: ""
      # Matches this repo's previous local template (automatic
      # upgrades) - the startx chart defaults to Manual.
      installPlanApproval: Automatic
      source:
        name: ""
        namespace: openshift-marketplace

postgresVersion: 16

image:
  # Built from gitops/charts/postgresql/image/Dockerfile (Crunchy's own
  # UBI-based operand image + pgvector, since PGO does not bundle pgvector
  # out of the box either - see image/README.md). This is a placeholder
  # internal-registry reference - an operator must build and push this
  # image once (see image/README.md) before the PostgresCluster below can
  # start; point this at wherever your cluster's image registry actually is.
  repository: image-registry.zuno-demo.internal/zuno/postgresql-pgvector
  tag: "16-crunchy"

cluster:
  name: zuno-postgresql
  # Demo scope: single instance, no automatic failover. ADR-0101 (v1,
  # Proposed) tracks HA for shared agent-platform services.
  instances: 1
  storageSize: 5Gi
  database: zuno
  # No underscore/hyphen: PGO derives a Kubernetes Secret name directly
  # from this value ("<cluster>-pguser-<owner>", RFC 1123 label rules),
  # and unquoted PostgreSQL identifiers can't contain hyphens either -
  # lowercase-letters-and-digits-only is valid in both (see
  # ansible/roles/postgresql/README.md).
  owner: zunoapp

# PGO requires at least one pgBackRest repository configured - unlike
# CNPG, there is no way to omit backups entirely. A single local
# PVC-backed repo is the minimal equivalent of this demo's "HA/backup
# hardening deferred to v1" scope (ADR-0101) rather than a real off-cluster
# backup destination.
backups:
  storageSize: 5Gi

credentials:
  # Path under the vault-backend ClusterSecretStore's "secret" KV v2 mount
  # (i.e. resolves to Vault path secret/zuno/postgresql/app, already seeded
  # by ansible/roles/vault/tasks/install.yml - this chart only consumes
  # it, never regenerates or hardcodes it, per ADR-0024).
  vaultPath: zuno/postgresql/app
  # PGO's own fixed naming convention for a user's auto-managed Secret is
  # "<cluster>-pguser-<user>" - not a freely-chosen name like CNPG's
  # bootstrap.initdb.secret.name was, so this is templated from
  # cluster.name/cluster.owner in templates/externalsecret.yaml rather than
  # set here, to avoid two places needing to agree on the same string.
  secretStoreName: vault-backend
  refreshInterval: 1h
