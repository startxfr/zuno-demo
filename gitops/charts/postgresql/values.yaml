# Shared by two ArgoCD Applications: operator (zuno-postgresql-d0) renders
# the PGO Subscription, postgresCluster (zuno-postgresql-d1) renders the
# PostgresCluster/ConfigMap/ExternalSecret. Both default false so `helm
# template`/`helm lint` render nothing.
postgresCluster:
  enabled: false
  # One-shot recovery trigger (ansible/roles/postgresql/tasks/restore.yml):
  # a pgBackRest repo name (e.g. "repo2") to bootstrap this PostgresCluster
  # from via spec.dataSource.postgresCluster, instead of an empty cluster.
  # Empty string (default) = normal fresh bootstrap. Set only as a live
  # Helm-value override for the duration of a restore - restore.yml clears
  # it again once the restored cluster is Ready, since dataSource only
  # matters at initial creation and leaving it armed could surprise a
  # future *intentional* fresh-cluster recreation.
  restoreFromRepo: ""

# subscription.name/operator.channel/operator.source.name are all
# discovered at run time by ansible/roles/postgresql/tasks/install.yml and
# set via gitops_app_extra_helm_values. templates/checks.yaml fails the
# render if any is still empty once operator.enabled is true. No
# OperatorGroup: openshift-operators uses OpenShift's own default global
# one (AllNamespaces).
operator:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: postgresql
    app: postgresql
  subscription:
    enabled: true
    namespace: openshift-operators
    name: ""
    operator:
      # Must be set explicitly: the vendored `operator` chart defaults this to
      # "codeready-workspaces", silently suppressing the fallback to subscription.name.
      name: ""
      channel: ""
      installPlanApproval: Automatic  # startx chart defaults to Manual
      source:
        name: ""
        namespace: openshift-marketplace

postgresVersion: 18

# Crunchy's own postgres_exporter sidecar (spec.monitoring.pgmonitor.exporter,
# `oc explain postgrescluster.spec.monitoring.pgmonitor.exporter` confirmed
# against the live cluster) on every instance pod, port "exporter" (9187) -
# the ccp_* series dashboard-data.yaml (ADR-0413) needs. PGO manages
# the container/image itself; no image override needed here, same as
# postgresVersion's own comment above about the operand image. PGO creates
# no ServiceMonitor for this on its own - templates/podmonitor-postgres.yaml
# is the other required half.
monitoring:
  enabled: true

# No image: override - PGO's default operand image for this version already
# bundles pgvector and supports TimescaleDB; templates/postgrescluster.yaml
# omits spec.image entirely.

# ADR-0101 (roadmap WP-12) originally added a topologySpreadConstraints
# block here, applied to both spec.instances and spec.proxy.pgBouncer in
# templates/postgrescluster.yaml. Reverted: it duplicated PGO's own
# injected default topology spread constraints and broke reconciliation -
# see that template's comments for details.

cluster:
  name: zuno-postgresql
  instances: 3  # HA: 1 primary + 2 async replicas, PGO/Patroni auto-failover
  # PLACEHOLDER (WP-118 B5). The real class is discovered at apply time by
  # ansible/tasks/resolve_cluster_default_storage_class.yml - the one
  # annotated storageclass.kubernetes.io/is-default-class - and injected as
  # an Application-level value by this component's role, which always
  # overrides this. Nothing here renders on a cluster installed via `make`.
  # Left as an obviously-invalid name on purpose: if the Application ever
  # lost its values, a PVC that cannot bind is a loud failure, where a
  # plausible-looking class name would silently bind to the wrong storage.
  # PVC storageClassName is immutable once bound, so wrong is unrecoverable
  # by re-sync.
  storageClassName: mycluster-default-storageclass
  storageSize: 200Gi
  walStorageSize: 50Gi  # separate volume: WAL write latency matters more than DATA's
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 16Gi
  database: zuno
  # No underscore/hyphen: PGO derives the pguser Secret name directly from
  # this ("<cluster>-pguser-<owner>"), and it must also be a valid unquoted
  # PostgreSQL identifier.
  owner: zunoapp

# TimescaleDB must be preloaded (unlike pgvector) - see
# templates/configmap-init-sql.yaml for the CREATE EXTENSION statements.
config:
  maxConnections: "200"
  logMinDurationStatement: "1000"

# PgBouncer in front of the 3 instances (transaction pooling), managed
# natively by PGO. Consumers connect to <cluster>-pgbouncer, not -primary.
pgBouncer:
  replicas: 2
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  poolMode: transaction
  maxClientConn: "500"
  defaultPoolSize: "50"

# PGO requires at least one pgBackRest repository; repo1 is always a local
# PVC. repo2 (S3, off-cluster) is added only once real credentials exist.
backups:
  # Dedicated pgBackRest repository host. See the long comment on
  # spec.backups.pgbackrest.repoHost in templates/postgrescluster.yaml for the
  # measurements these come from and why memory is sized to the backup peak
  # while cpu is sized to the idle state.
  repoHost:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
  storageSize: 500Gi
  s3:
    enabled: false
    bucket: ""
    endpoint: ""
    region: ""
    secretName: zuno-postgresql-backup-s3  # synced from Vault, only used when s3.enabled

credentials:
  # Resolves to Vault path zuno/postgresql/app; this chart only consumes
  # the credential, never generates it.
  vaultPath: postgresql/app
  # PGO's fixed naming convention ("<cluster>-pguser-<user>") is templated
  # in templates/externalsecret.yaml from cluster.name/cluster.owner
  # instead of set here, so the two don't need to agree independently.
  secretStoreName: vault-backend
  refreshInterval: 1h
  # Merge, not Orphan, for every pguser Secret (ADR-0529). Orphan's write is
  # destructive: it replaces .data wholesale with the two keys this chart
  # supplies, deleting the verifier/uri/host/... PGO maintains on the same
  # object. PGO re-adds them, ESO's data-hash annotation then permanently
  # disagrees with the real content so its isSecretValid() never passes, and
  # the two rewrite each other on every event - measured at ~8s per flip,
  # with PGO re-deriving a freshly SALTED SCRAM verifier each cycle and
  # pushing it with ALTER ROLE. Merge touches only its own managed keys.
  #
  # The cost: Merge does NOT create a missing Secret. The greenfield path is
  # covered by ansible/roles/postgresql (pguser_bootstrap_secrets), which
  # pre-creates them from Vault before the PostgresCluster exists. Do not set
  # this back to Orphan without reading ADR-0529 - it is the break-glass
  # value, and it reinstates continuous ALTER ROLE on 17 roles.
  pguserCreationPolicy: Merge

# Dedicated database/role for Keycloak (ADR-0315) - not the same
# zunoapp/zuno pair every other consumer shares, to keep Keycloak's own
# schema/lifecycle isolated. Same PGO "bring your own password" mechanism
# as cluster.owner above, via templates/externalsecret-keycloak.yaml.
keycloakDatabase:
  name: keycloak
  owner: keycloak
  vaultPath: keycloak/postgresql-app

# Dedicated database/role for the rag-ingestion pipeline's structured
# corpus/index tables - same isolation rationale and "bring your own
# password" mechanism as keycloakDatabase above, via
# templates/externalsecret-ragtech.yaml. owner must be alphanumeric only
# (no hyphen, no underscore): it feeds PGO's "<cluster>-pguser-<owner>"
# Secret name, which is RFC 1123-constrained (rejects underscores) same
# as every other owner in this file, while database.name keeps the
# hyphen the platform's naming convention asks for - CONFIRM PGO quotes
# this identifier when creating the database (every other database name
# in this file avoids the hyphen precisely to sidestep that question;
# this one doesn't, per an explicit request - verify against a real PGO
# instance before relying on it, same "not exercised against a real
# cluster" caveat this role's README already carries elsewhere).
ragTechDatabase:
  name: rag-tech
  owner: ragtech
  vaultPath: rag/postgresql-app

# Dedicated database/role for RHOAI's Models-as-a-Service API (maas-api
# API-key/subscription store) - same isolation rationale and "bring your
# own password" mechanism as keycloakDatabase above, via
# templates/externalsecret-maas.yaml. The consumer-side Secret
# (maas-db-config in redhat-ods-applications) is rendered independently by
# gitops/charts/openshift-ai/templates/externalsecret-maas-db.yaml from the
# same Vault path, since secretKeyRef can't cross namespaces.
maasDatabase:
  name: maas
  owner: maas
  vaultPath: maas/postgresql-app

# Dedicated database/role for the MLflow tracking server (ADR-0538/WP-116 -
# experiment tracking over the MLOps LoRA pipeline). Un-hyphenated name and
# owner on purpose: the owner feeds the "<cluster>-pguser-<owner>" Secret
# name, and the database name is interpolated into a postgresql:// URI by
# gitops/charts/mlflow. PGO creates this database once - it never recreates
# a manually dropped one, it error-loops the whole cluster reconcile
# instead (same caveat every other database here carries).
mlflowDatabase:
  name: mlflow
  owner: mlflow
  vaultPath: mlflow/postgresql-app

# Dedicated database/role for the Agent Runtime's LangGraph checkpointer
# (ADR-0103) - resumable workflow state, isolated from every other
# database on this cluster for the same reason ragTechDatabase/
# maasDatabase are. The hyphenated database name mirrors ragTechDatabase's
# "rag-tech".
checkpointDatabase:
  name: agent-checkpoints
  owner: agentcheckpoints
  vaultPath: agent-runtime/postgresql-app

# Dedicated database/role for the OGX-backed RAG provider prototype's
# remote::pgvector vector I/O provider (ADR-0322 v0.1 integration scope) -
# isolated from every other database on this cluster for the same reason
# checkpointDatabase/ragTechDatabase are, and deliberately separate from
# the document_embeddings table rag-service's own pgvector provider reads
# (app/search.py) rather than a shared credential onto the same schema:
# ADR-0322's acceptance criteria call for OGX to *index* a controlled test
# corpus, not read the existing table directly, so its rows/schema are not
# expected to be identical. The consumer-side Secret (in
# redhat-ods-applications, labeled ogx.io/watch: "true" per the OGXServer
# CRD, confirmed via `oc explain ogxserver.spec.providers.vectorIo.remote.
# pgvector.password` against the live test cluster) is rendered
# independently by gitops/charts/openshift-ai/templates/ogxserver.yaml from
# the same Vault path, since secretKeyRef can't cross namespaces.
ogxDatabase:
  name: ogx
  owner: ogxserver
  vaultPath: ogx/postgresql-app

# Dedicated database/role per additional logical knowledge domain
# (ADR-0204, WP-21) - knowledge.sales / knowledge.sxa-legacy /
# knowledge.adv, each resolved from
# platform/bindings/knowledge/bindings.yaml by rag-service's per-domain
# pool registry. Same "bring your own password" mechanism and the same
# hyphenated-database-name / alphanumeric-owner constraints as
# ragTechDatabase above (rag-tech is knowledge.tech's database and already
# exists there). Cross-domain isolation is credential-enforced: each
# domain's role owns only its own database, so domain A's connection
# cannot read domain B (ADR-0204 acceptance) - never a shared superuser.
ragSalesDatabase:
  name: rag-sales
  owner: ragsales
  vaultPath: rag-sales/postgresql-app

ragSxaLegacyDatabase:
  name: rag-sxa-legacy
  owner: ragsxalegacy
  vaultPath: rag-sxa-legacy/postgresql-app

ragAdvDatabase:
  name: rag-adv
  owner: ragadv
  vaultPath: rag-adv/postgresql-app


# knowledge.project's database (ADR-0209, WP-28) - the fifth
# ADR-0204-pattern domain database, same "bring your own password"
# mechanism and constraints as ragSalesDatabase/ragAdvDatabase/
# ragSxaLegacyDatabase above. Holds structured project state, semantic
# project-memory chunks (both written by Agent Runtime's extraction step,
# never rag-ingestion) and the project_memberships table
# (data/rag/schema/005_project_memory.sql) the fail-closed ACL check at
# retrieval time reads.
ragProjectDatabase:
  name: rag-project
  owner: ragproject
  vaultPath: rag-project/postgresql-app

# Dedicated database/role for ADR-0212's persistent-conversation metadata
# (conversations/conversation_stars tables). One shared database, not one
# per agent unlike the ragXxxDatabase pattern above - conversation
# metadata is operationally a single, cross-agent concern, not a
# knowledge domain. Isolated from checkpointDatabase's agentcheckpoints
# role and every rag-* role (ADR-0212's own Security considerations:
# never share credentials between them). Same "bring your own password"
# mechanism as checkpointDatabase above, via
# templates/externalsecret-conversations.yaml.
conversationsDatabase:
  name: agent-conversations
  owner: agentconversations
  vaultPath: agent-runtime/conversations-postgresql-app

# Ansible Automation Platform (ADR-0354, WP-072) - four dedicated
# databases/roles, one per sub-component, same "bring your own password"
# mechanism and isolation rationale as keycloakDatabase above. Unlike
# every other consumer in this file, AAP's unified CR does NOT take one
# shared external-database secret: Gateway, Controller, Hub and EDA each
# own their own database configuration (confirmed live via `oc explain`,
# see ansible/roles/aap/README.md's "Per-component external database"
# table) - hence four blocks instead of one.
aapDatabase:
  name: aap
  owner: aapgateway
  vaultPath: aap/postgresql-app

aapControllerDatabase:
  name: aap-controller
  owner: aapcontroller
  vaultPath: aap-controller/postgresql-app

aapHubDatabase:
  name: aap-hub
  owner: aaphub
  vaultPath: aap-hub/postgresql-app

aapEdaDatabase:
  name: aap-eda
  owner: aapeda
  vaultPath: aap-eda/postgresql-app

# AAP 2.7's Automation Metrics service (auto-deployed by the AAP operator).
# With type: unmanaged postgres the operator cannot provision anything, so
# this database/role follows the same BYO-password pattern as the four AAP
# databases above.
aapMetricsDatabase:
  name: metricsservice
  owner: metricsservice
  vaultPath: aap-metrics/postgresql-app

# Read-only role the Metrics service uses to read the Controller database.
# Not a database of its own: PGO creates the role (spec.users entry with
# aap-controller in its databases list) and ansible/roles/postgresql's
# post-rollout SQL applies the actual SELECT-only grants.
aapMetricsReadOnly:
  owner: msawxreadonly
  vaultPath: aap-metrics/postgresql-awx-readonly
