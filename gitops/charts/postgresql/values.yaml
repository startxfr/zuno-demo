# Default values for the postgresql chart. See gitops/apps/postgresql/application.yaml
# for how this is deployed (namespace: postgresql) and
# gitops/charts/postgresql/image/README.md for the pgvector image build step.

image:
  # Built from gitops/charts/postgresql/image/Dockerfile (stock CNPG operand
  # image + `apt-get install postgresql-16-pgvector`). This is a placeholder
  # internal-registry reference — an operator must build and push this image
  # once (see image/README.md) before the Cluster below can start; point
  # this at wherever your cluster's image registry actually is.
  repository: image-registry.zuno-demo.internal/zuno/postgresql-pgvector
  tag: "16-bookworm"

cluster:
  name: zuno-postgresql
  # Demo scope: single instance, no automatic failover. ADR-0101 (v1,
  # Proposed) tracks HA for shared agent-platform services.
  instances: 1
  storageSize: 5Gi
  database: zuno
  owner: zuno_app

credentials:
  # Path under the vault-backend ClusterSecretStore's "secret" KV v2 mount
  # (i.e. resolves to Vault path secret/zuno/postgresql/app, already seeded
  # by ansible/roles/vault/tasks/configure.yml — this chart only consumes
  # it, never regenerates or hardcodes it, per ADR-0024).
  vaultPath: zuno/postgresql/app
  secretName: zuno-postgresql-app-credentials
  secretStoreName: vault-backend
  refreshInterval: 1h
