# Shared by two ArgoCD Applications: operator (zuno-postgresql-d0) renders
# the PGO Subscription, postgresCluster (zuno-postgresql-d1) renders the
# PostgresCluster/ConfigMap/ExternalSecret. Both default false so `helm
# template`/`helm lint` render nothing.
postgresCluster:
  enabled: false

# subscription.name/operator.channel/operator.source.name are all
# discovered at run time by ansible/roles/postgresql/tasks/install.yml and
# set via gitops_app_extra_helm_values. templates/checks.yaml fails the
# render if any is still empty once operator.enabled is true. No
# OperatorGroup: openshift-operators uses OpenShift's own default global
# one (AllNamespaces).
operator:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: postgresql
    app: postgresql
  subscription:
    enabled: true
    namespace: openshift-operators
    name: ""
    operator:
      # Must be set explicitly: the vendored `operator` chart defaults this to
      # "codeready-workspaces", silently suppressing the fallback to subscription.name.
      name: ""
      channel: ""
      installPlanApproval: Automatic  # startx chart defaults to Manual
      source:
        name: ""
        namespace: openshift-marketplace

postgresVersion: 18

# No image: override - PGO's default operand image for this version already
# bundles pgvector and supports TimescaleDB; templates/postgrescluster.yaml
# omits spec.image entirely.

# ADR-0101 (roadmap WP-12) originally added a topologySpreadConstraints
# block here, applied to both spec.instances and spec.proxy.pgBouncer in
# templates/postgrescluster.yaml. REVERTED 2026-08-14: it duplicated PGO's
# own injected default topology spread constraints and broke reconciliation
# - see that template's comments and the ADR-0101 incident note for details.

cluster:
  name: zuno-postgresql
  instances: 3  # HA: 1 primary + 2 async replicas, PGO/Patroni auto-failover
  storageClassName: gp3-csi
  storageSize: 200Gi
  walStorageSize: 50Gi  # separate volume: WAL write latency matters more than DATA's
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 16Gi
  database: zuno
  # No underscore/hyphen: PGO derives the pguser Secret name directly from
  # this ("<cluster>-pguser-<owner>"), and it must also be a valid unquoted
  # PostgreSQL identifier.
  owner: zunoapp

# TimescaleDB must be preloaded (unlike pgvector) - see
# templates/configmap-init-sql.yaml for the CREATE EXTENSION statements.
config:
  maxConnections: "200"
  logMinDurationStatement: "1000"

# PgBouncer in front of the 3 instances (transaction pooling), managed
# natively by PGO. Consumers connect to <cluster>-pgbouncer, not -primary.
pgBouncer:
  replicas: 2
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  poolMode: transaction
  maxClientConn: "500"
  defaultPoolSize: "50"

# PGO requires at least one pgBackRest repository; repo1 is always a local
# PVC. repo2 (S3, off-cluster) is added only once real credentials exist.
backups:
  storageSize: 500Gi
  s3:
    enabled: false
    bucket: ""
    endpoint: ""
    region: ""
    secretName: zuno-postgresql-backup-s3  # synced from Vault, only used when s3.enabled

credentials:
  # Resolves to Vault path zuno/postgresql/app; this chart only consumes
  # the credential, never generates it.
  vaultPath: postgresql/app
  # PGO's fixed naming convention ("<cluster>-pguser-<user>") is templated
  # in templates/externalsecret.yaml from cluster.name/cluster.owner
  # instead of set here, so the two don't need to agree independently.
  secretStoreName: vault-backend
  refreshInterval: 1h

# Dedicated database/role for Keycloak (ADR-0315) - not the same
# zunoapp/zuno pair every other consumer shares, to keep Keycloak's own
# schema/lifecycle isolated. Same PGO "bring your own password" mechanism
# as cluster.owner above, via templates/externalsecret-keycloak.yaml.
keycloakDatabase:
  name: keycloak
  owner: keycloak
  vaultPath: keycloak/postgresql-app

# Dedicated database/role for the rag-ingestion pipeline's structured
# corpus/index tables - same isolation rationale and "bring your own
# password" mechanism as keycloakDatabase above, via
# templates/externalsecret-ragtech.yaml. owner must be alphanumeric only
# (no hyphen, no underscore): it feeds PGO's "<cluster>-pguser-<owner>"
# Secret name, which is RFC 1123-constrained (rejects underscores) same
# as every other owner in this file, while database.name keeps the
# hyphen the platform's naming convention asks for - CONFIRM PGO quotes
# this identifier when creating the database (every other database name
# in this file avoids the hyphen precisely to sidestep that question;
# this one doesn't, per an explicit request - verify against a real PGO
# instance before relying on it, same "not exercised against a real
# cluster" caveat this role's README already carries elsewhere).
ragTechDatabase:
  name: rag-tech
  owner: ragtech
  vaultPath: rag/postgresql-app

# Dedicated database/role for RHOAI's Models-as-a-Service API (maas-api
# API-key/subscription store) - same isolation rationale and "bring your
# own password" mechanism as keycloakDatabase above, via
# templates/externalsecret-maas.yaml. The consumer-side Secret
# (maas-db-config in redhat-ods-applications) is rendered independently by
# gitops/charts/openshift-ai/templates/externalsecret-maas-db.yaml from the
# same Vault path, since secretKeyRef can't cross namespaces.
maasDatabase:
  name: maas
  owner: maas
  vaultPath: maas/postgresql-app

# Dedicated database/role for the Agent Runtime's LangGraph checkpointer
# (ADR-0103) - resumable workflow state, isolated from every other
# database on this cluster for the same reason ragTechDatabase/
# maasDatabase are. The hyphenated database name mirrors ragTechDatabase's
# "rag-tech" - confirmed working against the real zuno-postgresql
# PostgresCluster on 2026-08-14 (`oc get postgrescluster zuno-postgresql
# -n zuno-data -o jsonpath='{.spec.users}'` shows "rag-tech" already
# reconciled), so this is no longer an unverified assumption.
checkpointDatabase:
  name: agent-checkpoints
  owner: agentcheckpoints
  vaultPath: agent-runtime/postgresql-app

# Dedicated database/role for the OGX-backed RAG provider prototype's
# remote::pgvector vector I/O provider (ADR-0322 v0.1 integration scope) -
# isolated from every other database on this cluster for the same reason
# checkpointDatabase/ragTechDatabase are, and deliberately separate from
# the document_embeddings table rag-service's own pgvector provider reads
# (app/search.py) rather than a shared credential onto the same schema:
# ADR-0322's acceptance criteria call for OGX to *index* a controlled test
# corpus, not read the existing table directly, so its rows/schema are not
# expected to be identical. The consumer-side Secret (in
# redhat-ods-applications, labeled ogx.io/watch: "true" per the OGXServer
# CRD, confirmed via `oc explain ogxserver.spec.providers.vectorIo.remote.
# pgvector.password` against the live test cluster) is rendered
# independently by gitops/charts/openshift-ai/templates/ogxserver.yaml from
# the same Vault path, since secretKeyRef can't cross namespaces.
ogxDatabase:
  name: ogx
  owner: ogxserver
  vaultPath: ogx/postgresql-app

# Dedicated database/role per additional logical knowledge domain
# (ADR-0204, WP-21) - knowledge.sales / knowledge.sxa-legacy /
# knowledge.adv, each resolved from
# platform/bindings/knowledge/bindings.yaml by rag-service's per-domain
# pool registry. Same "bring your own password" mechanism and the same
# hyphenated-database-name / alphanumeric-owner constraints as
# ragTechDatabase above (rag-tech is knowledge.tech's database and already
# exists there). Cross-domain isolation is credential-enforced: each
# domain's role owns only its own database, so domain A's connection
# cannot read domain B (ADR-0204 acceptance) - never a shared superuser.
ragSalesDatabase:
  name: rag-sales
  owner: ragsales
  vaultPath: rag-sales/postgresql-app

ragSxaLegacyDatabase:
  name: rag-sxa-legacy
  owner: ragsxalegacy
  vaultPath: rag-sxa-legacy/postgresql-app

ragAdvDatabase:
  name: rag-adv
  owner: ragadv
  vaultPath: rag-adv/postgresql-app

# knowledge.project's database (ADR-0209, WP-28) - the fifth
# ADR-0204-pattern domain database, same "bring your own password"
# mechanism and constraints as ragSalesDatabase/ragAdvDatabase/
# ragSxaLegacyDatabase above. Holds structured project state, semantic
# project-memory chunks (both written by Agent Runtime's extraction step,
# never rag-ingestion) and the project_memberships table
# (data/rag/schema/005_project_memory.sql) the fail-closed ACL check at
# retrieval time reads.
ragProjectDatabase:
  name: rag-project
  owner: ragproject
  vaultPath: rag-project/postgresql-app
