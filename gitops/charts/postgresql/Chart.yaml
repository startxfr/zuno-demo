apiVersion: v2
name: postgresql
description: >-
  Zuno Demo PostgreSQL PostgresCluster (Crunchy Postgres Operator / PGO
  custom resource) and its Vault-backed application credentials
  ExternalSecret. Depends on startx's generic `operator` chart rather than
  `cluster-crunchy`, since the operator's package/channel/catalog are
  fuzzy-discovered at run time rather than fixed.
type: application
version: 0.2.0
appVersion: "16"
dependencies:
  - name: operator
    version: "21.3.277"
    repository: "alias:startx"
