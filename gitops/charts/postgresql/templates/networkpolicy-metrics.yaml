{{- if and .Values.monitoring.enabled .Values.postgresCluster.enabled }}
# Guarded by postgresCluster.enabled too, same reason as
# templates/podmonitor-postgres.yaml: without it, the operator-only release
# (operator.enabled) renders this same NetworkPolicy a second time in the
# shared zuno-data namespace, triggering ArgoCD SharedResourceWarning
# between zuno-postgresql-d0 and -d1.
# ADR-0413: admits prometheus-k8s's scrape of the crunchy-postgres-exporter
# sidecar (templates/podmonitor-postgres.yaml) - zuno-data's baseline is
# zuno-default-deny-other-namespaces (gitops/charts/namespaces), which
# admits neither openshift-monitoring nor openshift-user-workload-monitoring
# by default. Precise allow-list scoped to instance pods and the exporter
# port only, same pattern
# gitops/charts/openshift-ai/templates/maas-gateway.yaml and
# gitops/charts/models' networkpolicy*.yaml files use for the same purpose.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zuno-postgres-exporter-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  podSelector:
    matchLabels:
      postgres-operator.crunchydata.com/cluster: {{ .Values.cluster.name }}
      postgres-operator.crunchydata.com/data: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - protocol: TCP
          port: 9187
    # Same-namespace ingress on the database-internal ports. Because this
    # policy selects the instance pods at all, everything not listed here is
    # denied to them - which silently held only as long as every Postgres
    # connection rode the Istio sidecar tunnel (which slips past the L4
    # dport match). Once postgrescluster.yaml's
    # traffic.sidecar.istio.io/excludeInboundPorts made 5432/8432 direct
    # pod-to-pod (2026-08-24, see that template's comment), this policy
    # started dropping them: replica pg_basebackup bootstrap against the
    # primary timed out (readyReplicas stuck 1/3) and pgBackRest backup
    # Jobs timed out on every instance's 8432 - proven live by paired
    # /dev/tcp probes from a replica: 8008 (still Envoy-tunneled) OPEN,
    # 5432 (direct) TIMEOUT, with the primary healthy throughout.
    # 5432 = Postgres (replication/pgBouncer/the monitoring-role fixup Job,
    # which runs sidecar-less and connects to -primary directly);
    # 8432 = pgBackRest's own TLS server; 8008 = Patroni's API, today still
    # Envoy-tunneled but listed so a future exclusion widening can't
    # resurrect this same trap.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8432
        - protocol: TCP
          port: 8008
    # Cross-namespace direct-to-primary consumers, port 5432 only (never
    # 8432/8008 - pgBackRest/Patroni stay same-namespace-internal). This
    # rule is what the comment above used to (wrongly) claim didn't exist -
    # "cross-namespace consumers reach PgBouncer, not these pods" was true
    # for every consumer except Keycloak, which deliberately bypasses
    # PgBouncer's transaction-mode pooling for prepared-statement support
    # (ADR-0315, gitops/charts/keycloak/values.yaml's postgresqlHost
    # comment) - the same reasoning ADR-0354/WP-072 reused for AAP's four
    # sub-components. Found live 2026-08-24/25: this policy's same-
    # namespace-only 5432 rule, once the Istio tunnel stopped silently
    # bypassing it, broke Keycloak's own primary connection first
    # (zuno-0 CrashLoopBackOff, 80+ restarts) before AAP Gateway's DB
    # migration hit the identical timeout. Named explicitly rather than
    # opened to "any namespace" - only the namespaces that actually run a
    # direct-to-primary consumer.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-auth
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-aap
        # ADR-0517 live finding (demo333, 2026-09-07): RHOAI's ogx
        # (pgvector provider) and maas-db both connect direct-to-primary
        # from redhat-ods-applications - deliberately, for the same
        # transaction-mode-pooling reason as Keycloak/AAP above
        # (gitops/charts/openshift-ai/values.yaml's host comments). On a
        # fresh cluster zuno-ogx crash-looped for 80+ minutes on
        # "Connection reset by peer"/recv timeout: its SYN reached the
        # instance pods directly (5432 is sidecar-excluded) and this
        # policy dropped it - the client-side TCP connect still
        # "succeeds" against the local Envoy, which is what made the
        # probe lie (netpol-egress-mesh-pod-verification). demo222 never
        # showed it for the usual reason: its ogx predates the
        # port-exclusion flip that made 5432 direct.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ods-applications
        # ADR-0517 live finding (demo333, 2026-09-08, post-restart): the
        # redhat-ods-applications rule above covers where our own chart
        # renders the maas-db-config Secret, but RHOAI's ModelsAsService
        # operator (maas.opendatahub.io/v1alpha1 Config/default) actually
        # runs the maas-api gateway Deployment itself in its own
        # operator-generated namespace, redhat-ai-gateway-infra - a
        # different namespace than the Secret's targetNamespace. Same
        # direct-to-primary reasoning (values.yaml's maasDb.host comment).
        # First seen live once maas-api actually ran long enough to attempt
        # a real connection: TCP connect "succeeded" (local Envoy), the
        # Postgres protocol exchange hung ~57s until the liveness probe
        # killed the pod, CrashLoopBackOff with no app-level error logged -
        # same lying-probe shape as the redhat-ods-applications/zuno-ogx
        # case above.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ai-gateway-infra
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
