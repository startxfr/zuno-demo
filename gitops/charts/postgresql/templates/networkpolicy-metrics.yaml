{{- if and .Values.monitoring.enabled .Values.postgresCluster.enabled }}
# Guarded by postgresCluster.enabled too, same reason as
# templates/podmonitor-postgres.yaml: without it, the operator-only release
# (operator.enabled) renders this same NetworkPolicy a second time in the
# shared zuno-data namespace, triggering ArgoCD SharedResourceWarning
# between zuno-postgresql-d0 and -d1.
# ADR-0413: admits prometheus-k8s's scrape of the crunchy-postgres-exporter
# sidecar (templates/podmonitor-postgres.yaml) - zuno-data's baseline is
# zuno-default-deny-other-namespaces (gitops/charts/namespaces), which
# admits neither openshift-monitoring nor openshift-user-workload-monitoring
# by default. Precise allow-list scoped to instance pods and the exporter
# port only, same pattern
# gitops/charts/openshift-ai/templates/maas-gateway.yaml and
# gitops/charts/models' networkpolicy*.yaml files use for the same purpose.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zuno-postgres-exporter-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  podSelector:
    matchLabels:
      postgres-operator.crunchydata.com/cluster: {{ .Values.cluster.name }}
      postgres-operator.crunchydata.com/data: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - protocol: TCP
          port: 9187
    # Same-namespace ingress on the database-internal ports. Because this
    # policy selects the instance pods at all, everything not listed here is
    # denied to them - which silently held only as long as every Postgres
    # connection rode the Istio sidecar tunnel (which slips past the L4
    # dport match). Once postgrescluster.yaml's
    # traffic.sidecar.istio.io/excludeInboundPorts made 5432/8432 direct
    # pod-to-pod (2026-08-24, see that template's comment), this policy
    # started dropping them: replica pg_basebackup bootstrap against the
    # primary timed out (readyReplicas stuck 1/3) and pgBackRest backup
    # Jobs timed out on every instance's 8432 - proven live by paired
    # /dev/tcp probes from a replica: 8008 (still Envoy-tunneled) OPEN,
    # 5432 (direct) TIMEOUT, with the primary healthy throughout.
    # 5432 = Postgres (replication/pgBouncer/the monitoring-role fixup Job,
    # which runs sidecar-less and connects to -primary directly);
    # 8432 = pgBackRest's own TLS server; 8008 = Patroni's API, today still
    # Envoy-tunneled but listed so a future exclusion widening can't
    # resurrect this same trap. Same-namespace scope (bare podSelector)
    # matches the platform baseline's "same-namespace traffic is always
    # allowed" stance (gitops/charts/namespaces' default-deny policy);
    # cross-namespace consumers reach PgBouncer, not these pods.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8432
        - protocol: TCP
          port: 8008
{{- end }}
