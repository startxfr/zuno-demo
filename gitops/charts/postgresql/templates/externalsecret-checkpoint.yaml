{{- if .Values.postgresCluster.enabled }}
# Syncs the pre-seeded Vault zuno/agent-runtime/postgresql-app credential
# into the Secret PGO expects at "<cluster>-pguser-<user>" for the
# dedicated Agent Runtime checkpoint database/role (ADR-0103), same "bring
# your own password" mechanism as templates/externalsecret-ragtech.yaml.
#
# WP-156: its client, agent-runtime, is retired; this Secret stays with the
# PGO user until a reviewed live step drops both (see values.yaml).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.cluster.name }}-pguser-{{ .Values.checkpointDatabase.owner }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.cluster.name }}-pguser-{{ .Values.checkpointDatabase.owner }}
    # Merge, not Owner and not Orphan: see templates/externalsecret.yaml.
    creationPolicy: {{ .Values.credentials.pguserCreationPolicy }}
    template:
      # PGO identifies an externally-managed pguser Secret by these labels.
      metadata:
        labels:
          postgres-operator.crunchydata.com/cluster: {{ .Values.cluster.name }}
          postgres-operator.crunchydata.com/pguser: {{ .Values.checkpointDatabase.owner }}
  data:
    - secretKey: user
      remoteRef:
        key: {{ .Values.checkpointDatabase.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.checkpointDatabase.vaultPath }}
        property: password
{{- end }}
