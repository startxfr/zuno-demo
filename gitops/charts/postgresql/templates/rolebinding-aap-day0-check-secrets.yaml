{{- if and .Values.postgresCluster.enabled .Values.backups.s3.enabled }}
# Targeted widening beyond cluster-reader (ADR-0354 Security considerations,
# "widen with a targeted extra Role, never a broader built-in" - same
# rationale and shape as gitops/charts/aap-config/templates/
# rolebinding-rhtas-signer-secret.yaml and gitops/charts/connectivity-link/
# templates/rolebinding-aap-day0-check-secrets.yaml, whose placement inside
# the resource-owning chart this file mirrors).
#
# Live finding (demo333, 2026-09-09/10): ansible/roles/postgresql/tasks/
# resolve_backup_s3_creds.yml's Secret lookup (added 2026-09-08, commit
# 464f8348, for the "no ansible/confidential.yml inside AAP" in-cluster S3
# fallback) 403'd under aap-day0-check/cluster-reader on every *-check Job
# Template run - that ClusterRole excludes Secrets entirely, everywhere,
# by design. Scoped to `get` on this one named Secret, nothing else - same
# shape as rolebinding-rhtas-signer-secret.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zuno-aap-day0-check-postgresql-backup-s3-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zuno-postgresql-backup-s3"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zuno-aap-day0-check-postgresql-backup-s3-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zuno-aap-day0-check-postgresql-backup-s3-secret-reader
subjects:
  # The cluster-reader tier's ServiceAccount specifically - see
  # .Values.dayCheck's own comment for why name/namespace are a manually
  # kept-in-sync mirror of aap-config's values rather than a shared value.
  - kind: ServiceAccount
    name: {{ .Values.dayCheck.serviceAccount }}
    namespace: {{ .Values.dayCheck.namespace }}
{{- end }}
