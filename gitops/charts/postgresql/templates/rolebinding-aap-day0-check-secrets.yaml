{{- if and .Values.postgresCluster.enabled .Values.backups.s3.enabled }}
# Targeted widening beyond cluster-reader (ADR-0354 Security considerations,
# "widen with a targeted extra Role, never a broader built-in" - same
# rationale and shape as gitops/charts/aap-config/templates/
# rolebinding-rhtas-signer-secret.yaml and gitops/charts/connectivity-link/
# templates/rolebinding-aap-day0-check-secrets.yaml, whose placement inside
# the resource-owning chart this file mirrors).
#
# Two live findings (demo333, 2026-09-09/10), both under *-check Job
# Templates (credential zuno-cluster-reader -> ServiceAccount aap-day0-check
# -> ClusterRole cluster-reader, which excludes Secrets entirely, everywhere,
# by design) touching ansible/roles/postgresql's S3 backup cross-check
# (WP-131 P0):
#
#   1. resolve_backup_s3_creds.yml's in-cluster S3 fallback (commit
#      464f8348) reads the real zuno-postgresql-backup-s3 Secret - `get`
#      only, that Secret already exists and this task never writes it.
#   2. check_s3_backup.yml's own probe creates a THROWAWAY
#      zuno-postgresql-check-s3-backup-creds Secret and a throwaway
#      zuno-postgresql-check-s3-backup Job for every *-check run (not just
#      restores), then deletes both - needing create/update/delete on top
#      of cluster-reader's existing get/list/watch on jobs (confirmed live:
#      cluster-reader already grants batch/jobs and pods/log read, so only
#      the write verbs below were missing).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zuno-aap-day0-check-postgresql-s3check
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zuno-postgresql-backup-s3"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zuno-postgresql-check-s3-backup-creds"]
    verbs: ["get", "update", "patch", "delete"]
  # create cannot be scoped by resourceNames (the object doesn't exist yet
  # at authorization time) - still confined to this one Role/namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames: ["zuno-postgresql-check-s3-backup"]
    verbs: ["delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zuno-aap-day0-check-postgresql-s3check
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zuno-aap-day0-check-postgresql-s3check
subjects:
  # The cluster-reader tier's ServiceAccount specifically - see
  # .Values.dayCheck's own comment for why name/namespace are a manually
  # kept-in-sync mirror of aap-config's values rather than a shared value.
  - kind: ServiceAccount
    name: {{ .Values.dayCheck.serviceAccount }}
    namespace: {{ .Values.dayCheck.namespace }}
{{- end }}
