{{- if .Values.postgresCluster.enabled }}
# Syncs the pre-seeded Vault zuno/aap-eda/postgresql-app credential into
# the Secret PGO expects at "<cluster>-pguser-<user>" for AAP EDA's
# dedicated database/role - see templates/externalsecret-aap.yaml for the
# shared rationale.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.cluster.name }}-pguser-{{ .Values.aapEdaDatabase.owner }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.cluster.name }}-pguser-{{ .Values.aapEdaDatabase.owner }}
    # Merge, not Owner and not Orphan: see templates/externalsecret.yaml.
    creationPolicy: {{ .Values.credentials.pguserCreationPolicy }}
    template:
      metadata:
        labels:
          postgres-operator.crunchydata.com/cluster: {{ .Values.cluster.name }}
          postgres-operator.crunchydata.com/pguser: {{ .Values.aapEdaDatabase.owner }}
  data:
    - secretKey: user
      remoteRef:
        key: {{ .Values.aapEdaDatabase.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.aapEdaDatabase.vaultPath }}
        property: password
{{- end }}
