{{- if .Values.postgresCluster.enabled }}
# Syncs the pre-seeded Vault zuno/postgresql/app credential into the
# Secret PGO expects at "<cluster>-pguser-<user>" (PGO's "bring your own
# password": pre-create this Secret before the PostgresCluster exists, and
# PGO adopts the password instead of generating its own).
#
# the rag-service and rag-ingestion components read the same
# underlying credential via their own separate ExternalSecrets, since this
# PGO-managed Secret doesn't exist yet the first time those Jobs run.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.cluster.name }}-pguser-{{ .Values.cluster.owner }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.cluster.name }}-pguser-{{ .Values.cluster.owner }}
    # Merge - NOT Owner, and no longer Orphan. This is the canonical
    # explanation the other 16 pguser ExternalSecrets cite.
    #
    # Not Owner: PGO also sets itself as this Secret's controlling owner once
    # the PostgresCluster exists, and Kubernetes rejects a second
    # controller:true ownerReference on the same object.
    #
    # Not Orphan (ADR-0526, 2026-08-27): Orphan's write is destructive. It
    # replaces .data wholesale with the user+password pair below, deleting
    # the verifier/uri/jdbc-uri/host/port/dbname/pgbouncer-* keys PGO
    # maintains here. PGO re-adds them; ESO's
    # reconcile.external-secrets.io/data-hash annotation - the hash of its
    # own two-key view - then permanently disagrees with the real content, so
    # isSecretValid() never passes and ESO rewrites on every event rather
    # than on refreshInterval. (That is also why refreshInterval: 0 does not
    # help: it only gates shouldRefresh.) PGO regenerates the verifier
    # whenever it is empty, and SCRAM salting is random, so each cycle
    # produced a DIFFERENT verifier pushed with ALTER ROLE. Measured live:
    # key set flipping 2<->12 every ~8s and pg_authid.rolpassword rewritten
    # every ~10s, on all 17 roles, indefinitely. A long-lived client whose
    # SCRAM session outlived pgbouncer's 3600s server_lifetime then failed to
    # re-login - that is what killed the 2026-08-27 ingestion run (WP-084).
    #
    # Merge removes and re-adds only its own managed keys, so both
    # controllers' writes become no-ops. Its one cost is that Merge does not
    # CREATE a missing Secret, which the ansible pre-creation step covers -
    # see values.yaml credentials.pguserCreationPolicy.
    creationPolicy: {{ .Values.credentials.pguserCreationPolicy }}
    template:
      # PGO identifies an externally-managed pguser Secret by these labels.
      metadata:
        labels:
          postgres-operator.crunchydata.com/cluster: {{ .Values.cluster.name }}
          postgres-operator.crunchydata.com/pguser: {{ .Values.cluster.owner }}
  data:
    - secretKey: user
      remoteRef:
        key: {{ .Values.credentials.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.credentials.vaultPath }}
        property: password
{{- end }}
