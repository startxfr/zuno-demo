# Syncs the pre-seeded Vault secret/zuno/postgresql/app path (username
# zuno_app, auto-generated password — seeded by
# ansible/roles/vault/tasks/configure.yml) into a Kubernetes Secret this
# Cluster's bootstrap.initdb.secret references, and that
# ansible/roles/sql_schema and components/mcp-servers/sales-db also read
# from (each in their own namespace, via their own ExternalSecret pointing
# at the same Vault path). Never hardcode this credential — ADR-0024.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.credentials.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.credentials.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.credentials.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.credentials.vaultPath }}
        property: password
