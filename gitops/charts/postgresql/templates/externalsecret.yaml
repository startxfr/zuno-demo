{{- if .Values.postgresCluster.enabled }}
# Syncs the pre-seeded Vault zuno/postgresql/app credential into the
# Secret PGO expects at "<cluster>-pguser-<user>" (PGO's "bring your own
# password": pre-create this Secret before the PostgresCluster exists, and
# PGO adopts the password instead of generating its own).
#
# ansible/roles/sql_schema and the sales-db MCP server read the same
# underlying credential via their own separate ExternalSecrets, since this
# PGO-managed Secret doesn't exist yet the first time those Jobs run.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.cluster.name }}-pguser-{{ .Values.cluster.owner }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.cluster.name }}-pguser-{{ .Values.cluster.owner }}
    # Orphan, not Owner: PGO also sets itself as this Secret's controlling
    # owner once the PostgresCluster exists, and Kubernetes rejects a
    # second controller:true ownerReference on the same object.
    creationPolicy: Orphan
    template:
      # PGO identifies an externally-managed pguser Secret by these labels.
      metadata:
        labels:
          postgres-operator.crunchydata.com/cluster: {{ .Values.cluster.name }}
          postgres-operator.crunchydata.com/pguser: {{ .Values.cluster.owner }}
  data:
    - secretKey: user
      remoteRef:
        key: {{ .Values.credentials.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.credentials.vaultPath }}
        property: password
{{- end }}
