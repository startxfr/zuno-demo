{{- if .Values.postgresCluster.enabled }}
# Syncs the pre-seeded Vault zuno/postgresql/app path (username
# {{ .Values.cluster.owner }}, auto-generated password - seeded by
# ansible/roles/vault/tasks/install.yml) into the Kubernetes Secret PGO
# expects at "<cluster>-pguser-<user>" - PGO's own fixed naming
# convention (>= 5.6's "bring your own password": pre-create this exact
# Secret, with these two labels, before the PostgresCluster exists, and
# PGO adopts the password instead of generating its own). This is the
# Vault-backed equivalent of what this chart did for CloudNativePG's
# bootstrap.initdb.secret before the ADR-0015 operator swap - never
# hardcode this credential (ADR-0024).
#
# ansible/roles/sql_schema and components/mcp-servers/sales-db also read
# the same underlying credential, each via their own ExternalSecret
# pointing at the same Vault path into their own differently-named Secret
# (they don't consume this PGO-managed Secret directly, since it doesn't
# exist yet the first time those roles' Jobs run).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.cluster.name }}-pguser-{{ .Values.cluster.owner }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.cluster.name }}-pguser-{{ .Values.cluster.owner }}
    # Orphan, not the default Owner: PGO's "bring your own password"
    # adoption also sets itself as this Secret's controlling owner once
    # the PostgresCluster exists - Kubernetes rejects a second
    # ownerReference with controller:true on the same object, so Owner
    # here made PGO's reconciler fail every pass with "Only one reference
    # can have Controller set to true" (found live on
    # api.demo222.startx.fr - PGO's reconciler error blocked it from ever
    # getting far enough to create the pgbackrest-config ConfigMap,
    # surfacing as an unrelated-looking MountVolume.SetUp failure on the
    # instance pod). Orphan still creates the Secret with the right data/
    # labels for PGO to adopt, just without ESO claiming ownership of it.
    creationPolicy: Orphan
    template:
      # PGO identifies an externally-managed pguser Secret by these two
      # labels (postgres-operator.crunchydata.com/{cluster,pguser}) -
      # ExternalSecret's own target.template is how we attach labels
      # ESO's synced Secret wouldn't otherwise carry.
      metadata:
        labels:
          postgres-operator.crunchydata.com/cluster: {{ .Values.cluster.name }}
          postgres-operator.crunchydata.com/pguser: {{ .Values.cluster.owner }}
  data:
    - secretKey: user
      remoteRef:
        key: {{ .Values.credentials.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.credentials.vaultPath }}
        property: password
{{- end }}
