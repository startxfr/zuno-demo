{{- if .Values.postgresCluster.enabled }}
# Syncs the pre-seeded Vault zuno/kagent/postgresql-app credential into the
# Secret PGO expects at "<cluster>-pguser-<user>" for the dedicated kagent
# role owning kagent's database (ADR-0600/WP-207),
# same "bring your own password" mechanism as templates/externalsecret-maas.yaml.
#
# gitops/charts/kagent resolves the same Vault path independently, via its own
# ExternalSecret, because the kagent pods read their database password from a
# Secret in zuno-kagent and secretKeyRef can't cross namespaces.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.cluster.name }}-pguser-{{ .Values.kagentDatabase.owner }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  # ADR-0602/WP-223: this namespace's own SecretStore, which reads only the keys platform/vault/secret-access.yaml grants it.
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ .Values.cluster.name }}-pguser-{{ .Values.kagentDatabase.owner }}
    # Merge, not Owner and not Orphan: see templates/externalsecret.yaml.
    creationPolicy: {{ .Values.credentials.pguserCreationPolicy }}
    template:
      # PGO identifies an externally-managed pguser Secret by these labels.
      metadata:
        labels:
          postgres-operator.crunchydata.com/cluster: {{ .Values.cluster.name }}
          postgres-operator.crunchydata.com/pguser: {{ .Values.kagentDatabase.owner }}
  data:
    - secretKey: user
      remoteRef:
        key: {{ .Values.kagentDatabase.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.kagentDatabase.vaultPath }}
        property: password
{{- end }}
