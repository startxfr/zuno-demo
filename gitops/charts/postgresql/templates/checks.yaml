{{- /*
Fails the render if the operator is enabled without a discovered package
name/channel/catalog source - same fail-fast guard this chart's previous
local Subscription template enforced with Helm's `required` function
(ADR-0048). The vendored `operator` chart's own Subscription template has
no such guard, so it is preserved here instead. Renders no resource - only
a whitespace-only string when the checks pass, which Helm strips from the
manifest set.
*/ -}}
{{- if .Values.operator.enabled -}}
{{- if not .Values.operator.subscription.name -}}
{{- fail "operator.subscription.name (the package name) must be set via gitops_app_extra_helm_values (ADR-0048)" -}}
{{- end -}}
{{- if not .Values.operator.subscription.operator.name -}}
{{- fail "operator.subscription.operator.name (same package name as subscription.name) must be set via gitops_app_extra_helm_values (ADR-0048)" -}}
{{- end -}}
{{- if not .Values.operator.subscription.operator.channel -}}
{{- fail "operator.subscription.operator.channel must be set via gitops_app_extra_helm_values (ADR-0048)" -}}
{{- end -}}
{{- if not .Values.operator.subscription.operator.source.name -}}
{{- fail "operator.subscription.operator.source.name must be set via gitops_app_extra_helm_values (ADR-0048)" -}}
{{- end -}}
{{- end -}}
