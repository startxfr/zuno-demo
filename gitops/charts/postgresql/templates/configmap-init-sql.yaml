{{- if .Values.postgresCluster.enabled }}
# Referenced by templates/postgrescluster.yaml's spec.databaseInitSQL; PGO
# runs this once at cluster bootstrap. Databases added to spec.users after
# that first bootstrap (ragTechDatabase, maasDatabase, checkpointDatabase,
# ogxDatabase) do NOT get this script re-run - VERIFIED live, 2026-08-13:
# maas-api hit "permission denied for schema public" because the grant
# below didn't exist yet when maasDatabase was added; the GRANT had to be
# applied by hand once against the already-running cluster. Adding a new
# dedicated database to an existing cluster always needs that same one-time
# manual GRANT (checkpointDatabase/ogxDatabase needed it too - see
# docs/adr/0101-provide-ha-for-shared-agent-platform-services.md).
# \connect is required: databaseInitSQL runs against the "postgres"
# database regardless of spec.users[].databases, not the app database.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.cluster.name }}-init-sql
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
data:
  init.sql: |
    \set ON_ERROR_STOP on
    -- PGO grants each spec.users[] entry database-level CONNECT/TEMP/CREATE
    -- via GRANT, but leaves "postgres" as the actual database owner - it
    -- never reassigns ownership. Since PG15, the public schema is owned by
    -- the pg_database_owner pseudo-role (= whoever owns the database), so
    -- without this explicit grant the app user can create new schemas but
    -- can't create objects in the pre-existing public schema itself
    -- (confirmed live: Keycloak's Liquibase migration failed with
    -- "permission denied for schema public" for exactly this reason).
    \connect {{ .Values.cluster.database }}
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS timescaledb;
    GRANT ALL ON SCHEMA public TO {{ .Values.cluster.owner }};

    \connect {{ .Values.keycloakDatabase.name }}
    GRANT ALL ON SCHEMA public TO {{ .Values.keycloakDatabase.owner }};

    -- CREATE EXTENSION needs superuser; every embeddings-bearing database
    -- must get it here, NOT in the per-domain schema-apply Jobs (those run
    -- as the unprivileged domain owner role - VERIFIED live 2026-08-15:
    -- zuno-rag-schema-apply-tech failed with "permission denied to create
    -- extension \"vector\"" / "Must be superuser"). Same once-at-bootstrap
    -- caveat as the GRANTs above: on an existing cluster these statements
    -- must be applied by hand once for each database added after bootstrap.
    \connect {{ .Values.ragTechDatabase.name }}
    CREATE EXTENSION IF NOT EXISTS vector;
    GRANT ALL ON SCHEMA public TO {{ .Values.ragTechDatabase.owner }};

    \connect {{ .Values.maasDatabase.name }}
    GRANT ALL ON SCHEMA public TO {{ .Values.maasDatabase.owner }};

    \connect {{ .Values.checkpointDatabase.name }}
    GRANT ALL ON SCHEMA public TO {{ .Values.checkpointDatabase.owner }};

    \connect {{ .Values.ogxDatabase.name }}
    CREATE EXTENSION IF NOT EXISTS vector;
    GRANT ALL ON SCHEMA public TO {{ .Values.ogxDatabase.owner }};

    \connect {{ .Values.ragSalesDatabase.name }}
    CREATE EXTENSION IF NOT EXISTS vector;
    GRANT ALL ON SCHEMA public TO {{ .Values.ragSalesDatabase.owner }};

    \connect {{ .Values.ragSxaLegacyDatabase.name }}
    CREATE EXTENSION IF NOT EXISTS vector;
    GRANT ALL ON SCHEMA public TO {{ .Values.ragSxaLegacyDatabase.owner }};

    \connect {{ .Values.ragAdvDatabase.name }}
    CREATE EXTENSION IF NOT EXISTS vector;
    GRANT ALL ON SCHEMA public TO {{ .Values.ragAdvDatabase.owner }};

    \connect {{ .Values.ragProjectDatabase.name }}
    CREATE EXTENSION IF NOT EXISTS vector;
    GRANT ALL ON SCHEMA public TO {{ .Values.ragProjectDatabase.owner }};

    -- Plain relational conversation metadata (ADR-0212) - no pgvector
    -- needed, unlike the embeddings-bearing databases above.
    \connect {{ .Values.conversationsDatabase.name }}
    GRANT ALL ON SCHEMA public TO {{ .Values.conversationsDatabase.owner }};
{{- end }}
