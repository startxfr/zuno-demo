{{- if .Values.postgresCluster.enabled }}
# Referenced by templates/postgrescluster.yaml's spec.databaseInitSQL -
# PGO runs this once at cluster bootstrap, per Crunchy's own Extension
# Management guide's documented pattern for adding extensions this way.
# TimescaleDB additionally needs shared_preload_libraries=timescaledb
# (spec.config.parameters in postgrescluster.yaml) - CREATE EXTENSION
# alone isn't enough for it, unlike pgvector.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.cluster.name }}-init-sql
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS timescaledb;
{{- end }}
