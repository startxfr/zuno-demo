{{- if .Values.postgresCluster.enabled }}
# Syncs the pre-seeded Vault zuno/keycloak/postgresql-app credential into
# the Secret PGO expects at "<cluster>-pguser-<user>" for the dedicated
# Keycloak database/role (ADR-0315) - same "bring your own password"
# mechanism as templates/externalsecret.yaml for cluster.owner.
#
# gitops/charts/keycloak resolves the same Vault path independently, via
# its own ExternalSecret (templates/externalsecret-postgresql.yaml), since
# this Secret lives in zuno-data and Keycloak's pod lives in zuno-auth -
# secretKeyRef can't cross namespaces.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.cluster.name }}-pguser-{{ .Values.keycloakDatabase.owner }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.cluster.name }}-pguser-{{ .Values.keycloakDatabase.owner }}
    # Merge, not Owner and not Orphan: see templates/externalsecret.yaml.
    creationPolicy: {{ .Values.credentials.pguserCreationPolicy }}
    template:
      # PGO identifies an externally-managed pguser Secret by these labels.
      metadata:
        labels:
          postgres-operator.crunchydata.com/cluster: {{ .Values.cluster.name }}
          postgres-operator.crunchydata.com/pguser: {{ .Values.keycloakDatabase.owner }}
  data:
    - secretKey: user
      remoteRef:
        key: {{ .Values.keycloakDatabase.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.keycloakDatabase.vaultPath }}
        property: password
{{- end }}
