{{- if .Values.postgresCluster.enabled }}
# Syncs the pre-seeded Vault aap-metrics/postgresql-awx-readonly credential
# into the Secret PGO expects at "<cluster>-pguser-<user>" for the
# Metrics service's read-only Controller-database role (same BYO-password
# mechanism as templates/externalsecret-aap.yaml). PGO only creates the
# role and database-level access; the SELECT-only table grants come from
# ansible/roles/postgresql's post-rollout SQL.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.cluster.name }}-pguser-{{ .Values.aapMetricsReadOnly.owner }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.cluster.name }}-pguser-{{ .Values.aapMetricsReadOnly.owner }}
    # Merge, not Owner and not Orphan: see templates/externalsecret.yaml.
    creationPolicy: {{ .Values.credentials.pguserCreationPolicy }}
    template:
      # PGO identifies an externally-managed pguser Secret by these labels.
      metadata:
        labels:
          postgres-operator.crunchydata.com/cluster: {{ .Values.cluster.name }}
          postgres-operator.crunchydata.com/pguser: {{ .Values.aapMetricsReadOnly.owner }}
  data:
    - secretKey: user
      remoteRef:
        key: {{ .Values.aapMetricsReadOnly.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.aapMetricsReadOnly.vaultPath }}
        property: password
{{- end }}
