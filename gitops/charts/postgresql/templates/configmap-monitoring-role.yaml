{{- if and .Values.monitoring.enabled .Values.postgresCluster.enabled }}
# Mounted by job-monitoring-role.yaml's Sync-hook Job at /sql (ConfigMap+`-f`
# pattern, same as gitops/charts/rag-service).
# The SQL avoids a DO/PL-pgSQL block on purpose: psql's `:'var'` colon-
# interpolation is skipped entirely inside dollar-quoted strings (`$$...$$`
# or `$tag$...$tag$`), by design, live-verified 2026-08-24 - a `DO $$ ... :
# 'pass' ... $$;` body never gets the password substituted, however the SQL
# is delivered. The `format(...)`+`\gexec` pattern below keeps every `:'pass'`
# reference in plain top-level SQL, outside any dollar-quoting, where
# interpolation does work (also live-verified, but only via `-f`/script mode
# - `-c` never interpolates `:'var'` at all, which is the separate reason
# this Job uses `-f` instead of inlining the SQL into `-c` args).
# Sync-wave "-1" (before the Job's wave "0") so it's guaranteed to exist
# before the hook Job that mounts it runs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.cluster.name }}-monitoring-role
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: postgresql
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  monitoring-role.sql: |
{{ .Files.Get "files/sql/monitoring-role.sql" | indent 4 }}
{{- end }}
