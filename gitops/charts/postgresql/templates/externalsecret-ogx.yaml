{{- if .Values.postgresCluster.enabled }}
# Syncs the pre-seeded Vault zuno/ogx/postgresql-app credential into the
# Secret PGO expects at "<cluster>-pguser-<user>" for the dedicated OGX
# vector I/O provider database/role (ADR-0322 v0.1 integration scope),
# same "bring your own password" mechanism as
# templates/externalsecret-checkpoint.yaml.
#
# gitops/charts/openshift-ai resolves the same Vault path independently,
# via its own ExternalSecret, since this Secret lives in zuno-data and the
# OGXServer CR lives in redhat-ods-applications - secretKeyRef can't cross
# namespaces (same pattern as templates/externalsecret-maas.yaml /
# gitops/charts/openshift-ai/templates/externalsecret-maas-db.yaml).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.cluster.name }}-pguser-{{ .Values.ogxDatabase.owner }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.cluster.name }}-pguser-{{ .Values.ogxDatabase.owner }}
    # Merge, not Owner and not Orphan: see templates/externalsecret.yaml.
    creationPolicy: {{ .Values.credentials.pguserCreationPolicy }}
    template:
      # PGO identifies an externally-managed pguser Secret by these labels.
      metadata:
        labels:
          postgres-operator.crunchydata.com/cluster: {{ .Values.cluster.name }}
          postgres-operator.crunchydata.com/pguser: {{ .Values.ogxDatabase.owner }}
  data:
    - secretKey: user
      remoteRef:
        key: {{ .Values.ogxDatabase.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.ogxDatabase.vaultPath }}
        property: password
{{- end }}
