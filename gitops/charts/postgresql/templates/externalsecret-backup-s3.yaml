{{- if and .Values.postgresCluster.enabled .Values.backups.s3.enabled }}
# Syncs the pgBackRest S3 repo2 credentials (ansible/roles/vault/tasks/
# install.yml seeds zuno/postgresql/backup-s3 from ansible/confidential.yml)
# into the pgbackrest-style "s3.conf" file PGO expects, referenced by
# templates/postgrescluster.yaml's spec.backups.pgbackrest.configuration.
# UNVERIFIED: the repo2-s3-key/repo2-s3-key-secret option names and the
# "s3.conf" file shape are reconstructed from Crunchy's general pgBackRest
# S3 documentation, not confirmed against a live PGO 5.8.8 cluster - adjust
# if the actual CRD/pgBackRest version expects something different.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.backups.s3.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.backups.s3.secretName }}
    creationPolicy: Owner
    template:
      data:
        s3.conf: |
          [global]
          repo2-s3-key={{ "{{" }} .accessKey {{ "}}" }}
          repo2-s3-key-secret={{ "{{" }} .secretKey {{ "}}" }}
  data:
    - secretKey: accessKey
      remoteRef:
        key: postgresql/backup-s3
        property: access_key
    - secretKey: secretKey
      remoteRef:
        key: postgresql/backup-s3
        property: secret_key
{{- end }}
