{{- if and .Values.postgresCluster.enabled .Values.backups.s3.enabled }}
# Syncs pgBackRest S3 repo2 credentials into the "s3.conf" file PGO
# expects, referenced by templates/postgrescluster.yaml's
# spec.backups.pgbackrest.configuration.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.backups.s3.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.backups.s3.secretName }}
    creationPolicy: Owner
    template:
      data:
        s3.conf: |
          [global]
          repo2-s3-key={{ "{{" }} .accessKey {{ "}}" }}
          repo2-s3-key-secret={{ "{{" }} .secretKey {{ "}}" }}
  data:
    - secretKey: accessKey
      remoteRef:
        key: postgresql/backup-s3
        property: access_key
    - secretKey: secretKey
      remoteRef:
        key: postgresql/backup-s3
        property: secret_key
{{- end }}
