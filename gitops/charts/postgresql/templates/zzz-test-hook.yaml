apiVersion: batch/v1
kind: Job
metadata:
  name: zzz-hook-diagnostic-test
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: test
          image: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/postgres:16-bookworm
          command: ["true"]
