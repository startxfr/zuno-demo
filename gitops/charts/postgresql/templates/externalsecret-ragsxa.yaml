{{- if .Values.postgresCluster.enabled }}
# Syncs the pre-seeded Vault zuno/rag-sxa/postgresql-app credential into
# the Secret PGO expects at "<cluster>-pguser-<user>" for the dedicated
# rag-sxa database/role (knowledge.sxa, ADR-0217/WP-067 - distinct from
# knowledge.sxa-legacy's rag-sxa-legacy database), same "bring your own
# password" mechanism as templates/externalsecret-ragsxalegacy.yaml.
#
# gitops/charts/rag-service resolves the same Vault path independently,
# via its own ExternalSecret, since this Secret lives in zuno-data and
# rag-service's pods live in zuno-ai-run - secretKeyRef can't cross
# namespaces.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.cluster.name }}-pguser-{{ .Values.ragSxaDatabase.owner }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.cluster.name }}-pguser-{{ .Values.ragSxaDatabase.owner }}
    # Orphan, not Owner: see templates/externalsecret.yaml for why.
    creationPolicy: Orphan
    template:
      # PGO identifies an externally-managed pguser Secret by these labels.
      metadata:
        labels:
          postgres-operator.crunchydata.com/cluster: {{ .Values.cluster.name }}
          postgres-operator.crunchydata.com/pguser: {{ .Values.ragSxaDatabase.owner }}
  data:
    - secretKey: user
      remoteRef:
        key: {{ .Values.ragSxaDatabase.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.ragSxaDatabase.vaultPath }}
        property: password
{{- end }}
