{{- if .Values.postgresCluster.enabled }}
# Syncs the pre-seeded Vault zuno/rag-sxa-legacy/postgresql-app credential
# into the Secret PGO expects at "<cluster>-pguser-<user>" for the
# dedicated rag-sxa-legacy database/role (knowledge.sxa-legacy,
# ADR-0204/WP-21), same "bring your own password" mechanism as
# templates/externalsecret-ragtech.yaml.
#
# gitops/charts/rag-service resolves the same Vault path independently,
# via its own ExternalSecret, since this Secret lives in zuno-data and
# rag-service's pods live in zuno-ai-run - secretKeyRef can't cross
# namespaces.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.cluster.name }}-pguser-{{ .Values.ragSxaLegacyDatabase.owner }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.cluster.name }}-pguser-{{ .Values.ragSxaLegacyDatabase.owner }}
    # PILOT (2026-08-27): Merge, not Orphan. Orphan's write is destructive -
    # it replaces .data wholesale with just user+password, deleting the
    # `verifier`/`uri`/`host`/... that PGO maintains on the same Secret. PGO
    # re-adds them, ESO strips them again, and because ESO's
    # `reconcile.external-secrets.io/data-hash` annotation then never matches
    # the real content, its isSecretValid() is permanently false and it
    # rewrites on every event rather than on refreshInterval. Measured live:
    # the key set flipped 2<->12 every ~8s, and PGO re-derived a freshly
    # SALTED SCRAM verifier each cycle, so `pg_authid.rolpassword` for this
    # role was rewritten every ~10s. That is what killed the 2026-08-27
    # ingestion run: pgbouncer's 3600s server_lifetime forced a re-login
    # against a re-salted verifier and got `password authentication failed`.
    # Merge only touches its own managed keys, so both writes become no-ops.
    # This is the pilot for the other 16 - see the plan/ADR before widening.
    creationPolicy: Merge
    template:
      # PGO identifies an externally-managed pguser Secret by these labels.
      metadata:
        labels:
          postgres-operator.crunchydata.com/cluster: {{ .Values.cluster.name }}
          postgres-operator.crunchydata.com/pguser: {{ .Values.ragSxaLegacyDatabase.owner }}
  data:
    - secretKey: user
      remoteRef:
        key: {{ .Values.ragSxaLegacyDatabase.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.ragSxaLegacyDatabase.vaultPath }}
        property: password
{{- end }}
