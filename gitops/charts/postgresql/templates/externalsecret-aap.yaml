{{- if .Values.postgresCluster.enabled }}
# Syncs the pre-seeded Vault zuno/aap/postgresql-app credential into the
# Secret PGO expects at "<cluster>-pguser-<user>" for the Gateway's
# dedicated database/role (ADR-0354/ADR-0315 pattern) - same "bring your
# own password" mechanism as templates/externalsecret.yaml for
# cluster.owner.
#
# gitops/charts/aap resolves the same Vault path independently, via its
# own ExternalSecret (templates/externalsecret-gateway-postgresql.yaml),
# since this Secret lives in zuno-data and AAP's pods live in zuno-aap -
# secretKeyRef can't cross namespaces.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.cluster.name }}-pguser-{{ .Values.aapDatabase.owner }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.cluster.name }}-pguser-{{ .Values.aapDatabase.owner }}
    # Merge, not Owner and not Orphan: see templates/externalsecret.yaml.
    creationPolicy: {{ .Values.credentials.pguserCreationPolicy }}
    template:
      # PGO identifies an externally-managed pguser Secret by these labels.
      metadata:
        labels:
          postgres-operator.crunchydata.com/cluster: {{ .Values.cluster.name }}
          postgres-operator.crunchydata.com/pguser: {{ .Values.aapDatabase.owner }}
  data:
    - secretKey: user
      remoteRef:
        key: {{ .Values.aapDatabase.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.aapDatabase.vaultPath }}
        property: password
{{- end }}
