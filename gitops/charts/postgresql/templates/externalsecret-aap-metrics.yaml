{{- if .Values.postgresCluster.enabled }}
# Syncs the pre-seeded Vault aap-metrics/postgresql-app credential into the
# Secret PGO expects at "<cluster>-pguser-<user>" for the Automation
# Metrics service's dedicated database/role (same BYO-password mechanism
# as templates/externalsecret-aap.yaml - see there for the pattern notes).
#
# gitops/charts/aap resolves the same Vault path independently, via its
# own ExternalSecret (templates/externalsecret-metrics-postgresql.yaml),
# since this Secret lives in zuno-data and AAP's pods live in zuno-aap -
# secretKeyRef can't cross namespaces.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.cluster.name }}-pguser-{{ .Values.aapMetricsDatabase.owner }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.cluster.name }}-pguser-{{ .Values.aapMetricsDatabase.owner }}
    # Orphan, not Owner: see templates/externalsecret.yaml for why.
    creationPolicy: Orphan
    template:
      # PGO identifies an externally-managed pguser Secret by these labels.
      metadata:
        labels:
          postgres-operator.crunchydata.com/cluster: {{ .Values.cluster.name }}
          postgres-operator.crunchydata.com/pguser: {{ .Values.aapMetricsDatabase.owner }}
  data:
    - secretKey: user
      remoteRef:
        key: {{ .Values.aapMetricsDatabase.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.aapMetricsDatabase.vaultPath }}
        property: password
{{- end }}
