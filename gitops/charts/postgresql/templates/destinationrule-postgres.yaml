{{- if .Values.postgresCluster.enabled }}
{{- /*
Third piece of the "Postgres in the mesh" fix (with postgrescluster.yaml's
5432/8432 Envoy exclusions and networkpolicy-metrics.yaml's same-namespace
allows): the instance pods no longer terminate Istio mTLS on 5432, but every
fully-meshed CLIENT's sidecar still auto-mTLS-upgrades outbound connections
to any in-mesh destination - so Istio mTLS bytes land directly on Postgres,
whose own SSL negotiation then reads garbage. Live symptom 2026-08-24:
Keycloak (spec.db.host = zuno-postgresql-primary..., a direct connection,
not PgBouncer) crash-looped 79 times with the JDBC driver dying inside
ConnectionFactoryImpl.enableSSL. These DestinationRules tell client
sidecars to pass the application's own bytes through on 5432 (Postgres
native SSL end-to-end); scoped per-port so Patroni's 8008 etc. stay
normally meshed. 8432 needs no rule - its only clients (backup Jobs,
repo-host, instances) already carry outbound exclusions and never transit
a client Envoy. PgBouncer's own host is deliberately absent: its 5432 is
still Envoy-intercepted, so client->PgBouncer mesh mTLS works and should
stay. DRs here export mesh-wide by default, covering clients in other
namespaces (zuno-auth's Keycloak etc.).
*/}}
{{- range $svc := list "primary" "replicas" "ha" "pods" }}
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: {{ $.Values.cluster.name }}-{{ $svc }}-plain-5432
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: postgresql
    zuno.io/managed-by: argocd
  annotations:
    # ADR-0517 live finding (demo333, first from-scratch Day 0 run,
    # 2026-09-06): postgresql is a Day 0 component (ADR-0421), but Istio's
    # CRDs are only installed by the `service_mesh` role, which is Day 1
    # (ansible/playbooks/day1_install.yml). On a virgin cluster the
    # DestinationRule CRD does not exist yet when this Application first
    # syncs. ArgoCD sync-waves are a hard barrier - a resource whose kind
    # cannot be resolved at all ("no matches for kind ... ensure CRDs are
    # installed first") fails its wave and every LATER wave never runs in
    # that operation. The original "-31" wave sat right before
    # postgrescluster.yaml's "-30", so this alone blocked the actual
    # PostgresCluster (and everything below it: monitoring/schema-grants
    # ConfigMaps, the exporter's PodMonitor/NetworkPolicy) from ever being
    # created. Moved to "20" - LAST in this chart (podmonitor-postgres.yaml/
    # networkpolicy-metrics.yaml top out at "15") - so a missing mesh CRD
    # only blocks these 4 mesh-only resources; selfHeal creates them once
    # Day 1's service_mesh runs. SkipDryRunOnMissingResource is kept for the
    # unrelated case where the CRD lands mid-operation (an earlier wave in
    # THIS sync installs it) - harmless either way, a no-op on demo222
    # where mesh is already installed.
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  host: {{ $.Values.cluster.name }}-{{ $svc }}.{{ $.Release.Namespace }}.svc.cluster.local
  trafficPolicy:
    portLevelSettings:
      - port:
          number: 5432
        tls:
          mode: DISABLE
---
{{- end }}
{{- end }}
