{{- if .Values.postgresCluster.enabled }}
# Syncs the pre-seeded Vault zuno/rag/postgresql-app credential into
# the Secret PGO expects at "<cluster>-pguser-<user>" for the dedicated
# rag-tech database/role, same "bring your own password" mechanism as
# templates/externalsecret-keycloak.yaml.
#
# gitops/charts/rag-ingestion resolves the same Vault path independently,
# via its own ExternalSecret, since this Secret lives in zuno-data and
# rag-ingestion's pods live in zuno-ai-build - secretKeyRef can't cross
# namespaces.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.cluster.name }}-pguser-{{ .Values.ragTechDatabase.owner }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.cluster.name }}-pguser-{{ .Values.ragTechDatabase.owner }}
    # Orphan, not Owner: PGO also sets itself as this Secret's controlling
    # owner once the PostgresCluster exists, and Kubernetes rejects a
    # second controller:true ownerReference on the same object.
    creationPolicy: Orphan
    template:
      # PGO identifies an externally-managed pguser Secret by these labels.
      metadata:
        labels:
          postgres-operator.crunchydata.com/cluster: {{ .Values.cluster.name }}
          postgres-operator.crunchydata.com/pguser: {{ .Values.ragTechDatabase.owner }}
  data:
    - secretKey: user
      remoteRef:
        key: {{ .Values.ragTechDatabase.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.ragTechDatabase.vaultPath }}
        property: password
{{- end }}
