{{- if .Values.postgresCluster.enabled }}
# Crunchy Postgres Operator (PGO) PostgresCluster CR. Requires PGO,
# installed by the separate zuno-postgresql-d0 Application applied before
# this one.
#
# PGO's operand pods run non-root by the operator's own design; there is
# no PostgresCluster.spec field for overriding pod/container
# securityContext. NetworkPolicy hardening is applied at the namespace
# level instead (gitops/charts/namespaces).
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: {{ .Values.cluster.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  postgresVersion: {{ .Values.postgresVersion }}

{{- if .Values.postgresCluster.restoreFromRepo }}
  # One-shot recovery: pre-populate this (newly-created) cluster's data
  # directory from an existing pgBackRest repo instead of bootstrapping
  # empty. clusterName/clusterNamespace default to this cluster's own name/
  # namespace when omitted (confirmed via `oc explain
  # postgrescluster.spec.dataSource.postgresCluster`), so restoring "into
  # yourself" (recreating the same cluster after a deletion) only needs
  # repoName. See ansible/roles/postgresql/tasks/restore.yml, the only
  # intended setter of postgresCluster.restoreFromRepo.
  dataSource:
    postgresCluster:
      repoName: {{ .Values.postgresCluster.restoreFromRepo | quote }}
{{- end }}

  # Tells PGO to apply OpenShift-SCC-friendly pod/container security
  # context conventions to the instances it manages.
  openshift: true

  # TimescaleDB needs shared_preload_libraries (pgvector doesn't); paired
  # with the CREATE EXTENSION statements in templates/configmap-init-sql.yaml.
  config:
    parameters:
      shared_preload_libraries: "timescaledb"
      max_connections: "{{ .Values.config.maxConnections }}"
      log_min_duration_statement: "{{ .Values.config.logMinDurationStatement }}"

{{- if .Values.monitoring.enabled }}
  # ADR-0413: crunchy-postgres-exporter sidecar on every instance pod,
  # port "exporter" (9187) - templates/podmonitor-postgres.yaml scrapes it.
  monitoring:
    pgmonitor:
      exporter: {}
{{- end }}

  instances:
    - name: instance1
      # Postgres (5432) and pgBackRest's own TLS server (8432, from the
      # PGO-generated ~postgres-operator_server.conf's tls-server block,
      # live-verified on a running instance pod 2026-08-24) both already do
      # their own TLS end-to-end (PGO-managed certs). Envoy intercepting
      # those connections corrupts the handshake - live symptoms: replica
      # pg_basebackup bootstrap fails with "server closed the connection
      # unexpectedly", and PGO's backup Jobs fail with "unable to check
      # pg1/2/3: [ServiceError] TLS error [5:0]" then "unable to find
      # primary cluster", leaving readyReplicas stuck at 1/3 forever. Same
      # server-side-TLS-vs-istio-sniffing class as MariaDB's documented
      # case in this repo. Exclude just these two ports from interception,
      # both directions - the pods stay fully in the mesh (sidecar
      # injected, every other port still proxied, e.g. exporter's 9187).
      metadata:
        annotations:
          traffic.sidecar.istio.io/excludeInboundPorts: "5432,8432"
          traffic.sidecar.istio.io/excludeOutboundPorts: "5432,8432"
      replicas: {{ .Values.cluster.instances }}
      priorityClassName: zuno-platform-critical
      # Do not add an explicit topologySpreadConstraints block here
      # (ADR-0101 tried this) - PGO 5.8 already injects its own default
      # (hostname + zone, both ScheduleAnyway) into every instance/
      # pgBouncer/repo-host pod template it manages, and re-declaring the
      # same zone key breaks reconciliation entirely via a K8s SSA
      # listType=map conflict ("duplicate entries for key ..."), including
      # spec.users - see
      # docs/adr/0101-provide-ha-for-shared-agent-platform-services.md.
      resources:
        requests:
          cpu: {{ .Values.cluster.resources.requests.cpu | quote }}
          memory: {{ .Values.cluster.resources.requests.memory | quote }}
        limits:
          cpu: {{ .Values.cluster.resources.limits.cpu | quote }}
          memory: {{ .Values.cluster.resources.limits.memory | quote }}
      dataVolumeClaimSpec:
        storageClassName: {{ .Values.cluster.storageClassName }}
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: {{ .Values.cluster.storageSize }}
      # Separate volume for WAL: write latency matters more here under
      # TimescaleDB's typically high ingestion rate.
      walVolumeClaimSpec:
        storageClassName: {{ .Values.cluster.storageClassName }}
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: {{ .Values.cluster.walStorageSize }}

  # PGO-managed PgBouncer (transaction pooling) in front of the instances.
  proxy:
    pgBouncer:
      replicas: {{ .Values.pgBouncer.replicas }}
      priorityClassName: zuno-platform-critical
      # See the matching comment on spec.instances above: an explicit
      # topologySpreadConstraints block here collided with PGO's own
      # injected default and was reverted.
      resources:
        requests:
          cpu: {{ .Values.pgBouncer.resources.requests.cpu | quote }}
          memory: {{ .Values.pgBouncer.resources.requests.memory | quote }}
        limits:
          cpu: {{ .Values.pgBouncer.resources.limits.cpu | quote }}
          memory: {{ .Values.pgBouncer.resources.limits.memory | quote }}
      config:
        global:
          pool_mode: {{ .Values.pgBouncer.poolMode | quote }}
          max_client_conn: {{ .Values.pgBouncer.maxClientConn | quote }}
          default_pool_size: {{ .Values.pgBouncer.defaultPoolSize | quote }}

  # PGO requires at least one pgBackRest repo. repo1 (local PVC) always
  # exists; repo2 (S3, off-cluster) is added once real credentials are
  # configured (values.yaml's backups.s3.enabled).
  backups:
    pgbackrest:
      # Same 5432/8432 exclusion as spec.instances above (see that comment
      # for the live evidence) - this metadata block is the only lever PGO
      # exposes for the repo-host StatefulSet's and its ad hoc backup Job
      # pods' annotations (repoHost/jobs sub-objects have no metadata field
      # of their own, confirmed via `oc explain`). The backup Job pods were
      # the ones directly logging the TLS [5:0] error against pg1/pg2/pg3.
      metadata:
        annotations:
          traffic.sidecar.istio.io/excludeInboundPorts: "5432,8432"
          traffic.sidecar.istio.io/excludeOutboundPorts: "5432,8432"
      global:
        repo1-retention-full: "4"
        repo1-retention-full-type: count
      repos:
        - name: repo1
          schedules:
            full: "0 2 * * 0"
            differential: "0 2 * * 1-6"
          volume:
            volumeClaimSpec:
              storageClassName: {{ .Values.cluster.storageClassName }}
              accessModes:
                - "ReadWriteOnce"
              resources:
                requests:
                  storage: {{ .Values.backups.storageSize }}
{{- if .Values.backups.s3.enabled }}
        - name: repo2
          schedules:
            full: "0 3 * * 0"
          s3:
            bucket: {{ .Values.backups.s3.bucket | quote }}
            endpoint: {{ .Values.backups.s3.endpoint | quote }}
            region: {{ .Values.backups.s3.region | quote }}
      configuration:
        - secret:
            name: {{ .Values.backups.s3.secretName }}
{{- end }}

  # Creates the zuno database owned by {{ .Values.cluster.owner }}, and eleven
  # further dedicated databases/roles - Keycloak (ADR-0315), the
  # rag-ingestion pipeline's rag-tech corpus/index database, RHOAI's
  # Models-as-a-Service maas database, the Agent Runtime's LangGraph
  # checkpoint database (ADR-0103), the OGX-backed RAG provider
  # prototype's vector I/O database (ADR-0322), one database per
  # additional logical knowledge domain (ADR-0204: rag-sales,
  # rag-sxa-legacy, rag-adv; ADR-0217/WP-067: rag-sxa; ADR-0209/WP-28:
  # rag-project), and the Agent Runtime's persistent-conversation metadata
  # database (ADR-0212) - each adopting the password already seeded into
  # its own pguser Secret by
  # templates/externalsecret.yaml / templates/externalsecret-keycloak.yaml /
  # templates/externalsecret-ragtech.yaml / templates/externalsecret-maas.yaml /
  # templates/externalsecret-checkpoint.yaml / templates/externalsecret-ogx.yaml /
  # templates/externalsecret-ragsales.yaml /
  # templates/externalsecret-ragsxalegacy.yaml /
  # templates/externalsecret-ragadv.yaml /
  # templates/externalsecret-ragsxa.yaml /
  # templates/externalsecret-ragproject.yaml /
  # templates/externalsecret-conversations.yaml
  # ("bring your own password") rather than generating its own.
  #
  # The "postgres" entry (added for the templates/job-monitoring-role.yaml
  # fixup Job): `databases`/`options` are both explicitly ignored for this
  # user by the CRD (confirmed via `oc explain postgrescluster.spec.users`)
  # - listing it here only tells PGO to generate a normal password-managed
  # Secret (<cluster>-pguser-postgres) for the built-in superuser, which is
  # the documented, supported way to get a networked superuser credential
  # out of PGO. This is a real increase in privilege surface versus not
  # having this secret at all - still bounded by the same NetworkPolicy
  # that already restricts who can reach port 5432, but worth knowing it's
  # there.
  users:
    - name: postgres
    - name: {{ .Values.cluster.owner }}
      databases:
        - {{ .Values.cluster.database }}
    - name: {{ .Values.keycloakDatabase.owner }}
      databases:
        - {{ .Values.keycloakDatabase.name }}
    - name: {{ .Values.ragTechDatabase.owner }}
      databases:
        - {{ .Values.ragTechDatabase.name }}
    - name: {{ .Values.maasDatabase.owner }}
      databases:
        - {{ .Values.maasDatabase.name }}
    - name: {{ .Values.checkpointDatabase.owner }}
      databases:
        - {{ .Values.checkpointDatabase.name }}
    - name: {{ .Values.ogxDatabase.owner }}
      databases:
        - {{ .Values.ogxDatabase.name }}
    - name: {{ .Values.ragSalesDatabase.owner }}
      databases:
        - {{ .Values.ragSalesDatabase.name }}
    - name: {{ .Values.ragSxaLegacyDatabase.owner }}
      databases:
        - {{ .Values.ragSxaLegacyDatabase.name }}
    - name: {{ .Values.ragAdvDatabase.owner }}
      databases:
        - {{ .Values.ragAdvDatabase.name }}
    - name: {{ .Values.ragSxaDatabase.owner }}
      databases:
        - {{ .Values.ragSxaDatabase.name }}
    - name: {{ .Values.ragProjectDatabase.owner }}
      databases:
        - {{ .Values.ragProjectDatabase.name }}
    - name: {{ .Values.conversationsDatabase.owner }}
      databases:
        - {{ .Values.conversationsDatabase.name }}
    - name: {{ .Values.aapDatabase.owner }}
      databases:
        - {{ .Values.aapDatabase.name }}
    - name: {{ .Values.aapControllerDatabase.owner }}
      databases:
        - {{ .Values.aapControllerDatabase.name }}
    - name: {{ .Values.aapHubDatabase.owner }}
      databases:
        - {{ .Values.aapHubDatabase.name }}
    - name: {{ .Values.aapEdaDatabase.owner }}
      databases:
        - {{ .Values.aapEdaDatabase.name }}
    - name: {{ .Values.aapMetricsDatabase.owner }}
      databases:
        - {{ .Values.aapMetricsDatabase.name }}
    # Read-only metrics access to the Controller database: PGO only
    # creates the role and grants database-level access (sharing a
    # database between users is supported); the SELECT-only table grants
    # come from ansible/roles/postgresql's post-rollout SQL.
    - name: {{ .Values.aapMetricsReadOnly.owner }}
      databases:
        - {{ .Values.aapControllerDatabase.name }}

  # Runs once at bootstrap against "postgres", not the app database - see
  # templates/configmap-init-sql.yaml's `\connect` comment for why.
  databaseInitSQL:
    name: {{ .Values.cluster.name }}-init-sql
    key: init.sql
{{- end }}
