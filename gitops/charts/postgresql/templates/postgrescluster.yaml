{{- if .Values.postgresCluster.enabled }}
# Crunchy Postgres Operator (PGO) PostgresCluster CR. Requires PGO,
# installed by this same chart's templates/subscription.yaml, rendered by
# the separate zuno-postgresql-d0 Application (operator.enabled) applied
# before this one (zuno-postgresql-d1, postgresCluster.enabled) - see
# ansible/roles/postgresql/tasks/install.yml.
#
# ADR-0052: PGO's operator-managed operand pods run non-root with a
# restricted-compatible security profile by the operator's own design
# (same stated project goal CloudNativePG had, and the same reasoning this
# chart used before this ADR-0015 operator swap) - there is no documented
# PostgresCluster.spec field for overriding pod/container securityContext,
# so this is left to the operator's default rather than a guessed-at
# field. NetworkPolicy hardening (which this repo does fully control,
# independent of the operator) is applied at the namespace level - see
# gitops/charts/namespaces/values.yaml's platformNamespaces (zuno-data
# allows zuno-ai-run in, covering sales-db-mcp's cross-namespace connection
# here).
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: {{ .Values.cluster.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  postgresVersion: {{ .Values.postgresVersion }}

  # Tells PGO to apply OpenShift-SCC-friendly pod/container security
  # context conventions to the instances it manages.
  openshift: true

  # TimescaleDB needs shared_preload_libraries (pgvector doesn't) - paired
  # with the CREATE EXTENSION statements in templates/configmap-init-sql.yaml
  # (spec.databaseInitSQL below).
  config:
    parameters:
      shared_preload_libraries: "timescaledb"
      max_connections: "{{ .Values.config.maxConnections }}"
      log_min_duration_statement: "{{ .Values.config.logMinDurationStatement }}"

  instances:
    - name: instance1
      replicas: {{ .Values.cluster.instances }}
      resources:
        requests:
          cpu: {{ .Values.cluster.resources.requests.cpu | quote }}
          memory: {{ .Values.cluster.resources.requests.memory | quote }}
        limits:
          cpu: {{ .Values.cluster.resources.limits.cpu | quote }}
          memory: {{ .Values.cluster.resources.limits.memory | quote }}
      dataVolumeClaimSpec:
        storageClassName: {{ .Values.cluster.storageClassName }}
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: {{ .Values.cluster.storageSize }}
      # Separate volume for WAL - particularly useful under TimescaleDB's
      # typically high ingestion rate, which is sensitive to WAL write
      # latency.
      walVolumeClaimSpec:
        storageClassName: {{ .Values.cluster.storageClassName }}
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: {{ .Values.cluster.walStorageSize }}

  # PGO-managed PgBouncer (transaction pooling) in front of the instances
  # above - see ansible/roles/postgresql/README.md's "Connecting to this
  # cluster" for the resulting Service name consumers should use.
  proxy:
    pgBouncer:
      replicas: {{ .Values.pgBouncer.replicas }}
      resources:
        requests:
          cpu: {{ .Values.pgBouncer.resources.requests.cpu | quote }}
          memory: {{ .Values.pgBouncer.resources.requests.memory | quote }}
        limits:
          cpu: {{ .Values.pgBouncer.resources.limits.cpu | quote }}
          memory: {{ .Values.pgBouncer.resources.limits.memory | quote }}
      config:
        global:
          pool_mode: {{ .Values.pgBouncer.poolMode | quote }}
          max_client_conn: {{ .Values.pgBouncer.maxClientConn | quote }}
          default_pool_size: {{ .Values.pgBouncer.defaultPoolSize | quote }}

  # PGO requires at least one pgBackRest repo - unlike CNPG there is no
  # way to omit backups entirely. repo1 (local PVC) always exists; repo2
  # (S3-compatible, off-cluster) is added only once real credentials are
  # configured (values.yaml's backups.s3.enabled) - see
  # templates/externalsecret-backup-s3.yaml for where its Secret comes
  # from. UNVERIFIED: the repos[].s3/configuration shape below is
  # reconstructed from Crunchy's general pgBackRest S3 documentation, not
  # confirmed against the PGO 5.8.8 CRD installed on a live cluster -
  # confirm with `oc explain postgrescluster.spec.backups.pgbackrest
  # --recursive` and adjust if it differs.
  backups:
    pgbackrest:
      global:
        repo1-retention-full: "4"
        repo1-retention-full-type: count
      repos:
        - name: repo1
          schedules:
            full: "0 2 * * 0"
            differential: "0 2 * * 1-6"
          volume:
            volumeClaimSpec:
              storageClassName: {{ .Values.cluster.storageClassName }}
              accessModes:
                - "ReadWriteOnce"
              resources:
                requests:
                  storage: {{ .Values.backups.storageSize }}
{{- if .Values.backups.s3.enabled }}
        - name: repo2
          schedules:
            full: "0 3 * * 0"
          s3:
            bucket: {{ .Values.backups.s3.bucket | quote }}
            endpoint: {{ .Values.backups.s3.endpoint | quote }}
            region: {{ .Values.backups.s3.region | quote }}
      configuration:
        - secret:
            name: {{ .Values.backups.s3.secretName }}
{{- end }}

  # Creates the zuno database owned by {{ .Values.cluster.owner }}, and (via the
  # "bring your own password" mechanism - PGO >= 5.6) adopts the password
  # already seeded into the {{ .Values.cluster.name }}-pguser-{{ .Values.cluster.owner }}
  # Secret by templates/externalsecret.yaml, rather than generating its
  # own - the Vault-backed equivalent of CNPG's
  # bootstrap.initdb.secret.name (ADR-0024: never hand-roll a credential).
  users:
    - name: {{ .Values.cluster.owner }}
      databases:
        - {{ .Values.cluster.database }}

  # Runs once at bootstrap, against the {{ .Values.cluster.owner }}-owned database created
  # above (per Crunchy's own Extension Management guide's documented
  # pattern for adding an extension this way) - NOT verified against a
  # live cluster from this environment; if it lands in the wrong database
  # instead, create the extension manually once
  # (`psql -d {{ .Values.cluster.database }} -c "CREATE EXTENSION IF NOT EXISTS vector;"`)
  # and adjust this block.
  databaseInitSQL:
    name: {{ .Values.cluster.name }}-init-sql
    key: init.sql
{{- end }}
