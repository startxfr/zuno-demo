{{- if .Values.postgresCluster.enabled }}
# Syncs the pre-seeded Vault zuno/mlflow/postgresql-app credential into the
# Secret PGO expects at "<cluster>-pguser-<user>" for the dedicated mlflow
# database/role (MLflow tracking server backend store, ADR-0538/WP-116),
# same "bring your own password" mechanism as templates/externalsecret-maas.yaml.
#
# gitops/charts/mlflow resolves the same Vault path independently, via its own
# ExternalSecret, because the MLflow server reads its backend-store URI from a
# Secret in redhat-ods-applications and secretKeyRef can't cross namespaces.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.cluster.name }}-pguser-{{ .Values.mlflowDatabase.owner }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.cluster.name }}-pguser-{{ .Values.mlflowDatabase.owner }}
    # Merge, not Owner and not Orphan: see templates/externalsecret.yaml.
    creationPolicy: {{ .Values.credentials.pguserCreationPolicy }}
    template:
      # PGO identifies an externally-managed pguser Secret by these labels.
      metadata:
        labels:
          postgres-operator.crunchydata.com/cluster: {{ .Values.cluster.name }}
          postgres-operator.crunchydata.com/pguser: {{ .Values.mlflowDatabase.owner }}
  data:
    - secretKey: user
      remoteRef:
        key: {{ .Values.mlflowDatabase.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.mlflowDatabase.vaultPath }}
        property: password
{{- end }}
