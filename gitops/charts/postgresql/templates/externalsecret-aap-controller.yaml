{{- if .Values.postgresCluster.enabled }}
# Syncs the pre-seeded Vault zuno/aap-controller/postgresql-app credential
# into the Secret PGO expects at "<cluster>-pguser-<user>" for AAP
# Controller's dedicated database/role - see
# templates/externalsecret-aap.yaml for the shared rationale.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.cluster.name }}-pguser-{{ .Values.aapControllerDatabase.owner }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.cluster.name }}-pguser-{{ .Values.aapControllerDatabase.owner }}
    creationPolicy: Orphan
    template:
      metadata:
        labels:
          postgres-operator.crunchydata.com/cluster: {{ .Values.cluster.name }}
          postgres-operator.crunchydata.com/pguser: {{ .Values.aapControllerDatabase.owner }}
  data:
    - secretKey: user
      remoteRef:
        key: {{ .Values.aapControllerDatabase.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.aapControllerDatabase.vaultPath }}
        property: password
{{- end }}
