{{- if .Values.postgresCluster.enabled }}
# Syncs the pre-seeded Vault zuno/agent-runtime/conversations-postgresql-app
# credential into the Secret PGO expects at "<cluster>-pguser-<user>" for
# the dedicated persistent-conversation metadata database/role (ADR-0212),
# same "bring your own password" mechanism as
# templates/externalsecret-checkpoint.yaml. Deliberately a separate Vault
# path/credential from agent-runtime/postgresql-app (agentcheckpoints) -
# ADR-0212's Security considerations require the two roles never share a
# password.
#
# gitops/charts/agent-runtime resolves the same Vault path independently,
# via its own ExternalSecret, since this Secret lives in zuno-data and
# agent-runtime's pods live in zuno-ai-run - secretKeyRef can't cross
# namespaces.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.cluster.name }}-pguser-{{ .Values.conversationsDatabase.owner }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.cluster.name }}-pguser-{{ .Values.conversationsDatabase.owner }}
    # Orphan, not Owner: see templates/externalsecret.yaml for why.
    creationPolicy: Orphan
    template:
      # PGO identifies an externally-managed pguser Secret by these labels.
      metadata:
        labels:
          postgres-operator.crunchydata.com/cluster: {{ .Values.cluster.name }}
          postgres-operator.crunchydata.com/pguser: {{ .Values.conversationsDatabase.owner }}
  data:
    - secretKey: user
      remoteRef:
        key: {{ .Values.conversationsDatabase.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.conversationsDatabase.vaultPath }}
        property: password
{{- end }}
