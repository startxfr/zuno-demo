# Resolves the `zunoapp` PostgreSQL credential into a Secret consumed by the
# schema-apply Job's PGUSER/PGPASSWORD env vars. Consumes only; does not own
# the credential.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.dbSecretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    # Deliberately a plain tracked resource at wave 0, one wave before the
    # schema-apply Job (Sync hook, wave 10) that consumes this Secret via
    # secretKeyRef. Two constraints meet here (incident 2026-08-14):
    # the Job must NOT be a PreSync hook (ArgoCD only starts the Sync phase
    # after every PreSync hook succeeds, so a PreSync consumer of a
    # Sync-phase Secret deadlocks forever), and this ExternalSecret must NOT
    # be a hook either (an app whose every resource is a hook is trivially
    # Synced, so automated sync never fires and a fresh install silently
    # skips the schema). See ADR-0313's incident note.
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.dbSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: postgresql/app
        property: username
    - secretKey: password
      remoteRef:
        key: postgresql/app
        property: password
