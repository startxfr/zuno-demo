# Resolves the `zunoapp` PostgreSQL credential into a Secret consumed by the
# schema-apply Job's PGUSER/PGPASSWORD env vars. Consumes only; does not own
# the credential.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.dbSecretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    # The schema-apply Job (PreSync hook, default wave 0) consumes this
    # Secret via secretKeyRef, so this ExternalSecret must be applied in the
    # SAME phase, one wave earlier. As a plain Sync-phase resource (incident
    # 2026-08-14) ArgoCD never applied it: the Sync phase only starts after
    # every PreSync hook succeeds, and the hook was waiting on this very
    # Secret - a deadlock that left the app stuck in
    # "waiting for completion of hook" forever. No hook-delete-policy: the
    # ExternalSecret persists between syncs. See ADR-0313's incident note.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.dbSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: postgresql/app
        property: username
    - secretKey: password
      remoteRef:
        key: postgresql/app
        property: password
