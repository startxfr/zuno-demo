# Resolves the same `zunoapp` PostgreSQL application credential the vault
# role generates at zuno/postgresql/app (see
# ansible/roles/vault/tasks/install.yml) into a Secret the schema-apply Job
# below maps to PGUSER/PGPASSWORD env vars. This chart does not generate or
# own that credential, only consumes it (ADR-0024). Moved here from
# ansible/roles/sql_schema/kustomize/prereqs/externalsecret.yaml (ADR-0313)
# - previously applied directly by ansible/tasks/apply_kustomize.yml.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.dbSecretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.dbSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: postgresql/app
        property: username
    - secretKey: password
      remoteRef:
        key: postgresql/app
        property: password
