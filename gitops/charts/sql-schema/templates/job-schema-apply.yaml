# Applies the SXA-derived schema + synthetic fixtures (ADR-0016, ADR-0025)
# before the sales-db MCP server (gitops/charts/mcp-sales-db, the -d1
# Application this chart's -d0 Application precedes) is synced (ADR-0313).
# An ArgoCD PreSync hook, not a standing Deployment: Jobs are immutable, so
# `hook-delete-policy: BeforeHookCreation` deletes the previous run's Job
# right before creating this one - the exact GitOps-native equivalent of
# the delete-then-recreate ansible used to do by hand via
# kubernetes.core.k8s. ArgoCD blocks Synced until this hook succeeds, so no
# separate wait is needed on the Ansible side either.
#
# The SQL/fixtures ConfigMap (zuno-sxa-schema) is still generated by
# ansible/roles/sql_schema/kustomize/schema/ (a plain configMapGenerator
# reading data/sxa/) and applied by ansible/roles/sql_schema/tasks/
# install.yml before this Application is synced - static data, not
# business logic, so it stays Ansible-applied for now (see ADR-0313's
# "Alternatives considered").
apiVersion: batch/v1
kind: Job
metadata:
  name: zuno-sxa-schema-apply
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: sql-schema
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:16-bookworm
          command:
            - psql
          env:
            - name: PGHOST
              value: {{ .Values.pg.host | quote }}
            - name: PGPORT
              value: {{ .Values.pg.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.pg.database | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbSecretName }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbSecretName }}
                  key: password
          args:
            - -v
            - ON_ERROR_STOP=1
            - -f
            - /sql/001_init.sql
            - -f
            - /sql/002_pgvector.sql
            - -f
            - /sql/seed.sql
          volumeMounts:
            - name: sql
              mountPath: /sql
      volumes:
        - name: sql
          configMap:
            name: zuno-sxa-schema
