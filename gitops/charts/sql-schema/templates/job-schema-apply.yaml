# ArgoCD PreSync hook Job; runs before the sales-db MCP server is synced.
# `hook-delete-policy: BeforeHookCreation` deletes the previous run's Job
# since Jobs are immutable. The credentials Secret arrives one wave earlier
# in the same PreSync phase (templates/externalsecret.yaml, wave -1) - it
# must NOT be a Sync-phase resource, that deadlocked (incident 2026-08-14).
#
# The SQL/fixtures ConfigMap (zuno-sxa-schema) is generated and applied by
# ansible/roles/sql_schema, not by this chart.
apiVersion: batch/v1
kind: Job
metadata:
  name: zuno-sxa-schema-apply
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: sql-schema
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  # psql over 3 small files takes seconds; without a deadline a pod stuck in
  # CreateContainerConfigError (not a pod *failure*, so backoffLimit never
  # triggers) hangs the whole sync operation forever - incident 2026-08-14.
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      priorityClassName: zuno-platform-weak
      containers:
        - name: psql
          image: postgres:16-bookworm
          command:
            - psql
          env:
            - name: PGHOST
              value: {{ .Values.pg.host | quote }}
            - name: PGPORT
              value: {{ .Values.pg.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.pg.database | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbSecretName }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbSecretName }}
                  key: password
          args:
            - -v
            - ON_ERROR_STOP=1
            - -f
            - /sql/001_init.sql
            - -f
            - /sql/002_pgvector.sql
            - -f
            - /sql/seed.sql
          volumeMounts:
            - name: sql
              mountPath: /sql
      volumes:
        - name: sql
          configMap:
            name: zuno-sxa-schema
