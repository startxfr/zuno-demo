# Default values for the sql-schema chart. Overridden per-environment
# through gitops/apps/mcp-sales-db/application-d0.yaml's
# spec.source.helm.values.

namespace: zuno-data

# PostgreSQL connection target - owned by the data track (ansible/roles/postgresql).
# Database credentials come from the ExternalSecret below, not from values.
# zuno-postgresql-pgbouncer is PGO's own auto-created PgBouncer Service in
# front of the zuno-postgresql PostgresCluster - there is no plain
# "postgresql" Service, and no "-rw"-suffixed one either (that was
# CloudNativePG's convention - see ansible/roles/postgresql/README.md).
pg:
  host: zuno-postgresql-pgbouncer.zuno-data.svc
  port: 5432
  database: zuno

# Kubernetes Secret name populated by the ExternalSecret resolving
# zuno/postgresql/app (generated by ansible/roles/vault) - see
# templates/externalsecret.yaml. Kept as "sql-schema-postgresql-credentials"
# (unchanged from the pre-ADR-0313 ansible-applied Secret name) since
# ansible/roles/rag's own Job used to mount this exact Secret too - now
# each chart mounts its own copy of the same Vault path instead
# (gitops/charts/rag-service's dbSecretName), so nothing outside this
# chart references this name anymore.
dbSecretName: sql-schema-postgresql-credentials
