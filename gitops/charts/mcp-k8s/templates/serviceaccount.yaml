# The identity of every cluster read (ADR-0600 security considerations): the mcp-gateway decides who may call,
# this ServiceAccount's RBAC bounds what is visible.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-mcp
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: k8s-mcp
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
