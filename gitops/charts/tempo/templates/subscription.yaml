{{- if .Values.operator.enabled }}
# Package/channel confirmed against a live cluster's PackageManifest
# (redhat-operators catalog) before this chart was written - see
# `oc get packagemanifest tempo-product -n openshift-marketplace`.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: tempo-product
  namespace: openshift-tempo-operator
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  channel: stable
  name: tempo-product
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
{{- end }}
