{{- if .Values.tempo.enabled }}
# Demo-scale, single-tenant Tempo instance (PV storage, no object storage
# backend) - deliberately simpler than a TempoStack, matching this repo's
# "simplest correct option for a demo cluster" posture (see cluster-istio's
# own comments in gitops/charts/service-mesh/values.yaml for the same
# reasoning applied elsewhere). ASSUMPTION: the Tempo operator warns that
# TempoMonolithic without multi-tenancy "provide[s] no authentication or
# authorization on the ingest or query paths, and [is] not supported on
# OpenShift" - acceptable here since ingest/query stay cluster-internal (no
# Route is created for the OTLP/query ports). Revisit with a TempoStack if
# this ever needs to be multi-tenant.
#
# ADR-0543: Jaeger UI's own read path IS now externally reachable (see
# spec.jaegerui.route/authentication below) - unlike the ingest/query ports
# above, the operator puts its own oauth-proxy in front of it, so this
# doesn't reopen the "no auth" gap the ASSUMPTION above is about. Kiali
# still separately talks to Tempo in-cluster for its own mesh-scoped
# tracing tab; this Route is for the per-run resource dashboard's trace
# links (gitops/charts/grafana/templates/dashboard-run-trace.yaml), which
# need a generic "open trace X" page Kiali's app-scoped tracing view can't
# provide.
apiVersion: tempo.grafana.com/v1alpha1
kind: TempoMonolithic
metadata:
  name: tempo
  namespace: zuno-monitoring
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  storage:
    traces:
      backend: pv
      size: 10Gi
  ingestion:
    otlp:
      grpc:
        enabled: true
      http:
        enabled: true
  jaegerui:
    enabled: true
    route:
      enabled: true
      host: "tempo-jaegerui-zuno-monitoring.{{ .Values.appsDomain }}"
    authentication:
      enabled: true
      # sar defaults to {"namespace": "<this CR's namespace>", "resource":
      # "pods", "verb": "get"} - zuno-monitoring, the same authorization
      # boundary gitops/charts/grafana/templates/grafana.yaml's own
      # oauth-proxy already uses. No override needed.
{{- end }}
