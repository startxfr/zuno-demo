# project.enabled renders the dedicated Namespace, via the vendored startx
# `project` chart; operator.enabled renders the OperatorGroup/Subscription,
# via the vendored startx `operator` chart; tempo.enabled renders the
# TempoMonolithic instance. Shared by two ArgoCD Applications: operator
# (zuno-tempo-d0, project+operator) and instance (zuno-tempo-d1, tempo).
# All default false so `helm template`/`helm lint` render nothing.
#
# Package/channel confirmed against a live cluster's PackageManifest
# (redhat-operators catalog) before this chart was written - see
# `oc get packagemanifest tempo-product -n openshift-marketplace`.
project:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: tempo
    app: tempo
  project:
    enabled: true
    hooked: true  # PreSync ArgoCD hook
    type: namespace
    name: openshift-tempo-operator
    display_name: Zuno Infra Tempo Operator
    description: "Red Hat build of Tempo operator subscription, installed by Zuno."
    requester: zuno

operator:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: tempo
    app: tempo
  subscription:
    enabled: true
    name: tempo-product
    namespace: openshift-tempo-operator
    operator:
      # Must be set explicitly, same name as subscription.name: the
      # vendored `operator` chart's own values.yaml gives this a
      # non-empty default ("codeready-workspaces") that wins the merge
      # and silently suppresses the fallback to subscription.name.
      name: tempo-product
      channel: stable
      installPlanApproval: Automatic  # startx chart defaults to Manual
      source:
        name: redhat-operators
        namespace: openshift-marketplace
  operatorGroup:
    enabled: true
    name: tempo-operator-group
    namespace: openshift-tempo-operator
    target: "all-ns"  # matches the original hand-authored spec: {}

tempo:
  enabled: false
