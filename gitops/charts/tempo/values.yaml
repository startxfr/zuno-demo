# project.enabled renders the dedicated Namespace, via the vendored startx
# `project` chart; operator.enabled renders the OperatorGroup/Subscription,
# via the vendored startx `operator` chart; tempo.enabled renders the
# TempoMonolithic instance. Shared by two ArgoCD Applications: operator
# (zuno-tempo-d0, project+operator) and instance (zuno-tempo-d1, tempo).
# All default false so `helm template`/`helm lint` render nothing.
#
# Package/channel confirmed against a live cluster's PackageManifest
# (redhat-operators catalog) before this chart was written - see
# `oc get packagemanifest tempo-product -n openshift-marketplace`.
project:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: tempo
    app: tempo
  project:
    enabled: true
    hooked: true  # PreSync ArgoCD hook
    type: namespace
    name: openshift-tempo-operator
    display_name: Zuno Infra Tempo Operator
    description: "Red Hat build of Tempo operator subscription, installed by Zuno."
    requester: zuno

operator:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: tempo
    app: tempo
  subscription:
    enabled: true
    name: tempo-product
    namespace: openshift-tempo-operator
    operator:
      # Must be set explicitly, same name as subscription.name: the vendored
      # `operator` chart defaults this to "codeready-workspaces", silently
      # suppressing the fallback to subscription.name.
      name: tempo-product
      channel: stable
      installPlanApproval: Automatic  # startx chart defaults to Manual
      source:
        name: redhat-operators
        namespace: openshift-marketplace
  operatorGroup:
    enabled: true
    name: tempo-operator-group
    namespace: openshift-tempo-operator
    target: "all-ns"  # matches the original hand-authored spec: {}

tempo:
  enabled: false

# Builds spec.jaegerui.route.host in templates/tempomonolithic.yaml. Each
# chart carries its own copy rather than a shared/global value; kiali and
# grafana do the same. That is a duplication, not a licence to hardcode -
# see below.
# ADR-0517 B2 (WP-118 step 1b, 2026-09-02): a substitution token, not a
# real hostname. It used to hardcode apps.demo222.startx.fr, which made
# this chart undeployable on any other cluster. The live value is pinned
# at the Application level (gitops/apps/<c>/application-d1.yaml) and
# rewritten by ansible/tasks/apply_gitops_app.yml, so this default only
# ever renders if that substitution did not happen - which is meant to
# fail visibly rather than silently deploy another cluster's hostname.
appsDomain: apps.mycluster.example.com
