# operator.enabled gates the CertManager CR + operand namespace; issuer.enabled
# gates the Vault-backed ClusterIssuer. Both default false so templates render
# nothing.
certmanager:
  enabled: false
issuer:
  enabled: false

# ADR-0211: publicly-trusted wildcard TLS via Let's Encrypt + Route53
# DNS-01. Everything ships DISABLED, flipped deliberately by the operator
# (same posture as maas.enabled in gitops/charts/models):
#   1. acme.enabled: true (in gitops/apps/cert-manager/application-d1.yaml)
#      renders the two ClusterIssuers, the AWS-credential ExternalSecret
#      and the three Certificate resources - against the STAGING issuer
#      first (acme.certificatesIssuer's shipped default), proving the IAM
#      policy/hosted-zone/solver config without touching Let's Encrypt's
#      production rate-limit budget.
#   2. acme.certificatesIssuer: letsencrypt-route53 re-issues all three
#      from production once the staging rehearsal succeeded.
#   3. acme.consumers.* patch the actual consumers (IngressController,
#      APIServer) - separate flags, flipped ONLY after `oc get certificate
#      -A` shows all three Ready: True, since pointing the router at a
#      not-yet-issued Secret would break serving.
# The Keycloak switch is the keycloak chart's own ingress.acmeWildcardTLS
# flag (gitops/charts/keycloak/values.yaml), not managed here.
acme:
  enabled: false

  # Substituted with the real cluster domain by
  # ansible/tasks/apply_gitops_app.yml (same placeholder convention as
  # every agent chart's global.clusterBaseDomain). The wildcard
  # certificate covers "*.<clusterBaseDomain>"; the API-server
  # certificate covers "api." + the domain with the leading "apps."
  # stripped (api.demo222.startx.fr for apps.demo222.startx.fr).
  clusterBaseDomain: apps.mycluster.example.com

  # ACME account contact - Let's Encrypt sends expiry warnings here if
  # renewal ever silently stalls (this repo has no cert-manager
  # Certificate-readiness alerting yet; ADR-0211 flags that as future
  # work, so this mailbox is the only passive safety net).
  email: dev+zuno-acme@startx.fr

  # Which issuer the three Certificate resources reference. Ships as the
  # STAGING issuer (certs untrusted, but the full DNS-01 flow is
  # exercised end to end) - flip to letsencrypt-route53 after the
  # rehearsal, per ADR-0211's own acceptance criteria.
  certificatesIssuer: letsencrypt-route53-staging

  route53:
    # Environment-specific; these defaults are the values ADR-0211
    # verified live against this project's own AWS account (startx.fr
    # public hosted zone). Not secret - the zone and its ID are public
    # DNS facts; only the IAM access key (Vault: aws/route53-dns01) is.
    region: eu-west-3
    hostedZoneID: Z3HY376RT1N9S1

  consumers:
    # IngressController/default.spec.defaultCertificate -> the wildcard
    # Secret (serves the Console and every Route without its own cert).
    routerDefaultCert: false
    # APIServer/cluster.spec.servingCerts.namedCertificates -> the API
    # certificate (oc login with no custom CA flags).
    apiServerNamedCert: false

# Discovered by ansible and injected via gitops_app_extra_helm_values on the
# -d1 apply; clusterissuer.yaml renders nothing until it's set.
vaultServiceName: ""

# ASSUMPTION: not yet verified against a live cluster. If this is wrong,
# discover the real package/channel/catalog from the cluster's PackageManifest
# at runtime.
cluster-certmanager:
  context: &context
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: cert-manager
    app: cert-manager

  project:
    enabled: false
    context:
      <<: *context
    project:
      enabled: true
      # PreSync ArgoCD hook.
      hooked: true
      type: namespace
      name: cert-manager-operator
      display_name: Zuno Infra Cert-Manager Operator
      description: cert-manager operator, configured by Zuno
      requester: zuno

  operator:
    enabled: false
    context:
      <<: *context
    subscription:
      enabled: true
      name: openshift-cert-manager-operator
      namespace: cert-manager-operator
      operator:
        channel: stable-v1
        name: openshift-cert-manager-operator
        installPlanApproval: Automatic
        source:
          name: redhat-operators
          namespace: openshift-marketplace
    operatorGroup:
      # Namespace-scoped, not AllNamespaces (the chart default).
      enabled: true
      name: cert-manager-operator-group
      namespace: cert-manager-operator
