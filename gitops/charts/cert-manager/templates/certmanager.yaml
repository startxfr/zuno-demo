{{- if .Values.certmanager.enabled }}
# Singleton CR the operator watches to deploy the controller/webhook/cainjector
# pods. Cluster-scoped; name fixed to "cluster" per the operator's convention.
apiVersion: operator.openshift.io/v1alpha1
kind: CertManager
metadata:
  name: cluster
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
{{- if .Values.acme.enabled }}
spec:
  # ADR-0211: on an AWS IPI cluster the VPC resolver serves the installer's
  # PRIVATE hosted zone, whose NS records are unreachable awsdns names -
  # cert-manager's DNS-01 self-check walks to them and gets REFUSED forever
  # even though the public TXT record is already world-visible. Forcing the
  # self-check through public recursive resolvers is the documented fix for
  # this split-horizon DNS setup.
  controllerConfig:
    overrideArgs:
      - --dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53
      - --dns01-recursive-nameservers-only
{{- else }}
spec: {}
{{- end }}
{{- end }}
