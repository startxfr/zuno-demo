{{- if and .Values.acme.enabled .Values.vaultServiceName }}
# ADR-0602 clause 2 / WP-223: the cert-manager namespace's own SecretStore,
# which reads only the keys platform/vault/secret-access.yaml grants it
# (aws/route53-dns01). Rendered here, not by gitops/charts/external-secrets
# with the other stores, because this chart creates the namespace (wave 19)
# and the external-secrets d1 Application syncs before it exists. Same shape
# as gitops/charts/external-secrets/templates/secretstores.yaml;
# platform/vault/check_secret_access.py fails if the two drift apart.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
  namespace: cert-manager
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault
  namespace: cert-manager
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  provider:
    vault:
      server: "{{ if .Values.secretStore.tls }}https{{ else }}http{{ end }}://{{ .Values.vaultServiceName }}.zuno-vault.svc:8200"
      path: zuno
      version: v2
      {{- if .Values.secretStore.tls }}
      caProvider:
        type: ConfigMap
        name: openshift-service-ca.crt
        key: service-ca.crt
      {{- end }}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ns-cert-manager
          serviceAccountRef:
            name: vault-reader
{{- end }}
