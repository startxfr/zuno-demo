{{- if .Values.operator.enabled }}
# Pre-created here rather than left entirely to the operator (which also
# creates it once it processes the CertManager CR below) - same
# "harmless, idempotent, ArgoCD-owned" reasoning as gitops/charts/
# external-secrets/templates/namespace-external-secrets.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
{{- end }}
