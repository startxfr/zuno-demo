{{- if .Values.certmanager.enabled }}
# Pre-created here rather than left entirely to the operator (which also
# creates it once it processes the CertManager CR below) - harmless,
# idempotent, ArgoCD-owned. Unlike gitops/charts/external-secrets's former
# Namespace hooks (removed - zuno-vault/openshift-operators are owned
# elsewhere), "cert-manager" isn't in gitops/charts/namespaces'
# platformNamespaces (it's a Red Hat operator-hardcoded namespace, not a
# zuno-* one - see that chart's values.yaml), so this chart is genuinely
# the only owner. Created as an ArgoCD PreSync hook (own phase, entirely
# before the normal Sync phase) rather than a sync-wave'd resource - this
# namespace is not this Application's own destination.namespace (that's
# cert-manager-operator), so nothing else guarantees its existence before
# the CertManager CR needs it.
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/hook: PreSync
{{- end }}
