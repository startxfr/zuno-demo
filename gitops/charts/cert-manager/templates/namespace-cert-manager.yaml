{{- if .Values.certmanager.enabled }}
# Pre-created as a PreSync hook since this chart's destination.namespace is
# cert-manager-operator, not cert-manager; the operator would otherwise create
# it later.
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    zuno.io/managed-by: argocd
    openshift.io/cluster-monitoring: "true"
  annotations:
    argocd.argoproj.io/hook: PreSync
    openshift.io/description: "cert-manager operand (controller, webhook, CA injector), configured by Zuno."
    openshift.io/display-name: "Zuno Infra Cert-Manager"
    openshift.io/requester: zuno
{{- end }}
