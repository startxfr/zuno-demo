{{- if and .Values.issuer.enabled .Values.vaultServiceName }}
# Renders only once vaultServiceName is set, after Vault's pki/ engine and the
# cert-manager-issuer role/policy are provisioned. serviceAccountRef uses
# cert-manager's TokenRequest-based auth (no static Secret).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-issuer
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  vault:
    # ADR-0602 clause 1 / WP-223: Vault's listener serves TLS with an
    # OpenShift service-ca certificate. caBundle is that CA (base64 PEM),
    # read by ansible/tasks/resolve_vault_ca_bundle.yml from the
    # openshift-service-ca.crt ConfigMap and injected as vaultCaBundle - a
    # ClusterIssuer cannot reference a ConfigMap. The service CA rotates
    # (about yearly, with an overlap period): re-run the owning role
    # (`make d0|d1 install ...`) after a rotation, or issuance fails with an
    # x509 error once the old CA expires.
    server: "https://{{ .Values.vaultServiceName }}.zuno-vault.svc:8200"
    {{- with .Values.vaultCaBundle }}
    caBundle: {{ . | quote }}
    {{- end }}
    path: pki/sign/cert-manager
    auth:
      kubernetes:
        role: cert-manager-issuer
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          name: cert-manager
{{- end }}
