{{- if .Values.acme.enabled }}
# ADR-0211: the least-privilege Route53 IAM access key (created out of
# band by the operator - see ansible/confidential.example.yml's
# "AWS Route53 DNS-01" section for the exact IAM policy), seeded into
# Vault at aws/route53-dns01 by ansible/roles/vault, synced here into the
# cert-manager operand namespace where ClusterIssuer secretRefs resolve.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aws-route53-dns01
  namespace: cert-manager
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "21"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aws-route53-dns01
    creationPolicy: Owner
  data:
    - secretKey: access_key_id
      remoteRef:
        key: aws/route53-dns01
        property: access_key_id
    - secretKey: secret_access_key
      remoteRef:
        key: aws/route53-dns01
        property: secret_access_key
{{- end }}
