# The Red Hat product documentation as UnifAI web sources (WP-168), one entry per product and version.
# Maintained here since rag-ingestion, whose catalogue it was generated from, was retired; edit it by hand.
# Scoped 2026-10-25 (user decisions): latest version of each product only; every docs.redhat.com source
# keeps its own product/version in the /en/ URL form (include), and a book with its own source is
# excluded from the broader one. The crawler (crawl: redhat-docs) follows any /html/ or /html-single/
# link of the host, so unscoped sources pulled other versions, other products and the /documentation/
# (no /en/) copy of the same pages, which filled the retriever slots with duplicates (tekos scenario #11).
sources:
- name: rh-argocd-upstream-stable
  tags:
  - knowledge.tech
  - product:argocd-upstream
  - version:stable
  web:
    urls:
    - https://argo-cd.readthedocs.io/en/stable/
    crawl: generic
    maxPages: 50
    metadata:
      product: Argo CD
      product_slug: argocd-upstream
      version: stable
      family: argocd
      language: en
- name: rh-helm-upstream-latest
  tags:
  - knowledge.tech
