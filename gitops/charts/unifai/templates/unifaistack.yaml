{{- if .Values.stack.enabled }}
{{- $s := .Values.stack }}
# ADR-0561/0574: one UnifaiStack per namespace, named `unifai`.
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiStack
metadata:
  name: unifai
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  profile: {{ $s.profile }}
  deletionPolicy: Retain
  {{- with $s.version }}
  version: {{ . | quote }}
  {{- end }}
  {{- with $s.images }}
  images:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $s.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  storage:
    className: {{ $s.storageClass }}
    sharedClassName: {{ $s.sharedStorageClass }}
  exposure:
    networkPolicy: true
    {{- with $s.ragClients }}
    # Callers of the RAG search outside the stack's namespace (e.g. mcp-gateway acting for a user): they reach the
    # RAG pods only, and still need the user's token (unifai-operator >= 0.1.28).
    ragClients:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- $extra := deepCopy ($s.extraEnv | default dict) }}
  {{- if $s.identity.oidcClaims }}
  {{- /* ADR-0583: teams may hold Keycloak groups; the identity service verifies the token against the realm JWKS. */}}
  {{- $kc := printf "https://keycloak.%s/realms/%s" $.Values.clusterBaseDomain $s.identity.realm }}
  {{- $oidc := list (dict "name" "DIRECTORY_PROVIDER" "value" "oidc-claims") (dict "name" "DIRECTORY_OIDC_JWKS_URL" "value" (printf "%s/protocol/openid-connect/certs" $kc)) (dict "name" "DIRECTORY_OIDC_ISSUER" "value" $kc) }}
  {{- $_ := set $extra "identity" (concat $oidc (index $extra "identity" | default list)) }}
  {{- end }}
  {{- if $s.memory.enabled }}
  {{- /* The memory tool reads Qdrant and the embedding model through these names; the Kubernetes service link would otherwise inject QDRANT_PORT as tcp://<ip>:6333 and leave QDRANT_IP unset (found in the WP-148 live test). */}}
  {{- $mem := list (dict "name" "QDRANT_IP" "value" "qdrant") (dict "name" "QDRANT_PORT" "value" "6333") (dict "name" "EMBEDDING_SERVICE_URL" "value" $s.rag.embeddingUrl) (dict "name" "EMBEDDING_SERVICE_MODEL" "value" $s.rag.embeddingModel) }}
  {{- range $c := list "multiagent" "multiagentWorker" }}
  {{- $_ := set $extra $c (concat $mem (index $extra $c | default list)) }}
  {{- end }}
  {{- end }}
  {{- if $s.identity.internalCalls }}
  {{- /* Service-to-service identity calls must reach the identity Service, not the public route: the route strips X-Internal-Auth, so the secured identity API answers 401 (found live on demo333, 2026-10-22). IDENTITY_HOST stays the public URL for OAuth redirects. */}}
  {{- /* The bare Service name on purpose: it is one of the hosts the services trust with the internal secret (internal_auth_headers); <name>.<ns>.svc only counts when POD_NAMESPACE is set, which the charts do not do. */}}
  {{- $idsvc := "http://identity:13456" }}
  {{- $_ := set $extra "multiagent" (concat (list (dict "name" "DIRECTORY_SSO_URL" "value" $idsvc)) (index $extra "multiagent" | default list)) }}
  {{- $_ := set $extra "multiagentWorker" (concat (list (dict "name" "DIRECTORY_SSO_URL" "value" $idsvc)) (index $extra "multiagentWorker" | default list)) }}
  {{- range $c := list "rag" "ragCelery" "backend" }}
  {{- $_ := set $extra $c (concat (list (dict "name" "IDENTITY_HOST" "value" $idsvc)) (index $extra $c | default list)) }}
  {{- end }}
  {{- end }}
  {{- if $extra }}
  extraEnv:
    {{- toYaml $extra | nindent 4 }}
  {{- end }}
  identity:
    {{- with $s.adminUsers }}
    adminUsers:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    forwardUserToken: {{ $s.identity.forwardUserToken }}
    external:
      url: https://keycloak.{{ .Values.clusterBaseDomain }}
      realm: {{ $s.identity.realm }}
      clientId: {{ $s.identity.clientId }}
      clientSecret: {name: unifai-oidc, key: client-secret}
  {{- with $s.openTelemetry }}
  {{- if .endpoint }}
  # ADR-0566 (WP-147): OTLP export of multiagent, RAG and backend (operator >= 0.1.20).
  openTelemetry:
    endpoint: {{ .endpoint }}
    {{- with .protocol }}
    protocol: {{ . }}
    {{- end }}
    {{- with .sampler }}
    sampler: {{ . }}
    {{- end }}
    {{- with .samplerArg }}
    samplerArg: {{ . | quote }}
    {{- end }}
    {{- if .disableMetrics }}
    disableMetrics: true
    {{- end }}
    {{- with .resourceAttributes }}
    resourceAttributes:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- end }}
  rag:
    embedding:
      mode: remote
      url: {{ $s.rag.embeddingUrl }}
      model: {{ $s.rag.embeddingModel }}
      dimension: {{ $s.rag.embeddingDimension }}
      {{- with $s.rag.embeddingQueryPrefix }}
      # Put before every search query, never before documents (unifai-operator >= 0.1.45); no re-index.
      queryPrefix: {{ . | toJson }}
      {{- end }}
    hybrid: {{ $s.rag.hybrid }}
    {{- with $s.rag.reranker }}
    # Second-stage reranker (unifai-operator >= 0.1.47): the rag pods rerank the fused candidates and fall back to the fused order if it is down.
    reranker:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if $s.rag.tokenReview }}
    # The RAG search accepts OpenShift console tokens (Lightspeed users) after a Kubernetes TokenReview.
    # unifai-operator >= 0.1.29 gives the rag-server its own ServiceAccount and binds it to
    # system:auth-delegator (cluster-wide tokenreviews and subjectaccessreviews, nothing else).
    tokenReview: true
    {{- end }}
    {{- with $s.rag.sharedPublishers }}
    sharedPublishers:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if $s.rag.confluenceVaultPath }}
    confluence:
      username: {name: unifai-confluence, key: email}
      token: {name: unifai-confluence, key: token}
      {{- with $s.rag.confluenceUrl }}
      url: {{ . | quote }}
      {{- end }}
    {{- end }}
  {{- if $s.backup.enabled }}
  backup:
    schedule: {{ $s.backup.schedule | quote }}
    retention: {{ $s.backup.retention }}
    s3:
      bucket: {{ $s.backup.bucket }}
      {{- with $s.backup.endpoint }}
      endpoint: {{ . }}
      {{- end }}
      {{- with $s.backup.region }}
      region: {{ . }}
      {{- end }}
      credentialsSecret: unifai-backup-s3
    {{- with $s.backup.images }}
    images:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
