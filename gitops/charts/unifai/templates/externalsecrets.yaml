{{- if .Values.stack.enabled }}
# ADR-0562: the client secret of realm zuno's `unifai` client, read by the
# UnifaiStack (identity.external.clientSecret).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: unifai-oidc
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target: {name: unifai-oidc, creationPolicy: Owner}
  data:
    - secretKey: client-secret
      remoteRef: {key: {{ .Values.stack.identity.clientSecretVaultPath }}, property: client_secret}
{{- if .Values.stack.rag.confluenceVaultPath }}
---
# ADR-0568: the Confluence technical identity, shared with rag-ingestion and
# mcp-confluence.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: unifai-confluence
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target: {name: unifai-confluence, creationPolicy: Owner}
  dataFrom:
    - extract: {key: {{ .Values.stack.rag.confluenceVaultPath }}}
{{- end }}
{{- if .Values.stack.backup.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: unifai-backup-s3
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target: {name: unifai-backup-s3, creationPolicy: Owner}
  dataFrom:
    - extract: {key: {{ .Values.stack.backup.credentialsVaultPath }}}
{{- end }}
{{- end }}
