{{- if .Values.salesCorpus.enabled }}
# Synthetic sales pages served as a static site (see values.yaml salesCorpus). Reached by the UnifAI rag workers of
# this namespace (the unifai-stack NetworkPolicy already admits same-namespace pods).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.salesCorpus.name }}-site
  namespace: {{ .Values.namespace }}
data:
{{- range $path, $_ := .Files.Glob "files/sales-corpus/*.html" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.salesCorpus.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.salesCorpus.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.salesCorpus.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.salesCorpus.name }}
        # the sidecar of a mesh-injected namespace is not wanted for a static site
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: site
          image: {{ .Values.salesCorpus.image }}
          command: ["python3", "-m", "http.server", "8080", "--directory", "/site"]
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /index.html, port: 8080}
          volumeMounts:
            - name: site
              mountPath: /site
              readOnly: true
      volumes:
        - name: site
          configMap:
            name: {{ .Values.salesCorpus.name }}-site
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.salesCorpus.name }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.salesCorpus.name }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
{{- end }}
