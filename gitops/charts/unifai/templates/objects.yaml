{{- if .Values.stack.enabled }}
{{- $owner := first (default (list "admin") .Values.stack.rag.sharedPublishers) }}
{{- if .Values.gatewayLLM.enabled }}
# ADR-0560/0563: the ai-gateway as the platform's shared LLM, called with the
# signed-in user's token; it ignores the model name and routes by policy.
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiLLM
metadata:
  name: {{ .Values.gatewayLLM.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  owner: {{ $owner }}
  {{- if .Values.gatewayLLM.builtin }}
  builtin: true
  {{- end }}
  type: openai_compatible
  config:
    {{- include "unifai.gatewayLLMConfig" . | nindent 4 }}
---
{{- end }}
{{- if .Values.mcpGateway.enabled }}
# ADR-0571 path B / ADR-0563: MCP tools through mcp-gateway with the user's token.
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiProvider
metadata:
  name: {{ .Values.mcpGateway.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  owner: {{ $owner }}
  {{- if .Values.mcpGateway.builtin }}
  builtin: true
  {{- end }}
  type: mcp_server
  config:
    {{- include "unifai.mcpGatewayConfig" . | nindent 4 }}
---
{{- end }}
{{- range .Values.teams }}
# ADR-0598: a default team workspace for a business group of the realm.
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiTeam
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  owner: {{ $owner }}
  members:
    {{- range .groups }}
    - {type: group, id: {{ . | quote }}}
    {{- end }}
---
{{- end }}
{{- if .Values.templates.enabled }}
{{- include "unifai.templates" (dict "root" . "owner" $owner) }}
{{- end }}
{{- if and (or .Values.teamExamples.enabled .Values.personalStarters) (not (and .Values.gatewayLLM.builtin .Values.mcpGateway.builtin)) }}
{{- fail "teamExamples and personalStarters need gatewayLLM.builtin and mcpGateway.builtin (ADR-0597, UnifAI >= 0.1.58)" }}
{{- end }}
{{- if .Values.teamExamples.enabled }}
{{- range .Values.teams }}
{{- if .examples }}
{{ include "unifai.teamExamples" (dict "root" $ "owner" $owner "team" .name) }}
{{- end }}
{{- end }}
{{- end }}
{{- range .Values.personalStarters }}
{{ include "unifai.personalStarter" (dict "root" $ "user" .) }}
{{- end }}
{{- if and .Values.okf.bundles .Values.okf.verify.keyless .Values.okf.trustedRoot }}
# ADR-0578: the Sigstore trusted root keyless bundles are verified against
# (offline, by unifai-operator >= 0.1.25).
apiVersion: v1
kind: Secret
metadata:
  name: zuno-sigstore-trusted-root
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
type: Opaque
stringData:
  trusted_root.json: |
    {{- .Values.okf.trustedRoot | nindent 4 }}
---
{{- end }}
{{- range .Values.okf.bundles }}
# ADR-0564: a signed OKF agent bundle, pinned by digest.
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiAgentBundle
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  owner: {{ $owner }}
  {{- with .teamId }}
  # The UnifAI team workspace that owns the emitted objects. Its members (not
  # the publisher) see the agent's workflows; the team is created in the
  # identity service (WP-154).
  teamId: {{ . }}
  {{- end }}
  {{- if .groupTeam }}
  # The bundle emits its own UnifaiTeam from zuno.access.groups and puts the
  # objects in it (unifai-operator >= 0.1.25): no hand-made team.
  groupTeam: true
  {{- end }}
  {{- if .servePlaceholder }}
  # ADR-0007: a bundle whose OKF is zuno.status: placeholder is not served by
  # default; this serves it (unifai-operator >= 0.1.26).
  servePlaceholder: true
  {{- end }}
  {{- if .retrieveFirst }}
  # Retriever-backed task agents search before the model reasons. Only for
  # stacks whose multiagent image knows retrieve_first (unifai-operator >= 0.1.26).
  retrieveFirst: true
  {{- end }}
  source:
    oci:
      reference: {{ .reference }}
  verify:
    {{- /* checks.yaml fails the render when keyless is missing */}}
    {{- $keyless := $.Values.okf.verify.keyless | default dict }}
    keyless:
      issuer: {{ $keyless.issuer }}
      subjectRegExp: {{ $keyless.subjectRegExp | quote }}
      trustedRootRef: {name: zuno-sigstore-trusted-root, key: trusted_root.json}
  ceilings:
    {{- toYaml .ceilings | nindent 4 }}
  {{- with .delegation }}
  # Read-only A2A delegation through the zuno a2a-gateway (unifai-operator >= 0.1.43). Unset = a bundle that declares
  # zuno.delegation.targets is refused (DelegationUnsupported). The targets themselves are bounded by
  # ceilings.delegationTargets and re-checked by the gateway.
  delegation:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  entitlement: {{ default "Enforced" .entitlement }}
  llm:
    type: openai_compatible
    config:
      model_name: auto
      base_url: {{ $.Values.gatewayLLM.baseUrl }}
      api_key: EMPTY
      forward_user_token: true
      {{- with $.Values.gatewayLLM.timeoutSeconds }}
      timeout_seconds: {{ . }}
      {{- end }}
      {{- if $.Values.gatewayLLM.routingLookup }}
      request_id_header: X-Zuno-Request-Id
      metadata_lookup_url: {{ $.Values.gatewayLLM.baseUrl }}/routing-decisions/{request_id}
      {{- end }}
  {{- if and $.Values.mcpGateway.enabled $.Values.mcpGateway.perTask }}
  # ADR-0571: one provider per task, carrying X-Zuno-Agent/X-Zuno-Task so the
  # mcp-gateway applies that task's own tool declaration (ADR-0571).
  mcp:
    config:
      mcp_url: {{ $.Values.mcpGateway.url }}
      transport_type: "streamable http"
      auth_method: forward_user_token
  {{- else if $.Values.mcpGateway.enabled }}
  providers: [{{ $.Values.mcpGateway.name }}]
  {{- end }}
  {{- with .retriever }}
  retriever: {{ . }}
  {{- end }}
  {{- with .classificationOverrides }}
  classificationOverrides:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- range .Values.retrievers }}
# ADR-0568: a retriever agents use to search RAG sources, with the caller's own
# token so shared sources of the caller's groups are searched too.
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiRetriever
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  annotations:
    # A retriever in a bundle-owned team (teamRef) can only be created once the
    # bundle (wave 20) has emitted that team.
    argocd.argoproj.io/sync-wave: {{ ternary "25" "15" (not (empty .teamRef)) | quote }}
spec:
  owner: {{ $owner }}
  {{- with .teamId }}
  teamId: {{ . }}
  {{- end }}
  {{- with .teamRef }}
  teamRef: {{ . }}
  {{- end }}
  type: {{ default "docs_rag" .type }}
  config:
    {{- toYaml .config | nindent 4 }}
---
{{- end }}
{{- range .Values.ragSources }}
# ADR-0568: an incrementally synced RAG source.
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiRAGSource
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  owner: {{ $owner }}
  type: {{ .type }}
  {{- with .confluence }}
  confluence:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .web }}
  web:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  visibility: {{ default "private" .visibility }}
  {{- with .classification }}
  # WP-187 (unifai-operator >= 0.1.50): written on every chunk and returned in search results, so the
  # mcp-gateway can raise the data level of a turn. Changing it embeds every page again at the next sync.
  classification: {{ . }}
  {{- end }}
  {{- with .aclGroups }}
  aclGroups:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .tags }}
  # Domain tags (e.g. knowledge.tech) so a search can be scoped to a domain
  # (unifai-operator >= 0.1.28).
  tags:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .syncInterval }}
  syncInterval: {{ . }}
  {{- end }}
  {{- with .resyncToken }}
  # WP-200: any new value queues a sync at once (unifai-operator spec.resyncToken).
  resyncToken: {{ . | quote }}
  {{- end }}
---
{{- end }}
{{- if .Values.redhatDocs.enabled }}
{{- /* WP-168: the Red Hat product documentation, one public web source per product and version. The list is
maintained by hand since rag-ingestion was retired. */}}
{{- range (.Files.Get "files/redhat-docs.yaml" | fromYaml).sources }}
apiVersion: unifai.startx.fr/v1alpha1
kind: UnifaiRAGSource
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  owner: {{ $owner }}
  type: web
  visibility: public
  {{- with $.Values.redhatDocs.classification }}
  classification: {{ . }}
  {{- end }}
  tags:
    {{- toYaml .tags | nindent 4 }}
  web:
    {{- toYaml .web | nindent 4 }}
  syncInterval: {{ $.Values.redhatDocs.syncInterval }}
  {{- if $.Values.redhatDocs.suspend }}
  # Scheduled syncs stopped (spec.suspend); see redhatDocs.suspend in values.yaml.
  suspend: true
  {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
