# ADR-0574 (WP-151). Two Applications render this chart: -d0 with
# operator.install (CatalogSource + Subscription, cluster-scoped) and -d1 with
# stack.enabled (the UnifaiStack and its objects, in `namespace`). The Ansible
# role `unifai` passes the cluster-specific values (gitops_app_extra_helm_values
# replaces this block's defaults in the Application).

clusterBaseDomain: apps.mycluster.example.com
namespace: zuno-unifai

operator:
  # Install the operator from the pinned catalog. The role sets it to false
  # when a Subscription for the package already exists (demo333 runs one
  # created by hand, which must not be duplicated).
  install: false
  # The catalog repository only publishes a moving `latest` tag (each release
  # rebuilds it with every version), so pin it by digest. Current: 0.1.47, signed
  # since 0.1.39 (ADR-0586): its signature, provenance and SBOM verify with the operator
  # release workflow's identity, without the development one. Move it with
  # platform/supply-chain/pin_operator_catalog.py latest --version X.Y.Z at each release.
  catalogImage: quay.io/zuno/unifai-operator-catalog@sha256:2da574dd3d5c4dd526fcb3e0112304d41c074dcccda69c36298aebd98bb319c6
  catalogSourceName: unifai-operator-catalog
  channel: stable
  package: unifai-operator
  # Own namespace + global OperatorGroup (created by the chart), as on demo333
  # since operator 0.1.21; openshift-operators is still accepted (no namespace or
  # OperatorGroup rendered).
  subscriptionNamespace: unifai-operator

stack:
  enabled: false
  profile: dev
  # Namespaces (and optional pod labels) allowed to reach the RAG search of the stack, with the user's own token
  # (unifai-operator >= 0.1.28): ragClients: [{namespace: zuno-ai-run, podLabels: {app: mcp-gateway}}].
  ragClients: []
  # Pinned per release (ADR-0574): never a moving tag in production values.
  # `version` is the tag of the five UnifAI images (an immutable devel-<sha>
  # or a release); `images` overrides single images, by digest.
  version: ""
  images: {}
  # Extra environment by component (operator >= 0.1.22): multiagent,
  # multiagentWorker, rag, ragCelery, backend, identity, ui. Values come from
  # Secrets or ConfigMaps (valueFrom) when they are sensitive.
  extraEnv: {}
  # Wiring of the memory tool (WP-148) to the stack's Qdrant and to the
  # embedding model of `rag` below.
  memory:
    enabled: true
  # Usernames of realm zuno (the operator defaults to `admin`, which realm zuno
  # does not have). ai-ops-01 is the AI platform operations persona.
  adminUsers: [ai-ops-01]
  # OTLP export of the UnifAI services to zuno's collector (ADR-0566). Port
  # 4318 is HTTP: the SDK default protocol is grpc, so set it explicitly.
  openTelemetry:
    endpoint: http://zuno-otel-collector-collector.zuno-monitoring.svc:4318
    protocol: http/protobuf
    sampler: parentbased_always_on
    disableMetrics: false
    resourceAttributes:
      deployment.environment: demo
  storageClass: gp3-csi
  sharedStorageClass: nfs
  identity:
    realm: zuno
    clientId: unifai
    # Vault path of the client secret (seeded by ansible/roles/vault).
    clientSecretVaultPath: keycloak/unifai
    forwardUserToken: true
    # Let a UnifAI team name Keycloak groups (identity directory provider
    # oidc-claims, ADR-0583): needs images that contain the provider.
    oidcClaims: false
    # Operator >= 0.1.23 sets this itself; only for older operators. Points the identity-API clients at the identity Service instead
    # of the public route (needed once the identity API requires the internal
    # secret, which the route strips).
    internalCalls: false
  rag:
    embeddingUrl: http://embeddings-predictor.zuno-ai-run.svc:8080
    embeddingModel: qwen3-embedding-0.6b
    embeddingDimension: 1024
    # Instruction prefix of the query side for Qwen3-Embedding (a real newline before "Query: ", trailing space kept).
    # Remove it to roll back; no re-index either way. The ranking settings (spec.rag.search, spec.rag.reranker) stay unset
    # until measured one by one.
    embeddingQueryPrefix: "Instruct: Given a question, retrieve passages that answer it\nQuery: "
    hybrid: true
    # Let the RAG search authenticate OpenShift console tokens through the Kubernetes TokenReview API
    # (needs unifai-operator >= 0.1.29; grants the rag-server ServiceAccount system:auth-delegator).
    tokenReview: false
    # UnifAI users allowed to publish shared sources (ADR-0568). The
    # UnifaiRAGSource objects below are owned by the first one.
    sharedPublishers: [ai-ops-01]
    # Confluence credentials for the Confluence source type (Vault path of
    # the existing technical identity, ADR-0568).
    confluenceVaultPath: confluence/technical
    # The site those credentials belong to (ADR-0583): the operator limits them to this host;
    # a source on another host is fetched anonymously. Empty = sent to every source's baseUrl.
    confluenceUrl: https://startxfr.atlassian.net
  backup:
    enabled: false
    schedule: "0 2 * * *"
    retention: 7
    bucket: ""
    endpoint: ""
    region: ""
    # Vault path of the AWS identity that writes the backups: by default the
    # one PostgreSQL's pgBackRest uses on the same cluster (field names below).
    credentialsVaultPath: postgresql/backup-s3
    accessKeyProperty: access_key
    secretKeyProperty: secret_key
    # Images of the backup CronJobs and the restore Jobs (operator >= 0.1.36 takes
    # repo@sha256:... verbatim): `awsCli` (default public.ecr.aws/aws-cli/aws-cli)
    # and `mongo` (default docker.io/library/mongo). Pinned per cluster (ADR-0586).
    images: {}

# Shared LLM of the platform: the ai-gateway, called with the user's own token
# (ADR-0560, ADR-0563). Agent bundles emit their own per-task copies.
gatewayLLM:
  enabled: true
  name: zuno-gateway
  baseUrl: http://ai-gateway.zuno-ai-run.svc:8080/v1
  # Attach the gateway's routing decision to every answer (class, provider,
  # model, fallback) for the UI's "why this model" panel (WP-148). Needs the
  # multiagent image of fork devel e76c71cd0 or later.
  routingLookup: true
  # Client-side timeout of the UnifAI LLM client for every task and shared LLM (it cuts at 120 s by default
  # while the ai-gateway allows 180 s to the local models, so a cold first request would fail at 120 s).
  # Unset keeps the client default; retries are unchanged.
  timeoutSeconds: ""

# MCP tools through mcp-gateway's MCP endpoint, with the user's own token
# (ADR-0571 path B until the RHOAI MCP gateway evaluation concludes).
mcpGateway:
  enabled: true
  name: mcp-gateway
  url: http://mcp-gateway.zuno-ai-run.svc:8080/mcp
  # Agent bundles get one MCP provider per task with the X-Zuno-Agent/Task
  # headers (ADR-0571), so tools are the agent task's own declaration instead
  # of the Lightspeed ceiling. Needs unifai-operator >= 0.1.19 (spec.mcp).
  perTask: true

# Signed OKF agent bundles (ADR-0564), verified keyless (ADR-0578): with
# bundles set, verify.keyless {issuer, subjectRegExp} (from
# platform/okf/stack-config.generated.yaml, unifai.verify.keyless) and
# trustedRoot (platform/okf/sigstore/trusted_root.json content) are required.
okf:
  verify: {}
  trustedRoot: ""
  bundles: []
  # - name: tekos
  #   reference: quay.io/zuno/okf-tekos@sha256:<digest>
  #   ceilings: {toolCapabilities: [...], knowledgeDomains: [...], minClassification: C1}
  #   entitlement: GatewayOnly
  #   teamId: <UnifAI team workspace owning the agent's workflows>
  #   groupTeam: true   # or let the bundle emit a team from zuno.access.groups
  #   servePlaceholder: false   # ADR-0007: placeholder agents are not served by default
  #   retrieveFirst: false      # needs a multiagent image with retrieve_first
  #   classificationOverrides: {}
  #   delegation: {gatewayURL: http://a2a-gateway.zuno-ai-run.svc:8080, maxRounds: 3}   # unifai-operator >= 0.1.43; with
  #     ceilings.delegationTargets: [<target agents>]. Inert while unset; enable per bundle through GitOps only with the
  #     user's approval (WP-174), after the 0.1.44 canary.

# Incrementally synced RAG sources (ADR-0568).
# Retrievers over the RAG sources (ADR-0568). The caller's token is forwarded so
# the sources' group ACLs apply.
retrievers: []
# - name: knowledge
#   teamId: <UnifAI team workspace of the agents using it>
#   teamRef: agent-<bundle>   # or the UnifaiTeam a groupTeam bundle emits (unifai-operator >= 0.1.25)
#   config: {source_type: CONFLUENCE, forward_user_token: true, top_k_results: 5, threshold: 0.3}
ragSources: []

# WP-168: the Red Hat product documentation as public web sources (38 UnifaiRAGSource objects, tagged
# knowledge.tech, product:<slug> and version:<n>), generated from the rag-ingestion catalogue. Needs
# unifai-operator >= 0.1.31 and the stack owner in stack.rag.sharedPublishers. Off by default.
redhatDocs:
  enabled: false
  syncInterval: 168h
# - name: tech-satellite
#   tags: [knowledge.tech]   # domain tag for scoped searches (operator >= 0.1.28)
#   type: confluence
#   confluence: {baseUrl: https://startxfr.atlassian.net, spaceKey: SXSI, rootTitle: "Technologie : Satellite", excludeLabels: [obsolete]}
#   visibility: shared
#   aclGroups: [agent_tekos]
#   syncInterval: 6h
