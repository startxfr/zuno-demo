nameOverride: ""
fullnameOverride: ""

platform:
  # Split from zuno-ai-build 2026-08-19 - rag-dspa and mlops-dspa's Argo
  # Workflow-controllers collided on one unscoped "workflow-controller"
  # Lease when sharing a namespace (see the dspa-shared-namespace-
  # leader-election-bug memory). createNamespace stays false: ownership
  # is centralized in gitops/charts/namespaces (platformNamespaces'
  # zuno-mlops entry), same convention rag-ingestion already uses for
  # zuno-ai-build. images.mlops.repository below deliberately still
  # points at zuno-ai-build - the image BUILD stays there
  # (ansible/roles/mlops_build), only the pipeline RUN namespace moved.
  namespace: zuno-mlops
  createNamespace: false

serviceAccount:
  create: true
  name: ""

images:
  mlops:
    repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/mlops
    # Temporarily back to latest (2026-08-20), same as the other charts hit
    # by WP-04's premature v0.1.0 pin (ai-gateway/aiagent-operator/
    # rag-service in 90ce5c3, comage/advantage/finage/naveo in 019a654):
    # the in-cluster BuildConfig only ever writes image:latest, never a
    # pinned release tag. Not yet wired to a live workload, so this hadn't
    # broken anything visibly, but would ImagePullBackOff the moment it is.
    tag: latest
    # Always, not IfNotPresent - with a mutable :latest tag, IfNotPresent
  # serves whatever stale image the node cached, silently ignoring
  # rebuilds (VERIFIED live 2026-08-16 across multiple components).
  # Revisit when WP-04 pins immutable tags.
  pullPolicy: Always

externalSecrets:
  enabled: true
  refreshInterval: 1h
  storeRef:
    kind: ClusterSecretStore
    name: vault-backend

# Same bucket/credential convention components/rag-ingestion already
# established (ADR-0330) - not a new storage system (ADR-0302 point 3).
s3:
  type: aws
  endpoint: ""
  bucket: zuno-corpus
  region: us-east-1
  pathStyle: false
  secretName: mlops-s3-credentials
  externalSecret:
    remoteKey: rag/s3 # ADR-0302 point 3: same bucket/credential rag-ingestion uses
    accessKeyProperty: accessKeyId
    secretKeyProperty: secretAccessKey

artifacts:
  datasetPrefix: mlops/datasets
  modelPrefix: mlops/models
  evalPrefix: mlops/evaluations
  registryPrefix: mlops/registrations

# Read-only access to document_embeddings (rag-service's own table,
# ADR-0015) - this pipeline never writes to Postgres (ADR-0302 point 2).
postgres:
  host: zuno-postgresql-rw.zuno-data.svc.cluster.local
  port: 5432
  database: rag-tech
  schema: public
  sslmode: require
  secretName: mlops-postgres-credentials
  externalSecret:
    remoteKey: rag/postgresql-app # read-only reuse of rag-ingestion's own tech-domain credential (same path as rag-service/rag-ingestion's tech domain)
    usernameProperty: username
    passwordProperty: password

evaluations:
  # ADR-0302 point 5: baked into the image at
  # /opt/app-root/src/evaluations (components/mlops/Containerfile).
  dir: /opt/app-root/src/evaluations

# ADR-0301 point 3 / D5 (docs/adr/0301, 0302 dated progress notes): the
# real Helm value (gitops/charts/openshift-ai/values.yaml's
# modelregistry.registriesNamespace), not the zuno-ai-build those two
# ADRs' original Decision text assumed before ADR-0331's reversion.
modelRegistry:
  namespace: rhoai-model-registries
  url: "" # empty means the in-cluster default (see files/pipeline.py.tpl)

pipelineServer:
  manage: true
  name: mlops-dspa
  pipelineStore: kubernetes
  cacheEnabled: true
  # Switched to externalMySQL 2026-08-19: embeddedMariaDB mode (DSPO's own
  # self-managed pod) has no way to exclude port 3306 from istio's
  # protocol-sniffing interception (no such field on the DSPA CRD's
  # database.mariaDB), so its DatabaseAvailable health check stalls
  # ("context deadline exceeded") - fatal after a cluster restart, this
  # was never actually reliable. Points at the same shared, already
  # mesh-excluded gitops/charts/mariadb instance rag-dspa uses
  # successfully (its own mlpipeline database, this one's mlops sibling -
  # see that chart's templates/database-mlops.yaml).
  metadataDatabase:
    mode: externalMySQL
    externalMySQL:
      host: "mariadb.zuno-data.svc.cluster.local"
      port: "3306"
      username: mlops
      database: mlops
      secretName: mlops-dspa-mysql-credentials
      externalSecret:
        remoteKey: mlops/dspa-mysql
        passwordProperty: password

pipeline:
  name: mlops
  version: v1
  displayName: "MLOps: dataset-to-model LoRA/PEFT pipeline"
  description: "prepare-dataset -> train-lora -> evaluate -> push-registry (ADR-0301/ADR-0302)"
  createPipelineResource: true

# One entry per candidate agent (ADR-0301 point 5: Comage is the starting
# candidate). Deliberately a flat map, not per-agent Pipeline CR variants
# the way rag-ingestion's domains: map is (each mlops run already takes
# --agent as a runtime parameter to the SAME pipeline DAG, not a
# structurally different DAG per agent - prepare-dataset/train-lora/
# evaluate/push-registry never change shape per agent, only their
# knowledgeDomains/baseModel inputs do).
agents:
  comage:
    enabled: true
    knowledgeDomains: [knowledge.sales, knowledge.project]
    baseModel: ibm-granite/granite-3.1-2b-instruct
    loraR: 8
    loraAlpha: 16
    loraDropout: 0.05

# ADR-0351: GPU wiring for the train-lora pipeline task - the ONLY stage
# that needs a GPU. Before this, no task declared any resources at all
# (an earlier flat `resources:` block here was referenced by no template -
# dead config, removed): launched for real, train-lora would schedule on
# any node and mlops.py's `torch.cuda.is_available()` fallback would
# silently train on CPU even with MIG slices free.
training:
  gpu:
    # A WHOLE GPU, not a MIG slice, on purpose: the burst node is
    # MIG-disabled (gitops/charts/machines' zuno-gpu-burst-a) because the
    # ClusterAutoscaler can only scale from zero for plain nvidia.com/gpu -
    # this request is what triggers the 0->1 scale-up, and training gets
    # the full 96GB.
    resource: nvidia.com/gpu
    count: "1"
    # machine.startx.io/group is rendered into node labels by the machines
    # chart's MachineSets. If the ClusterAutoscaler build turns out not to
    # carry template labels into its simulated node during scale-from-zero,
    # drop this selector - the toleration + GPU request already uniquely
    # select the burst group (documented fallback, ADR-0351).
    nodeSelector:
      key: machine.startx.io/group
      value: gpu-burst
    toleration:
      key: zuno.io/gpu-burst
      value: "true"
      effect: NoSchedule
  # Explicit because zuno-ai-build (the DSPA namespace) has no LimitRange:
  # without these the train pod would run wholly unbounded. cpuLimit 7 of
  # the burst g7e.2xlarge's ~7.5 allocatable vCPU.
  resources:
    cpuRequest: "2"
    memoryRequest: 12Gi
    cpuLimit: "7"
    memoryLimit: 24Gi

networkPolicy:
  enabled: true
  egressCidrs: []
