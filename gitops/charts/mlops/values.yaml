nameOverride: ""
fullnameOverride: ""

platform:
  # Split from zuno-ai-build - rag-dspa and mlops-dspa's Argo
  # Workflow-controllers collided on one unscoped "workflow-controller"
  # Lease when sharing a namespace (see the dspa-shared-namespace-
  # leader-election-bug memory). createNamespace stays false: ownership
  # is centralized in gitops/charts/namespaces (platformNamespaces'
  # zuno-mlops entry), same convention rag-ingestion already uses for
  # zuno-ai-build. images.mlops.repository below deliberately still
  # points at zuno-ai-build - the image BUILD stays there
  # (ansible/roles/mlops_build), only the pipeline RUN namespace moved.
  namespace: zuno-mlops
  createNamespace: false

serviceAccount:
  create: true
  name: ""

images:
  mlops:
    repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/mlops
    # image.tag must stay "latest" until a release is cut - see RELEASING.md (two parallel image paths).
    tag: latest
    # Always, not IfNotPresent - the mutable :latest tag needs it to avoid serving a stale cached image; see RELEASING.md.
    #
    # WP-087: this key was indented one level too far LEFT (a sibling of
    # `mlops:`, not a child), while files/pipeline.py.tpl has always read
    # .Values.images.mlops.pullPolicy. Helm resolves the missing path to an
    # empty string rather than failing, so the compiled DAG called
    # set_image_pull_policy(task, "") and kfp rejected it outright:
    # "Invalid imagePullPolicy. Must be one of Always, Never, IfNotPresent."
    # Nothing else in this chart reads either path, so the mistake was
    # invisible to helm lint, helm template and every unit test - it could
    # only ever surface by actually compiling the pipeline, which nothing
    # did until now. gitops/charts/rag-ingestion nests it correctly under
    # images.ingestion, which is why its own compile has always worked.
    pullPolicy: Always

externalSecrets:
  enabled: true
  refreshInterval: 1h
  storeRef:
    kind: ClusterSecretStore
    name: vault-backend

# Same bucket/credential convention components/rag-ingestion already
# established (ADR-0330) - not a new storage system (ADR-0302 point 3).
s3:
  type: aws
  endpoint: ""
  bucket: zuno-corpus
  region: us-east-1
  pathStyle: false
  secretName: mlops-s3-credentials
  externalSecret:
    remoteKey: rag/s3 # ADR-0302 point 3: same bucket/credential rag-ingestion uses
    accessKeyProperty: accessKeyId
    secretKeyProperty: secretAccessKey

# ADR-0526 (WP-087): the models bucket is NOT this chart's s3: bucket, and
# critically NOT its region either - zuno-demo-rag-corpus is eu-west-2
# while s3.region above is us-east-1. boto3 raises PermanentRedirect
# rather than following the redirect, so mlops.py builds a second client
# for these; the Vault credential (rag/s3) is the same one and already
# grants both buckets. Mirrors gitops/charts/models' own modelsS3 block -
# keep the two in step.
modelsS3:
  region: eu-west-2
  endpoint: ""

# ADR-0526 decision 1: where merge-export publishes the merged bf16
# checkpoint. This is the exact prefix gitops/charts/models' weshModel
# reads its spec.model.uri from (<prefix>/<servedModelName>/), so
# promotion is a values change in THAT chart and nothing else - this
# pipeline still never writes gitops/charts/models/values.yaml
# (ADR-0302 point 7).
mergedModel:
  s3Uri: s3://zuno-demo-rag-corpus/models/qwen3.5-9b-wesh
  # Refuse to overwrite a non-empty destination. On the first run the
  # prefix is empty and no LLMInferenceService reads it yet; on any
  # re-run it is the live variant's own weights. Flip only deliberately.
  overwrite: false

artifacts:
  datasetPrefix: mlops/datasets
  modelPrefix: mlops/models
  evalPrefix: mlops/evaluations
  registryPrefix: mlops/registrations

# Read-only access to document_embeddings (rag-service's own table,
# ADR-0015) - this pipeline never writes to Postgres (ADR-0302 point 2).
postgres:
  host: zuno-postgresql-rw.zuno-data.svc.cluster.local
  port: 5432
  database: rag-tech
  # rag, not public. document_embeddings lives in the `rag` schema
  # (rag-ingestion creates it there), and mlops.py issues
  # `SET search_path TO <schema>, public` - with `public` here that
  # resolves to "public, public" and every query fails with
  # "relation document_embeddings does not exist". Unreachable on the
  # WP-087 style objective (that branch never opens a PG connection at
  # all), but wrong for any grounding-domain run, which is how it stayed
  # wrong: the pipeline has never executed.
  schema: rag
  sslmode: require
  secretName: mlops-postgres-credentials
  externalSecret:
    remoteKey: rag/postgresql-app # read-only reuse of rag-ingestion's own tech-domain credential (same path as rag-service/rag-ingestion's tech domain)
    usernameProperty: username
    passwordProperty: password

evaluations:
  # ADR-0302 point 5: baked into the image at
  # /opt/app-root/src/evaluations (components/mlops/Containerfile).
  dir: /opt/app-root/src/evaluations

# WP-087: what the `evaluate` stage needs to reach the live platform.
#
# ADR-0302 point 5 has this stage run the target agent's REAL acceptance
# suite, which authenticates a demo persona against Keycloak and drives
# the BFF - so it needs credentials and URLs, and WP-34 wired none of
# them. The in-cluster service URLs (BFF, runtime, mcp-gateway,
# rag-service, salesforce-mcp) already default correctly inside
# run_scenarios.py, so only these two need setting, plus the persona
# password.
#
# The Secret is NOT created by this chart: the persona password is
# generated by Keycloak and lives in a zuno-auth Secret, so it is copied
# in by ansible/roles/mlops (the same mechanism
# ansible/roles/agents/tasks/run_acceptance_gate.yml already uses to put
# it in zuno-ai-run) rather than invented here.
acceptanceGate:
  keycloakUrl: "https://keycloak.apps.mycluster.example.com"
  frontendUrl: "https://comage.apps.mycluster.example.com"
  credentialsSecretName: acceptance-gate-credentials
  # Holds ca.crt only. Mirrored from openshift-config/keycloak-serving-ca
  # by ansible/roles/mlops/tasks/install.yml - the chart cannot know a
  # cluster's own root CA, and this is a public certificate, so it is a
  # ConfigMap rather than a Secret.
  caConfigMapName: acceptance-gate-ca

# ADR-0301 point 3 / D5 (docs/adr/0301, 0302 dated progress notes): the
# real Helm value (gitops/charts/openshift-ai/values.yaml's
# modelregistry.registriesNamespace), not the zuno-ai-build those two
# ADRs' original Decision text assumed before ADR-0331's reversion.
modelRegistry:
  namespace: rhoai-model-registries
  url: "" # empty means the in-cluster default (see files/pipeline.py.tpl)

pipelineServer:
  manage: true
  name: mlops-dspa
  pipelineStore: kubernetes
  cacheEnabled: true
  # ADR-0545/WP-126: name only - ansible/roles/mlops/tasks/install.yml
  # owns this ConfigMap's data (merged Vault root + openshift-service-ca).
  trustedCABundle:
    configMapName: dsp-mlflow-trust-mlops-dspa
    configMapKey: ca-bundle.crt
  # Switched to externalMySQL: embeddedMariaDB mode (DSPO's own
  # self-managed pod) has no way to exclude port 3306 from istio's
  # protocol-sniffing interception (no such field on the DSPA CRD's
  # database.mariaDB), so its DatabaseAvailable health check stalls
  # ("context deadline exceeded") - fatal after a cluster restart, this
  # was never actually reliable. Points at the same shared, already
  # mesh-excluded gitops/charts/mariadb instance rag-dspa uses
  # successfully (its own mlpipeline database, this one's mlops sibling -
  # see that chart's templates/database-mlops.yaml).
  metadataDatabase:
    mode: externalMySQL
    externalMySQL:
      host: "mariadb.zuno-data.svc.cluster.local"
      port: "3306"
      username: mlops
      database: mlops
      secretName: mlops-dspa-mysql-credentials
      externalSecret:
        remoteKey: mlops/dspa-mysql
        passwordProperty: password

pipeline:
  name: mlops
  # BUMP THIS ON EVERY CHANGE TO THE COMPILED DAG. A KFP PipelineVersion's
  # spec is immutable: re-applying a changed spec under a name that already
  # exists is REJECTED, and the old spec silently stays in force. That is
  # exactly the trap rag-ingestion hit live (see its own values.yaml
  # comment and ansible/roles/rag_ingestion/tasks/
  # compile_one_pipeline_version.yml's fatal rescue branch, mirrored here).
  # v1 was never actually applied - the pipeline has 0 versions and 0 runs -
  # so this rename is free today, and the convention now exists before the
  # first real bump.
  # WP-133: bumped for the new conditional merge_export DAG shape (per
  # agent.skipMerge) - comage's own rendered DAG is unchanged byte-for-byte,
  # but the compiled DAG SOURCE changed, which is this comment's own rule.
  version: v0-3-0
  displayName: "MLOps: dataset-to-model LoRA/PEFT pipeline"
  description: "prepare-dataset -> train-lora -> evaluate -> push-registry (ADR-0301/ADR-0302)"
  createPipelineResource: true

# One entry per candidate agent (ADR-0301 point 5: Comage is the starting
# candidate). Deliberately a flat map, not per-agent Pipeline CR variants
# the way rag-ingestion's domains: map is (each mlops run already takes
# --agent as a runtime parameter to the SAME pipeline DAG, not a
# structurally different DAG per agent - prepare-dataset/train-lora/
# evaluate/push-registry never change shape per agent, only their
# knowledgeDomains/baseModel inputs do).
agents:
  comage:
    enabled: true
    # DELIBERATELY EMPTY since ADR-0526/WP-087. Comage's two declared
    # domains are exactly why WP-34's objective never ran: knowledge.sales
    # resolves to rag-sales (table present, 0 rows) and knowledge.project
    # has no document_embeddings table at all. The replacement objective
    # is a STYLE adaptation drawing on styleCorpusS3Uri below, so
    # prepare-dataset takes that branch and _fetch_domain_grounding_rows
    # returns early without opening a Postgres connection. Re-populating
    # this list would not fail loudly - it would just be ignored while
    # styleCorpusS3Uri is set.
    knowledgeDomains: []
    # ADR-0526 decision 3: the new data-collection surface, overriding
    # ADR-0302 point 2 for this objective. 716 train / 113 validation /
    # 79 held-out test single-turn conversations in OpenAI Messages JSONL,
    # split at seed level, plus a 21-rule style specification. C1 by
    # construction - synthetic conversational material, no business,
    # customer or financial content - so the trained artifact inherits C1.
    styleCorpusS3Uri: s3://zuno-corpus/qwen-wesh-training-corpus.tgz
    # ADR-0518: Qwen3.5-9B staged in S3 (same literal-bucket convention
    # gitops/charts/models' modelsS3 uses), replacing the HF repo id
    # ibm-granite/granite-3.1-2b-instruct that mlops.py pulled from
    # huggingface.co at run time - in-cluster HF downloads hang
    # unreliably here (the same reason every served model is staged in
    # S3). An s3:// value is downloaded by mlops.py's train stage before
    # from_pretrained; a plain HF repo id still works as before. Must
    # point at the same rag/s3-readable bucket this chart's s3: block
    # authenticates against.
    baseModel: s3://zuno-demo-rag-corpus/models/qwen3.5-9b
    loraR: 8
    loraAlpha: 16
    loraDropout: 0.05
    # peft matches a STRING target_modules with re.fullmatch against the
    # full module key. Verified against the staged checkpoint's own
    # model.safetensors.index.json (2026-08-27): this matches exactly 80
    # modules - 24 linear_attn.in_proj_qkv + 24 linear_attn.out_proj on
    # the linear_attention layers, and q/k/v/o_proj on the 8
    # full_attention ones - and matches ZERO mtp.* or model.visual.*
    # modules. The anchor is what does that: mtp.layers.N.self_attn
    # carries q_proj/k_proj/v_proj/o_proj under those exact names, so a
    # plain suffix list would inject LoRA into the multi-token-prediction
    # head. peft resolves to 0.20 here, which DOES have exclude_modules -
    # but an anchored regex is still the better tool: it states positively
    # which modules are trained instead of enumerating what to subtract, so
    # a future architecture variant that adds another head is excluded by
    # construction rather than by remembering to extend a denylist.
    # mlp.* is deliberately untargeted: attention-only at rank 8 is
    # ADR-0526's own stated mitigation against catastrophic forgetting,
    # and a register shift is an output-distribution shift that does not
    # need the FFN.
    loraTargetModules: 'model\.language_model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|linear_attn\.(in_proj_qkv|out_proj))'
  # WP-133: proves ADR-0301/0302's ORIGINAL mechanism (a registered LoRA
  # adapter loaded by vLLM's native multi-LoRA support) rather than
  # ADR-0526's merged-standalone-model path above - the two are mutually
  # exclusive by design (stage_merge_export vs push-registry's own
  # adapter-only fallback), so this needs its own agent entry, not a
  # variant of comage's.
  #
  # Tekos + knowledge.tech is the one ADR-0302 point 2-compliant source
  # with real, non-zero data as of 2026-09-04 (WP-100/WP-129: 570+
  # document_embeddings rows) - comage's own two domains
  # (knowledge.sales/knowledge.project) are exactly why WP-34's original
  # objective never ran (see comage's own knowledgeDomains comment above).
  tekos:
    enabled: true
    # Literal metadata->>'domain' value rag-ingestion writes for tech
    # content (components/rag-ingestion/src/rag_ingestion.py) - "tech"
    # alone matches zero rows, a silent-empty-dataset trap this comment
    # exists to stop from recurring.
    knowledgeDomains: ["knowledge.tech"]
    # No styleCorpusS3Uri: prepare-dataset takes the domain-grounding
    # branch (_fetch_domain_grounding_rows), the actual ADR-0302 point 2
    # mechanism, not ADR-0526's override.
    styleCorpusS3Uri: ""
    baseModel: s3://zuno-demo-rag-corpus/models/qwen3.5-9b
    # ADR-0301 point 1/WP-133: skips merge-export entirely - this run must
    # register the ADAPTER itself (push-registry's existing
    # merge-manifest-absent fallback), never a merged checkpoint, and must
    # never write to mergedModel.s3Uri above (the live-served wesh
    # prefix - mergedModel is a single shared value, not per-agent).
    # files/pipeline.py.tpl reads this at chart-render time to omit the
    # merge_export task from this agent's compiled DAG.
    skipMerge: true
    loraR: 8
    loraAlpha: 16
    loraDropout: 0.05
    # Same anchored regex as comage's own (see that entry's long comment) -
    # both train against the identical qwen3.5-9b checkpoint, so the same
    # module map applies unchanged.
    loraTargetModules: 'model\.language_model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|linear_attn\.(in_proj_qkv|out_proj))'

# ADR-0351: GPU wiring for the train-lora pipeline task - the ONLY stage
# that needs a GPU. Before this, no task declared any resources at all
# (an earlier flat `resources:` block here was referenced by no template -
# dead config, removed): launched for real, train-lora would schedule on
# any node and mlops.py's `torch.cuda.is_available()` fallback would
# silently train on CPU even with MIG slices free.
training:
  # ADR-0539/WP-119: run the LoRA step's compute as a Kubeflow TrainJob
  # that the KFP step submits and waits on. KFP still owns the DAG, the
  # ordering, the caching and the ADR-0107 gate (ADR-0302 decision 1 is
  # unchanged) - only this one step's compute moves off the KFP pod.
  #
  # Disabled by default: enabling it is a live change whose scale-from-zero
  # behaviour for a JobSet-owned pod is not yet proven on this cluster. At
  # false, train-lora runs in-process exactly as before, so this is a
  # one-value rollback.
  #
  # The gpu:/resources: blocks below are now read by
  # templates/trainingruntime.yaml instead of by six KFP SDK calls inside
  # files/pipeline.py.tpl. Same values, same comments, visible in the chart.
  trainJob:
    enabled: true
    runtimeName: mlops-lora
    # ~2h for the one green wesh run; a training pod that outlives this is
    # a step failure, not necessarily a job failure - see trainjob.py's
    # timeout message.
    timeoutSeconds: 14400
    pollSeconds: 15
    # The KFP step when trainJob is on: it submits, polls and prints. It
    # must NOT carry the training GPU request, or it would hold the burst
    # node for the whole run in addition to the trainer pod.
    submitter:
      cpuRequest: "100m"
      cpuLimit: "500m"
      memoryRequest: 256Mi
      memoryLimit: 512Mi
  gpu:
    # A WHOLE GPU, not a MIG slice, on purpose: the burst node is
    # MIG-disabled (gitops/charts/machines' zuno-gpu-burst-a) because the
    # ClusterAutoscaler can only scale from zero for plain nvidia.com/gpu -
    # this request is what triggers the 0->1 scale-up, and training gets
    # the full 96GB.
    resource: nvidia.com/gpu
    count: "1"
    # machine.startx.io/group is rendered into node labels by the machines
    # chart's MachineSets. If the ClusterAutoscaler build turns out not to
    # carry template labels into its simulated node during scale-from-zero,
    # drop this selector - the toleration + GPU request already uniquely
    # select the burst group (documented fallback, ADR-0351).
    nodeSelector:
      key: machine.startx.io/group
      value: gpu-burst
    toleration:
      key: zuno.io/gpu-burst
      value: "true"
      effect: NoSchedule
  # Explicit because zuno-ai-build (the DSPA namespace) has no LimitRange:
  # without these the train pod would run wholly unbounded. cpuLimit 7 of
  # the burst g7e.2xlarge's ~7.5 allocatable vCPU.
  # ADR-0518: memory raised 12/24Gi -> 24/48Gi for the Qwen3.5-9B base
  # (~18GB of bf16 weights transit host RAM in from_pretrained before
  # the Trainer moves them to the GPU; the old sizing fit the 2B
  # granite). The burst node's 64GiB absorbs 48Gi with room for system
  # daemons - it runs nothing else by design (taint).
  resources:
    cpuRequest: "2"
    memoryRequest: 24Gi
    cpuLimit: "7"
    memoryLimit: 48Gi

# ADR-0526 (WP-087): merge-export needs NO GPU, but it is far from free
# and the WP only says "no GPU". It downloads the ~19GB base checkpoint,
# holds the merged model in host RAM, and writes ~19GB back out - so it
# needs real memory and, critically, real ephemeral storage. Left
# unsized it would be BestEffort in a namespace with no LimitRange and
# get evicted part-way through the upload, after the expensive GPU stage
# has already succeeded.
merge:
  resources:
    cpuRequest: "2"
    cpuLimit: "4"
    memoryRequest: 32Gi
    memoryLimit: 48Gi
  # NOT ephemeral-storage requests: kfp 2.17's PipelineTask has no setter
  # for those (verified against the installed SDK), so the only lever the
  # SDK gives for "this stage needs a lot of disk" is placement. Same group
  # label, and the same reasoning, as ansible/roles/mlops_build's own
  # build_node_selector: these two nodes are the only ones here with real
  # headroom. ~19GB in and ~19GB out on one filesystem is not something to
  # leave to whichever node the scheduler happens to pick.
  nodeSelector:
    key: machine.startx.io/group
    value: gpu

networkPolicy:
  enabled: true
  egressCidrs: []

# ADR-0538/WP-116: MLflow experiment tracking (gitops/charts/mlflow). The
# URI MUST carry the operand's /mlflow path prefix - it is what the MLflow
# CR reports in status.address.url, and requests without it answer 404 even
# with a correct workspace header (live-verified 2026-09-02). Port 8443
# carries an OpenShift service-serving certificate, which mlops.py's
# _install_internal_ca() already folds into certifi.
#
# Empty trackingUri = tracking disabled, the correct state on a cluster
# without the mlflow component.
mlflow:
  trackingUri: https://mlflow.redhat-ods-applications.svc:8443/mlflow
  # The multi-tenant server needs this on every request
  # (X-MLFLOW-WORKSPACE); it must name a namespace the MLflow CR's
  # workspaceLabelSelector selects.
  workspace: zuno-mlops
