{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.s3.secretName }}
  namespace: {{ .Values.platform.namespace }}
  labels:
    {{- include "mlops.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  target:
    name: {{ .Values.s3.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.s3.externalSecret.remoteKey | quote }}
        property: {{ .Values.s3.externalSecret.accessKeyProperty | quote }}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.s3.externalSecret.remoteKey | quote }}
        property: {{ .Values.s3.externalSecret.secretKeyProperty | quote }}
---
# Read-only Postgres credential (document_embeddings) - ADR-0302 point 2:
# this pipeline reads rag-ingestion's own tech-domain database, it never
# gets a database of its own.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgres.secretName }}
  namespace: {{ .Values.platform.namespace }}
  labels:
    {{- include "mlops.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  target:
    name: {{ .Values.postgres.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: PGUSER
      remoteRef:
        key: {{ .Values.postgres.externalSecret.remoteKey | quote }}
        property: {{ .Values.postgres.externalSecret.usernameProperty | quote }}
    - secretKey: PGPASSWORD
      remoteRef:
        key: {{ .Values.postgres.externalSecret.remoteKey | quote }}
        property: {{ .Values.postgres.externalSecret.passwordProperty | quote }}
{{- if and .Values.pipelineServer.manage (eq .Values.pipelineServer.metadataDatabase.mode "externalMySQL") }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.pipelineServer.metadataDatabase.externalMySQL.secretName }}
  namespace: {{ .Values.platform.namespace }}
  labels:
    {{- include "mlops.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  target:
    name: {{ .Values.pipelineServer.metadataDatabase.externalMySQL.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.pipelineServer.metadataDatabase.externalMySQL.externalSecret.remoteKey | quote }}
        property: {{ .Values.pipelineServer.metadataDatabase.externalMySQL.externalSecret.passwordProperty | quote }}
{{- end }}
{{- end }}
