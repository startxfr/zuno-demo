{{- /*
ADR-0539/WP-119: the platform contract for LoRA training compute.

NAMESPACED TrainingRuntime, not one of the 15 ClusterTrainingRuntimes.
Those all carry ownerReferences to Trainer/default-trainer and the label
platform.opendatahub.io/instance.name: default-trainer, so the operator
reverts any edit on its next reconcile - pinning this image into one is
impossible. Using one unmodified would instead mean restating image, GPU
request, nodeSelector, toleration and ServiceAccount on EVERY TrainJob,
i.e. in submitter-generated ephemeral YAML rather than in Git, which
inverts this chart's values-driven convention. spec.runtimeRef is
immutable and same-namespace, which points the same way.

This is where the GPU wiring lives now. It used to be six KFP SDK calls
(set_accelerator_type/limit, set_cpu_*, set_memory_*, add_node_selector,
add_toleration) inside files/pipeline.py.tpl - platform configuration
expressed as Python inside a compiled DAG, invisible to anyone reading
the chart. The values it reads are unchanged, including their comments.

No env here: the submitter forwards it per run (components/mlops/src/
trainjob.py), so one runtime serves every agent.
*/ -}}
{{- if .Values.training.trainJob.enabled }}
---
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainingRuntime
metadata:
  name: {{ .Values.training.trainJob.runtimeName }}
  namespace: {{ .Values.platform.namespace }}
  labels:
    {{- include "mlops.labels" . | nindent 4 }}
    # Matches RHOAI's own 15 ClusterTrainingRuntimes (verified live against
    # torch-distributed). Not load-bearing for the override-injection bug
    # below - see the replicatedJobs comment for the actual mechanism -
    # but kept for consistency with the operator's own runtimes.
    trainer.kubeflow.org/framework: torch
spec:
  mlPolicy:
    numNodes: 1
    torch:
      # WP-126: NOT a quoted string. numProcPerNode is IntOrString
      # (`oc explain trainingruntime.spec.mlPolicy.torch.numProcPerNode`:
      # "auto, cpu, gpu, or int value"); the CRD's CEL validation rejects a
      # quoted "1" with "no such overload" (neither the string branch nor
      # the int branch matches), caught live only by
      # `oc apply --dry-run=server` - `helm template`/`helm lint` render
      # and pass either form. A bare YAML 1 parses as the int variant and
      # is accepted.
      numProcPerNode: 1
  template:
    spec:
      replicatedJobs:
        # "node" for both the replicatedJob and the container: this is the
        # pair the operator's own 15 ClusterTrainingRuntimes use, and it is
        # what env overrides key on (envInjection.targets matches the
        # replicatedJob name).
        - name: node
          replicas: 1
          template:
            # WP-126: trainer.kubeflow.org/trainjob-ancestor-step: trainer
            # belongs HERE - on the Job's own metadata (this level) - not on
            # the pod template's metadata one level down. Confirmed live: a
            # version of this file with the label on the pod template built
            # a JobSet/Job whose pod carried the runtime's bare container
            # verbatim, with NEITHER TrainJob.spec.trainer.env NOR
            # command/args ever injected (silently, no controller error) -
            # the controller uses this label, at the Job level, to find
            # which Job in the JobSet is "the trainer step" it should patch.
            # RHOAI's own torch-distributed ClusterTrainingRuntime carries
            # it at this exact level (verified live,
            # `oc get clustertrainingruntime torch-distributed -o json`).
            metadata:
              labels:
                trainer.kubeflow.org/trainjob-ancestor-step: trainer
            spec:
              backoffLimit: 0
              template:
                spec:
                  serviceAccountName: {{ include "mlops.serviceAccountName" . }}
                  restartPolicy: Never
                  nodeSelector:
                    {{ .Values.training.gpu.nodeSelector.key }}: {{ .Values.training.gpu.nodeSelector.value | quote }}
                  tolerations:
                    - key: {{ .Values.training.gpu.toleration.key | quote }}
                      operator: Equal
                      value: {{ .Values.training.gpu.toleration.value | quote }}
                      effect: {{ .Values.training.gpu.toleration.effect | quote }}
                  containers:
                    - name: node
                      image: {{ include "mlops.image" . }}
                      imagePullPolicy: Always
                      resources:
                        requests:
                          cpu: {{ .Values.training.resources.cpuRequest | quote }}
                          memory: {{ .Values.training.resources.memoryRequest | quote }}
                          {{ .Values.training.gpu.resource }}: {{ .Values.training.gpu.count | quote }}
                        limits:
                          cpu: {{ .Values.training.resources.cpuLimit | quote }}
                          memory: {{ .Values.training.resources.memoryLimit | quote }}
                          {{ .Values.training.gpu.resource }}: {{ .Values.training.gpu.count | quote }}
{{- end }}
