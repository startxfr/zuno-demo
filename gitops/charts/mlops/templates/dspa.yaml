{{- if .Values.pipelineServer.manage }}
{{- $s3Endpoint := include "mlops.s3Endpoint" . }}
apiVersion: datasciencepipelinesapplications.opendatahub.io/v1
kind: DataSciencePipelinesApplication
metadata:
  name: {{ .Values.pipelineServer.name }}
  namespace: {{ .Values.platform.namespace }}
  labels:
    {{- include "mlops.labels" . | nindent 4 }}
spec:
  dspVersion: v2
  # DSPO defaults podToPodTLS to true, demanding TLS on MySQL connections
  # the external MariaDB (gitops/charts/mariadb, no spec.tls) doesn't
  # serve - same class of issue as rag-dspa's fix, see
  # gitops/charts/rag-ingestion/templates/dspa.yaml for the full mechanism.
  podToPodTLS: false
  apiServer:
    deploy: true
    pipelineStore: {{ .Values.pipelineServer.pipelineStore }}
    cacheEnabled: {{ .Values.pipelineServer.cacheEnabled }}
    enableSamplePipeline: false
    # ADR-0545/WP-126: trust both the cluster-wide Vault root AND the
    # openshift-service-serving-signer CA (MLflow's, WP-116) - the
    # operator's own odh-trusted-ca-bundle auto-detection only ever
    # provides the former. The ConfigMap's DATA is ansible-managed
    # (ansible/roles/mlops/tasks/install.yml) - it concatenates two live
    # cluster sources Helm cannot see at chart-render time; only this name
    # reference is templated here, same split as
    # gitops/charts/openshift-oauth's keycloak-serving-ca.
    cABundle:
      configMapName: {{ .Values.pipelineServer.trustedCABundle.configMapName }}
      configMapKey: {{ .Values.pipelineServer.trustedCABundle.configMapKey }}
  workflowController:
    deploy: true
  mlmd:
    deploy: true
  objectStorage:
    externalStorage:
      scheme: {{ ternary "https" "http" (hasPrefix "https://" $s3Endpoint) }}
      host: {{ trimPrefix "https://" (trimPrefix "http://" $s3Endpoint) | quote }}
      port: {{ ternary "443" "80" (hasPrefix "https://" $s3Endpoint) | quote }}
      bucket: {{ .Values.s3.bucket | quote }}
      region: {{ .Values.s3.region | quote }}
      s3CredentialsSecret:
        secretName: {{ .Values.s3.secretName }}
        accessKey: AWS_ACCESS_KEY_ID
        secretKey: AWS_SECRET_ACCESS_KEY
  database:
{{- if eq .Values.pipelineServer.metadataDatabase.mode "embeddedMariaDB" }}
    mariaDB:
      deploy: true
{{- else if eq .Values.pipelineServer.metadataDatabase.mode "externalMySQL" }}
    # The DSPO controller's pre-deploy DB probe runs in
    # redhat-ods-applications, OUTSIDE the mesh - the shared mariadb
    # instance (zuno-data, istio-injected) never delivers the
    # server-first MySQL greeting to a plaintext non-mesh client, so the
    # probe fails "context deadline exceeded" forever. The pipeline pods
    # themselves reach MariaDB fine through the same
    # excludeInboundPorts:3306 path rag-dspa's apiserver/mlmd already
    # use - the probe is the only non-mesh client, so it is disabled
    # rather than un-meshing port 3306 for everyone.
    disableHealthCheck: true
    externalDB:
      host: {{ .Values.pipelineServer.metadataDatabase.externalMySQL.host | quote }}
      port: {{ .Values.pipelineServer.metadataDatabase.externalMySQL.port | quote }}
      username: {{ .Values.pipelineServer.metadataDatabase.externalMySQL.username | quote }}
      pipelineDBName: {{ .Values.pipelineServer.metadataDatabase.externalMySQL.database | quote }}
      passwordSecret:
        name: {{ .Values.pipelineServer.metadataDatabase.externalMySQL.secretName }}
        key: password
{{- end }}
{{- end }}
