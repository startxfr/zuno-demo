# Default values for the rag-service chart. Overridden per-environment
# through gitops/apps/rag/application-d1.yaml's spec.source.helm.values.

namespace: zuno-data

# Built by the Day 1 "rag" build component (ADR-0056,
# ansible/roles/rag_build) into zuno-ai-build's ImageStream, pulled
# cross-namespace into zuno-data via the system:image-puller RoleBinding
# ansible/tasks/apply_openshift_build.yml grants.
image:
  repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/rag-service
  tag: latest
  pullPolicy: IfNotPresent

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

# PostgreSQL connection target - owned by the data track (ansible/roles/postgresql).
# Database credentials come from the ExternalSecret below, not from values.
# zuno-postgresql-primary is PGO's own auto-created Service for the
# zuno-postgresql PostgresCluster - there is no plain "postgresql"
# Service, and no "-rw"-suffixed one either (that was CloudNativePG's
# convention - see ansible/roles/postgresql/README.md).
pg:
  host: zuno-postgresql-primary.zuno-data.svc
  port: 5432
  database: zuno

# Kubernetes Secret name populated by the ExternalSecret resolving
# zuno/postgresql/app (generated by ansible/roles/vault) - see
# templates/externalsecret-db.yaml.
dbSecretName: rag-service-db-credentials

# OpenAI-compatible embeddings endpoint - see README "Embedding backend".
embeddingServiceUrl: http://embeddings-predictor.zuno-ai-run.svc:8080/v1/embeddings
embeddingModelName: bge-small-en-v1.5
