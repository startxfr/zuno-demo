# Default values for the rag-service chart. Overridden per-environment
# through gitops/apps/rag/application.yaml's spec.source.helm.values.

namespace: zuno-platform

image:
  repository: image-registry.openshift-image-registry.svc:5000/zuno-platform/rag-service
  tag: latest
  pullPolicy: IfNotPresent

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

# PostgreSQL connection target - owned by the data track (ansible/roles/postgresql).
# Database credentials come from the ExternalSecret below, not from values.
pg:
  host: postgresql.zuno-platform.svc
  port: 5432
  database: zuno

# Kubernetes Secret name populated by the ExternalSecret resolving
# secret/zuno/postgresql/app (generated by ansible/roles/vault) - see
# templates/externalsecret-db.yaml.
dbSecretName: rag-service-db-credentials

# OpenAI-compatible embeddings endpoint - see README "Embedding backend".
embeddingServiceUrl: http://embeddings-predictor.zuno-datascience.svc:8080/v1/embeddings
embeddingModelName: bge-small-en-v1.5
