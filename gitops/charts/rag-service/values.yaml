namespace: zuno-data

# Built by the "rag" build component into zuno-ai-build's ImageStream,
# pulled cross-namespace into zuno-data via the system:image-puller
# RoleBinding.
image:
  repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/rag-service
  tag: latest
  pullPolicy: IfNotPresent

replicas: 1

# ADR-0101 (roadmap WP-12): the HA-capable shape - a PodDisruptionBudget
# (templates/poddisruptionbudget.yaml) and topology spread across nodes,
# both correct and safe at any replica count including the current
# demo-scale replicas: 1 above (a PDB with minAvailable 1 simply protects
# the sole pod from voluntary eviction; whenUnsatisfiable ScheduleAnyway
# makes the spread constraint a soft preference, never a scheduling
# blocker on a single-node/single-zone cluster). replicas itself is left
# at the current demo footprint deliberately - raising it to the >=2
# ADR-0101 describes is an environment-specific override, paired with the
# operator's failover drill (see that ADR's Operator follow-up), not a
# silent default change here.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

# zuno-postgresql-pgbouncer is PGO's auto-created PgBouncer Service in front
# of the zuno-postgresql PostgresCluster (no plain "postgresql" Service).
# Host/port are shared across every knowledge domain - one PostgresCluster,
# many databases (ADR-0204).
pg:
  host: zuno-postgresql-pgbouncer.zuno-data.svc
  port: 5432

# ADR-0204 (WP-21): one entry per logical knowledge domain this deployment
# serves. The in-image authority for domain -> database resolution is
# platform/bindings/knowledge/bindings.yaml (app/bindings.py); the entries
# here are that registry's deploy-side counterpart, rendering per domain:
# an ExternalSecret (templates/externalsecret-db.yaml) resolving the
# domain's own Vault credential, the <envPrefix>_PGUSER/<envPrefix>_
# PGPASSWORD env pair on the Deployment (the credential_env_prefix
# contract), and a schema-apply Job (templates/job-schema-apply.yaml).
# Drift between here and bindings.yaml fails closed: the pool either has
# no credentials or credentials the database rejects, so the domain
# reports not-ready and every query against it is refused.
#
# enabled: false ships a domain dark: no ExternalSecret, no env pair, no
# schema-apply Job - the in-image binding still exists and the domain
# simply reports not-ready (fail closed). The three new ADR-0204 domains
# start dark because their Vault credentials and databases only exist
# after the operator has re-run `make d1 install vault` (seeds
# rag-sales/rag-sxa-legacy/rag-adv postgresql-app credentials) and synced
# gitops/charts/postgresql (creates the databases + the one-time manual
# GRANT its configmap-init-sql.yaml header documents) - see the WP-21
# brief's operator follow-up.
#
# seed: whether the schema-apply Job also loads data/rag/fixtures/seed.sql
# - tech only: the seed rows are technical-documentation fixtures and
# belong to no other domain (loading them elsewhere would recreate the
# cross-domain mixing ADR-0204 exists to end).
knowledgeDomains:
  # knowledge.tech - repointed by WP-21 from the legacy shared "zuno"
  # database to rag-tech, the database rag-ingestion has written to since
  # ADR-0330 (the two finally agree). Its schema-apply Job against
  # rag-tech IS the cutover: first sync after this change creates the
  # rag schema/tables and loads the seed fixtures there.
  - domain: tech
    enabled: true
    database: rag-tech
    schema: rag
    envPrefix: RAGTECH
    vaultPath: rag/postgresql-app
    secretName: rag-service-db-ragtech
    seed: true
  - domain: sales
    enabled: false
    database: rag-sales
    schema: rag
    envPrefix: RAGSALES
    vaultPath: rag-sales/postgresql-app
    secretName: rag-service-db-ragsales
    seed: false
  - domain: sxa-legacy
    enabled: false
    database: rag-sxa-legacy
    schema: rag
    envPrefix: RAGSXALEGACY
    vaultPath: rag-sxa-legacy/postgresql-app
    secretName: rag-service-db-ragsxalegacy
    seed: false
  - domain: adv
    enabled: false
    database: rag-adv
    schema: rag
    envPrefix: RAGADV
    vaultPath: rag-adv/postgresql-app
    secretName: rag-service-db-ragadv
    seed: false

# OpenAI-compatible embeddings endpoint - see README "Embedding backend".
embeddingServiceUrl: http://embeddings-predictor.zuno-ai-run.svc:8080/v1/embeddings
embeddingModelName: bge-small-en-v1.5

# ADR-0322 v0.1 integration scope: opt in to the OGX-backed RAG provider
# prototype (app/ogx_provider.py) instead of the default pgvector+full-text
# hybrid search (app/search.py) - see that module's docstring. False by
# default; the pgvector provider is unaffected either way. Only meaningful
# once gitops/charts/openshift-ai's ogxServer value is also enabled and its
# provider-parity tests (components/rag-service/tests/test_provider_parity.py)
# have been run against a live OGXServer - see the WP-06 brief's operator
# follow-up.
ogxProvider:
  enabled: false
  # Placeholder, not yet verified against a live reconcile (no OGXServer
  # exists on the test cluster yet - see ogxserver.yaml's own comment):
  # assumes the operator names the Service after the OGXServer object
  # (gitops/charts/openshift-ai's ogxServer.name) in its namespace, on
  # network.port's default. Confirm both (`oc get svc -n
  # redhat-ods-applications` and `ogxserver.spec.network.port`'s applied
  # default) once ogxServer.enabled is turned on, and correct this.
  baseUrl: http://zuno-ogx.redhat-ods-applications.svc:8321
  vectorStoreId: ""
