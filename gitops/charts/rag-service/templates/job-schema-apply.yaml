{{- /* ADR-0204 (WP-21): one schema-apply Job per enabled knowledge
domain, each against that domain's own database with that domain's own
credential. ArgoCD Sync hook at wave 41: after the credentials
ExternalSecrets (tracked resources, wave 40) and before the Deployment
(wave 45) within the same Sync phase. NOT a PreSync hook - the Sync phase
only starts after every PreSync hook succeeds, so a PreSync consumer of a
Sync-phase Secret deadlocks forever (incident 2026-08-14, see ADR-0313's
incident note). `hook-delete-policy: BeforeHookCreation` deletes the
previous run's Job since Jobs are immutable.

CREATE SCHEMA IF NOT EXISTS + PGOPTIONS search_path put every object in
the domain's schema (bindings.yaml's database.schema, "rag"): the domain
role owns its whole database (PGO spec.users), so schema creation needs
no public-schema GRANT - sidestepping the post-bootstrap GRANT incident
gitops/charts/postgresql/templates/configmap-init-sql.yaml documents for
objects in "public" (that GRANT is still required for anything else that
lands there).

The SQL/fixtures ConfigMap (zuno-rag-schema) is generated and applied by
ansible/roles/rag, not by this chart. seed.sql is loaded only where the
domain entry says so (tech - the fixtures are technical-documentation
rows and belong to no other domain). */}}
{{- range .Values.knowledgeDomains }}
{{- if .enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: zuno-rag-schema-apply-{{ .domain }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: rag-service
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "41"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  # psql over 3 small files takes seconds; without a deadline a pod stuck in
  # CreateContainerConfigError (not a pod *failure*, so backoffLimit never
  # triggers) hangs the whole sync operation forever.
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      priorityClassName: zuno-platform-weak
      containers:
        - name: psql
          # Mirrored through the zuno-ai-build ImageStream (ansible/roles/
          # image_mirrors), sourced from docker.io/library/postgres:16-bookworm.
          image: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/postgres:16-bookworm
          command:
            - psql
          env:
            - name: PGHOST
              value: {{ $.Values.pg.host | quote }}
            - name: PGPORT
              value: {{ $.Values.pg.port | quote }}
            - name: PGDATABASE
              value: {{ .database | quote }}
            # {{ .schema }},public not just {{ .schema }}: the vector
            # extension's objects live in public (databaseInitSQL creates
            # it with the default search_path), so a bare per-domain
            # search_path can't resolve the vector type ("type \"vector\"
            # does not exist" at 002_pgvector.sql).
            - name: PGOPTIONS
              value: "-c search_path={{ .schema }},public"
            # Direct-to-primary requires TLS (PGO pg_hba hostssl) - same
            # live finding as app/db.py's ssl="require"; psql honors
            # PGSSLMODE, and PGOPTIONS above is fine against real Postgres
            # (it was PgBouncer that rejected startup options).
            - name: PGSSLMODE
              value: require
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: password
          args:
            - -v
            - ON_ERROR_STOP=1
            - -c
            - CREATE SCHEMA IF NOT EXISTS {{ .schema }};
            # WP-21/WP-28 fix: creates document_embeddings (IF NOT EXISTS)
            # before 003/004 ALTER it - every per-domain database is
            # fresh and has never run data/sxa/schema/002_pgvector.sql's
            # CREATE TABLE the way the original "zuno" database has (see
            # ansible/roles/rag/kustomize/schema/kustomization.yaml's own
            # comment on this same fix).
            - -f
            - /sql/002_pgvector.sql
            - -f
            - /sql/003_rag_metadata.sql
            - -f
            - /sql/004_rag_chunking.sql
            {{- if eq .domain "project" }}
            # ADR-0209/WP-28: project_state + project_memberships - only
            # knowledge.project's database needs these.
            - -f
            - /sql/005_project_memory.sql
            {{- end }}
            # ADR-0518: 384 -> 1024 embedding column cutover, every
            # domain database (guarded: only truncates while the column
            # is still 384-wide, a no-op after re-ingestion). Before
            # seed.sql on purpose - seed's NULL-embedding fixtures then
            # land in the already-widened column in the same run.
            - -f
            - /sql/006_embedding_1024.sql
            # ADR-0525: re-size the ivfflat index from the live row count.
            # After 006 on purpose - 006 may DROP and rebuild the index as
            # part of the 384 -> 1024 cutover, which would undo this.
            - -f
            - /sql/007_ivfflat_lists.sql
            {{- if .seed }}
            - -f
            - /sql/seed.sql
            {{- end }}
          volumeMounts:
            - name: sql
              mountPath: /sql
      volumes:
        - name: sql
          configMap:
            name: zuno-rag-schema
---
{{- end }}
{{- end }}
