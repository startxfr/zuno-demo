# ArgoCD PreSync hook Job; applies the RAG metadata schema + seed fixtures
# before the rest of this chart syncs. `hook-delete-policy:
# BeforeHookCreation` deletes the previous run's Job since Jobs are
# immutable.
#
# The SQL/fixtures ConfigMap (zuno-rag-schema) is generated and applied by
# ansible/roles/rag, not by this chart.
apiVersion: batch/v1
kind: Job
metadata:
  name: zuno-rag-schema-apply
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: rag-service
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:16-bookworm
          command:
            - psql
          env:
            - name: PGHOST
              value: {{ .Values.pg.host | quote }}
            - name: PGPORT
              value: {{ .Values.pg.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.pg.database | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbSecretName }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbSecretName }}
                  key: password
          args:
            - -v
            - ON_ERROR_STOP=1
            - -f
            - /sql/003_rag_metadata.sql
            - -f
            - /sql/seed.sql
          volumeMounts:
            - name: sql
              mountPath: /sql
      volumes:
        - name: sql
          configMap:
            name: zuno-rag-schema
