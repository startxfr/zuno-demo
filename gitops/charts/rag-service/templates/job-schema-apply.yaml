# Applies the RAG metadata schema + seed fixtures against PostgreSQL before
# the rest of this chart syncs (ADR-0313). An ArgoCD PreSync hook, not a
# standing Deployment: Jobs are immutable, so `hook-delete-policy:
# BeforeHookCreation` deletes the previous run's Job right before creating
# this one - the exact GitOps-native equivalent of the delete-then-recreate
# ansible used to do by hand via kubernetes.core.k8s. ArgoCD blocks Synced
# until this hook succeeds, so no separate wait is needed on the Ansible
# side either.
#
# The SQL/fixtures ConfigMap (zuno-rag-schema) is still generated by
# ansible/roles/rag/kustomize/schema/ (a plain configMapGenerator reading
# data/rag/) and applied by ansible/roles/rag/tasks/install.yml before this
# Application is synced - static data, not business logic, so it stays
# Ansible-applied for now (see ADR-0313's "Alternatives considered").
apiVersion: batch/v1
kind: Job
metadata:
  name: zuno-rag-schema-apply
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: rag-service
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:16-bookworm
          command:
            - psql
          env:
            - name: PGHOST
              value: {{ .Values.pg.host | quote }}
            - name: PGPORT
              value: {{ .Values.pg.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.pg.database | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbSecretName }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbSecretName }}
                  key: password
          args:
            - -v
            - ON_ERROR_STOP=1
            - -f
            - /sql/003_rag_metadata.sql
            - -f
            - /sql/seed.sql
          volumeMounts:
            - name: sql
              mountPath: /sql
      volumes:
        - name: sql
          configMap:
            name: zuno-rag-schema
