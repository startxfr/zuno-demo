apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: rag-service
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  selector:
    app.kubernetes.io/name: rag-service
  ports:
    - name: http
      port: 8080
      targetPort: http
