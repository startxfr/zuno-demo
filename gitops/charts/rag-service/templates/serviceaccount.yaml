# Dedicated, least-privilege service account. No RBAC binding: this service
# never talks to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-service
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: rag-service
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "35"
