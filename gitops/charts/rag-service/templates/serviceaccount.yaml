# Dedicated, least-privilege service account (ADR-0052). No RBAC binding:
# this service only talks to PostgreSQL/pgvector and the embeddings
# endpoint, never the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-service
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: rag-service
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "35"
