# Resolves the `zunoapp` PostgreSQL credential into a Secret this chart's
# Deployment maps to PGUSER/PGPASSWORD env vars. Consumes only; does not
# own the credential.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.dbSecretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.dbSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: postgresql/app
        property: username
    - secretKey: password
      remoteRef:
        key: postgresql/app
        property: password
