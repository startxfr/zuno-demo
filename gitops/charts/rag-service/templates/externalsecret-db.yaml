# Resolves the `zunoapp` PostgreSQL credential into a Secret this chart's
# Deployment maps to PGUSER/PGPASSWORD env vars - and that the schema-apply
# Job (PreSync hook) consumes too. Consumes only; does not own the
# credential.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.dbSecretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    # PreSync hook (not the former Sync-phase wave 40): the schema-apply Job
    # (PreSync hook, default wave 0) consumes this Secret via secretKeyRef,
    # and ArgoCD only starts the Sync phase after every PreSync hook
    # succeeds - as a Sync-phase resource this deadlocked any fresh install
    # (hit live in gitops/charts/sql-schema, incident 2026-08-14; latent
    # here because the Secret predated the ADR-0313 migration). A hook with
    # no hook-delete-policy persists between syncs, so the Deployment
    # (wave 45) still finds the Secret. See ADR-0313's incident note.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.dbSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: postgresql/app
        property: username
    - secretKey: password
      remoteRef:
        key: postgresql/app
        property: password
