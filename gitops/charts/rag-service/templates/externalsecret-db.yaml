{{- /* ADR-0204 (WP-21): one ExternalSecret per enabled knowledge domain,
resolving that domain's own dedicated PostgreSQL credential (never a
shared superuser - cross-domain isolation is credential-enforced). The
Deployment maps each Secret to the domain's <envPrefix>_PGUSER/
<envPrefix>_PGPASSWORD env pair, and the domain's schema-apply Job
consumes the same Secret. Consumes only; the credential is seeded by
ansible/roles/vault and owned by gitops/charts/postgresql's pguser
ExternalSecrets. */}}
{{- range .Values.knowledgeDomains }}
{{- if .enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}
  namespace: {{ $.Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    # Wave 40: before the schema-apply Job (Sync hook, wave 41) that
    # consumes this Secret via secretKeyRef, and before the Deployment
    # (wave 45). The Job must NOT be a PreSync hook - ArgoCD only starts
    # the Sync phase after every PreSync hook succeeds, so a PreSync
    # consumer of this Sync-phase Secret deadlocks any fresh install (hit
    # lived in the retired gitops/charts/sql-schema) - see ADR-0313's incident note for
    # the full story.
    argocd.argoproj.io/sync-wave: "40"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .secretName }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ .vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .vaultPath }}
        property: password
---
{{- end }}
{{- end }}
