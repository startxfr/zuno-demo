# Resolves the `zunoapp` PostgreSQL credential into a Secret this chart's
# Deployment maps to PGUSER/PGPASSWORD env vars - and that the schema-apply
# Job (PreSync hook) consumes too. Consumes only; does not own the
# credential.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.dbSecretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    # Wave 40: before the schema-apply Job (Sync hook, wave 41) that
    # consumes this Secret via secretKeyRef, and before the Deployment
    # (wave 45). The Job must NOT be a PreSync hook - ArgoCD only starts
    # the Sync phase after every PreSync hook succeeds, so a PreSync
    # consumer of this Sync-phase Secret deadlocks any fresh install (hit
    # live in gitops/charts/sql-schema, incident 2026-08-14; latent here
    # because the Secret predated the ADR-0313 migration). See ADR-0313's
    # incident note.
    argocd.argoproj.io/sync-wave: "40"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.dbSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: postgresql/app
        property: username
    - secretKey: password
      remoteRef:
        key: postgresql/app
        property: password
