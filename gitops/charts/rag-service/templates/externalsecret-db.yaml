# Resolves the same `zunoapp` PostgreSQL application credential the vault
# role generates at secret/zuno/postgresql/app (see
# ansible/roles/vault/tasks/configure.yml) into a Secret this chart's
# Deployment maps to PGUSER/PGPASSWORD env vars. This service does not
# generate or own that credential, only consumes it (ADR-0024).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.dbSecretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.dbSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: zuno/postgresql/app
        property: username
    - secretKey: password
      remoteRef:
        key: zuno/postgresql/app
        property: password
