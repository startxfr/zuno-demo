apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: rag-service
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "45"
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-service
    spec:
      serviceAccountName: rag-service
      priorityClassName: zuno-workload-default
      automountServiceAccountToken: false
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rag-service
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rag-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PGHOST
              value: {{ .Values.pg.host | quote }}
            - name: PGPORT
              value: {{ .Values.pg.port | quote }}
            {{- range .Values.knowledgeDomains }}
            {{- if .enabled }}
            # ADR-0204 (WP-21): per-domain credential pair read by
            # app/db.py's pool registry via app/bindings.py's
            # credential_env_prefix contract. optional: a domain whose
            # Secret hasn't synced yet must report not-ready (fail closed
            # in the app), not block the whole pod from starting -
            # the same posture as db.py's non-fatal per-domain connect.
            - name: {{ .envPrefix }}_PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: username
                  optional: true
            - name: {{ .envPrefix }}_PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: password
                  optional: true
            {{- end }}
            {{- end }}
            - name: EMBEDDING_SERVICE_URL
              value: {{ .Values.embeddingServiceUrl | quote }}
            - name: EMBEDDING_MODEL_NAME
              value: {{ .Values.embeddingModelName | quote }}
            {{- if .Values.ogxProvider.enabled }}
            # ADR-0322: opts /v1/search into app/ogx_provider.py instead of
            # the default pgvector+full-text provider - see values.yaml's
            # ogxProvider comment.
            - name: RAG_PROVIDER
              value: "ogx"
            - name: OGX_BASE_URL
              value: {{ .Values.ogxProvider.baseUrl | quote }}
            - name: OGX_VECTOR_STORE_ID
              value: {{ .Values.ogxProvider.vectorStoreId | quote }}
            {{- end }}
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
