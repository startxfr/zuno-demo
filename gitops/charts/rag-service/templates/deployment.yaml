apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: rag-service
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "45"
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-service
    spec:
      serviceAccountName: rag-service
      priorityClassName: zuno-workload-default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rag-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PGHOST
              value: {{ .Values.pg.host | quote }}
            - name: PGPORT
              value: {{ .Values.pg.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.pg.database | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbSecretName }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbSecretName }}
                  key: password
            - name: EMBEDDING_SERVICE_URL
              value: {{ .Values.embeddingServiceUrl | quote }}
            - name: EMBEDDING_MODEL_NAME
              value: {{ .Values.embeddingModelName | quote }}
            {{- if .Values.ogxProvider.enabled }}
            # ADR-0322: opts /v1/search into app/ogx_provider.py instead of
            # the default pgvector+full-text provider - see values.yaml's
            # ogxProvider comment.
            - name: RAG_PROVIDER
              value: "ogx"
            - name: OGX_BASE_URL
              value: {{ .Values.ogxProvider.baseUrl | quote }}
            - name: OGX_VECTOR_STORE_ID
              value: {{ .Values.ogxProvider.vectorStoreId | quote }}
            {{- end }}
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
