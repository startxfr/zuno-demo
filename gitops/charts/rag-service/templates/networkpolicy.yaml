# Documents and enforces rag-service's actual caller at the workload level,
# on top of the namespace-wide baseline that already permits it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rag-service
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "55"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rag-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-ai-run
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-runtime
      ports:
        - protocol: TCP
          port: 8080
    # ADR-0534/WP-109: admits the eval-class Jobs from
    # gitops/charts/trustyai-config (RAGAS retrieval-quality evaluation
    # needs the REAL /v1/search path - evaluating a copy would measure
    # nothing). Same lm-eval label convention the qwen NetworkPolicies
    # have admitted since ADR-0108/WP-10.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-ai-run
          podSelector:
            matchLabels:
              app.kubernetes.io/name: lm-eval
      ports:
        - protocol: TCP
          port: 8080
