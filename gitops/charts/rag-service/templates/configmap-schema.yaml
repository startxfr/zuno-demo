# The SQL/fixtures ConfigMap job-schema-apply.yaml's Sync-hook Job (wave
# 41) mounts at /sql. Previously generated by
# ansible/roles/rag/kustomize/schema/ and applied out-of-band by Ansible,
# entirely outside GitOps - editing those SQL files had no live effect
# until someone manually re-ran that role. Moved here (ADR-0313's
# "Alternatives considered" already named this as a deferred option) so
# the ConfigMap is part of the same ArgoCD-tracked flow as the Job that
# consumes it. Files are copied under files/sql/, not referenced from
# data/ - Helm's .Files.Get is chart-root-relative and can't traverse ..
# out of the chart. data/rag/schema/ and this chart's own 002_pgvector.sql
# remain the canonical human-readable source; keep this copy in sync by
# hand (the same convention this repo's other schema Jobs use for their still
# Ansible-applied equivalent, zuno-sxa-schema).
apiVersion: v1
kind: ConfigMap
metadata:
  name: zuno-rag-schema
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: rag-service
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
data:
  002_pgvector.sql: |
{{ .Files.Get "files/sql/002_pgvector.sql" | indent 4 }}
  003_rag_metadata.sql: |
{{ .Files.Get "files/sql/003_rag_metadata.sql" | indent 4 }}
  004_rag_chunking.sql: |
{{ .Files.Get "files/sql/004_rag_chunking.sql" | indent 4 }}
  005_project_memory.sql: |
{{ .Files.Get "files/sql/005_project_memory.sql" | indent 4 }}
  006_embedding_1024.sql: |
{{ .Files.Get "files/sql/006_embedding_1024.sql" | indent 4 }}
  # ADR-0525 shipped files/sql/007_ivfflat_lists.sql and referenced it from
  # job-schema-apply.yaml's psql args, but never published it here - so the
  # Job mounted a /sql without it and, under ON_ERROR_STOP=1, every
  # per-domain schema apply failed on the missing file. Added by WP-088,
  # which needs that Job to run at all for 008 below.
  007_ivfflat_lists.sql: |
{{ .Files.Get "files/sql/007_ivfflat_lists.sql" | indent 4 }}
  # ADR-0527: project_memberships becomes a projection of project_grants.
  008_project_membership_projection.sql: |
{{ .Files.Get "files/sql/008_project_membership_projection.sql" | indent 4 }}
  seed.sql: |
{{ .Files.Get "files/sql/seed.sql" | indent 4 }}
