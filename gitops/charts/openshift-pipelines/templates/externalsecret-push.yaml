{{- if .Values.sourceBuilds.enabled }}
{{- $ps := .Values.sourceBuilds.pushSecret }}
# ADR-0620 clause 4: the quay.io robot of the owner, from Vault, as a dockerconfigjson for the
# buildah task's dockerconfig workspace. Properties: username (e.g. zuno+praxis_builder), token.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $ps.name }}
  namespace: {{ .Values.sourceBuilds.namespace }}
  labels:
    zuno.io/managed-by: argocd
spec:
  refreshInterval: 1h
  # ADR-0602/WP-223: this namespace's own SecretStore, which reads only the keys platform/vault/secret-access.yaml grants it.
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: {{ $ps.name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"auth\":\"{{ printf \"%%s:%%s\" .username .token | b64enc }}\"}}}" $ps.registry | squote }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ $ps.vaultKey }}
        property: username
    - secretKey: token
      remoteRef:
        key: {{ $ps.vaultKey }}
        property: token
{{- end }}
