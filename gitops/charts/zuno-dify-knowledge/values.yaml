# ADR-0599 / WP-205: the adapter Dify's External Knowledge API points at. One release, in the Dify namespace.
namespace: zuno-dify

image:
  # Built by the "dify-knowledge" build component (ansible/roles/dify_knowledge_build).
  repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/zuno-dify-knowledge
  # image.tag must stay "latest" until a release is cut - see RELEASING.md (two parallel image paths).
  tag: latest
  # ADR-0603 M16: written by platform/supply-chain/render_release_digests.py from the release
  # ledger, never by hand. Set, it wins over tag (repository@digest, IfNotPresent, no :latest trigger).
  digest: "sha256:200c65c5df5dbe71be28e9e83a5bde0eec1897b02c56336e25f8f4eed6d62053"
  pullPolicy: Always

replicas: 1

# The token proxy of this namespace (ADR-0601) holds the dify client token; the adapter never talks to the gateway directly.
mcpUrl: http://zuno-token-proxy:8080/mcp
toolName: knowledge.tech.search
# knowledge_id Dify sends -> tag. One fixed base today.
knowledgeBases: "tech=knowledge.tech"

# The static key Dify presents as a bearer. Vault dify/knowledge-api, property api_key.
vaultKey: dify/knowledge-api
vaultProperty: api_key

# WP-225 lot C: the key the token proxy asks of its callers (zuno-token-proxy
# inboundAuth), sent as `Authorization: Bearer <key>`; the first key of Vault
# <vaultKey> property vaultProperty (default dify/token-proxy inbound_keys). Enable it
# before, or together with, the proxy's inboundAuth. Off by default: no key sent.
proxyAuth:
  enabled: false
  vaultKey: dify/token-proxy
  vaultProperty: inbound_keys

externalSecrets:
  refreshInterval: 1h
  # ADR-0602/WP-223: the namespace's own SecretStore (was the cluster-wide vault-backend).
  secretStore: vault
resources:
  requests:
    cpu: 25m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 256Mi
