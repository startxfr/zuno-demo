# The static key Dify sends as a bearer. The same Vault item is read by the role to register the
# External Knowledge API in Dify; the adapter mounts it as a file.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zuno-dify-knowledge
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  # ADR-0602/WP-223: this namespace's own SecretStore, which reads only the keys platform/vault/secret-access.yaml grants it.
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: SecretStore
  target:
    name: zuno-dify-knowledge
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: {{ .Values.vaultKey }}
        property: {{ .Values.vaultProperty }}
    {{- if .Values.proxyAuth.enabled }}
    # WP-225 lot C: the token proxy's inbound key (PROXY_KEY_FILE).
    - secretKey: proxy_key
      remoteRef:
        key: {{ .Values.proxyAuth.vaultKey }}
        property: {{ .Values.proxyAuth.vaultProperty }}
    {{- end }}
