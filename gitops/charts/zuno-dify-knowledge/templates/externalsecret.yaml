# The static key Dify sends as a bearer. The same Vault item is read by the role to register the
# External Knowledge API in Dify; the adapter mounts it as a file.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zuno-dify-knowledge
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: ClusterSecretStore
  target:
    name: zuno-dify-knowledge
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: {{ .Values.vaultKey }}
        property: {{ .Values.vaultProperty }}
