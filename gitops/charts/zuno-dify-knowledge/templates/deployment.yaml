apiVersion: apps/v1
kind: Deployment
metadata:
  name: zuno-dify-knowledge
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: zuno-dify-knowledge
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    image.openshift.io/triggers: |-
      {{ include "zuno-dify-knowledge.imageTrigger" . }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: zuno-dify-knowledge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zuno-dify-knowledge
    spec:
      serviceAccountName: zuno-dify-knowledge
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zuno-dify-knowledge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_KEY_FILE
              value: /var/run/zuno-dify-knowledge/api_key
            - name: MCP_URL
              value: {{ .Values.mcpUrl | quote }}
            - name: TOOL_NAME
              value: {{ .Values.toolName | quote }}
            - name: KNOWLEDGE_BASES
              value: {{ .Values.knowledgeBases | quote }}
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: api-key
              mountPath: /var/run/zuno-dify-knowledge
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: api-key
          secret:
            secretName: zuno-dify-knowledge
        - name: tmp
          emptyDir: {}
