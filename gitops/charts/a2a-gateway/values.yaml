namespace: zuno-ai-run

image:
  # Built by the "a2a-gateway" build component into zuno-ai-build's ImageStream, pulled
  # cross-namespace into zuno-ai-run via the system:image-puller RoleBinding.
  repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/a2a-gateway
  # image.tag must stay "latest" until a release is cut - see RELEASING.md (two parallel image paths).
  tag: latest
  # ADR-0603 M16: written by platform/supply-chain/render_release_digests.py from the release
  # ledger, never by hand. Set, it wins over tag (repository@digest, IfNotPresent, no :latest trigger).
  digest: ""
  pullPolicy: Always

replicas: 1

# ADR-0101: PodDisruptionBudget and a soft spread across zones. The task store is in memory, so
# more than one replica needs sticky sessions for tasks/get; one replica is the demo footprint.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Same identity wiring as mcp-gateway (see its values.yaml). Empty issuer means
# "https://keycloak.<clusterBaseDomain>/realms/zuno"; empty JWKS URL means
# "<issuer>/protocol/openid-connect/certs", over the public HTTPS Route
# (ADR-0602 clause 6 / WP-224: no longer the plain-HTTP in-cluster Service).
clusterBaseDomain: apps.mycluster.example.com
keycloakIssuer: ""
# User decision 2026-11-07 (WP-224 review): the JWKS stays on the in-cluster
# Service. The gateways are meshed and zuno-auth is STRICT, so this hop is mTLS
# (the client sidecar originates it), with no dependency on the public load
# balancer and the router hairpin. The issuer above stays HTTPS: it is only
# compared with the token's `iss`. Empty means "<issuer>/protocol/openid-connect/certs"
# (an external Keycloak, ADR-0352 external mode).
keycloakJwksUrl: http://zuno-service.zuno-auth.svc:8080/realms/zuno/protocol/openid-connect/certs
# Tokens of the `unifai` client carry this audience (maas-gateway-audience mapper). A token minted
# for another client of the realm is refused. Empty = the audience is not checked.
jwtAudience: zuno-admin-api

# Downstream gateways, called with the caller's own token.
aiGatewayUrl: http://ai-gateway.zuno-ai-run.svc:8080
mcpGatewayUrl: http://mcp-gateway.zuno-ai-run.svc:8080
# URL written in the agent cards: where UnifAI's A2A client posts.
publicBaseUrl: http://a2a-gateway.zuno-ai-run.svc:8080
toolsEnabled: true

# Namespace of the UnifAI stack whose multi-agent pods may call this service.
unifaiNamespace: zuno-unifai

# ADR-0603 M14 (WP-225 lot C): sign X-Zuno-Agent-Chain on every call to the
# ai-gateway and the mcp-gateway: the agent this gateway runs, its task and the
# delegators it checked, bound to the caller's bearer, exp <= 60 s
# (app/signed_chain.py). The Ed25519 key pair is in Vault (vaultKey, fields
# private_key and public_key; the key must be granted to zuno-ai-run in
# platform/vault/secret-access.yaml); the gateways get public_key as
# agentChain.publicKey. Off by default: no header, as before.
#
# WP-247 lot 2 (ADR-0602 option A): who holds the signing key when sign is true.
#   file     the private key is a Kubernetes Secret (ExternalSecret from vaultKey)
#            mounted in the pod (today's behaviour).
#   transit  the key never leaves Vault: the gateway logs in with its ServiceAccount
#            token (role vault.authRole) and asks transit/sign for each chain. No
#            ExternalSecret, no key mount. If Vault cannot sign, NO chain is sent (the
#            same as an unreadable key today; the verifiers keep the unverified
#            headers), never a fallback to a local key. Switch it in the same window
#            that puts the Transit public key into agentChain.publicKey of the
#            mcp-gateway and the ai-gateway.
agentChain:
  sign: false
  signer: file
  vaultKey: a2a/agent-chain
  vaultProperty: private_key
  vault:
    addr: https://zuno-vault.zuno-vault.svc:8200
    authRole: a2a-gateway
    transitKey: agent-chain

# ADR-0580/WP-161: agent definitions come from the admitted zuno-demo-agents release, pulled and
# verified offline by an init container (same mechanism as mcp-gateway). A failed verification
# keeps the pod in Init (fail closed). ansible/roles/a2a_gateway enables it with the locked digest.
okf:
  fetch:
    enabled: false
    corpReference: ""
    # ADR-0611/WP-246: a registry prefix (e.g. quay-quay-zuno-registry.apps.<domain>/zuno, ADR-0612) holding the release
    # by the same digest. Set, okf-fetch reads from there first (2 short attempts) and falls back to
    # `corpReference`'s own registry; verification is identical either way. Empty: today's behaviour.
    mirror:
      prefix: ""
      plainHttp: false
      # ADR-0612: name of the Secret holding a docker config.json (key config.json) for a Quay prefix. mcp-gateway renders it
      # from Vault registry/quay-pull; a2a-gateway only mounts it. Empty: anonymous pulls (zot).
      pullSecret: ""
    image:
      repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/supply-chain-signer
      tag: latest
      # ADR-0603 M16: written by platform/supply-chain/render_release_digests.py from the release
      # ledger, never by hand. Set, it wins over tag (repository@digest, IfNotPresent, no :latest trigger).
      digest: ""
      pullPolicy: Always
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
