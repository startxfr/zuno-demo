apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2a-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: a2a-gateway
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    {{- if not .Values.image.digest }}
    {{- /* A digest-pinned image must not be rewritten by the :latest trigger. */}}
    image.openshift.io/triggers: |-
      {{ include "a2a-gateway.imageTrigger" (dict "repository" .Values.image.repository "tag" .Values.image.tag "container" "a2a-gateway") }}
    {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: a2a-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: a2a-gateway
      {{- $digestAnnotations := include "a2a-gateway.digestAnnotations" .Values }}
      {{- if or .Values.okf.fetch.enabled $digestAnnotations }}
      annotations:
        {{- if .Values.okf.fetch.enabled }}
        # ADR-0580: a promoted release changes this, which rolls the pods.
        zuno.startx.fr/okf-corp-reference: {{ .Values.okf.fetch.corpReference | quote }}
        {{- with .Values.okf.fetch.mirror.prefix }}
        zuno.startx.fr/okf-mirror: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- with $digestAnnotations }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: a2a-gateway
      priorityClassName: zuno-workload-default
      # WP-247 lot 2: the Transit signer authenticates to Vault with this token.
      automountServiceAccountToken: {{ and .Values.agentChain.sign (eq .Values.agentChain.signer "transit") }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: a2a-gateway
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.okf.fetch.enabled }}
      {{- if not (contains "@sha256:" .Values.okf.fetch.corpReference) }}
      {{- fail "okf.fetch.corpReference must be a @sha256: reference when okf.fetch.enabled is true" }}
      {{- end }}
      initContainers:
        # ADR-0580/WP-161: pull, verify offline, extract. Non-zero exit on any verification
        # failure keeps the pod in Init (fail closed).
        - name: okf-fetch
          image: {{ include "a2a-gateway.imageRef" .Values.okf.fetch.image | quote }}
          imagePullPolicy: {{ include "a2a-gateway.imagePullPolicy" .Values.okf.fetch.image }}
          # Each attempt is cut after 150 s and retried (4 attempts, new connection each time): the
          # egress firewall's dnsName rule for quay.io lets only some of its addresses through, and an
          # `oras` call on a blocked one never returns (seen on demo333, 2026-11-09). Verification is
          # unchanged: any failure of the last attempt still keeps the pod in Init (fail closed).
          command:
            - sh
            - -c
            - |
              if [ -n "$OKF_MIRROR_REFERENCE" ]; then
                for i in 1 2; do
                  timeout 60 python3 /app/platform/supply-chain/admit_okf_bundle.py extract "$OKF_MIRROR_REFERENCE" --mirror "$OKF_MIRROR_PREFIX" $OKF_MIRROR_FLAGS --out /okf && exit 0
                  echo "okf-fetch: mirror attempt $i failed or timed out" >&2
                  sleep 2
                done
                echo "okf-fetch: falling back to the source registry" >&2
                find /okf -mindepth 1 -delete
              fi
              for i in 1 2 3 4; do
                timeout 150 python3 /app/platform/supply-chain/admit_okf_bundle.py extract "$OKF_REFERENCE" --out /okf && exit 0
                echo "okf-fetch attempt $i failed or timed out" >&2
                sleep 5
              done
              exit 1
          env:
            - name: OKF_REFERENCE
              value: {{ .Values.okf.fetch.corpReference | quote }}
            {{- with .Values.okf.fetch.mirror.prefix }}
            {{- $corp := $.Values.okf.fetch.corpReference }}
            - name: OKF_MIRROR_PREFIX
              value: {{ . | quote }}
            - name: OKF_MIRROR_REFERENCE
              value: {{ printf "%s/%s@%s" (trimSuffix "/" .) (base (first (splitList "@" $corp))) (last (splitList "@" $corp)) | quote }}
            - name: OKF_MIRROR_FLAGS
              value: {{ ternary "--plain-http" "" $.Values.okf.fetch.mirror.plainHttp | quote }}
            {{- end }}
            - name: HOME
              value: /tmp
            {{- if .Values.okf.fetch.mirror.pullSecret }}
            - name: DOCKER_CONFIG
              value: /quay-pull
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            {{- if .Values.okf.fetch.mirror.pullSecret }}
            - name: quay-pull
              mountPath: /quay-pull
              readOnly: true
            {{- end }}
            - name: okf
              mountPath: /okf
            - name: okf-tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.okf.fetch.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: a2a-gateway
          image: {{ include "a2a-gateway.imageRef" .Values.image | quote }}
          imagePullPolicy: {{ include "a2a-gateway.imagePullPolicy" .Values.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- /* ADR-0602 clause 6 / WP-224: the JWKS defaults to the issuer's own HTTPS
                 endpoint (public Route, Let's Encrypt), never an empty string - app/auth.py
                 would take "" literally instead of its own default. */}}
            {{- $issuer := .Values.keycloakIssuer | default (printf "https://keycloak.%s/realms/zuno" .Values.clusterBaseDomain) }}
            - name: KEYCLOAK_ISSUER
              value: {{ $issuer | quote }}
            - name: KEYCLOAK_JWKS_URL
              value: {{ .Values.keycloakJwksUrl | default (printf "%s/protocol/openid-connect/certs" $issuer) | quote }}
            - name: JWT_AUDIENCE
              value: {{ .Values.jwtAudience | quote }}
            - name: AI_GATEWAY_URL
              value: {{ .Values.aiGatewayUrl | quote }}
            - name: MCP_GATEWAY_URL
              value: {{ .Values.mcpGatewayUrl | quote }}
            - name: PUBLIC_BASE_URL
              value: {{ .Values.publicBaseUrl | quote }}
            - name: A2A_TOOLS_ENABLED
              value: {{ .Values.toolsEnabled | quote }}
            {{- if .Values.agentChain.sign }}
            # WP-225 lot C: the signing key of X-Zuno-Agent-Chain (externalsecret-agent-chain.yaml).
            {{- if eq .Values.agentChain.signer "transit" }}
            - name: AGENT_CHAIN_SIGNER
              value: transit
            - name: VAULT_ADDR
              value: {{ .Values.agentChain.vault.addr | quote }}
            - name: VAULT_AUTH_ROLE
              value: {{ .Values.agentChain.vault.authRole | quote }}
            - name: VAULT_TRANSIT_KEY
              value: {{ .Values.agentChain.vault.transitKey | quote }}
            - name: VAULT_CACERT
              value: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
            {{- else }}
            - name: AGENT_CHAIN_SIGNING_KEY_FILE
              value: /var/run/zuno-agent-chain/private_key
            {{- end }}
            {{- end }}
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
{{- if .Values.okf.fetch.enabled }}
            - name: AGENTS_DIR
              value: /okf/agents
            - name: LIMITS_POLICY_PATH
              value: /okf/policies/limits/limits-policy.yaml
{{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.okf.fetch.enabled }}
            - name: okf
              mountPath: /okf
              readOnly: true
            {{- end }}
            {{- if and .Values.agentChain.sign (eq .Values.agentChain.signer "file") }}
            - name: agent-chain-key
              mountPath: /var/run/zuno-agent-chain
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and .Values.agentChain.sign (eq .Values.agentChain.signer "file") }}
        - name: agent-chain-key
          secret:
            secretName: a2a-gateway-agent-chain
        {{- end }}
        {{- if .Values.okf.fetch.enabled }}
        - name: okf
          emptyDir: {}
        - name: okf-tmp
          emptyDir: {}
        {{- if .Values.okf.fetch.mirror.pullSecret }}
        - name: quay-pull
          secret:
            secretName: {{ .Values.okf.fetch.mirror.pullSecret }}
        {{- end }}
        {{- end }}
