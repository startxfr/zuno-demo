apiVersion: v1
kind: Service
metadata:
  name: a2a-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: a2a-gateway
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  selector:
    app.kubernetes.io/name: a2a-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
