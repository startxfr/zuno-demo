# Dedicated service account with no RBAC and no token mount: this service only calls HTTP APIs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: a2a-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: a2a-gateway
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
