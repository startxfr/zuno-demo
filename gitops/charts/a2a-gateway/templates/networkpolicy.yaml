# Ingress allow-list: only UnifAI's multi-agent pods (backend and Temporal worker) and the
# acceptance-gate test Job (ADR-0583 standing check, as on the other gateways) may call this
# service. Egress to ai-gateway and mcp-gateway is opened on THEIR policies (a2a-gateway peer).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: a2a-gateway
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: a2a-gateway
  policyTypes:
    - Ingress
  ingress:
    {{- with .Values.unifaiNamespace }}
    - from:
        # One peer element = namespace AND pod labels (intersection), as in mcp-gateway.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: multiagent
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    # The acceptance gate checks the gateway's identity contract (ADR-0585) with persona tokens.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: acceptance-gate
      ports:
        - protocol: TCP
          port: 8080
