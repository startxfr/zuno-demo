{{- /* ADR-0603 M14 (WP-225 lot C): the private key this gateway signs X-Zuno-Agent-Chain
     with (app/signed_chain.py). Rendered only with agentChain.sign. Only this pod
     mounts it; the ai-gateway and the mcp-gateway hold the public key as a chart value. */}}
{{- if .Values.agentChain.sign }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: a2a-gateway-agent-chain
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: a2a-gateway-agent-chain
    creationPolicy: Owner
  data:
    - secretKey: private_key
      remoteRef:
        key: {{ .Values.agentChain.vaultKey }}
        property: {{ .Values.agentChain.vaultProperty }}
{{- end }}
