# operator.enabled renders the Subscription, via the vendored startx
# `operator` chart (into openshift-operators - rhcl-operator's CSV only
# supports AllNamespaces, confirmed against a real cluster, so no
# OperatorGroup is rendered here either - relies on OLM's own pre-existing
# global-operators OperatorGroup); project.enabled renders the Kuadrant
# operand namespace, via the vendored startx `project` chart; kuadrant.enabled
# renders the Kuadrant CR. All default false so templates render nothing by
# default. Two separate ArgoCD Applications (zuno-connectivity-link-d0/-d1)
# set operator/project respectively - same shape as
# gitops/charts/external-secrets.
#
# ASSUMPTION, not yet verified against a live cluster (ADR-0317): the real
# OLM package name for this operator on a given catalog. If wrong, run
# `oc get packagemanifest -n openshift-marketplace | grep -i connectivity`
# (or `-i kuadrant`/`-i rhcl`) against the target cluster and correct this
# value - ansible/roles/connectivity_link/tasks/install.yml's PackageManifest
# lookup fails with a clear diagnostic listing published channels if it's
# wrong, rather than silently subscribing to nothing.
#
# subscription.operator.channel/source.name are left empty by default,
# discovered by ansible and set via gitops_app_extra_helm_values on the -d0
# apply (ADR-0048). templates/checks.yaml fails the render if either is
# still empty once operator.enabled is true.
# quotaEnforcement (ADR-0511/WP-54): renders the GENERATED per-class
# RateLimitPolicies in templates/quota-ratelimitpolicies.yaml (source:
# policies/quotas/quota-policy.yaml via
# platform/okf/generate_quota_enforcement.py - never edit that file by
# hand) PLUS the demo Gateway/HTTPRoute/AuthPolicy in
# templates/quota-demo-gateway.yaml + templates/quota-demo-route.yaml that
# give them something to target (Kuadrant's CRDs hard-reject any targetRef
# that isn't Gateway API - plain OpenShift Routes, which is how every
# agent's real traffic is served today, cannot be targeted at all). Scoped
# to Tekos on a dedicated demo hostname; the real tekos-frontend Route is
# untouched. See this chart's README, WP-54 section, for the live demo
# evidence and rollback (enabled: false removes all of it via ArgoCD
# selfHeal). Token budgets are NOT here: they are enforced by AI Gateway
# (components/ai-gateway/app/quota_budgets.yaml, generated from the same
# policy file).
#
# Split into gateway/route sub-switches so the two halves can be applied
# by different ArgoCD Applications on different Days: gateway (ConfigMap +
# Gateway + Route) has no dependency on any Day2 workload and stays on
# zuno-connectivity-link-d1 (Day1); route (HTTPRoute + AuthPolicy) plus the
# sibling RateLimitPolicy target/reference the tekos-frontend backend
# Service, which is only created by Day2's `agents` role - rendering them
# from Day1 made the HTTPRoute permanently BackendNotFound/Degraded until
# Day2 ran, which in turn made zuno-connectivity-link-d1's Synced+Healthy
# wait in ansible/roles/connectivity_link/tasks/install.yml liable to time
# out and hard-fail `make day1 install` on every fresh cluster. route
# defaults false so only the Day2 zuno-connectivity-link-quota-d1
# Application (ansible/roles/agents/tasks/install.yml, applied after
# zuno-api-d1/tekos-frontend exists) renders it.
quotaEnforcement:
  enabled: true
  gateway:
    enabled: true
  route:
    enabled: false
  routeName: tekos-quota-demo
  routeNamespace: zuno-ai-run
  demoHostname: tekos-quota-demo.apps.demo222.startx.fr
  demoBackendService: tekos-frontend
  demoBackendPort: 8080
  # jwksUrl, not issuerUrl (OIDC discovery) - Authorino runs in-cluster and
  # doesn't trust the CA signing the external Keycloak route's cert; the
  # internal Service endpoint is plain HTTP, sidestepping TLS trust
  # entirely - see this chart's README for details.
  keycloakJwksUrl: http://zuno-service.zuno-auth.svc:8080/realms/zuno/protocol/openid-connect/certs

operator:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: connectivity-link
    app: connectivity-link
  subscription:
    enabled: true
    name: rhcl-operator
    namespace: openshift-operators
    operator:
      # Must be set explicitly, same name as subscription.name: the vendored
      # `operator` chart defaults this to "codeready-workspaces", silently
      # suppressing the fallback to subscription.name.
      name: rhcl-operator
      channel: ""
      installPlanApproval: Automatic  # startx chart defaults to Manual
      source:
        name: ""
        namespace: openshift-marketplace
  # rhcl-operator's own CSV/controller already creates this ConsolePlugin
  # (confirmed on a live cluster: labels app.kubernetes.io/managed-by:
  # kuadrant-operator) - declaring it here too is intentional, not a
  # duplicate to clean up. It buys GitOps visibility/drift-detection for
  # a resource that would otherwise exist outside git entirely. spec below
  # is copied verbatim from the live cluster object; keep it in sync if
  # RHCL ever changes its backend service/port.
  consolePlugin:
    enabled: true
    name: kuadrant-console-plugin
    spec: |
      backend:
        service:
          basePath: /
          name: kuadrant-console-plugin
          namespace: openshift-operators
          port: 9443
        type: Service
      displayName: Kuadrant Console Plugin
      i18n:
        loadType: Preload

# Namespace for the Kuadrant operand CR only - NOT the operator's namespace
# (that's the hardcoded openshift-operators above). Pre-created as a
# PreSync hook since nothing else in this repository creates it (same
# idiom as gitops/charts/cert-manager's own startx `project` dependency).
project:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: connectivity-link
    app: connectivity-link
  project:
    enabled: true
    hooked: true  # PreSync ArgoCD hook
    type: namespace
    name: kuadrant-system
    display_name: Zuno Infra Connectivity Link
    description: "Red Hat Connectivity Link (Kuadrant) operand, configured by Zuno."
    requester: zuno

kuadrant:
  enabled: false
  # Enables the spec.listener.tls override in templates/authorino.yaml so
  # Authorino's own listener is TLS-enabled - required for
  # DataScienceCluster's MaaSPrerequisitesAvailable condition (this
  # comment previously, incorrectly, pointed at templates/kuadrant.yaml -
  # that file's own comment has always explained why it CAN'T carry this
  # override; templates/authorino.yaml is and always was the actual patch
  # target). Off by default here, same "all default false, flipped at the
  # Application layer" convention as operator/project/kuadrant above; set
  # true via gitops/apps/connectivity-link/application-d1.yaml.
  #
  # certSecretName (WP-071) names an OpenShift Service-CA-issued Secret,
  # NOT a cert-manager Certificate - there is no templates/certificate.yaml
  # any more. The live diagnostic behind WP-071 established that RHCL's
  # generated `kuadrant-auth-service` Envoy cluster (the one Kuadrant's
  # wasm-shim actually dials for every AuthPolicy ext_authz Check) trusts
  # OpenShift's service-ca.crt, not any cert-manager root - so no
  # Certificate issued by any ClusterIssuer (including the previous
  # vault-issuer-istio) can satisfy the real caller. Fixed by annotating
  # the operator-owned Authorino Service with
  # service.beta.openshift.io/serving-cert-secret-name: <this value>
  # (ansible/roles/connectivity_link/tasks/install.yml) - this CRD has no
  # field to request that annotation through the CR. This value MUST match
  # the literal secret name hardcoded in that Ansible task; nothing keeps
  # them in sync automatically, same manual-sync convention as
  # operandNamespace below. dnsNames is gone: the Service CA Operator
  # derives the Service's DNS names from the Service object itself, no
  # override needed.
  authorinoTls:
    enabled: false
    certSecretName: authorino-server-cert

# Referenced by templates/kuadrant.yaml - kept in sync with
# project.project.name above (must match, since that's what actually
# creates the namespace).
operandNamespace: kuadrant-system
