# operator.enabled renders the Subscription (into openshift-operators -
# rhcl-operator's CSV only supports AllNamespaces, confirmed against a
# real cluster, so no dedicated namespace/OperatorGroup is created for
# it); kuadrant.enabled renders the operand namespace + Kuadrant CR. Both
# default false so templates render nothing by default. Two separate
# ArgoCD Applications (zuno-connectivity-link-d0/-d1) each set one - same
# shape as gitops/charts/external-secrets.
operator:
  enabled: false
kuadrant:
  enabled: false

# Namespace for the Kuadrant operand CR only - NOT the operator's
# namespace (that's the hardcoded openshift-operators in
# templates/subscription.yaml).
operandNamespace: kuadrant-system

# ASSUMPTION, not yet verified against a live cluster (ADR-0317): the real
# OLM package name for this operator on a given catalog. If wrong, run
# `oc get packagemanifest -n openshift-marketplace | grep -i connectivity`
# (or `-i kuadrant`/`-i rhcl`) against the target cluster and correct this
# value - ansible/roles/connectivity_link/tasks/install.yml's PackageManifest
# lookup fails with a clear diagnostic listing published channels if it's
# wrong, rather than silently subscribing to nothing.
subscriptionName: rhcl-operator

# subscriptionChannel/subscriptionCatalogSource are discovered from the
# cluster's own PackageManifest by ansible and injected via
# gitops_app_extra_helm_values on the -d0 apply (ADR-0048);
# templates/subscription.yaml renders nothing until both are set.
subscriptionChannel: ""
subscriptionCatalogSource: ""
