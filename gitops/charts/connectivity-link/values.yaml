# operator.enabled renders the Subscription, via the vendored startx
# `operator` chart (into openshift-operators - rhcl-operator's CSV only
# supports AllNamespaces, confirmed against a real cluster, so no
# OperatorGroup is rendered here either - relies on OLM's own pre-existing
# global-operators OperatorGroup); project.enabled renders the Kuadrant
# operand namespace, via the vendored startx `project` chart; kuadrant.enabled
# renders the Kuadrant CR. All default false so templates render nothing by
# default. Two separate ArgoCD Applications (zuno-connectivity-link-d0/-d1)
# set operator/project respectively - same shape as
# gitops/charts/external-secrets.
#
# ASSUMPTION, not yet verified against a live cluster (ADR-0317): the real
# OLM package name for this operator on a given catalog. If wrong, run
# `oc get packagemanifest -n openshift-marketplace | grep -i connectivity`
# (or `-i kuadrant`/`-i rhcl`) against the target cluster and correct this
# value - ansible/roles/connectivity_link/tasks/install.yml's PackageManifest
# lookup fails with a clear diagnostic listing published channels if it's
# wrong, rather than silently subscribing to nothing.
#
# subscription.operator.channel/source.name are left empty by default,
# discovered by ansible and set via gitops_app_extra_helm_values on the -d0
# apply (ADR-0048). templates/checks.yaml fails the render if either is
# still empty once operator.enabled is true.
operator:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: connectivity-link
    app: connectivity-link
  subscription:
    enabled: true
    name: rhcl-operator
    namespace: openshift-operators
    operator:
      # Must be set explicitly, same name as subscription.name: the
      # vendored `operator` chart's own values.yaml gives this a
      # non-empty default ("codeready-workspaces") that wins the merge
      # and silently suppresses the fallback to subscription.name.
      name: rhcl-operator
      channel: ""
      installPlanApproval: Automatic  # startx chart defaults to Manual
      source:
        name: ""
        namespace: openshift-marketplace
  # rhcl-operator's own CSV/controller already creates this ConsolePlugin
  # (confirmed on a live cluster: labels app.kubernetes.io/managed-by:
  # kuadrant-operator) - declaring it here too is intentional, not a
  # duplicate to clean up. It buys GitOps visibility/drift-detection for
  # a resource that would otherwise exist outside git entirely. spec below
  # is copied verbatim from the live cluster object; keep it in sync if
  # RHCL ever changes its backend service/port.
  consolePlugin:
    enabled: true
    name: kuadrant-console-plugin
    spec: |
      backend:
        service:
          basePath: /
          name: kuadrant-console-plugin
          namespace: openshift-operators
          port: 9443
        type: Service
      displayName: Kuadrant Console Plugin
      i18n:
        loadType: Preload

# Namespace for the Kuadrant operand CR only - NOT the operator's namespace
# (that's the hardcoded openshift-operators above). Pre-created as a
# PreSync hook since nothing else in this repository creates it (same
# idiom as gitops/charts/cert-manager's own startx `project` dependency).
project:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: connectivity-link
    app: connectivity-link
  project:
    enabled: true
    hooked: true  # PreSync ArgoCD hook
    type: namespace
    name: kuadrant-system
    display_name: Zuno Infra Connectivity Link
    description: "Red Hat Connectivity Link (Kuadrant) operand, configured by Zuno."
    requester: zuno

kuadrant:
  enabled: false
  # Enables the spec.authorino.listener.tls override in templates/kuadrant.yaml
  # (backed by the Certificate in templates/certificate.yaml) so Authorino's
  # own listener is TLS-enabled - required for DataScienceCluster's
  # MaaSPrerequisitesAvailable condition. Off by default here, same
  # "all default false, flipped at the Application layer" convention as
  # operator/project/kuadrant above; set true via
  # gitops/apps/connectivity-link/application-d1.yaml.
  authorinoTls:
    enabled: false
    certSecretName: authorino-server-tls
    dnsNames:
      - authorino-authorino-authorization.kuadrant-system.svc
      - authorino-authorino-authorization.kuadrant-system.svc.cluster.local

# Referenced by templates/kuadrant.yaml - kept in sync with
# project.project.name above (must match, since that's what actually
# creates the namespace).
operandNamespace: kuadrant-system
