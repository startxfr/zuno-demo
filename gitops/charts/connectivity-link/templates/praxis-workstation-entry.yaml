{{- if .Values.praxisWorkstationEntry.enabled }}
# Off renders nothing, not even this comment: a disabled entry leaves the chart's render byte-identical.
# ADR-0619 clause 8 (WP-298): Praxis's entry for workstation experience clients. Claude Code is the first
# (Anthropic Messages calls); the Blender add-on may reuse it for chat completions (WP-302). Modelled on
# workstation-entry.yaml, the ai-gateway's entry for the Blender add-on (ADR-0610).
#
# One hostname on the shared zuno-agent-gateway (quota-demo-gateway.yaml owns the Gateway; with this entry on, its
# listener also admits routes from praxisWorkstationEntry.namespace):
#   Route (openshift-ingress, reencrypt, the router's *.apps wildcard)
#     -> zuno-agent-gateway (Istio, Gateway API)
#     -> HTTPRoute (zuno-ai-gateways): the listed paths only (POST /v1/messages, POST /v1/messages/count_tokens,
#        GET /v1/models, POST /v1/chat/completions), everything else 404
#     -> AuthPolicy: Keycloak issuer and the zuno-admin-api audience pinned (ADR-0619 clause 4), the token's azp must
#        be a declared workstation client and, when allowedGroups is set, the user must be in one of them
#     -> RateLimitPolicy: requests per user (auth.identity.sub)
#     -> praxis:8080, which verifies the same token again (ADR-0619 clause 4).
# Praxis's own NetworkPolicy must admit the zuno-agent-gateway pod (the chart of WP-292); turn both on together.
#
# Rollback: praxisWorkstationEntry.enabled false in gitops/apps/connectivity-link/application-d1.yaml, re-run the
# connectivity_link role; ArgoCD prunes the four objects and the listener goes back to its single namespace.
{{- /* Same guard as workstation-entry.yaml: Authorino discovers the issuer over HTTPS and trusts only the Let's
     Encrypt certificate (ADR-0211); on the Vault-issued one every request would 500. */}}
{{- if not .Values.praxisWorkstationEntry.keycloakAcmeWildcardTLS }}
{{- fail "praxisWorkstationEntry.enabled needs praxisWorkstationEntry.keycloakAcmeWildcardTLS=true: the AuthPolicy validates tokens over https://keycloak.<clusterBaseDomain> and Authorino trusts only the Let's Encrypt certificate there (ADR-0211)." }}
{{- end }}
{{- if not .Values.praxisWorkstationEntry.allowedClients }}
{{- fail "praxisWorkstationEntry.allowedClients is empty: name at least one workstation Keycloak client (azp)." }}
{{- end }}
{{- if not .Values.praxisWorkstationEntry.paths }}
{{- fail "praxisWorkstationEntry.paths is empty: list the {method, path} pairs the entry opens." }}
{{- end }}
{{- if not (and .Values.quotaEnforcement.enabled .Values.quotaEnforcement.gateway.enabled) }}
{{- fail "praxisWorkstationEntry.enabled needs the zuno-agent-gateway: quotaEnforcement.enabled and quotaEnforcement.gateway.enabled." }}
{{- end }}
{{- $w := .Values.praxisWorkstationEntry }}
{{- $issuer := $w.keycloakIssuerUrl | default (printf "https://keycloak.%s/realms/zuno" .Values.clusterBaseDomain) }}
{{- $hostname := $w.hostname | default (printf "praxis.%s" .Values.clusterBaseDomain) }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: zuno-agent-gateway-workstation-praxis
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: zuno-workstation-entry
  annotations:
    # A coding turn on a local model can stream for minutes; the router's default is 30 s.
    haproxy.router.openshift.io/timeout: {{ $w.timeout | quote }}
spec:
  host: {{ $hostname }}
  port:
    targetPort: 443
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: zuno-agent-gateway-istio
    weight: 100
  wildcardPolicy: None
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: praxis-workstation
  namespace: {{ $w.namespace }}
  labels:
    app.kubernetes.io/part-of: zuno-workstation-entry
spec:
  parentRefs:
    - name: zuno-agent-gateway
      namespace: openshift-ingress
  hostnames:
    - {{ $hostname }}
  rules:
    - matches:
      {{- range $w.paths }}
        # A path match ignores the query string: Claude Code's POST /v1/messages?beta=true matches.
        - path:
            type: Exact
            value: {{ .path }}
          method: {{ .method }}
      {{- end }}
      timeouts:
        request: {{ $w.timeout }}
      backendRefs:
        - name: {{ $w.backendService }}
          port: {{ $w.backendPort }}
---
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: praxis-workstation-jwt
  namespace: {{ $w.namespace }}
  labels:
    app.kubernetes.io/part-of: zuno-workstation-entry
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: praxis-workstation
  rules:
    authentication:
      # Claude Code's apiKeyHelper output arrives as `Authorization: Bearer` (and X-Api-Key, which is not read).
      keycloak-jwt:
        jwt:
          issuerUrl: {{ $issuer }}
    authorization:
      zuno-audience-and-client:
        patternMatching:
          patterns:
            - any:
                - selector: auth.identity.aud
                  operator: incl
                  value: {{ .Values.quotaEnforcement.requiredAudience | quote }}
                - selector: auth.identity.aud
                  operator: eq
                  value: {{ .Values.quotaEnforcement.requiredAudience | quote }}
            - any:
              {{- range $w.allowedClients }}
                - selector: auth.identity.azp
                  operator: eq
                  value: {{ . | quote }}
              {{- end }}
            {{- with $w.allowedGroups }}
            # A public device-grant client lets any realm user mint a token: only these groups pass (full path,
            # as the client's groups mapper writes them).
            - any:
              {{- range . }}
                - selector: auth.identity.groups
                  operator: incl
                  value: {{ printf "/%s" (trimPrefix "/" .) | quote }}
              {{- end }}
            {{- end }}
    # Publish the identity for the RateLimitPolicy below: without it its auth.identity.sub counter does not resolve
    # and the wasm shim silently skips every rate-limit call (WP-54 trap 1, same block as workstation-entry.yaml).
    response:
      success:
        filters:
          identity:
            json:
              properties:
                sub:
                  expression: auth.identity.sub
                groups:
                  expression: 'has(auth.identity.groups) ? auth.identity.groups : []'
---
# Request rate per user on the entry. A Claude Code turn makes several calls (count_tokens, then messages).
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: praxis-workstation
  namespace: {{ $w.namespace }}
  labels:
    app.kubernetes.io/part-of: zuno-workstation-entry
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: praxis-workstation
  limits:
    per-user:
      rates:
        - limit: {{ $w.rateLimit.limit }}
          window: {{ $w.rateLimit.window }}
      counters:
        - expression: 'auth.identity.sub'
{{- end }}
