# ADR-0511/WP-54, generalized to every stresstest-covered agent by
# ADR-0555/WP-142: one HTTPRoute + AuthPolicy per entry in
# quotaEnforcement.routes, each binding one agent's demo hostname to its own
# <agent>-frontend backend and gating it behind Keycloak JWT auth (issuer
# and audience pinned since ADR-0602 clause 6 / WP-224). Split out
# of the sibling template quota-demo-gateway.yaml (which owns the shared,
# backend-independent Gateway/ConfigMap/per-hostname-Route ingress infra)
# because these two resources - and the matching RateLimitPolicy in
# quota-ratelimitpolicies.yaml - reference each agent's own -frontend
# Service, which only exists once Day2's `agents` role runs. Rendering them
# from the Day1 zuno-connectivity-link-d1 Application left every HTTPRoute
# permanently BackendNotFound/Degraded until Day2 completed, which made that
# Application's Synced+Healthy wait in
# ansible/roles/connectivity_link/tasks/install.yml liable to time out and
# fail `make day1 install` outright on a fresh cluster.
#
# Rendered instead by the Day2 zuno-connectivity-link-quota-d1 Application,
# applied only once every agent's own -frontend Service existed. WP-156
# retired that Application with the agent frontends: nothing sets
# quotaEnforcement.route.enabled any more, and an entry must now name its
# backendService/backendPort explicitly (WP-157 owns quota enforcement in
# front of UnifAI). platform/okf/generate_quota_enforcement.py --check still
# reads this AuthPolicy's identity filter.
#
# Rollback: set quotaEnforcement.route.enabled back to false and sync -
# ArgoCD's selfHeal removes every object below (and every RateLimitPolicy in
# the sibling generated template); nothing here is referenced by any other
# chart.
#
# NOT also guarded on kuadrant.enabled (unlike the sibling
# quota-demo-gateway.yaml): this template is rendered by its own dedicated
# Application (zuno-connectivity-link-quota-d1) with no d0/d1 split of its
# own, so there's no premature-operator-install phase to guard against here
# - and gating on kuadrant.enabled too would force that Application to also
# set kuadrant.enabled: true, which would re-render the Kuadrant operand CR
# and ServiceMonitors (templates/kuadrant.yaml,
# templates/servicemonitor-*.yaml, guarded by kuadrant.enabled alone),
# fighting zuno-connectivity-link-d1 for ownership of those - the same
# SharedResourceWarning class of bug this split is meant to avoid.
{{- if .Values.quotaEnforcement.route.enabled }}
{{- /* ADR-0602 clause 6 / WP-224: Authorino validates tokens through OIDC
     discovery on the public HTTPS issuer. That only works when the
     Keycloak Route serves the Let's Encrypt wildcard certificate (ADR-0211,
     keycloak chart ingress.acmeWildcardTLS), which Authorino's system store
     trusts; on the Vault-issued certificate discovery fails with "x509:
     certificate signed by unknown authority" and every request 500s. Refuse
     to render rather than ship that. */}}
{{- if not .Values.quotaEnforcement.keycloakAcmeWildcardTLS }}
{{- fail "quotaEnforcement.route.enabled needs quotaEnforcement.keycloakAcmeWildcardTLS=true: the AuthPolicy validates tokens over https://keycloak.<clusterBaseDomain> and Authorino trusts only the Let's Encrypt certificate there (ADR-0211). Set it to mirror gitops/apps/keycloak/application-d1.yaml ingress.acmeWildcardTLS." }}
{{- end }}
{{- $issuer := .Values.quotaEnforcement.keycloakIssuerUrl | default (printf "https://keycloak.%s/realms/zuno" .Values.clusterBaseDomain) }}
{{- range .Values.quotaEnforcement.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.quotaEnforcement.routeNamespace }}
  labels:
    app.kubernetes.io/part-of: zuno-quota-enforcement
spec:
  parentRefs:
    - name: zuno-agent-gateway
      namespace: openshift-ingress
  hostnames:
    - {{ .hostname }}
  rules:
    - backendRefs:
        - name: {{ required "quotaEnforcement.routes[].backendService is required when quotaEnforcement.route.enabled is true" .backendService }}
          port: {{ required "quotaEnforcement.routes[].backendPort is required when quotaEnforcement.route.enabled is true" .backendPort }}
---
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: {{ .name }}-jwt
  namespace: {{ $.Values.quotaEnforcement.routeNamespace }}
  labels:
    app.kubernetes.io/part-of: zuno-quota-enforcement
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ .name }}
  rules:
    authentication:
      keycloak-jwt:
        jwt:
          # ADR-0602 clause 6 / WP-224: OIDC discovery over the public HTTPS
          # issuer (Let's Encrypt, guarded above), so the signing keys are
          # fetched over TLS and the token's iss must equal this issuer
          # (Authorino's OIDC verifier checks it). Before WP-224 this was a
          # jwksUrl on the plain-HTTP in-cluster Service, chosen when the
          # Route still served the Vault-issued certificate Authorino does
          # not trust; it pinned neither iss nor aud.
          issuerUrl: {{ $issuer }}
    # ADR-0602 clause 6 / WP-224: pin the audience. Every experience client
    # carries zuno-admin-api through the maas-gateway-audience mapper (the
    # audience ai-gateway, mcp-gateway and a2a-gateway require, WP-222);
    # tokens of `openshift`, `aap` or `zuno-signer` lack it and are refused.
    # Keycloak emits aud as a string when there is one audience and as an
    # array otherwise, hence eq OR incl.
    authorization:
      zuno-audience:
        patternMatching:
          patterns:
            - any:
                - selector: auth.identity.aud
                  operator: incl
                  value: {{ $.Values.quotaEnforcement.requiredAudience | quote }}
                - selector: auth.identity.aud
                  operator: eq
                  value: {{ $.Values.quotaEnforcement.requiredAudience | quote }}
    # Without this block the RateLimitPolicy silently enforces nothing.
    #
    # Authorino authenticates the request and returns OK, but the identity
    # it resolved stays inside Authorino unless it is explicitly published
    # as ext_authz dynamic metadata. Kuadrant's wasm-shim evaluates the
    # RateLimitPolicy's counter expressions - auth.identity.sub and
    # auth.identity.groups, see COUNTER_EXPRESSIONS in
    # platform/okf/generate_quota_enforcement.py - against that metadata,
    # so with no `identity` entry every counter expression fails to
    # resolve. Confirmed live 2026-08-25 on the gateway proxy:
    #   kuadrant_wasm_shim: Failed to evaluate message builder:
    #   CelError::Resolve { NoSuchKey("identity") }
    # one line per request, after which the shim skips the rate-limit
    # action entirely - the Limitador cluster showed cx_total 0 / rq_total
    # 0 while kuadrant-auth-service showed rq_total 90 for the same 86
    # requests. The failure mode is a clean 200 on every request, with
    # RateLimitPolicy status still Accepted+Enforced and the limits still
    # compiled into Limitador, which is why it survived this long: nothing
    # anywhere reports an error, requests are simply never counted.
    #
    # `filters` (not `headers`) is the AuthPolicy field that renders into
    # the AuthConfig's response.success.dynamicMetadata. RHOAI's own
    # maas-gateway-auth AuthPolicy publishes an identically-named
    # `identity` filter, which is why MaaS's TokenRateLimitPolicy works on
    # the sibling gateway and this one did not.
    #
    # Property names are load-bearing: they must match the `auth.identity.
    # <name>` suffixes the generated RateLimitPolicy counts on.
    # generate_quota_enforcement.py --check asserts that correspondence.
    response:
      success:
        filters:
          identity:
            json:
              properties:
                sub:
                  expression: auth.identity.sub
                groups:
                  # Defaulted rather than assumed present: a token issued
                  # to a client with no group mapper has no `groups` claim
                  # at all, and an unresolvable expression here would put
                  # us straight back to the silent no-op above. An empty
                  # list still produces a stable counter key.
                  expression: 'has(auth.identity.groups) ? auth.identity.groups : []'
{{- end }}
{{- end }}
