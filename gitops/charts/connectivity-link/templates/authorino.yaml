{{- if .Values.kuadrant.authorinoTls.enabled }}
# Enables TLS on the Authorino operand's own listener - required by MaaS
# (DataScienceCluster's MaaSPrerequisitesAvailable condition checks
# spec.listener.tls.enabled on this exact object). The Kuadrant operator
# creates this CR when it reconciles the Kuadrant CR (kuadrant.yaml), as
# part of the same reconcile rather than a separately-triggered async
# process. Its Kuadrant CRD version has no spec field to override this
# from (see kuadrant.yaml's comment), so this patches the Authorino CR
# directly. Only spec.listener.tls is set here (not a full spec
# re-declaration) so this only ever asserts that one sub-field, leaving the
# rest of the object - clusterWide, oidcServer, tracing, etc., all populated
# by the Kuadrant operator - alone.
#
# certSecretName (WP-071) is NOT backed by a Certificate in this chart -
# there is no templates/certificate.yaml any more. It names a Secret
# populated by the OpenShift Service CA Operator, requested by annotating
# the operator-owned Authorino Service directly
# (ansible/roles/connectivity_link/tasks/install.yml, since this CRD has
# no field to request that annotation through the CR either - same "no
# passthrough field" gap). That means this CR can be applied (sync-wave
# 30, after the Kuadrant CR at 20) before the Secret exists: Authorino's
# pod will sit in ContainerCreating until the Ansible annotate task runs
# and the Service CA Operator issues the Secret. Expected, not a
# regression - see the Day-1 precheck for this role and WP-071.
apiVersion: operator.authorino.kuadrant.io/v1beta1
kind: Authorino
metadata:
  name: authorino
  namespace: {{ .Values.operandNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  listener:
    tls:
      enabled: true
      certSecretRef:
        name: {{ .Values.kuadrant.authorinoTls.certSecretName }}
{{- end }}
