{{- if and .Values.quotaEnforcement.enabled .Values.kuadrant.enabled }}
# GENERATED FILE (ADR-0511/WP-54) - do not edit. Source:
# policies/quotas/quota-policy.yaml. Regenerate with:
#   python3 platform/okf/generate_quota_enforcement.py
# ONE RateLimitPolicy for every quota class; request-rate dimension
# only (token budgets are enforced by AI Gateway - see
# components/ai-gateway/app/quota_budgets.yaml). Kuadrant allows only
# one policy per targetRef at this level, so per-class limits share
# one CR - each limit entry's own `when` predicate selects the class.
# Rendered only when .Values.quotaEnforcement.enabled is true AND the
# operator has supplied the agent chat HTTPRoute this policy targets
# (see this chart's README, WP-54 section).
---
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: zuno-quota
  namespace: {{ .Values.quotaEnforcement.routeNamespace }}
  labels:
    app.kubernetes.io/part-of: zuno-quota-enforcement
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ .Values.quotaEnforcement.routeName }}
  limits:
    intensive-user:
      rates:
        - limit: 10
          window: 5m
      counters:
        - expression: 'auth.identity.sub'
      when:
        - predicate: "request.headers['x-zuno-quota-class'] == 'intensive'"
    intensive-group:
      rates:
        - limit: 60
          window: 5m
      counters:
        - expression: 'auth.identity.groups.join("|")'
      when:
        - predicate: "request.headers['x-zuno-quota-class'] == 'intensive'"
    intensive-project:
      rates:
        - limit: 30
          window: 5m
      counters:
        - expression: "request.headers['x-zuno-project-id']"
      when:
        - predicate: "request.headers['x-zuno-quota-class'] == 'intensive'"
        - predicate: "'x-zuno-project-id' in request.headers"
    standard-user:
      rates:
        - limit: 60
          window: 5m
      counters:
        - expression: 'auth.identity.sub'
      when:
        - predicate: "!('x-zuno-quota-class' in request.headers) || request.headers['x-zuno-quota-class'] == 'standard'"
    standard-group:
      rates:
        - limit: 600
          window: 5m
      counters:
        - expression: 'auth.identity.groups.join("|")'
      when:
        - predicate: "!('x-zuno-quota-class' in request.headers) || request.headers['x-zuno-quota-class'] == 'standard'"
    standard-project:
      rates:
        - limit: 300
          window: 5m
      counters:
        - expression: "request.headers['x-zuno-project-id']"
      when:
        - predicate: "!('x-zuno-quota-class' in request.headers) || request.headers['x-zuno-quota-class'] == 'standard'"
        - predicate: "'x-zuno-project-id' in request.headers"
{{- end }}
