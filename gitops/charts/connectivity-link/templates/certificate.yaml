{{- if .Values.kuadrant.authorinoTls.enabled }}
# TLS secret for the Authorino operand's own listener (MaaS requires
# spec.listener.tls.enabled on Authorino - see templates/authorino.yaml,
# which references this Secret via spec.listener.tls.certSecretRef).
# Reuses vault-issuer, the same Vault-backed ClusterIssuer
# gitops/charts/keycloak/templates/ingress.yaml already consumes for its
# own external TLS (gitops/charts/cert-manager/templates/clusterissuer.yaml)
# - no new PKI setup needed.
#
# dnsNames default below (the "authorino" instance name and its
# <name>-authorino-authorization Service - the one spec.listener.tls
# actually fronts, distinct from the separate -oidc Service/oidcServer.tls
# field) is VERIFIED live, 2026-08-13 (`oc get authorino,svc -n
# kuadrant-system`), not a guess. If a future reinstall ever provisions the
# operand under a different name, correct
# .Values.kuadrant.authorinoTls.dnsNames to match.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authorino-server-tls
  namespace: {{ .Values.operandNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  secretName: {{ .Values.kuadrant.authorinoTls.certSecretName }}
  issuerRef:
    name: vault-issuer
    kind: ClusterIssuer
  dnsNames:
    {{- range .Values.kuadrant.authorinoTls.dnsNames }}
    - {{ . }}
    {{- end }}
{{- end }}
