{{- if .Values.kuadrant.authorinoTls.enabled }}
# TLS secret for the Authorino operand's own listener (MaaS requires
# spec.listener.tls.enabled on Authorino - see templates/authorino.yaml,
# which references this Secret via spec.listener.tls.certSecretRef).
#
# Issued via vault-issuer-istio, NOT the generic vault-issuer: the
# original vault-issuer (pki/sign/cert-manager, a general-purpose TLS role)
# is deliberately NOT part of the mesh's trust bundle, by
# gitops/charts/service-mesh/templates/clusterissuer-istio.yaml's own
# design comment: "isolates the mesh's SPIFFE trust root from
# general-purpose TLS certs." Using the generic issuer here breaks every
# Kuadrant AuthPolicy's gRPC ext_authz call from Envoy's kuadrant-wasm-shim
# to this listener ("gRPC status code is not OK"; TLS handshake succeeds
# but "Verify return code: 21 (unable to verify the first certificate)"),
# because every gRPC-ext_authz caller (Envoy sidecars, mesh members by
# construction) only trusts vault-issuer-istio (pki/sign/istio) natively -
# the same root cert-manager-istio-csr issues mesh workload identity certs
# from - so issuing from it here makes this listener's cert chain to that
# trust root too, with no separate application-level CA-trust configuration
# needed anywhere. This affects every Kuadrant-protected route on this
# cluster (including the already-deployed MaaS gateway), not just the
# WP-54 demo gateway that surfaced it.
#
# dnsNames default below (the "authorino" instance name and its
# <name>-authorino-authorization Service - the one spec.listener.tls
# actually fronts, distinct from the separate -oidc Service/oidcServer.tls
# field) matches the actual live objects (verify with `oc get authorino,svc
# -n kuadrant-system`), not a guess. If a future reinstall ever provisions
# the operand under a different name, correct
# .Values.kuadrant.authorinoTls.dnsNames to match.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authorino-server-tls
  namespace: {{ .Values.operandNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  secretName: {{ .Values.kuadrant.authorinoTls.certSecretName }}
  issuerRef:
    name: vault-issuer-istio
    kind: ClusterIssuer
  dnsNames:
    {{- range .Values.kuadrant.authorinoTls.dnsNames }}
    - {{ . }}
    {{- end }}
{{- end }}
