{{- if .Values.operator.enabled }}
# rhcl-operator's CSV only supports the AllNamespaces install mode (a
# dedicated namespace + namespace-scoped OperatorGroup fails with "OwnNamespace
# InstallModeType is not supported" - confirmed against a real cluster).
# Subscribes into openshift-operators, relying on OLM's own pre-existing
# global-operators OperatorGroup there - same pattern
# gitops/charts/external-secrets already uses for exactly this reason.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .Values.subscriptionName }}
  namespace: openshift-operators
  labels:
    zuno.io/managed-by: argocd
    operators.coreos.com/{{ .Values.subscriptionName }}.openshift-operators: ""
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  channel: {{ required "subscriptionChannel must be set via gitops_app_extra_helm_values (ADR-0048)" .Values.subscriptionChannel | quote }}
  name: {{ .Values.subscriptionName }}
  source: {{ required "subscriptionCatalogSource must be set via gitops_app_extra_helm_values (ADR-0048)" .Values.subscriptionCatalogSource | quote }}
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
{{- end }}
