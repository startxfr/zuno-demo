{{- if .Values.project.enabled }}
# Moved here from gitops/charts/aap-config/templates/
# rolebinding-connectivity-link-secrets.yaml (ADR-0517 live finding,
# demo333 2026-09-06): aap-config is a Day 0 component, but this pair
# lives in kuadrant-system - a namespace THIS chart creates (the PreSync
# `project` hook above in values.yaml) at Day 1. On a fresh cluster the
# Day 0 sync of aap-config failed outright ("error getting namespace
# kuadrant-system: not found") at wave -25, and the sync-wave barrier
# then left every later aap-config resource unapplied. Invisible on
# demo222, where kuadrant-system predated aap-config. The resource
# belongs with the namespace's owner: it renders exactly when
# project.enabled turns the namespace on (the d1 Application), which is
# also exactly when there are Kuadrant secrets to read.
#
# Same targeted-widening rationale as before (ADR-0354 Security
# considerations, "widen with a targeted extra Role, never a broader
# built-in"): cluster-reader excludes Secrets entirely, and
# connectivity_link's precheck.yml is the only Day 1 component whose
# precheck reads a Secret (authorino-server-cert in kuadrant-system, to
# confirm the tls.crt/tls.key keys exist - WP-071's regression check).
# Scoped to kuadrant-system alone, not a cluster-wide Secret grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zuno-aap-day0-check-connectivity-link-secrets-reader
  namespace: kuadrant-system
  labels:
    zuno.io/managed-by: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zuno-aap-day0-check-connectivity-link-secrets-reader
  namespace: kuadrant-system
  labels:
    zuno.io/managed-by: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zuno-aap-day0-check-connectivity-link-secrets-reader
subjects:
  # The cluster-reader tier's ServiceAccount specifically (ADR-0418/WP-094
  # - never the zuno-aap-installer tier). Name and namespace mirror
  # gitops/charts/aap-config/values.yaml's zuno-cluster-reader credential
  # (serviceAccount: aap-day0-check, namespace: zuno-aap) - kept in sync
  # manually, same convention as operandNamespace above. RBAC never
  # validates subjects, so a d1 sync racing aap-config's SA creation is
  # harmless.
  - kind: ServiceAccount
    name: {{ .Values.dayCheck.serviceAccount }}
    namespace: {{ .Values.dayCheck.namespace }}
{{- end }}
