{{- if .Values.kuadrant.enabled }}
# Singleton CR the operator watches to deploy its sub-controllers
# (Limitador, Authorino, DNS operator integration) - same "meta-operator
# needs a CR to actually deploy pods" shape as
# gitops/charts/external-secrets's OperatorConfig and
# gitops/charts/cert-manager's CertManager CR. Empty spec: no
# Gateway/AuthPolicy/RateLimitPolicy exists yet for it to enforce
# (ADR-0317 installs the operator ahead of any consumer). This Kuadrant
# CRD version (kuadrant.io/v1beta1) exposes no override field for its
# Authorino/Limitador operands at all
# (`oc explain kuadrant.spec` only shows components.developerPortal, mtls,
# observability - no spec.authorino) - a spec.authorino block here would be
# silently pruned by structural-schema validation, not applied. MaaS's
# Authorino-TLS requirement (DataScienceCluster's MaaSPrerequisitesAvailable
# condition) is instead satisfied by patching the Authorino operand CR
# directly - see templates/authorino.yaml.
apiVersion: kuadrant.io/v1beta1
kind: Kuadrant
metadata:
  name: kuadrant
  namespace: {{ .Values.operandNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec: {}
{{- end }}
