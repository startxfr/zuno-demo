# ADR-0511/WP-54: the demo-scoped ingress path Kuadrant's RateLimitPolicy
# (templates/quota-ratelimitpolicies.yaml) and AuthPolicy require - Kuadrant's
# own CRDs hard-reject any targetRef that isn't Gateway API (confirmed against
# the live CRD's x-kubernetes-validations: only Gateway/HTTPRoute/GRPCRoute),
# and agent traffic today reaches pods via plain OpenShift Routes, which
# Kuadrant cannot target at all. Rather than migrate agent ingress wholesale
# (a real architecture decision with no ADR behind it yet), this renders a
# SEPARATE, additional path for Tekos only, on its own hostname - the
# existing tekos-frontend Route is completely untouched throughout.
#
# Ingress shape copied exactly from the two other live Gateway API
# gateways on this cluster (data-science-gateway, maas-default-gateway):
# infrastructure.parametersRef -> a ConfigMap requesting a ClusterIP
# Service with an OpenShift service-serving-cert-signer annotation (the
# platform auto-issues and rotates the TLS secret named there - no
# cert-manager Certificate needed), fronted by an OpenShift Route
# (reencrypt) on the router's own *.apps.<domain> wildcard DNS.
#
# First attempt (2026-08-18) skipped the ConfigMap and let the Gateway
# default to a LoadBalancer Service - which provisioned a genuinely
# separate AWS ELB with its own hostname, invisible to *.apps.<domain>
# DNS (confirmed live: curl against the demo hostname 503'd because it
# was hitting the OpenShift router, which has no Route for it - the new
# ELB was a different address entirely). Fixed by matching the live
# pattern instead of the Gateway API default.
#
# Rollback: set quotaEnforcement.enabled back to false and sync - ArgoCD's
# selfHeal removes every object below (and the RateLimitPolicy in the
# sibling template); nothing here is referenced by any other chart.
{{- if .Values.quotaEnforcement.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zuno-agent-gateway-config
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: zuno-quota-enforcement
data:
  service: |
    metadata:
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: "zuno-agent-gateway-tls"
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: zuno-agent-gateway
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: zuno-quota-enforcement
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: zuno-agent-gateway-config
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: zuno-agent-gateway-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - {{ .Values.quotaEnforcement.routeNamespace }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: zuno-agent-gateway
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: zuno-quota-enforcement
spec:
  host: {{ .Values.quotaEnforcement.demoHostname }}
  port:
    targetPort: 443
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: zuno-agent-gateway-istio
    weight: 100
  wildcardPolicy: None
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.quotaEnforcement.routeName }}
  namespace: {{ .Values.quotaEnforcement.routeNamespace }}
  labels:
    app.kubernetes.io/part-of: zuno-quota-enforcement
spec:
  parentRefs:
    - name: zuno-agent-gateway
      namespace: openshift-ingress
  hostnames:
    - {{ .Values.quotaEnforcement.demoHostname }}
  rules:
    - backendRefs:
        - name: {{ .Values.quotaEnforcement.demoBackendService }}
          port: {{ .Values.quotaEnforcement.demoBackendPort }}
---
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: {{ .Values.quotaEnforcement.routeName }}-jwt
  namespace: {{ .Values.quotaEnforcement.routeNamespace }}
  labels:
    app.kubernetes.io/part-of: zuno-quota-enforcement
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ .Values.quotaEnforcement.routeName }}
  rules:
    authentication:
      keycloak-jwt:
        jwt:
          issuerUrl: {{ .Values.quotaEnforcement.keycloakIssuerUrl }}
{{- end }}
