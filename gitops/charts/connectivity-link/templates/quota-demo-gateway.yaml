# ADR-0511/WP-54: the demo-scoped ingress path Kuadrant's RateLimitPolicy
# (templates/quota-ratelimitpolicies.yaml) and AuthPolicy require - Kuadrant's
# own CRDs hard-reject any targetRef that isn't Gateway API (confirmed against
# the live CRD's x-kubernetes-validations: only Gateway/HTTPRoute/GRPCRoute),
# and agent traffic today reaches pods via plain OpenShift Routes, which
# Kuadrant cannot target at all. Rather than migrate agent ingress wholesale
# (a real architecture decision with no ADR behind it yet), this renders a
# SEPARATE, additional path for Tekos only, on its own hostname - the
# existing tekos-frontend Route is completely untouched throughout.
#
# Ingress shape copied exactly from the two other live Gateway API
# gateways on this cluster (data-science-gateway, maas-default-gateway):
# infrastructure.parametersRef -> a ConfigMap requesting a ClusterIP
# Service with an OpenShift service-serving-cert-signer annotation (the
# platform auto-issues and rotates the TLS secret named there - no
# cert-manager Certificate needed), fronted by an OpenShift Route
# (reencrypt) on the router's own *.apps.<domain> wildcard DNS.
#
# Don't let the Gateway default to a LoadBalancer Service by skipping this
# ConfigMap: that provisions a genuinely separate AWS ELB with its own
# hostname, invisible to *.apps.<domain> DNS (curl against the demo
# hostname 503'd, hitting the OpenShift router instead, which has no Route
# for it - the ELB was a different address entirely). This ConfigMap fixes
# it by matching the live pattern instead of the Gateway API default.
#
# Rollback: set quotaEnforcement.gateway.enabled back to false and sync -
# ArgoCD's selfHeal removes every object below; nothing here is referenced
# by any other chart.
#
# This file renders ONLY the shared ingress infra (ConfigMap/Gateway/Route)
# - no dependency on any Day2 workload, so it stays on the Day1
# zuno-connectivity-link-d1 Application. The HTTPRoute/AuthPolicy that
# target the Day2-only tekos-frontend backend live in the sibling template
# quota-demo-route.yaml, rendered instead by the Day2
# zuno-connectivity-link-quota-d1 Application (see values.yaml's
# quotaEnforcement comment for the full split rationale).
#
# Guarded on kuadrant.enabled too, not just quotaEnforcement.gateway.enabled:
# this chart is rendered by BOTH the -d0 and -d1 ArgoCD Applications, and
# quotaEnforcement.gateway.enabled is a plain chart default with no
# per-Application override - without this extra guard -d0 rendered these
# objects too, in the same explicit namespaces as -d1, and the two
# Applications fought over ownership of the same live resources (ArgoCD
# SharedResourceWarning, sync never settling). Only -d1 sets
# kuadrant.enabled: true.
{{- if and .Values.quotaEnforcement.gateway.enabled .Values.kuadrant.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zuno-agent-gateway-config
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: zuno-quota-enforcement
data:
  # Same istio-proxy resources override as maas-gateway-config: the istio
  # default 256Mi limit OOMKills envoy during cold-start init once the
  # Kuadrant wasm filter + quota config are part of the initial LDS push
  # (pod stuck PRE_INITIALIZING, startup probe on 15021 never answers).
  deployment: |
    spec:
      template:
        spec:
          containers:
            - name: istio-proxy
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
  service: |
    metadata:
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: "zuno-agent-gateway-tls"
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: zuno-agent-gateway
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: zuno-quota-enforcement
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: zuno-agent-gateway-config
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: zuno-agent-gateway-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - {{ .Values.quotaEnforcement.routeNamespace }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: zuno-agent-gateway
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: zuno-quota-enforcement
spec:
  host: {{ .Values.quotaEnforcement.demoHostname }}
  port:
    targetPort: 443
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: zuno-agent-gateway-istio
    weight: 100
  wildcardPolicy: None
{{- end }}
