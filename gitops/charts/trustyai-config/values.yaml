# ADR-0534/WP-107 scaffold, populated by WP-108 with the first real
# content: two operand-native smoke tests proving the evaluation/guardrails
# capability runs on this cluster - NOT yet wired to any real agent
# traffic (that is WP-109). Everything is gated behind
# trustyaiConfig.enabled so the -d0 Application renders nothing and only
# -d1 creates resources, same shape aap-config/lightspeed-config use.
#
# RAGAS note (WP-108 finding, 2026-09-02): this OpenShift AI release
# train ships NO RAGAS provider or image - the operand's eval providers
# are lm_evaluation_harness/lighteval/guidellm/ibm-clear (EvalHub
# collections + trustyai-service-operator-config, checked live), plus
# Garak. RAGAS therefore lands in WP-109 against real RAG retrievals
# (its only meaningful input), via a custom-built image if the operand
# still lacks it then - preferring shipped frameworks first is exactly
# ADR-0534's stated rule.
trustyaiConfig:
  enabled: false

# The namespace TrustyAI's LMEvalJob resources already live in
# (gitops/charts/models), reused by this component's precheck rather than
# hardcoded a second time - see ansible/tasks/report_lmevaljobs.yml.
lmevalNamespace: zuno-ai-run

# Every resource this chart renders lands beside the models it evaluates.
namespace: zuno-ai-run

# ADR-0538/WP-117: route the three evaluation Jobs through Kueue. Setting
# this stamps `kueue.x-k8s.io/queue-name` on their Job metadata, which is
# what makes them the platform's first genuinely admitted workloads and
# fills the RHOAI dashboard's Workload metrics page. Empty = not queued,
# and an empty value is the correct revert: removing the label restores
# the pre-WP-117 behaviour exactly, no template edit needed.
#
# Ships EMPTY on purpose, and flipping it is a deliberate operator action,
# not a routine value bump. All three Jobs carry
# `argocd.argoproj.io/sync-options: Replace=true,Force=true` (they must -
# a Job's spec.template is immutable), so ANY change to their rendered
# metadata deletes and recreates all three, re-pulling their images. Garak
# alone is 4.22 GiB. On 2026-09-03 exactly that pattern on the models
# chart's prefetch Jobs took a control-plane node from 85% image-filesystem
# usage to DiskPressure in 22 seconds (see the
# diskpressure-master-cascades-into-mesh memory, and commit 6c55a5b7).
# Turn it on when someone is watching node disk, not incidentally.
kueue:
  queueName: ""

# WP-108: standalone built-in guardrails detectors (no orchestrator, no
# InferenceService wiring - see templates/guardrailsorchestrator.yaml).
guardrailsSmoke:
  enabled: true
  name: zuno-guardrails-smoke

# ADR-0540/WP-120: the same guardrail policy the agent-runtime image
# used to carry as a Python dict, expressed as NeMo rails config.
# Disabled by default: flipping it on is a two-step change - deploy the
# CR, prove the server answers, THEN point agent-runtime at it with
# gitops/charts/agent-runtime/values.yaml guardrails.backend=nemo.
# The GuardrailsOrchestrator smoke instance above is unaffected and
# remains the fallback backend.
nemoGuardrails:
  enabled: false
  name: zuno-guardrails
  # Mounted at /app/config/<configId>; also the config_id the client
  # sends on every request.
  configId: zuno-observe
  configMapName: zuno-nemo-rails-observe
  replicas: 1

# WP-108: one bounded Garak scan against the local qwen predictor,
# proving the shipped scanner runs end-to-end and emits a report.
garakSmoke:
  enabled: true
  # The digest the TrustyAI operator's CSV ships as
  # RELATED_IMAGE_ODH_TRUSTYAI_GARAK_LLS_PROVIDER_DSP_IMAGE (read live
  # 2026-09-02; garak CLI v0.15.0+rhaiv.2 confirmed inside). Pinned, not
  # discovered: deterministic render beats auto-tracking here, bump when
  # the operator does.
  image: registry.redhat.io/rhoai/odh-trustyai-garak-lls-provider-dsp-rhel9@sha256:85891ce81a3d32df1df8cdc14f4c9bc01bf081a2768baacaa7b452dba2f40652
  modelName: qwen3.6-27b-instruct
  # Plain http through the mesh - see the template comment and
  # [[lmevaljob-mesh-double-tls]].
  baseUrl: http://qwen36-27b-instruct-kserve-workload-svc.zuno-ai-run.svc:8000/v1
  # test.Blank: garak's own connectivity/smoke probe (empty prompts) -
  # cheap by design. Real security probes are garakSecurity below.
  probe: test.Blank
  generations: 1
  deadlineSeconds: 1800

# WP-109: real jailbreak probes, bounded, against the newest PEFT/LoRA
# fine-tune by default - a fine-tune is exactly where jailbreak
# resistance regresses unnoticed (ADR-0534 Phase 3). Plain http through
# the mesh, same rule as everything else here.
garakSecurity:
  enabled: true
  modelName: qwen3.5-9b-wesh
  baseUrl: http://qwen35-9b-wesh-kserve-workload-svc.zuno-ai-run.svc:8000/v1
  # Two DAN-family jailbreak probes: single-prompt each, so cost is
  # generations-bound, not corpus-bound (promptinject-style probes are
  # hundreds of prompts - too heavy for this shared-GPU demo cluster).
  probes: dan.Dan_11_0,dan.DUDE
  generations: 5
  deadlineSeconds: 3600
  # WP-113: end-of-scan push of per-probe/detector attack success rate to
  # the shared collector so the zuno-trustyai Grafana dashboard can show
  # it. Best-effort - a push failure never fails the scan.
  otelMetricsUrl: http://zuno-otel-collector-collector.zuno-monitoring.svc:4318/v1/metrics

# WP-115: the per-project evaluation service the RHOAI dashboard's
# "Evaluations" page requires (its nav entry is unlocked by the
# disableLMEval:false / guardrails:true OdhDashboardConfig flags, applied
# live - that CR is operator-created and not in this repo). sqlite =
# demo-light, history lost on pod restart; a postgresql upgrade needs a
# dedicated Crunchy PGO database + pre-composed db-url Secret (mind
# [[pgo-does-not-recreate-dropped-database]]).
evalHub:
  enabled: true
  name: zuno-evalhub
  # Must match the operator ConfigMaps' evalhub-collection-name /
  # evalhub-provider-name labels in redhat-ods-applications (live-checked
  # 2026-09-02; full sets: 8 collections, 6 providers).
  collections:
    - standard-llm-evals-v1
    - safety-and-fairness-v1
    - reasoning-v1
    - leaderboard-v2
  providers:
    - lm-evaluation-harness
    - garak

# WP-109: RAGAS retrieval-quality evaluation against the REAL rag-service
# /v1/search path, judged by the local qwen3.6 model. Image built
# in-cluster (`make d2 build trustyai-eval`, components/trustyai-eval) -
# no vendor RAGAS image exists in this release train (WP-108 finding).
ragasEval:
  enabled: true
  image: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/trustyai-eval:latest
  ragServiceUrl: http://rag-service.zuno-data.svc:8080
  judgeBaseUrl: http://qwen36-27b-instruct-kserve-workload-svc.zuno-ai-run.svc:8000/v1
  judgeModel: qwen3.6-27b-instruct
  # rag-service fails closed on empty caller_groups (ADR-0046): retrieval
  # quality must be measured as a realistic caller, not an entitlement-less
  # one that only ever sees ACL-unrestricted documents.
  callerGroups: consultant
  deadlineSeconds: 3600
