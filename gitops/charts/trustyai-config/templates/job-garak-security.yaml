{{- /*
ADR-0534/WP-109: REAL security probes (jailbreak resistance), unlike
job-garak-smoke.yaml's connectivity-only test.Blank. Bounded probe set
against the configured model - by default the newest PEFT/LoRA fine-tune
(qwen3.5-9b-wesh, ADR-0526), because a fine-tune is exactly where
jailbreak resistance regresses unnoticed (ADR-0534 Phase 3). Observe-only:
the report is evidence, not a gate; folding garak scores into
evaluations/peft_regression.py's artifact is recorded as deferred in the
WP-109 brief.
*/ -}}
{{- if and .Values.trustyaiConfig.enabled .Values.garakSecurity.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: garak-security
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: lm-eval
    app.kubernetes.io/component: garak-security
    {{- with .Values.kueue.queueName }}
    # ADR-0538/WP-117 - see job-garak-smoke.yaml for why this sits on the
    # Job rather than the pod template. activeDeadlineSeconds below stays
    # correct under suspension: a suspended Job has no startTime, and the
    # Job controller resets it on unsuspend, so the budget starts at
    # admission rather than at creation.
    kueue.x-k8s.io/queue-name: {{ . | quote }}
    {{- end }}
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ .Values.garakSecurity.deadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lm-eval
        app.kubernetes.io/component: garak-security
    spec:
      {{- with .Values.kueue.priorityClassName }}
      # ADR-0545/WP-127 - see values.yaml's kueue.priorityClassName comment
      # for why this ships empty by default (Replace=true recreation risk).
      priorityClassName: {{ . | quote }}
      {{- end }}
      restartPolicy: Never
      containers:
        - name: garak
          image: {{ .Values.garakSmoke.image }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              export HOME=/tmp
              garak \
                --model_type openai.OpenAICompatible \
                --model_name {{ .Values.garakSecurity.modelName }} \
                --generator_options '{"openai":{"OpenAICompatible":{"uri":"{{ .Values.garakSecurity.baseUrl }}","api_key":"eval-unused"}}}' \
                --probes {{ .Values.garakSecurity.probes }} \
                --generations {{ .Values.garakSecurity.generations }} \
                --report_prefix /tmp/garak-security
              echo "--- garak security report ---"
              ls -l /tmp/garak-security* 2>/dev/null || true
              # WP-113: push per-probe/detector attack success rate as a
              # one-shot OTLP gauge so the zuno-trustyai Grafana dashboard
              # can render it. Best-effort: a push failure never fails the
              # scan (the report above stays the source of truth).
              python3 /tmp/push_asr.py || echo "WARNING: ASR metric push failed (scan unaffected)"
          env:
            - name: OPENAICOMPATIBLE_API_KEY
              value: eval-unused
            - name: OTEL_METRICS_URL
              value: {{ .Values.garakSecurity.otelMetricsUrl | quote }}
            - name: GARAK_MODEL_NAME
              value: {{ .Values.garakSecurity.modelName | quote }}
          volumeMounts:
            - name: push-asr
              mountPath: /tmp/push_asr.py
              subPath: push_asr.py
          # Belongs to the container. WP-113 (commit 117c48e3) inserted the
          # `volumes:` block ABOVE this and orphaned it as a key of the
          # push-asr volume, where `resources` is not a valid field: the API
          # server dropped it, so the rendered manifest never matched the live
          # object and this Job sat permanently OutOfSync. Combined with
          # Replace=true,Force=true that is a silent recreation loop - the Job
          # deleted, recreated and RE-RUN every reconcile, re-pulling a 4.22 GiB
          # image each time, for as long as the bug stood. It also meant this
          # container ran with no requests or limits at all, taking whatever
          # the namespace LimitRange defaulted.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: push-asr
          configMap:
            name: garak-push-asr
{{- end }}
