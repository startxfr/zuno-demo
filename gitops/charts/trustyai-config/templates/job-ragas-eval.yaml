{{- /*
ADR-0534/WP-109: RAGAS evaluation against the REAL retrieval path, UnifAI's
RAG server since WP-156. The image is built in-cluster (components/trustyai-eval,
`make d2 build trustyai-eval`) because this OpenShift AI release train
ships no RAGAS image (WP-108 finding). Scores only - thresholds/pass-fail
policy are deferred by ADR-0534's Non-goals.

lm-eval label: same eval-class NetworkPolicy identity as the other Jobs
here - it is what the qwen predictors' policies admit. zuno.io/rag-client:
the pod label UnifAI's RAG server admits (UnifaiStack spec.exposure.ragClients).
*/ -}}
{{- if and .Values.trustyaiConfig.enabled .Values.ragasEval.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ragas-eval
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: lm-eval
    app.kubernetes.io/component: ragas-eval
    {{- with .Values.kueue.queueName }}
    # ADR-0538/WP-117 - see job-garak-smoke.yaml for why this sits on the
    # Job rather than the pod template.
    kueue.x-k8s.io/queue-name: {{ . | quote }}
    {{- end }}
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ .Values.ragasEval.deadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lm-eval
        app.kubernetes.io/component: ragas-eval
        zuno.io/rag-client: "true"
    spec:
      {{- with .Values.kueue.priorityClassName }}
      # ADR-0545/WP-127 - see values.yaml's kueue.priorityClassName comment
      # for why this ships empty by default (Replace=true recreation risk).
      priorityClassName: {{ . | quote }}
      {{- end }}
      restartPolicy: Never
      containers:
        - name: ragas
          image: {{ .Values.ragasEval.image }}
          env:
            - name: UNIFAI_RAG_URL
              value: {{ .Values.ragasEval.unifaiRagUrl | quote }}
            - name: UNIFAI_RAG_TAG
              value: {{ .Values.ragasEval.ragTag | quote }}
            - name: KEYCLOAK_TOKEN_URL
              value: {{ .Values.ragasEval.keycloakTokenUrl | quote }}
            - name: EVAL_PERSONA
              value: {{ .Values.ragasEval.persona | quote }}
            - name: EVAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ragas-eval-credentials
                  key: eval-client-secret
            - name: DEMO_PERSONA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ragas-eval-credentials
                  key: demo-persona-password
            - name: JUDGE_BASE_URL
              value: {{ .Values.ragasEval.judgeBaseUrl | quote }}
            - name: JUDGE_MODEL
              value: {{ .Values.ragasEval.judgeModel | quote }}
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
{{- end }}
