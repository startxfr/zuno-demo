{{- /*
WP-156: the RAGAS Job signs in to UnifAI's RAG server as a demo persona
through the zuno-evaluations Keycloak client. Same Vault paths as the
zuno-auth copies (keycloak chart); synced before the Job's wave.
*/ -}}
{{- if and .Values.trustyaiConfig.enabled .Values.ragasEval.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ragas-eval-credentials
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ragas-eval-credentials
    creationPolicy: Owner
  data:
    - secretKey: eval-client-secret
      remoteRef:
        key: keycloak/zuno-evaluations
        property: client_secret
    - secretKey: demo-persona-password
      remoteRef:
        key: keycloak/demo-personas
        property: password
{{- end }}
