{{- if and .Values.assistants.enabled .Values.altGateways }}
{{- range .Values.personas }}
---
# WP-301 (ADR-0619 clause 5): the operator's proxy of this persona may reach the alternative gateways' namespace.
# The operator writes the proxy's egress for TCP 443 and for the in-cluster targets of mcpServers (zuno-ai-run)
# only; NetworkPolicies add up, so this one adds the one rule, to that namespace and that port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alt-gateways-proxy-egress
  namespace: {{ printf "%s%s" $.Values.namespacePrefix .name }}
  labels:
    zuno.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      {{- toYaml $.Values.altGatewayProxySelector | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.altGatewayNamespace }}
      ports:
        - protocol: TCP
          port: {{ $.Values.altGatewayPort }}
{{- end }}
{{- end }}
