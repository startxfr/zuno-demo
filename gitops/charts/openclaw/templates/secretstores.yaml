{{- if .Values.assistants.enabled }}
{{- range .Values.personas }}
{{- $ns := printf "%s%s" $.Values.namespacePrefix .name }}
---
# ADR-0602 clause 2 / WP-223: the persona namespace's own SecretStore, which
# reads only the keys platform/vault/secret-access.yaml grants {{ $ns }}
# (its Keycloak client and its UI secrets). Rendered here, not by
# gitops/charts/external-secrets with the other stores, because this chart
# creates the namespace (d0) and the external-secrets d1 Application syncs
# long before it exists. Same shape as that chart's secretstores.yaml;
# platform/vault/check_secret_access.py fails if they drift apart or if a
# persona has no entry in the table.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
  namespace: {{ $ns }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-23"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault
  namespace: {{ $ns }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-22"
spec:
  provider:
    vault:
      server: "{{ if $.Values.vaultSecretStore.tls }}https{{ else }}http{{ end }}://{{ $.Values.vaultSecretStore.serviceName }}.zuno-vault.svc:8200"
      path: zuno
      version: v2
      {{- if $.Values.vaultSecretStore.tls }}
      caProvider:
        type: ConfigMap
        name: openshift-service-ca.crt
        key: service-ca.crt
      {{- end }}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ns-{{ $ns }}
          serviceAccountRef:
            name: vault-reader
{{- end }}
{{- end }}
