{{- if .Values.assistants.enabled }}
{{- range .Values.personas }}
{{- $ns := printf "%s%s" $.Values.namespacePrefix .name }}
---
# The secret of Keycloak client openclaw-<persona>: the proxy's client-credentials
# exchange and oauth2-proxy's browser flow.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openclaw-client
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  # ADR-0602/WP-223: this namespace's own SecretStore, which reads only the keys platform/vault/secret-access.yaml grants it.
  secretStoreRef: {name: vault, kind: SecretStore}
  target: {name: openclaw-client, creationPolicy: Owner}
  data:
    - secretKey: client-secret
      remoteRef: {key: keycloak/openclaw-{{ .name }}, property: client_secret}
---
# The Control UI password and oauth2-proxy's cookie secret (seeded by the role).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openclaw-ui
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  # ADR-0602/WP-223: this namespace's own SecretStore, which reads only the keys platform/vault/secret-access.yaml grants it.
  secretStoreRef: {name: vault, kind: SecretStore}
  target: {name: openclaw-ui, creationPolicy: Owner}
  data:
    - secretKey: password
      remoteRef: {key: openclaw/{{ .name }}, property: ui_password}
    - secretKey: cookie-secret
      remoteRef: {key: openclaw/{{ .name }}, property: cookie_secret}
{{- end }}
{{- end }}
