{{- if .Values.aap.enabled }}
# Consumer-side database credential for Controller's own dedicated
# database (spec.controller.postgres_configuration_secret - a different
# field name than Gateway's/EDA's database_secret, see README.md's
# "Per-component external database" table). Same key-set caveat as
# externalsecret-gateway-postgresql.yaml.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgresql.controller.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  # ADR-0602/WP-223: this namespace's own SecretStore, which reads only the keys platform/vault/secret-access.yaml grants it.
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: {{ .Values.postgresql.controller.secretName }}
    creationPolicy: Owner
    template:
      data:
        host: {{ .Values.postgresql.host | quote }}
        port: {{ .Values.postgresql.port | quote }}
        database: {{ .Values.postgresql.controller.database | quote }}
        sslmode: {{ .Values.postgresql.sslmode | quote }}
        username: "{{ `{{ .username }}` }}"
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.postgresql.controller.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.postgresql.controller.vaultPath }}
        property: password
{{- end }}
