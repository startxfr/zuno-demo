{{- if .Values.aap.enabled }}
# Consumer-side database credential for the Automation Metrics service's
# own database (spec.metrics.database.database_secret on the
# AnsibleAutomationPlatform CR). Overrides the operator-generated
# aap-metrics-postgres-configuration Secret, whose invented database/role
# nobody provisions on our unmanaged postgres.
# gitops/charts/postgresql resolves the same Vault path independently, into
# the PGO-managed pguser Secret in zuno-data - secretKeyRef can't cross
# namespaces, same "own ExternalSecret" pattern as the gateway/controller/
# hub/eda secrets beside this one.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgresql.metrics.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.postgresql.metrics.secretName }}
    creationPolicy: Owner
    template:
      data:
        host: {{ .Values.postgresql.host | quote }}
        port: {{ .Values.postgresql.port | quote }}
        database: {{ .Values.postgresql.metrics.database | quote }}
        sslmode: {{ .Values.postgresql.sslmode | quote }}
        # The operator's own generated Secret carries type: unmanaged for
        # an external database - keep it so the MetricsService reconcile
        # never tries to create a managed postgres.
        type: "unmanaged"
        username: "{{ `{{ .username }}` }}"
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.postgresql.metrics.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.postgresql.metrics.vaultPath }}
        property: password
{{- end }}
