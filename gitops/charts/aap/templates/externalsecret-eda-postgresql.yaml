{{- if .Values.aap.enabled }}
# Consumer-side database credential for EDA's own dedicated database
# (spec.eda.database.database_secret - the same database_secret field
# name as Gateway, unlike Controller's/Hub's postgres_configuration_secret
# - see README.md's "Per-component external database" table). Same
# key-set caveat as externalsecret-gateway-postgresql.yaml.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgresql.eda.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.postgresql.eda.secretName }}
    creationPolicy: Owner
    template:
      data:
        host: {{ .Values.postgresql.host | quote }}
        port: {{ .Values.postgresql.port | quote }}
        database: {{ .Values.postgresql.eda.database | quote }}
        sslmode: {{ .Values.postgresql.sslmode | quote }}
        username: "{{ `{{ .username }}` }}"
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.postgresql.eda.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.postgresql.eda.vaultPath }}
        property: password
{{- end }}
