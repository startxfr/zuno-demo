{{- if and .Values.aap.enabled (eq .Values.hub.storageType "s3") }}
# Automation Hub's S3 object-storage credential (WP-075,
# spec.hub.object_storage_s3_secret). All 4 fields (bucket/region/access
# key/secret key) come from Vault (zuno/aap/hub-s3), unlike rag/s3's split
# of secret-only fields - per explicit request. Key names
# (s3-access-key-id/s3-secret-access-key/s3-bucket-name/s3-region) are
# fixed by the pulp-operator-based automation-hub-operator - do not rename.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.hub.s3.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.hub.s3.secretName }}
    creationPolicy: Owner
    template:
      data:
        s3-bucket-name: "{{ `{{ .bucketName }}` }}"
        s3-region: "{{ `{{ .region }}` }}"
        s3-access-key-id: "{{ `{{ .accessKeyId }}` }}"
        s3-secret-access-key: "{{ `{{ .secretAccessKey }}` }}"
  data:
    - secretKey: bucketName
      remoteRef:
        key: {{ .Values.hub.s3.externalSecret.remoteKey | quote }}
        property: {{ .Values.hub.s3.externalSecret.bucketNameProperty | quote }}
    - secretKey: region
      remoteRef:
        key: {{ .Values.hub.s3.externalSecret.remoteKey | quote }}
        property: {{ .Values.hub.s3.externalSecret.regionProperty | quote }}
    - secretKey: accessKeyId
      remoteRef:
        key: {{ .Values.hub.s3.externalSecret.remoteKey | quote }}
        property: {{ .Values.hub.s3.externalSecret.accessKeyProperty | quote }}
    - secretKey: secretAccessKey
      remoteRef:
        key: {{ .Values.hub.s3.externalSecret.remoteKey | quote }}
        property: {{ .Values.hub.s3.externalSecret.secretKeyProperty | quote }}
{{- end }}
