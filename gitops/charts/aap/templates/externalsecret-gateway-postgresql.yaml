{{- if .Values.aap.enabled }}
# Consumer-side database credential for the Gateway's own dedicated
# database (spec.database.database_secret on the AnsibleAutomationPlatform
# CR - see README.md's "Per-component external database" table).
# gitops/charts/postgresql resolves the same Vault path independently, into
# the PGO-managed pguser Secret in zuno-data - secretKeyRef can't cross
# namespaces, same "own ExternalSecret" pattern as gitops/charts/keycloak.
#
# Key set follows the documented upstream awx-operator/AAP-operator
# external-database Secret convention (host/port/database/username/
# password/sslmode) - not verified against a live reconcile on this CRD
# version. See ansible/roles/aap/README.md.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgresql.gateway.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.postgresql.gateway.secretName }}
    creationPolicy: Owner
    template:
      data:
        host: {{ .Values.postgresql.host | quote }}
        port: {{ .Values.postgresql.port | quote }}
        database: {{ .Values.postgresql.gateway.database | quote }}
        sslmode: {{ .Values.postgresql.sslmode | quote }}
        username: "{{ `{{ .username }}` }}"
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.postgresql.gateway.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.postgresql.gateway.vaultPath }}
        property: password
{{- end }}
