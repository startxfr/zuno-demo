{{- if .Values.aap.enabled }}
# The unified AnsibleAutomationPlatform CR (aap.ansible.com/v1alpha1)
# provisions Gateway, Controller, Hub and EDA together (ADR-0354 clause 3).
# Field names below are confirmed live via `oc explain` against the real
# CRD (WP-072's CRD inventory, 2026-08-24, cluster demo222) - see
# ansible/roles/aap/README.md for the full discovery notes and what
# remains unverified end to end.
apiVersion: aap.ansible.com/v1alpha1
kind: AnsibleAutomationPlatform
metadata:
  name: {{ .Values.crName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  hostname: "aap.{{ .Values.clusterBaseDomain }}"
  # hostname alone does NOT move the operator-created Route (confirmed
  # live 2026-08-25: the CR carried hostname aap.<domain> while the Route
  # stayed at the default aap-zuno-aap.<domain>, and the hostname answered
  # 503) - route_host is the field that actually sets the Route's host.
  # Kept equal to hostname so the Gateway's own origin and the Keycloak
  # client's redirect URIs (gitops/charts/keycloak/files/realm-zuno.json's
  # "aap" client, rooted at https://aap.<domain>) all agree.
  route_host: "aap.{{ .Values.clusterBaseDomain }}"
  admin_password_secret: {{ .Values.adminSecretName }}
  # Gateway's own dedicated database (spec.database.database_secret) - not
  # postgres_configuration_secret, unlike Controller/Hub below. See
  # README.md's "Per-component external database" table.
  database:
    database_secret: {{ .Values.postgresql.gateway.secretName }}
  api:
    replicas: {{ .Values.sizing.gateway.replicas }}
  controller:
    replicas: {{ .Values.sizing.controller.replicas }}
    web_replicas: {{ .Values.sizing.controller.webReplicas }}
    task_replicas: {{ .Values.sizing.controller.taskReplicas }}
    postgres_configuration_secret: {{ .Values.postgresql.controller.secretName }}
  # AAP 2.7's Automation Metrics service is deployed by the operator even
  # with no spec.metrics block, generating connection secrets for
  # databases nobody provisions on our unmanaged postgres (its awx read
  # default even targets a database named "automationcontroller"; ours is
  # aap-controller) - the web pod then CrashLoops on /health 503
  # (diagnosed live 2026-08-25). The parent-CR contract differs from the
  # generated MetricsService CR's shape: the gateway operator only reads
  # ms_awx_readonly_user_secret / externally_managed_ms_awx_readonly_user
  # at metrics top level (postgres/tasks/set_configuration_secret.yml,
  # "externally-managed read token" path) - under metrics.database they
  # are silently ignored. These two keys are also what skips the
  # operator's grant_metrics_readonly_on_controller.yml task, which is
  # fatal here (it needs a "postgres" superuser login our unmanaged
  # Crunchy cluster doesn't allow) and otherwise aborts every parent
  # reconcile before the override ever reaches the MetricsService CR.
  # Only database_secret is honored under metrics.database.
  metrics:
    externally_managed_ms_awx_readonly_user: true
    ms_awx_readonly_user_secret: {{ .Values.postgresql.metricsReadOnly.secretName }}
    database:
      database_secret: {{ .Values.postgresql.metrics.secretName }}
      externally_managed: true
  hub:
    postgres_configuration_secret: {{ .Values.postgresql.hub.secretName }}
    storage_type: {{ .Values.hub.storageType }}
{{- if eq .Values.hub.storageType "s3" }}
    # S3 backend (WP-075) - replaces the RWO-EBS file_storage PVC that
    # deadlocked api against content/worker across 2 nodes (WP-072).
    object_storage_s3_secret: {{ .Values.hub.s3.secretName }}
{{- else }}
    file_storage_access_mode: {{ .Values.hub.fileStorageAccessMode }}
    file_storage_size: {{ .Values.hub.fileStorageSize }}
{{- end }}
    api:
      replicas: {{ .Values.sizing.hub.apiReplicas }}
    web:
      replicas: {{ .Values.sizing.hub.webReplicas }}
    content:
      replicas: {{ .Values.sizing.hub.contentReplicas }}
    worker:
      replicas: {{ .Values.sizing.hub.workerReplicas }}
{{- if ne .Values.hub.storageType "s3" }}
      # content/worker both mount the same ReadWriteOnce file_storage PVC
      # (EBS-backed, this cluster has no RWX storage class - see values.yaml
      # hub.fileStorageAccessMode). RWO only allows attachment on one node
      # at a time, so worker's pod must be forced onto whichever node
      # content's pod(s) already landed on, or it hangs on
      # FailedAttachVolume/Multi-Attach - confirmed live 2026-08-24/25
      # (WP-072). podAffinity (not nodeAffinity): content's own scheduling
      # is unconstrained, so worker follows it rather than both racing for a
      # fixed node. Not needed once storageType: s3 - no shared PVC (WP-075).
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/component: content-server
              topologyKey: kubernetes.io/hostname
{{- end }}
  eda:
    # EDA's own standalone CRD (eda.ansible.com/v1alpha1) marks
    # automation_server_url as required (confirmed live) - the URL EDA
    # uses to reach Controller's API. Left unset here: the unified
    # AnsibleAutomationPlatform CR is documented to cross-wire its own
    # sub-components' URLs automatically, unlike a standalone EDA CR
    # applied on its own. NOT verified end to end (WP-072's CRD inventory
    # deliberately stopped short of creating this CR) - if EDA fails to
    # reconcile citing a missing automation_server_url, set it explicitly
    # here to the Gateway's own hostname above.
    database:
      database_secret: {{ .Values.postgresql.eda.secretName }}
    api:
      replicas: {{ .Values.sizing.eda.apiReplicas }}
    ui:
      replicas: {{ .Values.sizing.eda.uiReplicas }}
    default_worker:
      replicas: {{ .Values.sizing.eda.defaultWorkerReplicas }}
    activation_worker:
      replicas: {{ .Values.sizing.eda.activationWorkerReplicas }}
{{- end }}
