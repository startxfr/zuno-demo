{{- if .Values.aap.enabled }}
# Resolves the AAP bootstrap admin password auto-generated by the vault
# role; consumed by the AnsibleAutomationPlatform CR's
# spec.admin_password_secret (username is fixed as "admin" by the
# operator itself - the field only names a password Secret, unlike
# Keycloak's spec.bootstrapAdmin.user.secret which takes both).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.adminSecretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.adminSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: aap/admin
        property: password
{{- end }}
