{{- if .Values.aap.enabled }}
# Consumer-side credential for the Metrics service's read-only connection
# into the Controller database
# (spec.metrics.database.ms_awx_readonly_user_secret on the
# AnsibleAutomationPlatform CR). Overrides the operator-generated
# aap-metrics-read-token Secret, whose default targets a database
# literally named "automationcontroller" - ours is aap-controller.
# Same dual-ExternalSecret pattern as the other database secrets here.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgresql.metricsReadOnly.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.postgresql.metricsReadOnly.secretName }}
    creationPolicy: Owner
    template:
      data:
        host: {{ .Values.postgresql.host | quote }}
        port: {{ .Values.postgresql.port | quote }}
        database: {{ .Values.postgresql.metricsReadOnly.database | quote }}
        sslmode: {{ .Values.postgresql.sslmode | quote }}
        username: "{{ `{{ .username }}` }}"
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.postgresql.metricsReadOnly.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.postgresql.metricsReadOnly.vaultPath }}
        property: password
{{- end }}
