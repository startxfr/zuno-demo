{{- if .Values.aap.enabled }}
# ADR-0354/WP-073: the Red Hat account credentials the aap role's
# subscription-activation step reads (seeded to Vault zuno/aap/rhn by
# ansible/roles/vault from confidential.yml - the standard ADR-0024
# chain; the role no longer reads confidential.yml's RHN values
# directly). The Vault path may hold `_placeholder=true` instead of real
# values until the operator fills confidential.yml in - the aap role
# detects that (missing username/password keys in this Secret) and fails
# with an actionable message when zuno_aap_enabled is true.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aap-rhn-credentials
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aap-rhn-credentials
    creationPolicy: Owner
  # dataFrom (not per-key data): the Vault path legitimately holds either
  # {username,password} or the operator-supplied-tier {_placeholder} shape -
  # per-key remoteRefs against the placeholder shape would leave this
  # ExternalSecret permanently SecretSyncedError, blocking zuno-aap-d1's
  # Healthy gate even when the subscription feature is unused.
  dataFrom:
    - extract:
        key: aap/rhn
{{- end }}
