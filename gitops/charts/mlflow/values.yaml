# ADR-0538/WP-116. Everything is gated behind mlflowConfig.enabled so the
# -d0 Application renders nothing and only -d1 creates resources, the same
# shape aap-config/lightspeed-config/trustyai-config use.
mlflowConfig:
  enabled: false

server:
  # MUST be "mlflow": the CRD rejects any other name outright ("MLflow
  # resource name must be 'mlflow'") - it is a cluster singleton, not a
  # named instance. The operator also hardcodes
  # --namespace=redhat-ods-applications for the workloads it creates
  # (ADR-0331's constraint family), so this chart never chooses where the
  # server pod lands either.
  name: mlflow
  namespace: redhat-ods-applications
  replicas: 1
  backendStoreSecretName: mlflow-backend-store
  # serveArtifacts routes artifact reads/writes through the server's REST
  # API instead of requiring every client to hold S3 credentials - the mode
  # that fits the operand's per-workspace MLflowConfig design. The CRD
  # requires one of serveArtifacts+artifactsDestination or
  # defaultArtifactRoot; it validates this, the schema does not show it.
  serveArtifacts: true
  artifactsDestination: s3://zuno-corpus/mlflow-artifacts
  # redhat-ods-applications is mesh-injected, so every MLflow pod gets an
  # istio sidecar - but the operator's own NetworkPolicies only allow egress
  # to DNS and the database, which strands that sidecar: it cannot reach
  # istiod's XDS (15012) or cert-manager-istio-csr (443/6443) and loops on
  # "i/o timeout", so the pod never leaves Init. Live-diagnosed 2026-09-02
  # on the migration Job. These rules are APPENDED to the operator's
  # defaults (networkPolicyAdditionalEgressRules), never replacing them.
  additionalEgressPorts: [15012, 15010, 15014, 443, 6443, 8443]
  # The operator hardcodes PGSSLMODE=verify-full + PGSSLROOTCERT pointing at
  # its combined CA bundle, which contains the system + odh-trusted-ca
  # bundles - NOT the PGO cluster CA that signs zuno-postgresql's serving
  # cert. Left alone, every connection dies with "certificate verify
  # failed" (live-diagnosed 2026-09-02; the URI's own ?sslmode=require does
  # NOT win over this env var in the operand's code path). Overriding the
  # env keeps the connection encrypted without pinning a rotating CA into
  # the platform-wide trust bundle.
  env:
    - name: PGSSLMODE
      value: require
  db:
    # The PRIMARY Service, deliberately not -pgbouncer: MLflow's Alembic
    # migrations and SQLAlchemy session state do not survive transaction
    # pooling. Same documented choice as openshift-ai's maasDb.host.
    host: zuno-postgresql-primary.zuno-data.svc
    port: 5432
    database: mlflow
    # PGO's pg_hba accepts only encrypted connections ("no pg_hba.conf
    # entry ... no encryption" on sslmode=disable), and its server
    # certificate is signed by the PGO cluster CA, which this image does
    # not trust - so `require`: encrypted, no certificate verification.
    # Same choice agent-runtime and mlops make. (An earlier sslmode=disable
    # attempt here was a wrong turn: a probe pod built from the MLflow
    # image proved TLS itself was fine and the real failure was a stale
    # SCRAM verifier on the pguser Secret.)
    sslmode: require
    # Seeded by ansible/roles/vault; the same credential PGO adopts for the
    # dedicated mlflow role (gitops/charts/postgresql). Letters/digits-only
    # password: it is interpolated un-encoded into the postgresql:// URI.
    vaultPath: mlflow/postgresql-app

# Namespaces exposed as MLflow workspaces. The server selects them by label
# (workspaceLabelSelector below); each one additionally needs an
# MLflowConfig + artifact Secret, which is what this list renders.
workspaces:
  - zuno-mlops
  - zuno-ai-run

# Which namespaces the server treats as workspaces. Every zuno AI namespace
# already carries opendatahub.io/dashboard=true (the namespaces chart), so
# this needs no new labelling.
workspaceLabelSelector:
  opendatahub.io/dashboard: "true"

artifact:
  # The MLflowConfig CRD CEL-validates this name; keep it as-is.
  secretName: mlflow-artifact-connection
  bucket: zuno-corpus
  endpoint: https://s3.us-east-1.amazonaws.com
  region: us-east-1
  # The same S3 credential mlops and rag-ingestion already use.
  vaultPath: rag/s3
  rootPath: mlflow-artifacts

credentials:
  secretStoreName: vault-backend
  refreshInterval: 1h
