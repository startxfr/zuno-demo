{{- /*
The cluster-scoped MLflow server instance (ADR-0538 decision 1). Field names
verified against the live CRD (mlflows.mlflow.opendatahub.io/v1) rather than
assumed: backendStoreUriFrom takes a {name,key} Secret reference, and
workspaceLabelSelector is a standard label selector deciding which namespaces
appear as MLflow workspaces in the dashboard.

Two rules the CRD enforces but does not advertise in its schema, both learned
from a rejected apply: the resource name must be exactly "mlflow" (cluster
singleton), and either serveArtifacts+artifactsDestination or
defaultArtifactRoot must be set.

No `storage` block: that is the SQLite/file-artifact path. Artifacts live in
S3 per workspace, configured by the MLflowConfig CRs beside this file.
*/ -}}
{{- if .Values.mlflowConfig.enabled }}
---
apiVersion: mlflow.opendatahub.io/v1
kind: MLflow
metadata:
  name: {{ .Values.server.name }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: {{ .Values.server.replicas }}
  serveArtifacts: {{ .Values.server.serveArtifacts }}
  artifactsDestination: {{ .Values.server.artifactsDestination | quote }}
  backendStoreUriFrom:
    name: {{ .Values.server.backendStoreSecretName }}
    key: uri
  workspaceLabelSelector:
    matchLabels:
{{ toYaml .Values.workspaceLabelSelector | indent 6 }}
  networkPolicyAdditionalEgressRules:
    - ports:
{{- range .Values.server.additionalEgressPorts }}
        - protocol: TCP
          port: {{ . }}
{{- end }}
{{- end }}
