{{- /*
Composes the postgresql:// URI the MLflow server reads as its backend store,
from the same Vault credential PGO adopts for the dedicated mlflow role
(gitops/charts/postgresql/templates/externalsecret-mlflow.yaml). Resolved
here a second time rather than referenced, because that pguser Secret lives
in zuno-data and the server runs in redhat-ods-applications - secretKeyRef
cannot cross namespaces (same split as maas-db-config and rag-tech).

The password is interpolated un-encoded: safe because
ansible/roles/vault/tasks/install.yml seeds it letters/digits-only.

Sync-wave before the MLflow CR: the operator starts an Alembic migration Job
as soon as the CR appears, and it needs this Secret to already exist.
*/ -}}
{{- if .Values.mlflowConfig.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.server.backendStoreSecretName }}
  namespace: {{ .Values.server.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.server.backendStoreSecretName }}
    template:
      data:
        uri: "postgresql://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@{{ .Values.server.db.host }}:{{ .Values.server.db.port }}/{{ .Values.server.db.database }}"
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.server.db.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.server.db.vaultPath }}
        property: password
{{- end }}
