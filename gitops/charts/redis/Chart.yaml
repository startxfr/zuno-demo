apiVersion: v2
name: redis
description: >-
  ADR-0042: server-side session store backing agent-frontend's opaque
  browser sessions (access/ID/refresh tokens, groups, expiry - never in
  the browser cookie itself). Wraps the upstream bitnami/redis chart,
  same "vendor a public Helm chart, no operator" pattern
  gitops/charts/vault already established for a stateful backing service
  with no OLM operator commonly available on this platform.
type: application
version: 0.1.0
appVersion: "8.10.0"
dependencies:
  - name: redis
    version: "28.0.2"
    repository: "https://charts.bitnami.com/bitnami"
