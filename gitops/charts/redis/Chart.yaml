apiVersion: v2
name: redis
description: >-
  Redis for ai-gateway's semantic cache (ADR-0104); it was first the
  ADR-0042 browser-session store of the agent frontends retired in
  WP-156. Wraps the upstream bitnami/redis chart,
  same "vendor a public Helm chart, no operator" pattern
  gitops/charts/vault already established for a stateful backing service
  with no OLM operator commonly available on this platform.
type: application
version: 0.1.0
appVersion: "8.2.1"
dependencies:
  - name: redis
    version: "28.0.2"
    repository: "https://charts.bitnami.com/bitnami"
