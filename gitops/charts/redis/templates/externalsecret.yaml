{{- if .Values.redis.enabled | default true }}
# Syncs the Vault-generated Redis auth password into the Secret
# name/key bitnami/redis's auth.existingSecret/existingSecretPasswordKey
# (values.yaml) expects.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zuno-redis-auth
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: zuno-redis-auth
    creationPolicy: Owner
  data:
    - secretKey: redis-password
      remoteRef:
        key: redis/session-store
        property: password
{{- end }}
