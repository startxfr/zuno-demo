{{- if .Values.redis.enabled | default true }}
# ADR-0042 session store (agent-frontend pods) plus, since ADR-0104,
# ai-gateway's semantic cache - not every pod in a namespace that happens
# to be allowed by zuno-auth's broader default-deny-other-namespaces
# baseline (gitops/charts/namespaces), and not from anywhere in the
# cluster (which is what bitnami/redis's own default NetworkPolicy would
# otherwise allow - disabled in values.yaml in favor of this). Same
# least-privilege bar gitops/charts/mcp-confluence already sets. Every
# active agent's frontend, and every shared platform service, deploys
# into the single shared zuno-ai-run namespace (ADR-0329, supersedes
# ADR-0023's namespace-per-agent model), so this matches that namespace by
# name rather than a per-agent namespace label.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zuno-redis-session-store
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-ai-run
          podSelector:
            matchLabels:
              # Matches gitops/charts/tekos/templates/deployment.yaml's
              # frontend Deployment label exactly (app.kubernetes.io/
              # component: frontend, not .../name - this chart's own
              # convention, not the app.kubernetes.io/name one
              # mcp-gateway/mcp-confluence use).
              app.kubernetes.io/component: frontend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-ai-run
          podSelector:
            matchLabels:
              # ADR-0104: matches gitops/charts/ai-gateway/templates/
              # deployment.yaml's own Deployment label
              # (app.kubernetes.io/name, that chart's own convention).
              app.kubernetes.io/name: ai-gateway
      ports:
        - protocol: TCP
          port: 6379
{{- if .Values.redis.metrics.enabled }}
    # ADR-0413: admits prometheus-k8s's scrape of the redis_exporter sidecar
    # values.yaml's redis.metrics.enabled adds (port 9121, bitnami default) -
    # zuno-auth's baseline is zuno-default-deny-other-namespaces
    # (gitops/charts/namespaces), which admits neither openshift-monitoring
    # nor openshift-user-workload-monitoring by default. Precise allow-list,
    # same pattern as this policy's own session-store rule above.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - protocol: TCP
          port: 9121
{{- end }}
{{- end }}
