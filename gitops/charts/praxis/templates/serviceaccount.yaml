# Dedicated service account: the MaaS subscriptions of the models chart name system:serviceaccount:zuno-ai-gateways:praxis
# (altGatewayPeers.praxis). Its token is projected into the pod for the MaaS gateway only (deployment.yaml); the
# default mount stays off.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: praxis
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: praxis
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
automountServiceAccountToken: false
