# The keys read from Vault, each through this namespace's own SecretStore `vault` (ADR-0602): the grants are in
# platform/vault/secret-access.yaml (zuno-ai-gateways), and check_secret_access.py fails on a grant nothing reads.
{{- $v := .Values }}
{{- if $v.saas.enabled }}
{{- range list $v.saas.claude $v.saas.codestral }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}
  namespace: {{ $v.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "55"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: {{ .secretName }}
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: {{ .vault.key }}
        property: {{ .vault.property }}
{{- end }}
{{- end }}
{{- if $v.tokenRateLimit.enabled }}
---
# The session-store password (the same Vault key the ai-gateway's copy reads): a Secret cannot cross namespaces.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $v.tokenRateLimit.redis.secretName }}
  namespace: {{ $v.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "55"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: {{ $v.tokenRateLimit.redis.secretName }}
    creationPolicy: Owner
    # The token_rate_limit filter takes its backend URL as one whole ${ENV_VAR} (it refuses a URL with a variable
    # spliced in), so the URL is built here, the password percent-encoded.
    template:
      engineVersion: v2
      data:
        REDIS_URL: {{ printf "redis://:{{ .password | urlquery }}@%s:%v" $v.tokenRateLimit.redis.host $v.tokenRateLimit.redis.port | squote }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ $v.tokenRateLimit.redis.vault.key }}
        property: {{ $v.tokenRateLimit.redis.vault.property }}
{{- end }}
