# ADR-0588 (WP-181): Open WebUI's secrets from Vault, never in values.
# keycloak/open-webui is the same client secret Keycloak reads through KC_VAULT
# (gitops/charts/keycloak); open-webui/app is seeded by ansible/roles/open_webui.
# Keys are environment variable names: the pod reads both Secrets with envFrom.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: open-webui-oidc
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: ClusterSecretStore
  target:
    name: open-webui-oidc
    creationPolicy: Owner
  data:
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: keycloak/open-webui
        property: client_secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: open-webui-app
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: ClusterSecretStore
  target:
    name: open-webui-app
    creationPolicy: Owner
  data:
    - secretKey: WEBUI_SECRET_KEY
      remoteRef:
        key: open-webui/app
        property: webui_secret_key
    # Encrypts the stored OAuth tokens (system_oauth forwarding).
    - secretKey: OAUTH_SESSION_TOKEN_ENCRYPTION_KEY
      remoteRef:
        key: open-webui/app
        property: session_encryption_key
    - secretKey: WEBUI_ADMIN_PASSWORD
      remoteRef:
        key: open-webui/app
        property: bootstrap_admin_password
