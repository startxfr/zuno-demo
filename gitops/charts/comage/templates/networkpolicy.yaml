# Grants the comage-frontend Deployment (the real chat path) and the
# acceptance-gate Job ingress to the BFF, additive to the namespace-wide
# default-deny baseline. No namespaceSelector needed: an ingress `from`
# peer with only a podSelector matches same-namespace pods.
#
# Must list both frontend and acceptance-gate: listing only acceptance-gate
# silently drops the frontend's own calls to the BFF under the implicit
# default-deny (Kubernetes denies everything not explicitly allowed once any
# NetworkPolicy selects a pod), timing out every real chat turn at the TCP
# level. The acceptance-gate suite alone won't catch this since it calls the
# BFF directly, bypassing the frontend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: comage-bff
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: bff
      zuno.io/agent: comage
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
              zuno.io/agent: comage
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: acceptance-gate
        # WP-087: the mlops training pipeline runs the SAME acceptance gate
        # from zuno-mlops, so the acceptance-gate peer above cannot reach
        # it - an ingress `from` peer carrying only a podSelector matches
        # same-namespace pods, and the pipeline pod is in another
        # namespace. It timed out at the TCP level on every scenario that
        # touches this service, which the ADR-0028 rate then scored as the
        # agent misbehaving rather than as a policy gap.
        #
        # namespaceSelector AND podSelector inside ONE peer element is an
        # intersection, not a union: only KFP component pods, and only
        # those in zuno-mlops. Splitting them into two list items would
        # instead admit that whole namespace plus every KFP pod anywhere.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-mlops
          podSelector:
            matchLabels:
              pipelines.kubeflow.org/v2_component: "true"
      ports:
        - protocol: TCP
          port: 8080
