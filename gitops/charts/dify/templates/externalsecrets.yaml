# ADR-0599 (WP-204): Dify's secrets from Vault, never in values. The dify-helm chart's own
# ExternalSecrets are v1 and this cluster's ESO serves v1beta1 only, so they stay off and
# the pods read this Secret through `extraEnv` (an explicit env var wins over the chart's
# own placeholder Secret). Paths are seeded by ansible/roles/vault (dify/postgresql-app,
# dify/s3, keycloak/dify) and ansible/roles/dify (dify/app, dify/redis).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dify-app
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  # ADR-0602/WP-223: this namespace's own SecretStore, which reads only the keys platform/vault/secret-access.yaml grants it.
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: SecretStore
  target:
    name: dify-app
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        SECRET_KEY: "{{ `{{ .secret_key }}` }}"
        DB_USERNAME: "{{ `{{ .db_username }}` }}"
        DB_PASSWORD: "{{ `{{ .db_password }}` }}"
        REDIS_PASSWORD: "{{ `{{ .redis_password }}` }}"
        # Celery broker on redis db 1 (the app uses db 0).
        CELERY_BROKER_URL: "redis://:{{ `{{ .redis_password }}` }}@dify-redis-master:6379/1"
        PLUGIN_DAEMON_KEY: "{{ `{{ .plugin_daemon_key }}` }}"
        INNER_API_KEY_FOR_PLUGIN: "{{ `{{ .inner_api_key }}` }}"
        S3_ACCESS_KEY: "{{ `{{ .s3_access_key }}` }}"
        S3_SECRET_KEY: "{{ `{{ .s3_secret_key }}` }}"
  data:
    - secretKey: secret_key
      remoteRef: {key: dify/app, property: secret_key}
    - secretKey: db_username
      remoteRef: {key: dify/postgresql-app, property: username}
    - secretKey: db_password
      remoteRef: {key: dify/postgresql-app, property: password}
    - secretKey: redis_password
      remoteRef: {key: dify/redis, property: password}
    - secretKey: plugin_daemon_key
      remoteRef: {key: dify/app, property: plugin_daemon_key}
    - secretKey: inner_api_key
      remoteRef: {key: dify/app, property: inner_api_key}
    - secretKey: s3_access_key
      remoteRef: {key: dify/s3, property: accessKeyId}
    - secretKey: s3_secret_key
      remoteRef: {key: dify/s3, property: secretAccessKey}
---
# The bundled Redis reads its password from this Secret (redis.auth.existingSecret).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dify-redis
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  # ADR-0602/WP-223: this namespace's own SecretStore, which reads only the keys platform/vault/secret-access.yaml grants it.
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: SecretStore
  target:
    name: dify-redis
    creationPolicy: Owner
  data:
    - secretKey: redis-password
      remoteRef: {key: dify/redis, property: password}
---
# oauth2-proxy: the Keycloak client secret (the same value Keycloak reads through
# KC_VAULT) and its cookie secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dify-front-door
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  # ADR-0602/WP-223: this namespace's own SecretStore, which reads only the keys platform/vault/secret-access.yaml grants it.
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: SecretStore
  target:
    name: dify-front-door
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef: {key: keycloak/{{ .Values.frontDoor.clientId }}, property: client_secret}
    - secretKey: cookie-secret
      remoteRef: {key: dify/app, property: front_door_cookie_secret}
