namespace: zuno-ai-run

image:
  # Built by the "mcp" build component into zuno-ai-build's ImageStream, pulled
  # cross-namespace into zuno-ai-run via the system:image-puller RoleBinding.
  repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/mcp-gateway
  # image.tag must stay "latest" until a release is cut - see RELEASING.md (two parallel image paths).
  tag: latest
  # ADR-0603 M16: written by platform/supply-chain/render_release_digests.py from the release
  # ledger, never by hand. Set, it wins over tag (repository@digest, IfNotPresent, no :latest trigger).
  digest: ""
  # Always, not IfNotPresent - the mutable :latest tag needs it to avoid serving a stale cached image; see RELEASING.md.
  # Used only on the :latest path: a rendered digest pulls IfNotPresent (ADR-0603 M16).
  pullPolicy: Always

replicas: 1

# ADR-0101 (roadmap WP-12): the HA-capable shape - a PodDisruptionBudget
# (templates/poddisruptionbudget.yaml) and topology spread across nodes,
# both correct and safe at any replica count including the current
# demo-scale replicas: 1 above (a PDB with minAvailable 1 simply protects
# the sole pod from voluntary eviction; whenUnsatisfiable ScheduleAnyway
# makes the spread constraint a soft preference, never a scheduling
# blocker on a single-node/single-zone cluster). replicas itself is left
# at the current demo footprint deliberately - raising it to the >=2
# ADR-0101 describes is an environment-specific override, paired with the
# operator's failover drill (see that ADR's Operator follow-up), not a
# silent default change here.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Override for the target cluster's real route hostname.
# apps.mycluster.example.com is the substitution placeholder
# (ansible/tasks/apply_gitops_app.yml rewrites it in the Application
# manifest, which passes it back here via helm values - same pattern as
# gitops/charts/tekos). Don't hardcode a specific host default here
# (e.g. keycloak-zuno.<domain>) - a retired alias previously shipped
# unresolved and broke JWT validation via an unresolvable JWKS hostname.
clusterBaseDomain: apps.mycluster.example.com
# Empty means "https://keycloak.<clusterBaseDomain>/realms/zuno".
keycloakIssuer: ""
# User decision 2026-11-07 (WP-224 review): the JWKS stays on the in-cluster
# Service. The gateways are meshed and zuno-auth is STRICT, so this hop is mTLS
# (the client sidecar originates it), with no dependency on the public load
# balancer and the router hairpin. The issuer above stays HTTPS: it is only
# compared with the token's `iss`. Empty means "<issuer>/protocol/openid-connect/certs"
# (an external Keycloak, ADR-0352 external mode).
keycloakJwksUrl: http://zuno-service.zuno-auth.svc:8080/realms/zuno/protocol/openid-connect/certs
# ADR-0602 / WP-222: the audience every experience client's token carries (the maas-gateway-audience
# mapper of realm-zuno.json: unifai, open-webui, dify, kagent, openclaw-*, zuno-evaluations,
# zuno-stresstest), the same one a2a-gateway requires. Tokens of `openshift`, `aap` and `zuno-signer`
# lack it and are refused. Empty = the audience is not checked (and jwtAudienceRequired must be false,
# or the pod refuses to start).
jwtAudience: zuno-admin-api
jwtAudienceRequired: true

# ADR-0415: components/mcp-gateway/app/handlers/image_gen.py's real
# in-cluster call target.
aiGatewayUrl: http://ai-gateway.zuno-ai-run.svc:8080

# Domains treated as "internal" by the send_technical_report_email demo
# handler (comma-separated). Override for the real environment.
internalEmailDomains: zuno.example.internal

# ADR-0603 M12 (WP-225 lot B): the recipients each Keycloak group may send the
# technical report email to, on top of internalEmailDomains. {group: [address or
# fnmatch pattern]}, case-insensitive, e.g. {board: ["*@zuno.example.internal"],
# sales: ["sales-*@zuno.example.internal"]}. The groups are the caller's validated
# token groups. Empty: no allowlist, today's behaviour; once set, a caller whose
# groups match no pattern for a recipient is refused.
emailReport:
  recipientAllowlist: {}

# ADR-0603 M13 (WP-225 lot B): the namespaces each Keycloak group may query through
# metrics.query. When set, the gateway adds namespace=~"<namespaces>" to every
# selector of the PromQL before it reaches mcp-k8s (app/promql_scope.py); a query it
# cannot scope is refused, and a caller whose groups list no namespace is refused.
# "*" is every namespace (no matcher). Empty: no matcher, today's behaviour.
#   namespacesByGroup:
#     ocp-ai-ops: [zuno-ai-run, zuno-ai-build, zuno-data, zuno-monitoring]
#     ocp-paas-ops: ["*"]
metricsQuery:
  namespacesByGroup: {}

# ADR-0603 M15 (WP-225 lot B): the most messages one JSON-RPC batch on /mcp may
# carry. A larger (or empty) batch gets one Invalid Request error (-32600, id null)
# and no message of it is processed. 0 = unbounded.
jsonRpc:
  maxBatchSize: 20

# ADR-0602 clause 10 / ADR-0603 M14 (WP-225 lot C): what the gateway sends as
# Authorization to a streamable-HTTP backend.
#   bearer     the caller's own Keycloak token, forwarded (today's behaviour).
#   assertion  a per-call JWT the gateway signs (EdDSA; aud the backend, sub the
#              caller, act the gateway, the tool, exp <= 60 s, jti), verified by
#              each Zuno server (callAssertion.publicKey in its chart). A
#              third-party backend (kubernetes-mcp-server) gets no Authorization;
#              a binding with `user_token: true` keeps the bearer. Needs the key
#              pair in Vault (vaultKey, fields private_key and public_key) and the
#              key granted to zuno-ai-run in platform/vault/secret-access.yaml.
outboundIdentity:
  mode: bearer
  assertionTtlSeconds: 60
  vaultKey: mcp/gateway-call-assertion
  vaultProperty: private_key

# ADR-0603 M14 (WP-225 lot C): verify the a2a-gateway's signed X-Zuno-Agent-Chain.
# With verify true and publicKey set (the PEM of Vault a2a/agent-chain public_key),
# a valid chain names the agent, task and delegators of the call, and a disagreeing
# X-Zuno-Agent is ignored and logged. A missing or invalid chain keeps today's
# headers. Off by default.
agentChain:
  verify: false
  publicKey: ""

# ADR-0602 clause 10 (WP-225 lot C): the Keycloak clients (azp) whose tokens the
# gateway accepts, on top of jwtAudience. An entry ending in "*" is a prefix.
# Empty (the default) accepts every client the audience admits; a bare "*" is
# refused. Include the admin client when /admin/* is used. An OpenShift token on
# /mcp (TokenReview, ADR-0524) has no azp and is not subject to the list.
jwtAllowedClients: []

# WP-225 lot C (ADR-0603 M14): check the caller's entitlement to the calling agent
# (zuno.access.groups, ADR-0040) on EVERY tool call, so the REST north side
# (/v1/tools/{name}/invoke) refuses what /mcp already refuses. OFF by default:
# kept off until a post-demo golden-path run, belt and braces. UnifAI calls /mcp,
# which refuses up front either way; the only REST callers are the evaluation
# scripts.
restAgentEntitlement: false

# ADR-0524 clause 3 (WP-085 step 3): lets OpenShift Lightspeed reach this
# gateway's MCP front-door (/mcp). Default false - the allow is scoped by
# NAMESPACE rather than by pod label, because Lightspeed's pods are
# operator-owned and carry no label this chart controls, so it stays opt-in
# rather than shipping a coarse grant to every cluster.
#
# Turned on by the Day 2 `mcp` component only once `lightspeed-config` is
# actually being deployed. Enabling it without Lightspeed installed is
# harmless (the namespaceSelector simply matches nothing), but pointless.
lightspeed:
  enabled: false
  namespace: openshift-lightspeed
  # ADR-0524: what the /mcp front-door may ever expose, for ANY caller. This is
  # a ceiling, not a grant - each capability is still checked against the
  # caller's own groups and the request classification, so listing something
  # here does not entitle anyone to it.
  #
  # It exists because a standard MCP client carries no OKF bundle and so cannot
  # satisfy ADR-0011's agent_declaration/task_rights factors. This replaces them,
  # and is deliberately harder to widen than a bundle would be: changing it is a
  # values change visible in the Deployment spec, not a Markdown edit in an
  # agent bundle (zuno-demo-agents).
  #
  # Keep it read-only. ADR-0524 clause 4's read-only guarantee rests on this
  # list, NOT on the caller's groups - a consultant is entitled to
  # confluence.page.create elsewhere in the platform and would reach it here the
  # moment it were added.
  #
  # 2026-09-09 extension: knowledge.tech.search (technical-docs RAG,
  # policies/tools/tool-policy.yaml) and aap.platform.audit/aap.cluster.audit
  # (AAP audit, scoped further by allowed_groups to ocp-ai-ops) added. Both
  # are read-only, same as the two Confluence entries above - the ceiling
  # stays a read-only allowlist, it just now covers three capability
  # families instead of one.
  frontdoorCapabilities:
    - confluence.page.search
    - confluence.page.read
    - knowledge.tech.search
    - aap.platform.audit
    - aap.cluster.audit
    # WP-220 (2026-11-06, user go): the four read-only Kubernetes capabilities of
    # ADR-0600 clause 1, for the MaaS consumer portal playground. The ceiling does
    # not entitle anyone: the tool policy (zuno-demo-agents policies/tools/
    # tool-policy.yaml) still limits each of them to allowed_groups ocp-ai-ops, so a
    # portal user outside that group sees none of them in tools/list.
    - k8s.resource.read
    - k8s.resource.list
    - k8s.events.read
    - k8s.logs.read

# WP-220 (2026-11-06): the MaaS consumer portal playground reaches the /mcp
# front-door with the signed-in user's own token. Two callers, both listed by
# namespace (the OGX server pod is operator-created and the portal BFF is a
# vendor pod, neither carries a label this chart controls): the playground
# namespace, where the OGX stack's MCP tool runtime runs, and
# redhat-ods-applications, where gen-ai-ui checks tools and status. The user's
# groups still decide what each caller may see (ADR-0036).
playground:
  # On by default: zuno-playground is a platform namespace (gitops/charts/namespaces) and
  # the live Application's helm values are written by ansible, so a default keeps this
  # change in git.
  enabled: true
  namespaces:
    - zuno-playground
    - redhat-ods-applications

# ADR-0560/0563 (WP-151): namespace of the UnifAI stack whose multi-agent
# pods may call this gateway. Empty = no UnifAI peer in the NetworkPolicy.
unifaiNamespace: zuno-unifai

# ADR-0580/WP-161: read agent definitions from the admitted zuno-demo-agents
# release instead of the copy baked into the image. When enabled, an
# `okf-fetch` init container pulls the corp artifact at `corpReference`
# (a @sha256 reference, from platform/okf/stack-config.generated.yaml via
# ansible/roles/mcp), verifies it offline against the release identity, and
# extracts it into an emptyDir; AGENTS_DIR and TOOL_POLICY_PATH then point
# there. The data-classification policy and the tool bindings stay the
# platform's own (baked). A failed verification keeps the pod in Init
# (fail closed). The digest is a pod-template annotation, so promoting a
# release rolls the pods. Since the cutover (WP-165) the image carries no
# agents and no tool policy: ansible/roles/mcp always enables this with the
# locked digest. The chart default stays off only so a bare `helm lint`
# renders; a pod deployed that way denies every agent-scoped call.
okf:
  fetch:
    enabled: false
    corpReference: ""
    # ADR-0611/WP-246: a registry prefix (e.g. okf-mirror.zuno-ai-run.svc:5000/okf) holding the release
    # by the same digest. Set, okf-fetch reads from there first (2 short attempts) and falls back to
    # `corpReference`'s own registry; verification is identical either way. Empty: today's behaviour.
    mirror:
      prefix: ""
      plainHttp: false
    image:
      repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/supply-chain-signer
      tag: latest
      # ADR-0603 M16: written by platform/supply-chain/render_release_digests.py from the release
      # ledger, never by hand. Set, it wins over tag (repository@digest, IfNotPresent, no :latest trigger).
      digest: ""
      pullPolicy: Always
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}

# ADR-0594 (WP-191): signed classification markers on MCP tool results. The key
# Secret is generated in zuno-ai-run by the mcp-gateway chart; both gateways read it.
toolMarker:
  enabled: true
  secretName: zuno-tool-marker-key
