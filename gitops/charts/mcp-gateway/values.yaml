namespace: zuno-ai-run

image:
  # Built by the "mcp" build component into zuno-ai-build's ImageStream,
  # pulled cross-namespace into zuno-ai-run via the system:image-puller RoleBinding.
  repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/mcp-gateway
  tag: latest
  pullPolicy: IfNotPresent

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Override for the target cluster's real route hostname.
keycloakIssuer: https://keycloak-zuno.apps.mycluster.example.com/realms/zuno

salesDbMcpUrl: http://sales-db-mcp.zuno-ai-run.svc:8000

# Domains treated as "internal" by the send_technical_report_email demo
# handler (comma-separated). Override for the real environment.
internalEmailDomains: zuno.example.internal
