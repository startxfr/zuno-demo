# Workload-identity token sent as X-Zuno-Gateway-Token on every call to
# sales-db-mcp, proving the call came from this gateway.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mcp-gateway-workload-token
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mcp-gateway-workload-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: mcp/gateway-workload-token
        property: token
