# Workload-identity token sent as X-Zuno-Gateway-Token on every call to
# each downstream MCP server, proving the call came from this gateway.
#
# Sole owner of this ExternalSecret/Secret pair: mcp-confluence,
# and mcp-salesforce all validate against the same token but only read the
# Secret via secretKeyRef (mcp-gateway-workload-token) - they must not declare
# their own copy of this ExternalSecret, since all four charts share the
# zuno-ai-run namespace and a duplicate with the same name/namespace collides
# as one Kubernetes object, which ArgoCD then flags as owned by multiple
# Applications. This app's sync-wave (-151) is the earliest of the four, so
# the Secret always exists before the consumer apps sync.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mcp-gateway-workload-token
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mcp-gateway-workload-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: mcp/gateway-workload-token
        property: token
