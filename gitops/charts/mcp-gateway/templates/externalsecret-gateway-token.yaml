# ADR-0037: this gateway's own copy of the shared workload-identity secret
# (secret/zuno/mcp/gateway-workload-token, vault-generated by
# ansible/roles/vault/tasks/configure.yml) it sends as X-Zuno-Gateway-Token
# on every call to sales-db-mcp, proving the call came from this gateway
# and not merely from a network-adjacent pod.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mcp-gateway-workload-token
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mcp-gateway-workload-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: zuno/mcp/gateway-workload-token
        property: token
