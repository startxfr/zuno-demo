{{- if .Values.okf.fetch.mirror.pullSecret }}
# ADR-0612: pull credential for the Quay mirror of the OKF release, read by okf-fetch in BOTH gateways (same namespace, so this
# chart is the only owner of the object; a2a-gateway only mounts it). Docker config built from the pull-only Vault record.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.okf.fetch.mirror.pullSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: {{ .Values.okf.fetch.mirror.pullSecret }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.json: '{"auths":{ {{ (first (splitList "/" .Values.okf.fetch.mirror.prefix)) | quote }}:{"auth":"{{ "{{ printf \"%s:%s\" .username .token | b64enc }}" }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: registry/quay-pull
        property: username
    - secretKey: token
      remoteRef:
        key: registry/quay-pull
        property: token
{{- end }}
