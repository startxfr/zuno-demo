# ADR-0594 (WP-191): the key both gateways sign and verify tool-result
# classification markers with. Generated once by an External Secrets Password
# generator (refreshInterval 0: never regenerated) in zuno-ai-run, where both the
# mcp-gateway and the ai-gateway run; the ai-gateway chart only reads the Secret.
# Recreating it only makes older markers count as missing (fail closed).
{{- if .Values.toolMarker.enabled }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.toolMarker.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.toolMarker.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "55"
spec:
  refreshInterval: "0"
  target:
    name: {{ .Values.toolMarker.secretName }}
    creationPolicy: Owner
    template:
      data:
        ZUNO_MARKER_KEY: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Values.toolMarker.secretName }}
{{- end }}
