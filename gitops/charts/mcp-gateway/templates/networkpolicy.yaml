# Precise ingress allow-list, not a namespace-wide baseline: only Agent
# Runtime, the acceptance-gate test Job and (optionally) OpenShift Lightspeed
# may call this service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-gateway
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-runtime
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: acceptance-gate
        # WP-087: the mlops training pipeline runs the SAME acceptance gate
        # from zuno-mlops, so the acceptance-gate peer above cannot reach
        # it - an ingress `from` peer carrying only a podSelector matches
        # same-namespace pods, and the pipeline pod is in another
        # namespace. It timed out at the TCP level on every scenario that
        # touches this service, which the ADR-0028 rate then scored as the
        # agent misbehaving rather than as a policy gap.
        #
        # namespaceSelector AND podSelector inside ONE peer element is an
        # intersection, not a union: only KFP component pods, and only
        # those in zuno-mlops. Splitting them into two list items would
        # instead admit that whole namespace plus every KFP pod anywhere.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-mlops
          podSelector:
            matchLabels:
              pipelines.kubeflow.org/v2_component: "true"
      ports:
        - protocol: TCP
          port: 8080
{{- if .Values.lightspeed.enabled }}
    # ADR-0524 clause 3: OpenShift Lightspeed reaching the /mcp front-door.
    # namespaceSelector, not podSelector: Lightspeed's pods are operator-owned
    # and carry no label this chart controls, so the grant is scoped by
    # namespace instead - deliberately the coarser of the two, and the reason
    # this stays gated rather than always-on.
    #
    # This works without any mesh change because zuno-ai-run has no
    # PeerAuthentication forcing STRICT mTLS (verified live 2026-08-26: `oc get
    # peerauthentication -A` returns nothing), so a non-injected client is
    # accepted. If a STRICT PeerAuthentication is ever introduced, this allow
    # stops being sufficient and Lightspeed needs a different path - it cannot
    # simply be sidecar-injected, see gitops/charts/lightspeed/values.yaml.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.lightspeed.namespace }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
