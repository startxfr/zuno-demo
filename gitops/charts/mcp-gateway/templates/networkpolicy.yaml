# Precise ingress allow-list, not a namespace-wide baseline: only Agent
# Runtime and the acceptance-gate test Job may call this service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-gateway
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-runtime
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: acceptance-gate
      ports:
        - protocol: TCP
          port: 8080
