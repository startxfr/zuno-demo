{{- /* ADR-0602 clause 10 / ADR-0603 M14 (WP-225 lot C): the private key of the per-call
     assertion (app/call_assertion.py). Rendered only with outboundIdentity.mode
     assertion. Only this pod mounts it; the Zuno servers get the public key as a
     chart value (callAssertion.publicKey), so none of them can mint an assertion. */}}
{{- if not (has .Values.outboundIdentity.mode (list "bearer" "assertion")) }}
{{- fail (printf "outboundIdentity.mode must be bearer or assertion, not %q" .Values.outboundIdentity.mode) }}
{{- end }}
{{- if and .Values.agentChain.verify (not .Values.agentChain.publicKey) }}
{{- fail "agentChain.verify needs agentChain.publicKey (the PEM of Vault a2a/agent-chain public_key)" }}
{{- end }}
{{- if not (has .Values.outboundIdentity.signer (list "file" "transit")) }}
{{- fail (printf "outboundIdentity.signer must be file or transit, not %q" .Values.outboundIdentity.signer) }}
{{- end }}
{{- if and (eq .Values.outboundIdentity.mode "assertion") (eq .Values.outboundIdentity.signer "file") }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mcp-gateway-call-assertion
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: mcp-gateway-call-assertion
    creationPolicy: Owner
  data:
    - secretKey: private_key
      remoteRef:
        key: {{ .Values.outboundIdentity.vaultKey }}
        property: {{ .Values.outboundIdentity.vaultProperty }}
{{- end }}
