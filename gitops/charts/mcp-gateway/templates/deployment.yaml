apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mcp-gateway
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    {{- if not .Values.image.digest }}
    {{- /* A digest-pinned image must not be rewritten by the :latest trigger. */}}
    image.openshift.io/triggers: |-
      {{ include "mcp-gateway.imageTrigger" (dict "repository" .Values.image.repository "tag" .Values.image.tag "container" "mcp-gateway") }}
    {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-gateway
        # WP-156: the pod label UnifAI's RAG server admits
        # (UnifaiStack spec.exposure.ragClients), for search_technical_docs.
        zuno.io/rag-client: "true"
      {{- $digestAnnotations := include "mcp-gateway.digestAnnotations" .Values }}
      {{- if or .Values.okf.fetch.enabled $digestAnnotations }}
      annotations:
        {{- if .Values.okf.fetch.enabled }}
        # ADR-0580: a promoted release changes this, which rolls the pods.
        zuno.startx.fr/okf-corp-reference: {{ .Values.okf.fetch.corpReference | quote }}
        {{- end }}
        {{- with $digestAnnotations }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: mcp-gateway
      priorityClassName: zuno-workload-default
      # ADR-0524 : le montage du token de ServiceAccount devient necessaire des
      # que le front-door /mcp est actif - app/auth.py s'authentifie avec lui
      # aupres de l'API TokenReview pour resoudre le token de l'utilisateur
      # console. Sans lui, chaque appel de Lightspeed repond 503 et
      # l'app-server journalise "Failed to get tools from MCP server
      # 'zuno-mcp'" (constate live le 2026-08-27).
      #
      # Reste false par defaut : hors front-door, ce service n'appelle
      # effectivement jamais l'API Kubernetes, et c'est la posture d'origine
      # qu'il faut conserver.
      automountServiceAccountToken: {{ .Values.lightspeed.enabled }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-gateway
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.okf.fetch.enabled }}
      {{- if not (contains "@sha256:" .Values.okf.fetch.corpReference) }}
      {{- fail "okf.fetch.corpReference must be a @sha256: reference when okf.fetch.enabled is true" }}
      {{- end }}
      initContainers:
        # ADR-0580/WP-161: pull, verify offline, extract. Non-zero exit on any
        # verification failure keeps the pod in Init.
        - name: okf-fetch
          image: {{ include "mcp-gateway.imageRef" .Values.okf.fetch.image | quote }}
          imagePullPolicy: {{ include "mcp-gateway.imagePullPolicy" .Values.okf.fetch.image }}
          command:
            - python3
            - /app/platform/supply-chain/admit_okf_bundle.py
            - extract
            - {{ .Values.okf.fetch.corpReference | quote }}
            - --out
            - /okf
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: okf
              mountPath: /okf
            - name: okf-tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.okf.fetch.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: mcp-gateway
          image: {{ include "mcp-gateway.imageRef" .Values.image | quote }}
          imagePullPolicy: {{ include "mcp-gateway.imagePullPolicy" .Values.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          env:
{{- if .Values.toolMarker.enabled }}
            # ADR-0594: key of the signed tool-result classification markers
            # (externalsecret-tool-marker.yaml of the mcp-gateway chart).
            - name: ZUNO_MARKER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.toolMarker.secretName }}
                  key: ZUNO_MARKER_KEY
                  optional: true
{{- end }}
{{- if .Values.lightspeed.enabled }}
            # ADR-0524: the /mcp front-door's capability ceiling. Comma-separated;
            # an empty string disables the front-door's tool surface entirely
            # (tools/list returns nothing, every tools/call is refused) without
            # removing the endpoint. Unset falls back to the read-only Confluence
            # pair compiled into app/mcp_frontdoor.py.
            - name: MCP_FRONTDOOR_CAPABILITIES
              value: {{ join "," .Values.lightspeed.frontdoorCapabilities | quote }}
{{- end }}
            {{- /* ADR-0602 clause 6 / WP-224: the JWKS defaults to the issuer's own HTTPS
                 endpoint (public Route, Let's Encrypt), never an empty string - app/auth.py
                 would take "" literally instead of its own default. */}}
            {{- $issuer := .Values.keycloakIssuer | default (printf "https://keycloak.%s/realms/zuno" .Values.clusterBaseDomain) }}
            - name: KEYCLOAK_ISSUER
              value: {{ $issuer | quote }}
            - name: KEYCLOAK_JWKS_URL
              value: {{ .Values.keycloakJwksUrl | default (printf "%s/protocol/openid-connect/certs" $issuer) | quote }}
            - name: JWT_AUDIENCE
              value: {{ .Values.jwtAudience | quote }}
            - name: JWT_AUDIENCE_REQUIRED
              value: {{ .Values.jwtAudienceRequired | quote }}
            - name: AI_GATEWAY_URL
              value: {{ .Values.aiGatewayUrl | quote }}
            - name: INTERNAL_EMAIL_DOMAINS
              value: {{ .Values.internalEmailDomains | quote }}
            # ADR-0603 M12, M13, M15 (WP-225 lot B). "{}" = no allowlist / no matcher.
            - name: EMAIL_RECIPIENT_ALLOWLIST
              value: {{ .Values.emailReport.recipientAllowlist | default dict | toJson | quote }}
            - name: METRICS_NAMESPACES_BY_GROUP
              value: {{ .Values.metricsQuery.namespacesByGroup | default dict | toJson | quote }}
            - name: MCP_MAX_BATCH_SIZE
              value: {{ .Values.jsonRpc.maxBatchSize | quote }}
            - name: MCP_GATEWAY_WORKLOAD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-gateway-workload-token
                  key: token
            {{- /* WP-225 lot C: rendered only when set, so the defaults roll no pod. */}}
            {{- if eq .Values.outboundIdentity.mode "assertion" }}
            - name: MCP_OUTBOUND_IDENTITY
              value: assertion
            - name: MCP_CALL_ASSERTION_KEY_FILE
              value: /var/run/zuno-call-assertion/private_key
            - name: MCP_CALL_ASSERTION_TTL_SECONDS
              value: {{ .Values.outboundIdentity.assertionTtlSeconds | quote }}
            {{- end }}
            {{- if .Values.agentChain.verify }}
            - name: AGENT_CHAIN_VERIFY
              value: "true"
            - name: AGENT_CHAIN_PUBLIC_KEY
              value: {{ .Values.agentChain.publicKey | quote }}
            {{- end }}
            {{- with .Values.jwtAllowedClients }}
            - name: JWT_ALLOWED_CLIENTS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
{{- if .Values.okf.fetch.enabled }}
            - name: AGENTS_DIR
              value: /okf/agents
            # ADR-0592: experience clients from the corp artifact's clients layer.
            - name: EXPERIENCE_CLIENTS_DIR
              value: /okf/experience-clients
            - name: TOOL_POLICY_PATH
              value: /okf/policies/tools/tool-policy.yaml
            # ADR-0406: the corp delegation ceiling and the delegated-write flag.
            - name: LIMITS_POLICY_PATH
              value: /okf/policies/limits/limits-policy.yaml
{{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.okf.fetch.enabled }}
            - name: okf
              mountPath: /okf
              readOnly: true
            {{- end }}
            {{- if eq .Values.outboundIdentity.mode "assertion" }}
            - name: call-assertion-key
              mountPath: /var/run/zuno-call-assertion
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq .Values.outboundIdentity.mode "assertion" }}
        - name: call-assertion-key
          secret:
            secretName: mcp-gateway-call-assertion
        {{- end }}
        {{- if .Values.okf.fetch.enabled }}
        - name: okf
          emptyDir: {}
        - name: okf-tmp
          emptyDir: {}
        {{- end }}
