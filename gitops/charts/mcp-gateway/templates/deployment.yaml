apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mcp-gateway
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-gateway
    spec:
      serviceAccountName: mcp-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KEYCLOAK_ISSUER
              value: {{ .Values.keycloakIssuer | quote }}
            - name: SALES_DB_MCP_URL
              value: {{ .Values.salesDbMcpUrl | quote }}
            - name: INTERNAL_EMAIL_DOMAINS
              value: {{ .Values.internalEmailDomains | quote }}
            - name: MCP_GATEWAY_WORKLOAD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-gateway-workload-token
                  key: token
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
