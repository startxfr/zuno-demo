# Dedicated, least-privilege service account. No RBAC binding: this service
# only calls HTTP APIs, never the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mcp-gateway
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
