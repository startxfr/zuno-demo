# Dedicated, least-privilege service account (ADR-0052). No RBAC binding:
# this service only calls HTTP APIs (Keycloak JWKS, downstream MCP
# servers/handlers), never the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mcp-gateway
    zuno.io/managed-by: argocd
