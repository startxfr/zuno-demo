# Dedicated, least-privilege service account.
#
# Historiquement sans aucun RBAC : ce service n'appelait que des API HTTP,
# jamais celle de Kubernetes. ADR-0524 introduit une exception unique et
# conditionnee - quand le front-door /mcp est actif, templates/
# rbac-tokenreview.yaml lie ce compte a system:auth-delegator pour lui
# permettre de VALIDER un token utilisateur (TokenReview), et le montage du
# token est active en consequence dans deployment.yaml. Cela n'autorise ni a
# emettre un token, ni a lire des Secrets, ni a usurper l'utilisateur valide.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mcp-gateway
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
