# project.enabled renders the dedicated Namespace, via the vendored startx
# `project` chart; operator.enabled renders the OperatorGroup/Subscription,
# via the vendored startx `operator` chart; grafana.enabled renders the
# Grafana instance (CR, oauth-proxy Route/ServiceAccount, datasources,
# dashboard). Shared by two ArgoCD Applications: operator
# (zuno-grafana-d0, project+operator) and instance (zuno-grafana-d1,
# grafana). All default false so `helm template`/`helm lint` render nothing.
#
# Package/channel confirmed against a live cluster's PackageManifest before
# this chart was written - see
# `oc get packagemanifest grafana-operator -n openshift-marketplace`.
# Unlike every other operator this repo installs (kiali-ossm, tempo-product,
# servicemeshoperator3, opentelemetry-product, cluster-observability-operator
# are all redhat-operators), no redhat-operators/certified-operators grafana
# package exists on this cluster - grafana-operator is Community Operators
# only, published directly by Grafana Labs (the upstream project itself, not
# a third party), and is the de-facto standard way to run Grafana on
# Kubernetes/OpenShift. Accepted as a deliberate, documented exception to
# the certified-operator preference rather than skipped.
project:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: grafana
    app: grafana
  project:
    enabled: true
    hooked: true  # PreSync ArgoCD hook
    type: namespace
    name: openshift-grafana-operator
    display_name: Zuno Grafana Operator
    description: "Community Grafana operator (Grafana Labs), installed by Zuno."
    requester: zuno

operator:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: grafana
    app: grafana
  subscription:
    enabled: true
    name: grafana-operator
    namespace: openshift-grafana-operator
    operator:
      # Must be set explicitly, same name as subscription.name: the vendored
      # `operator` chart defaults this to "codeready-workspaces", silently
      # suppressing the fallback to subscription.name.
      name: grafana-operator
      channel: v5
      installPlanApproval: Automatic  # startx chart defaults to Manual
      source:
        name: community-operators
        namespace: openshift-marketplace
  operatorGroup:
    enabled: true
    name: grafana-operator-group
    namespace: openshift-grafana-operator
    target: "all-ns"  # matches the original hand-authored spec: {}

grafana:
  enabled: false

monitoringNamespace: zuno-monitoring

# ADR-0517: builds the Jaeger UI trace-link URLs in
# templates/dashboard-run-trace.yaml - same hardcoded-per-chart convention
# gitops/charts/kiali/values.yaml and gitops/charts/tempo/values.yaml
# already use for their own Route hosts, rather than a shared/global value.
appsDomain: apps.demo222.startx.fr

# Backs spec.persistentVolumeClaim in templates/grafana.yaml - without this,
# Grafana's SQLite state (datasources, dashboards, admin user) lives in the
# operator's default emptyDir and is wiped on every pod restart, forcing
# grafana-operator to re-provision every GrafanaDatasource/GrafanaDashboard
# from scratch. gp3-csi is this cluster's default StorageClass, named
# explicitly per this repo's convention
# (gitops/charts/mariadb/values.yaml's own storageClassName).
storage:
  size: 2Gi
  storageClassName: gp3-csi

# Runtime-discovered (ADR-0048 gitops_app_extra_helm_values), not
# hand-edited into this checked-in file: the Prometheus GrafanaDatasource's
# "Authorization: Bearer <token>" value, resolved by
# ansible/roles/grafana/tasks/install.yml once
# serviceaccount-prometheus-reader.yaml's token Secret is minted. Templated
# in directly (not via GrafanaDatasource spec.valuesFrom/secretKeyRef):
# grafana-operator v5.24.0's valuesFrom resolves into
# spec.datasource.secureJsonData's map correctly per its own status
# (ApplySuccessful, fresh hash), but the resolved value never reaches
# Grafana's API (secureJsonFields stayed empty even after a full
# delete+recreate); a statically-inlined secureJsonData value in the same
# spot works immediately. datasource-prometheus.yaml only renders once
# this is non-empty (same two-phase pattern nvidia_gpu's ClusterPolicy
# discovery uses), so the datasource is never created half-configured.
prometheusReaderBearer: ""
