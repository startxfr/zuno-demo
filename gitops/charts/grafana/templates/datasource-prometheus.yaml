{{- if and .Values.grafana.enabled .Values.prometheusReaderBearer }}
# ADR-0029's model-usage metrics: zuno.model_calls/zuno.model_tokens/
# zuno.model_cost_usd (components/ai-gateway/app/telemetry.py) and
# zuno_bff_requests_total (components/agent-bff), scraped by prometheus-k8s
# via gitops/charts/observability's ServiceMonitor (see docs/platform/slo.md).
# Queried through thanos-querier in-cluster (not its external Route, for
# the same 100%-in-cluster style
# every other datasource in this repo uses), Bearer-authenticated with the
# grafana-prometheus-reader ServiceAccount's cluster-monitoring-view token
# (serviceaccount-prometheus-reader.yaml).
#
# secureJsonData.httpHeaderValue1 is templated in directly from
# .Values.prometheusReaderBearer (see values.yaml's own comment) rather
# than via spec.valuesFrom/secretKeyRef: valuesFrom does not actually
# deliver its resolved value into Grafana for this nested secureJsonData
# path on grafana-operator v5.24.0, while an inline value in the same spot
# works immediately. Only rendered once that
# value is known (two-phase apply, same pattern nvidia_gpu's ClusterPolicy
# discovery uses) so this datasource is never created half-configured.
#
# tlsSkipVerify: true is a documented demo-scope shortcut, same as
# gitops/charts/tempo's `tls.insecure: true` - thanos-querier's serving
# cert chains to the cluster's service-ca, wiring that CA bundle in is a
# fair follow-up, not done here.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  uid: prometheus
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  datasource:
    name: Prometheus
    type: prometheus
    access: proxy
    url: "https://thanos-querier.openshift-monitoring.svc.cluster.local:9091"
    isDefault: true
    jsonData:
      httpHeaderName1: "Authorization"
      tlsSkipVerify: true
      timeInterval: "30s"
    secureJsonData:
      httpHeaderValue1: {{ .Values.prometheusReaderBearer | quote }}
{{- end }}
