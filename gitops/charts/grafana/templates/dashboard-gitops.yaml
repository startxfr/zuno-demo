{{- if .Values.grafana.enabled }}
# ADR-0413, split 2026-09-01 out of dashboard-infra-data.yaml into its own
# dashboard: ArgoCD sync/health (argocd_app_info - already queryable, no
# scrape change needed) plus two new panels for the openshift-gitops
# control-plane's own resource footprint, adapted from dashboard-infra-
# data.yaml's cluster-wide "Deployment availability" and "CPU usage by
# namespace" panels but hardcoded to namespace="openshift-gitops" (this
# dashboard carries no $namespace variable - it's single-namespace by
# design, unlike the infra dashboard).
#
# Layout reworked 2026-09-02 into collapsible rows (same treatment as
# dashboard-data.yaml, exported from Grafana's UI and converted to its
# "Dashboard v2" schema by Grafana's own v2beta1 API - see dashboard-
# data.yaml's header for why that's safe against this cluster's
# grafana-operator v5.24.0 / Grafana 13.0.1). Row grouping and panel
# content otherwise unchanged from the classic-schema version.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: gitops
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "26"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  uid: zuno-gitops
  folder: "Zuno Platform"
  json: |
    {
      "annotations": [
        {
          "kind": "AnnotationQuery",
          "spec": {
            "query": {
              "kind": "DataQuery",
              "group": "grafana",
              "version": "v0",
              "datasource": {
                "name": "-- Grafana --"
              },
              "spec": {}
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "builtIn": true,
            "legacyOptions": {
              "type": "dashboard"
            }
          }
        }
      ],
      "cursorSync": "Off",
      "description": "ADR-0413, split 2026-09-01 from dashboard-infra-data.yaml: ArgoCD application sync/health status and the openshift-gitops control-plane's own resource footprint.",
      "editable": true,
      "elements": {
        "panel-1": {
          "kind": "Panel",
          "spec": {
            "id": 1,
            "title": "ArgoCD application sync/health status",
            "description": "",
            "links": [],
            "data": {
              "kind": "QueryGroup",
              "spec": {
                "queries": [
                  {
                    "kind": "PanelQuery",
                    "spec": {
                      "query": {
                        "kind": "DataQuery",
                        "group": "prometheus",
                        "version": "v0",
                        "datasource": {
                          "name": "prometheus"
                        },
                        "spec": {
                          "expr": "sum by (name, sync_status, health_status) (argocd_app_info{namespace=\"openshift-gitops\"})",
                          "format": "table",
                          "instant": true
                        }
                      },
                      "refId": "A",
                      "hidden": false
                    }
                  }
                ],
                "transformations": [],
                "queryOptions": {}
              }
            },
            "vizConfig": {
              "kind": "VizConfig",
              "group": "table",
              "version": "",
              "spec": {
                "options": {},
                "fieldConfig": {
                  "defaults": {},
                  "overrides": []
                }
              }
            }
          }
        },
        "panel-2": {
          "kind": "Panel",
          "spec": {
            "id": 2,
            "title": "ArgoCD apps out of sync",
            "description": "",
            "links": [],
            "data": {
              "kind": "QueryGroup",
              "spec": {
                "queries": [
                  {
                    "kind": "PanelQuery",
                    "spec": {
                      "query": {
                        "kind": "DataQuery",
                        "group": "prometheus",
                        "version": "v0",
                        "datasource": {
                          "name": "prometheus"
                        },
                        "spec": {
                          "expr": "count(argocd_app_info{namespace=\"openshift-gitops\", sync_status!=\"Synced\"}) or vector(0)"
                        }
                      },
                      "refId": "A",
                      "hidden": false
                    }
                  }
                ],
                "transformations": [],
                "queryOptions": {}
              }
            },
            "vizConfig": {
              "kind": "VizConfig",
              "group": "stat",
              "version": "",
              "spec": {
                "options": {},
                "fieldConfig": {
                  "defaults": {
                    "unit": "short",
                    "thresholds": {
                      "mode": "",
                      "steps": [
                        {
                          "value": null,
                          "color": "green"
                        },
                        {
                          "value": 1,
                          "color": "orange"
                        }
                      ]
                    }
                  },
                  "overrides": []
                }
              }
            }
          }
        },
        "panel-3": {
          "kind": "Panel",
          "spec": {
            "id": 3,
            "title": "ArgoCD Deployment availability",
            "description": "dashboard-infra-data.yaml's \"Deployment availability\" panel, scoped to namespace=openshift-gitops.",
            "links": [],
            "data": {
              "kind": "QueryGroup",
              "spec": {
                "queries": [
                  {
                    "kind": "PanelQuery",
                    "spec": {
                      "query": {
                        "kind": "DataQuery",
                        "group": "prometheus",
                        "version": "v0",
                        "datasource": {
                          "name": "prometheus"
                        },
                        "spec": {
                          "expr": "kube_deployment_status_replicas_available{namespace=\"openshift-gitops\"} / kube_deployment_spec_replicas{namespace=\"openshift-gitops\"}",
                          "legendFormat": "{{`{{deployment}}`}}"
                        }
                      },
                      "refId": "A",
                      "hidden": false
                    }
                  }
                ],
                "transformations": [],
                "queryOptions": {}
              }
            },
            "vizConfig": {
              "kind": "VizConfig",
              "group": "timeseries",
              "version": "",
              "spec": {
                "options": {},
                "fieldConfig": {
                  "defaults": {
                    "unit": "percentunit",
                    "min": 0,
                    "max": 1
                  },
                  "overrides": []
                }
              }
            }
          }
        },
        "panel-4": {
          "kind": "Panel",
          "spec": {
            "id": 4,
            "title": "ArgoCD CPU usage",
            "description": "dashboard-infra-data.yaml's \"CPU usage by namespace\" panel, scoped to namespace=openshift-gitops.",
            "links": [],
            "data": {
              "kind": "QueryGroup",
              "spec": {
                "queries": [
                  {
                    "kind": "PanelQuery",
                    "spec": {
                      "query": {
                        "kind": "DataQuery",
                        "group": "prometheus",
                        "version": "v0",
                        "datasource": {
                          "name": "prometheus"
                        },
                        "spec": {
                          "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{namespace=\"openshift-gitops\"}[5m]))",
                          "legendFormat": "{{`{{namespace}}`}}"
                        }
                      },
                      "refId": "A",
                      "hidden": false
                    }
                  }
                ],
                "transformations": [],
                "queryOptions": {}
              }
            },
            "vizConfig": {
              "kind": "VizConfig",
              "group": "timeseries",
              "version": "",
              "spec": {
                "options": {},
                "fieldConfig": {
                  "defaults": {},
                  "overrides": []
                }
              }
            }
          }
        }
      },
      "layout": {
        "kind": "RowsLayout",
        "spec": {
          "rows": [
            {
              "kind": "RowsLayoutRow",
              "spec": {
                "collapse": false,
                "layout": {
                  "kind": "AutoGridLayout",
                  "spec": {
                    "columnWidthMode": "standard",
                    "items": [
                      {
                        "kind": "AutoGridLayoutItem",
                        "spec": {
                          "element": {
                            "kind": "ElementReference",
                            "name": "panel-1"
                          }
                        }
                      },
                      {
                        "kind": "AutoGridLayoutItem",
                        "spec": {
                          "element": {
                            "kind": "ElementReference",
                            "name": "panel-2"
                          }
                        }
                      }
                    ],
                    "maxColumnCount": 2,
                    "rowHeightMode": "standard"
                  }
                },
                "title": "Sync health"
              }
            },
            {
              "kind": "RowsLayoutRow",
              "spec": {
                "collapse": true,
                "layout": {
                  "kind": "AutoGridLayout",
                  "spec": {
                    "columnWidthMode": "standard",
                    "items": [
                      {
                        "kind": "AutoGridLayoutItem",
                        "spec": {
                          "element": {
                            "kind": "ElementReference",
                            "name": "panel-3"
                          }
                        }
                      },
                      {
                        "kind": "AutoGridLayoutItem",
                        "spec": {
                          "element": {
                            "kind": "ElementReference",
                            "name": "panel-4"
                          }
                        }
                      }
                    ],
                    "maxColumnCount": 2,
                    "rowHeightMode": "standard"
                  }
                },
                "title": "Control plane"
              }
            }
          ]
        }
      },
      "links": [
        {
          "title": "Zuno dashboards",
          "type": "dashboards",
          "icon": "",
          "tooltip": "",
          "tags": [
            "zuno"
          ],
          "asDropdown": true,
          "targetBlank": false,
          "includeVars": false,
          "keepTime": true
        }
      ],
      "liveNow": false,
      "preload": false,
      "tags": [
        "zuno",
        "gitops",
        "argocd"
      ],
      "timeSettings": {
        "timezone": "browser",
        "from": "now-6h",
        "to": "now",
        "autoRefresh": "30s",
        "autoRefreshIntervals": [
          "5s",
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "30m",
          "1h",
          "2h",
          "1d"
        ],
        "hideTimepicker": false,
        "fiscalYearStartMonth": 0
      },
      "title": "GitOps",
      "variables": []
    }
{{- end }}
