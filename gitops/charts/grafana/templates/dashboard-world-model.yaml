{{- if .Values.grafana.enabled }}
# ADR-0604 (WP-236): the world-model demonstration dashboard. The runtime exports zuno_world_* (engine step, frames,
# image model, prompt apply), the web tier zuno_world_web_* (worlds, prompts, refusals, leases) and the two
# browser-measured series (zuno_world_displayed_fps, zuno_world_action_to_display_seconds); DCGM and the machine-api
# metrics come from the platform. Nothing here labels a session, a user or a prompt. Empty while the demo is off.
# Generated once from a script, then edited by hand; the classic row schema, as dashboard-three-experiences.yaml.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: world-model
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "26"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  uid: zuno-world-model
  folder: "Zuno Platform"
  json: |
    {
      "uid": "zuno-world-model",
      "title": "World model",
      "description": "ADR-0604/WP-236: the interactive generative world-model demo. The on-demand GPU node, what the engine and the image model cost, what the browser actually measured, and the limits that were applied. Empty while the demo is off.",
      "tags": [
        "zuno",
        "world-model",
        "gpu"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "10s",
      "links": [],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 2,
          "type": "row",
          "title": "The GPU node (on demand, billed by the hour)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "GPU utilization (%)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "DCGM, filtered on the world-model namespace: the whole RTX PRO 6000 (no MIG). Empty while the demo is off.",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "avg by (modelName) (DCGM_FI_DEV_GPU_UTIL{exported_namespace=\"zuno-world-model\"})",
              "legendFormat": "{{`{{modelName}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "VRAM used (GB)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Waypoint-1.5 and FLUX.2 klein resident together: the smoke test (WP-232) measures the peak.",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "avg(DCGM_FI_DEV_FB_USED{exported_namespace=\"zuno-world-model\"}) / 1024",
              "legendFormat": "used",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "decgbytes"
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "GPU node up for (hours)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "The node exists only while zuno_world_model_enabled is on. The cost alert fires at 8 h (ZunoWorldModelGpuNodeUpTooLong).",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max((time() - mapi_machine_created_timestamp_seconds{name=~\"zuno-gpu-world-model-a-.*\"}) / 3600)",
              "legendFormat": "hours",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "h",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 4
                  },
                  {
                    "color": "red",
                    "value": 8
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 6,
          "type": "row",
          "title": "The world, as the GPU sees it",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "panels": []
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Engine step (4 frames), p50 / p95",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "One Waypoint generation step. 4 frames per step: 66 ms is 60 frames per second. Measured on this GPU, not a vendor figure.",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(zuno_world_engine_step_seconds_bucket[2m])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(zuno_world_engine_step_seconds_bucket[2m])))",
              "legendFormat": "p95",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Frames generated per second",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Generated by the engine, and frames dropped before the browser (backpressure: a slow browser restarts from a keyframe).",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(zuno_world_frame_generated_total[1m]))",
              "legendFormat": "generated",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (reason) (rate(zuno_world_frames_dropped_total[1m]))",
              "legendFormat": "dropped: {{`{{reason}}`}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Image model: first image and world edit, p50",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "FLUX.2 klein 4B. An edit is what a mid-session prompt costs; the target is 1 to 2 seconds.",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (le, kind) (rate(zuno_world_image_seconds_bucket[10m])))",
              "legendFormat": "{{`{{kind}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Prompt change: request to spliced frame, p50 / p95",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Server side: FLUX edit plus the append_frame splice. The browser-visible effect also needs the next keyframe.",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(zuno_world_prompt_apply_seconds_bucket[10m])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(zuno_world_prompt_apply_seconds_bucket[10m])))",
              "legendFormat": "p95",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 11,
          "type": "stat",
          "title": "Streaming sessions now",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "The runtime serves at most one world: the second visitor is told busy.",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 16
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(zuno_world_active_sessions)",
              "legendFormat": "runtime",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(zuno_world_web_sessions_active)",
              "legendFormat": "lease",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 12,
          "type": "table",
          "title": "Engine, image model, encoder in use",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "What is really running: waypoint or mock, flux2 or mock, nvenc or x264, and the precision.",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 16
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (engine, image, precision) (zuno_world_engine_info)",
              "legendFormat": "",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (encoder) (zuno_world_encoder_info)",
              "legendFormat": "",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true
          },
          "transformations": [
            {
              "id": "merge",
              "options": {}
            }
          ]
        },
        {
          "id": 13,
          "type": "row",
          "title": "What the browser measured (ADR-0604 section 9.1)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 23
          },
          "panels": []
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Input to display, p50 / p95",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "From a key press to the first frame that reflects it, measured in the browser with the control sequence carried by every frame. Target: p95 under 250 ms.",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(zuno_world_action_to_display_seconds_bucket[5m])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(zuno_world_action_to_display_seconds_bucket[5m])))",
              "legendFormat": "p95",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.25
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Displayed frames per second, p50 / p10",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Frames the browser decoded and drew, not frames the GPU produced. Target: at least 24 at 720p.",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(zuno_world_displayed_fps_bucket[5m])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.1, sum by (le) (rate(zuno_world_displayed_fps_bucket[5m])))",
              "legendFormat": "p10",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "id": 16,
          "type": "row",
          "title": "Who may do what",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 31
          },
          "panels": []
        },
        {
          "id": 17,
          "type": "timeseries",
          "title": "Worlds started, by source and result",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "created, busy, quota, runtime_error, runtime_not_ready, and refused_* (a prompt refused before taking the lease).",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 32
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (source, result) (increase(zuno_world_web_worlds_total[$__rate_interval]))",
              "legendFormat": "{{`{{source}}`}}: {{`{{result}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "id": 18,
          "type": "timeseries",
          "title": "Prompts, by kind and verdict",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "accepted_enhanced (ai-gateway rewrote it), accepted_filter_only (the gateway was off or down), refused_deny_list, refused_by_model, refused_too_long.",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 32
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (kind, result) (increase(zuno_world_web_prompts_total[$__rate_interval]))",
              "legendFormat": "{{`{{kind}}`}}: {{`{{result}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "id": 19,
          "type": "timeseries",
          "title": "Refusals: busy, quota, identity",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "A second visitor is refused, never queued behind the GPU. Identity failures: no token, bad token, not in an allowed group, bad Origin.",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 32
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(zuno_world_web_busy_rejected_total[$__rate_interval]))",
              "legendFormat": "GPU busy",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (limit) (increase(zuno_world_web_quota_rejected_total[$__rate_interval]))",
              "legendFormat": "quota: {{`{{limit}}`}}",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (reason) (increase(zuno_world_web_auth_failures_total[$__rate_interval]))",
              "legendFormat": "identity: {{`{{reason}}`}}",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "id": 20,
          "type": "timeseries",
          "title": "How sessions end",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "released, idle, detached (the tab closed: the GPU is freed after 60 s), max_duration, released_by_ops; and the runtime's stream end reasons.",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 39
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (reason) (increase(zuno_world_web_session_ended_total[$__rate_interval]))",
              "legendFormat": "{{`{{reason}}`}}",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (reason) (increase(zuno_world_stream_disconnect_total[$__rate_interval]))",
              "legendFormat": "stream: {{`{{reason}}`}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "id": 21,
          "type": "timeseries",
          "title": "Prompt enhancement through the ai-gateway, p95",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "applied, refused, or unavailable (the demo degrades to the filtered prompt). Timeout 8 s.",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 39
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, result) (rate(zuno_world_web_enhance_seconds_bucket[10m])))",
              "legendFormat": "{{`{{result}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        }
      ]
    }
{{- end }}
