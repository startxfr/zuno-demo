                  "tableType": "traces",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 6,
              "title": "MCP trace (mcp-gateway)",
              "type": "table",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "fieldConfig": {
                "overrides": [
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "traceService"
                    },
                    "properties": [
                      {
                        "id": "custom.hidden",
                        "value": true
                      }
                    ]
                  },
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "traceID"
                    },
                    "properties": [
                      {
                        "id": "links",
                        "value": [
                          {
                            "title": "Open trace in Jaeger",
                            "url": "https://tempo-jaegerui-zuno-monitoring.{{ .Values.appsDomain }}/trace/${__value.raw}",
                            "targetBlank": true
                          }
                        ]
                      }
                    ]
                  }
                ]
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 8
              },
              "targets": [
                {
                  "datasource": {
                    "type": "tempo",
                    "uid": "tempo"
                  },
                  "queryType": "traceql",
                  "query": "{name=\"tool_invoke\" && span.zuno.run_id=\"$run_id\"}",
                  "limit": 20,
                  "tableType": "traces",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 7,
              "title": "RAG trace (rag-service)",
              "type": "table",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "fieldConfig": {
                "overrides": [
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "traceService"
                    },
                    "properties": [
                      {
                        "id": "custom.hidden",
                        "value": true
                      }
                    ]
                  },
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "traceID"
                    },
                    "properties": [
                      {
                        "id": "links",
                        "value": [
                          {
                            "title": "Open trace in Jaeger",
                            "url": "https://tempo-jaegerui-zuno-monitoring.{{ .Values.appsDomain }}/trace/${__value.raw}",
                            "targetBlank": true
                          }
                        ]
                      }
                    ]
                  }
                ]
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 8
              },
              "targets": [
                {
                  "datasource": {
                    "type": "tempo",
                    "uid": "tempo"
                  },
                  "queryType": "traceql",
                  "query": "{name=\"rag_search\" && span.zuno.run_id=\"$run_id\"}",
                  "limit": 20,
                  "tableType": "traces",
                  "refId": "A"
                }
              ]
            }
          ]
        },
        {
          "id": 1023,
          "type": "row",
          "title": "Model calls & cost",
          "collapsed": true,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "panels": [
            {
              "id": 8,
              "title": "Model calls (all - provider/model/duration)",
              "type": "bargauge",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "description": "One bar per model call this run (reduceOptions.values:true - \"Calculate\" mode would collapse every call into a single lastNotNull bar per field instead). Bar label defaults to whichever field Grafana picks first (likely provider) - adjust in the UI if needed. See Model calls - local/distant below for cost.",
              "gridPos": {
                "h": 8,
                "w": 24,
                "x": 0,
                "y": 0
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "ms"
                },
                "overrides": []
              },
              "options": {
                "displayMode": "gradient",
                "orientation": "horizontal",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "values": true
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "tempo",
                    "uid": "tempo"
                  },
                  "queryType": "traceql",
                  "query": "{name=\"model_call\" && span.zuno.run_id=\"$run_id\"} | select(span.zuno.provider, span.zuno.model)",
                  "limit": 20,
                  "tableType": "traces",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 9,
              "title": "Cost per call - local (self-hosted)",
              "type": "bargauge",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "description": "reduceOptions.fields pins this to the estimated_cost_usd field - without it, the built-in Duration column (also numeric, present on every trace search result) would draw its own bar under the currencyUSD unit.",
              "gridPos": {
                "h": 8,
                "w": 9,
                "x": 0,
                "y": 8
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "currencyUSD"
                },
                "overrides": []
              },
              "options": {
                "displayMode": "gradient",
                "orientation": "horizontal",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "values": true,
                  "fields": "/^zuno\\.estimated_cost_usd$/"
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "tempo",
                    "uid": "tempo"
                  },
                  "queryType": "traceql",
                  "query": "{name=\"model_call\" && span.zuno.run_id=\"$run_id\" && span.zuno.model_kind=\"local\"} | select(span.zuno.estimated_cost_usd, span.zuno.model)",
                  "limit": 20,
                  "tableType": "traces",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 10,
              "title": "Total cost - local",
              "type": "stat",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "gridPos": {
                "h": 8,
                "w": 3,
                "x": 9,
                "y": 8
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "currencyUSD"
                },
                "overrides": []
              },
              "transformations": [
                {
                  "id": "filterFieldsByName",
                  "options": {
                    "include": {
                      "names": [
                        "zuno.estimated_cost_usd"
                      ]
                    }
                  }
                },
                {
                  "id": "reduce",
                  "options": {
                    "reducers": [
                      "sum"
                    ]
                  }
                }
              ],
              "targets": [
                {
                  "datasource": {
                    "type": "tempo",
                    "uid": "tempo"
                  },
                  "queryType": "traceql",
                  "query": "{name=\"model_call\" && span.zuno.run_id=\"$run_id\" && span.zuno.model_kind=\"local\"} | select(span.zuno.estimated_cost_usd)",
                  "limit": 20,
                  "tableType": "traces",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 11,
              "title": "Cost per call - distant (SaaS)",
              "type": "bargauge",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "description": "reduceOptions.fields pins this to the estimated_cost_usd field - without it, the built-in Duration column (also numeric, present on every trace search result) would draw its own bar under the currencyUSD unit.",
              "gridPos": {
                "h": 8,
                "w": 9,
                "x": 12,
                "y": 8
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "currencyUSD"
                },
                "overrides": []
              },
