                    "kind": "reduce",
                    "spec": {
                      "id": "reduce",
                      "options": {
                        "reducers": [
                          "sum"
                        ]
                      }
                    }
                  }
                ],
                "queryOptions": {}
              }
            },
            "vizConfig": {
              "kind": "VizConfig",
              "group": "stat",
              "version": "",
              "spec": {
                "options": {},
                "fieldConfig": {
                  "defaults": {
                    "unit": "currencyUSD"
                  },
                  "overrides": []
