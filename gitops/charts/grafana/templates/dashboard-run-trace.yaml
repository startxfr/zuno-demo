{{- if .Values.grafana.enabled }}
# ADR-0517: per-run drill-down - pick an agent, paste a run_id, see every
# MCP tool call / RAG search / model call / BFF hop / API-layer hop that
# run made, with cost/tokens/latency/outcome. Tempo-only by design (plus
# one Prometheus sanity stat) - Prometheus can't filter by run_id
# (unbounded cardinality), so every drill-down panel is a TraceQL query
# against zuno.run_id, the span attribute every service now stamps
# (agent-runtime's api_request/agent_graph_run, mcp-gateway's tool_invoke,
# rag-service's rag_search, ai-gateway's model_call, agent-bff's
# bff_request).
#
# Panels needing a span attribute beyond Tempo's fixed search-result
# columns (Trace ID/Start time/Service/Name/Duration) use TraceQL's
# `select()` to project it as a real field (e.g. `| select(span.zuno.
# estimated_cost_usd)`) - the resulting field name DROPS the `span.`/
# `resource.` scope prefix (that's TraceQL query syntax, not part of the
# attribute key itself): `select(span.zuno.estimated_cost_usd)` yields a
# field literally named `zuno.estimated_cost_usd`. Verified live
# 2026-09-01 by querying Tempo's /api/search directly - every
# filterFieldsByName/calculateField/groupBy transformation below matches
# on the bare `zuno.*` name, never `span.zuno.*` (only the TraceQL
# `query` strings themselves keep the `span.` scope prefix). Trace/span
# links point at this platform's own
# Jaeger UI (exposed read-only behind the Tempo operator's built-in
# oauth-proxy, see gitops/charts/tempo/templates/tempomonolithic.yaml),
# not Grafana's own Explore - Jaeger UI's `/trace/<id>` works uniformly
# regardless of which service emitted the span, unlike Kiali's
# namespace+workload-scoped tracing tab.
#
# Layout reworked 2026-09-02 into rows using the CLASSIC schema's native
# "row" panel type (type: row, collapsed: true/false), NOT Grafana's v2
# schema - a first attempt at row-grouping via the v2 "Dashboard" schema
# (elements/layout/vizConfig) broke every one of these dashboards'
# GitOps sync: grafana-operator v5.24.0 posts spec.json to the classic
# /api/dashboards/db endpoint, which rejects a v2-format body outright,
# and even a correctly-wrapped v2 body ({"apiVersion":...,"kind":
# "Dashboard","spec":{...}}) still gets rejected for any dashboard that
# already exists ("must not include an id on the root element" - the
# operator injects the dashboard's known internal id on every update).
# That whole attempt was reverted (see git history). The classic "row"
# panel type below was live-verified against this same endpoint first
# (a throwaway probe dashboard, both an expanded and a collapsed row)
# before being applied here - no known incompatibility with this
# operator version.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: run-trace
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "26"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  uid: zuno-run-trace
  folder: "Zuno Platform"
  json: |
    {
      "uid": "zuno-run-trace",
      "title": "Run Trace (per-run drill-down)",
      "description": "ADR-0517: select an agent, paste a run_id, see every MCP/RAG/model/BFF/API hop that run consumed - cost, tokens, latency, outcomes.",
      "tags": [
        "zuno",
        "agents",
        "mcp",
        "rag",
        "tracing"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "",
      "links": [
        {
          "type": "dashboards",
          "tags": [
            "zuno"
          ],
          "asDropdown": true,
          "keepTime": true,
          "title": "Zuno dashboards"
        }
      ],
      "templating": {
        "list": [
          {
            "current": {
              "text": "",
              "value": ""
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(zuno_bff_requests_total, agent)",
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "agent",
            "options": [],
            "query": "label_values(zuno_bff_requests_total, agent)",
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "type": "query"
          },
          {
            "current": {
              "text": "",
              "value": ""
            },
            "hide": 0,
            "name": "run_id",
            "options": [],
            "query": "",
            "type": "textbox",
            "description": "Paste a run_id (from the chat UI or database) - not a lookup, this dashboard does not list run_ids for you."
          }
        ]
      },
      "panels": [
        {
          "id": 1021,
          "type": "row",
          "title": "Overview",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 1,
          "title": "Traffic sanity for $agent (is this dashboard/pipeline alive?)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "If every panel below is empty, check here first: no traffic at all for $agent means Tempo/the collector may be down or retention expired, not necessarily a wrong run_id.",
          "gridPos": {
            "h": 4,
            "w": 24,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(zuno_bff_requests_total{agent=~\"$agent\"}[5m]))"
            }
          ]
        },
        {
          "id": 3,
          "title": "Span timeline",
          "type": "timeseries",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "description": "Every span this run made, grouped/colored by originating service, plotted by actual start time (points mode) - shows chronological ordering across hops.",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "drawStyle": "points",
                "pointSize": 8,
                "axisLabel": "Duration (ms)",
                "showPoints": "always"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "transformations": [
            {
              "id": "partitionByValues",
              "options": {
                "fields": [
                  "traceService"
                ],
                "keepFields": false,
                "naming": {
                  "asLabels": true
                }
              }
            }
          ],
          "targets": [
            {
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "queryType": "traceql",
              "query": "{span.zuno.run_id=\"$run_id\"}",
              "limit": 50,
              "tableType": "traces",
              "refId": "A"
            }
          ]
        },
        {
          "id": 1022,
          "type": "row",
          "title": "Traces by service",
          "collapsed": true,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 15
          },
          "panels": [
            {
              "id": 4,
              "title": "BFF Traces (agent-bff)",
              "type": "table",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "fieldConfig": {
                "overrides": [
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "traceService"
                    },
                    "properties": [
                      {
                        "id": "custom.hidden",
                        "value": true
                      }
                    ]
                  },
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "traceID"
                    },
                    "properties": [
                      {
                        "id": "links",
                        "value": [
                          {
                            "title": "Open trace in Jaeger",
                            "url": "https://tempo-jaegerui-zuno-monitoring.{{ .Values.appsDomain }}/trace/${__value.raw}",
                            "targetBlank": true
                          }
                        ]
                      }
                    ]
                  }
                ]
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 0
              },
              "targets": [
                {
                  "datasource": {
                    "type": "tempo",
                    "uid": "tempo"
                  },
                  "queryType": "traceql",
                  "query": "{name=\"bff_request\" && span.zuno.run_id=\"$run_id\"}",
                  "limit": 20,
                  "tableType": "traces",
                  "refId": "A"
                }
              ]
            },
