            "data": {
              "kind": "QueryGroup",
              "spec": {
                "queries": [
                  {
                    "kind": "PanelQuery",
                    "spec": {
                      "query": {
                        "kind": "DataQuery",
                        "group": "tempo",
                        "version": "v0",
                        "datasource": {
                          "name": "tempo"
                        },
                        "spec": {
                          "limit": 20,
                          "query": "{name=\"model_call\" && span.zuno.run_id=\"$run_id\" && span.zuno.model_kind=\"saas\"} | select(span.zuno.estimated_cost_usd, span.zuno.model)",
                          "queryType": "traceql",
                          "tableType": "traces"
                        }
                      },
                      "refId": "A",
                      "hidden": false
                    }
                  }
                ],
                "transformations": [],
                "queryOptions": {}
              }
            },
            "vizConfig": {
              "kind": "VizConfig",
              "group": "bargauge",
              "version": "",
              "spec": {
                "options": {
                  "displayMode": "gradient",
                  "orientation": "horizontal",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ],
                    "fields": "/^zuno\\.estimated_cost_usd$/",
                    "values": true
                  }
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "currencyUSD"
                  },
                  "overrides": []
                }
              }
            }
          }
        },
        "panel-12": {
          "kind": "Panel",
          "spec": {
            "id": 12,
            "title": "Total cost - distant",
            "description": "",
            "links": [],
            "data": {
              "kind": "QueryGroup",
              "spec": {
                "queries": [
                  {
                    "kind": "PanelQuery",
                    "spec": {
                      "query": {
                        "kind": "DataQuery",
                        "group": "tempo",
                        "version": "v0",
                        "datasource": {
                          "name": "tempo"
                        },
                        "spec": {
                          "limit": 20,
                          "query": "{name=\"model_call\" && span.zuno.run_id=\"$run_id\" && span.zuno.model_kind=\"saas\"} | select(span.zuno.estimated_cost_usd)",
                          "queryType": "traceql",
                          "tableType": "traces"
                        }
                      },
                      "refId": "A",
                      "hidden": false
                    }
                  }
                ],
                "transformations": [
                  {
                    "kind": "filterFieldsByName",
                    "spec": {
                      "id": "filterFieldsByName",
                      "options": {
                        "include": {
                          "names": [
                            "zuno.estimated_cost_usd"
                          ]
                        }
                      }
                    }
                  },
