        "panel-13": {
          "kind": "Panel",
          "spec": {
            "id": 13,
            "title": "Errors this run (span status=error)",
            "description": "Kept as a table (unlike the panels above) since matches can come from any service - the Service column stays so you can tell which one.",
            "links": [],
            "data": {
