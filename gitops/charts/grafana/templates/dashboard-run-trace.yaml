                "overrides": [
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "traceService"
                    },
                    "properties": [
                      {
                        "id": "custom.hidden",
                        "value": true
                      }
                    ]
                  },
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "traceID"
                    },
                    "properties": [
                      {
                        "id": "links",
                        "value": [
                          {
                            "title": "Open trace in Jaeger",
                            "url": "https://tempo-jaegerui-zuno-monitoring.{{ .Values.appsDomain }}/trace/${__value.raw}",
                            "targetBlank": true
                          }
                        ]
                      }
                    ]
                  }
                ]
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 0
              },
              "targets": [
                {
                  "datasource": {
