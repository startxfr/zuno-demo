                    "kind": "PanelQuery",
                    "spec": {
                      "query": {
                        "kind": "DataQuery",
                        "group": "prometheus",
                        "version": "v0",
                        "datasource": {
                          "name": "mesh-prometheus"
                        },
                        "spec": {
                          "expr": "sum by (source_workload, destination_workload) (rate(istio_tcp_received_bytes_total{source_workload=~\"$source_workload\"}[5m]))",
                          "legendFormat": "{{`{{source_workload}}`}} -> {{`{{destination_workload}}`}} (received)"
                        }
                      },
                      "refId": "B",
                      "hidden": false
                    }
                  }
                ],
                "transformations": [],
