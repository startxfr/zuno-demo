                  {
                    "kind": "PanelQuery",
                    "spec": {
                      "query": {
                        "kind": "DataQuery",
                        "group": "prometheus",
                        "version": "v0",
                        "datasource": {
                          "name": "prometheus"
                        },
                        "spec": {
                          "expr": "datastore_partitioned",
                          "legendFormat": "datastore_partitioned"
                        }
                      },
                      "refId": "B",
                      "hidden": false
                    }
                  }
                ],
                "transformations": [],
                "queryOptions": {}
              }
            },
            "vizConfig": {
              "kind": "VizConfig",
              "group": "stat",
              "version": "",
              "spec": {
                "options": {},
                "fieldConfig": {
                  "defaults": {},
                  "overrides": []
                }
              }
            }
          }
        },
        "panel-12": {
          "kind": "Panel",
          "spec": {
            "id": 12,
            "title": "Why is this empty?",
            "description": "",
            "links": [],
            "data": {
              "kind": "QueryGroup",
              "spec": {
                "queries": [],
                "transformations": [],
                "queryOptions": {}
              }
            },
            "vizConfig": {
              "kind": "VizConfig",
              "group": "text",
              "version": "",
              "spec": {
                "options": {
                  "content": "Panels 8-11 are empty by design: Authorino needs real traffic past the `maas-gateway-auth` AuthPolicy, blocked by ADR-0201's mTLS gap; Limitador needs a RateLimitPolicy (none attached). Both populate automatically once those close.",
                  "mode": "markdown"
                },
                "fieldConfig": {
                  "defaults": {},
                  "overrides": []
                }
              }
            }
          }
        },
        "panel-13": {
          "kind": "Panel",
          "spec": {
            "id": 13,
            "title": "Traces: mesh errors",
            "description": "Istio mesh spans are exported at 100% sampling (gitops/charts/service-mesh's telemetry.yaml) - recent error traces across every meshed service, not scoped to one span name.",
            "links": [],
            "data": {
              "kind": "QueryGroup",
              "spec": {
                "queries": [
                  {
                    "kind": "PanelQuery",
                    "spec": {
                      "query": {
                        "kind": "DataQuery",
                        "group": "tempo",
                        "version": "v0",
                        "datasource": {
                          "name": "tempo"
                        },
                        "spec": {
                          "limit": 20,
                          "query": "{status=error}",
                          "queryType": "traceql",
                          "tableType": "traces"
                        }
                      },
                      "refId": "A",
                      "hidden": false
                    }
                  }
                ],
                "transformations": [],
                "queryOptions": {}
              }
            },
            "vizConfig": {
              "kind": "VizConfig",
              "group": "table",
              "version": "",
              "spec": {
                "options": {},
                "fieldConfig": {
                  "defaults": {},
                  "overrides": []
                }
              }
            }
          }
        },
        "panel-2": {
          "kind": "Panel",
          "spec": {
            "id": 2,
            "title": "Mesh request latency p50/p95 (by destination service)",
            "description": "",
            "links": [],
            "data": {
              "kind": "QueryGroup",
              "spec": {
                "queries": [
                  {
                    "kind": "PanelQuery",
                    "spec": {
                      "query": {
                        "kind": "DataQuery",
                        "group": "prometheus",
                        "version": "v0",
                        "datasource": {
                          "name": "mesh-prometheus"
                        },
                        "spec": {
                          "expr": "histogram_quantile(0.50, sum by (le, destination_service_name) (rate(istio_request_duration_milliseconds_bucket{destination_service_name=~\"$dest_service\", destination_service_namespace=~\"$mesh_namespace\"}[5m])))",
