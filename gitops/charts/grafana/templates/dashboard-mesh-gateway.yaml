{{- if .Values.grafana.enabled }}
# ADR-0413: merges dashboard-network-mesh.yaml and dashboard-api-gateway.yaml
# into one dashboard - both are "the network boundary" concerns and both
# were small (6 and 4 panels). Carries over BOTH retired dashboards' own
# rationale:
#
# - Mesh panels use the separate "mesh-prometheus" datasource
#   (mesh-monitoring's own MonitoringStack, zuno-mesh) - Istio/Envoy metrics
#   live only there, not in the cluster's main Prometheus, so they can't be
#   joined with any zuno_*/kube_state metric in one PromQL expression. The
#   raw pod/NIC bandwidth panel the old network-mesh dashboard carried on
#   the "prometheus" datasource moved to dashboard-infra-data.yaml instead
#   (same split, better home).
# - Kuadrant (Authorino/Limitador) panels are empty by design: Authorino's
#   auth-decision metrics need real traffic past the live
#   "maas-gateway-auth" AuthPolicy, blocked today by ADR-0201's noted mTLS
#   gap; Limitador's per-limit counters need a RateLimitPolicy (none
#   attached). Both populate with zero further Grafana work once those two
#   gaps close upstream.
#
# Layout reworked 2026-09-02 into collapsible rows (same treatment as
# dashboard-data.yaml, exported from Grafana's UI and converted to its
# "Dashboard v2" schema by Grafana's own v2beta1 API - see dashboard-
# data.yaml's header for why that's safe against this cluster's
# grafana-operator v5.24.0 / Grafana 13.0.1). Row grouping and panel
# content otherwise unchanged from the classic-schema version.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: mesh-gateway
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "26"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  uid: zuno-mesh-gateway
  folder: "Zuno Platform"
  json: |
    {
      "annotations": [
        {
          "kind": "AnnotationQuery",
          "spec": {
            "query": {
              "kind": "DataQuery",
              "group": "grafana",
              "version": "v0",
              "datasource": {
                "name": "-- Grafana --"
              },
              "spec": {}
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "builtIn": true,
            "legacyOptions": {
              "type": "dashboard"
            }
          }
        }
      ],
      "cursorSync": "Off",
      "description": "ADR-0413: Istio/Envoy mesh traffic (mesh-prometheus datasource) and Kuadrant Authorino/Limitador (prometheus datasource) - empty-by-design until ADR-0201's MaaS AuthPolicy gap closes.",
      "editable": true,
      "elements": {
        "panel-1": {
          "kind": "Panel",
          "spec": {
            "id": 1,
            "title": "Mesh requests (rate, by destination service/response code)",
            "description": "",
            "links": [],
            "data": {
              "kind": "QueryGroup",
              "spec": {
                "queries": [
                  {
                    "kind": "PanelQuery",
                    "spec": {
                      "query": {
                        "kind": "DataQuery",
                        "group": "prometheus",
                        "version": "v0",
                        "datasource": {
                          "name": "mesh-prometheus"
                        },
                        "spec": {
                          "expr": "sum by (destination_service_name, response_code) (rate(istio_requests_total{destination_service_name=~\"$dest_service\", destination_service_namespace=~\"$mesh_namespace\"}[5m]))",
                          "legendFormat": "{{`{{destination_service_name}}`}} ({{`{{response_code}}`}})"
                        }
                      },
                      "refId": "A",
                      "hidden": false
                    }
                  }
                ],
                "transformations": [],
                "queryOptions": {}
              }
            },
            "vizConfig": {
              "kind": "VizConfig",
              "group": "timeseries",
              "version": "",
              "spec": {
                "options": {},
                "fieldConfig": {
                  "defaults": {},
                  "overrides": []
                }
              }
            }
          }
        },
        "panel-10": {
          "kind": "Panel",
          "spec": {
            "id": 10,
            "title": "Limitador: authorized vs limited calls (rate, by namespace)",
            "description": "",
            "links": [],
            "data": {
              "kind": "QueryGroup",
              "spec": {
                "queries": [
                  {
                    "kind": "PanelQuery",
                    "spec": {
                      "query": {
                        "kind": "DataQuery",
                        "group": "prometheus",
                        "version": "v0",
                        "datasource": {
                          "name": "prometheus"
                        },
                        "spec": {
                          "expr": "sum by (limitador_namespace) (rate(authorized_calls[5m]))",
                          "legendFormat": "authorized: {{`{{limitador_namespace}}`}}"
                        }
                      },
                      "refId": "A",
                      "hidden": false
                    }
                  },
                  {
                    "kind": "PanelQuery",
                    "spec": {
                      "query": {
                        "kind": "DataQuery",
                        "group": "prometheus",
                        "version": "v0",
                        "datasource": {
                          "name": "prometheus"
                        },
                        "spec": {
                          "expr": "sum by (limitador_namespace) (rate(limited_calls[5m]))",
                          "legendFormat": "limited: {{`{{limitador_namespace}}`}}"
                        }
                      },
                      "refId": "B",
                      "hidden": false
                    }
                  }
                ],
                "transformations": [],
                "queryOptions": {}
              }
            },
            "vizConfig": {
              "kind": "VizConfig",
              "group": "timeseries",
              "version": "",
              "spec": {
                "options": {},
                "fieldConfig": {
                  "defaults": {},
                  "overrides": []
                }
              }
            }
          }
        },
        "panel-11": {
          "kind": "Panel",
          "spec": {
            "id": 11,
            "title": "Limitador: up / datastore partitioned",
            "description": "",
            "links": [],
            "data": {
              "kind": "QueryGroup",
              "spec": {
                "queries": [
                  {
                    "kind": "PanelQuery",
                    "spec": {
                      "query": {
                        "kind": "DataQuery",
