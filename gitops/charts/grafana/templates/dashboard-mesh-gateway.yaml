                        "datasource": {
                          "name": "mesh-prometheus"
                        },
                        "spec": {
                          "expr": "histogram_quantile(0.95, sum by (le, destination_service_name) (rate(istio_request_duration_milliseconds_bucket{destination_service_name=~\"$dest_service\", destination_service_namespace=~\"$mesh_namespace\"}[5m])))",
                          "legendFormat": "p95 {{`{{destination_service_name}}`}}"
                        }
                      },
