{{- if .Values.grafana.enabled }}
# Bearer-token identity for the Prometheus GrafanaDatasource
# (datasource-prometheus.yaml) to read prometheus-k8s/thanos-querier - the
# same Prometheus gitops/charts/observability's ServiceMonitor confirmed-live
# scrapes ADR-0029's zuno.model_calls/zuno.model_tokens/zuno.model_cost_usd.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-prometheus-reader
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
---
# OpenShift no longer auto-generates a token Secret per ServiceAccount
# (since 4.11/Kubernetes 1.24) - created explicitly so
# secret-prometheus-token.yaml has a stable, long-lived token to read from
# (a projected/expiring token, the modern default, doesn't fit a
# GrafanaDatasource's static secretKeyRef).
apiVersion: v1
kind: Secret
metadata:
  name: grafana-prometheus-reader-token
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-29"
    kubernetes.io/service-account.name: grafana-prometheus-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-prometheus-reader
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: grafana-prometheus-reader
    namespace: {{ .Values.monitoringNamespace }}
{{- end }}
