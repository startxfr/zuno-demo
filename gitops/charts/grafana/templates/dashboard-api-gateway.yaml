{{- if .Values.grafana.enabled }}
# Authorino/Limitador (gitops/charts/connectivity-link's ServiceMonitors),
# scraped by the same prometheus-k8s the "prometheus" datasource already
# queries. VERIFIED live, 2026-08-18: panels below are empty by design
# today - Authorino's auth-decision metrics (auth_server_*) only appear
# once real traffic passes the live "maas-gateway-auth" AuthPolicy, which
# ADR-0201's noted mTLS gap currently blocks before it reaches Authorino;
# Limitador's per-limit counters only appear once a RateLimitPolicy is
# attached (none is, yet). Both will populate with zero further Grafana
# work once those two gaps close upstream.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: api-gateway
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "26"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  uid: zuno-api-gateway
  folder: "Zuno Platform"
  json: |
    {
      "uid": "zuno-api-gateway",
      "title": "API gateway",
      "description": "Authorino/Limitador (Kuadrant) - empty until real MaaS traffic reaches the AuthPolicy (ADR-0201) and/or a RateLimitPolicy is attached.",
      "tags": ["zuno", "kuadrant", "maas"],
      "timezone": "browser",
      "schemaVersion": 39,
      "time": {"from": "now-6h", "to": "now"},
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Authorino: auth decisions (rate, by authconfig/status)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (authconfig, status) (rate(auth_server_response_status[5m]))",
              "legendFormat": "{{`{{authconfig}}`}} ({{`{{status}}`}})"
            }
          ]
        },
        {
          "id": 2,
          "title": "Authorino: controller health (reconcile errors, rate)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (controller) (rate(controller_runtime_reconcile_errors_total{namespace=\"kuadrant-system\"}[5m]))",
              "legendFormat": "{{`{{controller}}`}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Limitador: authorized vs limited calls (rate, by namespace)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (limitador_namespace) (rate(authorized_calls[5m]))",
              "legendFormat": "authorized: {{`{{limitador_namespace}}`}}"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (limitador_namespace) (rate(limited_calls[5m]))",
              "legendFormat": "limited: {{`{{limitador_namespace}}`}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Limitador: up / datastore partitioned",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "limitador_up",
              "legendFormat": "up"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "datastore_partitioned",
              "legendFormat": "datastore_partitioned"
            }
          ]
        }
      ]
    }
{{- end }}
