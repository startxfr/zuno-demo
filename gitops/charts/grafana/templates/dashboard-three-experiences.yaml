{{- if .Values.grafana.enabled }}
# ADR-0587 (WP-184): the demonstration dashboard of the five user experiences
# (UnifAI, Open WebUI, OpenClaw, Dify, kagent; ADR-0599, ADR-0600, WP-208) on one governed backend. Built on the bounded
# `client` label of WP-179 and the skipped-candidate counter of ADR-0591; the
# classic row schema, for the reason dashboard-usage-cost.yaml's header gives.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: three-experiences
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "26"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  uid: zuno-three-experiences
  folder: "Zuno Platform"
  json: |
    {
      "uid": "zuno-three-experiences",
      "title": "Five experiences",
      "description": "ADR-0587/WP-184: UnifAI, Open WebUI, OpenClaw, Dify and kagent on one governed backend - calls, tokens, cost, guardrails, routing and the shared per-user budget, by experience client.",
      "tags": [
        "zuno",
        "usage",
        "experiences"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "30s",
      "links": [
        {
          "type": "dashboards",
          "tags": [
            "zuno"
          ],
          "asDropdown": true,
          "keepTime": true,
          "title": "Zuno dashboards"
        }
      ],
      "templating": {
        "list": [
          {
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(zuno_model_calls_total, client)",
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "name": "client",
            "label": "client",
            "query": "label_values(zuno_model_calls_total, client)",
            "refresh": 2,
            "type": "query",
            "sort": 1
          },
          {
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(zuno_model_calls_total, user)",
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "name": "user",
            "label": "user",
            "query": "label_values(zuno_model_calls_total, user)",
            "refresh": 2,
            "type": "query",
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 100,
          "type": "row",
          "title": "Same backend, five experiences",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 1,
          "title": "Model calls by experience (over range)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (client) (increase(zuno_model_calls_total{client=~\"$client\", user=~\"$user\"}[$__range]))",
              "legendFormat": "{{`{{client}}`}}"
            }
          ],
          "description": "One point per call: a multi-group user counts once. `client` is the token's azp (ADR-0587)."
        },
        {
          "id": 2,
          "title": "Tokens by experience (over range)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (client, kind) (increase(zuno_model_tokens_total{client=~\"$client\", user=~\"$user\"}[$__range]))",
              "legendFormat": "{{`{{client}}`}} ({{`{{kind}}`}})"
            }
          ],
          "description": "One point per call: a multi-group user counts once. `client` is the token's azp (ADR-0587)."
        },
        {
          "id": 3,
          "title": "Estimated cost by experience (over range)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (client) (increase(zuno_model_cost_usd_total{client=~\"$client\", user=~\"$user\"}[$__range]))",
              "legendFormat": "{{`{{client}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD"
            }
          },
          "description": "One point per call: a multi-group user counts once. `client` is the token's azp (ADR-0587)."
        },
        {
          "id": 4,
          "title": "Guardrails evaluations by experience (over range)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (client, outcome) (increase(zuno_guardrails_evaluations_total{client=~\"$client\"}[$__range]))",
              "legendFormat": "{{`{{client}}`}} ({{`{{outcome}}`}})"
            }
          ]
        },
        {
          "id": 101,
          "type": "row",
          "title": "Same models, same routing",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "panels": []
        },
        {
          "id": 5,
          "title": "Which provider served each experience (over range)",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 18
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (client, provider, outcome) (increase(zuno_model_calls_total{client=~\"$client\", user=~\"$user\"}[$__range]))",
              "legendFormat": "",
              "format": "table",
              "instant": true
            }
          ],
          "description": "Same routing for every experience: classification decides the eligible providers (ADR-0560)."
        },
        {
          "id": 6,
          "title": "Candidates skipped for availability (over range)",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 18
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (client, provider, reason) (increase(zuno_model_candidates_skipped_total{client=~\"$client\"}[$__range]))",
              "legendFormat": "",
              "format": "table",
              "instant": true
            }
          ],
          "description": "ADR-0591: not_ready (the model's LLMInferenceService is not Ready) or circuit_open."
        },
        {
          "id": 102,
          "type": "row",
          "title": "Same user, one budget",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 26
          },
          "panels": []
        },
        {
          "id": 7,
          "title": "One user across the experiences: tokens (over range)",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 27
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (user, client) (increase(zuno_model_tokens_total{client=~\"$client\", user=~\"$user\"}[$__range]))",
              "legendFormat": "",
              "format": "table",
              "instant": true
            }
          ],
          "description": "The per-user ceilings of the ai-gateway's quota are one budget for all experiences (ADR-0587 decision 5): a user's tokens add up across clients."
        },
        {
          "id": 103,
          "type": "row",
          "title": "Same health, five experiences",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 35
          },
          "panels": []
        },
        {
          "id": 8,
          "title": "Model call error rate by experience (over range)",
          "type": "table",
          "fieldConfig": {"defaults": {"unit": "percentunit"}, "overrides": []},
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 36
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (client) (increase(zuno_model_calls_total{client=~\"$client\", user=~\"$user\", outcome=\"error\"}[$__range])) / sum by (client) (increase(zuno_model_calls_total{client=~\"$client\", user=~\"$user\"}[$__range]))",
              "legendFormat": "",
              "format": "table",
              "instant": true
            }
          ],
          "description": "Share of calls that ended in error, per client, from the ai-gateway for the five experiences; a quota refusal is not a model call and is not counted here. Counted per attempt: a request that fails on one provider and is served by the next counts one error and one success."
        },
        {
          "id": 9,
          "title": "Model call latency p95 by experience (over range)",
          "type": "table",
          "fieldConfig": {"defaults": {"unit": "ms"}, "overrides": []},
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 36
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, client) (increase(zuno_model_call_duration_ms_milliseconds_bucket{client=~\"$client\", user=~\"$user\"}[$__range])))",
              "legendFormat": "",
              "format": "table",
              "instant": true
            }
          ],
          "description": "95th percentile of the ai-gateway's model-call latency in milliseconds, per client."
        },
        {
          "id": 104,
          "type": "row",
          "title": "Same tools, governed: cluster reads (ADR-0600)",
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 44},
          "panels": []
        },
        {
          "id": 10,
          "title": "Cluster read tool calls by tool and outcome (over range)",
          "type": "table",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 45},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (tool, outcome) (increase(zuno_tool_invocations_total{mcp_server=\"k8s\"}[$__range]))",
              "legendFormat": "",
              "format": "table",
              "instant": true
            }
          ],
          "description": "k8s.resource.read, k8s.resource.list, k8s.events.read, k8s.logs.read and metrics.query through the mcp-gateway: allowed, denied (not entitled) or downstream_error (for example a refused Secret). Read by kagent and by UnifAI operations agents; Dify and Open WebUI are not entitled."
        },
        {
          "id": 11,
          "title": "All governed tool calls by tool and outcome (over range)",
          "type": "table",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 45},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (mcp_server, tool, outcome) (increase(zuno_tool_invocations_total[$__range]))",
              "legendFormat": "",
              "format": "table",
              "instant": true
            }
          ],
          "description": "Every tool call of every experience goes through the one mcp-gateway: the same tools, the same entitlement, one audit."
        }
      ]
    }
{{- end }}
