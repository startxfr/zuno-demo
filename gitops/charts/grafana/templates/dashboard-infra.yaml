{{- if .Values.grafana.enabled }}
# Node/pod/deployment health for the zuno-* namespaces, from
# kube-state-metrics/node-exporter/cAdvisor - standard OpenShift
# cluster-monitoring scrape targets (not configured anywhere in this repo,
# scraped by prometheus-k8s by default), reachable through the same
# `prometheus` datasource datasource-prometheus.yaml already wires up.
#
# "Component status" is an approximation, not a real per-service `up`:
# no ServiceMonitor exists for any individual Zuno application component
# today (ai-gateway/agent-runtime/mcp-gateway/agent-bff push OTLP to the
# collector rather than being scraped themselves), so this panel combines
# pod phase/restarts with zuno_bff_requests_total's error rate instead. A
# real per-component `up` would need a ServiceMonitor per component's own
# health endpoint - a reasonable follow-up, not done here.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: infra
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  uid: zuno-infra
  folder: "Zuno Platform"
  json: |
    {
      "uid": "zuno-infra",
      "title": "Infra",
      "description": "Node/pod/deployment health across zuno-* namespaces (kube-state-metrics/node-exporter/cAdvisor).",
      "tags": ["zuno", "infra"],
      "timezone": "browser",
      "schemaVersion": 39,
      "time": {"from": "now-6h", "to": "now"},
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Pod status by namespace",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (namespace, phase) (kube_pod_status_phase{namespace=~\"zuno-.*\"})",
              "legendFormat": "{{`{{namespace}}`}} ({{`{{phase}}`}})"
            }
          ]
        },
        {
          "id": 2,
          "title": "Pod restarts (last hour, by namespace/pod)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"zuno-.*\"}[1h])) > 0",
              "legendFormat": "{{`{{namespace}}`}}/{{`{{pod}}`}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Deployment availability (available/desired replicas)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "kube_deployment_status_replicas_available{namespace=~\"zuno-.*\"} / kube_deployment_spec_replicas{namespace=~\"zuno-.*\"}",
              "legendFormat": "{{`{{namespace}}`}}/{{`{{deployment}}`}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Node readiness / schedulability",
          "type": "table",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "kube_node_status_condition{condition=\"Ready\"} == 1",
              "format": "table",
              "instant": true
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "kube_node_spec_unschedulable",
              "format": "table",
              "instant": true
            }
          ]
        },
        {
          "id": 5,
          "title": "CPU usage (by namespace)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{namespace=~\"zuno-.*\"}[5m]))",
              "legendFormat": "{{`{{namespace}}`}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Memory working set (by namespace)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "fieldConfig": {"defaults": {"unit": "bytes"}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (namespace) (container_memory_working_set_bytes{namespace=~\"zuno-.*\", container!=\"\"})",
              "legendFormat": "{{`{{namespace}}`}}"
            }
          ]
        },
        {
          "id": 7,
          "title": "Component status (pod-health + BFF error-rate approximation)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (agent) (rate(zuno_bff_requests_total{code=~\"5..\"}[5m]))",
              "legendFormat": "bff errors: {{`{{agent}}`}}"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (namespace) (kube_pod_status_phase{namespace=~\"zuno-.*\", phase=\"Failed\"})",
              "legendFormat": "failed pods: {{`{{namespace}}`}}"
            }
          ]
        }
      ]
    }
{{- end }}
