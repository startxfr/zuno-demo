{{- if .Values.grafana.enabled }}
# ADR-0413: merges dashboard-model-consumption.yaml's gateway-traffic panels
# (ADR-0029) with vLLM's own serving metrics and GPU (DCGM) panels - all
# NEW; vllm:* and DCGM_FI_DEV_* are both already queryable (the latter via
# gpu-operator's own DCGM exporter
# ServiceMonitor; the former via the vLLM ServiceMonitor
# gitops/charts/models/templates/servicemonitor-vllm.yaml adds - see that
# file for the "why wasn't this scraped before" history). This is the
# provider/model/outcome axis of ADR-0029's "by user, agent, task, model
# and provider" bullet; dashboard-usage-cost.yaml covers user/group/agent.
#
# The latency panel's histogram is live as of 2026-08-22 (ai-gateway was
# rebuilt with it days ago) - the panel was still empty because of a
# double-unit-suffix bug: telemetry.py's create_histogram() passes
# unit="ms" on a name that already ends in "_ms", so the OTel-to-
# Prometheus translator emits zuno_model_call_duration_ms_milliseconds_bucket,
# not the _ms_bucket name you'd guess. Panel query fixed to match; see
# that panel's own description for detail. The "BFF requests by agent" panel that dashboard also carried moved to
# dashboard-agents-tools-rag.yaml, which is the more natural home for
# per-agent traffic once that dashboard exists.
#
# Layout reworked 2026-09-02 into collapsible rows (same treatment as
# dashboard-data.yaml, exported from Grafana's UI and converted to its
# "Dashboard v2" schema by Grafana's own v2beta1 API - see dashboard-
# data.yaml's header for why that's safe against this cluster's
# grafana-operator v5.24.0 / Grafana 13.0.1). Row grouping and panel
# content otherwise unchanged from the classic-schema version.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ai-models
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "26"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  uid: zuno-ai-models
  folder: "Zuno Platform"
  # grafana-operator posts spec.json to the classic /api/dashboards/db
  # endpoint, which rejects a bare v2-schema body with a 400
  # ("dashboard appears to be in v2 format... include an object wrapper
  # with an explicit apiVersion and move the body into a spec element")
  # - confirmed live 2026-09-02 by probing that endpoint directly with
  # both the bare and the wrapped form. The apiVersion/kind/spec
  # envelope below is that required wrapper, not part of the dashboard
  # model itself.
  json: |
    {
      "apiVersion": "dashboard.grafana.app/v2beta1",
      "kind": "Dashboard",
      "spec":
        {
          "annotations": [
            {
              "kind": "AnnotationQuery",
              "spec": {
                "query": {
                  "kind": "DataQuery",
                  "group": "grafana",
                  "version": "v0",
                  "datasource": {
                    "name": "-- Grafana --"
                  },
                  "spec": {}
                },
                "enable": true,
                "hide": true,
                "iconColor": "rgba(0, 211, 255, 1)",
                "name": "Annotations & Alerts",
                "builtIn": true,
                "legacyOptions": {
                  "type": "dashboard"
                }
              }
            }
          ],
          "cursorSync": "Off",
          "description": "ADR-0029/ADR-0413: gateway model traffic, semantic cache, vLLM serving internals and GPU (DCGM) health, filterable by provider/model/outcome.",
          "editable": true,
          "elements": {
            "panel-1": {
              "kind": "Panel",
              "spec": {
                "id": 1,
                "title": "Model calls (rate, by provider/model/outcome)",
                "description": "",
                "links": [],
                "data": {
                  "kind": "QueryGroup",
                  "spec": {
                    "queries": [
                      {
                        "kind": "PanelQuery",
                        "spec": {
                          "query": {
                            "kind": "DataQuery",
                            "group": "prometheus",
                            "version": "v0",
                            "datasource": {
                              "name": "prometheus"
                            },
                            "spec": {
                              "expr": "sum by (provider, model, outcome) (rate(zuno_model_calls_total{provider=~\"$provider\", model=~\"$model\", outcome=~\"$outcome\"}[5m]))",
                              "legendFormat": "{{`{{provider}}`}}/{{`{{model}}`}} ({{`{{outcome}}`}})"
                            }
                          },
                          "refId": "A",
                          "hidden": false
                        }
                      }
                    ],
                    "transformations": [],
                    "queryOptions": {}
                  }
                },
                "vizConfig": {
                  "kind": "VizConfig",
                  "group": "timeseries",
                  "version": "",
                  "spec": {
                    "options": {},
                    "fieldConfig": {
                      "defaults": {},
                      "overrides": []
                    }
                  }
                }
              }
            },
            "panel-10": {
              "kind": "Panel",
              "spec": {
                "id": 10,
                "title": "vLLM: time to first token (p50/p95)",
                "description": "",
                "links": [],
                "data": {
                  "kind": "QueryGroup",
                  "spec": {
                    "queries": [
                      {
                        "kind": "PanelQuery",
