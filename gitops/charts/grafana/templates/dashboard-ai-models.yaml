{{- if .Values.grafana.enabled }}
# ADR-0413: merges dashboard-model-consumption.yaml's gateway-traffic panels
# (ADR-0029) with vLLM's own serving metrics and GPU (DCGM) panels - all
# NEW, VERIFIED live 2026-08-19 that vllm:* and DCGM_FI_DEV_* are both
# already queryable (the latter via gpu-operator's own DCGM exporter
# ServiceMonitor; the former via the vLLM ServiceMonitor
# gitops/charts/models/templates/servicemonitor-vllm.yaml adds - see that
# file for the "why wasn't this scraped before" history). This is the
# provider/model/outcome axis of ADR-0029's "by user, agent, task, model
# and provider" bullet; dashboard-usage-cost.yaml covers user/group/agent.
#
# zuno_model_call_duration_ms_bucket (the gateway-traffic latency panel)
# needs ai-gateway rebuilt/redeployed with its duration histogram - same
# caveat the retired dashboard-model-consumption.yaml carried, unresolved.
# The "BFF requests by agent" panel that dashboard also carried moved to
# dashboard-agents-tools-rag.yaml, which is the more natural home for
# per-agent traffic once that dashboard exists.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ai-models
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "26"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  uid: zuno-ai-models
  folder: "Zuno Platform"
  json: |
    {
      "uid": "zuno-ai-models",
      "title": "AI models & serving",
      "description": "ADR-0029/ADR-0413: gateway model traffic, semantic cache, vLLM serving internals and GPU (DCGM) health, filterable by provider/model/outcome.",
      "tags": ["zuno", "adr-0029", "models", "vllm", "gpu", "adr-0413"],
      "timezone": "browser",
      "schemaVersion": 39,
      "time": {"from": "now-6h", "to": "now"},
      "refresh": "30s",
      "links": [
        {"type": "dashboards", "tags": ["zuno"], "asDropdown": true, "keepTime": true, "title": "Zuno dashboards"}
      ],
      "templating": {"list": [
        {
          "current": {"text": "All", "value": "$__all"},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "definition": "label_values(zuno_model_calls_total, provider)",
          "hide": 0, "includeAll": true, "allValue": ".*", "multi": true,
          "name": "provider", "options": [],
          "query": "label_values(zuno_model_calls_total, provider)",
          "refresh": 2, "regex": "", "sort": 1, "type": "query"
        },
        {
          "current": {"text": "All", "value": "$__all"},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "definition": "label_values(zuno_model_calls_total{provider=~\"$provider\"}, model)",
          "hide": 0, "includeAll": true, "allValue": ".*", "multi": true,
          "name": "model", "options": [],
          "query": "label_values(zuno_model_calls_total{provider=~\"$provider\"}, model)",
          "refresh": 2, "regex": "", "sort": 1, "type": "query"
        },
        {
          "current": {"text": "All", "value": "$__all"},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "definition": "label_values(zuno_model_calls_total, outcome)",
          "hide": 0, "includeAll": true, "allValue": ".*", "multi": true,
          "name": "outcome", "options": [],
          "query": "label_values(zuno_model_calls_total, outcome)",
          "refresh": 2, "regex": "", "sort": 1, "type": "query"
        },
        {
          "current": {"text": "All", "value": "$__all"},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "definition": "label_values(vllm:num_requests_running, model_name)",
          "hide": 0, "includeAll": true, "allValue": ".*", "multi": true,
          "name": "served_model", "options": [],
          "query": "label_values(vllm:num_requests_running, model_name)",
          "refresh": 2, "regex": "", "sort": 1, "type": "query"
        }
      ]},
      "panels": [
        {
          "id": 1,
          "title": "Model calls (rate, by provider/model/outcome)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (provider, model, outcome) (rate(zuno_model_calls_total{provider=~\"$provider\", model=~\"$model\", outcome=~\"$outcome\"}[5m]))", "legendFormat": "{{`{{provider}}`}}/{{`{{model}}`}} ({{`{{outcome}}`}})"}
          ]
        },
        {
          "id": 2,
          "title": "Tokens consumed (rate, by kind)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (provider, model, kind) (rate(zuno_model_tokens_total{provider=~\"$provider\", model=~\"$model\"}[5m]))", "legendFormat": "{{`{{provider}}`}}/{{`{{model}}`}} ({{`{{kind}}`}})"}
          ]
        },
        {
          "id": 3,
          "title": "Estimated cost (USD/s, by provider and model)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "fieldConfig": {"defaults": {"unit": "currencyUSD"}},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (provider, model) (rate(zuno_model_cost_usd_total{provider=~\"$provider\", model=~\"$model\"}[5m]))", "legendFormat": "{{`{{provider}}`}}/{{`{{model}}`}}"}
          ]
        },
        {
          "id": 4,
          "title": "Latency p50/p95 (by provider/model)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "description": "Empty until ai-gateway is rebuilt/redeployed with the duration histogram (unresolved since dashboard-model-consumption.yaml).",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "fieldConfig": {"defaults": {"unit": "ms", "links": [
            {"title": "View slow model_call traces in Tempo", "url": "/explore?left=%7B%22datasource%22%3A%22tempo%22%2C%22queries%22%3A%5B%7B%22queryType%22%3A%22traceql%22%2C%22query%22%3A%22%7Bname%3D%5C%22model_call%5C%22%20%26%26%20duration%20%3E%202s%7D%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22%24%7B__from%7D%22%2C%22to%22%3A%22%24%7B__to%7D%22%7D%7D", "targetBlank": true}
          ]}},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.50, sum by (le, provider, model) (rate(zuno_model_call_duration_ms_bucket{provider=~\"$provider\", model=~\"$model\"}[5m])))", "legendFormat": "p50 {{`{{provider}}`}}/{{`{{model}}`}}"},
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.95, sum by (le, provider, model) (rate(zuno_model_call_duration_ms_bucket{provider=~\"$provider\", model=~\"$model\"}[5m])))", "legendFormat": "p95 {{`{{provider}}`}}/{{`{{model}}`}}"}
          ]
        },
        {
          "id": 5,
          "title": "Semantic cache lookups (rate, by outcome)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (outcome) (rate(zuno_semantic_cache_lookups_total{model=~\"$model\"}[5m]))", "legendFormat": "{{`{{outcome}}`}}"}
          ]
        },
        {
          "id": 6,
          "title": "Semantic cache hit ratio",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 16},
          "fieldConfig": {"defaults": {"unit": "percentunit"}},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(rate(zuno_semantic_cache_lookups_total{outcome=\"hit\", model=~\"$model\"}[5m])) / sum(rate(zuno_semantic_cache_lookups_total{model=~\"$model\"}[5m]))"}
          ]
        },
        {
          "id": 7,
          "title": "Error ratio",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 16},
          "fieldConfig": {"defaults": {"unit": "percentunit", "thresholds": {"steps": [
            {"color": "green", "value": null}, {"color": "orange", "value": 0.02}, {"color": "red", "value": 0.1}
          ]}}},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(rate(zuno_model_calls_total{outcome=\"error\", provider=~\"$provider\", model=~\"$model\"}[5m])) / sum(rate(zuno_model_calls_total{provider=~\"$provider\", model=~\"$model\"}[5m]))"}
          ]
        },
        {
          "id": 8,
          "title": "Total model call volume",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 4, "w": 12, "x": 12, "y": 20},
          "fieldConfig": {"defaults": {"unit": "reqps"}},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(rate(zuno_model_calls_total{provider=~\"$provider\", model=~\"$model\", outcome=~\"$outcome\"}[5m]))"}
          ]
        },
        {
          "id": 9,
          "title": "vLLM: requests running / waiting",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "description": "gitops/charts/models/templates/servicemonitor-vllm.yaml - the three classic InferenceServices' own /metrics.",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (model_name) (vllm:num_requests_running{model_name=~\"$served_model\"})", "legendFormat": "{{`{{model_name}}`}} (running)"},
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (model_name) (vllm:num_requests_waiting{model_name=~\"$served_model\"})", "legendFormat": "{{`{{model_name}}`}} (waiting)"}
          ]
        },
        {
          "id": 10,
          "title": "vLLM: time to first token (p50/p95)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.50, sum by (le, model_name) (rate(vllm:time_to_first_token_seconds_bucket{model_name=~\"$served_model\"}[5m])))", "legendFormat": "p50 {{`{{model_name}}`}}"},
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.95, sum by (le, model_name) (rate(vllm:time_to_first_token_seconds_bucket{model_name=~\"$served_model\"}[5m])))", "legendFormat": "p95 {{`{{model_name}}`}}"}
          ]
        },
        {
          "id": 11,
          "title": "vLLM: time per output token (p95)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 32},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.95, sum by (le, model_name) (rate(vllm:time_per_output_token_seconds_bucket{model_name=~\"$served_model\"}[5m])))", "legendFormat": "{{`{{model_name}}`}}"}
          ]
        },
        {
          "id": 12,
          "title": "vLLM: end-to-end request latency (p95)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 32},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.95, sum by (le, model_name) (rate(vllm:e2e_request_latency_seconds_bucket{model_name=~\"$served_model\"}[5m])))", "legendFormat": "{{`{{model_name}}`}}"}
          ]
        },
        {
          "id": 13,
          "title": "vLLM: token throughput (prompt + generation)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 40},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (model_name) (rate(vllm:prompt_tokens_total{model_name=~\"$served_model\"}[5m]))", "legendFormat": "{{`{{model_name}}`}} (prompt)"},
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (model_name) (rate(vllm:generation_tokens_total{model_name=~\"$served_model\"}[5m]))", "legendFormat": "{{`{{model_name}}`}} (generation)"}
          ]
        },
        {
          "id": 14,
          "title": "vLLM: KV-cache usage",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 40},
          "fieldConfig": {"defaults": {"unit": "percentunit"}},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "vllm:gpu_cache_usage_perc{model_name=~\"$served_model\"}", "legendFormat": "{{`{{model_name}}`}}"}
          ]
        },
        {
          "id": 15,
          "title": "vLLM: completed requests by finish reason",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 48},
          "fieldConfig": {"defaults": {"unit": "reqps"}},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (model_name, finished_reason) (rate(vllm:request_success_total{model_name=~\"$served_model\"}[5m]))", "legendFormat": "{{`{{model_name}}`}} ({{`{{finished_reason}}`}})"}
          ]
        },
        {
          "id": 16,
          "title": "GPU utilization",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "description": "gpu-operator's own nvidia-dcgm-exporter ServiceMonitor - VERIFIED live 2026-08-19, single full GPU (no MIG slicing active on this cluster today).",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 56},
          "fieldConfig": {"defaults": {"unit": "percent"}},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "avg by (Hostname, gpu) (DCGM_FI_DEV_GPU_UTIL)", "legendFormat": "{{`{{Hostname}}`}} gpu{{`{{gpu}}`}}"}
          ]
        },
        {
          "id": 17,
          "title": "GPU framebuffer used / free",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 56},
          "fieldConfig": {"defaults": {"unit": "decmbytes"}},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "avg by (Hostname, gpu) (DCGM_FI_DEV_FB_USED)", "legendFormat": "{{`{{Hostname}}`}} gpu{{`{{gpu}}`}} (used)"},
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "avg by (Hostname, gpu) (DCGM_FI_DEV_FB_FREE)", "legendFormat": "{{`{{Hostname}}`}} gpu{{`{{gpu}}`}} (free)"}
          ]
        },
        {
          "id": 18,
          "title": "GPU temperature",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 64},
          "fieldConfig": {"defaults": {"unit": "celsius"}},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "avg by (Hostname, gpu) (DCGM_FI_DEV_GPU_TEMP)", "legendFormat": "{{`{{Hostname}}`}} gpu{{`{{gpu}}`}}"}
          ]
        },
        {
          "id": 19,
          "title": "GPU power draw",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 64},
          "fieldConfig": {"defaults": {"unit": "watt"}},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "avg by (Hostname, gpu) (DCGM_FI_DEV_POWER_USAGE)", "legendFormat": "{{`{{Hostname}}`}} gpu{{`{{gpu}}`}}"}
          ]
        },
        {
          "id": 20,
          "title": "Traces: slow model_call (>2s)",
          "type": "table",
          "datasource": {"type": "tempo", "uid": "tempo"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 72},
          "targets": [
            {"datasource": {"type": "tempo", "uid": "tempo"}, "queryType": "traceql", "query": "{name=\"model_call\" && duration > 2s}", "limit": 20, "tableType": "traces", "refId": "A"}
          ]
        },
        {
          "id": 21,
          "title": "Traces: model_call errors",
          "type": "table",
          "datasource": {"type": "tempo", "uid": "tempo"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 72},
          "targets": [
            {"datasource": {"type": "tempo", "uid": "tempo"}, "queryType": "traceql", "query": "{name=\"model_call\" && status=error}", "limit": 20, "tableType": "traces", "refId": "A"}
          ]
        }
      ]
    }
{{- end }}
