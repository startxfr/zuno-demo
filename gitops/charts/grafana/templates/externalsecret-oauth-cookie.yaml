{{- if .Values.grafana.enabled }}
# Resolves the oauth-proxy cookie secret auto-generated by the vault role
# (ansible/roles/vault/tasks/install.yml); consumed by templates/grafana.yaml's
# oauth-proxy sidecar via $(COOKIE_SECRET) arg substitution.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-oauth-cookie
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-oauth-cookie
    creationPolicy: Owner
  data:
    - secretKey: cookie_secret
      remoteRef:
        key: grafana/oauth-proxy
        property: cookie_secret
{{- end }}
