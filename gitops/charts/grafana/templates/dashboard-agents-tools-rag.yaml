{{- if .Values.grafana.enabled }}
# ADR-0413: NEW dashboard - the agent-path SLO at per-agent granularity
# (ADR-0102), MCP tool authorization outcomes (ADR-0011/ADR-0036 - denied
# calls included, not just successes) and RAG search/freshness health
# (ADR-0050/ADR-0109). zuno_tool_invocations_total, zuno_rag_searches_total,
# zuno_rag_result_count_bucket and zuno_rag_freshness_lag_seconds_{sum,count}
# are all already flowing with real series - unlike the model-call duration
# histogram, these were simply never put on a dashboard before, not blocked
# on a redeploy.
#
# Layout reworked 2026-09-02 into collapsible rows (same treatment as
# dashboard-data.yaml, exported from Grafana's UI and converted to its
# "Dashboard v2" schema by Grafana's own v2beta1 API - see dashboard-
# data.yaml's header for why that's safe against this cluster's
# grafana-operator v5.24.0 / Grafana 13.0.1). Row grouping and panel
# content otherwise unchanged from the classic-schema version.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: agents-tools-rag
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "26"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  uid: zuno-agents-tools-rag
  folder: "Zuno Platform"
  json: |
    {
      "annotations": [
        {
          "kind": "AnnotationQuery",
          "spec": {
            "query": {
              "kind": "DataQuery",
              "group": "grafana",
              "version": "v0",
              "datasource": {
                "name": "-- Grafana --"
              },
              "spec": {}
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "builtIn": true,
            "legacyOptions": {
              "type": "dashboard"
            }
          }
        }
      ],
      "cursorSync": "Off",
      "description": "ADR-0102/ADR-0011/ADR-0036/ADR-0050/ADR-0109/ADR-0413: per-agent SLO/error budget, MCP tool authorization outcomes, RAG search and freshness health.",
      "editable": true,
      "elements": {
        "panel-1": {
          "kind": "Panel",
          "spec": {
            "id": 1,
            "title": "BFF requests by agent/code (rate)",
            "description": "",
            "links": [],
            "data": {
              "kind": "QueryGroup",
              "spec": {
                "queries": [
                  {
                    "kind": "PanelQuery",
                    "spec": {
                      "query": {
                        "kind": "DataQuery",
                        "group": "prometheus",
                        "version": "v0",
                        "datasource": {
                          "name": "prometheus"
                        },
                        "spec": {
                          "expr": "sum by (agent, code) (rate(zuno_bff_requests_total{agent=~\"$agent\"}[5m]))",
                          "legendFormat": "{{`{{agent}}`}} ({{`{{code}}`}})"
                        }
                      },
                      "refId": "A",
                      "hidden": false
                    }
                  }
                ],
                "transformations": [],
                "queryOptions": {}
              }
            },
            "vizConfig": {
              "kind": "VizConfig",
              "group": "timeseries",
              "version": "",
              "spec": {
                "options": {},
                "fieldConfig": {
                  "defaults": {},
                  "overrides": []
                }
              }
            }
          }
        },
        "panel-10": {
          "kind": "Panel",
          "spec": {
            "id": 10,
            "title": "RAG freshness lag by domain",
            "description": "Same shape as prometheusrule-freshness-lag.yaml's RagFreshnessLagExceeded<Domain> alerts. Per-domain objectives: tech 604800s (7d), sales 14400s (4h), adv 86400s (1d) - sxa-legacy is deliberately exempt.",
            "links": [],
            "data": {
              "kind": "QueryGroup",
              "spec": {
                "queries": [
                  {
                    "kind": "PanelQuery",
                    "spec": {
                      "query": {
                        "kind": "DataQuery",
                        "group": "prometheus",
                        "version": "v0",
                        "datasource": {
                          "name": "prometheus"
                        },
                        "spec": {
                          "expr": "sum by (domain) (rate(zuno_rag_freshness_lag_seconds_sum{domain=~\"$domain\"}[30m])) / sum by (domain) (rate(zuno_rag_freshness_lag_seconds_count{domain=~\"$domain\"}[30m]))",
                          "legendFormat": "{{`{{domain}}`}}"
                        }
                      },
                      "refId": "A",
                      "hidden": false
                    }
                  }
                ],
                "transformations": [],
                "queryOptions": {}
              }
            },
            "vizConfig": {
              "kind": "VizConfig",
              "group": "timeseries",
              "version": "",
              "spec": {
                "options": {},
                "fieldConfig": {
                  "defaults": {
                    "unit": "s"
                  },
                  "overrides": []
                }
              }
            }
          }
        },
        "panel-11": {
