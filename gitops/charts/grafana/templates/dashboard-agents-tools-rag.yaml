{{- if .Values.grafana.enabled }}
# ADR-0413 dashboard, rebuilt for UnifAI (WP-166): the agent-path SLO from
# UnifAI sessions (mas_session_duration_seconds_count, no agent label) and
# per-agent model calls from the ai-gateway (zuno_model_calls_total), MCP tool
# authorization outcomes (zuno_tool_invocations_total, ADR-0011/ADR-0036 -
# denied calls included) and RAG search health from UnifAI
# (rag_search_duration_seconds_*, labels rag_outcome and rag_source_type).
# The old freshness-lag and result-count panels and the answer-grounding panel
# are gone with rag-service and agent-runtime; UnifAI exposes no equivalent.
#
# Layout reworked 2026-09-02 into rows using the CLASSIC schema's native
# "row" panel type (type: row, collapsed: true/false), NOT Grafana's v2
# schema - a first attempt at row-grouping via the v2 "Dashboard" schema
# (elements/layout/vizConfig) broke every one of these dashboards'
# GitOps sync: grafana-operator v5.24.0 posts spec.json to the classic
# /api/dashboards/db endpoint, which rejects a v2-format body outright,
# and even a correctly-wrapped v2 body ({"apiVersion":...,"kind":
# "Dashboard","spec":{...}}) still gets rejected for any dashboard that
# already exists ("must not include an id on the root element" - the
# operator injects the dashboard's known internal id on every update).
# That whole attempt was reverted (see git history). The classic "row"
# panel type below was live-verified against this same endpoint first
# (a throwaway probe dashboard, both an expanded and a collapsed row)
# before being applied here - no known incompatibility with this
# operator version.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: agents-tools-rag
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "26"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  uid: zuno-agents-tools-rag
  folder: "Zuno Platform"
  json: |
    {
      "uid": "zuno-agents-tools-rag",
      "title": "Agents, tools & RAG",
      "description": "ADR-0102/ADR-0011/ADR-0036/ADR-0050/ADR-0109/ADR-0413: per-agent SLO/error budget, MCP tool authorization outcomes, RAG search and freshness health.",
      "tags": [
        "zuno",
        "agents",
        "mcp",
        "rag",
        "slo"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "links": [
        {
          "type": "dashboards",
          "tags": [
            "zuno"
          ],
          "asDropdown": true,
          "keepTime": true,
          "title": "Zuno dashboards"
        }
      ],
      "templating": {
        "list": [
          {
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(zuno_model_calls_total, agent)",
            "hide": 0,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "name": "agent",
            "options": [],
            "query": "label_values(zuno_model_calls_total, agent)",
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "type": "query"
          },
          {
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(zuno_tool_invocations_total, tool)",
            "hide": 0,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "name": "tool",
            "options": [],
            "query": "label_values(zuno_tool_invocations_total, tool)",
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "type": "query"
          },
          {
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(zuno_tool_invocations_total, mcp_server)",
            "hide": 0,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "name": "mcp_server",
            "options": [],
            "query": "label_values(zuno_tool_invocations_total, mcp_server)",
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "panels": [
        {
          "id": 1015,
          "type": "row",
          "title": "Agents",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 1,
          "title": "Model calls by agent/outcome (rate)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (agent, outcome) (rate(zuno_model_calls_total{agent=~\"$agent\"}[5m]))",
              "legendFormat": "{{`{{agent}}`}} ({{`{{outcome}}`}})"
            }
          ]
        },
        {
          "id": 2,
          "title": "Per-agent model-call success ratio (includes provider fallbacks)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "thresholds": {
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.999
                  }
                ]
              },
              "links": [
                {
                  "title": "View slow agent turns in Tempo",
                  "url": "/explore?left=%7B%22datasource%22%3A%22tempo%22%2C%22queries%22%3A%5B%7B%22queryType%22%3A%22traceql%22%2C%22query%22%3A%22%7Bname%3D%5C%22RunWorkflow%3AGraphTraversalWorkflow%5C%22%20%26%26%20duration%20%3E%2010s%7D%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22%24%7B__from%7D%22%2C%22to%22%3A%22%24%7B__to%7D%22%7D%7D",
                  "targetBlank": true
                }
              ]
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (agent) (rate(zuno_model_calls_total{agent=~\"$agent\", outcome=\"success\"}[5m])) / sum by (agent) (rate(zuno_model_calls_total{agent=~\"$agent\"}[5m]))",
              "legendFormat": "{{`{{agent}}`}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Error budget burn rate (1h vs 6h windows, UnifAI sessions, all agents)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 6
                  },
                  {
                    "color": "red",
                    "value": 14.4
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(1 - (sum(rate(mas_session_duration_seconds_count{mas_outcome=\"ok\"}[1h])) / sum(rate(mas_session_duration_seconds_count[1h])))) / 0.001",
              "legendFormat": "burn rate (1h, fast)"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(1 - (sum(rate(mas_session_duration_seconds_count{mas_outcome=\"ok\"}[6h])) / sum(rate(mas_session_duration_seconds_count[6h])))) / 0.001",
              "legendFormat": "burn rate (6h, slow)"
            }
          ]
        },
        {
          "id": 1016,
          "type": "row",
          "title": "MCP tools",
          "collapsed": true,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "panels": [
            {
              "id": 4,
              "title": "MCP tool invocations (rate, by tool/outcome)",
              "type": "timeseries",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 0
              },
              "fieldConfig": {
                "defaults": {
                  "links": [
                    {
                      "title": "View tool_invoke error traces in Tempo",
                      "url": "/explore?left=%7B%22datasource%22%3A%22tempo%22%2C%22queries%22%3A%5B%7B%22queryType%22%3A%22traceql%22%2C%22query%22%3A%22%7Bname%3D%5C%22tool_invoke%5C%22%20%26%26%20status%3Derror%7D%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22%24%7B__from%7D%22%2C%22to%22%3A%22%24%7B__to%7D%22%7D%7D",
                      "targetBlank": true
                    }
                  ]
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum by (tool, outcome) (rate(zuno_tool_invocations_total{tool=~\"$tool\", mcp_server=~\"$mcp_server\"}[5m]))",
                  "legendFormat": "{{`{{tool}}`}} ({{`{{outcome}}`}})"
                }
              ]
            },
            {
              "id": 5,
              "title": "Denied invocations (rate, by tool/capability)",
              "type": "timeseries",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 0
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum by (tool, capability) (rate(zuno_tool_invocations_total{outcome=\"denied\", tool=~\"$tool\", mcp_server=~\"$mcp_server\"}[5m]))",
                  "legendFormat": "{{`{{tool}}`}} / {{`{{capability}}`}}"
                }
              ]
            },
            {
              "id": 6,
              "title": "Non-allowed ratio",
              "type": "stat",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 4,
                "w": 6,
                "x": 0,
                "y": 8
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit",
                  "thresholds": {
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "orange",
                        "value": 0.02
                      },
                      {
                        "color": "red",
                        "value": 0.1
                      }
                    ]
                  }
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum(rate(zuno_tool_invocations_total{outcome=~\"denied|error|unknown_tool\", tool=~\"$tool\", mcp_server=~\"$mcp_server\"}[5m])) / sum(rate(zuno_tool_invocations_total{tool=~\"$tool\", mcp_server=~\"$mcp_server\"}[5m]))"
                }
              ]
            },
            {
              "id": 7,
              "title": "Traffic by MCP server (rate)",
              "type": "timeseries",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 18,
                "x": 6,
                "y": 8
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum by (mcp_server) (rate(zuno_tool_invocations_total{mcp_server=~\"$mcp_server\"}[5m]))",
                  "legendFormat": "{{`{{mcp_server}}`}}"
                }
              ]
            }
          ]
        },
        {
          "id": 1017,
          "type": "row",
          "title": "RAG",
          "collapsed": true,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 18
          },
          "panels": [
            {
              "id": 8,
              "title": "RAG searches (rate, by outcome/source type)",
              "type": "timeseries",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 0
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "reqps",
                  "links": [
                    {
                      "title": "View slow rag.search traces in Tempo",
                      "url": "/explore?left=%7B%22datasource%22%3A%22tempo%22%2C%22queries%22%3A%5B%7B%22queryType%22%3A%22traceql%22%2C%22query%22%3A%22%7Bname%3D%5C%22rag.search%5C%22%20%26%26%20duration%20%3E%202s%7D%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22%24%7B__from%7D%22%2C%22to%22%3A%22%24%7B__to%7D%22%7D%7D",
                      "targetBlank": true
                    }
                  ]
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum by (rag_outcome, rag_source_type) (rate(rag_search_duration_seconds_count[5m]))",
                  "legendFormat": "{{`{{rag_outcome}}`}} ({{`{{rag_source_type}}`}})"
                }
              ]
            },
            {
              "id": 9,
              "title": "RAG search latency (p50/p95, seconds)",
              "type": "timeseries",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 0
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "histogram_quantile(0.50, sum by (le) (rate(rag_search_duration_seconds_bucket[5m])))",
                  "legendFormat": "p50"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "histogram_quantile(0.95, sum by (le) (rate(rag_search_duration_seconds_bucket[5m])))",
                  "legendFormat": "p95"
                }
              ]
            },
            {
              "id": 12,
              "title": "RAG search error ratio",
              "type": "stat",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 4,
                "w": 6,
                "x": 18,
                "y": 8
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit",
                  "thresholds": {
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "orange",
                        "value": 0.02
                      },
                      {
                        "color": "red",
                        "value": 0.1
                      }
                    ]
                  }
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum(rate(rag_search_duration_seconds_count{rag_outcome=\"error\"}[5m])) / sum(rate(rag_search_duration_seconds_count[5m]))"
                }
              ]
            }
          ]
        },
        {
          "id": 1018,
          "type": "row",
          "title": "Traces",
          "collapsed": true,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 19
          },
          "panels": [
            {
              "id": 13,
              "title": "Traces: slow agent turns (RunWorkflow >10s)",
              "type": "table",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 0
              },
              "targets": [
                {
                  "datasource": {
                    "type": "tempo",
                    "uid": "tempo"
                  },
                  "queryType": "traceql",
                  "query": "{name=\"RunWorkflow:GraphTraversalWorkflow\" && duration > 10s}",
                  "limit": 20,
                  "tableType": "traces",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 14,
              "title": "Traces: tool_invoke errors",
              "type": "table",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 0
              },
              "targets": [
                {
                  "datasource": {
                    "type": "tempo",
                    "uid": "tempo"
                  },
                  "queryType": "traceql",
                  "query": "{name=\"tool_invoke\" && status=error}",
                  "limit": 20,
                  "tableType": "traces",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 15,
              "title": "Traces: slow rag.search (>2s)",
              "type": "table",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "gridPos": {
                "h": 8,
                "w": 24,
                "x": 0,
                "y": 8
              },
              "targets": [
                {
                  "datasource": {
                    "type": "tempo",
                    "uid": "tempo"
                  },
                  "queryType": "traceql",
                  "query": "{name=\"rag.search\" && duration > 2s}",
                  "limit": 20,
                  "tableType": "traces",
                  "refId": "A"
                }
              ]
            }
          ]
        }
      ]
    }
{{- end }}
