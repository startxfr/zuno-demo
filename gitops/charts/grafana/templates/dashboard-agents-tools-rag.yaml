          "spec": {
            "id": 11,
            "title": "Freshness alerts firing",
            "description": "",
            "links": [],
            "data": {
              "kind": "QueryGroup",
              "spec": {
                "queries": [
                  {
                    "kind": "PanelQuery",
                    "spec": {
                      "query": {
                        "kind": "DataQuery",
                        "group": "prometheus",
                        "version": "v0",
                        "datasource": {
                          "name": "prometheus"
                        },
                        "spec": {
                          "expr": "sum(ALERTS{alertname=~\"RagFreshnessLagExceeded.*\", alertstate=\"firing\"}) or vector(0)"
                        }
                      },
                      "refId": "A",
                      "hidden": false
                    }
                  }
                ],
                "transformations": [],
                "queryOptions": {}
              }
            },
            "vizConfig": {
              "kind": "VizConfig",
              "group": "stat",
              "version": "",
              "spec": {
                "options": {},
                "fieldConfig": {
                  "defaults": {
                    "unit": "short",
                    "thresholds": {
                      "mode": "",
                      "steps": [
                        {
                          "value": null,
                          "color": "green"
                        },
                        {
                          "value": 1,
                          "color": "red"
                        }
                      ]
                    }
                  },
                  "overrides": []
                }
              }
            }
          }
        },
