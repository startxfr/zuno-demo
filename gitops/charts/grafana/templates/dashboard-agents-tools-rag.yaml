{{- if .Values.grafana.enabled }}
# ADR-0413: NEW dashboard - the agent-path SLO at per-agent granularity
# (ADR-0102), MCP tool authorization outcomes (ADR-0011/ADR-0036 - denied
# calls included, not just successes) and RAG search/freshness health
# (ADR-0050/ADR-0109). zuno_tool_invocations_total, zuno_rag_searches_total,
# zuno_rag_result_count_bucket and zuno_rag_freshness_lag_seconds_{sum,count}
# are all already flowing with real series - unlike the model-call duration
# histogram, these were simply never put on a dashboard before, not blocked
# on a redeploy.
#
# Layout reworked 2026-09-02 into rows using the CLASSIC schema's native
# "row" panel type (type: row, collapsed: true/false), NOT Grafana's v2
# schema - a first attempt at row-grouping via the v2 "Dashboard" schema
# (elements/layout/vizConfig) broke every one of these dashboards'
# GitOps sync: grafana-operator v5.24.0 posts spec.json to the classic
# /api/dashboards/db endpoint, which rejects a v2-format body outright,
# and even a correctly-wrapped v2 body ({"apiVersion":...,"kind":
# "Dashboard","spec":{...}}) still gets rejected for any dashboard that
# already exists ("must not include an id on the root element" - the
# operator injects the dashboard's known internal id on every update).
# That whole attempt was reverted (see git history). The classic "row"
# panel type below was live-verified against this same endpoint first
# (a throwaway probe dashboard, both an expanded and a collapsed row)
# before being applied here - no known incompatibility with this
# operator version.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: agents-tools-rag
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "26"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  uid: zuno-agents-tools-rag
  folder: "Zuno Platform"
  json: |
    {
      "uid": "zuno-agents-tools-rag",
      "title": "Agents, tools & RAG",
      "description": "ADR-0102/ADR-0011/ADR-0036/ADR-0050/ADR-0109/ADR-0413: per-agent SLO/error budget, MCP tool authorization outcomes, RAG search and freshness health.",
      "tags": [
        "zuno",
        "agents",
        "mcp",
        "rag",
        "slo"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "links": [
        {
          "type": "dashboards",
          "tags": [
            "zuno"
          ],
          "asDropdown": true,
          "keepTime": true,
          "title": "Zuno dashboards"
        }
      ],
      "templating": {
        "list": [
          {
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(zuno_bff_requests_total, agent)",
            "hide": 0,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "name": "agent",
            "options": [],
            "query": "label_values(zuno_bff_requests_total, agent)",
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "type": "query"
          },
          {
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(zuno_tool_invocations_total, tool)",
            "hide": 0,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "name": "tool",
            "options": [],
            "query": "label_values(zuno_tool_invocations_total, tool)",
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "type": "query"
          },
          {
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(zuno_tool_invocations_total, mcp_server)",
            "hide": 0,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "name": "mcp_server",
            "options": [],
            "query": "label_values(zuno_tool_invocations_total, mcp_server)",
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "type": "query"
          },
          {
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(zuno_rag_freshness_lag_seconds_count, domain)",
            "hide": 0,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "name": "domain",
            "options": [],
            "query": "label_values(zuno_rag_freshness_lag_seconds_count, domain)",
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "panels": [
        {
          "id": 1015,
          "type": "row",
          "title": "Agents",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 1,
          "title": "BFF requests by agent/code (rate)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (agent, code) (rate(zuno_bff_requests_total{agent=~\"$agent\"}[5m]))",
              "legendFormat": "{{`{{agent}}`}} ({{`{{code}}`}})"
            }
          ]
        },
        {
          "id": 2,
          "title": "Per-agent success ratio (ADR-0102 shape)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "thresholds": {
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.999
                  }
                ]
              },
              "links": [
                {
                  "title": "View slow agent_graph_run traces in Tempo",
                  "url": "/explore?left=%7B%22datasource%22%3A%22tempo%22%2C%22queries%22%3A%5B%7B%22queryType%22%3A%22traceql%22%2C%22query%22%3A%22%7Bname%3D%5C%22agent_graph_run%5C%22%20%26%26%20duration%20%3E%2010s%7D%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22%24%7B__from%7D%22%2C%22to%22%3A%22%24%7B__to%7D%22%7D%7D",
                  "targetBlank": true
                }
              ]
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (agent) (rate(zuno_bff_requests_total{agent=~\"$agent\", code!~\"5..\"}[5m])) / sum by (agent) (rate(zuno_bff_requests_total{agent=~\"$agent\"}[5m]))",
              "legendFormat": "{{`{{agent}}`}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Error budget burn rate (1h vs 6h windows, filtered by agent)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 6
                  },
                  {
                    "color": "red",
                    "value": 14.4
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(1 - (sum(rate(zuno_bff_requests_total{agent=~\"$agent\", code!~\"5..\"}[1h])) / sum(rate(zuno_bff_requests_total{agent=~\"$agent\"}[1h])))) / 0.001",
              "legendFormat": "burn rate (1h, fast)"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(1 - (sum(rate(zuno_bff_requests_total{agent=~\"$agent\", code!~\"5..\"}[6h])) / sum(rate(zuno_bff_requests_total{agent=~\"$agent\"}[6h])))) / 0.001",
              "legendFormat": "burn rate (6h, slow)"
            }
          ]
        },
        {
          "id": 1016,
          "type": "row",
          "title": "MCP tools",
          "collapsed": true,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "panels": [
            {
              "id": 4,
              "title": "MCP tool invocations (rate, by tool/outcome)",
              "type": "timeseries",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 0
              },
              "fieldConfig": {
                "defaults": {
                  "links": [
                    {
                      "title": "View tool_invoke error traces in Tempo",
                      "url": "/explore?left=%7B%22datasource%22%3A%22tempo%22%2C%22queries%22%3A%5B%7B%22queryType%22%3A%22traceql%22%2C%22query%22%3A%22%7Bname%3D%5C%22tool_invoke%5C%22%20%26%26%20status%3Derror%7D%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22%24%7B__from%7D%22%2C%22to%22%3A%22%24%7B__to%7D%22%7D%7D",
                      "targetBlank": true
                    }
                  ]
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum by (tool, outcome) (rate(zuno_tool_invocations_total{tool=~\"$tool\", mcp_server=~\"$mcp_server\"}[5m]))",
                  "legendFormat": "{{`{{tool}}`}} ({{`{{outcome}}`}})"
                }
              ]
            },
            {
              "id": 5,
              "title": "Denied invocations (rate, by tool/capability)",
              "type": "timeseries",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 0
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum by (tool, capability) (rate(zuno_tool_invocations_total{outcome=\"denied\", tool=~\"$tool\", mcp_server=~\"$mcp_server\"}[5m]))",
                  "legendFormat": "{{`{{tool}}`}} / {{`{{capability}}`}}"
                }
              ]
            },
            {
              "id": 6,
              "title": "Non-allowed ratio",
              "type": "stat",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 4,
                "w": 6,
                "x": 0,
                "y": 8
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit",
                  "thresholds": {
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "orange",
                        "value": 0.02
                      },
                      {
                        "color": "red",
                        "value": 0.1
                      }
                    ]
                  }
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum(rate(zuno_tool_invocations_total{outcome=~\"denied|error|unknown_tool\", tool=~\"$tool\", mcp_server=~\"$mcp_server\"}[5m])) / sum(rate(zuno_tool_invocations_total{tool=~\"$tool\", mcp_server=~\"$mcp_server\"}[5m]))"
                }
              ]
            },
            {
              "id": 7,
              "title": "Traffic by MCP server (rate)",
              "type": "timeseries",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 18,
                "x": 6,
                "y": 8
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum by (mcp_server) (rate(zuno_tool_invocations_total{mcp_server=~\"$mcp_server\"}[5m]))",
                  "legendFormat": "{{`{{mcp_server}}`}}"
                }
              ]
            }
          ]
        },
        {
          "id": 1017,
          "type": "row",
          "title": "RAG",
          "collapsed": true,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 18
          },
          "panels": [
            {
              "id": 8,
              "title": "RAG searches (rate, by outcome/provider)",
              "type": "timeseries",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 0
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "reqps",
                  "links": [
                    {
                      "title": "View slow rag_search traces in Tempo",
                      "url": "/explore?left=%7B%22datasource%22%3A%22tempo%22%2C%22queries%22%3A%5B%7B%22queryType%22%3A%22traceql%22%2C%22query%22%3A%22%7Bname%3D%5C%22rag_search%5C%22%20%26%26%20duration%20%3E%202s%7D%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22%24%7B__from%7D%22%2C%22to%22%3A%22%24%7B__to%7D%22%7D%7D",
                      "targetBlank": true
                    }
                  ]
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum by (outcome, provider) (rate(zuno_rag_searches_total[5m]))",
                  "legendFormat": "{{`{{outcome}}`}} ({{`{{provider}}`}})"
                }
              ]
            },
            {
              "id": 9,
              "title": "RAG result count (p50/p95)",
              "type": "timeseries",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 0
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "histogram_quantile(0.50, sum by (le) (rate(zuno_rag_result_count_bucket[5m])))",
                  "legendFormat": "p50"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "histogram_quantile(0.95, sum by (le) (rate(zuno_rag_result_count_bucket[5m])))",
                  "legendFormat": "p95"
                }
              ]
            },
            {
              "id": 10,
              "title": "RAG freshness lag by domain",
              "type": "timeseries",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "description": "Same shape as prometheusrule-freshness-lag.yaml's RagFreshnessLagExceeded<Domain> alerts. Per-domain objectives: tech 604800s (7d), sales 14400s (4h), adv 86400s (1d) - sxa-legacy is deliberately exempt.",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 8
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s"
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum by (domain) (rate(zuno_rag_freshness_lag_seconds_sum{domain=~\"$domain\"}[30m])) / sum by (domain) (rate(zuno_rag_freshness_lag_seconds_count{domain=~\"$domain\"}[30m]))",
                  "legendFormat": "{{`{{domain}}`}}"
                }
              ]
            },
            {
              "id": 11,
              "title": "Freshness alerts firing",
              "type": "stat",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 4,
                "w": 6,
                "x": 12,
                "y": 8
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "thresholds": {
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "red",
                        "value": 1
                      }
                    ]
                  }
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum(ALERTS{alertname=~\"RagFreshnessLagExceeded.*\", alertstate=\"firing\"}) or vector(0)"
                }
              ]
            },
            {
              "id": 12,
              "title": "RAG search error ratio",
              "type": "stat",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 4,
                "w": 6,
                "x": 18,
                "y": 8
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit",
                  "thresholds": {
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "orange",
                        "value": 0.02
                      },
                      {
                        "color": "red",
                        "value": 0.1
                      }
                    ]
                  }
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum(rate(zuno_rag_searches_total{outcome=\"error\"}[5m])) / sum(rate(zuno_rag_searches_total[5m]))"
                }
              ]
            },
            {
              "id": 16,
              "title": "Searches returning NOTHING (share)",
              "type": "stat",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "description": "Share of RAG searches that came back with zero rows. A search that finds nothing is outcome=ok, not an error - so the error-ratio stat beside this one stays green while retrieval is silently dead, and the p50/p95 panel above shows a low number rather than an alarming one. This is the shape of failure the repo has hit twice: an ingestion run reporting success while indexing nothing, and an embedding batch dropped behind a 503 that a green validate never noticed. READ THIS AS A TREND, NOT A THRESHOLD. A high baseline is currently CORRECT: knowledge.sales and knowledge.project are deliberately empty until Salesforce ingestion lands in v0.7 (ADR-0218), so every check-deal-status turn retrieves nothing by design - verified 2026-09-03, sales 0 rows against sxa-legacy 319841 and tech 68962, all three searching correctly. What matters is this line MOVING: a jump means a domain that was serving content stopped. zuno_rag_result_count carries no domain label, which is why this cannot separate the two cases on its own; the rag_search span (zuno.run_id, top_k, result_count) attributes one run, and a per-domain label on the metric is the real fix.",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 16
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit",
                  "min": 0,
                  "max": 1,
                  "thresholds": {
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "text",
                        "value": 0.0
                      }
                    ]
                  }
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "(sum(rate(zuno_rag_result_count_bucket{le=\"0.0\"}[$__rate_interval])) or vector(0)) / clamp_min(sum(rate(zuno_rag_result_count_count[$__rate_interval])), 0.0001)",
                  "legendFormat": "empty retrievals"
                }
              ]
            },
            {
              "id": 17,
              "title": "Answer grounding (zuno.source_mode)",
              "type": "piechart",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "description": "How every agent answer was grounded: indexed (RAG corpus), live (fresh verification), both, or none. This is ADR-0205's acceptance signal - 'traces show whether a response used indexed knowledge, live verification, or both' - and until now no dashboard read it, even though agent-runtime has been setting it on every agent_graph_run span since WP-24. Read it against the empty-retrieval stat beside it: they are independent measurements of the same thing from opposite ends of the pipeline, rag-service counting rows returned and agent-runtime recording what the graph actually used. Agreement is reassuring; a large 'none' slice while retrieval looks healthy, or the reverse, means one of the two is lying.",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 16
              },
              "transformations": [
                {
                  "id": "groupBy",
                  "options": {
                    "fields": {
                      "zuno.source_mode": {
                        "aggregations": [],
                        "operation": "groupby"
                      },
                      "zuno.latency_ms": {
                        "aggregations": [
                          "count"
                        ],
                        "operation": "aggregate"
                      }
                    }
                  }
                }
              ],
              "options": {
                "legend": {
                  "displayMode": "table",
                  "placement": "right",
                  "values": [
                    "value",
                    "percent"
                  ]
                },
                "pieType": "donut"
              },
              "targets": [
                {
                  "datasource": {
                    "type": "tempo",
                    "uid": "tempo"
                  },
                  "queryType": "traceql",
                  "query": "{name=\"agent_graph_run\" && span.zuno.agent=~\"$agent\"} | select(span.zuno.source_mode, span.zuno.latency_ms)",
                  "limit": 200,
                  "tableType": "traces",
                  "refId": "A"
                }
              ]
            }
          ]
        },
        {
          "id": 1018,
          "type": "row",
          "title": "Traces",
          "collapsed": true,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 19
          },
          "panels": [
            {
              "id": 13,
              "title": "Traces: slow agent_graph_run (>10s)",
              "type": "table",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "gridPos": {
