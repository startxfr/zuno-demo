{{- if .Values.grafana.enabled }}
# ADR-0534/WP-113: the TrustyAI evaluation/guardrails chain's ONLY UI
# surface. The RHOAI dashboard shows none of this chain's artifacts on
# this release train (its "Model monitoring bias" card is the unrelated
# predictive TrustyAIService, deliberately unconfigured - see ADR-0534's
# Operational considerations), so this dashboard is where a human sees
# the chain live. Series origins:
#   zuno_guardrails_*        agent-runtime OTel counters (WP-113)
#   zuno_ragas_score         one-shot gauge pushed by ragas_eval.py
#   zuno_garak_attack_success_rate
#                            one-shot gauge pushed after a garak scan
#   kube_job_* / kube_pod_*  kube-state-metrics (already scraped)
# The one-shot gauges only exist in the scrape window right after a run;
# score panels therefore read last_over_time() so the most recent run
# stays visible between runs. Classic schemaVersion 39 + "row" panels,
# same constraint as every dashboard here (v2 schema is rejected by
# grafana-operator v5.24.0 - see dashboard-gitops.yaml's header).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: trustyai
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "26"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  uid: zuno-trustyai
  folder: "Zuno Platform"
  json: |
    {
      "uid": "zuno-trustyai",
      "title": "TrustyAI evaluation & guardrails",
      "description": "ADR-0534/WP-113: observe-only guardrails detections on real agent traffic, evaluation job outcomes, and the latest RAGAS/Garak scores. Detections never block a response - that asymmetry is the observe-only contract.",
      "tags": [
        "zuno",
        "trustyai",
        "guardrails"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "links": [
        {
          "type": "dashboards",
          "tags": [
            "zuno"
          ],
          "asDropdown": true,
          "keepTime": true,
          "title": "Zuno dashboards"
        }
      ],
      "panels": [
        {
          "id": 1001,
          "type": "row",
          "title": "Guardrails (observe-only)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 1,
          "title": "Exchanges evaluated, by outcome",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Every completed agent exchange is observed by the guardrails hook (agent-runtime). outcome=detected means something was flagged AND the response was still delivered unmodified.",
          "gridPos": {
            "h": 8,
            "w": 9,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 20,
                "stacking": {
                  "mode": "normal"
                }
              }
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (outcome) (increase(zuno_guardrails_evaluations_total[$__rate_interval]))",
              "legendFormat": "{{`{{outcome}}`}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Detections, by detection name",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "One series per detection class per agent. Since the ADR-0540 backend flip (2026-09-03) the names come from the NeMo rails policy - email, us-social-security-number, credit-card, and injection-ignore-instructions / -disregard-rules / -persona-override / -pretend-unrestricted / -system-prompt-leak. Series before that date are NOT comparable: the builtin detector reported all five injection heuristics under one custom-regex label, so what reads as a drop in custom-regex is that one series splitting into five, not detections falling.",
          "gridPos": {
            "h": 8,
            "w": 9,
            "x": 9,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 20,
                "stacking": {
                  "mode": "normal"
                }
              }
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (detection, agent) (increase(zuno_guardrails_detections_total[$__rate_interval]))",
              "legendFormat": "{{`{{detection}}`}} ({{`{{agent}}`}})"
            }
          ]
        },
        {
          "id": 3,
          "title": "Detection rate (window)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Share of evaluated exchanges that raised at least one detection over the dashboard window. Observe-only: this measures the detectors, it gates nothing.",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.2
                  },
                  {
                    "color": "red",
                    "value": 0.5
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(zuno_guardrails_evaluations_total{outcome=\"detected\"}[$__range])) / clamp_min(sum(increase(zuno_guardrails_evaluations_total[$__range])), 1)"
            }
          ]
        },
        {
          "id": 8,
          "title": "Observer unavailable (share)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Share of exchanges where the observer could not be reached at all. This catches TRANSPORT failure only - a dead Service, a NetworkPolicy, a wrong URL. It does NOT catch the observer answering happily and finding nothing, which is what every WP-120 contract defect looked like. Read it together with the two panels beside it: unavailable high = the observer is down; unavailable zero AND detections permanently flat = the observer is answering but its contract is broken.",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.1
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(sum(increase(zuno_guardrails_evaluations_total{outcome=\"unavailable\"}[$__range])) or vector(0)) / clamp_min(sum(increase(zuno_guardrails_evaluations_total[$__range])), 1)"
            }
          ]
        },
        {
          "id": 9,
          "title": "Coverage: exchanges observed vs agent traffic",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "The observer is fire-and-forget and disables itself SILENTLY when its backend URL is unset or half-configured - observe_exchange returns before making any call, so nothing errors and nothing is recorded. That failure produces no unavailable outcome and no log line: the evaluations series simply flatlines while agent traffic continues. The two lines diverging IS the signal. They are not expected to be equal - most BFF requests are not chat turns, and evaluations lag by the length of the exchange - but observed traffic falling to zero while BFF traffic continues means the hook stopped running. Traffic is read from zuno_bff_request_duration_ms_milliseconds_count, NOT zuno_bff_requests_total: the latter deliberately records one point PER KEYCLOAK GROUP (see agent-bff RecordRequest), so a user in twelve groups counts as twelve requests. The histogram count is not broken out that way and is the only true request count on this platform - live, arkos reads 777 against a true 755.",
          "gridPos": {
            "h": 8,
            "w": 10,
            "x": 8,
            "y": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "fillOpacity": 10
              }
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(zuno_guardrails_evaluations_total[$__rate_interval]))",
              "legendFormat": "exchanges observed"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(zuno_bff_request_duration_ms_milliseconds_count{code!~\"5..\"}[$__rate_interval]))",
              "legendFormat": "agent traffic (non-5xx BFF)"
            }
          ]
        },
        {
          "id": 10,
          "title": "Watchdog: observed, never detected (24h)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "1 = the observer ran over the last 24h and found NOTHING, not once. This is the exact signature of every contract defect WP-120 found: a wrong ConfigMap key, options at the wrong nesting level, a missing model field, a log parsed one level too shallow. All four returned HTTP 200 and zero detections, so the detections panel went flat and every other panel stayed green. On real traffic a permanent zero is implausible - the eight classes include an email regex - so treat a sustained 1 as a broken observer until proven otherwise, NOT as clean traffic. 0 = either a detection landed (the chain is demonstrably working end to end) or fewer than 20 exchanges were observed in the window. That floor is deliberate: with a handful of exchanges 'no detections' carries no information, and a watchdog that cries wolf on quiet days is one people learn to ignore. Both sides carry `or vector(0)` so a metric that has never been written once reads as a real 0 rather than No data - an alert panel that goes blank when the thing it watches has never run is worse than useless.",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "max": 1,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "detecting",
                      "color": "green",
                      "index": 0
                    },
                    "1": {
                      "text": "SILENT",
                      "color": "red",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "((sum(increase(zuno_guardrails_evaluations_total[24h])) or vector(0)) > bool 20) - ((sum(increase(zuno_guardrails_detections_total[24h])) or vector(0)) > bool 0)"
            }
          ]
        },
        {
          "id": 1002,
          "type": "row",
          "title": "Evaluation jobs",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "panels": []
        },
        {
          "id": 4,
          "title": "Garak / RAGAS job outcomes",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "kube-state-metrics view of the trustyai-config evaluation Jobs (gitops/charts/trustyai-config). 1 under succeeded/failed means that outcome.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 18
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (job_name) (kube_job_status_succeeded{namespace=\"zuno-ai-run\", job_name=~\"garak.*|ragas.*\"})",
              "format": "table",
              "instant": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (job_name) (kube_job_status_failed{namespace=\"zuno-ai-run\", job_name=~\"garak.*|ragas.*\"})",
              "format": "table",
              "instant": true,
              "refId": "B"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "job_name": "job",
                  "Value #A": "succeeded",
                  "Value #B": "failed"
                }
              }
            }
          ]
        },
        {
          "id": 5,
          "title": "LM-Eval pod activity (mmlu benchmarks)",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "LMEvalJob CR results (status.results, the benchmark scores) have no Prometheus path on this platform - pod phase is the dashboard-visible signal; scores stay in `oc get lmevaljob -o yaml` / make d3 check trustyai-config.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 18
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod, phase) (kube_pod_status_phase{namespace=\"zuno-ai-run\", pod=~\".*mmlu.*\"} > 0)",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true
                }
              }
            }
          ]
        },
        {
          "id": 1003,
          "type": "row",
          "title": "Scores (latest run)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 26
          },
          "panels": []
        },
        {
          "id": 6,
          "title": "RAGAS scores (real rag-service retrievals)",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "faithfulness = answer grounded in retrieved contexts; llm_context_precision = retrieved contexts relevant to the question. Judged by the local qwen3.6 model against live pgvector retrievals. Pushed once per ragas-eval run; last_over_time keeps the latest run visible.",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 27
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.5
                  },
                  {
                    "color": "green",
                    "value": 0.8
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (metric, question) (last_over_time(zuno_ragas_score[30d]))",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value": "score"
                }
              }
            }
          ]
        },
        {
          "id": 7,
          "title": "Garak attack success rate (jailbreak probes)",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "1 - passed/total per probe/detector from the last garak security scan (dan.Dan_11_0, dan.DUDE vs the newest fine-tune). Higher is WORSE: 1.0 on mitigation.MitigationBypass means the model never voiced an explicit refusal - the WP-109 open finding, now permanently visible.",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 27
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.2
                  },
                  {
                    "color": "red",
                    "value": 0.6
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (probe, detector, model) (last_over_time(zuno_garak_attack_success_rate[30d]))",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value": "attack success rate"
                }
              }
            }
          ]
        }
      ]
    }
{{- end }}
