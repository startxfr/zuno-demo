{{- if .Values.grafana.enabled }}
# Identity the oauth-proxy sidecar (templates/grafana.yaml) runs as. The
# redirectreference annotation makes OpenShift's OAuth server treat this
# ServiceAccount as an implicit OAuthClient, validated against the named
# Route (templates/grafana.yaml's spec.route, named "grafana-route") - no
# separate cluster-scoped OAuthClient object needed. A dedicated
# ServiceAccount (not the operator-managed "grafana-sa") so this annotation
# survives the operator reconciling its own default SA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-oauth-proxy
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"grafana-route"}}
{{- end }}
