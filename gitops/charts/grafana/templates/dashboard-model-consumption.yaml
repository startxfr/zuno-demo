{{- if .Values.grafana.enabled }}
# ADR-0029's "measure tokens, cost, latency and decisions by user, agent,
# task, model and provider" acceptance bullet, finally rendered somewhere -
# see gitops/charts/grafana/README.md for why nothing did this before.
# Metric names are the OTel Collector's Prometheus-exporter normalization
# (dots to underscores, "_total" appended to monotonic counters - the same
# normalization docs/platform/slo.md already confirmed live for
# zuno_bff_requests_total) of the counters
# components/ai-gateway/app/telemetry.py registers.
#
# zuno_model_call_duration_ms_bucket (panel 5) requires ai-gateway rebuilt
# and redeployed with its new duration histogram - empty until then.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: model-consumption
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  uid: zuno-model-consumption
  folder: "Zuno Platform"
  json: |
    {
      "uid": "zuno-model-consumption",
      "title": "Model consumption",
      "description": "ADR-0029: model calls, tokens, estimated cost, latency and BFF request volume by provider/model/agent.",
      "tags": ["zuno", "adr-0029"],
      "timezone": "browser",
      "schemaVersion": 39,
      "time": {"from": "now-6h", "to": "now"},
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Model calls (rate, by provider/model/outcome)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (provider, model, outcome) (rate(zuno_model_calls_total[5m]))",
              "legendFormat": "{{`{{provider}}`}}/{{`{{model}}`}} ({{`{{outcome}}`}})"
            }
          ]
        },
        {
          "id": 2,
          "title": "Tokens consumed (rate, by kind)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (provider, model, kind) (rate(zuno_model_tokens_total[5m]))",
              "legendFormat": "{{`{{provider}}`}}/{{`{{model}}`}} ({{`{{kind}}`}})"
            }
          ]
        },
        {
          "id": 3,
          "title": "Estimated cost (USD/s, by provider and model)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "fieldConfig": {"defaults": {"unit": "currencyUSD"}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (provider, model) (rate(zuno_model_cost_usd_total[5m]))",
              "legendFormat": "{{`{{provider}}`}}/{{`{{model}}`}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "BFF requests (rate, by agent)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (agent, code) (rate(zuno_bff_requests_total[5m]))",
              "legendFormat": "{{`{{agent}}`}} ({{`{{code}}`}})"
            }
          ]
        },
        {
          "id": 5,
          "title": "Latency p50/p95 (by provider/model)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "fieldConfig": {"defaults": {"unit": "ms"}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "histogram_quantile(0.50, sum by (le, provider, model) (rate(zuno_model_call_duration_ms_bucket[5m])))",
              "legendFormat": "p50 {{`{{provider}}`}}/{{`{{model}}`}}"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "histogram_quantile(0.95, sum by (le, provider, model) (rate(zuno_model_call_duration_ms_bucket[5m])))",
              "legendFormat": "p95 {{`{{provider}}`}}/{{`{{model}}`}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Semantic cache lookups (rate, by outcome)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (outcome) (rate(zuno_semantic_cache_lookups_total[5m]))",
              "legendFormat": "{{`{{outcome}}`}}"
            }
          ]
        },
        {
          "id": 7,
          "title": "Error ratio",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 24},
          "fieldConfig": {"defaults": {"unit": "percentunit", "thresholds": {"steps": [
            {"color": "green", "value": null}, {"color": "orange", "value": 0.02}, {"color": "red", "value": 0.1}
          ]}}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(rate(zuno_model_calls_total{outcome=\"error\"}[5m])) / sum(rate(zuno_model_calls_total[5m]))"
            }
          ]
        },
        {
          "id": 8,
          "title": "Total model call volume",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 24},
          "fieldConfig": {"defaults": {"unit": "reqps"}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(rate(zuno_model_calls_total[5m]))"
            }
          ]
        }
      ]
    }
{{- end }}
