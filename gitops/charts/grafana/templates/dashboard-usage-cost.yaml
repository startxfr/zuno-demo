{{- if .Values.grafana.enabled }}
# ADR-0413: replaces dashboard-user-consumption.yaml with the same six
# panels (ADR-0029's "by user" bullet: user/group breakdowns of calls,
# cost, tokens, API requests) plus a cost-analytics row, now with
# user/group/agent/model/provider filter variables and a real
# dashboard-time-range window. The old dashboard's queries used a fixed
# rate(...[1h]) regardless of the dashboard's own 24h time picker - the
# panels below use increase(...[$__range]) instead so the time picker
# actually governs the window (a deliberate behavior change from the
# retired dashboard, not a preserved quirk). topk(20, ...) still bounds
# panel cardinality against a growing user base. Still empty until
# components/ai-gateway and components/agent-bff are rebuilt/redeployed
# with their user/group labels - same live-verification gap the retired
# dashboard's header noted.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: usage-cost
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "26"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  uid: zuno-usage-cost
  folder: "Zuno Platform"
  json: |
    {
      "uid": "zuno-usage-cost",
      "title": "Usage & cost",
      "description": "ADR-0029/ADR-0413: model calls/tokens/cost and API requests by user and Keycloak group, filterable by user/group/agent/model/provider.",
      "tags": ["zuno", "adr-0029", "usage", "cost", "adr-0413"],
      "timezone": "browser",
      "schemaVersion": 39,
      "time": {"from": "now-24h", "to": "now"},
      "refresh": "30s",
      "links": [
        {"type": "dashboards", "tags": ["zuno"], "asDropdown": true, "keepTime": true, "title": "Zuno dashboards"}
      ],
      "templating": {"list": [
        {
          "current": {"text": "All", "value": "$__all"},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "definition": "label_values(zuno_model_calls_total, user)",
          "hide": 0, "includeAll": true, "allValue": ".*", "multi": true,
          "name": "user", "options": [],
          "query": "label_values(zuno_model_calls_total, user)",
          "refresh": 2, "regex": "", "sort": 1, "type": "query"
        },
        {
          "current": {"text": "All", "value": "$__all"},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "definition": "label_values(zuno_model_calls_total, group)",
          "hide": 0, "includeAll": true, "allValue": ".*", "multi": true,
          "name": "group", "options": [],
          "query": "label_values(zuno_model_calls_total, group)",
          "refresh": 2, "regex": "", "sort": 1, "type": "query"
        },
        {
          "current": {"text": "All", "value": "$__all"},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "definition": "label_values(zuno_bff_requests_total, agent)",
          "hide": 0, "includeAll": true, "allValue": ".*", "multi": true,
          "name": "agent", "options": [],
          "query": "label_values(zuno_bff_requests_total, agent)",
          "refresh": 2, "regex": "", "sort": 1, "type": "query"
        },
        {
          "current": {"text": "All", "value": "$__all"},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "definition": "label_values(zuno_model_calls_total, model)",
          "hide": 0, "includeAll": true, "allValue": ".*", "multi": true,
          "name": "model", "options": [],
          "query": "label_values(zuno_model_calls_total, model)",
          "refresh": 2, "regex": "", "sort": 1, "type": "query"
        },
        {
          "current": {"text": "All", "value": "$__all"},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "definition": "label_values(zuno_model_calls_total, provider)",
          "hide": 0, "includeAll": true, "allValue": ".*", "multi": true,
          "name": "provider", "options": [],
          "query": "label_values(zuno_model_calls_total, provider)",
          "refresh": 2, "regex": "", "sort": 1, "type": "query"
        }
      ]},
      "panels": [
        {
          "id": 1,
          "title": "Model calls (top 20 users, over range)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "topk(20, sum by (user) (increase(zuno_model_calls_total{user=~\"$user\", model=~\"$model\", provider=~\"$provider\"}[$__range])))", "legendFormat": "{{`{{user}}`}}"}
          ]
        },
        {
          "id": 2,
          "title": "Model calls (by group, over range)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (group) (increase(zuno_model_calls_total{group=~\"$group\", model=~\"$model\", provider=~\"$provider\"}[$__range]))", "legendFormat": "{{`{{group}}`}}"}
          ]
        },
        {
          "id": 3,
          "title": "Estimated cost (top 20 users, over range)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "fieldConfig": {"defaults": {"unit": "currencyUSD"}},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "topk(20, sum by (user) (increase(zuno_model_cost_usd_total{user=~\"$user\", model=~\"$model\", provider=~\"$provider\"}[$__range])))", "legendFormat": "{{`{{user}}`}}"}
          ]
        },
        {
          "id": 4,
          "title": "Tokens consumed (by group/kind, over range)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (group, kind) (increase(zuno_model_tokens_total{group=~\"$group\", model=~\"$model\", provider=~\"$provider\"}[$__range]))", "legendFormat": "{{`{{group}}`}} ({{`{{kind}}`}})"}
          ]
        },
        {
          "id": 5,
          "title": "API requests (top 20 users, over range)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "topk(20, sum by (user) (increase(zuno_bff_requests_total{user=~\"$user\", agent=~\"$agent\"}[$__range])))", "legendFormat": "{{`{{user}}`}}"}
          ]
        },
        {
          "id": 6,
          "title": "API requests (by group/agent, over range)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (group, agent) (increase(zuno_bff_requests_total{group=~\"$group\", agent=~\"$agent\"}[$__range]))", "legendFormat": "{{`{{group}}`}} / {{`{{agent}}`}}"}
          ]
        },
        {
          "id": 7,
          "title": "Cost by provider/model (over range)",
          "type": "piechart",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
          "fieldConfig": {"defaults": {"unit": "currencyUSD"}},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (provider, model) (increase(zuno_model_cost_usd_total{provider=~\"$provider\", model=~\"$model\"}[$__range]))", "legendFormat": "{{`{{provider}}`}}/{{`{{model}}`}}"}
          ]
        },
        {
          "id": 8,
          "title": "Hourly spend (by provider)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24},
          "fieldConfig": {"defaults": {"unit": "currencyUSD"}},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (provider) (increase(zuno_model_cost_usd_total{provider=~\"$provider\"}[1h]))", "legendFormat": "{{`{{provider}}`}}"}
          ]
        },
        {
          "id": 9,
          "title": "Top token consumers (over range)",
          "type": "table",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 32},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "topk(20, sum by (user) (increase(zuno_model_tokens_total{user=~\"$user\"}[$__range])))", "format": "table", "instant": true}
          ]
        }
      ]
    }
{{- end }}
