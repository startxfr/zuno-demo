{{- if .Values.grafana.enabled }}
# ADR-0413: replaces dashboard-user-consumption.yaml with the same six
# panels (ADR-0029's "by user" bullet: user/group breakdowns of calls,
# cost, tokens, API requests) plus a cost-analytics row, now with
# user/group/agent/model/provider filter variables and a real
# dashboard-time-range window. The old dashboard's queries used a fixed
# rate(...[1h]) regardless of the dashboard's own 24h time picker - the
# panels below use increase(...[$__range]) instead so the time picker
# actually governs the window (a deliberate behavior change from the
# retired dashboard, not a preserved quirk). topk(20, ...) still bounds
# panel cardinality against a growing user base. The user/group labels
# were confirmed live 2026-08-22 (this comment previously said the
# dashboard was still empty pending an ai-gateway/agent-bff redeploy -
# that redeploy had already happened; don't trust this file's own history
# without a live Thanos check first).
#
# Panels 10-11 (added 2026-08-22): an agent dimension on
# zuno_model_cost_usd_total/zuno_model_tokens_total, closing ADR-0029's
# "by user, agent, task, model and provider" bullet - ai-gateway's
# model_call_span() previously received caller_sub/groups but never the
# X-Zuno-Agent header agent-runtime already sends on every call (only used
# for routing/adapter lookups until now). Requires the same rebuild/
# redeploy of ai-gateway as any other telemetry.py change.
#
# Layout reworked 2026-09-02 into collapsible rows (same treatment as
# dashboard-data.yaml, exported from Grafana's UI and converted to its
# "Dashboard v2" schema by Grafana's own v2beta1 API - see dashboard-
# data.yaml's header for why that's safe against this cluster's
# grafana-operator v5.24.0 / Grafana 13.0.1). Row grouping and panel
# content otherwise unchanged from the classic-schema version.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: usage-cost
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "26"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  uid: zuno-usage-cost
  folder: "Zuno Platform"
  # grafana-operator posts spec.json to the classic /api/dashboards/db
  # endpoint, which rejects a bare v2-schema body with a 400
  # ("dashboard appears to be in v2 format... include an object wrapper
  # with an explicit apiVersion and move the body into a spec element")
  # - confirmed live 2026-09-02 by probing that endpoint directly with
  # both the bare and the wrapped form. The apiVersion/kind/spec
  # envelope below is that required wrapper, not part of the dashboard
  # model itself.
  json: |
    {
      "apiVersion": "dashboard.grafana.app/v2beta1",
      "kind": "Dashboard",
      "spec":
        {
          "annotations": [
            {
              "kind": "AnnotationQuery",
              "spec": {
                "query": {
                  "kind": "DataQuery",
                  "group": "grafana",
                  "version": "v0",
                  "datasource": {
                    "name": "-- Grafana --"
                  },
                  "spec": {}
                },
                "enable": true,
                "hide": true,
                "iconColor": "rgba(0, 211, 255, 1)",
                "name": "Annotations & Alerts",
                "builtIn": true,
                "legacyOptions": {
                  "type": "dashboard"
                }
              }
            }
          ],
          "cursorSync": "Off",
          "description": "ADR-0029/ADR-0413: model calls/tokens/cost and API requests by user and Keycloak group, filterable by user/group/agent/model/provider.",
          "editable": true,
          "elements": {
            "panel-1": {
              "kind": "Panel",
              "spec": {
                "id": 1,
                "title": "Model calls (top 20 users, over range)",
                "description": "",
                "links": [],
                "data": {
                  "kind": "QueryGroup",
                  "spec": {
                    "queries": [
                      {
                        "kind": "PanelQuery",
                        "spec": {
                          "query": {
                            "kind": "DataQuery",
                            "group": "prometheus",
                            "version": "v0",
                            "datasource": {
                              "name": "prometheus"
                            },
                            "spec": {
                              "expr": "topk(20, sum by (user) (increase(zuno_model_calls_total{user=~\"$user\", model=~\"$model\", provider=~\"$provider\"}[$__range])))",
                              "legendFormat": "{{`{{user}}`}}"
                            }
                          },
                          "refId": "A",
                          "hidden": false
                        }
                      }
                    ],
                    "transformations": [],
                    "queryOptions": {}
                  }
                },
                "vizConfig": {
                  "kind": "VizConfig",
                  "group": "timeseries",
                  "version": "",
                  "spec": {
                    "options": {},
                    "fieldConfig": {
                      "defaults": {},
                      "overrides": []
                    }
                  }
                }
              }
            },
            "panel-10": {
              "kind": "Panel",
              "spec": {
                "id": 10,
