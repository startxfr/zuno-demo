                "description": "ADR-0102 objective: 99.9% over a rolling 30-day window.",
                "links": [],
                "data": {
                  "kind": "QueryGroup",
                  "spec": {
                    "queries": [
                      {
                        "kind": "PanelQuery",
                        "spec": {
                          "query": {
                            "kind": "DataQuery",
                            "group": "prometheus",
                            "version": "v0",
                            "datasource": {
                              "name": "prometheus"
                            },
                            "spec": {
                              "expr": "sum(increase(zuno_bff_requests_total{code!~\"5..\"}[30d])) / sum(increase(zuno_bff_requests_total[30d]))"
                            }
                          },
                          "refId": "A",
                          "hidden": false
                        }
                      }
                    ],
                    "transformations": [],
                    "queryOptions": {}
                  }
                },
                "vizConfig": {
                  "kind": "VizConfig",
                  "group": "stat",
                  "version": "",
                  "spec": {
                    "options": {},
                    "fieldConfig": {
                      "defaults": {
                        "unit": "percentunit",
                        "thresholds": {
                          "mode": "",
                          "steps": [
                            {
                              "value": null,
                              "color": "red"
                            },
                            {
                              "value": 0.999,
                              "color": "green"
                            }
                          ]
                        }
                      },
                      "overrides": []
                    }
                  }
                }
              }
            },
            "panel-3": {
              "kind": "Panel",
              "spec": {
                "id": 3,
                "title": "Error budget remaining (30d)",
                "description": "1 - (budget consumed / 0.1% budget). Negative means the 30-day error budget is exhausted.",
                "links": [],
                "data": {
                  "kind": "QueryGroup",
                  "spec": {
                    "queries": [
                      {
                        "kind": "PanelQuery",
                        "spec": {
                          "query": {
                            "kind": "DataQuery",
                            "group": "prometheus",
                            "version": "v0",
                            "datasource": {
                              "name": "prometheus"
                            },
                            "spec": {
                              "expr": "1 - ((1 - (sum(increase(zuno_bff_requests_total{code!~\"5..\"}[30d])) / sum(increase(zuno_bff_requests_total[30d])))) / 0.001)"
                            }
                          },
                          "refId": "A",
                          "hidden": false
                        }
                      }
                    ],
                    "transformations": [],
                    "queryOptions": {}
                  }
                },
                "vizConfig": {
                  "kind": "VizConfig",
                  "group": "gauge",
                  "version": "",
                  "spec": {
                    "options": {},
                    "fieldConfig": {
                      "defaults": {
                        "unit": "percentunit",
                        "min": -1,
                        "max": 1,
                        "thresholds": {
                          "mode": "",
                          "steps": [
                            {
                              "value": null,
                              "color": "red"
                            },
                            {
                              "value": 0,
                              "color": "green"
                            }
                          ]
                        }
                      },
                      "overrides": []
                    }
                  }
                }
              }
            },
            "panel-4": {
              "kind": "Panel",
              "spec": {
                "id": 4,
                "title": "Firing zuno alerts",
                "description": "",
                "links": [],
                "data": {
                  "kind": "QueryGroup",
                  "spec": {
                    "queries": [
                      {
                        "kind": "PanelQuery",
                        "spec": {
                          "query": {
                            "kind": "DataQuery",
                            "group": "prometheus",
                            "version": "v0",
                            "datasource": {
                              "name": "prometheus"
                            },
                            "spec": {
                              "expr": "sum(ALERTS{alertname=~\"AgentPathErrorBudgetBurn.*|RagFreshnessLagExceeded.*\", alertstate=\"firing\"}) or vector(0)"
                            }
                          },
                          "refId": "A",
                          "hidden": false
                        }
                      }
                    ],
                    "transformations": [],
                    "queryOptions": {}
                  }
                },
                "vizConfig": {
                  "kind": "VizConfig",
                  "group": "stat",
                  "version": "",
                  "spec": {
                    "options": {},
                    "fieldConfig": {
                      "defaults": {
                        "unit": "short",
                        "thresholds": {
                          "mode": "",
                          "steps": [
                            {
                              "value": null,
                              "color": "green"
                            },
                            {
                              "value": 1,
                              "color": "red"
                            }
                          ]
                        }
                      },
                      "overrides": []
                    }
