                            "version": "v0",
                            "datasource": {
                              "name": "prometheus"
                            },
                            "spec": {
                              "expr": "sum(rate(zuno_rag_searches_total{outcome=\"error\"}[5m])) or vector(0)"
                            }
                          },
                          "refId": "A",
                          "hidden": false
                        }
                      }
                    ],
                    "transformations": [],
                    "queryOptions": {}
                  }
                },
                "vizConfig": {
                  "kind": "VizConfig",
                  "group": "stat",
                  "version": "",
                  "spec": {
                    "options": {},
                    "fieldConfig": {
                      "defaults": {
                        "unit": "reqps"
                      },
                      "overrides": []
                    }
                  }
                }
              }
            },
            "panel-15": {
              "kind": "Panel",
              "spec": {
                "id": 15,
                "title": "Zuno dashboards",
                "description": "",
                "links": [],
                "data": {
                  "kind": "QueryGroup",
                  "spec": {
                    "queries": [],
                    "transformations": [],
                    "queryOptions": {}
                  }
                },
                "vizConfig": {
                  "kind": "VizConfig",
                  "group": "dashlist",
                  "version": "",
                  "spec": {
                    "options": {
                      "headings": false,
                      "includeVars": false,
                      "keepTime": true,
                      "starred": false,
                      "tags": [
                        "zuno"
                      ]
                    },
                    "fieldConfig": {
                      "defaults": {},
                      "overrides": []
                    }
                  }
                }
              }
            },
            "panel-2": {
              "kind": "Panel",
              "spec": {
                "id": 2,
