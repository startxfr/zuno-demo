                "links": [],
                "data": {
                  "kind": "QueryGroup",
                  "spec": {
                    "queries": [
                      {
                        "kind": "PanelQuery",
                        "spec": {
                          "query": {
                            "kind": "DataQuery",
                            "group": "prometheus",
                            "version": "v0",
                            "datasource": {
                              "name": "prometheus"
                            },
                            "spec": {
                              "expr": "(1 - (sum(rate(zuno_bff_requests_total{code!~\"5..\"}[1h])) / sum(rate(zuno_bff_requests_total[1h])))) / 0.001",
