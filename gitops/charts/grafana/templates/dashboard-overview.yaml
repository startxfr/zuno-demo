                            "kind": "DataQuery",
                            "group": "prometheus",
                            "version": "v0",
                            "datasource": {
                              "name": "prometheus"
                            },
                            "spec": {
                              "expr": "(1 - (sum(rate(zuno_bff_requests_total{code!~\"5..\"}[6h])) / sum(rate(zuno_bff_requests_total[6h])))) / 0.001",
