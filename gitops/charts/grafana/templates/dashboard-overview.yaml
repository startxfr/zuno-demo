                            }
                          },
                          "refId": "A",
                          "hidden": false
                        }
                      }
                    ],
                    "transformations": [],
                    "queryOptions": {}
                  }
                },
                "vizConfig": {
                  "kind": "VizConfig",
                  "group": "timeseries",
                  "version": "",
                  "spec": {
                    "options": {},
                    "fieldConfig": {
                      "defaults": {},
                      "overrides": []
                    }
                  }
                }
              }
            },
            "panel-14": {
