{{- if .Values.grafana.enabled }}
# ADR-0413: landing page for the "Zuno Platform" folder - the platform's
# ADR-0102 SLO/error-budget posture, a component-health summary and the
# headline usage KPIs in one screen, with a dashboard-list panel linking to
# the other dashboards below it (dashboard-ai-models.yaml,
# dashboard-usage-cost.yaml, dashboard-agents-tools-rag.yaml,
# dashboard-infra-data.yaml, dashboard-data.yaml, dashboard-gitops.yaml,
# dashboard-mesh-gateway.yaml - the same "Zuno Platform" folder/"zuno" tag
# every one of them carries; dashboard-data.yaml and dashboard-gitops.yaml
# split out of dashboard-infra-data.yaml on 2026-09-01). Deliberately has
# no template variables of its own: this is meant to be read at a glance,
# not filtered - drill-down happens on the linked dashboards.
#
# SLO panels reuse docs/platform/slo.md's measurement query verbatim
# (successful-ratio at the BFF boundary, code!~"5..") and the burn-rate
# shape gitops/charts/observability/templates/prometheusrule-slo.yaml's
# AgentPathErrorBudgetBurnFast/Slow alerts already evaluate (14.4x/6x
# thresholds) - this dashboard visualizes the same numbers those alerts
# fire on, it doesn't invent a new definition.
#
# Layout reworked 2026-09-02 into collapsible rows (same treatment as
# dashboard-data.yaml, exported from Grafana's UI and converted to its
# "Dashboard v2" schema by Grafana's own v2beta1 API - see dashboard-
# data.yaml's header for why that's safe against this cluster's
# grafana-operator v5.24.0 / Grafana 13.0.1). Row grouping and panel
# content otherwise unchanged from the classic-schema version.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: overview
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  uid: zuno-overview
  folder: "Zuno Platform"
  # grafana-operator posts spec.json to the classic /api/dashboards/db
  # endpoint, which rejects a bare v2-schema body with a 400
  # ("dashboard appears to be in v2 format... include an object wrapper
  # with an explicit apiVersion and move the body into a spec element")
  # - confirmed live 2026-09-02 by probing that endpoint directly with
  # both the bare and the wrapped form. The apiVersion/kind/spec
  # envelope below is that required wrapper, not part of the dashboard
  # model itself.
  json: |
    {
      "apiVersion": "dashboard.grafana.app/v2beta1",
      "kind": "Dashboard",
      "spec":
        {
          "annotations": [
            {
              "kind": "AnnotationQuery",
              "spec": {
                "query": {
                  "kind": "DataQuery",
                  "group": "grafana",
                  "version": "v0",
                  "datasource": {
                    "name": "-- Grafana --"
                  },
                  "spec": {}
                },
                "enable": true,
                "hide": true,
                "iconColor": "rgba(0, 211, 255, 1)",
                "name": "Annotations & Alerts",
                "builtIn": true,
                "legacyOptions": {
                  "type": "dashboard"
                }
              }
            }
          ],
          "cursorSync": "Off",
          "description": "ADR-0413: platform landing page - SLO/error budget, component health, headline usage KPIs, links to the other Zuno dashboards.",
          "editable": true,
          "elements": {
            "panel-1": {
              "kind": "Panel",
              "spec": {
                "id": 1,
                "title": "Agent-path availability (5m)",
                "description": "docs/platform/slo.md measurement query - successful (non-5xx) ratio at the BFF boundary.",
                "links": [],
                "data": {
                  "kind": "QueryGroup",
                  "spec": {
                    "queries": [
                      {
                        "kind": "PanelQuery",
                        "spec": {
                          "query": {
                            "kind": "DataQuery",
                            "group": "prometheus",
                            "version": "v0",
                            "datasource": {
                              "name": "prometheus"
                            },
                            "spec": {
                              "expr": "sum(rate(zuno_bff_requests_total{code!~\"5..\"}[5m])) / sum(rate(zuno_bff_requests_total[5m]))"
                            }
                          },
                          "refId": "A",
                          "hidden": false
                        }
                      }
                    ],
                    "transformations": [],
                    "queryOptions": {}
                  }
                },
                "vizConfig": {
                  "kind": "VizConfig",
                  "group": "stat",
                  "version": "",
                  "spec": {
                    "options": {},
                    "fieldConfig": {
                      "defaults": {
                        "unit": "percentunit",
                        "thresholds": {
                          "mode": "",
                          "steps": [
                            {
                              "value": null,
                              "color": "red"
                            },
                            {
                              "value": 0.999,
                              "color": "green"
                            }
                          ]
                        }
                      },
                      "overrides": []
                    }
                  }
                }
              }
            },
            "panel-10": {
              "kind": "Panel",
              "spec": {
                "id": 10,
                "title": "Model error ratio",
                "description": "",
                "links": [],
                "data": {
                  "kind": "QueryGroup",
                  "spec": {
                    "queries": [
                      {
                        "kind": "PanelQuery",
                        "spec": {
                          "query": {
                            "kind": "DataQuery",
                            "group": "prometheus",
                            "version": "v0",
                            "datasource": {
                              "name": "prometheus"
                            },
                            "spec": {
                              "expr": "sum(rate(zuno_model_calls_total{outcome=\"error\"}[5m])) / sum(rate(zuno_model_calls_total[5m]))"
                            }
                          },
                          "refId": "A",
                          "hidden": false
                        }
                      }
                    ],
                    "transformations": [],
                    "queryOptions": {}
                  }
                },
                "vizConfig": {
                  "kind": "VizConfig",
                  "group": "stat",
                  "version": "",
                  "spec": {
                    "options": {},
                    "fieldConfig": {
                      "defaults": {
                        "unit": "percentunit",
                        "thresholds": {
                          "mode": "",
                          "steps": [
                            {
                              "value": null,
                              "color": "green"
                            },
                            {
                              "value": 0.02,
                              "color": "orange"
                            },
                            {
                              "value": 0.1,
                              "color": "red"
                            }
                          ]
                        }
                      },
                      "overrides": []
                    }
                  }
                }
              }
            },
            "panel-11": {
              "kind": "Panel",
              "spec": {
                "id": 11,
                "title": "Model cost (24h)",
                "description": "",
                "links": [],
                "data": {
                  "kind": "QueryGroup",
                  "spec": {
                    "queries": [
                      {
                        "kind": "PanelQuery",
                        "spec": {
                          "query": {
                            "kind": "DataQuery",
                            "group": "prometheus",
                            "version": "v0",
                            "datasource": {
                              "name": "prometheus"
                            },
                            "spec": {
                              "expr": "sum(increase(zuno_model_cost_usd_total[24h]))"
                            }
                          },
                          "refId": "A",
                          "hidden": false
                        }
                      }
                    ],
                    "transformations": [],
                    "queryOptions": {}
                  }
                },
                "vizConfig": {
                  "kind": "VizConfig",
                  "group": "stat",
                  "version": "",
                  "spec": {
                    "options": {},
                    "fieldConfig": {
                      "defaults": {
                        "unit": "currencyUSD"
                      },
                      "overrides": []
                    }
                  }
                }
              }
            },
            "panel-12": {
              "kind": "Panel",
              "spec": {
                "id": 12,
                "title": "Tool denials/s",
                "description": "",
                "links": [],
                "data": {
                  "kind": "QueryGroup",
                  "spec": {
                    "queries": [
                      {
                        "kind": "PanelQuery",
                        "spec": {
                          "query": {
                            "kind": "DataQuery",
                            "group": "prometheus",
                            "version": "v0",
                            "datasource": {
                              "name": "prometheus"
                            },
                            "spec": {
                              "expr": "sum(rate(zuno_tool_invocations_total{outcome=\"denied\"}[5m])) or vector(0)"
                            }
                          },
                          "refId": "A",
                          "hidden": false
                        }
                      }
                    ],
                    "transformations": [],
                    "queryOptions": {}
                  }
                },
                "vizConfig": {
                  "kind": "VizConfig",
                  "group": "stat",
                  "version": "",
                  "spec": {
                    "options": {},
                    "fieldConfig": {
                      "defaults": {
                        "unit": "reqps"
                      },
                      "overrides": []
                    }
                  }
                }
              }
            },
            "panel-13": {
              "kind": "Panel",
              "spec": {
                "id": 13,
                "title": "BFF requests by agent (rate)",
                "description": "",
                "links": [],
                "data": {
                  "kind": "QueryGroup",
                  "spec": {
                    "queries": [
                      {
                        "kind": "PanelQuery",
                        "spec": {
                          "query": {
                            "kind": "DataQuery",
                            "group": "prometheus",
                            "version": "v0",
                            "datasource": {
                              "name": "prometheus"
                            },
                            "spec": {
                              "expr": "sum by (agent) (rate(zuno_bff_requests_total[5m]))",
