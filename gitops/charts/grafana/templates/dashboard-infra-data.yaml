{{- if .Values.grafana.enabled }}
# ADR-0413: merges dashboard-infra.yaml's node/pod/deployment health with
# node- and pod-level CPU/RAM/GPU/disk-IO/network-IO/error panels.
#
# Split 2026-09-01: the database exporter panels (PostgreSQL/MariaDB/Redis)
# moved out to dashboard-data.yaml, and the ArgoCD sync-health panels moved
# out to dashboard-gitops.yaml, so this dashboard is node/pod/deployment
# infrastructure only now. See those two files' own header comments for
# what moved and why.
#
# Node-level panels (CPU/memory/disk/network) use node-exporter's own
# "instance" label, NOT "node" - node_cpu_seconds_total etc. have no
# "node" label to join against the $node variable (which comes from
# kube_node_info), so those panels are deliberately left unfiltered by
# $node; only the node-readiness table (kube_node_status_condition, which
# DOES carry a "node" label) honors it.
#
# Layout reworked 2026-09-02 into collapsible rows (same treatment as
# dashboard-data.yaml, exported from Grafana's UI and converted to its
# "Dashboard v2" schema by Grafana's own v2beta1 API - see dashboard-
# data.yaml's header for why that's safe against this cluster's
# grafana-operator v5.24.0 / Grafana 13.0.1). Row grouping and panel
# content otherwise unchanged from the classic-schema version.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: infra-data
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "26"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  uid: zuno-infra-data
  folder: "Zuno Platform"
  # grafana-operator posts spec.json to the classic /api/dashboards/db
  # endpoint, which rejects a bare v2-schema body with a 400
  # ("dashboard appears to be in v2 format... include an object wrapper
  # with an explicit apiVersion and move the body into a spec element")
  # - confirmed live 2026-09-02 by probing that endpoint directly with
  # both the bare and the wrapped form. The apiVersion/kind/spec
  # envelope below is that required wrapper, not part of the dashboard
  # model itself.
  json: |
    {
      "apiVersion": "dashboard.grafana.app/v2beta1",
      "kind": "Dashboard",
      "spec":
        {
          "annotations": [
            {
              "kind": "AnnotationQuery",
              "spec": {
                "query": {
                  "kind": "DataQuery",
                  "group": "grafana",
                  "version": "v0",
                  "datasource": {
                    "name": "-- Grafana --"
                  },
                  "spec": {}
                },
                "enable": true,
                "hide": true,
                "iconColor": "rgba(0, 211, 255, 1)",
                "name": "Annotations & Alerts",
                "builtIn": true,
                "legacyOptions": {
                  "type": "dashboard"
                }
              }
            }
          ],
          "cursorSync": "Off",
          "description": "ADR-0413: node/pod/deployment health, node and pod resource consumption (CPU/RAM/GPU/disk/network/errors). Database exporters moved to dashboard-data.yaml and ArgoCD sync health to dashboard-gitops.yaml on 2026-09-01.",
          "editable": true,
          "elements": {
            "panel-1": {
              "kind": "Panel",
              "spec": {
                "id": 1,
                "title": "Pod status by namespace",
                "description": "",
                "links": [],
                "data": {
                  "kind": "QueryGroup",
                  "spec": {
                    "queries": [
                      {
                        "kind": "PanelQuery",
                        "spec": {
                          "query": {
                            "kind": "DataQuery",
                            "group": "prometheus",
                            "version": "v0",
                            "datasource": {
                              "name": "prometheus"
                            },
                            "spec": {
                              "expr": "sum by (namespace, phase) (kube_pod_status_phase{namespace=~\"$namespace\"})",
                              "legendFormat": "{{`{{namespace}}`}} ({{`{{phase}}`}})"
                            }
                          },
                          "refId": "A",
                          "hidden": false
                        }
                      }
                    ],
                    "transformations": [],
                    "queryOptions": {}
                  }
                },
                "vizConfig": {
                  "kind": "VizConfig",
                  "group": "timeseries",
                  "version": "",
                  "spec": {
                    "options": {},
                    "fieldConfig": {
                      "defaults": {},
                      "overrides": []
                    }
                  }
                }
              }
            },
            "panel-10": {
              "kind": "Panel",
              "spec": {
                "id": 10,
                "title": "GPU utilization by node",
                "description": "Summary view - see dashboard-ai-models.yaml for full GPU/DCGM detail.",
                "links": [],
                "data": {
                  "kind": "QueryGroup",
                  "spec": {
                    "queries": [
                      {
                        "kind": "PanelQuery",
                        "spec": {
                          "query": {
                            "kind": "DataQuery",
                            "group": "prometheus",
                            "version": "v0",
                            "datasource": {
                              "name": "prometheus"
                            },
                            "spec": {
                              "expr": "avg by (Hostname) (DCGM_FI_DEV_GPU_UTIL)",
                              "legendFormat": "{{`{{Hostname}}`}}"
                            }
                          },
                          "refId": "A",
                          "hidden": false
                        }
                      }
