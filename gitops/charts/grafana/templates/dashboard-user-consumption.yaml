{{- if .Values.grafana.enabled }}
# ADR-0029's "by user" bullet, the last unimplemented dimension - see
# dashboard-model-consumption.yaml (provider/model/agent) for the rest.
# Requires components/ai-gateway (model calls/tokens/cost) and
# components/agent-bff (API requests) rebuilt and redeployed with their
# new user/group labels - empty until then. A Keycloak group membership is
# a list; both services emit one point per group (see each service's own
# telemetry.go/telemetry.py comment), so a multi-group user is
# intentionally double-counted across a `sum by (group)` rollup.
# topk(20, ...) bounds panel cardinality against a growing user base.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: user-consumption
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "26"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  uid: zuno-user-consumption
  folder: "Zuno Platform"
  json: |
    {
      "uid": "zuno-user-consumption",
      "title": "Consumption by user & group",
      "description": "ADR-0029: model calls/tokens/cost and API requests by user and Keycloak group.",
      "tags": ["zuno", "adr-0029", "users"],
      "timezone": "browser",
      "schemaVersion": 39,
      "time": {"from": "now-24h", "to": "now"},
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Model calls (rate, top 20 users)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "topk(20, sum by (user) (rate(zuno_model_calls_total[1h])))",
              "legendFormat": "{{`{{user}}`}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Model calls (rate, by group)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (group) (rate(zuno_model_calls_total[1h]))",
              "legendFormat": "{{`{{group}}`}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Estimated cost (USD/s, top 20 users)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "fieldConfig": {"defaults": {"unit": "currencyUSD"}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "topk(20, sum by (user) (rate(zuno_model_cost_usd_total[1h])))",
              "legendFormat": "{{`{{user}}`}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Tokens consumed (rate, by group)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (group, kind) (rate(zuno_model_tokens_total[1h]))",
              "legendFormat": "{{`{{group}}`}} ({{`{{kind}}`}})"
            }
          ]
        },
        {
          "id": 5,
          "title": "API requests (rate, top 20 users)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "topk(20, sum by (user) (rate(zuno_bff_requests_total[1h])))",
              "legendFormat": "{{`{{user}}`}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "API requests (rate, by group/agent)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (group, agent) (rate(zuno_bff_requests_total[1h]))",
              "legendFormat": "{{`{{group}}`}} / {{`{{agent}}`}}"
            }
          ]
        }
      ]
    }
{{- end }}
