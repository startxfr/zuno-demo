{{- /*
Spot overflow workers (ADR-0614). The vendored cluster-machine subchart has no
spotMarketOptions, so these MachineSets are rendered here, with the same
identity fields (ami, security group, subnet) that ansible/roles/machines
substitutes into the subchart list. replicas starts at 0 and is owned by the
MachineAutoscaler rendered right after each MachineSet.
*/}}
{{- if .Values.spotWorkers.enabled }}
{{- $cluster := index .Values "cluster-machine" "cluster" }}
{{- range .Values.spotWorkers.list }}
---
apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  name: {{ .name | quote }}
  namespace: openshift-machine-api
  labels:
    machine.openshift.io/cluster-api-cluster: {{ $cluster.id | quote }}
    machine.openshift.io/cluster-api-machine-role: worker
    machine.openshift.io/cluster-api-machine-type: worker
    machine.startx.io/group: {{ .group | quote }}
spec:
  replicas: 0
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: {{ $cluster.id | quote }}
      machine.openshift.io/cluster-api-machineset: {{ .name | quote }}
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: {{ $cluster.id | quote }}
        machine.openshift.io/cluster-api-machine-role: worker
        machine.openshift.io/cluster-api-machine-type: worker
        machine.openshift.io/cluster-api-machineset: {{ .name | quote }}
        machine.startx.io/group: {{ .group | quote }}
    spec:
      metadata:
        labels:
          node-role.kubernetes.io/worker: ""
          node-role.kubernetes.io/spot: ""
          machine.startx.io/group: {{ .group | quote }}
      providerSpec:
        value:
          apiVersion: machine.openshift.io/v1beta1
          kind: AWSMachineProviderConfig
          instanceType: {{ .instanceType | quote }}
          spotMarketOptions: {}
          placement:
            availabilityZone: "{{ $cluster.region }}{{ .az }}"
            region: {{ $cluster.region | quote }}
          ami:
            id: {{ .ami }}
          blockDevices:
            - ebs:
                encrypted: true
                iops: 0
                volumeSize: {{ .volumeSize | default 200 }}
                volumeType: gp3
          credentialsSecret:
            name: aws-cloud-credentials
          deviceIndex: 0
          iamInstanceProfile:
            id: "{{ $cluster.id }}-worker-profile"
          securityGroups:
            - filters:
                - name: tag:Name
                  values:
                    - {{ .securityGroupName | quote }}
          subnet:
            filters:
              - name: tag:Name
                values:
                  - {{ .subnet_name | quote }}
          tags:
            - name: kubernetes.io/cluster/{{ $cluster.id }}
              value: owned
          userDataSecret:
            name: worker-user-data
---
apiVersion: autoscaling.openshift.io/v1beta1
kind: MachineAutoscaler
metadata:
  name: {{ .name | quote }}
  namespace: openshift-machine-api
spec:
  minReplicas: 0
  maxReplicas: {{ .maxReplicas | default 1 }}
  scaleTargetRef:
    apiVersion: machine.openshift.io/v1beta1
    kind: MachineSet
    name: {{ .name | quote }}
{{- end }}
{{- end }}
