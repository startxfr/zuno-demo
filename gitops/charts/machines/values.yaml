# Thin wrapper around the startx `cluster-machine` chart (vendored as a Helm
# dependency, same pattern as gitops/charts/nvidia-gpu -> cluster-gpu).
# All toggles stay false here; gitops/apps/machines/application-d0.yaml
# (zuno-machines-d0) flips them, so `helm template` of the bare chart renders
# nothing destructive.
#
# ADR-0351 background: this replaces the five hand-deployed
# startx-cluster-machine-* Applications (deployed straight from
# startxfr/helm-repository@devel, outside this repo). Every machine they
# created Failed with "no security group found" because their cluster.id
# parameter (def7f838-...) was not this cluster's real infra id - every AWS
# tag filter and the IAM instance profile are derived from it.
cluster-machine:
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: machines
    app: machines

  cluster:
    # REAL infra id (`oc get infrastructure cluster -o jsonpath
    # '{.status.infrastructureName}'`) - the IAM instance profile
    # ({id}-worker-profile) and the kubernetes.io/cluster/
    # {id}=owned AWS tag are derived from this by the subchart, and both
    # match what the working IPI machinesets use.
    id: demo222-kpkqk
    region: eu-west-2
    autoscaler:
      enabled: false # flipped by zuno-machines-d0
      # ClusterAutoscaler "default" (cluster singleton). Raw YAML string per
      # the subchart's template (nindent of a string, like cluster-gpu's
      # gpu.spec). Scale-down is the whole point (burst node must go away
      # ~10min after training completes); maxNodeProvisionTime covers the
      # ~8min g7e first boot + NVIDIA driver build.
      spec: |
        podPriorityThreshold: -10
        maxNodeProvisionTime: 15m
        scaleDown:
          enabled: true
          delayAfterAdd: 10m
          delayAfterDelete: 1m
          delayAfterFailure: 30s
          unneededTime: 10m

  machineSet:
    enabled: false # flipped by zuno-machines-d0
    # Common facts for all three groups, verified live against AWS:
    # - AMI ami-00667f67a54be771a: same RHCOS AMI the IPI workergpu
    #   machinesets use.
    # - securityGroupName demo222-kpkqk-node: the OCP 4.16+ CAPA installer
    #   names worker SGs "{id}-node" (+ a second "{id}-lb" SG); there is NO
    #   "{id}-worker-sg" (the subchart's default) on this cluster. The
    #   subchart renders exactly one SG filter per group - the -lb SG only
    #   carries 6443/22623 ingress used by API-target machines, so workers
    #   ride on -node alone (validated at first boot of zuno-gpu-a).
    # - subnet_name {id}-subnet-private-...: ditto, the subchart's default
    #   ("{id}-private-...") does not exist here.
    # - g7e exists ONLY in eu-west-2a and eu-west-2c (verified
    #   describe-instance-type-offerings) - hence no "b" group anywhere.
    # - 150GB gp3 root: the GPU-node lesson from gitops/charts/models
    #   (75GB can't hold vLLM image + model download + driver artifacts).
    list:
      # Permanent inference node. g7e.4xlarge (16vCPU/128GiB, 1x RTX PRO
      # 6000 Blackwell 96GB): the previous g7e.2xlarge's ~7.5 allocatable
      # vCPU could not hold the three inference workloads' 8.5 vCPU of
      # standing requests (ADR-0351 sizing analysis). Zone a on purpose:
      # the qwen model PVC (gp3-csi, RWO, single-AZ) is zone-bound where
      # its download Job runs - keeping the permanent node in "a" keeps
      # that PVC valid.
      # volumeSize 250 (was 150) on both permanent inference nodes, WP-083.
      # 150GB is ample in steady state - a node serving qwen3.6-27b (28.8GB)
      # plus gpt-oss-20b (12.8GB) measured 54.5GB used of 149GB. It is the
      # TRANSIENTS that overrun it, and they were hit for real on
      # zuno-gpu-c's first boot: every model landed at once, each briefly
      # existing twice (KServe RollingUpdate keeps the outgoing pod while
      # the incoming one downloads), on top of the vLLM image unpacking
      # from a 17.7GB pull. Peak was ~136GB of 149GB, which crossed the
      # kubelet's ~24GB eviction threshold: the qwen pod was Evicted mid-init,
      # the node took a node.kubernetes.io/disk-pressure:NoSchedule taint,
      # and the rollout stalled until the pressure cleared on its own.
      # Model weights land in an emptyDir, so they are ephemeral-storage,
      # not a PVC - there is no other budget they draw from. The failover
      # case is the sizing case: one node holding all three models plus
      # their rollout duplicates. gp3 capacity is negligible next to a
      # g7e.4xlarge, so this is bought cheaply.
      # NOTE: block device changes only apply to NEW machines. The running
      # nodes keep their 150GB until replaced.
      - name: zuno-gpu-a
        az: a
        type: worker
        group: gpu
        ami: ami-00667f67a54be771a
        instanceType: g7e.4xlarge
        securityGroupName: demo222-kpkqk-node
        subnet_name: demo222-kpkqk-subnet-private-eu-west-2a
        blockDevices: |-
          - ebs:
              encrypted: true
              iops: 0
              volumeSize: 250
              volumeType: gp3
        replicas: 1
        # nvidia-mig-manager watches this label and partitions the GPU at
        # first boot, while the node is still empty (no drain needed):
        # all-balanced = 2x 1g.24gb + 1x 2g.48gb on RTX-PRO-6000-96GB
        # (device 0x2BB510DE in default-mig-parted-config, verified live).
        # Requires ClusterPolicy mig.strategy "mixed" - set by
        # ansible/roles/nvidia_gpu's spec overlay.
        additionnalsLabels: |-
          nvidia.com/mig.config: all-balanced
        # Same PreferNoSchedule rationale as zuno-gpu-c below. NOTE: a
        # MachineSet template change does not retaint a node that already
        # exists - this only takes effect on a replacement machine, so the
        # running zuno-gpu-a node must be tainted live once with
        # `oc adm taint node <node> nvidia.com/gpu=true:PreferNoSchedule`.
        additionnalsTaints: |-
          - key: nvidia.com/gpu
            value: "true"
            effect: PreferNoSchedule
      # Second PERMANENT inference node since 2026-08-26, no longer the
      # scale-on-demand failover twin it was designed as. It is still NOT
      # autoscaled, and for the original reason: the ClusterAutoscaler can
      # only scale from zero for plain nvidia.com/gpu (via the
      # capacity.cluster-autoscaler.kubernetes.io/gpu-count/gpu-type
      # annotations) - nvidia.com/mig-* capacity is invisible to it, so
      # Pending MIG-slice pods could never have triggered this set. That
      # is precisely why it cannot stay at 0: a second MIG node has to be
      # standing before it is needed, or it is never summoned at all.
      #
      # It replaces demo222-kpkqk-workergpu-eu-west-2a, the installer's
      # IPI GPU node, which carried an entire idle 96GB GPU. Four reasons
      # this swap is worth a size step (g7e.2xlarge -> g7e.4xlarge):
      #   1. 8 vCPU cannot drive a 3-slice MIG partition. With ~3.5 cores
      #      already taken by platform pods, the workergpu node had 4.5
      #      cores for 3 slices - one model pod fit, so 96GB of VRAM was
      #      bought to use 24GB of it.
      #   2. The IPI MachineSet is outside this chart, so no
      #      nvidia.com/mig.config label can be pushed to it declaratively
      #      - any MIG partition there is manual and lost on node replace.
      #   3. Zero AZ redundancy today: zuno-gpu-a AND workergpu are both
      #      in eu-west-2a. This set is in 2c.
      #   4. Symmetry is what makes failover real - two identical
      #      all-balanced g7e.4xlarge means qwen36-27b (48GB slice, 16Gi
      #      RAM) can actually land on either. It could never fit on the
      #      g7e.2xlarge under load.
      # Net cluster effect is +8 vCPU / +64GiB of general-purpose capacity
      # despite the taint below, since the node it retires is half its
      # size. Decommissioning the IPI set is a live `oc scale` - it is not
      # declared here and cannot be retired by this chart.
      - name: zuno-gpu-c
        az: c
        type: worker
        group: gpu
        ami: ami-00667f67a54be771a
        instanceType: g7e.4xlarge
        securityGroupName: demo222-kpkqk-node
        subnet_name: demo222-kpkqk-subnet-private-eu-west-2c
        blockDevices: |-
          - ebs:
              encrypted: true
              iops: 0
              volumeSize: 250
              volumeType: gp3
        replicas: 1
        additionnalsLabels: |-
          nvidia.com/mig.config: all-balanced
        # PreferNoSchedule, deliberately NOT NoSchedule. The intent is to
        # stop platform pods from creeping back onto the inference nodes
        # and re-starving them of CPU - the failure this whole change
        # undoes - not to evict what is already placed. A hard taint here
        # would be unschedulable in practice: dedicating both GPU nodes
        # means relocating ~10.2 cores of platform requests onto 12.0
        # cores of headroom that lives mostly on the three masters, taking
        # them from ~75% to ~98% cpu-requests. Soft means the GPU nodes
        # stay the overflow of last resort and the scheduler degrades
        # instead of deadlocking.
        # Model pods need no matching toleration: they are the only pods
        # requesting nvidia.com/mig-*, which no other node advertises, so
        # the resource requirement already pins them here and the soft
        # penalty has nothing to bias them towards.
        additionnalsTaints: |-
          - key: nvidia.com/gpu
            value: "true"
            effect: PreferNoSchedule
      # Burst training node, scale-from-zero (the MachineAutoscaler below).
      # MIG stays DISABLED here - the whole 96GB GPU is advertised as
      # nvidia.com/gpu: 1, the only resource shape the ClusterAutoscaler
      # can scale from zero for (see zuno-gpu-c's comment) and the best
      # shape for training anyway. g7e.2xlarge, not 4xlarge: same GPU
      # either way, the LoRA trainer (granite 2b) needs neither 16 vCPU nor
      # 128GiB, and burst hours are the only hours billed.
      - name: zuno-gpu-burst-a
        az: a
        type: worker
        group: gpu-burst
        ami: ami-00667f67a54be771a
        instanceType: g7e.2xlarge
        securityGroupName: demo222-kpkqk-node
        subnet_name: demo222-kpkqk-subnet-private-eu-west-2a
        blockDevices: |-
          - ebs:
              encrypted: true
              iops: 0
              volumeSize: 150
              volumeType: gp3
        replicas: 0
        additionnalsLabels: |-
          nvidia.com/mig.config: all-disabled
        # Keeps everything except the tolerating train pod (gitops/charts/
        # mlops's training.gpu.toleration) off this node, so no stray pod
        # ever blocks the autoscaler's scale-down. The NVIDIA GPU-operator
        # daemonsets only tolerate nvidia.com/gpu by default -
        # ansible/roles/nvidia_gpu's ClusterPolicy overlay
        # adds a zuno.io/gpu-burst toleration to them, or the driver would
        # never start here and the node would never advertise its GPU.
        additionnalsTaints: |-
          - key: zuno.io/gpu-burst
            value: "true"
            effect: NoSchedule

  machineAutoscaler:
    enabled: false # flipped by zuno-machines-d0
    list:
      - name: zuno-gpu-burst-a
        # STRING "0" on purpose: the subchart renders
        # `minReplicas: {{ .minReplicas | default 1 }}` and an integer 0 is
        # falsy in Helm - it silently becomes 1 (a permanently-on burst
        # node). The string "0" survives `default` and renders as a valid
        # integer.
        minReplicas: "0"
        maxReplicas: 1

  # Deliberately unused halves of the subchart - the retired
  # startx-cluster-machine-* apps managed MachineConfig(Pool)s and
  # MachineHealthChecks too; those stay out of scope here (the worker/infra
  # MCPs they created were orphaned in place, see ADR-0351).
  machineConfigPool:
    enabled: false
  machineConfig:
    enabled: false
  machineHealthCheck:
    enabled: false
