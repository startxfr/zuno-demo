{{- if .Values.roleBindings.enabled }}
{{- /*
ADR-0349 (replaces ADR-0320's zuno-admin/aidev/aiops bindings): both AI
profiles are RoleBindings ranged over the live-discovered
zuno.io/managed=true namespace set (the existing discover-don't-duplicate
mechanism in ansible/roles/openshift_rbac_groups/tasks/install.yml,
covering the zuno-*, redhat-ods-* and rhoai-* platform namespaces) -
neither receives any ClusterRole. ocp-ai-dev -> edit, ocp-ai-ops ->
admin; zuno-admin's old per-namespace admin role is covered by the
combination of ocp-paas-ops (full cluster) and ocp-ai-ops (admin on the
AI namespaces), so it has no successor binding here.
*/}}
{{- range .Values.zunoManagedNamespaces }}
{{- if $.Values.personaView.enabled }}
{{- /*
ADR-0524 : lecture seule pour les personas metier sur les namespaces Zuno.
Motive par l'introspection Lightspeed : openshift-mcp-server agit avec les
droits REELS de l'utilisateur, donc sans ce grant la console repondait
"You don't have permission to list pods in the zuno-ai-run namespace" -
comportement correct, mais assistant muet. Constate live le 2026-08-27.
`view` et non `edit` : Lightspeed lit l'etat du cluster, il ne le modifie pas.
Meme mecanisme de decouverte que les deux bindings ci-dessous - la liste des
namespaces vient de zunoManagedNamespaces, jamais recopiee a la main.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zuno-personas-view
  namespace: {{ . }}
  labels:
    zuno.io/managed-by: argocd
subjects:
{{- range $.Values.personaView.groups }}
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: {{ . }}
{{- end }}
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zuno-ocp-ai-dev-edit
  namespace: {{ . }}
  labels:
    zuno.io/managed-by: argocd
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: ocp-ai-dev
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zuno-ocp-ai-ops-admin
  namespace: {{ . }}
  labels:
    zuno.io/managed-by: argocd
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: ocp-ai-ops
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
{{- end }}
