apiVersion: v2
name: openshift-rbac-groups
description: >-
  ADR-0320: static RBAC bindings for the platform/cluster-operator
  Keycloak groups (admin, zuno-admin, aidev, aiops) - OpenShift OAuth
  already syncs Group membership from the token's groups claim on every
  login (mappingMethod: add), so these bindings need no active
  reconciliation, only to exist; GitOps re-applies them whenever the
  namespace/group set changes.
type: application
version: 0.1.0
appVersion: "0.1.0"
