clusterRoleBinding:
  enabled: false
roleBindings:
  enabled: false

# Mirrors gitops/charts/namespaces' zuno.io/managed=true label set.
# Populated by ansible/roles/openshift_rbac_groups/tasks/install.yml via
# a live k8s_info lookup at apply time (ADR-0048-style: discover, don't
# duplicate the 12-namespace list by hand in a second place) - never
# hand-set. A namespace missing this label is silently excluded from
# ocp-ai-dev/ocp-ai-ops RBAC (ADR-0349, ex ADR-0320's zuno-admin), which
# is intended behavior.
zunoManagedNamespaces: []

# Namespaces where the AI profiles (ocp-ai-dev -> edit, ocp-ai-ops -> admin) get NO RoleBinding, although
# they are labelled zuno.io/managed=true. Both ClusterRoles read and write Secrets, and these namespaces
# hold the identity and secrets roots of the platform: the Keycloak admin and realm credentials
# (zuno-auth) and the Vault bootstrap and unseal material (zuno-vault). Found on 2026-11-13 while
# writing the demo scenarios; ocp-paas-ops (cluster-admin) still administers both. The read-only
# personaView binding stays: `view` does not include Secrets.
# Not excluded yet, to review: zuno-data (database credentials), zuno-mesh (mesh CA material),
# zuno-rhtas (signing services), zuno-registry (Quay robots), zuno-aap (AAP credentials).
aiProfileExcludedNamespaces:
  - zuno-auth
  - zuno-vault

# ADR-0524 : lecture seule des personas metier sur les namespaces Zuno, pour
# que l'introspection cluster de Lightspeed leur reponde quelque chose.
personaView:
  enabled: true
  groups:
    - consultant
    - sales
