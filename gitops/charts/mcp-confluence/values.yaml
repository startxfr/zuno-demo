# Must match mcp-gateway's binding registry entry (endpoint.default:
# http://confluence-mcp.zuno-ai-run.svc:8000) in
# platform/bindings/tools/tool-bindings.yaml.
namespace: zuno-ai-run

# Built by the "mcp" build component into zuno-ai-build's ImageStream, pulled
# cross-namespace into zuno-ai-run via the system:image-puller RoleBinding.
image:
  repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/mcp-confluence
  # image.tag must stay "latest" until a release is cut - see RELEASING.md (two parallel image paths).
  tag: latest
  # ADR-0603 M16: written by platform/supply-chain/render_release_digests.py from the release
  # ledger, never by hand. Set, it wins over tag (repository@digest, IfNotPresent, no :latest trigger).
  digest: ""
  # Always, not IfNotPresent - the mutable :latest tag needs it to avoid serving a stale cached image; see RELEASING.md.
  # Used only on the :latest path: a rendered digest pulls IfNotPresent (ADR-0603 M16).
  pullPolicy: Always

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# ADR-0208 service-identity: one shared Confluence technical identity for
# every caller (the gateway's own ADR-0011 intersection authorizes the
# actual caller before this identity is ever used).
credentials:
  vaultPath: confluence/technical
  secretName: confluence-technical-credentials
  # ADR-0602/WP-223: the namespace's own SecretStore (was the cluster-wide vault-backend).
  secretStoreName: vault
  refreshInterval: 1h

# ADR-0603 M12 (WP-225 lot B): the Confluence spaces each Keycloak group may reach
# through the shared technical identity, checked in the server against the caller
# context the mcp-gateway signs (never a tool argument). {group: [space key pattern]},
# fnmatch, case-insensitive; "*" is every space. Empty: no allowlist, today's
# behaviour. Once set, a caller whose groups list no matching pattern is refused, and
# a search without a space covers only the caller's spaces.
#   groups:
#     consultant: [TECH, OPS]
#     ocp-paas-ops: ["*"]
# scope: "all" checks reads and writes; "write" only create_page and update_page.
spaceAllowlist:
  groups: {}
  scope: all
