# Dedicated, least-privilege service account. No RBAC binding: this service
# only talks to Confluence Cloud over HTTPS and serves HTTP, never the
# Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: confluence-mcp
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: confluence-mcp
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
