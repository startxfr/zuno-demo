# Same shared workload-identity secret mcp-gateway resolves; this server
# validates the X-Zuno-Gateway-Token header the gateway sends against it
# (same pattern as gitops/charts/mcp-sales-db).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mcp-gateway-workload-token
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: mcp-gateway-workload-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: mcp/gateway-workload-token
        property: token
