# ADR-0024/ADR-0208: the shared Confluence technical identity (email + API
# token), seeded at Vault path zuno/confluence/technical by
# ansible/roles/vault/tasks/install.yml. Never hardcoded here.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.credentials.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.credentials.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: {{ .Values.credentials.vaultPath }}
        property: url
    - secretKey: email
      remoteRef:
        key: {{ .Values.credentials.vaultPath }}
        property: email
    - secretKey: token
      remoteRef:
        key: {{ .Values.credentials.vaultPath }}
        property: token
