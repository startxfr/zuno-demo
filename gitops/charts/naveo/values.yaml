# ADR-0410/ADR-0307 (WP-41): scaffolded by platform/templates/agent/ -
# see gitops/charts/arkos/values.yaml's own comment for why this chart
# carries only CR-population fields, never platform-wide constants
# (those live once, in gitops/charts/aiagent-operator/).

namespace: zuno-ai-run

agentName: naveo

okfBundleRef: agents/naveo

image:
  registry: image-registry.openshift-image-registry.svc:5000
  frontendRepository: zuno-ai-build/agent-frontend
  bffRepository: zuno-ai-build/agent-bff
  # Temporarily back to latest (2026-08-20) - the in-cluster BuildConfig
  # (day1 build) always writes to `image.repository` above at :latest,
  # never to a release tag (that only exists at quay.io/zuno/*, a
  # separate, optional path - RELEASING.md). Pinning `.tag` while
  # `.repository` still points at the internal ImageStream is a mismatch:
  # v0.1.0 is manifest-unknown there, ImagePullBackOff. Same fix as
  # commits 09d2cee/be35efa for agent-runtime/tekos and every mcp-* chart.
  tag: latest

frontend:
  replicas: 1
  # Empty means "naveo.<the operator's own clusterBaseDomain>".
  routeHost: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  oidcClientId: naveo-frontend

bff:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  oidcAudience: naveo-frontend

# ADR-0040: agent entitlement group, orthogonal to the business role that
# governs tool/data permissions inside Naveo.
groups:
  entitlementGroup: agent_naveo
  businessRoles:
    - consultant

knowledgeDomains:
  - knowledge.tech
  - knowledge.project

toolCapabilities:
  - search_confluence
  - web_search
  - list_drive_files
