{{- if .Values.registry.enabled }}
# The operator brings no NetworkPolicy (3.18.2 has no such component). The namespace baseline (namespaces chart) denies
# other namespaces; this admits the image consumers to the Quay application, and the router for the public route.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quay-consumers
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  podSelector:
    matchLabels:
      quay-component: quay-app
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.consumers.namespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 8080
{{- end }}
