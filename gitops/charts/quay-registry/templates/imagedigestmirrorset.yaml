{{- if .Values.redirects.enabled }}
# ADR-0612 addendum / WP-248 family (c): nodes pull the UnifAI images from the internal Quay while every reference, digest,
# signature and admission policy keeps naming quay.io. Digest pulls only (the cluster pins by digest). The operator's own image
# is written in its bundle, so a redirect is the only way to move it. AllowContactingSource: when the mirror fails the node
# falls back to quay.io (decision 2026-11-12, one Quay replica). The mirrored repositories are publicly readable, so the nodes
# need no credential for them.
apiVersion: config.openshift.io/v1
kind: ImageDigestMirrorSet
metadata:
  name: zuno-unifai-via-registry
  labels:
    zuno.io/managed-by: argocd
spec:
  imageDigestMirrors:
    {{- range .Values.redirects.repositories }}
    - source: {{ $.Values.redirects.source }}/{{ . }}
      mirrors:
        - {{ required "redirects.host is required when redirects.enabled" $.Values.redirects.host }}/{{ $.Values.redirects.organization }}/{{ . }}
      mirrorSourcePolicy: AllowContactingSource
    {{- end }}
{{- end }}
{{- if .Values.publicRedirects.enabled }}
---
# WP-248 family (d): the same redirect for the closed list of public third-party images (platform/supply-chain/mirrored-images.yaml,
# digest-pinned entries only). Source `<registry>/<path>` -> `<host>/<org>/mirror/<path>`; fallback to the origin registry.
apiVersion: config.openshift.io/v1
kind: ImageDigestMirrorSet
metadata:
  name: zuno-public-via-registry
  labels:
    zuno.io/managed-by: argocd
spec:
  imageDigestMirrors:
    {{- range .Values.publicRedirects.sources }}
    - source: {{ . }}
      mirrors:
        - {{ required "redirects.host is required when publicRedirects.enabled" $.Values.redirects.host }}/{{ $.Values.redirects.organization }}/mirror/{{ . | splitList "/" | rest | join "/" }}
      mirrorSourcePolicy: AllowContactingSource
    {{- end }}
{{- end }}
{{- if .Values.redhatRedirects.enabled }}
---
# WP-261 family (e), ADR-0612 addendum 2026-11-14: the large Red Hat product images the demo runs
# (platform/supply-chain/mirrored-redhat-images.yaml). Source `registry.redhat.io/<path>` -> `<host>/<org>/redhat/<path>`.
# Unlike families (c) and (d) these repositories are PRIVATE (the route is reachable from the Internet and Red Hat content
# is not redistributed): the nodes read them with the pull robot that the quay_registry role adds to the global pull
# secret. Fallback to registry.redhat.io. Never remove a source from the live object outside a drain window: removal
# drains every node; to stop using an entry, stop copying it.
apiVersion: config.openshift.io/v1
kind: ImageDigestMirrorSet
metadata:
  name: zuno-redhat-via-registry
  labels:
    zuno.io/managed-by: argocd
spec:
  imageDigestMirrors:
    {{- range .Values.redhatRedirects.sources }}
    - source: {{ . }}
      mirrors:
        - {{ required "redirects.host is required when redhatRedirects.enabled" $.Values.redirects.host }}/{{ $.Values.redirects.organization }}/redhat/{{ . | splitList "/" | rest | join "/" }}
      mirrorSourcePolicy: AllowContactingSource
    {{- end }}
{{- end }}
