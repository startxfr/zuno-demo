{{- if .Values.zuno.enabled }}
{{- $z := .Values.zuno }}
{{- if $z.providerCut.enabled }}
# What zuno-provider-cut needs and the startx chaos ClusterRole (chaos-pipeline-zuno-chaos) does not give: create and
# delete AdminNetworkPolicies, the same grant as gitops/charts/aap-config/templates/clusterrole-stress-chaos.yaml (WP-311),
# plus patch for `oc apply`. AdminNetworkPolicies are cluster-scoped and take precedence over every NetworkPolicy, and
# Kubernetes RBAC cannot limit a CREATE to one name: the limit is the Task's own allow-list (host, subject, duration) and
# its reaping. Bound to the chaos-pipeline ServiceAccount only, which every chaos PipelineRun uses.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zuno-chaos-provider-cut
  labels:
    {{- include "zuno-chaos.labels" . | nindent 4 }}
rules:
  - apiGroups: ["policy.networking.k8s.io"]
    resources: ["adminnetworkpolicies"]
    verbs: ["get", "list", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zuno-chaos-provider-cut
  labels:
    {{- include "zuno-chaos.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zuno-chaos-provider-cut
subjects:
  - kind: ServiceAccount
    name: chaos-pipeline
    namespace: {{ $z.namespace }}
{{- end }}
{{- if $z.aap.enabled }}
---
# The AAP chaos workflow's run node (gitops/charts/aap-config: zuno-day3-chaos-run, installer credential) creates ONE
# PipelineRun, waits for it and reads its TaskRuns. The installer ClusterRole has no Tekton right, and this one stays in
# zuno-chaos.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zuno-chaos-runner
  namespace: {{ $z.namespace }}
  labels:
    {{- include "zuno-chaos.labels" . | nindent 4 }}
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["tekton.dev"]
    resources: ["taskruns", "pipelines", "tasks"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zuno-chaos-runner
  namespace: {{ $z.namespace }}
  labels:
    {{- include "zuno-chaos.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zuno-chaos-runner
subjects:
  {{- range $z.aap.runnerServiceAccounts }}
  - kind: ServiceAccount
    name: {{ . }}
    namespace: {{ $z.aap.namespace }}
  {{- end }}
---
# The pre and post checks and `make d2|d3 check chaos` (zuno-cluster-reader and installer credentials): read the cerberus
# signal through the API server's service proxy (`oc get --raw .../services/http:cerberus:8080/proxy/`), which works
# from a workstation and from an AAP execution environment alike, with no pod to start; and read the PipelineRuns (the
# lock: no second chaos run while one is running). cluster-reader holds neither right. The proxy subresource is limited to
# the cerberus Service: the request name is `http:cerberus:8080`, listed with the plain name for clients that omit the port.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zuno-chaos-signal-reader
  namespace: {{ $z.namespace }}
  labels:
    {{- include "zuno-chaos.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames: ["cerberus", "http:cerberus:8080", "cerberus:8080"]
    verbs: ["get"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns", "pipelines", "tasks"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zuno-chaos-signal-reader
  namespace: {{ $z.namespace }}
  labels:
    {{- include "zuno-chaos.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zuno-chaos-signal-reader
subjects:
  {{- range $z.aap.readerServiceAccounts }}
  - kind: ServiceAccount
    name: {{ . }}
    namespace: {{ $z.aap.namespace }}
  {{- end }}
{{- end }}
{{- end }}
