apiVersion: v2
name: chaos
description: >-
  Day 2 component chaos: the startx cerberus watchdog and the krkn Tekton
  pipelines (chaos-infra, chaos-application) in zuno-chaos, plus the Zuno
  provider-cut and steady-state Tasks and their Pipeline. Nothing runs at
  install: a run is one PipelineRun created by ansible/roles/chaos
  (`make d3 chaos infra|platform`, or the AAP chaos workflows).
type: application
version: 0.1.0
appVersion: "0.1.0"
# chaos-cerberus 21.3.398 and chaos-pipeline 21.3.400 (startx stable index). 21.3.392 brought the run parameters this
# component needs (scenarios, recovery-time, node-selector, workload-namespace, per-scenario recoveryTime); 21.3.398 an
# empty `scenarios` default and an optional ClusterOperator final check (off here); chaos-pipeline 21.3.400
# (2026-11-22 15:24Z) krkn's exit_on_failure False, so the cerberus gates can run (chaos-cerberus was not re-released). Chart.lock is
# committed; `helm dependency build gitops/charts/chaos` fetches the packages.
dependencies:
  - name: chaos-cerberus
    alias: cerberus
    version: "21.3.398"
    repository: "https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable"
  - name: chaos-pipeline
    alias: pipeline
    version: "21.3.400"
    repository: "https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable"
