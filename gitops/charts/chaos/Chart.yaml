apiVersion: v2
name: chaos
description: >-
  Day 2 component chaos: the startx cerberus watchdog and the krkn Tekton
  pipelines (chaos-infra, chaos-application) in zuno-chaos, plus the Zuno
  provider-cut and steady-state Tasks and their Pipeline. Nothing runs at
  install: a run is one PipelineRun created by ansible/roles/chaos
  (`make d3 chaos infra|platform`, or the AAP chaos workflows).
type: application
version: 0.1.0
appVersion: "0.1.0"
# 21.3.392 carries the run parameters this component needs (scenarios, recovery-time, node-selector, workload-namespace,
# per-scenario recoveryTime). It is not on the stable index yet (2026-11-21: 21.3.391 is the newest there), so there is
# no Chart.lock: run `helm dependency update gitops/charts/chaos` and commit the Chart.lock once it is published (README).
dependencies:
  - name: chaos-cerberus
    alias: cerberus
    version: "21.3.392"
    repository: "https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable"
  - name: chaos-pipeline
    alias: pipeline
    version: "21.3.392"
    repository: "https://sx-helm-repository-prod.s3.eu-west-3.amazonaws.com/stable"
