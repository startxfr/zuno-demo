# Shared by two ArgoCD Applications: operator (zuno-mariadb-d0) renders the
# MariaDB Enterprise Operator Subscription/OperatorGroup, mariadbOperand
# (zuno-mariadb-d1) renders the MariaDB/PhysicalBackup CRs and their
# ExternalSecrets. Both default false so `helm template`/`helm lint` render
# nothing.
mariadbOperand:
  enabled: false

# subscription.name/operator.name/operator.channel/operator.source.name are
# all discovered at run time by ansible/roles/mariadb/tasks/install.yml and
# set via gitops_app_extra_helm_values (ADR-0048) - the known package name
# is "mariadb-operator" (the open-source, Apache-2.0 community-operators
# listing - not the paid "mariadb-enterprise-operator" certified listing,
# which needs MariaDB Enterprise registry credentials this cluster doesn't
# have), but it's still resolved from the live cluster's PackageManifest
# rather than hardcoded here, same as postgresql/jobset/kueue.
# templates/checks.yaml fails the render if any is still empty once
# operator.enabled is true.
#
# No OperatorGroup: this package's CSV supports every install mode
# (OwnNamespace/SingleNamespace/MultiNamespace/AllNamespaces all
# confirmed true against a live cluster's PackageManifest), so - same as
# gitops/charts/postgresql - it's subscribed into the shared
# openshift-operators namespace and relies on OpenShift's own default
# global OperatorGroup there (AllNamespaces) rather than a dedicated one.
# This also sidesteps the MultipleOperatorGroupsFound conflict a
# dedicated, namespace-scoped OperatorGroup in zuno-data previously hit
# on a live cluster (a stray pre-existing OperatorGroup there, unrelated
# to this chart).
operator:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: mariadb
    app: mariadb
  subscription:
    enabled: true
    name: ""
    namespace: openshift-operators
    operator:
      # Must be set explicitly, same name as subscription.name: the vendored
      # `operator` chart defaults this to "codeready-workspaces", silently
      # suppressing the fallback to subscription.name.
      name: ""
      channel: ""
      installPlanApproval: Automatic  # startx chart defaults to Manual
      source:
        name: ""
        namespace: openshift-marketplace
      # Propagated by OLM into the CSV's controller-manager Deployment
      # (spec.config.resources on the Subscription). Default 512Mi limit
      # OOM-kills the manager container (exitCode 137, restarts) on a live
      # cluster - bumped to 700Mi.
      # cpu was later found to be the actual live bottleneck, not memory:
      # at the stock 500m limit this operator-sdk Helm-operator gets
      # CPU-throttled hard enough during its own API-discovery/RESTMapper
      # startup (this cluster carries 400+ CRDs) that its /healthz and
      # /readyz handlers miss their 1s probe timeout, so kubelet kills it
      # every cycle (100+ restarts/day observed) - which flaps the owned
      # Deployment's Available condition and makes the CSV oscillate
      # Installing/Succeeded in the console. Memory stayed flat around
      # 258Mi (well under 700Mi) throughout, confirming it wasn't memory
      # this time. Bumped cpu request/limit accordingly - see
      # docs/platform/troubleshooting.md for the full diagnosis.
      # Root cause: this operator watches all namespaces with many reconcile
      # workers, and cluster-wide client-side throttling can delay its
      # leader-election lease renewal past its deadline - see
      # docs/platform/troubleshooting.md for the full diagnosis. Only one
      # MariadbOperator CR exists cluster-wide (zuno-data/mariadb-operator),
      # so WATCH_NAMESPACE below scopes the watch down to it, cutting most
      # of the reconcile-time API call volume that feeds the throttling;
      # cpu is bumped further as a supporting measure against the
      # still-possible startup-discovery throttling this doesn't address
      # (discovery isn't namespace-scoped).
      config:
        env:
          - name: WATCH_NAMESPACE
            value: zuno-data
        resources:
          requests:
            cpu: 300m
            memory: 128Mi
          limits:
            cpu: "2"
            memory: 700Mi

# mariadb-operator ships as an operator-sdk Helm-operator: its CSV
# Deployment is a thin controller that only runs its embedded Helm chart
# (and so only starts the real mariadb-operator controller-manager that
# reconciles MariaDB CRs) once a MariadbOperator CR exists - see
# templates/mariadboperator.yaml. Same "operator needs an
# activation/config singleton CR" shape gitops/charts/jobset's
# JobSetOperator / gitops/charts/kueue's Kueue CR already use.
mariadbOperatorActivation:
  # No ServiceMonitor CRD assumed installed - kept minimal, everything
  # else left at the CSV's own embedded-chart defaults.
  metrics:
    enabled: false

# Single-node MariaDB (k8s.mariadb.com/v1alpha1 MariaDB CR).
cluster:
  replicas: 1
  storageClassName: gp3-csi
  storageSize: 100Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  myCnf: |
    [mariadb]
    bind-address=*
    max_connections=200
  # ADR-0413: mysqld-exporter sidecar (spec.metrics, `oc explain
  # mariadb.spec.metrics` confirmed against the live cluster) - the
  # mysql_* series dashboard-infra-data.yaml needs. Unlike
  # mariadbOperatorActivation.metrics above (the operator controller's OWN
  # metrics), this is the operand MariaDB CR's built-in exporter support:
  # the operator provisions the mysqld-exporter container, a monitoring DB
  # user/password (generate: true - no separate Vault/ExternalSecret
  # plumbing needed, same self-service shape as PhysicalBackup's other
  # generated Secrets) AND its own ServiceMonitor, so no separate
  # NetworkPolicy is skippable but no separate ServiceMonitor CR is needed
  # here (contrast templates/podmonitor-postgres.yaml, which PGO does NOT
  # provide).
  metrics:
    enabled: true
    passwordSecretKeyRef:
      name: mariadb-metrics-password
      key: password
      generate: true
    serviceMonitor:
      interval: 30s

credentials:
  # Resolves to Vault path zuno/mariadb/root (single `password` field -
  # MariaDB's root user is fixed, unlike postgresql's configurable owner
  # role). Seeded by ansible/roles/vault/tasks/install.yml.
  rootVaultPath: mariadb/root
  secretStoreName: vault-backend
  refreshInterval: 1h

# PhysicalBackup (k8s.mariadb.com/v1alpha1) only renders once real
# S3 credentials exist - same "never rendered half-configured" rule
# gitops/charts/postgresql's repo2 follows. bucket/endpoint/region are not
# secret and are set via gitops_app_extra_helm_values by
# ansible/roles/mariadb/tasks/install.yml; access-key-id/secret-access-key
# are secret and come from Vault (zuno/mariadb/s3) via
# templates/externalsecret-backup-s3.yaml.
backups:
  schedule: "0 */6 * * *"
  maxRetention: 168h
  compression: gzip
  s3:
    enabled: false
    bucket: zuno-mariadb-backups
    prefix: zuno-mariadb
    region: eu-west-2
    endpoint: s3.eu-west-2.amazonaws.com
    secretName: mariadb-backup-s3
    vaultPath: mariadb/s3

# Dedicated database/user for the rag-ingestion pipeline's KFP
# DataSciencePipelinesApplication metadata store
# (gitops/charts/rag-ingestion's pipelineServer.metadataDatabase.
# externalMySQL - database/username there are both "mlpipeline", matching
# owner below). Same "bring your own password" mechanism as
# gitops/charts/postgresql's ragTechDatabase (ADR-0315 precedent), via
# mariadb-operator's own Database/User/Grant CRDs
# (k8s.mariadb.com/v1alpha1) rather than PGO's adopt-existing-Secret
# convention - see templates/database-pipeline.yaml. password is
# self-generated by ansible/roles/vault/tasks/install.yml (an internal
# service credential, not operator-supplied via confidential.yml).
pipelineDatabase:
  name: mlpipeline
  owner: mlpipeline
  vaultPath: rag/pipeline-db

# WP-06 follow-up: second pipeline database on this same shared instance,
# for mlops-dspa - see templates/database-mlops.yaml's
# header comment for why (mlops-dspa's own embeddedMariaDB mode is
# permanently broken post-restart: DSPO's health-check probe can't reach
# its self-managed, non-mesh-excluded pod). vaultPath matches
# gitops/charts/mlops/values.yaml's own metadataDatabase.externalMySQL.
# externalSecret.remoteKey (mlops/dspa-mysql, already scaffolded there).
mlopsDatabase:
  name: mlops
  owner: mlops
  vaultPath: mlops/dspa-mysql

# ADR-0216/WP-065: a third database on the same shared instance, real
# business content (imported SXA data) rather than pipeline metadata -
# still an internal service credential (only sales-db and rag-ingestion
# connect), self-generated the same way mlopsDatabase's is, not
# operator-supplied. Reuses this instance's existing mesh sidecar-
# exclusion fix (templates/mariadb.yaml) for free - no new mesh work
# needed for a second logical database on it.
sxaDatabase:
  name: sxa
  owner: sxa
  vaultPath: sxa/mariadb-db
