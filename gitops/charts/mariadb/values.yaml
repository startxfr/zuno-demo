# Shared by two ArgoCD Applications: operator (zuno-mariadb-d0) renders the
# MariaDB Enterprise Operator Subscription/OperatorGroup, mariadbOperand
# (zuno-mariadb-d1) renders the MariaDB/PhysicalBackup CRs and their
# ExternalSecrets. Both default false so `helm template`/`helm lint` render
# nothing.
mariadbOperand:
  enabled: false

# subscription.name/operator.name/operator.channel/operator.source.name are
# all discovered at run time by ansible/roles/mariadb/tasks/install.yml and
# set via gitops_app_extra_helm_values (ADR-0048) - the known package name
# is "mariadb-operator" (the open-source, Apache-2.0 community-operators
# listing - not the paid "mariadb-enterprise-operator" certified listing,
# which needs MariaDB Enterprise registry credentials this cluster doesn't
# have), but it's still resolved from the live cluster's PackageManifest
# rather than hardcoded here, same as postgresql/jobset/kueue.
# templates/checks.yaml fails the render if any is still empty once
# operator.enabled is true.
#
# No OperatorGroup: this package's CSV supports every install mode
# (OwnNamespace/SingleNamespace/MultiNamespace/AllNamespaces all
# confirmed true against a live cluster's PackageManifest), so - same as
# gitops/charts/postgresql - it's subscribed into the shared
# openshift-operators namespace and relies on OpenShift's own default
# global OperatorGroup there (AllNamespaces) rather than a dedicated one.
# This also sidesteps the MultipleOperatorGroupsFound conflict a
# dedicated, namespace-scoped OperatorGroup in zuno-data previously hit
# on a live cluster (a stray pre-existing OperatorGroup there, unrelated
# to this chart).
operator:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: mariadb
    app: mariadb
  subscription:
    enabled: true
    name: ""
    namespace: openshift-operators
    operator:
      # Must be set explicitly, same name as subscription.name: the
      # vendored `operator` chart's own values.yaml gives this a
      # non-empty default ("codeready-workspaces") that wins the merge
      # and silently suppresses the fallback to subscription.name.
      name: ""
      channel: ""
      installPlanApproval: Automatic  # startx chart defaults to Manual
      source:
        name: ""
        namespace: openshift-marketplace

# mariadb-operator ships as an operator-sdk Helm-operator: its CSV
# Deployment is a thin controller that only runs its embedded Helm chart
# (and so only starts the real mariadb-operator controller-manager that
# reconciles MariaDB CRs) once a MariadbOperator CR exists - see
# templates/mariadboperator.yaml. Same "operator needs an
# activation/config singleton CR" shape gitops/charts/jobset's
# JobSetOperator / gitops/charts/kueue's Kueue CR already use.
mariadbOperatorActivation:
  # No ServiceMonitor CRD assumed installed - kept minimal, everything
  # else left at the CSV's own embedded-chart defaults.
  metrics:
    enabled: false

# Single-node MariaDB (k8s.mariadb.com/v1alpha1 MariaDB CR).
cluster:
  replicas: 1
  storageClassName: gp3-csi
  storageSize: 100Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  myCnf: |
    [mariadb]
    bind-address=*
    max_connections=200

credentials:
  # Resolves to Vault path zuno/mariadb/root (single `password` field -
  # MariaDB's root user is fixed, unlike postgresql's configurable owner
  # role). Seeded by ansible/roles/vault/tasks/install.yml.
  rootVaultPath: mariadb/root
  secretStoreName: vault-backend
  refreshInterval: 1h

# PhysicalBackup (k8s.mariadb.com/v1alpha1) only renders once real
# S3 credentials exist - same "never rendered half-configured" rule
# gitops/charts/postgresql's repo2 follows. bucket/endpoint/region are not
# secret and are set via gitops_app_extra_helm_values by
# ansible/roles/mariadb/tasks/install.yml; access-key-id/secret-access-key
# are secret and come from Vault (zuno/mariadb/s3) via
# templates/externalsecret-backup-s3.yaml.
backups:
  schedule: "0 */6 * * *"
  maxRetention: 168h
  compression: gzip
  s3:
    enabled: false
    bucket: zuno-mariadb-backups
    prefix: zuno-mariadb
    region: eu-west-2
    endpoint: s3.eu-west-2.amazonaws.com
    secretName: mariadb-backup-s3
    vaultPath: mariadb/s3
