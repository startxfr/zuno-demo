{{- if .Values.mariadbOperand.enabled }}
# ADR-0535/WP-110: RHTAS Trillian's dedicated database on the same shared
# `mariadb` instance - mirrors templates/database-mlops.yaml exactly
# (Database/User/Grant, k8s.mariadb.com/v1alpha1). ADR-0535's Design
# decisions place Trillian here rather than on the rhtas-operator's own
# self-managed MySQL (`trillian.database.create: true`), for the same
# reason mlops-dspa abandoned DSPO's embeddedMariaDB mode: an
# operator-managed database pod sits outside this chart's and the mesh's
# control (no CRD field for istio port exclusions), while this shared
# instance is already mesh-excluded (templates/mariadb.yaml's
# excludeInboundPorts + the DestinationRule) and Vault-backed. Trillian's
# schema is created by its own components on first boot against an empty
# database. Password is self-generated by
# ansible/roles/vault/tasks/install.yml (zuno/rhtas/trillian-mysql), an
# internal service credential, not operator-supplied.
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: {{ .Values.rhtasTrillianDatabase.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
spec:
  mariaDbRef:
    name: mariadb
  characterSet: utf8mb4
  collate: utf8mb4_unicode_ci
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: {{ .Values.rhtasTrillianDatabase.owner }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
spec:
  mariaDbRef:
    name: mariadb
  # "Bring your own password" - the Secret is pre-seeded from Vault by
  # templates/externalsecret-rhtas-trillian-db.yaml, sync-wave -35, ahead
  # of this User CR at -25.
  passwordSecretKeyRef:
    name: mariadb-rhtas-trillian-db-password
    key: password
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: {{ .Values.rhtasTrillianDatabase.owner }}-grant
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-24"
spec:
  mariaDbRef:
    name: mariadb
  privileges:
    - "ALL PRIVILEGES"
  database: {{ .Values.rhtasTrillianDatabase.name }}
  table: "*"
  username: {{ .Values.rhtasTrillianDatabase.owner }}
  grantOption: false
{{- end }}
