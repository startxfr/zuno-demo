{{- if .Values.mariadbOperand.enabled }}
# Syncs the pre-seeded Vault zuno/rhtas/trillian-mysql credential
# (self-generated by ansible/roles/vault/tasks/install.yml, an internal
# service credential - not operator-supplied via ansible/confidential.yml)
# into the Secret the User CR's passwordSecretKeyRef expects
# (templates/database-rhtas-trillian.yaml). The rhtas chart independently
# resolves the same Vault path into its own zuno-rhtas namespace for the
# Securesign CR's databaseSecretRef (secretKeyRef can't cross namespaces).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mariadb-rhtas-trillian-db-password
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: mariadb-rhtas-trillian-db-password
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.rhtasTrillianDatabase.vaultPath }}
        property: password
{{- end }}
