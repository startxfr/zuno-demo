{{- if .Values.mariadbOperand.enabled }}
# ADR-0216/WP-065: a third database on the same shared `mariadb` instance,
# mirrors templates/database-mlops.yaml exactly (Database/User/Grant,
# k8s.mariadb.com/v1alpha1). Unlike mlpipeline/mlops (Kubeflow Pipelines
# metadata), this one holds real imported SXA business content served to
# agents via sales-db (MCP) and rag-ingestion (RAG) - still an internal
# service credential, still reusing this instance's already-solved mesh
# sidecar-exclusion fix (templates/mariadb.yaml's excludeInboundPorts
# annotation), so no new mesh work is needed for this second real database.
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: {{ .Values.sxaDatabase.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
spec:
  mariaDbRef:
    name: mariadb
  characterSet: utf8mb4
  collate: utf8mb4_unicode_ci
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: {{ .Values.sxaDatabase.owner }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
spec:
  mariaDbRef:
    name: mariadb
  # "Bring your own password" - the Secret is pre-seeded from Vault by
  # templates/externalsecret-sxa-db.yaml, sync-wave -35, ahead of this
  # User CR at -25.
  passwordSecretKeyRef:
    name: mariadb-sxa-db-password
    key: password
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: {{ .Values.sxaDatabase.owner }}-grant
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-24"
spec:
  mariaDbRef:
    name: mariadb
  privileges:
    - "ALL PRIVILEGES"
  database: {{ .Values.sxaDatabase.name }}
  table: "*"
  username: {{ .Values.sxaDatabase.owner }}
  grantOption: false
{{- end }}
