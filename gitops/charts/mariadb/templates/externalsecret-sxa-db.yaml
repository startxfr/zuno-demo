{{- if .Values.mariadbOperand.enabled }}
# Syncs the self-generated Vault zuno/sxa/mariadb-db credential (seeded by
# ansible/roles/vault/tasks/install.yml, an internal service credential -
# not operator-supplied via ansible/confidential.yml) into the Secret the
# User CR's passwordSecretKeyRef expects (templates/database-sxa.yaml).
# Mirrors templates/externalsecret-mlops-db.yaml exactly.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mariadb-sxa-db-password
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: mariadb-sxa-db-password
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.sxaDatabase.vaultPath }}
        property: password
{{- end }}
