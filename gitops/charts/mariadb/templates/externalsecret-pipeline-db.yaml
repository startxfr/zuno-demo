{{- if .Values.mariadbOperand.enabled }}
# Syncs the pre-seeded Vault zuno/rag/pipeline-db credential (self-generated
# by ansible/roles/vault/tasks/install.yml, an internal service credential -
# not operator-supplied via ansible/confidential.yml) into the Secret the
# User CR's passwordSecretKeyRef expects (templates/database-pipeline.yaml).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mariadb-pipeline-db-password
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: mariadb-pipeline-db-password
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.pipelineDatabase.vaultPath }}
        property: password
{{- end }}
