{{- if .Values.mariadbOperand.enabled }}
# Syncs the pre-seeded Vault zuno/mariadb/root credential into the Secret
# the MariaDB CR's rootPasswordSecretKeyRef expects. MariaDB's root user is
# fixed (unlike postgresql's configurable owner role), so this is a
# single-field password Secret, not a username+password pair.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mariadb-root-password
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: mariadb-root-password
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.credentials.rootVaultPath }}
        property: password
{{- end }}
