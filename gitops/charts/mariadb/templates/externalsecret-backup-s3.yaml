{{- if and .Values.mariadbOperand.enabled .Values.backups.s3.enabled }}
# Syncs the pre-seeded Vault zuno/mariadb/s3 credential into the Secret
# templates/physicalbackup.yaml's accessKeyIdSecretKeyRef/
# secretAccessKeySecretKeyRef reference directly - no s3.conf templated
# file needed (unlike postgresql's pgBackRest repo, which expects a
# generated config file rather than discrete keys).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.backups.s3.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  # ADR-0602/WP-223: this namespace's own SecretStore, which reads only the keys platform/vault/secret-access.yaml grants it.
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ .Values.backups.s3.secretName }}
  data:
    - secretKey: access-key-id
      remoteRef:
        key: {{ .Values.backups.s3.vaultPath }}
        property: accessKeyId
    - secretKey: secret-access-key
      remoteRef:
        key: {{ .Values.backups.s3.vaultPath }}
        property: secretAccessKey
{{- end }}
