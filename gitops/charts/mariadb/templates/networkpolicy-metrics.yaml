{{- if .Values.mariadbOperand.enabled }}
{{- if .Values.cluster.metrics.enabled }}
# ADR-0413: admits prometheus-k8s's scrape of the mysqld-exporter sidecar
# mariadb-operator adds when spec.metrics.enabled (templates/mariadb.yaml) -
# zuno-data's baseline is zuno-default-deny-other-namespaces
# (gitops/charts/namespaces), which admits neither openshift-monitoring nor
# openshift-user-workload-monitoring by default. mysqld-exporter's default
# port is 9104 (mariadb-operator's own default, `spec.metrics.exporter.port`
# left unset here) - UNVERIFIED against this live cluster's actual generated
# pod spec; adjust if it differs once applied. Precise allow-list, same
# pattern as gitops/charts/postgresql/templates/networkpolicy-metrics.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zuno-mariadb-exporter-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mariadb
      app.kubernetes.io/instance: mariadb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - protocol: TCP
          port: 9104
{{- end }}
{{- end }}
