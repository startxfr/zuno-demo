{{- if .Values.mariadbOperand.enabled }}
# mariadb-operator MariaDB CR. Requires the operator's controller-manager
# to actually be running, which only happens once the MariadbOperator
# activation CR (templates/mariadboperator.yaml) has been reconciled -
# both applied by the same zuno-mariadb-d1 Application, ordered by
# sync-wave ahead of this one.
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  replicas: {{ .Values.cluster.replicas }}
  # VERIFIED live 2026-08-18: MySQL is a SERVER-FIRST protocol, and the
  # istio sidecar this pod gained with the zuno-data mesh phase never
  # delivers the server greeting to a PLAINTEXT NON-MESH client (measured:
  # TCP connects, zero greeting bytes after 12s; instant on localhost) -
  # istio's protocol sniffing waits for client bytes that never come.
  # MariaDB's real client mix cannot be fully meshed: RHOAI's DSP
  # components (ds-pipeline apiserver/MLMD for rag-dspa) deploy WITHOUT
  # sidecars and are not this repo's pods to inject - MLMD crash-looped on
  # mysql_real_connect until this exclusion. 3306 is therefore deliberately
  # taken OUT of sidecar interception (the sidecar stays for everything
  # else); templates/destinationrule-mariadb.yaml is the mandatory other
  # half - without it, in-mesh clients' auto-mTLS would send TLS to a now-
  # plaintext port. The Service-port appProtocol alternative (keeps mTLS)
  # is not expressible through this operator's CR (`oc explain
  # mariadb.spec.service`, 2026-08-18: type/LB/metadata only, no ports).
  podMetadata:
    annotations:
      traffic.sidecar.istio.io/excludeInboundPorts: "3306"
  # VERIFIED live 2026-08-18 (rag-dspa recovery, final layer): RHOAI's
  # DSPO unconditionally propagates the ODH trusted-CA bundle to every
  # DSPA component - MLMD starts with --mysql_config_sslrootcert and the
  # KFP apiserver wraps its MySQL connections in TLS, no opt-out field -
  # so a TLS-less MariaDB fatal-loops them both (podToPodTLS only governs
  # component-to-component gRPC, not the MySQL client config). That
  # bundle's first entry is the Vault PKI root (CN=zuno-demo.internal,
  # the same root ADR-0347/0411 already trust platform-wide), so a server
  # cert issued by cert-manager's vault-issuer chains correctly for DSP
  # with zero DSPO-side config. required stays false: sales-db-mcp and
  # the mariadb-operator's own connections keep speaking plaintext -
  # MariaDB TLS is per-connection optional, only clients that ASK for TLS
  # (the DSP components) get it.
  tls:
    enabled: true
    required: false
    serverCertIssuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: vault-issuer
  rootPasswordSecretKeyRef:
    name: mariadb-root-password
    key: password
  storage:
    size: {{ .Values.cluster.storageSize }}
    storageClassName: {{ .Values.cluster.storageClassName }}
  resources:
    requests:
      cpu: {{ .Values.cluster.resources.requests.cpu | quote }}
      memory: {{ .Values.cluster.resources.requests.memory | quote }}
    limits:
      cpu: {{ .Values.cluster.resources.limits.cpu | quote }}
      memory: {{ .Values.cluster.resources.limits.memory | quote }}
  myCnf: |
{{ .Values.cluster.myCnf | indent 4 }}
{{- end }}
