{{- if .Values.mariadbOperand.enabled }}
# mariadb-operator MariaDB CR. Requires the operator's controller-manager
# to actually be running, which only happens once the MariadbOperator
# activation CR (templates/mariadboperator.yaml) has been reconciled -
# both applied by the same zuno-mariadb-d1 Application, ordered by
# sync-wave ahead of this one.
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb
  namespace: {{ .Release.Namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  replicas: {{ .Values.cluster.replicas }}
  # MySQL is a SERVER-FIRST protocol, and the istio sidecar this pod
  # gained with the zuno-data mesh phase never delivers the server
  # greeting to a PLAINTEXT NON-MESH client - istio's protocol sniffing
  # waits for client bytes that never come. MariaDB's real client mix
  # cannot be fully meshed: RHOAI's DSP components (ds-pipeline
  # apiserver/MLMD for rag-dspa) deploy WITHOUT sidecars and are not this
  # repo's pods to inject - MLMD crash-looped on mysql_real_connect until
  # this exclusion. 3306 is therefore deliberately taken OUT of sidecar
  # interception (the sidecar stays for everything else);
  # templates/destinationrule-mariadb.yaml is the mandatory other half -
  # without it, in-mesh clients' auto-mTLS would send TLS to a now-
  # plaintext port. The Service-port appProtocol alternative (keeps mTLS)
  # is not expressible through this operator's CR (`oc explain
  # mariadb.spec.service` shows only type/LB/metadata, no ports).
  podMetadata:
    annotations:
      traffic.sidecar.istio.io/excludeInboundPorts: "3306"
  # RHOAI's DSPO unconditionally propagates the ODH trusted-CA bundle to
  # every DSPA component - MLMD starts with --mysql_config_sslrootcert and the
  # KFP apiserver wraps its MySQL connections in TLS, no opt-out field -
  # so a TLS-less MariaDB fatal-loops them both (podToPodTLS only governs
  # component-to-component gRPC, not the MySQL client config). That
  # bundle's first entry is the Vault PKI root (CN=zuno-demo.internal,
  # the same root ADR-0347/0411 already trust platform-wide), so a server
  # cert issued by cert-manager's vault-issuer chains correctly for DSP
  # with zero DSPO-side config. required stays false: sales-db-mcp and
  # the mariadb-operator's own connections keep speaking plaintext -
  # MariaDB TLS is per-connection optional, only clients that ASK for TLS
  # (the DSP components) get it.
  tls:
    enabled: true
    required: false
    serverCertIssuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      # NOT the shared vault-issuer: the operator's fixed SAN set needs
      # the scoped pki/roles/mariadb (templates/clusterissuer-mariadb.yaml).
      name: vault-issuer-mariadb
  rootPasswordSecretKeyRef:
    name: mariadb-root-password
    key: password
  storage:
    size: {{ .Values.cluster.storageSize }}
    storageClassName: {{ .Values.cluster.storageClassName }}
  resources:
    requests:
      cpu: {{ .Values.cluster.resources.requests.cpu | quote }}
      memory: {{ .Values.cluster.resources.requests.memory | quote }}
    limits:
      cpu: {{ .Values.cluster.resources.limits.cpu | quote }}
      memory: {{ .Values.cluster.resources.limits.memory | quote }}
  myCnf: |
{{ .Values.cluster.myCnf | indent 4 }}
{{- if .Values.cluster.metrics.enabled }}
  metrics:
    enabled: true
    passwordSecretKeyRef:
      name: {{ .Values.cluster.metrics.passwordSecretKeyRef.name }}
      key: {{ .Values.cluster.metrics.passwordSecretKeyRef.key }}
      generate: {{ .Values.cluster.metrics.passwordSecretKeyRef.generate }}
    exporter:
      # mariadb-0 itself is not Istio-injected, but this exporter pod is
      # (namespace-wide sidecar injection). Two separate mesh interception
      # points broke this exporter, found live 2026-08-22:
      #  1. Outbound: the exporter's own /probe call dials mariadb-0:3306
      #     in-cluster - MySQL's wire protocol is server-first (the server
      #     sends the greeting before the client sends anything), which
      #     trips Envoy's outbound protocol sniffing/mTLS origination the
      #     same way it did for MariaDB in the DSPA case.
      #  2. Inbound: openshift-monitoring's Prometheus (not itself
      #     mesh-injected) scraping this pod's :9104 would hang
      #     indefinitely rather than fail cleanly (confirmed by execing
      #     into prometheus-k8s-0 and curling the exporter Service - the
      #     connection never completed) - Envoy's inbound listener on 9104
      #     stalling on a plain-HTTP client it expected to protocol-sniff/
      #     mTLS-negotiate with.
      # Excluding both ports from the sidecar's interception is the fix;
      # the exporter gains nothing from mesh membership on either port -
      # Prometheus is outside the mesh and MariaDB itself isn't meshed.
      podMetadata:
        annotations:
          traffic.sidecar.istio.io/excludeOutboundPorts: "3306"
          traffic.sidecar.istio.io/excludeInboundPorts: "9104"
    serviceMonitor:
      interval: {{ .Values.cluster.metrics.serviceMonitor.interval }}
{{- end }}
{{- end }}
