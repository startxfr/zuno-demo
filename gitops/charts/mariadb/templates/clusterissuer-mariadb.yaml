{{- if .Values.mariadbOperand.enabled }}
# Dedicated issuer for the MariaDB server cert (see mariadb.yaml's tls
# block): mariadb-operator requests a fixed wide SAN set (short service
# names, *.mariadb-internal wildcards, localhost) that the shared
# vault-issuer's pki/roles/cert-manager rightly refuses - this issuer
# signs through the scoped pki/roles/mariadb instead (provisioned by
# ansible/roles/vault's configure script, same isolation precedent
# as pki/roles/istio). Same TokenRequest-based auth shape as
# gitops/charts/cert-manager/templates/clusterissuer.yaml; the Vault
# service name is stable platform infrastructure, referenced directly
# like every other cross-namespace service in this chart's family.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-issuer-mariadb
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-35"
spec:
  vault:
    # ADR-0602 clause 1 / WP-223: Vault's listener serves TLS with an
    # OpenShift service-ca certificate. caBundle is that CA (base64 PEM),
    # read by ansible/tasks/resolve_vault_ca_bundle.yml from the
    # openshift-service-ca.crt ConfigMap and injected as vaultCaBundle - a
    # ClusterIssuer cannot reference a ConfigMap. The service CA rotates
    # (about yearly, with an overlap period): re-run the owning role
    # (`make d0|d1 install ...`) after a rotation, or issuance fails with an
    # x509 error once the old CA expires.
    server: "https://zuno-vault.zuno-vault.svc:8200"
    {{- with .Values.vaultCaBundle }}
    caBundle: {{ . | quote }}
    {{- end }}
    path: pki/sign/mariadb
    auth:
      kubernetes:
        role: mariadb-issuer
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          name: cert-manager
{{- end }}
