apiVersion: v2
name: mariadb
description: >-
  MariaDB Enterprise Operator (OLM Subscription, channel/catalog discovered
  at Ansible run time - ADR-0048) and a single-node MariaDB CR with a
  Vault-backed root password and an optional S3-backed PhysicalBackup
  schedule. Depends on startx's generic `operator` chart, not a MariaDB-
  specific one - same "fuzzy-discovered at run time" shape as
  gitops/charts/postgresql. No `project` dependency: the destination
  namespace (zuno-data) already exists, created by gitops/charts/namespaces
  and shared with gitops/charts/postgresql's PGO operand.
type: application
version: 0.1.0
appVersion: "25.8"
dependencies:
  - name: operator
    version: "21.3.277"
    repository: "alias:startx"
