# `status: active` namespaces host real workloads (only zuno-agent-tekos in
# v0); `status: placeholder` namespaces are created and labeled but stay empty.
namespaces:
  - name: zuno-agent-comage
    agent: comage
    status: placeholder
    displayName: Zuno Agent Comage
    description: >-
      Sales assistant - placeholder namespace reserved for the
      follow-up/PO-tracking agent (ADR-0023).
  - name: zuno-agent-tekos
    agent: tekos
    status: active
    displayName: Zuno Agent Tekos
    description: Technical consultant assistant - the only active v0 agent instance.
  - name: zuno-agent-advantage
    agent: advantage
    status: placeholder
    displayName: Zuno Agent Advantage
    description: >-
      Sales administration assistant - placeholder namespace reserved for
      new-business/PO reporting.
  - name: zuno-agent-finage
    agent: finage
    status: placeholder
    displayName: Zuno Agent Finage
    description: >-
      Finance assistant - placeholder namespace reserved for
      invoicing-readiness reporting.
  - name: zuno-agent-arkos
    agent: arkos
    status: placeholder
    displayName: Zuno Agent Arkos
    description: >-
      Architecture assistant - placeholder namespace reserved for
      DAT/Odyssey-workshop support.

# Default ResourceQuota applied to every agent namespace regardless of status.
quota:
  requestsCpu: "4"
  requestsMemory: 8Gi
  limitsCpu: "8"
  limitsMemory: 16Gi
  pods: "20"

# Default-deny-other-namespaces baseline platform namespaces, same as the
# agent namespaces above. zuno-ai-run is deliberately excluded: it hosts
# mcp-sales-db, which must not trust arbitrary same-namespace pods, so a
# namespace-wide baseline would silently defeat its per-workload
# NetworkPolicy (see gitops/charts/mcp-sales-db). zuno-ai-build is also
# excluded - it's created and given its own baseline by the Day 1 build
# mechanism, not this Day 0 chart.
#
# allowedFromNamespaces are granted at the namespace level rather than
# per-workload (proportionate for demo scale; tightening is a v1 follow-up).
platformNamespaces:
  - name: zuno-auth
    displayName: Zuno Authentication
    description: Keycloak, the platform's central identity provider.
    # Keycloak: JWKS/token-endpoint callers.
    allowedFromNamespaces:
      - zuno-agent-tekos
      - zuno-ai-run
  - name: zuno-vault
    displayName: Zuno Vault
    description: >-
      HashiCorp Vault and External Secrets Operator, the platform's secret
      storage.
    # cert-manager's operand pods run in the fixed "cert-manager" namespace
    # (Red Hat operator hardcoded), not a zuno-* one.
    allowedFromNamespaces:
      - cert-manager
      - zuno-ai-run
      - zuno-auth
      - zuno-data
    # ESO's secretstore-validate webhook (failurePolicy: Fail) lives here and
    # is called synchronously by the API server on every SecretStore write.
    allowApiServerWebhooks: true
  - name: zuno-data
    displayName: Zuno Data
    description: >-
      PostgreSQL and pgvector, the platform's persistent data and RAG vector
      store.
    # postgresql: sales-db-mcp (cross-ns). vault: ESO's ClusterSecretStore
    # controller. keycloak: dedicated postgres database, ADR-0315.
    allowedFromNamespaces:
      - zuno-ai-run
      - zuno-vault
      - zuno-auth
  - name: zuno-telemetry
    displayName: Zuno Telemetry
    description: OpenTelemetry Collector, the platform's observability pipeline.
    # OTel Collector: every OTel-instrumented service.
    allowedFromNamespaces:
      - zuno-ai-run
      - zuno-data
  - name: zuno-ai-build
    displayName: Zuno AI Build
    description: >-
      In-cluster OpenShift build pipeline producing this platform's
      component images.
    allowedFromNamespaces:
      - zuno-ai-run
      - zuno-data
  - name: zuno-ai-run
    displayName: Zuno AI Runtime
    description: >-
      Agent Runtime, AI Gateway and MCP Gateway - shared runtime hosting
      every active agent.
    allowedFromNamespaces: []
    # RHOAI dashboard label, folded in here since this chart already owns
    # zuno-ai-run's Namespace object.
    extraLabels:
      opendatahub.io/dashboard: "true"

# Caps GPU consumption at 1 - this demo has exactly one 24GB L4 budgeted for the
# single local model; without this a second InferenceService could silently
# starve it.
openshiftAi:
  namespace: zuno-ai-run
  gpuQuota:
    requestsGpu: "1"
    limitsGpu: "1"
