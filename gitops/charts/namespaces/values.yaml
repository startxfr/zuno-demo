# Gates which half of this chart renders - namespace.enabled for the Day 0
# Namespace objects (gitops/apps/namespaces/application-d0.yaml), policy.enabled
# for the Day 1 ResourceQuota/NetworkPolicy overlay (application-d1.yaml).
# Both default false so `helm template` with no overrides renders nothing.
namespace:
  enabled: false
policy:
  enabled: false

# ADR-0329 (supersedes ADR-0023): agent workloads no longer get a
# dedicated zuno-agent-<name> namespace. Every active agent's FE/BFF
# deploys into the shared zuno-ai-run namespace instead (see
# platformNamespaces below); this chart no longer creates or quotas any
# per-agent namespace.

# Default-deny-other-namespaces baseline platform namespaces. zuno-ai-run is deliberately excluded: it hosts
# mcp-sales-db, which must not trust arbitrary same-namespace pods, so a
# namespace-wide baseline would silently defeat its per-workload
# NetworkPolicy (see gitops/charts/mcp-sales-db). zuno-ai-build is also
# excluded - it's created and given its own baseline by the Day 1 build
# mechanism, not this Day 0 chart.
#
# allowedFromNamespaces are granted at the namespace level rather than
# per-workload (proportionate for demo scale; tightening is a v1 follow-up).
platformNamespaces:
  - name: zuno-auth
    displayName: Zuno Authentication
    description: Keycloak, the platform's central identity provider.
    # Keycloak: JWKS/token-endpoint callers.
    allowedFromNamespaces:
      - zuno-ai-run
    # Sidecar-injected + mTLS-enforced (service-mesh component, phase 3).
    # zuno.io/managed: ADR-0320 - see templates/namespace.yaml's comment.
    extraLabels:
      istio-injection: enabled
      zuno.io/managed: "true"
  - name: zuno-vault
    displayName: Zuno Vault
    description: >-
      HashiCorp Vault and External Secrets Operator, the platform's secret
      storage.
    # cert-manager's operand pods run in the fixed "cert-manager" namespace
    # (Red Hat operator hardcoded), not a zuno-* one.
    allowedFromNamespaces:
      - cert-manager
      - zuno-ai-run
      - zuno-auth
      - zuno-data
    # ESO's secretstore-validate webhook (failurePolicy: Fail) lives here and
    # is called synchronously by the API server on every SecretStore write.
    allowApiServerWebhooks: true
    # zuno.io/managed: ADR-0320 - see templates/namespace.yaml's comment.
    extraLabels:
      zuno.io/managed: "true"
  - name: zuno-data
    displayName: Zuno Data
    description: >-
      PostgreSQL and pgvector, the platform's persistent data and RAG vector
      store.
    # postgresql: sales-db-mcp (cross-ns). vault: ESO's ClusterSecretStore
    # controller. keycloak: dedicated postgres database, ADR-0315.
    # redhat-ods-applications: maas-api's dedicated maas database on
    # zuno-postgresql (MaaS prerequisite - see
    # gitops/charts/openshift-ai/templates/externalsecret-maas-db.yaml).
    allowedFromNamespaces:
      - zuno-ai-run
      - zuno-vault
      - zuno-auth
      - redhat-ods-applications
    # Sidecar-injected + mTLS-enforced (service-mesh component, phase 2).
    # zuno.io/managed: ADR-0320 - see templates/namespace.yaml's comment.
    extraLabels:
      istio-injection: enabled
      zuno.io/managed: "true"
  - name: zuno-monitoring
    displayName: Zuno Infra AI Monitoring
    description: >-
      OpenTelemetry Collector, Tempo and the OpenShift AI monitoring
      stack - the platform's tracing/telemetry/monitoring pipeline for the
      AI chain and apps.
    # OTel Collector: every OTel-instrumented service. zuno-auth/zuno-ai-build
    # added alongside zuno-ai-run/zuno-data so every meshed (istio-injection:
    # enabled) namespace's sidecars can export traces directly to the
    # collector (service-mesh component's OTel tracing provider).
    allowedFromNamespaces:
      - zuno-ai-run
      - zuno-data
      - zuno-auth
      - zuno-ai-build
    # zuno.io/managed: ADR-0320 - see templates/namespace.yaml's comment.
    extraLabels:
      zuno.io/managed: "true"
  - name: zuno-ai-platform
    displayName: Zuno AI Platform
    description: >-
      Formerly the shared OpenShift AI control plane (ADR-0328). RHOAI
      operands now live in redhat-ods-applications instead (ADR-0331 -
      trainer/ray/dashboard/mlflowoperator all broke under a custom
      applicationsNamespace on RHOAI 3.5 EA2). Left in place, empty of RHOAI
      operands, pending a follow-up decision on removal/repurposing.
    allowedFromNamespaces: []
    extraLabels:
      istio-injection: enabled
      zuno.io/managed: "true"
  - name: zuno-ai-build
    displayName: Zuno Infra AI Runtime
    description: >-
      In-cluster OpenShift build pipeline producing this platform's
      component images.
    allowedFromNamespaces:
      - zuno-ai-run
      - zuno-data
    # Sidecar-injected + mTLS-enforced (service-mesh component, phase 4).
    # zuno.io/managed: ADR-0320 - see templates/namespace.yaml's comment.
    extraLabels:
      istio-injection: enabled
      zuno.io/managed: "true"
  - name: zuno-ai-run
    displayName: Zuno AI Runtime
    description: >-
      Agent Runtime, AI Gateway and MCP Gateway - shared runtime hosting
      every active agent.
    allowedFromNamespaces: []
    # ADR-0111: this entry still owns zuno-ai-run's Namespace/ResourceQuota/
    # LimitRange objects (all three also range over platformNamespaces),
    # but must NOT get the zuno-default-deny-other-namespaces NetworkPolicy
    # every other entry gets - that policy's "same-namespace traffic always
    # allowed" ingress rule has no port restriction, so it would silently
    # grant every zuno-ai-run pod (agent-runtime, ai-gateway, ...) access to
    # every port of every other zuno-ai-run pod, additively overriding
    # mcp-sales-db's own precise, port-8000-only, gateway-only
    # NetworkPolicy (ADR-0037) - exactly the risk this file's own comment
    # above already documented in prose but templates/
    # networkpolicy-platform.yaml never actually enforced (a real,
    # newly-fixed gap: this entry was silently included in the same range
    # that comment says excludes it).
    skipNetworkPolicy: true
    # RHOAI dashboard label, folded in here since this chart already owns
    # zuno-ai-run's Namespace object. istio-injection: sidecar-injected +
    # mTLS-enforced (service-mesh component, phase 4).
    # zuno.io/managed: ADR-0320 - see templates/namespace.yaml's comment.
    extraLabels:
      opendatahub.io/dashboard: "true"
      istio-injection: enabled
      zuno.io/managed: "true"
  - name: zuno-mesh
    displayName: Zuno Service Mesh
    description: >-
      Istio control plane (istiod), IstioCNI and istio-csr - the platform's
      mesh/mTLS layer (service-mesh component).
    # istiod's XDS server is polled by sidecars in every meshed namespace.
    # zuno-vault is deliberately NOT meshed (it's the mTLS/PKI trust root
    # for everything else - meshing it risks a bootstrap circularity).
    allowedFromNamespaces:
      - zuno-data
      - zuno-auth
      - zuno-ai-run
      - zuno-ai-build
    # zuno.io/managed: ADR-0320 - see templates/namespace.yaml's comment.
    extraLabels:
      zuno.io/managed: "true"
    # istiod's sidecar-injector + validating webhooks are called synchronously
    # by the API server, same pattern as ESO's secretstore-validate webhook.
    allowApiServerWebhooks: true

  # ADR-0331: RHOAI's own default namespaces, given the same governance
  # (labels/NetworkPolicy/quota) zuno-ai-platform used to get, now that
  # applicationsNamespace/monitoring.namespace/registriesNamespace are all
  # reverted to RHOAI defaults instead of custom zuno-* ones.
  - name: redhat-ods-operator
    displayName: RHOAI Operator
    description: >-
      rhods-operator's own controller-manager, OLM Subscription and
      OperatorGroup (ADR-0047) - installs/reconciles DataScienceCluster and
      DSCInitialization elsewhere. zuno-namespaces-d0 is this namespace's
      sole owner: gitops/charts/openshift-ai's vendored project block is
      explicitly disabled (see gitops/apps/openshift-ai/application-d0.yaml)
      because enabling it there too made ArgoCD report Namespace/
      redhat-ods-operator as shared between zuno-openshift-ai-d0 and this
      Application. That Application keeps syncOptions.CreateNamespace=true
      as a harmless, untracked fallback only.
    allowedFromNamespaces: []
    # ASSUMPTION, not verified against a live cluster: rhods-operator
    # commonly ships a ValidatingWebhookConfiguration for its own CRs
    # (DataScienceCluster/DSCInitialization). Included defensively, same
    # posture as zuno-vault/zuno-mesh above - low-cost if unneeded, avoids a
    # silent DSC/DSCI apply failure if it is.
    allowApiServerWebhooks: true
    extraLabels:
      zuno.io/managed: "true"
    resourceQuota:
      requests: { cpu: "500m", memory: "512Mi" }
      limits: { cpu: "2", memory: "2Gi" }
    limitRange:
      defaultRequest: { cpu: "50m", memory: "128Mi" }
      default: { cpu: "500m", memory: "512Mi" }
  - name: redhat-ods-applications
    displayName: RHOAI Applications Namespace
    description: >-
      RHOAI 3.5 EA2's default applications namespace (ADR-0331 - reverted
      from the custom zuno-ai-platform after trainer/ray/dashboard/
      mlflowoperator all broke under a custom one). Hosts the shared
      OpenShift AI control plane: KServe, MLflow, Trainer, Ray, Dashboard,
      AI Gateway, OGX, Spark Operator, Feast Operator, TrustyAI, Data
      Science Pipelines controllers.
    allowedFromNamespaces: []
    # VERIFIED: trainer's ValidatingWebhookConfiguration targets
    # kubeflow-trainer-controller-manager.redhat-ods-applications.svc
    # directly (confirmed live during mlflow-operator crash debugging) -
    # kube-apiserver must reach it synchronously.
    allowApiServerWebhooks: true
    extraLabels:
      opendatahub.io/application-namespace: "true"
      istio-injection: enabled
      zuno.io/managed: "true"
    resourceQuota:
      requests: { cpu: "4", memory: "8Gi" }
      limits: { cpu: "16", memory: "32Gi" }
    limitRange:
      defaultRequest: { cpu: "100m", memory: "256Mi" }
      default: { cpu: "1", memory: "1Gi" }
  - name: rhoai-model-registries
    displayName: RHOAI Model Registry
    description: >-
      Model Registry operand namespace (RHOAI's own default,
      registriesNamespace: rhoai-model-registries) - REST API + backing
      database bridging build (zuno-ai-build) and run (zuno-ai-run) model
      lifecycles (ADR-0328's Model Registry section).
    allowedFromNamespaces:
      - zuno-ai-build
      - zuno-ai-run
    allowApiServerWebhooks: false
    extraLabels:
      istio-injection: enabled
      zuno.io/managed: "true"
    resourceQuota:
      requests: { cpu: "500m", memory: "1Gi" }
      limits: { cpu: "2", memory: "4Gi" }
    limitRange:
      defaultRequest: { cpu: "100m", memory: "256Mi" }
      default: { cpu: "1", memory: "1Gi" }
  - name: redhat-ods-monitoring
    displayName: RHOAI Monitoring
    description: >-
      RHOAI's own monitoring/observability namespace (dashboard-perses,
      Prometheus integration) - reverted to the RHOAI default (ADR-0331)
      after dashboard was found not to derive its watched namespace from a
      custom DSCInitialization.spec.monitoring.namespace.
    # Mirrors zuno-monitoring's own allowedFromNamespaces, plus
    # redhat-ods-applications: dashboard-perses needs to reach into the
    # RHOAI control-plane namespace - the exact failure this namespace
    # exists to fix.
    allowedFromNamespaces:
      - zuno-ai-run
      - zuno-data
      - zuno-auth
      - zuno-ai-build
      - redhat-ods-applications
    allowApiServerWebhooks: false
    extraLabels:
      zuno.io/managed: "true"
    resourceQuota:
      requests: { cpu: "500m", memory: "1Gi" }
      limits: { cpu: "4", memory: "8Gi" }
    limitRange:
      defaultRequest: { cpu: "100m", memory: "256Mi" }
      default: { cpu: "1", memory: "2Gi" }

# Caps GPU consumption at 2: the chat model (qwen25-7b-instruct) and the
# embedding model (gitops/charts/models' embeddingModel) each request one
# GPU - the embedding model's image.vllm build is CUDA-only, so it can't
# run without one (ADR-0048 discovery prefers the CUDA-flavored template;
# verified on-cluster: it crashes with "Failed to infer device type"
# otherwise). Matches this demo's two real GPU nodes (one L4 each, verified
# on-cluster). Raised from 1 (originally sized for the chat model alone,
# before the embedding model needed its own GPU) - without this quota
# matching real capacity, the second InferenceService's pod is refused
# admission with "exceeded quota" rather than silently starving the first.
openshiftAi:
  namespace: zuno-ai-run
  gpuQuota:
    requestsGpu: "2"
    limitsGpu: "2"
