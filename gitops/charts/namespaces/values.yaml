# One entry per agent instance (ADR-0007). `status: active` namespaces host
# real workloads (only zuno-agent-tekos in v0); `status: placeholder`
# namespaces are created and labeled but stay empty/reserved - see
# platform/architecture/agent-platform-separation.md and this chart's
# README.md. Namespace names follow the zuno-agent-<agent> convention
# (ADR-0023) so they read as a family alongside zuno-auth/zuno-ai-run/
# zuno-ai-build/zuno-data/zuno-telemetry.
namespaces:
  - name: zuno-agent-comage
    agent: comage
    status: placeholder
  - name: zuno-agent-tekos
    agent: tekos
    status: active
  - name: zuno-agent-advantage
    agent: advantage
    status: placeholder
  - name: zuno-agent-finage
    agent: finage
    status: placeholder
  - name: zuno-agent-arkos
    agent: arkos
    status: placeholder

# Default ResourceQuota applied to every agent namespace regardless of
# status, so the isolation model (ADR-0023) is real even for namespaces
# with nothing scheduled in them yet.
quota:
  requestsCpu: "4"
  requestsMemory: 8Gi
  limitsCpu: "8"
  limitsMemory: 16Gi
  pods: "20"

# ADR-0052: the same default-deny-other-namespaces baseline as the agent
# namespaces above, applied to the platform namespaces (zuno-auth,
# zuno-data, zuno-telemetry - created by this chart's own templates/
# namespace.yaml, same as the agent namespaces above; a prior revision
# assumed namespaces would be created by the Day 0 `namespaces` role.
# it hosts mcp-sales-db, which ADR-0037 requires NOT trust arbitrary
# same-namespace pods (agent-runtime/ai-gateway specifically must not reach
# it directly) - a namespace-wide "allow same namespace" baseline would
# silently defeat that per-workload restriction (Kubernetes NetworkPolicy
# selecting the same pod are additive/OR'd, so the broader baseline would
# win). Every zuno-ai-run workload instead gets its own precise
# NetworkPolicy in its own chart (gitops/charts/{agent-runtime,ai-gateway,
# mcp-gateway,mcp-sales-db,models}). zuno-ai-build is also NOT here, for a
# different reason: it's created and given its own self-contained baseline
# directly by the Day 1 build mechanism (ansible/tasks/
# apply_openshift_build.yml), not by this Day 0 chart - listing it here
# would make the Day 0 `namespaces` role's precheck (which reads this
# file's namespaces/platformNamespaces lists to know what must already
# exist) depend on Day 1 having partially run first.
#
# allowedFromNamespaces are known, real cross-namespace callers granted at
# the namespace level rather than precisely per-workload (proportionate for
# a demo-scale project - tightening to per-workload policies matching
# zuno-ai-run's is a documented v1 follow-up, not done here to keep this
# pass bounded).
platformNamespaces:
  - name: zuno-auth
    # Keycloak: JWKS/token-endpoint callers.
    allowedFromNamespaces:
      - zuno-agent-tekos
      - zuno-ai-run
  - name: zuno-data
    # postgresql: rag-service (same-ns, already covered) + sales-db-mcp
    # (zuno-ai-run, cross-ns). vault: External Secrets Operator's
    # ClusterSecretStore controller.
    allowedFromNamespaces:
      - zuno-ai-run
      - external-secrets
  - name: zuno-telemetry
    # OTel Collector: every OTel-instrumented service.
    allowedFromNamespaces:
      - zuno-ai-run
      - zuno-data
  - name: zuno-ai-build
    allowedFromNamespaces: 
      - zuno-ai-run
      - zuno-data
  - name: zuno-ai-run
    allowedFromNamespaces: []
    # ADR-0312: the RHOAI dashboard label used to be applied by a second,
    # independent Namespace object in ansible/roles/openshift_ai's own
    # kustomize (and re-declared a third time, label-less, by
    # ansible/roles/external_secrets) - this chart already owns
    # zuno-ai-run's Namespace via platformNamespaces above, so the label
    # is folded in here instead of leaving two/three appliers of the same
    # object.
    extraLabels:
      opendatahub.io/dashboard: "true"

# ADR-0312: GPU ResourceQuota for zuno-ai-run, applied here (not by
# gitops/charts/openshift-ai) for the same "one owner per Namespace-scoped
# object this chart already manages" reasoning as the dashboard label
# above. Caps GPU consumption at 1 - this demo has exactly one 24GB L4
# budgeted for the single local model (gitops/charts/models); without this
# a future second InferenceService could silently starve it.
openshiftAi:
  namespace: zuno-ai-run
  gpuQuota:
    requestsGpu: "1"
    limitsGpu: "1"
