# Gates which half of this chart renders - namespace.enabled for the Day 0
# Namespace objects (gitops/apps/namespaces/application-d0.yaml), policy.enabled
# for the Day 1 ResourceQuota/NetworkPolicy overlay (application-d1.yaml).
# Both default false so `helm template` with no overrides renders nothing.
namespace:
  enabled: false
policy:
  enabled: false

# ADR-0329 (supersedes ADR-0023): agent workloads no longer get a
# dedicated zuno-agent-<name> namespace. Every active agent's FE/BFF
# deploys into the shared zuno-ai-run namespace instead (see
# platformNamespaces below); this chart no longer creates or quotas any
# per-agent namespace.

# Default-deny-other-namespaces baseline platform namespaces. zuno-ai-run is deliberately excluded: it hosts
# mcp-confluence, which must not trust arbitrary same-namespace pods, so a
# namespace-wide baseline would silently defeat its per-workload
# NetworkPolicy (see gitops/charts/mcp-confluence). zuno-ai-build is also
# excluded - it's created and given its own baseline by the Day 1 build
# mechanism, not this Day 0 chart.
#
# allowedFromNamespaces are granted at the namespace level rather than
# per-workload (proportionate for demo scale; tightening is a v1 follow-up).
platformNamespaces:
  - name: zuno-auth
    displayName: Zuno Authentication
    description: Keycloak, the platform's central identity provider.
    # Keycloak: JWKS/token-endpoint callers.
    allowedFromNamespaces:
      - zuno-ai-run
      # ADR-0354: AAP Gateway's OIDC authenticator and any in-cluster
      # JWKS/token-endpoint calls to Keycloak (WP-072/WP-073).
      - zuno-aap
    # Sidecar-injected + mTLS-enforced (service-mesh component, phase 3).
    # zuno.io/managed: ADR-0320 - see templates/namespace.yaml's comment.
    extraLabels:
      istio-injection: enabled
      zuno.io/managed: "true"
  - name: zuno-vault
    displayName: Zuno Vault
    description: >-
      HashiCorp Vault and External Secrets Operator, the platform's secret
      storage.
    # cert-manager's operand pods run in the fixed "cert-manager" namespace
    # (Red Hat operator hardcoded), not a zuno-* one.
    allowedFromNamespaces:
      - cert-manager
      - zuno-ai-run
      - zuno-auth
      - zuno-data
      # ADR-0420/WP-068: the zuno-signer ServiceAccount and every debug
      # pod/Job that authenticates to Vault's platform-signer role live in
      # zuno-ai-build, alongside every other in-cluster build.
      - zuno-ai-build
    # ESO's secretstore-validate webhook (failurePolicy: Fail) lives here and
    # is called synchronously by the API server on every SecretStore write.
    allowApiServerWebhooks: true
    # zuno.io/managed: ADR-0320 - see templates/namespace.yaml's comment.
    extraLabels:
      zuno.io/managed: "true"
  - name: zuno-data
    displayName: Zuno Data
    description: >-
      PostgreSQL and pgvector, the platform's persistent data and RAG vector
      store.
    # postgresql: rag-service (cross-ns). vault: ESO's ClusterSecretStore
    # controller. keycloak: dedicated postgres database, ADR-0315.
    # redhat-ods-applications: maas-api's dedicated maas database on
    # zuno-postgresql (MaaS prerequisite - see
    # gitops/charts/openshift-ai/templates/externalsecret-maas-db.yaml).
    # zuno-ai-build: rag-dspa's DSP components (MLMD + KFP apiserver)
    # reach their mlpipeline MariaDB - without this entry, MLMD's
    # mysql_real_connect times out against a firewalled 3306, even though
    # the DSPO's own probe passes fine from redhat-ods-applications, which
    # IS allowed above.
    # zuno-mlops: mlops-dspa's own MLMD/apiserver, same MariaDB, same
    # reasoning - split into its own namespace (see zuno-mlops's own
    # description above).
    allowedFromNamespaces:
      - zuno-ai-run
      - zuno-vault
      - zuno-auth
      # ADR-0354: AAP Controller/Hub/EDA/Gateway each reach their own
      # dedicated database/role on this cluster (WP-072).
      - zuno-aap
      - redhat-ods-applications
      - zuno-ai-build
      - zuno-mlops
      # ADR-0535/WP-110: RHTAS Trillian's log-server/log-signer reach
      # their dedicated trillian database on the shared MariaDB (see
      # gitops/charts/mariadb/templates/database-rhtas-trillian.yaml).
      - zuno-rhtas
    # mariadb-operator's admission webhook (vmariadb-v1alpha1.kb.io etc.)
    # lives here and is called synchronously by the API server on every
    # MariaDB/Grant/User write - without this, the webhook call times out
    # ("context deadline exceeded") and the MariaDB CR sits in Degraded
    # forever, same failure class as ESO's secretstore-validate webhook
    # above.
    allowApiServerWebhooks: true
    # Sidecar-injected + mTLS-enforced (service-mesh component, phase 2).
    # zuno.io/managed: ADR-0320 - see templates/namespace.yaml's comment.
    extraLabels:
      istio-injection: enabled
      zuno.io/managed: "true"
  - name: zuno-monitoring
    displayName: Zuno Infra AI Monitoring
    description: >-
      OpenTelemetry Collector, Tempo and the OpenShift AI monitoring
      stack - the platform's tracing/telemetry/monitoring pipeline for the
      AI chain and apps.
    # OTel Collector: every OTel-instrumented service. zuno-auth/zuno-ai-build
    # added alongside zuno-ai-run/zuno-data so every meshed (istio-injection:
    # enabled) namespace's sidecars can export traces directly to the
    # collector (service-mesh component's OTel tracing provider).
    # openshift-grafana-operator: the Grafana operator's controller calls
    # back into its own managed Grafana instance's :3000 admin API
    # (grafana-service) to provision datasources/dashboards - blocked by
    # this default-deny policy otherwise (GrafanaReconciler's `failed to
    # authenticate with instance` / `request canceled while waiting for
    # connection`, even though same-namespace traffic to the same
    # Service/port succeeds).
    # zuno-mesh: Kiali's external_services.grafana health-check/link-out
    # (gitops/charts/kiali/templates/kiali.yaml) calls the same :3000
    # admin API from the Kiali pod - without this entry Kiali's Mesh page
    # shows Grafana as permanently "Unreachable", same failure class as
    # the entries above (blocked on this namespace's own ingress policy,
    # invisible from zuno-mesh's side).
    allowedFromNamespaces:
      - zuno-ai-run
      - zuno-data
      - zuno-auth
      - zuno-ai-build
      - zuno-mlops
      - openshift-grafana-operator
      - zuno-mesh
    # zuno.io/managed: ADR-0320 - see templates/namespace.yaml's comment.
    extraLabels:
      zuno.io/managed: "true"
  - name: zuno-ai-platform
    displayName: Zuno AI Platform
    description: >-
      Formerly the shared OpenShift AI control plane (ADR-0328). RHOAI
      operands now live in redhat-ods-applications instead (ADR-0331 -
      trainer/ray/dashboard/mlflowoperator all broke under a custom
      applicationsNamespace on RHOAI 3.5 EA2). Left in place, empty of RHOAI
      operands, pending a follow-up decision on removal/repurposing.
    allowedFromNamespaces: []
    extraLabels:
      opendatahub.io/dashboard: "true"
      istio-injection: enabled
      zuno.io/managed: "true"
  - name: zuno-ai-build
    displayName: Zuno AI Build
    description: >-
      In-cluster OpenShift build pipeline producing this platform's
      component images.
    allowedFromNamespaces:
      - zuno-ai-run
      - zuno-data
    # Sidecar-injected + mTLS-enforced (service-mesh component, phase 4).
    # zuno.io/managed: ADR-0320 - see templates/namespace.yaml's comment.
    # KNOWN BENIGN (2026-08-20): every BuildConfig *-build pod here logs
    # "Startup probe failed: dial tcp ...:15021: connect: connection
    # refused" from its injected istio-proxy - the sidecar loses the race
    # against the short-lived build container. Builds still report
    # BuildCompleted successfully; this is cosmetic (drives the console's
    # Service Mesh data-plane card into "Failure" for this namespace, no
    # functional impact). Same root cause already patched mesh-wide for
    # long-running workloads via global.proxy.startupProbe.failureThreshold
    # (gitops/charts/service-mesh/templates/istio.yaml, raised 4->600 on
    # 2026-08-16) - build pods are just too short-lived to ever benefit
    # from a higher threshold. Deliberately left as namespace-wide
    # injection rather than excluding build pods, to preserve this
    # namespace's phase-4 mTLS-enforcement staging above.
    extraLabels:
      opendatahub.io/dashboard: "true"
      istio-injection: enabled
      zuno.io/managed: "true"
      # ADR-0535/WP-111: brings this namespace's Pods into the Sigstore
      # Policy Controller's admission-webhook scope (audit-only,
      # ClusterImagePolicy spec.mode: warn - never a reject). Runs
      # aiagent-operator, mlops, rag-ingestion, supply-chain-signer.
      policy.rhtas.com/include: "true"
  - name: zuno-mlops
    displayName: Zuno MLOps
    description: >-
      mlops-dspa (LoRA/PEFT training pipeline, ADR-0301/ADR-0302) - split
      out of zuno-ai-build on 2026-08-19 because both DSPAs' Argo
      Workflow-controller Deployments collided on one unscoped
      "workflow-controller" Lease in that shared namespace (rag-dspa's
      runs would silently stall or have their Workflow objects deleted
      within 1-2 seconds of creation, depending on which DSPA's
      controller happened to hold the lease) - see the
      dspa-shared-namespace-leader-election-bug memory for the full
      incident. No resourceQuota/limitRange here, deliberately mirroring
      zuno-ai-build: mlops's train-lora stage needs unconstrained
      nvidia.com/gpu requests on the tainted GPU-burst node.
    allowedFromNamespaces:
      - zuno-ai-run
      - zuno-data
    # Sidecar-injected + mTLS-enforced, same posture as zuno-ai-build.
    extraLabels:
      opendatahub.io/dashboard: "true"
      istio-injection: enabled
      zuno.io/managed: "true"
      # ADR-0535/WP-111: see zuno-ai-build's identical label above. Runs
      # the mlops-dspa (mlops image) pipeline.
      policy.rhtas.com/include: "true"
  - name: zuno-ai-run
    displayName: Zuno AI Run
    description: >-
      Agent Runtime, AI Gateway and MCP Gateway - shared runtime hosting
      every active agent.
    allowedFromNamespaces: []
    # ADR-0111: this entry still owns zuno-ai-run's Namespace/ResourceQuota/
    # LimitRange objects (all three also range over platformNamespaces),
    # but must NOT get the zuno-default-deny-other-namespaces NetworkPolicy
    # every other entry gets - that policy's "same-namespace traffic always
    # allowed" ingress rule has no port restriction, so it would silently
    # grant every zuno-ai-run pod (agent-runtime, ai-gateway, ...) access to
    # every port of every other zuno-ai-run pod, additively overriding
    # mcp-confluence's own precise, port-8000-only, gateway-only
    # NetworkPolicy (ADR-0037) - exactly the risk this file's own comment
    # above already documented in prose but templates/
    # networkpolicy-platform.yaml never actually enforced (a real,
    # newly-fixed gap: this entry was silently included in the same range
    # that comment says excludes it).
    skipNetworkPolicy: true
    # RHOAI dashboard label, folded in here since this chart already owns
    # zuno-ai-run's Namespace object. istio-injection: sidecar-injected +
    # mTLS-enforced (service-mesh component, phase 4).
    # zuno.io/managed: ADR-0320 - see templates/namespace.yaml's comment.
    extraLabels:
      opendatahub.io/dashboard: "true"
      istio-injection: enabled
      zuno.io/managed: "true"
      # ADR-0535/WP-111: see zuno-ai-build's identical label above. Runs
      # agent-runtime, agent-bff, agent-frontend, ai-gateway, mcp-*.
      policy.rhtas.com/include: "true"
  - name: zuno-mesh
    displayName: Zuno Infra Service Mesh
    description: >-
      Istio control plane (istiod), IstioCNI and istio-csr - the platform's
      mesh/mTLS layer (service-mesh component).
    # istiod's XDS server is polled by sidecars in every meshed namespace.
    # zuno-vault is deliberately NOT meshed (it's the mTLS/PKI trust root
    # for everything else - meshing it risks a bootstrap circularity).
    allowedFromNamespaces:
      - zuno-data
      - zuno-auth
      - zuno-ai-run
      - zuno-ai-build
      # redhat-ods-applications is namespace-injected (istio-injection:
      # enabled below); without this entry its sidecars can't reach
      # istiod's XDS or cert-manager-istio-csr's CA, leaving every meshed
      # RHOAI pod (rhods-dashboard, maas-api/controller, model-serving-api,
      # dashboard-redirect) crash-looping on the istio-proxy startup probe.
      - redhat-ods-applications
      # openshift-console's dynamic plugin proxy calls ossmconsole/kiali
      # directly (ConsolePlugin backend + kiali proxy); without this entry
      # the OSSM console plugin times out intermittently ("context deadline
      # exceeded").
      - openshift-console
      # grafana's mesh-prometheus GrafanaDatasource
      # (gitops/charts/grafana/templates/datasource-mesh-prometheus.yaml)
      # calls mesh-monitoring-prometheus.zuno-mesh.svc directly; without
      # this entry every network-mesh Grafana dashboard panel goes dark
      # (8s connect timeout from the grafana pod), same failure class as
      # the two entries above.
      - zuno-monitoring
      # mlops-dspa's own meshed pods, split out of zuno-ai-build - same
      # istiod/cert-manager-istio-csr bootstrap need as every other entry
      # here.
      - zuno-mlops
      # Same class of bug as redhat-ods-applications above:
      # rhoai-model-registries is istio-injection: enabled but was missing
      # from this allowlist, so model-catalog's istio-proxy could never
      # reach cert-manager-istio-csr ("dial tcp <ClusterIP>:443: i/o
      # timeout" on every CSR attempt - the block is on this side, so it's
      # invisible to NetworkPolicy checks scoped to that namespace alone)
      # and crash-loops on its startup probe.
      - rhoai-model-registries
      # Pre-emptive: zuno-ai-platform is istio-injection: enabled (see its
      # own entry above) but was missing from this allowlist too - same
      # bug class as rhoai-model-registries just above. No live pod there
      # yet to have hit it, but any workload deployed there would silently
      # crash-loop on CA bootstrap the moment it's scheduled.
      - zuno-ai-platform
    # zuno.io/managed: ADR-0320 - see templates/namespace.yaml's comment.
    extraLabels:
      zuno.io/managed: "true"
    # istiod's sidecar-injector + validating webhooks are called synchronously
    # by the API server, same pattern as ESO's secretstore-validate webhook.
    allowApiServerWebhooks: true
  - name: zuno-aap
    displayName: Zuno Infra AAP
    description: >-
      Ansible Automation Platform (Gateway, Controller, Hub, EDA) - the
      platform's automation-execution surface (ADR-0354).
    # ADR-0355/WP-074: mcp-aap (the aap-mcp Deployment in zuno-ai-run)
    # calls the AAP Gateway Service in-cluster, so zuno-ai-run is allowed
    # in here. That is the one edit ADR-0354 clause 3 deferred to this
    # ADR - nothing else calls into zuno-aap (aap-config, WP-073, still
    # reaches the Controller API over its external Route), so this list
    # stays a single entry.
    allowedFromNamespaces:
      - zuno-ai-run
    # Deliberately NOT istio-injection: enabled - AAP's own workloads stay
    # outside the mesh, same posture as other heavy operator-backed
    # namespaces (zuno-vault, redhat-ods-*).
    extraLabels:
      zuno.io/managed: "true"

  # ADR-0535/WP-110: rhtas-operator's CSV supports AllNamespaces only (no
  # OwnNamespace/SingleNamespace/MultiNamespace - confirmed live against
  # this cluster's PackageManifest), so unlike openshift-lightspeed below
  # there is no CSV-mandated operand namespace to mirror. The operator
  # subscription itself is subscribed into the shared openshift-operators
  # namespace (Pattern B, same shape as gitops/charts/mariadb/postgresql);
  # this namespace holds only the Securesign operand (Fulcio/Rekor/CTLog/
  # Trillian/TUF) and is repo-owned the same way zuno-aap is.
  - name: zuno-rhtas
    displayName: Zuno Infra RHTAS
    description: >-
      Red Hat Trusted Artifact Signer operand - Fulcio, Rekor, CTLog,
      Trillian and TUF (ADR-0535).
    # zuno-ai-build: the supply-chain-signer Job (WP-111) calls Fulcio/
    # Rekor/CTLog in-cluster to sign/verify the 14 first-party images.
    # openshift-operators: rhtas-operator itself calls back INTO the
    # operand services it manages (live finding, WP-110: its rekor
    # reconciler GETs rekor-server's /api/v1/log/publicKey to build the
    # sharding/TUF config - without this entry that call times out and
    # RekorAvailable sits at "Creating" forever while every pod is
    # green). openshift-gitops: live finding, WP-111 - ArgoCD's
    # application-controller calls policy-controller-manager-service's
    # validating admission webhook (for the PolicyController CR itself,
    # co-located here since WP-111 put policy-controller-operator in this
    # namespace) on every sync; same-namespace-only debug-pod curl tests
    # succeeded instantly while ArgoCD's own cross-namespace calls
    # intermittently hit the webhook's tight 5s timeout - NetworkPolicy,
    # not the webhook server, was the real bottleneck.
    allowedFromNamespaces:
      - zuno-ai-build
      - openshift-operators
      - openshift-gitops
    # Deliberately NOT istio-injection: enabled - operator-owned workloads,
    # same posture as zuno-aap/openshift-lightspeed (a sidecar would have
    # to be re-patched on every Securesign reconcile).
    extraLabels:
      zuno.io/managed: "true"

  # ADR-0524: OpenShift Lightspeed's operator namespace. The operator's CSV
  # is OwnNamespace-only and its OLSConfig operand is a mandatory singleton
  # that lives here, so the namespace is a permanent, CR-bearing part of the
  # platform rather than an install detail - tracked here for the same reason
  # the RHOAI namespaces below are.
  #
  # zuno-namespaces-d0 is this namespace's SOLE owner: gitops/charts/lightspeed
  # ships a vendored `project` block that is deliberately left disabled, exactly
  # like gitops/charts/openshift-ai's - enabling it in both places makes ArgoCD
  # report the Namespace as shared between two Applications (see the
  # redhat-ods-operator entry below, which documents that same collision).
  - name: openshift-lightspeed
    displayName: OpenShift Lightspeed
    description: >-
      OpenShift Lightspeed operator and its operands - API server, console
      plugin, RHOKP documentation sidecar, conversation-cache PostgreSQL and
      the built-in openshift-mcp-server (ADR-0524).
    # NOT mesh-injected: these Deployments are operator-owned, so a sidecar
    # would have to be re-patched on every reconcile.
    extraLabels:
      zuno.io/managed: "true"
    # DELIBERATE, and the one judgement call in this entry. The default-deny
    # baseline in networkpolicy-platform.yaml admits same-namespace traffic,
    # router ingress and whatever allowedFromNamespaces lists - nothing else.
    # Lightspeed additionally needs the OpenShift console (openshift-console) to
    # reach its console-plugin Service, and openshift-monitoring to scrape the
    # metrics its CSV opts into via operatorframework.io/cluster-monitoring.
    # Neither of those Service/port shapes can be confirmed before the operator
    # is installed, and getting them wrong presents as "the assistant is missing
    # from the console" rather than as a policy error.
    #
    # So the namespace is governed here (created, labelled, owned) but its
    # NetworkPolicy is deferred rather than guessed - the same explicit opt-out
    # zuno-ai-run takes above. WP-085's live verification step should replace
    # this with `allowedFromNamespaces: [openshift-console, openshift-monitoring]`
    # once both are confirmed against the running operator.
    skipNetworkPolicy: true
    # No resourceQuota/limitRange on purpose: the operand footprint (app server
    # + console plugin + RHOKP/Solr + PostgreSQL + openshift-mcp-server + OTel
    # collector) is unknown until it runs, and an under-sized quota leaves the
    # CSV Failed with pods stuck in FailedCreate - the failure mode the
    # redhat-ods-operator entry below had to be resized to escape.

  # ADR-0331: RHOAI's own default namespaces, given the same governance
  # (labels/NetworkPolicy/quota) zuno-ai-platform used to get, now that
  # applicationsNamespace/monitoring.namespace/registriesNamespace are all
  # reverted to RHOAI defaults instead of custom zuno-* ones.
  - name: redhat-ods-operator
    displayName: RHOAI Operator
    description: >-
      rhods-operator's own controller-manager, OLM Subscription and
      OperatorGroup (ADR-0047) - installs/reconciles DataScienceCluster and
      DSCInitialization elsewhere. zuno-namespaces-d0 is this namespace's
      sole owner: gitops/charts/openshift-ai's vendored project block is
      explicitly disabled (see gitops/apps/openshift-ai/application-d0.yaml)
      because enabling it there too made ArgoCD report Namespace/
      redhat-ods-operator as shared between zuno-openshift-ai-d0 and this
      Application. That Application keeps syncOptions.CreateNamespace=true
      as a harmless, untracked fallback only.
    allowedFromNamespaces: []
    # ASSUMPTION, not verified against a live cluster: rhods-operator
    # commonly ships a ValidatingWebhookConfiguration for its own CRs
    # (DataScienceCluster/DSCInitialization). Included defensively, same
    # posture as zuno-vault/zuno-mesh above - low-cost if unneeded, avoids a
    # silent DSC/DSCI apply failure if it is.
    allowApiServerWebhooks: true
    extraLabels:
      zuno.io/managed: "true"
    resourceQuota:
      # Sized to the live rhods-operator deployment: 3.5.0-ea.2 runs
      # replicas: 3, each pod requests 500m/256Mi with limits 500m/4Gi - so
      # the deployment alone needs requests 1.5cpu/768Mi and limits
      # 1.5cpu/12Gi. Sizing for a single replica instead leaves the CSV
      # Failed with 2 of 3 pods FailedCreate. Headroom on top covers OLM
      # job pods.
      requests: { cpu: "2", memory: "2Gi" }
      limits: { cpu: "3", memory: "14Gi" }
    limitRange:
      defaultRequest: { cpu: "50m", memory: "128Mi" }
      default: { cpu: "500m", memory: "512Mi" }
  - name: redhat-ods-applications
    displayName: RHOAI Applications Namespace
    description: >-
      RHOAI 3.5 EA2's default applications namespace (ADR-0331 - reverted
      from the custom zuno-ai-platform after trainer/ray/dashboard/
      mlflowoperator all broke under a custom one). Hosts the shared
      OpenShift AI control plane: KServe, MLflow, Trainer, Ray, Dashboard,
      AI Gateway, OGX, Spark Operator, Feast Operator, TrustyAI, Data
      Science Pipelines controllers.
    allowedFromNamespaces: []
    # VERIFIED: trainer's ValidatingWebhookConfiguration targets
    # kubeflow-trainer-controller-manager.redhat-ods-applications.svc
    # directly (confirmed live during mlflow-operator crash debugging) -
    # kube-apiserver must reach it synchronously.
    allowApiServerWebhooks: true
    extraLabels:
      opendatahub.io/application-namespace: "true"
      istio-injection: enabled
      zuno.io/managed: "true"
    # RHOAI's own pods ship many containers with no explicit limits
    # (rhods-dashboard alone has 10), so the limitRange default below
    # assigns them ~15.6 cores of limits; the ~18 controller-managers add
    # ~11 real cores - ~27 cores of limits when healthy, against the
    # previous 16. Limits are overcommit (only requests reserve node
    # capacity), so 32 is headroom, not reservation.
    # requests: sized to actual measured usage (MaaS controller, model
    # registry, gateway controllers, ...) plus modest growth headroom. A
    # ResourceQuota only enforces requests on NEW pods, so if real usage
    # ever creeps past the requests cap, existing pods keep running while
    # every new admission gets refused - the first visible casualty here
    # was DSPO's ds-pipelines-webhook ("exceeded quota" FailedCreate),
    # which silently blocked the whole rag-dspa KFP stack
    # (WebhookReady=False) and with it all corpus ingestion. Re-measure
    # and bump requests if that pattern recurs.
    resourceQuota:
      requests: { cpu: "12", memory: "20Gi" }
      limits: { cpu: "32", memory: "48Gi" }
    limitRange:
      defaultRequest: { cpu: "100m", memory: "256Mi" }
      default: { cpu: "1", memory: "1Gi" }
  - name: rhoai-model-registries
    displayName: RHOAI Model Registry
    description: >-
      Model Registry operand namespace (RHOAI's own default,
      registriesNamespace: rhoai-model-registries) - REST API + backing
      database bridging build (zuno-ai-build) and run (zuno-ai-run) model
      lifecycles (ADR-0328's Model Registry section).
    allowedFromNamespaces:
      - zuno-ai-build
      - zuno-ai-run
      # mlops-dspa's push-registry pipeline stage registers a PASSING
      # adapter here directly (components/mlops/src/mlops.py) - needs the
      # same access zuno-ai-build got, from its own namespace.
      - zuno-mlops
    allowApiServerWebhooks: false
    extraLabels:
      istio-injection: enabled
      zuno.io/managed: "true"
    # limits.cpu must cover both the app AND its istio-proxy sidecar: the
    # sidecar has no explicit cpu limit either, so it also takes the
    # 1-core LimitRange default - app (1) + proxy (~1, measured under 1
    # core) = ~2.5 measured, exceeding a 2-core cap on every pod creation
    # (FailedCreate: "requested: limits.cpu=2500m ... limited:
    # limits.cpu=2"). 3/5Gi gives the sidecar's measured ~1 core/~1Gi room
    # alongside the existing 2-core/4Gi app budget; requests already had
    # headroom (250m/576Mi used of 500m/1Gi) so left as-is.
    # WP-087, 2026-08-28: requests raised 500m/1Gi -> 1500m/2560Mi and
    # limits.cpu 3 -> 6. The old ceiling fit model-catalog and its Postgres
    # and NOTHING ELSE - those two consumed all 500m of requests.cpu, so the
    # `zuno` ModelRegistry instance and its Postgres sat in FailedCreate for
    # hours. That reaches a caller as a bare `Connection refused` naming a
    # host that resolves perfectly, because the Service exists and only its
    # endpoints are empty; the registry had been provisioned without room to
    # run and nothing surfaced it until a pipeline first tried to register a
    # model. Sized from the FailedCreate events rather than the container
    # specs, for the same sidecar reason the note above gives: need is
    # 1050m/1728Mi requests and 3500m limits.cpu, and the headroom over that
    # is one surge pod so a rolling update cannot deadlock against its own
    # quota the way this one did.
    resourceQuota:
      requests: { cpu: "1500m", memory: "2560Mi" }
      limits: { cpu: "6", memory: "5Gi" }
    limitRange:
      defaultRequest: { cpu: "100m", memory: "256Mi" }
      default: { cpu: "1", memory: "1Gi" }
  - name: redhat-ods-monitoring
    displayName: RHOAI Monitoring
    description: >-
      RHOAI's own monitoring/observability namespace (dashboard-perses,
      Prometheus integration) - reverted to the RHOAI default (ADR-0331)
      after dashboard was found not to derive its watched namespace from a
      custom DSCInitialization.spec.monitoring.namespace.
    # Mirrors zuno-monitoring's own allowedFromNamespaces, plus
    # redhat-ods-applications: dashboard-perses needs to reach into the
    # RHOAI control-plane namespace - the exact failure this namespace
    # exists to fix.
    allowedFromNamespaces:
      - zuno-ai-run
      - zuno-data
      - zuno-auth
      - zuno-ai-build
      - zuno-mlops
      - redhat-ods-applications
    allowApiServerWebhooks: false
    extraLabels:
      zuno.io/managed: "true"
    # ADR-0522/WP-078/WP-079: second pass, raised again after the first bump
    # (2/6Gi requests, 4/10Gi limits) still exhausted limits.cpu live
    # (used: 3970m/4) once the full stack existed - summing every workload's
    # declared/LimitRange-defaulted per-container cpu x replica count in this
    # namespace gives ~1338m effective requests.cpu and ~9220m effective
    # limits.cpu; current values are set with headroom above a +40% margin
    # on that live-measured total.
    resourceQuota:
      requests: { cpu: "4", memory: "15Gi" }
      limits: { cpu: "14", memory: "40Gi" }
    limitRange:
      defaultRequest: { cpu: "100m", memory: "256Mi" }
      default: { cpu: "1", memory: "2Gi" }
  - name: models-as-a-service
    displayName: MaaS Governance Plane
    description: >-
      The maas-controller's own hardcoded operand namespace
      (MAAS_SUBSCRIPTION_NAMESPACE, not configurable via any CRD - verified
      live 2026-09-01) for MaaSSubscription/MaaSAuthPolicy/Tenant CRs -
      gitops/charts/models' own zuno-models-d1 Application already creates
      MaaSSubscription/MaaSAuthPolicy objects here (tracked fine in ArgoCD),
      but relied on the maas-controller having created the namespace first.
      Created here instead so a from-scratch Day 0/1 install doesn't race
      the operator for it. Holds CRs only, no pods (verified live) - the
      default-deny NetworkPolicy baseline below is a no-op today, kept on
      for defense-in-depth rather than skipped like zuno-ai-run.
    allowedFromNamespaces: []
    extraLabels:
      zuno.io/managed: "true"
  - name: ai-tenants
    displayName: MaaS AI Tenants
    description: >-
      Same class of maas-controller hardcoded operand namespace as
      models-as-a-service just above (AITENANT_NAMESPACE, not configurable
      via any CRD - verified live 2026-09-01), for the newer AITenant CRD
      (maas.opendatahub.io v1alpha1) - superseding the legacy
      Tenant.spec.externalOIDC per opendatahub-io/models-as-a-service's own
      migration docs ("existing Tenant/default-tenant.spec.externalOIDC
      settings are automatically migrated to
      AITenant/models-as-a-service.spec.oidc"). Created here for the same
      from-scratch-install race reason. Holds CRs only, no pods (verified
      live) - same no-op-but-defense-in-depth NetworkPolicy posture.
    allowedFromNamespaces: []
    extraLabels:
      zuno.io/managed: "true"

# ADR-0351: MIG-aware GPU quota mirroring the permanent node's all-balanced
# partition (2x 1g.24gb + 1x 2g.48gb on the RTX PRO 6000 Blackwell 96GB) -
# one slice per inference workload: embeddings + gpt-oss-20b on the
# 24GB slices, the qwen chat predictor on the 48GB one (gitops/charts/
# models). Replaces the earlier whole-GPU count quota (1->2->3 as L4 nodes
# were added; that history and its admission-refusal evidence lives in
# git).
# nvidia.com/gpu is pinned to 0: whole GPUs only exist on the tainted
# gpu-burst node and belong to training in zuno-ai-build (the DSPA
# namespace, which has no quota) - an inference workload in zuno-ai-run
# asking for a full GPU is a config error this refuses at admission.
# ADR-0412 carved the one prior exception (gpt-oss-20b on the unmanaged
# workergpu node's idle full GPU); ADR-0414 retires it now that
# gpt-oss-20b runs on a mig-1g.24gb slice instead - back to zero
# exceptions, matching ADR-0351's original rule.
#
# Surge headroom (2026-08-26): the counts are workload-count + 1 per
# profile, NOT the strict one-slice-per-workload of the paragraph above.
# Sized at exactly 2 and 1, this quota made every rolling update
# impossible by construction: the KServe Deployments are RollingUpdate
# with maxUnavailable 0, so a new revision's pod must be admitted while
# the outgoing one still holds its slice - and admission refused it
# ("exceeded quota: requested: requests.nvidia.com/mig-1g.24gb=1, used:
# 2, limited: 2"), leaving the embeddings InferenceService stuck
# PredictorReady=False/FailedCreate with a perfectly healthy pod running.
# The surge slot is a ceiling, not a reservation: it costs nothing while
# no rollout is in flight. The 2g.48gb surge slot only becomes physically
# schedulable once a second all-balanced GPU node exists (Option HA,
# gitops/charts/machines' zuno-gpu-c); until then a qwen rollout waits on
# the scheduler rather than being refused at admission.
openshiftAi:
  namespace: zuno-ai-run
  gpuQuota:
    resources:
      nvidia.com/mig-1g.24gb: "3"
      nvidia.com/mig-2g.48gb: "2"
      nvidia.com/gpu: "0"
