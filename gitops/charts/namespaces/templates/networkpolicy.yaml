{{/*
Default-deny ingress from other namespaces, per agent namespace. Explicit
allows are added by the workload chart that owns those Services, not here.
*/}}
{{- range .Values.namespaces }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zuno-default-deny-other-namespaces
  namespace: {{ .name }}
  labels:
    zuno.io/agent: {{ .agent }}
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              # OVN-Kubernetes labels the router/ingress namespace with this
              # key so default-deny policies can still admit router traffic.
              policy-group.network.openshift.io/ingress: ""
---
{{- end }}
