{{/*
Default-deny ingress from other namespaces, per agent namespace (ADR-0023).
Explicit allows (e.g. the frontend's Route-fronted Service accepting
external ingress via the OpenShift router, or the BFF accepting only from
its own frontend) are added by the workload chart (gitops/charts/tekos) that
owns those Services, not here - this policy only establishes the default
isolation boundary every agent namespace starts from.
*/}}
{{- range .Values.namespaces }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zuno-default-deny-other-namespaces
  namespace: {{ .name }}
  labels:
    zuno.io/agent: {{ .agent }}
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              # OVN-Kubernetes (OpenShift 4.20's default CNI, ADR-0002)
              # labels the router/ingress namespace with this key so
              # default-deny policies can still admit router traffic to
              # Routed Services (e.g. the Tekos frontend).
              policy-group.network.openshift.io/ingress: ""
---
{{- end }}
