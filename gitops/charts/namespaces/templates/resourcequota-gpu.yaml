{{- if and .Values.policy.enabled .Values.openshiftAi }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: zuno-ai-run-gpu-cap
  namespace: {{ .Values.openshiftAi.namespace }}
  labels:
    zuno.io/tier: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-70"
spec:
  hard:
    {{- range $resource, $quantity := .Values.openshiftAi.gpuQuota.resources }}
    requests.{{ $resource }}: {{ $quantity | quote }}
    limits.{{ $resource }}: {{ $quantity | quote }}
    {{- end }}
{{- end }}
