{{/*
ADR-0052: the same default-deny-other-namespaces shape as
templates/networkpolicy.yaml, applied to the platform namespaces this
chart also creates via templates/namespace.yaml (see values.yaml's
platformNamespaces comment for why zuno-ai-run is intentionally excluded
here). Same-namespace traffic and
router ingress are always allowed; allowedFromNamespaces adds specific,
known real cross-namespace callers on top.
*/}}
{{- range .Values.platformNamespaces }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zuno-default-deny-other-namespaces
  namespace: {{ .name }}
  labels:
    zuno.io/managed-by: argocd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              # OVN-Kubernetes (OpenShift 4.20's default CNI, ADR-0002)
              # labels the router/ingress namespace with this key so
              # default-deny policies can still admit router traffic to
              # Routed Services (e.g. Keycloak's login UI).
              policy-group.network.openshift.io/ingress: ""
        {{- range .allowedFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
---
{{- end }}
