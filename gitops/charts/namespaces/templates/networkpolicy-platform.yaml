{{/*
Default-deny-other-namespaces baseline for platform namespaces (zuno-ai-run
is intentionally excluded - see values.yaml). Same-namespace traffic and
router ingress are always allowed; allowedFromNamespaces adds specific callers.
*/}}
{{- if .Values.policy.enabled }}
{{- range .Values.platformNamespaces }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zuno-default-deny-other-namespaces
  namespace: {{ .name }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              # OVN-Kubernetes labels the router/ingress namespace with this
              # key so default-deny policies can still admit router traffic.
              policy-group.network.openshift.io/ingress: ""
        {{- if .allowApiServerWebhooks }}
        - namespaceSelector:
            matchLabels:
              # Admits kube-apiserver traffic (hostNetwork, matches no normal
              # selector) - needed wherever an admission webhook's service
              # lives.
              policy-group.network.openshift.io/host-network: ""
        {{- end }}
        {{- range .allowedFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
---
{{- end }}
{{- end }}
