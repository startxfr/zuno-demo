# Created as ArgoCD PreSync hooks - each runs in its own phase, entirely
# before the normal Sync phase (this chart's ResourceQuota/NetworkPolicy
# templates, which target these same namespaces), so their existence is
# guaranteed without relying on sync-wave ordering within the same batch.
# zuno-ai-run (this Application's own destination.namespace) is also
# backed by syncOptions.CreateNamespace=true (gitops/apps/namespaces/
# application-d0.yaml) as a redundant safeguard.
{{- range .Values.namespaces }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .name }}
  labels:
    zuno.io/agent: {{ .agent }}
    zuno.io/status: {{ .status }}
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/hook: PreSync
---
{{- end }}
{{- range .Values.platformNamespaces }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .name }}
  labels:
    zuno.io/tier: platform
    zuno.io/managed-by: argocd
    {{- range $k, $v := .extraLabels }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  annotations:
    argocd.argoproj.io/hook: PreSync
---
{{- end }}
