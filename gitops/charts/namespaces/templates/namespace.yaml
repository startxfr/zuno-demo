# Must exist before this chart's ResourceQuota/NetworkPolicy templates, which
# target these namespaces.
{{- range .Values.namespaces }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .name }}
  labels:
    zuno.io/agent: {{ .agent }}
    zuno.io/status: {{ .status }}
    zuno.io/managed-by: argocd
  annotations:
    openshift.io/description: {{ .description | quote }}
    openshift.io/display-name: {{ .displayName | quote }}
    openshift.io/requester: zuno
---
{{- end }}
{{- range .Values.platformNamespaces }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .name }}
  labels:
    zuno.io/tier: platform
    zuno.io/managed-by: argocd
    {{- range $k, $v := .extraLabels }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  annotations:
    openshift.io/description: {{ .description | quote }}
    openshift.io/display-name: {{ .displayName | quote }}
    openshift.io/requester: zuno
---
{{- end }}
