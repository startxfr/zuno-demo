{{- if .Values.namespace.enabled }}
# Must exist before this chart's ResourceQuota/NetworkPolicy templates (the
# policy.enabled half, applied separately - see application-d1.yaml), which
# target these namespaces.
{{- range .Values.platformNamespaces }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .name }}
  labels:
    zuno.io/tier: platform
    zuno.io/managed-by: argocd
    openshift.io/cluster-monitoring: "true"
    {{- range $k, $v := .extraLabels }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  annotations:
    openshift.io/description: {{ .description | quote }}
    openshift.io/display-name: {{ .displayName | quote }}
    openshift.io/requester: zuno
    {{- if .infraNodes }}
    {{- /* ADR-0614: every pod of this namespace runs on the infra nodes. Used
    where the operator's CR exposes no tolerations (QuayRegistry overrides only
    carry affinity). Applies to pods created after the change. */}}
    openshift.io/node-selector: node-role.kubernetes.io/infra=
    scheduler.alpha.kubernetes.io/defaultTolerations: '[{"key":"node-role.kubernetes.io/infra","operator":"Exists","effect":"NoSchedule"}]'
    {{- end }}
---
{{- end }}
{{- end }}
