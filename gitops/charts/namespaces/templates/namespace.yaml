{{- range .Values.namespaces }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .name }}
  labels:
    zuno.io/agent: {{ .agent }}
    zuno.io/status: {{ .status }}
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-80"
---
{{- end }}
{{- range .Values.platformNamespaces }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .name }}
  labels:
    zuno.io/tier: platform
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-80"
---
{{- end }}
