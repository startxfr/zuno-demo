# ADR-0037's core case: sales-db-mcp must accept traffic ONLY from the MCP
# Gateway, not from any other pod in zuno-ai (agent-runtime and ai-gateway
# are same-namespace neighbors but must NOT reach this server directly -
# "Direct agent-runtime-to-MCP-server paths are forbidden"). This is why
# zuno-ai has no namespace-wide baseline NetworkPolicy (see
# gitops/charts/namespaces/values.yaml's platformNamespaces comment) - a
# broad "allow same namespace" rule would silently defeat exactly this
# restriction (Kubernetes unions the allowed ingress of every NetworkPolicy
# that selects a pod). Network location is deliberately not the only
# control - app/... server.py additionally validates X-Zuno-Gateway-Token,
# a shared secret only the gateway holds, per this ADR's "must validate the
# gateway workload identity in addition to relying on network location".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sales-db-mcp
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sales-db-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-gateway
      ports:
        - protocol: TCP
          port: 8000
