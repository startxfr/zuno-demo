apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.credentials.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.credentials.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.credentials.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.credentials.vaultPath }}
        property: password
{{- if eq .Values.sxaDbEngine "mariadb" }}
---
# ADR-0216/WP-065: the sxa MariaDB database's own password (username is
# static, see values.yaml's mariadb.username - only the password is
# Vault-stored, matching gitops/charts/mariadb's sxaDatabase seeding).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.mariadb.credentials.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  refreshInterval: {{ .Values.mariadb.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.mariadb.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.mariadb.credentials.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.mariadb.credentials.vaultPath }}
        property: password
{{- end }}
