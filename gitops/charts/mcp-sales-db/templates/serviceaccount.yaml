# Dedicated, least-privilege service account (ADR-0052). No RBAC binding:
# this service only talks to PostgreSQL and serves HTTP, never the
# Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sales-db-mcp
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: sales-db-mcp
    zuno.io/managed-by: argocd
