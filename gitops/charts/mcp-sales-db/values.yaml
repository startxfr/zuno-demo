# Must match mcp-gateway's salesDbMcpUrl
# (http://sales-db-mcp.zuno-ai-run.svc:8000).
namespace: zuno-ai-run

# Built by the "mcp" build component into zuno-ai-build's ImageStream, pulled
# cross-namespace into zuno-ai-run via the system:image-puller RoleBinding.
image:
  repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/mcp-sales-db
  tag: latest
  # Always, not IfNotPresent - with a mutable :latest tag, IfNotPresent
  # serves whatever stale image the node cached, silently ignoring
  # rebuilds (VERIFIED live 2026-08-16 across multiple components).
  # Revisit when WP-04 pins immutable tags.
  pullPolicy: Always

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

db:
  # PGO's auto-created PgBouncer Service in front of the PostgresCluster.
  host: zuno-postgresql-pgbouncer.zuno-data.svc.cluster.local
  port: "5432"
  database: zuno

credentials:
  vaultPath: postgresql/app
  secretName: sales-db-postgresql-credentials
  secretStoreName: vault-backend
  refreshInterval: 1h
