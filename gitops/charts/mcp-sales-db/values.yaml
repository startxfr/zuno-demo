# Must match mcp-gateway's salesDbMcpUrl
# (http://sales-db-mcp.zuno-ai-run.svc:8000).
namespace: zuno-ai-run

# Built by the "mcp" build component into zuno-ai-build's ImageStream, pulled
# cross-namespace into zuno-ai-run via the system:image-puller RoleBinding.
image:
  repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/mcp-sales-db
  # image.tag must stay "latest" until a release is cut - see RELEASING.md (two parallel image paths).
  tag: latest
  # Always, not IfNotPresent - the mutable :latest tag needs it to avoid serving a stale cached image; see RELEASING.md.
  pullPolicy: Always

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

db:
  # PGO's auto-created PgBouncer Service in front of the PostgresCluster.
  host: zuno-postgresql-pgbouncer.zuno-data.svc.cluster.local
  port: "5432"
  database: zuno

credentials:
  vaultPath: postgresql/app
  secretName: sales-db-postgresql-credentials
  secretStoreName: vault-backend
  refreshInterval: 1h

# ADR-0216/WP-065: server.py's _connect() already dispatches to aiomysql
# when SXA_DB_ENGINE=mariadb (same dict-row shape as psycopg, so no tool
# body branches by engine) - this chart never wired that mode until now.
# Flipped to mariadb 2026-08-23 once the sxa MariaDB database held real
# imported content (gitops/charts/mariadb's sxaDatabase). username is
# static (not Vault-stored), matching how ansible/roles/vault/tasks/
# install.yml seeds only the password at sxa/mariadb-db.
sxaDbEngine: mariadb
mariadb:
  host: mariadb.zuno-data.svc.cluster.local
  port: "3306"
  database: sxa
  username: sxa
  credentials:
    vaultPath: sxa/mariadb-db
    secretName: sales-db-mariadb-credentials
    secretStoreName: vault-backend
    refreshInterval: 1h
