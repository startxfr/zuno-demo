# Namespace matches components/mcp-gateway's salesDbMcpUrl assumption:
# http://sales-db-mcp.zuno-ai-run.svc:8000 (gitops/charts/mcp-gateway/values.yaml).
namespace: zuno-ai-run

# Built by the Day 1 "mcp" build component (ADR-0056,
# ansible/roles/mcp_build) into zuno-ai-build's ImageStream, pulled
# cross-namespace into zuno-ai-run via the system:image-puller RoleBinding
# ansible/tasks/apply_openshift_build.yml grants.
image:
  repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/mcp-sales-db
  tag: latest
  pullPolicy: IfNotPresent

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

db:
  # zuno-postgresql-primary is PGO's own auto-created Service for the
  # zuno-postgresql PostgresCluster - there is no plain "postgresql"
  # Service, and no "-rw"-suffixed one either (that was CloudNativePG's
  # convention - see ansible/roles/postgresql/README.md).
  host: zuno-postgresql-primary.zuno-data.svc.cluster.local
  port: "5432"
  database: zuno

credentials:
  vaultPath: postgresql/app
  secretName: sales-db-postgresql-credentials
  secretStoreName: vault-backend
  refreshInterval: 1h
