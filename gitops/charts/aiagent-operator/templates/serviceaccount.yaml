# Dedicated, least-privilege service account. The only workload in this
# repo whose ClusterRole legitimately grants Kubernetes API write access
# (config/rbac/role.yaml in operator/aiagent-operator/, regenerated from
# kubebuilder RBAC markers on the actual API calls the reconciler makes -
# see clusterrole.yaml below).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiagent-operator
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: aiagent-operator
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
