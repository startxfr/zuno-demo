{{- if .Values.pipelineServer.manage }}
{{- $s3Endpoint := include "rag-ingestion.s3Endpoint" . }}
apiVersion: datasciencepipelinesapplications.opendatahub.io/v1
kind: DataSciencePipelinesApplication
metadata:
  name: {{ .Values.pipelineServer.name }}
  namespace: {{ .Values.platform.namespace }}
  labels:
    {{- include "rag-ingestion.labels" . | nindent 4 }}
spec:
  dspVersion: v2
  # DSPO defaults podToPodTLS to true, which makes BOTH MLMD
  # (--mysql_config_sslrootcert=/dsp-custom-certs/dsp-ca.crt) and the
  # apiserver demand TLS on their MySQL connections - but the external
  # MariaDB (gitops/charts/mariadb, no spec.tls) serves none, so MLMD
  # fatal-loops on mysql_real_connect and the apiserver on "[mysql]
  # unexpected EOF" mid-handshake, indefinitely. The metadata path is
  # in-cluster-only and NetworkPolicy-scoped; enabling MariaDB TLS with
  # DSP's own CA is the eventual alternative if that posture changes.
  podToPodTLS: false
  apiServer:
    deploy: true
    pipelineStore: {{ .Values.pipelineServer.pipelineStore }}
    cacheEnabled: {{ .Values.pipelineServer.cacheEnabled }}
    enableSamplePipeline: false
  workflowController:
    deploy: true
  mlmd:
    deploy: true
  objectStorage:
    externalStorage:
      scheme: {{ ternary "https" "http" (hasPrefix "https://" $s3Endpoint) }}
      host: {{ trimPrefix "https://" (trimPrefix "http://" $s3Endpoint) | quote }}
      port: {{ ternary "443" "80" (hasPrefix "https://" $s3Endpoint) | quote }}
      bucket: {{ .Values.s3.bucket | quote }}
      region: {{ .Values.s3.region | quote }}
      s3CredentialsSecret:
        secretName: {{ .Values.s3.secretName }}
        accessKey: AWS_ACCESS_KEY_ID
        secretKey: AWS_SECRET_ACCESS_KEY
  database:
{{- if eq .Values.pipelineServer.metadataDatabase.mode "embeddedMariaDB" }}
    mariaDB:
      deploy: true
{{- else if eq .Values.pipelineServer.metadataDatabase.mode "externalMySQL" }}
    # The DSPO controller's pre-deploy DB probe runs in
    # redhat-ods-applications, OUTSIDE the mesh - and mariadb-0 (zuno-data,
    # istio-injected since the service-mesh phase 2 rollout) never
    # delivers the server-first MySQL greeting to a plaintext non-mesh
    # client (12s, zero bytes; instant on localhost inside the pod), so
    # the probe fails "context deadline exceeded" forever and the whole
    # KFP stack never deploys. The pipeline pods themselves run in
    # zuno-ai-build (istio-injected) and reach MariaDB through mesh mTLS
    # exactly like every other meshed MariaDB client - the probe is the ONLY
    # non-mesh client, so it is disabled rather than un-meshing port 3306
    # for everyone. A genuinely broken credential now surfaces as the
    # apiserver pod's own crashloop/logs instead of the CR condition.
    disableHealthCheck: true
    externalDB:
      host: {{ .Values.pipelineServer.metadataDatabase.externalMySQL.host | quote }}
      port: {{ .Values.pipelineServer.metadataDatabase.externalMySQL.port | quote }}
      username: {{ .Values.pipelineServer.metadataDatabase.externalMySQL.username | quote }}
      pipelineDBName: {{ .Values.pipelineServer.metadataDatabase.externalMySQL.database | quote }}
      passwordSecret:
        name: {{ .Values.pipelineServer.metadataDatabase.externalMySQL.secretName }}
        key: password
{{- end }}
{{- end }}
