{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rag-ingestion.fullname" . }}-default-deny-ingress
  namespace: {{ .Values.platform.namespace }}
  labels:
    {{- include "rag-ingestion.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      pipelines.kubeflow.org/v2_component: "true"
  policyTypes:
    - Ingress
  ingress: []
{{- if .Values.networkPolicy.egressCidrs }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rag-ingestion.fullname" . }}-egress
  namespace: {{ .Values.platform.namespace }}
spec:
  podSelector:
    matchLabels:
      pipelines.kubeflow.org/v2_component: "true"
  policyTypes:
    - Egress
  egress:
    - to:
{{- range .Values.networkPolicy.egressCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
{{- end }}
{{- end }}
