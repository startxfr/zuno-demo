{{- /* ADR-0204 part 2 (WP-22): one config ConfigMap per enabled
additional domain, same key set as templates/configmap.yaml (tech's) so
every pipeline pod reads one contract - only the domain, its database,
its source config and its S3 prefixes differ.

S3 prefixes are suffixed per domain deliberately: detect-changes builds
its manifest from EVERYTHING under the raw prefix, so two domains
sharing one prefix would each see the other's documents as
deleted-orphans on every run. tech keeps the unsuffixed prefixes its
existing corpus state already lives under. */}}
{{- $root := . }}
{{- range $name, $domain := .Values.domains }}
{{- if $domain.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rag-ingestion.fullname" $root }}-config-{{ $name }}
  namespace: {{ $root.Values.platform.namespace }}
  labels:
    {{- include "rag-ingestion.labels" $root | nindent 4 }}
    zuno.io/rag-ingestion-domain: {{ $name | quote }}
data:
  INGESTION_DOMAIN: "knowledge.{{ $name }}"
  REDHAT_SOURCES_JSON: "[]"
  CONFLUENCE_SOURCES_JSON: "[]"
  SALESFORCE_SOURCES_JSON: {{ ($domain.salesforce).sources | default list | toJson | quote }}
  SXA_DUMP_SCHEMA_S3_KEY: {{ ($domain.sxaDump).schemaS3Key | default "" | quote }}
  SXA_DUMP_DATA_S3_KEY: {{ ($domain.sxaDump).dataS3Key | default "" | quote }}
  SXA_SNAPSHOT_ID: {{ ($domain.sxaDump).snapshotId | default "" | quote }}
  # ADR-0216/WP-065: the dedicated SXA dump bucket - separate from
  # S3_BUCKET/S3_ENDPOINT/S3_REGION below, which point at the shared
  # corpus bucket every other domain's fetch stages use. Always rendered
  # (default "" when $domain.sxaDump is unset) - pipeline.py.tpl's
  # CONFIG_KEYS requires every one of these keys to exist in every
  # domain's ConfigMap regardless of that domain's source type (confirmed
  # live 2026-08-21: gating these behind `if $domain.sxaDump` broke the
  # sxa domain's pod with CreateContainerConfigError, since sxa has
  # sxaCorpus, not sxaDump - see the sxaCorpus block below for the mirror
  # bug that caused the same failure).
  SXA_S3_ENDPOINT: {{ (ternary (($domain.sxaDump).s3).endpoint (printf "https://s3.%s.amazonaws.com" (($domain.sxaDump).s3).region) (ne (($domain.sxaDump).s3).endpoint "")) | default "" | quote }}
  SXA_S3_BUCKET: {{ (($domain.sxaDump).s3).bucket | default "" | quote }}
  SXA_S3_REGION: {{ (($domain.sxaDump).s3).region | default "" | quote }}
  SXA_S3_PATH_STYLE: {{ (($domain.sxaDump).s3).pathStyle | default "" | quote }}
  SXA_MARIADB_HOST: {{ (($domain.sxaDump).mariadb).host | default "" | quote }}
  SXA_MARIADB_PORT: {{ (($domain.sxaDump).mariadb).port | default "" | quote }}
  SXA_MARIADB_USER: {{ (($domain.sxaDump).mariadb).username | default "" | quote }}
  SXA_MARIADB_DATABASE: {{ (($domain.sxaDump).mariadb).database | default "" | quote }}
  # ADR-0217/WP-067: fetch-sxa's own dedicated bucket - distinct from both
  # S3_BUCKET (shared corpus) and SXA_S3_BUCKET (sxa-legacy's MariaDB-import
  # bucket) above. Always rendered for the same reason as the sxaDump block
  # above.
  SXA_CORPUS_SCHEMA_S3_KEY: {{ ($domain.sxaCorpus).schemaS3Key | default "" | quote }}
  SXA_CORPUS_DATA_S3_KEY: {{ ($domain.sxaCorpus).dataS3Key | default "" | quote }}
  SXA_CORPUS_SNAPSHOT_ID: {{ ($domain.sxaCorpus).snapshotId | default "" | quote }}
  SXA_CORPUS_S3_ENDPOINT: {{ (ternary (($domain.sxaCorpus).s3).endpoint (printf "https://s3.%s.amazonaws.com" (($domain.sxaCorpus).s3).region) (ne (($domain.sxaCorpus).s3).endpoint "")) | default "" | quote }}
  SXA_CORPUS_S3_BUCKET: {{ (($domain.sxaCorpus).s3).bucket | default "" | quote }}
  SXA_CORPUS_S3_REGION: {{ (($domain.sxaCorpus).s3).region | default "" | quote }}
  SXA_CORPUS_S3_PATH_STYLE: {{ (($domain.sxaCorpus).s3).pathStyle | default "" | quote }}
  S3_ENDPOINT: {{ include "rag-ingestion.s3Endpoint" $root | quote }}
  S3_BUCKET: {{ $root.Values.s3.bucket | quote }}
  S3_REGION: {{ $root.Values.s3.region | quote }}
  S3_PATH_STYLE: {{ $root.Values.s3.pathStyle | quote }}
  S3_RAW_PREFIX: "{{ $root.Values.corpus.rawPrefix }}-{{ $name }}"
  S3_NORMALIZED_PREFIX: "{{ $root.Values.corpus.normalizedPrefix }}-{{ $name }}"
  S3_MANIFEST_PREFIX: "{{ $root.Values.corpus.manifestPrefix }}-{{ $name }}"
  S3_FAILED_PREFIX: "{{ $root.Values.corpus.failedPrefix }}-{{ $name }}"
  PGHOST: {{ $root.Values.postgres.host | quote }}
  PGPORT: {{ $root.Values.postgres.port | quote }}
  PGDATABASE: {{ $domain.postgres.database | quote }}
  PGSCHEMA: {{ $domain.postgres.schema | quote }}
  PGSSLMODE: {{ $root.Values.postgres.sslmode | quote }}
  EMBEDDING_ENDPOINT: {{ $root.Values.embedding.endpoint | quote }}
  EMBEDDING_MODEL: {{ $root.Values.embedding.model | quote }}
  EMBEDDING_DIMENSIONS: {{ $root.Values.embedding.dimensions | quote }}
  EMBEDDING_BATCH_SIZE: {{ $root.Values.embedding.batchSize | quote }}
  CHUNKING_STRATEGY: {{ $root.Values.chunking.strategy | quote }}
  CHUNK_MAX_TOKENS: {{ $root.Values.chunking.maxTokens | quote }}
  CHUNK_OVERLAP_TOKENS: {{ $root.Values.chunking.overlapTokens | quote }}
  CHUNK_PRESERVE_CODE_BLOCKS: {{ $root.Values.chunking.preserveCodeBlocks | quote }}
  CHUNK_PRESERVE_TABLES: {{ $root.Values.chunking.preserveTables | quote }}
  CORPUS_INCREMENTAL: {{ $root.Values.corpus.incremental | quote }}
  CORPUS_HASH_ALGORITHM: {{ $root.Values.corpus.hashAlgorithm | quote }}
  CORPUS_DELETE_ORPHANS: {{ $root.Values.corpus.deleteOrphans | quote }}
  # WP-24 / ADR-0109 / ADR-0205: mirrors knowledge/{{ $name }}/domain.yaml's
  # freshness.operation_classes.semantic-read.max_staleness.
  STALE_AFTER: {{ $domain.staleAfter | default "none" | quote }}
  # WP-57: same fleet-wide values as templates/configmap.yaml (tech's) -
  # always rendered, pipeline.py.tpl's CONFIG_KEYS requires every domain's
  # ConfigMap to carry these regardless of that domain's source type.
  FETCH_REDHAT_CONCURRENCY: {{ $root.Values.resources.fetch.redhatConcurrency | quote }}
  FETCH_SXA_WRITE_CONCURRENCY: {{ $root.Values.resources.fetch.sxaWriteConcurrency | quote }}
  # WP-58: same rationale, detect-changes' per-document S3 read pool.
  DETECT_CHANGES_READ_CONCURRENCY: {{ $root.Values.resources.detectChanges.readConcurrency | quote }}
---
{{- end }}
{{- end }}
