apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rag-ingestion.fullname" . }}-config
  namespace: {{ .Values.platform.namespace }}
  labels:
    {{- include "rag-ingestion.labels" . | nindent 4 }}
data:
  # knowledge.tech's run config (ADR-0204/WP-22: the top-level
  # redhat[]/confluence[]/postgres blocks are tech's - each additional
  # domain gets its own ConfigMap from templates/domain-configmaps.yaml,
  # same key set, so the pipeline code reads one contract everywhere).
  INGESTION_DOMAIN: "knowledge.tech"
  # redhat/confluence are now multi-entry arrays (one product+version pair
  # per redhat[] entry, one tech x skill-tier source per confluence[]
  # entry) - KFP's use_config_map_as_env only maps flat key/value pairs,
  # so each array is passed through as a single JSON blob for the CLI to
  # parse, rather than as flat REDHAT_*/CONFLUENCE_* keys.
  REDHAT_SOURCES_JSON: {{ .Values.redhat | toJson | quote }}
  CONFLUENCE_SOURCES_JSON: {{ .Values.confluence | toJson | quote }}
  SALESFORCE_SOURCES_JSON: "[]"
  SXA_DUMP_SCHEMA_S3_KEY: ""
  SXA_DUMP_DATA_S3_KEY: ""
  SXA_SNAPSHOT_ID: ""
  # tech never sources from SXA - these exist only because
  # pipeline.py.tpl's CONFIG_KEYS requires the full key contract
  # (SXA_DUMP_SCHEMA_S3_KEY/SXA_DUMP_DATA_S3_KEY/SXA_SNAPSHOT_ID above
  # included) in every domain's ConfigMap, tech's included. Confirmed live
  # 2026-08-21: a stale PipelineVersion masked this gap here for a long
  # time (compiled before these keys existed in CONFIG_KEYS); a fresh
  # recompile without this block would hit the same
  # CreateContainerConfigError that gap caused elsewhere - see
  # templates/domain-configmaps.yaml.
  SXA_S3_ENDPOINT: ""
  SXA_S3_BUCKET: ""
  SXA_S3_REGION: ""
  SXA_S3_PATH_STYLE: ""
  S3_ENDPOINT: {{ include "rag-ingestion.s3Endpoint" . | quote }}
  S3_BUCKET: {{ .Values.s3.bucket | quote }}
  S3_REGION: {{ .Values.s3.region | quote }}
  S3_PATH_STYLE: {{ .Values.s3.pathStyle | quote }}
  S3_RAW_PREFIX: {{ .Values.corpus.rawPrefix | quote }}
  S3_NORMALIZED_PREFIX: {{ .Values.corpus.normalizedPrefix | quote }}
  S3_MANIFEST_PREFIX: {{ .Values.corpus.manifestPrefix | quote }}
  S3_FAILED_PREFIX: {{ .Values.corpus.failedPrefix | quote }}
  PGHOST: {{ .Values.postgres.host | quote }}
  PGPORT: {{ .Values.postgres.port | quote }}
  PGDATABASE: {{ .Values.postgres.database | quote }}
  PGSCHEMA: {{ .Values.postgres.schema | quote }}
  PGSSLMODE: {{ .Values.postgres.sslmode | quote }}
  EMBEDDING_ENDPOINT: {{ .Values.embedding.endpoint | quote }}
  EMBEDDING_MODEL: {{ .Values.embedding.model | quote }}
  EMBEDDING_DIMENSIONS: {{ .Values.embedding.dimensions | quote }}
  EMBEDDING_BATCH_SIZE: {{ .Values.embedding.batchSize | quote }}
  CHUNKING_STRATEGY: {{ .Values.chunking.strategy | quote }}
  CHUNK_MAX_TOKENS: {{ .Values.chunking.maxTokens | quote }}
  CHUNK_OVERLAP_TOKENS: {{ .Values.chunking.overlapTokens | quote }}
  CHUNK_PRESERVE_CODE_BLOCKS: {{ .Values.chunking.preserveCodeBlocks | quote }}
  CHUNK_PRESERVE_TABLES: {{ .Values.chunking.preserveTables | quote }}
  CORPUS_INCREMENTAL: {{ .Values.corpus.incremental | quote }}
  CORPUS_HASH_ALGORITHM: {{ .Values.corpus.hashAlgorithm | quote }}
  CORPUS_DELETE_ORPHANS: {{ .Values.corpus.deleteOrphans | quote }}
  # WP-24 / ADR-0109 / ADR-0205: mirrors knowledge/tech/domain.yaml's
  # freshness.operation_classes.semantic-read.max_staleness.
  STALE_AFTER: {{ .Values.staleAfter | quote }}
  # WP-57: network/S3-latency-bound worker pool sizes, not CPU-bound -
  # see resources.fetch's own comment.
  FETCH_REDHAT_CONCURRENCY: {{ .Values.resources.fetch.redhatConcurrency | quote }}
  FETCH_SXA_WRITE_CONCURRENCY: {{ .Values.resources.fetch.sxaWriteConcurrency | quote }}
  # WP-58: same rationale, detect-changes' per-document S3 read pool.
  DETECT_CHANGES_READ_CONCURRENCY: {{ .Values.resources.detectChanges.readConcurrency | quote }}
  VALIDATE_READ_CONCURRENCY: {{ .Values.resources.validate.readConcurrency | quote }}
  # ADR-0219: normalize/chunk/embed/index-pgvector worker pools.
  NORMALIZE_CONCURRENCY: {{ .Values.resources.normalize.concurrency | quote }}
  CHUNK_CONCURRENCY: {{ .Values.resources.chunk.concurrency | quote }}
  EMBED_CONCURRENCY: {{ .Values.resources.embed.concurrency | quote }}
  INDEX_READ_CONCURRENCY: {{ .Values.resources.index.readConcurrency | quote }}
