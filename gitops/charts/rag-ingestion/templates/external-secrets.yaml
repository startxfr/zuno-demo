{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.s3.secretName }}
  namespace: {{ .Values.platform.namespace }}
  labels:
    {{- include "rag-ingestion.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  target:
    name: {{ .Values.s3.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.s3.externalSecret.remoteKey | quote }}
        property: {{ .Values.s3.externalSecret.accessKeyProperty | quote }}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.s3.externalSecret.remoteKey | quote }}
        property: {{ .Values.s3.externalSecret.secretKeyProperty | quote }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgres.secretName }}
  namespace: {{ .Values.platform.namespace }}
  labels:
    {{- include "rag-ingestion.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  target:
    name: {{ .Values.postgres.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: PGUSER
      remoteRef:
        key: {{ .Values.postgres.externalSecret.remoteKey | quote }}
        property: {{ .Values.postgres.externalSecret.usernameProperty | quote }}
    - secretKey: PGPASSWORD
      remoteRef:
        key: {{ .Values.postgres.externalSecret.remoteKey | quote }}
        property: {{ .Values.postgres.externalSecret.passwordProperty | quote }}
{{- if gt (len .Values.confluence) 0 }}
{{- /* Every confluence[] entry shares the same authentication block via
the confluenceAuthDefault YAML anchor in values.yaml (one Atlassian site,
one token secret for this demo) - a single ExternalSecret keyed off the
first entry covers them all. If an environment ever overrides individual
entries with different secretName/remoteKey values, this needs to loop
instead. */}}
{{- $auth := (first .Values.confluence).authentication }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $auth.secretName }}
  namespace: {{ .Values.platform.namespace }}
  labels:
    {{- include "rag-ingestion.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  target:
    name: {{ $auth.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: CONFLUENCE_TOKEN
      remoteRef:
        key: {{ $auth.externalSecret.remoteKey | quote }}
        property: {{ $auth.externalSecret.tokenProperty | quote }}
{{- if eq $auth.type "api-token" }}
    - secretKey: CONFLUENCE_USERNAME
      remoteRef:
        key: {{ $auth.externalSecret.remoteKey | quote }}
        property: {{ $auth.externalSecret.usernameProperty | quote }}
{{- end }}
{{- end }}
{{- if .Values.embedding.auth.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.embedding.auth.secretName }}
  namespace: {{ .Values.platform.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  target:
    name: {{ .Values.embedding.auth.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: EMBEDDING_API_TOKEN
      remoteRef:
        key: {{ .Values.embedding.auth.externalSecret.remoteKey | quote }}
        property: {{ .Values.embedding.auth.externalSecret.tokenProperty | quote }}
{{- end }}
{{- if and .Values.pipelineServer.manage (eq .Values.pipelineServer.metadataDatabase.mode "externalMySQL") }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.pipelineServer.metadataDatabase.externalMySQL.secretName }}
  namespace: {{ .Values.platform.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  target:
    name: {{ .Values.pipelineServer.metadataDatabase.externalMySQL.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.pipelineServer.metadataDatabase.externalMySQL.externalSecret.remoteKey | quote }}
        property: {{ .Values.pipelineServer.metadataDatabase.externalMySQL.externalSecret.passwordProperty | quote }}
{{- end }}
{{- /* ADR-0204 part 2 (WP-22): per-domain credentials for every enabled
additional domain - the domain's own database credential (never tech's,
cross-domain isolation is credential-enforced per WP-21) plus its
source-system credential where the adapter needs one (Salesforce;
load-sxa-dump reads from the corpus bucket with the S3 credential above). */}}
{{- $root := . }}
{{- range $name, $domain := .Values.domains }}
{{- if $domain.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $domain.postgres.secretName }}
  namespace: {{ $root.Values.platform.namespace }}
  labels:
    {{- include "rag-ingestion.labels" $root | nindent 4 }}
    zuno.io/rag-ingestion-domain: {{ $name | quote }}
spec:
  refreshInterval: {{ $root.Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $root.Values.externalSecrets.storeRef.kind }}
    name: {{ $root.Values.externalSecrets.storeRef.name }}
  target:
    name: {{ $domain.postgres.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: PGUSER
      remoteRef:
        key: {{ $domain.postgres.externalSecret.remoteKey | quote }}
        property: {{ $domain.postgres.externalSecret.usernameProperty | quote }}
    - secretKey: PGPASSWORD
      remoteRef:
        key: {{ $domain.postgres.externalSecret.remoteKey | quote }}
        property: {{ $domain.postgres.externalSecret.passwordProperty | quote }}
{{- if $domain.salesforce }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $domain.salesforce.secretName }}
  namespace: {{ $root.Values.platform.namespace }}
  labels:
    {{- include "rag-ingestion.labels" $root | nindent 4 }}
    zuno.io/rag-ingestion-domain: {{ $name | quote }}
spec:
  refreshInterval: {{ $root.Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $root.Values.externalSecrets.storeRef.kind }}
    name: {{ $root.Values.externalSecrets.storeRef.name }}
  target:
    name: {{ $domain.salesforce.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: SALESFORCE_INSTANCE_URL
      remoteRef:
        key: {{ $domain.salesforce.externalSecret.remoteKey | quote }}
        property: {{ $domain.salesforce.externalSecret.instanceUrlProperty | quote }}
    - secretKey: SALESFORCE_TOKEN
      remoteRef:
        key: {{ $domain.salesforce.externalSecret.remoteKey | quote }}
        property: {{ $domain.salesforce.externalSecret.tokenProperty | quote }}
{{- end }}
{{- if $domain.sxaDump }}
---
# ADR-0216/WP-065: dedicated SXA dump bucket credentials - separate from
# the top-level S3_SECRET above, which points at the shared corpus bucket.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $domain.sxaDump.s3.secretName }}
  namespace: {{ $root.Values.platform.namespace }}
  labels:
    {{- include "rag-ingestion.labels" $root | nindent 4 }}
    zuno.io/rag-ingestion-domain: {{ $name | quote }}
spec:
  refreshInterval: {{ $root.Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $root.Values.externalSecrets.storeRef.kind }}
    name: {{ $root.Values.externalSecrets.storeRef.name }}
  target:
    name: {{ $domain.sxaDump.s3.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: SXA_AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ $domain.sxaDump.s3.externalSecret.remoteKey | quote }}
        property: {{ $domain.sxaDump.s3.externalSecret.accessKeyProperty | quote }}
    - secretKey: SXA_AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ $domain.sxaDump.s3.externalSecret.remoteKey | quote }}
        property: {{ $domain.sxaDump.s3.externalSecret.secretKeyProperty | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
