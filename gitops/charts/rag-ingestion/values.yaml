# RAG ingestion Helm chart configuration.
# No secret value belongs in this file: External Secrets Operator materializes Kubernetes Secrets.

platform:
  openshiftVersion: "4.22"
  openshiftAIVersion: "3.5"
  namespace: "zuno-ai-build"
  createNamespace: false

serviceAccount:
  create: true
  name: "rag-ingestion"

externalSecrets:
  enabled: true
  # No refreshPolicy: that is an ESO >= v0.16 external-secrets.io/v1
  # field; this cluster's ESO v0.11 serves only v1alpha1/v1beta1, whose
  # schema has no such field (the whole zuno-rag-ingestion-d1 sync fails
  # on "could not find version v1" if set). Periodic refresh is what
  # refreshInterval alone already does.
  refreshInterval: 1h
  storeRef:
    kind: ClusterSecretStore
    name: "vault-backend"

# OpenShift AI Pipelines server. pgvector is NOT this database.
pipelineServer:
  manage: true
  name: rag-dspa
  pipelineStore: kubernetes
  cacheEnabled: false
  objectStorage:
    useCorpusS3: true
  metadataDatabase:
    mode: externalMySQL      # embeddedMariaDB | externalMySQL
    externalMySQL:
      host: "mariadb.zuno-data.svc.cluster.local"
      port: 3306
      database: mlpipeline
      username: mlpipeline
      secretName: rag-pipeline-db
      externalSecret:
        remoteKey: "rag/pipeline-db"
        passwordProperty: password

# Red Hat product documentation sources - public to everyone, no acl_groups
# stamped on their chunks. One array entry per product+version pair (not
# a versions: [] list per product) so each version can carry its own
# documentationUrl/include/exclude independently. Two latest versions per
# product (see confluence[] below for the equivalent persona-restricted
# Confluence sources), with three deliberate exceptions:
#   - OpenStack: Red Hat renamed/relaunched the product mid-lineage (RHOSP
#     -> "Red Hat OpenStack Services on OpenShift"), so "latest" and
#     "previous" carry two different product names.
#   - Identity Management (IdM) and Migration Toolkit for Containers (MTC)
#     have no independent release cadence of their own - IdM ships as a
#     chapter inside RHEL's docs, MTC as a chapter inside OpenShift
#     Container Platform's docs. Modeled here as sub-entries under their
#     parent product's own two latest versions, not invented version
#     numbers.
# Satellite 6.17/6.16 are confirmed (given directly). Every other entry was
# HTTP-verified via `components/rag-ingestion/tooling/verify_catalog.py`:
# the 2 MTC entries came back HTTP 404 and were corrected to the real book
# path (`migrating_from_version_3_to_4`) - see ADR-0330's implementation
# note. All 34 `redhat[]` entries are HTTP-confirmed; no `# CONFIRM`
# markers remain.
# platform.openshiftVersion (4.22, ADR-0319) matches the "latest"
# redhat[] OCP entry below - both track the real current GA release.
redhat:
  - enabled: true
    product: "Red Hat Satellite"
    productSlug: "red-hat-satellite"
    version: "6.17"
    documentationUrl: "https://docs.redhat.com/en/documentation/red_hat_satellite/6.17"
    languages: [en-US]
    fetchMode: html              # html | pdf | both
    include: []                  # empty = all documents discovered under documentationUrl
    exclude: []
  - enabled: true
    product: "Red Hat Satellite"
    productSlug: "red-hat-satellite"
    version: "6.16"
    documentationUrl: "https://docs.redhat.com/en/documentation/red_hat_satellite/6.16"
    languages: [en-US]
    fetchMode: html
    include: []
    exclude: []
  - enabled: true
    product: "Red Hat OpenShift Container Platform"
    productSlug: "openshift-container-platform"
    version: "4.22"
    documentationUrl: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.22/html-single/release_notes/index"
    languages: [en-US]
    fetchMode: html
    include: []
    exclude: []
  - enabled: true
    product: "Red Hat OpenShift Container Platform"
    productSlug: "openshift-container-platform"
    version: "4.21"
    documentationUrl: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html-single/release_notes/index"
    languages: [en-US]
    fetchMode: html
    include: []
    exclude: []
  # release_notes alone leaves this product at 2 real pages per version
  # (out of 874 total corpus documents) - html-single "landing" pages like
  # release_notes typically link to little/nothing else
  # (components/rag-ingestion/src/rag_ingestion.py's _discover_doc_links
  # docstring), so OpenShift's real documentation - dozens of independent
  # html-single books - is structurally undiscoverable from that one seed.
  # Every URL below is HTTP-verified against docs.redhat.com for both 4.22
  # and 4.21 - each is itself an html-single page (the whole book in one
  # fetch, matching this chart's existing convention), so this is still
  # one HTTP call per entry, not a multi-page crawl. A few guessed slugs
  # 404'd and were dropped rather than kept speculatively:
  # installing_on_oracle_cloud_infrastructure (no OCP-native book found), a
  # standalone "networking"/"observability" overview book (superseded
  # below by their real constituent books - networking_operators/
  # network_security and logging/monitoring/distributed_tracing
  # respectively).
