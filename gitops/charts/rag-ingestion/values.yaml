attachmentMimeTypes:
  - application/pdf
  - application/vnd.openxmlformats-officedocument.wordprocessingml.document
  - application/vnd.openxmlformats-officedocument.presentationml.presentation

s3:
  type: aws
  # Empty endpoint means the chart derives https://s3.<region>.amazonaws.com.
  endpoint: ""
  bucket: "zuno-demo-rag-corpus"
  region: "eu-west-2"         # replace with the actual AWS region
  pathStyle: false
  secretName: rag-s3
  externalSecret:
    remoteKey: "rag/s3"
    accessKeyProperty: accessKeyId
    secretKeyProperty: secretAccessKey

# PostgreSQL + pgvector used by the RAG corpus/index: a dedicated
# "rag-tech" database (owner role "ragtech") on the shared zuno-postgresql
# PGO cluster in zuno-data (gitops/charts/postgresql's ragTechDatabase
# block), holding a "rag" schema - not the shared zunoapp/zuno database.
# host/secretName below match PGO's own naming convention
# (<cluster>-pgbouncer Service, <cluster>-pguser-<owner> Secret) rather
# than a chart-invented name, same as gitops/charts/rag-service's pg.*
# values. The pguser Secret lives in zuno-data; the ExternalSecret in
# templates/external-secrets.yaml re-materializes it here in
# zuno-ai-build (secretKeyRef can't cross namespaces), reading the same
# Vault path gitops/charts/postgresql/templates/externalsecret-ragtech.yaml
# also resolves - same cross-namespace pattern as Keycloak (ADR-0315).
postgres:
  existing: true
  host: "zuno-postgresql-pgbouncer.zuno-data.svc"
  port: 5432
  database: rag-tech
  schema: rag
  sslmode: require
  secretName: rag-postgres
  externalSecret:
    # Vault KV property names (as seeded by ansible/roles/vault/tasks/install.yml's
    # "username"/"password" keys) - not PGO's own K8s Secret key names
    # ("user"/"password"), which templates/external-secrets.yaml maps
    # independently into PGUSER/PGPASSWORD.
    remoteKey: "rag/postgresql-app"
    usernameProperty: username
    passwordProperty: password

# Endpoint/model align with gitops/charts/models' additive embeddingModel
# (KServe InferenceService "embeddings" -> Service
# embeddings-predictor.zuno-ai-run.svc) - the same backing service
# gitops/charts/rag-service already expects by default, closing what was
# previously a dangling placeholder on that side too.
embedding:
  endpoint: "http://embeddings-predictor.zuno-ai-run.svc:8080/v1"
  # The SERVED model id (gitops/charts/models embeddingModel.servedModelName),
  # NOT the HF repo id "BAAI/bge-small-en-v1.5" - VERIFIED live 2026-08-18:
  # vLLM answers 404 NotFoundError ("The model `BAAI/bge-small-en-v1.5`
  # does not exist") for the HF id, which zeroed out every embedding in
  # both ingestion runs (embed: embedded 0 chunks) and failed validate
  # with "no rows indexed". Same modelId-vs-servedModelName split the
  # models chart documents for the chat model (its own 404 incident,
  # values.yaml servedModelName comment).
  model: "bge-small-en-v1.5"
  dimensions: 384
  batchSize: 64
  auth:
    enabled: false
    secretName: rag-embedding
    externalSecret:
      remoteKey: "rag/embedding"
      tokenProperty: token

chunking:
  strategy: structural
  # Budget must fit embedding.model's max sequence length (bge-small-en-v1.5:
  # 512), and the chunker counts cl100k tokens which run ~1.4-1.7x FEWER than
  # bge's WordPiece on technical prose - 700 here meant 1000+ real tokens and
  # vLLM 400-failed nearly every batch (run 3, 2026-08-18: 17/13324 chunks
  # embedded). 320 cl100k =~ 450-540 WordPiece; the embed stage's
  # truncate_prompt_tokens handles the tail that still crosses 512.
  maxTokens: 320
  overlapTokens: 64
  preserveCodeBlocks: true
  preserveTables: true

# knowledge.tech's freshness window (WP-24 / ADR-0109 / ADR-0205): mirrors
# knowledge/tech/domain.yaml's freshness.operation_classes.semantic-read.
# max_staleness - a human-maintained mirror, the same pattern
# schedule.cron/freshness.objective already established. "<int>d/h/m" or
# "none" (never compute stale_after for this domain's chunks).
staleAfter: 7d

corpus:
  rawPrefix: raw
  normalizedPrefix: normalized
  manifestPrefix: manifests
  failedPrefix: failed
  incremental: true
  hashAlgorithm: sha256
  deleteOrphans: true

# knowledge.tech's cadence (ADR-0105: weekly minimum for tech). KFP
# recurring runs are created through the OpenShift AI/KFP API, not a
# chart-rendered CRD (this RHOAI version's DataSciencePipelinesApplication
# doesn't expose a K8s-native RecurringRun resource) - what the chart DOES
# render is one schedule ConfigMap per scheduled domain
# (templates/schedule-configmaps.yaml, this block + each enabled
# domains.<name>.schedule below), which
# ansible/roles/rag_ingestion/tasks/install.yml consumes to create the
# actual recurring runs - see README's "Scheduling" section.
schedule:
  enabled: true
  cron: "0 0 2 * * 0"
  timezone: Europe/Paris

pipeline:
  name: rag-corpus-ingestion
  # v0-3-0: forwards STALE_AFTER into stage pods (CONFIG_KEYS fix) - v0-2-0
  # compiled without it and every chunk failed WP-24 freshness validation.
  version: v0-3-0
  displayName: RAG corpus ingestion
  description: Incremental ingestion of Red Hat documentation and Confluence into PostgreSQL/pgvector
  createPipelineResource: true

# ADR-0204 part 2 + ADR-0105 (WP-22): the additional logical knowledge
# domains this chart can ingest for. The chart's existing top-level
# redhat[]/confluence[]/postgres/schedule blocks ARE knowledge.tech's
# configuration (kept top-level so the 500 lines of tech source entries
# and the WP-07-verified paths don't churn); each entry below adds one
# further domain with its own fetch stages, its own database (the
# deploy-side counterpart of platform/bindings/knowledge/bindings.yaml,
# same rule as gitops/charts/rag-service), its own source config and its
# own cadence. Every enabled entry renders: a per-domain config ConfigMap,
# per-domain ExternalSecrets, a per-domain Pipeline CR
# (rag-corpus-ingestion-<name>) and - when schedule.enabled - a schedule
# ConfigMap the Ansible role turns into a KFP recurring run.
#
# All three ship enabled: false: their databases/Vault credentials only
# exist after the operator provisions them (WP-21 follow-up), and their
# source credentials are operator-supplied (WP-22 follow-up) - flipping a
# domain on is that operator step, not a code change.
domains:
  sales:
    enabled: false
    fetchStages: [fetch-salesforce]
    postgres:
      database: rag-sales
      schema: rag
      secretName: rag-postgres-sales
      externalSecret:
        remoteKey: "rag-sales/postgresql-app"
        usernameProperty: username
        passwordProperty: password
    salesforce:
      # Operator-supplied: instance URL + token at Vault zuno/salesforce/technical
      # ({instance_url, token}), consumed via the ExternalSecret below.
      secretName: rag-salesforce
      externalSecret:
        remoteKey: "salesforce/technical"
        instanceUrlProperty: instance_url
        tokenProperty: token
      # One entry per queried object; fields render in this order into the
      # indexed text. dealType/statusField feed ADR-0202's sales metadata
      # extensions. requiredGroups -> acl_groups, same as confluence[].
      sources:
        - enabled: true
          object: Opportunity
          fields: [Id, Name, StageName, Amount, CloseDate, LastModifiedDate]
          statusField: StageName
          dealType: pipeline
          requiredGroups: [sales]
    # ADR-0105: hours-scale for sales - every 4 hours by default,
    # environment-configurable.
    schedule:
      enabled: true
      cron: "0 0 */4 * * *"
      timezone: Europe/Paris
    # WP-24 / ADR-0109 / ADR-0205: mirrors knowledge/sales/domain.yaml's
    # freshness.operation_classes.semantic-read.max_staleness.
    staleAfter: 4h
  adv:
    enabled: false
    fetchStages: [fetch-aramis]
    postgres:
      database: rag-adv
      schema: rag
      secretName: rag-postgres-adv
      externalSecret:
        remoteKey: "rag-adv/postgresql-app"
        usernameProperty: username
        passwordProperty: password
    aramis:
      # Operator-supplied: base URL + token at Vault zuno/aramis/technical.
      secretName: rag-aramis
      externalSecret:
        remoteKey: "aramis/technical"
        baseUrlProperty: base_url
        tokenProperty: token
      sources:
        - enabled: true
          name: projects
          endpoint: /api/projects
          projectType: delivery
          requiredGroups: [adv]
    # ADR-0105: configurable - daily by default.
    schedule:
      enabled: true
      cron: "0 0 3 * * *"
      timezone: Europe/Paris
    # WP-24 / ADR-0109 / ADR-0205: mirrors knowledge/adv/domain.yaml's
    # freshness.operation_classes.semantic-read.max_staleness.
    staleAfter: 1d
  sxa-legacy:
    enabled: false
    fetchStages: [load-sxa-dump]
    postgres:
      database: rag-sxa-legacy
      schema: rag
      secretName: rag-postgres-sxa-legacy
      externalSecret:
        remoteKey: "rag-sxa-legacy/postgresql-app"
        usernameProperty: username
        passwordProperty: password
    sxaDump:
      # Operator-supplied: the approved snapshot's key in the corpus bucket
      # (ADR-0025: the dump itself never lives in git) and its version ID.
      s3Key: ""
      snapshotId: ""
    # ADR-0105: immutable legacy source - on-demand only, never scheduled.
    # Manual refresh: make d1 install rag-ingestion (see README).
    schedule:
      enabled: false
    # WP-24 / ADR-0109 / ADR-0205: mirrors knowledge/sxa-legacy/domain.yaml's
    # exempt_from_freshness_enforcement - never compute a stale_after for
    # this domain's chunks.
    staleAfter: none

# Runtime image is built imperatively by the day1-build Ansible role
# (ansible/roles/rag_ingestion_build, ansible/tasks/apply_openshift_build.yml)
# - the same mechanism as every other component's image (rag-service,
# mcp-gateway, agent-runtime, ai-gateway), not an ArgoCD-managed
# BuildConfig. Tag is always "latest": apply_openshift_build.yml hardcodes
# "<name>:latest" as its BuildConfig output, matching every other
# component.
images:
  ingestion:
    repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/rag-ingestion
    tag: latest
    # Always, not IfNotPresent - with a mutable :latest tag, IfNotPresent
    # serves whatever stale image the node cached, silently ignoring
    # rebuilds (VERIFIED live 2026-08-16 across multiple components).
    # Revisit when WP-04 pins immutable tags.
    # NOTE indentation is load-bearing here - VERIFIED live 2026-08-18:
    # this key sat dedented at the images. level (a comment insertion had
    # pulled it out of ingestion.), so files/pipeline.py.tpl's
    # {{ .Values.images.ingestion.pullPolicy }} rendered "" and the
    # compiled pipeline failed kfp's set_image_pull_policy validation -
    # one reason no PipelineVersion ever existed on the cluster.
    pullPolicy: Always
  # Unused by any template today - components/rag-ingestion/tooling holds
  # a separate KFP pipeline-compiler image source, not yet wired to a
  # BuildConfig/consumer. Left for a future compile-time step.
  compiler:
    repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/rag-pipeline-compiler
    tag: latest

resources:
  fetch:
    requests: {cpu: "250m", memory: "512Mi"}
    limits: {cpu: "2", memory: "2Gi"}
  normalize:
    requests: {cpu: "1", memory: "2Gi"}
    limits: {cpu: "4", memory: "8Gi"}
  embed:
    requests: {cpu: "1", memory: "2Gi"}
    limits: {cpu: "4", memory: "8Gi"}
  index:
    requests: {cpu: "500m", memory: "1Gi"}
    limits: {cpu: "2", memory: "4Gi"}

networkPolicy:
  enabled: true
  egressCidrs: []

podSecurity:
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  dropAllCapabilities: true
