    product: "Red Hat Satellite"
    productSlug: "red-hat-satellite"
    version: "6.17"
    documentationUrl: "https://docs.redhat.com/en/documentation/red_hat_satellite/6.17"
    languages: [en-US]
    fetchMode: html              # html | pdf | both
    include: []                  # empty = all documents discovered under documentationUrl
