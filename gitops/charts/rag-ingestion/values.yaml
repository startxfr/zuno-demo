# RAG ingestion Helm chart configuration.
# No secret value belongs in this file: External Secrets Operator materializes Kubernetes Secrets.

platform:
  openshiftVersion: "4.22"
  openshiftAIVersion: "3.5"
  namespace: "zuno-ai-build"
  createNamespace: false

serviceAccount:
  create: true
  name: "rag-ingestion"

externalSecrets:
  enabled: true
  refreshPolicy: Periodic
  refreshInterval: 1h
  storeRef:
    kind: ClusterSecretStore
    name: "vault-backend"

# OpenShift AI Pipelines server. pgvector is NOT this database.
pipelineServer:
  manage: true
  name: rag-dspa
  pipelineStore: kubernetes
  cacheEnabled: false
  objectStorage:
    useCorpusS3: true
  metadataDatabase:
    mode: externalMySQL      # embeddedMariaDB | externalMySQL
    externalMySQL:
      host: "mariadb.zuno-data.svc.cluster.local"
      port: 3306
      database: mlpipeline
      username: mlpipeline
      secretName: rag-pipeline-db
      externalSecret:
        remoteKey: "rag/pipeline-db"
        passwordProperty: password

# Red Hat product documentation sources - public to everyone, no acl_groups
# stamped on their chunks. One array entry per product+version pair (not
# a versions: [] list per product) so each version can carry its own
# documentationUrl/include/exclude independently. Two latest versions per
# product, per the platform's own access policy (see confluence[] below
# for the equivalent persona-restricted Confluence sources). Satellite
# 6.17/6.16 are confirmed; the OpenShift/OpenShift AI/Keycloak version
# strings below are this chart's current best guess (openshift_version/
# openshift_ai_version above are this repo's own already-declared
# targets; RHBK's are not referenced anywhere else in this repo) - CONFIRM
# against docs.redhat.com before the first real fetch-redhat run.
redhat:
  - enabled: true
    product: "Red Hat Satellite"
    productSlug: "red-hat-satellite"
    version: "6.17"
    documentationUrl: "https://docs.redhat.com/en/documentation/red_hat_satellite/6.17"
    languages: [en-US]
    fetchMode: html              # html | pdf | both
    include: []                  # empty = all documents discovered under documentationUrl
    exclude: []
  - enabled: true
    product: "Red Hat Satellite"
    productSlug: "red-hat-satellite"
    version: "6.16"
    documentationUrl: "https://docs.redhat.com/en/documentation/red_hat_satellite/6.16"
    languages: [en-US]
    fetchMode: html
    include: []
    exclude: []
  - enabled: true
    product: "Red Hat OpenShift Container Platform"
    productSlug: "openshift-container-platform"
    version: "4.22"              # CONFIRM: matches platform.openshiftVersion above, not yet verified against docs.redhat.com
    documentationUrl: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.22"
    languages: [en-US]
    fetchMode: html
    include: []
    exclude: []
  - enabled: true
    product: "Red Hat OpenShift Container Platform"
    productSlug: "openshift-container-platform"
    version: "4.21"              # CONFIRM: one minor before platform.openshiftVersion, not yet verified
    documentationUrl: "https://docs.redhat.com/en/documentation/openshift_container_platform/4.21"
    languages: [en-US]
    fetchMode: html
    include: []
    exclude: []
  - enabled: true
    product: "Red Hat OpenShift AI"
    productSlug: "red-hat-openshift-ai-self-managed"
    version: "3.5"                # CONFIRM: matches platform.openshiftAIVersion above, not yet verified
    documentationUrl: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5"
    languages: [en-US]
    fetchMode: html
    include: []
    exclude: []
  - enabled: true
    product: "Red Hat OpenShift AI"
    productSlug: "red-hat-openshift-ai-self-managed"
    version: "3.4"                # CONFIRM: not yet verified against docs.redhat.com
    documentationUrl: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.4"
    languages: [en-US]
    fetchMode: html
    include: []
    exclude: []
  - enabled: true
    product: "Red Hat build of Keycloak"
    productSlug: "red-hat-build-of-keycloak"
    version: "26.2"               # CONFIRM: not yet verified against docs.redhat.com
    documentationUrl: "https://docs.redhat.com/en/documentation/red_hat_build_of_keycloak/26.2"
    languages: [en-US]
    fetchMode: html
    include: []
    exclude: []
  - enabled: true
    product: "Red Hat build of Keycloak"
    productSlug: "red-hat-build-of-keycloak"
    version: "26.0"               # CONFIRM: not yet verified against docs.redhat.com
    documentationUrl: "https://docs.redhat.com/en/documentation/red_hat_build_of_keycloak/26.0"
    languages: [en-US]
    fetchMode: html
    include: []
    exclude: []

# Shared Confluence Cloud authentication, reused by every confluence[]
# entry below via YAML anchor (one Atlassian site, one token secret for
# this demo) - Helm parses values.yaml as plain YAML before templating,
# so anchors/aliases work here same as anywhere else. Override an
# individual entry's authentication block if a source ever needs a
# different site/credential.
confluenceAuthDefault: &confluenceAuthDefault
  type: api-token              # api-token | bearer-token
  secretName: rag-confluence
  externalSecret:
    remoteKey: "rag/confluence"
    tokenProperty: token
    usernameProperty: username

# Confluence Cloud sources - persona/skill-restricted. Each entry is
# filterable by Space (spaces:[]) and by page-tree path (directories:[]),
# and carries requiredGroups: the acl_groups values stamped onto every
# chunk ingested from it (document_embeddings.metadata.acl_groups,
# ADR-0046) - components/rag-service's existing query-time filtering
# (app/search.py's `?|` intersection against caller_groups) enforces
# access with no serving-side changes needed. One entry per
# (tech x skill-tier) combination, matching the 12
# confluence-{archi,build,run}-<tech> Keycloak groups 1:1
# (gitops/charts/keycloak/files/realm-zuno.json's /board and /consultant
# subGroups) - architects (archi) get one tier across all 4 techs;
# consultants get build and run tiers separately. Space key "ARCH" and
# the directories below are demo placeholders - replace with real
# Confluence space keys/page paths per environment (see
# examples/values-*.yaml).
confluence:
  - enabled: true
    name: satellite-archi
    type: cloud
    baseUrl: "https://startxfr.atlassian.net"
    spaces: ["ARCH"]
    directories: ["Satellite/Architecture"]
    requiredGroups: ["confluence-archi-satellite"]
    includeAttachments: true
    preserveAcl: true
    excludeLabels: [obsolete]
    authentication: *confluenceAuthDefault
  - enabled: true
    name: satellite-build
    type: cloud
    baseUrl: "https://startxfr.atlassian.net"
    spaces: ["ARCH"]
    directories: ["Satellite/Build"]
    requiredGroups: ["confluence-build-satellite"]
    includeAttachments: true
    preserveAcl: true
    excludeLabels: [obsolete]
    authentication: *confluenceAuthDefault
  - enabled: true
    name: satellite-run
    type: cloud
    baseUrl: "https://startxfr.atlassian.net"
    spaces: ["ARCH"]
    directories: ["Satellite/Run"]
    requiredGroups: ["confluence-run-satellite"]
    includeAttachments: true
    preserveAcl: true
    excludeLabels: [obsolete]
    authentication: *confluenceAuthDefault
  - enabled: true
    name: openshift-archi
    type: cloud
    baseUrl: "https://startxfr.atlassian.net"
    spaces: ["ARCH"]
    directories: ["OpenShift/Architecture"]
    requiredGroups: ["confluence-archi-openshift"]
    includeAttachments: true
    preserveAcl: true
    excludeLabels: [obsolete]
    authentication: *confluenceAuthDefault
  - enabled: true
    name: openshift-build
    type: cloud
    baseUrl: "https://startxfr.atlassian.net"
    spaces: ["ARCH"]
    directories: ["OpenShift/Build"]
    requiredGroups: ["confluence-build-openshift"]
    includeAttachments: true
    preserveAcl: true
    excludeLabels: [obsolete]
    authentication: *confluenceAuthDefault
  - enabled: true
    name: openshift-run
    type: cloud
    baseUrl: "https://startxfr.atlassian.net"
    spaces: ["ARCH"]
    directories: ["OpenShift/Run"]
    requiredGroups: ["confluence-run-openshift"]
    includeAttachments: true
    preserveAcl: true
    excludeLabels: [obsolete]
    authentication: *confluenceAuthDefault
  - enabled: true
    name: openshift-ai-archi
    type: cloud
    baseUrl: "https://startxfr.atlassian.net"
    spaces: ["ARCH"]
    directories: ["OpenShiftAI/Architecture"]
    requiredGroups: ["confluence-archi-openshift-ai"]
    includeAttachments: true
    preserveAcl: true
    excludeLabels: [obsolete]
    authentication: *confluenceAuthDefault
  - enabled: true
    name: openshift-ai-build
    type: cloud
    baseUrl: "https://startxfr.atlassian.net"
    spaces: ["ARCH"]
    directories: ["OpenShiftAI/Build"]
    requiredGroups: ["confluence-build-openshift-ai"]
    includeAttachments: true
    preserveAcl: true
    excludeLabels: [obsolete]
    authentication: *confluenceAuthDefault
  - enabled: true
    name: openshift-ai-run
    type: cloud
    baseUrl: "https://startxfr.atlassian.net"
    spaces: ["ARCH"]
    directories: ["OpenShiftAI/Run"]
    requiredGroups: ["confluence-run-openshift-ai"]
    includeAttachments: true
    preserveAcl: true
    excludeLabels: [obsolete]
    authentication: *confluenceAuthDefault
  - enabled: true
    name: keycloak-archi
    type: cloud
    baseUrl: "https://startxfr.atlassian.net"
    spaces: ["ARCH"]
    directories: ["Keycloak/Architecture"]
    requiredGroups: ["confluence-archi-keycloak"]
    includeAttachments: true
    preserveAcl: true
    excludeLabels: [obsolete]
    authentication: *confluenceAuthDefault
  - enabled: true
    name: keycloak-build
