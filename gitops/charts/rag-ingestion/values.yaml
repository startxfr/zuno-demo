  # WP-129 point 3 (2026-09-04): the two "Helm" Red-Hat-chapter entries that
  # used to live here (productSlug "helm", the OCP 4.21/4.22
  # building_applications chapters) are REMOVED, not just superseded by the
  # upstream entry below - they were never a clean stopgap to begin with.
  # document_embeddings' uniqueness is (source, chunk_index), NOT scoped by
  # family, and that exact URL is also crawled by the redhat-openshift
  # family's own much larger source list. Live-caught 2026-09-04: the
  # redhat-openshift family's same-day cold-refetch silently overwrote the
  # rows these two entries had indexed the day before, relabelling them
  # metadata.technology helm -> openshift - not a deliberate merge, a race
  # on a shared row that happened to resolve in whichever family touched it
  # last. Keeping the config entries would just re-lose that race on every
  # future run for no benefit, now that upstream (below) is confirmed to
  # cover Helm well on its own (110 chunks / 17 pages, all helm.sh/docs).
  # The argocd family's own two Red-Hat-chapter entries above (Red Hat
  # OpenShift GitOps) do NOT have this problem - their documentationUrls
  # are unique to this family, not shared with any other - so those stay:
  # they're distinct, uncorrupted content (Red Hat's own productized
  # GitOps docs), not a stopgap for missing upstream coverage.
  #
  # Phase 4 (rag-ingestion redesign): the upstream Argo CD/Helm sources
  # below were added alongside the (then-two-family) Red-Hat-chapter
  # entries to compare corpus quality via evaluations/tekos/
  # stress_test.py's qa-argocd/qa-helm probes (check the citations' actual
  # source/url, not just len(citations) > 0) before deciding what to keep -
  # WP-129 point 3 is that comparison, resolved above. crawlStrategy:
  # generic restricts link discovery to the same netloc AND the same path
  # prefix as documentationUrl, so these stay inside /en/stable/ and /docs/
  # respectively rather than wandering into unrelated site content. Both
  # URLs confirmed to return 200 before being added (2026-09-03) - a wrong
  # URL yields a green run that indexes nothing.
  - enabled: true
    product: "Argo CD"
    productSlug: "argocd-upstream"
    family: "argocd"
    technology: "argocd"
    crawlStrategy: "generic"
    version: "stable"
    documentationUrl: "https://argo-cd.readthedocs.io/en/stable/"
    languages: [en-US]
    fetchMode: html
    include: []
    exclude: []
  - enabled: true
    product: "Helm"
    productSlug: "helm-upstream"
    family: "helm"
    technology: "helm"
    crawlStrategy: "generic"
    version: "latest"
    documentationUrl: "https://helm.sh/docs/"
    languages: [en-US]
    fetchMode: html
    include: []
    exclude: []
  # Go is deliberately NOT here. There is no Go documentation on
  # docs.redhat.com that the fetch-redhat adapter could take (every
  # candidate URL 404s), and the Go Toolset docs that do exist elsewhere
  # document Red Hat's packaging of the compiler, not the language
  # semantics qa-go actually asks about ("how do goroutines and channels
  # work together"). Covering it needs a generic-web source adapter for
  # go.dev - SOURCE_ADAPTERS in components/rag-ingestion/src/
  # rag_ingestion.py has only fetch-redhat/fetch-confluence/
  # fetch-salesforce/load-sxa-dump - which is its own work package, not a
  # values edit. qa-go stays red until then, honestly rather than on
  # nearest-neighbour noise.

# Shared Confluence Cloud authentication, reused by every confluence[]
# entry below via YAML anchor (one Atlassian site, one token secret for
# this demo) - Helm parses values.yaml as plain YAML before templating,
# so anchors/aliases work here same as anywhere else. Override an
# individual entry's authentication block if a source ever needs a
# different site/credential.
# remoteKey points at the same zuno/confluence/technical identity
# ansible/roles/vault/tasks/install.yml already seeds from
# ansible/confidential.yml (zuno_atlassian_confluence_*) - one Confluence
# credential total, not a separate rag-ingestion-only one. That path stores
# an `email` field (Confluence Cloud Basic auth is email+token), hence
# usernameProperty: email rather than a `username` field this path doesn't
# have.
confluenceAuthDefault: &confluenceAuthDefault
  type: api-token              # api-token | bearer-token
  secretName: rag-confluence
  externalSecret:
    remoteKey: "confluence/technical"
    tokenProperty: token
    usernameProperty: email

# Confluence Cloud sources - persona/skill-restricted. Each entry is
# filterable by Space (spaces:[]) and by page-tree path (directories:[]),
# and carries requiredGroups: the acl_groups values stamped onto every
# chunk ingested from it (document_embeddings.metadata.acl_groups,
# ADR-0046) - components/rag-service's existing query-time filtering
# (app/search.py's `?|` intersection against caller_groups) enforces
# access with no serving-side changes needed. One entry per
# (tech x skill-tier) combination, matching the 12
# confluence-{archi,build,run}-<tech> Keycloak groups 1:1
# (gitops/charts/keycloak/files/realm-zuno.json) - all 12 now live under
# /consultant (ADR-0340/WP-32 relocated the four confluence-archi-* groups
