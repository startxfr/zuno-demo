  # WP-112/WP-124 (2026-09-03): evaluations/tekos/stress_test.py's
  # technical_qa battery asks about Argo CD, Helm and Go, and Tekos's own
  # bundle advertises "Argo CD/Helm/Go documentation" - but the corpus held
  # NONE of it. Those three probes were nonetheless scoring 7/7, because
  # components/rag-service/app/search.py's _vector_query has no relevance
  # threshold: a working vector arm returns its 20 nearest neighbours for
  # ANY query, and the check only asserts len(citations) > 0, so they were
  # passing on unrelated OpenShift chunks. The failure only surfaced when
  # the vector arm degraded to full-text-only and full-text - correctly -
  # found nothing. These two entries close the Argo CD and Helm halves.
  # Every documentationUrl below was confirmed to return 200 before being
  # added: a wrong URL yields a green ingestion run that indexes nothing.
  - enabled: true
    product: "Red Hat OpenShift GitOps"                      # Argo CD, as Red Hat ships it - the only Argo CD documentation on docs.redhat.com.
    productSlug: "red-hat-openshift-gitops"
    family: "argocd"
    version: "1.17"
    documentationUrl: "https://docs.redhat.com/en/documentation/red_hat_openshift_gitops/1.17/html-single/understanding_openshift_gitops/index"
