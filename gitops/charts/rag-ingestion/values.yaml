attachmentMimeTypes:
  - application/pdf
  - application/vnd.openxmlformats-officedocument.wordprocessingml.document
  - application/vnd.openxmlformats-officedocument.presentationml.presentation

s3:
  type: aws
  # Empty endpoint means the chart derives https://s3.<region>.amazonaws.com.
  endpoint: ""
  bucket: "zuno-demo-rag-corpus"
  region: "eu-west-2"         # replace with the actual AWS region
  pathStyle: false
  secretName: rag-s3
  externalSecret:
    remoteKey: "rag/s3"
    accessKeyProperty: accessKeyId
    secretKeyProperty: secretAccessKey

# PostgreSQL + pgvector used by the RAG corpus/index: a dedicated
# "rag-tech" database (owner role "ragtech") on the shared zuno-postgresql
# PGO cluster in zuno-data (gitops/charts/postgresql's ragTechDatabase
# block), holding a "rag" schema - not the shared zunoapp/zuno database.
# host/secretName below match PGO's own naming convention
# (<cluster>-pgbouncer Service, <cluster>-pguser-<owner> Secret) rather
# than a chart-invented name, same as gitops/charts/rag-service's pg.*
# values. The pguser Secret lives in zuno-data; the ExternalSecret in
# templates/external-secrets.yaml re-materializes it here in
# zuno-ai-build (secretKeyRef can't cross namespaces), reading the same
# Vault path gitops/charts/postgresql/templates/externalsecret-ragtech.yaml
# also resolves - same cross-namespace pattern as Keycloak (ADR-0315).
postgres:
  existing: true
  host: "zuno-postgresql-pgbouncer.zuno-data.svc"
  port: 5432
  database: rag-tech
  schema: rag
  sslmode: require
  secretName: rag-postgres
  externalSecret:
    # Vault KV property names (as seeded by ansible/roles/vault/tasks/install.yml's
    # "username"/"password" keys) - not PGO's own K8s Secret key names
    # ("user"/"password"), which templates/external-secrets.yaml maps
    # independently into PGUSER/PGPASSWORD.
    remoteKey: "rag/postgresql-app"
    usernameProperty: username
    passwordProperty: password

# Endpoint/model align with gitops/charts/models' additive embeddingModel
# (KServe InferenceService "embeddings" -> Service
# embeddings-predictor.zuno-ai-run.svc) - the same backing service
# gitops/charts/rag-service already expects by default, closing what was
# previously a dangling placeholder on that side too.
embedding:
  endpoint: "http://embeddings-predictor.zuno-ai-run.svc:8080/v1"
  # The SERVED model id (gitops/charts/models embeddingModel.servedModelName),
  # NOT the HF repo id "Qwen/Qwen3-Embedding-0.6B" - vLLM answers 404
  # NotFoundError for the HF id, which zeroes out every embedding
  # (embed: embedded 0 chunks) and fails validate with "no rows
  # indexed" (observed live back on the bge model). Same
  # modelId-vs-servedModelName split the models chart documents for the
  # chat model (its own 404, values.yaml servedModelName comment).
  # ADR-0518: 1024-dim Qwen3-Embedding-0.6B replaces 384-dim
  # bge-small-en-v1.5; dimensions here, the models chart's
  # embeddingModel.dimensions and rag-service's pgvector column
  # (files/sql/006_embedding_1024.sql) MUST move together, and any
  # change forces a full re-ingestion - old vectors are unreadable in
  # the new space.
  model: "qwen3-embedding-0.6b"
  dimensions: 1024
  batchSize: 64
  auth:
    enabled: false
    secretName: rag-embedding
    externalSecret:
      remoteKey: "rag/embedding"
      tokenProperty: token

chunking:
  strategy: structural
  # 320 was originally forced by bge-small-en-v1.5's 512-token max
  # sequence length (that model 400-failed batches above it - see git
  # history for the full cl100k-vs-WordPiece arithmetic). ADR-0518's
  # Qwen3-Embedding-0.6B accepts 32k tokens, so the ceiling is gone -
  # 320 is KEPT deliberately as a retrieval-granularity choice (small
  # focused chunks retrieve better than page-sized ones for this
  # corpus's Q&A-style queries); raising it is now a quality decision,
  # not a compatibility one, and would force a full re-ingestion.
  maxTokens: 320
  overlapTokens: 64
  preserveCodeBlocks: true
  preserveTables: true

# knowledge.tech's freshness window (WP-24 / ADR-0109 / ADR-0205): mirrors
# knowledge/tech/domain.yaml's freshness.operation_classes.semantic-read.
# max_staleness - a human-maintained mirror, the same pattern
# schedule.cron/freshness.objective already established. "<int>d/h/m" or
# "none" (never compute stale_after for this domain's chunks).
staleAfter: 7d

corpus:
  rawPrefix: raw
  normalizedPrefix: normalized
  manifestPrefix: manifests
  failedPrefix: failed
  incremental: true
  hashAlgorithm: sha256
  deleteOrphans: true

# knowledge.tech's cadence (ADR-0105: weekly minimum for tech). KFP
# recurring runs are created through the OpenShift AI/KFP API, not a
# chart-rendered CRD (this RHOAI version's DataSciencePipelinesApplication
# doesn't expose a K8s-native RecurringRun resource) - what the chart DOES
# render is one schedule ConfigMap per scheduled domain
# (templates/schedule-configmaps.yaml, this block + each enabled
# domains.<name>.schedule below), which
# ansible/roles/rag_ingestion/tasks/install.yml consumes to create the
# actual recurring runs - see README's "Scheduling" section.
schedule:
  enabled: true
  cron: "0 0 2 * * 0"
  timezone: Europe/Paris

pipeline:
  name: rag-corpus-ingestion
  # v0-3-0: forwards STALE_AFTER into stage pods (CONFIG_KEYS fix) - v0-2-0
  # compiled without it and every chunk failed WP-24 freshness validation.
  # v0-4-0 (ADR-0219): forwards the normalize/chunk/embed/index concurrency
  # knobs. A PipelineVersion object is immutable, so any CONFIG_KEYS change
  # needs a new version name here - re-applying v0-3-0 with a changed spec
  # is rejected with "Pipeline spec is immutable".
  version: v0-4-0
  displayName: RAG corpus ingestion
  description: Incremental ingestion of Red Hat documentation and Confluence into PostgreSQL/pgvector
  createPipelineResource: true

# ADR-0204 part 2 + ADR-0105 (WP-22): the additional logical knowledge
# domains this chart can ingest for. The chart's existing top-level
# redhat[]/confluence[]/postgres/schedule blocks ARE knowledge.tech's
# configuration (kept top-level so the 500 lines of tech source entries
# and the WP-07-verified paths don't churn); each entry below adds one
# further domain with its own fetch stages, its own database (the
# deploy-side counterpart of platform/bindings/knowledge/bindings.yaml,
# same rule as gitops/charts/rag-service), its own source config and its
# own cadence. Every enabled entry renders: a per-domain config ConfigMap,
# per-domain ExternalSecrets, a per-domain Pipeline CR
# (rag-corpus-ingestion-<name>) and - when schedule.enabled - a schedule
# ConfigMap the Ansible role turns into a KFP recurring run.
#
# `sales` ships enabled: false: its database/Vault credentials only exist
# after the operator provisions them (WP-21 follow-up) and its source
# credentials are operator-supplied - flipping it on is that operator
# step, not a code change. Its batch-ingestion cadence is deferred to v0.7
# per ADR-0218; Comage's live Salesforce MCP-tool access is unaffected.
#
# ADR-0218 (2026-08-26): the `adv` domain entry was removed from this map.
# Aramis will never be provisioned as a service, so `fetch-aramis` and all
# its wiring are gone. knowledge.adv keeps its domain descriptor
# (knowledge/adv/domain.yaml) and its rag-adv database binding, but has no
# ingestion adapter of any kind - restoring one needs a new ADR.
domains:
  sales:
    enabled: false
    fetchStages: [fetch-salesforce]
    postgres:
      database: rag-sales
      schema: rag
      secretName: rag-postgres-sales
      externalSecret:
        remoteKey: "rag-sales/postgresql-app"
        usernameProperty: username
        passwordProperty: password
    salesforce:
      # Operator-supplied: instance URL + token at Vault zuno/salesforce/technical
      # ({instance_url, token}), consumed via the ExternalSecret below.
      secretName: rag-salesforce
      externalSecret:
        remoteKey: "salesforce/technical"
        instanceUrlProperty: instance_url
        tokenProperty: token
      # One entry per queried object; fields render in this order into the
      # indexed text. dealType/statusField feed ADR-0202's sales metadata
      # extensions. requiredGroups -> acl_groups, same as confluence[].
      sources:
        - enabled: true
          object: Opportunity
          fields: [Id, Name, StageName, Amount, CloseDate, LastModifiedDate]
          statusField: StageName
          dealType: pipeline
          requiredGroups: [sales]
    # ADR-0105: hours-scale for sales - every 4 hours by default,
    # environment-configurable.
    schedule:
      enabled: true
      cron: "0 0 */4 * * *"
      timezone: Europe/Paris
    # WP-24 / ADR-0109 / ADR-0205: mirrors knowledge/sales/domain.yaml's
    # freshness.operation_classes.semantic-read.max_staleness.
    staleAfter: 4h
  sxa-legacy:
    # ADR-0219: the company's pre-2021 commercial record, and the only SXA
    # domain. load-sxa-dump parses the schema.sql/data.sql pair straight
    # out of the bucket below - no database engine, no MCP tools. Content
    # is indexed exactly as it arrives; allowed_groups + C3 are the
    # safeguard.
    enabled: true
    fetchStages: [load-sxa-dump]
    postgres:
      database: rag-sxa-legacy
      schema: rag
      secretName: rag-postgres-sxa-legacy
      externalSecret:
        remoteKey: "rag-sxa-legacy/postgresql-app"
        usernameProperty: username
        passwordProperty: password
    sxaDump:
      # Operator-supplied keys in the reused sxa-corpus bucket below
      # (ADR-0025: the dump itself never lives in git) and an optional
      # explicit snapshot id. Split schema/data pair, not one combined
      # mysqldump - same shape as sxaCorpus below, since this is the same
      # underlying export.
      schemaS3Key: "sxa.schema.sql"
      dataS3Key: "sxa.data.sql"
      snapshotId: ""
      # 2026-08-23 amendment: reuses ADR-0217/WP-067's dedicated bucket
      # (zuno-demo-sxa-corpus) instead of a separate dedicated raw-dump
      # bucket - see ADR-0216's amendment. secretName stays distinct from
      # sxaCorpus's own (rag-sxa-corpus-s3) to avoid two ExternalSecrets
      # colliding on one name, but externalSecret.remoteKey points at the
      # SAME already-seeded Vault path, so no new Vault seeding is needed.
      s3:
        type: aws
        endpoint: ""
        bucket: "zuno-demo-sxa-corpus"
        region: "eu-west-2"
        pathStyle: false
        secretName: rag-sxa-s3
        externalSecret:
          remoteKey: "sxa-corpus/s3"
          accessKeyProperty: accessKeyId
          secretKeyProperty: secretAccessKey
    # ADR-0105: immutable legacy source - on-demand only, never scheduled.
    # Manual refresh: make d1 install rag-ingestion (see README).
    schedule:
      enabled: false
    # WP-24 / ADR-0109 / ADR-0205: mirrors knowledge/sxa-legacy/domain.yaml's
    # exempt_from_freshness_enforcement - never compute a stale_after for
    # this domain's chunks.
    staleAfter: none

# Runtime image is built imperatively by the day1-build Ansible role
# (ansible/roles/rag_ingestion_build, ansible/tasks/apply_openshift_build.yml)
# - the same mechanism as every other component's image (rag-service,
# mcp-gateway, agent-runtime, ai-gateway), not an ArgoCD-managed
# BuildConfig. Tag is always "latest": apply_openshift_build.yml hardcodes
# "<name>:latest" as its BuildConfig output, matching every other
# component.
images:
  ingestion:
    repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/rag-ingestion
    tag: latest
    # Always, not IfNotPresent - the mutable :latest tag needs it to avoid serving a stale cached image; see RELEASING.md.
    pullPolicy: Always
  # Unused by any template today - components/rag-ingestion/tooling holds
  # a separate KFP pipeline-compiler image source, not yet wired to a
  # BuildConfig/consumer. Left for a future compile-time step.
  compiler:
    repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/rag-pipeline-compiler
    tag: latest

resources:
  # Every stage below was live-verified (2026-08-26, WP-067 sxa
  # verification) to run with NO cpu/memory request or limit applied at
  # all - this block existed for four of the eight stages but nothing in
  # files/pipeline.py.tpl ever read it (dead config; see that file's
  # RESOURCES dict for where it's now actually wired). Sized at 3x the
  # memory / 2x the cpu of the original (still-conservative) numbers, and
  # extended to the four stages (chunk, validate, reconcileAcls,
  # detectChanges) that never had a requests/limits pair at all.
  fetch:
    requests: {cpu: "500m", memory: "1536Mi"}
    limits: {cpu: "4", memory: "6Gi"}
    # WP-57: both bound network/S3-latency-bound worker pools (thread
    # count higher than CPU count is fine and expected), not CPU-bound
    # work - separate from the cpu/memory requests above.
    # redhatConcurrency: fetch-redhat's per-source page-fetch pool
    # (FETCH_REDHAT_CONCURRENCY). sxaWriteConcurrency: load-sxa-dump's
    # per-row S3-write pool (FETCH_SXA_WRITE_CONCURRENCY).
    redhatConcurrency: 8
    sxaWriteConcurrency: 8
  normalize:
    requests: {cpu: "2", memory: "6Gi"}
    limits: {cpu: "8", memory: "24Gi"}
    # ADR-0219: normalize and chunk are one-to-two S3 round-trips per
    # document with pure-Python work in between - same latency-bound
    # rationale as resources.fetch's knobs. The SXA dump renders 314,428
    # documents, where serial execution took these stages hours each.
    concurrency: 16
  chunk:
    requests: {cpu: "500m", memory: "1536Mi"}
    limits: {cpu: "2", memory: "6Gi"}
    concurrency: 16
  embed:
    requests: {cpu: "2", memory: "6Gi"}
    limits: {cpu: "8", memory: "24Gi"}
    # ADR-0219: in-flight embedding REQUESTS, each already carrying
    # EMBEDDING_BATCH_SIZE chunks - this multiplies against the
    # predictor's own capacity, so it stays deliberately small. Raising
    # it past what embeddings-predictor can serve just queues.
    concurrency: 4
  index:
    requests: {cpu: "1", memory: "3Gi"}
    limits: {cpu: "4", memory: "12Gi"}
    # ADR-0219: bounds index-pgvector's S3 prefetch pool only - the
    # database writes themselves stay serial on one connection.
    readConcurrency: 16
  validate:
    requests: {cpu: "500m", memory: "1536Mi"}
    limits: {cpu: "2", memory: "6Gi"}
  reconcileAcls:
    requests: {cpu: "500m", memory: "1536Mi"}
    limits: {cpu: "2", memory: "6Gi"}
  detectChanges:
    requests: {cpu: "500m", memory: "1536Mi"}
    limits: {cpu: "2", memory: "6Gi"}
    # WP-58: bounds the per-document S3 GET pool that rebuilds
    # detect-changes' "current" state (DETECT_CHANGES_READ_CONCURRENCY) -
    # network/S3-latency-bound, same rationale as resources.fetch's
    # concurrency knobs above.
    readConcurrency: 16

networkPolicy:
  enabled: true
  egressCidrs: []

podSecurity:
  runAsNonRoot: true
  seccompProfile: RuntimeDefault
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  dropAllCapabilities: true
