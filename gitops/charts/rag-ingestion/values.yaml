# Shared Confluence Cloud authentication, reused by every confluence[]
# entry below via YAML anchor (one Atlassian site, one token secret for
# this demo) - Helm parses values.yaml as plain YAML before templating,
# so anchors/aliases work here same as anywhere else. Override an
# individual entry's authentication block if a source ever needs a
# different site/credential.
# remoteKey points at the same zuno/confluence/technical identity
# ansible/roles/vault/tasks/install.yml already seeds from
# ansible/confidential.yml (zuno_atlassian_confluence_*) - one Confluence
# credential total, not a separate rag-ingestion-only one. That path stores
# an `email` field (Confluence Cloud Basic auth is email+token), hence
# usernameProperty: email rather than a `username` field this path doesn't
# have.
confluenceAuthDefault: &confluenceAuthDefault
  type: api-token              # api-token | bearer-token
  secretName: rag-confluence
  externalSecret:
    remoteKey: "confluence/technical"
    tokenProperty: token
    usernameProperty: email

# Confluence Cloud sources - persona/skill-restricted. Each entry is
# filterable by Space (spaces:[]) and by page-tree path (directories:[]),
# and carries requiredGroups: the acl_groups values stamped onto every
# chunk ingested from it (document_embeddings.metadata.acl_groups,
# ADR-0046) - components/rag-service's existing query-time filtering
# (app/search.py's `?|` intersection against caller_groups) enforces
# access with no serving-side changes needed. One entry per
# (tech x skill-tier) combination, matching the 12
# confluence-{archi,build,run}-<tech> Keycloak groups 1:1
# (gitops/charts/keycloak/files/realm-zuno.json) - all 12 now live under
# /consultant (ADR-0340/WP-32 relocated the four confluence-archi-* groups
# out of /board; /board no longer carries any confluence-* subgroup).
# Real space keys/directories reflect a live enumeration of all 42 spaces
# on startxfr.atlassian.net (roadmap WP-07) - the content actually lives
# in space SXSI ("SXS Internal"), not SXS - see ADR-0330's correction note
# for the full story, including why the `directories` value below has no
# space-identifying segment:
#   - satellite -> space SXSI, page tree "Procédures/Technologie : Satellite"
#   - openshift -> space SXSI, page tree "Procédures/Technologie : Openshift"
#   - openshift-ai, keycloak -> disabled: no real source tree exists for
#     these technologies anywhere on the site. Re-enable with real values
#     when content exists; never invent keys.
# A real Build/Run phase sub-tree does exist further down (e.g. under
# Satellite: "S0B : Phase de Build Satellite" with Architecture/Build/Check
# children, "S0R : Phase de Run Satellite" with six Install/Maintain/
# Improve/Repare/Relocate/Destroy children), but
# it doesn't map cleanly 1:1 onto archi/build/run (S0B alone bundles
# Architecture+Build+Check together) and is deliberately NOT used to narrow
# `directories` per tier: a tech's three tier entries still share the one
# `Procédures/Technologie : <tech>` tree, differing only in requiredGroups,
# which is what stamps acl_groups (ADR-0046); tier separation stays an
# access-control property here, not a content-layout one. `directories`
# matches ordered ancestor-title subsequences (see rag_ingestion.py's
# _ancestor_path_matches).
confluence:
  - enabled: true
    name: satellite-archi
    # ADR-0202 canonical cross-source technology value (knowledge/tech/domain.yaml).
    technology: satellite
    type: cloud
    baseUrl: "https://startxfr.atlassian.net"
    spaces: ["SXSI"]
    directories: ["Procédures/Technologie : Satellite"]
    requiredGroups: ["confluence-archi-satellite"]
    includeAttachments: true
    preserveAcl: true
    excludeLabels: [obsolete]
    authentication: *confluenceAuthDefault
  - enabled: true
    name: satellite-build
    # ADR-0202 canonical cross-source technology value (knowledge/tech/domain.yaml).
    technology: satellite
    type: cloud
    baseUrl: "https://startxfr.atlassian.net"
    spaces: ["SXSI"]
    directories: ["Procédures/Technologie : Satellite"]
    requiredGroups: ["confluence-build-satellite"]
    includeAttachments: true
    preserveAcl: true
    excludeLabels: [obsolete]
    authentication: *confluenceAuthDefault
  - enabled: true
    name: satellite-run
    # ADR-0202 canonical cross-source technology value (knowledge/tech/domain.yaml).
    technology: satellite
    type: cloud
    baseUrl: "https://startxfr.atlassian.net"
    spaces: ["SXSI"]
    directories: ["Procédures/Technologie : Satellite"]
    requiredGroups: ["confluence-run-satellite"]
    includeAttachments: true
    preserveAcl: true
    excludeLabels: [obsolete]
    authentication: *confluenceAuthDefault
  - enabled: true
    name: openshift-archi
    # ADR-0202 canonical cross-source technology value (knowledge/tech/domain.yaml).
    technology: openshift
    type: cloud
    baseUrl: "https://startxfr.atlassian.net"
    spaces: ["SXSI"]
    directories: ["Procédures/Technologie : Openshift"]
    requiredGroups: ["confluence-archi-openshift"]
    includeAttachments: true
    preserveAcl: true
    excludeLabels: [obsolete]
    authentication: *confluenceAuthDefault
  - enabled: true
    name: openshift-build
    # ADR-0202 canonical cross-source technology value (knowledge/tech/domain.yaml).
    technology: openshift
    type: cloud
    baseUrl: "https://startxfr.atlassian.net"
    spaces: ["SXSI"]
    directories: ["Procédures/Technologie : Openshift"]
    requiredGroups: ["confluence-build-openshift"]
    includeAttachments: true
    preserveAcl: true
    excludeLabels: [obsolete]
    authentication: *confluenceAuthDefault
  - enabled: true
    name: openshift-run
    # ADR-0202 canonical cross-source technology value (knowledge/tech/domain.yaml).
    technology: openshift
    type: cloud
    baseUrl: "https://startxfr.atlassian.net"
    spaces: ["SXSI"]
    directories: ["Procédures/Technologie : Openshift"]
    requiredGroups: ["confluence-run-openshift"]
    includeAttachments: true
    preserveAcl: true
    excludeLabels: [obsolete]
    authentication: *confluenceAuthDefault
  - # Disabled 2026-08-18 (WP-07 operator decision, "map what exists"): no
    # real Confluence source tree exists for this technology anywhere on
    # startxfr.atlassian.net (SXSI carries Technologie : Satellite/Openshift/
    # Vault/Gitlab/AAP/Terraform - no OpenShift AI, no Keycloak). Re-enable
    # with real spaces/directories when such content exists; do not invent.
    enabled: false
    name: openshift-ai-archi
    # ADR-0202 canonical cross-source technology value (knowledge/tech/domain.yaml).
    technology: openshift-ai
    type: cloud
    baseUrl: "https://startxfr.atlassian.net"
    spaces: []
    directories: []
    requiredGroups: ["confluence-archi-openshift-ai"]
    includeAttachments: true
    preserveAcl: true
    excludeLabels: [obsolete]
    authentication: *confluenceAuthDefault
  - # Disabled 2026-08-18 (WP-07 operator decision, "map what exists"): no
    # real Confluence source tree exists for this technology anywhere on
    # startxfr.atlassian.net (SXSI carries Technologie : Satellite/Openshift/
