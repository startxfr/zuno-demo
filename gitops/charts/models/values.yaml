# Default values for the models chart. Overridden per-environment through
# gitops/apps/models/application-d1.yaml's spec.source.helm.values.

namespace: zuno-ai-run

# Substituted by ansible/tasks/apply_gitops_app.yml (same
# apps.mycluster.example.com placeholder pattern as gitops/apps/mcp) -
# feeds maas.externalOIDC's derived Keycloak issuer below.
clusterBaseDomain: apps.mycluster.example.com

# WP-086: keep the three GPU predictors off the same node when the cluster has
# more than one MIG node, so losing a node degrades inference instead of killing
# it outright. Every constraint it gates is
# `preferredDuringSchedulingIgnoredDuringExecution` - a hard one would leave a
# pod Pending during a node loss rather than packing it onto the survivor, which
# is the opposite of the goal. ADR-0351 decision 1 removed the *hard*
# full-GPU-era anti-affinity for exactly that reason; this soft form honours it.
# Set false to go back to packing everything onto one node (single-GPU-node
# clusters, or a deliberate consolidation) without editing templates.
spreadAcrossGpuNodes: true

# ADR-0545/WP-127: Kueue queueing priority for this chart's two lm-eval
# Jobs (lmevaljob.yaml, job-lmeval-cache-prefetch.yaml), reusing the
# existing scheduling.k8s.io PriorityClass hierarchy
# (gitops/charts/admin-context) rather than a new Kueue-native
# WorkloadPriorityClass CRD - Kueue already derives a Workload's
# spec.priority from the pod template's priorityClassName. Ships EMPTY on
# purpose, same convention and for the same reason as
# gitops/charts/trustyai-config's kueue.queueName: both target Jobs carry
# argocd.argoproj.io/sync-options: Replace=true,Force=true (a Job's
# spec.template is immutable), so ANY rendered-metadata change deletes and
# recreates them - job-lmeval-cache-prefetch.yaml's own comment documents
# measuring that pattern take a control-plane node from 85% image-filesystem
# usage to DiskPressure in 22 seconds (see memory
# diskpressure-master-cascades-into-mesh). An empty value renders no field
# at all, so this commit changes nothing live; flipping it is a deliberate,
# watched operator action (stage the two Jobs' recreation, do not sync both
# at once, watch node disk). Recommended value once flipped:
# zuno-workload-default (100) - above day2-stresstest's zuno-platform-weak
# (1), below platform-important/-critical.
kueue:
  priorityClassName: ""

# ADR-0537 (WP-106, Phase 1/2): RHOAI HardwareProfile CRs (
# infrastructure.opendatahub.io/v1), one per MIG tier already in use below,
# so the Dashboard shows a hardware profile for these models the same way
# it does for a manually-deployed one (e.g. granite-7b-redhat-lab) - that
# model's own crash traced to a Dashboard-assigned profile with NO
# Accelerator identifier, so it never requested a GPU at all. Referenced by
# name+namespace from Phase 2's annotations
# (opendatahub.io/hardware-profile-name/-namespace) on each model below.
#
# Correction, 2026-09-02 (live-verified): the CPU/Memory/Accelerator
# min/default/max counts ARE declarative Dashboard-only metadata (no live
# admission check enforces them against a pod's actual `resources`,
# confirmed via dry-run) - but the annotation referencing this profile is
# NOT purely declarative: a live RHOAI mutating path resolves
# `spec.scheduling.node.nodeSelector` below and injects it into the
# annotated model's pod template. Live-caught the hard way: annotating
# `embeddings` (previously no nodeSelector at all) produced a new pod
# template hash, a RollingUpdate surge pod, and a `zuno-ai-run-gpu-cap`
# quota rejection (this chart's 5 GPU models keep zero MIG headroom by
# design, WP-105's own documented trap). Keep the ranges below honest
# against each model's own `resources` block by convention regardless.
#
# `namespace` is deliberately `redhat-ods-applications`, NOT
# `.Values.namespace` (zuno-ai-run) - live-verified 2026-09-02: the
# Dashboard's Settings > Hardware profiles page is RBAC-scoped to that one
# namespace (`fetch-hardware-profiles-role`/`hardware-profile-role-binding`
# in `redhat-ods-applications`, granted to `system:authenticated`, with NO
# equivalent grant elsewhere) - a profile created in any other namespace is
# invisible to that page even though the mutating path above still honors
# it correctly cross-namespace. `default-profile` (the operator-seeded one
# granite uses) already lives there for the same reason.
hardwareProfiles:
  namespace: redhat-ods-applications
  mig1g24gb:
    name: mig-1g-24gb
    description: >-
      One NVIDIA MIG 1g.24gb slice, 1-8 CPUs and 4-20 GiB of memory. Sized
      for qwen35-9b, gpt-oss-20b and the qwen3-embedding-0.6b embedding
      model on zuno-ai-run's shared GPU nodes.
    acceleratorIdentifier: nvidia.com/mig-1g.24gb
    # 2 slices of this size exist per GPU node.
    acceleratorMaxCount: 2
    cpu: {min: 1, default: 2, max: 8}
    memory: {min: 4Gi, default: 8Gi, max: 20Gi}
  mig2g48gb:
    name: mig-2g-48gb
    description: >-
      One NVIDIA MIG 2g.48gb slice, 1-8 CPUs and 8-48 GiB of memory. Sized
      for qwen35-9b-wesh and qwen36-27b-instruct on zuno-ai-run's shared GPU
      nodes.
    acceleratorIdentifier: nvidia.com/mig-2g.48gb
    # Only 1 slice of this size exists per GPU node.
    acceleratorMaxCount: 1
    cpu: {min: 1, default: 2, max: 8}
    memory: {min: 8Gi, default: 16Gi, max: 48Gi}

# Scrapes each predictor's own vLLM /metrics endpoint (the vllm:* series -
# queue depth, TTFT, KV-cache usage, token throughput) for
# dashboard-ai-models.yaml (ADR-0413). Gates both
# templates/servicemonitor-vllm.yaml and the extra openshift-monitoring/UWM
# ingress rule templates/networkpolicy-embedding.yaml adds - without that
# rule the ServiceMonitor renders but the scrape is dead on arrival (that
# policy's existing allow-list is scoped to ai-gateway/rag-service only).
# ADR-0521 (WP-076): this now only covers the ONE remaining classic
# InferenceService this chart owns directly (embeddings) - qwen joined
# gpt-oss-20b as an LLMInferenceService, scraped independently by RHOAI's
# own LLMInferenceService controller, no ServiceMonitor entry from this
# chart needed for either.
metrics:
  enabled: true

# ADR-0523 (WP-082): OTel auto-instrumentation of the model workloads.
# Gates templates/instrumentation.yaml and the vLLM --otlp-traces-endpoint
# args below; the inject-sdk pod annotations reference the Instrumentation
# CR by name. The endpoint is the PLATFORM collector (zuno-monitoring),
# whose otlp/rhoai fan-out (WP-081) carries a copy to RHOAI's Tempo with
# the gateway auth an in-process SDK cannot do - deliberately NOT RHOAI's
# own data-science-collector: its Instrumentation CR names a nonexistent
# Service AND its Tempo-gateway export dials a port the gateway never
# exposes, both unfixable in place (operator-reverted, see
# gitops/charts/observability/templates/opentelemetrycollector.yaml and
# ADR-0523). Bonus: both Tempo stacks get the workload spans this way.
tracing:
  enabled: true
  exporterEndpoint: http://zuno-otel-collector-collector.zuno-monitoring.svc.cluster.local:4317

inferenceServiceName: qwen36-27b-instruct

# The HF repository id the original weights were published under - S3
# provenance only, no template reads this anymore (ADR-0521 removed the
# legacy HF-predownload Job that did). ADR-0518: Qwen3.6-27B in the
# official FP8 checkpoint (~28GB weights) - BF16 (~54GB) would not fit the
# 2g.48gb MIG slice. The arch is Qwen3_5ForConditionalGeneration (hybrid
# Gated-DeltaNet linear attention, NOT plain Qwen3 dense) - verified
# supported by the live rhaii-early-access vLLM image (0.21.0+rhaiv.10).
modelId: Qwen/Qwen3.6-27B-FP8
# The OpenAI-compatible API id vLLM serves (--served-model-name) - the
# platform-wide canonical model id every consumer routes by
# (platform/ai-gateway/provider-routing.yaml, ai-gateway's
# LOCAL_MODEL_NAME, policies/model-routing, policies/optimization).
# Serving under the HF id instead made every local chat completion 404
# ("The model `qwen2.5-7b-instruct` does not exist") - the two ids are
# different concerns.
servedModelName: qwen3.6-27b-instruct
# ADR-0546/WP-131: which bucket this model's weights are read from -
# "models" (the per-cluster bucket, unchanged) or "sources" (the shared
# cross-cluster bucket). One model at a time; see templates/_models-s3.tpl.
s3Source: sources
# ADR-0518: 32768 (was 8192 on the 7B model) - Qwen3.6-27B-FP8 leaves
# ~18GB of the 2g.48gb slice for KV after its ~28GB of weights, comfortable
# for this length at demo concurrency. If multi-agent load starts
# 503ing/preempting, lower this before touching anything else.
maxModelLen: 32768

image:
  # Fallback for `helm template`/standalone testing only; ansible always
  # overrides this at apply time with the image published by the installed
  # OpenShift AI catalog. Intentionally NOT mirrored by ansible/roles/
  # image_mirrors: the real deployed image is discovered live (ADR-0048),
  # so this static fallback is never what's actually running - mirroring it
  # wouldn't reduce real quay.io traffic. ADR-0521: now consumed only by
  # templates/servingruntime-embedding.yaml - the chat model's own
  # LLMInferenceService gets its image from llmInferenceService.baseRef
  # instead.
  vllm: quay.io/modh/vllm:rhoai-2.16-cuda
  pullPolicy: IfNotPresent

# ADR-0351: the chat model gets the permanent GPU node's single 2g.48gb
# MIG slice (48GB - double the L4 it originally ran on, so more KV-cache/
# context headroom), leaving the two 1g.24gb slices for embeddings and the
# MaaS backend. Requires ClusterPolicy mig.strategy=mixed (ansible/roles/
# nvidia_gpu) and the all-balanced partition on the node
# (gitops/charts/machines).
# ADR-0518: memory limit raised 32Gi -> 48Gi for Qwen3.6-27B-FP8: the
# weights alone are ~28GB and the safetensors load path stages them
# through host RAM, so a 32Gi ceiling leaves almost no margin over the
# raw payload. Preventive sizing, not an observed OOM; the g7e.4xlarge
# node (128GiB) has ample headroom over the three co-resident
# predictors' combined limits.
# Requests right-sized from measured load (2026-08-26): peak 1.00 core /
# 10.1GiB working set over a 24h window that includes the 11h47 MMLU
# LMEvalJob driving this predictor continuously - the previous 4 CPU /
# 24Gi reserved ~4x the observed ceiling and was the single biggest
# contributor to node A sitting at 88% cpu-requests with only two model
# pods on it, which is what left gpt-oss-20b unschedulable. Limits are
# deliberately NOT lowered: they cover the safetensors load spike, while
# requests only govern scheduling.
resources:
  requests:
    cpu: "2"
    memory: 16Gi
    nvidia.com/mig-2g.48gb: "1"
  limits:
    cpu: "8"
    memory: 48Gi
    nvidia.com/mig-2g.48gb: "1"

minReplicas: 1
maxReplicas: 1

# ADR-0521 (WP-076): qwen3.6-27b-instruct as an LLMInferenceService - same
# shape as gptOssModel.llmInferenceService below, factored out because this
# IS the top-level/default model's own config (see inferenceServiceName
# above), not a second named model.
llmInferenceService:
  # Same RHOAI 3.5 EA2 vLLM/CUDA preset gpt-oss-20b uses (`oc get
  # llminferenceserviceconfig -n redhat-ods-applications`) - confirmed live
  # to resolve to the exact same image digest the retired vllm-runtime
  # ServingRuntime pinned, so this migration is not an image change.
  baseRef: v3-5-0-ea-2-kserve-config-llm-template-nvidia-cuda
  # Same gpt-oss-20b routing constraint (see gptOssModel.llmInferenceService
  # below for the full "why not a dedicated gateway" history) - MaaS
  # mandates route adoption on maas-default-gateway itself.
  routerGateway:
    name: maas-default-gateway
    namespace: openshift-ingress
    manage: false
  # ADR-0201/WP-27: the controller-generated scheduler (EPP) pod's Istio
  # sidecar resets every ext_proc TLS handshake from maas-default-gateway
  # on port 9002 unless excluded from interception - same fix gpt-oss-20b
  # needed, see gptOssModel.llmInferenceService.schedulerAnnotations.
  schedulerAnnotations:
    traffic.sidecar.istio.io/excludeInboundPorts: "9002"
  # ADR-0521 (WP-076), 2026-08-25/26: the cluster-wide istio-proxy sidecar
  # injection default (256Mi limit / 64Mi request - not set by this chart,
  # confirmed identical on every pod in this namespace) is too tight for
  # this workload's own sidecar specifically. Live 6h Thanos data
  # (max_over_time(container_memory_working_set_bytes{container=
  # "istio-proxy"}[6h])) showed qwen's sidecar peaking 151-183Mi - the
  # clear outlier across ~40 pods in zuno-ai-run, which otherwise peak
  # 90-145Mi - and it was repeatedly OOMKilled (exit 137) during Envoy's
  # cold-start xDS-config processing right after WP-076 step 2 added a
  # second model's worth of MaaS AuthPolicy/TokenRateLimitPolicy/
  # HTTPRoute for it to load. An OOMKilled istio-proxy takes the whole
  # pod's networking down with it (its iptables redirect rules survive
  # the crash but Envoy isn't there to proxy through them), which is what
  # actually broke storage-initializer's S3 downloads, not an S3/network
  # problem itself.
  # Scoped to this workload via Istio's own sidecar.istio.io/proxy* pod
  # annotations rather than a mesh-wide default change (every other
  # pod's peak stays comfortably under 256Mi) - verified live that
  # spec.annotations here propagates through KServe's controller to the
  # generated Deployment's pod template, which the Istio injector then
  # reads at pod admission. New limit (512Mi) is ~2.8x the highest
  # observed peak; new request (160Mi) sits just above the observed
  # steady floor. CPU annotations are set explicitly alongside memory
  # despite being unchanged from the 500m/50m default - confirmed live
  # that supplying only the memory annotations drops the cpu key from
  # the resulting resources block entirely (no cluster LimitRange exists
  # in this namespace to backfill it), leaving the container's CPU
  # genuinely unbounded rather than falling back to the injector's usual
  # default - low-risk given real usage is 1-4m cores, but not a change
  # to make silently.
  podAnnotations:
    sidecar.istio.io/proxyMemory: "160Mi"
    sidecar.istio.io/proxyMemoryLimit: "512Mi"
    sidecar.istio.io/proxyCPU: "50m"
    sidecar.istio.io/proxyCPULimit: "500m"
    # ADR-0523 (WP-082): env-only OTel injection (endpoint/resource/
    # sampler env vars, no code) from templates/instrumentation.yaml's CR.
    # inject-sdk, NOT inject-python: this vLLM image ships its own newer
    # opentelemetry-sdk (1.43.0, verified in the running pod) and a
    # sitecustomize carrying the operator's older SDK is an avoidable
    # risk on a GPU pod. Tracing itself is activated by the
    # --otlp-traces-endpoint arg in the template, deliberately not read
    # from this injected env (the webhook's failurePolicy is Ignore, so
    # injection may silently skip; startup must not depend on it).
    instrumentation.opentelemetry.io/inject-sdk: "zuno-models-instrumentation"
    instrumentation.opentelemetry.io/container-names: "main"

# ADR-0301 (WP-34 Part B): vLLM native multi-LoRA, additive to the same
# ServingRuntime/InferenceService above - NOT a second deployment per
# adapter (point 1). Adapter selection is static here (point 2); which
# adapter a request actually uses is ADR-0303/WP-39's scope, not this
# one's. Default empty - no adapter attaches unless explicitly listed.
# Each entry:
#   name               - the vLLM --lora-modules module name (also what a
#                         future ADR-0303 request would reference).
#   registryModelName / registryModelVersion - the OpenShift AI Model
#                         Registry name/version this adapter was
#                         registered under (components/mlops's
#                         push-registry stage, ADR-0302 point 6) - never
#                         an unversioned/untracked location (point 3).
#   sourceS3Uri        - WP-133: the exact artifact_uri push-registry's
#                         registration.json recorded for this version -
#                         copy it verbatim from there, never a hand-typed
#                         S3 location, so this stays traceable to the
#                         registry entry above rather than becoming a
#                         second, driftable source of truth. One
#                         initContainer per loraAdapters entry
#                         (templates/llminferenceservice-qwen35.yaml)
#                         downloads this prefix to `path` below before
#                         vLLM starts - components/mlops/src/
#                         download_adapter.py, reusing the same S3
#                         credential this model's own base-weights
#                         download already mounts.
#   path               - where vLLM reads the adapter FROM on this pod's
#                         filesystem, and where the initContainer above
#                         writes it to. MUST be under /mnt/loras - that is
#                         the one emptyDir shared between every
#                         download-adapter initContainer and the main
#                         container (templates/llminferenceservice-
#                         qwen35.yaml); a path outside it lands only in
#                         the initContainer's own ephemeral layer and
#                         vLLM will never see it. Live-verification of the
#                         whole download-then-serve path is WP-133's own
#                         operator follow-up - nothing has attached an
#                         adapter on a real cluster yet.
#   classification     - C1/C2/C3 (ADR-0301 point 4/ADR-0034): inherited
#                         from the adapter's own training dataset
#                         (components/mlops's train_manifest.json). Gated
#                         below and in values.schema.json - a C2/C3
#                         adapter cannot attach to a serving path with
#                         maas.enabled (externally-eligible).
# WP-133 (2026-09-04): tekos-lora (Model Registry version
# wp126-20260904-161639) was promoted here and loaded live, but vLLM
# crashed activating it - AttributeError: 'NoneType' object has no
# attribute 'shape' in vllm/lora/layers/column_parallel_linear.py's
# expand_packed_lora, loading the adapter's linear_attn.in_proj_qkv (a
# FUSED/packed QKV module unique to this hybrid-attention architecture)
# whose packing convention this vLLM build's LoRA support does not
# recognize. Reverted to [] to stop qwen35-9b's crash loop and restore
# serving while a new adapter was trained with loraTargetModules
# restricted to the plain (non-packed) self_attn.{q,k,v,o}_proj modules
# only (gitops/charts/mlops/values.yaml's tekos entry) - see that value's
# own comment for the detail. That retrain (wp126-20260904-201830)
# succeeded end to end and registered a genuine adapter-only artifact
# (s3://zuno-demo222-mlops/mlops/models/tekos/wp126-20260904-201830/adapter)
# - promoting it here to verify it actually attaches in vLLM this time.
loraAdapters:
  - name: tekos-lora
    registryModelName: tekos-lora
    registryModelVersion: wp126-20260904-201830
    sourceS3Uri: s3://zuno-demo222-mlops/mlops/models/tekos/wp126-20260904-201830/adapter
    path: /mnt/loras/tekos-lora
    classification: C1

# WP-133: the image the adapter-download initContainer runs
# (components/mlops/src/download_adapter.py). Reuses the mlops pipeline's
# own image rather than introducing a second one solely for this - it
# already ships boto3 and the same S3-download logic (ArtifactStore.
# download_prefix), and is built by the same ansible/roles/mlops_build
# this chart has no reason to duplicate. Only rendered when loraAdapters
# is non-empty.
loraAdapterDownload:
  image: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/mlops:latest

# ADR-0521: the legacy HF-predownload PVC/Job mode (pvc-model.yaml,
# job-model-download.yaml) was qwen-only and is removed along with the
# classic InferenceService it backed - the chat model is S3-only now, same
# as gpt-oss-20b (templates/llminferenceservice-qwen.yaml). What's left of
# this block is shared with paths that never depended on that toggle:
# storageClassName/initializerImage are also read by
# templates/pvc-lmeval-cache.yaml and templates/job-lmeval-cache-prefetch.yaml
# for the (unrelated) lm-eval tokenizer cache.
modelStorage:
  # PLACEHOLDER (WP-118 B5). The real class is discovered at apply time by
  # ansible/tasks/resolve_cluster_default_storage_class.yml - the one
  # annotated storageclass.kubernetes.io/is-default-class - and injected as
  # an Application-level value by this component's role, which always
  # overrides this. Nothing here renders on a cluster installed via `make`.
  # Left as an obviously-invalid name on purpose: if the Application ever
  # lost its values, a PVC that cannot bind is a loud failure, where a
  # plausible-looking class name would silently bind to the wrong storage.
  # PVC storageClassName is immutable once bound, so wrong is unrecoverable
  # by re-sync.
  storageClassName: mycluster-default-storageclass
  # Pinned to the odh-kserve-storage-initializer image this cluster's own
  # KServe controller generates for hf:// init containers (read off a live
  # generated pod spec) - unlike image.vllm (ADR-0048), this is not (yet)
  # discovered at deploy time. Mirrored through the zuno-ai-build
  # ImageStream (ansible/roles/image_mirrors, tag "rhel9",
  # importPolicy.scheduled: false so the mirror stays pinned to this exact
  # digest).
  initializerImage: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/odh-kserve-storage-initializer-rhel9:rhel9

# Where model weights live in S3 (ansible: zuno_models_s3_bucket /
# zuno_models_s3_prefix). Single source for every s3:// model reference in
# this chart: the classic predictor's storageUri when
# modelStorage.downloadJob.enabled is false, and the MaaS
# LLMInferenceService's model.uri + credential annotations (maas.yaml).
# Same bucket/credential (Vault "rag/s3") as rag-ingestion's corpus
# (gitops/charts/rag-ingestion/values.yaml's s3: block) - the models/
# prefix keeps weights and corpus objects apart. Layout is
# <prefix>/<servedModelName>/: models/qwen3.6-27b-instruct/ and
# models/qwen3-embedding-0.6b/ (ADR-0518, streamed HF->S3
# out-of-cluster - in-cluster hf:// downloads hang unreliably here, see
# maas.yaml), models/qwen3.5-9b/ (mlops LoRA training base, ADR-0518 -
# not served by this chart), models/gpt-oss-20b/ (served by gptOssModel
# below since ADR-0412), models/gpt-oss-120b/ (NOT servable on this
# cluster's GPUs - transit storage for the operator's own workstation
# only), and models/qwen2.5-7b-instruct/ (retired by ADR-0518, kept as
# instant rollback weights).
modelsS3:
  bucket: zuno-demo-rag-corpus
  prefix: models
  endpoint: s3.eu-west-2.amazonaws.com
  region: eu-west-2
  # Where the read credential lives in Vault (via the vault-backend
  # ClusterSecretStore) - consumed by both s3-serving-credentials.yaml
  # (classic predictor) and maas.yaml's ExternalSecret.
  externalSecret:
    remoteKey: rag/s3
    accessKeyProperty: accessKeyId
    secretKeyProperty: secretAccessKey

# ADR-0546/WP-131: the shared cross-cluster source bucket. Model weights are an
# INPUT that seeds any cluster, so they belong here rather than in a per-cluster
# bucket - but they move one model at a time, selected by each model's s3Source
# below, never by flipping modelsS3.bucket (which would move all five at once).
# Same credential: the Vault rag/s3 identity carries a zuno* wildcard, so no new
# Secret is needed. Same region and endpoint as modelsS3 on purpose - the shared
# KServe serving credential carries only one endpoint/region annotation pair,
# and templates/_models-s3.tpl refuses to render a model pointed at a source
# that disagrees.
sourcesS3:
  bucket: zuno-demo-sources
  prefix: models
  endpoint: s3.eu-west-2.amazonaws.com
  region: eu-west-2

# Additive second model: text embeddings for rag-ingestion (see
# gitops/charts/rag-ingestion's embedding.endpoint/dimensions) and
# rag-service's query-side embedding calls. inferenceServiceName is
# "embeddings", not "embeddings-predictor": KServe RawDeployment appends
# "-predictor" to a classic InferenceService's own name to build its
# Service name (this is still the last classic InferenceService this
# chart owns - qwen joined gpt-oss-20b as an LLMInferenceService under
# ADR-0521, which names its Service <name>-kserve-workload-svc instead),
# and gitops/charts/rag-service/values.yaml's embeddingServiceUrl /
# components/rag-service/app/config.py's EMBEDDING_SERVICE_URL default
# already hardcode http://embeddings-predictor.zuno-ai-run.svc:8080 -
# this closes that previously-dangling reference rather than inventing a
# third, inconsistent embedding endpoint. Kept as its own
# servingRuntime/inferenceService pair rather than folding into a
# models: [] list, since only these two models exist and a list-based
# rewrite would be a breaking change to every consumer of this chart's
# flat values shape for no benefit at this scale.
embeddingModel:
  servingRuntimeName: vllm-embedding-runtime
  # Kept as "embeddings" across the ADR-0518 model swap on purpose: the
  # generated Service name embeddings-predictor.zuno-ai-run.svc is
  # hardcoded by rag-service/rag-ingestion consumers - a neutral name
  # means swapping the model never renames the endpoint.
  inferenceServiceName: embeddings
  # Same modelId (HF download) / servedModelName (API id) split as the
  # chat model above - rag-service's EMBEDDING_MODEL_NAME expects the
  # short canonical id.
  servedModelName: qwen3-embedding-0.6b
  # ADR-0546/WP-131: which bucket this model's weights are read from -
  # "models" (the per-cluster bucket, unchanged) or "sources" (the shared
  # cross-cluster bucket). One model at a time; see templates/_models-s3.tpl.
  # Flipped 2026-09-05: verified byte-identical to modelsS3 first (226
  # objects, same sizes, empty aws s3 sync --dryrun).
  s3Source: sources
  # WP-131: RollingUpdate's default maxSurge tries to schedule a second GPU
  # pod before killing the first, which cannot succeed under a saturated
  # GPU quota (zuno-ai-run-gpu-cap) - Recreate kills the old pod first,
  # trading a brief outage for a rollout that actually completes instead of
  # hanging on Pending forever. Only settable here: LLMInferenceService's
  # CRD (the other 4 models) has no equivalent field.
  deploymentStrategy: Recreate
  # ADR-0518: Qwen/Qwen3-Embedding-0.6B, 1024-dim, replaces
  # BAAI/bge-small-en-v1.5 (384-dim, English-only) - the live corpus is
  # French Confluence content, so an MTEB-multilingual-topping model is
  # a correctness fix, not a nicety. Any dimension change here MUST land
  # together with the matching pgvector column migration
  # (gitops/charts/rag-service/files/sql) and a full re-ingestion: old
  # vectors are unreadable in the new space. Served via vLLM's pooling
  # runner (--runner=pooling --convert=embed), not chat.
  modelId: Qwen/Qwen3-Embedding-0.6B
  dimensions: 1024
  # GPU request: the discovered/pinned image.vllm is a CUDA-only vLLM
  # build (ADR-0048 prefers the "cuda"-named template), which crashes
  # with "Failed to infer device type" when scheduled without a GPU -
  # verified on-cluster. Qwen3-Embedding-0.6B (~1.2GB BF16) is still far
  # below the slice, so this shares the chat model's GPU node rather
  # than needing its own.
  # memory: vLLM's torch.compile + CUDA-graph-capture fixed overhead
  # OOMKilled the container at a 2Gi limit back on the (10x smaller)
  # bge model (verified on-cluster, exit 137); ADR-0518 adds ~1.2GB of
  # weights staged through host RAM on top, hence 3Gi/6Gi.
  # ADR-0351: a 1g.24gb MIG slice - same 24GB a whole L4 gave the
  # embedding model before, now co-resident on the shared permanent GPU
  # node.
  # Right-sized UP from measured load (2026-08-26), unlike the two chat
  # models: peak 0.62 core / 5.57GiB working set over 24h. The 6Gi limit
  # sat only 7% above that observed ceiling - one ingestion burst away
  # from repeating the exit-137 documented just above - and the 3Gi
  # request understated the steady state by ~2x, so the scheduler was
  # placing this pod on false premises. 6Gi/8Gi restores real margin.
  resources:
    requests:
      cpu: "750m"
      memory: 6Gi
      nvidia.com/mig-1g.24gb: "1"
    limits:
      cpu: "2"
      memory: 8Gi
      nvidia.com/mig-1g.24gb: "1"
  minReplicas: 1
  maxReplicas: 1
  # ADR-0523 (WP-082): same env-only OTel injection as the two
  # LLMInferenceServices, but through the classic InferenceService's
  # spec.predictor.annotations instead (this is the one propagation path
  # not yet live-proven - WP-082's checklist covers it). Annotation only,
  # no --otlp-traces-endpoint arg yet: the flag exists on this build
  # (--help=all, verified live) but vLLM's span coverage of pooling/embed
  # requests is unverified, and mesh-level spans (WP-081) already cover
  # this endpoint. Container name differs: KServe classic names the
  # serving container kserve-container, not main.
  podAnnotations:
    instrumentation.opentelemetry.io/inject-sdk: "zuno-models-instrumentation"
    instrumentation.opentelemetry.io/container-names: "kserve-container"

# ADR-0414 (supersedes ADR-0412): gpt-oss-20b as an LLMInferenceService,
# not a classic InferenceService+ServingRuntime pair anymore.
# templates/llminferenceservice-gptoss.yaml replaces the old
# inferenceservice-gptoss.yaml/servingruntime-gptoss.yaml (removed).
# Forced by MaaSModelRef.spec.modelRef.kind's hard enum
# (LLMInferenceService | ExternalModel only - confirmed via `oc explain
# maasmodelref.spec.modelRef.kind`): to fold the old dedicated
# qwen25-7b-instruct-maas-backend copy into this model (one deployment,
# two access paths, freeing a whole slice), gpt-oss-20b itself must be an
# LLMInferenceService. ai-gateway's own local routing (platform/ai-gateway/
# provider-routing.yaml) now points directly at this LLMInferenceService's
# plain -kserve-workload-svc Service (port 8000, confirmed live against
# the qwen-maas-backend equivalent - a real OpenAI-compatible vLLM API,
# not an internal-only port) rather than a classic predictor Service;
# MaaS clients keep reaching it through maas.yaml's Gateway/router config,
# same as before.
# GPU: mig-1g.24gb, not a full nvidia.com/gpu - gpt-oss-20b's real
# footprint (13.8GB MXFP4 weights, ~16-24GB VRAM at runtime per public
# specs) fits the slice with headroom; ADR-0412's full-GPU-node exception
# and its gpuQuota override are both retired by this change (see
# gitops/charts/namespaces/values.yaml).
gptOssModel:
  inferenceServiceName: gpt-oss-20b
  # Same modelId-vs-API-id split as the chat model; also the S3 directory
  # name under modelsS3 (<prefix>/<servedModelName>/).
  servedModelName: gpt-oss-20b
  # ADR-0546/WP-131: which bucket this model's weights are read from -
  # "models" (the per-cluster bucket, unchanged) or "sources" (the shared
  # cross-cluster bucket). One model at a time; see templates/_models-s3.tpl.
  # Flipped 2026-09-05: verified byte-identical to modelsS3 first (226
  # objects, same sizes, empty aws s3 sync --dryrun).
  s3Source: sources
  # 131k native; capped well below to bound KV growth while still giving
  # reasoning tasks far more room than the qwen chat model's 8192.
  maxModelLen: 32768
  llmInferenceService:
    # ADR-0201/WP-27: which Gateway KServe's own router publishes its
    # HTTPRoute on. This is load-bearing and the history is expensive, so it
    # is recorded here in full.
    #
    # THE PROBLEM. maas-api, the MaaSAuthPolicy's OPA map and the generated
    # TokenRateLimitPolicy all key the model on zuno-ai-run/gpt-oss-20b-maas
    # (<modelRef namespace>/<modelRef name>). The data path speaks KServe's
    # publishers/zuno-ai-run/models/gpt-oss-20b. Sending the MaaS form 404s,
    # sending the publisher form 403s "no matching subscription found for
    # user" - mutually exclusive. Proven by calling maas-api's own
    # /internal/v1/subscriptions/select with each candidate: only the MaaS
    # form returns a subscription, so the entitlement plane was never broken.
    #
    # THE CAUSE. Pointing this at maas-default-gateway makes KServe own the
    # HTTPRoute there, so the MaaSModelRef ADOPTS that route rather than
    # publishing its own (status.httpRouteName confirms it) and inherits
    # KServe's identity form.
    #
    # TWO FIXES TRIED AND REVERTED - do not retry either:
    #   1. A second HTTPRoute keyed on the MaaS identity. It routed and auth
    #      passed, but 429'd on everything: the controller generates a
    #      subscription's TRLP only for the ADOPTED route, and
    #      MaaSModelRef.spec has no field to redirect it, so a hand-authored
    #      route is governed solely by the gateway-level deny-all
    #      (gateway-default-deny, limit 0/1m).
    #   2. Removing the ref entirely. KServe does not yield publication - it
    #      falls back to a cluster-default openshift-ingress/
    #      openshift-ai-inference which does not exist here, taking the
    #      LLMInferenceService to Ready=False and the MaaSModelRef to
    #      Unhealthy. Serving stayed up (ai-gateway dials the workload
    #      Service directly) but the model was no longer Ready.
    #
    # THE FIX. Give KServe a Gateway of its own that carries no real traffic
    # (templates/model-gateway.yaml), leaving maas-default-gateway free so
    # the MaaS controller - which does hold create/update RBAC on httproutes
    # - publishes its own route with its own identity and its own generated
    # TRLP.
    #
    # ROLLBACK: set name back to maas-default-gateway and manage: false.
    # 2026-08-25: TESTED zuno-model-gateway ON THE LIVE CLUSTER AND REVERTED.
    # MaaS does not publish its own route under any circumstances - it
    # REQUIRES the backend's route to be on its own gateway, and says so
    # explicitly when it is not:
    #   Failed to reconcile HTTPRoute: HTTPRoute
    #   zuno-ai-run/gpt-oss-20b-kserve-route does not reference gateway
    #   (expected: openshift-ingress/maas-default-gateway, found:
    #   openshift-ingress/zuno-model-gateway). The LLMInferenceService must
    #   be configured to use openshift-ingress/maas-default-gateway
    # MaaSModelRef went phase=Failed / ReconcileFailed. (The LLMInferenceService
    # itself stayed Ready=True, so the controller's create/update RBAC on
    # httproutes is used to patch the ADOPTED route, not to publish one.)
    #
    # That closes the question: adoption is mandatory, so the served identity
    # is always KServe's publishers/... form and nothing in this repository
    # can make it the zuno-ai-run/gpt-oss-20b-maas form the MaaS policy plane
    # keys on. The mismatch is an RHOAI-side constraint, not our
    # configuration. See ADR-0201's 2026-08-25 notes for all three attempts.
    routerGateway:
      name: maas-default-gateway
      namespace: openshift-ingress
      # Whether this chart renders the Gateway itself. false here:
      # maas-default-gateway is owned by gitops/charts/openshift-ai.
      manage: false
    # Same RHOAI 3.5 EA2 vLLM/CUDA preset the qwen MaaS backend used
    # (`oc get llminferenceserviceconfig -n redhat-ods-applications`) -
    # generic serving image, not qwen-specific.
    baseRef: v3-5-0-ea-2-kserve-config-llm-template-nvidia-cuda
    # templates/s3-serving-credentials-gptoss.yaml's existing SA/Secret
    # pair (unchanged by this ADR - already the right serving.kserve.io/
    # s3-* annotated shape LLMInferenceService's storage-initializer
    # expects, same convention maas.yaml used for its own now-removed
    # qwen-specific credentials).
    serviceAccountName: gpt-oss-20b-s3
    # ADR-0201/WP-27, 2026-08-23: the controller-generated scheduler (EPP)
    # pod terminates its own TLS on port 9002 (KServe's cert-path flag),
    # but its Istio sidecar's default inbound filter chains for that port
    # only accept mesh-mTLS (Istio-flavored ALPN) or plaintext - neither
    # matches the plain external TLS the auto-generated DestinationRule
    # (mode: SIMPLE) sends, so every ext_proc call from maas-default-gateway
    # resets mid-handshake (root-caused via live Envoy config dumps on both
    # ends, see ADR-0201's dated note). Excluding the port from sidecar
    # interception lets the plain TLS reach the app's own listener directly,
    # matching Istio's documented pattern for workloads doing self-managed
    # TLS on a specific port. Applied via spec.router.scheduler.annotations,
    # a resource we own (no RHOAI ownerReference) - unlike the
    # DestinationRule/sidecar defaults themselves.
    schedulerAnnotations:
      traffic.sidecar.istio.io/excludeInboundPorts: "9002"
    # ADR-0521 (WP-076), 2026-08-25/26: same fix as (and applied
    # preventively alongside) qwenModel's own llmInferenceService.
    # podAnnotations above - qwen's istio-proxy was repeatedly OOMKilled
    # on the cluster-wide 256Mi sidecar default (live Thanos data:
    # cold-start peaks of 151-183Mi against 90-145Mi for the rest of the
    # namespace). gpt-oss-20b's own sidecar hasn't OOMed, but was already
    # the second-highest peak in the same 6h window (131-145Mi, trending
    # up alongside qwen's as WP-076 grew the mesh's MaaS policy surface) -
    # same root cause exposure, just not yet over the line. Not live
    # crash-tested on this specific workload (nothing to reproduce), but
    # the propagation mechanism (spec.annotations -> generated Deployment
    # pod template -> Istio injector) is proven identical via qwen's own
    # live verification.
    podAnnotations:
      sidecar.istio.io/proxyMemory: "160Mi"
      sidecar.istio.io/proxyMemoryLimit: "512Mi"
      sidecar.istio.io/proxyCPU: "50m"
      sidecar.istio.io/proxyCPULimit: "500m"
      # ADR-0523 (WP-082): same env-only OTel injection as qwenModel's
      # llmInferenceService.podAnnotations above - see that comment for
      # the inject-sdk-not-inject-python rationale.
      instrumentation.opentelemetry.io/inject-sdk: "zuno-models-instrumentation"
      instrumentation.opentelemetry.io/container-names: "main"
  # cpu/memory sized like the old qwen-maas-backend's own mig-1g.24gb
  # workload (proven to fit alongside the other Card A co-resident
  # predictors on the g7e.4xlarge managed node), not the old workergpu
  # node's headroom - that node and its sizing rationale no longer apply.
  # Requests right-sized from measured load (2026-08-26): peak 0.97 core /
  # 4.0GiB working set over 24h, measured across this model's prior
  # revisions. The 4 CPU request is precisely what made this pod
  # unschedulable ("Insufficient cpu") on the only node advertising a
  # mig-1g.24gb slice, while that slice sat idle at 64MiB - the pod was
  # blocked on CPU, never on GPU. Limits unchanged.
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
      nvidia.com/mig-1g.24gb: "1"
    limits:
      cpu: "8"
      memory: 20Gi
      nvidia.com/mig-1g.24gb: "1"
  minReplicas: 1
  maxReplicas: 1
  # ADR-0542/WP-121: the ONLY model carrying spec.scaling, and the only
  # one that could ever carry it today.
  #
  # min == max == 1 is deliberate, not a placeholder. It makes the KServe
  # controller create its autoscaling object (VariantAutoscaling +
  # ScaledObject) - which is the point: the workload-variant-autoscaler
  # has never had one, and ADR-0318's KEDA install has had zero
  # ScaledObjects since it landed. With min == max nothing can actually
  # scale, so the object exists without any exposure to the quota below.
  #
  # Raising maxReplicas is NOT a values edit. ResourceQuota
  # zuno-ai-run-gpu-cap is saturated (requests.nvidia.com/mig-1g.24gb 3/3,
  # mig-2g.48gb 2/2), so no model in this namespace can reach two replicas
  # at all. Going to 2 means first raising that quota 3 -> 4, which spends
  # the last physically free 24GB slice on the cluster and leaves ZERO
  # rolling-update surge headroom - after which every 24GB-model rollout
  # hits ProgressDeadlineExceeded unless surge is handled explicitly
  # (ADR-0201's documented "Rollout hazard"). That is a separate,
  # separately-approved change.
  #
  # NOT authored as a raw llmd.ai/VariantAutoscaling: the API server
  # returns "VariantAutoscaling is deprecated and will be removed in a
  # future release. Migrate to the annotation-based path" on every read.
  # spec.scaling is the supported surface that creates it.
  scaling:
    enabled: true
    # NOT optional and NOT empty-able: the CRD's CEL requires wva to be
    # present AND to carry exactly one of hpa/keda. `wva: {}` renders to
    # nothing and the API server rejects the CR - live-caught 2026-09-03,
    # after helm template had happily rendered it. keda because ADR-0318's
    # KEDA install has had zero ScaledObjects since it landed; no tuning
    # keys, which stay meaningless while min == max.
    wva:
      keda: {}

# ADR-0526 (WP-087): the French urban-register variant, and the SAME
# unmodified base it was fine-tuned from, served side by side.
#
# Both are ordinary standalone checkpoints served as their own
# LLMInferenceService (ADR-0526 decision 4). That decision deliberately
# REVERSES the rejection ADR-0301's "Alternatives considered" recorded
# against "a second InferenceService per adapter". That rejection was
# right for its own premise - many adapters over one base, where an extra
# deployment buys nothing. Here the extra deployment IS the requirement:
# a distinct routable model id, and node-level isolation from the base,
# so the two serve concurrently and are directly comparable. vLLM's
# --lora-modules gives neither (it exposes the adapter from the base's own
# process). loraAdapters above therefore stays [], and neither model sets
# serves_adapters in platform/ai-gateway/provider-routing.yaml.
#
# PLACEMENT. Nothing here pins a node - the two permanent MIG nodes
# advertise 2x mig-1g.24gb + 1x mig-2g.48gb each, and with
# qwen36-27b-instruct holding the 2g.48gb on ip-10-18-15-25 and
# gpt-oss-20b + embeddings holding two 1g.24gb slices on ip-10-18-67-65,
# SLICE AVAILABILITY alone puts the variant on ip-10-18-67-65's free
# 2g.48gb and the base on ip-10-18-15-25's free 1g.24gb. WP-092/ADR-0414
# adds a second spreadAcrossGpuNodes term to each of this pair's templates
# that names the other model directly (app.kubernetes.io/name), so the
# separation is now an expressed preference and not just a side effect of
# which slice happened to be free - see llminferenceservice-qwen35.yaml /
# llminferenceservice-wesh.yaml. The generic term (any GPU workload) stays
# preferred; the pair-specific term was PROMOTED to `required` by
# WP-105/ADR-0536 (amendment to ADR-0526 decision 5) after a live drift was
# found 2026-08-30: both pods were recreated within the same ~40s window
# during a routine restart and the scheduler colocated them anyway - the
# soft term was satisfiable but scoring still chose to violate it. This
# pair specifically needs a hard separation guarantee for WP-105's
# node-failover drill; ADR-0351 decision 1/WP-086's general "pack onto a
# survivor over leaving a pod Pending" preference still governs every
# other model on this platform, including the generic term above.
#
# QUOTA. These two consume the LAST free slices: zuno-ai-run's GPU
# ResourceQuota goes to 3/3 on mig-1g.24gb and 2/2 on mig-2g.48gb. It does
# NOT need raising, but it becomes exactly saturated - the next GPU
# workload needs a quota change plus capacity, or an existing model
# retired. ADR-0526's Consequences also records what this gives up:
# ADR-0351 decision 5's "either node alone holds all three model
# workloads" survivability property no longer holds at five workloads
# across six slices. Accepted, not overlooked.
weshModel:
  inferenceServiceName: qwen35-9b-wesh
  # ADR-0518 decision 1's naming split, applied unchanged: dots are
  # stripped from the Kubernetes object name, NEVER from the served model
  # id. This is also the S3 directory name under modelsS3
  # (<prefix>/<servedModelName>/) - the exact prefix components/mlops's
  # merge-export stage uploads the merged bf16 checkpoint to.
  servedModelName: qwen3.5-9b-wesh
  # ADR-0546/WP-131: which bucket this model's weights are read from -
  # "models" (the per-cluster bucket, unchanged) or "sources" (the shared
  # cross-cluster bucket). One model at a time; see templates/_models-s3.tpl.
  # Flipped 2026-09-05: verified byte-identical to modelsS3 first (226
  # objects, same sizes, empty aws s3 sync --dryrun).
  s3Source: sources
  # The variant carries all of Comage's traffic and sits in the larger
  # 48GB slice, so it keeps the same 32768 the other 48GB model uses.
  maxModelLen: 32768
  llmInferenceService:
    # Same Gateway as every other model here - see gptOssModel's own
    # routerGateway block for the full (expensive) history of why this
    # must be maas-default-gateway and cannot be anything else.
    routerGateway:
      name: maas-default-gateway
      namespace: openshift-ingress
      manage: false
    baseRef: v3-5-0-ea-2-kserve-config-llm-template-nvidia-cuda
    serviceAccountName: qwen35-9b-wesh-s3
    # Same EPP-port sidecar exclusion every LLMInferenceService here needs
    # (ADR-0201/WP-27) - see gptOssModel's schedulerAnnotations comment.
    schedulerAnnotations:
      traffic.sidecar.istio.io/excludeInboundPorts: "9002"
    podAnnotations:
      # Same sidecar sizing the other two model workloads carry - qwen's
      # istio-proxy was repeatedly OOMKilled on the 256Mi cluster default
      # (ADR-0521/WP-076); applied here preventively for the same reason
      # it was applied preventively to gpt-oss-20b.
      sidecar.istio.io/proxyMemory: "160Mi"
      sidecar.istio.io/proxyMemoryLimit: "512Mi"
      sidecar.istio.io/proxyCPU: "50m"
      sidecar.istio.io/proxyCPULimit: "500m"
      instrumentation.opentelemetry.io/inject-sdk: "zuno-models-instrumentation"
      instrumentation.opentelemetry.io/container-names: "main"
  # Sized like the other 2g.48gb workload (qwen36-27b-instruct): a 9B bf16
  # checkpoint is materially smaller than a 27B FP8 one, so this is
  # headroom, not a tight fit.
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
      nvidia.com/mig-2g.48gb: "1"
    limits:
      cpu: "8"
      memory: 24Gi
      nvidia.com/mig-2g.48gb: "1"
  minReplicas: 1
  maxReplicas: 1

# ADR-0526 decision 2: the UNMODIFIED Qwen3.5-9B base (ADR-0518 decision
# 3's training base, already staged in S3), served so the variant can be
# compared against the model it came from rather than against a different
# model. No agent prefers it.
#
# THIS IS THE TIGHT CASE and the numbers matter. 19.3GB of bf16 weights in
# a 24GB slice leaves roughly 4GB for everything else. Its KV cache is
# unusually cheap for its size - only 8 of 32 layers are full_attention
# (num_key_value_heads: 4, head_dim: 256 => ~32KB/token), and the other 24
# linear_attention layers hold a constant-size state - so a 32768 context
# would cost only ~1GB of KV. The pressure is activation//CUDA-graph
# workspace, not KV, which is why --max-model-len is reduced AND
# --gpu-memory-utilization raised AND --enforce-eager kept (no CUDA-graph
# capture is the single largest lever here, and it is required on this
# vLLM build anyway for the MIG/NVML crash). Low concurrency by design:
# this model exists for comparison, not for load.
qwen35Model:
  inferenceServiceName: qwen35-9b
  servedModelName: qwen3.5-9b
  # ADR-0546/WP-131: which bucket this model's weights are read from -
  # "models" (the per-cluster bucket, unchanged) or "sources" (the shared
  # cross-cluster bucket). One model at a time; see templates/_models-s3.tpl.
  s3Source: sources
  # Deliberately BELOW the 32768 the 48GB models use - see the block
  # comment above. Raising this is the first thing to suspect if the pod
  # OOMs or vLLM fails to allocate its KV pool at startup.
  maxModelLen: 8192
  # Fraction of the 24GB slice vLLM may claim. High on purpose, for the
  # same reason maxModelLen is low.
  gpuMemoryUtilization: "0.95"
  # Bounds concurrent sequences so the activation working set stays inside
  # what is left after the weights.
  maxNumSeqs: 4
  llmInferenceService:
    routerGateway:
      name: maas-default-gateway
      namespace: openshift-ingress
      manage: false
    baseRef: v3-5-0-ea-2-kserve-config-llm-template-nvidia-cuda
    serviceAccountName: qwen35-9b-s3
    schedulerAnnotations:
      traffic.sidecar.istio.io/excludeInboundPorts: "9002"
    podAnnotations:
      sidecar.istio.io/proxyMemory: "160Mi"
      sidecar.istio.io/proxyMemoryLimit: "512Mi"
      sidecar.istio.io/proxyCPU: "50m"
      sidecar.istio.io/proxyCPULimit: "500m"
      instrumentation.opentelemetry.io/inject-sdk: "zuno-models-instrumentation"
      instrumentation.opentelemetry.io/container-names: "main"
  # Same shape as gpt-oss-20b's own mig-1g.24gb block (the proven sizing
  # for a 1g.24gb co-resident workload on these nodes).
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
      nvidia.com/mig-1g.24gb: "1"
    limits:
      cpu: "8"
      memory: 20Gi
      nvidia.com/mig-1g.24gb: "1"
  minReplicas: 1
  maxReplicas: 1


# ADR-0108 (roadmap WP-10): LM-Eval candidate local-model comparison.
# Rendered by templates/lmevaljob.yaml, one LMEvalJob CR
# (trustyai.opendatahub.io/v1alpha1, confirmed via `oc explain lmevaljob`
# against the live test cluster) per lmEval.jobs[] entry. The DSC
# component that provides LM-Eval (trustyai,
# gitops/charts/openshift-ai's components.trustyai.eval.lmeval) is
# already managementState: Managed - this only adds the job *instances*,
# which nothing creates automatically. Disabled by default with an empty
# job list: benchmarking is opt-in per candidate model, never automatic
# (ADR-0108: "complements - never replaces - the per-agent ADR-0027
# acceptance suites"). Continuous/scheduled benchmarking across models is
# WP-40 (ADR-0305), explicitly out of scope here - this is a
# manually-declared, one-shot comparison job per entry. Lives in this
# chart (Day 1 "models" component, moved from
# gitops/charts/openshift-ai which is Day 0) since it benchmarks a model
# this chart deploys and belongs to the same install/uninstall lifecycle.
maas:
  # ADR-0201 (WP-27): OpenShift AI Models-as-a-Service governance plane -
  # publishes local chat models, group-based subscriptions and an
  # authorization policy proving denial for an unentitled group.
  # ADR-0414: gpt-oss-20b (gptOssModel above) was the first model
  # published this way, folding what used to be a dedicated
  # qwen25-7b-instruct-maas-backend copy into the same LLMInferenceService
  # that serves ai-gateway's own local routing - no separate
  # MaaS-only deployment. ADR-0521 (WP-076): generalized from one hardcoded
  # model to this list - qwen3.6-27b-instruct joined once it too became an
  # LLMInferenceService (a MaaSModelRef can only ever reference
  # LLMInferenceService or ExternalModel, confirmed via `oc explain
  # maasmodelref.spec.modelRef.kind` - never a classic InferenceService).
  # Every entry below renders its own MaaSModelRef/MaaSSubscription(s)/
  # MaaSAuthPolicy triple (templates/maas.yaml); the Tenant CR stays a
  # singleton (one per namespace, CEL-enforced) outside this list.
  enabled: true

  # 2026-09-01: lets ai-gateway forward the real calling user's Keycloak
  # identity to the MaaS Gateway instead of its own fixed ServiceAccount
  # credential, so the per-group MaaSSubscription token budgets below
  # (agent_tekos/sales) actually get used instead of every call landing in
  # the single shared "ai-gateway" subscription. See templates/maas.yaml's
  # own comment on the ModelsAsService block for the clientId caveat still
  # to verify live.
  externalOIDC:
    enabled: true
    clientId: zuno-admin-api

  models:
    # The proven WP-27 reference: gpt-oss-20b, live-verified end-to-end
    # (Ready MaaSModelRef, group-based subscription access, denial for an
    # unentitled group). qwen below mirrors this exactly per its own
    # WP-076 scoping decision - same two groups, same rate limits - so
    # this stays the reference to diff against.
    - # The MaaSModelRef CR's own name (the "published entry"), distinct
      # from the backend it points at (gptOssModel.inferenceServiceName).
      # Kept separate so the published/governed identity doesn't have to
      # match the underlying deployment's name.
      publishedName: gpt-oss-20b-maas
      # The LLMInferenceService this entry publishes - must match exactly
      # one of gptOssModel.inferenceServiceName / (this chart's top-level)
      # inferenceServiceName.
      backendInferenceServiceName: gpt-oss-20b

      # ADR-0201/WP-27, 2026-08-25, attempt 4 - TESTED LIVE AND ELIMINATED.
      # MaaSModelRef.spec.endpointOverride exists on the live CRD (`oc
      # explain maasmodelref.spec --recursive`) and was missed by the
      # earlier sweep, which only recursed into spec.modelRef. Set live to
      # https://gpt-oss-20b-kserve-workload-svc.zuno-ai-run.svc:8000/v1
      # (the same Service ai-gateway's own MaaS-bypass route already
      # calls). Result: status.endpoint DID change to that value, but
      # maas-controller's logs still show "HTTPRoute validated for
      # LLMInferenceService" for the same adopted gpt-oss-20b-kserve-route
      # on maas-default-gateway immediately after - route adoption is
      # unconditional on modelRef.kind: LLMInferenceService and does not
      # consult endpointOverride at all. The field only overrides the
      # informational status.endpoint (and whatever maas-api's own access
      # probe dials), never route publication or the auth/identity path.
      # Confirmed independently: the AuthPolicy's CEL rules (`oc get
      # authpolicy maas-gateway-auth -n openshift-ingress`) only ever read
      # request.path or the request's X-Gateway-Model-Name header - never
      # MaaSModelRef - so this field is structurally incapable of fixing
      # the identity mismatch. Kept wired (disabled) rather than removed,
      # matching routerGateway's retained-but-disabled pattern - documents
      # a real CRD field for the next attempt without pretending it does
      # more than it does. This finding is structural (about the CRD/
      # controller, not about gpt-oss-20b specifically) - qwen's own entry
      # below stays disabled too rather than re-testing the same dead end.
      endpointOverride: ""

      # Two Keycloak groups (gitops/charts/keycloak/files/realm-zuno.json)
      # demonstrating different MaaSSubscription access to the same
      # published model via different token rate limits (MaaSSubscription
      # has no separate "which models" dimension beyond modelRefs[], so
      # differentiated *rate* is the schema-supported way to show two
      # groups getting different access) - agent_tekos (Tekos's own
      # primary consumers) gets the higher limit, sales a materially
      # lower one to make the difference obvious in a live comparison.
      subscriptions:
        - name: gpt-oss-20b-tekos
          group: /agent_tekos
          tokenRateLimits:
            - limit: 100000
              window: 1h
          priority: 10
        - name: gpt-oss-20b-sales
          group: /sales
          tokenRateLimits:
            - limit: 5000
              window: 1h
          priority: 1
        # ADR-0521 (WP-076) step 3: ai-gateway's own identity, not a
        # persona. `user:` (MaaSSubscription.spec.owner.users /
        # MaaSAuthPolicy.spec.subjects.users - both schema-valid without a
        # matching `groups` entry, confirmed via `oc explain
        # maassubscription.spec.owner --recursive`) rather than `group:`,
        # scoped to this ONE ServiceAccount rather than
        # system:serviceaccounts:zuno-ai-run (every SA in the namespace) -
        # the tighter grant a Kubernetes TokenReview identity supports.
        # Rate limit is deliberately generous (10x agent_tekos's own
        # "high" tier): this identity will carry ai-gateway's ENTIRE
        # aggregate local-model traffic once WP-076 step 4 enables MaaS as
        # the default transport, not one persona's share of it - Zuno's
        # own per-request policy layer (ADR-0021 classification, ADR-0511
        # quota.py) is still the primary control; this is a coarse
        # platform-level circuit breaker, not the mechanism doing real
        # quota enforcement. Priority 100 (above every persona tier) since
        # it represents infrastructure, not a contended end-user share.
        - name: gpt-oss-20b-ai-gateway
          user: "system:serviceaccount:zuno-ai-run:ai-gateway"
          tokenRateLimits:
            - limit: 1000000
              window: 1h
          priority: 100

      # Proves a group/model combination WITHOUT entitlement is denied
      # (ADR-0201 acceptance bullet 3): only the groups above are subjects
      # - any other group (e.g. `finance`, used in the operator's live
      # negative test) is denied by omission.
      authPolicy:
        name: gpt-oss-20b-entitlement

    # ADR-0521 (WP-076): qwen3.6-27b-instruct, generalizing the gpt-oss-20b
    # pattern above to the primary/default local chat model. Same two
    # groups and rate limits as gpt-oss-20b (user-confirmed scoping
    # decision, WP-076) rather than every agent_* group - this stays a
    # pure structural generalization of the proven pattern; broader group
    # coverage is a deliberate follow-up, not this step's job.
    - publishedName: qwen36-27b-instruct-maas
      backendInferenceServiceName: qwen36-27b-instruct
      endpointOverride: ""
      subscriptions:
        - name: qwen36-27b-instruct-tekos
          group: /agent_tekos
          tokenRateLimits:
            - limit: 100000
              window: 1h
          priority: 10
        - name: qwen36-27b-instruct-sales
          group: /sales
          tokenRateLimits:
            - limit: 5000
              window: 1h
          priority: 1
        # ADR-0521 (WP-076) step 3: same ai-gateway-own-identity entry as
        # gptOssModel's own - see that one's comment for the full
        # user-vs-group scoping/rate-limit rationale.
        - name: qwen36-27b-instruct-ai-gateway
          user: "system:serviceaccount:zuno-ai-run:ai-gateway"
          tokenRateLimits:
            - limit: 1000000
              window: 1h
          priority: 100
        # ADR-0524 clause 1 (WP-085 step 2): OpenShift Lightspeed's own
        # identity, entitled to this model only. The subject is a DEDICATED
        # ServiceAccount created by gitops/charts/lightspeed-config, not
        # Lightspeed's operand SA - that one is created by the operator at
        # reconcile time and its name is not knowable before install (the
        # v1.1.2 bundle CSV declares only lightspeed-operator-controller-
        # manager), so a purpose-made identity is both the tighter grant and
        # the only one this file can name up front.
        #
        # `user:` not `group:`, same reasoning as the ai-gateway entry above:
        # a Kubernetes TokenReview identity supports scoping to ONE
        # ServiceAccount rather than system:serviceaccounts:openshift-lightspeed
        # (every SA in that namespace, including the operator's own).
        #
        # Rate limit sits between a persona tier and ai-gateway's
        # infrastructure tier: Lightspeed serves interactive console questions
        # for many users, but it is one assistant, not the platform's whole
        # aggregate model traffic. Priority 50 for the same reason.
        - name: qwen36-27b-instruct-lightspeed
          user: "system:serviceaccount:openshift-lightspeed:lightspeed-maas-client"
          tokenRateLimits:
            - limit: 200000
              window: 1h
          priority: 50
      authPolicy:
        name: qwen36-27b-instruct-entitlement

    # ADR-0526 (WP-087) / ADR-0521 decisions 5-6: the French urban-register variant, which carries all of Comage's traffic. Same manifest
    # set every published model here gets - a MaaSModelRef, its
    # MaaSSubscriptions and a MaaSAuthPolicy, all rendered by
    # templates/maas.yaml's range over this list. Same two persona groups
    # and rate limits as the two models above (their scoping decision is
    # reused verbatim; broadening group coverage stays a separate,
    # deliberate change).
    - publishedName: qwen35-9b-wesh-maas
      backendInferenceServiceName: qwen35-9b-wesh
      # Structurally useless for the identity path - see gpt-oss-20b's own
      # entry for the live elimination of this field. Kept wired and empty
      # for consistency, not re-tested.
      endpointOverride: ""
      subscriptions:
        - name: qwen35-9b-wesh-tekos
          group: /agent_tekos
          tokenRateLimits:
            - limit: 100000
              window: 1h
          priority: 10
        - name: qwen35-9b-wesh-sales
          group: /sales
          tokenRateLimits:
            - limit: 5000
              window: 1h
          priority: 1
        # ADR-0521 (WP-076) step 3: ai-gateway's OWN ServiceAccount
        # identity, not a persona. This grant is what the `via_maas: true`
        # provider entry in platform/ai-gateway/provider-routing.yaml
        # depends on - without it the -maas sibling 403s and every turn
        # silently falls through to the direct twin. See gpt-oss-20b's own
        # entry for the full user-vs-group scoping rationale.
        - name: qwen35-9b-wesh-ai-gateway
          user: "system:serviceaccount:zuno-ai-run:ai-gateway"
          tokenRateLimits:
            - limit: 1000000
              window: 1h
          priority: 100
      authPolicy:
        name: qwen35-9b-wesh-entitlement

    # ADR-0526 (WP-087) / ADR-0521 decisions 5-6: the unmodified Qwen3.5-9B base, published so the variant's MaaS path has a same-base comparison point. Same manifest
    # set every published model here gets - a MaaSModelRef, its
    # MaaSSubscriptions and a MaaSAuthPolicy, all rendered by
    # templates/maas.yaml's range over this list. Same two persona groups
    # and rate limits as the two models above (their scoping decision is
    # reused verbatim; broadening group coverage stays a separate,
    # deliberate change).
    - publishedName: qwen35-9b-maas
      backendInferenceServiceName: qwen35-9b
      # Structurally useless for the identity path - see gpt-oss-20b's own
      # entry for the live elimination of this field. Kept wired and empty
      # for consistency, not re-tested.
      endpointOverride: ""
      subscriptions:
        - name: qwen35-9b-tekos
          group: /agent_tekos
          tokenRateLimits:
            - limit: 100000
              window: 1h
          priority: 10
        - name: qwen35-9b-sales
          group: /sales
          tokenRateLimits:
            - limit: 5000
              window: 1h
          priority: 1
        # ADR-0521 (WP-076) step 3: ai-gateway's OWN ServiceAccount
        # identity, not a persona. This grant is what the `via_maas: true`
        # provider entry in platform/ai-gateway/provider-routing.yaml
        # depends on - without it the -maas sibling 403s and every turn
        # silently falls through to the direct twin. See gpt-oss-20b's own
        # entry for the full user-vs-group scoping rationale.
        - name: qwen35-9b-ai-gateway
          user: "system:serviceaccount:zuno-ai-run:ai-gateway"
          tokenRateLimits:
            - limit: 1000000
              window: 1h
          priority: 100
      authPolicy:
        name: qwen35-9b-entitlement

    # ADR-0537 (WP-106, Phase 3): mistral-large-latest, published as a
    # MaaSModelRef backed by an ExternalModel CR (templates/
    # externalmodel-mistral.yaml) instead of an LLMInferenceService -
    # modelRefKind below overrides templates/maas.yaml's default. Stays on
    # its native api.mistral.ai endpoint (explicit decision: NOT migrated
    # to OVHcloud) - only its governance changes. Same two-persona-group +
    # ai-gateway-catch-all pattern and rate limits as every model above,
    # reused verbatim rather than inventing new tiers for this ADR.
    - publishedName: mistral-large-maas
      modelRefKind: ExternalModel
      backendInferenceServiceName: mistral-large
      subscriptions:
        - name: mistral-large-tekos
          group: /agent_tekos
          tokenRateLimits:
            - limit: 100000
              window: 1h
          priority: 10
        - name: mistral-large-sales
          group: /sales
          tokenRateLimits:
            - limit: 5000
              window: 1h
          priority: 1
        - name: mistral-large-ai-gateway
          user: "system:serviceaccount:zuno-ai-run:ai-gateway"
          tokenRateLimits:
            - limit: 1000000
              window: 1h
          priority: 100
      authPolicy:
        name: mistral-large-entitlement

    # ADR-0537 (WP-106, Phase 3): gpt-oss-120b via OVHcloud AI Endpoints
    # (ADR-0416), published the same way as mistral-large-latest above -
    # see templates/externalmodel-ovhcloud-gpt-oss-120b.yaml. Finage's
    # existing exclusion from this model (ADR-0416,
    # zuno.model.local_only: true) stays enforced solely in ai-gateway's
    # own routing/classification layer - deliberately NOT duplicated into
    # this entry's authPolicy subjects, per ADR-0537 Decision 3.
    - publishedName: gpt-oss-120b-ovhcloud-maas
      modelRefKind: ExternalModel
      backendInferenceServiceName: gpt-oss-120b-ovhcloud
      subscriptions:
        - name: gpt-oss-120b-ovhcloud-tekos
          group: /agent_tekos
          tokenRateLimits:
            - limit: 100000
              window: 1h
          priority: 10
        - name: gpt-oss-120b-ovhcloud-sales
          group: /sales
          tokenRateLimits:
            - limit: 5000
              window: 1h
          priority: 1
        - name: gpt-oss-120b-ovhcloud-ai-gateway
          user: "system:serviceaccount:zuno-ai-run:ai-gateway"
          tokenRateLimits:
            - limit: 1000000
              window: 1h
          priority: 100
      authPolicy:
        name: gpt-oss-120b-ovhcloud-entitlement

# ADR-0537 (WP-106, Phase 3): the two SaaS models published via ExternalModel
# above. `name` is both the ExternalModel CR's own metadata.name and the
# `backendInferenceServiceName` each maas.models entry above points at.
# credentialRef requires the target Secret's data key to be literally
# "api-key" (verified via the CRD schema) - the existing
# platform/ai-gateway/externalsecret-{mistral,ovhcloud}.yaml Secrets use
# "api_key" for ai-gateway's own direct-call consumption, so each entry here
# gets its own mirror ExternalSecret (same Vault path/property, different
# target Secret + key name) rather than editing those - ADR-0416/ADR-0415's
# already-settled "one key per account" principle stays intact; this only
# adds a second Kubernetes Secret pointing at the same Vault value.
externalModels:
  mistral:
    name: mistral-large
    endpoint: api.mistral.ai
    provider: mistral
    targetModel: mistral-large-latest
    secretName: llm-provider-mistral-maas
    vault:
      path: providers/mistral
      property: api_key
  ovhcloudGptOss120b:
    name: gpt-oss-120b-ovhcloud
    endpoint: oai.endpoints.kepler.ai.cloud.ovh.net
    provider: openai-compatible
    targetModel: gpt-oss-120b
    secretName: llm-provider-ovhcloud-maas
    vault:
      path: providers/ovhcloud
      property: api_key

lmEval:
  enabled: true
  # Benchmarks the one model actually deployed by this chart (see
  # inferenceServiceName/modelId above), same base_url convention as
  # components/rag-service/app/config.py's EMBEDDING_SERVICE_URL.
  cache:
    # pvc-lmeval-cache.yaml's size - real payload is tiny (~11MB tokenizer
    # + one MMLU subject config), generous headroom still costs nothing on
    # gp3-csi.
    size: 1Gi
  jobs:
    - name: qwen36-27b-instruct-mmlu
      model: local-completions
      # ADR-0521: qwen is an LLMInferenceService now, no more
      # -predictor Service - it terminates real TLS on port 8000.
      #
      # WP-107 (2026-09-02): base_url is deliberately http, NOT https, and
      # trustLocalCA is off. The job pod is mesh-injected, and the KServe
      # controller auto-generates a DestinationRule (mode SIMPLE,
      # service-ca, correct SNI) for this Service - so the sidecar
      # originates TLS for plaintext client traffic. An https base_url
      # makes the client do its own TLS INSIDE that origination
      # (double-TLS), which fails deterministically as "[SSL] record layer
      # failure" on the first request - reproduced twice live. ai-gateway
      # avoids this with traffic.sidecar.istio.io/excludeOutboundPorts:
      # "8000" on its own pod, but the LMEvalJob CRD's spec.pod exposes no
      # annotations field (checked via oc explain, 3.5.0-ea.2), so the
      # mesh-origination path is the only one available here. From the
      # predictor's point of view both paths deliver identical plain TLS.
      trustLocalCA: false
      modelArgs:
        - name: base_url
          value: http://qwen36-27b-instruct-kserve-workload-svc.zuno-ai-run.svc:8000/v1/completions
        - name: model
          value: qwen3.6-27b-instruct
        # lm-eval-harness's TemplateAPI defaults to
        # AutoTokenizer.from_pretrained(model) when `tokenizer` is unset -
        # `model` here is the in-cluster served-model name, not a valid HF
        # repo id, so that lookup 404s against huggingface.co
        # ("... is not the path to a directory..."). A
        # local directory path (not the Qwen/Qwen3.6-27B-FP8 repo id)
        # so AutoTokenizer.from_pretrained loads straight off disk with no
        # HF Hub resolution at all - HF_HUB_OFFLINE=1 is irrelevant either
        # way. job-lmeval-cache-prefetch.yaml's tokenizer-prefetch init
        # container populates this path from this cluster's own S3 model
        # bucket (modelsS3, same prefix the predictor serves from) rather
        # than huggingface.co; it reads this exact value back out via a
        # `range .modelArgs` lookup, so it's the single source of truth -
        # change it here only.
        - name: tokenizer
          value: /cache/tokenizers/qwen3.6-27b-instruct
      # The full `mmlu` group task (57 subjects) expands to 56,168
      # loglikelihood requests - too much sustained load for this demo
      # cluster's shared single-GPU-plus-MIG capacity (qwen + gpt-oss-20b +
      # the MaaS backend model all serve concurrently); the predictor
      # starts 503ing under that volume partway through, a real capacity
      # constraint, not a bug. Scoped to one real native subject task
      # (mmlu_abstract_algebra, ~100 test examples x 4 choices ≈ 400
      # requests) - a genuine, complete, right-sized GPU-backed run rather
      # than a capacity-planning exercise. Extend taskNames back to `mmlu`
      # (or add more subjects) once dedicated eval-time GPU capacity
      # exists.
      taskNames: [mmlu_abstract_algebra]
      # allowOnline stays false: it has no effect either way (the operator
      # hardcodes the HF offline env vars regardless - see lmevaljob.yaml's
      # comment). The real fix is datasetCachePvc below: mmlu's dataset
      # (hails/mmlu_no_train, one
      # HF `load_dataset(path, config)` call per of its 57 subject
      # configs - NOT the "all" aggregate config, which has a real,
      # separate bug returning 0 examples per split) AND the chat
      # model's tokenizer are both pre-cached by the
      # operator into this PVC's HF_HOME before the job runs.
      # tokenizer_backend=none was tried and reverted: mmlu is a
      # loglikelihood task and TemplateAPI asserts a real tokenizer is
      # present to compute context lengths even with echo=True - the
      # tokenizer must be cached and loaded for real, not skipped. Model
      # access stays local (local-completions against the in-cluster predictor);
      # allowCodeExecution stays false.
      allowOnline: false
      allowCodeExecution: false
      # Chart-managed PVC (pvc-lmeval-cache.yaml), pre-warmed by
      # job-lmeval-cache-prefetch.yaml before this job's pod can schedule -
      # both pinned to the same ArgoCD sync-wave as this PVC's first
      # consumer, same pattern as modelStorage's pvc-model.yaml/
      # job-model-download.yaml. Must exist and be pre-warmed before this
      # job runs, or every task falls back to a live HF network call that
      # the operator's own offline env vars will block.
      datasetCachePvc: lmeval-hf-cache
      # Consumed by job-lmeval-cache-prefetch.yaml's dataset-prefetch
      # container: one load_dataset(datasetHfRepo, datasetHfConfig) call,
      # matching taskNames above (mmlu_abstract_algebra -> the
      # hails/mmlu_no_train dataset's abstract_algebra config - NOT the
      # "all" aggregate config, which has a real, separate bug returning 0
      # examples per split). Update both together if taskNames changes.
      datasetHfRepo: hails/mmlu_no_train
      datasetHfConfig: abstract_algebra

    # ADR-0534/WP-109 (Phase 3): the PEFT/LoRA base-vs-candidate pair.
    # Same task, same bounded scope, same mesh-native http rule as the
    # qwen3.6 job above - two runs whose status.results feed
    # evaluations/peft_regression.py to prove the wesh fine-tune
    # (ADR-0526) did not regress the base's general capability. s3ModelName
    # points the tokenizer prefetch at each model's own S3 dir (the wesh
    # dir carries the same tokenizer family, prefetched separately so
    # neither job depends on the other's cache).
    - name: qwen35-9b-mmlu
      model: local-completions
      trustLocalCA: false
      s3ModelName: qwen3.5-9b
      modelArgs:
        - name: base_url
          value: http://qwen35-9b-kserve-workload-svc.zuno-ai-run.svc:8000/v1/completions
        - name: model
          value: qwen3.5-9b
        - name: tokenizer
          value: /cache/tokenizers/qwen3.5-9b
      taskNames: [mmlu_abstract_algebra]
      allowOnline: false
      allowCodeExecution: false
      datasetCachePvc: lmeval-hf-cache
      datasetHfRepo: hails/mmlu_no_train
      datasetHfConfig: abstract_algebra
    - name: qwen35-9b-wesh-mmlu
      model: local-completions
      trustLocalCA: false
      s3ModelName: qwen3.5-9b-wesh
      modelArgs:
        - name: base_url
          value: http://qwen35-9b-wesh-kserve-workload-svc.zuno-ai-run.svc:8000/v1/completions
        - name: model
          value: qwen3.5-9b-wesh
        - name: tokenizer
          value: /cache/tokenizers/qwen3.5-9b-wesh
      taskNames: [mmlu_abstract_algebra]
      allowOnline: false
      allowCodeExecution: false
      datasetCachePvc: lmeval-hf-cache
      datasetHfRepo: hails/mmlu_no_train
      datasetHfConfig: abstract_algebra

# ADR-0524 (WP-085), TEMPORAIRE: autorise OpenShift Lightspeed a appeler le
# predictor qwen directement, pendant que le plan de controle MaaS ne sait plus
# rapprocher une identite d'une MaaSSubscription (403, WP-076). Regression
# assumee et tracee d'ADR-0521, a retirer des que MaaS refonctionne - voir le
# commentaire dans templates/networkpolicy-qwen.yaml.
lightspeed:
  enabled: false
  namespace: openshift-lightspeed
