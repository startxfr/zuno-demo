# Default values for the models chart. Overridden per-environment through
# gitops/apps/models/application-d1.yaml's spec.source.helm.values.

namespace: zuno-ai-run

servingRuntimeName: vllm-runtime
inferenceServiceName: qwen25-7b-instruct

# The HF repository id the download Job pulls (hf://<modelId>).
modelId: Qwen/Qwen2.5-7B-Instruct
# The OpenAI-compatible API id vLLM serves (--served-model-name) - the
# platform-wide canonical model id every consumer routes by
# (platform/ai-gateway/provider-routing.yaml, ai-gateway's
# LOCAL_MODEL_NAME, policies/model-routing, policies/optimization).
# VERIFIED live (2026-08-16): serving under the HF id instead made
# every local chat completion 404 ("The model `qwen2.5-7b-instruct`
# does not exist") - the two ids are different concerns.
servedModelName: qwen2.5-7b-instruct

image:
  # Fallback for `helm template`/standalone testing only; ansible always
  # overrides this at apply time with the image published by the installed
  # OpenShift AI catalog.
  vllm: quay.io/modh/vllm:rhoai-2.16-cuda
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: "4"
    memory: 24Gi
    nvidia.com/gpu: "1"
  limits:
    cpu: "8"
    memory: 32Gi
    nvidia.com/gpu: "1"

minReplicas: 1
maxReplicas: 1

# ADR-0301 (WP-34 Part B): vLLM native multi-LoRA, additive to the same
# ServingRuntime/InferenceService above - NOT a second deployment per
# adapter (point 1). Adapter selection is static here (point 2); which
# adapter a request actually uses is ADR-0303/WP-39's scope, not this
# one's. Default empty - no adapter attaches unless explicitly listed.
# Each entry:
#   name               - the vLLM --lora-modules module name (also what a
#                         future ADR-0303 request would reference).
#   registryModelName / registryModelVersion - the OpenShift AI Model
#                         Registry name/version this adapter was
#                         registered under (components/mlops's
#                         push-registry stage, ADR-0302 point 6) - never
#                         an unversioned/untracked location (point 3).
#   path               - where vLLM reads the adapter FROM on this pod's
#                         filesystem. UNVERIFIED against a live cluster:
#                         no adapter-download mechanism exists yet in
#                         this chart (unlike modelStorage's own
#                         job-model-download.yaml for the base model) -
#                         an operator promoting an adapter today must
#                         also arrange for it to land at this path (e.g.
#                         a follow-up PVC/init-container, out of this
#                         WP's own ~4-file estimate) before this actually
#                         serves traffic.
#   classification     - C1/C2/C3 (ADR-0301 point 4/ADR-0034): inherited
#                         from the adapter's own training dataset
#                         (components/mlops's train_manifest.json). Gated
#                         below and in values.schema.json - a C2/C3
#                         adapter cannot attach to a serving path with
#                         maas.enabled (externally-eligible).
loraAdapters: []
# Example (uncomment and fill in once an adapter has been trained,
# evaluated and registered - see components/mlops/README's own pipeline
# stages):
#   - name: comage-lora
#     registryModelName: comage-lora
#     registryModelVersion: run-0001
#     path: /mnt/loras/comage-lora
#     classification: C2

# Predownloads the chat model into a PVC (via templates/job-model-download.yaml)
# instead of storageUri: hf://, which downloads straight into the GPU
# node's ephemeral root disk on every pod (re)start. Verified on-cluster:
# the node's 75GB root volume can't hold the CUDA vLLM image (17.67GB) + a
# fresh ~15GB hf:// download + NVIDIA driver build artifacts (~7GB) at
# once - kubelet evicted the pod for ephemeral-storage pressure on first
# real deploy. A PVC survives pod restarts and isn't bounded by node disk
# size.
modelStorage:
  size: 30Gi
  storageClassName: gp3-csi
  # gp3-csi is WaitForFirstConsumer + single-AZ (EBS): the download Job (the
  # PVC's first consumer) and the predictor must land in the same zone, or
  # the predictor's mount fails with a volume node-affinity conflict once
  # the PVC is bound elsewhere. This demo's GPU nodes currently span two
  # zones (verified on-cluster: one g6.2xlarge in eu-west-2a, one
  # g6.4xlarge in eu-west-2b) - pin both to whichever zone has the GPU
  # node you want this model on. Adding more GPU nodes for this model
  # later must keep them in this same zone, or this needs per-zone
  # PVCs/affinity instead of one shared value.
  zone: eu-west-2b
  # Pinned to the odh-kserve-storage-initializer image this cluster's own
  # KServe controller already generates for the hf:// init container
  # (read off the live InferenceService's generated pod spec) - unlike
  # image.vllm (ADR-0048), this is not (yet) discovered at deploy time.
  initializerImage: registry.redhat.io/rhoai/odh-kserve-storage-initializer-rhel9@sha256:166184c520c7821bacbedd05736938b58edc9cc2edc6071bfbc1105a4316aef5

# Additive second model: text embeddings for rag-ingestion (see
# gitops/charts/rag-ingestion's embedding.endpoint/dimensions) and
# rag-service's query-side embedding calls. inferenceServiceName is
# "embeddings", not "embeddings-predictor": KServe RawDeployment appends
# "-predictor" to the InferenceService name to build its Service name
# (see qwen25-7b-instruct -> qwen25-7b-instruct-predictor below), and
# gitops/charts/rag-service/values.yaml's embeddingServiceUrl /
# components/rag-service/app/config.py's EMBEDDING_SERVICE_URL default
# already hardcode http://embeddings-predictor.zuno-ai-run.svc:8080 -
# this closes that previously-dangling reference rather than inventing a
# third, inconsistent embedding endpoint. Kept as its own
# servingRuntime/inferenceService pair rather than folding into a
# models: [] list, since only these two models exist and a list-based
# rewrite would be a breaking change to every consumer of this chart's
# flat values shape for no benefit at this scale.
embeddingModel:
  servingRuntimeName: vllm-embedding-runtime
  inferenceServiceName: embeddings
  # Same modelId (HF download) / servedModelName (API id) split as the
  # chat model above - rag-service's EMBEDDING_MODEL_NAME expects the
  # short canonical id.
  servedModelName: bge-small-en-v1.5
  # BAAI/bge-small-en-v1.5, 384-dim: matches rag-service's existing
  # embeddingModelName default (gitops/charts/rag-service/values.yaml) -
  # same reasoning as the endpoint name above. Served via vLLM's pooling
  # runner (--runner=pooling --convert=embed), not chat.
  modelId: BAAI/bge-small-en-v1.5
  dimensions: 384
  # GPU request: the discovered/pinned image.vllm is a CUDA-only vLLM
  # build (ADR-0048 prefers the "cuda"-named template), which crashes
  # with "Failed to infer device type" when scheduled without a GPU -
  # verified on-cluster. bge-small-en-v1.5 is a ~130MB encoder model, so
  # this shares the chat model's GPU node rather than needing its own.
  # memory: the old 1Gi/2Gi sizing was set back when this ran CPU-only;
  # with a GPU it runs vLLM's full torch.compile + CUDA-graph-capture
  # pipeline like the chat model, whose fixed overhead OOMKilled the
  # container at a 2Gi limit (verified on-cluster, exit 137) despite the
  # model itself being tiny.
  resources:
    requests:
      cpu: "500m"
      memory: 2Gi
      nvidia.com/gpu: "1"
    limits:
      cpu: "1"
      memory: 4Gi
      nvidia.com/gpu: "1"
  minReplicas: 1
  maxReplicas: 1

# ADR-0108 (roadmap WP-10): LM-Eval candidate local-model comparison.
# Rendered by templates/lmevaljob.yaml, one LMEvalJob CR
# (trustyai.opendatahub.io/v1alpha1, confirmed via `oc explain lmevaljob`
# against the live test cluster) per lmEval.jobs[] entry. The DSC
# component that provides LM-Eval (trustyai,
# gitops/charts/openshift-ai's components.trustyai.eval.lmeval) is
# already managementState: Managed - this only adds the job *instances*,
# which nothing creates automatically. Disabled by default with an empty
# job list: benchmarking is opt-in per candidate model, never automatic
# (ADR-0108: "complements - never replaces - the per-agent ADR-0027
# acceptance suites"). Continuous/scheduled benchmarking across models is
# WP-40 (ADR-0305), explicitly out of scope here - this is a
# manually-declared, one-shot comparison job per entry. Lives in this
# chart (Day 1 "models" component, moved 2026-08-14 from
# gitops/charts/openshift-ai which is Day 0) since it benchmarks a model
# this chart deploys and belongs to the same install/uninstall lifecycle.
maas:
  # ADR-0201 (WP-27): OpenShift AI Models-as-a-Service governance plane -
  # publishes the local chat model, group-based subscriptions and an
  # authorization policy proving denial for an unentitled group. Disabled
  # by default: the maas.opendatahub.io/v1alpha1 CRDs (MaaSModelRef,
  # MaaSSubscription, MaaSAuthPolicy, ExternalModel) are confirmed
  # installed on the test cluster (`oc get crd`, 2026-08-15), but no
  # MaaSModelRef/Subscription/AuthPolicy exists there yet - every
  # acceptance bullet (publish, two-group access difference, AuthPolicy
  # deny, end-to-end request, metric/trace correlation) is a live-cluster
  # operator step (see the WP-27 brief's follow-up section), same
  # "manifests exist, live verification pending" posture as
  # maasAdapter.enabled in gitops/charts/ai-gateway.
  # Enabled 2026-08-16: 3rd GPU node ready, LLMInferenceService path built.
  enabled: true

  modelRef:
    name: qwen25-7b-instruct-maas
    # RESOLVED live 2026-08-16 (a 3rd GPU node - g6.2xlarge/L4, zone
    # eu-west-2c - was added, freeing this decision): LLMInferenceService.
    # ExternalModel was ruled out on its own schema, not just suspected -
    # ExternalProvider.spec.endpoint is documented "FQDN of the external
    # provider... e.g. api.openai.com" and spec.auth is required
    # (simple/sigv4/oauth2), genuinely built for authenticated third-party
    # SaaS, not our internal unauthenticated vLLM Service. Reusing the
    # existing classic InferenceService's model PVC was considered and
    # rejected: it's ReadWriteOnce, bound to zone eu-west-2b where that
    # GPU is already fully committed - a second GPU-requesting pod can't
    # land on the same node, and RWO EBS volumes can't attach cross-node.
    # llmInferenceService below downloads its own copy via hf:// onto the
    # new node instead (standard KServe LLMInferenceService pattern, see
    # https://kserve.github.io/website/docs/model-serving/generative-inference/llmisvc/llmisvc-configuration).
    kind: LLMInferenceService
  llmInferenceService:
    # RHOAI 3.5 EA2's own vLLM/CUDA preset (`oc get llminferenceserviceconfig
    # -n redhat-ods-applications`, 2026-08-16) - supplies the serving image;
    # everything below overrides/adds to it.
    baseRef: v3-5-0-ea-2-kserve-config-llm-template-nvidia-cuda
    modelUri: hf://Qwen/Qwen2.5-7B-Instruct
    # Served-model id MaaS callers use in the "model" field - independent
    # canonical id from the classic InferenceService's own
    # servedModelName (models.servedModelName), by design: this is a
    # deliberately separate governed-access copy, not an alias for it.
    servedModelName: qwen2.5-7b-instruct-maas
    # Pins to the new GPU node's zone (g6.2xlarge/L4) - the other two
    # zones' single GPU each are already committed to the classic
    # embeddings/qwen predictors (same zone-pinning pattern
    # gitops/charts/models already uses for those two).
    zone: eu-west-2c
    # Smaller than the classic qwen predictor's 24Gi/32Gi (g6.4xlarge,
    # 16vCPU/64GiB) - VERIFIED live (2026-08-16): the new node is a
    # g6.2xlarge (8vCPU/32GiB, ~28.7Gi allocatable), half the instance
    # size. 24Gi request alone exceeded total allocatable once the
    # router-scheduler pod + daemonsets' own ~6.8Gi baseline is counted
    # ("FailedScheduling: Insufficient memory"). 16Gi/20Gi leaves
    # headroom; system RAM mainly needs to cover the vLLM engine/
    # tokenizer/request buffers, not the model weights (those live in
    # GPU VRAM).
    resources:
      requests:
        cpu: "4"
        memory: 16Gi
        nvidia.com/gpu: "1"
      limits:
        cpu: "8"
        memory: 20Gi
        nvidia.com/gpu: "1"

  # Two Keycloak groups (gitops/charts/keycloak/files/realm-zuno.json)
  # demonstrating different MaaSSubscription access to the same published
  # model via different token rate limits (MaaSSubscription has no
  # separate "which models" dimension beyond modelRefs[], so
  # differentiated *rate* is the schema-supported way to show two groups
  # getting different access) - agent_tekos (Tekos's own primary
  # consumers) gets the higher limit, sales a materially lower one to
  # make the difference obvious in a live comparison.
  subscriptions:
    - name: qwen25-7b-instruct-tekos
      group: agent_tekos
      tokenRateLimits:
        - limit: 100000
          window: 1h
      priority: 10
    - name: qwen25-7b-instruct-sales
      group: sales
      tokenRateLimits:
        - limit: 5000
          window: 1h
      priority: 1

  # Proves a group/model combination WITHOUT entitlement is denied
  # (ADR-0201 acceptance bullet 3): only the groups above are subjects -
  # any other group (e.g. `finance`, used in the operator's live negative
  # test) is denied by omission. The live proof itself is the WP-27
  # follow-up's job; this manifest is what makes that proof possible.
  authPolicy:
    name: qwen25-7b-instruct-entitlement

lmEval:
  enabled: true
  # First real run (2026-08-14, roadmap WP-10 test pass): benchmarks the
  # one model actually deployed by this chart (see
  # inferenceServiceName/modelId above), same base_url convention as
  # components/rag-service/app/config.py's EMBEDDING_SERVICE_URL.
  jobs:
    - name: qwen25-7b-instruct-mmlu
      model: local-completions
      modelArgs:
        - name: base_url
          value: http://qwen25-7b-instruct-predictor.zuno-ai-run.svc:8080/v1/completions
        - name: model
          value: qwen2.5-7b-instruct
      taskNames: [mmlu]
      allowOnline: false
      allowCodeExecution: false
