# Namespace-scoped ServingRuntime, not ClusterServingRuntime, to keep this
# scoped to zuno-ai-run rather than the cluster-wide catalog.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: {{ .Values.servingRuntimeName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    # Must sync before inferenceservice.yaml, which references this runtime by
    # name.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  containers:
    - name: kserve-container
      image: "{{ .Values.image.vllm }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      args:
        - --model=/mnt/models
        - --served-model-name={{ .Values.modelId }}
        - --max-model-len=8192
      ports:
        - containerPort: 8080
          protocol: TCP
      # No readOnlyRootFilesystem: vLLM writes a HuggingFace/compilation cache
      # under its container filesystem at startup, and the exact writable paths
      # aren't verified. Pod-level runAsNonRoot/seccompProfile aren't set
      # either: the `model:` shorthand doesn't reliably expose that override.
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        {{- toYaml .Values.resources | nindent 8 }}
  multiModel: false
