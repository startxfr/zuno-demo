# Namespace-scoped ServingRuntime, not ClusterServingRuntime, to keep this
# scoped to zuno-ai-run rather than the cluster-wide catalog.
{{- /* ADR-0301 point 4 / ADR-0034: a C2/C3-classified adapter may only be
loaded into a serving path an agent is already authorized to reach under
ADR-0021's C1/C2/C3 routing - it must never widen that routing. This
ServingRuntime backs the LOCAL vLLM InferenceService; when
maas.enabled publishes that same InferenceService externally
(gitops/charts/models/templates/maas.yaml, ADR-0201), it becomes an
externally-eligible serving path, and no C2/C3 adapter may attach to it -
see values.schema.json for the same rule expressed as a values-schema
constraint (defense in depth: this template-time fail catches it even
for a caller that renders this chart without schema validation). */}}
{{- if .Values.maas.enabled }}
{{- range .Values.loraAdapters }}
{{- if ne .classification "C1" }}
{{- fail (printf "loraAdapters[%s].classification=%s cannot attach while maas.enabled is true (externally-eligible serving path) - ADR-0301 point 4/ADR-0021" .name .classification) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: {{ .Values.servingRuntimeName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    # Must sync before inferenceservice.yaml, which references this runtime by
    # name.
    argocd.argoproj.io/sync-wave: "-5"
{{- if .Values.loraAdapters }}
    # ADR-0034: classification propagates to the adapter, not just its
    # outputs - recorded here per-adapter so it's inspectable (`oc get
    # servingruntime -o yaml`) without needing components/mlops's own
    # train_manifest.json/S3 state. A future ADR-0303 dynamic-selection
    # read of "which adapters exist at what classification" starts here.
    zuno.io/lora-adapter-classifications: {{ .Values.loraAdapters | mustToJson | quote }}
{{- end }}
spec:
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  containers:
    - name: kserve-container
      image: "{{ .Values.image.vllm }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      args:
        - --model=/mnt/models
        - --served-model-name={{ .Values.servedModelName }}
        # ADR-0518: 32768 (was 8192 on the 7B model) - Qwen3.6-27B-FP8
        # leaves ~18GB of the 2g.48gb slice for KV after its ~28GB of
        # weights, comfortable for this length at demo concurrency. If
        # multi-agent load starts 503ing/preempting, lower this before
        # touching anything else.
        - --max-model-len=32768
        # ADR-0518: verified live on this cluster - without this flag,
        # startup crashes deep in vLLM's CUDA-graph memory profiling
        # (profile_cudagraph_memory -> _allocate_kv_cache_tensors) with
        # "NVML_SUCCESS == r INTERNAL ASSERT FAILED" in PyTorch's CUDA
        # caching allocator, every restart, right after weight loading
        # succeeds (28.51GiB logged) - a known PyTorch/NVML gap on
        # MIG-partitioned GPUs the old dense qwen2.5-7b-instruct never
        # hit (Qwen3.6's hybrid linear/full-attention layers take a
        # different CUDA-graph-capture path). --enforce-eager skips
        # graph capture entirely, trading some per-token latency for a
        # startup that doesn't depend on this MIG/NVML interaction.
        # Revisit if a driver/vLLM upgrade fixes the underlying gap.
        - --enforce-eager
        # vLLM defaults to 8000; must match the containerPort below, which
        # the readiness probe, Service and NetworkPolicy all assume is
        # 8080 - verified on-cluster: without this, vLLM serves on 8000
        # while everything else probes 8080, so the pod never goes Ready.
        - --port=8080
        # ADR-0415: required for components/ai-gateway's generate_image
        # tool-calling (arkos/cognos's C3/local-only routing means their
        # reasoning call - which decides WHETHER to call generate_image,
        # never the OVHcloud call itself - reaches this model first, per
        # provider-routing.yaml's local-first fallback order; without
        # this flag vLLM's OpenAI-compatible server does not parse
        # tool_calls out of the model's own output at all).
        # ADR-0518: parser switched hermes -> qwen3_xml for Qwen3.6's
        # XML-style tool-call format; both names verified present in the
        # live image's --help (vllm 0.21.0+rhaiv.10).
        - --enable-auto-tool-choice
        - --tool-call-parser=qwen3_xml
        # ADR-0518: Qwen3.6 is a hybrid-thinking model - without a
        # reasoning parser its <think> blocks would land in message
        # content and leak into agent replies; with it they arrive
        # separately as reasoning_content, which the agents ignore.
        # Name verified against the live image's ReasoningParserManager.
        - --reasoning-parser=qwen3
{{- if .Values.loraAdapters }}
        # ADR-0301 point 1: vLLM's own native multi-LoRA support, additive
        # to this same ServingRuntime/InferenceService - never a second
        # deployment per adapter. UNVERIFIED against a live cluster (no
        # GPU/vLLM instance in this repo's sandbox to confirm the exact
        # flag syntax against the pinned image.vllm build) - confirm with
        # `--help` on the resolved vLLM image and correct if this
        # cluster's vLLM version expects a different --lora-modules shape
        # (e.g. the newer JSON-per-module form) before relying on it.
        - --enable-lora
        - --lora-modules
        {{- range .Values.loraAdapters }}
        - {{ printf "%s=%s" .name .path | quote }}
        {{- end }}
{{- end }}
      ports:
        - containerPort: 8080
          protocol: TCP
      # No readOnlyRootFilesystem: vLLM writes a HuggingFace/compilation cache
      # under its container filesystem at startup, and the exact writable paths
      # aren't verified. Pod-level runAsNonRoot/seccompProfile aren't set
      # either: the `model:` shorthand doesn't reliably expose that override.
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        {{- toYaml .Values.resources | nindent 8 }}
  multiModel: false
