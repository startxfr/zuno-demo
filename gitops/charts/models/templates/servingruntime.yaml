# Namespace-scoped ServingRuntime (KServe), not ClusterServingRuntime, so it
# stays inside this chart's namespace-per-agent-adjacent isolation model
# (the model-serving layer is shared platform, per ADR-0007, but scoped to
# zuno-datascience rather than the default ClusterServingRuntime catalog).
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: {{ .Values.servingRuntimeName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
spec:
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  containers:
    - name: kserve-container
      image: "{{ .Values.image.vllm }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      args:
        - --model=/mnt/models
        - --served-model-name={{ .Values.modelId }}
        - --max-model-len=8192
      ports:
        - containerPort: 8080
          protocol: TCP
      resources:
        {{- toYaml .Values.resources | nindent 8 }}
  multiModel: false
