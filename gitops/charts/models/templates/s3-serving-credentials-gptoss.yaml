{{- /*
ADR-0412: S3 read credentials for the gpt-oss-20b predictor. Same KServe
convention as s3-serving-credentials.yaml (annotated Secret + SA), but
UNCONDITIONAL: gpt-oss-20b is S3-only, so its credentials must not
disappear when modelStorage.downloadJob.enabled flips the qwen chart
back to PVC mode (which un-renders the qwen SA/Secret pair). Its own
names, same Vault credential.
*/ -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.gptOssModel.inferenceServiceName }}-s3-credentials
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: {{ .Values.gptOssModel.inferenceServiceName }}-s3-credentials
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          serving.kserve.io/s3-endpoint: {{ .Values.modelsS3.endpoint | quote }}
          serving.kserve.io/s3-region: {{ .Values.modelsS3.region | quote }}
          serving.kserve.io/s3-usehttps: "1"
          serving.kserve.io/s3-verifyssl: "1"
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.modelsS3.externalSecret.remoteKey | quote }}
        property: {{ .Values.modelsS3.externalSecret.accessKeyProperty | quote }}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.modelsS3.externalSecret.remoteKey | quote }}
        property: {{ .Values.modelsS3.externalSecret.secretKeyProperty | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.gptOssModel.inferenceServiceName }}-s3
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
secrets:
  - name: {{ .Values.gptOssModel.inferenceServiceName }}-s3-credentials
