{{- /*
ADR-0537 (WP-106, Phase 3), generalised by WP-157 step 3 (ADR-0570): one
ExternalModel per ENABLED entry of .Values.externalModels, each with its
mirror ExternalSecret. Replaces the two per-provider templates
(externalmodel-mistral.yaml, externalmodel-ovhcloud-gpt-oss-120b.yaml); the
two entries that existed then render the same objects as before
(`helm template` diff recorded in the WP-157 brief's progress note).

Schema (`oc explain externalmodels.maas.opendatahub.io --recursive`,
captured read-only on demo333, 2026-10-24): spec.{credentialRef.name,
endpoint, provider, targetModel}, all required, `provider` a free string.
Group maas.opendatahub.io per WP-157 decision D10.

Mirror ExternalSecret: same Vault path/property as the matching
platform/ai-gateway/externalsecret-<provider>.yaml (the gateway's own direct
credential), but a SEPARATE target Secret whose data key is literally
"api-key" - ExternalModel.spec.credentialRef requires that exact key, while
the gateway's Secrets use "api_key". ADR-0416/ADR-0415's "one key per
account" principle stays intact: a second Kubernetes Secret pointing at the
same Vault value, never a new Vault path or credential. Rendered in
.Values.namespace (zuno-ai-run, WP-157 decision D11) and ONLY for an enabled
entry, so a disabled provider never materialises its key anywhere new.

An entry is enabled unless it says `enabled: false`; the entries added by
WP-157 ship disabled until their live test (inventory V2-V4) passes.
*/ -}}
{{- range .Values.externalModels }}
{{- if ne (toString .enabled) "false" }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}
  namespace: {{ $.Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    # Must exist before the ExternalModel below references it.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .secretName }}
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: {{ .vault.path }}
        property: {{ .vault.property }}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpoint: {{ .endpoint }}
  provider: {{ .provider }}
  targetModel: {{ .targetModel | quote }}
  credentialRef:
    name: {{ .secretName }}
---
{{- end }}
{{- end }}
