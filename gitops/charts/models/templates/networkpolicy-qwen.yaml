# ADR-0521: qwen3.6-27b-instruct is now an LLMInferenceService, not a
# classic InferenceService predictor - its workload pod carries
# app.kubernetes.io/name/kserve.io/component labels, not
# serving.kserve.io/inferenceservice, and its OpenAI-compatible API
# listens on port 8000, not 8080 (same shape as
# templates/networkpolicy-gptoss.yaml, which this file mirrors).
# maas-default-gateway is now allowed below (WP-076 step 2, once qwen got
# its own MaaSModelRef in templates/maas.yaml) - same gap that 504'd every
# MaaS request for gpt-oss-20b AFTER auth/subscription/TRLP had already
# passed (ADR-0201/WP-27, 2026-08-25): the MaaS data path routes gateway
# -> (EPP-selected) workload pod :8000 directly, and without this rule the
# connection is silently dropped at the outer HAProxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.inferenceServiceName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.inferenceServiceName }}
      kserve.io/component: workload
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ai-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: rag-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: maas-default-gateway
      ports:
        - protocol: TCP
          port: 8000
{{- if .Values.lightspeed.enabled }}
    # ADR-0524: OpenShift Lightspeed calling this predictor DIRECTLY, while the
    # MaaS control plane is unable to match any identity to a subscription (403
    # "no matching subscription found for user", reproduced 2026-08-27 for the
    # known-good ai-gateway identity on an untouched model - WP-076 scope).
    #
    # This is a DELIBERATE, TEMPORARY regression of ADR-0521 ("route local model
    # traffic through MaaS"), scoped to one namespace and one port. Remove this
    # block and flip lightspeed-config's provider.endpointMode back to `maas`
    # once MaaS resolves subscriptions again - the rest of the Lightspeed wiring
    # (entitlement, MaaSSubscription, OPA subject) is already in place and
    # untouched, so the revert is those two edits and nothing else.
    #
    # namespaceSelector rather than podSelector: Lightspeed's pods are
    # operator-owned and carry no label this chart controls.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.lightspeed.namespace }}
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
{{- if .Values.metrics.enabled }}
    # ADR-0413, corrected by ADR-0554's dated correction note
    # (2026-09-09): this IS load-bearing, contrary to what this comment
    # used to say ("NOT actually needed... RHOAI's own controller scrapes
    # it independently"). RHOAI's Observe & Monitor > Models dashboard tab
    # reads from `cluster-prometheus-datasource` -
    # thanos-querier.openshift-monitoring.svc (prometheus-k8s+UWM), NOT
    # data-science-monitoringstack. `up{namespace="zuno-ai-run"}` queried
    # directly against it showed qwen36-27b-instruct (this file) at up=1
    # while qwen35-9b/gpt-oss-20b/qwen35-9b-wesh - which never had this
    # admission block until this same date - were up=0. This rule is the
    # entire reason this model's dashboard row ever worked while
    # investigating why the other three didn't.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - protocol: TCP
          port: 8000
    # ADR-0554: RHOAI's own separate MonitoringStack (data-science-
    # monitoringstack, redhat-ods-monitoring) ALSO scrapes the PodMonitor
    # directly (kserve-llm-isvc-vllm-engine, targetPort 8000) - a third,
    # independent consumer, not the dashboard's data source (see above)
    # but real nonetheless (e.g. any future RHOAI-native surface built on
    # that stack instead of the platform's Thanos).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ods-monitoring
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
{{- if .Values.lmEval.enabled }}
    # ADR-0108/WP-10: admits the LMEvalJob pod's (lmevaljob.yaml) calls to
    # this workload Service. Missing this allowed every request from that
    # pod to silently time out at the network layer - verified live
    # 2026-08-21 for the old classic-predictor shape; same failure mode
    # applies to the new port.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lm-eval
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
