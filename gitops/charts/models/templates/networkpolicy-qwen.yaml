# ADR-0521: qwen3.6-27b-instruct is now an LLMInferenceService, not a
# classic InferenceService predictor - its workload pod carries
# app.kubernetes.io/name/kserve.io/component labels, not
# serving.kserve.io/inferenceservice, and its OpenAI-compatible API
# listens on port 8000, not 8080 (same shape as
# templates/networkpolicy-gptoss.yaml, which this file mirrors).
# maas-default-gateway is now allowed below (WP-076 step 2, once qwen got
# its own MaaSModelRef in templates/maas.yaml) - same gap that 504'd every
# MaaS request for gpt-oss-20b AFTER auth/subscription/TRLP had already
# passed (ADR-0201/WP-27, 2026-08-25): the MaaS data path routes gateway
# -> (EPP-selected) workload pod :8000 directly, and without this rule the
# connection is silently dropped at the outer HAProxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.inferenceServiceName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.inferenceServiceName }}
      kserve.io/component: workload
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ai-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: rag-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: maas-default-gateway
      ports:
        - protocol: TCP
          port: 8000
{{- if .Values.metrics.enabled }}
    # ADR-0413: admits prometheus-k8s's scrape of vLLM's own /metrics
    # endpoint. NOT actually needed once this became an LLMInferenceService
    # (RHOAI's own controller scrapes it independently - see
    # templates/servicemonitor-vllm.yaml's comment) but kept harmless/
    # symmetric with the port-8000 shape rather than special-cased away.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
{{- if .Values.lmEval.enabled }}
    # ADR-0108/WP-10: admits the LMEvalJob pod's (lmevaljob.yaml) calls to
    # this workload Service. Missing this allowed every request from that
    # pod to silently time out at the network layer - verified live
    # 2026-08-21 for the old classic-predictor shape; same failure mode
    # applies to the new port.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lm-eval
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
