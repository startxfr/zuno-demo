# Dedicated StorageClass for pvc-model.yaml, pinned to modelStorage.zone via
# allowedTopologies with volumeBindingMode: Immediate - unlike the cluster's
# default gp3-csi (WaitForFirstConsumer), this binds the PV as soon as the
# PVC is created, with no first-consumer pod required. That matters here
# because job-model-download.yaml and templates/inferenceservice.yaml are
# both plain sync-wave resources (not ArgoCD hooks): making the PVC a hook so
# it could share a wave with its "first consumer" caused ArgoCD to delete and
# recreate the PVC - and its ~15GB downloaded model - on every resync
# (verified on-cluster). Immediate binding removes the need for that
# first-consumer trick entirely, so the PVC can be a normal, stable,
# never-recreated resource. reclaimPolicy: Retain (unlike gp3-csi's Delete):
# this backs a deliberate model cache: an accidental PVC deletion should
# require deliberately reclaiming the PV too, not silently lose ~15GB and
# force a redownload. Same encrypted gp3 parameters as gp3-csi.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.inferenceServiceName }}-model
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
provisioner: ebs.csi.aws.com
parameters:
  encrypted: "true"
  type: gp3
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowedTopologies:
  - matchLabelExpressions:
      - key: topology.kubernetes.io/zone
        values:
          - {{ .Values.modelStorage.zone }}
