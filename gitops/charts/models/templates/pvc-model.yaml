# Backs the chat model's storageUri: pvc:// (templates/inferenceservice.yaml)
# instead of the GPU node's ephemeral disk - see values.yaml's modelStorage
# comment. A PreSync hook, same sync-wave as job-model-download.yaml's
# PreSync hook: gp3-csi is WaitForFirstConsumer, so this PVC only binds once
# the download Job's pod (which mounts it) is scheduled - putting the PVC in
# an earlier wave than its only consumer would deadlock ArgoCD waiting for
# a health state ("Bound") nothing can reach yet. No hook-delete-policy: this
# must survive every sync, not be recreated like the Job.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.inferenceServiceName }}-model
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-20"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.modelStorage.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.modelStorage.size }}
