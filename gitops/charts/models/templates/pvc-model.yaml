{{- /*
Only rendered in the legacy HF-predownload mode - gated TOGETHER with
job-model-download.yaml (and inferenceservice.yaml's storageUri branch) by
modelStorage.downloadJob.enabled: a PVC without its consumer Job deadlocks
a fresh sync (see the wave comment below), and with automated.prune an
un-rendered PVC is deleted out from under the running predictor - so the
three always flip as one unit. See values.yaml's modelStorage comment.
*/ -}}
{{- if .Values.modelStorage.downloadJob.enabled }}
# Backs the chat model's storageUri: pvc:// (templates/inferenceservice.yaml)
# instead of the GPU node's ephemeral disk - see values.yaml's modelStorage
# comment. A normal sync-wave resource (not an ArgoCD PreSync hook, unlike
# an earlier version of this chart): verified on-cluster, making the PVC a
# hook so it could share a sync-wave with job-model-download.yaml (its
# first consumer, needed since gp3-csi is WaitForFirstConsumer) caused
# ArgoCD to delete and recreate the PVC - and its ~15GB downloaded model -
# on every resync. SAME sync-wave as the Job (-15), not one wave ahead:
# VERIFIED live 2026-08-17 (ADR-0351 rollout) - with the PVC alone in an
# earlier wave, a fresh create deadlocks the whole sync: ArgoCD's default
# PVC health treats the (perfectly normal) WaitForFirstConsumer Pending
# phase as Progressing and never advances to the wave holding the Job
# whose pod is the only thing that can bind it ("waiting for healthy
# state of /PersistentVolumeClaim/..."). In one shared wave ArgoCD
# applies both objects (PVC before Job by its kind ordering), the Job's
# pod schedules, the PVC binds, and the wave turns healthy. ArgoCD still
# only touches this object when its own spec actually changes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.inferenceServiceName }}-model
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.modelStorage.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.modelStorage.size }}
{{- end }}
