# Backs the chat model's storageUri: pvc:// (templates/inferenceservice.yaml)
# instead of the GPU node's ephemeral disk - see values.yaml's modelStorage
# comment. Uses storageclass-model.yaml's dedicated, Immediate-binding,
# zone-pinned StorageClass rather than the cluster's WaitForFirstConsumer
# gp3-csi default - see that file's comment for why: a normal sync-wave
# resource here (not an ArgoCD hook) is what lets this PVC - and the ~15GB
# model on it - survive every resync untouched.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.inferenceServiceName }}-model
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.inferenceServiceName }}-model
  resources:
    requests:
      storage: {{ .Values.modelStorage.size }}
