# One-time download of {{ .Values.modelId }} into pvc-model.yaml's PVC.
# Reuses the exact odh-kserve-storage-initializer image/args/env KServe's
# own hf:// init container already uses on this cluster (verified against
# the live InferenceService's generated pod spec), so this is a plain
# one-off run of the same download path, not a new one. A normal sync-wave
# resource, not an ArgoCD hook - see pvc-model.yaml/storageclass-model.yaml
# for why: hook-based Job+PVC pairing caused ArgoCD to delete and recreate
# the PVC (and its downloaded model) on every resync. As a normal resource,
# ArgoCD leaves this Job alone once applied (no diff = no reapply attempt,
# and Jobs are immutable so a genuine spec change would need a manual
# `oc delete job` first - acceptable for a run-once download). nodeSelector
# pins this to modelStorage.zone, matching the StorageClass's
# allowedTopologies and the predictor's own nodeSelector (same value) - see
# values.yaml's modelStorage comment.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.inferenceServiceName }}-model-download
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        topology.kubernetes.io/zone: {{ .Values.modelStorage.zone }}
      containers:
        - name: storage-initializer
          image: {{ .Values.modelStorage.initializerImage }}
          args:
            - "hf://{{ .Values.modelId }}"
            - /mnt/pvc/model
          env:
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
            - name: HF_XET_NUM_CONCURRENT_RANGE_GETS
              value: "8"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: 100Mi
            limits:
              cpu: "1"
              memory: 24Gi
          volumeMounts:
            - name: model-pvc
              mountPath: /mnt/pvc
      volumes:
        - name: model-pvc
          persistentVolumeClaim:
            claimName: {{ .Values.inferenceServiceName }}-model
