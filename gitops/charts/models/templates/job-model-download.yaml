# One-time download of {{ .Values.modelId }} into pvc-model.yaml's PVC
# (gp3-csi, WaitForFirstConsumer - this Job's pod is that first consumer,
# which is why both share sync-wave -15: see pvc-model.yaml for the
# verified deadlock when the PVC sat alone in an earlier wave). Reuses the
# exact odh-kserve-storage-initializer image/args/env KServe's own hf://
# init container already uses on this cluster (verified against the live
# InferenceService's generated pod spec), so this is a plain one-off run of
# the same download path, not a new one. A normal sync-wave resource, not
# an ArgoCD hook - see pvc-model.yaml for why. ArgoCD leaves this Job alone
# once applied (no diff = no reapply attempt, and Jobs are immutable so a
# genuine spec change would need a manual `oc delete job` first - acceptable
# for a run-once download). nodeSelector requires a GPU-bearing node (any
# zone), matching the predictor's own nodeSelector - see values.yaml's
# modelStorage comment for why gp3-csi being single-AZ makes staying in
# sync with the predictor matter, even though neither hardcodes a zone.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.inferenceServiceName }}-model-download
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: storage-initializer
          image: {{ .Values.modelStorage.initializerImage }}
          args:
            - "hf://{{ .Values.modelId }}"
            - /mnt/pvc/model
          env:
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
            - name: HF_XET_NUM_CONCURRENT_RANGE_GETS
              value: "8"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: 100Mi
            limits:
              cpu: "1"
              memory: 24Gi
          volumeMounts:
            - name: model-pvc
              mountPath: /mnt/pvc
      volumes:
        - name: model-pvc
          persistentVolumeClaim:
            claimName: {{ .Values.inferenceServiceName }}-model
