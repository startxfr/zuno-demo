{{- /*
ADR-0414 (supersedes ADR-0412): gpt-oss-20b as an LLMInferenceService,
replacing the old classic InferenceService + dedicated ServingRuntime
(templates/inferenceservice-gptoss.yaml, templates/servingruntime-gptoss.yaml
- both removed). Forced by MaaSModelRef.spec.modelRef.kind's hard enum
(LLMInferenceService | ExternalModel only, confirmed via `oc explain
maasmodelref.spec.modelRef.kind`) - the only way to fold the old dedicated
qwen25-7b-instruct-maas-backend copy into this model is for gpt-oss-20b
itself to be an LLMInferenceService. One deployment now serves two access
paths:
  - ai-gateway's own local routing (platform/ai-gateway/provider-routing.yaml)
    calls this LLMInferenceService's plain -kserve-workload-svc Service
    directly (port 8000 - confirmed live against the qwen-maas-backend
    equivalent: a real OpenAI-compatible vLLM /v1 API, not an internal-only
    port), bypassing router/gateway entirely.
  - MaaS clients reach it through the router/gateway config below, same
    mechanism templates/maas.yaml used for the old dedicated backend.
S3-only, same as before: no PVC/download-Job mode exists for this model.
ADR-0521 (WP-076): .Values.maas restructured from one hardcoded model into
a .Values.maas.models list (qwen3.6-27b-instruct joined) - $gptOssMaas
below finds this model's own entry by backendInferenceServiceName rather
than assuming it's the only one.
*/ -}}
{{- $gptOssMaas := "" }}
{{- range .Values.maas.models }}
{{- if eq .backendInferenceServiceName $.Values.gptOssModel.inferenceServiceName }}
{{- $gptOssMaas = . }}
{{- end }}
{{- end }}
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: {{ .Values.gptOssModel.inferenceServiceName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  {{- if .Values.gptOssModel.llmInferenceService.podAnnotations }}
  # ADR-0521 (WP-076): propagates through the generated Deployment's pod
  # template to the Istio injector (verified live on qwen's own
  # LLMInferenceService, same mechanism) - see values.yaml's
  # gptOssModel.llmInferenceService.podAnnotations comment.
  annotations:
    {{- toYaml .Values.gptOssModel.llmInferenceService.podAnnotations | nindent 4 }}
  {{- end }}
  baseRefs:
    - name: {{ .Values.gptOssModel.llmInferenceService.baseRef }}
  model:
    uri: "s3://{{ .Values.modelsS3.bucket }}/{{ .Values.modelsS3.prefix }}/{{ .Values.gptOssModel.servedModelName }}/"
    name: {{ .Values.gptOssModel.servedModelName | quote }}
  replicas: {{ .Values.gptOssModel.minReplicas }}
  template:
    # Same generic GPU-family guard the other GPU workloads use; the
    # resources request's mig-1g.24gb type is the real scheduling steer
    # (WP-083: both permanent MIG nodes now advertise it, so this no longer
    # pins the pod to one node on its own).
    nodeSelector:
      nvidia.com/gpu.present: "true"
    {{- if .Values.spreadAcrossGpuNodes }}
    # WP-086: mirror image of the qwen predictor's term - the same selector on
    # both pods is what makes the scheduler put them on different nodes. See
    # llminferenceservice-qwen.yaml for why a custom shared label is not
    # available on LLMInferenceService pod templates.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  kserve.io/component: workload
    {{- end }}
    serviceAccountName: {{ .Values.gptOssModel.llmInferenceService.serviceAccountName }}
    containers:
      - name: main
        args:
          - --max-model-len={{ .Values.gptOssModel.maxModelLen }}
          # ADR-0415: same generate_image tool-calling requirement as
          # servingruntime.yaml's qwen args (see that file's comment) -
          # gpt-oss-20b is arkos/cognos's own first fallback within their
          # C3/local-only chain, and the reflexional-task preference
          # (policies/model-routing/model-routing-policy.yaml) puts it
          # FIRST for several agents. `openai` is vLLM's documented
          # tool-call parser for gpt-oss's own Harmony response format.
          # UNVERIFIED against a live cluster - confirm with `--help` on
          # the resolved vLLM image before relying on it.
          - --enable-auto-tool-choice
          - --tool-call-parser=openai
          {{- if .Values.tracing.enabled }}
          # ADR-0523 (WP-082): same vLLM native OTel tracing activation as
          # llminferenceservice-qwen.yaml - see that file's comment.
          - --otlp-traces-endpoint={{ .Values.tracing.exporterEndpoint }}
          {{- end }}
          {{- if and .Values.maas.enabled $gptOssMaas }}
          # ADR-0201 (WP-27), 2026-08-25: MaaS clients name this model by the
          # policy plane's identity (<namespace>/<MaaSModelRef name>) in the
          # request body - proven live to traverse auth/subscription/TRLP and
          # reach vLLM, which then 404'd on the unknown name. KServe's
          # generated launcher passes `--served-model-name "<model.name>"
          # "publishers/<ns>/models/<name>"` BEFORE these chart args ($@), and
          # vLLM's argparse takes the LAST occurrence of the flag - so this
          # list must REPEAT both KServe names and append the MaaS alias, or
          # it would replace them and break ai-gateway's direct calls and the
          # header-form route. Verify after rollout: the workload's
          # /v1/models must list all three.
          - --served-model-name
          - {{ .Values.gptOssModel.servedModelName | quote }}
          - "publishers/{{ .Values.namespace }}/models/{{ .Values.gptOssModel.inferenceServiceName }}"
          - "{{ .Values.namespace }}/{{ $gptOssMaas.publishedName }}"
          {{- end }}
        resources:
          {{- toYaml .Values.gptOssModel.resources | nindent 10 }}
  router:
    # An explicit ref is mandatory: an empty gateway: {} does not
    # auto-create or reuse a Gateway on this RHOAI build, and omitting the
    # ref makes KServe fall back to a non-existent cluster default. Which
    # Gateway, and why it must not be maas-default-gateway, is documented in
    # values.yaml's routerGateway block.
    gateway:
      refs:
        - name: {{ .Values.gptOssModel.llmInferenceService.routerGateway.name }}
          namespace: {{ .Values.gptOssModel.llmInferenceService.routerGateway.namespace }}
    # Was `route: {}` (controller-generated spec). Now supplied explicitly
    # solely to make the rule names unique per model - see
    # templates/_llmisvc-route.tpl for the shared-gateway EPP-override
    # collision (empty-body incident) this works around.
    route:
      http:
        spec:
          {{- include "models.llmisvcRouteSpec" (dict
                "name" .Values.gptOssModel.inferenceServiceName
                "namespace" .Values.namespace
                "publishedModel" .Values.gptOssModel.servedModelName
                "gatewayName" .Values.gptOssModel.llmInferenceService.routerGateway.name
                "gatewayNamespace" .Values.gptOssModel.llmInferenceService.routerGateway.namespace) | nindent 10 }}
    # scheduler: {} is not optional - the controller's own defaulting
    # always adds it to a gateway-enabled LLMInferenceService regardless
    # of what this manifest sends. annotations here land on the generated
    # scheduler (EPP) pod - see values.yaml's schedulerAnnotations comment
    # for why excludeInboundPorts is set (ADR-0201/WP-27).
    scheduler:
      annotations:
        {{- toYaml .Values.gptOssModel.llmInferenceService.schedulerAnnotations | nindent 8 }}
