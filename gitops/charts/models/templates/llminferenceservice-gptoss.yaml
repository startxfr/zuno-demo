{{- /*
ADR-0414 (supersedes ADR-0412): gpt-oss-20b as an LLMInferenceService,
replacing the old classic InferenceService + dedicated ServingRuntime
(templates/inferenceservice-gptoss.yaml, templates/servingruntime-gptoss.yaml
- both removed). Forced by MaaSModelRef.spec.modelRef.kind's hard enum
(LLMInferenceService | ExternalModel only, confirmed via `oc explain
maasmodelref.spec.modelRef.kind`) - the only way to fold the old dedicated
qwen25-7b-instruct-maas-backend copy into this model is for gpt-oss-20b
itself to be an LLMInferenceService. One deployment now serves two access
paths:
  - ai-gateway's own local routing (platform/ai-gateway/provider-routing.yaml)
    calls this LLMInferenceService's plain -kserve-workload-svc Service
    directly (port 8000 - confirmed live against the qwen-maas-backend
    equivalent: a real OpenAI-compatible vLLM /v1 API, not an internal-only
    port), bypassing router/gateway entirely.
  - MaaS clients reach it through the router/gateway config below, same
    mechanism templates/maas.yaml used for the old dedicated backend.
S3-only, same as before: no PVC/download-Job mode exists for this model.
*/ -}}
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: {{ .Values.gptOssModel.inferenceServiceName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  baseRefs:
    - name: {{ .Values.gptOssModel.llmInferenceService.baseRef }}
  model:
    uri: "s3://{{ .Values.modelsS3.bucket }}/{{ .Values.modelsS3.prefix }}/{{ .Values.gptOssModel.servedModelName }}/"
    name: {{ .Values.gptOssModel.servedModelName | quote }}
  replicas: {{ .Values.gptOssModel.minReplicas }}
  template:
    # Same generic GPU-family guard the other GPU workloads use; the
    # resources request's mig-1g.24gb type is the real scheduling steer
    # (only Card A's managed MIG node advertises it).
    nodeSelector:
      nvidia.com/gpu.present: "true"
    serviceAccountName: {{ .Values.gptOssModel.llmInferenceService.serviceAccountName }}
    containers:
      - name: main
        args:
          - --max-model-len={{ .Values.gptOssModel.maxModelLen }}
          # ADR-0415: same generate_image tool-calling requirement as
          # servingruntime.yaml's qwen args (see that file's comment) -
          # gpt-oss-20b is arkos/cognos's own first fallback within their
          # C3/local-only chain, and the reflexional-task preference
          # (policies/model-routing/model-routing-policy.yaml) puts it
          # FIRST for several agents. `openai` is vLLM's documented
          # tool-call parser for gpt-oss's own Harmony response format.
          # UNVERIFIED against a live cluster - confirm with `--help` on
          # the resolved vLLM image before relying on it.
          - --enable-auto-tool-choice
          - --tool-call-parser=openai
        resources:
          {{- toYaml .Values.gptOssModel.resources | nindent 10 }}
  router:
    # An explicit ref is mandatory: an empty gateway: {} does not
    # auto-create or reuse a Gateway on this RHOAI build, and omitting the
    # ref makes KServe fall back to a non-existent cluster default. Which
    # Gateway, and why it must not be maas-default-gateway, is documented in
    # values.yaml's routerGateway block.
    gateway:
      refs:
        - name: {{ .Values.gptOssModel.llmInferenceService.routerGateway.name }}
          namespace: {{ .Values.gptOssModel.llmInferenceService.routerGateway.namespace }}
    route: {}
    # scheduler: {} is not optional - the controller's own defaulting
    # always adds it to a gateway-enabled LLMInferenceService regardless
    # of what this manifest sends. annotations here land on the generated
    # scheduler (EPP) pod - see values.yaml's schedulerAnnotations comment
    # for why excludeInboundPorts is set (ADR-0201/WP-27).
    scheduler:
      annotations:
        {{- toYaml .Values.gptOssModel.llmInferenceService.schedulerAnnotations | nindent 8 }}
