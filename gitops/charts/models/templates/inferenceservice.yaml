# KServe pulls the model weights from Hugging Face at pod start via the
# storageUri's `hf://` scheme (RHOAI's supported storage initializer) -
# demo scope, no offline/mirrored model cache. First pull is slow (~15GB);
# this is the dominant contributor to first-token latency on a cold start,
# separate from the steady-state <6s objective (README.md).
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ .Values.inferenceServiceName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    # ADR-0047/ADR-0048: explicit, belt-and-suspenders with the
    # DataScienceCluster's cluster-wide kserve.serving.managementState:
    # Removed (ansible/roles/openshift_ai/tasks/prepare.yml) - this one
    # always-on model (minReplicas == maxReplicas, no scale-to-zero need)
    # has no use for Serverless/Knative, which would otherwise require the
    # Service Mesh and Serverless operators plus cert-manager, none of
    # which this repository installs.
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: {{ .Values.minReplicas }}
    maxReplicas: {{ .Values.maxReplicas }}
    model:
      modelFormat:
        name: vLLM
      runtime: {{ .Values.servingRuntimeName }}
      storageUri: "hf://{{ .Values.modelId }}"
      resources:
        {{- toYaml .Values.resources | nindent 8 }}
