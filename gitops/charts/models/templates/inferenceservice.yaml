# Two storage modes, switched by modelStorage.downloadJob.enabled (see
# values.yaml's modelStorage comment for the flag's full rationale and why
# it flips this file, pvc-model.yaml and job-model-download.yaml as one
# unit):
# - enabled (legacy): weights predownloaded once into a PVC, storageUri:
#   pvc:// mounts it directly - no download at pod start. Chosen originally
#   because the GPU node's 75GB ephemeral root disk couldn't hold the CUDA
#   vLLM image + a fresh ~15GB hf:// download + NVIDIA driver build
#   artifacts at once (verified on-cluster: kubelet evicted the pod).
# - disabled (install-time default since 2026-08-18): storageUri: s3://
#   reads the copy staged in modelsS3, authenticated through
#   templates/s3-serving-credentials.yaml's ServiceAccount - same
#   mechanism the MaaS LLMInferenceService already uses (maas.yaml). The
#   per-(re)start download returns, but from same-region S3 rather than a
#   flaky HF transfer, and with no single-AZ PVC pinning the predictor
#   can follow the GPU wherever it is.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ .Values.inferenceServiceName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # RawDeployment: this always-on model has no need for Serverless/Knative.
    serving.kserve.io/deploymentMode: Standard
spec:
  predictor:
    minReplicas: {{ .Values.minReplicas }}
    maxReplicas: {{ .Values.maxReplicas }}
    {{- if .Values.modelStorage.downloadJob.enabled }}
    # Must match job-model-download.yaml's nodeSelector: the PVC (RWO,
    # single-AZ EBS) binds in whichever zone that Job's pod lands in - see
    # values.yaml's modelStorage comment. Neither hardcodes a zone: both
    # just require a GPU-bearing node, so whichever zone the download Job
    # happens to land its pod in, the PVC's resulting node-affinity keeps
    # this predictor pinned to a matching (GPU) node in that same zone.
    {{- else }}
    # S3 mode has no PVC/zone coupling - any GPU-bearing node works.
    {{- end }}
    nodeSelector:
      nvidia.com/gpu.present: "true"
    {{- if not .Values.modelStorage.downloadJob.enabled }}
    # Carries the serving.kserve.io/s3-* annotated Secret KServe's
    # storage-initializer auto-detects for the s3:// storageUri below
    # (templates/s3-serving-credentials.yaml).
    serviceAccountName: {{ .Values.inferenceServiceName }}-s3
    {{- end }}
    model:
      modelFormat:
        name: vLLM
      runtime: {{ .Values.servingRuntimeName }}
      {{- if .Values.modelStorage.downloadJob.enabled }}
      storageUri: "pvc://{{ .Values.inferenceServiceName }}-model/model"
      {{- else }}
      # <prefix>/<servedModelName>/ is the bucket's layout convention -
      # the same directory maas.yaml's model.uri points at (one shared
      # copy, two serving paths).
      storageUri: "s3://{{ .Values.modelsS3.bucket }}/{{ .Values.modelsS3.prefix }}/{{ .Values.servedModelName }}/"
      {{- end }}
      resources:
        {{- toYaml .Values.resources | nindent 8 }}
