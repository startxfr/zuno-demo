# Model weights are pulled from Hugging Face at pod start (hf://), no
# offline/mirrored cache; first pull (~15GB) dominates cold-start latency.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ .Values.inferenceServiceName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # RawDeployment: this always-on model has no need for Serverless/Knative.
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: {{ .Values.minReplicas }}
    maxReplicas: {{ .Values.maxReplicas }}
    model:
      modelFormat:
        name: vLLM
      runtime: {{ .Values.servingRuntimeName }}
      storageUri: "hf://{{ .Values.modelId }}"
      resources:
        {{- toYaml .Values.resources | nindent 8 }}
