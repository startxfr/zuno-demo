# Model weights are predownloaded once into a PVC (templates/pvc-model.yaml
# + templates/job-model-download.yaml) rather than pulled from Hugging Face
# on every pod (re)start: the GPU node's ephemeral root disk can't hold the
# CUDA vLLM image + a fresh ~15GB hf:// download + NVIDIA driver build
# artifacts at once (verified on-cluster: kubelet evicted the pod for
# ephemeral-storage pressure). storageUri: pvc:// makes KServe mount the
# PVC directly - no storage-initializer/download step at pod start.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ .Values.inferenceServiceName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # RawDeployment: this always-on model has no need for Serverless/Knative.
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: {{ .Values.minReplicas }}
    maxReplicas: {{ .Values.maxReplicas }}
    # Must match job-model-download.yaml's nodeSelector: the PVC (RWO,
    # single-AZ EBS) binds in whichever zone that Job's pod lands in - see
    # values.yaml's modelStorage comment.
    nodeSelector:
      topology.kubernetes.io/zone: {{ .Values.modelStorage.zone }}
    model:
      modelFormat:
        name: vLLM
      runtime: {{ .Values.servingRuntimeName }}
      storageUri: "pvc://{{ .Values.inferenceServiceName }}-model/model"
      resources:
        {{- toYaml .Values.resources | nindent 8 }}
