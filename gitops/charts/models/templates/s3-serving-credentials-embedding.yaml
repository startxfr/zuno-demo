{{- /*
S3 read credentials for the embedding predictor (ADR-0518). Same KServe
convention as the chat predictor (s3-serving-credentials.yaml) and the
gptOss pair: an ExternalSecret materializes the Vault "rag/s3" credential
into a Secret carrying the serving.kserve.io/s3-* annotations, and a
ServiceAccount referencing that Secret is what the InferenceService's
storage-initializer auto-detects. Unconditional, unlike the chat pair:
the embedding model has no PVC-predownload mode to switch against - it
always serves from modelsS3 (its previous hf:// pull-at-pod-start was
the last HF-at-runtime dependency in the serving path, retired by
ADR-0518). Its OWN Secret/SA pair for the same reason the chat model has
one: renaming a shared SA would roll unrelated working predictors.
Sync-wave -5 so both exist before the wave-0 InferenceService references
them.
*/ -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.embeddingModel.inferenceServiceName }}-s3-credentials
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: {{ .Values.embeddingModel.inferenceServiceName }}-s3-credentials
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          serving.kserve.io/s3-endpoint: {{ .Values.modelsS3.endpoint | quote }}
          serving.kserve.io/s3-region: {{ .Values.modelsS3.region | quote }}
          serving.kserve.io/s3-usehttps: "1"
          serving.kserve.io/s3-verifyssl: "1"
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.modelsS3.externalSecret.remoteKey | quote }}
        property: {{ .Values.modelsS3.externalSecret.accessKeyProperty | quote }}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.modelsS3.externalSecret.remoteKey | quote }}
        property: {{ .Values.modelsS3.externalSecret.secretKeyProperty | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.embeddingModel.inferenceServiceName }}-s3
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
secrets:
  - name: {{ .Values.embeddingModel.inferenceServiceName }}-s3-credentials
