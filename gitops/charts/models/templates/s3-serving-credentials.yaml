{{- /*
S3 read credentials for the chat model's LLMInferenceService
(templates/llminferenceservice-qwen.yaml), which reads
s3://<modelsS3.bucket>/... directly - UNCONDITIONAL since ADR-0521 removed
the classic-InferenceService/PVC-predownload mode this used to be gated on
(the old modelStorage.downloadJob.enabled flag). Same KServe convention as
gpt-oss-20b's own pair (s3-serving-credentials-gptoss.yaml, verified live
2026-08-18): an ExternalSecret materializes the Vault "rag/s3" credential
into a Secret carrying the serving.kserve.io/s3-* annotations, and a
ServiceAccount referencing that Secret is what the storage-initializer
auto-detects. Deliberately its OWN Secret/SA pair rather than reusing the
gpt-oss-20b-named ones: pointing either LLMInferenceService at the other's
SA would roll a working backend for a naming cleanup. Sync-wave -5 so both
exist before the wave-0 LLMInferenceService references them.
*/ -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.inferenceServiceName }}-s3-credentials
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: {{ .Values.inferenceServiceName }}-s3-credentials
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          serving.kserve.io/s3-endpoint: {{ .Values.modelsS3.endpoint | quote }}
          serving.kserve.io/s3-region: {{ .Values.modelsS3.region | quote }}
          serving.kserve.io/s3-usehttps: "1"
          serving.kserve.io/s3-verifyssl: "1"
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.modelsS3.externalSecret.remoteKey | quote }}
        property: {{ .Values.modelsS3.externalSecret.accessKeyProperty | quote }}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.modelsS3.externalSecret.remoteKey | quote }}
        property: {{ .Values.modelsS3.externalSecret.secretKeyProperty | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.inferenceServiceName }}-s3
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
secrets:
  - name: {{ .Values.inferenceServiceName }}-s3-credentials
