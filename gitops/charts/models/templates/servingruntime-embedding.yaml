# Namespace-scoped ServingRuntime, not ClusterServingRuntime, to keep this
# scoped to zuno-ai-run rather than the cluster-wide catalog. The chat
# model's own classic ServingRuntime this used to sit alongside was
# retired under ADR-0521 (it's an LLMInferenceService now,
# templates/llminferenceservice-qwen.yaml) - this is the only classic
# ServingRuntime left in this chart.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: {{ .Values.embeddingModel.servingRuntimeName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    # Must sync before inferenceservice-embedding.yaml, which references
    # this runtime by name.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  containers:
    - name: kserve-container
      image: "{{ .Values.image.vllm }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      args:
        - --model=/mnt/models
        - --served-model-name={{ .Values.embeddingModel.servedModelName }}
        # This vLLM version (0.21.0+rhaiv.10) removed --task in favor of
        # --runner/--convert - verified on-cluster: --task=embed fails
        # argparse with "unrecognized arguments" (vllm/config/model.py
        # still defines RunnerOption/ConvertOption, not TaskOption).
        - --runner=pooling
        - --convert=embed
        # vLLM defaults to 8000, but containerPort/readiness/Service/
        # NetworkPolicy all assume 8080.
        - --port=8080
      ports:
        - containerPort: 8080
          protocol: TCP
      # Same rationale as templates/llminferenceservice-qwen.yaml's chat
      # model: vLLM writes a HuggingFace/compilation cache under its
      # container filesystem at startup, so no
      # readOnlyRootFilesystem/runAsNonRoot override here.
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        {{- toYaml .Values.embeddingModel.resources | nindent 8 }}
  multiModel: false
