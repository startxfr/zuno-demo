# ADR-0526 (WP-087): ingress policy for qwen3.5-9b's workload pod.
# An LLMInferenceService workload carries app.kubernetes.io/name +
# kserve.io/component labels (not serving.kserve.io/inferenceservice) and
# serves its OpenAI-compatible API on 8000, not 8080.
#
# THREE callers, and the third is the one that is easy to forget:
# ai-gateway (this model's direct `local-*` provider entry), rag-service
# (kept for symmetry with the other model policies - this chart cannot
# know which role an instance plays), and maas-default-gateway. Omitting
# the gateway peer does NOT fail loudly: the MaaS data path routes
# gateway -> (EPP-selected) workload pod :8000 directly, so the request
# 504s at the outer HAProxy AFTER auth, subscription selection and the
# rate-limit policy have all passed. Worth stating twice because CI will
# not catch it either - platform/security/check_workload_hardening.py
# only asserts that this chart renders at least one NetworkPolicy, never
# that each model has its own.
# ADR-0554 (live-confirmed 2026-09-09): metrics scraping DOES need an
# allowance here - RHOAI's own controller auto-creating the PodMonitor
# (templates/servicemonitor-vllm.yaml's comment) only means the scrape
# TARGET is discovered, not that the scrape request reaches the pod.
# RHOAI's own separate MonitoringStack (data-science-monitoringstack,
# redhat-ods-monitoring) was found dropped at L4 with no admission rule at
# all - see the metrics.enabled block below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.qwen35Model.inferenceServiceName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.qwen35Model.inferenceServiceName }}
      kserve.io/component: workload
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ai-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: rag-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: maas-default-gateway
      ports:
        - protocol: TCP
          port: 8000
{{- if .Values.metrics.enabled }}
    # ADR-0554 (live-confirmed 2026-09-09): admits RHOAI's own separate
    # MonitoringStack (data-science-monitoringstack, redhat-ods-monitoring)
    # scraping the PodMonitor directly (kserve-llm-isvc-vllm-engine,
    # targetPort 8000) - without this rule its requests were dropped at L4,
    # keeping the Observe & Monitor > Models dashboard tab's data empty for
    # this model.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ods-monitoring
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
{{- if .Values.lmEval.enabled }}
    # ADR-0534/WP-109: admits eval-class pods (LMEvalJob + the Garak/eval
    # Jobs in gitops/charts/trustyai-config, all labeled lm-eval) so the
    # PEFT/LoRA base-vs-candidate comparison can benchmark this model -
    # same rule networkpolicy-qwen.yaml has carried since ADR-0108/WP-10.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lm-eval
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
