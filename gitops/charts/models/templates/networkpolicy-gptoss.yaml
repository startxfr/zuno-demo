# ADR-0414: gpt-oss-20b is now an LLMInferenceService, not a classic
# InferenceService predictor - its workload pod carries
# app.kubernetes.io/name/kserve.io/component labels (VERIFIED live against
# the equivalent qwen-maas-backend pods), not serving.kserve.io/inferenceservice,
# and its OpenAI-compatible API listens on port 8000, not 8080 (VERIFIED
# live: curled the kserve-workload-svc equivalent directly). ai-gateway is
# this model's only intended local caller today (the local-gpt-oss
# provider entry, now pointed at this LLMInferenceService's own
# -kserve-workload-svc Service); rag-service is kept in the allow-list for
# symmetry with the qwen policy - this chart can't know which role a given
# instance plays. Metrics scraping is NOT covered here: RHOAI's own
# LLMInferenceService controller scrapes this independently (see
# templates/servicemonitor-vllm.yaml's comment), no NetworkPolicy allowance
# needed from this chart for that path.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.gptOssModel.inferenceServiceName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.gptOssModel.inferenceServiceName }}
      kserve.io/component: workload
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ai-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: rag-service
      ports:
        - protocol: TCP
          port: 8000
