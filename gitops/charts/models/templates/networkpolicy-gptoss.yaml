# ADR-0414: gpt-oss-20b is now an LLMInferenceService, not a classic
# InferenceService predictor - its workload pod carries
# app.kubernetes.io/name/kserve.io/component labels, not
# serving.kserve.io/inferenceservice, and its OpenAI-compatible API
# listens on port 8000, not 8080. ai-gateway is this model's only
# intended local caller today (the local-gpt-oss provider entry, now
# pointed at this LLMInferenceService's own -kserve-workload-svc
# Service); rag-service is kept in the allow-list for symmetry with the
# qwen policy - this chart can't know which role a given instance plays.
# ADR-0201 (WP-27), 2026-08-25: maas-default-gateway is the third caller.
# The MaaS data path routes gateway -> (EPP-selected) workload pod :8000
# directly; with the gateway absent from this allow-list the connection
# is silently dropped and every MaaS request 504s at the outer HAProxy -
# AFTER auth, subscription selection and TRLP all passed (proven live:
# ipp-pre set the header from the body, EPP picked the target, then
# nothing). Same pod-label selector convention the openshift-ai chart's
# maas-gateway.yaml NetworkPolicies already use for this gateway.
# ADR-0554 (live-confirmed 2026-09-09): metrics scraping DOES need a
# NetworkPolicy allowance - RHOAI's own LLMInferenceService controller
# auto-creating the PodMonitor (templates/servicemonitor-vllm.yaml's
# comment) only means the scrape TARGET is discovered, not that the
# scrape request reaches the pod. RHOAI's own separate MonitoringStack
# (data-science-monitoringstack, redhat-ods-monitoring) was found dropped
# at L4 with no admission rule at all - see the metrics.enabled block
# below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.gptOssModel.inferenceServiceName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.gptOssModel.inferenceServiceName }}
      kserve.io/component: workload
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ai-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: rag-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: maas-default-gateway
      ports:
        - protocol: TCP
          port: 8000
{{- if .Values.lightspeed.enabled }}
    # ADR-0524, 2026-09-09: OpenShift Lightspeed calling this predictor
    # DIRECTLY, mirroring networkpolicy-qwen.yaml's own lightspeed.enabled
    # block. MaaS's own AuthPolicy (maas-gateway-auth, generated by RHOAI's
    # maas-controller) denies every inference request through the standard
    # gateway path - its require-group-membership OPA rule derives the
    # model identity from the request PATH (the plain llmISvcName form,
    # e.g. "zuno-ai-run/gpt-oss-20b"), but its allow-list map is only keyed
    # by the MaaS-published form ("zuno-ai-run/gpt-oss-20b-maas") or a
    # third "publishers/<ns>/models/<name>" form - neither is ever the
    # path callers actually use, so the lookup can never match, for any
    # model, for any caller (confirmed for ai-gateway too, live 2026-09-09).
    # This AuthPolicy is entirely maas-controller-owned/regenerated, not
    # patchable from this repo - same class of problem as the
    # payload-processing NetworkPolicy the openshift_ai role's reconcile.yml
    # already fights. DELIBERATE, TEMPORARY regression of ADR-0521 ("route
    # local model traffic through MaaS"), scoped to one namespace and one
    # port. Remove this block and flip lightspeed-config's
    # provider.endpointMode back to `maas` once the AuthPolicy's model
    # identity matching is fixed upstream.
    #
    # namespaceSelector rather than podSelector: Lightspeed's pods are
    # operator-owned and carry no label this chart controls.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.lightspeed.namespace }}
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
{{- if .Values.metrics.enabled }}
    # ADR-0554 (live-confirmed 2026-09-09): admits RHOAI's own separate
    # MonitoringStack (data-science-monitoringstack, redhat-ods-monitoring)
    # scraping the PodMonitor directly (kserve-llm-isvc-vllm-engine,
    # targetPort 8000) - without this rule its requests were dropped at L4.
    # NOT what feeds the Observe & Monitor > Models dashboard tab, though -
    # see the next block for that (dated correction note, ADR-0554).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ods-monitoring
      ports:
        - protocol: TCP
          port: 8000
    # ADR-0554 dated correction (2026-09-09): the actual data source behind
    # RHOAI's "Observe & Monitor > Models" tab is `cluster-prometheus-
    # datasource`, which is the PLATFORM's own thanos-querier
    # (openshift-monitoring, prometheus-k8s+UWM) - a completely different
    # Prometheus from data-science-monitoringstack above. `up{namespace=
    # "zuno-ai-run"}` queried directly against it showed only
    # qwen36-27b-instruct at up=1; this model (and qwen35/wesh) were 0 -
    # networkpolicy-qwen.yaml's own ADR-0413 admission of these two
    # namespaces (kept there, at the time, as "not actually needed") was in
    # fact the ONLY thing keeping qwen36-27b-instruct's dashboard row alive
    # this whole investigation. Mirrored here for real this time.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
