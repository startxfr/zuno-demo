# ADR-0052/ADR-0037: precise ingress allow-list, not a zuno-ai-run namespace
# baseline (see gitops/charts/namespaces/values.yaml's platformNamespaces
# comment). serving.kserve.io/inferenceservice is KServe's own pod label
# on every predictor pod it creates for this InferenceService.
#
# This chart is instantiated once for the local LLM (ai-gateway is the
# caller, same namespace) - if a second instance of this chart is used for
# an embeddings model (rag-service's embeddingServiceUrl points at one,
# gitops/charts/rag-service/values.yaml), rag-service's cross-namespace
# (zuno-data) call needs the same allow, included below unconditionally
# since this chart cannot know which role a given instance plays.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.inferenceServiceName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      serving.kserve.io/inferenceservice: {{ .Values.inferenceServiceName }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ai-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: rag-service
      ports:
        - protocol: TCP
          port: 8080
