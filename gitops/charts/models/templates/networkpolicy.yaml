# Precise ingress allow-list, not a namespace-wide baseline. Both ai-gateway
# (local LLM instance) and rag-service (embeddings instance) are allowed
# unconditionally since this chart can't know which role a given instance plays.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.inferenceServiceName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  podSelector:
    matchLabels:
      serving.kserve.io/inferenceservice: {{ .Values.inferenceServiceName }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ai-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: rag-service
      ports:
        - protocol: TCP
          port: 8080
{{- if .Values.metrics.enabled }}
    # ADR-0413: admits prometheus-k8s's scrape of vLLM's own /metrics
    # endpoint (templates/servicemonitor-vllm.yaml) - same
    # openshift-monitoring/openshift-user-workload-monitoring namespace-only
    # allow-list gitops/charts/openshift-ai/templates/maas-gateway.yaml
    # already uses for the same purpose, scoped to this policy's own port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
{{- if .Values.lmEval.enabled }}
    # ADR-0108/WP-10: admits the LMEvalJob pod's (lmevaljob.yaml) calls to
    # this predictor. Missing this allowed every request from that pod to
    # silently time out at the network layer regardless of path
    # (/v1/completions and /v1/chat/completions alike) - verified live
    # 2026-08-21: the app itself was healthy (200 OK via loopback, zero
    # requests ever reaching its access log from the eval pod), and the
    # 503 "connection timeout" from Envoy is the standard signature of a
    # NetworkPolicy drop, not an mTLS/routing fault.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lm-eval
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
