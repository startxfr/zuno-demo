# Model weights are pulled from Hugging Face at pod start (hf://), no
# offline/mirrored cache; same cold-start caveat as
# templates/inferenceservice.yaml, though this model is far smaller.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ .Values.embeddingModel.inferenceServiceName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # RawDeployment: this always-on model has no need for Serverless/Knative.
    serving.kserve.io/deploymentMode: Standard
spec:
  predictor:
    minReplicas: {{ .Values.embeddingModel.minReplicas }}
    maxReplicas: {{ .Values.embeddingModel.maxReplicas }}
    # No anti-affinity against the chat model anymore (ADR-0351): a hard
    # hostname anti-affinity used to keep the two full-GPU pods from racing
    # for one node's single nvidia.com/gpu, but under MIG they request
    # *different, co-resident* slice resources (this one mig-1g.24gb, the
    # chat model mig-2g.48gb) and packing all inference onto the one
    # permanent GPU node is exactly the intended layout - the old
    # constraint would forbid it outright.
    model:
      modelFormat:
        name: vLLM
      runtime: {{ .Values.embeddingModel.servingRuntimeName }}
      storageUri: "hf://{{ .Values.embeddingModel.modelId }}"
      resources:
        {{- toYaml .Values.embeddingModel.resources | nindent 8 }}
