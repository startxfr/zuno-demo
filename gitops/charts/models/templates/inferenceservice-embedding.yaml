# ADR-0518: weights are read from modelsS3 at pod start (the same
# staged-in-S3 convention every other predictor already follows) - the
# previous hf:// pull-at-pod-start was the last HF-at-runtime dependency
# in the serving path, and in-cluster HF downloads hang unreliably here.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ .Values.embeddingModel.inferenceServiceName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # RawDeployment: this always-on model has no need for Serverless/Knative.
    serving.kserve.io/deploymentMode: Standard
    # ADR-0537 (WP-106, Phase 2): also live-resolved by a mutating RHOAI
    # path into this pod's nodeSelector (see hardwareprofile-mig-1g-24gb.yaml
    # and values.yaml's hardwareProfiles comment) - not purely Dashboard
    # display, correction live-verified 2026-09-02.
    opendatahub.io/hardware-profile-name: {{ .Values.hardwareProfiles.mig1g24gb.name }}
    opendatahub.io/hardware-profile-namespace: {{ .Values.hardwareProfiles.namespace }}
spec:
  predictor:
    {{- if .Values.embeddingModel.deploymentStrategy }}
    # WP-131: RollingUpdate (the KServe default) surges a second GPU pod
    # before killing the first, which cannot schedule under a saturated
    # GPU quota - see values.yaml's embeddingModel.deploymentStrategy.
    deploymentStrategy:
      type: {{ .Values.embeddingModel.deploymentStrategy }}
    {{- end }}
    {{- if .Values.embeddingModel.podAnnotations }}
    # ADR-0523 (WP-082): predictor-level annotations reach the generated
    # Deployment's pod template (KServe ComponentExtensionSpec) - the
    # classic-InferenceService analogue of the LLMInferenceServices'
    # spec.annotations path.
    annotations:
      {{- toYaml .Values.embeddingModel.podAnnotations | nindent 6 }}
    {{- end }}
    minReplicas: {{ .Values.embeddingModel.minReplicas }}
    maxReplicas: {{ .Values.embeddingModel.maxReplicas }}
    # ADR-0351 removed the *hard* hostname anti-affinity against the chat
    # model: written for the one-full-GPU-per-node world, it forbade the
    # single-node packing MIG makes desirable, since the two pods request
    # different, co-resident slice types (this one mig-1g.24gb, the chat model
    # mig-2g.48gb). That removal still stands - what follows is soft.
    {{- if .Values.spreadAcrossGpuNodes }}
    # WP-086: with two permanent MIG nodes, prefer the node that is NOT running
    # qwen. The selector names qwen specifically rather than reusing the LLM
    # pods' `kserve.io/component: workload`: after the two chat models spread,
    # both nodes host one of them, so the broad selector would score every node
    # identically and steer nothing. Isolating qwen is the point - it is the
    # heaviest predictor on disk and the one MaaS and the agents depend on.
    # Preferred, never required: if only one node survives, all three pack onto
    # it rather than going Pending.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  # inferenceServiceName, NOT servedModelName: KServe derives
                  # this label from the LLMInferenceService's metadata.name
                  # (qwen36-27b-instruct), which differs from the served model
                  # id (qwen3.6-27b-instruct). Getting it wrong matches nothing
                  # and degrades silently to no constraint at all.
                  app.kubernetes.io/name: {{ .Values.inferenceServiceName }}
    {{- end }}
    # Carries the serving.kserve.io/s3-* annotated Secret KServe's
    # storage-initializer auto-detects for the s3:// storageUri below
    # (templates/s3-serving-credentials-embedding.yaml).
    serviceAccountName: {{ .Values.embeddingModel.inferenceServiceName }}-s3
    model:
      modelFormat:
        name: vLLM
      runtime: {{ .Values.embeddingModel.servingRuntimeName }}
      # <prefix>/<servedModelName>/ is the bucket's layout convention,
      # same as the chat predictor.
      storageUri: {{ include "models.modelUri" (list $ .Values.embeddingModel.s3Source .Values.embeddingModel.servedModelName) | quote }}
      resources:
        {{- toYaml .Values.embeddingModel.resources | nindent 8 }}
