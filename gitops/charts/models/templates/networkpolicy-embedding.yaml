# Precise ingress allow-list, not a namespace-wide baseline. rag-service
# (query-time embedding) and rag-ingestion's KFP pipeline pods
# (fetch-time embedding, zuno-ai-build) are both allowed - see
# templates/networkpolicy.yaml for the equivalent chat-model policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.embeddingModel.inferenceServiceName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  podSelector:
    matchLabels:
      serving.kserve.io/inferenceservice: {{ .Values.embeddingModel.inferenceServiceName }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: rag-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-ai-build
          podSelector:
            matchLabels:
              pipelines.kubeflow.org/v2_component: "true"
      ports:
        - protocol: TCP
          port: 8080
{{- if .Values.metrics.enabled }}
    # ADR-0413: see templates/networkpolicy.yaml's matching block - same
    # vLLM /metrics scrape allowance for this predictor.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
