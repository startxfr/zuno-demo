# ADR-0412: gpt-oss-20b, the second local chat model. S3-only - no PVC or
# download-Job mode (the weights were staged once to modelsS3 and KServe's
# storage-initializer pulls ~13.8GB from same-region S3 at pod start).
# Runs on the UNMANAGED workergpu node's full 96GB GPU (the only node
# advertising nvidia.com/gpu - the MIG node exposes only mig-* resources,
# so the resources request alone steers scheduling; the generic
# gpu.present nodeSelector below is just the family guard the other
# GPU workloads use). ADR-0412 records the accepted risks of that node:
# it belongs to an IPI machineset ADR-0351 expects at replicas 0 (a
# reconcile deletes it -> this pod goes Pending; remediation = re-choose
# capacity per ADR-0412), and it carries a gpu-driver-upgrade-state=
# upgrade-failed label (driver pods verified healthy 2026-08-18).
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ .Values.gptOssModel.inferenceServiceName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # RawDeployment, same rationale as the qwen chat model.
    serving.kserve.io/deploymentMode: Standard
spec:
  predictor:
    minReplicas: {{ .Values.gptOssModel.minReplicas }}
    maxReplicas: {{ .Values.gptOssModel.maxReplicas }}
    nodeSelector:
      nvidia.com/gpu.present: "true"
    # Carries the serving.kserve.io/s3-* annotated Secret KServe's
    # storage-initializer auto-detects
    # (templates/s3-serving-credentials-gptoss.yaml).
    serviceAccountName: {{ .Values.gptOssModel.inferenceServiceName }}-s3
    model:
      modelFormat:
        name: vLLM
      runtime: {{ .Values.gptOssModel.servingRuntimeName }}
      storageUri: "s3://{{ .Values.modelsS3.bucket }}/{{ .Values.modelsS3.prefix }}/{{ .Values.gptOssModel.servedModelName }}/"
      resources:
        {{- toYaml .Values.gptOssModel.resources | nindent 8 }}
