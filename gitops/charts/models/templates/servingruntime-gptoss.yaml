# ADR-0412: runtime for the second local chat model (gpt-oss-20b), same
# namespace-scoped pattern as servingruntime.yaml. No LoRA/maas guard and
# no --enable-lora: adapters are a qwen-runtime-only mechanism - the
# ai-gateway's provider entry for this model deliberately lacks
# serves_adapters (platform/ai-gateway/provider-routing.yaml), so no
# adapter name is ever sent here.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: {{ .Values.gptOssModel.servingRuntimeName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    # Must sync before inferenceservice-gptoss.yaml, which references this
    # runtime by name.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  containers:
    - name: kserve-container
      image: "{{ .Values.image.vllm }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      args:
        - --model=/mnt/models
        - --served-model-name={{ .Values.gptOssModel.servedModelName }}
        - --max-model-len={{ .Values.gptOssModel.maxModelLen }}
        # Same port rationale as servingruntime.yaml: everything else
        # (probe/Service/NetworkPolicy) assumes 8080, vLLM defaults 8000.
        - --port=8080
      ports:
        - containerPort: 8080
          protocol: TCP
      # Same securityContext posture (and omissions) as servingruntime.yaml.
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        {{- toYaml .Values.gptOssModel.resources | nindent 8 }}
  multiModel: false
