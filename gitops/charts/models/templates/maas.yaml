{{- /*
ADR-0201 (WP-27): OpenShift AI Models-as-a-Service governance plane for
a dedicated MaaS-published copy of the chat model. Schema-checked against
the maas.opendatahub.io/v1alpha1 and serving.kserve.io/v1alpha2 CRDs
confirmed installed on the live cluster (`oc explain
maasmodelref/maassubscription/maasauthpolicy/llminferenceservice
--recursive`, 2026-08-15/16) - see values.yaml's maas.modelRef.kind
comment for the resolved ExternalModel-vs-LLMInferenceService decision.
Disabled by default (.Values.maas.enabled: false) until a GPU node with
spare capacity exists.
*/ -}}
{{- if .Values.maas.enabled }}
# VERIFIED live (2026-08-16): MaaSAuthPolicy's admission webhook rejected
# the whole batch with "namespace zuno-ai-run is not enabled for MaaS
# tenant resources. Create a Tenant CR in this namespace to enable it." -
# not documented anywhere in this chart before hitting it live. Tenant is
# namespace-scoped and CEL-enforced as a singleton named "default-tenant"
# per namespace (v1alpha1). gatewayRef sets the tenant-wide default; the
# LLMInferenceService's own router.gateway.refs below is still explicit
# for clarity/defense-in-depth.
apiVersion: maas.opendatahub.io/v1alpha1
kind: Tenant
metadata:
  name: default-tenant
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  gatewayRef:
    name: maas-default-gateway
    namespace: openshift-ingress
---
# RESOLVED 2026-08-18: the LLMInferenceService's own hf:// storage-
# initializer hung mid-download on every attempt (3 separate stalls at
# different byte offsets, single uninterrupted process each time - not a
# network issue, an isolated 100MB ranged HTTPS test hit 65MB/s; disabling
# the HF concurrent-transfer path didn't fix it either). Switched to
# model.uri: s3:// instead (values below), reusing rag-ingestion's own S3
# credential (same Vault path "rag/s3", same bucket, new prefix) rather
# than provisioning new IAM. KServe's storage-initializer auto-detects S3
# credentials via a Secret carrying the serving.kserve.io/s3-* annotations,
# referenced through a ServiceAccount the LLMInferenceService points at
# (spec.template.serviceAccountName below) - same mechanism classic
# InferenceServices use, just wired by hand here since this is this
# chart's first S3-backed model.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.maas.llmInferenceService.s3.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: {{ .Values.maas.llmInferenceService.s3.secretName }}
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          serving.kserve.io/s3-endpoint: {{ .Values.modelsS3.endpoint | quote }}
          serving.kserve.io/s3-region: {{ .Values.modelsS3.region | quote }}
          serving.kserve.io/s3-usehttps: "1"
          serving.kserve.io/s3-verifyssl: "1"
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.modelsS3.externalSecret.remoteKey | quote }}
        property: {{ .Values.modelsS3.externalSecret.accessKeyProperty | quote }}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.modelsS3.externalSecret.remoteKey | quote }}
        property: {{ .Values.modelsS3.externalSecret.secretKeyProperty | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.maas.llmInferenceService.serviceAccountName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
secrets:
  - name: {{ .Values.maas.llmInferenceService.s3.secretName }}
---
# Its own GPU-bound serving stack (RESOLVED 2026-08-16 - see values.yaml's
# maas.modelRef.kind comment for why ExternalModel/PVC-reuse were both
# ruled out). baseRefs supplies the vLLM/CUDA image; model.uri triggers
# LLMInferenceService's own storage-initializer to download the model
# directly (hf://) rather than reusing the classic InferenceService's
# ReadWriteOnce/zone-locked PVC. router.{gateway,route,scheduler}: {}
# auto-generates the HTTPRoute/Service this MaaSModelRef discovers by
# name - the pre-existing maas-default-gateway
# (gitops/charts/openshift-ai/templates/maas-gateway.yaml, confirmed live
# and PROGRAMMED) is the front door MaaS clients hit; the MaaS controller
# wires this LLMInferenceService's endpoint in once it resolves modelRef
# by name, not by this chart hand-authoring that link.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: {{ .Values.maas.modelRef.name }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
spec:
  baseRefs:
    - name: {{ .Values.maas.llmInferenceService.baseRef }}
  model:
    # <prefix>/<servedModelName>/ (the CLASSIC servedModelName - the S3
    # directory holds the one shared copy both serving paths read; this
    # LLMInferenceService's own -maas id below is only an API name). Same
    # derivation as inferenceservice.yaml's S3 branch.
    uri: "s3://{{ .Values.modelsS3.bucket }}/{{ .Values.modelsS3.prefix }}/{{ .Values.servedModelName }}/"
    name: {{ .Values.maas.llmInferenceService.servedModelName | quote }}
  replicas: 1
  template:
    # No PVC here (model.uri: s3:// downloads straight onto the node), so
    # unlike the classic predictor this only ever needed "any GPU node",
    # never a specific zone - see values.yaml's llmInferenceService
    # comment.
    nodeSelector:
      nvidia.com/gpu.present: "true"
    serviceAccountName: {{ .Values.maas.llmInferenceService.serviceAccountName }}
    containers:
      - name: main
        resources:
          {{- toYaml .Values.maas.llmInferenceService.resources | nindent 10 }}
  router:
    # VERIFIED live (2026-08-16): an empty gateway: {} does NOT auto-create
    # or reuse an existing Gateway on this RHOAI build - it defaults to a
    # hardcoded expected name (openshift-ingress/openshift-ai-inference)
    # that ODH would provision itself but hasn't on this cluster
    # ("RefsInvalid: Managed HTTPRoute references non-existent Gateway").
    # Points explicitly at the real, live, PROGRAMMED maas-default-gateway
    # (gitops/charts/openshift-ai/templates/maas-gateway.yaml) instead.
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
    route: {}
    # scheduler: {} is not optional here - VERIFIED live (2026-08-16): the
    # controller's own defaulting always adds it to a gateway-enabled
    # LLMInferenceService regardless of what this manifest sends, so it
    # needs ENABLE_GATEWAY_API_INFERENCE_EXTENSION set on istiod
    # (gitops/charts/service-mesh) rather than trying to opt out.
    scheduler: {}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: {{ .Values.maas.modelRef.name }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
spec:
  modelRef:
    kind: {{ .Values.maas.modelRef.kind }}
    name: {{ .Values.maas.modelRef.name }}-backend
---
{{- range .Values.maas.subscriptions }}
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: {{ .name }}
  # VERIFIED live (2026-08-18): the maas-controller Deployment carries
  # MAAS_SUBSCRIPTION_NAMESPACE=models-as-a-service (an operator-generated,
  # hardcoded namespace it creates itself at startup - "managed namespace
  # ready", opendatahub.io/generated-namespace: true) and its tenant
  # controller has never reconciled anything outside that namespace in its
  # entire runtime (checked full logs) - our own Tenant CR in
  # .Values.namespace (below) never leaves an empty status. MaaSSubscription/
  # MaaSAuthPolicy created in .Values.namespace alongside the ModelRef never
  # get discovered for pairing ("No active subscription and auth policy
  # pairing found" on the ModelRef, indefinitely). MaaSModelRef itself
  # reconciles fine wherever it lives (RuntimeReady confirmed once the
  # backend came up) - only Subscription/AuthPolicy are namespace-
  # centralized in this build. modelRefs[].namespace below still points at
  # the real ModelRef's namespace - that's how the CRD supports the
  # cross-namespace reference.
  namespace: models-as-a-service
  labels:
    zuno.io/managed-by: argocd
spec:
  owner:
    groups:
      - name: {{ .group }}
  priority: {{ .priority }}
  modelRefs:
    - name: {{ $.Values.maas.modelRef.name }}
      namespace: {{ $.Values.namespace }}
      tokenRateLimits:
        {{- toYaml .tokenRateLimits | nindent 8 }}
---
{{- end }}
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: {{ .Values.maas.authPolicy.name }}
  # Same centralized-namespace requirement as MaaSSubscription above.
  namespace: models-as-a-service
  labels:
    zuno.io/managed-by: argocd
spec:
  modelRefs:
    - name: {{ .Values.maas.modelRef.name }}
      namespace: {{ .Values.namespace }}
  subjects:
    groups:
      {{- range .Values.maas.subscriptions }}
      - name: {{ .group }}
      {{- end }}
{{- end }}
