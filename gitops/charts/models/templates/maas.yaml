{{- /*
ADR-0201 (WP-27): OpenShift AI Models-as-a-Service governance plane for
a dedicated MaaS-published copy of the chat model. Schema-checked against
the maas.opendatahub.io/v1alpha1 and serving.kserve.io/v1alpha2 CRDs
confirmed installed on the live cluster (`oc explain
maasmodelref/maassubscription/maasauthpolicy/llminferenceservice
--recursive`, 2026-08-15/16) - see values.yaml's maas.modelRef.kind
comment for the resolved ExternalModel-vs-LLMInferenceService decision.
Disabled by default (.Values.maas.enabled: false) until a GPU node with
spare capacity exists.
*/ -}}
{{- if .Values.maas.enabled }}
# VERIFIED live (2026-08-16): MaaSAuthPolicy's admission webhook rejected
# the whole batch with "namespace zuno-ai-run is not enabled for MaaS
# tenant resources. Create a Tenant CR in this namespace to enable it." -
# not documented anywhere in this chart before hitting it live. Tenant is
# namespace-scoped and CEL-enforced as a singleton named "default-tenant"
# per namespace (v1alpha1). gatewayRef sets the tenant-wide default; the
# LLMInferenceService's own router.gateway.refs below is still explicit
# for clarity/defense-in-depth.
apiVersion: maas.opendatahub.io/v1alpha1
kind: Tenant
metadata:
  name: default-tenant
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  gatewayRef:
    name: maas-default-gateway
    namespace: openshift-ingress
---
# Its own GPU-bound serving stack (RESOLVED 2026-08-16 - see values.yaml's
# maas.modelRef.kind comment for why ExternalModel/PVC-reuse were both
# ruled out). baseRefs supplies the vLLM/CUDA image; model.uri triggers
# LLMInferenceService's own storage-initializer to download the model
# directly (hf://) rather than reusing the classic InferenceService's
# ReadWriteOnce/zone-locked PVC. router.{gateway,route,scheduler}: {}
# auto-generates the HTTPRoute/Service this MaaSModelRef discovers by
# name - the pre-existing maas-default-gateway
# (gitops/charts/openshift-ai/templates/maas-gateway.yaml, confirmed live
# and PROGRAMMED) is the front door MaaS clients hit; the MaaS controller
# wires this LLMInferenceService's endpoint in once it resolves modelRef
# by name, not by this chart hand-authoring that link.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: {{ .Values.maas.modelRef.name }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
spec:
  baseRefs:
    - name: {{ .Values.maas.llmInferenceService.baseRef }}
  model:
    uri: {{ .Values.maas.llmInferenceService.modelUri | quote }}
    name: {{ .Values.maas.llmInferenceService.servedModelName | quote }}
  replicas: 1
  template:
    # No PVC here (model.uri: hf:// downloads straight onto the node), so
    # unlike the classic predictor this only ever needed "any GPU node",
    # never a specific zone - see values.yaml's llmInferenceService
    # comment.
    nodeSelector:
      nvidia.com/gpu.present: "true"
    containers:
      - name: main
        resources:
          {{- toYaml .Values.maas.llmInferenceService.resources | nindent 10 }}
    initContainers:
      - name: storage-initializer
        env:
          {{- toYaml .Values.maas.llmInferenceService.storageInitializerEnv | nindent 10 }}
  router:
    # VERIFIED live (2026-08-16): an empty gateway: {} does NOT auto-create
    # or reuse an existing Gateway on this RHOAI build - it defaults to a
    # hardcoded expected name (openshift-ingress/openshift-ai-inference)
    # that ODH would provision itself but hasn't on this cluster
    # ("RefsInvalid: Managed HTTPRoute references non-existent Gateway").
    # Points explicitly at the real, live, PROGRAMMED maas-default-gateway
    # (gitops/charts/openshift-ai/templates/maas-gateway.yaml) instead.
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
    route: {}
    # scheduler: {} is not optional here - VERIFIED live (2026-08-16): the
    # controller's own defaulting always adds it to a gateway-enabled
    # LLMInferenceService regardless of what this manifest sends, so it
    # needs ENABLE_GATEWAY_API_INFERENCE_EXTENSION set on istiod
    # (gitops/charts/service-mesh) rather than trying to opt out.
    scheduler: {}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: {{ .Values.maas.modelRef.name }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
spec:
  modelRef:
    kind: {{ .Values.maas.modelRef.kind }}
    name: {{ .Values.maas.modelRef.name }}-backend
---
{{- range .Values.maas.subscriptions }}
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
spec:
  owner:
    groups:
      - name: {{ .group }}
  priority: {{ .priority }}
  modelRefs:
    - name: {{ $.Values.maas.modelRef.name }}
      namespace: {{ $.Values.namespace }}
      tokenRateLimits:
        {{- toYaml .tokenRateLimits | nindent 8 }}
---
{{- end }}
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: {{ .Values.maas.authPolicy.name }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
spec:
  modelRefs:
    - name: {{ .Values.maas.modelRef.name }}
      namespace: {{ .Values.namespace }}
  subjects:
    groups:
      {{- range .Values.maas.subscriptions }}
      - name: {{ .group }}
      {{- end }}
{{- end }}
