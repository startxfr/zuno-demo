{{- /*
ADR-0201 (WP-27): OpenShift AI Models-as-a-Service governance plane for
the local chat model. Every field here is schema-checked against the
maas.opendatahub.io/v1alpha1 CRDs confirmed installed on the live test
cluster (`oc explain maasmodelref/maassubscription/maasauthpolicy/
externalmodel --recursive`, 2026-08-15) except where marked
`# CONFIRM` in values.yaml's maas block - see that block's modelRef
comment for the ExternalModel-vs-LLMInferenceService tradeoff this
manifest makes a judgment call on. Disabled by default
(.Values.maas.enabled: false): no MaaSModelRef/Subscription/AuthPolicy
exists on the live cluster yet, and every ADR-0201 acceptance bullet is a
live-verification operator step (WP-27 brief's follow-up section).
*/ -}}
{{- if .Values.maas.enabled }}
# Placeholder credential Secret - see values.yaml's maas.externalModel.
# credentialSecretName comment: the CRD requires a Secret carrying an
# "api-key" data key, but vLLM's OpenAI-compatible server behind this
# ExternalModel doesn't require a real key. Rendered directly (not an
# ExternalSecret/Vault resolution) because there is no real credential to
# resolve - ADR-0024 governs *real* secrets, not this schema-mandated
# placeholder for an internally-served, unauthenticated endpoint.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.maas.externalModel.credentialSecretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
type: Opaque
stringData:
  api-key: not-required
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: {{ .Values.maas.modelRef.name }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
spec:
  endpoint: {{ .Values.maas.externalModel.endpoint | quote }}
  provider: {{ .Values.maas.externalModel.provider | quote }}
  targetModel: {{ .Values.maas.externalModel.targetModel | quote }}
  credentialRef:
    name: {{ .Values.maas.externalModel.credentialSecretName }}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: {{ .Values.maas.modelRef.name }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
spec:
  modelRef:
    kind: {{ .Values.maas.modelRef.kind }}
    name: {{ .Values.maas.modelRef.name }}-backend
---
{{- range .Values.maas.subscriptions }}
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
spec:
  owner:
    groups:
      - name: {{ .group }}
  priority: {{ .priority }}
  modelRefs:
    - name: {{ $.Values.maas.modelRef.name }}
      namespace: {{ $.Values.namespace }}
      tokenRateLimits:
        {{- toYaml .tokenRateLimits | nindent 8 }}
---
{{- end }}
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: {{ .Values.maas.authPolicy.name }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
spec:
  modelRefs:
    - name: {{ .Values.maas.modelRef.name }}
      namespace: {{ .Values.namespace }}
  subjects:
    groups:
      {{- range .Values.maas.subscriptions }}
      - name: {{ .group }}
      {{- end }}
{{- end }}
