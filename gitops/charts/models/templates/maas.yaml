{{- /*
ADR-0201 (WP-27): OpenShift AI Models-as-a-Service governance plane.
Schema-checked against the maas.opendatahub.io/v1alpha1 and
serving.kserve.io/v1alpha2 CRDs confirmed installed on the live cluster
(`oc explain maasmodelref/maassubscription/maasauthpolicy/llminferenceservice
--recursive`, 2026-08-15/16). MaaSModelRef.spec.modelRef.kind's hard enum
(LLMInferenceService | ExternalModel only) ruled out ExternalModel on its
own schema (built for authenticated third-party SaaS, not an internal
vLLM Service) back when this first stood up a dedicated backend.
ADR-0414: that dedicated backend is retired - this now publishes
gpt-oss-20b's own LLMInferenceService (templates/llminferenceservice-gptoss.yaml)
instead, folding what were two separate GPU-consuming deployments into
one.
*/ -}}
{{- if .Values.maas.enabled }}
# VERIFIED live (2026-08-16): MaaSAuthPolicy's admission webhook rejected
# the whole batch with "namespace zuno-ai-run is not enabled for MaaS
# tenant resources. Create a Tenant CR in this namespace to enable it." -
# not documented anywhere in this chart before hitting it live. Tenant is
# namespace-scoped and CEL-enforced as a singleton named "default-tenant"
# per namespace (v1alpha1). gatewayRef sets the tenant-wide default; the
# LLMInferenceService's own router.gateway.refs below is still explicit
# for clarity/defense-in-depth.
apiVersion: maas.opendatahub.io/v1alpha1
kind: Tenant
metadata:
  name: default-tenant
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  gatewayRef:
    name: maas-default-gateway
    namespace: openshift-ingress
---
# ADR-0414: the published backend is gpt-oss-20b's own LLMInferenceService
# (templates/llminferenceservice-gptoss.yaml) - no dedicated MaaS-only
# copy anymore. That template owns its own S3 credentials
# (templates/s3-serving-credentials-gptoss.yaml) and GPU resources; this
# CR only points MaaS's governance plane at it by name.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: {{ .Values.maas.publishedName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
spec:
  modelRef:
    kind: LLMInferenceService
    name: {{ .Values.gptOssModel.inferenceServiceName }}
---
{{- range .Values.maas.subscriptions }}
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: {{ .name }}
  # VERIFIED live (2026-08-18): the maas-controller Deployment carries
  # MAAS_SUBSCRIPTION_NAMESPACE=models-as-a-service (an operator-generated,
  # hardcoded namespace it creates itself at startup - "managed namespace
  # ready", opendatahub.io/generated-namespace: true) and its tenant
  # controller has never reconciled anything outside that namespace in its
  # entire runtime (checked full logs) - our own Tenant CR in
  # .Values.namespace (below) never leaves an empty status. MaaSSubscription/
  # MaaSAuthPolicy created in .Values.namespace alongside the ModelRef never
  # get discovered for pairing ("No active subscription and auth policy
  # pairing found" on the ModelRef, indefinitely). MaaSModelRef itself
  # reconciles fine wherever it lives (RuntimeReady confirmed once the
  # backend came up) - only Subscription/AuthPolicy are namespace-
  # centralized in this build. modelRefs[].namespace below still points at
  # the real ModelRef's namespace - that's how the CRD supports the
  # cross-namespace reference.
  namespace: models-as-a-service
  labels:
    zuno.io/managed-by: argocd
spec:
  owner:
    groups:
      - name: {{ .group }}
  priority: {{ .priority }}
  modelRefs:
    - name: {{ $.Values.maas.publishedName }}
      namespace: {{ $.Values.namespace }}
      tokenRateLimits:
        {{- toYaml .tokenRateLimits | nindent 8 }}
---
{{- end }}
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: {{ .Values.maas.authPolicy.name }}
  # Same centralized-namespace requirement as MaaSSubscription above.
  namespace: models-as-a-service
  labels:
    zuno.io/managed-by: argocd
spec:
  modelRefs:
    - name: {{ .Values.maas.publishedName }}
      namespace: {{ .Values.namespace }}
  subjects:
    groups:
      {{- range .Values.maas.subscriptions }}
      - name: {{ .group }}
      {{- end }}
{{- end }}
