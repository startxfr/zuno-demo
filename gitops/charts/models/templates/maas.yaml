{{- /*
ADR-0201 (WP-27): OpenShift AI Models-as-a-Service governance plane.
Schema-checked against the maas.opendatahub.io/v1alpha1 and
serving.kserve.io/v1alpha2 CRDs confirmed installed on the live cluster
(`oc explain maasmodelref/maassubscription/maasauthpolicy/llminferenceservice
--recursive`, 2026-08-15/16, re-confirmed 2026-08-25 for ADR-0521).
MaaSModelRef.spec.modelRef.kind's hard enum (LLMInferenceService |
ExternalModel only) ruled out ExternalModel on its own schema (built for
authenticated third-party SaaS, not an internal vLLM Service) back when
this first stood up a dedicated backend.
ADR-0414: that dedicated backend is retired - gpt-oss-20b's own
LLMInferenceService (templates/llminferenceservice-gptoss.yaml) was the
first model published this way, folding two separate GPU-consuming
deployments into one.
ADR-0521 (WP-076): generalized from one hardcoded model to a
`range .Values.maas.models` loop - qwen3.6-27b-instruct
(templates/llminferenceservice-qwen.yaml) joined once it too became an
LLMInferenceService. The Tenant CR below stays a singleton (CEL-enforced
one-per-namespace), outside the loop.
Correction, 2026-08-25: MaaSModelRef.spec also has an endpointOverride
field (`oc explain maasmodelref.spec --recursive`) - missed by the earlier
sweep, which only recursed into spec.modelRef. See values.yaml's
maas.models[].endpointOverride comment and ADR-0201's dated notes for what
this tests.
ADR-0537 (WP-106, Phase 3), 2026-09-02: ExternalModel is back, for the
case its original rejection above never covered - a genuinely external,
authenticated SaaS backend (mistral-large-latest, gpt-oss-120b via
OVHcloud), not an internal vLLM Service. `modelRef.kind` below is now
per-entry (`.modelRefKind`, default LLMInferenceService) rather than
hardcoded.
*/ -}}
{{- if .Values.maas.enabled }}
# MaaSAuthPolicy's admission webhook rejects the whole batch unless a
# Tenant CR exists first ("namespace zuno-ai-run is not enabled for MaaS
# tenant resources. Create a Tenant CR in this namespace to enable it.").
# Tenant is namespace-scoped and CEL-enforced as a singleton named
# "default-tenant" per namespace (v1alpha1), shared by every model in
# .Values.maas.models below. gatewayRef sets the tenant-wide default; each
# LLMInferenceService's own router.gateway.refs is still explicit for
# clarity/defense-in-depth.
# RESOLVED (2026-09-01, was OPEN since 2026-08-25/ADR-0201): this Tenant
# never reconciles - it sits with a completely empty .status while the
# operator-generated models-as-a-service/default-tenant reports
# Ready=True/Reconciled, since maas-api runs with
# TENANT_NAME=models-as-a-service and the controller only ever reconciles
# the tenant in its own managed namespace. Confirmed live by actually
# deleting it: every existing MaaSModelRef/MaaSSubscription/MaaSAuthPolicy
# kept working (the three MaaS validating webhooks - vaitenant,
# vmaassubscription, vmaasauthpolicy - only fire on CREATE, never UPDATE),
# but a dry-run CREATE of a new MaaSSubscription in zuno-ai-run was
# rejected with exactly the admission error above until the Tenant was
# restored. So it's inert for the entitlement gap (unrelated to that
# investigation, which stays a separate open item), but a real, working
# guard for any future MaaSSubscription/MaaSAuthPolicy/AITenant created
# directly in this namespace - keep it for that reason alone, not for
# anything it reconciles into.
apiVersion: maas.opendatahub.io/v1alpha1
kind: Tenant
metadata:
  name: default-tenant
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  gatewayRef:
    name: maas-default-gateway
    namespace: openshift-ingress
{{- if .Values.maas.externalOIDC.enabled }}
---
# Live-verified 2026-09-01: unlike the Tenant CR above, ModelsAsService
# reconciles for real (owned by DataScienceCluster zuno-dsc -> Config
# default -> this object, all Ready=True) - it is auto-created once when
# spec.components.kserve.modelsAsService.managementState is set to
# Managed in gitops/charts/openshift-ai/templates/datasciencecluster.yaml,
# but that DSC field is a bare managementState toggle with no externalOIDC
# passthrough, so this object has to be addressed directly. We only ever
# declare the two fields we actually need to change (externalOIDC below,
# plus gatewayRef mirrored verbatim for a complete, self-documenting
# source rather than an opaque partial patch) - Kuadrant regenerates
# maas-gateway-auth's AuthPolicy from this spec, adding real Keycloak
# JWTs as a third identity source alongside its existing api-keys/
# kubernetesTokenReview methods, so ai-gateway can start forwarding the
# real caller's own bearer token instead of its fixed ServiceAccount
# credential (see app/maas_adapter.py) - the point of this whole change:
# per-group (agent_tekos/sales) MaaSSubscription token budgets, already
# declared below, start being the ones Limitador actually enforces
# instead of everything landing in the single shared "ai-gateway" pool.
apiVersion: components.platform.opendatahub.io/v1alpha1
kind: ModelsAsService
metadata:
  name: default-modelsasservice
  labels:
    zuno.io/managed-by: argocd
spec:
  gatewayRef:
    name: maas-default-gateway
    namespace: openshift-ingress
  externalOIDC:
    # PARTIALLY ADDRESSED 2026-09-02, STILL BROKEN LIVE: the audience-match
    # theory this comment used to carry (fixed by adding a
    # "maas-gateway-audience" mapper for zuno-admin-api to every persona
    # frontend client in realm-zuno.json, same class as the 2026-08-30
    # WP-103 fix) was real but turned out to be necessary, not sufficient.
    # Live-cluster-confirmed the same day: `oc get authpolicy
    # maas-gateway-auth -n openshift-ingress` shows only two identity
    # sources under spec.defaults.rules.authentication - api-keys and
    # openshift-identities (kubernetesTokenReview) - Keycloak/OIDC is NOT
    # present at all, despite the live ModelsAsService CR correctly
    # carrying this exact externalOIDC block (clientId/issuerUrl both
    # match). So Authorino has no path to accept a Keycloak-issued token
    # in the first place; the mapper fix cannot matter until that's true.
    # Root cause not yet found - maas-controller
    # (redhat-ods-applications) is healthy/Ready per its own CR status but
    # crash-loops on leader-election API-server timeouts every few hours
    # (51 restarts/7d, unrelated-looking stack trace); whether that ever
    # actually blocked this one reconcile, or something else entirely
    # does, is unconfirmed - do not assume the mapper fix alone unblocks
    # real persona MaaS routing until this AuthPolicy gap is separately
    # closed.
    issuerUrl: https://keycloak.{{ .Values.clusterBaseDomain }}/realms/zuno
    clientId: {{ .Values.maas.externalOIDC.clientId }}
{{- end }}
{{- range .Values.maas.models }}
---
{{- $model := . }}
{{- if eq .modelRefKind "ExternalModel" }}
# The published backend is {{ .backendInferenceServiceName }}'s own
# ExternalModel CR (templates/externalmodel-*.yaml) - a genuinely external
# SaaS endpoint, not a local workload. This CR only points MaaS's
# governance plane at it by name (ADR-0537, WP-106 Phase 3).
{{- else }}
# The published backend is {{ .backendInferenceServiceName }}'s own
# LLMInferenceService - no dedicated MaaS-only copy. That template owns
# its own S3 credentials and GPU resources; this CR only points MaaS's
# governance plane at it by name.
{{- end }}
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: {{ .publishedName }}
  namespace: {{ $.Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
spec:
  {{- if .endpointOverride }}
  endpointOverride: {{ .endpointOverride }}
  {{- end }}
  modelRef:
    # ADR-0537 (WP-106, Phase 3): defaults to LLMInferenceService (every
    # entry before this ADR relied on the implicit default) - the two
    # ExternalModel-backed entries (mistral-large-maas,
    # gpt-oss-120b-ovhcloud-maas) set modelRefKind: ExternalModel
    # explicitly in values.yaml.
    kind: {{ .modelRefKind | default "LLMInferenceService" }}
    name: {{ .backendInferenceServiceName }}
---
{{- range .subscriptions }}
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: {{ .name }}
  # The maas-controller Deployment carries
  # MAAS_SUBSCRIPTION_NAMESPACE=models-as-a-service (an operator-generated,
  # hardcoded namespace it creates itself at startup) and its tenant
  # controller never reconciles anything outside that namespace - our own
  # Tenant CR in .Values.namespace (above) never leaves an empty status,
  # and MaaSSubscription/MaaSAuthPolicy created in .Values.namespace
  # alongside the ModelRef never get discovered for pairing ("No active
  # subscription and auth policy pairing found" on the ModelRef,
  # indefinitely). MaaSModelRef itself reconciles fine wherever it lives -
  # only Subscription/AuthPolicy are namespace-centralized in this build.
  # modelRefs[].namespace below still points at the real ModelRef's
  # namespace - that's how the CRD supports the cross-namespace reference.
  namespace: models-as-a-service
  labels:
    zuno.io/managed-by: argocd
spec:
  owner:
    {{- if .user }}
    # ADR-0521 (WP-076) step 3: a service identity (e.g. ai-gateway's own
    # ServiceAccount via Kuadrant's kubernetesTokenReview), not a persona
    # group - schema-valid without a matching groups entry (`oc explain
    # maassubscription.spec.owner --recursive`).
    users:
      - {{ .user | quote }}
    {{- else }}
    groups:
      - name: {{ .group }}
    {{- end }}
  priority: {{ .priority }}
  modelRefs:
    - name: {{ $model.publishedName }}
      namespace: {{ $.Values.namespace }}
      tokenRateLimits:
        {{- toYaml .tokenRateLimits | nindent 8 }}
---
{{- end }}
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: {{ .authPolicy.name }}
  # Same centralized-namespace requirement as MaaSSubscription above.
  namespace: models-as-a-service
  labels:
    zuno.io/managed-by: argocd
spec:
  modelRefs:
    - name: {{ .publishedName }}
      namespace: {{ $.Values.namespace }}
  subjects:
    {{- $authGroups := list }}
    {{- $authUsers := list }}
    {{- range .subscriptions }}
    {{- if .user }}
    {{- $authUsers = append $authUsers .user }}
    {{- else }}
    {{- $authGroups = append $authGroups .group }}
    {{- end }}
    {{- end }}
    {{- if $authGroups }}
    groups:
      {{- range $authGroups }}
      - name: {{ . }}
      {{- end }}
    {{- end }}
    {{- if $authUsers }}
    users:
      {{- toYaml $authUsers | nindent 6 }}
    {{- end }}
{{- end }}
{{- end }}
