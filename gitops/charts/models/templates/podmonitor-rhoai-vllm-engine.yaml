{{- if .Values.metrics.enabled }}
# ADR-0554 Part D - the piece the original ADR text didn't anticipate.
# RHOAI's own MonitoringStack (data-science-monitoringstack,
# redhat-ods-monitoring) can NEVER discover the PodMonitor KServe's own
# LLMInferenceService controller auto-creates
# (kserve-llm-isvc-vllm-engine(-default), monitoring.coreos.com/v1): its
# underlying Prometheus operand is Red Hat's Cluster Observability
# Operator build, whose ClusterRole (live-verified 2026-09-09) only grants
# get/list/watch on the monitoring.rhobs API group - monitoring.coreos.com
# is a structurally different, unrelated CRD group that happens to share
# the same Kind names. No namespaceSelector, RBAC or NetworkPolicy fix can
# bridge that; the two widen_monitoringstack_namespace_selector.yml/
# rolebinding-rhoai-monitoringstack-prometheus.yaml/networkpolicy-*.yaml
# changes ADR-0554 already made are necessary but were not sufficient
# until this file existed too - confirmed live by creating an ad hoc
# monitoring.rhobs/v1 PodMonitor with this exact selector: RHOAI's
# Prometheus picked it up and scraped all 4 model pods `health: up` within
# seconds, while the community-group one it already had RBAC/network
# access to remained invisible throughout.
#
# apiVersion is deliberately monitoring.rhobs/v1, the OPPOSITE choice from
# this chart's own servicemonitor-vllm.yaml (monitoring.coreos.com/v1,
# for prometheus-k8s) and exactly the choice
# gitops/charts/mesh-monitoring/templates/podmonitor-istio-proxy.yaml
# already established for the same reason: one cluster, two independent
# Prometheus-operator flavours, each bound to its own CRD group - name a
# resource under the wrong one and it renders successfully but is scraped
# by nobody.
#
# Selector/relabelings copied from kserve-llm-isvc-vllm-engine verbatim so
# both stacks see identically-labeled series; portNumber (not the
# deprecated targetPort KServe's own object still uses) to avoid this
# Prometheus version's warning.
#
# ADR-0554 Part E (2026-09-09, live-confirmed): the `exported_namespace`/
# `k8s_pod_name` copies below are NOT cosmetic. Every PromQL query on the
# Perses dashboards this PodMonitor feeds (dashboard-2/3/4, "LLM Traffic"/
# "LLM Utilization"/"LLM Performance", data-science-prometheus-datasource)
# filters on `exported_namespace=~"$namespace"` and groups per-pod panels
# by `k8s_pod_name` - labels this repo's own SD-based relabeling never
# produces (Prometheus's k8s SD sets plain `namespace`/`pod`). Those two
# label names are what you get for free when a target is scraped via an
# OTel Collector k8s-semconv pipeline (RHOAI's `data-science-collector-*`
# pods) instead of a raw PodMonitor - this file intentionally does the
# latter (Part D's whole point), so without an explicit copy the filter
# matches zero series even though the underlying metric is present and
# moving. Confirmed live: `kserve_vllm:num_requests_running{exported_
# namespace=~"zuno-ai-run"}` returned zero results against this exact
# datasource/proxy path while the bare metric (no exported_namespace
# filter) showed real, changing values for all 4 models at the same
# moment - copying the two labels here, not touching the dashboards
# (operator-owned, would be reverted) or standing up a parallel OTel
# Collector pipeline (far larger scope for the same outcome).
apiVersion: monitoring.rhobs/v1
kind: PodMonitor
metadata:
  name: zuno-rhoai-vllm-engine
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  namespaceSelector: {}
  podMetricsEndpoints:
    - metricRelabelings:
        - action: replace
          replacement: kserve_$1
          sourceLabels:
            - __name__
          targetLabel: __name__
      relabelings:
        - action: replace
          sourceLabels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
          targetLabel: llm_isvc_name
        - action: replace
          sourceLabels:
            - __meta_kubernetes_pod_label_llm_d_ai_role
          targetLabel: llm_isvc_role
        - action: replace
          regex: llminferenceservice-(.*)
          replacement: $1
          sourceLabels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_component
          targetLabel: llm_isvc_component
        - action: replace
          sourceLabels:
            - __meta_kubernetes_namespace
          targetLabel: exported_namespace
        - action: replace
          sourceLabels:
            - __meta_kubernetes_pod_name
          targetLabel: k8s_pod_name
      scheme: https
      portNumber: 8000
      tlsConfig:
        insecureSkipVerify: true
  selector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - llminferenceservice-workload
          - llminferenceservice-workload-prefill
          - llminferenceservice-workload-worker
          - llminferenceservice-workload-leader
          - llminferenceservice-workload-leader-prefill
          - llminferenceservice-workload-worker-prefill
    matchLabels:
      app.kubernetes.io/part-of: llminferenceservice
{{- end }}
