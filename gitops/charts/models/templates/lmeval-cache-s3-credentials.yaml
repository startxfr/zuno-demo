{{- /*
S3 read credentials for job-lmeval-cache-prefetch.yaml's tokenizer-prefetch
init container. Deliberately its OWN ExternalSecret/Secret rather than
reusing s3-serving-credentials.yaml's qwen25-7b-instruct-s3-credentials:
that one is gated `not .Values.modelStorage.downloadJob.enabled` and would
silently stop rendering if that flag ever flips - this prefetch path is
unrelated to how the predictor itself gets its weights and shouldn't be
coupled to that toggle. Same Vault key/properties as modelsS3.externalSecret
(single source of truth for the "rag/s3" credential - see
s3-serving-credentials.yaml). Sync-wave -16, one wave ahead of
pvc-lmeval-cache.yaml/job-lmeval-cache-prefetch.yaml (-15): a Secret has no
WaitForFirstConsumer-style deadlock risk the way a lone PVC does, so it's
safe (and clearer) to sequence strictly before the wave that consumes it.
*/ -}}
{{- if .Values.lmEval.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lmeval-hf-cache-s3-credentials
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
    app.kubernetes.io/name: lm-eval
    app.kubernetes.io/component: model-quality-gate
  annotations:
    argocd.argoproj.io/sync-wave: "-16"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: lmeval-hf-cache-s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.modelsS3.externalSecret.remoteKey | quote }}
        property: {{ .Values.modelsS3.externalSecret.accessKeyProperty | quote }}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.modelsS3.externalSecret.remoteKey | quote }}
        property: {{ .Values.modelsS3.externalSecret.secretKeyProperty | quote }}
{{- end }}
