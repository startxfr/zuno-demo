{{- /*
ADR-0108 (roadmap WP-10). See values.yaml's lmEval comment for the full
rationale. Every field below is confirmed real via `oc explain
lmevaljob.spec...` against the live test cluster, 2026-08-14. Disabled by
default; renders nothing with an empty job list even if enabled. Moved
here (2026-08-14) from gitops/charts/openshift-ai (Day 0) to this chart
(Day 1 "models" component): it benchmarks a model this chart deploys, so
it belongs to the same install/uninstall lifecycle rather than the
operator/DSC chart.
*/ -}}
{{- if .Values.lmEval.enabled }}
{{- range .Values.lmEval.jobs }}
---
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: LMEvalJob
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: lm-eval
    app.kubernetes.io/component: model-quality-gate
spec:
  model: {{ .model }}
  modelArgs:
    {{- toYaml .modelArgs | nindent 4 }}
  taskList:
    taskNames:
      {{- toYaml .taskNames | nindent 6 }}
  allowOnline: {{ .allowOnline | default false }}
  allowCodeExecution: {{ .allowCodeExecution | default false }}
  # Operator-managed PVC. The size is REQUIRED in practice: the 3.5.0-ea.2
  # TrustyAI operator (v1.37.0) panics reconciling an empty size
  # (resource.MustParse("") in controllers/lmes/storage.go:35, verified
  # live 2026-08-18 - the "CRD default applies" assumption this comment
  # previously made does not hold). Switch to outputs.oci if results need
  # to leave the cluster (e.g. for evaluations/quality_gate.py to read via
  # CI rather than a Day 1 check - see ansible/roles/models/tasks/ for the
  # read path this WP added).
  outputs:
    pvcManaged:
      size: {{ .pvcSize | default "5Gi" }}
{{- if .allowOnline }}
  # VERIFIED live 2026-08-18 (3.5.0-ea.2, v1.37.0 TrustyAI operator): a
  # real operator bug - `allowOnline: true` above does NOT stop the pod
  # from being rendered with HF_HUB_OFFLINE=1/TRANSFORMERS_OFFLINE=1/
  # HF_DATASETS_OFFLINE=1/HF_EVALUATE_OFFLINE=1 hardcoded, so the
  # tokenizer/dataset download 404s regardless of the spec field. Direct
  # reproduction from an ad hoc pod on the same image proved network/TLS/
  # DNS all work fine and the exact AutoTokenizer.from_pretrained() call
  # succeeds outside the job wrapper - the offline env vars are the sole
  # cause. spec.pod.container.env is a real, documented override
  # (`oc explain lmevaljob.spec.pod.container.env`); used here to force
  # the four flags back to online for any job that opted in above.
  pod:
    container:
      env:
        - name: HF_HUB_OFFLINE
          value: "0"
        - name: TRANSFORMERS_OFFLINE
          value: "0"
        - name: HF_DATASETS_OFFLINE
          value: "0"
        - name: HF_EVALUATE_OFFLINE
          value: "0"
{{- end }}
{{- end }}
{{- end }}
