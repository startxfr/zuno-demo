{{- /*
ADR-0108 (roadmap WP-10). See values.yaml's lmEval comment for the full
rationale. Every field below is confirmed real via `oc explain
lmevaljob.spec...` against the live cluster. Disabled by default; renders
nothing with an empty job list even if enabled. Moved here from
gitops/charts/openshift-ai (Day 0) to this chart (Day 1 "models"
component): it benchmarks a model this chart deploys, so it belongs to
the same install/uninstall lifecycle rather than the operator/DSC chart.
*/ -}}
{{- if .Values.lmEval.enabled }}
{{- range .Values.lmEval.jobs }}
---
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: LMEvalJob
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: lm-eval
    app.kubernetes.io/component: model-quality-gate
spec:
  model: {{ .model }}
  modelArgs:
    {{- toYaml .modelArgs | nindent 4 }}
  taskList:
    taskNames:
      {{- toYaml .taskNames | nindent 6 }}
  allowOnline: {{ .allowOnline | default false }}
  allowCodeExecution: {{ .allowCodeExecution | default false }}
  # Operator-managed PVC. The size is REQUIRED in practice: the 3.5.0-ea.2
  # TrustyAI operator (v1.37.0) panics reconciling an empty size
  # (resource.MustParse("") in controllers/lmes/storage.go:35) - there is
  # no usable CRD default. Switch to outputs.oci if results need to leave
  # the cluster (e.g. for evaluations/quality_gate.py to read via CI
  # rather than a Day 1 check - see ansible/roles/models/tasks/ for the
  # read path this WP added).
  outputs:
    pvcManaged:
      size: {{ .pvcSize | default "5Gi" }}
{{- if .datasetCachePvc }}
  # Two independent TrustyAI operator bugs (3.5.0-ea.2, v1.37.0) make
  # `allowOnline: true` non-functional: (1) the rendered pod hardcodes
  # HF_HUB_OFFLINE=1/TRANSFORMERS_OFFLINE=1/HF_DATASETS_OFFLINE=1/
  # HF_EVALUATE_OFFLINE=1 regardless of the spec field, and (2) overriding
  # those same names back to "0" via spec.pod.container.env does NOT take
  # effect either - the operator's own values still win in the rendered
  # pod. Network/TLS/DNS all work fine outside the job wrapper - the
  # hardcoded offline env is the sole cause.
  #
  # Workaround: HF's offline mode only blocks network calls, not reads
  # from an already-populated local cache. datasetCachePvc names a PVC
  # pre-populated by the operator (see the WP-10 brief's operator
  # follow-up for the exact prefetch procedure - one
  # `load_dataset(path, config)` call per task config, into HF_HOME) and
  # mounted here at HF_HOME; with the cache already warm, HF_*_OFFLINE=1
  # is no longer a blocker - offline mode was the intended operating
  # posture for this CRD all along, only the allowOnline/env-override
  # paths are bugs.
  pod:
    # spec.pod.volumes (confirmed via `oc explain lmevaljob.spec.pod.volumes`)
    # is a pod-level field, sibling to pod.container - not nested under it.
    volumes:
      - name: dataset-cache
        persistentVolumeClaim:
          claimName: {{ .datasetCachePvc }}
    container:
      env:
        - name: HF_HOME
          value: /cache/hf_home
      volumeMounts:
        - name: dataset-cache
          mountPath: /cache
{{- end }}
{{- end }}
{{- end }}
