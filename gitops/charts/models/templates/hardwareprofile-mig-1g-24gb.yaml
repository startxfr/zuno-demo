# ADR-0537 (WP-106, Phase 1): declarative Dashboard hardware profile for the
# smaller MIG tier. Covers qwen35-9b, gpt-oss-20b and the embedding model -
# see values.yaml's hardwareProfiles.mig1g24gb comment for why the ranges
# below are metadata, not enforcement, and for the crash this closes the
# gap on (granite-7b-redhat-lab's Dashboard-assigned profile had no
# Accelerator identifier at all).
apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: {{ .Values.hardwareProfiles.mig1g24gb.name }}
  namespace: {{ .Values.hardwareProfiles.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    opendatahub.io/description: {{ .Values.hardwareProfiles.mig1g24gb.description | quote }}
spec:
  identifiers:
    - identifier: {{ .Values.hardwareProfiles.mig1g24gb.acceleratorIdentifier }}
      displayName: GPU (1g.24gb MIG slice)
      resourceType: Accelerator
      minCount: 1
      defaultCount: 1
      maxCount: {{ .Values.hardwareProfiles.mig1g24gb.acceleratorMaxCount }}
    - identifier: cpu
      displayName: CPU
      resourceType: CPU
      minCount: {{ .Values.hardwareProfiles.mig1g24gb.cpu.min }}
      defaultCount: {{ .Values.hardwareProfiles.mig1g24gb.cpu.default }}
      maxCount: {{ .Values.hardwareProfiles.mig1g24gb.cpu.max }}
    - identifier: memory
      displayName: Memory
      resourceType: Memory
      minCount: {{ .Values.hardwareProfiles.mig1g24gb.memory.min }}
      defaultCount: {{ .Values.hardwareProfiles.mig1g24gb.memory.default }}
      maxCount: {{ .Values.hardwareProfiles.mig1g24gb.memory.max }}
  scheduling:
    type: Node
    node:
      nodeSelector:
        nvidia.com/gpu.present: "true"
