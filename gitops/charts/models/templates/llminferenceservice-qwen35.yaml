{{- /*
ADR-0526 (WP-087) decision 2: qwen3.5-9b - the UNMODIFIED base that
qwen3.5-9b-wesh was fine-tuned from, served alongside it so the variant is
compared against its own base rather than against a different model. Same
weights ADR-0518 decision 3 already staged as this platform's training
base; nothing in this chart modifies them.

THE 24GB SLICE IS THE CONSTRAINT. 19.3GB of bf16 weights leaves roughly
4GB. KV is not the pressure - only 8 of 32 layers are full_attention
(num_key_value_heads: 4, head_dim: 256 => ~32KB/token) and the other 24
linear_attention layers hold a constant-size state, so even a full 32768
context would cost about 1GB. The pressure is activation and CUDA-graph
workspace. Three settings work together against it and none is
individually sufficient: a reduced --max-model-len, a raised
--gpu-memory-utilization, and --enforce-eager (no graph capture at all -
the largest single lever, and required on this vLLM build regardless for
the MIG/NVML crash ADR-0518 documents). All three are values-driven; see
values.yaml's qwen35Model block before changing any of them.

CHAT TEMPLATE: present. Verified against the staged checkpoint
(2026-08-27) - s3://zuno-demo-rag-corpus/models/qwen3.5-9b/ carries a
7756-byte chat_template.jinja, so /v1/chat/completions works without the
caller supplying a template. Worth recording because "Qwen3.5-9B" is a
base model id, not an instruct one, and the natural assumption is the
opposite. The same checkpoint is self-consistent (13 objects, 19.3GB, a
model.safetensors.index.json whose weight_map names match the real shard
objects) and declares text_config.dtype: bfloat16 - it is the unquantized
checkpoint ADR-0526 decision 1 requires, not a quantized one.
*/ -}}
{{- $qwen35Maas := "" }}
{{- range .Values.maas.models }}
{{- if eq .backendInferenceServiceName $.Values.qwen35Model.inferenceServiceName }}
{{- $qwen35Maas = . }}
{{- end }}
{{- end }}
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: {{ .Values.qwen35Model.inferenceServiceName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # ADR-0537 (WP-106, Phase 2): also live-resolved by a mutating RHOAI
    # path into this pod's nodeSelector (see hardwareprofile-mig-1g-24gb.yaml
    # and values.yaml's hardwareProfiles comment) - already an identical
    # nodeSelector here (below), so a no-op; not the case for every model
    # this annotation was added to, correction live-verified 2026-09-02.
    opendatahub.io/hardware-profile-name: {{ .Values.hardwareProfiles.mig1g24gb.name }}
    opendatahub.io/hardware-profile-namespace: {{ .Values.hardwareProfiles.namespace }}
spec:
  {{- if .Values.qwen35Model.llmInferenceService.podAnnotations }}
  annotations:
    {{- toYaml .Values.qwen35Model.llmInferenceService.podAnnotations | nindent 4 }}
  {{- end }}
  baseRefs:
    - name: {{ .Values.qwen35Model.llmInferenceService.baseRef }}
  model:
    uri: "s3://{{ .Values.modelsS3.bucket }}/{{ .Values.modelsS3.prefix }}/{{ .Values.qwen35Model.servedModelName }}/"
    name: {{ .Values.qwen35Model.servedModelName | quote }}
  replicas: {{ .Values.qwen35Model.minReplicas }}
  template:
    nodeSelector:
      nvidia.com/gpu.present: "true"
    {{- if .Values.spreadAcrossGpuNodes }}
    # Generic term unchanged (WP-086 / ADR-0351 decision 1): soft avoidance
    # of any other model workload.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  kserve.io/component: workload
        # Second term added WP-092/ADR-0414 as `preferred` (soft); promoted
        # to `required` by WP-105/ADR-0536 (amendment to ADR-0526 decision
        # 5). Live-cluster-confirmed 2026-08-30: with only 2 permanent MIG
        # nodes and both fully saturated with 5 GPU workloads, a soft term
        # let the scheduler colocate qwen35-9b and qwen35-9b-wesh on the
        # same node under normal pod churn (both pods recreated in the same
        # ~40s window during a routine restart) - the anti-affinity was
        # satisfiable elsewhere but scoring still chose to violate it. This
        # pair specifically needs a HARD guarantee of separation for
        # WP-105's node-failover drill to be deterministic (killing
        # qwen35-9b's pod must never let it silently reschedule onto
        # qwen35-9b-wesh's node), so ADR-0351 decision 1/WP-086's general
        # "pack onto a survivor" preference is overridden for this one
        # named pair only - every other model on this platform keeps the
        # soft-only generic term above unchanged.
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: {{ .Values.weshModel.inferenceServiceName }}
    {{- end }}
    serviceAccountName: {{ .Values.qwen35Model.llmInferenceService.serviceAccountName }}
    containers:
      - name: main
        args:
          # Reduced well below the 32768 the 48GB models use - see this
          # file's header comment for the memory arithmetic.
          - --max-model-len={{ .Values.qwen35Model.maxModelLen }}
          - --gpu-memory-utilization={{ .Values.qwen35Model.gpuMemoryUtilization }}
          - --max-num-seqs={{ .Values.qwen35Model.maxNumSeqs }}
          - --enforce-eager
          - --enable-auto-tool-choice
          - --tool-call-parser=qwen3_xml
          - --reasoning-parser=qwen3
          {{- if .Values.tracing.enabled }}
          - --otlp-traces-endpoint={{ .Values.tracing.exporterEndpoint }}
          {{- end }}
          {{- if and .Values.maas.enabled $qwen35Maas }}
          # REPEAT, never append - see llminferenceservice-gptoss.yaml.
          - --served-model-name
          - {{ .Values.qwen35Model.servedModelName | quote }}
          - "publishers/{{ .Values.namespace }}/models/{{ .Values.qwen35Model.inferenceServiceName }}"
          - "{{ .Values.namespace }}/{{ $qwen35Maas.publishedName }}"
          {{- end }}
        resources:
          {{- toYaml .Values.qwen35Model.resources | nindent 10 }}
  router:
    gateway:
      refs:
        - name: {{ .Values.qwen35Model.llmInferenceService.routerGateway.name }}
          namespace: {{ .Values.qwen35Model.llmInferenceService.routerGateway.namespace }}
    route:
      http:
        spec:
          {{- include "models.llmisvcRouteSpec" (dict
                "name" .Values.qwen35Model.inferenceServiceName
                "namespace" .Values.namespace
                "publishedModel" .Values.qwen35Model.servedModelName
                "gatewayName" .Values.qwen35Model.llmInferenceService.routerGateway.name
                "gatewayNamespace" .Values.qwen35Model.llmInferenceService.routerGateway.namespace) | nindent 10 }}
    scheduler:
      annotations:
        {{- toYaml .Values.qwen35Model.llmInferenceService.schedulerAnnotations | nindent 8 }}
