{{- /*
ADR-0526 (WP-087): S3 read credentials for qwen3.5-9b. Same KServe
convention every model in this chart uses - an annotated Secret plus the
ServiceAccount that references it - and, like gpt-oss-20b's, deliberately
its OWN pair rather than a shared one. s3-serving-credentials.yaml's own
comment records why the SA is not shared: the qwen pair un-renders when
modelStorage.downloadJob.enabled flips that model to PVC mode, which
would take any model sharing it down with it. Same Vault credential
(modelsS3.externalSecret.remoteKey), same bucket - only the names differ.
*/ -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.qwen35Model.inferenceServiceName }}-s3-credentials
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: {{ .Values.qwen35Model.inferenceServiceName }}-s3-credentials
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          serving.kserve.io/s3-endpoint: {{ .Values.modelsS3.endpoint | quote }}
          serving.kserve.io/s3-region: {{ .Values.modelsS3.region | quote }}
          serving.kserve.io/s3-usehttps: "1"
          serving.kserve.io/s3-verifyssl: "1"
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.modelsS3.externalSecret.remoteKey | quote }}
        property: {{ .Values.modelsS3.externalSecret.accessKeyProperty | quote }}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.modelsS3.externalSecret.remoteKey | quote }}
        property: {{ .Values.modelsS3.externalSecret.secretKeyProperty | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.qwen35Model.inferenceServiceName }}-s3
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
secrets:
  - name: {{ .Values.qwen35Model.inferenceServiceName }}-s3-credentials
