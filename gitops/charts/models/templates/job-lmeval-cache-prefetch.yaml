{{- /*
Pre-warms pvc-lmeval-cache.yaml's PVC before the operator's LMEvalJob pod
(lmevaljob.yaml) ever tries to mount it - see that file's comment for the
two real TrustyAI operator bugs this works around. Two sequential
containers in ONE pod (Kubernetes' native initContainer ordering) rather
than two Jobs: each step needs a different already-proven library and
neither image has both, so instead of guessing which image has what,
each step gets the image already confirmed to have it, and initContainer
ordering guarantees the S3 tokenizer fetch completes before the dataset
fetch starts - both write into the same PVC, mounted once per container,
no separate wave or RWO-remount race needed.

A normal sync-wave resource, not an ArgoCD hook - same sync-wave (-15) as
pvc-lmeval-cache.yaml, same reasoning as job-model-download.yaml (the PVC's
first consumer must share its wave or a fresh sync deadlocks on the
WaitForFirstConsumer PVC). activeDeadlineSeconds is set explicitly (unlike
job-model-download.yaml) - in-cluster HF/S3 transfers have hung silently
for 11+h before on this cluster (a suspected xet range-get race, not
specific to this Job's payload), so this must fail loud within one
timeout, matching job-schema-apply.yaml's documented reasoning.
*/ -}}
{{- if .Values.lmEval.enabled }}
{{- range .Values.lmEval.jobs }}
{{- if .datasetCachePvc }}
{{- /* ADR-0546/WP-131: this Job pulls the tokenizer for a model that may
       already have moved to the shared source bucket, so it resolves the SAME
       per-model s3Source the model's own LLMInferenceService uses. A per-job
       s3Source overrides it; omitted, it follows the chart-wide default.
       Leaving this pinned to modelsS3 while a model moved would make lmeval
       jobs 404 on a tokenizer whose weights serve perfectly well - the two
       would then disagree about where that one model lives, which is a far
       more confusing failure than either being wrong on its own. */}}
{{- $s3 := include "models.s3Block" (list $ (.s3Source | default $.Values.s3Source)) | fromYaml }}
{{- $tokenizerDir := "" }}
{{- range .modelArgs }}
{{- if eq .name "tokenizer" }}
{{- $tokenizerDir = .value }}
{{- end }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .name }}-cache-prefetch
  namespace: {{ $.Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
    app.kubernetes.io/name: lm-eval
    app.kubernetes.io/component: model-quality-gate
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
    # WP-109: Job specs are immutable - any template change to an
    # already-completed prefetch Job (e.g. the per-job s3ModelName
    # generalization) hard-fails a plain apply. Replace recreates it, and
    # re-running a prefetch is idempotent by construction (it only
    # re-downloads the same files into the same PVC paths).
    #
    # Idempotent is not free (2026-09-03). Every sync that finds these three
    # Jobs OutOfSync deletes and recreates all three, and each recreation
    # re-pulls a ~318 MB storage-initializer plus the odh-ta-lmes-job image
    # onto whatever node they land on. On demo222, where the schedulable
    # masters sit at 85% of a 99.4 GiB image filesystem and kubelet's image GC
    # can no longer reclaim enough (FreeDiskSpaceFailed, twice, same numbers),
    # that was measured at 22 seconds from Job creation to EvictionThresholdMet
    # on ip-10-18-31-92 - one flap of a DiskPressure oscillation that costs the
    # mesh its istio-csr leader lease. Replace stays: it fixes a real sync wedge
    # and the pull cost is a symptom of a node too full, not of this annotation.
    # But do not add Replace to a Job family casually, and if this node class
    # stays near the eviction threshold the right lever is scheduling these
    # prefetches away from the masters - a live change, so two-step it per
    # WP-118. See memory diskpressure-master-cascades-into-mesh.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lm-eval
        app.kubernetes.io/component: model-quality-gate
    spec:
      {{- with $.Values.kueue.priorityClassName }}
      # ADR-0545/WP-127 - see values.yaml's kueue.priorityClassName comment
      # for why this ships empty by default (Replace=true recreation risk).
      priorityClassName: {{ . | quote }}
      {{- end }}
      # Keep these prefetches off the control-plane nodes (2026-09-03).
      # This is the lever the Replace=true comment above names: on demo222
      # the masters are schedulable (control-plane,master,worker) on 99.4
      # GiB devices while the plain workers have 249 GiB, so ordinary
      # workload images share a disk with etcd. All three prefetch Jobs
      # were landing on ip-10-18-31-92 - the exact node that crossed the
      # eviction threshold 22 seconds after they were created.
      #
      # MEASURED OUTCOME 2026-09-03: this DOES NOT move them. Recreated
      # with the affinity applied, all three pods landed on
      # ip-10-18-31-92 again. ip-10-18-15-25 - the only eligible
      # non-master in the zone - carries nvidia.com/gpu=true:PreferNoSchedule
      # (ADR-0351, keeping platform pods off the inference nodes), so the
      # +100 affinity bonus and the taint penalty apply to that SAME node
      # and feed one score, while the master carries neither.
      #
      # DO NOT try raising the weight. It is already at the maximum
      # (preferredDuringScheduling caps at 100), and the weight is not the
      # ceiling anyway: the two signals are scored by DIFFERENT scheduler
      # plugins, and in kube-scheduler's defaults TaintToleration outranks
      # NodeAffinity. A PreferNoSchedule taint on the only alternative node
      # therefore beats any node-affinity preference expressible, at any
      # weight. This is structural, not a tuning knob.
      #
      # Making it work needs a toleration for that taint. That was put to
      # the user and DECLINED: a 36-second no-GPU Job is a weak reason to
      # erode a taint another ADR placed deliberately, and "it is only a
      # short job" is how such a taint dies one exception at a time. The
      # block is kept rather than reverted because it is harmless, costs
      # nothing, and becomes correct the day the topology gains a second
      # non-master node in eu-west-2a or that taint is reconsidered on its
      # own merits.
      #
      # Ruled out before concluding: the RWO PVC is NOT pinning them. There
      # was no live VolumeAttachment and qwen35-9b-mmlu, mounting the same
      # lmeval-hf-cache, ran on ip-10-18-15-25. The volume moves freely
      # within the zone.
      #
      # The real cause is structural and is recorded, not treated: the
      # three etcd nodes have the SMALLEST disks in the cluster (99.4 GiB
      # against 249.4 on the GPU workers) and are the only schedulable ones
      # with that constraint. See memory diskpressure-master-cascades-into-mesh.
      #
      # PREFERRED, not required, and the distinction is load-bearing:
      # pvc-lmeval-cache's PV is zone-bound to eu-west-2a, and that zone
      # holds exactly two nodes - the pressured master and one worker. A
      # required rule would make all three Jobs unschedulable the moment
      # that single worker is unavailable, trading a disk problem for an
      # availability one. A preference moves them in practice and keeps
      # the master as fallback.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/master
                    operator: DoesNotExist
      restartPolicy: Never
      initContainers:
        - name: tokenizer-prefetch
          image: {{ $.Values.modelStorage.initializerImage }}
          command:
            - python3
            - -c
            - |
              import os, time
              import boto3
              from botocore.config import Config

              bucket = {{ $s3.bucket | quote }}
              # ADR-0534/WP-109: per-job S3 model dir (jobs now benchmark
              # more than the chart's own primary model - qwen3.5-9b and
              # its wesh PEFT variant for the base-vs-candidate
              # comparison); falls back to the chart-wide servedModelName
              # for the original qwen3.6 job.
              prefix = {{ printf "%s/%s" $s3.prefix (.s3ModelName | default $.Values.servedModelName) | quote }}
              dest = {{ $tokenizerDir | quote }}
              files = ["tokenizer.json", "tokenizer_config.json", "vocab.json", "merges.txt"]

              os.makedirs(dest, exist_ok=True)
              s3 = boto3.client(
                  "s3",
                  endpoint_url={{ printf "https://%s" $s3.endpoint | quote }},
                  region_name={{ $s3.region | quote }},
                  config=Config(signature_version="s3v4"),
              )

              for name in files:
                  key = f"{prefix}/{name}"
                  target = os.path.join(dest, name)
                  last_err = None
                  for attempt in range(1, 4):
                      try:
                          s3.download_file(bucket, key, target)
                          print(f"downloaded s3://{bucket}/{key} -> {target}")
                          last_err = None
                          break
                      except Exception as e:
                          last_err = e
                          print(f"attempt {attempt} failed for {key}: {e}")
                          time.sleep(5 * attempt)
                  if last_err is not None:
                      raise last_err

              print("tokenizer prefetch complete:", os.listdir(dest))
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: lmeval-hf-cache-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lmeval-hf-cache-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          volumeMounts:
            - name: dataset-cache
              mountPath: /cache
      containers:
        - name: dataset-prefetch
          image: registry.redhat.io/rhoai/odh-ta-lmes-job-rhel9@sha256:ca784ca932e8d5bb24fe4b25fb7e81b511d2d5f0a0612a5f16f01d8f544535ed
          command:
            - python3
            - -c
            - |
              import time
              from datasets import load_dataset

              repo = {{ .datasetHfRepo | quote }}
              config = {{ .datasetHfConfig | quote }}

              last_err = None
              for attempt in range(1, 4):
                  try:
                      ds = load_dataset(repo, config)
                      print(f"loaded {repo}/{config}: {ds}")
                      last_err = None
                      break
                  except Exception as e:
                      last_err = e
                      print(f"attempt {attempt} failed: {e}")
                      time.sleep(5 * attempt)
              if last_err is not None:
                  raise last_err

              print("dataset prefetch complete")
          env:
            - name: HF_HOME
              value: /cache/hf_home
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          volumeMounts:
            - name: dataset-cache
              mountPath: /cache
      volumes:
        - name: dataset-cache
          persistentVolumeClaim:
            claimName: {{ .datasetCachePvc }}
{{- end }}
{{- end }}
{{- end }}
