# Fixed hostname (advantage.routeHost helper): the OIDC redirect URI and
# Keycloak client's registered redirect URI both depend on it.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: advantage-frontend
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/agent: advantage
    app.kubernetes.io/component: frontend
  annotations:
    argocd.argoproj.io/sync-wave: "105"
spec:
  host: {{ include "advantage.routeHost" . }}
  to:
    kind: Service
    name: advantage-frontend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
