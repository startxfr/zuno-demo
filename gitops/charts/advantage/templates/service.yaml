apiVersion: v1
kind: Service
metadata:
  name: advantage-frontend
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/agent: advantage
    app.kubernetes.io/component: frontend
  annotations:
    argocd.argoproj.io/sync-wave: "95"
spec:
  selector:
    app.kubernetes.io/component: frontend
    zuno.io/agent: advantage
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# No OpenShift Route for the BFF: the frontend proxies chat calls to it
# server-side over the in-cluster ClusterIP Service only.
apiVersion: v1
kind: Service
metadata:
  name: advantage-bff
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/agent: advantage
    app.kubernetes.io/component: bff
  annotations:
    argocd.argoproj.io/sync-wave: "95"
spec:
  selector:
    app.kubernetes.io/component: bff
    zuno.io/agent: advantage
  ports:
    - name: http
      port: 8080
      targetPort: http
