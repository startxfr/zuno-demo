{{- if .Values.keycloak.adminClientId }}
# ADR-0530/WP-091: the zuno-admin-api client-credentials secret agent-bff
# presents to Keycloak's Admin REST API, backing GET /api/colleagues and
# GET /api/groups (ADR-0213, extended by ADR-0527's project RBAC tab).
#
# Deliberately its OWN ExternalSecret rather than another key on
# advantage-frontend-secrets: the frontend has no business holding a credential
# that can enumerate every user and group in the realm. ADR-0213 specified
# least privilege for this boundary and this is where that is enforced.
#
# Same Vault path as gitops/charts/keycloak's own
# zuno-admin-api-client-secret - Keycloak validates against the value it
# resolves through KC_VAULT, agent-bff presents the value it reads here, and
# a second generated secret on either side is a 401 that reads like an RBAC
# problem. One path, two readers.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: advantage-bff-admin-secret
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
    zuno.io/agent: advantage
  annotations:
    argocd.argoproj.io/sync-wave: "85"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: advantage-bff-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: KEYCLOAK_ADMIN_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.vault.adminApiClientSecretPath | trimPrefix "zuno/" }}
        property: client_secret
{{- end }}
