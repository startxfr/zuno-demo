apiVersion: v2
name: service-mesh
description: >-
  Deploys the servicemeshoperator (Red Hat OpenShift Service Mesh / Maistra)
  OLM package, its dedicated istio-operators namespace, and a
  ServiceMeshControlPlane/ServiceMeshMember set in zuno-mesh with a
  Vault-backed CA, via the startx cluster-istio chart.
type: application
version: 0.1.0
dependencies:
  - name: cluster-istio
    version: "21.3.277"
    repository: "alias:startx"
