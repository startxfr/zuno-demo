# Gates which resources render - cluster-istio.operatorIstio for the Day 0
# OLM install (gitops/apps/service-mesh/application-d0.yaml), the rest for
# the Day 1 operands (application-d1.yaml). All default false so `helm
# template` with no overrides renders nothing.
clusterIssuer:
  enabled: false
# Gates the vendored cert-manager-istio-csr subchart - see Chart.yaml's
# dependency `condition` for why this isn't nested under
# cert-manager-istio-csr itself.
istioCsr:
  enabled: false
istiocni:
  enabled: false
# Gates templates/istio.yaml (this wrapper's own Istio CR).
istio:
  enabled: false

# Discovered by ansible and injected via gitops_app_extra_helm_values on the
# -d1 apply; clusterissuer-istio.yaml renders nothing until it's set.
vaultServiceName: ""

istioVersion: v1.30.3
meshNamespace: zuno-mesh

# Thin wrapper around the startx `cluster-istio` chart (vendored as a Helm
# dependency, resolved via the "alias:startx" Helm repo) - but only for its
# generic operator subchart (operatorIstio), which renders nothing more than
# a Subscription driven entirely by these values. cluster-istio's own
# top-level templates (serviceMeshControlPlane.yaml/serviceMeshMember.yaml)
# are Maistra/OSSM-2-specific and aren't used here - OSSM 3 (Sail Operator)
# has no ServiceMeshControlPlane/ServiceMeshMember CRDs at all. The Day 1
# Istio/IstioCNI control plane is instead hand-authored in this chart's own
# templates/ (istio.yaml, istiocni.yaml), same split this repo already uses
# for cert-manager/cluster-certmanager (vendored chart installs the operator
# only; the wrapper owns the operand CRs) - just with cluster-istio unable
# to own the operand at all in this case, rather than choosing not to.
cluster-istio:
  context: &context
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: service-mesh
    app: service-mesh

  operatorIstio:
    enabled: false
    context:
      <<: *context
      version: "3.4.1"
    subscription:
      enabled: true
      name: servicemeshoperator3
      # ASSUMPTION: not yet verified against a live cluster (same posture as
      # cluster-istio's OSSM2 config before it). If `make d0 check
      # service-mesh` shows this is wrong, discover the real
      # package/channel/catalog/CSV from the cluster's PackageManifest
      # instead of trusting these hardcoded values.
      namespace: openshift-operators
      version: "v3.4.1"
      operator:
        channel: stable
        name: servicemeshoperator3
        csv: servicemeshoperator3
        # Deviates from the startx chart's own default (Manual): this repo
        # has no ansible InstallPlan-approval step, so every other
        # alias:startx-wrapped operator here (see cert-manager/values.yaml)
        # uses Automatic instead.
        installPlanApproval: Automatic
        source:
          name: redhat-operators
          namespace: openshift-marketplace
    operatorGroup:
      # openshift-operators already carries OpenShift's own global
      # AllNamespaces OperatorGroup - creating a second one here would make
      # OLM reject the Subscription (TooManyOperatorGroups). No dedicated
      # namespace/project either (project/projectOperator stay at the
      # vendored chart's own enabled: false default): unlike OSSM 2, OSSM 3
      # doesn't need one of its own.
      enabled: false

# Values validated against the actual published chart's values.schema.json
# (v0.16.0, https://charts.jetstack.io) - additionalProperties: false, so
# unknown keys (serviceAccount.name, fullnameOverride, priorityClassName -
# none of which this chart's schema supports) fail the render outright.
# ServiceAccount/Service names are NOT configurable here: both default to
# the fixed name "cert-manager-istio-csr" regardless of release name (see
# `cert-manager-istio-csr.name` in the chart's _helpers.tpl), which is why
# istio.yaml's global.caAddress and the Vault kubernetes-auth role
# (ansible/roles/vault) both hardcode that same name. No priorityClassName
# support in this chart version - a real limitation, not an oversight; if
# scheduling priority for istio-csr's own pods matters, revisit via
# `resources`/`nodeSelector` or a future chart version.
cert-manager-istio-csr:
  replicaCount: 2
  app:
    certmanager:
      # Namespace istio-csr creates its own CertificateRequests in - must be
      # where istio-csr itself runs (zuno-mesh), not cert-manager's namespace.
      namespace: zuno-mesh
      issuer:
        name: vault-issuer-istio
        kind: ClusterIssuer
        group: cert-manager.io
    controller:
      leaderElectionNamespace: zuno-mesh
      configmapNamespaceSelector: "istio-injection=enabled"
    istio:
      namespace: zuno-mesh
      revisions: ["default"]
    server:
      maxCertificateDuration: 1h
    tls:
      trustDomain: cluster.local
      certificateDuration: 24h
      certificateDNSNames:
        - cert-manager-istio-csr.zuno-mesh.svc
      istiodCertificateDuration: 1h
