{{- if and .Values.clusterIssuer.enabled .Values.vaultServiceName }}
# Renders only once vaultServiceName is set, after Vault's pki/ engine and the
# istio-issuer role/policy are provisioned (ansible/roles/vault). Deliberately
# a separate ClusterIssuer/PKI role from cert-manager's own vault-issuer
# (pki/sign/cert-manager) - isolates the mesh's SPIFFE trust root from
# general-purpose TLS certs. The ServiceMeshControlPlane (templates/istio.yaml)
# delegates CA duties to this issuer directly via spec.security.certificateAuthority.
#
# sync-wave must be negative: templates/istio.yaml's ServiceMeshControlPlane
# (wave 25) can't go Ready without this issuer already existing - a later
# wave here would deadlock ArgoCD's wave progression.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-issuer-istio
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  vault:
    server: "http://{{ .Values.vaultServiceName }}.zuno-vault.svc:8200"
    path: pki/sign/istio
    auth:
      kubernetes:
        role: istio-issuer
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          # cert-manager's own controller ServiceAccount processes the
          # CertificateRequest chain the ServiceMeshControlPlane's CA
          # delegation creates - same identity as cert-manager's own
          # vault-issuer ClusterIssuer. Must match
          # ansible/roles/vault/kustomize/unseal-configure/configmap.yaml's
          # auth/kubernetes/role/istio-issuer binding.
          name: cert-manager
{{- end }}
