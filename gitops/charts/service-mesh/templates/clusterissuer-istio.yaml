{{- if and .Values.clusterIssuer.enabled .Values.vaultServiceName }}
# Renders only once vaultServiceName is set, after Vault's pki/ engine and the
# istio-issuer role/policy are provisioned (ansible/roles/vault). Deliberately
# a separate ClusterIssuer/PKI role from cert-manager's own vault-issuer
# (pki/sign/cert-manager) - isolates the mesh's SPIFFE trust root from
# general-purpose TLS certs. cert-manager-istio-csr (not istiod) requests
# certs from this issuer directly.
#
# sync-wave must be negative: the vendored cert-manager-istio-csr subchart's
# own resources are unannotated (default wave "0") and its Deployment can't
# go Ready without this issuer already existing - a positive wave here would
# deadlock ArgoCD's wave progression (istio-csr never Healthy -> ClusterIssuer
# wave never reached -> istio-csr never Healthy).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-issuer-istio
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  vault:
    server: "http://{{ .Values.vaultServiceName }}.zuno-vault.svc:8200"
    path: pki/sign/istio
    auth:
      kubernetes:
        role: istio-issuer
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          # Fixed by the cert-manager-istio-csr chart itself (not
          # configurable via its values.schema.json) - see values.yaml.
          name: cert-manager-istio-csr
{{- end }}
