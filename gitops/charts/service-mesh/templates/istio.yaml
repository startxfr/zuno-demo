{{- if .Values.istio.enabled }}
# Created directly by this wrapper chart rather than by the vendored
# cluster-istio dependency's own serviceMeshControlPlane.yaml template
# (cluster-istio.istio.enabledControlPlane is left false) - that template
# hardcodes its spec with no values hook for spec.security.certificateAuthority,
# so it can't express delegating the mesh CA to the Vault-backed ClusterIssuer
# below. Renders after clusterissuer-istio (sync-wave -10) so the issuer
# already exists when this control plane comes up.
#
# ASSUMPTION: the spec.security.certificateAuthority shape below is asserted
# from general knowledge of OpenShift Service Mesh / Maistra's cert-manager
# integration, not verified against this operator's exact CSV
# ({{ .Values.istioSubscription.csv }}). Confirm the real field names via
# `oc explain servicemeshcontrolplane.spec.security --api-version=maistra.io/v2`
# on a live cluster (or the operator's docs) before relying on it - same
# posture as istioSubscription's channel/CSV pin above.
apiVersion: maistra.io/v2
kind: ServiceMeshControlPlane
metadata:
  name: {{ .Values.meshNamespace | default "default" | quote }}
  namespace: {{ .Values.meshNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  version: {{ .Values.istioVersion | quote }}
  telemetry:
    type: Istiod
  policy:
    type: Istiod
  general:
    logging:
      logAsJSON: true
  runtime:
    defaults:
      pod:
        priorityClassName: zuno-platform-critical
      container:
        imagePullPolicy: IfNotPresent
  gateways:
    enabled: true
    openshiftRoute:
      enabled: true
  addons:
    prometheus:
      enabled: true
  security:
    certificateAuthority:
      type: Custom
      custom:
        provider: cert-manager
        certManager:
          address: "vault-issuer-istio.cert-manager.io"
          issuerKind: ClusterIssuer
          issuerName: vault-issuer-istio
{{- end }}
