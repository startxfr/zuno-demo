{{- if .Values.istio.enabled }}
# CA delegated to cert-manager-istio-csr (pilot.env.ENABLE_CA_SERVER=false +
# global.caAddress) instead of istiod's built-in self-signed CA, so mesh
# workload identity certs chain to the same Vault PKI root as everything
# else cert-manager issues. Renders last (sync-wave 40), after
# clusterissuer-istio (-10), the cert-manager-istio-csr subchart (default
# wave 0) and istiocni (30) - ASSUMPTION: not verified against a live
# servicemeshoperator3 CSV; confirm ENABLE_CA_SERVER/caAddress is still the
# correct delegation mechanism for this operator version before relying on it.
apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: default
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  namespace: {{ .Values.meshNamespace }}
  updateStrategy:
    type: InPlace
    inactiveRevisionDeletionGracePeriodSeconds: 30
  values:
    global:
      networkPolicy:
        enabled: true
      proxy:
        startupProbe:
          enabled: true
          failureThreshold: 4
      meshID: zuno01
      istioNamespace: {{ .Values.meshNamespace }}
      priorityClassName: zuno-platform-critical
      imagePullPolicy: IfNotPresent
      caAddress: cert-manager-istio-csr.{{ .Values.meshNamespace }}.svc:443
      platform: openshift
    pilot:
      env:
        ENABLE_CA_SERVER: "false"
    # redhat-ods-applications is namespace-injected (istio-injection: enabled,
    # gitops/charts/namespaces), but these two RHOAI-managed workloads are
    # rejected by EVERY SCC once istio's init containers (proxy uid
    # 1001419999, the namespace range's last uid) are injected: RHOAI's own
    # run-as-ray-user SCC pins uid 1000 for kuberay, and
    # openshift-ai-localmodel-scc does the same for the localmodelnode agent
    # - the mixed-uid pod satisfies neither (VERIFIED live, 2026-08-13:
    # kuberay-operator ReplicaSet and kserve-localmodelnode-agent DaemonSet
    # both FailedCreate with "unable to validate against any security context
    # constraint", leaving DataScienceCluster's RayReady False at 0/1).
    # RHOAI owns those pod templates, so a per-pod inject=false annotation
    # isn't available - excluded here at the injector instead.
    #
    # 2026-08-15: widened to the rest of redhat-ods-applications' pure
    # controller-manager/operator pods (VERIFIED live: zuno-platform-quota's
    # 16-core limits.cpu was sized for these controllers' own ~11 real cores,
    # never revisited after namespace-wide mesh injection added a 2-core/1Gi
    # istio-proxy native sidecar to every one of the namespace's ~27 pods -
    # ~90+ cores of sidecar tax alone, blocking kserve-controller-manager
    # from scheduling at all, which cascades to both local model predictors
    # via the admission webhook). Re-verified the original comment's own
    # premise before widening rather than just copying the precedent: no
    # PeerAuthentication exists anywhere on this cluster (no mesh-wide STRICT
    # mTLS), Postgres auth here is Vault-sourced username/password not mTLS
    # client certs, and zuno-data's own default-deny NetworkPolicy already
    # allows ingress from the whole redhat-ods-applications namespace by
    # plain namespace-selector (ADR-0343's own "NetworkPolicy widening",
    # independent of mesh identity) - so losing the sidecar does not expose
    # an application data path for these either, the same reasoning
    # ADR-0343 already used for kuberay/localmodelnode-agent. Deliberately
    # NOT excluding maas-api, maas-controller or model-serving-api (these
    # carry real application/API traffic, not just controller-to-apiserver
    # reconciliation) or rhods-dashboard/dashboard-redirect (user-facing UI
    # traffic) - those stay meshed.
    sidecarInjectorWebhook:
      neverInjectSelector:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - kuberay
                - kserve-localmodelnode-agent
                - kserve-controller-manager
                - kserve-localmodel-controller-manager
                - data-science-pipelines-operator
                - feast-operator
                - mlflow-operator
                - trainer
                - training-operator
                - ai-gateway-operator
                - llm-d-batch-gateway-operator
                - llmisvc-controller-manager
                - ogx-k8s-operator
                - spark-operator
                - workload-variant-autoscaler
        - matchExpressions:
            - key: app
              operator: In
              values:
                - notebook-controller
                - odh-model-controller
                - odh-notebook-controller
        - matchExpressions:
            - key: control-plane
              operator: In
              values:
                - trustyai-service-operator
                - model-registry-operator
    telemetry:
      v2:
        prometheus:
          enabled: true
        enabled: true
      enabled: true
    # Lets sidecar Envoys export traces directly to the platform's shared
    # OTel Collector (gitops/charts/observability, zuno-otel-collector) -
    # actually enabled mesh-wide by templates/telemetry.yaml's Telemetry CR.
    # ASSUMPTION: meshConfig.extensionProviders/the "opentelemetry" provider
    # shape, and global.istioNamespace doubling as meshConfig.rootNamespace
    # via the Sail Operator's values passthrough, are not verified against a
    # live cluster.
    meshConfig:
      extensionProviders:
        - name: otel-tracing
          opentelemetry:
            service: zuno-otel-collector-collector.zuno-monitoring.svc.cluster.local
            port: 4317
  version: {{ .Values.istioVersion }}
{{- end }}
