apiVersion: apps/v1
kind: Deployment
metadata:
  name: salesforce-mcp
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: salesforce-mcp
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
    {{- if not .Values.image.digest }}
    {{- /* A digest-pinned image must not be rewritten by the :latest trigger. */}}
    image.openshift.io/triggers: |-
      {{ include "mcp-salesforce.imageTrigger" (dict "repository" .Values.image.repository "tag" .Values.image.tag "container" "salesforce-mcp") }}
    {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: salesforce-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: salesforce-mcp
      {{- with include "mcp-salesforce.digestAnnotations" .Values }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: salesforce-mcp
      priorityClassName: zuno-workload-default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: salesforce-mcp
          image: {{ include "mcp-salesforce.imageRef" .Values.image | quote }}
          imagePullPolicy: {{ include "mcp-salesforce.imagePullPolicy" .Values.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SALESFORCE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: url
            - name: SALESFORCE_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: access_token
            - name: MCP_GATEWAY_WORKLOAD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-gateway-workload-token
                  key: token
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
