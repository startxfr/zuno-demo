apiVersion: apps/v1
kind: Deployment
metadata:
  name: salesforce-mcp
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: salesforce-mcp
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
    {{- if not .Values.image.digest }}
    {{- /* A digest-pinned image must not be rewritten by the :latest trigger. */}}
    image.openshift.io/triggers: |-
      {{ include "mcp-salesforce.imageTrigger" (dict "repository" .Values.image.repository "tag" .Values.image.tag "container" "salesforce-mcp") }}
    {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: salesforce-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: salesforce-mcp
      {{- with include "mcp-salesforce.digestAnnotations" .Values }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: salesforce-mcp
      priorityClassName: zuno-workload-default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: salesforce-mcp
          image: {{ include "mcp-salesforce.imageRef" .Values.image | quote }}
          imagePullPolicy: {{ include "mcp-salesforce.imagePullPolicy" .Values.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SALESFORCE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: url
            - name: SALESFORCE_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: access_token
            {{- /* WP-225 lot C: rendered only when set, so the defaults roll no pod. */}}
            {{- if .Values.callAssertion.publicKey }}
            - name: MCP_CALL_ASSERTION_PUBLIC_KEY
              value: {{ .Values.callAssertion.publicKey | quote }}
            - name: MCP_CALL_ASSERTION_MAX_BODY_BYTES
              value: {{ .Values.callAssertion.maxBodyBytes | int64 | quote }}
            {{- end }}
            {{- if .Values.callAssertion.required }}
            {{- if not .Values.callAssertion.publicKey }}
            {{- fail "callAssertion.required needs callAssertion.publicKey" }}
            {{- end }}
            - name: MCP_CALL_ASSERTION_REQUIRED
              value: "true"
            {{- end }}
            # ADR-0603 M12 (WP-225 lot B): owner scoping by the signed caller context.
            - name: SALESFORCE_OWNER_SCOPING
              value: {{ ternary "owner" "off" .Values.ownerScoping.enabled | quote }}
            - name: SALESFORCE_ALL_RECORDS_GROUPS
              value: {{ join "," (.Values.ownerScoping.allRecordsGroups | default list) | quote }}
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
