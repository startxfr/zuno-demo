# Dedicated, least-privilege service account. No RBAC binding: this service
# only talks to the Salesforce REST API over HTTPS and serves HTTP, never
# the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: salesforce-mcp
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: salesforce-mcp
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
