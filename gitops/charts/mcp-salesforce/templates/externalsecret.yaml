# ADR-0024/ADR-0208: the shared Salesforce technical identity (a single
# bearer access token), seeded at Vault path zuno/salesforce/technical by
# ansible/roles/vault/tasks/install.yml. Never hardcoded here.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.credentials.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  # ADR-0602/WP-223: this namespace's own SecretStore, which reads only the keys platform/vault/secret-access.yaml grants it.
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ .Values.credentials.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: {{ .Values.credentials.vaultPath }}
        property: url
    - secretKey: access_token
      remoteRef:
        key: {{ .Values.credentials.vaultPath }}
        property: access_token
