externalSecret:
  enabled: false

oauth:
  enabled: false
  clientId: openshift
  realm: zuno

  # ADR-0347 (corrects ADR-0346): name of a ConfigMap in openshift-config
  # bundling the CAs able to verify the Keycloak route, wired into the
  # OpenID IDP's openID.ca so the oauth-server pod trusts it. The route's
  # actual serving cert is issued by cert-manager's vault-issuer
  # (ADR-0316), NOT the default ingress router cert ADR-0346 originally
  # assumed - verified live (openssl s_client) that only the Vault PKI
  # root chain verifies. The ConfigMap is cluster-specific, so Helm can't
  # render it: ansible/roles/openshift_oauth/tasks/install.yml bundles it
  # from Secret keycloak-tls (zuno-auth, the Vault-issued cert's CA) plus
  # the router CA (covering the ingress.operatorManaged fallback) before
  # applying the d1 Application. Empty string (default) omits the
  # openID.ca stanza entirely, keeping pre-ADR-0346 rendering unchanged.
  openidCaConfigMap: ""

  # ADR-0346: htpasswd IDP originating from the external startx
  # cluster-auth chart that also runs on the demo cluster. This chart only
  # REFERENCES the startx-managed Secret in openshift-config (never
  # creates it), so the gate defaults off: enabling it on a cluster
  # without that Secret means the IDP is silently not honored.
  htpasswd:
    enabled: false
    name: startx-htpasswd_auth
    secretName: startx-htpasswd-htpasswd-auth

  # ADR-0346: startx-branded login/error/provider-selection templates,
  # again referencing startx-managed Secrets in openshift-config. Off by
  # default for the same missing-Secret reason as htpasswd above.
  templates:
    enabled: false
    login: startx-login-template
    error: startx-errors-template
    providerSelection: startx-providers-template

  # ADR-0346: null (default) omits spec.tokenConfig entirely; the demo
  # cluster's d1 Application sets 86400 (24h), matching the startx
  # cluster-auth chart it absorbs.
  tokenConfig:
    accessTokenMaxAgeSeconds: null

# ADR-0347: cluster-wide complement to oauth.openidCaConfigMap above
# (defense in depth, same CA reachable two ways). NOT nested under oauth:
# because proxy/cluster.spec.trustedCA is a cluster-wide setting in
# principle - it's consumed by every operator whose trusted-ca-bundle
# ConfigMap carries the CNO injection label
# config.openshift.io/inject-trusted-cabundle: "true" (confirmed live:
# openshift-authentication-operator's already does) - but OAuth's OpenID
# IDP is the only current consumer, so it lives in this chart rather than
# a dedicated one. The ConfigMap data is cluster-specific and created by
# ansible/roles/openshift_oauth/tasks/install.yml, same as
# oauth.openidCaConfigMap; only the reference (this chart's
# templates/cluster-trusted-ca.yaml) is Helm-rendered. Off by default.
clusterTrustedCA:
  # "does this chart OWN proxy/cluster.spec.trustedCA.name?" - NOT "is a
  # private CA in use". That distinction is the 2026-09-03 fix: the template
  # is `{{- if }}`-gated and the Application carries Prune=false, so turning
  # this off renders nothing and strands whatever value is already live on
  # the object. Off must therefore be expressed as configMapName: "", not as
  # enabled: false. Left false here so `helm template` with no overrides
  # still renders zero Proxy objects (ADR-0347 acceptance criterion 5), and
  # so a cluster whose admin legitimately owns spec.trustedCA - a corporate
  # egress-proxy bundle - is never clobbered by this chart.
  enabled: false
  # Which ConfigMap in openshift-config the Proxy trusts, or "" to actively
  # release the field. Written at apply time by
  # ansible/roles/openshift_oauth/tasks/install.yml from the one fact that
  # decides it - whether this cluster has a private PKI root worth trusting
  # cluster-wide - so the ConfigMap's existence and this reference can no
  # longer disagree. "" is the safe default: naming a ConfigMap that does not
  # exist degrades the `network` clusteroperator cluster-wide, which is
  # exactly what happened between 2026-08-16 and 2026-09-03.
  configMapName: ""

# Literal placeholder - gitops/apps/openshift-oauth/application-d1.yaml's
# inline values carry the literal string "apps.mycluster.example.com",
# which ansible/tasks/apply_gitops_app.yml text-replaces with the real
# discovered domain before applying (same mechanism
# gitops/apps/keycloak/application-d1.yaml already uses). This default is
# only exercised by `helm template`/`helm lint` run directly against this
# chart, not by the real GitOps apply path.
clusterBaseDomain: apps.mycluster.example.com
