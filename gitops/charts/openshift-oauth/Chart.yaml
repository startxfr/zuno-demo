apiVersion: v2
name: openshift-oauth
description: >-
  ADR-0320: cluster OAuth OpenID identity provider backed by Keycloak's
  new "openshift" confidential client, plus the ExternalSecret that syncs
  its Vault-seeded client secret into openshift-config (the namespace the
  cluster OAuth singleton resolves identity-provider secrets from -
  ExternalSecret can't cross namespaces, so this is a separate
  ExternalSecret from gitops/charts/keycloak's own, reading the same
  Vault path into a different namespace, same pattern documented in
  ansible/roles/keycloak/README.md for the Postgres secret crossing
  zuno-data -> zuno-auth). ADR-0346/0347: the OpenID IDP trusts the
  Vault PKI root that actually signs the cert-manager-issued Keycloak
  route (ADR-0316) via openID.ca, bundled with the router CA as a
  fallback (ConfigMaps copied into openshift-config by
  ansible/roles/openshift_oauth); a Proxy/cluster patch adds the same
  Vault root to cluster-wide trust as defense in depth. The chart also
  absorbs the startx cluster-auth settings (htpasswd IDP, login
  templates, tokenConfig) as values-gated blocks referencing the
  startx-managed Secrets - this chart is the single intended owner of
  the OAuth/cluster singleton's full spec.
type: application
version: 0.3.0
appVersion: "0.1.0"
