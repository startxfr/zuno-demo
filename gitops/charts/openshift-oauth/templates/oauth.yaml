{{- if .Values.oauth.enabled }}
# ADR-0320 / ADR-0346: this chart is the single intended owner of the
# cluster OAuth singleton's full spec, including the settings absorbed
# from the external startx cluster-auth chart (htpasswd IDP, login
# templates, tokenConfig) - exactly one ArgoCD Application may manage
# OAuth/cluster, or the two self-heal-fight over it (see ADR-0346).
# The OpenID IDP stays FIRST in identityProviders (list order is the
# login-page provider order). mappingMethod: add lets a Keycloak login
# attach to an already-existing OpenShift User instead of creating a
# duplicate; the htpasswd IDP keeps startx's mappingMethod: claim.
apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
  labels:
    zuno.io/managed-by: argocd
  annotations:
    # OAuth/cluster is a required config.openshift.io singleton - the API
    # server refuses DELETE on it unconditionally (confirmed live, even for
    # cluster-admin), so letting ArgoCD prune it on Application removal can
    # never succeed and leaves the Application stuck Terminating forever.
    # ansible/roles/openshift_oauth/tasks/uninstall.yml resets spec fields
    # explicitly instead - this annotation just stops ArgoCD from ever
    # attempting the impossible delete.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  identityProviders:
    - name: {{ .Values.oauth.clientId }}
      mappingMethod: add
      type: OpenID
      openID:
        clientID: {{ .Values.oauth.clientId }}
        clientSecret:
          name: openshift-client-secret
{{- if .Values.oauth.openidCaConfigMap }}
        ca:
          name: {{ .Values.oauth.openidCaConfigMap }}
{{- end }}
        claims:
          preferredUsername: ["preferred_username"]
          name: ["name"]
          email: ["email"]
          groups: ["groups"]
        issuer: "https://keycloak.{{ .Values.clusterBaseDomain }}/realms/{{ .Values.oauth.realm }}"
{{- if .Values.oauth.htpasswd.enabled }}
    - name: {{ .Values.oauth.htpasswd.name }}
      mappingMethod: claim
      type: HTPasswd
      htpasswd:
        fileData:
          name: {{ .Values.oauth.htpasswd.secretName }}
{{- end }}
{{- if .Values.oauth.templates.enabled }}
  templates:
    login:
      name: {{ .Values.oauth.templates.login }}
    error:
      name: {{ .Values.oauth.templates.error }}
    providerSelection:
      name: {{ .Values.oauth.templates.providerSelection }}
{{- end }}
{{- if .Values.oauth.tokenConfig.accessTokenMaxAgeSeconds }}
  tokenConfig:
    accessTokenMaxAgeSeconds: {{ .Values.oauth.tokenConfig.accessTokenMaxAgeSeconds }}
{{- end }}
{{- end }}
