{{- if .Values.externalSecret.enabled }}
# Separate ExternalSecret from gitops/charts/keycloak's own
# openshift-client-secret (same Vault path, different consuming
# namespace - ExternalSecret can't cross namespaces). Key is named
# "clientSecret" (not "client_secret"): OpenShift's OAuth OpenID
# identityProvider.openID.clientSecret convention requires that exact key
# name in the referenced Secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openshift-client-secret
  namespace: openshift-config
  labels:
    zuno.io/managed-by: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openshift-client-secret
    creationPolicy: Owner
  data:
    - secretKey: clientSecret
      remoteRef:
        key: keycloak/openshift-client
        property: client_secret
{{- end }}
