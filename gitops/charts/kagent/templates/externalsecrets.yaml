# ADR-0600 (WP-207): kagent's secrets from Vault, never in values. Paths are seeded by
# ansible/roles/vault (kagent/postgresql-app) and ansible/roles/kagent (keycloak/kagent, kagent/app).
# The controller reads the database URL from a file (database.postgres.urlFile).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kagent-database
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: ClusterSecretStore
  target:
    name: kagent-database
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        url: "postgres://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@zuno-postgresql-primary.{{ .Values.egress.databaseNamespace }}.svc:{{ .Values.egress.databasePort }}/kagent?sslmode=require"
  data:
    - secretKey: username
      remoteRef: {key: kagent/postgresql-app, property: username}
    - secretKey: password
      remoteRef: {key: kagent/postgresql-app, property: password}
---
# oauth2-proxy: the Keycloak client secret (the same value Keycloak reads through KC_VAULT) and its cookie secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kagent-front-door
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: ClusterSecretStore
  target:
    name: kagent-front-door
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef: {key: keycloak/{{ .Values.frontDoor.clientId }}, property: client_secret}
    - secretKey: cookie-secret
      remoteRef: {key: kagent/app, property: front_door_cookie_secret}
