# project.enabled + operator.enabled render the Namespace/OperatorGroup/
# Subscription; nfd.enabled renders the NodeFeatureDiscovery CR. All default
# false so templates render nothing by default.
cluster-nfd:
  context: &context
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: nfd
    app: nfd
  project:
    enabled: false
    context:
      <<: *context
    project:
      enabled: true
      # PreSync ArgoCD hook.
      hooked: true
      type: namespace
      name: openshift-nfd
      display_name: Zuno NFD Operator
      description: Node Feature Discovery, configured by Zuno
      requester: zuno
  operator:
    enabled: false
    context:
      <<: *context
    subscription:
      enabled: true
      name: nfd
      namespace: openshift-nfd
      operator:
        channel: stable
        name: nfd
        installPlanApproval: Automatic
        source:
          name: redhat-operators
          namespace: openshift-marketplace
    operatorGroup:
      enabled: true
      name: openshift-nfd-group
      namespace: openshift-nfd
  nfd:
    enabled: false
    list:
      - name: nfd-instance
        namespace: openshift-nfd
        # Minimal spec: instance/topology updater disabled, not needed for this
        # demo.
        spec: |-
          instance: ""
          topologyUpdater: false
