{{- if .Values.perses.enabled }}
# The Perses server instance. One instance for the whole cluster (ADR-0551
# decision 2) - namespace scoping is achieved by where each
# PersesDashboard/PersesDatasource lives plus instanceSelector matching this
# CR's `dashboards: perses` label, not by running one Perses per namespace.
#
# `serviceAccountName` below is bound to `cluster-monitoring-view`
# (clusterrolebinding-prometheus-reader.yaml) so the "prometheus"
# PersesGlobalDatasource can authenticate to thanos-querier via
# `client.kubernetesAuth.enable: true` - the pod's own projected
# ServiceAccount token, refreshed automatically by the kubelet. This is a
# deliberate simplification versus Grafana's own two-phase bearer-token
# dance (serviceaccount-prometheus-reader.yaml/ansible/roles/grafana's
# runtime token mint): Perses's `client.kubernetesAuth` field exists
# specifically for this in-cluster-Prometheus case. UNVERIFIED against a
# live Perses pod as of this change (no Perses instance exists anywhere on
# this cluster yet, greenfield per ADR-0551's Context) - WP-138's live
# verification step is the confirmation gate; if kubernetesAuth doesn't
# authenticate against thanos-querier in practice, Grafana's own
# static-token pattern is the documented fallback.
#
# No Route/external access is configured - ADR-0551 explicitly scoped
# console access to the UIPlugin only (uiplugin-dashboards.yaml), not a
# direct Perses UI, so `spec.service`/`spec.tls` are left at the operator's
# defaults (in-cluster ClusterIP only).
apiVersion: perses.dev/v1alpha2
kind: Perses
metadata:
  name: perses
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
    dashboards: "perses"
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  serviceAccountName: perses-prometheus-reader
{{- end }}
