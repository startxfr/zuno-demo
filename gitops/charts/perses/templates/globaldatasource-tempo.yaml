{{- if .Values.perses.enabled }}
# Same backend as gitops/charts/grafana/templates/datasource-tempo.yaml -
# ADR-0029's distributed traces (gitops/charts/tempo's TempoMonolithic in
# zuno-monitoring, no gateway/multi-tenancy, no auth) - NOT RHOAI's own
# separate Tempo (data-science-tempostack), which does need auth/tenant
# headers; do not copy that pattern here, it targets a different backend.
# Cluster-scoped per ADR-0551 decision 3.
#
# ADR-0552: targets RHOAI's existing `data-science-perses` instance (see
# globaldatasource-prometheus.yaml's header for why). `plugin.spec.proxy`
# shape matches RHOAI's own datasource examples; `TempoDatasource` plugin
# kind confirmed via `oc explain`-adjacent inspection of RHOAI's own
# `tempo-datasource` resource, which uses the same plugin kind for its own
# (differently-configured) Tempo.
apiVersion: perses.dev/v1alpha2
kind: PersesGlobalDatasource
metadata:
  name: tempo
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  instanceSelector:
    matchLabels:
      platform.opendatahub.io/part-of: monitoring
  config:
    default: false
    display:
      name: Tempo
    plugin:
      kind: TempoDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: {{ .Values.datasources.tempo.url | quote }}
{{- end }}
