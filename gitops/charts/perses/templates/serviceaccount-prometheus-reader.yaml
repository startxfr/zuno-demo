{{- if .Values.perses.enabled }}
# Identity the Perses server pod runs as (perses.yaml's spec.serviceAccountName),
# bound to cluster-monitoring-view below so the "prometheus" datasource's
# client.kubernetesAuth can authenticate to thanos-querier using this pod's
# own projected token - no static Secret needed, unlike
# gitops/charts/grafana/templates/serviceaccount-prometheus-reader.yaml's
# long-lived-token Secret (that pattern exists there only because a
# GrafanaDatasource's secureJsonData needs a static value; Perses's
# kubernetesAuth reads the pod's live projected token instead).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: perses-prometheus-reader
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: perses-prometheus-reader
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: perses-prometheus-reader
    namespace: {{ .Values.monitoringNamespace }}
{{- end }}
