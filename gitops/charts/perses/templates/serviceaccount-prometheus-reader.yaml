{{- if .Values.perses.enabled }}
# ADR-0552: Bearer-token identity for the "prometheus" PersesGlobalDatasource
# to read thanos-querier. Deliberately in `redhat-ods-monitoring`, NOT
# `zuno-monitoring` (ADR-0552's one departure from "additive only, never
# inside RHOAI's namespace"): RHOAI's own working `PersesDatasource`
# examples (`cluster-prometheus-datasource` etc.) reference their secret by
# bare name with no namespace qualifier, from which this repo infers the
# reference resolves relative to the Perses server's own namespace
# (`redhat-ods-monitoring`, where `data-science-perses` runs) - confirmed at
# WP-138's live verification step, not proven here. Named distinctly
# (`zuno-perses-*`) so it can never collide with or be confused for any
# RHOAI-owned identity; nothing RHOAI-owned is read, modified, or deleted by
# this template.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zuno-perses-prometheus-reader
  namespace: redhat-ods-monitoring
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
---
# Same "no auto-generated token Secret since Kubernetes 1.24" rationale as
# gitops/charts/grafana/templates/serviceaccount-prometheus-reader.yaml -
# Perses's `proxy.spec.secret` expects a static, long-lived value, not a
# projected/expiring token.
apiVersion: v1
kind: Secret
metadata:
  name: zuno-perses-prometheus-reader-token
  namespace: redhat-ods-monitoring
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-29"
    kubernetes.io/service-account.name: zuno-perses-prometheus-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zuno-perses-prometheus-reader
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: zuno-perses-prometheus-reader
    namespace: redhat-ods-monitoring
{{- end }}
