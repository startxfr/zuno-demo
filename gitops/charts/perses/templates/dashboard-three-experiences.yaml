{{- if .Values.perses.enabled }}
# WP-225 lot B (ADR-0603 M15): no `user` label or variable; the "one budget" table is
# by Keycloak group, as in the Grafana twin.
# ADR-0587 (WP-184, WP-208): typed-schema translation of
# gitops/charts/grafana/templates/dashboard-three-experiences.yaml - same panels,
# same PromQL; same Perses conventions and caveats as dashboard-usage-cost.yaml
# (units dropped, rows as Grid sections, ListVariable best-effort).
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: zuno-three-experiences
  namespace: redhat-ods-monitoring
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "26"
spec:
  instanceSelector:
    matchLabels:
      platform.opendatahub.io/part-of: monitoring
  config:
    display:
      name: "Five experiences"
      description: "ADR-0587/WP-184: UnifAI, Open WebUI, OpenClaw, Dify and kagent on one governed backend - calls, tokens, cost, guardrails, routing and the shared per-user budget, by experience client."
    duration: 24h
    refreshInterval: 30s
    variables:
      - kind: ListVariable
        spec:
          name: client
          display:
            name: client
          allowAllValue: true
          allowMultiple: true
          plugin:
            kind: PrometheusLabelValuesVariable
            spec:
              labelName: client
              matchers:
                - "zuno_model_calls_total"
              datasource:
                kind: PrometheusDatasource
                name: prometheus
    panels:
      callsByClient:
        kind: Panel
        spec:
          display:
            name: "Model calls by experience (over range)"
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: prometheus
                    query: >-
                      sum by (client) (increase(zuno_model_calls_total{client=~"$client"}[$__range]))
                    seriesNameFormat: "{{`{{client}}`}}"
      tokensByClient:
        kind: Panel
        spec:
          display:
            name: "Tokens by experience (over range)"
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: prometheus
                    query: >-
                      sum by (client, kind) (increase(zuno_model_tokens_total{client=~"$client"}[$__range]))
                    seriesNameFormat: "{{`{{client}}`}} ({{`{{kind}}`}})"
      costByClient:
        kind: Panel
        spec:
          display:
            name: "Estimated cost by experience (over range)"
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: prometheus
                    query: >-
                      sum by (client) (increase(zuno_model_cost_usd_total{client=~"$client"}[$__range]))
                    seriesNameFormat: "{{`{{client}}`}}"
      guardrailsByClient:
        kind: Panel
        spec:
          display:
            name: "Guardrails evaluations by experience (over range)"
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: prometheus
                    query: >-
                      sum by (client, outcome) (increase(zuno_guardrails_evaluations_total{client=~"$client"}[$__range]))
                    seriesNameFormat: "{{`{{client}}`}} ({{`{{outcome}}`}})"
      providerByClient:
        kind: Panel
        spec:
          display:
            name: "Which provider served each experience (over range)"
          plugin:
            kind: Table
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: prometheus
                    query: >-
                      sum by (client, provider, outcome) (increase(zuno_model_calls_total{client=~"$client"}[$__range]))
      skippedByClient:
        kind: Panel
        spec:
          display:
            name: "Candidates skipped for availability (over range)"
          plugin:
            kind: Table
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: prometheus
                    query: >-
                      sum by (client, provider, reason) (increase(zuno_model_candidates_skipped_total{client=~"$client"}[$__range]))
      groupAcrossClients:
        kind: Panel
        spec:
          display:
            name: "One group across the experiences: tokens (over range)"
          plugin:
            kind: Table
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: prometheus
                    query: >-
                      sum by (group, client) (increase(zuno_model_tokens_by_group_total{client=~"$client"}[$__range]))
      errorRateByClient:
        kind: Panel
        spec:
          display:
            name: "Model call error rate by experience (over range)"
          plugin:
            kind: Table
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: prometheus
                    query: >-
                      sum by (client) (increase(zuno_model_calls_total{client=~"$client", outcome="error"}[$__range])) / sum by (client) (increase(zuno_model_calls_total{client=~"$client"}[$__range]))
      latencyP95ByClient:
        kind: Panel
        spec:
          display:
            name: "Model call latency p95 by experience (over range)"
          plugin:
            kind: Table
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: prometheus
                    query: >-
                      histogram_quantile(0.95, sum by (le, client) (increase(zuno_model_call_duration_ms_milliseconds_bucket{client=~"$client"}[$__range])))
      clusterReadsByTool:
        kind: Panel
        spec:
          display:
            name: "Cluster read tool calls by tool and outcome (over range)"
          plugin:
            kind: Table
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: prometheus
                    query: >-
                      sum by (tool, outcome) (increase(zuno_tool_invocations_total{mcp_server="k8s"}[$__range]))
      toolCallsByTool:
        kind: Panel
        spec:
          display:
            name: "All governed tool calls by tool and outcome (over range)"
          plugin:
            kind: Table
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: prometheus
                    query: >-
                      sum by (mcp_server, tool, outcome) (increase(zuno_tool_invocations_total[$__range]))
    layouts:
      - kind: Grid
        spec:
          display:
            title: "Same backend, five experiences"
            collapse:
              open: true
          items:
            - x: 0
              y: 0
              width: 12
              height: 8
              content:
                $ref: "#/spec/panels/callsByClient"
            - x: 12
              y: 0
              width: 12
              height: 8
              content:
                $ref: "#/spec/panels/tokensByClient"
            - x: 0
              y: 8
              width: 12
              height: 8
              content:
                $ref: "#/spec/panels/costByClient"
            - x: 12
              y: 8
              width: 12
              height: 8
              content:
                $ref: "#/spec/panels/guardrailsByClient"
      - kind: Grid
        spec:
          display:
            title: "Same models, same routing"
            collapse:
              open: true
          items:
            - x: 0
              y: 0
              width: 12
              height: 8
              content:
                $ref: "#/spec/panels/providerByClient"
            - x: 12
              y: 0
              width: 12
              height: 8
              content:
                $ref: "#/spec/panels/skippedByClient"
      - kind: Grid
        spec:
          display:
            title: "One budget across the experiences"
            collapse:
              open: true
          items:
            - x: 0
              y: 0
              width: 24
              height: 8
              content:
                $ref: "#/spec/panels/groupAcrossClients"
      - kind: Grid
        spec:
          display:
            title: "Same health, five experiences"
            collapse:
              open: true
          items:
            - x: 0
              y: 0
              width: 12
              height: 8
              content:
                $ref: "#/spec/panels/errorRateByClient"
            - x: 12
              y: 0
              width: 12
              height: 8
              content:
                $ref: "#/spec/panels/latencyP95ByClient"
      - kind: Grid
        spec:
          display:
            title: "Same tools, governed: cluster reads (ADR-0600)"
            collapse:
              open: true
          items:
            - x: 0
              y: 0
              width: 12
              height: 8
              content:
                $ref: "#/spec/panels/clusterReadsByTool"
            - x: 12
              y: 0
              width: 12
              height: 8
              content:
                $ref: "#/spec/panels/toolCallsByTool"
{{- end }}
