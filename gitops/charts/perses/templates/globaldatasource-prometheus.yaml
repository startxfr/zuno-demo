{{- if .Values.perses.enabled }}
# Same backend as gitops/charts/grafana/templates/datasource-prometheus.yaml
# (thanos-querier, ADR-0029's zuno_*/zuno_bff_* series), cluster-scoped
# (PersesGlobalDatasource) per ADR-0551 decision 3 so every PersesDashboard
# references it by name regardless of its own namespace.
#
# ADR-0552: targets RHOAI's existing `data-science-perses` instance (its own
# live label, `platform.opendatahub.io/part-of: monitoring` - verify this
# hasn't changed before applying) instead of running an independent second
# instance - the original design broke RHOAI's dashboards live, see
# ADR-0551's dated correction note.
#
# plugin.spec.proxy shape and client.tls.caCert copy RHOAI's own working
# `cluster-prometheus-datasource` (redhat-ods-monitoring) exactly, reusing
# its `prometheus-web-tls-ca` ConfigMap - same endpoint, same CA, no need to
# duplicate it. `proxy.spec.secret` is this chart's own
# zuno-perses-prometheus-reader-token (serviceaccount-prometheus-reader.yaml),
# never RHOAI's own `cluster-prometheus-datasource-secret`.
apiVersion: perses.dev/v1alpha2
kind: PersesGlobalDatasource
metadata:
  name: prometheus
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  instanceSelector:
    matchLabels:
      platform.opendatahub.io/part-of: monitoring
  client:
    tls:
      enable: true
      caCert:
        type: configmap
        name: prometheus-web-tls-ca
        namespace: redhat-ods-monitoring
        certPath: service-ca.crt
  config:
    default: false
    display:
      name: Prometheus
    plugin:
      kind: PrometheusDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: {{ .Values.datasources.prometheus.url | quote }}
            secret: zuno-perses-prometheus-reader-token
{{- end }}
