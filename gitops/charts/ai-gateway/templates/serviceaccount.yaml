# Dedicated, least-privilege service account (ADR-0052). No RBAC binding:
# this service only calls HTTP APIs (local/SaaS model providers, Keycloak
# JWKS), never the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ai-gateway
    zuno.io/managed-by: argocd
