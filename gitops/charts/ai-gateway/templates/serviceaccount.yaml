# Dedicated, least-privilege service account. Its only RBAC is the read-only
# Role of templates/role-model-readiness.yaml (ADR-0591), when enabled.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ai-gateway
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
