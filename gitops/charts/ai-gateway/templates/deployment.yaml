apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ai-gateway
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "60"
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-gateway
    spec:
      serviceAccountName: ai-gateway
      priorityClassName: zuno-workload-default
      automountServiceAccountToken: false
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ai-gateway
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KEYCLOAK_ISSUER
              value: {{ .Values.keycloakIssuer | quote }}
            - name: LOCAL_MODEL_ENDPOINT
              value: {{ .Values.localModelEndpoint | quote }}
            - name: LOCAL_MODEL_NAME
              value: {{ .Values.localModelName | quote }}
            - name: PROVIDER_ROUTING_PATH
              value: /app/config/provider-routing.yaml
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.providerSecrets.openai }}
                  key: api_key
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.providerSecrets.gemini }}
                  key: api_key
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.providerSecrets.anthropic }}
                  key: api_key
                  optional: true
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.providerSecrets.mistral }}
                  key: api_key
                  optional: true
            # ADR-0114: MaaS adapter prototype, default off - see
            # components/ai-gateway/app/maas_adapter.py and
            # platform/ai-gateway/provider-routing.yaml's `via_maas` field.
            - name: MAAS_ADAPTER_ENABLED
              value: {{ .Values.maasAdapter.enabled | quote }}
            - name: MAAS_GATEWAY_ENDPOINT
              value: {{ .Values.maasAdapter.endpoint | quote }}
            - name: MAAS_GATEWAY_API_KEY_ENV
              value: "MAAS_GATEWAY_API_KEY"
            - name: MAAS_EXTERNAL_EGRESS_ENABLED
              value: {{ .Values.maasAdapter.externalEgressEnabled | quote }}
            - name: MAAS_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.maasAdapter.secretName }}
                  key: api_key
                  optional: true
            # ADR-0104: semantic cache, default off - see
            # components/ai-gateway/app/semantic_cache.py and
            # platform/ai-gateway/provider-routing.yaml's `cache_enabled`
            # field.
            - name: SEMANTIC_CACHE_ENABLED
              value: {{ .Values.semanticCache.enabled | quote }}
            - name: SEMANTIC_CACHE_TTL_SECONDS
              value: {{ .Values.semanticCache.ttlSeconds | quote }}
            - name: EMBEDDING_SERVICE_URL
              value: {{ .Values.semanticCache.embeddingServiceUrl | quote }}
            - name: REDIS_ADDR
              value: {{ .Values.semanticCache.redis.addr | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.semanticCache.redis.secretName }}
                  key: REDIS_PASSWORD
                  optional: true
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: provider-routing
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: provider-routing
          configMap:
            name: {{ .Values.providerRoutingConfigMap }}
        - name: tmp
          emptyDir: {}
