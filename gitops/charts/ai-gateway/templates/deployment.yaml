apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ai-gateway
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "60"
    image.openshift.io/triggers: |-
      {{ include "ai-gateway.imageTrigger" (dict "repository" .Values.image.repository "tag" .Values.image.tag "container" "ai-gateway") }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-gateway
      annotations:
        # The LLMInferenceService controller (RHOAI 3.5.0-ea.2 llm-d)
        # auto-generates a DestinationRule for gpt-oss-20b's
        # -kserve-workload-svc with trafficPolicy.tls.mode: SIMPLE and
        # caCertificates pointing at the default ServiceAccount token path
        # - a path that doesn't exist here since this pod sets
        # automountServiceAccountToken: false (hardening). That makes
        # istio-proxy's SDS secret fetch fail outright, so every call to
        # gpt-oss-20b gets an immediate "Connection reset by peer" - Envoy
        # can never build the TLS context the (controller-owned, not ours
        # to edit) DestinationRule demands. gpt-oss-20b's vLLM container
        # already terminates real TLS itself (--ssl-certfile/--ssl-keyfile),
        # so a second Istio TLS layer is redundant anyway - excluding this
        # port removes Envoy from the outbound path entirely and lets the
        # app's own TLS reach it directly (same class of fix as mariadb's
        # excludeInboundPorts, see
        # gitops/charts/mariadb/templates/mariadb.yaml). Port-scoped, not
        # IP-scoped: every LLMInferenceService this cluster deploys lands
        # on the same container port 8000, so this covers the whole
        # controller-bug class, not just this one model.
        traffic.sidecar.istio.io/excludeOutboundPorts: "8000"
    spec:
      serviceAccountName: ai-gateway
      priorityClassName: zuno-workload-default
      automountServiceAccountToken: false
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ai-gateway
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KEYCLOAK_ISSUER
              value: {{ .Values.keycloakIssuer | default (printf "https://keycloak.%s/realms/zuno" .Values.clusterBaseDomain) | quote }}
            - name: KEYCLOAK_JWKS_URL
              value: {{ .Values.keycloakJwksUrl | quote }}
            - name: LOCAL_MODEL_ENDPOINT
              value: {{ .Values.localModelEndpoint | quote }}
            - name: LOCAL_MODEL_NAME
              value: {{ .Values.localModelName | quote }}
            - name: PROVIDER_ROUTING_PATH
              value: /app/config/provider-routing.yaml
            # ADR-0415: same ConfigMap/volume as PROVIDER_ROUTING_PATH
            # above (see platform/ai-gateway/kustomization.yaml).
            - name: IMAGE_PROVIDER_ROUTING_PATH
              value: /app/config/image-provider-routing.yaml
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.providerSecrets.openai }}
                  key: api_key
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.providerSecrets.gemini }}
                  key: api_key
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.providerSecrets.anthropic }}
                  key: api_key
                  optional: true
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.providerSecrets.mistral }}
                  key: api_key
                  optional: true
            # ADR-0417: Codestral, a dedicated key/project from
            # MISTRAL_API_KEY above.
            - name: MISTRAL_CODESTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.providerSecrets.mistral_codestral }}
                  key: api_key
                  optional: true
            # ADR-0415: image-generation provider (stable-diffusion-xl via
            # OVHcloud AI Endpoints) - see app/image_providers.py.
            - name: OVHCLOUD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.providerSecrets.ovhcloud }}
                  key: api_key
                  optional: true
            # ADR-0114: MaaS adapter prototype, default off - see
            # components/ai-gateway/app/maas_adapter.py and
            # platform/ai-gateway/provider-routing.yaml's `via_maas` field.
            - name: MAAS_ADAPTER_ENABLED
              value: {{ .Values.maasAdapter.enabled | quote }}
            - name: MAAS_GATEWAY_ENDPOINT
              value: {{ .Values.maasAdapter.endpoint | quote }}
            - name: MAAS_GATEWAY_API_KEY_ENV
              value: "MAAS_GATEWAY_API_KEY"
            - name: MAAS_EXTERNAL_EGRESS_ENABLED
              value: {{ .Values.maasAdapter.externalEgressEnabled | quote }}
            - name: MAAS_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.maasAdapter.secretName }}
                  key: api_key
                  optional: true
            # ADR-0521 (WP-076) step 3: preferred over MAAS_GATEWAY_API_KEY
            # above - see app/maas_adapter.py's own comment. Points at the
            # audience-scoped projected token below, not the pod's default
            # SA token (automountServiceAccountToken: false, a deliberate
            # hardening choice this doesn't reverse).
            - name: MAAS_SA_TOKEN_PATH
              value: /var/run/secrets/maas/token
            # ADR-0104: semantic cache, default off - see
            # components/ai-gateway/app/semantic_cache.py and
            # platform/ai-gateway/provider-routing.yaml's `cache_enabled`
            # field.
            - name: SEMANTIC_CACHE_ENABLED
              value: {{ .Values.semanticCache.enabled | quote }}
            - name: SEMANTIC_CACHE_TTL_SECONDS
              value: {{ .Values.semanticCache.ttlSeconds | quote }}
            - name: EMBEDDING_SERVICE_URL
              value: {{ .Values.semanticCache.embeddingServiceUrl | quote }}
            - name: REDIS_ADDR
              value: {{ .Values.semanticCache.redis.addr | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.semanticCache.redis.secretName }}
                  key: REDIS_PASSWORD
                  optional: true
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            # 2026-08-21: local-gpt-oss's LLMInferenceService pod terminates
            # real TLS on port 8000 (see platform/ai-gateway/
            # provider-routing.yaml's own comment on that endpoint) with a
            # cert issued by the cluster's openshift-service-serving-signer
            # CA - not in this pod's default trust store. Points
            # app/providers.py's local-candidate client at the namespace's
            # own openshift-service-ca.crt ConfigMap (standard OpenShift
            # per-namespace CA bundle, auto-populated, no new resource
            # needed) instead of disabling verification.
            - name: LOCAL_GPT_OSS_CA_BUNDLE
              value: /etc/ssl/openshift-service-ca/service-ca.crt
          volumeMounts:
            - name: provider-routing
              mountPath: /app/config
              readOnly: true
            - name: openshift-service-ca
              mountPath: /etc/ssl/openshift-service-ca
              readOnly: true
            - name: maas-sa-token
              mountPath: /var/run/secrets/maas
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: provider-routing
          configMap:
            name: {{ .Values.providerRoutingConfigMap }}
        - name: openshift-service-ca
          configMap:
            name: openshift-service-ca.crt
        # ADR-0521 (WP-076) step 3: a purpose-scoped token, not the pod's
        # default SA mount (deliberately off, see
        # automountServiceAccountToken: false above) - only this one
        # audience, only where this one client needs it, kubelet-rotated
        # in place before expiry (app/maas_adapter.py reads it fresh per
        # call rather than caching, so rotation is transparent). Audience
        # matches maas-gateway-auth's kubernetesTokenReview.audiences
        # exactly (`oc get authpolicy maas-gateway-auth -n
        # openshift-ingress` - live-confirmed 2026-08-26).
        - name: maas-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: https://kubernetes.default.svc
                  expirationSeconds: 3600
        - name: tmp
          emptyDir: {}
