{{- if .Values.modelRouting.generated }}
# ADR-0581 (WP-164 lot 2): the model-routing policy generated from the
# admitted agents release. Regenerated by platform/okf/generate_stack_config.py
# and committed by the okf-promote pull request; the gateway reloads the
# mounted copy when it changes (app/routing_watch.py), no restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-gateway-model-routing
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ai-gateway
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "65"
data:
  model-routing-policy.yaml: |
{{ .Files.Get "files/model-routing.generated.yaml" | indent 4 }}
{{- end }}
