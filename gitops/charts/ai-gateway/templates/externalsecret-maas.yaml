# ADR-0201 (WP-27): API-key lifecycle for the MaaS adapter's programmatic-
# client path (components/ai-gateway/app/maas_adapter.py) - resolves the
# Vault-seeded MaaS gateway API key (ansible/roles/vault/tasks/install.yml)
# into the Secret templates/deployment.yaml already expects at
# .Values.maasAdapter.secretName, key "api_key" (optional: the Deployment
# comes up even before this Secret exists, same as every other opt-in
# credential in this chart). Rotation: re-run `make d1 install vault` after
# updating the key at Vault path maas/gateway-api-key (or via
# ansible/confidential.yml) - refreshInterval below picks it up within an
# hour without a pod restart (ExternalSecrets Operator re-syncs the K8s
# Secret; the running ai-gateway process re-reads MAAS_GATEWAY_API_KEY only
# on next pod start, same limitation every env-var-sourced credential in
# this chart already has).
{{- /* Gated on apiKeyEnabled, NOT maasAdapter.enabled (WP-076 step 4,
2026-08-26 live incident): rendering this ExternalSecret while the Vault
path is unseeded leaves it permanently Degraded ("could not get secret
data from provider"), and ArgoCD's wave-ordered sync then never reaches
the Deployment in the later wave - the whole app wedges. This used to be
gated on `enabled` alone, written for a world where enabling the adapter
meant the key was seeded first; since WP-076 step 3 made the SA-token
path primary, `enabled: true` no longer implies that, and live-enabling
it here wedged the sync exactly as this comment already warned it would.
apiKeyEnabled is the operator's explicit "I minted and seeded a real key"
signal - stays false (this file renders nothing) until then. */}}
{{- if and .Values.maasAdapter.apiKeyEnabled .Values.maasAdapter.secretName }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.maasAdapter.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "55"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.maasAdapter.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: maas/gateway-api-key
        property: api_key
{{- end }}
