{{- if .Values.maasAdapter.classCredentials.enabled }}
# ADR-0624 clause 5 / WP-306: the dedicated MaaS identity of the stress quota classes. The ai-gateway sends this
# ServiceAccount's token (not its own) to MaaS for those classes, so a load test spends the budget of the models chart's
# `<model>-stress` MaaSSubscriptions (altGatewayPeers.stress), never the ai-gateway's. No RBAC: the token is only a MaaS
# identity (the MaaS gateway reviews it, audience https://kubernetes.default.svc).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.maasAdapter.classCredentials.serviceAccount }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ai-gateway
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
automountServiceAccountToken: false
---
# A long-lived token the token controller fills in, so no secret material is committed or templated. The Deployment mounts
# it as the file `token`; rotating it is deleting this Secret and letting Argo CD recreate it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.maasAdapter.classCredentials.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ai-gateway
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "51"
    kubernetes.io/service-account.name: {{ .Values.maasAdapter.classCredentials.serviceAccount }}
type: kubernetes.io/service-account-token
{{- end }}
