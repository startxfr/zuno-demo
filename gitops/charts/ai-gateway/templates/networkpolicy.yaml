# ADR-0052/ADR-0037: precise ingress allow-list, not a zuno-ai-run namespace
# baseline (see gitops/charts/namespaces/values.yaml's platformNamespaces
# comment). Only Agent Runtime calls the AI Gateway - plus, per ADR-0053,
# the same-namespace "acceptance-gate" `make check` identity (see
# gitops/charts/agent-runtime/templates/networkpolicy.yaml's comment for
# why this is a deliberate, narrow addition and not a baseline;
# security_checks.py's ai_gateway_local_only_forces_local_provider calls
# this service directly).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-gateway
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "70"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-runtime
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: acceptance-gate
      ports:
        - protocol: TCP
          port: 8080
