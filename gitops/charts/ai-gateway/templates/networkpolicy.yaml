# Precise ingress allow-list, not a namespace-wide baseline: Agent
# Runtime, the acceptance-gate test Job, and MCP Gateway (ADR-0415's
# generate_image handler calls POST /v1/images/generations directly,
# components/mcp-gateway/app/handlers/image_gen.py) may call this
# service. mcp-gateway was missing here from ADR-0415's original
# landing - live-cluster-confirmed 2026-08-23: every generate_image call
# for every agent failed with a 503 ("upstream connect error... reset
# reason: connection timeout" - a NetworkPolicy silently dropping the
# SYN, not an application-level error either side ever logged), because
# this policy never granted mcp-gateway ingress despite it being the
# only caller of this specific route.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-gateway
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "70"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-runtime
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: acceptance-gate
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-gateway
        # WP-087: the mlops training pipeline runs the SAME acceptance gate
        # from zuno-mlops, so the acceptance-gate peer above cannot reach
        # it - an ingress `from` peer carrying only a podSelector matches
        # same-namespace pods, and the pipeline pod is in another
        # namespace. It timed out at the TCP level on every scenario that
        # touches this service, which the ADR-0028 rate then scored as the
        # agent misbehaving rather than as a policy gap.
        #
        # namespaceSelector AND podSelector inside ONE peer element is an
        # intersection, not a union: only KFP component pods, and only
        # those in zuno-mlops. Splitting them into two list items would
        # instead admit that whole namespace plus every KFP pod anywhere.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-mlops
          podSelector:
            matchLabels:
              pipelines.kubeflow.org/v2_component: "true"
      ports:
        - protocol: TCP
          port: 8080
