# ADR-0104: resolves the same zuno/redis/session-store Vault credential
# gitops/charts/tekos already resolves for its own Redis-backed session
# store (ADR-0042) - one shared Redis instance/password, multiple
# independent consumers each syncing their own copy of the Secret since
# secretKeyRef can't cross namespaces (Redis itself lives in zuno-auth,
# this gateway lives in zuno-ai-run).
{{- if .Values.semanticCache.redis.secretName }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.semanticCache.redis.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "55"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.semanticCache.redis.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: redis/session-store
        property: password
{{- end }}
