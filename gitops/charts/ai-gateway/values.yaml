namespace: zuno-ai-run

image:
  repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/ai-gateway
  tag: latest
  pullPolicy: IfNotPresent

replicas: 1

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

keycloakIssuer: https://keycloak-zuno.apps.mycluster.example.com/realms/zuno
localModelEndpoint: http://qwen25-7b-instruct-predictor.zuno-ai-run.svc:8080/v1
localModelName: qwen2.5-7b-instruct

# Generated by the `llm` GitOps app from
# platform/ai-gateway/provider-routing.yaml.
providerRoutingConfigMap: zuno-provider-routing

# Generated by ExternalSecrets the `llm` GitOps app registers per provider.
# optional: true so the Deployment comes up before keys are populated.
providerSecrets:
  openai: llm-provider-openai
  gemini: llm-provider-gemini
  anthropic: llm-provider-anthropic
  mistral: llm-provider-mistral

# ADR-0114: MaaS adapter prototype (components/ai-gateway/app/
# maas_adapter.py). Disabled by default - flipping `enabled` alone changes
# nothing, since no provider in platform/ai-gateway/provider-routing.yaml
# opts in (`via_maas: true`) yet; both the global switch here and the
# per-provider opt-in must be true for a request to actually route through
# MaaS. `endpoint` is OpenShift AI MaaS's OpenAI-compatible model-access
# endpoint (`maas-default-gateway`, ADR-0201); `secretName` is the
# ExternalSecret-managed key, optional so the Deployment still comes up
# before it exists.
maasAdapter:
  enabled: false
  endpoint: ""
  secretName: llm-provider-maas

# ADR-0104: opt-in semantic cache in the existing platform Redis
# (gitops/charts/redis, zuno-auth namespace - same instance
# gitops/charts/tekos already uses for sessions). Disabled by default;
# flipping `enabled` alone changes nothing, since no provider-routing.yaml
# entry opts in (`cache_enabled: true`) yet - both the global switch here
# and the per-model opt-in must be true for a request to actually be
# cached (same two-gate pattern as ADR-0114's maasAdapter above).
semanticCache:
  enabled: false
  ttlSeconds: "3600"
  embeddingServiceUrl: http://embeddings-predictor.zuno-ai-run.svc:8080/v1/embeddings
  redis:
    addr: "zuno-redis-master.zuno-auth.svc.cluster.local:6379"
    secretName: ai-gateway-redis-credentials
