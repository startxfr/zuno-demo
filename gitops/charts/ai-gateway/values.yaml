# Default values for the ai-gateway chart. Overridden per-environment
# through gitops/apps/ai-gateway/application.yaml's spec.source.helm.values.

namespace: zuno-ai-run

image:
  repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-run/ai-gateway
  tag: latest
  pullPolicy: IfNotPresent

replicas: 1

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

keycloakIssuer: https://keycloak-zuno.apps.example.com/realms/zuno
localModelEndpoint: http://qwen25-7b-instruct-predictor.zuno-ai-run.svc:8080/v1
localModelName: qwen2.5-7b-instruct

# Same-namespace ConfigMap generated from platform/ai-gateway/provider-routing.yaml
# by the `llm` GitOps app (gitops/apps/llm) - see platform/ai-gateway/kustomization.yaml.
# Previously mounted into agent-runtime; moved here with the routing logic
# itself (ADR-0009).
providerRoutingConfigMap: zuno-provider-routing

# Same-namespace Secrets generated by the ExternalSecrets the `llm` GitOps
# app registers against secret/zuno/providers/<name> - see
# platform/ai-gateway/externalsecret-*.yaml. `optional: true` so this
# Deployment still comes up before an operator populates the real keys.
# Previously mounted into agent-runtime; moved here with the provider
# clients themselves (ADR-0009).
providerSecrets:
  openai: llm-provider-openai
  gemini: llm-provider-gemini
  anthropic: llm-provider-anthropic
  mistral: llm-provider-mistral
