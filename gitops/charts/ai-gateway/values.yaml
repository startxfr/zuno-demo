namespace: zuno-ai-run

image:
  repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/ai-gateway
  tag: latest
  # Always, not IfNotPresent - with a mutable :latest tag, IfNotPresent
  # serves whatever stale image the node cached, silently ignoring
  # rebuilds (VERIFIED live 2026-08-16 across multiple components).
  # Revisit when WP-04 pins immutable tags.
  pullPolicy: Always

replicas: 1

# ADR-0101 (roadmap WP-12): the HA-capable shape - a PodDisruptionBudget
# (templates/poddisruptionbudget.yaml) and topology spread across nodes,
# both correct and safe at any replica count including the current
# demo-scale replicas: 1 above (a PDB with minAvailable 1 simply protects
# the sole pod from voluntary eviction; whenUnsatisfiable ScheduleAnyway
# makes the spread constraint a soft preference, never a scheduling
# blocker on a single-node/single-zone cluster). replicas itself is left
# at the current demo footprint deliberately - raising it to the >=2
# ADR-0101 describes is an environment-specific override, paired with the
# operator's failover drill (see that ADR's Operator follow-up), not a
# silent default change here.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# apps.mycluster.example.com is the substitution placeholder
# (ansible/tasks/apply_gitops_app.yml rewrites it in the Application
# manifest, which passes it back here via helm values - same pattern as
# gitops/charts/tekos). VERIFIED live (2026-08-15): the previous
# hardcoded keycloak-zuno.apps.mycluster.example.com default shipped
# as-is (no Application passed a value) AND used the retired
# keycloak-zuno.<domain> host alias - JWT validation failed on its
# first real exercise with an unresolvable JWKS hostname.
clusterBaseDomain: apps.mycluster.example.com
# Empty means "https://keycloak.<clusterBaseDomain>/realms/zuno".
keycloakIssuer: ""
# JWKS is fetched over the in-cluster Service, not the external Route -
# the issuer string above is only compared against the token's iss
# claim, while this URL is what actually gets dialed (the two are
# separate env vars in app/auth.py for exactly this). VERIFIED live
# (2026-08-15): fetching via the Route fails TLS verification (the
# chain ends at Vault's internal root CA, not in the container's
# system store), and the in-cluster hop stays plain-HTTP by Keycloak's
# own design (spec.http.httpEnabled, edge termination) inside the
# mesh/NetworkPolicy boundary (zuno-auth allows zuno-ai-run).
keycloakJwksUrl: http://zuno-service.zuno-auth.svc:8080/realms/zuno/protocol/openid-connect/certs
localModelEndpoint: http://qwen25-7b-instruct-predictor.zuno-ai-run.svc:8080/v1
localModelName: qwen2.5-7b-instruct

# Generated by the `llm` GitOps app from
# platform/ai-gateway/provider-routing.yaml.
providerRoutingConfigMap: zuno-provider-routing

# Generated by ExternalSecrets the `llm` GitOps app registers per provider.
# optional: true so the Deployment comes up before keys are populated.
providerSecrets:
  openai: llm-provider-openai
  gemini: llm-provider-gemini
  anthropic: llm-provider-anthropic
  mistral: llm-provider-mistral

# ADR-0114: MaaS adapter prototype (components/ai-gateway/app/
# maas_adapter.py). Disabled by default - flipping `enabled` alone changes
# nothing, since no provider in platform/ai-gateway/provider-routing.yaml
# opts in (`via_maas: true`) yet; both the global switch here and the
# per-provider opt-in must be true for a request to actually route through
# MaaS. `endpoint` is OpenShift AI MaaS's OpenAI-compatible model-access
# endpoint (`maas-default-gateway`, ADR-0201); `secretName` is the
# ExternalSecret-managed key, optional so the Deployment still comes up
# before it exists.
maasAdapter:
  enabled: false
  endpoint: ""
  secretName: llm-provider-maas
  # ADR-0201 (WP-27): distinct from `enabled` above - routing the LOCAL
  # model's own traffic through MaaS (enabled: true alone) never leaves
  # the cluster network; letting an EXTERNAL SaaS candidate (via_maas:
  # true in provider-routing.yaml) actually reach MaaS is a separate
  # egress/lifecycle decision (ADR-0201 acceptance: "external-model
  # egress, if enabled, is explicitly marked optional"). Operator+user
  # decide (WP-27 brief's follow-up) - stays false until that decision is
  # made, regardless of `enabled` above.
  externalEgressEnabled: false

# ADR-0104: opt-in semantic cache in the existing platform Redis
# (gitops/charts/redis, zuno-auth namespace - same instance
# gitops/charts/tekos already uses for sessions). Disabled by default;
# flipping `enabled` alone changes nothing, since no provider-routing.yaml
# entry opts in (`cache_enabled: true`) yet - both the global switch here
# and the per-model opt-in must be true for a request to actually be
# cached (same two-gate pattern as ADR-0114's maasAdapter above).
semanticCache:
  enabled: false
  ttlSeconds: "3600"
  embeddingServiceUrl: http://embeddings-predictor.zuno-ai-run.svc:8080/v1/embeddings
  redis:
    addr: "zuno-redis-master.zuno-auth.svc.cluster.local:6379"
    secretName: ai-gateway-redis-credentials
