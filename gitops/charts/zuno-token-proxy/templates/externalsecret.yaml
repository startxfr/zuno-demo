{{- include "zuno-token-proxy.validate" . }}
# The client secret of the experience's Keycloak client, the same Vault item Keycloak reads
# through KC_VAULT (gitops/charts/keycloak experienceClients). Only the proxy mounts it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zuno-token-proxy
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  # ADR-0602/WP-223: this namespace's own SecretStore, which reads only the keys platform/vault/secret-access.yaml grants it.
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: SecretStore
  target:
    name: zuno-token-proxy
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: {{ .Values.vaultKey | default (printf "keycloak/%s" .Values.clientId) }}
        property: {{ .Values.vaultProperty }}
    {{- if .Values.inboundAuth.enabled }}
    # WP-225 lot C: the keys the proxy's callers must present (INBOUND_KEYS_FILE).
    - secretKey: inbound_keys
      remoteRef:
        key: {{ .Values.inboundAuth.vaultKey | default (printf "%s/token-proxy" .Values.clientId) }}
        property: {{ .Values.inboundAuth.vaultProperty }}
    {{- end }}
