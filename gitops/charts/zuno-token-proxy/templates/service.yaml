apiVersion: v1
kind: Service
metadata:
  name: zuno-token-proxy
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: zuno-token-proxy
    zuno.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: zuno-token-proxy
  ports:
    - name: http
      port: 8080
      targetPort: http
