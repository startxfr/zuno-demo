# ADR-0601: one release per experience client that cannot forward a user token
# (Dify, kagent). The client points its OpenAI base URL at
# http://zuno-token-proxy.<namespace>.svc:8080/v1 and its MCP URL at .../mcp,
# with any dummy key; the proxy replaces it.

# Namespace of the experience client (labelled zuno.io/experience-client=true
# by the namespaces chart). Required.
namespace: ""

image:
  # Built by the "token-proxy" build component (ansible/roles/token_proxy_build).
  repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/zuno-token-proxy
  # image.tag must stay "latest" until a release is cut - see RELEASING.md (two parallel image paths).
  tag: latest
  # ADR-0603 M16: written by platform/supply-chain/render_release_digests.py from the release
  # ledger, never by hand. Set, it wins over tag (repository@digest, IfNotPresent, no :latest trigger).
  digest: ""
  pullPolicy: Always

replicas: 1

clusterBaseDomain: apps.mycluster.example.com
# The Keycloak ROUTE, never the in-cluster http service (its issuer differs, see
# the keycloak-internal-svc trap). Empty = https://keycloak.<clusterBaseDomain>/realms/zuno/...
tokenUrl: ""

# Keycloak client of this experience (its service account carries the persona
# claim, ADR-0593). Its secret is read from Vault keycloak/<clientId>.
clientId: ""
vaultKey: ""            # default keycloak/<clientId>
vaultProperty: client_secret

aiGatewayUrl: http://ai-gateway.zuno-ai-run.svc:8080
mcpGatewayUrl: http://mcp-gateway.zuno-ai-run.svc:8080

# Fixed headers per upstream; they replace any header of the same name the client sends.
# X-Zuno-Agent must be the experience-client name declared in the agents release (ADR-0592).
aiHeaders: {}
mcpHeaders: {}

# Pods of the client namespace allowed to call the proxy (empty = every pod of the namespace).
clientPodSelector: {}

egress:
  # The two gateways' namespace and pod port (WP-179 ingress peers).
  gatewayNamespace: zuno-ai-run
  gatewayPort: 8080
  # Pod and Service networks, excluded from the HTTPS-out rule; the client's role
  # reads them from Network.config.openshift.io/cluster, as ansible/roles/open_webui does.
  clusterCIDRs:
    - 10.128.0.0/14
    - 172.30.0.0/16

# ADR-0602 clause 10 (WP-225 lot C): the proxy authenticates its callers. Enabled,
# a request must carry `Authorization: Bearer <key>` with one of the keys of Vault
# <vaultKey> (property vaultProperty, one key per line; default <clientId>/token-proxy);
# anything else is answered 401 and nothing is relayed. The key never reaches a
# gateway: the gateways see only this client's Keycloak token. The client (Dify's
# model and MCP providers, the knowledge adapter, kagent) must send the key first:
# enable it together with the client side (ansible dify_token_proxy_inbound_auth),
# and grant the Vault key to the namespace in platform/vault/secret-access.yaml.
# Off by default: any pod of the client namespace, as before (NetworkPolicy only).
inboundAuth:
  enabled: false
  vaultKey: ""
  vaultProperty: inbound_keys

refreshRatio: "0.7"
upstreamTimeoutSeconds: "300"

externalSecrets:
  refreshInterval: 1h
  # ADR-0602/WP-223: the namespace's own SecretStore (was the cluster-wide vault-backend).
  secretStore: vault
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
