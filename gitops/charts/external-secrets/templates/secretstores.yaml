{{- if and .Values.secretStores.enabled .Values.vaultServiceName }}
{{- /*
ADR-0602 clause 2 / WP-223 (finding C2): one SecretStore per namespace
replaces the single ClusterSecretStore vault-backend, whose Vault role
eso-reader read all of zuno/data/* for an ExternalSecret in ANY namespace -
so anyone allowed to create an ExternalSecret (ocp-ai-dev and ocp-ai-ops in
zuno-ai-run, confirmed live 2026-11-06) could read every platform secret.

Each store authenticates as its own namespace's ServiceAccount vault-reader
to the Vault Kubernetes-auth role ns-<namespace>, whose policy allows only
the keys platform/vault/secret-access.yaml lists for that namespace (the
Vault configure Job writes those policies and roles from the same file).

Rendered here only for namespaces that already exist when this d1
Application syncs (created by gitops/charts/namespaces at d0, or built into
OpenShift): ArgoCD dry-runs every resource before applying any, so a single
store in a namespace that does not exist yet would block ALL stores. The
namespaces a later chart creates render their store in that chart instead
(cert-manager, openclaw's zuno-claw-*). platform/vault/check_secret_access.py
enforces that every namespace in secret-access.yaml gets exactly one store.
*/ -}}
{{- range .Values.secretStores.namespaces }}
---
# ADR-0602/WP-223: the identity the {{ . }} store presents to Vault. No pod
# runs as it; ESO requests a short-lived token for it (TokenRequest).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Values.secretStores.serviceAccountName }}
  namespace: {{ . }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "29"
automountServiceAccountToken: false
---
# ADR-0602/WP-223: reads only the keys secret-access.yaml grants {{ . }}.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ $.Values.secretStores.name }}
  namespace: {{ . }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  provider:
    vault:
      server: "{{ if $.Values.secretStores.tls }}https{{ else }}http{{ end }}://{{ $.Values.vaultServiceName }}.{{ $.Values.vaultNamespace }}.svc:8200"
      path: zuno
      version: v2
      {{- if $.Values.secretStores.tls }}
      # The service-ca bundle OpenShift publishes in every namespace; Vault's
      # listener certificate is issued by the service CA.
      caProvider:
        type: ConfigMap
        name: openshift-service-ca.crt
        key: service-ca.crt
      {{- end }}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ns-{{ . }}
          serviceAccountRef:
            name: {{ $.Values.secretStores.serviceAccountName }}
{{- end }}
{{- end }}
