{{- if and .Values.clusterSecretStore.enabled .Values.vaultServiceName }}
# Renders only once vaultServiceName is set, after Vault provisions the
# Kubernetes auth method and eso-reader role this store depends on.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  provider:
    vault:
      server: "http://{{ .Values.vaultServiceName }}.zuno-vault.svc:8200"
      path: zuno
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-reader
          serviceAccountRef:
            name: external-secrets
            namespace: zuno-vault
{{- end }}
