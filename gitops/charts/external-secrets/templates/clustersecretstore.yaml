{{- if .Values.vaultServiceName }}
# vaultServiceName is unset on this role's first apply_gitops_app.yml
# call (install.yml, operator only) - this ClusterSecretStore only
# renders once ansible/roles/external_secrets/tasks/configure.yml's
# second call supplies it, after Vault's own configure step has set up
# the Kubernetes auth method + eso-reader role it depends on.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  provider:
    vault:
      server: "http://{{ .Values.vaultServiceName }}.zuno-data.svc:8200"
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-reader
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
{{- end }}
