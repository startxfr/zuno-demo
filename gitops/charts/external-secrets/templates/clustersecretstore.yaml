{{- if and .Values.clusterSecretStore.enabled .Values.vaultServiceName }}
# Rendered by the zuno-external-secrets-d1 Application (clusterSecretStore.
# enabled), applied by ansible/roles/external_secrets/tasks/install.yml
# after zuno-external-secrets-d0 (operator.enabled) is Synced+Healthy.
# vaultServiceName is only discovered/injected on that -d1 call, after
# Vault's own install step has set up the Kubernetes auth method +
# eso-reader role this ClusterSecretStore depends on - until then this
# renders nothing even with clusterSecretStore.enabled set.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  provider:
    vault:
      server: "http://{{ .Values.vaultServiceName }}.zuno-vault.svc:8200"
      path: zuno
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-reader
          serviceAccountRef:
            name: external-secrets
            namespace: zuno-vault
{{- end }}
