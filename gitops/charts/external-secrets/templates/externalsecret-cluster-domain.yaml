{{- if and .Values.clusterSecretStore.enabled .Values.vaultServiceName }}
# Exposes the cluster's apps domain as a refreshable runtime Secret, for
# services that need it as an env var/file rather than baked into a manifest
# spec field (those are substituted at apply time instead). Not yet consumed.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zuno-cluster-domain
  namespace: zuno-ai-run
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: zuno-cluster-domain
    creationPolicy: Owner
  data:
    - secretKey: domain
      remoteRef:
        key: platform/cluster-domain
        property: domain
{{- end }}
