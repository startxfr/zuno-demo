{{- if and .Values.clusterSecretStore.enabled .Values.vaultServiceName }}
# Gated the same way as templates/clustersecretstore.yaml - this
# ExternalSecret references that same ClusterSecretStore, so it renders
# on the same zuno-external-secrets-d1 Application apply, not -d0.
#
# The cluster's apps domain (secret/zuno/platform/cluster-domain, written
# by ansible/roles/vault/tasks/configure.yml) baked into K8s manifest spec
# fields - a Route's spec.host, the Keycloak CR's spec.hostname.hostname,
# the realm's client redirect URIs - cannot come from a Secret; those are
# resolved at Ansible/Helm-apply time via
# ansible/tasks/apply_gitops_app.yml's apps.mycluster.example.com
# substitution instead, no live sync mechanism supports templating a CR
# spec field. This ExternalSecret is for any current-or-future service
# that wants the same value as a genuine *runtime* env var/file, refreshed
# on refreshInterval without a redeploy - not yet consumed by any service
# in this build.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zuno-cluster-domain
  namespace: zuno-ai-run
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: zuno-cluster-domain
    creationPolicy: Owner
  data:
    - secretKey: domain
      remoteRef:
        key: zuno/platform/cluster-domain
        property: domain
{{- end }}
