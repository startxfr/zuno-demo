{{- if .Values.operatorconfig.enabled }}
# The operator only watches this CR; it won't deploy the actual ESO
# controller/webhook/cert-controller until it exists.
apiVersion: operator.external-secrets.io/v1alpha1
kind: OperatorConfig
metadata:
  name: cluster
  namespace: zuno-vault
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  fullnameOverride: external-secrets
  # CRDs are already installed by the operator's CSV.
  installCRDs: false
  webhook:
    create: true
  certController:
    create: true
{{- end }}
