# operator.enabled renders the operator install; clusterSecretStore.enabled
# renders the operand. Both default false; each ArgoCD Application sets one.
clusterSecretStore:
  enabled: false
operator:
  enabled: false

# subscriptionChannel/subscriptionCatalogSource are discovered by ansible and
# set on the -d0 apply. vaultServiceName is only set on the -d1 apply, after
# Vault sets up the Kubernetes auth method + eso-reader role it depends on.
subscriptionChannel: ""
subscriptionCatalogSource: ""
vaultServiceName: ""
