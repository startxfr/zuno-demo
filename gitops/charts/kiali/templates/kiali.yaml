{{- if .Values.kiali.enabled }}
# auth.strategy: openshift - login goes through the cluster's own OAuth
# (htpasswd + Keycloak IdPs), and Kiali authorizes each namespace via a
# SelfSubjectAccessReview against the logged-in user's real RBAC. No
# Kiali-specific RBAC to maintain: admin/ops (htpasswd, cluster-admin/edit)
# and the Keycloak ocp-paas-ops/ocp-ai-ops groups already qualify today;
# accounts with no meaningful namespace read (dev, devops, consultant) can
# log in but see an empty mesh.
apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
  namespace: {{ .Values.meshNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  auth:
    strategy: openshift
  server:
    # TLS passthrough (see deployment.ingress below) means the router never
    # terminates HTTP, so it can't inject X-Forwarded-* headers - Kiali has
    # no way to guess its own external port and falls back to its internal
    # listen port (20001), which it then bakes into the browser-side
    # /api/auth/redirect URL, producing an unroutable
    # host:20001 the OAuth login button sends the browser to. Pin the real
    # external address explicitly instead of relying on header-guessing.
    web_fqdn: kiali-{{ .Values.meshNamespace }}.{{ .Values.appsDomain }}
    web_schema: https
    web_port: "443"
  deployment:
    accessible_namespaces:
      - '**'
    discovery_selectors:
      default:
        # discovery_selectors is unset by default, and Kiali silently falls
        # back to hiding every openshift-*/kube-* namespace from its own
        # namespace list (separate from accessible_namespaces/RBAC above,
        # both of which already allow everything) - confirmed live via
        # /api/namespaces returning 22 namespaces, none openshift-*/kube-*
        # prefixed, out of 107 on the cluster. That's why HTTPRoutes
        # pointing at the shared ingress Gateways in openshift-ingress
        # (maas-default-gateway, data-science-gateway, zuno-agent-gateway -
        # OpenShift's own Gateway API control plane, separate from
        # zuno-mesh's) always showed a red/invalid icon in Kiali despite
        # being genuinely healthy (Accepted=True/ResolvedRefs=True/
        # Programmed=True) - Kiali could never resolve the cross-namespace
        # parentRef into a namespace it couldn't see.
        #
        # Setting this field REPLACES that implicit fallback rather than
        # adding to it (same discoverySelectors semantics as Istio's own
        # meshConfig.discoverySelectors), so every previously-visible
        # namespace must be matched here too, not just the one being added.
        # The four label rules below were checked by hand against a live
        # label dump of all 22 previously-visible namespaces; the literal
        # name list covers the three (`default`, `cert-manager`,
        # `wva-system`) that carry none of those labels, plus the new
        # addition, `openshift-ingress`. A namespace created later that
        # doesn't carry zuno.io/managed, istio-injection,
        # opendatahub.io/generated-namespace, or app.startx.fr/scope will
        # need adding to the name list to show up in Kiali.
        - matchExpressions:
            - key: zuno.io/managed
              operator: Exists
        - matchExpressions:
            - key: istio-injection
              operator: Exists
        - matchExpressions:
            - key: opendatahub.io/generated-namespace
              operator: Exists
        - matchExpressions:
            - key: app.startx.fr/scope
              operator: Exists
        - matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: In
              values:
                - default
                - cert-manager
                - wva-system
                - openshift-ingress
    ingress:
      # Kiali serves its own UI over HTTPS by default (self-signed cert,
      # spec.external_services.istio aside) - the operator's own default
      # Route (edge termination) would send unencrypted HTTP to a port that
      # expects TLS and fail, same failure mode this repo already hit with
      # istiod's webhook port. override_yaml swaps it for passthrough,
      # verified against a live cluster before this chart was written.
      enabled: true
      override_yaml:
        spec:
          # override_yaml replaces rather than merges with the operator's own
          # Route defaults, so the target Service/port must be given
          # explicitly here too - omitting them left `spec.to` empty and
          # Route creation failed validation (spec.to.name: Required value).
          to:
            kind: Service
            name: kiali
          port:
            targetPort: tcp
          path: ''
          tls:
            termination: passthrough
            insecureEdgeTerminationPolicy: None
  external_services:
    istio:
      root_namespace: {{ .Values.meshNamespace }}
      istiod_url: http://istiod.{{ .Values.meshNamespace }}:15014
    prometheus:
      # gitops/charts/mesh-monitoring's MonitoringStack - no OpenShift User
      # Workload Monitoring is enabled in this repo, so there's no
      # thanos-querier data for mesh namespaces to fall back to.
      url: "http://mesh-monitoring-prometheus.{{ .Values.meshNamespace }}.svc.cluster.local:9090"
    tracing:
      enabled: true
      provider: tempo
      use_grpc: false
      in_cluster_url: "http://tempo-tempo.zuno-monitoring.svc.cluster.local:3200"
  kiali_feature_flags:
    validations:
      # KIA1301 ships pre-ignored by the Kiali operator's own CRD defaults;
      # pinned explicitly here alongside KIA1401 so both are visible in one
      # place instead of relying on an implicit operator default.
      #
      # KIA1401 ("Route is pointing to a non-existent or inaccessible K8s
      # gateway"): fires for HTTPRoutes whose parentRef Gateway lives in a
      # namespace Kiali can't see (see deployment.discovery_selectors above
      # for the real fix - this namespace-visibility gap is what actually
      # broke cross-namespace resolution for maas-default-gateway/
      # data-science-gateway/zuno-agent-gateway in openshift-ingress).
      # Ignoring the check code alone only suppresses the message, not the
      # underlying invalid/red status (Kiali computes that from a separate,
      # unfiltered reference-resolution step) - kept here anyway since it's
      # harmless and matches the existing KIA1301 precedent, but
      # discovery_selectors is what actually clears the icon.
      ignore:
        - KIA1301
        - KIA1401
{{- end }}
