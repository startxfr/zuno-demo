# Dedicated, least-privilege service account. No RBAC binding: this
# service only renders Mermaid text into SVG and serves HTTP, never the
# Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagram-render
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: diagram-render
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
