apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagram-render
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: diagram-render
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
    {{- if not .Values.image.digest }}
    {{- /* A digest-pinned image must not be rewritten by the :latest trigger. */}}
    image.openshift.io/triggers: |-
      {{ include "diagram-render.imageTrigger" (dict "repository" .Values.image.repository "tag" .Values.image.tag "container" "diagram-render") }}
    {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: diagram-render
  template:
    metadata:
      labels:
        app.kubernetes.io/name: diagram-render
      {{- with include "diagram-render.digestAnnotations" .Values }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: diagram-render
      priorityClassName: zuno-workload-default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: diagram-render
          image: {{ include "diagram-render.imageRef" .Values.image | quote }}
          imagePullPolicy: {{ include "diagram-render.imagePullPolicy" .Values.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            {{- /* WP-250: /render accepts only the gateway's Vault-Transit-signed call assertion. Without the key every
                   /render call is refused (fail closed). */}}
            {{- if .Values.callAssertion.publicKey }}
            - name: MCP_CALL_ASSERTION_PUBLIC_KEY
              value: {{ .Values.callAssertion.publicKey | quote }}
            {{- end }}
          volumeMounts:
            # Chromium's own cache/user-data-dir lands under HOME=/tmp
            # (Dockerfile), and mermaid-cli writes its per-request
            # input/output files under os.tmpdir() (server.js) - both
            # need this writable regardless of readOnlyRootFilesystem
            # above, same pattern every restricted-SCC workload in this
            # repo already uses (e.g. gitops/charts/mcp-confluence).
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
