# diagram-render must accept traffic ONLY from mcp-gateway, not other
# same-namespace pods (e.g. agent-runtime) - same reasoning as
# gitops/charts/mcp-confluence's own NetworkPolicy. The app also validates
# the X-Zuno-Gateway-Token shared secret as defense in depth (server.js).
#
# Live-cluster-confirmed 2026-08-23: this exact class of gap (a
# NetworkPolicy never granting mcp-gateway ingress to a service it needs
# to call) silently broke generate_image for a full session before being
# caught - see gitops/charts/ai-gateway/templates/networkpolicy.yaml's
# own comment on that incident. Written correctly from the start here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: diagram-render
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: diagram-render
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-gateway
      ports:
        - protocol: TCP
          port: 8080
  # ADR-0516 closed this gap on 2026-08-26. It was recorded as an accepted
  # risk at decision time ("NetworkPolicy restricts diagram-render's own
  # egress is *not* currently restricted"): Mermaid source is LLM-generated,
  # unvalidated text run through a real browser engine, and Mermaid can
  # reference external image URLs - an SSRF vector reaching anything the pod
  # network can reach.
  #
  # diagram-render renders a local file to a local file. It needs no network
  # egress of its own at all: no model API, no object store, no database.
  # Everything allowed below is the istio sidecar's own requirement, not the
  # app's - which is exactly why this policy can be this tight.
  egress:
    # Cluster DNS. The sidecar resolves istiod/istio-csr through it; without
    # this the pod cannot bootstrap at all.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The mesh control plane: istiod xDS (15012), cert-manager-istio-csr
    # (443) for workload cert signing, and istiod's own webhook/monitoring
    # ports. Deliberately not port-restricted - zuno-mesh is the control
    # plane this pod's sidecar must talk to, it holds nothing an SSRF would
    # want, and pinning ports here would silently break the sidecar the next
    # time the mesh operator changes one (the pod would go unready on its
    # next restart, not on apply, making it a delayed-fuse failure).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-mesh
