# diagram-render must accept traffic ONLY from mcp-gateway, not other
# same-namespace pods (e.g. agent-runtime) - same reasoning as
# gitops/charts/mcp-confluence's own NetworkPolicy. The app also validates
# the X-Zuno-Gateway-Token shared secret as defense in depth (server.js).
#
# Live-cluster-confirmed 2026-08-23: this exact class of gap (a
# NetworkPolicy never granting mcp-gateway ingress to a service it needs
# to call) silently broke generate_image for a full session before being
# caught - see gitops/charts/ai-gateway/templates/networkpolicy.yaml's
# own comment on that incident. Written correctly from the start here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: diagram-render
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: diagram-render
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-gateway
      ports:
        - protocol: TCP
          port: 8080
# ---------------------------------------------------------------------------
# Egress is deliberately NOT restricted here, and the attempt to restrict it
# is recorded below so it is not repeated blind.
#
# ADR-0516 accepted the gap knowingly: Mermaid source is LLM-generated,
# unvalidated text run through a real browser engine, and Mermaid can
# reference external image URLs, so the render is an SSRF vector. The app
# itself needs no egress whatsoever - it renders a local file to a local file
# - so on paper a very tight policy should be possible.
#
# Tried 2026-08-26 (commits 56319f8, 0368e35) and reverted the same day.
# Allowing only cluster DNS plus the zuno-mesh control plane is NOT enough:
# the istio sidecar cannot bootstrap under it. Proven with an A/B pair of
# pods built from this same image in this same namespace, one carrying
# `app.kubernetes.io/name: diagram-render` (selected by the policy) and one
# not: the unselected pod reached Running/Ready, the selected pod hung in
# PodInitializing with istio-proxy's startup probe refused on :15021. DNS
# also stayed blocked from a selected pod even with a port-only UDP/TCP 53
# rule carrying no `to` peer at all, which is the standard pattern and should
# have worked - that part is still unexplained. Cluster is OVNKubernetes, so
# egress rules are genuinely supported; the allowlist is simply incomplete.
#
# The live pod did not fail when the policy was applied, because it had
# started hours earlier and its sidecar was already bootstrapped. This is a
# delayed-fuse failure: it would have surfaced on the pod's next restart, in
# whatever unrelated context that happened.
#
# Two lessons for whoever picks this up:
#   1. A TCP probe cannot verify egress from a mesh-injected pod. istio's
#      `includeOutboundIPRanges: "*"` terminates outbound TCP at the sidecar,
#      so `connect()` succeeds locally whether or not the packet could ever
#      reach the destination. Two probes reported ALLOWED against destinations
#      that were not reachable. Use UDP, or test end to end.
#   2. Pod readiness after `oc apply` proves nothing. Only a pod that STARTS
#      under the policy tests sidecar bootstrap - use the labeled/unlabeled
#      A/B pod method above rather than restarting the real workload.
# ---------------------------------------------------------------------------
