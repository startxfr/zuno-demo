apiVersion: v2
name: openshift-ai
description: >-
  Red Hat OpenShift AI operator (OLM Subscription, channel discovered at
  Ansible run time - ADR-0048) and the DataScienceCluster with kserve
  (RawDeployment) enabled - ADR-0047/ADR-0312. zuno-ai-run's Namespace,
  RHOAI dashboard label and GPU ResourceQuota are owned by
  gitops/charts/namespaces, not this chart. Wraps the startx cluster-ods
  chart (github.com/startxfr/helm-repository) as a dependency, same
  pattern as gitops/charts/vault wrapping hashicorp/vault - cluster-ods
  itself renders the Namespace/OperatorGroup/Subscription (via its own
  project/operator dependencies) and the DataScienceCluster CR.
type: application
version: 0.2.0
appVersion: "0.2.0"
dependencies:
  - name: cluster-ods
    version: "21.3.277"
    repository: "alias:startx"
