# Thin wrapper around the startx `cluster-ods` chart (vendored as a Helm
# dependency). Shared by two ArgoCD Applications: project + operator
# (zuno-openshift-ai-d0) render the Namespace/OperatorGroup/Subscription,
# dataScienceCluster.enabled (zuno-openshift-ai-d1) renders the CR.
cluster-ods:
  context: &context
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: openshift-ai
    app: openshift-ai

  project:
    enabled: false
    context:
      <<: *context
    project:
      enabled: true
      hooked: true  # PreSync ArgoCD hook
      type: namespace
      name: redhat-ods-operator
      display_name: Zuno Infra OpenShift AI
      description: Red Hat OpenShift AI, configured by Zuno
      requester: zuno  # overrides startx's own default (requester: startx)
    # Disabled to avoid granting group RBAC (devops-view/ops-admin) this
    # demo doesn't need; startx's default enables it.
    rbac:
      enabled: false

  operator:
    enabled: false
    context:
      <<: *context
    subscription:
      enabled: true
      name: rhods-operator
      namespace: redhat-ods-operator
      # Combined with operator.csv below to build startingCSV
      # (rhods-operator.3.5.0-ea.2, the beta-channel EA2 build - ADR-0002).
      version: "3.5.0-ea.2"
      operator:
        # Left empty; discovered and injected by
        # ansible/roles/openshift_ai/tasks/install.yml at apply time. See
        # templates/checks.yaml, which fails the render if still empty.
        channel: "beta"
        name: rhods-operator
        # Pinned to startingCSV (rhods-operator.3.5.0-ea.2) below, so this
        # must stay Manual: Automatic would approve the next install plan
        # in the beta channel and immediately move past the pinned build.
        installPlanApproval: Manual
        # Combined with subscription.version above to build startingCSV.
        csv: rhods-operator
        source:
          name: redhat-operators
          namespace: openshift-marketplace
    operatorGroup:
      enabled: true
      target: all-ns  # AllNamespaces
      name: rhods-operator-group
      namespace: redhat-ods-operator

  # Not part of the vendored startx `cluster-ods` chart (it only templates
  # DataScienceCluster) - rendered by this chart's own
  # templates/dscinitialization.yaml. Must land before DataScienceCluster
  # (zuno-openshift-ai-d1): the RHOAI operator auto-creates its own default
  # DSCInitialization (applicationsNamespace: redhat-ods-applications,
  # monitoring.namespace: redhat-ods-monitoring) the first time it
  # reconciles if none exists yet, so this is enabled alongside
  # project/operator in zuno-openshift-ai-d0 (sync-wave -199, before d1's
  # -198). applicationsNamespace is immutable once the CR exists - on a
  # cluster where RHOAI was already installed with the operator's default,
  # applying this alone will NOT move the already-created operands; the
  # existing DSCInitialization/DataScienceCluster must be deleted so the
  # operator recreates operands under these namespaces.
  DSCInitialization:
    enabled: false
    name: default-dsci
    spec: |
      applicationsNamespace: zuno-ai-platform
      monitoring:
        managementState: Managed
        namespace: zuno-monitoring

  # Superseded by the top-level dataScienceCluster key below (rendered by
  # this chart's own templates/datasciencecluster.yaml, not the vendored
  # one): the vendored template hardcodes apiVersion v1 and has no support
  # for metadata.labels or a spec.applicationsNamespace field, both needed
  # for RHOAI 3.5's v2 CRD. Hardcoded false (not toggled by
  # application-d1.yaml/Ansible) so the vendored template never also
  # renders a second DataScienceCluster object.
  DataScienceCluster:
    enabled: false

# Not part of the vendored startx `cluster-ods` chart - rendered by this
# chart's own templates/datasciencecluster.yaml (see the
# cluster-ods.DataScienceCluster comment above for why the vendored
# template can't be used: no apiVersion v2, no metadata.labels, no
# spec.applicationsNamespace). Spec deliberately overridden in full, not
# startx's default: uses kserve RawDeployment rather than Serverless, which
# would require the Service Mesh, Serverless and cert-manager operators
# this repo doesn't install. applicationsNamespace here matches
# cluster-ods.DSCInitialization's applicationsNamespace above
# (zuno-ai-platform, ADR-0328): both must agree since they describe the
# same operand namespace.
dataScienceCluster:
  enabled: false
  name: zuno-dsc
  labels:
    app.kubernetes.io/name: datasciencecluster
  spec: |
    applicationsNamespace: zuno-ai-platform
    components:
      ogx:
        managementState: Managed
      sparkoperator:
        managementState: Managed
      kserve:
        modelCache:
          managementState: Managed
          cacheSize: "140Gi"
          nodeSelector:
            matchExpressions:
              - values:
                  - 'true'
                key: nvidia.com/gpu.present
                operator: In
        modelsAsService:
          managementState: Managed
        nim:
          airGapped: false
          managementState: Managed
        rawDeploymentServiceConfig: Headless
        wva:
          managementState: Managed
        managementState: Managed
      modelregistry:
        registriesNamespace: zuno-ai-platform
        managementState: Managed
      feastoperator:
        managementState: Managed
      trustyai:
        eval:
          lmeval:
            permitCodeExecution: deny
            permitOnline: deny
        mcpGuardrailsMode: false
        managementState: Managed
      aipipelines:
        argoWorkflowsControllers:
          managementState: Managed
        managementState: Managed
      # Removed, not Managed: VERIFIED live, 2026-08-13 - kuberay-operator's
      # pod is rejected outright by every SCC on the cluster ("unable to
      # validate against any security context constraint") in the
      # zuno-ai-platform namespace. RHOAI 3.5 EA2's Ray component appears to
      # assume namespace-specific SCC/RBAC bindings that only exist for the
      # product's default redhat-ods-applications namespace, not a custom
      # applicationsNamespace (ADR-0328). Nothing in this repository submits
      # a Ray job yet (only `trainer` would, and that's also Removed below
      # for the same underlying EA2 limitation) - revisit alongside
      # ADR-0301/ADR-0302 (v3 LoRA/PEFT + MLOps pipelines), the actual future
      # consumer, once RHOAI ships a fix or this repo stops using a custom
      # applicationsNamespace.
      ray:
        managementState: Removed
      kueue:
        defaultClusterQueueName: default
        defaultLocalQueueName: default
        managementState: Unmanaged
      workbenches:
        workbenchNamespace: zuno-ai-build
        managementState: Managed
      mlflowoperator:
        managementState: Managed
      # Removed, not Managed: VERIFIED live, 2026-08-13 - fails with "unable
      # to get: zuno-monitoring/dashboard-perses-access because of unknown
      # namespace for the cache", even on a freshly-reinstalled rhods-operator
      # (new pods, so not stale operator state). RHOAI 3.5 EA2's dashboard/
      # observability reconciliation doesn't derive its watched namespaces
      # from DSCInitialization.spec.monitoring.namespace (ADR-0328) - same
      # class of hardcoded-namespace limitation as `trainer`/`ray` below.
      # Nothing in this repository links to or depends on the RHOAI console
      # UI (Zuno has its own agent-frontend) - revisit if that changes or
      # RHOAI ships a fix.
      dashboard:
        managementState: Removed
      # Removed, not Managed: VERIFIED live, 2026-08-13 - the
      # ClusterTrainingRuntime this component seeds fails validation because
      # its ValidatingWebhookConfiguration (RHOAI's own bundled manifest, not
      # rendered by this chart) hardcodes
      # kubeflow-trainer-controller-manager.redhat-ods-applications.svc as
      # the webhook target, even though the real Service now lives in
      # zuno-ai-platform (ADR-0328) - confirmed unchanged after a full
      # operator uninstall/reinstall, so this isn't stale state, it's baked
      # into RHOAI 3.5 EA2's trainer-module bundle. Consistent with
      # platform/openshift-ai/README.md's own precedent (KServe Serverless
      # was similarly disabled in ADR-0047 because it "would never have
      # reached Ready on a real cluster"). Nothing in this repository
      # schedules a distributed training run yet - revisit alongside
      # ADR-0301/ADR-0302, once RHOAI ships a fix or this repo stops using a
      # custom applicationsNamespace.
      trainer:
        managementState: Removed
      llamastackoperator:
        managementState: Removed
      aigateway:
        batchGateway:
          managementState: Managed
        managementState: Managed
      trainingoperator:
        managementState: Managed

# Not part of the vendored startx `cluster-ods` chart - rendered by this
# chart's own templates/maas-gateway.yaml. DataScienceCluster's
# kserve.modelsAsService (above) will not reach Ready until a Gateway named
# maas-default-gateway exists in openshift-ingress; RHOAI's own
# maas-controller (deployed automatically by the rhods-operator once
# modelsAsService is Managed) otherwise reconciles everything else itself.
# False by default, same pattern as cluster-ods's own sub-blocks above -
# gitops/apps/openshift-ai/application-d0.yaml opts this in explicitly
# (VERIFIED live, 2026-08-13: Wave 3 MaaS-prerequisite work pulled forward;
# lives in d0 specifically since DataScienceCluster/d1 needs the Gateway to
# already exist before it reconciles kserve.modelsAsService).
# templates/maas-gateway.yaml's gatewayClassName was switched from
# data-science-gateway-class (a GatewayClass RHOAI would provision itself
# once kserve.modelsAsService is healthy - it wasn't, on this cluster) to
# istio (the Gateway API controller this platform already runs via the
# service-mesh component, zuno-mesh namespace) - see that template's own
# comment for the full reasoning.
maasGateway:
  enabled: false
  # Placeholder auto-substituted with the real cluster domain by
  # ansible/tasks/apply_gitops_app.yml (see gitops/apps/openshift-ai/application-d1.yaml).
  clusterBaseDomain: apps.mycluster.example.com

