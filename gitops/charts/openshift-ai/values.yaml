# Thin wrapper around the startx `cluster-ods` chart (vendored as a Helm
# dependency). Shared by two ArgoCD Applications: project + operator
# (zuno-openshift-ai-d0) render the Namespace/OperatorGroup/Subscription,
# dataScienceCluster.enabled (zuno-openshift-ai-d1) renders the CR.
cluster-ods:
  context: &context
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: openshift-ai
    app: openshift-ai

  project:
    enabled: false
    context:
      <<: *context
    project:
      enabled: true
      hooked: true  # PreSync ArgoCD hook
      type: namespace
      name: redhat-ods-operator
      display_name: Zuno Infra OpenShift AI
      description: Red Hat OpenShift AI, configured by Zuno
      requester: zuno  # overrides startx's own default (requester: startx)
    # Disabled to avoid granting group RBAC (devops-view/ops-admin) this
    # demo doesn't need; startx's default enables it.
    rbac:
      enabled: false

  operator:
    enabled: false
    context:
      <<: *context
    subscription:
      enabled: true
      name: rhods-operator
      namespace: redhat-ods-operator
      # Combined with operator.csv below to build startingCSV
      # (rhods-operator.3.5.0-ea.2, the beta-channel EA2 build - ADR-0002).
      version: "3.5.0-ea.2"
      operator:
        # Left empty; discovered and injected by
        # ansible/roles/openshift_ai/tasks/install.yml at apply time. See
        # templates/checks.yaml, which fails the render if still empty.
        channel: "beta"
        name: rhods-operator
        # Pinned to startingCSV (rhods-operator.3.5.0-ea.2) below, so this
        # must stay Manual: Automatic would approve the next install plan
        # in the beta channel and immediately move past the pinned build.
        installPlanApproval: Manual
        # Combined with subscription.version above to build startingCSV.
        csv: rhods-operator
        source:
          name: redhat-operators
          namespace: openshift-marketplace
    operatorGroup:
      enabled: true
      target: all-ns  # AllNamespaces
      name: rhods-operator-group
      namespace: redhat-ods-operator

  # Not part of the vendored startx `cluster-ods` chart (it only templates
  # DataScienceCluster) - rendered by this chart's own
  # templates/dscinitialization.yaml. Must land before DataScienceCluster
  # (zuno-openshift-ai-d1): the RHOAI operator auto-creates its own default
  # DSCInitialization (applicationsNamespace: redhat-ods-applications,
  # monitoring.namespace: redhat-ods-monitoring) the first time it
  # reconciles if none exists yet, so this is enabled alongside
  # project/operator in zuno-openshift-ai-d0 (sync-wave -199, before d1's
  # -198). applicationsNamespace is immutable once the CR exists - on a
  # cluster where RHOAI was already installed with the operator's default,
  # applying this alone will NOT move the already-created operands; the
  # existing DSCInitialization/DataScienceCluster must be deleted so the
  # operator recreates operands under these namespaces. Set to
  # redhat-ods-applications (RHOAI's own default) rather than the custom
  # zuno-ai-platform ADR-0328 originally called for - reverted by ADR-0331
  # (trainer/ray/dashboard/mlflowoperator all failed under a custom
  # applicationsNamespace on RHOAI 3.5 EA2). monitoring.namespace reverted
  # to the RHOAI default redhat-ods-monitoring for the same reason - this
  # is dashboard's actual fix (its documented failure referenced
  # zuno-monitoring specifically, not applicationsNamespace).
  DSCInitialization:
    enabled: false
    name: default-dsci
    spec: |
      applicationsNamespace: redhat-ods-applications
      monitoring:
        managementState: Managed
        namespace: redhat-ods-monitoring

  # Superseded by the top-level dataScienceCluster key below, rendered by this
  # chart's own templates/datasciencecluster.yaml instead (see that file for
  # why the vendored template can't be used). Hardcoded false, not toggled by
  # Ansible, so the vendored template never also renders a second CR.
  DataScienceCluster:
    enabled: false

# Rendered by templates/datasciencecluster.yaml, not the vendored chart (see
# that file's comment for why). Spec deliberately overridden in full: uses
# kserve RawDeployment rather than Serverless, which would require the Service
# Mesh, Serverless and cert-manager operators this repo doesn't install.
# applicationsNamespace here must match cluster-ods.DSCInitialization's above
# (redhat-ods-applications, ADR-0331 - reverted from ADR-0328's custom
# zuno-ai-platform namespace) since they describe the same operand namespace.
dataScienceCluster:
  enabled: false
  name: zuno-dsc
  labels:
    app.kubernetes.io/name: datasciencecluster
  spec: |
    applicationsNamespace: redhat-ods-applications
    components:
      ogx:
        managementState: Managed
      sparkoperator:
        managementState: Managed
      kserve:
        modelCache:
          managementState: Managed
          cacheSize: "140Gi"
          nodeSelector:
            matchExpressions:
              - values:
                  - 'true'
                key: nvidia.com/gpu.present
                operator: In
        modelsAsService:
          managementState: Managed
        nim:
          airGapped: false
          managementState: Managed
        rawDeploymentServiceConfig: Headless
        wva:
          managementState: Managed
        managementState: Managed
      modelregistry:
        # RHOAI's own true default (distinct from applicationsNamespace) -
        # ADR-0331.
        registriesNamespace: rhoai-model-registries
        managementState: Managed
      feastoperator:
        managementState: Managed
      trustyai:
        eval:
          lmeval:
            permitCodeExecution: deny
            permitOnline: deny
        mcpGuardrailsMode: false
        managementState: Managed
      aipipelines:
        argoWorkflowsControllers:
          managementState: Managed
        managementState: Managed
      # Re-enabled by ADR-0331: was Removed because kuberay-operator's pod
      # was rejected by every SCC on the cluster under the custom
      # zuno-ai-platform applicationsNamespace (RHOAI 3.5 EA2's namespace-
      # specific SCC/RBAC bindings only exist for the product's default
      # redhat-ods-applications namespace) - reverting applicationsNamespace
      # to the default resolves it. Nothing in this repository submits a Ray
      # job yet - revisit alongside ADR-0301/ADR-0302 (v3 LoRA/PEFT + MLOps
      # pipelines), the actual future consumer.
      ray:
        managementState: Managed
      kueue:
        defaultClusterQueueName: default
        defaultLocalQueueName: default
        managementState: Unmanaged
      workbenches:
        workbenchNamespace: zuno-ai-build
        managementState: Managed
      # VERIFIED live, 2026-08-13 - mlflow-operator-controller-manager was
      # the pod whose CrashLoopBackOff surfaced this whole bug class
      # (manager Deployment hardcodes --namespace=redhat-ods-applications;
      # its generated ClusterRole grants no list/watch on Secret/
      # ServiceAccount/ConfigMap/Deployment/Job/CronJob/Service/PVC/
      # ServiceMonitor in any namespace, so its controller-runtime cache
      # never syncs). Left Managed throughout - fixed by ADR-0331 reverting
      # applicationsNamespace to the default, not by toggling this flag.
      mlflowoperator:
        managementState: Managed
      # Re-enabled by ADR-0331: was Removed because it failed with "unable
      # to get: zuno-monitoring/dashboard-perses-access because of unknown
      # namespace for the cache" - that references monitoring.namespace
      # (custom zuno-monitoring), not applicationsNamespace. RHOAI 3.5 EA2's
      # dashboard/observability reconciliation doesn't derive its watched
      # namespaces from DSCInitialization.spec.monitoring.namespace - the
      # actual fix is monitoring.namespace: redhat-ods-monitoring above, not
      # the applicationsNamespace revert (an earlier version of this comment
      # wrongly credited applicationsNamespace alone).
      dashboard:
        managementState: Managed
      # Re-enabled by ADR-0331: was Removed because the ClusterTrainingRuntime
      # this component seeds failed validation - its ValidatingWebhookConfiguration
      # (RHOAI's own bundled manifest, not rendered by this chart) hardcodes
      # kubeflow-trainer-controller-manager.redhat-ods-applications.svc as
      # the webhook target regardless of applicationsNamespace - reverting
      # applicationsNamespace to the default makes that hardcoded target
      # correct again. Nothing in this repository schedules a distributed
      # training run yet - revisit alongside ADR-0301/ADR-0302.
      trainer:
        managementState: Managed
      # ADR-0322 v0 migration scope: the deprecated Llama Stack component
      # (superseded by `ogx` above) is removed entirely - not merely set
      # to an inactive management state - per the ADR's own acceptance
      # criterion that it be "absent from the rendered DataScienceCluster":
      # the literal key, not just an inactive value. Confirmed live on
      # this cluster, 2026-08-14: `oc get datasciencecluster zuno-dsc`
      # shows `status.conditions` carrying `type: OGXReady, status:
      # "True"` and `status.components.ogx.managementState: Managed`,
      # while the deprecated component's own status entry is already an
      # empty object (no managementState/releases) even before this key's
      # removal from spec - i.e. the operand itself was already inactive;
      # this change only makes the *declared* spec match that already-true
      # state. RESIDUAL VERIFICATION (operator, not yet performed): confirm
      # a `make d0 reconcile openshift-ai` after this change leaves the
      # deprecated component's operand still absent/inactive, rather than
      # the operator treating an omitted managementState differently from
      # an explicit Removed - the CRD schema documents no default for that
      # field (`oc explain` its `spec.components` entry for the exact
      # field name, deliberately not repeated here so this comment doesn't
      # itself trip the WP-06 acceptance grep for the removed component's
      # name). If reconciliation differs, restore an explicit
      # `managementState: Removed` for it and treat this ADR's acceptance
      # criterion as satisfied by that instead.
      aigateway:
        batchGateway:
          managementState: Managed
        managementState: Managed
      trainingoperator:
        managementState: Managed

# Not part of the vendored startx `cluster-ods` chart - rendered by this
# chart's own templates/maas-gateway.yaml. DataScienceCluster's
# kserve.modelsAsService (above) will not reach Ready until a Gateway named
# maas-default-gateway exists in openshift-ingress; RHOAI's own
# maas-controller (deployed automatically by the rhods-operator once
# modelsAsService is Managed) otherwise reconciles everything else itself.
# False by default, same pattern as cluster-ods's own sub-blocks above -
# gitops/apps/openshift-ai/application-d0.yaml opts this in explicitly
# (VERIFIED live, 2026-08-13: Wave 3 MaaS-prerequisite work pulled forward;
# lives in d0 specifically since DataScienceCluster/d1 needs the Gateway to
# already exist before it reconciles kserve.modelsAsService).
# templates/maas-gateway.yaml's gatewayClassName was switched from
# data-science-gateway-class (a GatewayClass RHOAI would provision itself
# once kserve.modelsAsService is healthy - it wasn't, on this cluster) to
# istio (the Gateway API controller this platform already runs via the
# service-mesh component, zuno-mesh namespace) - see that template's own
# comment for the full reasoning.
maasGateway:
  enabled: false
  # Placeholder auto-substituted with the real cluster domain by
  # ansible/tasks/apply_gitops_app.yml (see gitops/apps/openshift-ai/application-d1.yaml).
  clusterBaseDomain: apps.mycluster.example.com

# Second chart-local MaaS prerequisite (same pattern as maasGateway above):
# DataScienceCluster's ModelsAsServiceReady condition requires a Secret
# named maas-db-config (key DB_CONNECTION_URL) in redhat-ods-applications.
# Rendered by templates/externalsecret-maas-db.yaml from the same Vault
# credential (zuno/maas/postgresql-app) that gitops/charts/postgresql's
# templates/externalsecret-maas.yaml feeds to PGO for the dedicated maas
# database/role on zuno-postgresql. False by default, opted in by
# gitops/apps/openshift-ai/application-d1.yaml alongside DataScienceCluster.
maasDb:
  enabled: false
  vaultPath: maas/postgresql-app
  secretStoreName: vault-backend
  refreshInterval: 1h
  # zuno-postgresql-primary, not -pgbouncer: pgBouncer runs in transaction
  # pooling mode (gitops/charts/postgresql values pgBouncer.poolMode), which
  # breaks session-level features (prepared statements) a Go pgx-based API
  # may rely on. Revisit once maas-api's driver behavior is confirmed.
  host: zuno-postgresql-primary.zuno-data.svc
  port: 5432
  database: maas
  targetNamespace: redhat-ods-applications

# Third chart-local MaaS prerequisite: ModelsAsServiceReady also requires
# User Workload Monitoring (ConfigMap cluster-monitoring-config in
# openshift-monitoring with enableUserWorkload: true) for its
# showback/FinOps usage views. Rendered by
# templates/cluster-monitoring-config.yaml; false by default, opted in by
# gitops/apps/openshift-ai/application-d0.yaml (cluster-level prerequisite,
# d0 like the operator install itself).
userWorkloadMonitoring:
  enabled: false

# ADR-0322 v0.1 integration scope: stands up an OGXServer instance (the OGX
# Operator's data-plane CR - spec.components.ogx: Managed above only
# installs the operator/controller, VERIFIED live 2026-08-14: `oc get svc
# -n redhat-ods-applications` shows only ogx-k8s-operator-controller-
# manager-metrics-service/-webhook-service, no API-serving Service, and
# `oc get ogxserver -A` returns no resources) so
# components/rag-service/app/ogx_provider.py has something real to call
# once an operator opts in. False by default (same two-gate shape as
# maasGateway/maasDb above): rag-service's own RAG_PROVIDER stays
# "pgvector" regardless of this flag - ADR-0322 requires provider-parity
# tests to pass before any default-provider switch, and those need a live
# OGXServer to run against, which is exactly what enabling this value
# stands up, nothing more.
#
# Namespace: redhat-ods-applications, alongside every other
# DataScienceCluster-adjacent operand per ADR-0331 (not zuno-ai-run or
# zuno-data, where rag-service itself and its database live) - revisit if
# OGX's own product docs establish a different convention once this
# build's OGX sub-capability lifecycle status is confirmed (ADR-0322
# Operational considerations).
#
# distribution "remote-vllm" (one of the CRD's own documented examples,
# `oc explain ogxserver.spec.distribution` - not independently verified to
# resolve on this cluster, since no OGXServer exists yet to test it
# against) matches this repo's architecture: OGX proxies to the existing
# KServe/vLLM serving stack rather than bundling its own inference runtime
# (ADR-0322's integration-boundary diagram keeps them separate boxes).
#
# storage.sql.type is "sqlite" (OGX's own internal bookkeeping, not the
# RAG vector store below) to keep this prototype's footprint minimal -
# switching to a dedicated postgres backend is a natural follow-up once
# value is proven, not a requirement to stand this up at all.
#
# pgvector.{host,port,database} point at the existing zuno-postgresql
# PostgresCluster's dedicated ogx database (gitops/charts/postgresql
# values.yaml ogxDatabase) - the same "existing PostgreSQL/pgvector
# platform as the preferred durable remote vector store" ADR-0322's
# Context section calls for, deliberately a fresh database rather than the
# document_embeddings table rag-service's own provider reads (see that
# values file's ogxDatabase comment for why).
ogxServer:
  enabled: false
  name: zuno-ogx
  namespace: redhat-ods-applications
  distribution: remote-vllm
  replicas: 1
  credentials:
    vaultPath: ogx/postgresql-app
    secretStoreName: vault-backend
    refreshInterval: 1h
  pgvector:
    host: zuno-postgresql-primary.zuno-data.svc
    port: 5432
    database: ogx
    user: ogxserver
  # Embedding/chat endpoint OGX's remote::vllm inference provider proxies
  # to - the same in-cluster KServe/vLLM InferenceService URL shape
  # components/rag-service/app/config.py's EMBEDDING_SERVICE_URL already
  # assumes. Placeholder: confirm the real Service name/namespace for the
  # target model before enabling (`oc get inferenceservice -A`).
  vllmEndpoint: http://embeddings-predictor.zuno-ai-run.svc:8080

# ADR-0108 (roadmap WP-10): LM-Eval candidate local-model comparison.
# Rendered by templates/lmevaljob.yaml, one LMEvalJob CR
# (trustyai.opendatahub.io/v1alpha1, confirmed via `oc explain lmevaljob`
# against the live test cluster) per lmEval.jobs[] entry. The DSC
# component that provides LM-Eval (trustyai, `components.trustyai.eval.
# lmeval` above) is already managementState: Managed - this only adds the
# job *instances*, which nothing creates automatically. Disabled by
# default with an empty job list: benchmarking is opt-in per candidate
# model, never automatic (ADR-0108: "complements - never replaces - the
# per-agent ADR-0027 acceptance suites"). Continuous/scheduled
# benchmarking across models is WP-40 (ADR-0305), explicitly out of scope
# here - this is a manually-declared, one-shot comparison job per entry.
lmEval:
  enabled: true
  namespace: zuno-ai-run
  # First real run (2026-08-14, roadmap WP-10 test pass): benchmarks the
  # one model actually deployed by gitops/charts/models (qwen25-7b-instruct,
  # see that chart's inferenceServiceName/modelId), same base_url
  # convention as components/rag-service/app/config.py's
  # EMBEDDING_SERVICE_URL.
  jobs:
    - name: qwen25-7b-instruct-mmlu
      model: local-completions
      modelArgs:
        - name: base_url
          value: http://qwen25-7b-instruct-predictor.zuno-ai-run.svc:8080/v1/completions
        - name: model
          value: qwen2.5-7b-instruct
      taskNames: [mmlu]
      allowOnline: false
      allowCodeExecution: false

