# Thin wrapper around the startx `cluster-ods` chart (vendored as a Helm
# dependency). Shared by two ArgoCD Applications: project + operator
# (zuno-openshift-ai-d0) render the Namespace/OperatorGroup/Subscription,
# DataScienceCluster.enabled (zuno-openshift-ai-d1) renders the CR.
cluster-ods:
  context: &context
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: openshift-ai
    app: openshift-ai

  project:
    enabled: false
    context:
      <<: *context
    project:
      enabled: true
      hooked: true  # PreSync ArgoCD hook
      type: namespace
      name: redhat-ods-operator
      display_name: Zuno OpenShift AI Operator
      description: Red Hat OpenShift AI, configured by Zuno
      requester: zuno  # overrides startx's own default (requester: startx)
    # Disabled to avoid granting group RBAC (devops-view/ops-admin) this
    # demo doesn't need; startx's default enables it.
    rbac:
      enabled: false

  operator:
    enabled: false
    context:
      <<: *context
    subscription:
      enabled: true
      name: rhods-operator
      namespace: redhat-ods-operator
      operator:
        # Left empty; discovered and injected by
        # ansible/roles/openshift_ai/tasks/install.yml at apply time. See
        # templates/checks.yaml, which fails the render if still empty.
        channel: ""
        name: rhods-operator
        installPlanApproval: Automatic  # startx chart defaults to Manual
        source:
          name: redhat-operators
          namespace: openshift-marketplace
    operatorGroup:
      enabled: true
      target: all-ns  # AllNamespaces
      name: rhods-operator-group
      namespace: redhat-ods-operator

  # Spec deliberately overridden in full, not startx's default: uses kserve
  # RawDeployment rather than Serverless, which would require the Service
  # Mesh, Serverless and cert-manager operators this repo doesn't install.
  DataScienceCluster:
    enabled: false
    name: zuno-dsc
    namespace: redhat-ods-operator
    spec: |
      components:
        sparkoperator:
          managementState: Managed
        kserve:
          managementState: Managed
          modelsAsService:
            managementState: Managed
          nim:
            airGapped: false
            managementState: Managed
          rawDeploymentServiceConfig: Headless
          wva:
            managementState: Managed
        modelregistry:
          registriesNamespace: rhoai-model-registries
        feastoperator: {}
        trustyai:
          eval:
            lmeval:
              permitCodeExecution: deny
              permitOnline: deny
          mcpGuardrailsMode: false
        aipipelines: {}
        ray: {}
        kueue:
          defaultClusterQueueName: default
          defaultLocalQueueName: default
        workbenches:
          managementState: Managed
          workbenchNamespace: rhods-notebooks
        mlflowoperator:
          managementState: Managed
        dashboard:
          managementState: Managed
        trainer:
          managementState: Managed
        llamastackoperator: 
          managementState: Managed
        trainingoperator: 
          managementState: Managed

