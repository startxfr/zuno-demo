# This chart is shared by two ArgoCD Applications (see
# gitops/apps/README.md): operator.enabled (zuno-openshift-ai-d0) renders
# the Namespace/OperatorGroup/Subscription, dataScienceCluster.enabled
# (zuno-openshift-ai-d1) renders the DataScienceCluster CR. Both default
# to false so `helm template`/`helm lint` render nothing by default.
operator:
  enabled: false
dataScienceCluster:
  enabled: false

# ADR-0048: subscriptionChannel is discovered from the cluster's own
# catalog by ansible/roles/openshift_ai/tasks/install.yml (the 3.5-family
# channel actually published, not a hardcoded guess) and injected via
# gitops_app_extra_helm_values on the -d0 apply. Empty by default so `helm
# template`/`helm lint` still render something sane without Ansible.
subscriptionChannel: ""
