{{- /*
Gateway RHOAI's own DataScienceCluster requires to exist in openshift-ingress
before it will reconcile kserve.modelsAsService ("the specified Gateway must
exist before enabling MaaS platform reconcile"). Modeled directly on the
already-working data-science-gateway RHOAI provisions for itself (same
ClusterIP+Route+service-ca pattern).

gatewayClassName is "istio", not "data-science-gateway-class": the latter is
a GatewayClass RHOAI is meant to provision itself once kserve.modelsAsService
reconciles cleanly - VERIFIED live, 2026-08-13, it does not exist on this
cluster (`oc get gatewayclass` only shows istio/istio-remote). maas-controller
only checks that a Gateway named maas-default-gateway exists, not which class
backs it, so this reuses the Istio Gateway API controller the service-mesh
component (zuno-mesh) already runs, rather than waiting on RHOAI's own
class to appear. Revisit if a future RHOAI build provisions
data-science-gateway-class on its own.

Deployed via application-d1.yaml, alongside DataScienceCluster (not
application-d0.yaml): sync-wave -5 here, DataScienceCluster has no explicit
wave (defaults to 0), DSCInitialization is -10 - this Gateway still lands
before DataScienceCluster reconciles, without needing a separate Application
phase for it.
*/ -}}
{{- if .Values.maasGateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-gateway-config
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  service: |
    metadata:
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: "maas-gateway-service-tls"
    spec:
      type: ClusterIP
  # The auto-provisioned gateway pod OOMKilled repeatedly at Istio's own
  # default gateway-proxy sizing (500m/256Mi limit) - this pod terminates
  # TLS, runs the Kuadrant AuthPolicy's OPA evaluation and routes all MaaS
  # traffic, materially heavier than a plain sidecar. Same
  # infrastructure.parametersRef ConfigMap mechanism as the `service` key
  # above, keyed by resource kind, per Istio's Gateway API deployer.
  deployment: |
    spec:
      template:
        spec:
          containers:
            - name: istio-proxy
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/name: maas
    app.kubernetes.io/instance: maas-default-gateway
    app.kubernetes.io/component: gateway
    opendatahub.io/managed: "false"
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    opendatahub.io/managed: "false"
    # Read by the RHOAI/ODH platform layer (not maas-controller itself) to wire
    # the Gateway -> Authorino EnvoyFilter automatically.
    security.opendatahub.io/authorino-tls-bootstrap: "true"
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: maas-gateway-config
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - openshift-ingress
                  - redhat-ods-applications
                  - zuno-ai-run
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: maas-gateway-service-tls
        mode: Terminate
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: maas-gateway-route
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  host: maas.{{ .Values.maasGateway.clusterBaseDomain }}
  to:
    kind: Service
    # Istio's Gateway API controller actually names the auto-deployed
    # Service "<gateway-name>-istio", not identical to the Gateway object
    # (maas-default-gateway-istio, not maas-default-gateway) - a
    # same-named value here silently 503s every external request through
    # this Route (the router can't resolve a Service that doesn't exist).
    name: maas-default-gateway-istio
    weight: 100
  port:
    targetPort: 443
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
---
{{- /*
RHOAI's ModelsAsService controller (Config.maas.opendatahub.io/default) deploys
two Deployments into openshift-ingress for the IPP (Inference Payload Processing)
pipeline: payload-processing and payload-pre-processing. Its sibling controller
(owned by the ModelsAsService CR) only generates a matching NetworkPolicy for
the "payload-processing" label - not for "payload-pre-processing" - even though
openshift-ingress carries a namespace-wide deny-all NetworkPolicy
(openshift-ingress-deny-all). Without an explicit allow, payload-pre-processing
has no egress path to the kubernetes.default.svc ClusterIP its controller-runtime
manager needs to watch ExternalProvider/ExternalModel CRs, so it CrashLoopBackOffs
on "failed to get server groups: ... i/o timeout". This policy mirrors the
operator-generated "payload-processing" NetworkPolicy for the missing label.
VERIFIED live, 2026-08-17: RHOAI 3.5.0-ea.2. Revisit if a future RHOAI build
generates this NetworkPolicy on its own.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payload-pre-processing
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  podSelector:
    matchLabels:
      app: payload-pre-processing
  policyTypes:
    - Ingress
    - Egress
  egress:
    - {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: data-science-gateway
      ports:
        - port: 9004
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - port: 9005
          protocol: TCP
        - port: 9090
          protocol: TCP
{{- end }}
