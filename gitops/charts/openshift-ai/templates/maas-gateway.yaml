{{- /*
Gateway RHOAI's own DataScienceCluster requires to exist in openshift-ingress
before it will reconcile kserve.modelsAsService ("the specified Gateway must
exist before enabling MaaS platform reconcile"). Modeled directly on the
already-working data-science-gateway RHOAI provisions for itself (same
ClusterIP+Route+service-ca pattern).

gatewayClassName is "istio", not "data-science-gateway-class": the latter is
a GatewayClass RHOAI is meant to provision itself once kserve.modelsAsService
reconciles cleanly - VERIFIED live, 2026-08-13, it does not exist on this
cluster (`oc get gatewayclass` only shows istio/istio-remote). maas-controller
only checks that a Gateway named maas-default-gateway exists, not which class
backs it, so this reuses the Istio Gateway API controller the service-mesh
component (zuno-mesh) already runs, rather than waiting on RHOAI's own
class to appear. Revisit if a future RHOAI build provisions
data-science-gateway-class on its own.

Deployed via application-d1.yaml, alongside DataScienceCluster (not
application-d0.yaml): sync-wave -5 here, DataScienceCluster has no explicit
wave (defaults to 0), DSCInitialization is -10 - this Gateway still lands
before DataScienceCluster reconciles, without needing a separate Application
phase for it.
*/ -}}
{{- if .Values.maasGateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-gateway-config
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  service: |
    metadata:
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: "maas-gateway-service-tls"
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/name: maas
    app.kubernetes.io/instance: maas-default-gateway
    app.kubernetes.io/component: gateway
    opendatahub.io/managed: "false"
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    opendatahub.io/managed: "false"
    # Read by the RHOAI/ODH platform layer (not maas-controller itself) to wire
    # the Gateway -> Authorino EnvoyFilter automatically.
    security.opendatahub.io/authorino-tls-bootstrap: "true"
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: maas-gateway-config
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - openshift-ingress
                  - redhat-ods-applications
                  - zuno-ai-run
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: maas-gateway-service-tls
        mode: Terminate
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: maas-gateway-route
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  host: maas.{{ .Values.maasGateway.clusterBaseDomain }}
  to:
    kind: Service
    # Not maas-default-gateway-data-science-gateway-class (that was the old
    # data-science-gateway-class naming pattern): Istio's Gateway API
    # controller auto-deploys a Service named identically to the Gateway
    # object itself for gatewayClassName: istio. Not yet verified against a
    # live reconcile of this specific Gateway - confirm the real Service
    # name once applied (`oc get svc -n openshift-ingress`) and correct this
    # if Istio's actual behavior differs.
    name: maas-default-gateway
    weight: 100
  port:
    targetPort: 443
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
