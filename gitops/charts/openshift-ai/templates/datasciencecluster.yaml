apiVersion: datasciencecluster.opendatahub.io/v1
kind: DataScienceCluster
metadata:
  name: zuno-dsc
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  components:
    kserve:
      managementState: Managed
      # ADR-0047/ADR-0048 fix: RawDeployment, not Serverless. Managed +
      # name: knative-serving would implicitly require the Service Mesh,
      # Serverless and cert-manager operators, none of which this
      # repository installs. This demo's one model
      # (gitops/charts/models) runs minReplicas == maxReplicas == 1,
      # always on, with no use for Serverless's scale-to-zero -
      # gitops/charts/models/templates/inferenceservice.yaml also sets the
      # serving.kserve.io/deploymentMode: RawDeployment annotation
      # explicitly (belt and suspenders with this cluster-wide default).
      serving:
        managementState: Removed
    workbenches:
      managementState: Removed
    dashboard:
      managementState: Managed
    modelmeshserving:
      managementState: Removed
