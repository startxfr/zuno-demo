{{- /*
The vendored startx `cluster-ods` chart's DataScienceCluster template before
21.3.371 (templates/dataScienceCluster.yaml inside the vendored dependency)
hardcoded apiVersion v1 and had no support for custom metadata.labels or a
spec.applicationsNamespace field. RHOAI 3.5's v2 CRD needs both, so this chart
renders its own CR here instead. 21.3.371 supports both (apiVersion, labels,
annotations), so this template could move to the chart like DSCInitialization
did; it stays for now. cluster-ods.DataScienceCluster is hardcoded to
enabled: false in values.yaml so the vendored template never also renders
this object.
*/ -}}
{{- with .Values.dataScienceCluster -}}
{{- if .enabled -}}
{{- $name := .name | default "default-dsc" -}}
apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: {{ $name | quote }}
  {{- with .labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- .spec | nindent 2 }}
{{- end -}}
{{- end -}}
