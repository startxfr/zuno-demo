{{- if .Values.tracesS3.enabled }}
# RHOAI monitoring's Tempo traces S3 credential (ADR-0522/WP-079,
# DSCInitialization.spec.monitoring.traces.storage.secret). bucket/region/
# access key/secret key all come from Vault (zuno/rhoai/traces-s3), same
# 4-field pattern as gitops/charts/aap's externalsecret-hub-s3.yaml. Key
# names are a deliberate transform, not a straight copy: Vault stores
# bucketName/region (this repo's own AAP-established convention), but the
# rendered Secret uses bucket/endpoint/access_key_id/access_key_secret -
# the keys the Tempo Operator's own S3 storage secret schema expects
# (confirmed against Red Hat Tempo Operator docs). endpoint is derived from
# region (real AWS S3, not an S3-compatible/ODF endpoint).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.tracesS3.secretName }}
  namespace: {{ .Values.tracesS3.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: {{ .Values.tracesS3.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.tracesS3.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.tracesS3.secretName }}
    creationPolicy: Owner
    template:
      data:
        bucket: "{{ `{{ .bucketName }}` }}"
        endpoint: "s3.{{ `{{ .region }}` }}.amazonaws.com"
        access_key_id: "{{ `{{ .accessKeyId }}` }}"
        access_key_secret: "{{ `{{ .secretAccessKey }}` }}"
  data:
    - secretKey: bucketName
      remoteRef:
        key: {{ .Values.tracesS3.vaultPath | quote }}
        property: bucketName
    - secretKey: region
      remoteRef:
        key: {{ .Values.tracesS3.vaultPath | quote }}
        property: region
    - secretKey: accessKeyId
      remoteRef:
        key: {{ .Values.tracesS3.vaultPath | quote }}
        property: accessKeyId
    - secretKey: secretAccessKey
      remoteRef:
        key: {{ .Values.tracesS3.vaultPath | quote }}
        property: secretAccessKey
{{- end }}
