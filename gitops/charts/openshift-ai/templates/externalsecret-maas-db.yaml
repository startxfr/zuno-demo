{{- /*
Renders the maas-db-config Secret DataScienceCluster's ModelsAsServiceReady
condition requires in redhat-ods-applications ("database Secret
'maas-db-config' not found ... Create the Secret with key 'DB_CONNECTION_URL'
containing the PostgreSQL connection URL"). maas-api CrashLoops on startup
without it.

Same Vault credential (zuno/maas/postgresql-app) as
gitops/charts/postgresql/templates/externalsecret-maas.yaml, which feeds the
password to PGO for the dedicated maas database/role - resolved here through
a second ExternalSecret because that pguser Secret lives in zuno-data and
secretKeyRef can't cross namespaces (same split as the rag-tech credential,
see that template's comment).

The password is interpolated into the URI un-encoded: safe because
ansible/roles/vault/tasks/install.yml seeds it letters/digits-only (no
URL-reserved characters), documented there.

Sync-wave -5, same as maas-gateway.yaml: both are MaaS prerequisites that
must exist before DataScienceCluster (wave 0) reconciles
kserve.modelsAsService.
*/ -}}
{{- if .Values.maasDb.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: maas-db-config
  namespace: {{ .Values.maasDb.targetNamespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: {{ .Values.maasDb.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.maasDb.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: maas-db-config
    template:
      data:
        DB_CONNECTION_URL: "postgresql://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@{{ .Values.maasDb.host }}:{{ .Values.maasDb.port }}/{{ .Values.maasDb.database }}"
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.maasDb.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.maasDb.vaultPath }}
        property: password
{{- end }}
