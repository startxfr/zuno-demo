{{- /*
Fails the render if the operator is enabled without a discovered channel -
same fail-fast guard this chart's previous local Subscription template
enforced with Helm's `required` function (ADR-0048). cluster-ods's own
Subscription template has no such guard, so it is preserved here instead.
Renders no resource - only a whitespace-only string ("" when the check
passes), which Helm strips from the manifest set.
*/ -}}
{{- if (index .Values "cluster-ods" "operator" "enabled") -}}
{{- if not (index .Values "cluster-ods" "operator" "subscription" "operator" "channel") -}}
{{- fail "cluster-ods.operator.subscription.operator.channel must be set via gitops_app_extra_helm_values (ADR-0048)" -}}
{{- end -}}
{{- end -}}
