{{- /*
ADR-0322 v0.1 integration scope. See values.yaml's ogxServer comment for
the full placement/distribution/storage rationale - summarized here:
this stands up the OGX Operator's actual data-plane API (a separate
OGXServer CR the operator itself does not create), configured against the
existing PostgreSQL/pgvector platform as its remote vector I/O provider
and the existing KServe/vLLM stack as its remote inference provider. Both
provider shapes and every field below are confirmed real via `oc explain
ogxserver.spec...` against the live test cluster, 2026-08-14 - no
OGXServer instance itself has been applied/verified live yet (`oc get
ogxserver -A` returns no resources today), so this is a schema-correct,
not yet cluster-verified, manifest. Disabled by default.
*/ -}}
{{- /*
Guarded by dataScienceCluster.enabled too: this chart is also installed as
the operator-only release (zuno-openshift-ai-d0), which shares
redhat-ods-applications with the dataScienceCluster release
(zuno-openshift-ai-d1) and would otherwise render this ConfigMap/
ExternalSecret/OGXServer a second time, triggering ArgoCD
SharedResourceWarning between the two Applications.
*/ -}}
{{- if and .Values.ogxServer.enabled .Values.dataScienceCluster.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ogx-override-config
  namespace: {{ .Values.ogxServer.namespace }}
  labels:
    zuno.io/managed-by: argocd
    # OGXServer.spec.overrideConfig requires this exact label on any
    # ConfigMap it reads (`oc explain ogxserver.spec.overrideConfig`) -
    # same pattern as the pgvector password Secret's ogx.io/watch label
    # below.
    ogx.io/watch: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  config.yaml: |
{{ tpl (.Files.Get "files/ogx-override-config.yaml.tpl") . | indent 4 }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ogx-pgvector-password
  namespace: {{ .Values.ogxServer.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: {{ .Values.ogxServer.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.ogxServer.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: ogx-pgvector-password
    template:
      # The OGXServer CRD identifies a watchable Secret by this label
      # (`oc explain ogxserver.spec.providers.vectorIo.remote.pgvector.password`:
      # "The Secret must be in the same namespace as the OGXServer and
      # must have the label ogx.io/watch: \"true\"").
      metadata:
        labels:
          ogx.io/watch: "true"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.ogxServer.credentials.vaultPath }}
        property: password
---
apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: {{ .Values.ogxServer.name }}
  namespace: {{ .Values.ogxServer.namespace }}
  labels:
    app.kubernetes.io/name: ogxserver
    app.kubernetes.io/component: rag-provider-prototype
  annotations:
    # After the operator/webhook (wave -5 above and DataScienceCluster's
    # own default wave 0) - the pgvector password Secret must exist first.
    argocd.argoproj.io/sync-wave: "5"
spec:
  distribution:
    {{- with .Values.ogxServer.distribution.name }}
    name: {{ . }}
    {{- end }}
    {{- with .Values.ogxServer.distribution.image }}
    image: {{ . }}
    {{- end }}
  # spec.overrideConfig supplies a full, hand-authored config.yaml,
  # bypassing BOTH OCI-label resolution (the operator's anonymous-only
  # fetch client can't authenticate to any registry) AND the typed
  # spec.providers pipeline (pkg/config/provider.go's expandPgvectorProvider
  # never sets a `persistence` field, crashing the server at startup) - see
  # files/ogx-override-config.yaml.tpl's header for the full story
  # (WP-06/ADR-0322). `distribution` above is still required by the CRD
  # schema but is unused once this is set. overrideConfig is mutually
  # exclusive with providers/resources/storage/disabledAPIs/baseConfig, so
  # none of those are set here anymore - the override file is now the
  # single source for the pgvector/vllm provider config it used to
  # generate.
  overrideConfig:
    name: ogx-override-config
    key: config.yaml
  network:
    externalAccess:
      enabled: false
    # WP-06/ADR-0322 parity run (2026-08-21): the operator-generated
    # NetworkPolicy only allows ingress from within redhat-ods-applications
    # and the ingress-router namespace by default - rag-service (zuno-data)
    # had never called into zuno-ogx before the provider-parity test and
    # was silently blocked. Namespace-wide, not pod-specific, matching the
    # embeddings NetworkPolicy fix earlier this WP (RHOAI's own operator
    # manages zuno-data's pod labels, not this chart).
    policy:
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: zuno-data
  workload:
    replicas: {{ .Values.ogxServer.replicas }}
    # spec.providers can no longer carry the pgvector password (mutually
    # exclusive with overrideConfig) - the override file's config.yaml
    # references ${env.PGVECTOR_PASSWORD}, a real Llama-Stack-style runtime
    # env-var substitution the server resolves at load time; this is the
    # documented way to inject it (`oc explain
    # ogxserver.spec.workload.overrides.env`), from the same
    # ogx-pgvector-password Secret the typed-provider path already used.
    overrides:
      env:
        - name: PGVECTOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ogx-pgvector-password
              key: password
{{- end }}
