apiVersion: v2
name: vault
description: >-
  HashiCorp Vault (ADR-0024): wraps the upstream hashicorp/vault chart as a
  dependency so this repo's own Application source follows the internal
  gitops/charts/* convention every other component uses (see
  gitops/apps/README.md), instead of pointing straight at the third-party
  Helm repo from gitops/apps/vault/application-d1.yaml. Also adds an optional
  OpenShift Route in front of the vault-ui Service (route.enabled, off by
  default - Vault access is otherwise locked down per ADR-0024's "Hardened
  requirement").
type: application
version: 0.1.0
appVersion: "1.17.2"
dependencies:
  - name: vault
    version: "0.28.1"
    repository: "https://helm.releases.hashicorp.com"
