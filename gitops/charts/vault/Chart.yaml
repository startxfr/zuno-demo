apiVersion: v2
name: vault
description: >-
  HashiCorp Vault, wrapping the upstream hashicorp/vault chart: raft
  storage, AWS KMS auto-unseal, service-ca listener TLS, an optional
  reencrypt Route, and CSI plus raft snapshot CronJobs (ADR-0602, WP-223).
type: application
version: 0.1.0
appVersion: "1.17.2"
dependencies:
  - name: vault
    version: "0.28.1"
    repository: "https://helm.releases.hashicorp.com"
