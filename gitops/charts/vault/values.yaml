# Cluster-specific; must be overridden per environment when route.enabled=true.
global:
  clusterBaseDomain: apps.mycluster.example.com

# route.host empty means "vault.<global.clusterBaseDomain>" (see
# templates/_helpers.tpl).
route:
  enabled: true
  host: ""

# Values for the upstream hashicorp/vault chart dependency, nested under
# "vault:" per Helm subchart convention.
vault:
  # Official chart's documented flag for OpenShift SCC compatibility
  # (arbitrary/non-root UID, no privileged context).
  global:
    openshift: true
  server:
    priorityClassName: zuno-platform-critical
    image:
      # Mirrored through the zuno-ai-build ImageStream (ansible/roles/
      # image_mirrors), sourced from docker.io/hashicorp/vault: the
      # unqualified "hashicorp/vault" short name resolves to a Red Hat
      # Connect registry requiring a paid pull secret this cluster doesn't
      # have, so the mirror's own `from` explicitly uses docker.io.
      repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/vault
      tag: "1.17.2"
    standalone:
      enabled: true
      config: |
        ui = true
        listener "tcp" {
          address = "[::]:8200"
          tls_disable = true
        }
        storage "file" {
          path = "/vault/data"
        }
    dataStorage:
      enabled: true
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  ui:
    enabled: true
  injector:
    enabled: false

# ADR-0112 (roadmap WP-13): scheduled snapshot of Vault's data PVC
# (templates/cronjob-backup.yaml), rendered by this chart's own -d1
# Application, false by default alongside every other switch in this
# repo's optional-resource pattern. Vault's storage backend here is
# "file" (standalone.config above), not Raft/integrated storage, so
# there is no `vault operator raft snapshot` API to call - the storage
# backend's own snapshot mechanism for a plain filesystem PVC is a CSI
# VolumeSnapshot of the volume itself. `oc get volumesnapshotclass` shows
# `csi-aws-vsc` (driver ebs.csi.aws.com, matching gp3-csi's own
# provisioner) and `oc explain volumesnapshot.spec` confirms the schema
# used below.
backup:
  enabled: true
  schedule: "0 4 * * *"  # daily 04:00 - RPO <= 24h (ADR-0112)
  retentionCount: 7
  volumeSnapshotClassName: csi-aws-vsc
  # releaseName is forced to "zuno-vault" (gitops/apps/vault/application-d1.yaml)
  # specifically so this name stays predictable - confirmed live via
  # `oc get pvc -n zuno-vault` (Bitnami/HashiCorp chart's own
  # "data-<release>-0" StatefulSet PVC naming convention).
  pvcName: data-zuno-vault-0
  image:
    # kubectl's in-cluster auth (ServiceAccount token/CA auto-detected)
    # is simpler and more robust here than hand-rolling curl+REST calls -
    # same "don't reinvent what a well-known tool already does correctly"
    # reasoning as reusing gate_checks.py logic elsewhere in this
    # roadmap. Fully qualified, pinned tag (ADR-0115). Mirrored through the
    # zuno-ai-build ImageStream (ansible/roles/image_mirrors), sourced from
    # docker.io/bitnami/kubectl.
    repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/bitnami-kubectl
    tag: "1.31"
