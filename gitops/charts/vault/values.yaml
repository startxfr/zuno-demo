# Cluster-specific; must be overridden per environment when route.enabled=true.
global:
  clusterBaseDomain: apps.mycluster.example.com

# route.host empty means "vault.<global.clusterBaseDomain>" (see templates/_helpers.tpl).
route:
  enabled: true
  host: ""

# Values for the upstream hashicorp/vault chart dependency, nested under
# "vault:" per Helm subchart convention.
vault:
  # Official chart's documented flag for OpenShift SCC compatibility
  # (arbitrary/non-root UID, no privileged context).
  global:
    openshift: true
  server:
    image:
      # Fully qualified: the unqualified "hashicorp/vault" short name resolves
      # to a Red Hat Connect registry requiring a paid pull secret this
      # cluster doesn't have. docker.io serves the same image without it.
      repository: docker.io/hashicorp/vault
      tag: "1.17.2"
    standalone:
      enabled: true
      config: |
        ui = true
        listener "tcp" {
          address = "[::]:8200"
          tls_disable = true
        }
        storage "file" {
          path = "/vault/data"
        }
    dataStorage:
      enabled: true
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  ui:
    enabled: true
  injector:
    enabled: false
