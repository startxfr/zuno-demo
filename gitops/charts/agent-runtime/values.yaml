# This chart only guarantees the service exists and is reachable in-cluster at
# agent-runtime.zuno-ai-run.svc:8080; wiring it into the demo (BFF, ingress) is
# separate.

namespace: zuno-ai-run

# Built by the "agent" build component into zuno-ai-build's ImageStream, pulled
# cross-namespace into zuno-ai-run via the system:image-puller RoleBinding.
image:
  repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/agent-runtime
  # image.tag must stay "latest" until a release is cut - see RELEASING.md (two parallel image paths).
  tag: v0.1.0
  # Always, not IfNotPresent - the mutable :latest tag needs it to avoid serving a stale cached image; see RELEASING.md.
  pullPolicy: Always

replicas: 1

# ADR-0101 (roadmap WP-12): the HA-capable shape - a PodDisruptionBudget
# (templates/poddisruptionbudget.yaml) and topology spread across nodes,
# both correct and safe at any replica count including the current
# demo-scale replicas: 1 above (a PDB with minAvailable 1 simply protects
# the sole pod from voluntary eviction; whenUnsatisfiable ScheduleAnyway
# makes the spread constraint a soft preference, never a scheduling
# blocker on a single-node/single-zone cluster). replicas itself is left
# at the current demo footprint deliberately - raising it to the >=2
# ADR-0101 describes is an environment-specific override, paired with the
# operator's failover drill (see that ADR's Operator follow-up), not a
# silent default change here.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# apps.mycluster.example.com is the substitution placeholder
# (ansible/tasks/apply_gitops_app.yml rewrites it in the Application
# manifest, which passes it back here via helm values - same pattern as
# gitops/charts/tekos). Don't reintroduce a hardcoded
# keycloak-zuno.apps.mycluster.example.com-style default: it used the
# retired keycloak-zuno.<domain> host alias, which broke JWT validation
# with an unresolvable JWKS hostname the first time no Application
# overrode it.
clusterBaseDomain: apps.mycluster.example.com
# Empty means "https://keycloak.<clusterBaseDomain>/realms/zuno".
keycloakIssuer: ""
# JWKS is fetched over the in-cluster Service, not the external Route -
# the issuer string above is only compared against the token's iss
# claim, while this URL is what actually gets dialed (the two are
# separate env vars in app/auth.py for exactly this). Fetching via the
# Route fails TLS verification (the chain ends at Vault's internal root
# CA, not in the container's system store); the in-cluster hop stays
# plain-HTTP by Keycloak's own design (spec.http.httpEnabled, edge
# termination) inside the mesh/NetworkPolicy boundary (zuno-auth allows
# zuno-ai-run).
keycloakJwksUrl: http://zuno-service.zuno-auth.svc:8080/realms/zuno/protocol/openid-connect/certs
ragServiceUrl: http://rag-service.zuno-data.svc:8080
mcpGatewayUrl: http://mcp-gateway.zuno-ai-run.svc:8080

# Routing config, provider secrets, and the local model endpoint live in the
# ai-gateway chart; this service only needs its URL.
aiGatewayUrl: http://ai-gateway.zuno-ai-run.svc:8080

# ADR-0103: LangGraph PostgreSQL checkpointer, for resumable workflow runs.
# Unset/empty CHECKPOINT_PG* falls back to in-memory checkpointing (not
# resumable across restarts) - see app/main.py's own fallback logic. Once
# CHECKPOINT_PG* IS configured (as it is here), the Postgres path is a hard
# dependency: lifespan fails startup on any connection error rather than
# silently degrading to MemorySaver, so a Postgres outage loudly crash-loops
# the pod instead of quietly losing run resumability - this is intended:
# a missing/unreachable database should surface as a crash, not be masked.
checkpointDb:
  # PGO's own PgBouncer Service in front of the shared zuno-postgresql
  # PostgresCluster - same pooled-connection convention as
  # gitops/charts/mcp-sales-db.
  host: zuno-postgresql-pgbouncer.zuno-data.svc.cluster.local
  port: "5432"
  database: agent-checkpoints
  # PGO's PgBouncer requires TLS; explicit sslmode avoids psycopg's default
  # `prefer` behavior of silently retrying a plaintext connection after any
  # TLS failure, which can produce a misleading "SSL required" error that
  # masks the real cause (e.g. a missing database).
  sslmode: require
  credentials:
    vaultPath: agent-runtime/postgresql-app
    secretName: agent-runtime-checkpoint-credentials
    secretStoreName: vault-backend
    refreshInterval: 1h

# ADR-0212: persistent-conversation metadata (conversations/
# conversation_stars tables), a second, separate Postgres pool from
# checkpointDb above - deliberately never sharing credentials with it
# (ADR-0212's own Security considerations). Unlike checkpointDb's
# optional-degrade-to-MemorySaver fallback, this pool is fail-closed by
# design: list/transcript/resume must refuse (503/deny) rather than
# silently drop the ownership restriction if it's unreachable.
conversationsDb:
  host: zuno-postgresql-pgbouncer.zuno-data.svc.cluster.local
  port: "5432"
  database: agent-conversations
  sslmode: require
  credentials:
    vaultPath: agent-runtime/conversations-postgresql-app
    secretName: agent-runtime-conversations-credentials
    secretStoreName: vault-backend
    refreshInterval: 1h
