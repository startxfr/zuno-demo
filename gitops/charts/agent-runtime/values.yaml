# Default values for the agent-runtime chart. This Application is listed
# in gitops/apps/README.md's convention but ownership of *wiring it into
# the demo* (the BFF calling it, ingress/route if any) belongs to whichever
# track owns the agent surface (Track E) — Track D (this chart) only
# guarantees the service exists, is reachable in-cluster at
# agent-runtime.zuno-platform.svc:8080, and implements the documented API
# contract (components/agent-runtime/README.md).

namespace: zuno-platform

image:
  repository: image-registry.openshift-image-registry.svc:5000/zuno-platform/agent-runtime
  tag: latest
  pullPolicy: IfNotPresent

replicas: 1

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

keycloakIssuer: https://keycloak-zuno.apps.example.com/realms/zuno
ragServiceUrl: http://rag-service.zuno-platform.svc:8080
mcpGatewayUrl: http://mcp-gateway.zuno-platform.svc:8080
localModelEndpoint: http://qwen25-7b-instruct-predictor.zuno-datascience.svc:8080/v1
localModelName: qwen2.5-7b-instruct

# Same-namespace ConfigMap generated from platform/ai-gateway/provider-routing.yaml
# by the `llm` GitOps app (gitops/apps/llm) — see platform/ai-gateway/kustomization.yaml.
providerRoutingConfigMap: zuno-provider-routing

# Same-namespace Secrets generated by the ExternalSecrets the `llm` GitOps
# app registers against secret/zuno/providers/<name> — see
# platform/ai-gateway/externalsecret-*.yaml. `optional: true` so this
# Deployment still comes up before an operator populates the real keys
# (matches the Keycloak chart's google-oauth ExternalSecret precedent).
providerSecrets:
  openai: llm-provider-openai
  gemini: llm-provider-gemini
  anthropic: llm-provider-anthropic
  mistral: llm-provider-mistral
