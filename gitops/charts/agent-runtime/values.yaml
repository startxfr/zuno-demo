# Default values for the agent-runtime chart. This Application is listed
# in gitops/apps/README.md's convention but ownership of *wiring it into
# the demo* (the BFF calling it, ingress/route if any) belongs to whichever
# track owns the agent surface (Track E) - Track D (this chart) only
# guarantees the service exists, is reachable in-cluster at
# agent-runtime.zuno-ai-run.svc:8080, and implements the documented API
# contract (components/agent-runtime/README.md).

namespace: zuno-ai-run

# Built by the Day 1 "agent" build component (ADR-0056,
# ansible/roles/agent_build) into zuno-ai-build's ImageStream, pulled
# cross-namespace into zuno-ai-run via the system:image-puller RoleBinding
# ansible/tasks/apply_openshift_build.yml grants.
image:
  repository: image-registry.openshift-image-registry.svc:5000/zuno-ai-build/agent-runtime
  tag: latest
  pullPolicy: IfNotPresent

replicas: 1

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

keycloakIssuer: https://keycloak-zuno.apps.mycluster.example.com/realms/zuno
ragServiceUrl: http://rag-service.zuno-data.svc:8080
mcpGatewayUrl: http://mcp-gateway.zuno-ai-run.svc:8080

# ADR-0009 split: routing config, provider secrets and the local model
# endpoint moved to gitops/charts/ai-gateway - this service only needs the
# gateway's URL now (same-namespace Service, gitops/apps/ai-gateway).
aiGatewayUrl: http://ai-gateway.zuno-ai-run.svc:8080
