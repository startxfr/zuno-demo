# ADR-0420/WP-069: distributes OKF bundle signatures from Vault KV into the
# running pod - registry.py's _verify_signature() expects a flat
# {name}.sig file plus one shared cosign.pub in ZUNO_OKF_SIGNATURES_DIR.
# Replaces the old configmap-signatures.yaml + committed
# files/okf-signatures/*.{sig,pem} mechanism (ADR-0106/WP-05): the signing
# Job (ansible/tasks/run_okf_signing_job.yml) now writes directly to Vault
# KV, so there is no more manual "download a CI artifact, commit it into
# gitops" hop - refreshInterval alone carries a re-signed bundle into the
# pod.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-runtime-okf-signatures
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: agent-runtime
    zuno.io/managed-by: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: agent-runtime-okf-signatures
    creationPolicy: Owner
  data:
    - secretKey: cosign.pub
      remoteRef:
        key: okf-signatures
        property: cosign.pub
{{- range .Values.okfSignedAgents }}
    - secretKey: {{ . }}.sig
      remoteRef:
        key: okf-signatures
        property: {{ . }}.sig
{{- end }}
