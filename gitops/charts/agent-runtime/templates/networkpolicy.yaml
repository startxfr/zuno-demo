# Precise ingress allow-list, not a namespace-wide baseline: any agent's
# BFF and the acceptance-gate test Job may call this service.
# agent-runtime is the shared runtime every agent's chat turns route
# through (app/registry.py loads every agents/<name>/ bundle, GraphFactory
# builds whichever graph_shape the caller's task needs) - the `from` peer
# below matches on app.kubernetes.io/component: bff alone, deliberately
# not scoped to a single zuno.io/agent value, so onboarding a new agent's
# BFF (gitops/charts/<name>) never requires touching this policy. Every
# agent's BFF runs in this same zuno-ai-run namespace, so the peer is a
# podSelector with no namespaceSelector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-runtime
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "85"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: bff
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: acceptance-gate
        # WP-087: the mlops training pipeline runs the SAME acceptance gate
        # from zuno-mlops, so the acceptance-gate peer above cannot reach
        # it - an ingress `from` peer carrying only a podSelector matches
        # same-namespace pods, and the pipeline pod is in another
        # namespace. It timed out at the TCP level on every scenario that
        # touches this service, which the ADR-0028 rate then scored as the
        # agent misbehaving rather than as a policy gap.
        #
        # namespaceSelector AND podSelector inside ONE peer element is an
        # intersection, not a union: only KFP component pods, and only
        # those in zuno-mlops. Splitting them into two list items would
        # instead admit that whole namespace plus every KFP pod anywhere.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-mlops
          podSelector:
            matchLabels:
              pipelines.kubeflow.org/v2_component: "true"
      ports:
        - protocol: TCP
          port: 8080
