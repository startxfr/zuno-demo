# ADR-0052/ADR-0037: precise ingress allow-list, not a zuno-ai namespace
# baseline (see gitops/charts/namespaces/values.yaml's platformNamespaces
# comment for why zuno-ai doesn't get one). Agent Runtime is called by
# Tekos's BFF today (cross-namespace, zuno-agent-tekos) - the equivalent
# rule for any other agent's BFF, once active, is a documented addition
# here, not an automatic grant.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-runtime
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-agent-tekos
          podSelector:
            matchLabels:
              app.kubernetes.io/component: bff
              zuno.io/agent: tekos
      ports:
        - protocol: TCP
          port: 8080
