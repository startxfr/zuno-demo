# Precise ingress allow-list, not a namespace-wide baseline: only Tekos's
# BFF and the acceptance-gate test Job may call this service. Tekos's BFF
# runs in this same zuno-ai-run namespace (gitops/charts/tekos), so its
# `from` peer below is a podSelector with no namespaceSelector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-runtime
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "85"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: bff
              zuno.io/agent: tekos
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: acceptance-gate
      ports:
        - protocol: TCP
          port: 8080
