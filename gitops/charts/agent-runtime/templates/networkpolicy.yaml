# Precise ingress allow-list, not a namespace-wide baseline: any agent's
# BFF and the acceptance-gate test Job may call this service.
# agent-runtime is the shared runtime every agent's chat turns route
# through (app/registry.py loads every agents/<name>/ bundle, GraphFactory
# builds whichever graph_shape the caller's task needs) - the `from` peer
# below matches on app.kubernetes.io/component: bff alone, deliberately
# not scoped to a single zuno.io/agent value, so onboarding a new agent's
# BFF (gitops/charts/<name>) never requires touching this policy. Every
# agent's BFF runs in this same zuno-ai-run namespace, so the peer is a
# podSelector with no namespaceSelector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-runtime
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "85"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: bff
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: acceptance-gate
      ports:
        - protocol: TCP
          port: 8080
