# ADR-0106/WP-05: distributes OKF bundle signatures from git into the
# running pod - registry.py's _verify_signature() expects a flat
# {name}.sig/{name}.pem pair per agent in ZUNO_OKF_SIGNATURES_DIR. Files
# live under files/okf-signatures/ (not referenced from elsewhere in the
# repo - Helm's .Files.Get is chart-root-relative and can't traverse ..
# out of the chart, same reason gitops/charts/rag-service's
# configmap-schema.yaml copies its SQL files into its own files/ dir).
# .Files.Get returns "" for a file that doesn't exist yet (not an error),
# so this renders cleanly with any subset of okfSignedAgents actually
# present - deliberately tolerant, since real signatures land one
# operator handoff at a time, not all at once.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-runtime-okf-signatures
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: agent-runtime
    zuno.io/managed-by: argocd
data:
{{- range .Values.okfSignedAgents }}
{{- $sig := $.Files.Get (printf "files/okf-signatures/%s.sig" .) }}
{{- $pem := $.Files.Get (printf "files/okf-signatures/%s.pem" .) }}
{{- if $sig }}
  {{ . }}.sig: |
{{ $sig | indent 4 }}
{{- end }}
{{- if $pem }}
  {{ . }}.pem: |
{{ $pem | indent 4 }}
{{- end }}
{{- end }}
