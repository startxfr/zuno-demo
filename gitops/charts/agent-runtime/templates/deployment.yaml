apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: agent-runtime
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "75"
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-runtime
    spec:
      serviceAccountName: agent-runtime
      priorityClassName: zuno-workload-default
      automountServiceAccountToken: false
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agent-runtime
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-runtime
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KEYCLOAK_ISSUER
              value: {{ .Values.keycloakIssuer | default (printf "https://keycloak.%s/realms/zuno" .Values.clusterBaseDomain) | quote }}
            - name: RAG_SERVICE_URL
              value: {{ .Values.ragServiceUrl | quote }}
            - name: MCP_GATEWAY_URL
              value: {{ .Values.mcpGatewayUrl | quote }}
            - name: AI_GATEWAY_URL
              value: {{ .Values.aiGatewayUrl | quote }}
            # ADR-0103: resumable-workflow checkpointing, optional -
            # secretKeyRef optional: true so the Deployment still comes up
            # before the ExternalSecret has synced, exactly like
            # gitops/charts/mcp-sales-db's own db credentials.
            - name: CHECKPOINT_PGHOST
              value: {{ .Values.checkpointDb.host | quote }}
            - name: CHECKPOINT_PGPORT
              value: {{ .Values.checkpointDb.port | quote }}
            - name: CHECKPOINT_PGDATABASE
              value: {{ .Values.checkpointDb.database | quote }}
            - name: CHECKPOINT_PGSSLMODE
              value: {{ .Values.checkpointDb.sslmode | quote }}
            - name: CHECKPOINT_PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.checkpointDb.credentials.secretName }}
                  key: username
                  optional: true
            - name: CHECKPOINT_PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.checkpointDb.credentials.secretName }}
                  key: password
                  optional: true
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
