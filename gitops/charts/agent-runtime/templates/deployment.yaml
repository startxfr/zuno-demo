apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: agent-runtime
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "75"
    image.openshift.io/triggers: |-
      {{ include "agent-runtime.imageTrigger" (dict "repository" .Values.image.repository "tag" .Values.image.tag "container" "agent-runtime") }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-runtime
    spec:
      serviceAccountName: agent-runtime
      priorityClassName: zuno-workload-default
      automountServiceAccountToken: false
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agent-runtime
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-runtime
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KEYCLOAK_ISSUER
              value: {{ .Values.keycloakIssuer | default (printf "https://keycloak.%s/realms/zuno" .Values.clusterBaseDomain) | quote }}
            - name: KEYCLOAK_JWKS_URL
              value: {{ .Values.keycloakJwksUrl | quote }}
            - name: RAG_SERVICE_URL
              value: {{ .Values.ragServiceUrl | quote }}
            - name: MCP_GATEWAY_URL
              value: {{ .Values.mcpGatewayUrl | quote }}
            - name: AI_GATEWAY_URL
              value: {{ .Values.aiGatewayUrl | quote }}
            # ADR-0103: resumable-workflow checkpointing, optional -
            # secretKeyRef optional: true so the Deployment still comes up
            # before the ExternalSecret has synced, exactly like
            # gitops/charts/mcp-sales-db's own db credentials.
            - name: CHECKPOINT_PGHOST
              value: {{ .Values.checkpointDb.host | quote }}
            - name: CHECKPOINT_PGPORT
              value: {{ .Values.checkpointDb.port | quote }}
            - name: CHECKPOINT_PGDATABASE
              value: {{ .Values.checkpointDb.database | quote }}
            - name: CHECKPOINT_PGSSLMODE
              value: {{ .Values.checkpointDb.sslmode | quote }}
            - name: CHECKPOINT_PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.checkpointDb.credentials.secretName }}
                  key: username
                  optional: true
            - name: CHECKPOINT_PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.checkpointDb.credentials.secretName }}
                  key: password
                  optional: true
            # ADR-0212: persistent-conversation metadata, a second Postgres
            # pool - optional: true for the same "Deployment comes up before
            # the ExternalSecret has synced" reason as CHECKPOINT_PG* above,
            # even though the app itself treats this pool as fail-closed
            # once configured (unlike checkpointDb's MemorySaver fallback).
            - name: CONVERSATIONS_PGHOST
              value: {{ .Values.conversationsDb.host | quote }}
            - name: CONVERSATIONS_PGPORT
              value: {{ .Values.conversationsDb.port | quote }}
            - name: CONVERSATIONS_PGDATABASE
              value: {{ .Values.conversationsDb.database | quote }}
            - name: CONVERSATIONS_PGSSLMODE
              value: {{ .Values.conversationsDb.sslmode | quote }}
            - name: CONVERSATIONS_PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.conversationsDb.credentials.secretName }}
                  key: username
                  optional: true
            - name: CONVERSATIONS_PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.conversationsDb.credentials.secretName }}
                  key: password
                  optional: true
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            # ADR-0106/ADR-0420: fail-closed only once every okfSignedAgents
            # entry has a real, verified signature - see values.yaml's
            # own comment and externalsecret-okf-signatures.yaml.
            - name: ZUNO_REQUIRE_SIGNED_BUNDLES
              value: {{ .Values.requireSignedBundles | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: okf-signatures
              mountPath: /app/okf-signatures
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: okf-signatures
          secret:
            secretName: agent-runtime-okf-signatures
            optional: true
