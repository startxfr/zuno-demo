apiVersion: v1
kind: Service
metadata:
  name: agent-runtime
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: agent-runtime
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "80"
spec:
  selector:
    app.kubernetes.io/name: agent-runtime
  ports:
    - name: http
      port: 8080
      targetPort: http
