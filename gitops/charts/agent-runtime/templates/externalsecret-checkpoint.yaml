# ADR-0103: resolves the same zuno/agent-runtime/postgresql-app Vault
# credential gitops/charts/postgresql/templates/externalsecret-checkpoint.yaml
# also resolves - that Secret lives in zuno-data, agent-runtime's pods live
# in zuno-ai-run, and secretKeyRef can't cross namespaces (same pattern as
# gitops/charts/mcp-sales-db's own db credentials ExternalSecret).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.checkpointDb.credentials.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "70"
spec:
  refreshInterval: {{ .Values.checkpointDb.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.checkpointDb.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.checkpointDb.credentials.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.checkpointDb.credentials.vaultPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.checkpointDb.credentials.vaultPath }}
        property: password
