# Dedicated, least-privilege service account (ADR-0052). No RBAC binding:
# this service only calls HTTP APIs (rag-service, mcp-gateway, ai-gateway,
# Keycloak JWKS), never the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-runtime
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: agent-runtime
    zuno.io/managed-by: argocd
