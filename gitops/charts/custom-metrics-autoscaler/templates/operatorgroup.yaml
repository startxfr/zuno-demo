{{- if .Values.operator.enabled }}
# OwnNamespace-scoped, per Red Hat's documented install procedure for
# this operator (unlike gitops/charts/connectivity-link, whose CSV only
# supports AllNamespaces - ADR-0318 deliberately doesn't copy that shape
# here without checking).
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: custom-metrics-autoscaler-operator-group
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  targetNamespaces:
    - {{ .Values.namespace }}
{{- end }}
