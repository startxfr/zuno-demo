# project.enabled renders the dedicated Namespace, via the vendored startx
# `project` chart; operator.enabled renders the OperatorGroup/Subscription,
# via the vendored startx `operator` chart; kedaController.enabled renders
# the operand KedaController CR. All default false so templates render
# nothing by default. Two separate ArgoCD Applications
# (zuno-custom-metrics-autoscaler-d0/-d1) set project+operator / kedaController
# respectively - same shape as gitops/charts/nvidia-gpu (OwnNamespace-scoped
# OperatorGroup, unlike gitops/charts/connectivity-link/lws which use
# AllNamespaces - this operator's CSV supports OwnNamespace per Red Hat's
# documented install procedure, confirmed by that procedure rather than a
# real-cluster test - ADR-0318).
#
# ASSUMPTION, not yet verified against a live cluster (ADR-0318): the real
# OLM package name for this operator on a given catalog. If wrong, run
# `oc get packagemanifest -n openshift-marketplace | grep -i keda` (or
# `-i custom-metrics-autoscaler`) against the target cluster and correct
# this value - ansible/roles/custom_metrics_autoscaler/tasks/install.yml's
# PackageManifest lookup fails with a clear diagnostic listing published
# channels if it's wrong, rather than silently subscribing to nothing.
#
# subscription.operator.channel/source.name are left empty by default,
# discovered by ansible and set via gitops_app_extra_helm_values on the -d0
# apply (ADR-0048). templates/checks.yaml fails the render if either is
# still empty once operator.enabled is true.
project:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: custom-metrics-autoscaler
    app: custom-metrics-autoscaler
  project:
    enabled: true
    hooked: true  # PreSync ArgoCD hook
    type: namespace
    name: openshift-keda
    display_name: Zuno Infra KEDA
    description: "Custom Metrics Autoscaler operator, configured by Zuno."
    requester: zuno

operator:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: custom-metrics-autoscaler
    app: custom-metrics-autoscaler
  subscription:
    enabled: true
    name: openshift-custom-metrics-autoscaler-operator
    namespace: openshift-keda
    operator:
      # Must be set explicitly, same name as subscription.name: the vendored
      # `operator` chart defaults this to "codeready-workspaces", silently
      # suppressing the fallback to subscription.name.
      name: openshift-custom-metrics-autoscaler-operator
      channel: ""
      installPlanApproval: Automatic  # startx chart defaults to Manual
      source:
        name: ""
        namespace: openshift-marketplace
  operatorGroup:
    enabled: true
    name: custom-metrics-autoscaler-operator-group
    namespace: openshift-keda
    target: openshift-keda
    # OwnNamespace-scoped (targetNamespaces: [openshift-keda]), per Red
    # Hat's documented install procedure for this operator - not "all-ns"
    # (startx's own default).

kedaController:
  enabled: false

# Referenced by templates/kedacontroller.yaml - kept in sync with
# project.project.name above (must match, since that's what actually
# creates the namespace).
namespace: openshift-keda
