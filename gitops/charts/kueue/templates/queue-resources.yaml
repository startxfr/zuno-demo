{{- if .Values.queueResources.enabled }}
{{- $qr := .Values.queueResources }}
# Zuno-specific quota/scheduling policy, deliberately not coupled to
# operator installation (ADR-0321's Decision: "configure ResourceFlavor,
# ClusterQueue and LocalQueue resources only where Zuno actually requires
# quota/scheduling policy"). Matches
# gitops/charts/openshift-ai/values.yaml's DataScienceCluster
# `kueue.defaultClusterQueueName`/`defaultLocalQueueName: default`.
# sync-wave 21: after the Kueue operand CR (wave 20, templates/
# kueue-operand.yaml) so the kueue.x-k8s.io CRDs the operator registers
# once Kueue reconciles are already present.
#
# ADR-0538/WP-117 adds the GPU half. Nothing here intercepts a workload on
# its own: the operand runs `manageJobsWithoutQueueName: false`, so only a
# Job that explicitly carries `kueue.x-k8s.io/queue-name` is ever queued,
# and only in a namespace labelled `kueue.openshift.io/managed=true`
# (gitops/charts/namespaces/values.yaml). Both are opt-in by design - that
# is the safety property that lets this ship without auditing every Job on
# the cluster.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: {{ $qr.resourceFlavorName }}
  annotations:
    argocd.argoproj.io/sync-wave: "21"
    # ADR-0517 live finding (demo333, 2026-09-07): on a fresh cluster the
    # kueue.x-k8s.io CRDs don't exist until the wave-20 Kueue operand CR
    # reconciles - and without this option ArgoCD fails the whole sync at
    # VALIDATION ("Make sure the CRD is installed"), before wave 20 ever
    # applies: a deadlock no amount of sync retries can clear, invisible
    # on demo222 where the CRDs predate this chart. With it, validation
    # passes, wave 20 applies, and the syncPolicy.retry rides through the
    # ~2 min the operand takes to register the CRDs.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
# Empty spec = matches every node. Deliberately left alone by WP-117: the
# GPU flavor below is purely additive, whereas narrowing this one would
# re-quota every existing and future cpu/memory consumer.
spec: {}
{{- if $qr.gpuFlavor.enabled }}
---
# The GPU flavor ADR-0321 named as a precondition and never got. Selects
# the MIG nodes by label; see values.yaml for why the ADR-0351 taint is a
# toleration here rather than a nodeTaint.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: {{ $qr.gpuFlavor.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "21"
    # ADR-0517 live finding (demo333, 2026-09-07): on a fresh cluster the
    # kueue.x-k8s.io CRDs don't exist until the wave-20 Kueue operand CR
    # reconciles - and without this option ArgoCD fails the whole sync at
    # VALIDATION ("Make sure the CRD is installed"), before wave 20 ever
    # applies: a deadlock no amount of sync retries can clear, invisible
    # on demo222 where the CRDs predate this chart. With it, validation
    # passes, wave 20 applies, and the syncPolicy.retry rides through the
    # ~2 min the operand takes to register the CRDs.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  nodeLabels:
    {{- toYaml $qr.gpuFlavor.nodeLabels | nindent 4 }}
  {{- with $qr.gpuFlavor.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: {{ $qr.clusterQueueName }}
  annotations:
    argocd.argoproj.io/sync-wave: "21"
    # ADR-0517 live finding (demo333, 2026-09-07): on a fresh cluster the
    # kueue.x-k8s.io CRDs don't exist until the wave-20 Kueue operand CR
    # reconciles - and without this option ArgoCD fails the whole sync at
    # VALIDATION ("Make sure the CRD is installed"), before wave 20 ever
    # applies: a deadlock no amount of sync retries can clear, invisible
    # on demo222 where the CRDs predate this chart. With it, validation
    # passes, wave 20 applies, and the syncPolicy.retry rides through the
    # ~2 min the operand takes to register the CRDs.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  namespaceSelector: {}
  # TWO resource groups, not one group with two flavors: a resource may
  # belong to exactly one resourceGroup, and a flavor may appear in
  # exactly one group. cpu/memory stay on the cluster-wide `default`
  # flavor; the MIG resources are only available on the GPU nodes, so they
  # need their own group carrying only the gpu-mig flavor. Merging them
  # would claim cpu/memory quota is GPU-node-only, which is false.
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: {{ $qr.resourceFlavorName }}
          resources:
            - name: "cpu"
              nominalQuota: {{ $qr.cpuQuota | quote }}
            - name: "memory"
              nominalQuota: {{ $qr.memoryQuota | quote }}
    {{- if $qr.gpuFlavor.enabled }}
    - coveredResources:
        {{- range $name, $quota := $qr.gpuFlavor.resources }}
        - {{ $name | quote }}
        {{- end }}
      flavors:
        - name: {{ $qr.gpuFlavor.name }}
          resources:
            {{- range $name, $quota := $qr.gpuFlavor.resources }}
            - name: {{ $name | quote }}
              nominalQuota: {{ $quota | quote }}
            {{- end }}
    {{- end }}
{{- range $ns := $qr.namespaces }}
---
# Name `default` matches the DataScienceCluster's `defaultLocalQueueName`,
# which is what makes the RHOAI dashboard's Workload metrics page find the
# queue for a project without per-project configuration.
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: {{ $qr.localQueueName }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "21"
    # ADR-0517 live finding (demo333, 2026-09-07): on a fresh cluster the
    # kueue.x-k8s.io CRDs don't exist until the wave-20 Kueue operand CR
    # reconciles - and without this option ArgoCD fails the whole sync at
    # VALIDATION ("Make sure the CRD is installed"), before wave 20 ever
    # applies: a deadlock no amount of sync retries can clear, invisible
    # on demo222 where the CRDs predate this chart. With it, validation
    # passes, wave 20 applies, and the syncPolicy.retry rides through the
    # ~2 min the operand takes to register the CRDs.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  clusterQueue: {{ $qr.clusterQueueName }}
{{- end }}
{{- end }}
