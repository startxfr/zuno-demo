# project.enabled renders the dedicated Namespace, via the vendored startx
# `project` chart; operator.enabled renders the OperatorGroup/Subscription,
# via the vendored startx `operator` chart. kueue-operator's CSV only supports
# the AllNamespaces install mode (confirmed live), so this dedicated namespace
# hosts its own AllNamespaces-mode OperatorGroup (operator.operatorGroup.target:
# "all-ns" below), unlike gitops/charts/custom-metrics-autoscaler's
# OwnNamespace shape. Deliberately NOT sharing openshift-operators (the
# original shape, same as jobset/lws): that put Kueue's webhook Service
# selector (`control-plane: controller-manager`, the generic kubebuilder
# label) in collision with other operators' pods carrying the same label
# (kuadrant, external-secrets, limitador) - Endpoints round-robinned across
# them, causing intermittent "connection refused" admission failures and
# leaving zuno-kueue-d1 stuck OutOfSync. A dedicated namespace makes that
# collision structurally impossible.
#
# Confirmed against a live cluster (redhat-operators catalog): the
# package is named "kueue-operator", channels "stable-v1.3"/"stable-v1.4"
# (defaultChannel "stable-v1.4").
#
# subscription.operator.channel/source.name are left empty by default,
# discovered by ansible and set via gitops_app_extra_helm_values on the -d0
# apply (ADR-0048). templates/checks.yaml fails the render if either is
# still empty once operator.enabled is true.
project:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: kueue
    app: kueue
  project:
    enabled: true
    hooked: true  # PreSync ArgoCD hook
    type: namespace
    name: openshift-kueue-operator
    display_name: Zuno Infra Kueue
    description: "Red Hat build of Kueue operator, configured by Zuno."
    requester: zuno

operator:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: kueue
    app: kueue
  subscription:
    enabled: true
    name: kueue-operator
    namespace: openshift-kueue-operator
    operator:
      # Must be set explicitly, same name as subscription.name: the vendored
      # `operator` chart defaults this to "codeready-workspaces", silently
      # suppressing the fallback to subscription.name.
      name: kueue-operator
      channel: ""
      installPlanApproval: Automatic  # startx chart defaults to Manual
      source:
        name: ""
        namespace: openshift-marketplace
  operatorGroup:
    enabled: true
    name: kueue-operator-group
    namespace: openshift-kueue-operator
    # "all-ns" (-> spec: {}, empty targetNamespaces = AllNamespaces mode),
    # not a target namespace list: kueue-operator's CSV doesn't support
    # OwnNamespace (see comment above), so this dedicated namespace still
    # needs an AllNamespaces-scoped OperatorGroup, unlike
    # custom-metrics-autoscaler's OwnNamespace one.
    target: "all-ns"

# Singleton `Kueue` CR (kueue.openshift.io/v1, cluster-scoped, per the
# operator's own alm-examples - "config resource for the Kueue operand",
# same "meta-operator needs a CR to actually deploy pods" shape as
# gitops/charts/custom-metrics-autoscaler's KedaController) - see
# templates/kueue-operand.yaml. ASSUMPTION, not yet verified against a
# live install (the operator isn't installed on the cluster this was
# written against - only its PackageManifest was checked): the CR is
# cluster-scoped and named "cluster", exactly as the alm-example shows.
# If the operator rejects this, re-check `oc get packagemanifest
# kueue-operator -n openshift-marketplace -o jsonpath='{.status.channels[?(@.name=="stable-v1.4")].currentCSVDesc.annotations.alm-examples}'`
# against the target cluster for the current example.
kueueOperand:
  enabled: false
  name: cluster
  # BatchJob is the minimal integration Zuno currently needs (no other
  # workload framework - Kubeflow TrainJob, RayJob, etc. - is wired to a
  # queue yet). Extend this list only once a real consumer needs it.
  integrationFrameworks:
    - BatchJob
  # ADR-0538/WP-117. `QueueName` = a Job without kueue.x-k8s.io/queue-name is
  # ignored by Kueue. `None` = Jobs are suspended on creation and the label is
  # ADDED for them by the mjob.kb.io mutating webhook - i.e. every Job in a
  # `kueue.openshift.io/managed` namespace gets enrolled whether or not anyone
  # asked. That is exactly what WP-117's first attempt hit, on another
  # session's Jobs, so this is set EXPLICITLY rather than inherited:
  # `oc explain` says an unset value lets the operator choose "a reasonable
  # default, which is subject to change over time".
  #
  # Do not infer the behaviour from the rendered kueue-manager-config: it
  # reported `manageJobsWithoutQueueName: false` (the QueueName semantic)
  # while the webhook was stamping anyway. Controller config and webhook
  # behaviour are separate; only this field governs the webhook.
  labelPolicy: QueueName

# Default ResourceFlavor/ClusterQueue/LocalQueue - matches
# gitops/charts/openshift-ai/values.yaml's DataScienceCluster
# `kueue.defaultClusterQueueName`/`defaultLocalQueueName: default`, so
# that declared default queue name actually resolves to something.
#
# ADR-0538/WP-117 discharges ADR-0321's own Operational-considerations
# precondition ("must account for GPU ResourceFlavor and quotas before
# distributed training or queued model workloads are enabled") by adding
# the gpuFlavor block below, now that WP-113's evaluation Jobs are real
# consumers.
queueResources:
  enabled: false
  # One LocalQueue per entry, all pointing at the single ClusterQueue.
  # zuno-ai-build was the original (and until WP-117 the only) entry:
  # distributed training (trainer/trainingoperator, Kubeflow Trainer v2)
  # was the only Kueue consumer named at the time, and
  # gitops/charts/openshift-ai/values.yaml's `workbenchNamespace` puts
  # build/training-side work there. zuno-ai-run joins it for WP-117: the
  # TrustyAI evaluation Jobs (garak, ragas) are the first workloads Kueue
  # has ever actually admitted on this cluster.
  #
  # zuno-mlops is deliberately NOT here. kueueOperand.integrationFrameworks
  # above is BatchJob-only, and the mlops training work runs as KFP-launched
  # Pods, not Jobs - a LocalQueue there would be dormant by construction.
  # Queueing that path is a Kubeflow-Trainer question (ADR-0538 decision 4),
  # not a quota one.
  namespaces:
    - zuno-ai-build
    - zuno-ai-run
  resourceFlavorName: default
  clusterQueueName: default
  localQueueName: default
  # ADR-0538/WP-117: DELIBERATELY UNDERSIZED. This is not a capacity plan and
  # must not be "corrected" upward because it looks small - it is an image-pull
  # rate limiter, and the small number is the whole mechanism.
  #
  # Why: zuno-ai-run's Jobs pull multi-GiB images (garak is 4.22 GiB, the
  # LM-Eval prefetch images similar) and land on control-plane nodes that have
  # ~11 GiB of headroom above their eviction threshold, on a cluster whose etcd
  # nodes carry the smallest disks and are schedulable. A single cold pull eats
  # a third of that; concurrent pulls are what tipped a node into DiskPressure
  # and evicted 55 pods on 2026-09-03. Kueue cannot make that node safe, but it
  # can bound how many of those pulls happen at once, which turns an unbounded
  # worst case into a bounded one.
  #
  # Sized from admitted usage read live off the Workload objects, NOT from the
  # templates - and note the istio sidecar does NOT count: Kueue builds the
  # Workload from the Job's pod template, while injection happens later at pod
  # creation, so admitted usage is the app container alone (verified: garak
  # admits as exactly 500m/1Gi in a mesh-injected namespace).
  #
  #   garak-smoke / garak-security   500m / 1Gi     <- the 4.22 GiB image
  #   ragas-eval                     250m / 512Mi   <- internal registry
  #   *-mmlu-cache-prefetch (x3)     100m / 256Mi   <- multi-GiB LM-Eval image
  #   day2-stresstest-* (x4)         200m / 256Mi   <- python:3.12-slim
  #
  # 750m/1536Mi therefore blocks the two combinations that matter: two garak
  # Jobs together (1000m) and garak alongside the three prefetch Jobs (800m),
  # i.e. no two big-image pulls are ever admitted concurrently. Small
  # workloads still flow - garak+ragas fits exactly, three prefetch Jobs fit,
  # three of the four stresstest Jobs fit.
  #
  # Raising this re-permits concurrent multi-GiB pulls. If you need to, raise
  # it and say so in the commit message rather than treating it as a tuning
  # detail.
  cpuQuota: 750m
  memoryQuota: 1536Mi
  # GPU quota, against the real MIG topology (ADR-0351). Read live from
  # both `machine.startx.io/group=gpu` nodes 2026-09-03: each allocates
  # mig-1g.24gb: 2 and mig-2g.48gb: 1, so the cluster-wide totals are 4
  # and 2. `nvidia.com/gpu` allocatable is ZERO on these nodes (the MIG
  # profiles replace the whole-GPU resource) - quotaing it would gate
  # nothing, so it is deliberately absent.
  gpuFlavor:
    enabled: true
    name: gpu-mig
    nodeLabels:
      machine.startx.io/group: gpu
    # NOT expressed as spec.nodeTaints: `oc explain resourceflavor.spec`
    # states that only NoSchedule and NoExecute are evaluated during
    # admission and PreferNoSchedule is IGNORED - and ADR-0351's taint is
    # exactly nvidia.com/gpu=true:PreferNoSchedule. Declaring it there
    # would be inert. As a toleration it is not inert: Kueue injects it
    # into the admitted Workload's pods, so a queued GPU consumer keeps
    # the soft preference working in its favour, and this keeps working
    # unchanged if that taint is ever hardened to NoSchedule.
    tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: PreferNoSchedule
    resources:
      nvidia.com/mig-1g.24gb: "4"
      nvidia.com/mig-2g.48gb: "2"
