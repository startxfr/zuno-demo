apiVersion: v2
name: lws
description: >-
  LeaderWorkerSet operator (OLM Subscription, channel/catalog discovered
  at Ansible run time - ADR-0048). ADR-0317 prerequisite for OpenShift AI
  multi-node/multi-GPU model serving; no LeaderWorkerSet workload is
  created here. Dedicated namespace (openshift-lws-operator) with its own
  OwnNamespace-scoped OperatorGroup - see values.yaml for why (the CSV
  doesn't support AllNamespaces, confirmed against a live cluster).
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: operator
    version: "21.3.277"
    repository: "alias:startx"
  - name: project
    version: "21.3.277"
    repository: "alias:startx"
