# project.enabled renders the dedicated Namespace, via the vendored startx
# `project` chart; operator.enabled renders the OperatorGroup/Subscription,
# via the vendored startx `operator` chart. Both default false so templates
# render nothing. There is no singleton operand CR for LeaderWorkerSet
# (user workloads create their own LeaderWorkerSet objects later, out of
# scope here) - zuno-lws-d1 (gitops/apps/lws/application-d1.yaml) points
# at gitops/charts/noop instead.
#
# Confirmed against a live cluster (redhat-operators catalog): the
# package is named "leader-worker-set", channel "stable-v1.0" (ADR-0317's
# "not yet verified" placeholder guess turned out correct). If this ever
# stops matching on a different cluster, run `oc get packagemanifest -n
# openshift-marketplace | grep -i leader-worker` (or `-i lws`) and correct
# this value - ansible/roles/lws/tasks/install.yml's PackageManifest
# lookup fails with a clear diagnostic listing published channels if it's
# wrong, rather than silently subscribing to nothing.
#
# Dedicated namespace (openshift-lws-operator) with its own
# OwnNamespace-scoped OperatorGroup. CONFIRMED against a live cluster's
# PackageManifest (`oc get packagemanifest leader-worker-set -n
# openshift-marketplace -o jsonpath='{.status.channels[?(@.name=="stable-v1.0")].currentCSVDesc.installModes}'`):
# leader-worker-set's CSV only supports OwnNamespace, NOT AllNamespaces
# (not even SingleNamespace/MultiNamespace). Subscribing it via the
# shared openshift-operators namespace's implicit AllNamespaces
# global-operators OperatorGroup put its CSV into Failed phase with
# reason UnsupportedOperatorGroup, message "AllNamespaces InstallModeType
# not supported, cannot configure to watch all namespaces" - this is what
# showed as "Red Hat build of Leader Worker Set" Failed in Installed
# Operators. Moving to a dedicated namespace with an OwnNamespace
# OperatorGroup (operator.operatorGroup.target set to the namespace
# itself, not "all-ns") fixes that - same shape
# gitops/charts/custom-metrics-autoscaler already uses for KEDA. (A prior
# version of this fix moved LWS to a dedicated namespace but kept
# AllNamespaces mode, assuming the failure was gitops/charts/kueue's
# separately-documented webhook Service selector collision; that
# assumption was wrong - the CSV's own install-mode message above is the
# actual, confirmed cause.)
#
# subscription.operator.channel/source.name are left empty by default,
# discovered by ansible and set via gitops_app_extra_helm_values on the -d0
# apply (ADR-0048). templates/checks.yaml fails the render if either is
# still empty once operator.enabled is true.
project:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: lws
    app: lws
  project:
    enabled: true
    hooked: true  # PreSync ArgoCD hook
    type: namespace
    name: openshift-lws-operator
    display_name: Zuno Infra LeaderWorkerSet
    description: "LeaderWorkerSet operator, configured by Zuno."
    requester: zuno

operator:
  enabled: false
  context:
    scope: zuno
    cluster: zuno-demo
    environment: demo
    component: lws
    app: lws
  subscription:
    enabled: true
    name: leader-worker-set
    namespace: openshift-lws-operator
    operator:
      # Must be set explicitly, same name as subscription.name: the
      # vendored `operator` chart's own values.yaml gives this a
      # non-empty default ("codeready-workspaces") that wins the merge
      # and silently suppresses the fallback to subscription.name.
      name: leader-worker-set
      channel: ""
      installPlanApproval: Automatic  # startx chart defaults to Manual
      source:
        name: ""
        namespace: openshift-marketplace
  operatorGroup:
    enabled: true
    name: lws-operator-group
    namespace: openshift-lws-operator
    # OwnNamespace-scoped (targetNamespaces: [openshift-lws-operator]),
    # confirmed against a live cluster's PackageManifest -
    # leader-worker-set's CSV doesn't support AllNamespaces (see comment
    # above). NOT "all-ns" (that's gitops/charts/kueue's shape - a
    # different operator whose CSV requires the opposite: AllNamespaces
    # only).
    target: openshift-lws-operator
