{{- if .Values.collector.enabled }}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: zuno-otel-collector
  namespace: zuno-monitoring
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  mode: deployment
  priorityClassName: zuno-platform-important
  config:
    {{- if .Values.collector.rhoaiTraceExport.enabled }}
    extensions:
      # ADR-0523 (WP-081): authenticates otlp/rhoai below against RHOAI's
      # Tempo gateway with this pod's own ServiceAccount token - the
      # documented RHOSDT "forward to a TempoStack gateway" pattern. The
      # matching tenant-write ClusterRole/Binding is
      # templates/rbac-rhoai-traces.yaml.
      bearertokenauth/rhoai:
        filename: /var/run/secrets/kubernetes.io/serviceaccount/token
    {{- end }}
    receivers:
      otlp:
        protocols:
          grpc: {}
          http: {}
    processors:
      batch: {}
    exporters:
      debug:
        verbosity: normal
      # gitops/charts/tempo's TempoMonolithic - kept alongside debug so
      # `oc logs` still shows spans as a sanity check independent of Tempo.
      otlp/tempo:
        endpoint: tempo-tempo.zuno-monitoring.svc.cluster.local:4317
        tls:
          insecure: true
      # ADR-0102 (roadmap WP-12): before this, every metric any service in
      # this repo emits (rag-service's zuno.rag_searches, ai-gateway's
      # cache-outcome counters, etc.) reached only `debug` (stdout
      # logging) - never a Prometheus-queryable backend, independent of
      # the BFF-level SLO metric docs/platform/slo.md describes. Standard
      # OTel Collector Contrib exporter, exposes a Prometheus-format
      # scrape endpoint on :8889. Whether OpenShift's User Workload
      # Monitoring Prometheus (or another scraper) actually discovers it
      # - which Service/port the operator creates for this listener - is
      # unverified against a live cluster; see slo.md's "Operator
      # follow-up" for the ServiceMonitor/PodMonitor step this enables
      # but does not itself perform.
      prometheus:
        endpoint: 0.0.0.0:8889
      {{- if .Values.collector.rhoaiTraceExport.enabled }}
      # ADR-0523 (WP-081): straight to RHOAI's Tempo GATEWAY, deliberately
      # NOT via RHOAI's own data-science-collector - that collector's
      # otlp/tempo exporter dials gateway:4317, a port the Tempo Operator
      # never exposes on the gateway Service (only grpc-public=8090), so
      # everything routed through it dies in retry_sender ("dial tcp ...
      # :4317: i/o timeout", confirmed live). Both obvious remediations
      # are operator-reverted within seconds (the Monitoring controller
      # re-renders the collector config; the Tempo Operator strips extra
      # gateway Service ports) - see ansible/roles/openshift_ai/tasks/
      # reconcile.yml's Tempo comment for the incident trail. 8090 is the
      # gateway's OTLP gRPC port; service-ca serving cert matches the
      # Service hostname; tenant is the TempoStack's single
      # openshift-mode tenant.
      otlp/rhoai:
        endpoint: tempo-data-science-tempostack-gateway.redhat-ods-monitoring.svc.cluster.local:8090
        auth:
          authenticator: bearertokenauth/rhoai
        headers:
          X-Scope-OrgID: redhat-ods-monitoring
        tls:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
      {{- end }}
    service:
      {{- if .Values.collector.rhoaiTraceExport.enabled }}
      extensions: [bearertokenauth/rhoai]
      {{- end }}
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, otlp/tempo{{- if .Values.collector.rhoaiTraceExport.enabled }}, otlp/rhoai{{- end }}]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, prometheus]
{{- end }}
