{{- if .Values.collector.enabled }}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: zuno-otel-collector
  namespace: zuno-telemetry
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  mode: deployment
  config:
    receivers:
      otlp:
        protocols:
          grpc: {}
          http: {}
    processors:
      batch: {}
    exporters:
      # Demo scope: logs the pipeline out so it's provably wired end
      # to end (`oc logs deploy/zuno-otel-collector-collector`).
      # Swap/add a real backend exporter (Tempo, an APM vendor) here
      # once one is provisioned - nothing else in this repo needs to
      # change, every service already points at this Collector by
      # its stable in-cluster name.
      debug:
        verbosity: normal
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
{{- end }}
