{{- if .Values.operator.enabled }}
# Created as an ArgoCD PreSync hook - runs in its own phase, entirely
# before the normal Sync phase (OperatorGroup/Subscription below), so its
# existence is guaranteed without relying on sync-wave ordering within
# the same batch. Also backed by this Application's own
# syncOptions.CreateNamespace=true (gitops/apps/observability/
# application-d0.yaml) as a redundant safeguard, since this namespace is
# also this Application's own destination.namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-opentelemetry-operator
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/hook: PreSync
    openshift.io/description: "Red Hat build of OpenTelemetry Collector operator subscription, installed by Zuno."
    openshift.io/display-name: "Zuno OpenTelemetry Operator"
    openshift.io/requester: zuno
{{- end }}
