{{- if .Values.collector.enabled }}
# Created as an ArgoCD PreSync hook - runs in its own phase, entirely
# before the normal Sync phase (OpenTelemetryCollector CR below), so its
# existence is guaranteed without relying on sync-wave ordering within
# the same batch. Also backed by this Application's own
# destination.namespace being zuno-telemetry, though CreateNamespace is
# false here (gitops/apps/observability/application-d1.yaml), so this
# hook is the only thing guaranteeing it before the Collector CR needs
# it.
apiVersion: v1
kind: Namespace
metadata:
  name: zuno-telemetry
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/hook: PreSync
    openshift.io/description: "OpenTelemetry Collector, the platform's observability pipeline."
    openshift.io/display-name: "Zuno Telemetry"
    openshift.io/requester: zuno
{{- end }}
