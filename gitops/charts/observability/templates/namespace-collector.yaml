{{- if .Values.collector.enabled }}
# PreSync hook: guarantees the namespace exists before the Collector CR
# needs it (CreateNamespace is false for this Application).
apiVersion: v1
kind: Namespace
metadata:
  name: zuno-telemetry
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/hook: PreSync
    openshift.io/description: "OpenTelemetry Collector, the platform's observability pipeline."
    openshift.io/display-name: "Zuno Telemetry"
    openshift.io/requester: zuno
{{- end }}
