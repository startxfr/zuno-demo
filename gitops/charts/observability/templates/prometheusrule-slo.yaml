{{- /*
ADR-0102 (roadmap WP-12), rebuilt on UnifAI by WP-166. The SLI is the share of
UnifAI agent sessions that finish with an outcome other than "ok":
mas_session_duration_seconds_count{mas_outcome} from the multiagent backend
(exported through the zuno collector, ADR-0566). It replaces the BFF request
counter that disappeared with agent-bff; sessions carry no agent label, so the
SLO is fleet-wide (per-agent volumes come from the ai-gateway's
zuno_model_calls_total). See docs/platform/slo.md for the burn-rate multiplier
derivation. Referencing an absent metric evaluates to "no series", not an
error. Schema confirmed via `oc explain prometheusrule.spec.groups.rules`
(monitoring.coreos.com/v1, part of OpenShift's built-in Prometheus Operator).

Also gated on collector.enabled (true only for the d1 Application), not
just alerting.enabled: this keeps the rule owned by zuno-observability-d1
alone, so it isn't rendered by both d0 and d1 into the same zuno-monitoring
namespace.
*/ -}}
{{- if and .Values.collector.enabled .Values.alerting.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: zuno-agent-path-slo
  namespace: zuno-monitoring
  labels:
    zuno.io/managed-by: argocd
spec:
  groups:
    - name: zuno-agent-path-availability-slo
      rules:
        # Standard Google SRE multi-window, multi-burn-rate alerting
        # (https://sre.google/workbook/alerting-on-slos/) for a 99.9%
        # (0.001 error-budget) SLO. Fast: 14.4x sustained burn exhausts a
        # 30-day budget in ~2 days - pages. Slow: 6x sustained burn
        # exhausts it in ~5 days - tickets, does not page.
        - alert: AgentPathErrorBudgetBurnFast
          expr: >-
            (
              sum(rate(mas_session_duration_seconds_count{mas_outcome!="ok"}[1h]))
              /
              sum(rate(mas_session_duration_seconds_count[1h]))
              > (14.4 * 0.001)
            )
            and
            (
              sum(rate(mas_session_duration_seconds_count{mas_outcome!="ok"}[5m]))
              /
              sum(rate(mas_session_duration_seconds_count[5m]))
              > (14.4 * 0.001)
            )
          for: 2m
          labels:
            severity: page
            adr: ADR-0102
          annotations:
            summary: "Agent path error budget burning fast (>14.4x sustainable rate)"
            description: >-
              The user-facing agent path (UnifAI session -> ai-gateway -> model
              and tools) is burning its 99.9% monthly error
              budget fast enough to exhaust it in ~2 days if sustained.
              See docs/platform/slo.md.
        - alert: AgentPathErrorBudgetBurnSlow
          expr: >-
            (
              sum(rate(mas_session_duration_seconds_count{mas_outcome!="ok"}[6h]))
              /
              sum(rate(mas_session_duration_seconds_count[6h]))
              > (6 * 0.001)
            )
            and
            (
              sum(rate(mas_session_duration_seconds_count{mas_outcome!="ok"}[30m]))
              /
              sum(rate(mas_session_duration_seconds_count[30m]))
              > (6 * 0.001)
            )
          for: 15m
          labels:
            severity: ticket
            adr: ADR-0102
          annotations:
            summary: "Agent path error budget burning (>6x sustainable rate)"
            description: >-
              The user-facing agent path is burning its 99.9% monthly
              error budget fast enough to exhaust it in ~5 days if
              sustained. See docs/platform/slo.md.
{{- end }}
