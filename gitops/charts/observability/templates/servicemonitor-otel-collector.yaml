{{- /*
ADR-0102/ADR-0111 (roadmap WP-12/WP-27's own note that this row was still
open). Closes slo.md's second "Current gap" prerequisite: the OTel
Collector's `prometheus` exporter (opentelemetrycollector.yaml, :8889) was
reachable but nothing scraped it.

apiVersion confirmed live against the actual Prometheus instance that
evaluates prometheusrule-slo.yaml, not assumed: `monitoring.coreos.com/v1`
`Prometheus/k8s` (openshift-monitoring) has both
`ruleNamespaceSelector` and `serviceMonitorNamespaceSelector` matching
`openshift.io/cluster-monitoring: "true"` - the label zuno-monitoring
already carries. A second, separate ServiceMonitor CRD group
(`monitoring.rhobs/v1`, used by gitops/charts/mesh-monitoring's
istiod-monitor) also exists on this cluster but is watched by a different
Prometheus - using it here would render successfully while never actually
being scraped by the Prometheus that fires the SLO alerts, a silent gap
this comment exists to prevent repeating.
*/ -}}
{{- if .Values.collector.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: zuno-otel-collector-metrics
  namespace: zuno-monitoring
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zuno-otel-collector-collector
      # The service-type label is NOT redundant. The OpenTelemetry operator
      # gives the base Service and the HEADLESS Service the SAME
      # `app.kubernetes.io/name`, and both expose port `prometheus` (8889)
      # on the same pod - so the name alone matches two Services backed by
      # one endpoint, and every sample is scraped twice under two different
      # `job` values (`...-collector` and `...-collector-headless`).
      #
      # That silently DOUBLED every zuno_* counter: BFF requests, model
      # calls, tokens and the dollar totals on the usage-cost dashboard.
      # It went unnoticed for 9 days because ratio panels are immune - the
      # factor cancels between numerator and denominator - so the rate
      # panels were right while the volume panels were exactly 2x wrong.
      # Found 2026-09-03 while adding guardrails panels; `count by (job)
      # (zuno_bff_requests_total)` returning one row is the check.
      operator.opentelemetry.io/collector-service-type: base
  namespaceSelector:
    matchNames:
      - zuno-monitoring
  endpoints:
    - port: prometheus
      path: /metrics
      interval: 30s
{{- end }}
