{{- if .Values.lightspeedConfig.enabled }}
{{- if eq .Values.credential.mode "saTokenSecret" }}
# WP-085 step 2, saTokenSecret mode.
#
# A DEDICATED ServiceAccount, deliberately not Lightspeed's own operand SA.
# Two reasons: the operand SA name is created by the operator at reconcile time
# and is not knowable before install (the v1.1.2 bundle CSV declares only
# lightspeed-operator-controller-manager), and a purpose-made identity is the
# tighter grant - gitops/charts/models/values.yaml can name exactly this
# subject in its MaaSAuthPolicy instead of a name we would have to discover.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.credential.serviceAccountName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
---
# A long-lived (legacy) ServiceAccount token. OLSConfig exposes only
# credentialsSecretRef - it has NO field for a projected token volume - so
# ai-gateway's projected, 1-hour, audience-scoped token cannot be reproduced
# here. The token minted into this Secret is audience-LESS, which is precisely
# what WP-085 step 2 requires to be verified live: whether
# AuthPolicy/maas-gateway-auth's kubernetesTokenReview accepts it while
# requesting audience https://kubernetes.default.svc.
#
# If it does not, flip credential.mode to "apiKey" - do not try to widen the
# AuthPolicy's audiences to work around it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credential.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    kubernetes.io/service-account.name: {{ .Values.credential.serviceAccountName }}
    argocd.argoproj.io/sync-wave: "-9"
type: kubernetes.io/service-account-token
{{- else if eq .Values.credential.mode "apiKey" }}
{{- if .Values.credential.apiKeyEnabled }}
# WP-085 step 2, apiKey mode. Gated on apiKeyEnabled and NOT on mode alone,
# copying gitops/charts/ai-gateway/templates/externalsecret-maas.yaml's gate
# for the same reason it exists there (live incident 2026-08-26): rendering
# this against an unseeded Vault path leaves the ExternalSecret permanently
# Degraded, and ArgoCD's wave-ordered sync then never reaches the OLSConfig,
# wedging the whole Application. Flip apiKeyEnabled only once a real key is
# minted and seeded at credential.apiKeyVaultPath.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.credential.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.credential.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: apitoken
      remoteRef:
        key: {{ .Values.credential.apiKeyVaultPath }}
        property: api_key
{{- end }}
{{- end }}
{{- end }}
