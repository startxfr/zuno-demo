{{- if and .Values.lightspeedConfig.enabled .Values.mcp.enabled (eq .Values.mcp.identityMode "serviceIdentity") }}
# ADR-0524 clause 5, service-identity mode: the Keycloak client-credentials
# token Lightspeed presents to mcp-gateway's /mcp front-door. Seeded into Vault
# by ansible/roles/lightspeed_config/tasks/install.yml BEFORE this Application
# is applied - if this sits in SecretSyncedError, that role step did not run.
#
# The value must be the complete header ("Bearer <jwt>"): the CRD's
# valueFrom/secretRef supplies the header VALUE verbatim, and mcp-gateway's
# _extract_bearer_token() requires the "Bearer " prefix.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.mcp.serviceIdentity.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.mcp.serviceIdentity.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.mcp.serviceIdentity.secretKey }}
      remoteRef:
        key: {{ .Values.mcp.serviceIdentity.vaultPath }}
        property: {{ .Values.mcp.serviceIdentity.secretKey }}
{{- end }}
