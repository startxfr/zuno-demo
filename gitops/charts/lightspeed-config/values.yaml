# ADR-0524 / WP-085. Everything here is gated behind lightspeedConfig.enabled
# so the -d0 Application renders nothing and only -d1 creates the operand,
# same shape gitops/charts/aap-config uses.
lightspeedConfig:
  enabled: false

# The operator's own namespace, created by gitops/charts/lightspeed's
# `project` subchart in Day 1. OLSConfig is a CLUSTER singleton that must be
# named "cluster" (the CRD accepts no other name), but the Secrets/ConfigMaps
# it references must live in the operator's namespace.
namespace: openshift-lightspeed

olsConfig:
  # Fixed by the CRD - do not parameterize.
  name: cluster

  # ADR-0524 clause 1: local inference through MaaS, not through a KServe
  # predictor Service and not through ai-gateway. `rhoai_vllm` is a real
  # member of the CRD's provider `type` enum (confirmed 2026-08-26 against
  # the v1.1.2 bundle CRD, alongside azure_openai/bam/openai/watsonx/
  # rhelai_vllm/google_vertex/bedrock/fake_provider).
  provider:
    name: zuno-maas
    type: rhoai_vllm
    # Two distinct names with two distinct jobs, exactly as ai-gateway
    # already models them (`model` vs `maas_model_ref` in
    # platform/ai-gateway/provider-routing.yaml) - proven by A/B on the live
    # gateway 2026-08-27 (see git history for the full trace):
    #
    #   llmISvcName  - the LLMInferenceService, and the ONLY thing the
    #                  HTTPRoute matches. Goes in the URL path.
    #   maasModelRef - the served model name MaaS routes on. Goes in the
    #                  request body's `model` (the llm-d router answers 404 to
    #                  anything else; the path identity is derived from the URL).
    #   modelName    - what the KServe predictor itself answers to, used
    #                  only when endpointMode=direct bypasses MaaS.
    #
    # FALLBACK (branch lightspeed/qwen35-fallback, 2026-10-25): qwen35-9b, a
    # non-reasoning answer by default (enable_thinking: false server-side,
    # gitops/charts/models/values.yaml qwen35Model), so the tool-result
    # classifier's 128-token call gets an answer (ADR-0524). Its published and
    # LLMInferenceService name is qwen35-9b; the served name vLLM answers to is
    # qwen3.5-9b (the same body model ai-gateway's local-qwen35-maas sends).
    llmISvcName: qwen35-9b
    maasModelRef: qwen3.5-9b
    modelName: qwen3.5-9b
    # 2026-10-24: back on MaaS. The 2026-09-09 fallback to `direct` was forced by the
    # MaaS AuthPolicy matching the request path against a model identity that no
    # caller could present; since the MaaSModelRefs carry the plain served-model
    # names, the path identity (zuno-ai-run/gpt-oss-20b) matches the subscription
    # `gpt-oss-20b-lightspeed` (gitops/charts/models/values.yaml) and the entitlement
    # of the ServiceAccount `lightspeed-maas-client`. The body `model` must be the
    # served name (maasModelRef above): the llm-d router answers 404 to any other
    # value. Roll back with `endpointMode: direct`; nothing else needs to change.
    endpointMode: maas  # direct | maas

    # In-cluster MaaS gateway root. Same endpoint ai-gateway's maasAdapter
    # uses (MAAS_GATEWAY_ENDPOINT), path-scoped per model below.
    gatewayEndpoint: https://maas-default-gateway-istio.openshift-ingress.svc
    # Serving namespace segment of the MaaS path (/{ns}/{publishedModel}/v1).
    servingNamespace: zuno-ai-run
    # endpointMode=direct : le Service KServe du workload, en OpenAI-compatible
    # sur 8000. Meme endpoint que le fallback documente d'ai-gateway
    # (LOCAL_MODEL_ENDPOINT). Admis par networkpolicy-gptoss.yaml's
    # lightspeed.enabled block (gitops/charts/models/values.yaml
    # lightspeed.enabled: true).
    # Direct mode would also need a Lightspeed admission in
    # networkpolicy-qwen35.yaml (only gpt-oss has one); MaaS mode does not.
    directEndpoint: https://qwen35-9b-kserve-workload-svc.zuno-ai-run.svc:8000/v1
    # qwen35-9b is served with maxModelLen: 32768 (gitops/charts/models/
    # values.yaml qwen35Model block); matched here. gpt-oss-20b would be 131072.
    contextWindowSize: 32768
    maxTokensForResponse: 2048
    # Lightspeed inspects every tool result with a classifier that calls THIS model with a hard-coded
    # 128-token limit. gpt-oss-20b reasons by default and the reasoning eats the 128 tokens, so every
    # tool-using question failed with "a tool result failed the safety inspection". Lightspeed sends this
    # as the request-level `reasoning_effort` (the vLLM server-side default does not take effect on
    # gpt-oss). Measured in the Lightspeed pod: classifier 5/5 parsed in 44-56 tokens with `low`.
    # See docs/roadmap/evidence/lightspeed-tool-result-inspection-2026-10-25.md. Empty = not sent.
    # DISABLED 2026-10-25: with reasoningConfig set, Lightspeed switches to ChatVLLMReasoning and EVERY query
    # fails ("'dict' object has no attribute 'choices'" in _invoke_llm astream), so the classifier fix below
    # is not usable as is. Keep empty until Lightspeed fixes that class or another route is chosen.
    reasoningEffort: ""

  # ADR-0524 clause 2: native OpenShift knowledge, untouched. `rag` stays
  # empty and `byokRAGOnly` stays FALSE so the operator's RHOKP sidecar keeps
  # serving official, version-matched OpenShift documentation. Setting
  # byokRAGOnly: true would disable exactly that. Zuno builds no OpenShift-
  # documentation ingestion pipeline and no pgvector corpus for it.
  byokRAGOnly: false

  # ADR-0524 clause 6: leave introspection ON (the CRD's own default) so the
  # operator-managed openshift-mcp-server can answer questions about live
  # cluster state, scoped by the querying user's own RBAC.
  introspectionEnabled: true

  # ADR-0524 clause 4, third layer. `tool_annotations` is the CRD default;
  # named explicitly so a future edit is a visible decision rather than a
  # silent inherit. 'never' would remove the approval prompt entirely.
  toolsApproval:
    approvalType: tool_annotations
    approvalTimeout: 600

# ADR-0524 clause 3. One MCP server entry: the EXISTING Zuno MCP Gateway's
# new /mcp front-door. No dedicated MCP deployment is created for Lightspeed.
#
# featureGates MUST contain "MCPServer" or this whole block is inert - all
# feature gates are off by default on v1.1.2 (CRD enum: MCPServer,
# ToolFiltering). This is the single easiest way to configure Lightspeed's MCP
# integration and have it silently do nothing.
mcp:
  enabled: true
  featureGates:
    - MCPServer
  server:
    name: zuno-mcp
    url: http://mcp-gateway.zuno-ai-run.svc.cluster.local:8080/mcp
    # The CRD default is 5s. mcp-gateway's own call to a downstream MCP server
    # already allows 40s (DOWNSTREAM_TIMEOUT_SECONDS), so a 5s budget here
    # would time out on Confluence searches the gateway itself considers
    # healthy.
    #
    # 2026-09-09, live-caught: aap.cluster.audit used to block synchronously
    # on a real AAP Job Template (~2m30s observed) - raised to 630s here as a
    # first fix, then reverted back to 60s once cluster_audit itself was
    # changed to launch-and-return (components/mcp-servers/aap/server.py) -
    # OpenShift Lightspeed's console plugin has its own client-side request
    # timeout well under a few minutes, and no field on this CRD can raise
    # THAT one, so the fix had to happen in the tool, not this timeout. Keep
    # this at a value that only needs to cover this repo's own fast tools
    # (Confluence/RAG search, launching a job, reading AAP's own state) -
    # nothing behind zuno-mcp should ever block for minutes again.
    timeoutSeconds: 60

  # ADR-0524 clause 5. Two identity modes, both delivered by WP-085.
  #
  #   serviceIdentity - a dedicated Keycloak client-credentials token carrying
  #     a read-only group. Works against mcp-gateway's existing auth.py with no
  #     code change (valueFrom.type: secret).
  #   perUser        - transmet le token OpenShift de l'utilisateur connecte
  #     (valueFrom.type: kubernetes) vers la branche TokenReview de
  #     mcp-gateway. NB: `kubernetes`, pas `client` - voir le commentaire
  #     detaille dans templates/olsconfig.yaml.
  #
  # Only ONE may be active: they both set the Authorization header, and the
  # CRD has no precedence rule between two entries with the same header name.
  # templates/checks.yaml fails the render if the value is not one of the two.
  #
  # perUser is the DEFAULT and the intended mode: the Confluence content a user
  # reaches through the console assistant is then exactly what their own
  # OpenShift groups already permit, and `consultant`/`sales` are both real
  # OpenShift groups AND tool-policy allowed_groups on this cluster, so no
  # mapping table is needed. mcp-gateway resolves the forwarded token through
  # TokenReview (app/auth.py's validate_token_or_kubernetes).
  #
  # Fall back to serviceIdentity ONLY if the console plugin turns out not to
  # forward the user token on v1.1.2 - it collapses every console user onto one
  # shared identity and loses per-user Confluence scoping, so it is a
  # compatibility fallback, not an equivalent alternative.
  identityMode: perUser  # perUser | serviceIdentity

  serviceIdentity:
    secretName: lightspeed-mcp-token
    secretKey: token
    # Seeded by ansible/roles/lightspeed_config/tasks/install.yml before this
    # Application is applied. If the ExternalSecret sits in SecretSyncedError,
    # that role step did not run.
    vaultPath: zuno/lightspeed/mcp-token

# ADR-0524 clause 1, TLS. maas-default-gateway's serving cert is issued by the
# cluster's openshift-service-serving-signer, which is NOT in the Lightspeed
# image's default trust store - the same trap ai-gateway's maasAdapter hit
# live on 2026-08-26, where it surfaced as a generic "Connection error" and a
# silent fallback rather than a TLS failure.
#
# Rendered as our own ConfigMap carrying the service.beta.openshift.io/
# inject-cabundle annotation, so the service-ca operator fills in service-ca.crt
# for us. NOT the auto-created "openshift-service-ca.crt" ConfigMap: that one is
# managed by the cluster and referencing it would make ArgoCD fight the
# service-ca operator over a resource neither owns.
caBundle:
  enabled: true
  configMapName: lightspeed-maas-ca

# The MaaS credential. See WP-085 step 2's "Open item" - this is the one thing
# that must be settled against the live cluster before install.
#
#   saTokenSecret - a long-lived kubernetes.io/service-account-token Secret.
#     Preferred IF TokenReview accepts an audience-less legacy token when
#     AuthPolicy/maas-gateway-auth requests audience
#     https://kubernetes.default.svc. Needs no new secret material.
#   apiKey        - a MaaS-issued sk-oai-* key from Vault. Fits
#     credentialsSecretRef perfectly but needs minting and seeding first.
#
# apiKeyEnabled is DELIBERATELY false and gates the ExternalSecret's render,
# copying gitops/charts/ai-gateway's maasAdapter gate verbatim - and for the
# same reason it was added there after a live incident on 2026-08-26:
# rendering an ExternalSecret against an unseeded Vault path leaves it
# permanently Degraded, and ArgoCD's wave-ordered sync then never reaches the
# resources behind it, wedging the whole Application.
credential:
  # staticToken : Secret Opaque portant la cle `apitoken`, avec une valeur
  #   factice. Necessaire meme en endpointMode=direct, pour DEUX raisons :
  #   1. `credentialsSecretRef` est REQUIS par le CRD.
  #   2. l'operateur v1.1.2 IGNORE `credentialKey` et exige en dur la cle
  #      `apitoken` - defaut constate live le 2026-08-27
  #      ("missing key 'apitoken'"), qui laissait OLSConfig.status vide et
  #      aucun operand cree. C'est ce defaut, et non MaaS, qui bloquait A.
  #   Le predictor KServe n'exige aucune authentification : ai-gateway lui
  #   envoie litteralement "not-required" (app/providers.py).
  # saTokenSecret : token de ServiceAccount long, pour MaaS via TokenReview.
  # apiKey        : cle MaaS sk-oai-*, depuis Vault.
  mode: saTokenSecret  # staticToken | saTokenSecret | apiKey
  # Valeur placee dans la cle `apitoken` en mode staticToken. N'est jamais un
  # secret : le predictor l'ignore. Ne PAS reutiliser ce mode pour un endpoint
  # qui authentifie reellement.
  staticTokenValue: not-required
  secretName: lightspeed-maas-credentials
  # OLSConfig.spec.llm.providers[].credentialKey. Left empty so the template
  # derives it from `mode` - the two modes produce Secrets with DIFFERENT key
  # names and mismatching them yields an empty credential and a 401 from MaaS
  # that looks like an entitlement problem:
  #   saTokenSecret -> "token"    (fixed by kubernetes.io/service-account-token)
  #   apiKey        -> "apitoken" (the CRD's own default)
  # Set a non-empty value only to override that derivation deliberately.
  credentialKey: ""
  serviceAccountName: lightspeed-maas-client
  apiKeyEnabled: false
  apiKeyVaultPath: maas/gateway-api-key

# ADR-0524 : qui peut ouvrir le chat Lightspeed dans la console. Sans binding,
# l'operateur refuse tout le monde ("Not authorized"). Groupes OpenShift, tels
# que la synchronisation Keycloak les cree (noms nus, sans "/").
chatAccess:
  enabled: true
  bindingName: zuno-lightspeed-query-access
  groups:
    - consultant
    - sales
