{{- if .Values.signerClientMirror.enabled }}
# ADR-0535/WP-111: mirrors the SAME Vault path
# gitops/charts/keycloak/templates/externalsecret-zuno-signer-client.yaml
# already resolves into zuno-auth, into zuno-ai-build - secretKeyRef
# can't cross namespaces, so the image-signing Jobs
# (ansible/tasks/run_image_signing_job.yml,
# ansible/tasks/verify_image_signatures.yml) need their own copy here,
# same two-ExternalSecrets-one-Vault-path shape as WP-110's Trillian DB
# password.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zuno-signer-client-secret
  namespace: zuno-ai-build
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: {{ .Values.signerClientMirror.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.signerClientMirror.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: zuno-signer-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: {{ .Values.signerClientMirror.vaultPath }}
        property: client_secret
{{- end }}
