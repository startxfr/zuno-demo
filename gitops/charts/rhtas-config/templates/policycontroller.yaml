{{- if .Values.policyOperand.enabled }}
# ADR-0535/WP-111: activates the actual image-signature admission
# webhook (the CSV's own controller-manager, already running once the
# operator installs, only reconciles this CR - same "operator needs an
# activation/config singleton CR" shape gitops/charts/jobset's
# JobSetOperator / gitops/charts/kueue's Kueue CR already use). Shape
# confirmed against this cluster's CSV alm-examples (2026-09-02) -
# rhtas.charts.redhat.com/v1alpha1 wraps the upstream sigstore
# policy-controller Helm chart's own values, not a strictly-schema'd CRD.
#
# webhook.namespaceSelector: the webhook ONLY intercepts admission
# requests in namespaces carrying policy.rhtas.com/include=true (a
# namespace without it is invisible to this webhook entirely, no audit
# log either) - gitops/charts/namespaces labels the zuno namespaces that
# actually run these 14 images with it. Combined with
# clusterimagepolicy.yaml's spec.mode: warn, this is belt-and-braces
# audit-only: even a labeled namespace can only ever get a warning, never
# a reject, in this WP's scope.
# Live finding, 2026-09-02: policy-controller-operator's own admission
# webhook hard-rejects this CR outside a namespace literally named
# "policy-controller-operator" ("PolicyController objects may only be
# created in the \"policy-controller-operator\" namespace") - explicit
# namespace here, not the Application's destination.namespace (zuno-rhtas,
# still correct for the operator Subscription/OperatorGroup - see
# application-d0.yaml - and for nothing else in this chart, since
# TrustRoot/ClusterImagePolicy are Cluster-scoped).
apiVersion: rhtas.charts.redhat.com/v1alpha1
kind: PolicyController
metadata:
  name: zuno-policy-controller
  namespace: policy-controller-operator
  labels:
    zuno.io/managed-by: argocd
  annotations:
    # Same wave as trustroot.yaml/clusterimagepolicy.yaml - see that
    # file's comment (live finding: none of these three CR types
    # populate a health-check-recognizable status, so wave-splitting
    # them hangs ArgoCD's sync on a Progressing wait that never resolves).
    argocd.argoproj.io/sync-wave: "-5"
spec:
  policy-controller:
    cosign:
      webhookName: policy.rhtas.com
    webhook:
      failurePolicy: Ignore
      name: webhook
      namespaceSelector:
        matchExpressions:
          - key: policy.rhtas.com/include
            operator: In
            values:
              - "true"
      webhookNames:
        defaulting: defaulting.clusterimagepolicy.rhtas.com
        validating: validating.clusterimagepolicy.rhtas.com
{{- end }}
