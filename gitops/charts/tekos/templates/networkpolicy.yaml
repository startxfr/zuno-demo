# Grants the acceptance-gate Job (runs in zuno-ai-run) ingress to the BFF,
# additive to the namespace-wide default-deny baseline the frontend already
# relies on.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tekos-bff
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: bff
      zuno.io/agent: tekos
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-ai-run
          podSelector:
            matchLabels:
              app.kubernetes.io/name: acceptance-gate
      ports:
        - protocol: TCP
          port: 8080
