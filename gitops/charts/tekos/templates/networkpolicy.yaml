# Grants the tekos-frontend Deployment (the real chat path) and the
# acceptance-gate Job ingress to the BFF, additive to the namespace-wide
# default-deny baseline. No namespaceSelector needed: an ingress `from`
# peer with only a podSelector matches same-namespace pods.
#
# This policy previously only listed acceptance-gate, so tekos-frontend's
# own calls to tekos-bff were silently dropped by the implicit
# default-deny (Kubernetes denies everything not explicitly allowed once
# any NetworkPolicy selects a pod) - every real chat turn timed out at
# the TCP level. The acceptance-gate suite never caught this because it
# calls the BFF directly, bypassing the frontend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tekos-bff
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: bff
      zuno.io/agent: tekos
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
              zuno.io/agent: tekos
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: acceptance-gate
        # WP-133 (live, 2026-09-04): the mlops training pipeline runs the
        # SAME acceptance gate from zuno-mlops (ADR-0302 point 5's evaluate
        # stage) - the acceptance-gate peer above cannot reach it, since an
        # ingress `from` peer carrying only a podSelector matches
        # same-namespace pods and the pipeline pod is in another namespace.
        # It timed out at the TCP level on every scenario/security-check
        # that calls tekos-bff (7, 16, 17, 20, bff_forwards_identity_to_
        # runtime, business_role_without_entitlement_denied_by_bff), which
        # the ADR-0028 rate then scored as the agent misbehaving rather
        # than as a policy gap - exactly the same class of bug WP-087
        # already fixed for comage-bff's own copy of this policy (see that
        # chart's identical rule/comment), never ported here because tekos
        # was never an actual evaluate target before this WP.
        #
        # namespaceSelector AND podSelector inside ONE peer element is an
        # intersection, not a union: only KFP component pods, and only
        # those in zuno-mlops. Splitting them into two list items would
        # instead admit that whole namespace plus every KFP pod anywhere.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zuno-mlops
          podSelector:
            matchLabels:
              pipelines.kubeflow.org/v2_component: "true"
      ports:
        - protocol: TCP
          port: 8080
