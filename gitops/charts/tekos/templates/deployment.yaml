apiVersion: apps/v1
kind: Deployment
metadata:
  name: tekos-frontend
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/agent: tekos
    app.kubernetes.io/component: frontend
  annotations:
    argocd.argoproj.io/sync-wave: "90"
    image.openshift.io/triggers: |-
      {{ include "tekos.imageTrigger" (dict "repository" .Values.image.frontendRepository "tag" .Values.image.tag "container" "frontend") }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
      zuno.io/agent: tekos
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
        zuno.io/agent: tekos
    spec:
      serviceAccountName: tekos-frontend
      priorityClassName: zuno-workload-default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: "{{ include "tekos.frontendImage" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ACTIVE_AGENT
              value: {{ .Values.frontend.activeAgent | quote }}
            - name: KEYCLOAK_ISSUER_URL
              value: {{ include "tekos.keycloakIssuerUrl" . | quote }}
            {{- if .Values.keycloak.caConfigMapName }}
            - name: KEYCLOAK_CA_CERT_PATH
              value: /etc/pki/agent-frontend/keycloak-ca/ca.crt
            {{- end }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.frontend.oidcClientId | quote }}
            - name: SELF_BASE_URL
              value: {{ include "tekos.selfBaseUrl" . | quote }}
            - name: BFF_BASE_URL
              value: "http://tekos-bff.{{ .Values.namespace }}.svc.cluster.local:8080"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tekos-frontend-secrets
                  key: OIDC_CLIENT_SECRET
            - name: SESSION_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: tekos-frontend-secrets
                  key: SESSION_HMAC_SECRET
            - name: SESSION_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: tekos-frontend-secrets
                  key: SESSION_ENCRYPTION_KEY
            - name: SESSION_MAX_LIFETIME_SECONDS
              value: {{ .Values.redis.sessionMaxLifetimeSeconds | quote }}
            - name: REDIS_ADDR
              value: {{ .Values.redis.addr | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tekos-frontend-secrets
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.keycloak.caConfigMapName }}
            - name: keycloak-ca
              mountPath: /etc/pki/agent-frontend/keycloak-ca
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.keycloak.caConfigMapName }}
        - name: keycloak-ca
          configMap:
            name: {{ .Values.keycloak.caConfigMapName }}
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tekos-bff
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/agent: tekos
    app.kubernetes.io/component: bff
  annotations:
    argocd.argoproj.io/sync-wave: "90"
    image.openshift.io/triggers: |-
      {{ include "tekos.imageTrigger" (dict "repository" .Values.image.bffRepository "tag" .Values.image.tag "container" "bff") }}
spec:
  replicas: {{ .Values.bff.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: bff
      zuno.io/agent: tekos
  template:
    metadata:
      labels:
        app.kubernetes.io/component: bff
        zuno.io/agent: tekos
    spec:
      serviceAccountName: tekos-bff
      priorityClassName: zuno-workload-default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bff
          image: "{{ include "tekos.bffImage" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AGENT_NAME
              value: {{ .Values.bff.agentName | quote }}
            - name: KEYCLOAK_ISSUER_URL
              value: {{ include "tekos.keycloakIssuerUrl" . | quote }}
            - name: KEYCLOAK_JWKS_URL
              value: {{ .Values.keycloak.jwksUrl | quote }}
            - name: OIDC_AUDIENCE
              value: {{ .Values.bff.oidcAudience | quote }}
            - name: AGENT_RUNTIME_BASE_URL
              value: {{ .Values.bff.agentRuntimeBaseUrl | quote }}
            {{- if .Values.keycloak.adminClientId }}
            # ADR-0530/WP-091. agent-bff's NewAdminClient returns nil - and
            # both endpoints fail closed with 503 - if any of these three is
            # empty, which is the documented behavior when the boundary is
            # not provisioned. Rendering them is what turns it on.
            - name: KEYCLOAK_ADMIN_BASE_URL
              value: {{ .Values.keycloak.adminBaseUrl | quote }}
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: {{ .Values.keycloak.adminClientId | quote }}
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tekos-bff-admin-secret
                  key: KEYCLOAK_ADMIN_CLIENT_SECRET
                  # optional, and load-bearing. The Vault path is seeded by
                  # ansible/roles/vault, NOT by ArgoCD, so this chart can sync
                  # before the Secret exists. Without `optional` that is a
                  # CreateContainerConfigError and the BFF stops serving
                  # entirely; with it, the var is simply unset, NewAdminClient
                  # returns nil, and /api/colleagues and /api/groups keep
                  # returning the documented 503 while everything else works.
                  optional: true
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.bff.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
