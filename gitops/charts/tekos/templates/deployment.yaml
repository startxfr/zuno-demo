apiVersion: apps/v1
kind: Deployment
metadata:
  name: tekos-frontend
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/agent: tekos
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
      zuno.io/agent: tekos
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
        zuno.io/agent: tekos
    spec:
      serviceAccountName: tekos-frontend
      containers:
        - name: frontend
          image: "{{ include "tekos.frontendImage" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ACTIVE_AGENT
              value: {{ .Values.frontend.activeAgent | quote }}
            - name: KEYCLOAK_ISSUER_URL
              value: {{ include "tekos.keycloakIssuerUrl" . | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.frontend.oidcClientId | quote }}
            - name: SELF_BASE_URL
              value: {{ include "tekos.selfBaseUrl" . | quote }}
            - name: BFF_BASE_URL
              value: "http://tekos-bff.{{ .Values.namespace }}.svc.cluster.local:8080"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tekos-frontend-secrets
                  key: OIDC_CLIENT_SECRET
            - name: SESSION_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: tekos-frontend-secrets
                  key: SESSION_HMAC_SECRET
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tekos-bff
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/agent: tekos
    app.kubernetes.io/component: bff
spec:
  replicas: {{ .Values.bff.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: bff
      zuno.io/agent: tekos
  template:
    metadata:
      labels:
        app.kubernetes.io/component: bff
        zuno.io/agent: tekos
    spec:
      serviceAccountName: tekos-bff
      containers:
        - name: bff
          image: "{{ include "tekos.bffImage" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AGENT_NAME
              value: {{ .Values.bff.agentName | quote }}
            - name: KEYCLOAK_ISSUER_URL
              value: {{ include "tekos.keycloakIssuerUrl" . | quote }}
            - name: OIDC_AUDIENCE
              value: {{ .Values.bff.oidcAudience | quote }}
            - name: AGENT_RUNTIME_BASE_URL
              value: {{ .Values.bff.agentRuntimeBaseUrl | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.bff.resources | nindent 12 }}
