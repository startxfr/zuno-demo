apiVersion: v1
kind: Service
metadata:
  name: tekos-frontend
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/agent: tekos
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/component: frontend
    zuno.io/agent: tekos
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# No OpenShift Route for the BFF (ADR-0023 isolation): the frontend proxies
# chat calls to it server-side over the in-cluster ClusterIP Service only.
apiVersion: v1
kind: Service
metadata:
  name: tekos-bff
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/agent: tekos
    app.kubernetes.io/component: bff
spec:
  selector:
    app.kubernetes.io/component: bff
    zuno.io/agent: tekos
  ports:
    - name: http
      port: 8080
      targetPort: http
