# Fixed hostname (tekos.routeHost helper) since the OIDC redirect URI
# contract https://<agent>.apps.<cluster-domain>/* and the Keycloak client's
# registered redirect URI both depend on a predictable host - see
# templates/_helpers.tpl and values.yaml.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: tekos-frontend
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/agent: tekos
    app.kubernetes.io/component: frontend
  annotations:
    argocd.argoproj.io/sync-wave: "105"
spec:
  host: {{ include "tekos.routeHost" . }}
  to:
    kind: Service
    name: tekos-frontend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
