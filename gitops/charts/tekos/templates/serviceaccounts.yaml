# Dedicated service accounts per workload (ADR-0023: "separate each agent
# instance with dedicated namespaces, service accounts, quotas and
# NetworkPolicies"). Neither needs any cluster role beyond the OpenShift
# default (they call HTTP APIs, not the Kubernetes API) - no
# RoleBinding is created.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekos-frontend
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/agent: tekos
    app.kubernetes.io/component: frontend
  annotations:
    argocd.argoproj.io/sync-wave: "80"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekos-bff
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/agent: tekos
    app.kubernetes.io/component: bff
  annotations:
    argocd.argoproj.io/sync-wave: "80"
