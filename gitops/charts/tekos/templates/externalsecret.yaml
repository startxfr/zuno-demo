# Frontend-only: the BFF validates bearer JWTs via Keycloak's JWKS and
# holds no secret. The frontend does the server-side OIDC exchange, so it
# needs the confidential client secret plus its own session cookie HMAC key.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tekos-frontend-secrets
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
    zuno.io/agent: tekos
  annotations:
    argocd.argoproj.io/sync-wave: "85"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: tekos-frontend-secrets
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.vault.oidcClientSecretPath | trimPrefix "zuno/" }}
        property: client_secret
    - secretKey: SESSION_HMAC_SECRET
      remoteRef:
        key: {{ .Values.vault.sessionSecretPath | trimPrefix "zuno/" }}
        property: hmac_secret
