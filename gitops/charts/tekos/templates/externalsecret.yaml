# Frontend-only: the BFF (components/agent-bff) validates bearer JWTs via
# Keycloak's JWKS and never holds a secret of its own (see
# internal/config/config.go - no *Secret field). The frontend does the
# server-side OIDC authorization-code exchange (internal/oidc/oidc.go), so it
# needs the tekos-frontend confidential client's secret plus its own session
# cookie HMAC key. Both are self-generated by the vault role
# (ansible/roles/vault/tasks/configure.yml) - never hardcoded here.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tekos-frontend-secrets
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
    zuno.io/agent: tekos
  annotations:
    argocd.argoproj.io/sync-wave: "85"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: tekos-frontend-secrets
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.vault.oidcClientSecretPath | trimPrefix "zuno/" }}
        property: client_secret
    - secretKey: SESSION_HMAC_SECRET
      remoteRef:
        key: {{ .Values.vault.sessionSecretPath | trimPrefix "zuno/" }}
        property: hmac_secret
