# ADR-0611 / WP-246. The registry the okf-fetch init containers of mcp-gateway and a2a-gateway read first
# (okf.fetch.mirror.prefix = okf-mirror.zuno-ai-run.svc:5000/okf, plainHttp true: the namespace is in the mesh,
# which carries the traffic over mTLS). Admission writes to it with `admit_okf_bundle.py mirror` through a
# port-forward; nothing is exposed outside the cluster.
namespace: zuno-ai-run

image:
  # zot v2.1.22 (2026-10-06), the version measured in the WP-246 canary on 2026-11-09. Pinned by digest.
  repository: ghcr.io/project-zot/zot-linux-amd64
  digest: "sha256:46f688dc26315a35a247e1784368829e66a67bf91de94c7d8d1645044fac1d5b"
  pullPolicy: IfNotPresent

replicas: 1

storage:
  size: 1Gi
  # Empty: the cluster default StorageClass.
  storageClassName: ""

# Pods allowed to read (and only read, nothing here writes): the two consumers of the release.
readers:
  - mcp-gateway
  - a2a-gateway

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 512Mi}
