apiVersion: v1
kind: Service
metadata:
  name: okf-mirror
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: okf-mirror
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "35"
spec:
  selector:
    app.kubernetes.io/name: okf-mirror
  ports:
    - name: http
      port: 5000
      targetPort: http
