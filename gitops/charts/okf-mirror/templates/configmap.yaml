apiVersion: v1
kind: ConfigMap
metadata:
  name: okf-mirror-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: okf-mirror
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
data:
  config.json: |
    {
      "distSpecVersion": "1.1.0",
      "storage": {"rootDirectory": "/data", "gc": true},
      "http": {"address": "0.0.0.0", "port": "5000"},
      "log": {"level": "info"}
    }
