# Dedicated service account, no RBAC: the registry never talks to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: okf-mirror
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: okf-mirror
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
