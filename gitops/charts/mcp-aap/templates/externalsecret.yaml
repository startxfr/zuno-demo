# ADR-0024/ADR-0208/ADR-0355 clause 3: the least-privilege `zuno-mcp` AAP
# identity, seeded at Vault path zuno/aap/mcp-token by
# ansible/roles/aap_config/tasks/install.yml (not the vault role - the token
# has to be minted against a running Gateway, so it cannot be a
# self-generated seed). Never hardcoded here.
#
# `url` is the AAP *Gateway* service. Never aap-controller-service: on AAP
# 2.5+ the controller service answers 401 to a gateway-minted token (proven
# live in WP-073).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.credentials.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.credentials.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.credentials.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.credentials.vaultPath }}
        property: token
    - secretKey: url
      remoteRef:
        key: {{ .Values.credentials.vaultPath }}
        property: url
