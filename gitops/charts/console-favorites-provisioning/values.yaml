# rbac.enabled / externalSecret.enabled / scriptConfigMap.enabled render
# the -d0 half (everything the CronJob needs before it can run);
# cronJob.enabled renders the CronJob itself (-d1). All default false so
# `helm template` with no overrides renders nothing.
rbac:
  enabled: false
externalSecret:
  enabled: false
scriptConfigMap:
  enabled: false
cronJob:
  enabled: false

namespace: zuno-ai-run
serviceAccountName: console-favorites-provisioner

image: "docker.io/library/python:3.12-slim"

# Conservative start (ADR-0320's Operational considerations: "start
# conservative, e.g. every 5-10 minutes, adjust based on observed
# Keycloak Admin API load").
schedule: "*/10 * * * *"

# Literal placeholder domain - gitops/apps/console-favorites-provisioning/
# application-d1.yaml's inline values carry the literal string
# "apps.mycluster.example.com", text-replaced by
# ansible/tasks/apply_gitops_app.yml with the real discovered domain
# before applying (same mechanism gitops/apps/keycloak/application-d1.yaml
# and gitops/apps/openshift-oauth/application-d1.yaml already use).
keycloak:
  url: "https://keycloak.apps.mycluster.example.com"
  realm: zuno
