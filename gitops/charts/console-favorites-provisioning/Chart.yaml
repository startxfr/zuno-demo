apiVersion: v2
name: console-favorites-provisioning
description: >-
  ADR-0320: pre-provisions OpenShift User objects and seeds OpenShift
  Console favorites for the four platform/cluster-operator Keycloak
  groups (admin, zuno-admin, aidev, aiops), via a periodic CronJob - this
  repository's first CronJob (every existing Job here is one-shot).
  Console favorites require a User's metadata.uid ahead of their first
  login, which requires pre-creating the User; a new Keycloak user can
  appear at any time, not only at deployment, so this genuinely needs an
  active reconciliation loop, unlike the static RBAC bindings in
  gitops/charts/openshift-rbac-groups.
type: application
version: 0.1.0
appVersion: "0.1.0"
