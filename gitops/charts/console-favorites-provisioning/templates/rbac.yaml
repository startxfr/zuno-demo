{{- if .Values.rbac.enabled }}
# Least-privilege (ADR-0320's Security considerations: "not cluster-admin
# - the provisioner itself stays least-privilege even though the admin
# group it provisions for is not"). Two scopes:
#   - cluster-scoped: create/get/patch on the User object it pre-creates,
#     get/list on namespaces (to resolve zuno.io/managed=true);
#   - namespace-scoped, openshift-console-user-settings only:
#     create/get/patch on configmaps/roles/rolebindings (the favorites
#     ConfigMap plus the Role/RoleBinding scoping it to its owning user).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: console-favorites-provisioner
  labels:
    zuno.io/managed-by: argocd
rules:
  - apiGroups: ["user.openshift.io"]
    resources: ["users"]
    verbs: ["create", "get", "patch", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-favorites-provisioner
  labels:
    zuno.io/managed-by: argocd
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccountName }}
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: console-favorites-provisioner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: console-favorites-provisioner
  namespace: openshift-console-user-settings
  labels:
    zuno.io/managed-by: argocd
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "patch", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "patch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: console-favorites-provisioner
  namespace: openshift-console-user-settings
  labels:
    zuno.io/managed-by: argocd
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccountName }}
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: console-favorites-provisioner
  apiGroup: rbac.authorization.k8s.io
{{- end }}
