{{- if .Values.externalSecret.enabled }}
# Same Vault path gitops/charts/keycloak's own externalsecret-console-
# favorites-provisioner.yaml reads, synced into this CronJob's own
# namespace instead (ExternalSecret can't cross namespaces).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: console-favorites-provisioner-client-secret
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: console-favorites-provisioner-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: keycloak/console-favorites-provisioner
        property: client_secret
{{- end }}
