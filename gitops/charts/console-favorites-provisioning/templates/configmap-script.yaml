{{- if .Values.scriptConfigMap.enabled }}
# GitOps-owned (unlike ansible/roles/agents/kustomize/acceptance-gate-
# scripts, which is Ansible/kustomize-generated for a one-shot Job) - this
# CronJob is a persistent, ArgoCD-reconciled component, so its script
# lives as a checked-in chart file rendered directly into a ConfigMap by
# Helm, the same lifecycle as every other GitOps-managed resource here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: console-favorites-provisioning-script
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
data:
  reconciler.py: |
{{ .Files.Get "files/reconciler.py" | indent 4 }}
  requirements.txt: |
{{ .Files.Get "files/requirements.txt" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: console-favorites-templates
  namespace: {{ .Values.namespace }}
  labels:
    zuno.io/managed-by: argocd
data:
  favorites-template-admin.json: |
{{ .Files.Get "files/favorites-template-admin.json" | indent 4 }}
  favorites-template-zuno-admin.json: |
{{ .Files.Get "files/favorites-template-zuno-admin.json" | indent 4 }}
  favorites-template-aidev.json: |
{{ .Files.Get "files/favorites-template-aidev.json" | indent 4 }}
  favorites-template-aiops.json: |
{{ .Files.Get "files/favorites-template-aiops.json" | indent 4 }}
{{- end }}
