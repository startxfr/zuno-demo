---
# RoleBindings, namespace-scoped - the zuno-admin ones need
# gitops/charts/namespaces' zuno.io/managed=true namespaces to already
# exist and be labeled, which is why this role runs after "namespaces" in
# ansible/playbooks/day0_install.yml. zunoManagedNamespaces is populated
# by ansible/roles/openshift_rbac_groups/tasks/install.yml at apply time,
# not hand-set here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-openshift-rbac-groups-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-178"
spec:
  project: zuno-platform
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/openshift-rbac-groups
    helm:
      releaseName: zuno-openshift-rbac-groups-d1
      values: |
        roleBindings:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
    # ADR-0602 clause 5 / WP-224: was openshift-gitops; only zuno-bootstrap may
    # write there. Every namespaced object this renders names its namespace.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
