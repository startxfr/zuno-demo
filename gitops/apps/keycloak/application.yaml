---
# Zuno identity platform. This deploys the local chart (gitops/charts/keycloak)
# holding the Keycloak CR instance, the Google IdP broker configuration and
# the `zuno` realm (KeycloakRealmImport) - NOT the operator itself. The
# Keycloak Operator (Red Hat build of Keycloak) is installed imperatively as
# an OLM Subscription by ansible/roles/keycloak's prepare.yml, following the
# same operator-then-instance split as argocd/external_secrets/vault. See
# gitops/apps/README.md and ansible/roles/keycloak/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-keycloak
  namespace: openshift-gitops
  annotations:
    # Sync order within the root App-of-Apps (gitops/root-app-of-apps.yaml)
    # only - Ansible applies each Application directly and ignores this.
    argocd.argoproj.io/sync-wave: "-168"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/keycloak
    helm:
      values: |
        namespace: zuno-auth
        keycloakCRName: zuno
        # apps.mycluster.example.com is substituted by
        # ansible/tasks/apply_gitops_app.yml with the real cluster's apps
        # wildcard domain, auto-discovered from
        # Ingress.config.openshift.io/cluster and persisted to Vault at
        # secret/zuno/platform/cluster-domain (see
        # ansible/tasks/resolve_cluster_base_domain.yml and
        # ansible/roles/vault/tasks/configure.yml) - no manual edit needed.
        # Every per-agent client redirect URI in the imported realm is
        # templated against this same value.
        clusterBaseDomain: apps.mycluster.example.com
        adminSecretName: keycloak-admin
        googleOAuthSecretName: google-oauth-client
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-auth
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
