---
# Keycloak CR instance, Google IdP broker config, and the `zuno` realm
# import (not the operator itself, see application-d0.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-keycloak-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-167"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/keycloak
    helm:
      releaseName: zuno-keycloak-d1
      values: |
        namespace: zuno-auth
        keycloak:
          enabled: true
        keycloakCRName: zuno
        # Placeholder auto-substituted with the real cluster domain by
        # ansible/tasks/apply_gitops_app.yml; also used by every per-agent redirect URI in the realm.
        clusterBaseDomain: apps.mycluster.example.com
        adminSecretName: keycloak-admin
        googleOAuthSecretName: google-oauth-client
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-auth
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
