---
# No Day0 (operator/cluster-scoped) content for agent-runtime - see
# gitops/charts/noop/README.md and gitops/apps/README.md's -d0/-d1
# convention.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-agent-runtime-d0
  namespace: openshift-gitops
  annotations:
    # Sync order within the root App-of-Apps (gitops/root-app-of-apps.yaml)
    # only - Ansible applies each Application directly and ignores this.
    argocd.argoproj.io/sync-wave: "-112"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/noop
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
