---
# Shared Agent Runtime (LangGraph orchestration), applied by the `llm` role
# alongside provider-routing config since both belong to the AI/model layer.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-agent-runtime-d1
  namespace: openshift-gitops
  annotations:
    # Sync-wave only matters for the root App-of-Apps path; Ansible ignores it.
    argocd.argoproj.io/sync-wave: "-111"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/agent-runtime
    helm:
      releaseName: zuno-agent-runtime-d1
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
