---
# Arkos's frontend + BFF (ADR-0326/WP-31, second real agent; ADR-0327/
# ADR-0308/WP-38 migrated it to CR-managed - see gitops/charts/arkos/
# templates/aiagent.yaml). Depends on the arkos-frontend confidential
# OIDC client from keycloak, same as gitops/apps/api's own Tekos
# Application, AND on gitops/apps/aiagent-operator/application-d1.yaml
# (sync-wave -106, earlier than this Application's own -103) having
# already reconciled the AIAgent CRD + operator manager - this chart's
# only resource is a CR the operator must exist to act on.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-arkos-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-103"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/arkos
    helm:
      releaseName: zuno-arkos-d1
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
