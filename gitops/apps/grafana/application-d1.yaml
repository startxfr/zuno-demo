---
# Grafana instance (not the operator, see application-d0.yaml): the Grafana
# CR, its oauth-proxy fronting Route/ServiceAccount, the Prometheus/Tempo
# GrafanaDatasources and the "Model consumption" GrafanaDashboard.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-grafana-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-157"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/grafana
    helm:
      releaseName: zuno-grafana-d1
      values: |
        grafana:
          enabled: true
        # ADR-0517 B2 (WP-118 step 1): substitution token, rewritten to the
        # live cluster's apps wildcard domain by
        # ansible/tasks/apply_gitops_app.yml. The chart default is the same
        # token, so a missing substitution fails visibly rather than
        # silently deploying another cluster's hostname.
        appsDomain: apps.mycluster.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-monitoring
  ignoreDifferences:
    # Ignore the four paths that are actually defaulted, NOT all of /spec.
    #
    # This used to be `jsonPointers: [/spec]` on the belief that "the operator
    # defaults nearly every leaf under spec". A live diff of the rendered CR
    # against the cluster one (2026-09-03) shows it defaults exactly four
    # things - three of them plain Kubernetes API defaulting, one the operator
    # resolving the image tag to a digest. Everything else matched.
    #
    # Ignoring the whole subtree cost a real outage of reconciliation: WP-118
    # step 3b replaced the hardcoded storageClassName with the placeholder
    # `mycluster-default-storageclass`, ansible correctly substituted the real
    # class into this Application's values - and ArgoCD then never pushed it,
    # because /spec was ignored. The CR kept the placeholder, the PVC was
    # already bound to gp3-csi, storageClassName is immutable, and the operator
    # wedged at stage `pvc` reporting Degraded while ArgoCD reported Synced.
    # No Grafana change applied at all for as long as that lasted.
    #
    # jqPathExpressions, not jsonPointers: three of the four sit inside arrays,
    # and a jsonPointer would have to hardcode an index that shifts whenever a
    # port or container is added.
    #
    # If a future operator version defaults something new, ArgoCD will report
    # OutOfSync and self-heal in a loop - add that path here rather than
    # widening back to /spec, which only hides the next real drift too.
    - group: grafana.integreatly.org
      kind: Grafana
      jqPathExpressions:
        # operator-resolved image digest
        - .spec.version
        # Kubernetes API defaults
        - .spec.route.spec.to.weight
        - .spec.service.spec.ports[].protocol
        - .spec.deployment.spec.template.spec.containers[].ports[].protocol
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
