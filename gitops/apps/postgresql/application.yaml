# Demo-grade PostgreSQL: single CloudNativePG instance, no HA/replica
# topology (ADR-0101 tracks HA for shared platform services in v1). The
# CloudNativePG operator itself is installed imperatively via OLM
# (ansible/roles/postgresql/tasks/prepare.yml) - this Application only
# manages the Cluster CR and its credentials ExternalSecret, rendered from
# the local chart at gitops/charts/postgresql.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/postgresql
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
