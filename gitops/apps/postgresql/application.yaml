# Demo-grade PostgreSQL: single Crunchy Postgres Operator (PGO) instance,
# no HA/replica topology (ADR-0101 tracks HA for shared platform services
# in v1). PGO itself is installed imperatively via OLM
# (ansible/roles/postgresql/tasks/prepare.yml) - this Application only
# manages the PostgresCluster CR and its credentials ExternalSecret,
# rendered from the local chart at gitops/charts/postgresql.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-postgresql
  namespace: openshift-gitops
  annotations:
    # Sync order within the root App-of-Apps (gitops/root-app-of-apps.yaml)
    # only - Ansible applies each Application directly and ignores this.
    argocd.argoproj.io/sync-wave: "-176"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/postgresql
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
