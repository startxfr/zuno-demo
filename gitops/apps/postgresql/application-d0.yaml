---
# Crunchy Postgres Operator (PGO) install; the PostgresCluster
# CR/ExternalSecret/ConfigMap operand is a separate Application
# (application-d1.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-postgresql-d0
  namespace: openshift-gitops
  annotations:
    # Sync-wave only matters for the root App-of-Apps path; Ansible ignores it.
    argocd.argoproj.io/sync-wave: "-176"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/postgresql
    helm:
      releaseName: zuno-postgresql-d0
      values: |
        operator:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
