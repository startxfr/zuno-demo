---
# Demo-grade PostgreSQL: single instance, no HA/replica topology. Manages the
# PostgresCluster CR and credentials (not the operator, see
# application-d0.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-postgresql-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-175"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/postgresql
    helm:
      releaseName: zuno-postgresql-d1
      values: |
        postgresCluster:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
