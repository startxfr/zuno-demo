---
# LeaderWorkerSet operator install (ADR-0317). No singleton operand CR - see
# application-d1.yaml. Dedicated OwnNamespace-scoped namespace
# (openshift-lws-operator), not the originally shared openshift-operators -
# leader-worker-set's CSV only supports OwnNamespace, not AllNamespaces.
# This is the *opposite* install-mode problem from connectivity-link
# (AllNamespaces-only); see gitops/charts/lws/values.yaml for detail.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-lws-d0
  namespace: openshift-gitops
  annotations:
    # Sync-wave only matters for the root App-of-Apps path; Ansible orders this
    # ahead of `openshift_ai` in day0_install.yml instead.
    argocd.argoproj.io/sync-wave: "-195"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/lws
    helm:
      releaseName: zuno-lws-d0
      values: |
        project:
          enabled: true
        operator:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-lws-operator
  ignoreDifferences:
    # OLM rewrites this annotation at runtime; ignored to avoid permanent ArgoCD drift.
    - group: operators.coreos.com
      kind: OperatorGroup
      jsonPointers:
        - /metadata/annotations/olm.providedAPIs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # openshift-lws-operator isn't a pre-existing namespace.
      - CreateNamespace=true
