---
# LeaderWorkerSet operator install (ADR-0317). No singleton operand CR -
# see application-d1.yaml. Dedicated namespace (openshift-lws-operator),
# not the originally shared openshift-operators shape: that put LWS's
# webhook Service selector (`control-plane: controller-manager`, the
# generic kubebuilder convention label) in collision with other
# operators' pods carrying that same generic label there (kuadrant,
# external-secrets, limitador, jobset) - the same collision already found
# and fixed for gitops/charts/kueue (see that chart's values.yaml). A
# dedicated namespace with its own AllNamespaces-mode OperatorGroup
# (operator.operatorGroup.target: "all-ns") removes that collision
# structurally, while keeping the same AllNamespaces install mode
# leader-worker-set was already subscribed under (via OLM's own
# global-operators OperatorGroup in openshift-operators) - not the
# OwnNamespace shape that separately failed for connectivity-link.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-lws-d0
  namespace: openshift-gitops
  annotations:
    # Sync-wave order only matters for the root App-of-Apps path; Ansible
    # orders this ahead of `openshift_ai` in day0_install.yml instead.
    argocd.argoproj.io/sync-wave: "-195"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/lws
    helm:
      releaseName: zuno-lws-d0
      values: |
        project:
          enabled: true
        operator:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-lws-operator
  ignoreDifferences:
    # OLM rewrites this annotation at runtime; without this, ArgoCD sees
    # permanent drift and fights it.
    - group: operators.coreos.com
      kind: OperatorGroup
      jsonPointers:
        - /metadata/annotations/olm.providedAPIs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # openshift-lws-operator isn't a pre-existing namespace.
      - CreateNamespace=true
