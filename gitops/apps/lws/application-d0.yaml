---
# LeaderWorkerSet operator install (ADR-0317). No singleton operand CR -
# see application-d1.yaml. Dedicated namespace (openshift-lws-operator)
# with an OwnNamespace-scoped OperatorGroup, not the originally shared
# openshift-operators namespace (which relies on OLM's own
# AllNamespaces-mode global-operators OperatorGroup there). CONFIRMED
# against a live cluster: leader-worker-set's CSV only supports
# OwnNamespace, not AllNamespaces - subscribing via the shared namespace
# put the CSV into Failed phase (reason UnsupportedOperatorGroup, message
# "AllNamespaces InstallModeType not supported, cannot configure to watch
# all namespaces"), which is what showed as "Red Hat build of Leader
# Worker Set" Failed in Installed Operators. This is the *opposite*
# install-mode problem from connectivity-link (whose CSV only supports
# AllNamespaces, not OwnNamespace) - see
# gitops/charts/lws/values.yaml for the full detail.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-lws-d0
  namespace: openshift-gitops
  annotations:
    # Sync-wave order only matters for the root App-of-Apps path; Ansible
    # orders this ahead of `openshift_ai` in day0_install.yml instead.
    argocd.argoproj.io/sync-wave: "-195"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/lws
    helm:
      releaseName: zuno-lws-d0
      values: |
        project:
          enabled: true
        operator:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-lws-operator
  ignoreDifferences:
    # OLM rewrites this annotation at runtime; without this, ArgoCD sees
    # permanent drift and fights it.
    - group: operators.coreos.com
      kind: OperatorGroup
      jsonPointers:
        - /metadata/annotations/olm.providedAPIs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # openshift-lws-operator isn't a pre-existing namespace.
      - CreateNamespace=true
