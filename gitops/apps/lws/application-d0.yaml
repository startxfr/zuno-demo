---
# LeaderWorkerSet operator install (ADR-0317). No singleton operand CR -
# see application-d1.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-lws-d0
  namespace: openshift-gitops
  annotations:
    # Sync-wave order only matters for the root App-of-Apps path; Ansible
    # orders this ahead of `openshift_ai` in day0_install.yml instead.
    argocd.argoproj.io/sync-wave: "-195"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/lws
    helm:
      releaseName: zuno-lws-d0
      values: |
        operator:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-lws-operator
  ignoreDifferences:
    # OLM rewrites this annotation at runtime; without this, ArgoCD sees
    # permanent drift and fights it.
    - group: operators.coreos.com
      kind: OperatorGroup
      jsonPointers:
        - /metadata/annotations/olm.providedAPIs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Namespace isn't created elsewhere, so CreateNamespace is required here.
      - CreateNamespace=true
