---
# The aap MCP server (ADR-0119 scaffold).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-mcp-aap-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-141"
spec:
  project: zuno-apps
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/mcp-aap
    helm:
      releaseName: zuno-mcp-aap-d1
      values: |
        # Substituted by ansible/tasks/apply_gitops_app.yml (same pattern
        # as gitops/apps/mcp/application-d1.yaml) - feeds the chart's
        # AAP_CONTROLLER_UI_URL (server.py's _job_url).
        clusterBaseDomain: apps.mycluster.example.com
        # WP-225 lot C, rollout step 3 (user's go 2026-11-07): verify the mcp-gateway's per-call assertion
        # (public half of Vault mcp/gateway-call-assertion). Required since 2026-11-09 (user's go): a call without a valid assertion
        # gets 401. The only caller is the mcp-gateway (NetworkPolicy), which signs every call and every schema read.
        callAssertion:
          required: true
          # WP-247: the PUBLIC half of the Vault Transit key mcp-call-assertion (the private half never leaves Vault).
          publicKey: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEA3UJL9yklPJrs7fUan0/ESqoNUfsbxsCKvWAG9aHu2WE=
            -----END PUBLIC KEY-----
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  ignoreDifferences:
    # image.openshift.io/triggers patches this field directly from the
    # ImageStream whenever a fresh Build completes, so ArgoCD must not
    # treat that patch as drift from the Git-declared tag and revert it.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/image
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
