---
# The aap MCP server (ADR-0119 scaffold).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-mcp-aap-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-141"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/mcp-aap
    helm:
      releaseName: zuno-mcp-aap-d1
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  ignoreDifferences:
    # image.openshift.io/triggers patches this field directly from the
    # ImageStream whenever a fresh Build completes, so ArgoCD must not
    # treat that patch as drift from the Git-declared tag and revert it.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/image
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
