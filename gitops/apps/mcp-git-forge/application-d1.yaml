---
# The git-forge MCP server (ADR-0120) - multi-provider GitHub/GitLab
# repository access.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-mcp-git-forge-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-141"
spec:
  project: zuno-apps
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/mcp-git-forge
    helm:
      releaseName: zuno-mcp-git-forge-d1
      values: |
        # WP-225 lot C, rollout step 3 (user's go 2026-11-07): verify the mcp-gateway's per-call assertion
        # (public half of Vault mcp/gateway-call-assertion). Not required yet: a call without an assertion
        # is still served until callAssertion.required is switched on, one server at a time, later.
        # WP-225 lot B (user's go 2026-11-07): the dev and ops groups reach github:startxfr/zuno-demo only; the
        # groups the tool policy lets use git tools (consultant, board, cdp) keep every repository.
        repositoryAllowlist:
          groups:
            ocp-ai-dev: ["github:startxfr/zuno-demo"]
            ocp-ai-ops: ["github:startxfr/zuno-demo"]
            ocp-paas-dev: ["github:startxfr/zuno-demo"]
            ocp-paas-ops: ["github:startxfr/zuno-demo"]
            aap_ops: ["github:startxfr/zuno-demo"]
            consultant: ["*"]
            board: ["*"]
            cdp: ["*"]
            sales: ["*"]
            finance: ["*"]
            adv: ["*"]
            recrut: ["*"]
          scope: all
        callAssertion:
          publicKey: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAlIAapqkGwFneDh3ZM2/thjjJbQa5ZnOq7S4Ro0Ju6FQ=
            -----END PUBLIC KEY-----
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  ignoreDifferences:
    # ADR-0411-style follow-up: image.openshift.io/triggers patches this
    # field directly from the ImageStream whenever a fresh Build
    # completes, so ArgoCD must not treat that patch as drift from the
    # Git-declared tag and revert it (selfHeal below would otherwise
    # fight the image-trigger controller).
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/image
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
