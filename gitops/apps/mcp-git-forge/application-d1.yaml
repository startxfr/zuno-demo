---
# The git-forge MCP server (ADR-0120) - multi-provider GitHub/GitLab
# repository access.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-mcp-git-forge-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-141"
spec:
  project: zuno-apps
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/mcp-git-forge
    helm:
      releaseName: zuno-mcp-git-forge-d1
      values: |
        # WP-225 lot C, rollout step 3 (user's go 2026-11-07): verify the mcp-gateway's per-call assertion
        # (public half of Vault mcp/gateway-call-assertion). Required since 2026-11-09 (user's go): a call without a valid assertion
        # gets 401. The only caller is the mcp-gateway (NetworkPolicy), which signs every call and every schema read.
        # WP-225 lot B (user's go 2026-11-07): the dev and ops groups reach github:startxfr/zuno-demo only.
        # Post-demo item 4 (user decision 2026-11-11): the groups the tool policy lets use git tools (consultant,
        # board, cdp) reach the startxfr repositories only (the token is a fine-grained, public, read-only one, so
        # this narrows reads; writes are refused by GitHub anyway). sales, finance, adv and recrut have no git tool
        # in the tool policy, so they have no entry.
        repositoryAllowlist:
          groups:
            ocp-ai-dev: ["github:startxfr/zuno-demo"]
            ocp-ai-ops: ["github:startxfr/zuno-demo"]
            ocp-paas-dev: ["github:startxfr/zuno-demo"]
            ocp-paas-ops: ["github:startxfr/zuno-demo"]
            aap_ops: ["github:startxfr/zuno-demo"]
            consultant: ["github:startxfr/*"]
            board: ["github:startxfr/*"]
            cdp: ["github:startxfr/*"]
          scope: all
        callAssertion:
          required: true
          # WP-247: the PUBLIC half of the Vault Transit key mcp-call-assertion (the private half never leaves Vault).
          publicKey: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEA3UJL9yklPJrs7fUan0/ESqoNUfsbxsCKvWAG9aHu2WE=
            -----END PUBLIC KEY-----
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  ignoreDifferences:
    # ADR-0411-style follow-up: image.openshift.io/triggers patches this
    # field directly from the ImageStream whenever a fresh Build
    # completes, so ArgoCD must not treat that patch as drift from the
    # Git-declared tag and revert it (selfHeal below would otherwise
    # fight the image-trigger controller).
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/image
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
