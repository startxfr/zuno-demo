---
# Everything the CronJob needs before it can run: ServiceAccount/RBAC,
# the ExternalSecret, and the script/templates ConfigMaps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-console-favorites-provisioning-d0
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/console-favorites-provisioning
    helm:
      releaseName: zuno-console-favorites-provisioning-d0
      values: |
        rbac:
          enabled: true
        externalSecret:
          enabled: true
        scriptConfigMap:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
