---
# OTLP trace/metric collection path (ADR-0029): the shared Collector every
# service in components/ sends OTLP to - see gitops/charts/observability
# (collector.enabled - zuno-telemetry Namespace + OpenTelemetryCollector
# CR). NOT the operator itself (see
# gitops/apps/observability/application-d0.yaml, applied first by
# ansible/roles/observability/tasks/install.yml). No long-term storage
# backend is installed (the Collector's debug/log exporter is enough to
# prove the pipeline for a demo) - see that role's README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-observability-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-205"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/observability
    helm:
      releaseName: zuno-observability-d1
      values: |
        collector:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-telemetry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
