---
# Shared OTLP Collector every service sends traces/metrics to (not the operator,
# see application-d0.yaml). No long-term storage backend; debug/log exporter
# only.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-observability-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-205"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/observability
    helm:
      releaseName: zuno-observability-d1
      values: |
        collector:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-telemetry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
