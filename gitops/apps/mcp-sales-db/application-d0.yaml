---
# Schema fixtures PreSync hook Job + PostgreSQL credentials ExternalSecret,
# applied before the sales-db MCP server itself (application-d1.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-mcp-sales-db-d0
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-144"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/sql-schema
    helm:
      releaseName: zuno-mcp-sales-db-d0
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
