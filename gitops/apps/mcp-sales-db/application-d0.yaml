---
# Day0 (prerequisites) content for mcp-sales-db: the SXA-derived schema +
# fixtures PreSync hook Job and the PostgreSQL credentials ExternalSecret
# it depends on (gitops/charts/sql-schema), applied before the sales-db MCP
# server itself (application-d1.yaml). ADR-0313 - previously an
# ansible-managed Job + kustomize-applied ExternalSecret
# (ansible/roles/sql_schema), not a GitOps Application at all.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-mcp-sales-db-d0
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-144"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/sql-schema
    helm:
      releaseName: zuno-mcp-sales-db-d0
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
