---
# The sales-db MCP server. Applied after -d0's PreSync hook Job has populated
# the schema this server reads from; ArgoCD blocks -d0 Synced until that hook
# succeeds.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-mcp-sales-db-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-143"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/mcp-sales-db
    helm:
      releaseName: zuno-mcp-sales-db-d1
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  ignoreDifferences:
    # ADR-0059: image.openshift.io/triggers patches this field
    # directly from the ImageStream whenever a fresh Build completes, so
    # ArgoCD must not treat that patch as drift from the Git-declared
    # :latest tag and revert it (selfHeal below would otherwise fight the
    # image-trigger controller).
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/image
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
