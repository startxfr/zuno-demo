---
# The sales-db MCP server (ADR-0017) - see gitops/charts/mcp-sales-db and
# components/mcp-servers/sales-db. Applied by the `sql_schema` role's
# configure.yml, after the schema/fixtures Job it runs directly (the schema
# must exist before this server can serve anything from it).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-sales-db
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/mcp-sales-db
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
