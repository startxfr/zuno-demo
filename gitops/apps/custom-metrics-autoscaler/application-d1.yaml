---
# The KEDA operand slice (not the operator, see application-d0.yaml): the
# minimal KedaController CR, plus ADR-0318's operator now finally having
# something to act on.
#
# ADR-0542/WP-121: this Application still renders no ScaledObject, and
# should not - the first one on this cluster is created BY KServe from
# LLMInferenceService.spec.scaling (gitops/charts/models), not authored
# here. It DOES render the ClusterTriggerAuthentication that ScaledObject
# references, because RHOAI's inferenceservice-config names
# `ai-inference-keda-thanos` and then ships no such object; without it the
# KServe-generated ScaledObject sits Ready=False on an empty bearer token
# and KEDA never creates its HPA (live-caught 2026-09-03). Cluster-scoped
# auth for any KEDA consumer is chart-level plumbing, not model-specific,
# which is why it lives here and not in gitops/charts/models.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-custom-metrics-autoscaler-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-192"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/custom-metrics-autoscaler
    helm:
      releaseName: zuno-custom-metrics-autoscaler-d1
      values: |
        kedaController:
          enabled: true
        triggerAuthentication:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
