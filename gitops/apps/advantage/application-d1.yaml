---
# Advantage's frontend + BFF (ADR-0326/WP-35, fourth real agent). Depends on
# the advantage-frontend confidential OIDC client from keycloak, same as
# gitops/apps/comage's own Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-advantage-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-99"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/advantage
    helm:
      releaseName: zuno-advantage-d1
      values: |
        global:
          # Substituted with the real cluster domain by
          # ansible/tasks/apply_gitops_app.yml.
          clusterBaseDomain: apps.mycluster.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  ignoreDifferences:
    # ADR-0411 follow-up: image.openshift.io/triggers patches this field
    # directly from the ImageStream whenever a fresh Build completes, so
    # ArgoCD must not treat that patch as drift from the Git-declared
    # :latest tag and revert it (selfHeal below would otherwise fight the
    # image-trigger controller).
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/image
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
