---
# The cluster OAuth/cluster singleton (config.openshift.io/v1) - depends
# on -d0's Secret existing. Ansible orders this after -d0 in
# ansible/roles/openshift_oauth/tasks/install.yml, same as every other
# d0/d1 pair in this repository.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-openshift-oauth-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-14"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/openshift-oauth
    helm:
      releaseName: zuno-openshift-oauth-d1
      values: |
        oauth:
          enabled: true
          # ADR-0347: created by ansible/roles/openshift_oauth/tasks/install.yml
          # by bundling Secret keycloak-tls's ca.crt (zuno-auth, the Vault PKI
          # root that actually signs the Keycloak route per ADR-0316) with the
          # default ingress router CA, before this Application is applied.
          openidCaConfigMap: keycloak-serving-ca
          # ADR-0346: the startx-* Secrets these reference are managed by the
          # external startx cluster-auth chart already present on the demo
          # cluster - they are prerequisites, not resources of this chart.
          htpasswd:
            enabled: true
          templates:
            enabled: true
          tokenConfig:
            accessTokenMaxAgeSeconds: 86400
        # ADR-0347: cluster-wide complement to oauth.openidCaConfigMap above -
        # trusts the same Vault PKI root via proxy/cluster.spec.trustedCA.
        # ConfigMap created by the same Ansible task as oauth.openidCaConfigMap.
        clusterTrustedCA:
          # Keep this true: it means "the chart owns
          # Proxy/cluster.spec.trustedCA.name", NOT "a private CA is in use".
          # Flipping it to false stops the template rendering and, with
          # Prune=false, strands whatever value is live on the cluster -
          # precisely the 2026-09-03 dangling-reference outage.
          enabled: true
          # Placeholder, like clusterBaseDomain below: overwritten at apply
          # time by ansible/roles/openshift_oauth/tasks/install.yml -
          # user-ca-bundle when this cluster has a private PKI root (Vault
          # pki/, ADR-0316), "" when it does not. "" is the safe value to
          # hold in git: a hand-applied manifest then clears the field rather
          # than pointing it at a ConfigMap that may not exist.
          configMapName: ""
        # Literal placeholder - ansible/tasks/apply_gitops_app.yml replaces
        # this exact string with the real discovered domain before
        # applying (same mechanism gitops/apps/keycloak/application-d1.yaml
        # already uses), NOT a Helm values default.
        clusterBaseDomain: apps.mycluster.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-config
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
