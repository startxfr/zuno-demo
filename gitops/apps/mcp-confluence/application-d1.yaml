---
# The confluence MCP server (ADR-0117) - real Confluence Cloud access,
# replacing the mcp-gateway demo-mode handler.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-mcp-confluence-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-141"
spec:
  project: zuno-apps
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/mcp-confluence
    helm:
      releaseName: zuno-mcp-confluence-d1
      values: |
        # WP-225 lot C, rollout step 3 (user's go 2026-11-07): verify the mcp-gateway's per-call assertion
        # (public half of Vault mcp/gateway-call-assertion). Required since 2026-11-09 (user's go): a call without a valid assertion
        # gets 401. The only caller is the mcp-gateway (NetworkPolicy), which signs every call and every schema read.
        # WP-225 lot B (user's go 2026-11-07): the dev and ops groups reach the SXSI space only. A caller whose
        # groups list no entry is refused once an allowlist is set. Add a group here before it needs Confluence.
        # Post-demo item 4 (user decision 2026-11-11): the groups the tool policy lets use Confluence (consultant,
        # board, cdp, lightspeed_readonly) reach the four internal spaces only (SXSI, SXS, SXSD, SAC). The shared
        # technical identity also sees about twelve customer or project spaces and 26 personal spaces, and it can
        # write; none of them is reachable through Zuno any more. Add a space to a group when a flow needs it.
        # sales, finance, adv and recrut have no Confluence tool in the tool policy, so they have no entry.
        spaceAllowlist:
          groups:
            ocp-ai-dev: ["SXSI"]
            ocp-ai-ops: ["SXSI"]
            ocp-paas-dev: ["SXSI"]
            ocp-paas-ops: ["SXSI"]
            aap_ops: ["SXSI"]
            consultant: ["SXSI", "SXS", "SXSD", "SAC"]
            board: ["SXSI", "SXS", "SXSD", "SAC"]
            cdp: ["SXSI", "SXS", "SXSD", "SAC"]
            lightspeed_readonly: ["SXSI", "SXS", "SXSD", "SAC"]
          scope: all
        callAssertion:
          required: true
          # WP-247: the PUBLIC half of the Vault Transit key mcp-call-assertion (the private half never leaves Vault).
          publicKey: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEA3UJL9yklPJrs7fUan0/ESqoNUfsbxsCKvWAG9aHu2WE=
            -----END PUBLIC KEY-----
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  ignoreDifferences:
    # ADR-0059: image.openshift.io/triggers patches this field
    # directly from the ImageStream whenever a fresh Build completes, so
    # ArgoCD must not treat that patch as drift from the Git-declared
    # :latest tag and revert it (selfHeal below would otherwise fight the
    # image-trigger controller).
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/image
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
