---
# Local model serving (ADR-0019) - see gitops/charts/models. Applied by the
# `models` Ansible role's install.yml, after `openshift_ai` (DataScienceCluster
# with kserve enabled) and `nvidia_gpu` (GPU Operator) have prepared the cluster.
# No operator involved in this chart itself, so all of this component's
# content is -d1 (see gitops/apps/models/application-d0.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-models-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-159"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/models
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
