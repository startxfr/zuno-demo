---
# Local model serving. Applied after `openshift_ai` (kserve) and
# `nvidia_gpu` have prepared the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-models-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-159"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/models
    helm:
      releaseName: zuno-models-d1
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
