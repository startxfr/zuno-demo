---
# Technical mail identity's credential, exposed via ExternalSecret. Vault
# seeds the placeholder empty; an operator must populate it before mail can actually send.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-smtp-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-179"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/smtp
    helm:
      releaseName: zuno-smtp-d1
      values: |
        credentials:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
