---
# Applied by the `smtp` Ansible role's install.yml. namespace.enabled
# stays false (the chart's own default) - zuno-ai-run is owned solely by
# gitops/charts/namespaces (zuno-namespaces-d0), which already runs
# earlier in day0_components; this Application no longer duplicates that
# Namespace (it previously did, idempotently, per gitops/charts/smtp/
# templates/namespace.yaml's own comment - dropped so the resource has a
# single owning Application instead of two). The credentials ExternalSecret
# is a separate Application (zuno-smtp-d1, applied after this one is
# Synced+Healthy) - see application-d1.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-smtp-d0
  namespace: openshift-gitops
  annotations:
    # Sync order within the root App-of-Apps (gitops/root-app-of-apps.yaml)
    # only - Ansible applies each Application directly and ignores this.
    argocd.argoproj.io/sync-wave: "-180"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/smtp
    helm:
      releaseName: zuno-smtp-d0
      values: |
        namespace:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
