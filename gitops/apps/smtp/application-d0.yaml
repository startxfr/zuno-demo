---
# namespace.enabled stays false; zuno-ai-run is owned solely by
# gitops/charts/namespaces, to avoid two Applications tracking the same
# Namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-smtp-d0
  namespace: openshift-gitops
  annotations:
    # Sync-wave only matters for the root App-of-Apps path; Ansible ignores it.
    argocd.argoproj.io/sync-wave: "-180"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/smtp
    helm:
      releaseName: zuno-smtp-d0
      values: |
        namespace:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
