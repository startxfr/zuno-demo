---
# The technical mail identity's Namespace (ADR-0056) - see
# gitops/charts/smtp (namespace.enabled). Applied by the `smtp` Ansible
# role's install.yml. The credentials ExternalSecret is a separate
# Application (zuno-smtp-d1, applied after this one is Synced+Healthy) -
# see application-d1.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-smtp-d0
  namespace: openshift-gitops
  annotations:
    # Sync order within the root App-of-Apps (gitops/root-app-of-apps.yaml)
    # only - Ansible applies each Application directly and ignores this.
    argocd.argoproj.io/sync-wave: "-180"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/smtp
    helm:
      values: |
        namespace:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
