---
# JobSet operator install (ADR-0318). No singleton operand CR - see
# application-d1.yaml. Dedicated namespace (openshift-jobset-operator)
# with an OwnNamespace-scoped OperatorGroup, not the originally shared
# openshift-operators namespace (which relies on OLM's own
# AllNamespaces-mode global-operators OperatorGroup there). CONFIRMED
# against a live cluster: job-set's CSV only supports
# OwnNamespace/SingleNamespace, not AllNamespaces - subscribing via the
# shared namespace put the CSV into Failed phase (reason
# UnsupportedOperatorGroup, message "AllNamespaces InstallModeType not
# supported, cannot configure to watch all namespaces"), which is what
# showed as "Job Set Operator" Failed in Installed Operators. See
# gitops/charts/jobset/values.yaml for the full detail.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-jobset-d0
  namespace: openshift-gitops
  annotations:
    # Sync-wave order only matters for the root App-of-Apps path; Ansible
    # orders this ahead of `openshift_ai` in day0_install.yml instead.
    argocd.argoproj.io/sync-wave: "-191"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/jobset
    helm:
      releaseName: zuno-jobset-d0
      values: |
        project:
          enabled: true
        operator:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-jobset-operator
  ignoreDifferences:
    # OLM rewrites this annotation at runtime; without this, ArgoCD sees
    # permanent drift and fights it.
    - group: operators.coreos.com
      kind: OperatorGroup
      jsonPointers:
        - /metadata/annotations/olm.providedAPIs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # openshift-jobset-operator isn't a pre-existing namespace.
      - CreateNamespace=true
