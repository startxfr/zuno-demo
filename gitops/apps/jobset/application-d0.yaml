---
# JobSet operator install (ADR-0318); the JobSetOperator operand CR is a
# separate Application (application-d1.yaml) applied after this one is healthy.
# Dedicated OwnNamespace-scoped namespace (openshift-jobset-operator), not the
# originally shared openshift-operators - job-set's CSV only supports
# OwnNamespace/SingleNamespace, not AllNamespaces; see
# gitops/charts/jobset/values.yaml for detail.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-jobset-d0
  namespace: openshift-gitops
  annotations:
    # Sync-wave only matters for the root App-of-Apps path; Ansible orders this
    # ahead of `openshift_ai` in day0_install.yml instead.
    argocd.argoproj.io/sync-wave: "-191"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/jobset
    helm:
      releaseName: zuno-jobset-d0
      values: |
        project:
          enabled: true
        operator:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-jobset-operator
  ignoreDifferences:
    # OLM rewrites this annotation at runtime; ignored to avoid permanent ArgoCD drift.
    - group: operators.coreos.com
      kind: OperatorGroup
      jsonPointers:
        - /metadata/annotations/olm.providedAPIs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # openshift-jobset-operator isn't a pre-existing namespace.
      - CreateNamespace=true
