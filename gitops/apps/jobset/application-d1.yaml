---
# Minimal JobSetOperator operand CR (not the operator, see
# application-d0.yaml). Cluster-scoped singleton named "cluster"
# (managementState: Managed) - not a JobSet workload; individual
# distributed training runs create their own jobset.x-k8s.io JobSet
# objects later, out of scope here. See gitops/charts/jobset/values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-jobset-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-190"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/jobset
    helm:
      releaseName: zuno-jobset-d1
      values: |
        jobsetOperator:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-jobset-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
