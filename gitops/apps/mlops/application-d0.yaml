---
# No OLM operator of its own - the DataSciencePipelinesApplication/Pipeline
# CRDs this chart uses come from openshift_ai's aipipelines component, same
# pattern as the retired rag-ingestion application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-mlops-d0
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-132"
spec:
  project: zuno-apps
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/noop
    helm:
      releaseName: zuno-mlops-d0
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-mlops
    # ADR-0602 clause 5 / WP-224: was openshift-gitops; only zuno-bootstrap may
    # write there. Every namespaced object this renders names its namespace.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
