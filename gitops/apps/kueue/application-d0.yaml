---
# Red Hat build of Kueue Operator install (ADR-0321). Dedicated namespace
# (openshift-kueue-operator) with its own AllNamespaces-mode OperatorGroup,
# unlike gitops/charts/jobset/lws which share openshift-operators: sharing it
# here put Kueue's webhook Service selector in collision with other operators'
# pods carrying the same generic label, causing intermittent admission failures
# (confirmed live; see gitops/charts/kueue/values.yaml for the full incident
# detail).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-kueue-d0
  namespace: openshift-gitops
  annotations:
    # Sync-wave only matters for the root App-of-Apps path; Ansible orders this
    # ahead of `openshift_ai` in day0_install.yml instead.
    argocd.argoproj.io/sync-wave: "-189"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/kueue
    helm:
      releaseName: zuno-kueue-d0
      values: |
        project:
          enabled: true
        operator:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-kueue-operator
  ignoreDifferences:
    # OLM rewrites this annotation at runtime; ignored to avoid permanent ArgoCD drift.
    - group: operators.coreos.com
      kind: OperatorGroup
      jsonPointers:
        - /metadata/annotations/olm.providedAPIs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # openshift-kueue-operator isn't a pre-existing namespace.
      - CreateNamespace=true
