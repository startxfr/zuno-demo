---
# cert-manager operator install; the Vault-backed ClusterIssuer operand is a
# separate Application (application-d1.yaml) applied after this one is healthy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-cert-manager-d0
  namespace: openshift-gitops
  annotations:
    # Sync-wave only matters for the root App-of-Apps path; Ansible ignores it.
    argocd.argoproj.io/sync-wave: "-195"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/cert-manager
    helm:
      releaseName: zuno-cert-manager-d0
      values: |
        cluster-certmanager:
          project:
            enabled: true
          operator:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager-operator
  ignoreDifferences:
    # OLM rewrites this annotation at runtime; ignored to avoid permanent ArgoCD drift.
    - group: operators.coreos.com
      kind: OperatorGroup
      jsonPointers:
        - /metadata/annotations/olm.providedAPIs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true # namespace isn't created elsewhere
