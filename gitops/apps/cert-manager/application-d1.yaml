---
# Vault-backed ClusterIssuer (not the operator itself, see application-d0.yaml).
# Consumed by keycloak's Ingress and connectivity-link's Certificate.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-cert-manager-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-194"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/cert-manager
    helm:
      releaseName: zuno-cert-manager-d1
      values: |
        certmanager:
          enabled: true
        issuer:
          enabled: true
        # Required by the vault-issuer template (issuer.enabled AND
        # vaultServiceName) - dropped by mistake once already in an
        # ADR-0211 edit, which let a pruning sync delete the vault-issuer
        # ClusterIssuer; every internal certificate (Keycloak TLS,
        # istio-csr chain) renews through it.
        vaultServiceName: zuno-vault
        # ADR-0211's rollout state does NOT live here (WP-132 step 3,
        # ADR-0517 B11). It used to: this file carried `enabled: true`,
        # `certificatesIssuer: letsencrypt-route53` and both consumer
        # flips `true` - demo222's end state, committed to git and
        # inherited by every other cluster on its first sync. The comment
        # that stood here still described the intended design ("ships
        # disabled - the operator flips enabled: true here") while the
        # code below it said otherwise.
        #
        # That combination is destructive on a fresh cluster:
        # acme-cluster-patches.yaml points IngressController/default at
        # router-wildcard-tls and adds an APIServer named certificate for
        # api-server-tls, neither of which can exist before a Certificate
        # has issued - so Console and route serving break before ACME
        # could ever succeed.
        #
        # The four values are now operator variables resolved in
        # ansible/roles/cert_manager/tasks/install.yml, defaulting to
        # gitops/charts/cert-manager/values.yaml - which already ships the
        # safe start of the rollout (acme off, staging issuer, consumers
        # off). Set zuno_certmanager_acme_enabled, _issuer,
        # _router_default_cert and _api_server_named_cert in
        # ansible/confidential.yml to walk the staged rollout that chart's
        # acme comment documents: staging rehearsal -> production issuer
        # -> consumer flips.
        acme:
          # Substituted with the real cluster domain by
          # ansible/tasks/apply_gitops_app.yml.
          clusterBaseDomain: apps.mycluster.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
