---
# Vault-backed ClusterIssuer (not the operator itself, see application-d0.yaml).
# Consumed by keycloak's Ingress and connectivity-link's Certificate.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-cert-manager-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-194"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/cert-manager
    helm:
      releaseName: zuno-cert-manager-d1
      values: |
        certmanager:
          enabled: true
        issuer:
          enabled: true
        # Required by the vault-issuer template (issuer.enabled AND
        # vaultServiceName) - dropped by mistake in the ADR-0211 edit,
        # which let a pruning sync delete the vault-issuer ClusterIssuer
        # live (2026-08-16); every internal certificate (Keycloak TLS,
        # istio-csr chain) renews through it.
        vaultServiceName: zuno-vault
        # ADR-0211: ships disabled - the operator flips `enabled: true`
        # here (a normal reviewed Git change) once the aws/route53-dns01
        # Vault seed exists, then follows the staged rollout documented
        # in gitops/charts/cert-manager/values.yaml's acme comment
        # (staging rehearsal -> production issuer -> consumer flags).
        acme:
          enabled: true
          # Substituted with the real cluster domain by
          # ansible/tasks/apply_gitops_app.yml.
          clusterBaseDomain: apps.mycluster.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
