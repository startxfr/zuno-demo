---
# Vault-backed ClusterIssuer (not the operator itself, see application-d0.yaml).
# Consumed by keycloak's Ingress and connectivity-link's Certificate.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-cert-manager-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-194"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/cert-manager
    helm:
      releaseName: zuno-cert-manager-d1
      values: |
        certmanager:
          enabled: true
        issuer:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
