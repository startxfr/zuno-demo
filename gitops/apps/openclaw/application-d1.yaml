---
# ADR-0589/0590 (WP-183): per persona, the secrets from Vault, the oauth2-proxy
# front door (its Route claims the Control UI host before the operator's) and the
# Claw. Needs zuno-openclaw-d0's operators running.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-openclaw-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-57"
spec:
  project: zuno-apps
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/openclaw
    helm:
      releaseName: zuno-openclaw-d1
      values: |
        clusterBaseDomain: apps.mycluster.example.com
        assistants:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
    # ADR-0602 clause 5 / WP-224: was openshift-gitops; only zuno-bootstrap may
    # write there. Every namespaced object this renders names its namespace.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
