---
# NVIDIA GPU Operator install. The ClusterPolicy operand (application-d1.yaml)
# is applied twice: once after this is healthy, once more with the spec
# discovered from the installed CSV.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-nvidia-gpu-d0
  namespace: openshift-gitops
  annotations:
    # Sync-wave order only matters for the root App-of-Apps path; Ansible
    # orders `nfd` before `nvidia_gpu` in day0_install.yml instead.
    argocd.argoproj.io/sync-wave: "-203"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/nvidia-gpu
    helm:
      releaseName: zuno-nvidia-gpu-d0
      values: |
        cluster-gpu:
          project:
            enabled: true
          operator:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: nvidia-gpu-operator
  ignoreDifferences:
    # OLM rewrites this annotation at runtime; without this, ArgoCD sees
    # permanent drift and fights it.
    - group: operators.coreos.com
      kind: OperatorGroup
      jsonPointers:
        - /metadata/annotations/olm.providedAPIs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Namespace isn't created elsewhere, so CreateNamespace is required here.
      - CreateNamespace=true
