---
# NVIDIA GPU Operator ClusterPolicy operand (ADR-0312). See
# gitops/charts/nvidia-gpu (cluster-gpu.gpu.enabled) - NOT the operator
# itself (see gitops/apps/nvidia-gpu/application-d0.yaml, applied first).
# gpu.enabled stays false here (unlike this repo's former local template,
# cluster-gpu's own ClusterPolicy.yaml renders an (invalid, CRD-rejected)
# empty `spec: {}` as soon as gpu.enabled is true, regardless of whether
# gpu.spec was supplied - it doesn't gate on spec truthiness) until
# ansible/roles/nvidia_gpu/tasks/install.yml's second apply against this
# Application flips gpu.enabled to true together with the installed CSV's
# own recommended spec, via gitops_app_extra_helm_values (ADR-0048).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-nvidia-gpu-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-202"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/nvidia-gpu
    helm:
      releaseName: zuno-nvidia-gpu-d1
      values: |
        cluster-gpu:
          gpu:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: nvidia-gpu-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
