---
# ClusterPolicy operand (not the operator, see application-d0.yaml). gpu.enabled
# stays false until Ansible's second apply flips it true with the CSV's spec; the chart renders an invalid empty spec otherwise.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-nvidia-gpu-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-202"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/nvidia-gpu
    helm:
      releaseName: zuno-nvidia-gpu-d1
      values: |
        cluster-gpu:
          gpu:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: nvidia-gpu-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
