---
# The salesforce MCP server (ADR-0326/WP-33) - live Salesforce Opportunity
# access for Comage.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-mcp-salesforce-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-139"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/mcp-salesforce
    helm:
      releaseName: zuno-mcp-salesforce-d1
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
