---
# Platform Namespace objects only - ResourceQuota/NetworkPolicy is the Day 1
# overlay (application-d1.yaml, same chart, policy.enabled instead of
# namespace.enabled), applied later by `make day1 install namespaces` so a
# bare Day 0 install creates namespaces without yet layering on policy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-namespaces-d0
  namespace: openshift-gitops
  annotations:
    # Sync-wave order only matters for the root App-of-Apps path; Ansible
    # ignores it.
    argocd.argoproj.io/sync-wave: "-200"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/namespaces
    helm:
      releaseName: zuno-namespaces-d0
      values: |
        namespace:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
