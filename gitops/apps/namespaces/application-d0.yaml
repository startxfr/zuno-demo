---
# Platform namespace/quota scaffolding. Namespace objects are cluster-scoped,
# so this component's content is entirely -d0 (application-d1.yaml is a no-op).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-namespaces-d0
  namespace: openshift-gitops
  annotations:
    # Sync-wave order only matters for the root App-of-Apps path; Ansible ignores it.
    argocd.argoproj.io/sync-wave: "-200"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/namespaces
    helm:
      releaseName: zuno-namespaces-d0
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
