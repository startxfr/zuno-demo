---
# ResourceQuota + default-deny NetworkPolicy baseline for the namespaces
# application-d0.yaml already created. Applied by `make day1 install
# namespaces` (first component in day1_install.yml), not bundled into Day 0.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-namespaces-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-199"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/namespaces
    helm:
      releaseName: zuno-namespaces-d1
      values: |
        policy:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
