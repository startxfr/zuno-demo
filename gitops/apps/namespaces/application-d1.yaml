---
# ResourceQuota + default-deny NetworkPolicy baseline for the namespaces
# application-d0.yaml already created. Applied by `make day1 install
# namespaces` (first component in day1_install.yml), not bundled into Day 0.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-namespaces-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-199"
spec:
  project: zuno-platform
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/namespaces
    helm:
      releaseName: zuno-namespaces-d1
      values: |
        policy:
          enabled: true
        # ADR-0602 / WP-224: the zuno-ai-run EgressFirewall allows the cluster's
        # own Routes (Keycloak, UnifAI) by name; Ansible replaces the placeholder.
        clusterBaseDomain: apps.mycluster.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
    # ADR-0602 clause 5 / WP-224: was openshift-gitops; only zuno-bootstrap may
    # write there. Every namespaced object this renders names its namespace.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
