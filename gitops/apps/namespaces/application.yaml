---
# Local model serving (ADR-0019) - see gitops/charts/models. Applied by the
# `models` Ansible role's configure.yml, after `openshift_ai` (DataScienceCluster
# with kserve enabled) and `nvidia_gpu` (GPU Operator) have prepared the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-namespaces
  namespace: openshift-gitops
  annotations:
    # Sync order within the root App-of-Apps (gitops/root-app-of-apps.yaml)
    # only - Ansible applies each Application directly and ignores this.
    argocd.argoproj.io/sync-wave: "-200"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
