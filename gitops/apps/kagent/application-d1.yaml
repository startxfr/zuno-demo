# ADR-0600 (WP-207): kagent in zuno-kagent (namespace, experience-client label and baseline from
# gitops/charts/namespaces). The role (ansible/roles/kagent) passes the cluster values: global.zuno, the
# egress networks and the control-plane addresses behind kubernetes.default.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-kagent-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-57"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/kagent
    helm:
      releaseName: zuno-kagent-d1
      values: |
        global:
          zuno:
            clusterBaseDomain: apps.mycluster.example.com
            routeHost: kagent.apps.mycluster.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-kagent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
