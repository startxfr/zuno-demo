---
# Demo-scale TempoMonolithic instance (not the operator, see
# application-d0.yaml). Stores traces exported by gitops/charts/observability's
# Collector.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-tempo-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-165"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/tempo
    helm:
      releaseName: zuno-tempo-d1
      values: |
        tempo:
          enabled: true
        # ADR-0517 B2 (WP-118 step 1): substitution token, rewritten to the
        # live cluster's apps wildcard domain by
        # ansible/tasks/apply_gitops_app.yml. The chart default is the same
        # token, so a missing substitution fails visibly rather than
        # silently deploying another cluster's hostname.
        appsDomain: apps.mycluster.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
