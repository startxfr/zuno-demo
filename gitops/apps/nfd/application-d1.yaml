---
# Node Feature Discovery instance CR (not the operator itself, see application-d0.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-nfd-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-203"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/nfd
    helm:
      releaseName: zuno-nfd-d1
      values: |
        cluster-nfd:
          nfd:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-nfd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
