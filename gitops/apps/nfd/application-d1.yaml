---
# Node Feature Discovery instance CR (ADR-0047, ADR-0312). See
# gitops/charts/nfd (cluster-nfd.nfd.enabled) - NOT the operator itself
# (see gitops/apps/nfd/application-d0.yaml, applied first by
# ansible/roles/nfd/tasks/install.yml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-nfd-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-203"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/nfd
    helm:
      releaseName: zuno-nfd-d1
      values: |
        cluster-nfd:
          nfd:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-nfd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
