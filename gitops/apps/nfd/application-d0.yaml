---
# Node Feature Discovery operator install; must sync before nvidia_gpu.
# The NodeFeatureDiscovery CR operand is a separate Application (application-d1.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-nfd-d0
  namespace: openshift-gitops
  annotations:
    # Sync-wave order only matters for the root App-of-Apps path; Ansible
    # orders `nfd` before `nvidia_gpu` in day0_install.yml instead.
    argocd.argoproj.io/sync-wave: "-204"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/nfd
    helm:
      releaseName: zuno-nfd-d0
      values: |
        cluster-nfd:
          project:
            enabled: true
          operator:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-nfd
  ignoreDifferences:
    # OLM rewrites this annotation at runtime; without this, ArgoCD sees permanent drift and fights it.
    - group: operators.coreos.com
      kind: OperatorGroup
      jsonPointers:
        - /metadata/annotations/olm.providedAPIs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Namespace isn't created elsewhere, so CreateNamespace is required here.
      - CreateNamespace=true
