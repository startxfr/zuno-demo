---
# AI Inference Gateway. Applied before agent-runtime, which only needs
# this gateway's URL, not the routing config or provider secrets directly.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-ai-gateway-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-119"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/ai-gateway
    helm:
      releaseName: zuno-ai-gateway-d1
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
