---
# No Day0 content for ai-gateway; see gitops/apps/README.md's -d0/-d1
# convention.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-ai-gateway-d0
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-120"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/noop
    helm:
      releaseName: zuno-ai-gateway-d0
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
