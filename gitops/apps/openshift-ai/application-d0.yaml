---
# Red Hat OpenShift AI operator install; the DataScienceCluster operand is a
# separate Application (application-d1.yaml) applied after this one is healthy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-openshift-ai-d0
  namespace: openshift-gitops
  annotations:
    # Sync-wave only matters for the root App-of-Apps path; Ansible applies this
    # after `namespaces` instead.
    argocd.argoproj.io/sync-wave: "-199"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/openshift-ai
    helm:
      releaseName: zuno-openshift-ai-d0
      values: |
        cluster-ods:
          project:
            enabled: true
          operator:
            enabled: true
          # DSCInitialization stays disabled here: it needs the Subscription
          # actually reconciled/approved first (see
          # ansible/roles/openshift_ai/tasks/install.yml's InstallPlan
          # approval step, which runs between d0's two applies) - it's
          # enabled in application-d1.yaml instead, once that's true.
          DSCInitialization:
            enabled: false
        # User Workload Monitoring, a MaaS/showback prerequisite - cluster-level
        # like the operator install itself, hence d0 not d1. See
        # templates/cluster-monitoring-config.yaml.
        userWorkloadMonitoring:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: redhat-ods-operator
  ignoreDifferences:
    # OLM rewrites this annotation at runtime; ignored to avoid permanent ArgoCD drift.
    - group: operators.coreos.com
      kind: OperatorGroup
      jsonPointers:
        - /metadata/annotations/olm.providedAPIs
    # Same reasoning as application-d1.yaml's DataScienceCluster entry: the
    # operator expands spec with defaulted sub-fields at runtime.
    - group: dscinitialization.opendatahub.io
      kind: DSCInitialization
      jsonPointers:
        - /spec
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true # namespace isn't created elsewhere
