---
# Red Hat OpenShift AI operator install (ADR-0047/ADR-0048, ADR-0312). See
# gitops/charts/openshift-ai (cluster-ods.project.enabled +
# cluster-ods.operator.enabled - Namespace/OperatorGroup/Subscription,
# rendered by the vendored startx cluster-ods chart). Applied by the
# `openshift_ai` Ansible role's install.yml,
# with the operator's catalog-published channel injected via
# gitops_app_extra_helm_values (ADR-0048) - see that role's README.md. The
# DataScienceCluster operand is a separate Application
# (zuno-openshift-ai-d1, applied after this one is Synced+Healthy) - see
# application-d1.yaml. zuno-ai-run's own Namespace, RHOAI dashboard label
# and GPU ResourceQuota are owned by gitops/charts/namespaces instead
# (ADR-0312), not by this chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-openshift-ai-d0
  namespace: openshift-gitops
  annotations:
    # Sync order within the root App-of-Apps (gitops/root-app-of-apps.yaml)
    # only - Ansible applies each Application directly and ignores this;
    # real Day 0 ordering (after `namespaces`) comes from ansible/
    # playbooks/day0_install.yml's day0_components list.
    argocd.argoproj.io/sync-wave: "-199"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/openshift-ai
    helm:
      releaseName: zuno-openshift-ai-d0
      values: |
        cluster-ods:
          project:
            enabled: true
          operator:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: redhat-ods-operator
  ignoreDifferences:
    # OLM's OperatorGroup controller rewrites this annotation at runtime
    # with the APIs the installed CSV(s) actually provide - the chart
    # only ever renders it empty/absent, so without this ArgoCD sees
    # permanent drift and (selfHeal: true) fights OLM's own value on
    # every sync.
    - group: operators.coreos.com
      kind: OperatorGroup
      jsonPointers:
        - /metadata/annotations/olm.providedAPIs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # redhat-ods-operator (this Application's destination.namespace) is
      # created nowhere else - also backed by the vendored cluster-ods
      # chart's own project.hooked PreSync hook as a redundant safeguard.
      - CreateNamespace=true
