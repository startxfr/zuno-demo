---
# DataScienceCluster operand (not the operator itself, see application-d0.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-openshift-ai-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-198"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/openshift-ai
    helm:
      releaseName: zuno-openshift-ai-d1
      values: |
        cluster-ods:
          DSCInitialization:
            enabled: true
        dataScienceCluster:
          enabled: true
        maasGateway:
          enabled: true
          # Placeholder auto-substituted with the real cluster domain by
          # ansible/tasks/apply_gitops_app.yml.
          clusterBaseDomain: apps.mycluster.example.com
        maasDb:
          enabled: true
        # ADR-0522/WP-079: RHOAI monitoring's Tempo traces S3 credential -
        # must exist before/alongside DSCInitialization reconciles, same
        # sync-wave grouping as maasDb above.
        tracesS3:
          enabled: true
        # ADR-0522/WP-080: bare Route to Perses's own dashboards.
        persesRoute:
          enabled: true
          # Placeholder auto-substituted with the real cluster domain by
          # ansible/tasks/apply_gitops_app.yml.
          clusterBaseDomain: apps.mycluster.example.com
        # Workaround for a one-verb RBAC gap in the RHOAI 3.5.0 bundle that
        # otherwise pins DataScienceCluster at Not Ready - see the chart's
        # templates/rbac-kserve-module-networkpolicy.yaml. Enabled here and
        # not in values.yaml because both Applications render this chart.
        kserveModuleNetworkPolicyRbac:
          enabled: true
        prometheusK8s: null
        userWorkloadMonitoring:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: redhat-ods-operator
  ignoreDifferences:
    # The RHOAI operator expands spec.components with many defaulted
    # entries/sub-fields at runtime (and stores the CR as v2 while this
    # Application renders v1); without this, ArgoCD sees permanent drift
    # and fights it.
    - group: datasciencecluster.opendatahub.io
      kind: DataScienceCluster
      jsonPointers:
        - /spec
    # ADR-0523/WP-081: belt-and-braces on top of the canonicalized value in
    # gitops/charts/openshift-ai/values.yaml. DSCInitialization is rendered as
    # v1 while v2 is the storage version, so its metav1.Duration fields come
    # back canonicalized through the conversion webhook ("48h" -> "48h0m0s")
    # and ArgoCD reports permanent drift, timing out every install/reconcile
    # app-wait. Deliberately ONE pointer, not /spec like the entry above: a
    # blanket ignore here would blind us to real drift across the whole
    # monitoring spec. NOTE application-d0.yaml carries a /spec ignore for
    # this same kind, but d0 sets DSCInitialization.enabled: false - the guard
    # was written for the Application that does not render the resource and
    # omitted from the one that does, which is how this reached the cluster.
    - group: dscinitialization.opendatahub.io
      kind: DSCInitialization
      jsonPointers:
        - /spec/monitoring/traces/storage/retention
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
