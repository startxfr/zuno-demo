---
# No Day1 content for machines (all Machine API CRs are cluster-scoped Day0
# capacity, in -d0); see gitops/apps/README.md's -d0/-d1 convention.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-machines-d1
  namespace: openshift-gitops
  annotations:
    # Sync-wave only matters for the root App-of-Apps path; Ansible ignores it.
    argocd.argoproj.io/sync-wave: "-207"
spec:
  project: zuno-platform
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/noop
    helm:
      releaseName: zuno-machines-d1
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-machine-api
    # ADR-0602 clause 5 / WP-224: was openshift-gitops; only zuno-bootstrap may
    # write there. Every namespaced object this renders names its namespace.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
