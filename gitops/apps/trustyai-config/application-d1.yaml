---
# ADR-0534/WP-107: scaffold only. Renders nothing yet - trustyaiConfig's
# chart has no templates/ content until WP-108 adds the first RAGAS/Garak
# Jobs. Depends only on `models` (the zuno-ai-run namespace and its
# LMEvalJob resources this component's precheck reads) - WP-109 will add
# `mcp`/`agents`/`rag` dependencies once the Agent Runtime guardrail hooks
# land, at which point this Application should move later in the Day 2
# sync-wave ordering if those dependencies require it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-trustyai-config-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-91"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/trustyai-config
    helm:
      releaseName: zuno-trustyai-config-d1
      values: |
        trustyaiConfig:
          enabled: true
        # ADR-0540/WP-120: deploy the NeMo rails server so its
        # request/response contract can be established live. This does NOT
        # switch agent-runtime over - gitops/charts/agent-runtime's
        # guardrails.backend stays "builtin" until the discovery gate
        # passes, so the observer in the request path is unchanged.
        # DISABLED 2026-09-03: enabling it coincided with node
        # ip-10-18-31-92 hitting DiskPressure (the ~multi-GB NeMo server
        # image pull started 22:11:26Z, DiskPressure at 22:15:42Z, 43 pods
        # evicted cluster-wide). Backed out to stop the pull-retry loop
        # while the node is under pressure. Re-enable once the node has
        # headroom - the chart and the CR shape are unchanged and proven.
        #
        # RE-ENABLED 2026-09-03, with the cause addressed rather than
        # waited out: all six nodes read DiskPressure=False, and the
        # chart now pins the pod off the control-plane nodes
        # (nemoGuardrails.pod in values.yaml), which is where the
        # headroom actually is. The rollback is this one value.
        nemoGuardrails:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  # ADR-0538/WP-117: Kueue writes these fields on every Job it manages, and
  # without this the result is a RECREATION LOOP, not cosmetic drift. The
  # Jobs in this chart carry Replace=true,Force=true (a Job's spec.template
  # is immutable, so they must), so ArgoCD reading Kueue's writes as drift
  # means selfHeal deletes and recreates the Job, Kueue re-writes them, and
  # round it goes - observed live on 2026-09-03 at 8+ Workload generations
  # in five minutes, each one re-running the Job and re-pulling its image.
  #
  # /spec/suspend is NOT optional here: the ClusterQueue is deliberately
  # undersized so only one evaluation Job is admitted at a time, which means
  # Jobs are MEANT to sit suspended waiting for quota. Without this pointer
  # every queued Job would read as drift the whole time it waits.
  #
  # The three label pointers are the keys Kueue's mjob.kb.io webhook injects
  # into the pod template (~1 is the JSON Pointer escape for "/"). Named
  # individually rather than ignoring /spec/template/metadata/labels wholesale
  # so a real change to any other pod label is still caught.
  ignoreDifferences:
    - group: batch
      kind: Job
      jsonPointers:
        # The webhook stamps this onto the Job's OWN metadata at creation.
        # Harmless to ignore even where the chart declares it itself.
        - /metadata/labels/kueue.x-k8s.io~1queue-name
        - /spec/suspend
        - /spec/template/metadata/labels/kueue.x-k8s.io~1cluster-queue-name
        - /spec/template/metadata/labels/kueue.x-k8s.io~1local-queue-name
        - /spec/template/metadata/labels/kueue.x-k8s.io~1podset
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      # Required for the ignoreDifferences above to apply during a SYNC and
      # not merely in the diff view - see gitops/apps/machines/application-d0.yaml,
      # the only other place in this repo that needs it. Without it the
      # ignore suppresses the OutOfSync display while Replace still fires,
      # which is the worst of both worlds: the loop keeps running and the
      # Application looks healthy.
      - RespectIgnoreDifferences=true
