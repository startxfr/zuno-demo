---
# No Day0 (operator/cluster-scoped) content for api - see
# gitops/charts/noop/README.md and gitops/apps/README.md's -d0/-d1
# convention.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-api-d0
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-104"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/noop
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
