---
# Tekos's frontend + BFF. Depends on the agents namespace and the tekos-frontend
# OIDC client from keycloak; Ansible applies `agents` before `api`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-api-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-103"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/tekos
    helm:
      releaseName: zuno-api-d1
      values: |
        global:
          # Substituted with the real cluster domain by
          # ansible/tasks/apply_gitops_app.yml.
          clusterBaseDomain: apps.mycluster.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
