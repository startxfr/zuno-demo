---
# Tekos's frontend + BFF (ADR-0008): a plain Deployment/Service/Route pair,
# not the AIAgent CRD (ADR-0026, retargeted to v1) - see
# gitops/charts/tekos/Chart.yaml and platform/architecture/agent-platform-separation.md.
# Depends on gitops/apps/agents (creates the zuno-agent-tekos namespace this
# deploys into) and gitops/apps/keycloak (the tekos-frontend OIDC client) -
# ArgoCD's own reconciliation is eventually consistent, so exact apply order
# isn't required, but ansible/roles/agents applies `agents` before `api`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-api
  namespace: openshift-gitops
  annotations:
    # Sync order within the root App-of-Apps (gitops/root-app-of-apps.yaml)
    # only - Ansible applies each Application directly and ignores this.
    argocd.argoproj.io/sync-wave: "-104"
spec:
  project: default
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/tekos
    helm:
      values: |
        global:
          # Substituted by ansible/tasks/apply_gitops_app.yml - see
          # gitops/apps/keycloak/application.yaml's comment for how.
          clusterBaseDomain: apps.mycluster.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-agent-tekos
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
