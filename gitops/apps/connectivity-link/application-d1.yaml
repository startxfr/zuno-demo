---
# Kuadrant operand CR (not the operator, see application-d0.yaml). ADR-0317
# originally left spec empty ("no consumer yet"); authorinoTls.enabled is now
# set so Authorino's listener is TLS-enabled, required by MaaS
# (DataScienceCluster's MaaSPrerequisitesAvailable condition) - see
# gitops/charts/connectivity-link/templates/kuadrant.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-connectivity-link-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-196"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/connectivity-link
    helm:
      releaseName: zuno-connectivity-link-d1
      values: |
        project:
          enabled: true
        kuadrant:
          enabled: true
          authorinoTls:
            enabled: true
        # ADR-0517 B4 (WP-118 step 1) / ADR-0555 B (WP-142): tokens,
        # substituted by ansible/tasks/apply_gitops_app.yml.
        # quotaEnforcement.gateway.enabled defaults to true in the chart's
        # own values.yaml, so this Application renders
        # templates/quota-demo-gateway.yaml (one Route per agent, sharing
        # one Gateway) without an explicit gate override here - but that
        # means it also needs its own `routes` override to get the
        # substitution, mirroring
        # the (Day2) zuno-connectivity-link-quota-d1 Application's copy -
        # retired in WP-156 with the <agent>-frontend backends it targeted,
        # so `routes` here carries only the `.name`/`.hostname` that
        # quota-demo-gateway.yaml reads. Missing this left the live Route on the
        # chart's raw placeholder default, live-confirmed 2026-09-03 as a
        # 503 on the ADR-0511/WP-54 quota-demo route (Tekos-only at the
        # time).
        quotaEnforcement:
          routes:
            - name: tekos-quota-demo
              hostname: tekos-quota-demo.apps.mycluster.example.com
            - name: arkos-quota-demo
              hostname: arkos-quota-demo.apps.mycluster.example.com
            - name: comage-quota-demo
              hostname: comage-quota-demo.apps.mycluster.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: kuadrant-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
