---
# Red Hat Connectivity Link operator install (ADR-0317); the Kuadrant
# operand is a separate Application (application-d1.yaml) applied after
# this one is healthy. rhcl-operator's CSV only supports the AllNamespaces
# install mode, so this subscribes into openshift-operators (OLM's own
# pre-existing global-operators OperatorGroup) rather than a dedicated
# namespace - confirmed against a real cluster, same pattern
# zuno-external-secrets-d0 already uses.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-connectivity-link-d0
  namespace: openshift-gitops
  annotations:
    # Sync-wave only matters for the root App-of-Apps path; Ansible orders this
    # ahead of `openshift_ai` in day0_install.yml instead.
    argocd.argoproj.io/sync-wave: "-197"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/connectivity-link
    helm:
      releaseName: zuno-connectivity-link-d0
      values: |
        operator:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-operators
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # openshift-operators always exists.
      - CreateNamespace=false
