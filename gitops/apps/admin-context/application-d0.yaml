---
# Cluster PriorityClasses every other Day 0 component depends on (ADR-0056,
# ADR-0314). Must be Synced+Healthy before any workload-bearing chart renders
# a Pod spec referencing zuno-platform-critical/-important/-weak or
# zuno-workload-default.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-admin-context-d0
  namespace: openshift-gitops
  annotations:
    # Sync-wave order only matters for the root App-of-Apps path; Ansible
    # ignores it.
    argocd.argoproj.io/sync-wave: "-210"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/admin-context
    helm:
      releaseName: zuno-admin-context-d0
      values: |
        priorityClasses:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
