---
# ClusterSecretStore/ExternalSecret operand, applied after the operator
# install (application-d0.yaml) is healthy, with the Vault client Service name injected at apply time.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-external-secrets-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-200"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/external-secrets
    helm:
      releaseName: zuno-external-secrets-d1
      values: |
        clusterSecretStore:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
