---
# External Secrets Operator install; the ClusterSecretStore/ExternalSecret
# operand is a separate Application (application-d1.yaml) applied after this one
# is healthy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-external-secrets-d0
  namespace: openshift-gitops
  annotations:
    # Sync-wave only matters for the root App-of-Apps path; Ansible applies this
    # after `vault` is initialized/unsealed instead.
    argocd.argoproj.io/sync-wave: "-201"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/external-secrets
    helm:
      releaseName: zuno-external-secrets-d0
      values: |
        operator:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # zuno-vault namespace is owned by gitops/charts/namespaces; don't also
      # track it here (avoids a SharedResourceWarning).
      - CreateNamespace=false
      # On a cold cluster the OperatorConfig CRD doesn't exist yet, which makes
      # ArgoCD abort the whole sync as invalid; this skips discovery validation
      # to break that deadlock.
      - SkipDryRunOnMissingResource=true
