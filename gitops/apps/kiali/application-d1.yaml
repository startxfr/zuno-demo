---
# Kiali CR instance (not the operator, see application-d0.yaml), plus the
# OSSMConsole CR registering the mesh view in the OpenShift console. The
# operator auto-creates and owns its own Route from the Kiali CR - no
# separate Route Application/resource exists for Kiali.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-kiali-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-161"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/kiali
    helm:
      releaseName: zuno-kiali-d1
      values: |
        kiali:
          enabled: true
        # ADR-0517 B2 (WP-118 step 1): substitution token, rewritten to the
        # live cluster's apps wildcard domain by
        # ansible/tasks/apply_gitops_app.yml. The chart default is the same
        # token, so a missing substitution fails visibly rather than
        # silently deploying another cluster's hostname.
        appsDomain: apps.mycluster.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-mesh
  ignoreDifferences:
    # The Kiali operator defaults nearly every leaf under these three
    # subtrees at runtime (deployment.*, external_services.*, version);
    # without this, ArgoCD sees permanent drift and fights it. Deliberately
    # scoped to just those subtrees (not the whole /spec) so git-authored
    # top-level fields like auth.strategy and server.* actually sync -
    # a blanket /spec ignore previously meant spec edits silently never
    # reached the live object after initial creation (only a delete+
    # recreate picked them up).
    - group: kiali.io
      kind: Kiali
      jsonPointers:
        - /spec/deployment
        - /spec/external_services
        - /spec/version
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
