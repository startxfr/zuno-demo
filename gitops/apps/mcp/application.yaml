---
# Central MCP Gateway (ADR-0010) - see gitops/charts/mcp-gateway and
# components/mcp-gateway. Applied by the `mcp` Ansible role's configure.yml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-mcp
  namespace: openshift-gitops
  annotations:
    # Sync order within the root App-of-Apps (gitops/root-app-of-apps.yaml)
    # only - Ansible applies each Application directly and ignores this.
    argocd.argoproj.io/sync-wave: "-152"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/mcp-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
