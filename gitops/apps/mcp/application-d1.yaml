---
# Central MCP Gateway (all MCP servers route through here).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-mcp-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-151"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/mcp-gateway
    helm:
      releaseName: zuno-mcp-d1
      values: |
        # Substituted by ansible/tasks/apply_gitops_app.yml (same
        # pattern as gitops/apps/api) - feeds the chart's derived
        # keycloak issuer.
        clusterBaseDomain: apps.mycluster.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
