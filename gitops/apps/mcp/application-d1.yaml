---
# Central MCP Gateway (all MCP servers route through here).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-mcp-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-151"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/mcp-gateway
    helm:
      releaseName: zuno-mcp-d1
      values: |
        # Substituted by ansible/tasks/apply_gitops_app.yml (same
        # pattern as gitops/apps/api) - feeds the chart's derived
        # keycloak issuer.
        clusterBaseDomain: apps.mycluster.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  ignoreDifferences:
    # ADR-0411 follow-up: image.openshift.io/triggers patches this field
    # directly from the ImageStream whenever a fresh Build completes, so
    # ArgoCD must not treat that patch as drift from the Git-declared
    # :latest tag and revert it (selfHeal below would otherwise fight the
    # image-trigger controller).
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/image
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
