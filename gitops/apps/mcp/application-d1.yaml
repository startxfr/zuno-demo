---
# Central MCP Gateway (all MCP servers route through here).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-mcp-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-151"
spec:
  project: zuno-platform
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/mcp-gateway
    helm:
      releaseName: zuno-mcp-d1
      values: |
        # Substituted by ansible/tasks/apply_gitops_app.yml (same
        # pattern as gitops/apps/api) - feeds the chart's derived
        # keycloak issuer.
        clusterBaseDomain: apps.mycluster.example.com
        # ADR-0524: turns on the /mcp front-door's supporting resources -
        # the NetworkPolicy allow for openshift-lightspeed, the
        # system:auth-delegator binding that lets the gateway resolve an
        # end-user token via TokenReview, and the
        # MCP_FRONTDOOR_CAPABILITIES ceiling. The endpoint itself is
        # always present in the image; without this it simply has no RBAC
        # and no configured capability list.
        lightspeed:
          enabled: true
        # WP-225 lot C, rollout steps 2 and 3 (user's go 2026-11-07): verify the a2a-gateway's signed
        # agent chain (the public half of Vault a2a/agent-chain), and sign a per-call assertion for the
        # Zuno MCP servers instead of forwarding the caller's bearer. Servers ignore it until they hold
        # the public key (gitops/apps/mcp-*); enforcing it (callAssertion.required) is a later, separate step.
        agentChain:
          verify: true
          # WP-247 lot 2: the public half of the Vault Transit key agent-chain (the private half never leaves Vault).
          publicKey: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAT/I4wgI087mkIC5Pl4R2a5wOVQN9VlrJQ+E/B6fWYz8=
            -----END PUBLIC KEY-----
        outboundIdentity:
          mode: assertion
          # WP-247 (ADR-0602 option A): Vault Transit signs the assertion; no key Secret in the pod.
          signer: transit
        # ADR-0602 clause 10 (WP-225 lot C, user's go 2026-11-11, after the ai-gateway ran a clean golden path):
        # only the Keycloak clients that carry the zuno-admin-api audience (read from the live realm) are admitted.
        # An OpenShift token on /mcp (Lightspeed, TokenReview) has no azp and is not subject to the list. A forgotten
        # client gets a 401: remove this key and re-run `make d2 install mcp` to go back to "any client of the realm".
        jwtAllowedClients:
          - unifai
          - open-webui
          - dify
          - kagent
          - world-model
          - blender
          - openclaw-*
          - zuno-evaluations
          - zuno-stresstest
          - zuno-admin-api
        # WP-225 lot C, post-demo item 4 (user's go 2026-11-11): the per-call agent entitlement also applies to REST
        # tool calls (env AGENT_ENTITLEMENT_EVERY_CALL); /mcp already enforced it. Back out: remove this key and re-run
        # `make d2 install mcp`.
        restAgentEntitlement: true
        # ADR-0603 M13, post-demo item 4 (user decision 2026-11-11): metrics.query is offered to ocp-ai-ops only (tool
        # policy); its PromQL is scoped to the namespaces mcp-k8s already reads (readNamespaces in
        # gitops/charts/mcp-k8s/values.yaml) plus nvidia-gpu-operator for the GPU metrics. A series without a namespace
        # label (node, cluster) selects nothing. Back out: remove this key and re-run `make d2 install mcp`.
        metricsQuery:
          namespacesByGroup:
            ocp-ai-ops:
              - zuno-ai-run
              - zuno-ai-build
              - zuno-auth
              - zuno-data
              - zuno-dify
              - zuno-kagent
              - zuno-mesh
              - zuno-mlops
              - zuno-monitoring
              - zuno-openwebui
              - zuno-unifai
              - zuno-vault
              - zuno-aap
              - nvidia-gpu-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  ignoreDifferences:
    # ADR-0059: image.openshift.io/triggers patches this field
    # directly from the ImageStream whenever a fresh Build completes, so
    # ArgoCD must not treat that patch as drift from the Git-declared
    # :latest tag and revert it (selfHeal below would otherwise fight the
    # image-trigger controller).
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/image
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
