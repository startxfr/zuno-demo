---
# RAG service (pgvector + hybrid search) - see gitops/charts/rag-service and
# components/rag-service. Applied by the `rag` Ansible role's configure.yml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-rag
  namespace: openshift-gitops
  annotations:
    # Sync order within the root App-of-Apps (gitops/root-app-of-apps.yaml)
    # only - Ansible applies each Application directly and ignores this.
    argocd.argoproj.io/sync-wave: "-136"
spec:
  project: default
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/rag-service
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
