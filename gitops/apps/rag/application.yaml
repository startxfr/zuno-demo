---
# RAG service (pgvector + hybrid search) - see gitops/charts/rag-service and
# components/rag-service. Applied by the `rag` Ansible role's configure.yml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rag
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/rag-service
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
