---
# RAG service (pgvector + hybrid search).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-rag-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-135"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/rag-service
    helm:
      releaseName: zuno-rag-d1
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
