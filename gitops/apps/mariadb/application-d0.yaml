---
# Open-source mariadb-operator install (community-operators, Apache-2.0);
# the MariadbOperator activation CR and MariaDB/PhysicalBackup operand CRs
# are a separate Application (application-d1.yaml). No dedicated
# OperatorGroup: subscribed into the shared openshift-operators namespace
# (AllNamespaces) - same Pattern B shape as gitops/apps/postgresql, see
# gitops/charts/mariadb/values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-mariadb-d0
  namespace: openshift-gitops
  annotations:
    # Sync-wave order only matters for the root App-of-Apps path; Ansible
    # ignores it.
    argocd.argoproj.io/sync-wave: "-174"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/mariadb
    helm:
      releaseName: zuno-mariadb-d0
      values: |
        operator:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
