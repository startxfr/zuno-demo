---
# Finage's frontend + BFF (ADR-0326/WP-36, fifth and final real agent,
# closing the four-agent generalization). Depends on the finage-frontend
# confidential OIDC client from keycloak, same as gitops/apps/advantage's
# own Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-finage-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-97"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/finage
    helm:
      releaseName: zuno-finage-d1
      values: |
        global:
          # Substituted with the real cluster domain by
          # ansible/tasks/apply_gitops_app.yml.
          clusterBaseDomain: apps.mycluster.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
