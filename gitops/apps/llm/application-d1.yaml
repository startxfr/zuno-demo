---
# Provider routing config: a native Kustomize app generating the
# zuno-provider-routing ConfigMap plus one ExternalSecret per external provider.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-llm-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-127"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: platform/ai-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
