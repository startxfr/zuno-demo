---
# Provider routing config (ADR-0020, ADR-0021): a native Kustomize app
# (ArgoCD auto-detects platform/ai-gateway/kustomization.yaml) generating
# the zuno-provider-routing ConfigMap directly from provider-routing.yaml
# (single source of truth) plus one ExternalSecret per external provider.
# Applied by the `llm` Ansible role's configure.yml, which also applies
# gitops/apps/agent-runtime (see that role's README for why both live here).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-llm
  namespace: openshift-gitops
  annotations:
    # Sync order within the root App-of-Apps (gitops/root-app-of-apps.yaml)
    # only - Ansible applies each Application directly and ignores this.
    argocd.argoproj.io/sync-wave: "-128"
spec:
  project: default
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: platform/ai-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
