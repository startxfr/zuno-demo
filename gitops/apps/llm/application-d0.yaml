---
# No Day0 content for llm; see gitops/apps/README.md's -d0/-d1 convention.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-llm-d0
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-128"
spec:
  project: zuno-apps
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/noop
    helm:
      releaseName: zuno-llm-d0
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-ai-run
    # ADR-0602 clause 5 / WP-224: was openshift-gitops; only zuno-bootstrap may
    # write there. Every namespaced object this renders names its namespace.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
