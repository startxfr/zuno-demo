---
# No Day0 (operator/cluster-scoped) content for vault - see
# gitops/charts/noop/README.md and gitops/apps/README.md's -d0/-d1
# convention. Vault has no OLM operator at all (a plain Helm deployment),
# so all of its content is -d1 (see application-d1.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-vault-d0
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-192"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/noop
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
