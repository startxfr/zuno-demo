---
# No Day0 content for vault: no OLM operator, plain Helm deployment (see
# application-d1.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-vault-d0
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-192"
spec:
  project: zuno-apps
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/noop
    helm:
      releaseName: zuno-vault-d0
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-vault
    # ADR-0602 clause 5 / WP-224: was openshift-gitops; only zuno-bootstrap may
    # write there. Every namespaced object this renders names its namespace.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
