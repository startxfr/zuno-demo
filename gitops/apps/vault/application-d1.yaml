---
# Demo-grade Vault: single replica, file storage, no HA/auto-unseal. Application
# name stays static ("zuno-vault-d1") to avoid ever creating a second, divergent
# release.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-vault-d1
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-191"
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/vault
    helm:
      # Forces the release name to "zuno-vault"; without it, resources would
      # inherit "zuno-vault-d1" and break the chart's fixed-release-name
      # assumption.
      releaseName: zuno-vault
      values: |
        route:
          enabled: true
        global:
          clusterBaseDomain: apps.mycluster.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: false # Vault's seal state is managed imperatively by the vault role; avoid ArgoCD fighting a sealed pod's restart behavior.
    syncOptions:
      - CreateNamespace=false
