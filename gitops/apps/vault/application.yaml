---
# Demo-grade Vault: single replica, file storage, no HA/auto-unseal via
# cloud KMS. Sufficient for a solo demo; production hardening is tracked by
# ADR-0112 (production-grade backup and recovery, v1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: "0.28.1"
    helm:
      values: |
        # ADR-0052: the official chart's own documented flag for
        # OpenShift SCC compatibility (arbitrary/non-root UID, no
        # privileged context) - this repo does not otherwise control this
        # third-party chart's PodSpec directly, so hardening beyond this
        # flag is left to the chart's own restricted-compatible defaults
        # rather than guessed at via undocumented value overrides.
        global:
          openshift: true
        server:
          image:
            # Fully qualified: an unqualified "hashicorp/vault" short name
            # resolves via this cluster's node-level short-name alias
            # config to registry.connect.redhat.com/hashicorp/vault, which
            # needs a paid Red Hat Connect pull secret this cluster
            # doesn't have (ImagePullBackOff, "Please login to the Red Hat
            # Registry" - found via live-cluster testing on
            # api.demo222.startx.fr). docker.io's image is the same
            # HashiCorp-published build, just reachable without that
            # credential.
            repository: docker.io/hashicorp/vault
            tag: "1.17.2"
          standalone:
            enabled: true
            config: |
              ui = true
              listener "tcp" {
                address = "[::]:8200"
                tls_disable = true
              }
              storage "file" {
                path = "/vault/data"
              }
          dataStorage:
            enabled: true
            size: 2Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        ui:
          enabled: true
        injector:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: zuno-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: false # Vault's seal state is managed imperatively by the vault role; avoid ArgoCD fighting a sealed pod's restart behavior.
    syncOptions:
      - CreateNamespace=true
