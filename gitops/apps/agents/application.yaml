---
# The five agent namespaces (ADR-0023) - see gitops/charts/namespaces/README.md
# for why all five exist even though only zuno-agent-tekos hosts real workloads.
# Applied by ansible/roles/agents (reachable via `make install`), ahead of
# gitops/apps/api which deploys the Tekos workloads into zuno-agent-tekos.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-agents
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/charts/namespaces
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
