---
# Root App-of-Apps. Applied once by the `argocd` role's configure task
# (ansible/roles/argocd/tasks/configure.yml). ArgoCD recurses over
# gitops/apps/ and turns every application.yaml it finds into a managed
# child Application - this is the mechanism that lets `make configure`
# (with no scope) bring the whole platform to its declared state from a
# single command. See docs/adr/0022-use-gitops-managed-declarative-agent-tasks-and-policies.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-app-of-apps
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/apps
    directory:
      recurse: true
      include: "*/application.yaml"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
