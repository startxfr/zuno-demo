---
# Root App-of-Apps, for manual pure-GitOps bootstrap only — not applied by
# any Ansible task. Each component's Application is applied by its own role.
# Requires the "zuno" AppProject to already exist (apply
# ansible/roles/argocd/kustomize/appproject/appproject.yaml by hand first).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-app-of-apps
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/apps
    directory:
      recurse: true
      include: "*/applicatio*.yaml"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
