---
# Root App-of-Apps. NOT applied by any Ansible task (ADR-0311 retired
# ansible/roles/argocd/tasks/configure.yml's use of this manifest - every
# component's Application is applied directly by its own role instead, via
# ansible/tasks/apply_gitops_app.yml). Kept here only as a documented
# example of a pure-GitOps, Ansible-free bootstrap: apply this manifest by
# hand (`oc apply -f gitops/root-app-of-apps.yaml`) and ArgoCD recurses over
# gitops/apps/, turning every application.yaml it finds into a managed
# child Application, bringing the whole platform to its declared state from
# a single command with no Ansible involved. See
# docs/platform/installation.md and
# docs/adr/0022-use-gitops-managed-declarative-agent-tasks-and-policies.md /
# docs/adr/0311-stop-applying-the-root-app-of-apps-from-ansible.md.
#
# spec.project references the "zuno" AppProject (ansible/roles/admin_context/
# kustomize/appproject/appproject.yaml, applied by that role's configure.yml
# - see gitops/apps/README.md), same as every child Application it recurses
# over. Anyone following this manifest's own pure-GitOps path by hand must
# create that AppProject first (`oc apply -f
# ansible/roles/admin_context/kustomize/appproject/appproject.yaml`) - it
# does not exist until admin_context's Ansible role has run.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zuno-app-of-apps
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: zuno
  source:
    repoURL: https://github.com/startxfr/zuno-demo.git
    targetRevision: main
    path: gitops/apps
    directory:
      recurse: true
      include: "*/application.yaml"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
