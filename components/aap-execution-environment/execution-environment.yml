---
# WP-102/ADR-0418 clause 6: a custom AAP Controller execution environment
# (EE) layering the CLI binaries the stock Red Hat EE below does not ship
# but this repo's Ansible shells out to directly on localhost (this repo
# runs `ansible_connection: local` everywhere, so any `command`/`shell`
# task executes INSIDE the EE container itself, never inside a target
# pod): `kustomize` (ansible/tasks/apply_kustomize.yml), `oc`
# (ansible/tasks/apply_openshift_build.yml's `oc start-build`, mlops/
# rag_ingestion's `oc whoami -t`), and `cosign`
# (ansible/tasks/verify_okf_signatures.yml, via sign_okf_bundle.py
# verify). `vault`/`helm` were investigated and do NOT need bundling -
# see wp-102-aap-execution-environment-kustomize.md.
#
# `Dockerfile` in this directory is meant to be ansible-builder's
# generated output (`ansible-builder create -f execution-environment.yml
# -c .`) so the BuildConfig here can keep using this repo's normal Docker
# strategy, same as every other components/<name>/Dockerfile - it was
# hand-authored instead because this sandbox's `ansible-builder` install
# is broken (wrong python3.8 shebang, no ansible_builder module). If a
# working `ansible-builder` toolchain ever regenerates it, diff carefully
# before overwriting - the extra curl layers below (oc/kustomize/cosign)
# live in `additional_build_steps.append_final` here specifically so a
# regeneration keeps them.
version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-27/ee-supported-rhel9:latest

# No additional Python/system/Galaxy content needed - the stock EE
# already carries every collection (kubernetes.core, community.general,
# ansible.posix) and Python package this repo's Ansible depends on; the
# gap this WP closes is CLI binaries, handled entirely below.
dependencies:
  python: []
  system: []
  galaxy: {}

additional_build_steps:
  append_final:
    # oc/kustomize/cosign: none of the three are an RHEL9 dnf package
    # reachable here - `dnf` itself doesn't exist in this stock EE image
    # (confirmed live 2026-08-30: "dnf: command not found", so the
    # original RHN-auto-attach assumption for oc was wrong - that applies
    # to full RHEL hosts like the `aap` role's own VMs, not this minimal
    # supported-EE container). All three are pinned-version release
    # binaries instead, checksum-verified against each project's own
    # published checksums manifest (oc's sha256sum.txt on
    # mirror.openshift.com, kustomize's checksums.txt, cosign's
    # cosign_checksums.txt). SHA256 digests below fetched live from those
    # manifests for the exact pinned versions - re-verify all three on
    # any version bump, never carry a digest forward or fabricate one.
    #
    # OC_VERSION pinned to this cluster's own server version (`oc version
    # -o json`, confirmed live 4.22.8) for the closest client/server
    # compatibility. COSIGN_VERSION matches components/supply-chain-
    # signer/Dockerfile's own pin (v2.4.1) - keep both in sync on a bump,
    # same binary shape.
    - ARG OC_VERSION=4.22.8
    - ARG OC_SHA256=22cb5df5206569ca2c8ca3b56f55f5af9dbd68fc35ea237a4069e06ffd6e9218
    - ARG KUSTOMIZE_VERSION=5.4.3
    - ARG KUSTOMIZE_SHA256=3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7
    - ARG COSIGN_VERSION=v2.4.1
    - ARG COSIGN_SHA256=8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b
    - >-
      RUN curl -sSL -o /tmp/oc.tar.gz
      "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/${OC_VERSION}/openshift-client-linux-${OC_VERSION}.tar.gz"
      && echo "${OC_SHA256}  /tmp/oc.tar.gz" | sha256sum -c -
      && tar -xzf /tmp/oc.tar.gz -C /usr/bin oc
      && chmod +x /usr/bin/oc
      && rm -f /tmp/oc.tar.gz
    - >-
      RUN curl -sSL -o /tmp/kustomize.tar.gz
      "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
      && echo "${KUSTOMIZE_SHA256}  /tmp/kustomize.tar.gz" | sha256sum -c -
      && tar -xzf /tmp/kustomize.tar.gz -C /usr/bin kustomize
      && chmod +x /usr/bin/kustomize
      && rm -f /tmp/kustomize.tar.gz
    - >-
      RUN curl -sSL -o /usr/bin/cosign
      "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
      && echo "${COSIGN_SHA256}  /usr/bin/cosign" | sha256sum -c -
      && chmod +x /usr/bin/cosign
