# Ruff, the Python linter of the repository (best-practices audit, lot 1). Only the rules that find real defects are on and
# BLOCKING in CI: syntax errors, undefined names, redefinitions (E9, F63, F7, F82, F811). The wider set below it is reported
# by an informational CI step (`ruff check --select E4,E7,E9,F --statistics`), because the existing debt there is mostly
# style that this repository does on purpose: imports after a sys.path insert (E402), one-line statements (E701, E702),
# `l` as a loop name (E741). Tighten the list as that debt is paid, never loosen the blocking set.
target-version = "py311"
line-length = 140

[lint]
select = ["E9", "F63", "F7", "F82", "F811"]
