# Knowledge domain: sxa (ADR-0217)
#
# Distinct from knowledge.sxa-legacy (ADR-0216/WP-065) - see this domain's
# description below for how. NO physical database names, service
# endpoints, secrets or credentials belong in this file - see
# platform/bindings/knowledge/bindings.yaml (ADR-0204, WP-21) for the
# physical binding.

id: knowledge.sxa
title: Weekly anonymized SXA commercial corpus
description: >-
  Legacy SXA commercial/sales content (affaire/devis/commande/facture),
  supplied as an already-anonymized relational SQL export refreshed weekly
  (ADR-0217). Distinct from `knowledge.sxa-legacy` (ADR-0216): that domain
  reuses this same source export for its own live-lookup path but stays
  on-demand/immutable, while `knowledge.sxa` refreshes on a real weekly
  schedule. Neither domain transforms or scans content (2026-08-23
  amendment to both ADRs) - content is indexed/served exactly as it
  arrives from the source, trusted as-is. Both domains may coexist;
  neither supersedes the other.

taxonomy:
  source_classes:
    - sxa-corpus   # WP-067 fetch-sxa adapter

  # Mirrors knowledge.sxa-legacy's relational-model taxonomy (ADR-0202) -
  # the same source shape, a different provenance/trust and refresh model.
  record_dimensions:
    - schema
    - table
    - column
    - relationship
    - record_type
    - date
    - customer
    - project

freshness:
  # Unlike sxa-legacy's on-demand-only model, this source polls its
  # dedicated bucket on a real weekly cadence (WP-067) - a new snapshot
  # each week is expected, not exceptional.
  objective: weekly
  rationale: >-
    The source is an operator-refreshed weekly export, not a one-off
    point-in-time snapshot - a real cadence applies, unlike
    knowledge.sxa-legacy's immutable-dump framing.
  operation_classes:
    semantic-read:
      max_staleness: 7d
    current-state-read:
      max_staleness: 7d

classification:
  default_by_source_type:
    sxa-corpus: C3   # still commercial/financial-adjacent data; "already anonymized" does not lower this

exempt_from_freshness_enforcement: false

policy_ref: policies/knowledge/knowledge-policy.yaml

related_adrs:
  - ADR-0202   # introduce logical knowledge domains
  - ADR-0203   # enforce knowledge authorization as policy intersection
  - ADR-0204   # generalize the RAG platform to multiple isolated knowledge domains
  - ADR-0206   # separate current Salesforce knowledge from legacy SXA
  - ADR-0216   # import real SXA content via S3 into MariaDB, served through MCP and anonymized RAG (the related-but-distinct prior effort)
  - ADR-0217   # ingest a weekly, already-anonymized SXA corpus as a new RAG domain
