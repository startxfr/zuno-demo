# Which Vault keys each namespace may read through External Secrets
# (ADR-0602 clause 2, WP-223, finding C2).
#
# The single ClusterSecretStore vault-backend this replaces authenticated to
# one Vault role (eso-reader, read zuno/data/*) for an ExternalSecret in ANY
# namespace, so whoever could create an ExternalSecret anywhere - ocp-ai-dev
# and ocp-ai-ops in zuno-ai-run, confirmed live on 2026-11-06 - could read the
# Keycloak admin password, the database roots and every OIDC client secret.
#
# Now each namespace below has ONE SecretStore named `vault`, which logs in to
# Vault as that namespace's ServiceAccount `vault-reader` with the Kubernetes
# auth role `ns-<namespace>`. That role's policy `ns-<namespace>` allows read
# on zuno/data/<key> for exactly the keys listed here, nothing else.
#
# This file is the single source of truth for both sides:
#   - Vault: the configure Job (ansible/roles/vault) writes the policies and
#     roles from it.
#   - Kubernetes: the SecretStores are rendered by
#     gitops/charts/external-secrets (values.yaml secretStores.namespaces), or
#     by the chart that creates the namespace when it does not exist yet at
#     that point (cert-manager by gitops/charts/cert-manager, zuno-claw-* by
#     gitops/charts/openclaw).
#   - platform/vault/check_secret_access.py renders every Application and
#     fails if an ExternalSecret uses another store or reads a key not listed
#     for its namespace, if a namespace has no store or two, or if a grant
#     here is read by nothing (least privilege: remove what is unused).
#
# Format: keys are relative to the KV v2 mount `zuno` (Vault path
# zuno/data/<key>), exactly as an ExternalSecret writes remoteRef.key. A
# trailing `/*` grants a prefix: use it only for dataFrom.find or genuinely
# dynamic keys (none today). A key two namespaces read is listed in both.
#
# Adding an ExternalSecret: add its key under its namespace here, run the
# check, then re-run the Vault configure step so the policy follows.
namespaces:
  # Built into OpenShift; gitops/charts/openshift-oauth.
  openshift-config:
    keys:
      - keycloak/openshift-client
  # Created by gitops/charts/cert-manager (its store renders there); ACME DNS-01.
  cert-manager:
    keys:
      - aws/route53-dns01
  # gitops/charts/lightspeed-config, serviceIdentity mode only.
  openshift-lightspeed:
    keys:
      - lightspeed/mcp-token
  # gitops/charts/openshift-ai (MaaS database, OGX pgvector), gitops/charts/mlflow.
  redhat-ods-applications:
    keys:
      - maas/postgresql-app
      - mlflow/postgresql-app
      - ogx/postgresql-app
  redhat-ods-monitoring:
    keys:
      - rhoai/traces-s3
  # gitops/charts/aap and aap-config.
  zuno-aap:
    keys:
      - aap-controller/postgresql-app
      - aap-eda/postgresql-app
      - aap-hub/postgresql-app
      - aap-metrics/postgresql-app
      - aap-metrics/postgresql-awx-readonly
      - aap/admin
      - aap/controller-token
      - aap/hub-s3
      - aap/postgresql-app
      - aap/rhn
  # gitops/charts/rhtas-config: the signer's Keycloak client mirror.
  zuno-ai-build:
    keys:
      - keycloak/zuno-signer-client
  # The shared runtime: ai-gateway, mcp-*, models, smtp, trustyai-config,
  # mlflow, platform/ai-gateway providers, external-secrets cluster domain.
  # ocp-ai-dev and ocp-ai-ops can create ExternalSecrets here, so this list is
  # exactly what they can read - keep it short.
  zuno-ai-run:
    keys:
      - aap/mcp-token
      - confluence/technical
      - github/technical
      - gitlab/technical
      - keycloak/demo-personas
      - keycloak/zuno-evaluations
      - mcp/gateway-workload-token
      - platform/cluster-domain
      - providers/anthropic
      - providers/gemini
      - providers/mistral
      - providers/mistral-codestral
      - providers/openai
      - providers/ovhcloud
      - rag/s3
      - redis/session-store
      - salesforce/technical
      - smtp/technical
  # gitops/charts/keycloak (and redis's copy of the session-store password).
  zuno-auth:
    keys:
      - google-oauth/client
      - keycloak/aap-client
      - keycloak/admin
      - keycloak/automation
      - keycloak/console
      - keycloak/demo-personas
      - keycloak/dify
      - keycloak/kagent
      - keycloak/open-webui
      - keycloak/openclaw-consultant-02
      - keycloak/openclaw-sale-01
      - keycloak/openshift-client
      - keycloak/postgresql-app
      - keycloak/unifai
      - keycloak/zuno-admin-api-client
      - keycloak/zuno-evaluations
      - keycloak/zuno-signer-client
      - keycloak/zuno-stresstest
      - redis/session-store
  # One per openclaw persona (gitops/charts/openclaw values personas; the
  # chart creates the namespace and renders its store).
  zuno-claw-consultant-02:
    keys:
      - keycloak/openclaw-consultant-02
      - openclaw/consultant-02
  zuno-claw-sale-01:
    keys:
      - keycloak/openclaw-sale-01
      - openclaw/sale-01
  # gitops/charts/postgresql (pguser Secrets, pgBackRest) and mariadb.
  zuno-data:
    keys:
      - aap-controller/postgresql-app
      - aap-eda/postgresql-app
      - aap-hub/postgresql-app
      - aap-metrics/postgresql-app
      - aap-metrics/postgresql-awx-readonly
      - aap/postgresql-app
      - dify/postgresql-app
      - kagent/postgresql-app
      - keycloak/postgresql-app
      - maas/postgresql-app
      - mariadb/root
      - mariadb/s3
      - mlflow/postgresql-app
      - mlops/dspa-mysql
      - ogx/postgresql-app
      - postgresql/app
      - postgresql/backup-s3
      - rhtas/trillian-mysql
  # gitops/charts/dify, zuno-dify-knowledge, zuno-token-proxy (dify).
  zuno-dify:
    keys:
      - dify/app
      - dify/knowledge-api
      - dify/postgresql-app
      - dify/redis
      - dify/s3
      - keycloak/dify
  # gitops/charts/kagent, zuno-token-proxy (kagent).
  zuno-kagent:
    keys:
      - kagent/app
      - kagent/postgresql-app
      - keycloak/kagent
  # gitops/charts/mlops, mlflow.
  zuno-mlops:
    keys:
      - mlops/dspa-mysql
      - rag/s3
  # gitops/charts/grafana.
  zuno-monitoring:
    keys:
      - grafana/oauth-proxy
  # gitops/charts/open-webui.
  zuno-openwebui:
    keys:
      - keycloak/open-webui
      - open-webui/app
  # gitops/charts/rhtas and the schema Job's ExternalSecret in
  # ansible/roles/rhtas/tasks/install.yml.
  zuno-rhtas:
    keys:
      - rhtas/trillian-mysql
  # gitops/charts/unifai.
  zuno-unifai:
    keys:
      - confluence/technical
      - keycloak/unifai
      - postgresql/backup-s3
