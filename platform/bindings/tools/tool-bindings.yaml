# Bindings: tools - backend-binding registry (ADR-0116).
#
# Resolves an *authorized* logical tool capability to the physical backend
# that serves it. This file is platform-controlled configuration: bindings
# can never be supplied by an agent or caller, and the MCP Gateway
# authorizes (policies/tools/tool-policy.yaml, the full ADR-0011
# intersection) BEFORE resolving/invoking anything registered here.
#
# The stable contract consumed by OKF tasks and policy is the canonical
# `capability` ID (`<domain>.<resource>.<verb>`). Everything else in an
# entry - server, transport, endpoint, the backend's own tool name - is
# binding data that may change without touching any agent definition
# (ADR-0116's core property). Legacy pre-ADR-0116 tool names are carried
# as explicit `aliases` during migration; new agent contracts must use the
# canonical IDs.
#
# Schema per entry:
#   capability:    canonical `<domain>.<resource>.<verb>` ID, unique key.
#   aliases:       optional legacy tool names resolving to this same
#                  binding (migration aid - ADR-0116 allows keeping
#                  `search_confluence` etc. as explicit aliases).
#   backend:       named physical backend (matches tool-policy.yaml's
#                  `mcp_server` labels for observability).
#   transport:     `streamable-http` (real MCP server via the MCP SDK) or
#                  `in-process` (gateway-embedded demo handler,
#                  components/mcp-gateway/app/handlers/).
#   endpoint:      streamable-http only - {env, default, path}: the base
#                  URL is read from environment variable `env` (falling
#                  back to `default`), with `path` appended. Never a
#                  secret; the gateway's workload token (ADR-0037) rides
#                  separately.
#   handler:       in-process only - handler module name under
#                  app/handlers/.
#   input_schema:  in-process only - the JSON schema (type object) of the
#                  capability's arguments, advertised in tools/list. A
#                  streamable-http backend publishes its own; an in-process
#                  handler has none, and without this the model sees an open
#                  object and omits the required arguments (WP-208 D3).
#                  tests/test_bindings.py fails when a handler reads an
#                  argument this schema does not name.
#   provider_tool: the backend's own native tool name invoked after
#                  resolution (callers never see it).
#
# An unknown capability, a capability without exactly one entry here, or a
# malformed entry fails closed: the gateway refuses the call without
# contacting any backend, and startup/readiness validation flags policy
# capabilities lacking a valid binding (ADR-0116 Operational
# considerations).
#
# ADR-0603 M12 (WP-225 lot B), streamable-http only:
#   caller_context: true   the gateway sends the signed X-Zuno-Caller-* headers
#                          (caller sub, groups, email, signed for this backend
#                          name). Only the Zuno servers that scope their shared
#                          credential with it set it; default false, so a
#                          third-party backend never receives a caller's identity.
#   gateway_token: false   X-Zuno-Gateway-Token (ADR-0037) is not sent: for a
#                          backend that does not check it (the upstream
#                          kubernetes-mcp-server). Default true.
#
# ADR-0119: an optional top-level `backends:` map (backend name -> default
# {env, default, path}) lets a streamable-http entry omit its own
# `endpoint:` block when every capability of that backend shares one -
# useful once a backend has many capabilities (a growing integration
# catalog). A per-entry `endpoint:` still always wins when present;
# nothing existing below needs to change. Example:
#
# backends:
#   some-backend:
#     env: SOME_BACKEND_MCP_URL
#     default: "http://some-backend-mcp.zuno-ai-run.svc:8000"
#     path: /mcp

backends:
  # --- git-forge: real MCP server (ADR-0120), first real use of the
  #     `backends:` shorthand - six capabilities below all share this one
  #     endpoint instead of repeating it six times.
  git-forge:
    env: GIT_FORGE_MCP_URL
    default: "http://git-forge-mcp.zuno-ai-run.svc:8000"
    path: /mcp

  # --- aap: real MCP server (ADR-0355/WP-074), second user of this
  #     shorthand. Note the Service is `aap-mcp` while the chart/app are
  #     `mcp-aap` - the scaffolder's convention, same inversion as
  #     mcp-git-forge/git-forge-mcp.
  aap:
    env: AAP_MCP_URL
    default: "http://aap-mcp.zuno-ai-run.svc:8000"
    path: /mcp

  # --- k8s: the upstream containers/kubernetes-mcp-server (ADR-0600/WP-206), read-only, pinned by digest.
  #     Service k8s-mcp, chart mcp-k8s. The Service port is 8080 (the upstream default), not 8000.
  k8s:
    env: K8S_MCP_URL
    default: "http://k8s-mcp.zuno-ai-run.svc:8080"
    path: /mcp

bindings:
  # ADR-0219: the five `sxa.*` capabilities that were bound here to the
  # `sales-db` MCP server are removed - SXA is pre-2021 history, served
  # through `knowledge.sxa-legacy` retrieval only, with no deterministic
  # query path and no MCP server behind it.
  #
  # The `sales.*` namespace remains deliberately vacant, and that still
  # matters: it is reserved for the real live Salesforce capabilities
  # (ADR-0206/WP-33), so legacy SXA content can never become
  # indistinguishable from current Salesforce data.

  # --- confluence: real MCP server (ADR-0117), streamable-HTTP transport ---
  - capability: confluence.page.search
    aliases: [search_confluence]
    backend: confluence
    transport: streamable-http
    endpoint:
      env: CONFLUENCE_MCP_URL
      default: "http://confluence-mcp.zuno-ai-run.svc:8000"
      path: /mcp
    provider_tool: search_pages
    auth_mode: service-identity
    caller_context: true

  - capability: confluence.page.read
    backend: confluence
    transport: streamable-http
    endpoint:
      env: CONFLUENCE_MCP_URL
      default: "http://confluence-mcp.zuno-ai-run.svc:8000"
      path: /mcp
    provider_tool: read_page
    auth_mode: service-identity
    caller_context: true

  - capability: confluence.page.create
    backend: confluence
    transport: streamable-http
    endpoint:
      env: CONFLUENCE_MCP_URL
      default: "http://confluence-mcp.zuno-ai-run.svc:8000"
      path: /mcp
    provider_tool: create_page
    auth_mode: service-identity
    caller_context: true

  - capability: confluence.page.update
    backend: confluence
    transport: streamable-http
    endpoint:
      env: CONFLUENCE_MCP_URL
      default: "http://confluence-mcp.zuno-ai-run.svc:8000"
      path: /mcp
    provider_tool: update_page
    auth_mode: service-identity
    caller_context: true

  # --- unifai-rag: UnifAI's RAG server (WP-156), NOT an MCP server -
  #     proxied via an in-process handler the same way image_gen/
  #     diagram_gen reach their own real in-cluster services. The caller's
  #     own token (Keycloak, or OpenShift for Lightspeed's front-door,
  #     ADR-0524 clause 3 extension) goes to its bearer endpoint over the
  #     knowledge.tech sources: the CONFLUENCE wiki spaces and the WEB Red Hat
  #     product documentation, interleaved (WP-168, handlers/rag_query.py).
  - capability: knowledge.tech.search
    aliases: [search_technical_docs]
    backend: unifai-rag
    transport: in-process
    handler: rag_query
    provider_tool: search_technical_docs
    auth_mode: service-identity
    input_schema: {"type": "object", "properties": {"query": {"type": "string", "description": "The question or keywords to look up in the technical documentation (Confluence wiki spaces and Red Hat product documentation)."}, "top_k": {"type": "integer", "description": "Number of passages to return (default 5)."}}, "required": ["query"]}

  # --- salesforce: real MCP server (ADR-0326/WP-33), streamable-HTTP
  #     transport - same shape as confluence above, templated from it.
  - capability: salesforce.opportunity.read
    backend: salesforce
    transport: streamable-http
    endpoint:
      env: SALESFORCE_MCP_URL
      default: "http://salesforce-mcp.zuno-ai-run.svc:8000"
      path: /mcp
    provider_tool: read_opportunity
    auth_mode: service-identity
    caller_context: true

  - capability: salesforce.opportunity.create
    backend: salesforce
    transport: streamable-http
    endpoint:
      env: SALESFORCE_MCP_URL
      default: "http://salesforce-mcp.zuno-ai-run.svc:8000"
      path: /mcp
    provider_tool: create_opportunity
    auth_mode: service-identity
    caller_context: true

  - capability: salesforce.opportunity.update
    backend: salesforce
    transport: streamable-http
    endpoint:
      env: SALESFORCE_MCP_URL
      default: "http://salesforce-mcp.zuno-ai-run.svc:8000"
      path: /mcp
    provider_tool: update_opportunity
    auth_mode: service-identity
    caller_context: true

  # --- demo-mode in-process handlers (replaced by real servers as their
  #     integrations land) ---
  - capability: drive.document.search
    aliases: [list_drive_files]
    backend: google-workspace
    transport: in-process
    handler: drive
    provider_tool: list_drive_files
    auth_mode: delegated-user
    input_schema: {"type": "object", "properties": {"folder": {"type": "string", "description": "Drive folder to list (default \"My Drive\")."}}}

  # ADR-0326 (WP-31): Arkos's delegated Drive/Docs write - same in-process
  # demo backend as drive.document.search above, extended with two more
  # operations rather than a new standalone server (no live Google
  # Workspace tenant is reachable from this environment either way). Each
  # gets its own `handler` name because app/downstream.py dispatches
  # purely by that field to a single-purpose function - see
  # app/handlers/drive.py's handle_create/handle_update.
  - capability: drive.document.create
    backend: google-workspace
    transport: in-process
    handler: drive_create
    provider_tool: create_document
    auth_mode: delegated-user
    input_schema: {"type": "object", "properties": {"title": {"type": "string", "description": "Title of the new document."}, "content": {"type": "string", "description": "Text content of the new document."}}, "required": ["title"]}

  - capability: drive.document.update
    backend: google-workspace
    transport: in-process
    handler: drive_update
    provider_tool: update_document
    auth_mode: delegated-user
    input_schema: {"type": "object", "properties": {"document_id": {"type": "string", "description": "Identifier of the document to update."}, "content": {"type": "string", "description": "New text content of the document."}}, "required": ["document_id"]}

  - capability: gmail.message.read
    aliases: [read_gmail]
    backend: google-workspace
    transport: in-process
    handler: gmail
    provider_tool: read_gmail
    auth_mode: delegated-user
    input_schema: {"type": "object", "properties": {"query": {"type": "string", "description": "Gmail search expression (default \"in:inbox\")."}}}

  - capability: web.page.search
    aliases: [web_search]
    backend: web-search
    transport: in-process
    handler: web_search
    provider_tool: web_search
    auth_mode: service-identity
    input_schema: {"type": "object", "properties": {"query": {"type": "string", "description": "Web search query."}}, "required": ["query"]}

  - capability: email.report.send
    aliases: [send_technical_report_email]
    backend: smtp-technical
    transport: in-process
    handler: email_report
    provider_tool: send_technical_report_email
    auth_mode: service-identity
    input_schema: {"type": "object", "properties": {"recipients": {"type": "array", "description": "Internal email addresses to send the report to.", "items": {"type": "string"}}, "subject": {"type": "string", "description": "Subject of the email."}, "body": {"type": "string", "description": "Body of the email."}}, "required": ["recipients", "subject", "body"]}

  # ADR-0340 (WP-32): no Workday backend exists yet (out of scope - see
  # that ADR's "Out of scope/deferred"). Registered with
  # auth_mode: provider-delegated (ADR-0208's third mode - "no provider
  # that supports on-behalf-of delegation is bound yet") so every
  # invocation fails closed with a deterministic 501 at
  # components/mcp-gateway/app/main.py's own auth_mode dispatch, BEFORE
  # invoke_downstream ever runs - the endpoint below is therefore never
  # actually dialed; it's declared only so this streamable-http entry
  # satisfies app/bindings.py's _validate() shape check, matching the
  # naming a real Workday MCP server would eventually use.
  - capability: workday.profile.self.read
    backend: workday
    transport: streamable-http
    endpoint:
      env: WORKDAY_MCP_URL
      default: "http://workday-mcp.zuno-ai-run.svc:8000"
      path: /mcp
    provider_tool: get_own_profile
    auth_mode: provider-delegated

  - capability: workday.profile.self.update
    backend: workday
    transport: streamable-http
    endpoint:
      env: WORKDAY_MCP_URL
      default: "http://workday-mcp.zuno-ai-run.svc:8000"
      path: /mcp
    provider_tool: update_own_profile
    auth_mode: provider-delegated

  - capability: workday.profile.any.read
    backend: workday
    transport: streamable-http
    endpoint:
      env: WORKDAY_MCP_URL
      default: "http://workday-mcp.zuno-ai-run.svc:8000"
      path: /mcp
    provider_tool: get_staff_profile
    auth_mode: provider-delegated

  # --- git-forge: real MCP server (ADR-0120), streamable-HTTP transport.
  #     One server, two providers (`provider: github|gitlab` is a tool
  #     argument, not a separate binding) - endpoint inherited from the
  #     `backends: git-forge` default above, none repeated per entry.
  - capability: git.repository.read
    backend: git-forge
    transport: streamable-http
    provider_tool: read_repository_content
    auth_mode: service-identity
    caller_context: true

  - capability: git.repository.list
    backend: git-forge
    transport: streamable-http
    provider_tool: list_repositories
    auth_mode: service-identity
    caller_context: true

  # ADR-0121: GitLab-only, any visibility (public/internal/private) -
  # this server never grants private GitHub access through any binding.
  # Which agent can reach these (e.g. Arkos, not Tekos) is governed by
  # policies/tools/tool-policy.yaml + OKF allowed_tools, same as any
  # other capability - the provider restriction itself is enforced in
  # components/mcp-servers/git-forge/server.py, not here.
  - capability: git.repository.private.read
    backend: git-forge
    transport: streamable-http
    provider_tool: read_private_repository_content
    auth_mode: service-identity
    caller_context: true

  - capability: git.repository.private.list
    backend: git-forge
    transport: streamable-http
    provider_tool: list_private_repositories
    auth_mode: service-identity
    caller_context: true

  - capability: git.file.write
    backend: git-forge
    transport: streamable-http
    provider_tool: write_file
    auth_mode: service-identity
    caller_context: true

  - capability: git.repository.create
    backend: git-forge
    transport: streamable-http
    provider_tool: create_repository
    auth_mode: service-identity
    caller_context: true

  - capability: git.repository.fork
    backend: git-forge
    transport: streamable-http
    provider_tool: fork_repository
    auth_mode: service-identity
    caller_context: true

  # Always refused by the server itself (never deletes) - still a real,
  # policy-gated capability so a caller gets a clear tool-level answer
  # (ADR-0120) rather than "unknown tool".
  - capability: git.repository.delete
    backend: git-forge
    transport: streamable-http
    provider_tool: delete_repository
    auth_mode: service-identity
    caller_context: true

  # --- aap: Ansible Automation Platform audits (ADR-0355/WP-074).
  #     service-identity, but NOT the usual shared technical credential:
  #     the backing token belongs to the least-privilege `zuno-mcp` AAP
  #     user (system-wide read + execute on ONE Job Template), minted by
  #     ansible/roles/aap_config. See policies/tools/tool-policy.yaml for
  #     why these two entries carry the same allowed_groups.
  - capability: aap.platform.audit
    backend: aap
    transport: streamable-http
    provider_tool: platform_audit
    auth_mode: service-identity
    caller_context: true

  # The first capability in this file that RUNS automation rather than
  # reading state. Its blast radius is fixed by construction, not by
  # configuration: components/mcp-servers/aap/server.py's cluster_audit
  # takes no arguments at all, so no caller can retarget it at another Job
  # Template (ADR-0355 Security considerations).
  - capability: aap.cluster.audit
    backend: aap
    transport: streamable-http
    provider_tool: cluster_audit
    auth_mode: service-identity
    caller_context: true

  # ADR-0415: not a demo-mode stub like the other in-process handlers
  # above - calls the real, already-deployed components/ai-gateway
  # in-cluster (app/handlers/image_gen.py). service-identity because
  # OVHcloud is reached via ai-gateway's own shared OVHCLOUD_API_KEY
  # credential, not a per-user delegated token - the caller's bearer
  # token is still forwarded to ai-gateway for identity/audit, same as
  # every other service-identity backend here.
  - capability: image.generation.create
    aliases: [generate_image]
    backend: image-gen
    transport: in-process
    handler: image_gen
    provider_tool: generate_image
    auth_mode: service-identity
    input_schema: {"type": "object", "properties": {"prompt": {"type": "string", "description": "Description of the image to generate."}, "negative_prompt": {"type": "string", "description": "What the image must not contain."}}, "required": ["prompt"]}

  # ADR-0516: calls the real, in-cluster diagram-render service
  # (app/handlers/diagram_gen.py) - unlike image_gen above, never an
  # external SaaS call, so auth_mode is service-identity in name only
  # (there is no credential of any kind here - see the handler's own
  # docstring for why no identity needs forwarding to a stateless
  # renderer with no per-caller decision to make).
  - capability: diagram.generation.create
    aliases: [generate_diagram]
    backend: diagram-gen
    transport: in-process
    handler: diagram_gen
    provider_tool: generate_diagram
    auth_mode: service-identity
    input_schema: {"type": "object", "properties": {"mermaid_source": {"type": "string", "description": "Mermaid source of the diagram to render."}, "alt": {"type": "string", "description": "Alternative text of the diagram."}}, "required": ["mermaid_source"]}

  # --- k8s: ADR-0600 clause 1. Four capabilities, all read; the server's own tool list is cut to these
  #     (enabled_tools in gitops/charts/mcp-k8s) and Secret/ConfigMap are denied by kind.
  - capability: k8s.resource.read
    backend: k8s
    transport: streamable-http
    provider_tool: resources_get
    auth_mode: service-identity
    gateway_token: false

  - capability: k8s.resource.list
    backend: k8s
    transport: streamable-http
    provider_tool: resources_list
    auth_mode: service-identity
    gateway_token: false

  - capability: k8s.events.read
    backend: k8s
    transport: streamable-http
    provider_tool: events_list
    auth_mode: service-identity
    gateway_token: false

  - capability: k8s.logs.read
    backend: k8s
    transport: streamable-http
    provider_tool: pods_log
    auth_mode: service-identity
    gateway_token: false

  - capability: metrics.query
    backend: k8s
    transport: streamable-http
    provider_tool: execute_instant_query
    auth_mode: service-identity
    gateway_token: false
