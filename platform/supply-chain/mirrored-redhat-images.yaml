# ADR-0612 addendum 2026-11-14 / WP-261 family (e): the closed list of large Red Hat product images that the internal Quay
# serves, so that a replaced node does not pull them from registry.redhat.io (12-50 MB/s measured on demo333 on 2026-11-13,
# NeMo Guardrails about 9 min; the internal Quay served 51-103 MB/s the same night). Lots 1 and 2 of the owner's choice of
# 2026-11-14. Nothing is mirrored that this file does not name; OpenShift release images and the other product images stay
# on the cluster pull secret.
#
# Fields: source (registry.redhat.io/<repository>), digest (the one the operator runs, read from the pods), pin (always
# digest: an ImageDigestMirrorSet redirects digest pulls only), signature (Red Hat signs on its own lookaside server, not in
# the registry, so there is nothing to copy beside the image), size (on-disk size on a node, informative), reason.
# Several digests of one repository may be listed (an operator upgrade adds one); remove the old one only after the
# upgrade. `mirror_redhat_images.py --drift` lists the running digests that are missing here.
#
# Mirror path: <registry host>/zuno/redhat/<repository>. The repositories are PRIVATE: never make them public.
