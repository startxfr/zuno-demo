# ADR-0115 / WP-04 stage 3: release manifest for pin_release.py, built from
# the real, successful build-publish-sign run - source of truth for every
# tag/digest below:
# https://github.com/startxfr/zuno-demo/actions/runs/32273454405
# (tag v0.1.0, commit c83cfcd, all 11 build-publish-sign + 8
# sign-okf-bundles jobs green). Not a template, not reusable for a future
# release - each real release gets its own dated manifest.
release_tag: v0.1.0
pins:
  # Six OKF agent portals (tekos + 5 branded variants) share one `tag`
  # field controlling BOTH frontendRepository (agent-frontend) and
  # bffRepository (agent-bff) - both published clean at v0.1.0 in this
  # release, so a single tag is honest here. No digest: one field can't
  # represent two images, and pin_release.py's digest is audit-only anyway.
  - chart_values: gitops/charts/advantage/values.yaml
    path: image.tag
    tag: v0.1.0
  - chart_values: gitops/charts/arkos/values.yaml
    path: image.tag
    tag: v0.1.0
  - chart_values: gitops/charts/comage/values.yaml
    path: image.tag
    tag: v0.1.0
