skipped:
  # rag-ingestion is built exclusively by the in-cluster OpenShift
  # BuildConfig (ansible/roles/rag_ingestion_build) - build-publish.yml's
  # matrix never includes it (see its own comment), so this release has no
  # real Quay artifact to pin these to. Still non-immutable, still
  # reported by check_no_latest_tags.py, honestly - not silenced.
  - chart_values: gitops/charts/rag-ingestion/values.yaml
    path: images.ingestion.tag
    reason: >-
      built exclusively by the in-cluster OpenShift BuildConfig
      (ansible/roles/rag_ingestion_build), never by build-publish.yml - no
      real Quay artifact from this release to pin to
  - chart_values: gitops/charts/rag-ingestion/values.yaml
