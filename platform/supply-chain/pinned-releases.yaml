# ADR-0115/ADR-0549 release ledger - append-only. Two writers:
#  - pin_release.py (ADR-0115/WP-04, mothballed for day-to-day use -
#    see its own dated note): rewrote values.yaml tag fields for the
#    one real Quay-published release. Entries may have digest: null
#    and no 'signed' key.
#  - tag_local_release.py --record-release (ADR-0549/WP-134, current
#    mechanism): builds + RHTAS-signs a component in-cluster at
#    <component>:<release_tag>, never touches values.yaml/
#    targetRevision. Entries always set a real digest and
#    signed/signed_at.
# This is evidence for ADR-0111/ADR-0549's completion criterion (a
# real release proves build -> sign -> immutable-reference
# traceability, entirely in-cluster) - never a mechanism consumed by
# any deployment, never hand-edit.

