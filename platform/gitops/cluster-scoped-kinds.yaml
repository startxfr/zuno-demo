# Cluster-scoped API kinds (group/Kind, core group empty), read from the
# live API discovery of demo333 (OpenShift 4.22) on 2026-11-06:
#
#   oc api-resources --namespaced=false --no-headers \
#     | awk '{v=$(NF-2); g=""; if (index(v,"/")) {split(v,a,"/"); g=a[1]}; print "  - " g "/" $NF}' | sort -u
#
# ADR-0602 clause 5 / WP-224: platform/gitops/check_app_projects.py needs
# to know which rendered kinds are cluster-scoped to hold them against the
# AppProject clusterResourceWhitelist. A kind absent from this list is
# treated as namespaced, unless a CustomResourceDefinition rendered by the
# same repository declares it Cluster-scoped. Regenerate after an operator
# adds cluster-scoped CRDs that a chart starts to render.
