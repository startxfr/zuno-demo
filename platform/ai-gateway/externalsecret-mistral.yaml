# Resolves the Mistral provider API key seeded (as an empty placeholder,
# never overwritten once populated) by ansible/roles/llm/tasks/configure.yml
# at secret/zuno/providers/mistral. An operator must run
# `vault kv put secret/zuno/providers/mistral api_key=...` before this
# provider actually works — until then components/agent-runtime's
# ModelRouter simply fails over to the next eligible provider (ADR-0020).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-provider-mistral
  labels:
    zuno.io/managed-by: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: llm-provider-mistral
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: zuno/providers/mistral
        property: api_key
