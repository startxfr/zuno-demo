# Resolves the Anthropic provider API key seeded (as an empty placeholder,
# never overwritten once populated) by ansible/roles/vault/tasks/install.yml
# at zuno/providers/anthropic. An operator must run
# `vault kv put zuno/providers/anthropic api_key=...` before this
# provider actually works - until then ai-gateway's
# routing simply fails over to the next eligible provider (ADR-0020).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-provider-anthropic
  labels:
    zuno.io/managed-by: argocd
spec:
  refreshInterval: 1h
  # ADR-0602/WP-223: this namespace's own SecretStore, which reads only the keys platform/vault/secret-access.yaml grants it.
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: llm-provider-anthropic
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: providers/anthropic
        property: api_key
