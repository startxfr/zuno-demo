# Resolves the OpenAI provider API key seeded (as an empty placeholder,
# never overwritten once populated) by ansible/roles/vault/tasks/install.yml
# at zuno/providers/openai. An operator must run
# `vault kv put zuno/providers/openai api_key=...` before this
# provider actually works - until then components/agent-runtime's
# ModelRouter simply fails over to the next eligible provider (ADR-0020).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-provider-openai
  labels:
    zuno.io/managed-by: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: llm-provider-openai
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: providers/openai
        property: api_key
