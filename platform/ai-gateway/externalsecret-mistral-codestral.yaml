# Resolves the Mistral Codestral provider API key seeded (as an empty
# placeholder, never overwritten once populated) by
# ansible/roles/vault/tasks/install.yml at zuno/providers/mistral-codestral.
# A dedicated key/account, separate from zuno/providers/mistral (used by
# the mistral-large-latest provider) so that Codestral running low on
# credits is a distinguishable event from the general-purpose Mistral
# model doing so (ADR-0417). An operator must run
# `vault kv put zuno/providers/mistral-codestral api_key=...` before this
# provider actually works - until then components/agent-runtime's
# ModelRouter simply fails over to the next eligible provider (ADR-0020).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-provider-mistral-codestral
  labels:
    zuno.io/managed-by: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: llm-provider-mistral-codestral
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: providers/mistral-codestral
        property: api_key
