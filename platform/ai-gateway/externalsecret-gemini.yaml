# Resolves the Gemini provider API key seeded (as an empty placeholder,
# never overwritten once populated) by ansible/roles/llm/tasks/configure.yml
# at zuno/providers/gemini. An operator must run
# `vault kv put zuno/providers/gemini api_key=...` before this
# provider actually works - until then components/agent-runtime's
# ModelRouter simply fails over to the next eligible provider (ADR-0020).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-provider-gemini
  labels:
    zuno.io/managed-by: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: llm-provider-gemini
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: providers/gemini
        property: api_key
