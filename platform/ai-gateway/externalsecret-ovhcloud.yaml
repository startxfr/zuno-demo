# Resolves the OVHcloud AI Endpoints API access token seeded (as an empty
# placeholder, never overwritten once populated) by
# ansible/roles/vault/tasks/install.yml at zuno/providers/ovhcloud. An
# operator must run `vault kv put zuno/providers/ovhcloud api_key=...`
# (or populate ansible/confidential.yml's zuno_llm_provider_ovhcloud_api_key
# and re-run `make d0 install vault`) before this provider actually works -
# see docs/adr/0415-*.md for how to create the OVHcloud account/key.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-provider-ovhcloud
  labels:
    zuno.io/managed-by: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: llm-provider-ovhcloud
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: providers/ovhcloud
        property: api_key
