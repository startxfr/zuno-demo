# Provider routing configuration (ADR-0020, ADR-0021).
#
# Consumed by components/ai-gateway's RoutingTable
# (app/routing.py) to decide, per request classification, which provider
# to call and in what fallback order (ADR-0009 moved this out of Agent
# Runtime's ModelRouter, app/clients/model_router.py, which today only
# forwards classification/agent/task as headers to this gateway). Deployed as the
# `zuno-provider-routing` ConfigMap by ansible/roles/llm via
# gitops/apps/llm/application-d1.yaml (see kustomization.yaml in this
# directory - the ConfigMap is generated from this exact file, so this is
# the single source of truth; do not hand-copy its contents elsewhere).
#
# `eligible_for` lists which data classifications (from
# policies/data-classification/classification.yaml, authored by Track B)
# may route to that provider, per ADR-0021:
#   - C1 (e.g. technical-docs): any provider, local or SaaS.
#   - C2 (e.g. sales-data): local model plus a restricted SaaS allow-list
#     only (OpenAI and Anthropic below - both offer contractual
#     no-training-on-API-data terms suitable for a restricted allow-list;
#     Gemini/Mistral are held back from C2 in this default until an
#     equivalent data-handling review is done).
#   - C3 (e.g. financial-data): local model only. Never leaves the
#     cluster.
#
# Fallback order within a classification is the order providers appear in
# this list (top to bottom); the local models are always tried first when
# eligible, matching MEMORY.md section 6's "local model plus approved
# external provider fallback order: OpenAI, Gemini, Anthropic, Mistral".
# Since ADR-0412 there are TWO local models: `local` (qwen, the default)
# and gpt-oss-20b, the reasoning-preferred second local and C3's
# first-ever fallback. ADR-0521 (WP-076): BOTH local models now carry TWO
# candidate entries each - a `-maas` sibling (via_maas: true, tried
# first) and the direct entry (unchanged) - so "MaaS unreachable -> same
# model still answers directly" is a config outcome of this file's own
# fallback order, no new code (ADR-0521 item 6). qwen's `local-maas`
# entry was blocked for a day by a live empty-body bug on the MaaS path;
# root-caused 2026-08-26 to a KServe HTTPRoute rule-name collision plus
# an Envoy ext_proc response-path race in the endpoint-picker (EPP), both
# fixed in gitops/charts/models/templates/_llmisvc-route.tpl - full
# analysis in docs/roadmap/evidence/adr-0521-maas-local-traffic.md.
# A per-(agent,task) `preferences:` entry in policies/model-routing/
# model-routing-policy.yaml may REORDER the candidates that survive
# eligibility/local-only filtering (e.g. putting the gpt-oss pair first
# for reflexional tasks) - reorder only, it can never add a provider this
# list's `eligible_for` filtered out. Every `prefer`/`preferred` entry
# that names `local-gpt-oss` lists `local-gpt-oss-maas` immediately before
# it, and every entry naming `local` lists `local-maas` immediately before
# it - required, not cosmetic: _apply_preference's "unlisted survivors
# follow in provider-routing.yaml order" rule would otherwise strand
# the -maas sibling wherever the reordered list's unlisted tail lands,
# breaking "MaaS-preferred, same-model-direct-fallback" for any task with
# an explicit preference.
#
# `serves_adapters` (optional, default false; ADR-0303): marks the ONE
# local provider whose vLLM runtime registers gitops/charts/models'
# loraAdapters. The gateway drops an adapter name for any candidate
# without this flag - a LoRA module name must never be sent to a runtime
# that doesn't serve it (gpt-oss's runtime deliberately has no
# --enable-lora).
#
# `api_key_env` names the environment variable this provider's API key is
# read from at runtime (populated by an ExternalSecret -- see
# ansible/roles/vault/tasks/install.yml -- never a literal value here).
#
# `via_maas` (optional, default false; ADR-0114/ADR-0521): opts this
# provider into the MaaS adapter (components/ai-gateway/app/
# maas_adapter.py) instead of this gateway's direct client, when the
# gateway's own MAAS_ADAPTER_ENABLED switch is also on (chart value
# `maasAdapter.enabled`, true since WP-076 step 4). Classification
# eligibility above is evaluated identically either way; `via_maas`
# changes transport, never eligibility.
# `endpoint` on a via_maas entry means the MaaS gateway's own path-
# prefixed URL, not the direct Service - live-verified (2026-08-26) that
# this is REQUIRED per model ("<gateway>/<namespace>/<model>/v1"), not a
# single shared MaaS endpoint; see maas_adapter.py's chat_model_via_maas
# comment for why.
# `maas_model_ref` (optional): overrides `model` for the MaaS-published
# model reference name (the identity gitops/charts/models's
# maas.models[].publishedName publishes, e.g.
# "zuno-ai-run/gpt-oss-20b-maas"), when it differs from the serving
# runtime's own internal model name - it always does here, since MaaS
# publishes under its own MaaSModelRef name, not the LLMInferenceService's.
#
# `cache_enabled` (optional, default false; ADR-0104): opts this provider
# into the semantic cache (components/ai-gateway/app/semantic_cache.py)
# when the gateway's own SEMANTIC_CACHE_ENABLED switch is also on (chart
# value `semanticCache.enabled`, default false - this file alone never
# turns caching on). A cache entry is only ever served back to a request
# with an identical model/user/classification/local-only/task context -
# see the ADR for the full key. No entry below sets it yet.
#
# `role` (required): the provider's ARCHITECTURAL role in the model fleet.
# Documentation and policy-as-code metadata, never a routing input - the
# gateway ignores this key entirely (app/routing.py reads providers by
# named key; unknown keys are inert). Its purpose is to make the fleet's
# intent auditable, because it was not: ADR-0518 decision 1 made
# `qwen3.6-27b-instruct` the chat/agents model and classed `Qwen3.5-9B` as
# a training base only, then ADR-0531 made `qwen3.5-9b` the fleet-wide
# default five days later without either ADR recording a supersession.
# Both models coexist fine; only the stated role was contradictory.
#
#   default            the fleet-wide default candidate every (agent, task)
#                      leads with unless it has a documented reason not to
#                      (ADR-0531 decision 1). Exactly ONE local model id
#                      may hold this role.
#   quality            the higher-quality local model. Not a routing
#                      default since ADR-0531, but far from inert: it is
#                      the only provider that serves LoRA adapters
#                      (serves_adapters, ADR-0303), the only model
#                      `policies/optimization/optimization-policy.yaml`
#                      may toggle the semantic cache for, Lightspeed's
#                      defaultModel (ADR-0524), the RAGAS judge and Garak
#                      target (ADR-0534), and an LM-Eval MMLU subject.
#   reasoning          the local model preferred for reflexional /
#                      multi-source-synthesis tasks (ADR-0419's doctrine,
#                      preserved unchanged by ADR-0531 decision 3).
#   specialized        a fine-tuned variant serving a named audience
#                      rather than the fleet (ADR-0526's French
#                      urban-register `-wesh` model, Comage's lead on its
#                      three non-reflexional tasks).
#   reasoning-external the off-cluster reasoning model, C1/C2 only
#                      (ADR-0416). Leads reflexional chains where granted,
#                      and is eligibility-filtered out at C3 by ADR-0021.
#   code               the code-specialized SaaS model (ADR-0417).
#   general-external   approved general-purpose SaaS fallbacks (ADR-0020).
#
# `platform/docs/check_docs.py`'s `model_roles` check enforces three
# invariants over this key: every provider carries a role from this list,
# exactly one local model id holds `default` and it matches the lead of
# `policies/model-routing/model-routing-policy.yaml`, and every task any
# agent declares has an explicit entry in that policy - the invariant
# ADR-0531 decision 1 states and which nothing verified until
# `arkos/structure-demo` was found silently riding the file-order default.
#
# The embedding model (`qwen3-embedding-0.6b`, ADR-0518 decision 2) has no
# role here on purpose: it is not a chat provider and never enters this
# fallback chain - it is configured in components/rag-service.

providers:
  # ADR-0521 (WP-076) closeout: qwen's MaaS-preferred sibling, tried first
  # (declared before `local`; file order = fallback order). Same shape and
  # rationale as local-gpt-oss-maas below - path-prefixed MaaS endpoint,
  # maas_model_ref carrying the MaaSModelRef identity the request body's
  # `model` field must use, SA-token auth. Deliberately NO serves_adapters:
  # a LoRA adapter id replaces the body's model name, which MaaS auth keys
  # on (no MaaSModelRef exists for adapter ids), so adapter-resolved
  # requests must never ride MaaS - app/main.py's candidate loop skips
  # via_maas candidates whenever an adapter declaration resolved, landing
  # them on the direct `local` entry below instead.
  - name: local-maas
    kind: local
    role: quality
    model: qwen3.6-27b-instruct
    via_maas: true
    maas_model_ref: zuno-ai-run/qwen36-27b-instruct-maas
    endpoint: https://maas-default-gateway-istio.openshift-ingress.svc/zuno-ai-run/qwen36-27b-instruct/v1
    temperature: 0.2
    timeout_seconds: 60
    eligible_for: [C1, C2, C3]

  # ADR-0521: qwen is an LLMInferenceService now (no more <name>-predictor
  # Service), same shape local-gpt-oss already has below - see that
  # entry's own comment for the full https/CA-bundle rationale, which
  # applies identically here (LOCAL_GPT_OSS_CA_BUNDLE already covers any
  # local candidate, not just gpt-oss, despite the env var's name).
  - name: local
    kind: local
    role: quality
    model: qwen3.6-27b-instruct
    endpoint: https://qwen36-27b-instruct-kserve-workload-svc.zuno-ai-run.svc:8000/v1
    temperature: 0.2
    timeout_seconds: 60
    eligible_for: [C1, C2, C3]
    # ADR-0303: loraAdapters register on this vLLM runtime only.
    serves_adapters: true

  # ADR-0412: second local model, reasoning-preferred via the
  # model-routing policy's `preferences:` (it leads the chain only for
  # tasks declared reflexional there; everything else keeps qwen first).
  # ADR-0414: gpt-oss-20b is now an LLMInferenceService (also the
  # MaaS-published backend), not a classic InferenceService - it has no
  # <name>-predictor Service anymore. Points directly at its
  # -kserve-workload-svc Service instead (port 8000), bypassing the MaaS
  # Gateway/router entirely for this in-cluster call.
  #
  # https, not http (fixed 2026-08-21 - was http and silently broken since
  # ADR-0414 landed): unlike qwen's classic ServingRuntime, an
  # LLMInferenceService's raw-deployment pod always terminates real TLS on
  # this port (KServe injects /var/run/kserve/tls/tls.{key,crt}, see
  # gitops/charts/models/templates/llminferenceservice-gptoss.yaml) - a
  # plain-http request gets an immediate connection reset, logged upstream
  # as ai-gateway's "Connection error" on every local-gpt-oss call. The
  # cert's issuer is the cluster's own openshift-service-serving-signer CA
  # (verified live), which app/providers.py's local-candidate client trusts
  # via LOCAL_GPT_OSS_CA_BUNDLE (gitops/charts/ai-gateway's deployment.yaml).
  #
  # ADR-0521 (WP-076) step 4: MaaS-preferred sibling, tried first (declared
  # before local-gpt-oss below; RoutingTable.candidates_for() preserves
  # this file's order for any (agent, task) with no explicit preference).
  # Live-verified end-to-end (2026-08-26) via the path-prefixed route -
  # endpoint carries the namespace/model path segment, maas_model_ref
  # carries the MaaSModelRef identity the request body's `model` field
  # must use for ipp-pre's ext_proc filter to derive the right
  # X-Gateway-Model-Name for OPA authorization. Auth is
  # system:serviceaccount:zuno-ai-run:ai-gateway via its own SA token
  # (WP-076 step 3, MAAS_SA_TOKEN_PATH) - see gitops/charts/models's
  # maas.models[].subscriptions[] "-ai-gateway" entries for the
  # MaaSSubscription/MaaSAuthPolicy grant this depends on.
  - name: local-gpt-oss-maas
    kind: local
    role: reasoning
    model: gpt-oss-20b
    via_maas: true
    maas_model_ref: zuno-ai-run/gpt-oss-20b-maas
    endpoint: https://maas-default-gateway-istio.openshift-ingress.svc/zuno-ai-run/gpt-oss-20b/v1
    temperature: 0.2
    timeout_seconds: 60
    eligible_for: [C1, C2, C3]

  - name: local-gpt-oss
    kind: local
    role: reasoning
    model: gpt-oss-20b
    endpoint: https://gpt-oss-20b-kserve-workload-svc.zuno-ai-run.svc:8000/v1
    temperature: 0.2
    timeout_seconds: 60
    eligible_for: [C1, C2, C3]

  # ADR-0526 (WP-087): the French urban-register variant and its own
  # unmodified base, served side by side (decision 2) so the variant is
  # comparable against the model it was fine-tuned from rather than
  # against a different model. Both are standalone merged-weight
  # checkpoints, each its own LLMInferenceService (decision 4 - NOT vLLM
  # --lora-modules on a shared runtime), so neither sets serves_adapters:
  # ADR-0303's adapter mechanism is bypassed here, not extended, and an
  # adapter id must never be sent to a runtime that registers none.
  #
  # Declared AFTER local-gpt-oss and BEFORE openai deliberately. File
  # order is the fallback order for every (agent, task) with NO
  # `preferences:` entry, so declaring these first would silently make a
  # French urban-register model the platform-wide default for every agent
  # that never asked for it - naveo, soursage, and arkos's unlisted tasks
  # included. Comage and Tekos reach the variant through explicit
  # per-(agent, task) preferences in policies/model-routing/
  # model-routing-policy.yaml instead (ADR-0526 decision 7).
  #
  # eligible_for is [C1, C2, C3], same as every other local provider: the
  # merged checkpoint inherits the training corpus's C1 classification
  # (decision 3), and Comage's compare-historical-deals computes at C2
  # (ADR-0034, whenever knowledge.sxa-legacy contributes - reclassified
  # C3 -> C2 by ADR-0206's 2026-08-30 Status update). Restricting these to
  # C1 would still strand that task's entire preference chain, and the
  # task's own `preferred:` list in model-routing-policy.yaml deliberately
  # stays local/OVH-only regardless - C2 makes restricted SaaS technically
  # eligible but it is not exercised here.
  - name: local-wesh-maas
    kind: local
    role: specialized
    model: qwen3.5-9b-wesh
    via_maas: true
    maas_model_ref: zuno-ai-run/qwen35-9b-wesh-maas
    endpoint: https://maas-default-gateway-istio.openshift-ingress.svc/zuno-ai-run/qwen35-9b-wesh/v1
    temperature: 0.2
    timeout_seconds: 60
    eligible_for: [C1, C2, C3]

  - name: local-wesh
    kind: local
    role: specialized
    model: qwen3.5-9b-wesh
    endpoint: https://qwen35-9b-wesh-kserve-workload-svc.zuno-ai-run.svc:8000/v1
    temperature: 0.2
    timeout_seconds: 60
    eligible_for: [C1, C2, C3]

  # ADR-0526 decision 2: the UNMODIFIED Qwen3.5-9B base (ADR-0518
  # decision 3's training base), served on the other MIG node - originally
  # so the variant has a same-base comparison point, and a natural direct
  # fallback wherever the variant is named. ADR-0531 promotes it to the
  # fleet-wide default candidate (policies/model-routing/
  # model-routing-policy.yaml's `preferences:` now names it explicitly for
  # every agent), so it is no longer merely an unlisted comparison point.
  # Its 24GB slice is the tight case - see gitops/charts/models for the
  # reduced --max-model-len that makes 19.3GB of bf16 weights fit.
  - name: local-qwen35-maas
    kind: local
    role: default
    model: qwen3.5-9b
    via_maas: true
    maas_model_ref: zuno-ai-run/qwen35-9b-maas
    endpoint: https://maas-default-gateway-istio.openshift-ingress.svc/zuno-ai-run/qwen35-9b/v1
    temperature: 0.2
    timeout_seconds: 60
    eligible_for: [C1, C2, C3]

  - name: local-qwen35
    kind: local
    role: default
    model: qwen3.5-9b
    endpoint: https://qwen35-9b-kserve-workload-svc.zuno-ai-run.svc:8000/v1
    temperature: 0.2
    timeout_seconds: 60
    eligible_for: [C1, C2, C3]

  - name: openai
    kind: saas
    role: general-external
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    temperature: 0.2
    eligible_for: [C1, C2]

  - name: gemini
    kind: saas
    role: general-external
    model: gemini-1.5-pro
    api_key_env: GEMINI_API_KEY
    temperature: 0.2
    eligible_for: [C1]

  - name: anthropic
    kind: saas
    role: general-external
    model: claude-3-5-sonnet-latest
    api_key_env: ANTHROPIC_API_KEY
    temperature: 0.2
    eligible_for: [C1, C2]

  - name: mistral
    kind: saas
    role: general-external
    model: mistral-large-latest
    api_key_env: MISTRAL_API_KEY
    temperature: 0.2
    eligible_for: [C1]

  # ADR-0417: Codestral, Mistral's code-specialized model, via the native
  # Mistral API - same transport as the `mistral` entry above (no
  # endpoint: override, langchain_mistralai talks to api.mistral.ai
  # directly), but a DEDICATED api_key/account (MISTRAL_CODESTRAL_API_KEY,
  # zuno/providers/mistral-codestral) so Codestral running low on credits
  # is a distinguishable event from mistral-large-latest doing so.
  # eligible_for is [C1, C2] only, never C3 - same unconditional SaaS rule
  # as every other entry in this file (ADR-0021/0035).
  - name: mistral-codestral
    kind: saas
    role: code
    model: codestral-latest
    api_key_env: MISTRAL_CODESTRAL_API_KEY
    temperature: 0.2
    eligible_for: [C1, C2]

  # ADR-0416: gpt-oss-120b via the same OVHcloud AI Endpoints account/
  # credential ADR-0415 already set up for stable-diffusion-xl (same
  # OVHCLOUD_API_KEY secret, same OpenAI-compatible base URL) - not
  # servable on this cluster's GPUs (gitops/charts/models/values.yaml,
  # ADR-0414), so this is the only way to offer it. eligible_for is [C1,
  # C2] only, never C3 - policies/data-classification/classification.yaml
  # forbids external SaaS at C3 unconditionally, same as every other saas
  # entry above.
  - name: ovhcloud-gpt-oss-120b
    kind: saas
    role: reasoning-external
    model: gpt-oss-120b
    endpoint: https://oai.endpoints.kepler.ai.cloud.ovh.net/v1
    api_key_env: OVHCLOUD_API_KEY
    temperature: 0.2
    eligible_for: [C1, C2]
