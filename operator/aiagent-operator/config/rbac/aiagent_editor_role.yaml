# This rule is not used by the project aiagent-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the zuno.zuno.ai.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: aiagent-operator
    app.kubernetes.io/managed-by: kustomize
  name: aiagent-editor-role
rules:
- apiGroups:
  - zuno.zuno.ai
  resources:
  - aiagents
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - zuno.zuno.ai
  resources:
  - aiagents/status
  verbs:
  - get
